<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="faceG" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ice Crystal Squircle Background -->
  <rect width="64" height="64" rx="19" fill="url(#bg)"/>

  <!-- Left gills (Crystal Aqua) -->
  <g fill="#00f2fe" filter="url(#shadow)">
    <path d="M12 24 C5 17 14 14 18 19"/>
    <path d="M10 32 C3 28 12 25 17 28"/>
    <path d="M12 40 C6 41 12 34 18 36"/>
  </g>

  <!-- Right gills (Crystal Aqua) -->
  <g fill="#00f2fe" filter="url(#shadow)">
    <path d="M52 24 C59 17 50 14 46 19"/>
    <path d="M54 32 C61 28 52 25 47 28"/>
    <path d="M52 40 C58 41 52 34 46 36"/>
  </g>

  <!-- Axolotl Head (Ice Glass) -->
  <ellipse cx="32" cy="35" rx="19" ry="15" fill="url(#faceG)"/>

  <!-- Cheeks Blush (Soft Cyan/Sky Glow) -->
  <ellipse cx="20" cy="37" rx="3.5" ry="2" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="44" cy="37" rx="3.5" ry="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Eyes with sparkle -->
  <circle cx="24" cy="33" r="3.2" fill="#0f172a"/>
  <circle cx="22.8" cy="31.8" r="1.1" fill="#ffffff"/>
  <circle cx="40" cy="33" r="3.2" fill="#0f172a"/>
  <circle cx="38.8" cy="31.8" r="1.1" fill="#ffffff"/>

  <!-- Happy Smile -->
  <path d="M28 39 Q32 43 36 39" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
