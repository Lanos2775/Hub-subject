span> eV) | Công thoát kim loại Natri $\\Phi = 2.3$ eV:\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-pe-hv\" min=\"1.2\" max=\"5.0\" step=\"0.1\" value=\"3.2\" oninput=\"renderPhotoelectric()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Cường độ sáng (Số hạt photon bắn tới: \u003cspan id=\"val-pe-int\">4\u003c/span> tia):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-pe-int\" min=\"1\" max=\"6\" step=\"1\" value=\"4\" oninput=\"renderPhotoelectric()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"pe-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"pe-svg\" viewBox=\"0 0 680 260\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>2. Lưỡng Tính Sóng - Hạt (Wave-Particle Duality)\u003c/h2>\n    \u003cp>Suốt hàng trăm năm, các nhà vật lý tranh cãi xem ánh sáng là Sóng (Huygens) hay là Hạt (Newton). Cơ học lượng tử kết luận: \u003cb>Mọi thực thể vi mô đều vừa là Sóng, vừa là Hạt!\u003c/b>\u003c/p>\n\n    \u003ch3>2.1. Sóng hành xử như Hạt: Hiệu ứng tán xạ Compton (1924)\u003c/h3>\n    \u003cp>Khi Arthur Compton bắn chùm tia X (bước sóng $\\lambda_i$) vào tấm bia Graphite chứa các electron đang đứng yên, ông thấy tia X bị bật lệch đi một góc $\\theta$ với bước sóng dài hơn ($\\lambda_f > \\lambda_i$), đồng thời electron bị hất văng đi giống hệt như \u003cb>hai viên bi-a va chạm đàn hồi\u003c/b>!\u003c/p>\n    \u003cp>Dù photon không có khối lượng nghỉ, nó vẫn mang \u003cb>Động lượng (Momentum) $p$\u003c/b> như một viên đạn thực thụ:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$p = \\frac{E}{c} = \\frac{h\\nu}{c} = \\frac{h}{\\lambda} \\implies \\lambda_f - \\lambda_i = \\frac{h}{m_e c}(1 - \\cos\\theta)$$\n    \u003c/div>\n\n    \u003ch3>2.2. Hạt hành xử như Sóng: Giả thuyết Sóng vật chất de Broglie & Thí nghiệm Davisson-Germer\u003c/h3>\n    \u003cp>Năm 1924, Louis de Broglie đặt câu hỏi ngược lại: \u003ci>\"Nếu sóng ánh sáng có thể va chạm như hạt bi-a, vậy các hạt vật chất (như viên đạn, hạt electron) khi bay có mang tính chất sóng không?\"\u003c/i> Câu trả lời là \u003cb>CÓ!\u003c/b> Mọi vật chuyển động với động lượng $p = mv$ đều đi kèm một bước sóng gọi là \u003cb>Bước sóng de Broglie ($\\lambda_{\\text{DB}}$)\u003c/b>:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\lambda = \\frac{h}{p} = \\frac{h}{mv}$$\n    \u003c/div>\n    \u003cp>Năm 1927, \u003cb>Davisson và Germer\u003c/b> đã bắn chùm tia electron (được gia tốc ở điện áp $54\\text{ V}$) vào bề mặt tinh thể Niken ($\\text{Ni}$). Thay vì nảy ra lộn xộn như các viên bi, các hạt electron lại giao thoa với nhau tạo thành một đỉnh cực đại sắc nét ở góc tán xạ $\\theta = 50^\\circ$ (hoặc $45^\\circ$ trên giản đồ cực), tuân theo đúng định luật nhiễu xạ sóng Bragg!\u003c/p>\n\n    \u003ch3>2.3. Mô hình tương tác: Tán xạ Compton & Sóng de Broglie của Electron\u003c/h3>\n    \u003cp>Em hãy chuyển qua lại giữa hai tab dưới đây để trải nghiệm: (1) Va chạm bi-a giữa Photon và Electron trong hiệu ứng Compton, và (2) Gia tốc Electron bằng hiệu điện thế $V$ để xem bước sóng de Broglie của nó co ngắn lại như thế nào (áp dụng trực tiếp cho \u003cb>Câu 1 Bài tập\u003c/b>):\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"duality-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"selectDualityTab('debroglie', this)\">1. Gia tốc Electron & Bước sóng de Broglie (Minh họa Câu 1)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectDualityTab('compton', this)\">2. Tán xạ Compton (Va chạm Photon - Electron)\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\" id=\"duality-ctrl-db\">\n        \u003cdiv>\n          \u003clabel>Điện áp gia tốc Electron $V$ (\u003cspan id=\"val-db-v\">150\u003c/span> V):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-db-v\" min=\"10\" max=\"1000\" step=\"10\" value=\"150\" oninput=\"renderDuality()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\" id=\"duality-ctrl-comp\" style=\"display:none\">\n        \u003cdiv>\n          \u003clabel>Góc tán xạ tia X $\\theta$ (\u003cspan id=\"val-comp-ang\">60\u003c/span> độ):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-comp-ang\" min=\"15\" max=\"150\" step=\"5\" value=\"60\" oninput=\"renderDuality()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"duality-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"duality-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>3. Nguyên Lý Bất Định Heisenberg (1927)\u003c/h2>\n    \u003cp>Trong vật lý cổ điển, khi nhìn một chiếc ô tô chạy trên đường, em biết chính xác tuyệt đối cùng lúc cả \u003cb>vị trí $x$\u003c/b> lẫn \u003cb>vận tốc/động lượng $p$\u003c/b> của chiếc xe. Nhưng ở thế giới lượng tử, nhà vật lý Werner Heisenberg chứng minh rằng điều đó là bất khả thi!\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Tìm quả bóng bàn trong phòng tối đen bằng đèn pin\u003c/b>\u003cbr>\n      Để nhìn thấy vị trí của một hạt electron nhỏ xíu, em bắt buộc phải chiếu ánh sáng (tức bắn ít nhất 1 hạt photon) chạm vào electron rồi bật lại vào mắt em.\u003cbr>\n      • Nếu em muốn nhìn vị trí thật nét ($\\Delta x$ cực nhỏ), em phải dùng ánh sáng có bước sóng $\\lambda$ thật ngắn. Mà $\\lambda$ ngắn nghĩa là động lượng photon $p = \\frac{h}{\\lambda}$ cực mạnh — cú tông của photon sẽ hất văng electron đi khiến vận tốc/động lượng của electron bị xáo trộn dữ dội ($\\Delta p$ cực lớn)!\u003cbr>\n      • Ngược lại, nếu dùng photon bước sóng dài (nhẹ nhàng) để ít làm thay đổi động lượng electron ($\\Delta p$ nhỏ), thì hình ảnh thu được lại nhòe nhoẹt không biết electron đang ở đâu ($\\Delta x$ lớn)!\n    \u003c/div>\n\n    \u003cp>Heisenberg gói gọn quy luật tự nhiên này vào 2 bất đẳng thức cặp biến liên hợp:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\text{1. Vị trí - Động lượng: } \\Delta p \\cdot \\Delta x \\ge \\hbar \\qquad \\Big| \\qquad \\text{2. Năng lượng - Thời gian: } \\Delta E \\cdot \\Delta t \\ge \\hbar$$\n      \u003csmall>Trong đó: $\\hbar = \\frac{h}{2\\pi} \\approx 1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$ gọi là \u003cb>Hằng số Planck rút gọn (Reduced Planck constant)\u003c/b>.\u003c/small>\n    \u003c/div>\n\n    \u003ch3>3.1. Mô hình tương tác: Bó sóng (Wave Packet) & Sự đánh đổi $\\Delta x \\leftrightarrow \\Delta p$\u003c/h3>\n    \u003cp>Hãy kéo thanh trượt dưới đây để thu hẹp hoặc mở rộng độ bất định vị trí $\\Delta x$. Em sẽ thấy khi ta \"nhốt\" hạt vào vùng không gian càng hẹp ($\\Delta x$ nhỏ) thì phổ độ bất định động lượng $\\Delta p$ tự động phình to ra để tích số $\\Delta x \\cdot \\Delta p \\ge \\hbar$ luôn được bảo toàn:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Độ bất định vị trí $\\Delta x$ (\u003cspan id=\"val-unc-dx\">1.00\u003c/span> $\\mu$m - Minh họa Câu 2 khi $\\Delta x = 1\\ \\mu$m):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-unc-dx\" min=\"0.25\" max=\"2.50\" step=\"0.05\" value=\"1.00\" oninput=\"renderUncertainty()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"unc-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"unc-svg\" viewBox=\"0 0 680 240\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"box tip\">\n      \u003cb>Hệ quả quan trọng nhất đối với Bán dẫn:\u003c/b>\u003cbr>\n      Vì không thể biết chính xác quỹ đạo từng hạt electron, chúng ta từ bỏ việc vẽ quỹ đạo cố định và chuyển sang dùng \u003cb>Hàm mật độ xác suất (Probability density function)\u003c/b> để biết khả năng tìm thấy electron ở vùng không gian nào là cao nhất.\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>4. Phương Trình Sóng Schrödinger & Ý Nghĩa Hàm Sóng\u003c/h2>\n    \u003cp>Năm 1926, Erwin Schrödinger đã xây dựng một phương trình vi phân đóng vai trò giống như định luật $F = ma$ của Newton, nhưng dùng để tìm \u003cb>Hàm sóng $\\Psi(x, t)$\u003c/b> của hạt vi mô chuyển động trong trường thế năng $V(x)$:\u003c/p>\n\n    \u003cdiv class=\"f\">\n      $$-\\frac{\\hbar^2}{2m}\\frac{\\partial^2\\Psi(x,t)}{\\partial x^2} + V(x)\\Psi(x,t) = j\\hbar\\frac{\\partial\\Psi(x,t)}{\\partial t}$$\n      \u003csmall>Lưu ý ký hiệu: Trong kỹ thuật điện - bán dẫn, người ta dùng chữ $j = \\sqrt{-1}$ (thay vì chữ $i$) để biểu diễn đơn vị số ảo nhằm tránh nhầm với cường độ dòng điện $i$.\u003c/small>\n    \u003c/div>\n\n    \u003ch3>4.1. Kỹ thuật Tách biến (Separation of Variables): Tách Không gian và Thời gian\u003c/h3>\n    \u003cp>Khi thế năng $V(x)$ chỉ phụ thuộc vào vị trí $x$ (không đổi theo thời gian $t$), ta có thể tách hàm sóng toàn phần $\\Psi(x,t)$ thành tích của hai hàm độc lập:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\Psi(x,t) = \\psi(x) \\cdot \\phi(t) = \\psi(x) \\cdot e^{-j(E/\\hbar)t} = \\psi(x) \\cdot e^{-j\\omega t}$$\n    \u003c/div>\n    \u003cul>\n      \u003cli>\u003cb>Phần phụ thuộc thời gian $\\phi(t) = e^{-j\\omega t} = \\cos(\\omega t) - j\\sin(\\omega t)$:\u003c/b> Chỉ dao động điều hòa tại chỗ với tần số góc $\\omega = \\frac{E}{\\hbar}$.\u003c/li>\n      \u003cli>\u003cb>Phần phụ thuộc không gian $\\psi(x)$:\u003c/b> Quyết định biên độ hình dáng sóng và thỏa mãn \u003cb>Phương trình Schrödinger không phụ thuộc thời gian (Time-Independent Schrödinger Equation)\u003c/b>:\n        $$\\frac{d^2\\psi(x)}{dx^2} + \\frac{2m}{\\hbar^2}\\big[E - V(x)\\big]\\psi(x) = 0$$\n      \u003c/li>\n    \u003c/ul>\n\n    \u003ch3>4.2. Ý nghĩa Vật lý của Hàm sóng (Định đề Max Born)\u003c/h3>\n    \u003cp>Vì hàm sóng $\\Psi(x,t)$ chứa số ảo $j = \\sqrt{-1}$ nên bản thân $\\Psi(x,t)$ \u003cb>không phải là đại lượng vật lý đo được trực tiếp\u003c/b>. Tuy nhiên, năm 1926, Max Born phát hiện ra rằng khi lấy \u003cb>bình phương mô-đun\u003c/b> của hàm sóng (tức nhân hàm sóng với liên hợp phức $\\Psi^*$ của nó), số ảo $e^{-j\\omega t}$ sẽ triệt tiêu hoàn toàn với $e^{+j\\omega t}$:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$|\\Psi(x,t)|^2 = \\Psi(x,t)\\cdot\\Psi^*(x,t) = \\big[\\psi(x)e^{-j\\omega t}\\big]\\cdot\\big[\\psi^*(x)e^{+j\\omega t}\\big] = |\\psi(x)|^2$$\n    \u003c/div>\n    \u003cul>\n      \u003cli>\u003cspan class=\"k b1\">$|\\psi(x)|^2$\u003c/span> Gọi là \u003cb>Hàm mật độ xác suất (Probability density function)\u003c/b> — luôn là một số thực không âm và không đổi theo thời gian.\u003c/li>\n      \u003cli>\u003cspan class=\"k b2\">$|\\psi(x)|^2\\,dx$\u003c/span> Là \u003cb>Xác suất tìm thấy hạt\u003c/b> nằm trong đoạn không gian nhỏ từ $x$ đến $x + dx$.\u003c/li>\n      \u003cli>\u003cspan class=\"k b5\">$P(x_1 \\le x \\le x_2) = \\int_{x_1}^{x_2} |\\psi(x)|^2\\,dx$\u003c/span> Là xác suất tìm thấy hạt trong khoảng từ $x_1$ đến $x_2$ (chính là \u003cb>diện tích nằm dưới đồ thị $|\\psi(x)|^2$\u003c/b> từ $x_1$ đến $x_2$).\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>4.3. Mô hình tương tác: Hàm sóng $\\psi(x)$, Chuẩn hóa và Điều kiện Biên\u003c/h3>\n    \u003cp>Để một hàm sóng $\\psi(x)$ mô tả đúng hạt thực tế trong tự nhiên, nó bắt buộc phải thỏa mãn \u003cb>Điều kiện chuẩn hóa\u003c/b> (tổng xác suất tìm thấy hạt trên toàn không gian phải bằng $100\\% = 1$, tức $\\int_{-\\infty}^{+\\infty}|\\psi(x)|^2dx = 1$) và các \u003cb>Điều kiện biên (Boundary Conditions)\u003c/b>. Hãy bấm vào 2 tab dưới đây để so sánh sự khác biệt giữa \u003cb>Giếng thế hữu hạn\u003c/b> và \u003cb>Giếng thế vô hạn\u003c/b>:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"well-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"renderWellBoundary('finite', this)\">1. Giếng thế Hữu hạn (V(x) = V₀ hữu hạn)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderWellBoundary('infinite', this)\">2. Giếng thế Vô hạn (V(x) = ∞ ở hai vách)\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"well-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"well-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n\n    \u003ch3>4.4. Mô hình tương tác: Tính tích phân Xác suất tìm thấy hạt (Minh họa trực tiếp Câu 4 & Câu 5)\u003c/h3>\n    \u003cp>Nhiều bạn mất gốc Giải tích thường rất sợ khi thấy dấu tích phân $\\int |\\psi(x)|^2dx$. Thực ra, tích phân xác suất chỉ đơn giản là \u003cb>đo phần diện tích tô màu\u003c/b> dưới đường cong $|\\psi(x)|^2$! Em hãy chọn tab tương ứng với \u003cb>Câu 4\u003c/b> hoặc \u003cb>Câu 5\u003c/b> dưới đây để nhìn tận mắt hàm mật độ xác suất và diện tích tích phân:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"prob-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"selectProbTab('q5', this)\">1. Hàm mũ suy giảm ψ(x) = √(2/a₀)·e^(-x/a₀) (Minh họa Câu 5)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectProbTab('q4', this)\">2. Chuẩn hóa hàm cos(nπx) trên [-1/2, +1/2] (Minh họa Câu 4)\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\" id=\"prob-ctrl-q5\">\n        \u003cdiv>\n          \u003clabel>Chọn khoảng tích phân cần tính xác suất trong Câu 5:\u003c/label>\n          \u003cselect id=\"sel-q5-range\" onchange=\"renderProbSim()\">\n            \u003coption value=\"a\">Câu 5a: Khoảng từ x = 0 đến x = a₀/4 (0.25 a₀) → Xác suất ≈ 39.35%\u003c/option>\n            \u003coption value=\"b\">Câu 5b: Khoảng từ x = a₀/4 (0.25 a₀) đến x = a₀/2 (0.50 a₀) → Xác suất ≈ 23.86%\u003c/option>\n            \u003coption value=\"c\">Câu 5c: Khoảng từ x = 0 đến x = a₀ (1.00 a₀) → Xác suất ≈ 86.47%\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\" id=\"prob-ctrl-q4\" style=\"display:none\">\n        \u003cdiv>\n          \u003clabel>Số nguyên lượng tử $n$ (\u003cspan id=\"val-q4-n\">1\u003c/span>) — Diện tích $|\\Psi|^2 = A^2\\cos^2(n\\pi x)$ luôn bằng 1 khi $A = \\sqrt{2}$:\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-q4-n\" min=\"1\" max=\"5\" step=\"1\" value=\"1\" oninput=\"renderProbSim()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"prob-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"prob-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>5. Cẩm Nang Công Thức Trọng Tâm Buổi 2 (Giải Nghĩa Chi Tiết)\u003c/h2>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 1: Năng lượng Photon & Phương trình Quang điện Einstein\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$E_{\\text{photon}} = h\\nu = \\frac{hc}{\\lambda} \\qquad \\text{và} \\qquad T_{\\text{max}} = \\frac{1}{2}mv^2 = h\\nu - \\Phi$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $E_{\\text{photon}}$: Năng lượng của 1 hạt ánh sáng ($\\text{J}$ hoặc $\\text{eV}$, với $1\\text{ eV} = 1.6 \\times 10^{-19}\\text{ J}$).\u003cbr>\n          • $h = 6.625 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$: Hằng số Planck.\u003cbr>\n          • $c = 3 \\times 10^8\\text{ m/s}$: Tốc độ ánh sáng trong chân không.\u003cbr>\n          • $\\nu$: Tần số ánh sáng ($\\text{Hz}$ hoặc $\\text{s}^{-1}$); $\\lambda$: Bước sóng ($\\text{m}$).\u003cbr>\n          • $\\Phi = h\\nu_0$: Công thoát của vật liệu ($\\text{J}$ hoặc $\\text{eV}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Định luật bảo toàn năng lượng cho cuộc va chạm 1-đối-1 giữa 1 photon và 1 electron.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài cho bước sóng $\\lambda$ (như tia X ở Câu 1a) bắt tính năng lượng photon hoặc hiệu điện thế gia tốc $V$ (qua công thức $E = eV$).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 2: Động lượng Photon & Bước sóng Vật chất de Broglie\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\lambda = \\frac{h}{p} = \\frac{h}{mv} = \\frac{h}{\\sqrt{2mE}}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $\\lambda$: Bước sóng de Broglie của hạt ($\\text{m}$, đổi sang Angstrom nhớ $1\\text{ Å} = 10^{-10}\\text{ m}$).\u003cbr>\n          • $p = mv$: Động lượng của hạt ($\\text{kg}\\cdot\\text{m/s}$ hoặc $\\text{N}\\cdot\\text{s}$).\u003cbr>\n          • $m$: Khối lượng hạt (với electron tự do: $m_0 = 9.11 \\times 10^{-31}\\text{ kg}$).\u003cbr>\n          • $E = \\frac{1}{2}mv^2 = \\frac{p^2}{2m}$: Động năng của hạt ($\\text{J}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Liên kết tính chất Sóng (bước sóng $\\lambda$) và tính chất Hạt (động lượng $p$, khối lượng $m$) của cùng một thực thể.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài yêu cầu tính \u003ci>\"bước sóng de Broglie của electron\"\u003c/i> khi biết vận tốc $v$ hoặc biết động năng $E = eV$ (như Câu 1b).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 3: Hệ thức Bất định Heisenberg\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\Delta p \\cdot \\Delta x \\ge \\hbar \\qquad \\text{và} \\qquad \\Delta E \\cdot \\Delta t \\ge \\hbar \\qquad \\left(\\text{với } \\hbar = \\frac{h}{2\\pi} \\approx 1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\right)$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $\\Delta x$: Độ bất định (sai số tối thiểu) về vị trí ($\\text{m}$).\u003cbr>\n          • $\\Delta p$: Độ bất định về động lượng ($\\text{kg}\\cdot\\text{m/s}$).\u003cbr>\n          • $\\Delta E$: Độ bất định về năng lượng ($\\text{J}$); $\\Delta t$: Độ bất định về thời gian ($\\text{s}$).\u003cbr>\n          • $\\hbar$: Hằng số Planck rút gọn ($\\text{J}\\cdot\\text{s}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Giới hạn tự nhiên của sóng vật chất: không thể định xứ đồng thời cả vị trí lẫn bước sóng/động lượng.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài có từ khóa \u003ci>\"độ bất định (uncertainty)\"\u003c/i> của vị trí $\\Delta x$, động lượng $\\Delta p$ hoặc vận tốc $\\Delta v = \\frac{\\Delta p}{m}$ (như Câu 2). Khi tìm giới hạn tối thiểu, ta lấy dấu bằng: $\\Delta p = \\frac{\\hbar}{\\Delta x}$.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 4: Phương trình Schrödinger, Chuẩn hóa & Tích phân Xác suất\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$-\\frac{\\hbar^2}{2m}\\frac{\\partial^2\\Psi}{\\partial x^2} + V(x)\\Psi = j\\hbar\\frac{\\partial\\Psi}{\\partial t} \\quad \\Big| \\quad \\int_{-\\infty}^{+\\infty} |\\Psi(x,t)|^2\\,dx = 1 \\quad \\Big| \\quad P(a \\le x \\le b) = \\int_a^b |\\psi(x)|^2\\,dx$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $\\Psi(x,t) = \\psi(x)e^{-j\\omega t}$: Hàm sóng toàn phần.\u003cbr>\n          • $|\\Psi(x,t)|^2 = |\\psi(x)|^2$: Mật độ xác suất tìm thấy hạt trên một đơn vị chiều dài ($\\text{m}^{-1}$).\u003cbr>\n          • $P(a \\le x \\le b)$: Xác suất tìm thấy hạt trong đoạn $[a, b]$ (không có đơn vị, nằm từ $0$ đến $1$ hay $0\\%$ đến $100\\%$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Vì tổng xác suất tìm thấy 1 hạt trong toàn bộ vùng nó tồn tại phải bằng $1$ ($100\\%$), điều kiện chuẩn hóa giúp ta tìm được hằng số biên độ $A$ của hàm sóng.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Dùng để chứng minh nghiệm phương trình Schrödinger (Câu 3), tìm hệ số chuẩn hóa $A$ (Câu 4) và tính xác suất tìm thấy hạt trong một khoảng tọa độ (Câu 5).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>6. Bài Tập Trọng Tâm Buổi 2 (Có Gợi Ý & Giải Chi Tiết Từng Bước)\u003c/h2>\n    \u003cp>Tất cả 5 câu hỏi trong phiếu Bài tập Trọng tâm Buổi 2 đều được giải chi tiết từng bước dưới đây. Em hãy bấm vào nút \u003cb>Xem Gợi ý\u003c/b> để nắm chiến thuật giải trước khi mở \u003cb>Xem Lời giải chi tiết\u003c/b> nhé!\u003c/p>\n\n    \u003c!-- CÂU 1 BUỔI 2 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b2-cau1\">Câu 1: Gia tốc Electron tạo Tia X và Bước sóng de Broglie\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Cần tạo ra bức xạ tia X có bước sóng $\\lambda = 1\\text{ Å}$.\u003cbr>\n      a) Electron phải được gia tốc trong chân không qua một hiệu điện thế bao nhiêu để khi va chạm với bia, nó có thể tạo ra photon có bước sóng trên? Giả sử toàn bộ năng lượng của electron được truyền cho photon.\u003cbr>\n      b) Tính bước sóng de Broglie của electron ngay trước khi nó va vào bia.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b2-hint1')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b2-sol1')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-hint1\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Ý a:\u003c/b> Đổi bước sóng tia X $\\lambda = 1\\text{ Å} = 10^{-10}\\text{ m}$. Tính năng lượng của photon tia X bằng công thức $E_{\\text{photon}} = \\frac{hc}{\\lambda}$ (ra đơn vị Joule). Vì toàn bộ động năng của electron khi được gia tốc qua hiệu điện thế $V$ ($E_e = e \\cdot V$) truyền hết cho photon, nên ta cho $e \\cdot V = E_{\\text{photon}} \\implies V = \\frac{E_{\\text{photon}}}{e}$.\u003c/li>\n          \u003cli>\u003cb>Ý b:\u003c/b> Ngay trước khi va vào bia, electron có động năng $E = E_{\\text{photon}}$ (tính ở câu a). Từ công thức động năng cổ điển $E = \\frac{p^2}{2m_0}$, ta rút ra động lượng của electron là $p = \\sqrt{2m_0 E}$, sau đó thay vào công thức bước sóng de Broglie $\\lambda_{\\text{DB}} = \\frac{h}{p}$.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-sol1\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>a) Tính hiệu điện thế gia tốc $V$ cần thiết:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Đổi bước sóng của photon tia X từ đơn vị Angstrom ($\\text{Å}$) sang đơn vị chuẩn SI là mét ($\\text{m}$):\u003c/span>\n          $$\\lambda = 1\\text{ Å} = 1 \\times 10^{-10}\\text{ m}$$\n          \u003cspan class=\"cmt\">// Bước 2: Tính năng lượng của photon tia X cần tạo ra theo công thức lượng tử Planck - Einstein (với $h = 6.625 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$ và $c = 3 \\times 10^8\\text{ m/s}$):\u003c/span>\n          $$E_{\\text{photon}} = \\frac{hc}{\\lambda} = \\frac{\\left(6.625 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\right) \\times \\left(3 \\times 10^8\\text{ m/s}\\right)}{1 \\times 10^{-10}\\text{ m}} = 1.9875 \\times 10^{-15}\\text{ J}$$\n          \u003cspan class=\"cmt\">// Bước 3: Theo định luật bảo toàn năng lượng, toàn bộ năng lượng mà electron thu được khi chạy qua hiệu điện thế gia tốc $V$ ($E_e = e \\cdot V$) được truyền hoàn toàn cho photon tia X ($E_e = E_{\\text{photon}}$). Ta chia năng lượng này cho điện tích nguyên tố $e = 1.6 \\times 10^{-19}\\text{ C}$ để tìm hiệu điện thế $V$:\u003c/span>\n          $$e \\cdot V = E_{\\text{photon}} \\implies V = \\frac{E_{\\text{photon}}}{e} = \\frac{1.9875 \\times 10^{-15}\\text{ J}}{1.6 \\times 10^{-19}\\text{ C}} \\approx 12422\\text{ V} \\approx 12.42\\text{ kV}$$\n          \u003cspan class=\"cmt\">// (Ghi chú: Khi một electron được gia tốc qua hiệu điện thế $12422\\text{ V}$, động năng của nó tính theo đơn vị $\\text{eV}$ chính bằng $E = 12422\\text{ eV} = 12.42\\text{ keV}$).\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Tính bước sóng de Broglie của electron ngay trước khi va vào bia:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tìm động lượng $p$ của electron ngay trước khi đập vào bia. Biết động năng của electron liên hệ với động lượng $p$ và khối lượng nghỉ $m_0 = 9.11 \\times 10^{-31}\\text{ kg}$ qua công thức $E = \\frac{1}{2}m_0v^2 = \\frac{p^2}{2m_0}$, ta rút ra $p$:\u003c/span>\n          $$p = \\sqrt{2 m_0 E} = \\sqrt{2 \\times \\left(9.11 \\times 10^{-31}\\text{ kg}\\right) \\times \\left(1.9875 \\times 10^{-15}\\text{ J}\\right)}$$\n          $$p = \\sqrt{3.6212 \\times 10^{-45}} \\approx 6.018 \\times 10^{-23}\\text{ kg}\\cdot\\text{m/s}$$\n          \u003cspan class=\"cmt\">// Bước 2: Áp dụng công thức de Broglie $\\lambda_e = \\frac{h}{p}$ để tính bước sóng vật chất của hạt electron tại thời điểm đó:\u003c/span>\n          $$\\lambda_e = \\frac{h}{p} = \\frac{6.625 \\times 10^{-34}\\text{ J}\\cdot\\text{s}}{6.018 \\times 10^{-23}\\text{ kg}\\cdot\\text{m/s}} \\approx 1.101 \\times 10^{-11}\\text{ m}$$\n          \u003cspan class=\"cmt\">// Bước 3: Đổi kết quả từ mét ($\\text{m}$) sang Angstrom ($\\text{Å}$) bằng cách chia cho $10^{-10}$ để dễ so sánh với bước sóng tia X:\u003c/span>\n          $$\\lambda_e \\approx 0.11\\text{ Å}$$\n          \u003cspan class=\"cmt\">// Nhận xét vật lý: Dù có cùng mức năng lượng $12.42\\text{ keV}$, nhưng bước sóng de Broglie của electron ($0.11\\text{ Å}$) ngắn hơn khoảng 9 lần so với bước sóng của photon tia X ($1\\text{ Å}$).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 2 BUỔI 2 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b2-cau2\">Câu 2: Áp dụng Nguyên lý Bất định Heisenberg cho Photon\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Khi xét nguyên lý bất định, không thể xác định vị trí của một photon chính xác hơn khoảng một bước sóng. Xét photon có: $\\lambda = 1\\text{ }\\mu\\text{m}$. Hãy xác định độ bất định của động lượng photon.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b2-hint2')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b2-sol2')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-hint2\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Đề bài cho biết \u003ci>\"không thể xác định vị trí chính xác hơn khoảng một bước sóng\"\u003c/i>, nghĩa là độ bất định về vị trí của photon bằng đúng bước sóng của nó: $\\Delta x \\approx \\lambda = 1\\text{ }\\mu\\text{m} = 10^{-6}\\text{ m}$.\u003c/li>\n          \u003cli>Áp dụng trực tiếp hệ thức bất định Heisenberg giữa vị trí và động lượng: $\\Delta p \\cdot \\Delta x \\ge \\hbar \\implies \\Delta p \\ge \\frac{\\hbar}{\\Delta x}$.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-sol2\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 1: Xác định độ bất định về vị trí $\\Delta x$ từ dữ kiện đề bài và đổi từ đơn vị micromet ($\\mu\\text{m}$) sang đơn vị chuẩn SI là mét ($\\text{m}$):\u003c/span>\n          $$\\Delta x = \\lambda = 1\\text{ }\\mu\\text{m} = 1 \\times 10^{-6}\\text{ m}$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 2: Viết hệ thức bất định Heisenberg liên hệ giữa độ bất định vị trí $\\Delta x$ và độ bất định động lượng $\\Delta p$:\u003c/span>\n          $$\\Delta p \\cdot \\Delta x \\ge \\hbar \\quad \\left(\\text{với } \\hbar = \\frac{h}{2\\pi} \\approx 1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\right)$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 3: Chia cả hai vế cho $\\Delta x$ để tìm giá trị độ bất định tối thiểu của động lượng photon:\u003c/span>\n          $$\\Delta p \\ge \\frac{\\hbar}{\\Delta x} = \\frac{1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}}{1 \\times 10^{-6}\\text{ m}} = 1.054 \\times 10^{-28}\\text{ kg}\\cdot\\text{m/s}\\text{ (hoặc N}\\cdot\\text{s)}$$\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 3 BUỔI 2 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b2-cau3\">Câu 3: Nguyên lý Chồng chập Nghiệm của Phương trình Schrödinger\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Giả sử $\\Psi_1(x,t)$ và $\\Psi_2(x,t)$ đều là nghiệm của phương trình Schrödinger phụ thuộc thời gian một chiều.\u003cbr>\n      a) Chứng minh rằng: $\\Psi_1 + \\Psi_2$ cũng là một nghiệm.\u003cbr>\n      b) Tích: $\\Psi_1 \\Psi_2$ có phải luôn là nghiệm của Schrödinger equation không? Tại sao?\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b2-hint3')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b2-sol3')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-hint3\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Ý a:\u003c/b> Viết phương trình Schrödinger phụ thuộc thời gian cho $\\Psi_1$ và cho $\\Psi_2$. Sau đó thế hàm tổng $\\Psi = \\Psi_1 + \\Psi_2$ vào phương trình Schrödinger, sử dụng tính chất tuyến tính của đạo hàm: đạo hàm của một tổng bằng tổng các đạo hàm.\u003c/li>\n          \u003cli>\u003cb>Ý b:\u003c/b> Thế hàm tích $\\Psi = \\Psi_1 \\cdot \\Psi_2$ vào phương trình Schrödinger và áp dụng quy tắc đạo hàm của một tích: $(u \\cdot v)' = u'v + uv'$. Em sẽ thấy xuất hiện các số hạng thừa và $V(x)$ bị thiếu hệ số, khiến hai vế không bằng nhau!\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-sol3\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước chuẩn bị: Viết giả thiết cho hai nghiệm $\\Psi_1(x,t)$ và $\\Psi_2(x,t)$:\u003c/b>\n          \u003cspan class=\"cmt\">// Vì $\\Psi_1$ và $\\Psi_2$ đều là nghiệm của phương trình Schrödinger phụ thuộc thời gian 1 chiều trong cùng trường thế năng $V(x)$, nên bản thân chúng thỏa mãn hai đẳng thức sau:\u003c/span>\n          $$-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi_1}{\\partial x^2} + V(x)\\Psi_1 = j\\hbar\\frac{\\partial \\Psi_1}{\\partial t} \\quad (1)$$\n          $$-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi_2}{\\partial x^2} + V(x)\\Psi_2 = j\\hbar\\frac{\\partial \\Psi_2}{\\partial t} \\quad (2)$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>a) Chứng minh tổng $\\Psi = \\Psi_1 + \\Psi_2$ cũng là một nghiệm:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Thay $\\Psi = \\Psi_1 + \\Psi_2$ vào Vế Trái (VT) của phương trình Schrödinger và dùng tính chất đạo hàm của một tổng bằng tổng các đạo hàm:\u003c/span>\n          $$\\text{VT} = -\\frac{\\hbar^2}{2m}\\frac{\\partial^2 (\\Psi_1 + \\Psi_2)}{\\partial x^2} + V(x)(\\Psi_1 + \\Psi_2)$$\n          $$\\text{VT} = \\left(-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi_1}{\\partial x^2} + V(x)\\Psi_1\\right) + \\left(-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi_2}{\\partial x^2} + V(x)\\Psi_2\\right)$$\n          \u003cspan class=\"cmt\">// Bước 2: Áp dụng đẳng thức (1) cho ngoặc thứ nhất và đẳng thức (2) cho ngoặc thứ hai, sau đó đặt nhân tử chung $j\\hbar\\frac{\\partial}{\\partial t}$:\u003c/span>\n          $$\\text{VT} = j\\hbar\\frac{\\partial \\Psi_1}{\\partial t} + j\\hbar\\frac{\\partial \\Psi_2}{\\partial t} = j\\hbar\\frac{\\partial (\\Psi_1 + \\Psi_2)}{\\partial t} = \\text{VP}$$\n          \u003cspan class=\"cmt\">// Kết luận câu a: Vế Trái bằng đúng Vế Phải, vậy $\\Psi_1 + \\Psi_2$ luôn là nghiệm của phương trình Schrödinger (Trong vật lý lượng tử, tính chất này gọi là Nguyên lý chồng chập trạng thái - Superposition Principle).\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Xét xem tích $\\Psi = \\Psi_1 \\Psi_2$ có phải luôn là nghiệm hay không:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính đạo hàm bậc nhất theo thời gian (Vế Phải) của hàm tích $\\Psi_1 \\Psi_2$ theo quy tắc đạo hàm một tích $(uv)' = u'v + uv'$:\u003c/span>\n          $$\\text{VP} = j\\hbar\\frac{\\partial (\\Psi_1 \\Psi_2)}{\\partial t} = \\Psi_2 \\left(j\\hbar\\frac{\\partial \\Psi_1}{\\partial t}\\right) + \\Psi_1 \\left(j\\hbar\\frac{\\partial \\Psi_2}{\\partial t}\\right)$$\n          \u003cspan class=\"cmt\">// Thay $j\\hbar\\frac{\\partial \\Psi_1}{\\partial t}$ và $j\\hbar\\frac{\\partial \\Psi_2}{\\partial t}$ từ phương trình (1) và (2) vào biểu thức Vế Phải trên:\u003c/span>\n          $$\\text{VP} = \\Psi_2 \\left(-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi_1}{\\partial x^2} + V(x)\\Psi_1\\right) + \\Psi_1 \\left(-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi_2}{\\partial x^2} + V(x)\\Psi_2\\right)$$\n          $$\\text{VP} = -\\frac{\\hbar^2}{2m}\\left(\\Psi_2\\frac{\\partial^2 \\Psi_1}{\\partial x^2} + \\Psi_1\\frac{\\partial^2 \\Psi_2}{\\partial x^2}\\right) + 2V(x)\\Psi_1\\Psi_2 \\quad (*)$$\n          \u003cspan class=\"cmt\">// Bước 2: Bây giờ ta tính Vế Trái (VT) của phương trình Schrödinger khi thế $\\Psi = \\Psi_1 \\Psi_2$ vào. Lưu ý đạo hàm bậc hai của một tích là $(uv)'' = u''v + 2u'v' + uv''$:\u003c/span>\n          $$\\frac{\\partial^2 (\\Psi_1 \\Psi_2)}{\\partial x^2} = \\frac{\\partial}{\\partial x}\\left(\\Psi_2\\frac{\\partial \\Psi_1}{\\partial x} + \\Psi_1\\frac{\\partial \\Psi_2}{\\partial x}\\right) = \\Psi_2\\frac{\\partial^2 \\Psi_1}{\\partial x^2} + 2\\frac{\\partial \\Psi_1}{\\partial x}\\frac{\\partial \\Psi_2}{\\partial x} + \\Psi_1\\frac{\\partial^2 \\Psi_2}{\\partial x^2}$$\n          \u003cspan class=\"cmt\">// Do đó Vế Trái trở thành:\u003c/span>\n          $$\\text{VT} = -\\frac{\\hbar^2}{2m}\\left(\\Psi_2\\frac{\\partial^2 \\Psi_1}{\\partial x^2} + 2\\frac{\\partial \\Psi_1}{\\partial x}\\frac{\\partial \\Psi_2}{\\partial x} + \\Psi_1\\frac{\\partial^2 \\Psi_2}{\\partial x^2}\\right) + V(x)\\Psi_1\\Psi_2 \\quad (**)$$\n          \u003cspan class=\"cmt\">// Bước 3: So sánh Vế Phải $(*)$ và Vế Trái $(**)$: Ta thấy $\\text{VT} \\ne \\text{VP}$ vì ở Vế Trái dư ra số hạng đạo hàm chéo $-\\frac{\\hbar^2}{m}\\frac{\\partial \\Psi_1}{\\partial x}\\frac{\\partial \\Psi_2}{\\partial x}$ và chỉ có $1V(x)\\Psi_1\\Psi_2$ (trong khi Vế Phải có $2V(x)\\Psi_1\\Psi_2$).\u003c/span>\n          \u003cspan class=\"cmt\">// Kết luận câu b: Tích $\\Psi_1\\Psi_2$ KHÔNG PHẢI luôn là nghiệm của phương trình Schrödinger, bởi vì phương trình Schrödinger là phương trình vi phân tuyến tính (chỉ bảo toàn phép cộng và phép nhân với hằng số, không bảo toàn phép nhân hai hàm biến thiên).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 4 BUỔI 2 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b2-cau4\">Câu 4: Chuẩn hóa Hàm sóng (Tìm hệ số biên độ $A$)\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Xét wave function: $\\Psi(x,t) = A\\cos(n\\pi x)e^{-j\\omega t}$ trong miền $-\\frac{1}{2} \\le x \\le +\\frac{1}{2}$ với $n$ là số nguyên. Xác định $A$ sao cho:\n      $$\\int_{-1/2}^{+1/2} |\\Psi(x,t)|^2\\,dx = 1$$\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b2-hint4')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b2-sol4')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-hint4\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Trước tiên, rút gọn $|\\Psi(x,t)|^2 = \\Psi(x,t) \\cdot \\Psi^*(x,t)$. Nhớ rằng thừa số thời gian $|e^{-j\\omega t}|^2 = e^{-j\\omega t} \\cdot e^{+j\\omega t} = e^0 = 1$, nên $|\\Psi(x,t)|^2 = |A|^2 \\cos^2(n\\pi x)$.\u003c/li>\n          \u003cli>Để tính tích phân của hàm bậc hai $\\cos^2(u)$, hãy dùng \u003cb>công thức hạ bậc lượng giác\u003c/b> quen thuộc ở phổ thông:\n            $$\\cos^2(\\alpha) = \\frac{1 + \\cos(2\\alpha)}{2}$$\n          \u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-sol4\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 1: Tính hàm mật độ xác suất $|\\Psi(x,t)|^2$ bằng cách nhân hàm sóng $\\Psi(x,t)$ với liên hợp phức $\\Psi^*(x,t)$ của nó (coi $A$ là số thực dương):\u003c/span>\n          $$|\\Psi(x,t)|^2 = \\big[A\\cos(n\\pi x)e^{-j\\omega t}\\big] \\cdot \\big[A\\cos(n\\pi x)e^{+j\\omega t}\\big] = A^2 \\cos^2(n\\pi x)$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 2: Thay biểu thức $|\\Psi(x,t)|^2$ vào tích phân điều kiện chuẩn hóa của đề bài:\u003c/span>\n          $$\\int_{-1/2}^{+1/2} A^2 \\cos^2(n\\pi x)\\,dx = 1$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 3: Áp dụng công thức lượng giác hạ bậc $\\cos^2(n\\pi x) = \\frac{1 + \\cos(2n\\pi x)}{2}$ để đưa về tích phân cơ bản:\u003c/span>\n          $$A^2 \\int_{-1/2}^{+1/2} \\frac{1 + \\cos(2n\\pi x)}{2}\\,dx = 1$$\n          $$\\frac{A^2}{2} \\left[ x + \\frac{\\sin(2n\\pi x)}{2n\\pi} \\right]_{-1/2}^{+1/2} = 1$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 4: Thay cận trên $x = +\\frac{1}{2}$ và cận dưới $x = -\\frac{1}{2}$ vào. Vì $n$ là số nguyên ($n \\ne 0$), nên $\\sin\\left(2n\\pi \\cdot \\frac{1}{2}\\right) = \\sin(n\\pi) = 0$ và $\\sin(-n\\pi) = 0$:\u003c/span>\n          $$\\frac{A^2}{2} \\left[ \\left(\\frac{1}{2} - \\left(-\\frac{1}{2}\\right)\\right) + \\frac{\\sin(n\\pi) - \\sin(-n\\pi)}{2n\\pi} \\right] = 1$$\n          $$\\frac{A^2}{2} \\left[ 1 + 0 \\right] = 1 \\implies \\frac{A^2}{2} = 1 \\implies A^2 = 2$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 5: Lấy căn bậc hai của $A^2 = 2$ để kết luận giá trị của hệ số chuẩn hóa $A$:\u003c/span>\n          $$A = \\sqrt{2} \\quad (\\text{hoặc } A = \\pm\\sqrt{2})$$\n          \u003cspan class=\"cmt\">// (Lưu ý nhỏ: Trong trường hợp đặc biệt nếu $n = 0$ thì $\\cos(0) = 1 \\implies \\int_{-1/2}^{+1/2} A^2 dx = A^2 = 1 \\implies A = 1$. Còn với mọi số nguyên $n = \\pm 1, \\pm 2, \\pm 3, \\dots$ thì kết quả chuẩn là $A = \\sqrt{2}$).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 5 BUỔI 2 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b2-cau5\">Câu 5: Tính Xác suất Tìm thấy Hạt từ Hàm sóng\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Nghiệm của Schrödinger equation trong một trường hợp được cho bởi:\n      $$\\psi(x) = \\sqrt{\\frac{2}{a_0}}\\,e^{-x/a_0}$$\n      Hãy xác định xác suất tìm thấy hạt trong các khoảng:\u003cbr>\n      a) $0 \\le x \\le \\frac{a_0}{4}$\u003cbr>\n      b) $\\frac{a_0}{4} \\le x \\le \\frac{a_0}{2}$\u003cbr>\n      c) $0 \\le x \\le a_0$\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b2-hint5')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b2-sol5')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-hint5\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Bước 1:\u003c/b> Bình phương hàm sóng để tìm hàm mật độ xác suất $|\\psi(x)|^2$. Nhớ quy tắc lũy thừa: $\\left(e^{-x/a_0}\\right)^2 = e^{-2x/a_0}$, nên:\n            $$|\\psi(x)|^2 = \\frac{2}{a_0}\\,e^{-2x/a_0}$$\n          \u003c/li>\n          \u003cli>\u003cb>Bước 2:\u003c/b> Áp dụng công thức nguyên hàm hàm mũ cơ bản: $\\int e^{kx}\\,dx = \\frac{1}{k}e^{kx}$. Do đó, với bất kỳ đoạn $[x_1, x_2]$ nào, xác suất tìm thấy hạt luôn tính gọn thành:\n            $$P(x_1 \\le x \\le x_2) = \\int_{x_1}^{x_2} \\frac{2}{a_0}e^{-2x/a_0}\\,dx = \\left[ -e^{-2x/a_0} \\right]_{x_1}^{x_2} = e^{-2x_1/a_0} - e^{-2x_2/a_0}$$\n          \u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b2-sol5\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước mở đầu: Lập công thức tích phân xác suất tổng quát trên đoạn $[x_1, x_2]$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính hàm mật độ xác suất $|\\psi(x)|^2$ bằng cách bình phương hai vế của hàm sóng $\\psi(x)$:\u003c/span>\n          $$|\\psi(x)|^2 = \\left(\\sqrt{\\frac{2}{a_0}}\\,e^{-x/a_0}\\right)^2 = \\frac{2}{a_0}\\,e^{-2x/a_0}$$\n          \u003cspan class=\"cmt\">// Bước 2: Tính tích phân của $|\\psi(x)|^2$ từ cận dưới $x_1$ đến cận trên $x_2$. Vì đạo hàm của $e^{-2x/a_0}$ theo $x$ là $-\\frac{2}{a_0}e^{-2x/a_0}$, nên nguyên hàm của $\\frac{2}{a_0}e^{-2x/a_0}$ chính là $-e^{-2x/a_0}$:\u003c/span>\n          $$P(x_1 \\le x \\le x_2) = \\int_{x_1}^{x_2} \\frac{2}{a_0}\\,e^{-2x/a_0}\\,dx = \\Big[ -e^{-2x/a_0} \\Big]_{x_1}^{x_2} = e^{-2x_1/a_0} - e^{-2x_2/a_0}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>a) Xác suất tìm thấy hạt trong khoảng $0 \\le x \\le \\frac{a_0}{4}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Thay cận dưới $x_1 = 0$ và cận trên $x_2 = \\frac{a_0}{4}$ vào công thức tổng quát vừa tìm được:\u003c/span>\n          $$P_a = e^{-2(0)/a_0} - e^{-2(a_0/4)/a_0} = e^0 - e^{-1/2} = 1 - e^{-0.5}$$\n          \u003cspan class=\"cmt\">// Bấm máy tính với $e^{-0.5} \\approx 0.6065$:\u003c/span>\n          $$P_a \\approx 1 - 0.6065 = \\mathbf{0.3935} \\quad (\\text{hay } \\mathbf{39.35\\%})$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Xác suất tìm thấy hạt trong khoảng $\\frac{a_0}{4} \\le x \\le \\frac{a_0}{2}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Thay cận dưới $x_1 = \\frac{a_0}{4}$ và cận trên $x_2 = \\frac{a_0}{2}$ vào công thức tổng quát:\u003c/span>\n          $$P_b = e^{-2(a_0/4)/a_0} - e^{-2(a_0/2)/a_0} = e^{-0.5} - e^{-1}$$\n          \u003cspan class=\"cmt\">// Bấm máy tính với $e^{-0.5} \\approx 0.6065$ và $e^{-1} \\approx 0.3679$:\u003c/span>\n          $$P_b \\approx 0.6065 - 0.3679 = \\mathbf{0.2386} \\quad (\\text{hay } \\mathbf{23.86\\%})$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>c) Xác suất tìm thấy hạt trong khoảng $0 \\le x \\le a_0$:\u003c/b>\n          \u003cspan class=\"cmt\">// Thay cận dưới $x_1 = 0$ và cận trên $x_2 = a_0$ vào công thức tổng quát:\u003c/span>\n          $$P_c = e^{-2(0)/a_0} - e^{-2(a_0)/a_0} = e^0 - e^{-2} = 1 - e^{-2}$$\n          \u003cspan class=\"cmt\">// Bấm máy tính với $e^{-2} \\approx 0.1353$:\u003c/span>\n          $$P_c \\approx 1 - 0.1353 = \\mathbf{0.8647} \\quad (\\text{hay } \\mathbf{86.47\\%})$$\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sum\">\n    \u003ch2>Tổng Kết Buổi 2: Những Điểm Cốt Lõi Cần Nhớ\u003c/h2>\n    \u003cul>\n      \u003cli>\u003cb>Lượng tử ánh sáng & Quang điện:\u003c/b> Năng lượng truyền theo từng gói rời rạc $E = h\\nu = \\frac{hc}{\\lambda}$. Động năng cực đại của quang electron là $T_{\\text{max}} = h\\nu - \\Phi$.\u003c/li>\n      \u003cli>\u003cb>Lưỡng tính Sóng - Hạt:\u003c/b> Mọi hạt có động lượng $p = mv = \\sqrt{2mE}$ đều mang tính sóng với bước sóng de Broglie $\\lambda = \\frac{h}{p}$.\u003c/li>\n      \u003cli>\u003cb>Nguyên lý Bất định Heisenberg:\u003c/b> Không thể đo chính xác đồng thời vị trí và động lượng ($\\Delta p \\cdot \\Delta x \\ge \\hbar$), cũng như năng lượng và thời gian ($\\Delta E \\cdot \\Delta t \\ge \\hbar$).\u003c/li>\n      \u003cli>\u003cb>Hàm sóng Schrödinger & Mật độ xác suất:\u003c/b> $|\\Psi(x,t)|^2 = |\\psi(x)|^2$ là mật độ xác suất tìm thấy hạt. Tổng tích phân xác suất trên toàn miền tồn tại của hạt luôn bằng $1$ (Điều kiện chuẩn hóa).\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\u003c/template>\n\n\u003c!-- =========================================================\n     TEMPLATE BUỔI 3: NHẬP MÔN CƠ HỌC LƯỢNG TỬ (PHẦN 2)\n     ========================================================= -->\n\u003ctemplate id=\"tpl-buoi-3\">\n  \u003cheader>\n    \u003cspan class=\"k b2\">HỌC PHẦN ENP2209 · BUỔI 3\u003c/span>\n    \u003ch1>Nhập Môn Cơ Học Lượng Tử (Phần 2)\u003c/h1>\n    \u003cp class=\"mut\">Ứng dụng phương trình sóng Schrödinger cho Hạt tự do, Giếng thế vô hạn, Bậc thế năng, Hiệu ứng xuyên hầm lượng tử (Tunneling) và Cấu trúc nguyên tử 1-electron.\u003c/p>\n  \u003c/header>\n\n  \u003csection>\n    \u003ch2>1. Hạt Electron Trong Không Gian Tự Do (Free Electron)\u003c/h2>\n    \u003cp>Ở Buổi 2, chúng ta đã làm quen với \u003cb>Phương trình sóng Schrödinger không phụ thuộc thời gian\u003c/b>:\n      $$\\frac{d^2\\psi(x)}{dx^2} + \\frac{2m}{\\hbar^2}\\big[E - V(x)\\big]\\psi(x) = 0$$\n      Bây giờ, chúng ta sẽ giải phương trình này từ trường hợp dễ nhất đến các trường hợp thú vị nhất trong linh kiện bán dẫn. Trường hợp đầu tiên là \u003cb>Electron chuyển động trong không gian tự do (Free Space)\u003c/b> — tức là nơi không có bất kỳ lực hút hay lực đẩy nào tác dụng lên nó, nên thế năng ở mọi nơi bằng không: $V(x) = 0$.\n    \u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Chiếc xe chạy trên mặt băng phẳng lặng vô tận\u003c/b>\u003cbr>\n      Hãy tưởng tượng một người trượt băng trên mặt hồ đóng băng phẳng lặng, không có ma sát và không có bất kỳ bức tường chắn nào ($V(x)=0$). Người đó có thể trượt đi mãi mãi theo chiều dương ($+x$) hoặc chiều âm ($-x$) với \u003cb>bất kỳ vận tốc và mức năng lượng $E$ nào\u003c/b> mà không bị giới hạn. Trong cơ học lượng tử, chuyển động tự do không bị cản trở đó được biểu diễn bằng một \u003cb>Sóng phẳng chạy (Traveling Plane Wave)\u003c/b>.\n    \u003c/div>\n\n    \u003ch3>1.1. Nghiệm Sóng phẳng, Số sóng $k$ và Vận tốc pha $v_p$\u003c/h3>\n    \u003cp>Khi thay $V(x) = 0$ vào phương trình Schrödinger, ta được phương trình dao động điều hòa quen thuộc:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\frac{d^2\\psi(x)}{dx^2} + k^2\\psi(x) = 0 \\qquad \\text{với } \\mathbf{k = \\frac{\\sqrt{2mE}}{\\hbar}} \\text{ gọi là Số sóng (Wave number)}$$\n    \u003c/div>\n    \u003cp>Khi ghép thêm phần thời gian $e^{-j\\omega t}$, nghiệm tổng quát của hạt tự do là sự chồng chập của hai sóng phẳng chạy ngược chiều nhau:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\Psi(x,t) = A\\,e^{j(kx - \\omega t)} + B\\,e^{-j(kx + \\omega t)}$$\n      \u003csmall>Trong đó: Số hạng $A\\,e^{j(kx - \\omega t)}$ là sóng truyền theo chiều $+x$ (khi $k>0$); số hạng $B\\,e^{-j(kx + \\omega t)}$ (hoặc khi $k \u003c 0$) là sóng truyền ngược lại theo chiều $-x$.\u003c/small>\n    \u003c/div>\n\n    \u003cul>\n      \u003cli>\u003cb>Liên hệ giữa Số sóng $k$, Bước sóng $\\lambda$ và Động lượng $p$:\u003c/b> Từ công thức de Broglie $\\lambda = \\frac{h}{p}$ và $E = \\frac{p^2}{2m} = \\frac{\\hbar^2 k^2}{2m}$, ta rút ra cặp công thức cực kỳ quan trọng:\n        $$\\mathbf{p = \\hbar k} \\qquad \\text{và} \\qquad \\mathbf{\\lambda = \\frac{2\\pi}{|k|}}$$\n      \u003c/li>\n      \u003cli>\u003cb>Vận tốc pha (Phase Velocity - $v_p$):\u003c/b> Là tốc độ di chuyển của một đỉnh sóng (nơi pha sóng $kx - \\omega t = \\text{const}$):\n        $$\\mathbf{v_p = \\frac{\\omega}{|k|}}$$\n      \u003c/li>\n    \u003c/ul>\n\n    \u003ch3>1.2. Mô hình tương tác: Sóng phẳng của Electron tự do (Minh họa trực tiếp Câu 1)\u003c/h3>\n    \u003cp>Em hãy bấm chọn giữa hai trường hợp \u003cb>Câu 1a ($k > 0$)\u003c/b> và \u003cb>Câu 1b ($k \u003c 0$)\u003c/b> hoặc kéo thanh trượt thay đổi số sóng $k$ để quan sát chiều truyền sóng, bước sóng $\\lambda$, động lượng $p$ và động năng $E$:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"free-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"setFreePreset('a', this)\">Câu 1a: k = +8×10⁸ m⁻¹, ω = 8×10¹² rad/s (Truyền theo +x)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"setFreePreset('b', this)\">Câu 1b: k = -1.5×10⁹ m⁻¹, ω = 1.5×10¹³ rad/s (Truyền theo -x)\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Số sóng $k$ (\u003cspan id=\"val-free-k\">8.0\u003c/span> $\\times 10^8\\text{ m}^{-1}$):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-free-k\" min=\"-20\" max=\"20\" step=\"0.5\" value=\"8\" oninput=\"renderFreeWave()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Pha thời gian $\\omega t$ (Kéo để xem sóng chạy):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-free-t\" min=\"0\" max=\"6.28\" step=\"0.15\" value=\"0.6\" oninput=\"renderFreeWave()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"free-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"free-svg\" viewBox=\"0 0 680 230\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>2. Hạt Trong Giếng Thế Vô Hạn 1 Chiều (Infinite Potential Well)\u003c/h2>\n    \u003cp>Chuyện gì xảy ra nếu ta không cho electron chạy tự do nữa, mà nhốt nó vào giữa hai bức tường thế năng cao vô tận ($V = \\infty$) đặt tại $x = 0$ và $x = a$, còn ở đáy giếng ($0 \u003c x \u003c a$) thì thế năng bằng không ($V = 0$)?\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Dây đàn Guitar bị kẹp chặt ở hai đầu\u003c/b>\u003cbr>\n      Khi một sợi dây đàn guitar dài $a$ được cột chặt ở hai đầu ($x=0$ và $x=a$), hai đầu dây bắt buộc phải đứng yên (biên độ $= 0$). Do đó, dây đàn không thể rung với bước sóng tùy ý, mà chiều dài sợi dây $a$ bắt buộc phải chứa đúng một số nguyên lần \u003cb>nửa bước sóng\u003c/b> ($a = n\\frac{\\lambda}{2}$, tức 1 bụng sóng, 2 bụng sóng, 3 bụng sóng...).\u003cbr>\n      Hạt electron bị nhốt trong giếng thế vô hạn cũng giống hệt sợi dây đàn đó: sóng vật chất của nó bị phản xạ qua lại tạo thành \u003cb>sóng dừng\u003c/b> và chỉ được phép tồn tại ở những \u003cb>mức năng lượng rời rạc $E_n$\u003c/b>!\n    \u003c/div>\n\n    \u003ch3>2.1. Giải phương trình Schrödinger & Sự lượng tử hóa năng lượng\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>Ở Vùng I ($x \\le 0$) và Vùng III ($x \\ge a$):\u003c/b> Vì thế năng $V(x) = \\infty$, hạt không thể tồn tại ở ngoài giếng nên $\\psi(x) = 0$.\u003c/li>\n      \u003cli>\u003cb>Ở Vùng II trong giếng ($0 \\le x \\le a$):\u003c/b> Thế năng $V(x) = 0$, phương trình Schrödinger có nghiệm dạng lượng giác:\n        $$\\psi(x) = A_1\\cos(kx) + A_2\\sin(kx) \\qquad \\text{với } k = \\frac{\\sqrt{2mE}}{\\hbar}$$\n      \u003c/li>\n      \u003cli>\u003cb>Áp dụng điều kiện biên liên tục của hàm sóng:\u003c/b>\n        \u003col>\n          \u003cli>Tại vách trái $x = 0$: $\\psi(0) = 0 \\implies A_1\\cos(0) + A_2\\sin(0) = 0 \\implies \\mathbf{A_1 = 0}$ (loại bỏ hàm $\\cos$).\u003c/li>\n          \u003cli>Tại vách phải $x = a$: $\\psi(a) = 0 \\implies A_2\\sin(ka) = 0$. Vì $A_2$ không thể bằng $0$ (nếu $A_2=0$ thì không có hạt nào trong giếng!), nên bắt buộc:\n            $$\\sin(ka) = 0 \\implies ka = n\\pi \\implies \\mathbf{k_n = \\frac{n\\pi}{a}} \\quad (n = 1, 2, 3, \\dots)$$\n          \u003c/li>\n        \u003c/ol>\n      \u003c/li>\n      \u003cli>\u003cb>Hàm sóng chuẩn hóa và Mức năng lượng lượng tử hóa $E_n$:\u003c/b> Từ điều kiện chuẩn hóa $\\int_0^a |\\psi_n(x)|^2dx = 1$, ta tìm được $A_2 = \\sqrt{\\frac{2}{a}}$, và thay $k_n = \\frac{n\\pi}{a}$ vào $E = \\frac{\\hbar^2 k^2}{2m}$:\n        \u003cdiv class=\"f\">\n          $$\\psi_n(x) = \\sqrt{\\frac{2}{a}}\\sin\\left(\\frac{n\\pi x}{a}\\right) \\qquad \\text{và} \\qquad \\mathbf{E_n = \\frac{n^2\\pi^2\\hbar^2}{2ma^2} = \\frac{n^2 h^2}{8ma^2}} \\quad (n = 1, 2, 3, \\dots)$$\n        \u003c/div>\n      \u003c/li>\n    \u003c/ul>\n\n    \u003ch3>2.2. Mô hình tương tác: Giếng thế vô hạn — Mức năng lượng $E_n$, Hàm sóng $\\psi_n$ & Xác suất $|\\psi_n|^2$\u003c/h3>\n    \u003cp>Em hãy kéo thanh trượt chọn \u003cb>mức lượng tử $n$ (từ 1 đến 4)\u003c/b> và \u003cb>bề rộng giếng $a$\u003c/b> (mặc định để $a = 75\\text{ Å}$ đúng bằng số liệu của \u003cb>Câu 2 Bài tập\u003c/b>) để quan sát các vạch năng lượng tỉ lệ với $n^2$, số bụng sóng và các vị trí tìm thấy hạt nhiều nhất:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Số lượng tử chính $n$ (Mức thứ \u003cspan id=\"val-well-n\">1\u003c/span>):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-well-n\" min=\"1\" max=\"4\" step=\"1\" value=\"1\" oninput=\"renderInfiniteWell()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Chiều rộng giếng $a$ (\u003cspan id=\"val-well-a\">75\u003c/span> Å — Câu 2 là $75\\text{ Å}$, Ví dụ 2.3 là $5\\text{ Å}$):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-well-a\" min=\"5\" max=\"100\" step=\"5\" value=\"75\" oninput=\"renderInfiniteWell()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"infwell-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"infwell-svg\" viewBox=\"0 0 680 270\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>3. Bậc Thế Năng (Step Potential) & Rào Thế Xuyên Hầm (Quantum Tunneling)\u003c/h2>\n    \u003cp>Bây giờ ta xét trường hợp thực tế hơn: bức tường thế năng không cao vô cùng nữa mà chỉ có độ cao hữu hạn $V_0$. Chuyện gì xảy ra khi một hạt electron có tổng năng lượng $E$ nhỏ hơn chiều cao bức tường ($E \u003c V_0$) bay từ trái sang phải đập vào bức tường?\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Ném quả bóng tennis vào bức tường gạch vs. Ánh sáng xuyên qua lớp sương mù\u003c/b>\u003cbr>\n      • \u003cb>Theo cơ học cổ điển:\u003c/b> Nếu em đá quả bóng có năng lượng $E = 2.8\\text{ eV}$ vào bậc thềm cao $V_0 = 3.5\\text{ eV}$ ($E \u003c V_0$), quả bóng chắc chắn bật ngược lại $100\\%$ ngay tại mép tường ($x=0$), tuyệt đối không bao giờ lún sâu vào trong bê tông dù chỉ $1\\text{ mm}$.\u003cbr>\n      • \u003cb>Theo cơ học lượng tử:\u003c/b> Vì electron là một \u003cb>sóng\u003c/b>, khi đập vào bậc thế năng hữu hạn $V_0$, hàm sóng không thể đứt gãy đột ngột về $0$ tại $x=0$. Nó sẽ \u003cb>thấm sâu vào bên trong vùng tường một đoạn ngắn theo quy luật hàm mũ suy giảm $e^{-k_2 x}$\u003c/b>! Và nếu bức tường đủ mỏng (chỉ dày vài Angstrom), cái đuôi sóng chưa kịp tắt hẳn đã chạm tới mặt bên kia của bức tường và tiếp tục truyền đi — tạo ra hiện tượng \u003cb>Xuyên hầm lượng tử (Quantum Tunneling)\u003c/b>!\n    \u003c/div>\n\n    \u003ch3>3.1. Bậc thế năng (Step Potential) khi $E \u003c V_0$\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>Vùng I ($x \\le 0$, nơi $V = 0$):\u003c/b> Gồm sóng tới ($A_1$) truyền theo chiều $+x$ và sóng phản xạ ($B_1$) truyền ngược lại theo chiều $-x$:\n        $$\\psi_1(x) = A_1 e^{jk_1 x} + B_1 e^{-jk_1 x} \\qquad \\text{với } k_1 = \\frac{\\sqrt{2mE}}{\\hbar}$$\n      \u003c/li>\n      \u003cli>\u003cb>Vùng II ($x \\ge 0$, bên trong bậc thế nơi $V = V_0 > E$):\u003c/b> Phương trình Schrödinger đổi dấu thành $\\frac{d^2\\psi_2}{dx^2} - k_2^2\\psi_2 = 0$, có nghiệm hàm mũ thực:\n        $$\\psi_2(x) = A_2 e^{-k_2 x} + B_2 e^{+k_2 x} \\qquad \\text{với } \\mathbf{k_2 = \\frac{\\sqrt{2m(V_0 - E)}}{\\hbar}}$$\n        Vì khi $x \\to +\\infty$, hàm sóng $\\psi_2(x)$ phải hữu hạn (không được bùng nổ ra vô cùng), nên bắt buộc hệ số của $e^{+k_2 x}$ phải bằng không ($\\mathbf{B_2 = 0}$). Vậy hàm sóng và mật độ xác suất trong vùng biên $x \\ge 0$ suy giảm theo hàm mũ:\n        \u003cdiv class=\"f\">\n          $$\\psi_2(x) = A_2 e^{-k_2 x} \\implies \\mathbf{|\\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}} \\implies \\mathbf{\\frac{|\\psi_2(x)|^2}{|\\psi_2(0)|^2} = e^{-2k_2 x}}$$\n        \u003c/div>\n      \u003c/li>\n    \u003c/ul>\n\n    \u003ch3>3.2. Mô hình tương tác: Sự đâm xuyên hàm mũ vào Bậc thế năng (Minh họa trực tiếp Câu 3)\u003c/h3>\n    \u003cp>Em hãy kéo thanh trượt chọn vị trí $x$ bên trong rào thế ($5\\text{ Å}, 15\\text{ Å}, 40\\text{ Å}$) với thông số mặc định $E = 2.8\\text{ eV}, V_0 = 3.5\\text{ eV}$ của \u003cb>Câu 3 Bài tập\u003c/b> để xem mật độ xác suất tương đối $\\frac{|\\psi_2(x)|^2}{|\\psi_2(0)|^2} = e^{-2k_2 x}$ giảm nhanh như thế nào:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Khoảng cách sâu trong vùng biên $x$ (\u003cspan id=\"val-step-x\">5\u003c/span> Å — Câu 3 hỏi tại 5 Å, 15 Å, 40 Å):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-step-x\" min=\"1\" max=\"45\" step=\"1\" value=\"5\" oninput=\"renderStepPotential()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Chiều cao bậc thế $V_0$ (\u003cspan id=\"val-step-v0\">3.5\u003c/span> eV | Động năng $E = 2.8$ eV):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-step-v0\" min=\"3.0\" max=\"6.0\" step=\"0.1\" value=\"3.5\" oninput=\"renderStepPotential()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"step-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"step-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n\n    \u003ch3>3.3. Rào thế chữ nhật bề rộng $a$ & Xác suất Xuyên hầm (Tunneling Probability $T$)\u003c/h3>\n    \u003cp>Nếu bức tường thế năng $V_0$ chỉ dày một đoạn hữu hạn từ $x = 0$ đến $x = a$ (còn phía bên kia bức tường $x > a$, thế năng lại trở về $V = 0$), thì tại mép phải $x = a$, biên độ hàm sóng vẫn còn khác không! Sóng thoát sang Vùng III ($x > a$) trở lại dạng sóng phẳng truyền đi: $\\psi_3(x) = A_3 e^{jk_1 x}$ (không có sóng phản xạ $B_3 e^{-jk_1 x}$ trong Vùng III vì hạt đã vượt qua rào đi ra xa vô tận không có gì chắn để bật ngược lại).\u003c/p>\n    \u003cp>Khi $E \\ll V_0$ (hoặc tích $k_2 a$ đủ lớn), \u003cb>Hệ số truyền qua hay Xác suất xuyên hầm $T$ (Tunneling probability)\u003c/b> được tính bằng công thức xấp xỉ chuẩn:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\mathbf{T \\approx 16\\left(\\frac{E}{V_0}\\right)\\left(1 - \\frac{E}{V_0}\\right)e^{-2k_2 a}} \\qquad \\text{với } k_2 = \\frac{\\sqrt{2m^*(V_0 - E)}}{\\hbar}$$\n    \u003c/div>\n\n    \u003ch3>3.4. Mô hình tương tác: Xuyên hầm Lượng tử trong GaAs vs. Silicon (Minh họa Câu 4 & Câu 5)\u003c/h3>\n    \u003cp>Trong chất bán dẫn, electron di chuyển như thể nó có một khối lượng mới gọi là \u003cb>Khối lượng hiệu dụng $m^*$ (Effective mass)\u003c/b>. Em hãy bấm chuyển đổi giữa 3 tab dưới đây để xem: (1) Vì sao electron trong $\\text{GaAs}$ ($m^*=0.067m_0$, rất nhẹ) xuyên hầm mạnh gấp hàng tỷ lần electron trong $\\text{Si}$ ($m^*=1.08m_0$, nặng hơn 16 lần) ở \u003cb>Câu 4\u003c/b>, và (2) Sơ đồ 3 vùng của giếng thế bất đối xứng ở \u003cb>Câu 5\u003c/b>:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"tunnel-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"selectTunnelTab('gaas', this)\">1. Câu 4a: Xuyên hầm trong GaAs (m* = 0.067 m₀ → T ≈ 12.0%)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectTunnelTab('si', this)\">2. Câu 4b: Xuyên hầm trong Silicon (m* = 1.08 m₀ → T ≈ 7.9×10⁻⁶)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectTunnelTab('q5', this)\">3. Câu 5: Giếng thế bất đối xứng (V₀ bên trái, ∞ bên phải)\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"tunnel-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"tunnel-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>4. Mở Rộng Cho Nguyên Tử 1-Electron (Hydro), Các Số Lượng Tử & Bảng Tuần Hoàn\u003c/h2>\n    \u003cp>Trong nguyên tử Hydro, 1 hạt electron (điện tích $-e$) chuyển động trong không gian 3 chiều xung quanh 1 hạt nhân proton đứng yên (điện tích $+e$) dưới tác dụng của thế năng hút tĩnh điện Coulomb:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$V(r) = -\\frac{e^2}{4\\pi\\epsilon_0 r}$$\n      \u003csmall>Trong đó: $r$ là khoảng cách từ electron đến hạt nhân; $\\epsilon_0 = 8.85 \\times 10^{-12}\\text{ F/m}$ là hằng số điện môi của chân không.\u003c/small>\n    \u003c/div>\n\n    \u003ch3>4.1. Bốn Số Lượng Tử $(n, l, m, s)$ và Mức năng lượng Nguyên tử Hydro\u003c/h3>\n    \u003cp>Vì thế năng $V(r)$ có tính đối xứng cầu, ta giải phương trình Schrödinger trong \u003cb>hệ tọa độ cầu $(r, \\theta, \\phi)$\u003c/b> bằng phương pháp tách biến $\\psi(r,\\theta,\\phi) = R(r)\\cdot\\Theta(\\theta)\\cdot\\Phi(\\phi)$. Điều kiện biên tuần hoàn và đơn trị của 3 hàm không gian sinh ra \u003cb>3 số lượng tử hình học $(n, l, m)$\u003c/b>, cộng thêm tính chất tự quay nội tại của electron sinh ra \u003cb>số lượng tử Spin $(s)$\u003c/b>:\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Địa chỉ chỗ ngồi trong Nhà hát Lớn\u003c/b>\u003cbr>\n      Mỗi electron trong nguyên tử đều có một \"vé chỗ ngồi\" gồm 4 thông số không ai được trùng ai (\u003cb>Nguyên lý loại trừ Pauli\u003c/b>):\u003cbr>\n      • \u003cb>Số lượng tử chính $n = 1, 2, 3, \\dots$\u003c/b> giống như \u003cb>Số Tầng lầu\u003c/b> (quyết định mức năng lượng $E_n$ và độ xa tính từ sân khấu hạt nhân).\u003cbr>\n      • \u003cb>Số lượng tử quỹ đạo/góc $l = 0, 1, 2, \\dots, (n-1)$\u003c/b> giống như \u003cb>Khu vực ghế (Hạng s, p, d, f)\u003c/b> trên tầng đó (quyết định hình dáng đám mây xác suất: $l=0$ là hình cầu $s$, $l=1$ là hình quả tạ đôi $p$).\u003cbr>\n      • \u003cb>Số lượng tử từ $m = -l, \\dots, 0, \\dots, +l$\u003c/b> giống như \u003cb>Số phòng/hướng ghế\u003c/b> trong khu vực đó (có $2l+1$ hướng trong không gian).\u003cbr>\n      • \u003cb>Số lượng tử Spin $s = +\\frac{1}{2}$ hoặc $-\\frac{1}{2}$\u003c/b> giống như trong mỗi phòng có đúng \u003cb>2 chiếc ghế đơn\u003c/b> (một ghế quay mặt lên $\\uparrow$, một ghế quay mặt xuống $\\downarrow$).\n    \u003c/div>\n\n    \u003cdiv class=\"tw\">\n      \u003ctable>\n        \u003ctr>\u003cth>Tên số lượng tử\u003c/th>\u003cth>Ký hiệu\u003c/th>\u003cth>Giá trị cho phép\u003c/th>\u003cth>Ý nghĩa vật lý trọng tâm\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>1. Số lượng tử chính\u003c/b>\u003cbr>(Principal)\u003c/td>\u003ctd>\u003cspan class=\"k b1\">$n$\u003c/span>\u003c/td>\u003ctd>$n = 1, 2, 3, \\dots$\u003c/td>\u003ctd>Xác định \u003cb>mức năng lượng\u003c/b> và bán kính trung bình của lớp vỏ (shell):\u003cbr>$$E_n = -\\frac{m_0 e^4}{(4\\pi\\epsilon_0)^2 2\\hbar^2 n^2} = -\\frac{13.58}{n^2}\\text{ eV}$$\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>2. Số lượng tử quỹ đạo / góc\u003c/b>\u003cbr>(Azimuthal / Angular)\u003c/td>\u003ctd>\u003cspan class=\"k b2\">$l$\u003c/span>\u003c/td>\u003ctd>$l = 0, 1, 2, \\dots, (n-1)$\u003c/td>\u003ctd>Xác định moment động lượng quỹ đạo và \u003cb>hình dạng đám mây orbital\u003c/b>:\u003cbr>$l=0 \\to s$; $l=1 \\to p$; $l=2 \\to d$; $l=3 \\to f$.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>3. Số lượng tử từ\u003c/b>\u003cbr>(Magnetic)\u003c/td>\u003ctd>\u003cspan class=\"k b3\">$m$\u003c/span>\u003c/td>\u003ctd>$m = -l, \\dots, 0, \\dots, +l$\u003cbr>($2l+1$ giá trị)\u003c/td>\u003ctd>Xác định \u003cb>sự định hướng không gian\u003c/b> của đám mây electron khi đặt trong từ trường ngoài (từ nghiệm $\\Phi(\\phi)=e^{jm\\phi}$ đơn trị).\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>4. Số lượng tử Spin\u003c/b>\u003cbr>(Electron Spin)\u003c/td>\u003ctd>\u003cspan class=\"k b4\">$s$\u003c/span>\u003c/td>\u003ctd>$s = +\\frac{1}{2}$ hoặc $-\\frac{1}{2}$\u003c/td>\u003ctd>Moment động lượng \u003cb>tự quay nội tại\u003c/b> của electron.\u003c/td>\u003c/tr>\n      \u003c/table>\n    \u003c/div>\n\n    \u003ch3>4.2. Mô hình tương tác: Mật độ xác suất xuyên tâm $P_{nl}(r)$, Bán kính Bohr $a_0$ & Bảng tuần hoàn\u003c/h3>\n    \u003cp>Ở trạng thái cơ bản thấp nhất ($n=1, l=0, m=0$), hàm sóng đối xứng cầu là $\\psi_{100} = \\frac{1}{\\sqrt{\\pi a_0^3}}e^{-r/a_0}$. Khoảng cách có xác suất tìm thấy electron cao nhất chính là \u003cb>Bán kính Bohr $a_0 = \\frac{4\\pi\\epsilon_0\\hbar^2}{m_0 e^2} \\approx 0.529\\text{ Å}$\u003c/b>. Hãy bấm vào các tab dưới đây để xem sự phân bố đám mây electron và quy tắc xếp electron vào Bảng tuần hoàn theo Nguyên lý loại trừ Pauli:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"atom-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"renderAtomSim('1s', this)\">1. Trạng thái cơ bản 1s (n=1, l=0 → Đỉnh tại r = a₀)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderAtomSim('2s', this)\">2. Trạng thái kích thích 2s (n=2, l=0 → Đỉnh chính ở r ≈ 5.2 a₀)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderAtomSim('pauli', this)\">3. Nguyên lý Pauli & Cấu hình electron (Si có 4 e hóa trị)\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"atom-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"atom-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>5. Cẩm Nang Công Thức Trọng Tâm Buổi 3 (Giải Nghĩa Chi Tiết)\u003c/h2>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 1: Sóng phẳng của Electron tự do ($V(x) = 0$)\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\Psi(x,t) = A\\,e^{j(kx - \\omega t)} \\quad \\Big| \\quad v_p = \\frac{\\omega}{|k|} \\quad \\Big| \\quad \\lambda = \\frac{2\\pi}{|k|} \\quad \\Big| \\quad p = \\hbar k \\quad \\Big| \\quad E = \\frac{p^2}{2m} = \\frac{\\hbar^2 k^2}{2m}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $k$: Số sóng ($\\text{m}^{-1}$ hoặc $\\text{rad/m}$). Nếu $k > 0$ sóng chạy theo chiều $+x$; nếu $k \u003c 0$ sóng chạy theo chiều $-x$.\u003cbr>\n          • $\\omega$: Tần số góc ($\\text{rad/s}$).\u003cbr>\n          • $v_p$: Vận tốc pha của sóng ($\\text{m/s}$).\u003cbr>\n          • $\\lambda$: Bước sóng de Broglie ($\\text{m}$ hoặc $\\text{Å}$).\u003cbr>\n          • $p$: Động lượng của hạt ($\\text{kg}\\cdot\\text{m/s}$); $E$: Động năng ($\\text{J}$ hoặc $\\text{eV}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Khi thế năng $V(x)=0$, nghiệm của phương trình Schrödinger là sóng điều hòa phẳng có số sóng $k$ tỉ lệ thuận với động lượng $p$.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Giải trực tiếp \u003cb>Câu 1\u003c/b> khi đề bài cho hàm sóng phẳng $\\Psi(x,t) = Ae^{j(kx-\\omega t)}$ biết $k$ và $\\omega$.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 2: Mức năng lượng & Hàm sóng trong Giếng thế Vô hạn 1 chiều\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$E_n = \\frac{n^2 \\pi^2 \\hbar^2}{2 m a^2} = \\frac{n^2 h^2}{8 m a^2} \\qquad \\text{và} \\qquad \\psi_n(x) = \\sqrt{\\frac{2}{a}}\\sin\\left(\\frac{n\\pi x}{a}\\right) \\quad (n = 1, 2, 3, \\dots)$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $E_n$: Mức năng lượng cho phép thứ $n$ ($\\text{J}$, chia cho $1.6 \\times 10^{-19}$ để đổi ra $\\text{eV}$).\u003cbr>\n          • $n = 1, 2, 3, \\dots$: Số lượng tử chính (số nguyên dương).\u003cbr>\n          • $a$: Chiều rộng của giếng thế (bắt buộc đổi từ $\\text{Å}$ sang mét: $1\\text{ Å} = 10^{-10}\\text{ m}$).\u003cbr>\n          • $m = 9.11 \\times 10^{-31}\\text{ kg}$: Khối lượng electron.\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Do hàm sóng phải triệt tiêu tại hai vách giếng $\\psi(0)=\\psi(a)=0$, nên chỉ những bước sóng thỏa mãn $k_n a = n\\pi$ mới tồn tại được. Lưu ý: Tính được $E_1$ rồi thì chỉ cần nhân $n^2$ ($E_2 = 4E_1$, $E_3 = 9E_1$)!\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài nói \u003ci>\"electron bị giam trong giếng thế vô hạn một chiều có chiều rộng $a$\"\u003c/i> (như \u003cb>Câu 2\u003c/b>).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 3: Độ suy giảm xác suất trong Bậc thế năng ($E \u003c V_0$)\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$k_2 = \\frac{\\sqrt{2m(V_0 - E)}}{\\hbar} \\qquad \\text{và} \\qquad \\frac{|\\psi_2(x)|^2}{|\\psi_2(0)|^2} = e^{-2k_2 x}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $V_0$: Chiều cao của rào thế bậc ($\\text{J}$, nhớ đổi từ $\\text{eV}$ sang $\\text{J}$ bằng cách nhân $1.6 \\times 10^{-19}$).\u003cbr>\n          • $E$: Động năng của hạt chiếu tới ($\\text{J}$).\u003cbr>\n          • $k_2$: Hệ số suy giảm biên độ trong vùng biên ($\\text{m}^{-1}$).\u003cbr>\n          • $x$: Khoảng cách tính từ mép biên đi sâu vào trong rào thế ($\\text{m}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Vì hàm sóng trong vùng $E \u003c V_0$ có dạng $\\psi_2(x) = A_2 e^{-k_2 x}$, nên mật độ xác suất $|\\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}$ (lưu ý có \u003cb>số 2\u003c/b> ở trên mũ $-2k_2 x$ do bình phương hàm sóng!).\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài yêu cầu tính \u003ci>\"xác suất tương đối tìm thấy electron tại khoảng cách $x$ bên trong vùng biên so với tại mép biên $x=0$\"\u003c/i> (như \u003cb>Câu 3\u003c/b>).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 4: Xác suất Xuyên hầm (Tunneling Probability $T$) qua Rào thế hình chữ nhật\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$T \\approx 16\\left(\\frac{E}{V_0}\\right)\\left(1 - \\frac{E}{V_0}\\right)e^{-2k_2 a} \\qquad \\text{với } k_2 = \\frac{\\sqrt{2 m^* (V_0 - E)}}{\\hbar}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $T$: Xác suất xuyên hầm (không có đơn vị, nằm từ $0$ đến $1$).\u003cbr>\n          • $a$: Chiều rộng (độ dày) của rào thế hình chữ nhật ($\\text{m}$).\u003cbr>\n          • $m^*$: Khối lượng hiệu dụng của hạt dẫn trong chất bán dẫn ($\\text{kg}$), ví dụ $m^* = 0.067 m_0$ hoặc $m^* = 1.08 m_0$ với $m_0 = 9.11 \\times 10^{-31}\\text{ kg}$.\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Đo tỷ lệ dòng hạt xuyên qua được bức tường thế năng có độ dày $a$ để sang vùng bên kia. Vì $k_2$ và $a$ nằm trên số mũ âm $e^{-2k_2 a}$, nên chỉ cần khối lượng $m^*$ hoặc bề rộng $a$ tăng lên một chút là xác suất xuyên hầm $T$ giảm đi cực mạnh!\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Giải các bài toán tìm \u003ci>\"xác suất xuyên hầm (tunneling probability)\"\u003c/i> qua rào thế chữ nhật (như \u003cb>Câu 4\u003c/b>).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>6. Bài Tập Trọng Tâm Buổi 3 (Có Gợi Ý & Giải Chi Tiết Từng Bước)\u003c/h2>\n    \u003cp>Dưới đây là toàn bộ 5 bài tập trong phiếu Bài tập Trọng tâm Buổi 3. Ở mỗi bước tính toán, thầy đều ghi chú thích màu xám giải thích rõ lý do biến đổi và cách đổi đơn vị để em tự học dễ dàng nhất.\u003c/p>\n\n    \u003c!-- CÂU 1 BUỔI 3 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b3-cau1\">Câu 1: Sóng phẳng của Electron trong Không gian Tự do\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Một electron trong không gian tự do được mô tả bởi hàm sóng dạng sóng phẳng (plane wave):\n      $$\\Psi(x,t) = A\\,e^{j(kx - \\omega t)}$$\n      a) Với $k = 8 \\times 10^8\\text{ m}^{-1}$, $\\omega = 8 \\times 10^{12}\\text{ rad/s}$, hãy xác định:\u003cbr>\n      &nbsp;&nbsp;1. Vận tốc pha (phase velocity) và bước sóng (wavelength).\u003cbr>\n      &nbsp;&nbsp;2. Động lượng và động năng của electron.\u003cbr>\n      b) Lặp lại với: $k = -1.5 \\times 10^9\\text{ m}^{-1}$, $\\omega = 1.5 \\times 10^{13}\\text{ rad/s}$.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b3-hint1')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b3-sol1')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-hint1\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Ý 1 (Vận tốc pha và Bước sóng):\u003c/b> Dùng công thức sóng cơ bản $v_p = \\frac{\\omega}{|k|}$ (hoặc xét dấu vận tốc pha từ phương trình $kx - \\omega t = \\text{const} \\implies v_p = \\frac{dx}{dt} = \\frac{\\omega}{k}$) và công thức bước sóng $\\lambda = \\frac{2\\pi}{|k|}$.\u003c/li>\n          \u003cli>\u003cb>Ý 2 (Động lượng và Động năng):\u003c/b> Dùng công thức lượng tử $p = \\hbar k$ (với $\\hbar = 1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$) và công thức động năng $E = \\frac{p^2}{2m_0} = \\frac{\\hbar^2 k^2}{2m_0}$ (nhớ đổi ra cả đơn vị $\\text{J}$ và $\\text{eV}$).\u003c/li>\n          \u003cli>\u003cb>Lưu ý ở câu b:\u003c/b> Khi $k = -1.5 \\times 10^9\\text{ m}^{-1} \u003c 0$, dấu trừ cho biết sóng phẳng và hạt electron đang chuyển động theo \u003cb>chiều âm của trục $x$ (hướng $-x$)\u003c/b>. Độ lớn bước sóng $\\lambda$ và động năng $E$ luôn dương!\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-sol1\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>a) Trường hợp 1: $k = 8 \\times 10^8\\text{ m}^{-1}$ và $\\omega = 8 \\times 10^{12}\\text{ rad/s}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1.1: Tính vận tốc pha (phase velocity $v_p$). Xét một điểm có pha sóng không đổi $kx - \\omega t = \\text{hằng số}$, lấy đạo hàm theo thời gian $t$ ta có $k\\frac{dx}{dt} - \\omega = 0 \\implies v_p = \\frac{dx}{dt} = \\frac{\\omega}{k}$:\u003c/span>\n          $$v_p = \\frac{\\omega}{k} = \\frac{8 \\times 10^{12}\\text{ rad/s}}{8 \\times 10^8\\text{ m}^{-1}} = \\mathbf{10^4\\text{ m/s}} \\quad (\\text{truyền theo chiều } +x)$$\n          \u003cspan class=\"cmt\">// Bước 1.2: Tính bước sóng $\\lambda$ từ số sóng $k$ theo công thức $\\lambda = \\frac{2\\pi}{k}$ (đổi thêm sang đơn vị $\\text{nm}$ và $\\text{Å}$):\u003c/span>\n          $$\\lambda = \\frac{2\\pi}{k} = \\frac{2\\pi}{8 \\times 10^8\\text{ m}^{-1}} \\approx \\mathbf{7.854 \\times 10^{-9}\\text{ m}} = 7.854\\text{ nm} = \\mathbf{78.54\\text{ Å}}$$\n          \u003cspan class=\"cmt\">// Bước 2.1: Tính động lượng $p$ của electron theo hệ thức de Broglie dạng thu gọn $p = \\hbar k$ (với $\\hbar = 1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$):\u003c/span>\n          $$p = \\hbar k = \\left(1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\right) \\times \\left(8 \\times 10^8\\text{ m}^{-1}\\right) = \\mathbf{8.432 \\times 10^{-26}\\text{ kg}\\cdot\\text{m/s}}$$\n          \u003cspan class=\"cmt\">// Bước 2.2: Tính động năng $E$ của electron từ động lượng $p$ và khối lượng nghỉ $m_0 = 9.11 \\times 10^{-31}\\text{ kg}$ theo công thức $E = \\frac{p^2}{2m_0}$:\u003c/span>\n          $$E = \\frac{p^2}{2m_0} = \\frac{\\left(8.432 \\times 10^{-26}\\text{ kg}\\cdot\\text{m/s}\\right)^2}{2 \\times \\left(9.11 \\times 10^{-31}\\text{ kg}\\right)} = \\frac{7.110 \\times 10^{-51}}{1.822 \\times 10^{-30}} \\approx \\mathbf{3.902 \\times 10^{-21}\\text{ J}}$$\n          \u003cspan class=\"cmt\">// Bước 2.3: Đổi động năng $E$ từ đơn vị Joule ($\\text{J}$) sang đơn vị chuẩn bán dẫn Electron-Volt ($\\text{eV}$) bằng cách chia cho $1.6 \\times 10^{-19}$:\u003c/span>\n          $$E = \\frac{3.902 \\times 10^{-21}\\text{ J}}{1.6 \\times 10^{-19}\\text{ J/eV}} \\approx \\mathbf{0.0244\\text{ eV}} = \\mathbf{24.4\\text{ meV}}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Trường hợp 2: $k = -1.5 \\times 10^9\\text{ m}^{-1}$ và $\\omega = 1.5 \\times 10^{13}\\text{ rad/s}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1.1: Nhận xét dấu của số sóng $k$: Vì $k \u003c 0$, pha sóng có dạng $-(1.5 \\times 10^9 x + 1.5 \\times 10^{13} t)$, nghĩa là sóng phẳng và hạt electron đang di chuyển ngược theo chiều âm của trục $x$ (hướng $-x$). Ta tính vận tốc pha:\u003c/span>\n          $$v_p = \\frac{\\omega}{k} = \\frac{1.5 \\times 10^{13}\\text{ rad/s}}{-1.5 \\times 10^9\\text{ m}^{-1}} = \\mathbf{-10^4\\text{ m/s}} \\quad \\left(\\text{độ lớn } |v_p| = 10^4\\text{ m/s}, \\text{ hướng theo chiều } -x\\right)$$\n          \u003cspan class=\"cmt\">// Bước 1.2: Tính bước sóng $\\lambda$ (bước sóng là độ dài hình học nên luôn lấy giá trị tuyệt đối $|k|$):\u003c/span>\n          $$\\lambda = \\frac{2\\pi}{|k|} = \\frac{2\\pi}{1.5 \\times 10^9\\text{ m}^{-1}} \\approx \\mathbf{4.189 \\times 10^{-9}\\text{ m}} = 4.189\\text{ nm} = \\mathbf{41.89\\text{ Å}}$$\n          \u003cspan class=\"cmt\">// Bước 2.1: Tính động lượng $p = \\hbar k$ (dấu âm thể hiện vector động lượng hướng theo chiều $-x$):\u003c/span>\n          $$p = \\hbar k = \\left(1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\right) \\times \\left(-1.5 \\times 10^9\\text{ m}^{-1}\\right) = \\mathbf{-1.581 \\times 10^{-25}\\text{ kg}\\cdot\\text{m/s}} \\quad \\left(|p| = 1.581 \\times 10^{-25}\\text{ kg}\\cdot\\text{m/s}\\right)$$\n          \u003cspan class=\"cmt\">// Bước 2.2: Tính động năng $E = \\frac{p^2}{2m_0}$ và đổi sang đơn vị $\\text{eV}$:\u003c/span>\n          $$E = \\frac{p^2}{2m_0} = \\frac{\\left(-1.581 \\times 10^{-25}\\text{ kg}\\cdot\\text{m/s}\\right)^2}{2 \\times \\left(9.11 \\times 10^{-31}\\text{ kg}\\right)} = \\frac{2.500 \\times 10^{-50}}{1.822 \\times 10^{-30}} \\approx \\mathbf{1.372 \\times 10^{-20}\\text{ J}}$$\n          $$E = \\frac{1.372 \\times 10^{-20}\\text{ J}}{1.6 \\times 10^{-19}\\text{ J/eV}} \\approx \\mathbf{0.0857\\text{ eV}} = \\mathbf{85.7\\text{ meV}}$$\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 2 BUỔI 3 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b3-cau2\">Câu 2: Ba Mức Năng Lượng Đầu Tiên Trong Giếng Thế Vô Hạn\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Một electron bị giam trong giếng thế vô hạn một chiều có chiều rộng: $a = 75\\text{ Å}$. Xác định ba mức năng lượng: $n = 1, 2, 3$.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b3-hint2')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b3-sol2')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-hint2\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Đổi bề rộng giếng thế từ Angstrom sang mét: $a = 75\\text{ Å} = 75 \\times 10^{-10}\\text{ m} = 7.5 \\times 10^{-9}\\text{ m}$.\u003c/li>\n          \u003cli>Áp dụng công thức năng lượng lượng tử hóa trong giếng thế vô hạn 1 chiều:\n            $$E_n = \\frac{n^2 \\pi^2 \\hbar^2}{2 m_0 a^2}$$\n          \u003c/li>\n          \u003cli>Tính thật chuẩn mức cơ bản $E_1$ (ứng với $n=1$) theo đơn vị $\\text{eV}$, sau đó suy ra nhanh $E_2 = 2^2 E_1 = 4E_1$ và $E_3 = 3^2 E_1 = 9E_
