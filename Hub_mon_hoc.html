<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub môn học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8ff;--card:#fff;--ink:#1d2350;--mut:#58608a;--g:#c9cfe8;--tint:#eaf0ff;--accent:#2f5bea;--danger:#c23a4b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142e;--card:#1a2046;--ink:#e8ebff;--mut:#9aa3d1;--g:#323a6e;--tint:#222a5c;--accent:#7f9bff;--danger:#ff7a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10142e;--card:#1a2046;--ink:#e8ebff;--mut:#9aa3d1;--g:#323a6e;--tint:#222a5c;--accent:#7f9bff;--danger:#ff7a8a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:36px 20px 80px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;margin-bottom:28px}
header.top h1{margin:0;font-size:clamp(30px,5vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
header.top p{margin:6px 0 0;color:var(--mut);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.search{width:200px;padding:9px 12px;border:1px solid var(--g);border-radius:10px;background:var(--card)}
.btn{border:1px solid var(--g);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--tint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tile{position:relative;background:var(--card);border:1px solid var(--g);border-radius:14px;display:flex;flex-direction:column}
.cover{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:132px;padding:16px 18px;background:var(--c);color:#fff;border-radius:13px 13px 0 0;cursor:pointer}
.cover:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.cover .ic{font-size:30px;line-height:1}
.cover .cd{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .body{padding:14px 18px 6px;flex:1}
.tile h3{margin:0 0 4px;font-size:17px;line-height:1.3}
.tile p{margin:0;color:var(--mut);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 18px 0;color:var(--mut);font-size:12.5px}
.chip{background:var(--tint);color:var(--ink);padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px}
.acts{display:flex;gap:8px;padding:12px 18px 16px;align-items:center}
.acts .btn.pri{flex:1}
details.more{position:relative}
details.more summary{list-style:none;border:1px solid var(--g);background:var(--card);border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;line-height:1.5}
details.more summary::-webkit-details-marker{display:none}
details.more summary:hover{background:var(--tint)}
.menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:20;min-width:210px;background:var(--card);border:1px solid var(--g);border-radius:12px;padding:6px;display:flex;flex-direction:column}
.menu button{all:unset;box-sizing:border-box;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--tint)}
.menu button.dng{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--g);margin:4px 2px;width:auto}
.empty{border:1.5px dashed var(--g);border-radius:14px;padding:44px 20px;text-align:center;color:var(--mut)}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:20px}
.dropnote{margin-top:26px;color:var(--mut);font-size:13px}
.dropveil{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--accent) 22%,transparent);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:800;pointer-events:none}
body.dragging .dropveil{display:flex}
#viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body.viewing #viewer{display:flex}
body.viewing .wrap{display:none}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--g);background:var(--card);flex-wrap:wrap}
.vbar .vt{font-weight:800;margin:0 auto 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#frame{flex:1;width:100%;border:0;background:#fff}
dialog{border:1px solid var(--g);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(560px,92vw);max-height:92vh}
dialog::backdrop{background:rgba(10,14,40,.55)}
dialog.wide{width:min(980px,96vw)}
.dh{padding:18px 20px 0}
.dh h2{margin:0;font-size:19px}
.db{padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.df{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13.5px}
label.f input,label.f select,label.f textarea{border:1px solid var(--g);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:400}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:90px 1fr;gap:12px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--g)}
.sw input:checked+span{border-color:var(--card);box-shadow:0 0 0 2.5px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.hint{color:var(--mut);font-size:12.5px;font-weight:400}
#code{width:100%;height:min(62vh,640px);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;white-space:pre;overflow:auto;tab-size:2;border:1px solid var(--g);border-radius:10px;padding:12px;background:var(--bg);resize:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (max-width:560px){.row,.row3{grid-template-columns:1fr}.search{width:100%}.tools{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Môn học</h1>
      <p id="count"></p>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Tìm môn…" aria-label="Tìm môn">
      <button class="btn" id="bBackup">Sao lưu</button>
      <button class="btn" id="bRestore">Khôi phục</button>
      <button class="btn pri" id="bAdd">Thêm môn</button>
    </div>
  </header>
  <main id="list"></main>
  <p class="dropnote">Kéo thả file .html vào trang này để thêm môn nhanh. Dữ liệu lưu trong trình duyệt đang dùng — nhớ bấm Sao lưu định kỳ.</p>
</div>

<section id="viewer" aria-label="Xem môn học">
  <div class="vbar">
    <button class="btn" id="vBack">‹ Hub</button>
    <span class="vt" id="vTitle"></span>
    <button class="btn" id="vCode">Sửa mã</button>
    <button class="btn" id="vTab">Tab mới</button>
    <button class="btn" id="vDl">Tải xuống</button>
  </div>
  <iframe id="frame" title="Nội dung môn học" sandbox="allow-scripts allow-popups allow-downloads allow-modals"></iframe>
</section>

<dialog id="fmDlg">
  <form method="dialog" id="fm">
    <div class="dh"><h2 id="fmTitle">Thêm môn</h2></div>
    <div class="db">
      <label class="f">Tên môn<input id="fName" required maxlength="120"></label>
      <div class="row3">
        <label class="f">Biểu tượng<input id="fIcon" maxlength="4" value="📘"></label>
        <label class="f">Mã môn<input id="fCode" maxlength="24" placeholder="vd. ENP2209"></label>
      </div>
      <label class="f">Mô tả ngắn<textarea id="fDesc" rows="2" maxlength="240"></textarea></label>
      <div class="row">
        <label class="f">Trạng thái
          <select id="fStatus"><option>Đang học</option><option>Ôn thi</option><option>Hoàn thành</option><option>Tạm dừng</option></select>
        </label>
        <div class="f">Màu <div class="sw" id="fSw"></div></div>
      </div>
      <label class="f">File HTML <input id="fFile" type="file" accept=".html,.htm,text/html">
        <span class="hint" id="fHint">Bỏ trống để tạo trang trống, rồi vào Sửa mã nguồn.</span></label>
    </div>
    <div class="df">
      <button class="btn" value="cancel" formnovalidate>Hủy</button>
      <button class="btn pri" id="fOk" value="ok">Lưu</button>
    </div>
  </form>
</dialog>

<dialog id="codeDlg" class="wide">
  <div class="dh"><h2 id="cTitle">Sửa mã nguồn</h2></div>
  <div class="db">
    <textarea id="code" spellcheck="false" wrap="off" aria-label="Mã HTML"></textarea>
    <span class="hint" id="cInfo"></span>
  </div>
  <div class="df">
    <button class="btn" id="cUndo">Khôi phục bản trước</button>
    <button class="btn" id="cCancel">Đóng</button>
    <button class="btn pri" id="cSave">Lưu</button>
  </div>
</dialog>

<dialog id="cfDlg">
  <div class="dh"><h2 id="cfTitle">Xác nhận</h2></div>
  <div class="db"><p id="cfMsg" style="margin:0"></p></div>
  <div class="df">
    <button class="btn" id="cfNo">Hủy</button>
    <button class="btn dng" id="cfYes">Đồng ý</button>
  </div>
</dialog>

<input type="file" id="pickReplace" accept=".html,.htm,text/html" hidden>
<input type="file" id="pickRestore" accept=".json,application/json" hidden>
<div class="dropveil">Thả file .html để thêm môn</div>
<div id="toast" role="status" aria-live="polite"></div>

ollapse:collapse;width:100%;font-size:15.5px;min-width:480px;line-height:1.75}td,th{padding:13px 14px;border-bottom:1px solid var(--g);text-align:left}th{color:var(--c5);font-weight:800;background:var(--tint)}\n.sum li{margin:12px 0}\n\n/* Interactive controls & exercise panels - Modern Pill & Segmented UI */\n.btn-group{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0 12px}\n.btn{appearance:none;-webkit-appearance:none;border:2px solid transparent;border-radius:999px;padding:12px 26px;font:700 15px/1.4 \"Be Vietnam Pro\",system-ui,sans-serif;cursor:pointer;transition:all .24s cubic-bezier(.2,.8,.2,1);display:inline-flex;align-items:center;justify-content:center;gap:10px;letter-spacing:0.01em;position:relative;overflow:hidden}\n.btn::before{content:\"\";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0.85;transition:transform .2s ease}\n.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}\n.btn:hover::before{transform:scale(1.3)}\n.btn:active{transform:translateY(0) scale(0.97)}\n.btn-hint{background:var(--tint);color:var(--ink);border-color:var(--c3);box-shadow:0 4px 14px rgba(245,159,0,.18)}\n.btn-hint::before{background:var(--c3);box-shadow:0 0 8px var(--c3)}\n.btn-hint:hover{background:linear-gradient(135deg,#fff3bf,#ffe066);color:#1d2350;box-shadow:0 8px 22px rgba(245,159,0,.32)}\n.btn-sol{background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;box-shadow:0 6px 18px rgba(112,72,232,.32)}\n.btn-sol::before{background:#fff;box-shadow:0 0 8px #fff}\n.btn-sol:hover{box-shadow:0 10px 26px rgba(112,72,232,.48)}\n\n.panel{display:none;margin-top:16px;padding:20px 22px;border-radius:14px;background:var(--tint);border:1px solid var(--g);line-height:1.95}\n.panel.open{display:block;animation:fadeIn .2s ease}\n@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}\n.step{margin:18px 0;padding-bottom:16px;border-bottom:1px dashed var(--g);line-height:1.95}\n.step:last-child{border-bottom:none;padding-bottom:0}\n.cmt{display:block;color:var(--mut);font-size:15px;line-height:1.85;font-style:italic;background:rgba(130,140,190,0.12);padding:11px 16px;border-radius:10px;margin:10px 0;border-left:3.5px solid var(--mut)}\n.formula-card{border:1px solid var(--g);border-radius:16px;padding:22px;margin:24px 0;background:var(--card)}\n.formula-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px;font-size:15.5px;line-height:1.9}\n.formula-meta div{background:var(--tint);padding:16px 18px;border-radius:12px}\n.sim-card{border:1px solid var(--g);border-radius:20px;padding:24px;margin:24px 0;background:var(--card);box-shadow:0 8px 28px rgba(0,0,0,.05)}\n\n/* Nút chọn chế độ mô hình (Segmented Pill Radio Buttons) */\n.sim-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:10px;background:var(--tint);border-radius:18px;border:1.5px solid var(--g)}\n.sim-tab{appearance:none;-webkit-appearance:none;flex:1 1 180px;border:1.5px solid var(--g);border-radius:14px;padding:12px 16px;background:var(--card);color:var(--ink);font:600 14.5px/1.45 \"Be Vietnam Pro\",system-ui,sans-serif;cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);text-align:left;display:flex;align-items:center;gap:11px;box-shadow:0 2px 6px rgba(0,0,0,.03)}\n.sim-tab::before{content:\"\";flex:0 0 16px;width:16px;height:16px;border-radius:50%;border:2px solid var(--mut);background:transparent;transition:all .2s ease;box-sizing:border-box}\n.sim-tab:hover{border-color:var(--c5);color:var(--c5);transform:translateY(-2px);box-shadow:0 6px 16px rgba(112,72,232,.14)}\n.sim-tab:hover::before{border-color:var(--c5);transform:scale(1.1)}\n.sim-tab:active{transform:translateY(0) scale(0.98)}\n.sim-tab.active{background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(112,72,232,.36);transform:translateY(-1px);font-weight:700}\n.sim-tab.active::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3.5px var(--c5)}\n\n.ctrl-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:center;margin:14px 0;background:var(--tint);padding:16px 18px;border-radius:16px;border:1.5px solid var(--g)}\n.ctrl-row label{font-size:14.5px;font-weight:700;display:block;margin-bottom:10px;color:var(--ink)}\n\n/* Bộ chọn danh sách thả xuống tùy chỉnh (Custom Dropdown Select) đồng bộ 100% giao diện */\nselect.native-select-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;border:0!important;opacity:0!important;pointer-events:none!important}\n.csel-wrap{position:relative;width:100%;user-select:none;font:600 14.5px/1.45 \"Be Vietnam Pro\",system-ui,sans-serif;z-index:5}\n.csel-wrap.open{z-index:45}\n.csel-trigger{appearance:none;-webkit-appearance:none;width:100%;padding:13px 46px 13px 18px;border-radius:14px;border:2px solid var(--c5);background:var(--card);color:var(--ink);font:600 14.5px/1.45 \"Be Vietnam Pro\",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .22s ease;box-shadow:0 4px 12px rgba(112,72,232,.1);position:relative;text-align:left}\n.csel-trigger::before{content:\"\";flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c5));margin-right:12px;box-shadow:0 0 0 3px var(--tint)}\n.csel-label{flex:1;overflow:hidden;text-overflow:ellipsis}\n.csel-trigger:hover{border-color:var(--c1);background:var(--tint);transform:translateY(-1px);box-shadow:0 6px 16px rgba(112,72,232,.18)}\n.csel-wrap.open .csel-trigger{border-color:var(--c1);background:var(--card);box-shadow:0 0 0 4px rgba(112,72,232,.22)}\n.csel-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;transition:all .25s ease;pointer-events:none}\n.csel-arrow::after{content:\"\";width:7px;height:7px;border-right:2.5px solid var(--c5);border-bottom:2.5px solid var(--c5);transform:translateY(-2px) rotate(45deg);transition:transform .25s ease}\n.csel-wrap.open .csel-arrow{background:var(--c5)}\n.csel-wrap.open .csel-arrow::after{border-color:#fff;transform:translateY(2px) rotate(-135deg)}\n.csel-menu{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:60;background:var(--card);border:2px solid var(--c5);border-radius:16px;padding:8px;box-shadow:0 14px 36px rgba(16,20,46,.28);display:none;max-height:280px;overflow-y:auto}\n.csel-wrap.open .csel-menu{display:block;animation:fadeIn .18s ease}\n.csel-opt{padding:11px 14px;border-radius:11px;color:var(--ink);cursor:pointer;transition:all .16s ease;margin:3px 0;line-height:1.45;display:flex;align-items:center;gap:10px}\n.csel-opt::before{content:\"\";flex:0 0 14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--g);transition:all .16s ease}\n.csel-opt:hover{background:var(--tint);color:var(--c5);padding-left:18px}\n.csel-opt:hover::before{border-color:var(--c5)}\n.csel-opt.selected{background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(112,72,232,.3)}\n.csel-opt.selected::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px var(--c5)}\n.menu-selector-wrap .csel-trigger{border:2px solid var(--c5);background:var(--tint);font-size:15px;font-weight:700}\n\ninput[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;background:var(--g);outline:none;margin:6px 0}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c5));border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}\ninput[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}\ninput[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c5));border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}\n\n/* Thanh cuộn dọc & ngang tùy chỉnh đồng bộ phong cách giao diện */\n*{scrollbar-width:thin;scrollbar-color:var(--c5) var(--tint)}\n::-webkit-scrollbar{width:9px;height:9px}\n::-webkit-scrollbar-track{background:var(--tint);border-radius:999px;margin:4px}\n::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--c1),var(--c5));border-radius:999px;border:2px solid var(--tint);transition:background .2s}\n::-webkit-scrollbar-thumb:hover{background:linear-gradient(135deg,var(--c5),var(--c4))}\n::-webkit-scrollbar-corner{background:transparent}\n.f::-webkit-scrollbar,.tw::-webkit-scrollbar,#mn::-webkit-scrollbar{height:6px;width:6px}\n.f::-webkit-scrollbar-thumb,.tw::-webkit-scrollbar-thumb,#mn::-webkit-scrollbar-thumb{border-width:1px}\n\n/* Top-Left Hamburger Menu & Lesson Selector */\n#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:30;width:46px;height:46px;border:0;border-radius:14px;background:var(--c5);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}\n#mb span{display:block;width:22px;height:3px;border-radius:2px;background:#fff;transition:transform .2s,opacity .2s}\n#mb[aria-expanded=true] span:nth-child(1){transform:translateY(8px) rotate(45deg)}#mb[aria-expanded=true] span:nth-child(2){opacity:0}#mb[aria-expanded=true] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}\n#mb:focus-visible,#mn a:focus-visible,#lesson-select:focus-visible{outline:3px solid var(--c3);outline-offset:2px}\n#mn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:14px;z-index:30;width:min(360px,calc(100vw - 28px));max-height:calc(100vh - 90px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 10px 34px rgba(0,0,0,.3);border:1px solid var(--g)}\n#mn[hidden]{display:none}\n.menu-selector-wrap{padding-bottom:12px;margin-bottom:10px;border-bottom:2px solid var(--g)}\n.menu-selector-wrap label{display:block;font-size:13px;font-weight:800;color:var(--c5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}\n#lesson-select{width:100%;padding:11px 40px 11px 14px;border-radius:12px;border:2px solid var(--c5);background-color:var(--tint);color:var(--ink);font:600 15px \"Be Vietnam Pro\",sans-serif;cursor:pointer}\n.toc-title{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:8px 0 4px;padding:0 8px}\n#toc-links a{display:block;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.4}\n#toc-links a:hover{background:var(--tint)}\n#toc-links a.sub{padding-left:24px;font-size:13.5px;color:var(--mut)}\n#toc-links a.grp{font-weight:600;margin-top:4px}\nsection,h3[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}\n\u003c/style>\n\u003c/head>\u003cbody>\n\n\u003c!-- Nút 3 gạch ở góc trên bên trái -->\n\u003cbutton id=\"mb\" type=\"button\" aria-label=\"Mở menu chọn bài và mục lục\" aria-expanded=\"false\" aria-controls=\"mn\">\n  \u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\n\u003c/button>\n\n\u003c!-- Menu điều hướng chứa bộ chọn bài học (On-demand loader) và mục lục bài đang mở -->\n\u003cnav id=\"mn\" hidden aria-label=\"Menu bài học và mục lục\">\n  \u003cdiv class=\"menu-selector-wrap\">\n    \u003clabel for=\"lesson-select\">Chọn buổi học cần tải:\u003c/label>\n    \u003cselect id=\"lesson-select\" onchange=\"loadLesson(this.value)\">\n      \u003coption value=\"1\">Buổi 1: Cấu trúc tinh thể chất rắn\u003c/option>\n      \u003coption value=\"2\">Buổi 2: Nhập môn Cơ học lượng tử (Phần 1)\u003c/option>\n      \u003coption value=\"3\">Buổi 3: Nhập môn Cơ học lượng tử (Phần 2)\u003c/option>\n      \u003coption value=\"4\">Buổi 4: Lý thuyết lượng tử chất rắn\u003c/option>\n      \u003coption value=\"5\" selected>Buổi 5: Bán dẫn ở trạng thái cân bằng\u003c/option>\n    \u003c/select>\n  \u003c/div>\n  \u003cdiv class=\"toc-title\">Mục lục bài đang mở\u003c/div>\n  \u003cdiv id=\"toc-links\">\u003c/div>\n\u003c/nav>\n\n\u003c!-- Khu vực chứa nội dung bài học được nạp động (chỉ giữ 1 bài trong DOM để chống lag) -->\n\u003cmain id=\"app-content\">\u003c/main>\n\n\u003ctemplate id=\"tpl-buoi-1\">\n  \u003cheader>\n    \u003cspan class=\"k b5\">HỌC PHẦN ENP2209 · BUỔI 1\u003c/span>\n    \u003ch1>Cấu Trúc Tinh Thể Của Chất Rắn\u003c/h1>\n    \u003cp class=\"mut\">Tài liệu tự học từ con số 0 dành cho sinh viên mất gốc Toán - Lý. Học qua mô hình tương tác trực quan, ví dụ ẩn dụ thực tế và giải bài tập từng bước không nhảy cóc.\u003c/p>\n  \u003c/header>\n\n  \u003csection>\n    \u003ch2>1. Bản Chất Vật Liệu Bán Dẫn & Các Loại Chất Rắn\u003c/h2>\n    \u003cp>Chào em! Nhiều bạn khi mới học Vật lý Bán dẫn thường thắc mắc: \u003ci>\"Tại sao học về con chip điện tử, dòng điện mà buổi đầu tiên lại phải học hình học không gian, đếm từng quả cầu nguyên tử trong chiếc hộp lập phương?\"\u003c/i>\u003c/p>\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Quy hoạch giao thông đô thị\u003c/b>\u003cbr>\n      Em hãy tưởng tượng các \u003cb>hạt electron\u003c/b> mang dòng điện giống như những \u003cb>chiếc xe máy\u003c/b>, còn các \u003cb>nguyên tử\u003c/b> đứng yên trong chất rắn là các \u003cb>tòa nhà\u003c/b>.\u003cbr>\n      • Nếu các tòa nhà xây tự phát, lộn xộn không theo quy hoạch, xe máy đi vào sẽ liên tục đâm vào tường, kẹt cứng — dòng điện chạy cực kỳ tệ.\u003cbr>\n      • Ngược lại, nếu các tòa nhà được quy hoạch thẳng tắp thành từng ô bàn cờ đều đặn từ đầu thành phố đến cuối thành phố, xe máy sẽ phóng êm ru trên các đại lộ rộng thoáng.\u003cbr>\n      Việc tìm hiểu \"quy hoạch đô thị của các nguyên tử\" chính là nghiên cứu \u003cb>Cấu trúc tinh thể\u003c/b> trong Buổi 1 này.\n    \u003c/div>\n\n    \u003ch3>1.1. Phân loại vật liệu bán dẫn\u003c/h3>\n    \u003cp>Xét về khả năng dẫn điện, chất bán dẫn nằm ở ranh giới giữa \u003cb>Kim loại\u003c/b> (dẫn điện rất tốt) và \u003cb>Chất cách điện\u003c/b> (chặn dòng điện). Điểm kỳ diệu của bán dẫn là ta có thể điều khiển nó chuyển từ trạng thái \"chặn dòng điện\" sang \"dẫn điện\" rất dễ dàng bằng nhiệt độ, ánh sáng hoặc pha thêm tạp chất. Trong môn học này, em cần nắm vững 2 nhóm bán dẫn chính:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cspan class=\"k b1\">Bán dẫn nguyên tố (Elemental)\u003c/span> Cấu tạo từ 1 nguyên tố duy nhất thuộc \u003cb>Nhóm IV\u003c/b> bảng tuần hoàn (có 4 electron lớp ngoài cùng): phổ biến nhất là \u003cb>Silicon ($\\text{Si}$)\u003c/b> và \u003cb>Germanium ($\\text{Ge}$)\u003c/b>.\u003c/li>\n      \u003cli>\u003cspan class=\"k b2\">Bán dẫn hợp chất (Compound)\u003c/span> Tạo thành khi ghép nguyên tố \u003cb>Nhóm III\u003c/b> với nguyên tố \u003cb>Nhóm V\u003c/b>:Hợp chất hai nguyên tố (nhị phân - binary) tiêu biểu nhất là \u003cb>Gallium Arsenide ($\\text{GaAs}$)\u003c/b> dùng làm đèn LED, laser và mạch cao tần. Ngoài ra còn có hợp chất ba nguyên tố (bậc ba - ternary) như $\\text{Al}_x\\text{Ga}_{1-x}\\text{As}$.\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>1.2. Mô hình trực quan: Ba loại chất rắn theo độ trật tự\u003c/h3>\n    \u003cp>Dựa vào kích thước của vùng không gian mà các nguyên tử xếp hàng đều đặn, người ta chia chất rắn thành 3 loại. Em hãy bấm vào từng nút trong mô hình dưới đây để quan sát sự khác biệt:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"solid-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"renderSolidModel('amorphous', this)\">1. Vô định hình (Amorphous)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderSolidModel('poly', this)\">2. Đa tinh thể (Polycrystalline)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderSolidModel('single', this)\">3. Đơn tinh thể (Single Crystal)\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"solid-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"solid-svg\" viewBox=\"0 0 680 230\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>2. Lưới Không Gian, Ô Đơn Vị & Các Cấu Trúc Lập Phương\u003c/h2>\n    \u003cp>Một tinh thể Silicon thực tế chứa hàng tỷ tỷ nguyên tử lặp đi lặp lại tuần hoàn trong không gian (gọi là \u003cb>mạng tinh thể - lattice\u003c/b>). Thay vì vẽ cả tỷ nguyên tử, ta đại diện vị trí mỗi nguyên tử bằng một dấu chấm gọi là \u003cb>điểm nút mạng (lattice point)\u003c/b> và chỉ cắt ra một \"chiếc hộp mẫu\" nhỏ gọi là \u003cb>Ô đơn vị (Unit cell)\u003c/b>.\u003c/p>\n    \u003cul>\n      \u003cli>\u003cb>Ô đơn vị (Unit cell):\u003c/b> Thể tích nhỏ của tinh thể mà khi ta dịch chuyển (copy - paste) lặp đi lặp lại theo 3 chiều không gian sẽ xây dựng lại được toàn bộ tinh thể.\u003c/li>\n      \u003cli>\u003cb>Ô nguyên thủy (Primitive cell):\u003c/b> Là ô đơn vị có thể tích nhỏ nhất. Tuy nhiên, ô nguyên thủy thường có các cạnh xiên góc rất khó tính toán, nên các kỹ sư thích dùng \u003cb>Ô đơn vị lập phương\u003c/b> (có 3 cạnh vuông góc bằng nhau và bằng \u003cb>hằng số mạng $a$\u003c/b>).\u003c/li>\n    \u003c/ul>\n\n    \u003cdiv class=\"box warn\">\n      \u003cb>Cảnh báo sống còn về đổi đơn vị trước khi làm bài tập:\u003c/b>\u003cbr>\n      Kích thước ô mạng $a$ hay bán kính nguyên tử $r$ luôn được cho bằng đơn vị \u003cb>Angstrom ($\\text{Å}$)\u003c/b>, nhưng mật độ nguyên tử lại luôn tính trên mỗi \u003cb>centimet khối ($\\text{cm}^3$)\u003c/b> hoặc \u003cb>centimet vuông ($\\text{cm}^2$)\u003c/b>.\u003cbr>\n      Công thức bắt buộc phải thuộc lòng:\u003cbr>\n      $$1\\text{ Å} = 10^{-10}\\text{ m} = 10^{-8}\\text{ cm}$$\n      Khi tính diện tích mặt ($a^2$) thì nhân thêm $(10^{-8})^2 = 10^{-16}\\text{ cm}^2$. Khi tính thể tích khối ($a^3$) thì nhân thêm $(10^{-8})^3 = 10^{-24}\\text{ cm}^3$.\n    \u003c/div>\n\n    \u003ch3>2.1. Mô hình tương tác: Phép tịnh tiến mạng và Ô đơn vị 2D\u003c/h3>\n    \u003cp>Trong không gian 2 chiều (hoặc 3 chiều), mọi điểm nút mạng đều có thể đi tới từ gốc tọa độ bằng công thức vector tịnh tiến:\n      $$\\vec{r} = p\\vec{a} + q\\vec{b} + s\\vec{c}$$\n      Trong đó $p, q, s$ là các số nguyên chỉ số bước nhảy. Hãy kéo thử hai thanh trượt $p$ và $q$ dưới đây để xem cách tạo ra mạng tinh thể và các cách chọn Ô đơn vị A, B, C, D:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Số bước nhảy theo vector $\\vec{a}$ ($p = $ \u003cspan id=\"val-p\">2\u003c/span>):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-p\" min=\"0\" max=\"4\" step=\"1\" value=\"2\" oninput=\"renderLattice2D()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Số bước nhảy theo vector $\\vec{b}$ ($q = $ \u003cspan id=\"val-q\">1\u003c/span>):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-q\" min=\"0\" max=\"3\" step=\"1\" value=\"1\" oninput=\"renderLattice2D()\">\n        \u003c/div>\n      \u003c/div>\n      \u003csvg id=\"lattice2d-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n      \u003cp class=\"mut\" style=\"font-size:14.5px;margin-top:6px\">Ghi chú trên hình: Các ô màu xanh nhạt (Ô đơn vị C hình bình hành, hoặc Ô chữ nhật lớn) đều có thể dùng làm \"viên gạch mẫu\" để lát kín toàn bộ mặt phẳng.\u003c/p>\n    \u003c/div>\n\n    \u003ch3>2.2. Quy tắc đếm số nguyên tử hiệu dụng trong 1 Ô đơn vị\u003c/h3>\n    \u003cp>Hãy tưởng tượng ô đơn vị lập phương là một căn phòng có 6 bức tường và 8 góc phòng. Các quả cầu nguyên tử nằm ở ranh giới sẽ bị chia sẻ với các phòng hàng xóm:\u003c/p>\n    \u003cul>\n      \u003cli>\u003cspan class=\"k b1\">Nguyên tử ở Đỉnh góc (Corner)\u003c/span> Giao điểm của 8 căn phòng lập phương (4 phòng tầng dưới, 4 phòng tầng trên). Mỗi ô đơn vị chỉ sở hữu \u003cb>$\\frac{1}{8}$ nguyên tử\u003c/b>.\u003c/li>\n      \u003cli>\u003cspan class=\"k b2\">Nguyên tử ở Tâm mặt (Face-centered)\u003c/span> Nằm trên bức tường chung của 2 căn phòng. Mỗi ô đơn vị sở hữu một nửa, tức \u003cb>$\\frac{1}{2}$ nguyên tử\u003c/b>.\u003c/li>\n      \u003cli>\u003cspan class=\"k b4\">Nguyên tử nằm Trong ruột (Body / Interior)\u003c/span> Nằm hoàn toàn bên trong căn phòng, không chia sẻ cho ai. Ô đơn vị sở hữu trọn vẹn \u003cb>$1$ nguyên tử\u003c/b>.\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>2.3. Mô hình 3D xoay được: 5 Cấu trúc Tinh thể Quan trọng\u003c/h3>\n    \u003cp>Em hãy chọn từng loại cấu trúc và \u003cb>kéo thanh trượt góc xoay 3D\u003c/b> để quan sát rõ vị trí các nguyên tử cũng như các đường chéo tiếp xúc:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"crystal-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"selectCrystal('sc', this)\">1. Lập phương đơn giản (SC)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectCrystal('bcc', this)\">2. Tâm khối (BCC)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectCrystal('fcc', this)\">3. Tâm mặt (FCC)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectCrystal('diamond', this)\">4. Kim cương (Si, Ge)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectCrystal('zinc', this)\">5. Zincblende (GaAs)\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Xoay góc nhìn ngang 3D (\u003cspan id=\"val-rot\">32\u003c/span> độ):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-rot\" min=\"-60\" max=\"60\" value=\"32\" oninput=\"renderCrystal3D()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Độ nghiêng nhìn từ trên xuống (\u003cspan id=\"val-tilt\">22\u003c/span> độ):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-tilt\" min=\"5\" max=\"45\" value=\"22\" oninput=\"renderCrystal3D()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"box\" id=\"crystal-info\">\u003c/div>\n      \u003csvg id=\"crystal-svg\" viewBox=\"0 0 680 320\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>3. Mặt Phẳng Tinh Thể, Chỉ Số Miller $(hkl)$ & Phương Hướng $[hkl]$\u003c/h2>\n    \u003cp>Trong công nghệ sản xuất chip, thỏi tinh thể Silicon được cưa thành từng lát mỏng (wafer). Bề mặt lát cắt quyết định trực tiếp đến số lượng nguyên tử lộ ra và tốc độ di chuyển của electron trên bề mặt chip. Để gọi tên chính xác từng mặt cắt và hướng trong tinh thể, người ta dùng \u003cb>Chỉ số Miller\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"box tip\">\n      \u003cb>Quy trình 4 bước tìm Chỉ số Miller $(hkl)$ cho mặt phẳng:\u003c/b>\n      \u003col>\n        \u003cli>\u003cb>Bước 1 (Tìm điểm cắt theo $a$):\u003c/b> Xác định mặt phẳng cắt 3 trục tọa độ tại vị trí bằng bao nhiêu lần hằng số mạng $a$: ký hiệu bộ 3 điểm cắt là $(p, q, s)$. Nếu mặt phẳng song song với trục nào thì điểm cắt với trục đó ở vô cùng ($\\infty$).\u003c/li>\n        \u003cli>\u003cb>Bước 2 (Lấy nghịch đảo):\u003c/b> Viết nghịch đảo của 3 điểm cắt: $\\left(\\frac{1}{p}, \\frac{1}{q}, \\frac{1}{s}\\right)$. Nhờ bước này, mặt phẳng song song với trục ($\\infty$) sẽ có nghịch đảo $\\frac{1}{\\infty} = 0$, giúp loại bỏ hoàn toàn số vô cùng!\u003c/li>\n        \u003cli>\u003cb>Bước 3 (Quy đồng khử mẫu):\u003c/b> Nhân cả 3 phân số với Bội chung nhỏ nhất của các mẫu số để thu được 3 số nguyên nhỏ nhất $h, k, l$.\u003c/li>\n        \u003cli>\u003cb>Bước 4 (Viết ký hiệu):\u003c/b> Đặt 3 số nguyên trong ngoặc tròn không có dấu phẩy: \u003cb>$(hkl)$\u003c/b>. Còn nếu đặt trong ngoặc vuông \u003cb>$[hkl]$\u003c/b> thì đó là \u003cb>vector hướng\u003c/b> vuông góc với mặt phẳng $(hkl)$!\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n\n    \u003ch3>3.1. Mô hình tương tác: Mặt phẳng Miller $(hkl)$, Hướng $[hkl]$ & Thiết diện cắt 2D\u003c/h3>\n    \u003cp>Nhiều bạn khi tính \u003cb>mật độ nguyên tử trên bề mặt (surface density)\u003c/b> rất hay nhầm lẫn vì không tưởng tượng được khi lấy con dao cắt theo mặt $(100)$, $(110)$ hay $(111)$ thì mặt cắt trông như thế nào và cắt qua mấy phần nguyên tử. Hãy bấm vào các nút dưới đây để nhìn cả \u003cb>Khối 3D bên trái\u003c/b> lẫn \u003cb>Mặt cắt phẳng 2D bên phải\u003c/b>:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"miller-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"renderMiller('100', this)\">Mặt (100) & Hướng [100]\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderMiller('110', this)\">Mặt (110) & Hướng [110]\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderMiller('111', this)\">Mặt (111) & Hướng [111]\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderMiller('634', this)\">Mặt (634) - Minh họa Câu 2\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\" id=\"miller-lattice-ctrl\">\n        \u003cdiv>\n          \u003clabel>Chọn loại mạng để đếm nguyên tử trên mặt cắt 2D:\u003c/label>\n          \u003cselect id=\"miller-lat-type\" onchange=\"renderMiller(currentMillerPlane)\">\n            \u003coption value=\"fcc\" selected>Mạng Lập phương Tâm mặt (FCC - dùng cho Câu 3)\u003c/option>\n            \u003coption value=\"bcc\">Mạng Lập phương Tâm khối (BCC - Ví dụ 1.3)\u003c/option>\n            \u003coption value=\"sc\">Mạng Lập phương Đơn giản (SC)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"miller-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"miller-svg\" viewBox=\"0 0 680 280\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>4. Liên Kết Nguyên Tử, Khuyết Tật Mạng, Pha Tạp & Nuôi Tinh Thể\u003c/h2>\n    \u003ch3>4.1. Bốn loại liên kết nguyên tử trong chất rắn\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>Liên kết Ion (Ionic bond):\u003c/b> Giữa nguyên tử Nhóm I (dễ nhường 1 electron thành ion dương, như $\\text{Na}^+$) và Nhóm VII (dễ nhận 1 electron thành ion âm, như $\\text{Cl}^-$). Hai ion trái dấu hút nhau bằng lực tĩnh điện Coulomb tạo thành muối ăn $\\text{NaCl}$.\u003c/li>\n      \u003cli>\u003cb>Liên kết Kim loại (Metallic bond):\u003c/b> Các nguyên tử kim loại góp chung electron hóa trị tạo thành một \"biển electron tự do\" bao quanh các ion dương đứng yên.\u003c/li>\n      \u003cli>\u003cb>Liên kết Van der Waals:\u003c/b> Lực hút cực yếu giữa các phân tử có sự lệch tâm điện tích (lưỡng cực điện).\u003c/li>\n      \u003cli>\u003cb>Liên kết Cộng hóa trị (Covalent bond - Quan trọng nhất với Bán dẫn):\u003c/b> Mỗi nguyên tử Silicon (Nhóm IV) có \u003cb>4 electron hóa trị\u003c/b>. Nó đứng ở tâm tứ diện và đưa 4 electron này ra \"góp gạo thổi cơm chung\" với 4 nguyên tử $\\text{Si}$ hàng xóm gần nhất. Mỗi cặp nguyên tử dùng chung 2 electron, giúp mỗi nguyên tử $\\text{Si}$ có đủ 8 electron lớp vỏ ngoài cùng bền vững.\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>4.2. Mô hình tương tác: Liên kết Cộng hóa trị & Pha tạp (Doping) trong Silicon\u003c/h3>\n    \u003cp>Kỹ thuật thêm một lượng nhỏ nguyên tử ngoại lai vào bán dẫn để thay đổi tính chất điện gọi là \u003cb>Pha tạp (Doping)\u003c/b> (thực hiện bằng phương pháp \u003ci>Khuếch tán nhiệt ở $\\approx 1000^\\circ\\text{C}$\u003c/i> hoặc \u003ci>Bắn phá Cấy ion năng lượng cao $\\approx 50\\text{ keV}$ rồi ủ nhiệt\u003c/i>). Hãy bấm vào mô hình dưới đây để xem điều gì xảy ra khi thay 1 nguyên tử $\\text{Si}$ ở giữa bằng tạp chất:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"doping-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"renderBonding('pure', this)\">1. Silicon tinh khiết (Đủ 8 e liên kết)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderBonding('ntype', this)\">2. Pha tạp Phosphorus - Nhóm V (Dư 1 electron)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderBonding('ptype', this)\">3. Pha tạp Boron - Nhóm III (Thiếu 1 e / Tạo lỗ trống)\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"doping-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"doping-svg\" viewBox=\"0 0 680 260\">\u003c/svg>\n    \u003c/div>\n\n    \u003ch3>4.3. Mô hình trực quan: Các loại Khuyết tật mạng tinh thể (Imperfections)\u003c/h3>\n    \u003cp>Không có tinh thể thực tế nào hoàn hảo tuyệt đối. Ngoài việc các nguyên tử luôn \u003cb>dao động nhiệt (lattice vibrations)\u003c/b> quanh vị trí cân bằng khi nhiệt độ $T > 0\\text{ K}$, mạng tinh thể còn có các khuyết tật điểm và khuyết tật đường như hình vẽ dưới đây:\u003c/p>\n    \u003csvg id=\"defect-svg\" viewBox=\"0 0 680 230\">\u003c/svg>\n\n    \u003ch3>4.4. Mô hình tương tác: Công nghệ kéo đơn tinh thể Czochralski & Epitaxy\u003c/h3>\n    \u003cp>Làm sao người ta biến cát thạch anh thành thỏi Silicon đơn tinh thể tinh khiết tới mức cứ $10^{10}$ nguyên tử Silicon mới có dưới $1$ nguyên tử tạp chất lạ? Phương pháp nổi tiếng nhất là \u003cb>Kéo tinh thể từ chất lỏng nóng chảy Czochralski\u003c/b>:\u003c/p>\n    \u003cul>\n      \u003cli>Người ta nung chảy Silicon trong nồi nung (Crucible), sau đó nhúng một mẩu \u003cb>tinh thể mầm (Seed crystal)\u003c/b> đơn tinh thể vào mặt chất lỏng rồi vừa xoay nhẹ vừa kéo từ từ lên.\u003c/li>\n      \u003cli>Nếu cần làm sạch thêm, người ta dùng kỹ thuật \u003cb>Tinh luyện vùng (Zone refining)\u003c/b>: cho cuộn dây nhiệt cao tần chạy dọc thỏi Silicon để vùng nóng chảy cuốn toàn bộ tạp chất dồn về đuôi thỏi rồi cắt bỏ.\u003c/li>\n      \u003cli>Sau đó thỏi Silicon (boule) được mài vát một mặt phẳng định hướng, cưa thành từng đĩa mỏng, ăn mòn hóa học và đánh bóng thành tấm \u003cb>Wafer (Đế / Substrate)\u003c/b>. Trên mặt Wafer, người ta có thể nuôi tiếp các lớp đơn tinh thể siêu mỏng gọi là \u003cb>Lớp Epitaxy\u003c/b> (bằng phương pháp bốc hơi hóa học \u003ci>CVD\u003c/i>, pha lỏng \u003ci>LPE\u003c/i> hoặc chùm tia phân tử \u003ci>MBE\u003c/i>).\u003c/li>\n    \u003c/ul>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Kéo thanh trượt để nâng mầm tinh thể Czochralski lên (\u003cspan id=\"val-cz\">45\u003c/span>% hành trình):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-cz\" min=\"5\" max=\"95\" value=\"45\" oninput=\"renderCzochralski()\">\n        \u003c/div>\n      \u003c/div>\n      \u003csvg id=\"cz-svg\" viewBox=\"0 0 680 260\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>5. Cẩm Nang Công Thức Trọng Tâm (Giải Nghĩa Chi Tiết)\u003c/h2>\n    \u003cp>Dưới đây là toàn bộ các công thức của Buổi 1 được giải thích rõ từng ký hiệu, đơn vị, bản chất vật lý và dấu hiệu nhận biết khi làm bài tập:\u003c/p>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 1: Mật độ nguyên tử theo thể tích ($N$ hoặc Volume Density)\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$N = \\frac{n_{\\text{cell}}}{V_{\\text{cell}}} = \\frac{n_{\\text{cell}}}{a^3}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $N$: Mật độ nguyên tử khối ($\\text{atoms/cm}^3$ hoặc $\\text{\\#/cm}^3$).\u003cbr>\n          • $n_{\\text{cell}}$: Số nguyên tử hiệu dụng nằm trong 1 ô đơn vị:\u003cbr>\n          &nbsp;&nbsp;+ Lập phương đơn giản (SC): $n_{\\text{cell}} = 1$\u003cbr>\n          &nbsp;&nbsp;+ Lập phương tâm khối (BCC): $n_{\\text{cell}} = 2$\u003cbr>\n          &nbsp;&nbsp;+ Lập phương tâm mặt (FCC): $n_{\\text{cell}} = 4$\u003cbr>\n          &nbsp;&nbsp;+ Kim cương ($\\text{Si}, \\text{Ge}$) & Zincblende ($\\text{GaAs}$): $n_{\\text{cell}} = 8$\u003cbr>\n          • $a$: Hằng số mạng, bắt buộc đổi ra $\\text{cm}$ ($1\\text{ \\AA} = 10^{-8}\\text{ cm}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Vì toàn bộ tinh thể là sự lặp lại của ô đơn vị, nên mật độ nguyên tử của toàn khối chính bằng số nguyên tử trong 1 chiếc hộp mẫu chia cho thể tích chiếc hộp đó ($a^3$).\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài yêu cầu tính \u003ci>\"Mật độ nguyên tử theo thể tích (volume density)\"\u003c/i>, hoặc cần tìm số nguyên tử trong $1\\text{ cm}^3$ làm bước đệm để tính khối lượng riêng và mật độ electron hóa trị.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 2: Khối lượng riêng của tinh thể ($\\rho$ hoặc Mass Density)\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\rho = \\frac{N \\cdot M_A}{N_A} = \\frac{n_{\\text{cell}} \\cdot M_A}{a^3 \\cdot N_A}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $\\rho$: Khối lượng riêng ($\\text{g/cm}^3$).\u003cbr>\n          • $N$: Mật độ nguyên tử theo thể tích ($\\text{atoms/cm}^3$).\u003cbr>\n          • $M_A$: Khối lượng mol nguyên tử ($\\text{g/mol}$). Với Silicon, $M_A = 28.09\\text{ g/mol}$.\u003cbr>\n          • $N_A = 6.022 \\times 10^{23}\\text{ atoms/mol}$: Hằng số Avogadro.\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> $1\\text{ mol}$ chất nặng $M_A$ gam và chứa $N_A$ nguyên tử, suy ra 1 nguyên tử nặng $\\frac{M_A}{N_A}$ gam. Nhân khối lượng 1 nguyên tử với số nguyên tử trong $1\\text{ cm}^3$ ($N$) ta thu được cân nặng của $1\\text{ cm}^3$ vật liệu ($\\rho$).\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài hỏi \u003ci>\"Khối lượng riêng ($\\text{g/cm}^3$)\"\u003c/i>.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 3: Quan hệ giữa Bán kính nguyên tử ($r$), Khoảng cách gần nhất ($d_{\\text{min}}$) và Hằng số mạng ($a$)\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\text{SC: } a = 2r \\quad \\big| \\quad \\text{BCC: } a\\sqrt{3} = 4r \\quad \\big| \\quad \\text{FCC: } a\\sqrt{2} = 4r \\quad \\big| \\quad \\text{Kim cương (Si): } d_{\\text{min}} = \\frac{a\\sqrt{3}}{4} = 2r$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $r$: Bán kính hiệu dụng của quả cầu nguyên tử ($\\text{Å}$ hoặc $\\text{cm}$).\u003cbr>\n          • $d_{\\text{min}}$: Khoảng cách từ tâm một nguyên tử đến tâm nguyên tử hàng xóm gần nhất ($\\text{Å}$). Khi hai quả cầu cứng tiếp xúc nhau thì $d_{\\text{min}} = 2r$.\u003cbr>\n          • $a\\sqrt{2}$: Độ dài đường chéo mặt hình vuông cạnh $a$.\u003cbr>\n          • $a\\sqrt{3}$: Độ dài đường chéo chính xuyên tâm khối lập phương cạnh $a$.\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Các quả cầu nguyên tử chạm nhau dọc theo hướng xếp chặt nhất: SC chạm trên cạnh ($a=2r$), FCC chạm trên đường chéo mặt ($a\\sqrt{2}=4r$), BCC chạm trên đường chéo khối ($a\\sqrt{3}=4r$), còn Kim cương ($\\text{Si}$) chạm nhau ở vị trí $\\frac{1}{4}$ đường chéo khối ($d_{\\text{min}} = \\frac{a\\sqrt{3}}{4}$).\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Khi đề bài cho bán kính $r$ bắt tìm $a$ (như Câu 3) hoặc cho $a$ bắt tìm khoảng cách gần nhất giữa 2 nguyên tử (như Câu 1a).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 4: Mật độ nguyên tử trên bề mặt ($N_s$) & Khoảng cách giữa các mặt phẳng ($d_{hkl}$)\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$N_s = \\frac{n_{\\text{plane}}}{S_{\\text{plane}}} \\qquad \\text{và} \\qquad d_{hkl} = \\frac{a}{\\sqrt{h^2 + k^2 + l^2}}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $N_s$: Mật độ nguyên tử trên bề mặt ($\\text{atoms/cm}^2$ hoặc $\\text{\\#/cm}^2$).\u003cbr>\n          • $n_{\\text{plane}}$: Số hình tròn nguyên tử hiệu dụng nằm trong phạm vi hình phẳng cắt qua ô đơn vị.\u003cbr>\n          • $S_{\\text{plane}}$: Diện tích của hình phẳng đó ($\\text{cm}^2$):\u003cbr>\n          &nbsp;&nbsp;+ Mặt $(100)$: Hình vuông cạnh $a \\implies S_{100} = a^2$.\u003cbr>\n          &nbsp;&nbsp;+ Mặt $(110)$: Hình chữ nhật cạnh $a$ và $a\\sqrt{2} \\implies S_{110} = a^2\\sqrt{2}$.\u003cbr>\n          &nbsp;&nbsp;+ Mặt $(111)$: Tam giác đều cạnh $a\\sqrt{2} \\implies S_{111} = \\frac{\\sqrt{3}}{2}a^2$.\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Tương tự mật độ thể tích, nhưng tính trong không gian 2 chiều (lấy số nguyên tử trên mặt cắt chia cho diện tích mặt cắt). Công thức $d_{hkl}$ tính khoảng cách hình học từ gốc tọa độ đến mặt phẳng $(hkl)$ gần nhất.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Giải các bài toán về mặt phẳng tinh thể $(100), (110), (111)$ (như Câu 3b, 3c, 3d).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>6. Bài Tập Trọng Tâm Buổi 1 (Có Gợi Ý & Giải Chi Tiết Từng Bước)\u003c/h2>\n    \u003cp>Em hãy đọc kỹ đề bài, bấm vào \u003cb>Xem Gợi ý\u003c/b> để tự nháp trước, sau đó mở \u003cb>Xem Lời giải chi tiết\u003c/b>. Ở mỗi bước biến đổi, thầy đều viết ghi chú màu xám giải thích rõ lý do tại sao lại làm như vậy.\u003c/p>\n\n    \u003c!-- CÂU 1 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-cau1\">Câu 1: Khoảng cách nguyên tử, Mật độ và Khối lượng riêng của Silicon\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Hằng số mạng của silicon là $a = 5.34\\text{ Å}$. Hãy tính:\u003cbr>\n      a) Khoảng cách từ tâm một nguyên tử $\\text{Si}$ đến tâm nguyên tử $\\text{Si}$ lân cận gần nhất.\u003cbr>\n      b) Mật độ nguyên tử của silicon ($\\text{\\#/cm}^3$).\u003cbr>\n      c) Khối lượng riêng của silicon ($\\text{g/cm}^3$).\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('hint1')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('sol1')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"hint1\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Ý a:\u003c/b> Silicon có cấu trúc tinh thể \u003cb>Kim cương (Diamond)\u003c/b>. Trong cấu trúc này, nguyên tử nằm trong ruột khối tứ diện con cách đỉnh góc một đoạn bằng đúng $\\frac{1}{4}$ đường chéo chính của khối lập phương lớn. Ta dùng công thức $d_{\\text{min}} = \\frac{a\\sqrt{3}}{4}$.\u003c/li>\n          \u003cli>\u003cb>Ý b:\u003c/b> Đếm số nguyên tử hiệu dụng trong 1 ô đơn vị mạng Kim cương ($n_{\\text{cell}} = 8$). Đổi hằng số mạng $a$ từ $\\text{Å}$ sang $\\text{cm}$ ($1\\text{ Å} = 10^{-8}\\text{ cm}$), rồi dùng công thức $N = \\frac{n_{\\text{cell}}}{a^3}$.\u003c/li>\n          \u003cli>\u003cb>Ý c:\u003c/b> Tra nguyên tử khối của Silicon là $M_A = 28.09\\text{ g/mol}$ và hằng số Avogadro $N_A = 6.022 \\times 10^{23}\\text{ atoms/mol}$. Dùng công thức khối lượng riêng $\\rho = \\frac{N \\cdot M_A}{N_A}$.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"sol1\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>a) Khoảng cách từ tâm một nguyên tử $\\text{Si}$ đến tâm nguyên tử $\\text{Si}$ lân cận gần nhất:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Xác định vị trí nguyên tử trong mạng Kim cương của Silicon. Nếu chọn nguyên tử góc ở gốc tọa độ $(0, 0, 0)$, thì nguyên tử lân cận gần nó nhất nằm ở tâm khối lập phương con thứ nhất có tọa độ $\\left(\\frac{a}{4}, \\frac{a}{4}, \\frac{a}{4}\\right)$.\u003c/span>\n          \u003cspan class=\"cmt\">// Bước 2: Áp dụng định lý Pythagore trong không gian 3 chiều để tính khoảng cách $d$ từ điểm $(0,0,0)$ đến điểm $\\left(\\frac{a}{4}, \\frac{a}{4}, \\frac{a}{4}\\right)$ (chính là bằng $\\frac{1}{4}$ đường chéo khối lập phương $a\\sqrt{3}$):\u003c/span>\n          $$d = \\sqrt{\\left(\\frac{a}{4}\\right)^2 + \\left(\\frac{a}{4}\\right)^2 + \\left(\\frac{a}{4}\\right)^2} = \\sqrt{\\frac{3a^2}{16}} = \\frac{a\\sqrt{3}}{4}$$\n          \u003cspan class=\"cmt\">// Bước 3: Thay giá trị hằng số mạng $a = 5.34\\text{ Å}$ của đề bài vào công thức:\u003c/span>\n          $$d = \\frac{5.34 \\times \\sqrt{3}}{4} = \\frac{5.34 \\times 1.73205}{4} \\approx 2.312\\text{ Å}$$\n          \u003cspan class=\"cmt\">// Bước 4: Đổi sang đơn vị centimet ($\\text{cm}$) bằng cách nhân với $10^{-8}$ để thống nhất hệ đơn vị chuẩn bán dẫn:\u003c/span>\n          $$d \\approx 2.312\\text{ Å} = 2.312 \\times 10^{-8}\\text{ cm}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Mật độ nguyên tử của silicon ($\\text{\\#/cm}^3$):\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính tổng số nguyên tử hiệu dụng ($n_{\\text{cell}}$) thuộc về 1 ô đơn vị mạng Kim cương. Ô đơn vị này gồm 8 nguyên tử ở 8 đỉnh góc (mỗi đỉnh đóng góp $\\frac{1}{8}$), 6 nguyên tử ở 6 tâm mặt (mỗi mặt đóng góp $\\frac{1}{2}$) và 4 nguyên tử nằm trọn vẹn bên trong ruột (mỗi nguyên tử đóng góp $1$):\u003c/span>\n          $$n_{\\text{cell}} = \\left(8 \\times \\frac{1}{8}\\right) + \\left(6 \\times \\frac{1}{2}\\right) + (4 \\times 1) = 1 + 3 + 4 = 8\\text{ nguyên tử}$$\n          \u003cspan class=\"cmt\">// Bước 2: Đổi hằng số mạng $a = 5.34\\text{ Å}$ sang đơn vị centimet ($\\text{cm}$) trước khi tính thể tích:\u003c/span>\n          $$a = 5.34\\text{ Å} = 5.34 \\times 10^{-8}\\text{ cm}$$\n          \u003cspan class=\"cmt\">// Bước 3: Tính thể tích của 1 ô đơn vị hình lập phương ($V_{\\text{cell}} = a^3$):\u003c/span>\n          $$V_{\\text{cell}} = a^3 = \\left(5.34 \\times 10^{-8}\\text{ cm}\\right)^3 \\approx 1.52273 \\times 10^{-22}\\text{ cm}^3$$\n          \u003cspan class=\"cmt\">// Bước 4: Lấy số nguyên tử hiệu dụng trong 1 ô chia cho thể tích của ô đó để thu được mật độ nguyên tử $N$:\u003c/span>\n          $$N = \\frac{n_{\\text{cell}}}{V_{\\text{cell}}} = \\frac{8\\text{ atoms}}{1.52273 \\times 10^{-22}\\text{ cm}^3} \\approx 5.254 \\times 10^{22}\\text{ atoms/cm}^3$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>c) Khối lượng riêng của silicon ($\\text{g/cm}^3$):\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Sử dụng nguyên tử khối của Silicon là $M_A = 28.09\\text{ g/mol}$ và hằng số Avogadro là $N_A = 6.022 \\times 10^{23}\\text{ atoms/mol}$. Ta tìm khối lượng của 1 nguyên tử Silicon bằng cách lấy khối lượng của $1\\text{ mol}$ chia cho tổng số nguyên tử trong $1\\text{ mol}$:\u003c/span>\n          $$m_{\\text{atom}} = \\frac{M_A}{N_A} = \\frac{28.09\\text{ g/mol}}{6.022 \\times 10^{23}\\text{ atoms/mol}} \\approx 4.6646 \\times 10^{-23}\\text{ g/atom}$$\n          \u003cspan class=\"cmt\">// Bước 2: Nhân khối lượng của 1 nguyên tử với tổng số nguyên tử có trong $1\\text{ cm}^3$ (tức mật độ $N$ ở câu b) để ra khối lượng của $1\\text{ cm}^3$ Silicon (khối lượng riêng $\\rho$):\u003c/span>\n          $$\\rho = N \\times m_{\\text{atom}} = \\left(5.254 \\times 10^{22}\\text{ atoms/cm}^3\\right) \\times \\left(4.6646 \\times 10^{-23}\\text{ g/atom}\\right) \\approx 2.45\\text{ g/cm}^3$$\n          \u003cspan class=\"cmt\">// Ghi chú đối chiếu: Vì đề bài cho $a = 5.34\\text{ Å}$ nên kết quả tính ra là $\\rho \\approx 2.45\\text{ g/cm}^3$ (nếu đề bài cho $a = 5.43\\text{ Å}$ như trong sách giáo khoa thì $\\rho \\approx 2.33\\text{ g/cm}^3$).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 2 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-cau2\">Câu 2: Xác định Chỉ số Miller của Mặt phẳng\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Một mạng lập phương tâm khối (body-centered cubic) có lattice constant $a = 4.83\\text{ Å}$. Một mặt phẳng cắt ba trục Cartesian tại: $9.60\\text{ Å}$ \u003ci>(trong sách gốc bài 1.17 là $9.66\\text{ Å}$)\u003c/i>, $19.32\\text{ Å}$, $14.49\\text{ Å}$. Xác định chỉ số Miller (Miller indices) của mặt phẳng.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('hint2')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('sol2')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"hint2\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Chỉ số Miller không tính trực tiếp trên số đo $\\text{Å}$ mà phải tính trên \u003cb>tỷ số giữa tọa độ điểm cắt và hằng số mạng $a$\u003c/b>.\u003c/li>\n          \u003cli>Hãy lấy 3 tọa độ cắt trên 3 trục chia cho $a = 4.83\\text{ Å}$ để tìm $(p, q, s)$.\u003c/li>\n          \u003cli>Sau đó lấy nghịch đảo $\\left(\\frac{1}{p}, \\frac{1}{q}, \\frac{1}{s}\\right)$ và quy đồng mẫu số để đưa về bộ 3 số nguyên nhỏ nhất $(hkl)$.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"sol2\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 1: Đổi tọa độ các giao điểm trên 3 trục Descartes sang đơn vị hằng số mạng $a$ bằng cách chia từng khoảng cách cho $a = 4.83\\text{ Å}$:\u003c/span>\n          $$p = \\frac{9.66\\text{ Å}}{4.83\\text{ Å}} = 2 \\quad \\left(\\text{nếu bấm theo số in nhòe } 9.60\\text{ Å thì } p = \\frac{9.60}{4.83} \\approx 1.988 \\approx 2\\right)$$\n          $$q = \\frac{19.32\\text{ Å}}{4.83\\text{ Å}} = 4$$\n          $$s = \\frac{14.49\\text{ Å}}{4.83\\text{ Å}} = 3$$\n          \u003cspan class=\"cmt\">// Như vậy, mặt phẳng cắt 3 trục tại vị trí $2a, 4a, 3a$, tức là bộ hệ số chắn $(p, q, s) = (2, 4, 3)$.\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 2: Lấy nghịch đảo của 3 hệ số chắn $(p, q, s)$ theo đúng định nghĩa toán học của chỉ số Miller:\u003c/span>\n          $$\\left(\\frac{1}{p}, \\frac{1}{q}, \\frac{1}{s}\\right) = \\left(\\frac{1}{2}, \\frac{1}{4}, \\frac{1}{3}\\right)$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 3: Quy đồng khử mẫu bằng cách nhân cả 3 phân số với Bội chung nhỏ nhất của $(2, 4, 3)$ là $12$:\u003c/span>\n          $$h = \\frac{1}{2} \\times 12 = 6$$\n          $$k = \\frac{1}{4} \\times 12 = 3$$\n          $$l = \\frac{1}{3} \\times 12 = 4$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 4: Đặt 3 số nguyên tối giản vào trong dấu ngoặc tròn không có dấu phẩy để biểu diễn mặt phẳng:\u003c/span>\n          $$\\text{Chỉ số Miller của mặt phẳng là: } \\mathbf{(634)}$$\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 3 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-cau3\">Câu 3: Mật độ Thể tích, Mật độ Bề mặt và Khoảng cách Mặt trong Mạng FCC\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Xét một mạng lập phương tâm mặt (face-centered cubic FCC). Coi các nguyên tử là các quả cầu và các nguyên tử lân cận gần nhất tiếp xúc nhau. Bán kính nguyên tử: $r = 2.37\\text{ Å}$. Hãy:\u003cbr>\n      a) Tính mật độ nguyên tử theo thể tích (volume density) của tinh thể.\u003cbr>\n      b) Tính mật độ nguyên tử trên bề mặt (surface density) trên mặt $(110)$.\u003cbr>\n      c) Tính khoảng cách giữa hai mặt $(110)$ gần nhất.\u003cbr>\n      d) Lặp lại (b) và (c) đối với mặt $(111)$.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('hint3')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('sol3')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"hint3\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Bước chuẩn bị:\u003c/b> Trong mạng FCC, các quả cầu nguyên tử tiếp xúc nhau trên đường chéo mặt hình vuông: $a\\sqrt{2} = 4r \\implies a = 2\\sqrt{2}r$. Hãy tính $a$ và đổi ra $\\text{cm}$.\u003c/li>\n          \u003cli>\u003cb>Ý a:\u003c/b> Số nguyên tử trong 1 ô FCC là $n_{\\text{cell}} = 4$. Dùng $N = \\frac{4}{a^3}$.\u003c/li>\n          \u003cli>\u003cb>Ý b:\u003c/b> Xem lại Mô hình 3.1 ở trên cho mặt $(110)$ mạng FCC: thiết diện cắt là hình chữ nhật rộng $a$, dài $a\\sqrt{2}$, diện tích $S_{110} = a^2\\sqrt{2}$. Đếm số nguyên tử trong hình chữ nhật: $4\\text{ góc} \\times \\frac{1}{4} + 2\\text{ cạnh dài} \\times \\frac{1}{2} = 2$ nguyên tử.\u003c/li>\n          \u003cli>\u003cb>Ý c:\u003c/b> Áp dụng công thức khoảng cách mặt $d_{110} = \\frac{a}{\\sqrt{1^2+1^2+0^2}} = \\frac{a}{\\sqrt{2}}$ (và nêu thêm khoảng cách lớp nguyên tử tâm mặt xen kẽ $\\frac{a\\sqrt{2}}{4} = r$).\u003c/li>\n          \u003cli>\u003cb>Ý d:\u003c/b> Xem Mô hình 3.1 cho mặt $(111)$ mạng FCC: thiết diện cắt là tam giác đều cạnh $a\\sqrt{2}$, diện tích $S_{111} = \\frac{\\sqrt{3}}{2}a^2$. Số nguyên tử trong tam giác đều: $3\\text{ góc nhọn } 60^\\circ \\times \\frac{1}{6} + 3\\text{ trung điểm cạnh} \\times \\frac{1}{2} = 2$ nguyên tử.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"sol3\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước mở đầu: Tìm hằng số mạng $a$ từ bán kính nguyên tử $r = 2.37\\text{ Å}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Trong mạng lập phương tâm mặt (FCC), các nguyên tử lân cận gần nhất chạm vào nhau dọc theo đường chéo mặt hình vuông. Đường chéo mặt có độ dài là $a\\sqrt{2}$, đi qua 1 nguyên tử tâm mặt (đường kính $2r$) và 2 nửa nguyên tử ở góc ($2 \\times r$), nên tổng độ dài là $4r$:\u003c/span>\n          $$a\\sqrt{2} = 4r \\implies a = \\frac{4r}{\\sqrt{2}} = 2\\sqrt{2}\\,r$$\n          \u003cspan class=\"cmt\">// Thay $r = 2.37\\text{ Å}$ vào và đổi sang đơn vị centimet ($\\text{cm}$):\u003c/span>\n          $$a = 2\\sqrt{2} \\times 2.37\\text{ Å} \\approx 6.7034\\text{ Å} = 6.7034 \\times 10^{-8}\\text{ cm}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>a) Tính mật độ nguyên tử theo thể tích (volume density):\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính số nguyên tử hiệu dụng trong 1 ô đơn vị FCC (8 góc góp $\\frac{1}{8}$ và 6 tâm mặt góp $\\frac{1}{2}$):\u003c/span>\n          $$n_{\\text{cell}} = \\left(8 \\times \\frac{1}{8}\\right) + \\left(6 \\times \\frac{1}{2}\\right) = 1 + 3 = 4\\text{ nguyên tử}$$\n          \u003cspan class=\"cmt\">// Bước 2: Chia số nguyên tử hiệu dụng cho thể tích ô đơn vị $a^3$:\u003c/span>\n          $$N = \\frac{n_{\\text{cell}}}{a^3} = \\frac{4}{\\left(6.7034 \\times 10^{-8}\\text{ cm}\\right)^3} = \\frac{4}{3.0122 \\times 10^{-22}\\text{ cm}^3} \\approx 1.328 \\times 10^{22}\\text{ atoms/cm}^3$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Tính mật độ nguyên tử trên bề mặt (surface density) trên mặt $(110)$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính diện tích thiết diện mặt cắt $(110)$. Mặt $(110)$ là hình chữ nhật có chiều cao là $a$ và chiều rộng là đường chéo mặt đáy $a\\sqrt{2}$:\u003c/span>\n          $$S_{(110)} = a \\times (a\\sqrt{2}) = a^2\\sqrt{2}$$\n          \u003cspan class=\"cmt\">// Bước 2: Đếm số nguyên tử hiệu dụng nằm trên hình chữ nhật $(110)$. Tại 4 góc vuông của hình chữ nhật có 4 nguyên tử đỉnh góc (mỗi góc $90^\\circ$ chiếm $\\frac{90^\\circ}{360^\\circ} = \\frac{1}{4}$ hình tròn). Tại trung điểm của 2 cạnh dài trên và dưới có 2 nguyên tử tâm mặt đáy bị cắt đôi (mỗi nguyên tử chiếm $\\frac{1}{2}$ hình tròn):\u003c/span>\n          $$n_{(110)} = \\left(4 \\times \\frac{1}{4}\\right) + \\left(2 \\times \\frac{1}{2}\\right) = 1 + 1 = 2\\text{ nguyên tử}$$\n          \u003cspan class=\"cmt\">// Bước 3: Lấy số nguyên tử trên mặt $(110)$ chia cho diện tích mặt $(110)$:\u003c/span>\n          $$N_{s(110)} = \\frac{n_{(110)}}{S_{(110)}} = \\frac{2}{a^2\\sqrt{2}} = \\frac{\\sqrt{2}}{a^2}$$\n          $$N_{s(110)} = \\frac{\\sqrt{2}}{\\left(6.7034 \\times 10^{-8}\\text{ cm}\\right)^2} \\approx 3.147 \\times 10^{14}\\text{ atoms/cm}^2$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>c) Tính khoảng cách giữa hai mặt $(110)$ gần nhất:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính khoảng cách giữa hai mặt phẳng mạng $(110)$ theo công thức hình học chuẩn từ gốc tọa độ đến mặt cắt qua $(a, a, \\infty)$ (tức một nửa đường chéo mặt $a\\sqrt{2}$):\u003c/span>\n          $$d_{110} = \\frac{a}{\\sqrt{1^2 + 1^2 + 0^2}} = \\frac{a}{\\sqrt{2}} = \\frac{6.7034\\text{ Å}}{\\sqrt{2}} \\approx 4.74\\text{ Å}$$\n          \u003cspan class=\"cmt\">// Bước 2 (Bổ sung bản chất mạng FCC): Trong mạng FCC, các nguyên tử nằm ở tâm các mặt bên tạo thành một lớp mặt phẳng song song với $(110)$ nằm chính giữa khoảng cách trên. Nếu tính khoảng cách giữa hai lớp nguyên tử song song theo phương $[110]$ gần nhất thì:\u003c/span>\n          $$d'_{110} = \\frac{d_{110}}{2} = \\frac{a}{2\\sqrt{2}} = r = 2.37\\text{ Å}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>d) Lặp lại câu (b) và (c) đối với mặt $(111)$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính diện tích thiết diện mặt cắt $(111)$. Mặt $(111)$ nối 3 đỉnh $(a,0,0), (0,a,0), (0,0,a)$ tạo thành một tam giác đều có độ dài cạnh là đường chéo mặt $L = a\\sqrt{2}$. Diện tích tam giác đều cạnh $L$ là $\\frac{\\sqrt{3}}{4}L^2$:\u003c/span>\n          $$S_{(111)} = \\frac{\\sqrt{3}}{4} L^2 = \\frac{\\sqrt{3}}{4} \\left(a\\sqrt{2}\\right)^2 = \\frac{\\sqrt{3}}{2}a^2$$\n          \u003cspan class=\"cmt\">// Bước 2: Đếm số nguyên tử hiệu dụng nằm trong tam giác đều $(111)$. Ở 3 đỉnh nhọn của tam giác đều (mỗi góc bằng $60^\\circ$), mỗi nguyên tử góc đóng góp $\\frac{60^\\circ}{360^\\circ} = \\frac{1}{6}$ hình tròn. Ở trung điểm của 3 cạnh tam giác (chính là tâm của 3 mặt vuông khối lập phương) có 3 nguyên tử tâm mặt bị cạnh tam giác cắt làm đôi, mỗi nguyên tử đóng góp $\\frac{1}{2}$ hình tròn:\u003c/span>\n          $$n_{(111)} = \\left(3 \\times \\frac{1}{6}\\right) + \\left(3 \\times \\frac{1}{2}\\right) = \\frac{1}{2} + \\frac{3}{2} = 2\\text{ nguyên tử}$$\n          \u003cspan class=\"cmt\">// Bước 3: Chia số nguyên tử trên mặt $(111)$ cho diện tích mặt $(111)$ để tìm mật độ bề mặt:\u003c/span>\n          $$N_{s(111)} = \\frac{n_{(111)}}{S_{(111)}} = \\frac{2}{\\frac{\\sqrt{3}}{2}a^2} = \\frac{4}{a^2\\sqrt{3}}$$\n          $$N_{s(111)} = \\frac{4}{\\left(6.7034 \\times 10^{-8}\\text{ cm}\\right)^2 \\times \\sqrt{3}} \\approx 5.139 \\times 10^{14}\\text{ atoms/cm}^2$$\n          \u003cspan class=\"cmt\">// Bước 4: Tính khoảng cách giữa hai mặt $(111)$ gần nhất dọc theo trục pháp tuyến $[111]$:\u003c/span>\n          $$d_{111} = \\frac{a}{\\sqrt{1^2 + 1^2 + 1^2}} = \\frac{a}{\\sqrt{3}} = \\frac{6.7034\\text{ Å}}{\\sqrt{3}} \\approx 3.87\\text{ Å}$$\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 4 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-cau4\">Câu 4: Mật độ Electron Hóa trị trong Silicon\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Tính mật độ electron hóa trị (density of valence electrons) trong silicon.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('hint4')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('hint4');togglePanel('sol4')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"hint4\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Silicon thuộc \u003cb>Nhóm IV\u003c/b> trong bảng tuần hoàn, nghĩa là mỗi nguyên tử Silicon có đúng \u003cb>$4$ electron hóa trị\u003c/b> ở lớp ngoài cùng.\u003c/li>\n          \u003cli>Do đó: $\\text{Mật độ electron hóa trị} = 4 \\times \\text{Mật độ nguyên tử Silicon } (N_{\\text{Si}})$.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"sol4\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 1: Xác định mật độ nguyên tử của Silicon ($N_{\\text{Si}}$). Trong giáo trình chuẩn của Neamen, hằng số mạng của Silicon ở nhiệt độ phòng là $a = 5.43\\text{ Å} = 5.43 \\times 10^{-8}\\text{ cm}$, với $8$ nguyên tử trong một ô đơn vị mạng Kim cương:\u003c/span>\n          $$N_{\\text{Si}} = \\frac{8}{a^3} = \\frac{8}{\\left(5.43 \\times 10^{-8}\\text{ cm}\\right)^3} \\approx 5.0 \\times 10^{22}\\text{ atoms/cm}^3$$\n          \u003cspan class=\"cmt\">// (Nếu sử dụng kết quả từ Câu 1 với $a = 5.34\\text{ Å}$ thì $N_{\\text{Si}} \\approx 5.254 \\times 10^{22}\\text{ atoms/cm}^3$).\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 2: Vì Silicon là nguyên tố thuộc Nhóm IV, mỗi nguyên tử Silicon đóng góp $4$ electron hóa trị để tham gia liên kết cộng hóa trị với 4 nguyên tử lân cận.\u003c/span>\n          \u003cspan class=\"cmt\">// Bước 3: Nhân mật độ nguyên tử Silicon với $4$ để thu được mật độ electron hóa trị ($n_{\\text{valence}}$):\u003c/span>\n          $$n_{\\text{valence}} = 4 \\times N_{\\text{Si}} = 4 \\times \\left(5.0 \\times 10^{22}\\text{ atoms/cm}^3\\right) = 2.0 \\times 10^{23}\\text{ electrons/cm}^3$$\n          \u003cspan class=\"cmt\">// (Hoặc nếu tính theo số liệu $a = 5.34\\text{ Å}$ của Câu 1: $n_{\\text{valence}} = 4 \\times 5.254 \\times 10^{22} \\approx 2.10 \\times 10^{23}\\text{ electrons/cm}^3$).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 5 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-cau5\">Câu 5: Khoảng cách giữa các Nguyên tử Tạp chất Boron\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Có $2 \\times 10^{16}\\text{ boron atoms/cm}^3$ được thêm vào silicon dưới dạng tạp chất thay thế (substitutional impurity) và phân bố đồng đều trong toàn bộ chất bán dẫn. Hãy xác định khoảng cách giữa các nguyên tử boron biểu diễn theo hằng số mạng (lattice constant) của silicon.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('hint5')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('sol5')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"hint5\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Khi các nguyên tử Boron phân bố đồng đều theo một mạng lưới hình lập phương trong $1\\text{ cm}^3$, mỗi nguyên tử Boron sẽ chiếm một \"ô lập phương riêng\" có cạnh là $d$ (với $d$ chính là khoảng cách giữa 2 nguyên tử Boron kế tiếp).\u003c/li>\n          \u003cli>Thể tích của 1 ô lập phương chứa 1 nguyên tử Boron là $V_B = d^3 = \\frac{1}{N_{\\text{Boron}}}$.\u003c/li>\n          \u003cli>Từ đó tính được $d = \\frac{1}{\\sqrt[3]{N_{\\text{Boron}}}}$, rồi lấy $\\frac{d}{a}$ để xem $d$ gấp bao nhiêu lần hằng số mạng $a$ của Silicon.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"sol5\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 1: Giả sử các nguyên tử Boron phân bố đều đặn tạo thành một mạng lập phương với khoảng cách giữa hai nguyên tử Boron gần nhất là $d$. Khi đó, mỗi nguyên tử Boron chiếm một khoảng không gian hình lập phương có thể tích là $V_1 = d^3$.\u003c/span>\n          \u003cspan class=\"cmt\">// Bước 2: Biết trong $1\\text{ cm}^3$ có tổng cộng $N_B = 2 \\times 10^{16}$ nguyên tử Boron, thể tích không gian trung bình dành cho 1 nguyên tử Boron là:\u003c/span>\n          $$d^3 = \\frac{1}{N_B} = \\frac{1}{2 \\times 10^{16}\\text{ cm}^{-3}} = 0.5 \\times 10^{-16}\\text{ cm}^3 = 50 \\times 10^{-18}\\text{ cm}^3$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 3: Lấy căn bậc ba của hai vế để tìm khoảng cách thực tế $d$ giữa hai nguyên tử Boron kế tiếp:\u003c/span>\n          $$d = \\sqrt[3]{50 \\times 10^{-18}\\text{ cm}^3} = \\sqrt[3]{50} \\times 10^{-6}\\text{ cm} \\approx 3.684 \\times 10^{-6}\\text{ cm} = 368.4\\text{ Å}$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 4: Biểu diễn khoảng cách $d$ theo hằng số mạng $a$ của Silicon bằng cách lập tỷ số $\\frac{d}{a}$ (với hằng số mạng chuẩn của Silicon $a = 5.43\\text{ Å} = 5.43 \\times 10^{-8}\\text{ cm}$):\u003c/span>\n          $$\\frac{d}{a} = \\frac{3.684 \\times 10^{-6}\\text{ cm}}{5.43 \\times 10^{-8}\\text{ cm}} \\approx 67.85 \\implies d \\approx 67.8\\,a$$\n          \u003cspan class=\"cmt\">// (Nếu lấy theo hằng số mạng $a = 5.34\\text{ Å}$ ở Câu 1 thì $\\frac{d}{a} = \\frac{368.4\\text{ Å}}{5.34\\text{ Å}} \\approx 69.0\\,a$).\u003c/span>\n          \u003cspan class=\"cmt\">// Kết luận: Hai nguyên tử Boron nằm cách nhau khoảng $68$ đến $69$ lần hằng số mạng của Silicon.\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sum\">\n    \u003ch2>Tổng Kết Buổi 1: Những Điểm Cốt Lõi Cần Nhớ\u003c/h2>\n    \u003cul>\n      \u003cli>\u003cb>Quy đổi đơn vị:\u003c/b> Luôn đổi $1\\text{ Å} = 10^{-8}\\text{ cm}$ trước khi tính mật độ thể tích ($\\text{cm}^{-3}$) hoặc mật độ bề mặt ($\\text{cm}^{-2}$).\u003c/li>\n      \u003cli>\u003cb>Số nguyên tử hiệu dụng trong 1 ô đơn vị ($n_{\\text{cell}}$):\u003c/b> SC $= 1$; BCC $= 2$; FCC $= 4$; Kim cương ($\\text{Si}, \\text{Ge}$) và Zincblende ($\\text{GaAs}$) $= 8$.\u003c/li>\n      \u003cli>\u003cb>Quan hệ bán kính nguyên tử $r$ và hằng số mạng $a$:\u003c/b> SC ($a=2r$), BCC ($a\\sqrt{3}=4r$), FCC ($a\\sqrt{2}=4r$), Kim cương ($d_{\\text{min}} = \\frac{a\\sqrt{3}}{4}$).\u003c/li>\n      \u003cli>\u003cb>Chỉ số Miller $(hkl)$:\u003c/b> Tìm điểm cắt theo $a$ $\\rightarrow$ Lấy nghịch đảo $\\rightarrow$ Quy đồng khử mẫu $\\rightarrow$ Đặt trong ngoặc tròn $(hkl)$.\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\u003c/template>\n\n\u003c!-- =========================================================\n     TEMPLATE BUỔI 2: NHẬP MÔN CƠ HỌC LƯỢNG TỬ (PHẦN 1)\n     ========================================================= -->\n\u003ctemplate id=\"tpl-buoi-2\">\n  \u003cheader>\n    \u003cspan class=\"k b1\">HỌC PHẦN ENP2209 · BUỔI 2\u003c/span>\n    \u003ch1>Nhập Môn Cơ Học Lượng Tử (Phần 1)\u003c/h1>\n    \u003cp class=\"mut\">Hiểu rõ bản chất Lượng tử năng lượng, Lưỡng tính sóng - hạt, Nguyên lý bất định Heisenberg và Phương trình sóng Schrödinger từ con số 0 qua các mô hình tương tác trực quan.\u003c/p>\n  \u003c/header>\n\n  \u003csection>\n    \u003ch2>1. Lượng Tử Năng Lượng & Hiệu Ứng Quang Điện\u003c/h2>\n    \u003cp>Ở Buổi 1, chúng ta đã xây xong \"ngôi nhà tinh thể\" gồm các nguyên tử đứng ở nút mạng. Bây giờ, để hiểu làm sao dòng điện chạy qua ngôi nhà đó, ta phải theo dõi chuyển động của các hạt \u003cb>electron\u003c/b>. Tuy nhiên, vì electron quá nhỏ bé (nặng chỉ khoảng $9.11 \\times 10^{-31}\\text{ kg}$), các định luật cơ học cổ điển của Newton hoàn toàn bất lực! Chúng ta phải bước vào thế giới của \u003cb>Cơ học Lượng tử (Quantum Mechanics)\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Vòi nước liên tục vs. Máy bán nước tự động theo lon\u003c/b>\u003cbr>\n      • \u003cb>Vật lý cổ điển\u003c/b> nghĩ rằng năng lượng ánh sáng giống như nước chảy ra từ vòi: em muốn rót bao nhiêu giọt tùy ý, năng lượng tăng giảm liên tục.\u003cbr>\n      • \u003cb>Cơ học lượng tử (Max Planck & Albert Einstein)\u003c/b> phát hiện ra rằng ở cấp độ vi mô, năng lượng giống như \u003cb>máy bán nước ngọt tự động\u003c/b>: máy chỉ nhả ra từng lon nguyên vẹn (1 lon, 2 lon, 3 lon...), tuyệt đối không bán nửa lon! Mỗi \"lon năng lượng\" rời rạc đó được gọi là một \u003cb>Lượng tử năng lượng (Quantum)\u003c/b>, và với ánh sáng thì mỗi viên năng lượng đó gọi là một hạt \u003cb>Photon\u003c/b>.\n    \u003c/div>\n\n    \u003ch3>1.1. Giả thuyết Planck và Hạt ánh sáng (Photon)\u003c/h3>\n    \u003cp>Năm 1901, khi nghiên cứu bức xạ vật đen (Black-body radiation), Max Planck khẳng định năng lượng chỉ được phát ra hoặc hấp thụ thành từng gói rời rạc tỉ lệ thuận với tần số $\\nu$ của sóng ánh sáng:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$E = h\\nu = \\frac{hc}{\\lambda} \\qquad \\left(\\text{Mẹo tính nhanh: } E\\text{ [eV]} \\approx \\frac{1240}{\\lambda\\text{ [nm]}} = \\frac{12400}{\\lambda\\text{ [Å]}}\\right)$$\n      \u003csmall>Trong đó: $h = 6.625 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$ là hằng số Planck; $c = 3 \\times 10^8\\text{ m/s}$ là vận tốc ánh sáng; $\\lambda$ là bước sóng.\u003c/small>\n    \u003c/div>\n\n    \u003cdiv class=\"box warn\">\n      \u003cb>Cảnh báo đổi đơn vị Năng lượng (Joule $\\leftrightarrow$ eV):\u003c/b>\u003cbr>\n      Trong thế giới nguyên tử, đơn vị Joule ($\\text{J}$) là quá khổng lồ, nên các kỹ sư bán dẫn luôn dùng đơn vị \u003cb>Electron-Volt ($\\text{eV}$)\u003c/b>. Đó là năng lượng mà 1 electron thu được khi chạy qua hiệu điện thế $1\\text{ V}$:\u003cbr>\n      $$1\\text{ eV} = 1.6 \\times 10^{-19}\\text{ J}$$\n      • Từ $\\text{eV}$ đổi sang $\\text{J}$ (để thế vào công thức chuẩn SI): \u003cb>Nhân với $1.6 \\times 10^{-19}$\u003c/b>.\u003cbr>\n      • Từ $\\text{J}$ đổi sang $\\text{eV}$: \u003cb>Chia cho $1.6 \\times 10^{-19}$\u003c/b>.\n    \u003c/div>\n\n    \u003ch3>1.2. Hiệu ứng Quang điện (Photoelectric Effect)\u003c/h3>\n    \u003cp>Khi chiếu ánh sáng đơn sắc vào một tấm kim loại đặt trong chân không, các hạt electron có thể bị đánh bật ra khỏi bề mặt kim loại (gọi là \u003cb>quang electron - photoelectrons\u003c/b>). Để bứt ra khỏi lực giữ của kim loại, mỗi electron phải tốn một mức \"phí xuất cảnh\" tối thiểu gọi là \u003cb>Công thoát $\\Phi$ (Work function)\u003c/b>:\u003c/p>\n    \u003cul>\n      \u003cli>Nếu 1 hạt photon lao vào có năng lượng $h\\nu \u003c \\Phi$ (tức tần số $\\nu \u003c \\nu_0 = \\frac{\\Phi}{h}$): Dù em có bật hàng triệu bóng đèn (tăng cường độ sáng cực mạnh), cũng \u003cb>không có bất kỳ electron nào thoát ra\u003c/b>! (Giống như vé qua trạm thu phí là $50\\text{ nghìn}$, dù có $1000$ người nhưng mỗi người chỉ cầm tờ $20\\text{ nghìn}$ và quy định không được góp tiền chung thì không ai qua được trạm).\u003c/li>\n      \u003cli>Nếu $h\\nu \\ge \\Phi$: 1 photon truyền toàn bộ năng lượng cho 1 electron. Sau khi trả phí công thoát $\\Phi$, phần năng lượng thừa biến thành \u003cb>Động năng cực đại $T_{\\text{max}}$\u003c/b> giúp electron bay đi:\n        $$T_{\\text{max}} = \\frac{1}{2}mv^2 = h\\nu - \\Phi = h\\nu - h\\nu_0$$\n      \u003c/li>\n    \u003c/ul>\n\n    \u003ch3>1.3. Mô hình tương tác: Thí nghiệm Hiệu ứng Quang điện & Đồ thị Millikan\u003c/h3>\n    \u003cp>Em hãy kéo thanh trượt \u003cb>Tần số ánh sáng chiếu vào ($\\nu$)\u003c/b> và \u003cb>Cường độ chùm sáng\u003c/b> dưới đây để xem khi nào electron bật ra và quan sát điểm chạy trên đồ thị động năng $T_{\\text{max}}$ bên phải:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Năng lượng Photon $h\\nu$ (\u003cspan id=\"val-pe-hv\">3.2\u003c/
