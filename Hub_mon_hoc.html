 khác nhau chia dư ra cùng 1 ô (ví dụ $m=9$: $\\text{ID } 21 \\bmod 9 = 3$ và $\\text{ID } 39 \\bmod 9 = 3$), ta bị \u003cb>đụng độ tại ô số 3\u003c/b>. Giải pháp 1 (Dò tuyến tính): Tiến sang ô trống kế tiếp $h_1(39) = (39+1) \\bmod 9 = \\mathbf{4}$!\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- MỤC 4: MẬT MÃ HỌC CỔ ĐIỂN (CAESAR) & KHÁI NIỆM HỆ MẬT MÃ -->\n  \u003csection>\n    \u003ch2>4. Từ Mật Mã Cổ Điển Caesar Đến Tư Tưởng Mã Hóa Khóa Công Khai\u003c/h2>\n    \u003cp>Trước khi học RSA, chúng ta hãy khởi động bằng hệ mật mã lâu đời nhất thế giới của Hoàng đế La Mã Julius Caesar. Bước đầu tiên của mọi thuật toán mã hóa trên máy tính là \u003cb>biến chữ cái thành con số\u003c/b> từ $0$ đến $25$:\u003c/p>\n\n    \u003cdiv class=\"tw\">\n      \u003ctable>\n        \u003ctr>\n          \u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>C\u003c/th>\u003cth>D\u003c/th>\u003cth>E\u003c/th>\u003cth>F\u003c/th>\u003cth>G\u003c/th>\u003cth>H\u003c/th>\u003cth>I\u003c/th>\u003cth>J\u003c/th>\u003cth>K\u003c/th>\u003cth>L\u003c/th>\u003cth>M\u003c/th>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>\u003cb>00\u003c/b>\u003c/td>\u003ctd>\u003cb>01\u003c/b>\u003c/td>\u003ctd>\u003cb>02\u003c/b>\u003c/td>\u003ctd>\u003cb>03\u003c/b>\u003c/td>\u003ctd>\u003cb>04\u003c/b>\u003c/td>\u003ctd>\u003cb>05\u003c/b>\u003c/td>\u003ctd>\u003cb>06\u003c/b>\u003c/td>\u003ctd>\u003cb>07\u003c/b>\u003c/td>\u003ctd>\u003cb>08\u003c/b>\u003c/td>\u003ctd>\u003cb>09\u003c/b>\u003c/td>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cb>11\u003c/b>\u003c/td>\u003ctd>\u003cb>12\u003c/b>\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003cth>N\u003c/th>\u003cth>O\u003c/th>\u003cth>P\u003c/th>\u003cth>Q\u003c/th>\u003cth>R\u003c/th>\u003cth>S\u003c/th>\u003cth>T\u003c/th>\u003cth>U\u003c/th>\u003cth>V\u003c/th>\u003cth>W\u003c/th>\u003cth>X\u003c/th>\u003cth>Y\u003c/th>\u003cth>Z\u003c/th>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>\u003cb>13\u003c/b>\u003c/td>\u003ctd>\u003cb>14\u003c/b>\u003c/td>\u003ctd>\u003cb>15\u003c/b>\u003c/td>\u003ctd>\u003cb>16\u003c/b>\u003c/td>\u003ctd>\u003cb>17\u003c/b>\u003c/td>\u003ctd>\u003cb>18\u003c/b>\u003c/td>\u003ctd>\u003cb>19\u003c/b>\u003c/td>\u003ctd>\u003cb>20\u003c/b>\u003c/td>\u003ctd>\u003cb>21\u003c/b>\u003c/td>\u003ctd>\u003cb>22\u003c/b>\u003c/td>\u003ctd>\u003cb>23\u003c/b>\u003c/td>\u003ctd>\u003cb>24\u003c/b>\u003c/td>\u003ctd>\u003cb>25\u003c/b>\u003c/td>\n        \u003c/tr>\n      \u003c/table>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức Trọng tâm 4 (Bài 6): Hệ Mật Mã 5 Thành Phần & Mã Hóa Dịch Chuyển Caesar\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\text{Hệ mật mã: } (P, C, K, E, D) \\text{ thỏa mãn } D_k(E_k(p)) = p$$\n        $$\\text{Mã hóa Caesar (khóa } k\\text{): } f(p) = (p + k) \\bmod 26 \\qquad \\big|\\qquad \\text{Giải mã: } f^{-1}(c) = (c - k) \\bmod 26$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\n          \u003cb>1. Giải nghĩa bộ 5 thành phần $(P, C, K, E, D)$:\u003c/b>\u003cbr>\n          • $P$ (Plaintext): Tập các \u003cb>bản rõ\u003c/b> (tin nhắn gốc).\u003cbr>\n          • $C$ (Ciphertext): Tập các \u003cb>bản mã\u003c/b> (tin nhắn đã khóa).\u003cbr>\n          • $K$ (Keyspace): Tập các \u003cb>khóa\u003c/b> $k$.\u003cbr>\n          • $E$ (Encryption) & $D$ (Decryption): Tập hàm mã hóa $E_k$ và hàm giải mã $D_k$. (Trong mã chuẩn của Julius Caesar, ông chọn cố định $k = 3$).\n        \u003c/div>\n        \u003cdiv>\n          \u003cb>2. Nhược điểm chí mạng của Mã hóa Khóa bí mật (Đối xứng):\u003c/b>\u003cbr>\n          • Trong mật mã Caesar, hễ ai biết khóa mã hóa là \"cộng $k$\" thì người đó lập tức suy ra ngay khóa giải mã là \"trừ $k$\".\u003cbr>\n          • Nếu em muốn gửi tin cho bạn ở xa, hai người phải lén gặp nhau trao đổi khóa $k$ trước. Nếu kẻ xấu nghe lén được $k$ trên đường truyền, toàn bộ bí mật bị lộ! Đó là lý do nhân loại phát minh ra \u003cb>Mã hóa Khóa công khai (RSA)\u003c/b>.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- MỤC 5: THUẬT TOÁN LŨY THỪA MÔ-ĐU-LÔ NHANH -->\n  \u003csection>\n    \u003ch2>5. Thuật Toán Lũy Thừa Mô-đu-lô Nhanh (Modular Exponentiation)\u003c/h2>\n    \u003cp>Trong thuật toán RSA sắp học, ta phải tính những phép toán dạng $b^n \\bmod m$ với số mũ $n$ rất lớn (ví dụ $3^{644} \\bmod 645$). Nếu em lấy $3$ nhân với chính nó $644$ lần, con số $3^{644}$ dài hơn $300$ chữ số sẽ làm treo máy tính ngay! Vậy làm sao tính bằng tay chỉ trong 10 dòng?\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Bí quyết \"Đổi số mũ sang Nhị phân & Bình phương liên tiếp\":\u003c/b>\u003cbr>\n      Mọi số mũ $n$ đều tách được thành tổng các lũy thừa của $2$ (biểu diễn nhị phân): $n = (a_{k-1} \\dots a_1 a_0)_2$.\u003cbr>\n      Ví dụ: $644 = 512 + 128 + 4 = 2^9 + 2^7 + 2^2 = (\\mathbf{1}0\\mathbf{1}0000\\mathbf{1}00)_2$.\u003cbr>\n      Khi đó: $3^{644} = 3^{2^9 + 2^7 + 2^2} = 3^{2^9} \\times 3^{2^7} \\times 3^{2^2}$.\u003cbr>\n      Mà để tính $3^{2^1}, 3^{2^2}, 3^{2^3}\\dots$, ta chỉ cần \u003cb>lấy kết quả bước trước tự bình phương lên rồi $\\bmod\\ 645$\u003c/b>! Hễ gặp bit nhị phân nào bằng $\\mathbf{1}$, ta mới nhân tích lũy giá trị `power` đó vào biến kết quả `x`!\n    \u003c/div>\n\n    \u003cdiv class=\"pseudo\">\n      \u003cb>procedure\u003c/b> modular_exponentiation($b$: cơ số, $n = (a_{k-1}a_{k-2}\\dots a_1 a_0)_2$: số mũ nhị phân, $m$: mô-đu-lô)\u003cbr>\n      $x := 1$\u003cbr>\n      $\\text{power} := b \\bmod m$\u003cbr>\n      \u003cb>for\u003c/b> $i := 0$ \u003cb>to\u003c/b> $k - 1$\u003cbr>\n      &nbsp;&nbsp;&nbsp;&nbsp;\u003cb>if\u003c/b> $a_i = 1$ \u003cb>then\u003c/b> $x := (x \\cdot \\text{power}) \\bmod m$ &nbsp;&nbsp;\u003cspan style=\"color:var(--c2)\">// Chỉ nhân vào x khi bit nhị phân bằng 1!\u003c/span>\u003cbr>\n      &nbsp;&nbsp;&nbsp;&nbsp;$\\text{power} := (\\text{power} \\cdot \\text{power}) \\bmod m$ &nbsp;&nbsp;\u003cspan style=\"color:var(--c5)\">// Bình phương liên tiếp cho vòng lặp sau\u003c/span>\u003cbr>\n      \u003cb>return\u003c/b> $x$ &nbsp;&nbsp;\u003cspan style=\"color:var(--mut)\">// x chính là $b^n \\bmod m$\u003c/span>\n    \u003c/div>\n\n    \u003ch3>5.1. Bảng Chạy Tay Từng Bước Ví Dụ Kinh Điển: Tính $3^{644} \\bmod 645$ (Trang 34 Slide)\u003c/h3>\n    \u003cp>Đầu tiên, đổi số mũ $n = 644$ sang nhị phân (chia liên tiếp cho 2 lấy dư từ dưới lên): $644 = (1010000100)_2$.\u003cbr>\n    Liệt kê các bit từ phải sang trái ($i = 0 \\to 9$): $a_0=0, a_1=0, \\mathbf{a_2=1}, a_3=0, a_4=0, a_5=0, a_6=0, \\mathbf{a_7=1}, a_8=0, \\mathbf{a_9=1}$.\u003cbr>\n    Khởi tạo ban đầu: $\\mathbf{x = 1}$ và $\\mathbf{\\text{power} = 3 \\bmod 645 = 3}$.\u003c/p>\n\n    \u003cdiv class=\"tw\">\n      \u003ctable>\n        \u003ctr>\n          \u003cth>Bước $i$\u003c/th>\n          \u003cth>Bit $a_i$\u003c/th>\n          \u003cth>Giá trị $\\text{power}$ đầu bước ($3^{2^i} \\bmod 645$)\u003c/th>\n          \u003cth>Cập nhật kết quả $x$ (Nếu $a_i = 1$ thì $x := x \\cdot \\text{power} \\bmod 645$)\u003c/th>\n          \u003cth>Tính $\\text{power}$ mới cho bước sau ($\\text{power}^2 \\bmod 645$)\u003c/th>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$i = 0$\u003c/td>\u003ctd>$0$\u003c/td>\u003ctd>$3$\u003c/td>\u003ctd>Giữ nguyên $x = 1$\u003c/td>\u003ctd>$3^2 \\bmod 645 = \\mathbf{9}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$i = 1$\u003c/td>\u003ctd>$0$\u003c/td>\u003ctd>$9$\u003c/td>\u003ctd>Giữ nguyên $x = 1$\u003c/td>\u003ctd>$9^2 \\bmod 645 = \\mathbf{81}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$\\mathbf{i = 2}$\u003c/td>\u003ctd>\u003cspan class=\"k b2\">1\u003c/span>\u003c/td>\u003ctd>$\\mathbf{81}$\u003c/td>\u003ctd>$x = (1 \\times 81) \\bmod 645 = \\mathbf{81}$\u003c/td>\u003ctd>$81^2 \\bmod 645 = 6561 \\bmod 645 = \\mathbf{111}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$i = 3$\u003c/td>\u003ctd>$0$\u003c/td>\u003ctd>$111$\u003c/td>\u003ctd>Giữ nguyên $x = 81$\u003c/td>\u003ctd>$111^2 \\bmod 645 = 12321 \\bmod 645 = \\mathbf{66}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$i = 4$\u003c/td>\u003ctd>$0$\u003c/td>\u003ctd>$66$\u003c/td>\u003ctd>Giữ nguyên $x = 81$\u003c/td>\u003ctd>$66^2 \\bmod 645 = 4356 \\bmod 645 = \\mathbf{486}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$i = 5$\u003c/td>\u003ctd>$0$\u003c/td>\u003ctd>$486$\u003c/td>\u003ctd>Giữ nguyên $x = 81$\u003c/td>\u003ctd>$486^2 \\bmod 645 = 236196 \\bmod 645 = \\mathbf{126}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$i = 6$\u003c/td>\u003ctd>$0$\u003c/td>\u003ctd>$126$\u003c/td>\u003ctd>Giữ nguyên $x = 81$\u003c/td>\u003ctd>$126^2 \\bmod 645 = 15876 \\bmod 645 = \\mathbf{396}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$\\mathbf{i = 7}$\u003c/td>\u003ctd>\u003cspan class=\"k b2\">1\u003c/span>\u003c/td>\u003ctd>$\\mathbf{396}$\u003c/td>\u003ctd>$x = (81 \\times 396) \\bmod 645 = \\mathbf{471}$\u003c/td>\u003ctd>$396^2 \\bmod 645 = 156816 \\bmod 645 = \\mathbf{81}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$i = 8$\u003c/td>\u003ctd>$0$\u003c/td>\u003ctd>$81$\u003c/td>\u003ctd>Giữ nguyên $x = 471$\u003c/td>\u003ctd>$81^2 \\bmod 645 = 6561 \\bmod 645 = \\mathbf{111}$\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>$\\mathbf{i = 9}$\u003c/td>\u003ctd>\u003cspan class=\"k b2\">1\u003c/span>\u003c/td>\u003ctd>$\\mathbf{111}$\u003c/td>\u003ctd>$x = (471 \\times 111) \\bmod 645 = \\mathbf{36}$\u003c/td>\u003ctd>Kết thúc vòng lặp! Kết quả: $\\mathbf{36}$\u003c/td>\n        \u003c/tr>\n      \u003c/table>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- MỤC 6: HỆ MẬT MÃ KHÓA CÔNG KHAI RSA (TRỌNG TÂM ĐẶC BIỆT) -->\n  \u003csection>\n    \u003ch2>6. Hệ Thống Mật Mã Hóa RSA — Phân Tích Từng Chân Tơ Kẽ Tóc\u003c/h2>\n    \u003cp>Năm 1976, ba nhà khoa học tại MIT là \u003cb>R\u003c/b>onald Rivest, Adi \u003cb>S\u003c/b>hamir và Leonard \u003cb>A\u003c/b>dleman đã tạo ra cuộc cách mạng bảo mật toàn cầu với hệ mật mã khóa công khai \u003cb>RSA\u003c/b>.\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ẩn dụ \"Hòm thư có khe nhét thư công khai và Chìa khóa mở riêng biệt\":\u003c/b>\u003cbr>\n      Hãy tưởng tượng em đặt một chiếc hòm thư sắt trước cổng nhà:\u003cbr>\n      • \u003cb>Khóa Công Khai — Public Key $(n, e)$:\u003c/b> Là khe nhét thư mở sẵn cho toàn thế giới biết. Bất kỳ ai cũng có thể dùng cặp số $(n, e)$ này để \u003cb>mã hóa (bỏ thư vào hòm và bấm ổ khóa)\u003c/b> gửi cho em.\u003cbr>\n      • \u003cb>Khóa Bí Mật — Private Key $d$:\u003c/b> Là chiếc chìa khóa mở hòm thư chỉ một mình em giữ trong túi. Một khi thư đã nhét vào hòm (đã mã hóa bằng $e$), ngay cả người vừa gửi thư hay hacker đứng cạnh hòm thư cũng \u003cb>không thể mở ra đọc lại được\u003c/b> nếu không có chìa khóa giải mã $d$!\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức Trọng tâm 5 (Bài 6): Toàn Bộ Quy Trình 3 Giai Đoạn Của Thuật Toán RSA\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\text{1. Tạo khóa: } n = p \\cdot q, \\quad \\varphi(n) = (p-1)(q-1), \\quad \\gcd(e, \\varphi(n)) = 1, \\quad d \\cdot e \\equiv 1 \\pmod{(p-1)(q-1)}$$\n        $$\\text{2. Mã hóa từng khối } M: \\quad \\mathbf{C = M^e \\bmod n} \\qquad \\big|\\qquad \\text{3. Giải mã khối } C: \\quad \\mathbf{M = C^d \\bmod n}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\n          \u003cb>1. Giải nghĩa từng ký hiệu trong RSA:\u003c/b>\u003cbr>\n          • $p, q$: Hai số nguyên tố \u003cb>bí mật\u003c/b> cực lớn ($p \\ne q$).\u003cbr>\n          • $n = p \\cdot q$: Số mô-đu-lô \u003cb>công khai\u003c/b>.\u003cbr>\n          • $\\varphi(n) = (p-1)(q-1)$: Giá trị hàm Euler (bí mật).\u003cbr>\n          • $e$: Số mũ mã hóa \u003cb>công khai\u003c/b>, chọn sao cho nguyên tố cùng nhau với $(p-1)(q-1)$.\u003cbr>\n          • $d$: Số mũ giải mã \u003cb>bí mật\u003c/b>, chính là nghịch đảo của $e$ theo mô-đu-lô $(p-1)(q-1)$.\u003cbr>\n          • $M$: Khối bản rõ dạng số ($0 \\le M \u003c n$); $C$: Khối bản mã.\n        \u003c/div>\n        \u003cdiv>\n          \u003cb>2. Tại sao $C^d \\bmod n$ lại khôi phục được đúng bản rõ $M$? Và tại sao hacker không phá được?\u003c/b>\u003cbr>\n          • \u003cb>Chứng minh giải mã:\u003c/b> Vì $de \\equiv 1 \\pmod{(p-1)(q-1)}$, nên $de = 1 + k(p-1)(q-1)$. Khi tính $C^d = (M^e)^d = M^{de} = M^{1 + k(p-1)(q-1)}$, theo Định lý Fermat nhỏ ($M^{p-1} \\equiv 1 \\pmod p$), biểu thức này rút gọn về đúng $\\mathbf{M \\pmod{pq}}$!\u003cbr>\n          • \u003cb>Độ an toàn tuyệt đối:\u003c/b> Hacker biết $(n, e)$. Muốn tìm khóa giải mã $d$, hacker phải tính được $(p-1)(q-1)$, tức là phải \u003cb>phân tích số $n$ (dài 400 chữ số) thành tích $p \\times q$\u003c/b>. Với các thuật toán tốt nhất hiện nay, việc phân tích thừa số nguyên 400 chữ số mất \u003cb>hàng tỷ năm\u003c/b>!\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003ch3>6.1. Quy Tắc Đóng Gói Chữ Cái Thành Khối Số $2N$ Chữ Số (Trang 32 Slide)\u003c/h3>\n    \u003cp>Trước khi áp dụng công thức $C = M^e \\bmod n$, ta phải đổi chữ cái tiếng Anh sang số ($A=00, B=01, \\dots, Z=25$) rồi ghép thành từng khối (block) có kích thước cố định $2N$ chữ số. Làm sao biết ghép mấy chữ cái thành 1 khối?\u003c/p>\n    \u003cul>\n      \u003cli>\u003cb>Quy tắc tìm kích thước khối $2N$:\u003c/b> Tìm số chữ số chẵn $2N$ lớn nhất sao cho con số $\\underbrace{2525\\dots25}_{2N\\text{ chữ số}}$ \u003cb>nhỏ hơn $n$\u003c/b> ($\\underbrace{2525\\dots25}_{2N} \u003c n$).\u003cbr>\n      \u003ci>Ví dụ:\u003c/i> Với $n = 2537$, ta thấy $25 \u003c 2525 \u003c \\mathbf{2537} \u003c 252525$. Vậy số lớn nhất dạng $25\\dots25$ không vượt quá $2537$ là $\\mathbf{2525}$ (gồm $4$ chữ số, ứng với \u003cb>2 chữ cái một khối\u003c/b>).\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>6.2. Điển Hình 1: Giải Chi Tiết Từng Bước Mã Hóa Chữ \"STOP\" (Trang 35 Slide)\u003c/h3>\n    \u003cdiv class=\"box tip\">\n      \u003cb>Bài toán:\u003c/b> Mã hóa thông điệp \u003cb>\"STOP\"\u003c/b> bằng RSA với khóa công khai $(n = 2537, e = 13)$. (Biết $2537 = 43 \\times 59$, tức $p = 43, q = 59$ và $\\gcd(13, 42 \\times 58) = \\gcd(13, 2436) = 1$).\u003cbr>\n      \u003cb>Trình tự 3 bước làm bài:\u003c/b>\u003cbr>\n      • \u003cb>Bước 1 (Đổi chữ sang số 2 chữ số):\u003c/b> Tra bảng chữ cái ($A=00 \\dots Z=25$):\n      $$\\text{S} \\to \\mathbf{18}, \\qquad \\text{T} \\to \\mathbf{19}, \\qquad \\text{O} \\to \\mathbf{14}, \\qquad \\text{P} \\to \\mathbf{15}$$\n      • \u003cb>Bước 2 (Ghép thành các khối 4 chữ số vì $2525 \u003c 2537 \u003c 252525$):\u003c/b>\u003cbr>\n      Ta được 2 khối bản rõ: Khối 1 là $\\mathbf{M_1 = 1819}$ (\"ST\") và Khối 2 là $\\mathbf{M_2 = 1415}$ (\"OP\").\u003cbr>\n      • \u003cb>Bước 3 (Mã hóa từng khối bằng công thức $C = M^{13} \\bmod 2537$):\u003c/b>\u003cbr>\n      Dùng thuật toán lũy thừa mô-đu-lô nhanh (với $13 = 8 + 4 + 1 = (1101)_2$):\u003cbr>\n      - Với $M_1 = 1819$: Tính $1819^{13} \\bmod 2537 = \\mathbf{2081}$.\u003cbr>\n      - Với $M_2 = 1415$: Tính $1415^{13} \\bmod 2537 = \\mathbf{2182}$.\u003cbr>\n      • \u003cb>Kết quả bản mã gửi đi:\u003c/b> $\\mathbf{2081\\quad 2182}$.\n    \u003c/div>\n\n    \u003ch3>6.3. Điển Hình 2: Giải Chi Tiết Từng Bước Giải Mã \"0981 0461\" Ra Chữ \"HELP\" (Trang 37 Slide)\u003c/h3>\n    \u003cdiv class=\"box tip\">\n      \u003cb>Bài toán:\u003c/b> Nhận được bản mã \u003cb>\"0981 0461\"\u003c/b> được mã hóa bằng khóa RSA $(n = 2537, e = 13)$ ở trên. Hãy tìm khóa giải mã $d$ và khôi phục bản rõ!\u003cbr>\n      \u003cb>Trình tự 3 bước giải mã:\u003c/b>\u003cbr>\n      • \u003cb>Bước 1 (Tìm khóa giải mã bí mật $d$):\u003c/b>\u003cbr>\n      Vì $n = 2537 = 43 \\times 59 \\implies p = 43, q = 59 \\implies \\varphi(n) = (43-1)(59-1) = 42 \\times 58 = \\mathbf{2436}$.\u003cbr>\n      Khóa $d$ là nghịch đảo của $e = 13$ theo mô-đu-lô $2436$: $13 \\cdot d \\equiv 1 \\pmod{2436}$.\u003cbr>\n      Dùng thuật toán Euclid mở rộng (Bézout) cho $\\gcd(2436, 13)$:\u003cbr>\n      $2436 = 187 \\times 13 + 5 \\implies 5 = 2436 - 187 \\times 13$\u003cbr>\n      $13 = 2 \\times 5 + 3 \\implies 3 = 13 - 2 \\times 5$\u003cbr>\n      $5 = 1 \\times 3 + 2 \\implies 2 = 5 - 1 \\times 3$\u003cbr>\n      $3 = 1 \\times 2 + 1 \\implies 1 = 3 - 1 \\times 2$.\u003cbr>\n      Thế ngược từ dưới lên: $1 = 3 - (5 - 3) = 2 \\times 3 - 5 = 2(13 - 2 \\times 5) - 5 = 2 \\times 13 - 5 \\times 5 = 2 \\times 13 - 5(2436 - 187 \\times 13) = \\mathbf{937} \\times 13 - 5 \\times 2436$.\u003cbr>\n      Vậy khóa giải mã bí mật là $\\mathbf{d = 937}$! (Kiểm tra: $13 \\times 937 = 12181 = 5 \\times 2436 + 1 \\equiv 1 \\pmod{2436}$).\u003cbr>\n      • \u003cb>Bước 2 (Giải mã từng khối bằng công thức $M = C^{937} \\bmod 2537$):\u003c/b>\u003cbr>\n      - Khối 1 ($C_1 = 0981$): Tính $0981^{937} \\bmod 2537 = \\mathbf{0704}$.\u003cbr>\n      - Khối 2 ($C_2 = 0461$): Tính $0461^{937} \\bmod 2537 = \\mathbf{1115}$.\u003cbr>\n      • \u003cb>Bước 3 (Tách cặp 2 chữ số và dịch ngược về chữ cái):\u003c/b>\u003cbr>\n      $\\mathbf{07} \\to \\text{H}, \\quad \\mathbf{04} \\to \\text{E}, \\quad \\mathbf{11} \\to \\text{L}, \\quad \\mathbf{15} \\to \\text{P}$.\u003cbr>\n      Vậy tin nhắn gốc chính là chữ: \u003cb>\"HELP\"\u003c/b>!\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- MỤC 7: GIAO THỨC TRAO ĐỔI KHÓA DIFFIE-HELLMAN -->\n  \u003csection>\n    \u003ch2>7. Giao Thức Trao Đổi Khóa Bí Mật Diffie-Hellman (Trang 39-40 Slide)\u003c/h2>\n    \u003cp>Năm 1976, Whitfield Diffie và Martin Hellman giải quyết một bài toán tưởng chừng bất khả thi: \u003ci>\"Làm sao hai người Alice và Bob chưa từng gặp nhau, nói chuyện trên một đường dây điện thoại bị kẻ xấu nghe lén 100%, mà vẫn thống nhất được một mật khẩu bí mật chung mà kẻ nghe lén không thể biết?\"\u003c/i>\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ẩn dụ \"Pha màu sơn công khai\":\u003c/b>\u003cbr>\n      1. Alice và Bob thống nhất công khai một \u003cb>màu sơn vàng chung ($p, a$)\u003c/b>.\u003cbr>\n      2. Alice tự chọn một \u003cb>màu bí mật đỏ ($k_1$)\u003c/b>, pha vào màu vàng tạo ra hỗn hợp Cam ($Y_A = a^{k_1} \\bmod p$) rồi gửi công khai cho Bob.\u003cbr>\n      3. Bob tự chọn một \u003cb>màu bí mật xanh ($k_2$)\u003c/b>, pha vào màu vàng tạo ra hỗn hợp Lục ($Y_B = a^{k_2} \\bmod p$) rồi gửi công khai cho Alice.\u003cbr>\n      4. Nhận được lọ của nhau, Alice đổ thêm màu đỏ bí mật ($k_1$) của mình vào lọ của Bob; Bob đổ thêm màu xanh bí mật ($k_2$) của mình vào lọ của Alice. Cả hai cùng thu được \u003cb>một hỗn hợp màu Nâu y hệt nhau ($K = a^{k_1 k_2} \\bmod p$)\u003c/b>! Kẻ nghe lén chỉ nhìn thấy lọ Cam và lọ Lục trên đường truyền nhưng không thể \"tách sơn\" để lấy ra $k_1, k_2$ (vì bài toán Lô-ga-rít rời rạc là bất khả thi khi $p$ có 300 chữ số!).\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức Trọng tâm 6 (Bài 6): 5 Bước Giao Thức Diffie-Hellman\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$\\text{Công khai: Số nguyên tố } p \\text{ và căn nguyên thủy } a \\text{ của } p$$\n        $$\\text{Alice (bí mật } k_1\\text{) gửi Bob: } \\mathbf{Y_A = a^{k_1} \\bmod p} \\qquad \\big|\\qquad \\text{Bob (bí mật } k_2\\text{) gửi Alice: } \\mathbf{Y_B = a^{k_2} \\bmod p}$$\n        $$\\text{Khóa chung } K = (Y_B)^{k_1} \\bmod p = (Y_A)^{k_2} \\bmod p = \\mathbf{a^{k_1 k_2} \\bmod p}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\n          \u003cb>1. Giải nghĩa ký hiệu:\u003c/b>\u003cbr>\n          • $p, a$: Tham số công khai (ai cũng biết, kể cả hacker).\u003cbr>\n          • $k_1$: Số nguyên bí mật riêng của Alice.\u003cbr>\n          • $k_2$: Số nguyên bí mật riêng của Bob.\u003cbr>\n          • $K$: Khóa bí mật chung cuối cùng hai người cùng tính ra.\n        \u003c/div>\n        \u003cdiv>\n          \u003cb>2. Tại sao hai bên tính ra kết quả giống hệt nhau?\u003c/b>\u003cbr>\n          • Do tính chất lũy thừa: $(a^{k_2})^{k_1} = a^{k_2 \\cdot k_1} = a^{k_1 \\cdot k_2} = (a^{k_1})^{k_2} \\pmod p$.\u003cbr>\n          • Lưu ý: Kẻ nghe lén có trong tay $p, a, (a^{k_1} \\bmod p)$ và $(a^{k_2} \\bmod p)$, nhưng \u003cb>không thể\u003c/b> nhân hai giá trị gửi đi với nhau vì $(a^{k_1} \\cdot a^{k_2}) = a^{k_1 + k_2} \\ne a^{k_1 \\cdot k_2}$!\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- MỤC 8: MÔ HÌNH TƯƠNG TÁC BÀI 6 (RSA, CAESAR & DIFFIE-HELLMAN) -->\n  \u003csection>\n    \u003ch2>8. Phòng Thí Nghiệm Mật Mã Tương Tác (RSA · Diffie-Hellman · Caesar)\u003c/h2>\n    \u003cp>Em hãy trực tiếp điều khiển các thanh trượt dưới đây để xem máy tính thực hiện từng bước Mã hóa/Giải mã RSA, Trao đổi khóa Diffie-Hellman và Dịch chuyển Caesar theo thời gian thực:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"crypto-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"selectCryptoMode('rsa', this)\">1. Hệ Mật Mã RSA (Từng Bước)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectCryptoMode('dh', this)\">2. Trao Đổi Khóa Diffie-Hellman\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectCryptoMode('caesar', this)\">3. Vòng Tròn Mật Mã Caesar\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel id=\"lbl-cr-1\">Chọn cặp nguyên tố $(p, q)$ hoặc Tham số:\u003c/label>\n          \u003cselect id=\"sel-cr-pair\" onchange=\"renderCryptoSim()\">\n            \u003coption value=\"0\" selected>Cặp 1: p = 43, q = 59 (n = 2537, e = 13) — Chuẩn Slide\u003c/option>\n            \u003coption value=\"1\">Cặp 2: p = 11, q = 13 (n = 143, e = 7) — Số nhỏ dễ nhẩm\u003c/option>\n            \u003coption value=\"2\">Cặp 3: p = 17, q = 23 (n = 391, e = 3) — Khóa e = 3\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel id=\"lbl-cr-2\">Giá trị Bản rõ $M$ / Khóa $k_1$ (\u003cspan id=\"val-cr-m\">18\u003c/span>):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-cr-m\" min=\"2\" max=\"85\" step=\"1\" value=\"18\" oninput=\"renderCryptoSim()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel id=\"lbl-cr-3\">Khóa dịch chuyển $k$ / Khóa $k_2$ (\u003cspan id=\"val-cr-k\">3\u003c/span>):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-cr-k\" min=\"1\" max=\"25\" step=\"1\" value=\"3\" oninput=\"renderCryptoSim()\">\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"crypto-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"crypto-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- MỤC 9: BÀI TẬP TRỌNG TÂM BÀI 6 (CÓ GỢI Ý & LỜI GIẢI CHI TIẾT) -->\n  \u003csection>\n    \u003ch2>9. Bài Tập Trọng Tâm Bài 6 (Luyện Thi Thực Chiến Giải Chi Tiết)\u003c/h2>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-b6-1\">Câu 1: Tìm Nghịch đảo Modulo bằng Định lý Bézout\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Tìm nghịch đảo của $a = 19$ theo mô-đu-lô $m = 141$ (tức tìm $\\overline{a} \\in \\{1, \\dots, 140\\}$ sao cho $19\\overline{a} \\equiv 1 \\pmod{141}$). Từ đó giải phương trình đồng dư: $19x \\equiv 4 \\pmod{141}$.\u003c/p>\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('h-b6-1')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('s-b6-1')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"h-b6-1\" class=\"panel\">\n        Bước 1: Dùng thuật toán Euclid chia xuôi $141$ cho $19$ đến khi dư $1$.\u003cbr>\n        Bước 2: Thế ngược từ dưới lên để viết $1 = s \\cdot 19 + t \\cdot 141$. Khi có $\\overline{a}$, nhân cả 2 vế của $19x \\equiv 4 \\pmod{141}$ với $\\overline{a}$ để tìm $x$.\n      \u003c/div>\n      \u003cdiv id=\"s-b6-1\" class=\"panel\">\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 1: Chia xuôi Euclid để tìm $\\gcd(141, 19)$:\u003c/b>\n          \u003cul>\n            \u003cli>(1) $141 = 7 \\times 19 + \\mathbf{8} \\implies \\mathbf{8} = 141 - 7 \\times 19$\u003c/li>\n            \u003cli>(2) $19 = 2 \\times 8 + \\mathbf{3} \\implies \\mathbf{3} = 19 - 2 \\times 8$\u003c/li>\n            \u003cli>(3) $8 = 2 \\times 3 + \\mathbf{2} \\implies \\mathbf{2} = 8 - 2 \\times 3$\u003c/li>\n            \u003cli>(4) $3 = 1 \\times 2 + \\mathbf{1} \\implies \\mathbf{1} = 3 - 1 \\times 2$\u003c/li>\n          \u003c/ul>\n          Vì số dư cuối cùng là $1$, nên $\\gcd(19, 141) = 1$, chắc chắn tồn tại nghịch đảo!\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 2: Thế ngược Bézout từ (4) lên (1):\u003c/b>\n          $$1 = 3 - 1 \\times \\mathbf{2} = 3 - 1 \\times (8 - 2 \\times 3) = \\mathbf{3} \\times \\mathbf{3} - 1 \\times 8$$\n          \u003cspan class=\"cmt\">// Thay tiếp $\\mathbf{3} = 19 - 2 \\times 8$ từ (2) vào:\u003c/span>\n          $$1 = 3 \\times (19 - 2 \\times 8) - 1 \\times 8 = 3 \\times 19 - \\mathbf{7} \\times \\mathbf{8}$$\n          \u003cspan class=\"cmt\">// Thay tiếp $\\mathbf{8} = 141 - 7 \\times 19$ từ (1) vào:\u003c/span>\n          $$1 = 3 \\times 19 - 7 \\times (141 - 7 \\times 19) = \\mathbf{52} \\times 19 - 7 \\times 141$$\n          Lấy mô-đu-lô $141$ hai vế, vì $-7 \\times 141 \\equiv 0 \\pmod{141}$ nên:\n          $$52 \\times 19 \\equiv 1 \\pmod{141} \\implies \\text{Nghịch đảo của } 19 \\text{ mod } 141 \\text{ là } \\mathbf{\\overline{a} = 52}$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 3: Giải phương trình $19x \\equiv 4 \\pmod{141}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Nhân cả hai vế với nghịch đảo $52$:\u003c/span>\n          $$52 \\cdot (19x) \\equiv 52 \\cdot 4 \\pmod{141} \\iff 1 \\cdot x \\equiv 208 \\pmod{141}$$\n          Vì $208 \\bmod 141 = 67$, nghiệm của phương trình là $\\mathbf{x \\equiv 67 \\pmod{141}}$.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-b6-2\">Câu 2: Bài tập toàn diện Hệ mật mã RSA (Từ tạo khóa đến Mã hóa & Giải mã)\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Giả sử hệ thống RSA sử dụng hai số nguyên tố $p = 11$ và $q = 13$, với số mũ mã hóa công khai $e = 7$.\u003cbr>\n      a) Tính mô-đu-lô $n$, $\\varphi(n) = (p-1)(q-1)$ và kiểm tra điều kiện hợp lệ của khóa $e = 7$.\u003cbr>\n      b) Tìm khóa giải mã bí mật $d$.\u003cbr>\n      c) Mã hóa bản rõ số $M = 9$ để tìm bản mã $C$, sau đó kiểm tra lại bằng cách giải mã $C$ về $M$.\u003c/p>\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('h-b6-2')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('s-b6-2')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"h-b6-2\" class=\"panel\">\n        a) $n = 11 \\times 13 = 143$; $\\varphi(n) = 10 \\times 12 = 120$.\u003cbr>\n        b) Tìm $d$ sao cho $7d \\equiv 1 \\pmod{120}$ bằng thuật toán Euclid.\u003cbr>\n        c) Tính $C = 9^7 \\bmod 143$ bằng cách tách $7 = 4 + 2 + 1 = (111)_2$.\n      \u003c/div>\n      \u003cdiv id=\"s-b6-2\" class=\"panel\">\n        \u003cdiv class=\"step\">\n          \u003cb>a) Tính thông số khóa công khai:\u003c/b>\u003cbr>\n          • Mô-đu-lô: $n = p \\cdot q = 11 \\times 13 = \\mathbf{143}$.\u003cbr>\n          • Giá trị $\\varphi(n) = (p-1)(q-1) = 10 \\times 12 = \\mathbf{120}$.\u003cbr>\n          • Kiểm tra: $\\gcd(e, \\varphi(n)) = \\gcd(7, 120) = 1$ (vì $120 = 17 \\times 7 + 1$). Vậy khóa công khai $(143, 7)$ hoàn toàn hợp lệ!\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cb>b) Tìm khóa giải mã bí mật $d$:\u003c/b>\n          \u003cspan class=\"cmt\">// Ta cần tìm $d$ là nghịch đảo của $7$ theo mô-đu-lô $120$: $7d \\equiv 1 \\pmod{120}$.\u003c/span>\n          Từ phép chia Euclid: $120 = 17 \\times 7 + 1 \\implies 1 = 1 \\times 120 + \\mathbf{(-17)} \\times 7$.\u003cbr>\n          Do đó hệ số Bézout đi với $7$ là $s = -17$. Vì khóa $d$ phải dương ($0 \u003c d \u003c 120$), ta cộng thêm $120$:\n          $$d = -17 + 120 = \\mathbf{103}$$\n          \u003ci>(Kiểm tra: $7 \\times 103 = 721 = 6 \\times 120 + 1 \\equiv 1 \\pmod{120}$, chính xác!).\u003c/i>\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cb>c) Mã hóa bản rõ $M = 9$ và Giải mã:\u003c/b>\u003cbr>\n          • \u003cb>Mã hóa ($C = 9^7 \\bmod 143$):\u003c/b> Đổi $7 = 4 + 2 + 1$. Ta tính các lũy thừa bậc 2 của $9 \\bmod 143$:\u003cbr>\n          - $9^1 \\bmod 143 = 9$\u003cbr>\n          - $9^2 \\bmod 143 = 81$\u003cbr>\n          - $9^4 \\bmod 143 = 81^2 \\bmod 143 = 6561 \\bmod 143 = 126$ (vì $6561 = 45 \\times 143 + 126$).\u003cbr>\n          Vậy $C = 9^7 \\bmod 143 = (9^4 \\cdot 9^2 \\cdot 9^1) \\bmod 143 = (126 \\times 81 \\times 9) \\bmod 143 = \\mathbf{48}$.\u003cbr>\n          • \u003cb>Giải mã ($M = 48^{103} \\bmod 143$):\u003c/b> Đổi $103 = 64 + 32 + 4 + 2 + 1 = (1100111)_2$.\u003cbr>\n          Tính bình phương liên tiếp của $48 \\bmod 143$: $48^1 \\equiv 48$; $48^2 = 2304 \\equiv 16$; $48^4 \\equiv 16^2 = 256 \\equiv 113$; $48^8 \\equiv 113^2 \\equiv 16$; $48^{16} \\equiv 113$; $48^{32} \\equiv 16$; $48^{64} \\equiv 113$.\u003cbr>\n          Nhân các vị trí bit $1$: $M = (48^{64} \\cdot 48^{32} \\cdot 48^4 \\cdot 48^2 \\cdot 48^1) \\bmod 143 = (113 \\times 16 \\times 113 \\times 16 \\times 48) \\bmod 143 = \\mathbf{9}$ (Khôi phục đúng bản rõ $M = 9$ ban đầu!).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"bt-b6-3\">Câu 3: Trao đổi khóa Diffie-Hellman\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Alice và Bob thống nhất sử dụng số nguyên tố công khai $p = 23$ và căn nguyên thủy $a = 5$. Alice chọn số bí mật $k_1 = 6$, Bob chọn số bí mật $k_2 = 15$. Hãy tính giá trị công khai mà mỗi người gửi cho nhau và khóa bí mật chung cuối cùng mà hai người thiết lập được.\u003c/p>\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('h-b6-3')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('s-b6-3')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"h-b6-3\" class=\"panel\">\n        Alice gửi $Y_A = 5^6 \\bmod 23$. Bob gửi $Y_B = 5^{15} \\bmod 23$. Sau đó Alice tính $(Y_B)^6 \\bmod 23$ và Bob tính $(Y_A)^{15} \\bmod 23$.\n      \u003c/div>\n      \u003cdiv id=\"s-b6-3\" class=\"panel\">\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 1: Giá trị Alice gửi cho Bob ($Y_A = 5^6 \\bmod 23$):\u003c/b>\u003cbr>\n          Ta có $5^2 \\bmod 23 = 25 \\bmod 23 = 2$.\u003cbr>\n          Suy ra $Y_A = 5^6 \\bmod 23 = (5^2)^3 \\bmod 23 = 2^3 \\bmod 23 = \\mathbf{8}$. (Alice gửi số $8$ cho Bob).\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 2: Giá trị Bob gửi cho Alice ($Y_B = 5^{15} \\bmod 23$):\u003c/b>\u003cbr>\n          Ta tách $5^{15} = (5^2)^7 \\cdot 5^1 \\equiv 2^7 \\cdot 5 = 128 \\times 5 = 640 \\pmod{23}$.\u003cbr>\n          Vì $640 = 27 \\times 23 + \\mathbf{19}$, nên $Y_B = \\mathbf{19}$. (Bob gửi số $19$ cho Alice).\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 3: Cả hai bên tự tính Khóa bí mật chung $K$:\u003c/b>\u003cbr>\n          • \u003cb>Phía Bob tính:\u003c/b> $K = (Y_A)^{k_2} \\bmod 23 = 8^{15} \\bmod 23 = (2^3)^{15} \\bmod 23 = 2^{45} \\bmod 23$.\u003cbr>\n          Vì $2^{11} = 2048 = 89 \\times 23 + 1 \\equiv 1 \\pmod{23}$, nên $2^{45} = (2^{11})^4 \\cdot 2^1 \\equiv 1^4 \\cdot 2 = \\mathbf{2} \\pmod{23}$.\u003cbr>\n          • \u003cb>Phía Alice tính:\u003c/b> $K = (Y_B)^{k_1} \\bmod 23 = 19^6 \\bmod 23 = (-4)^6 \\bmod 23 = 2^{12} \\bmod 23 = 2^{11} \\cdot 2^1 \\equiv \\mathbf{2} \\pmod{23}$.\u003cbr>\n          Vậy khóa bí mật chung của Alice và Bob là $\\mathbf{K = 2}$!\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sum\">\n    \u003ch2>Tổng Kết Bài 6: Bản Đồ Tư Duy Mật Mã Học Cần Nhớ\u003c/h2>\n    \u003cul>\n      \u003cli>\u003cb>Đồng dư & Nghịch đảo:\u003c/b> $a \\equiv b \\pmod m \\iff (a-b) \\vdots m$. Muốn tìm nghịch đảo $\\overline{a}$ của $a \\pmod m$ (khi $\\gcd(a,m)=1$), dùng thuật toán Euclid chia xuôi rồi thế ngược Bézout để tìm hệ số $s$ trong $sa + tm = 1$.\u003c/li>\n      \u003cli>\u003cb>Lũy thừa mô-đu-lô nhanh ($b^n \\bmod m$):\u003c/b> Đổi số mũ $n$ sang nhị phân, bình phương biến $\\text{power}$ qua từng bước và chỉ nhân vào $x$ tại những vị trí bit nhị phân bằng $1$.\u003c/li>\n      \u003cli>\u003cb>Hệ mật mã RSA:\u003c/b> Khóa công khai $(n = pq, e)$ với $\\gcd(e, (p-1)(q-1)) = 1$. Khóa giải mã bí mật $d$ thỏa mãn $de \\equiv 1 \\pmod{(p-1)(q-1)}$. Mã hóa: $C = M^e \\bmod n$; Giải mã: $M = C^d \\bmod n$.\u003c/li>\n      \u003cli>\u003cb>Giao thức Diffie-Hellman:\u003c/b> Alice gửi $a^{k_1} \\bmod p$, Bob gửi $a^{k_2} \\bmod p$, khóa chung là $K = a^{k_1 k_2} \\bmod p$.\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\u003c/template>\n\n\u003cscript>\nconst $ = id => document.getElementById(id);\n\n/* 1. Hàm đóng/mở khung Gợi ý & Lời giải chi tiết */\nfunction togglePanel(id) {\n  const el = $(id);\n  if (el) el.classList.toggle('open');\n}\nwindow.togglePanel = togglePanel;\n\n/* ==========================================================================\n   MÔ HÌNH TƯƠNG TÁC BÀI 5: MẠCH LOGIC & TIỂU HẠNG (MINTERM)\n   ========================================================================== */\nlet currentBoolMode = 'vote';\n\nfunction selectBoolMode(mode, btn) {\n  currentBoolMode = mode;\n  if (btn) {\n    document.querySelectorAll('#bool-tabs .sim-tab').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n  }\n  renderBoolSim();\n}\nwindow.selectBoolMode = selectBoolMode;\n\nfunction renderBoolSim() {\n  const svgEl = $('bool-svg'), descEl = $('bool-desc');\n  if (!svgEl || !descEl) return;\n\n  const x = +$('sl-bx').value;\n  const y = +$('sl-by').value;\n  const z = +$('sl-bz').value;\n\n  $('val-bx').textContent = x;\n  $('val-by').textContent = y;\n  $('val-bz').textContent = z;\n\n  const mintermLatex = `${x ? 'x' : '\\\\overline{x}'}${y ? 'y' : '\\\\overline{y}'}${z ? 'z' : '\\\\overline{z}'}`;\n  let outVal = 0, out2Val = 0, exprText = '', circuitTitle = '';\n\n  if (currentBoolMode === 'vote') {\n    outVal = (x && y) || (x && z) || (y && z) ? 1 : 0;\n    circuitTitle = 'Mạch Biểu Quyết Đa Số (3 người $x, y, z$)';\n    exprText = `Đầu ra $F(x,y,z) = xy + xz + yz = ${x}\\\\cdot${y} + ${x}\\\\cdot${z} + ${y}\\\\cdot${z} = \\\\mathbf{${outVal}}$ (${outVal ? 'Đề xuất ĐƯỢC THÔNG QUA' : 'Đề xuất BỊ TỪ CHỐI'}).`;\n  } else if (currentBoolMode === 'adder') {\n    outVal = (x ^ y); // Sum\n    out2Val = (x & y); // Carry\n    circuitTitle = 'Bộ Bán Cộng Nhị Phân (Half Adder — dùng 2 bit $x, y$)';\n    exprText = `Bit Tổng $\\\\text{Sum} = (x+y)\\\\overline{(xy)} = \\\\mathbf{${outVal}}$ | Bit Nhớ $\\\\text{Carry} = xy = \\\\mathbf{${out2Val}}$ (Kết quả nhị phân: $x+y = ${out2Val}${outVal}_2$).`;\n  } else {\n    outVal = (x ^ y ^ z);\n    circuitTitle = 'Mạch Điều Khiển Đèn Cầu Thang 3 Công Tắc ($x, y, z$)';\n    exprText = `Đầu ra $F = xyz + x\\\\overline{y}\\\\overline{z} + \\\\overline{x}y\\\\overline{z} + \\\\overline{x}\\\\overline{y}z = \\\\mathbf{${outVal}}$ (${outVal ? 'ĐÈN ĐANG SÁNG' : 'ĐÈN ĐANG TẮT'}).`;\n  }\n\n  descEl.innerHTML = `\u003cb>${circuitTitle}:\u003c/b> Bộ đầu vào hiện tại là $(x=${x}, y=${y}, z=${z})$ ứng với tiểu hạng $\\\\mathbf{${mintermLatex} = 1}$.\u003cbr>${exprText}`;\n\n  const cOn = 'var(--c2)', cOff = 'var(--mut)';\n  const colX = x ? cOn : cOff;\n  const colY = y ? cOn : cOff;\n  const colZ = z ? cOn : cOff;\n  const colOut = outVal ? 'var(--c4)' : cOff;\n\n  let svg = '';\n  // Vẽ 3 nút đầu vào bên trái\n  const drawNode = (cx, cy, label, val, col) => `\n    \u003crect x=\"${cx-36}\" y=\"${cy-18}\" width=\"72\" height=\"36\" rx=\"10\" fill=\"var(--card)\" stroke=\"${col}\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"${cx}\" y=\"${cy+5}\" text-anchor=\"middle\" style=\"font-weight:800;fill:${col}\">${label} = ${val}\u003c/text>\n  `;\n\n  svg += drawNode(65, 50, 'x', x, colX);\n  svg += drawNode(65, 115, 'y', y, colY);\n  if (currentBoolMode !== 'adder') {\n    svg += drawNode(65, 180, 'z', z, colZ);\n  }\n\n  // Vẽ khối xử lý trung tâm & đường dây\n  if (currentBoolMode === 'adder') {\n    const colCarry = out2Val ? 'var(--c1)' : cOff;\n    svg += `\u003cline x1=\"101\" y1=\"50\" x2=\"250\" y2=\"70\" stroke=\"${colX}\" stroke-width=\"3\"/>`;\n    svg += `\u003cline x1=\"101\" y1=\"115\" x2=\"250\" y2=\"90\" stroke=\"${colY}\" stroke-width=\"3\"/>`;\n    svg += `\u003cline x1=\"101\" y1=\"50\" x2=\"250\" y2=\"155\" stroke=\"${colX}\" stroke-width=\"3\"/>`;\n    svg += `\u003cline x1=\"101\" y1=\"115\" x2=\"250\" y2=\"175\" stroke=\"${colY}\" stroke-width=\"3\"/>`;\n\n    svg += `\u003crect x=\"250\" y=\"50\" width=\"170\" height=\"55\" rx=\"14\" fill=\"var(--card)\" stroke=\"var(--c5)\" stroke-width=\"2.5\"/>`;\n    svg += `\u003ctext x=\"335\" y=\"83\" text-anchor=\"middle\" style=\"font-weight:700\">Cổng XOR: (x+y)(xy)'\u003c/text>`;\n\n    svg += `\u003crect x=\"250\" y=\"138\" width=\"170\" height=\"55\" rx=\"14\" fill=\"var(--card)\" stroke=\"var(--c1)\" stroke-width=\"2.5\"/>`;\n    svg += `\u003ctext x=\"335\" y=\"171\" text-anchor=\"middle\" style=\"font-weight:700\">Cổng AND: x · y\u003c/text>`;\n\n    svg += `\u003cline x1=\"420\" y1=\"78\" x2=\"520\" y2=\"78\" stroke=\"${colOut}\" stroke-width=\"3.5\"/>`;\n    svg += `\u003cline x1=\"420\" y1=\"165\" x2=\"520\" y2=\"165\" stroke=\"${colCarry}\" stroke-width=\"3.5\"/>`;\n\n    svg += `\u003crect x=\"520\" y=\"53\" width=\"135\" height=\"50\" rx=\"14\" fill=\"var(--card)\" stroke=\"${colOut}\" stroke-width=\"3\"/>`;\n    svg += `\u003ctext x=\"587\" y=\"83\" text-anchor=\"middle\" style=\"font-weight:800;fill:${colOut}\">Sum = ${outVal}\u003c/text>`;\n\n    svg += `\u003crect x=\"520\" y=\"140\" width=\"135\" height=\"50\" rx=\"14\" fill=\"var(--card)\" stroke=\"${colCarry}\" stroke-width=\"3\"/>`;\n    svg += `\u003ctext x=\"587\" y=\"170\" text-anchor=\"middle\" style=\"font-weight:800;fill:${colCarry}\">Carry = ${out2Val}\u003c/text>`;\n  } else {\n    svg += `\u003cline x1=\"101\" y1=\"50\" x2=\"230\" y2=\"95\" stroke=\"${colX}\" stroke-width=\"3\"/>`;\n    svg += `\u003cline x1=\"101\" y1=\"115\" x2=\"230\" y2=\"115\" stroke=\"${colY}\" stroke-width=\"3\"/>`;\n    svg += `\u003cline x1=\"101\" y1=\"180\" x2=\"230\" y2=\"135\" stroke=\"${colZ}\" stroke-width=\"3\"/>`;\n\n    svg += `\u003crect x=\"230\" y=\"65\" width=\"220\" height=\"100\" rx=\"18\" fill=\"var(--card)\" stroke=\"var(--c5)\" stroke-width=\"2.5\"/>`;\n    svg += `\u003ctext x=\"340\" y=\"105\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c5)\">${currentBoolMode === 'vote' ? 'MẠCH TỔ HỢP AND-OR' : 'MẠCH ĐÈN 3 CÔNG TẮC'}\u003c/text>`;\n    svg += `\u003ctext x=\"340\" y=\"132\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--mut)\">${currentBoolMode === 'vote' ? 'F = xy + xz + yz' : 'Bật khi số bit 1 là số lẻ'}\u003c/text>`;\n\n    svg += `\u003cline x1=\"450\" y1=\"115\" x2=\"525\" y2=\"115\" stroke=\"${colOut}\" stroke-width=\"4\"/>`;\n    svg += `\u003crect x=\"525\" y=\"82\" width=\"135\" height=\"66\" rx=\"16\" fill=\"var(--card)\" stroke=\"${colOut}\" stroke-width=\"3.5\"/>`;\n    svg += `\u003ctext x=\"592\" y=\"112\" text-anchor=\"middle\" style=\"font-weight:800;fill:${colOut}\">ĐẦU RA F = ${outVal}\u003c/text>`;\n    svg += `\u003ctext x=\"592\" y=\"133\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:700;fill:${colOut}\">${outVal ? '● CÓ ĐIỆN (1)' : '○ NGẮT ĐIỆN (0)'}\u003c/text>`;\n  }\n\n  svgEl.innerHTML = svg;\n  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);\n}\nwindow.renderBoolSim = renderBoolSim;\n\n/* ==========================================================================\n   MÔ HÌNH TƯƠNG TÁC BÀI 6: MẬT MÃ RSA, DIFFIE-HELLMAN & CAESAR\n   ========================================================================== */\nlet currentCryptoMode = 'rsa';\n\n// Hàm lũy thừa mô-đu-lô nhanh chuẩn xác\nfunction modPow(base, exp, mod) {\n  let res = 1n;\n  let b = BigInt(base) % BigInt(mod);\n  let e = BigInt(exp);\n  const m = BigInt(mod);\n  while (e > 0n) {\n    if (e % 2n === 1n) res = (res * b) % m;\n    b = (b * b) % m;\n    e /= 2n;\n  }\n  return Number(res);\n}\n\nfunction selectCryptoMode(mode, btn) {\n  currentCryptoMode = mode;\n  if (btn) {\n    document.querySelectorAll('#crypto-tabs .sim-tab').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n  }\n  renderCryptoSim();\n}\nwindow.selectCryptoMode = selectCryptoMode;\n\nfunction renderCryptoSim() {\n  const svgEl = $('crypto-svg'), descEl = $('crypto-desc');\n  if (!svgEl || !descEl) return;\n\n  const pairIdx = $('sel-cr-pair') ? +$('sel-cr-pair').value : 0;\n  const mVal = +$('sl-cr-m').value;\n  const kVal = +$('sl-cr-k').value;\n\n  $('val-cr-m').textContent = mVal;\n  $('val-cr-k').textContent = kVal;\n\n  const rsaConfigs = [\n    { p: 43, q: 59, n: 2537, phi: 2436, e: 13, d: 937 },\n    { p: 11, q: 13, n: 143,  phi: 120,  e: 7,  d: 103 },\n    { p: 17, q: 23, n: 391,  phi: 352,  e: 3,  d: 235 }\n  ];\n  const cfg = rsaConfigs[pairIdx] || rsaConfigs[0];\n\n  let svg = '';\n\n  if (currentCryptoMode === 'rsa') {\n    const C = modPow(mVal, cfg.e, cfg.n);\n    const M_dec = modPow(C, cfg.d, cfg.n);\n    const binE = cfg.e.toString(2);\n\n    descEl.innerHTML = `\u003cb>Trạng thái Hệ mật mã RSA:\u003c/b> Khóa công khai $(n = ${cfg.p}\\\\times${cfg.q} = \\\\mathbf{${cfg.n}},\\\\ e = \\\\mathbf{${cfg.e}})$ | $\\\\varphi(n) = (p-1)(q-1) = \\\\mathbf{${cfg.phi}}$ | Khóa giải mã bí mật $\\\\mathbf{d = ${cfg.d}}$ (vì $${cfg.e}\\\\times${cfg.d} \\\\equiv 1 \\\\pmod{${cfg.phi}}$).\u003cbr>\n    • \u003cb>Bước Mã hóa:\u003c/b> Bản rõ $M = \\\\mathbf{${mVal}} \\\\xrightarrow{e=${cfg.e}=(${binE})_2} C = ${mVal}^{${cfg.e}} \\\\bmod ${cfg.n} = \\\\mathbf{${C}}$.\u003cbr>\n    • \u003cb>Bước Giải mã:\u003c/b> Bản mã $C = \\\\mathbf{${C}} \\\\xrightarrow{d=${cfg.d}} M = ${C}^{${cfg.d}} \\\\bmod ${cfg.n} = \\\\mathbf{${M_dec}}$ (Khôi phục chính xác 100%!).`;\n\n    // Vẽ sơ đồ luồng RSA 3 bước\n    svg += `\n      \u003crect x=\"24\" y=\"55\" width=\"165\" height=\"140\" rx=\"16\" fill=\"var(--card)\" stroke=\"var(--c2)\" stroke-width=\"3\"/>\n      \u003ctext x=\"106\" y=\"88\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c2)\">1. BẢN RÕ GỐC (M)\u003c/text>\n      \u003ctext x=\"106\" y=\"130\" text-anchor=\"middle\" style=\"font-size:26px;font-weight:800;fill:var(--ink)\">M = ${mVal}\u003c/text>\n      \u003ctext x=\"106\" y=\"168\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--mut)\">Chưa mã hóa\u003c/text>\n\n      \u003cline x1=\"189\" y1=\"125\" x2=\"255\" y2=\"125\" stroke=\"var(--c1)\" stroke-width=\"3.5\"/>\n      \u003ctext x=\"222\" y=\"112\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:700;fill:var(--c1)\">M^${cfg.e} mod ${cfg.n}\u003c/text>\n\n      \u003crect x=\"255\" y=\"45\" width=\"170\" height=\"160\" rx=\"16\" fill=\"var(--card)\" stroke=\"var(--c4)\" stroke-width=\"3\"/>\n      \u003ctext x=\"340\" y=\"78\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c4)\">2. BẢN MÃ (C)\u003c/text>\n      \u003ctext x=\"340\" y=\"125\" text-anchor=\"middle\" style=\"font-size:26px;font-weight:800;fill:var(--c4)\">C = ${C}\u003c/text>\n      \u003ctext x=\"340\" y=\"158\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--mut)\">Truyền qua Internet\u003c/text>\n      \u003ctext x=\"340\" y=\"180\" text-anchor=\"middle\" style=\"font-size:11.5px;font-weight:700;fill:var(--c5)\">Khóa công khai (${cfg.n}, ${cfg.e})\u003c/text>\n\n      \u003cline x1=\"425\" y1=\"125\" x2=\"491\" y2=\"125\" stroke=\"var(--c5)\" stroke-width=\"3.5\"/>\n      \u003ctext x=\"458\" y=\"112\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:700;fill:var(--c5)\">C^${cfg.d} mod ${cfg.n}\u003c/text>\n\n      \u003crect x=\"491\" y=\"55\" width=\"165\" height=\"140\" rx=\"16\" fill=\"var(--card)\" stroke=\"var(--c2)\" stroke-width=\"3\"/>\n      \u003ctext x=\"573\" y=\"88\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c2)\">3. GIẢI MÃ (M)\u003c/text>\n      \u003ctext x=\"573\" y=\"130\" text-anchor=\"middle\" style=\"font-size:26px;font-weight:800;fill:var(--c2)\">M = ${M_dec}\u003c/text>\n      \u003ctext x=\"573\" y=\"168\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:700;fill:var(--c5)\">Dùng khóa bí mật d = ${cfg.d}\u003c/text>\n    `;\n  } else if (currentCryptoMode === 'dh') {\n    const p = 23, a = 5;\n    const k1 = mVal, k2 = kVal;\n    const YA = modPow(a, k1, p);\n    const YB = modPow(a, k2, p);\n    const KA = modPow(YB, k1, p);\n    const KB = modPow(YA, k2, p);\n\n    descEl.innerHTML = `\u003cb>Giao thức Trao đổi khóa Diffie-Hellman:\u003c/b> Tham số công khai $p = \\\\mathbf{23}$, căn nguyên thủy $a = \\\\mathbf{5}$.\u003cbr>\n    • \u003cb>Alice\u003c/b> chọn số bí mật $k_1 = \\\\mathbf{${k1}}$, tính $Y_A = 5^{${k1}} \\\\bmod 23 = \\\\mathbf{${YA}}$ gửi cho Bob.\u003cbr>\n    • \u003cb>Bob\u003c/b> chọn số bí mật $k_2 = \\\\mathbf{${k2}}$, tính $Y_B = 5^{${k2}} \\\\bmod 23 = \\\\mathbf{${YB}}$ gửi cho Alice.\u003cbr>\n    • \u003cb>Khóa bí mật chung thiết lập được:\u003c/b> Alice tính $(Y_B)^{k_1} \\\\bmod 23 = ${YB}^{${k1}} \\\\bmod 23 = \\\\mathbf{${KA}}$ | Bob tính $(Y_A)^{k_2} \\\\bmod 23 = ${YA}^{${k2}} \\\\bmod 23 = \\\\mathbf{${KB}}$.`;\n\n    svg += `\n      \u003crect x=\"28\" y=\"35\" width=\"195\" height=\"180\" rx=\"16\" fill=\"var(--card)\" stroke=\"var(--c1)\" stroke-width=\"3\"/>\n      \u003ctext x=\"125\" y=\"66\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c1)\">ALICE (Bí mật k₁ = ${k1})\u003c/text>\n      \u003ctext x=\"125\" y=\"102\" text-anchor=\"middle\" style=\"font-size:13.5px\">Tính công khai:\u003c/text>\n      \u003ctext x=\"125\" y=\"128\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--ink)\">Y_A = 5^${k1} mod 23 = ${YA}\u003c/text>\n      \u003ctext x=\"125\" y=\"170\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c2)\">Khóa chung K = ${KA}\u003c/text>\n\n      \u003cline x1=\"223\" y1=\"95\" x2=\"457\" y2=\"95\" stroke=\"var(--c3)\" stroke-width=\"3\" stroke-dasharray=\"6,4\"/>\n      \u003ctext x=\"340\" y=\"84\" text-anchor=\"middle\" style=\"font-weight:700;fill:var(--ink)\">Gửi công khai Y_A = ${YA} →\u003c/text>\n\n      \u003cline x1=\"457\" y1=\"145\" x2=\"223\" y2=\"145\" stroke=\"var(--c4)\" stroke-width=\"3\" stroke-dasharray=\"6,4\"/>\n      \u003ctext x=\"340\" y=\"134\" text-anchor=\"middle\" style=\"font-weight:700;fill:var(--ink)\">← Gửi công khai Y_B = ${YB}\u003c/text>\n\n      \u003crect x=\"457\" y=\"35\" width=\"195\" height=\"180\" rx=\"16\" fill=\"var(--card)\" stroke=\"var(--c5)\" stroke-width=\"3\"/>\n      \u003ctext x=\"554\" y=\"66\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c5)\">BOB (Bí mật k₂ = ${k2})\u003c/text>\n      \u003ctext x=\"554\" y=\"102\" text-anchor=\"middle\" style=\"font-size:13.5px\">Tính công khai:\u003c/text>\n      \u003ctext x=\"554\" y=\"128\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--ink)\">Y_B = 5^${k2} mod 23 = ${YB}\u003c/text>\n      \u003ctext x=\"554\" y=\"170\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c2)\">Khóa chung K = ${KB}\u003c/text>\n    `;\n  } else {\n    const alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\";\n    const pIdx = mVal % 26;\n    const cIdx = (pIdx + kVal) % 26;\n    const pChar = alphabet[pIdx];\n    const cChar = alphabet[cIdx];\n\n    descEl.innerHTML = `\u003cb>Mật mã dịch chuyển Caesar (Modulo 26):\u003c/b> Đang chọn chữ cái gốc \u003cb>'${pChar}'\u003c/b> (số thứ tự $p = \\\\mathbf{${pIdx}}$) và khóa dịch chuyển $k = \\\\mathbf{${kVal}}$ vị trí.\u003cbr>\n    • \u003cb>Hàm mã hóa:\u003c/b> $f(${pIdx}) = (${pIdx} + ${kVal}) \\\\bmod 26 = \\\\mathbf{${cIdx}}$ $\\\\rightarrow$ Chữ cái mã hóa là \u003cb>'${cChar}'\u003c/b>.\u003cbr>\n    • \u003cb>Hàm giải mã:\u003c/b> $f^{-1}(${cIdx}) = (${cIdx} - ${kVal}) \\\\bmod 26 = \\\\mathbf{${pIdx}}$ $\\\\rightarrow$ Trở về chữ cái gốc \u003cb>'${pChar}'\u003c/b>.`;\n\n    svg += `\n      \u003crect x=\"45\" y=\"55\" width=\"180\" height=\"140\" rx=\"18\" fill=\"var(--card)\" stroke=\"var(--c2)\" stroke-width=\"3\"/>\n      \u003ctext x=\"135\" y=\"88\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c2)\">CHỮ CÁI RÕ (p)\u003c/text>\n      \u003ctext x=\"135\" y=\"138\" text-anchor=\"middle\" style=\"font-size:34px;font-weight:800\">'${pChar}' (${pIdx \u003c 10 ? '0'+pIdx : pIdx})\u003c/text>\n\n      \u003cline x1=\"225\" y1=\"105\" x2=\"455\" y2=\"105\" stroke=\"var(--c1)\" stroke-width=\"3.5\"/>\n      \u003ctext x=\"340\" y=\"92\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c1)\">Mã hóa: (p + ${kVal}) mod 26 →\u003c/text>\n\n      \u003cline x1=\"455\" y1=\"150\" x2=\"225\" y2=\"150\" stroke=\"var(--c5)\" stroke-width=\"3.5\" stroke-dasharray=\"5,5\"/>\n      \u003ctext x=\"340\" y=\"175\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c5)\">← Giải mã: (c - ${kVal}) mod 26\u003c/text>\n\n      \u003crect x=\"455\" y=\"55\" width=\"180\" height=\"140\" rx=\"18\" fill=\"var(--card)\" stroke=\"var(--c4)\" stroke-width=\"3\"/>\n      \u003ctext x=\"545\" y=\"88\" text-anchor=\"middle\" style=\"font-weight:800;fill:var(--c4)\">CHỮ CÁI MÃ (c)\u003c/text>\n      \u003ctext x=\"545\" y=\"138\" text-anchor=\"middle\" style=\"font-size:34px;font-weight:800;fill:var(--c4)\">'${cChar}' (${cIdx \u003c 10 ? '0'+cIdx : cIdx})\u003c/text>\n    `;\n  }\n\n  svgEl.innerHTML = svg;\n  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);\n}\nwindow.renderCryptoSim = renderCryptoSim;\n\n/* ==========================================================================\n   HỆ THỐNG LÕI TỰ ĐỘNG: TOC, CUSTOM DROPDOWN & ON-DEMAND LOADER\n   ========================================================================== */\nfunction buildTOC() {\n  const tocContainer = $('toc-links');\n  if (!tocContainer) return;\n  let html = '', idx = 0;\n  document.querySelectorAll('#app-content h2, #app-content h3').forEach(el => {\n    const title = el.textContent.trim();\n    const isSub = el.tagName === 'H3';\n    const target = isSub ? el : (el.closest('section') || el);\n    if (!target.id) target.id = 'sec-' + (idx++);\n    html += `\u003ca href=\"#${target.id}\" class=\"${isSub ? 'sub' : 'grp'}\">${title}\u003c/a>`;\n  });\n  tocContainer.innerHTML = html;\n}\n\nfunction upgradeCustomSelects(root = document) {\n  root.querySelectorAll('select').forEach(sel => {\n    if (sel.dataset.customized === 'true') {\n      if (sel._syncCustomUI) sel._syncCustomUI();\n      return;\n    }\n    sel.dataset.customized = 'true';\n    sel.classList.add('native-select-hidden');\n\n    const wrap = document.createElement('div');\n    wrap.className = 'csel-wrap';\n\n    const trigger = document.createElement('button');\n    trigger.type = 'button';\n    trigger.className = 'csel-trigger';\n\n    const labelSpan = document.createElement('span');\n    labelSpan.className = 'csel-label';\n\n    const arrowBox = document.createElement('span');\n    arrowBox.className = 'csel-arrow';\n\n    trigger.appendChild(labelSpan);\n    trigger.appendChild(arrowBox);\n\n    const menu = document.createElement('div');\n    menu.className = 'csel-menu';\n\n    const syncUI = () => {\n      const selectedOpt = sel.options[sel.selectedIndex] || sel.options[0];\n      labelSpan.textContent = selectedOpt ? selectedOpt.textContent : '';\n      menu.querySelectorAll('.csel-opt').forEach((item, idx) => {\n        item.classList.toggle('selected', idx === sel.selectedIndex);\n      });\n    };\n    sel._syncCustomUI = syncUI;\n\n    Array.from(sel.options).forEach((opt, idx) => {\n      const item = document.createElement('div');\n      item.className = 'csel-opt' + (idx === sel.selectedIndex ? ' selected' : '');\n      item.textContent = opt.textContent;\n      item.onclick = (e) => {\n        e.stopPropagation();\n        sel.selectedIndex = idx;\n        sel.value = opt.value;\n        syncUI();\n        wrap.classList.remove('open');\n        sel.dispatchEvent(new Event('change', { bubbles: true }));\n      };\n      menu.appendChild(item);\n    });\n\n    syncUI();\n\n    trigger.onclick = (e) => {\n      e.stopPropagation();\n      const isOpen = wrap.classList.contains('open');\n      document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));\n      if (!isOpen) wrap.classList.add('open');\n    };\n\n    wrap.appendChild(trigger);\n    wrap.appendChild(menu);\n    sel.insertAdjacentElement('afterend', wrap);\n  });\n}\n\ndocument.addEventListener('click', () => {\n  document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));\n});\n\nfunction loadLesson(lessonId) {\n  const mainEl = $('app-content');\n  const tpl = $('tpl-buoi-' + lessonId);\n\n  if (tpl) {\n    mainEl.innerHTML = tpl.innerHTML;\n    if (lessonId === '3') {\n      renderBoolSim();\n    } else if (lessonId === '4') {\n      renderCryptoSim();\n    }\n  }\n\n  upgradeCustomSelects(document);\n  buildTOC();\n  if (window.MathJax && MathJax.typesetPromise) {\n    MathJax.typesetPromise([mainEl]);\n  }\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\nwindow.loadLesson = loadLesson;\n\n/* Khởi chạy ứng dụng & cài đặt đóng/mở menu góc trái */\n(function initApp() {\n  const btn = $('mb'), nav = $('mn');\n  const setOpen = open => {\n    nav.hidden = !open;\n    btn.setAttribute('aria-expanded', open);\n    btn.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu chọn bài và mục lục');\n  };\n  btn.onclick = () => setOpen(nav.hidden);\n  nav.onclick = e => {\n    if (e.target.closest('a')) setOpen(false);\n  };\n  document.addEventListener('click', e => {\n    if (!nav.hidden && !nav.contains(e.target) && !btn.contains(e.target)) setOpen(false);\n  });\n  document.addEventListener('keydown', e => {\n    if (e.key === 'Escape' && !nav.hidden) {\n      setOpen(false);\n      btn.focus();\n    }\n  });\n\n  // Mặc định mở Bài 6 (Chuyên sâu Lý thuyết số & RSA) để em học ngay phần quan trọng nhất,\n  // đồng thời có thể chuyển qua Bài 1-4 và Bài 5 bất cứ lúc nào từ Menu góc trái!\n  $('lesson-select').value = '4';\n  loadLesson('4');\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"}]</script>
<script>
const DB_NAME="hub-mon-hoc",STORE="subjects",FLAG="hub-mon-hoc-seeded";
const COLORS=["#2f5bea","#0b7f72","#c2336b","#b86a00","#7a4fd6","#4a5578"];
const STARTER=t=>'<!DOCTYPE html>\n<html lang="vi">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+t+'</title>\n<style>\nbody{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6}\n</style>\n</head>\n<body>\n<h1>'+t+'</h1>\n<p>Trang trống. Dán nội dung hoặc thay bằng file HTML của bạn.</p>\n</body>\n</html>\n';

let db=null,mem=new Map(),subjects=[],viewing=null,curUrl=null,editingId=null,codeId=null,replaceId=null;
const $=s=>document.querySelector(s);
const frame=$("#frame");

function openDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>res(null);
      r.onblocked=()=>res(null);
    }catch(e){res(null)}
  });
}
const rp=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const store=m=>db.transaction(STORE,m).objectStore(STORE);
const dbAll=async()=>db?rp(store("readonly").getAll()):[...mem.values()];
const dbPut=async o=>{if(db)await rp(store("readwrite").put(o));else mem.set(o.id,o)};
const dbDel=async id=>{if(db)await rp(store("readwrite").delete(id));else mem.delete(id)};

function flag(get,set){try{if(set){localStorage.setItem(FLAG,"1");return}return localStorage.getItem(FLAG)}catch(e){return null}}

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kb=s=>{const n=new Blob([s]).size;return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"};
const dmy=t=>{const d=new Date(t);return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()};
const slug=s=>(s||"mon-hoc").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"mon-hoc";
const titleOf=h=>{const m=/<title>([^<]*)<\/title>/i.exec(h);return m?m[1].trim():""};
const newId=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const get=id=>subjects.find(s=>s.id===id);

async function load(){
  subjects=(await dbAll()).sort((a,b)=>a.order-b.order);
}
async function persist(s){s.updated=Date.now();await dbPut(s)}
async function renumber(){for(let i=0;i<subjects.length;i++){if(subjects[i].order!==i){subjects[i].order=i;await dbPut(subjects[i])}}}

function render(){
  const q=$("#q").value.trim().toLowerCase();
  const list=subjects.filter(s=>!q||(s.title+" "+s.code+" "+s.desc).toLowerCase().includes(q));
  $("#count").textContent=subjects.length+" môn"+(q?" · hiển thị "+list.length:"");
  const el=$("#list");
  if(!subjects.length){
    el.innerHTML='<div class="empty"><h2>Chưa có môn nào</h2><p>Thêm môn đầu tiên hoặc kéo thả file .html vào đây.</p><button class="btn pri" data-a="add">Thêm môn</button></div>';
    return;
  }
  if(!list.length){el.innerHTML='<div class="empty"><h2>Không thấy môn khớp</h2><p>Thử từ khóa khác.</p></div>';return}
  el.innerHTML='<div class="grid">'+list.map(s=>`
  <article class="tile" style="--c:${esc(s.color)}" data-id="${s.id}">
    <button class="cover" data-a="open" aria-label="Mở ${esc(s.title)}"><span class="ic" aria-hidden="true">${esc(s.icon||"📘")}</span><span class="cd">${esc(s.code||s.title)}</span></button>
    <div class="body"><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p></div>
    <div class="meta"><span class="chip">${esc(s.status)}</span><span>${kb(s.html)} · sửa ${dmy(s.updated)}</span></div>
    <div class="acts">
      <button class="btn pri" data-a="open">Mở</button>
      <details class="more"><summary aria-label="Thao tác khác">⋯</summary>
        <div class="menu">
          <button data-a="edit">Sửa thông tin</button>
          <button data-a="code">Sửa mã nguồn</button>
          <button data-a="replace">Thay bằng file mới</button>
          <button data-a="dl">Tải xuống</button>
          <button data-a="tab">Mở tab mới</button>
          <hr>
          <button data-a="left">Dời lên trước</button>
          <button data-a="right">Dời ra sau</button>
          <hr>
          <button class="dng" data-a="del">Xóa môn</button>
        </div>
      </details>
    </div>
  </article>`).join("")+"</div>";
}

function openSubject(id){
  const s=get(id);if(!s)return;
  if(viewing===id&&document.body.classList.contains("viewing"))return;
  viewing=id;
  if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(new Blob([s.html],{type:"text/html"}));
  frame.src=curUrl;
  $("#vTitle").textContent=s.title;
  document.body.classList.add("viewing");
  if(location.hash.slice(1)!==id)history.pushState(null,"","#"+id);
}
function closeViewer(){
  document.body.classList.remove("viewing");
  frame.src="about:blank";
  if(curUrl){URL.revokeObjectURL(curUrl);curUrl=null}
  viewing=null;
  if(location.hash)history.replaceState(null,"",location.pathname+location.search);
}
function syncHash(){
  const id=location.hash.slice(1);
  if(id&&get(id))openSubject(id);
  else if(document.body.classList.contains("viewing"))closeViewer();
}
function refreshViewer(id){if(viewing===id){viewing=null;openSubject(id)}}

function download(s){
  const u=URL.createObjectURL(new Blob([s.html],{type:"text/html"}));
  const a=document.createElement("a");a.href=u;a.download=slug(s.title)+".html";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function openTab(s){
  const u=URL.createObjectURL(new Blob([s.html],{type:"text/html"}));
  if(!window.open(u,"_blank"))toast("Trình duyệt chặn tab mới. Hãy cho phép cửa sổ bật lên.");
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}

function confirmDlg(title,msg,yes){
  return new Promise(res=>{
    const d=$("#cfDlg");$("#cfTitle").textContent=title;$("#cfMsg").textContent=msg;$("#cfYes").textContent=yes||"Đồng ý";
    const done=v=>{d.close();$("#cfYes").onclick=$("#cfNo").onclick=null;res(v)};
    $("#cfYes").onclick=()=>done(true);$("#cfNo").onclick=()=>done(false);
    d.oncancel=()=>res(false);
    d.showModal();
  });
}

function buildSwatches(sel){
  $("#fSw").innerHTML=COLORS.map((c,i)=>`<label style="--c:${c}"><input type="radio" name="fc" value="${c}" ${c===sel||(!sel&&i===0)?"checked":""}><span></span></label>`).join("");
}
function showForm(id){
  editingId=id||null;
  const s=id?get(id):null;
  $("#fmTitle").textContent=s?"Sửa thông tin":"Thêm môn";
  $("#fName").value=s?s.title:"";
  $("#fIcon").value=s?s.icon:"📘";
  $("#fCode").value=s?s.code:"";
  $("#fDesc").value=s?s.desc:"";
  $("#fStatus").value=s?s.status:"Đang học";
  $("#fFile").value="";
  $("#fHint").textContent=s?"Chọn file mới nếu muốn thay nội dung. Bản cũ vẫn khôi phục được trong Sửa mã nguồn.":"Bỏ trống để tạo trang trống, rồi vào Sửa mã nguồn.";
  buildSwatches(s?s.color:COLORS[subjects.length%COLORS.length]);
  $("#fmDlg").showModal();
  $("#fName").focus();
}
$("#fm").addEventListener("submit",async e=>{
  const ok=e.submitter&&e.submitter.value==="ok";
  if(!ok)return;
  const f=$("#fFile").files[0];
  let html=f?await f.text():null;
  const title=$("#fName").value.trim()||(html&&titleOf(html))||"Môn mới";
  const color=(document.querySelector('input[name="fc"]:checked')||{}).value||COLORS[0];
  if(editingId){
    const s=get(editingId);
    Object.assign(s,{title,icon:$("#fIcon").value.trim()||"📘",code:$("#fCode").value.trim(),desc:$("#fDesc").value.trim(),status:$("#fStatus").value,color});
    if(html!==null){s.prevHtml=s.html;s.html=html}
    await persist(s);
    toast("Đã cập nhật");
    refreshViewer(s.id);
  }else{
    const s={id:newId(),title,icon:$("#fIcon").value.trim()||"📘",code:$("#fCode").value.trim(),desc:$("#fDesc").value.trim(),status:$("#fStatus").value,color,html:html!==null?html:STARTER(title),prevHtml:"",order:subjects.length,updated:Date.now()};
    await persist(s);subjects.push(s);
    toast("Đã thêm “"+title+"”");
  }
  render();
});

function showCode(id){
  const s=get(id);if(!s)return;
  codeId=id;
  $("#cTitle").textContent="Sửa mã nguồn — "+s.title;
  $("#code").value=s.html;
  $("#cUndo").disabled=!s.prevHtml;
  updInfo();
  $("#codeDlg").showModal();
}
function updInfo(){$("#cInfo").textContent=kb($("#code").value)+" · Ctrl+S để lưu · Tab chèn thụt lề"}
$("#code").addEventListener("input",updInfo);
$("#code").addEventListener("keydown",e=>{
  if(e.key==="Tab"){e.preventDefault();const t=e.target,a=t.selectionStart;t.setRangeText("  ",a,t.selectionEnd,"end")}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();$("#cSave").click()}
});
$("#cSave").onclick=async()=>{
  const s=get(codeId);if(!s)return;
  const v=$("#code").value;
  if(v!==s.html){s.prevHtml=s.html;s.html=v;await persist(s);refreshViewer(s.id);render();$("#cUndo").disabled=false}
  toast("Đã lưu");
};
$("#cUndo").onclick=async()=>{
  const s=get(codeId);if(!s||!s.prevHtml)return;
  if(!await confirmDlg("Khôi phục bản trước","Nội dung hiện tại sẽ được thay bằng bản lưu trước đó.","Khôi phục"))return;
  const cur=s.html;s.html=s.prevHtml;s.prevHtml=cur;await persist(s);
  $("#code").value=s.html;updInfo();refreshViewer(s.id);render();toast("Đã khôi phục");
};
$("#cCancel").onclick=()=>$("#codeDlg").close();

async function addFromFiles(files){
  const arr=[...files].filter(f=>/\.html?$/i.test(f.name)||f.type==="text/html");
  if(!arr.length){toast("Chỉ nhận file .html");return}
  for(const f of arr){
    const html=await f.text();
    const title=titleOf(html)||f.name.replace(/\.html?$/i,"");
    const s={id:newId(),title,icon:"📘",code:"",desc:"",status:"Đang học",color:COLORS[subjects.length%COLORS.length],html,prevHtml:"",order:subjects.length,updated:Date.now()};
    await persist(s);subjects.push(s);
  }
  render();toast("Đã thêm "+arr.length+" môn. Bấm ⋯ → Sửa thông tin để đặt tên, mã, màu.");
}

async function backup(){
  const data=JSON.stringify({v:1,exported:Date.now(),subjects});
  const u=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const a=document.createElement("a");a.href=u;const d=new Date();
  a.download="hub-sao-luu-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast("Đã tải file sao lưu");
}
async function restore(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast("File sao lưu không hợp lệ");return}
  const list=Array.isArray(data.subjects)?data.subjects.filter(s=>s&&s.id&&typeof s.html==="string"):[];
  if(!list.length){toast("Không tìm thấy môn nào trong file");return}
  if(!await confirmDlg("Khôi phục từ sao lưu","Có "+list.length+" môn. Môn trùng mã nội bộ sẽ bị ghi đè, các môn khác được giữ nguyên.","Khôi phục"))return;
  for(const s of list){
    const o={id:String(s.id),title:s.title||"Môn",icon:s.icon||"📘",code:s.code||"",desc:s.desc||"",status:s.status||"Đang học",color:s.color||COLORS[0],html:s.html,prevHtml:s.prevHtml||"",order:Number.isFinite(s.order)?s.order:subjects.length,updated:s.updated||Date.now()};
    await dbPut(o);
  }
  await load();await renumber();render();toast("Đã khôi phục "+list.length+" môn");
}

$("#list").addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,t=b.closest(".tile"),id=t&&t.dataset.id;
  document.querySelectorAll("details.more[open]").forEach(d=>d.open=false);
  if(a==="add")return showForm();
  const s=id&&get(id);if(!s)return;
  if(a==="open")openSubject(id);
  else if(a==="edit")showForm(id);
  else if(a==="code")showCode(id);
  else if(a==="dl")download(s);
  else if(a==="tab")openTab(s);
  else if(a==="replace"){replaceId=id;$("#pickReplace").value="";$("#pickReplace").click()}
  else if(a==="left"||a==="right"){
    const i=subjects.indexOf(s),j=a==="left"?i-1:i+1;
    if(j<0||j>=subjects.length)return;
    [subjects[i],subjects[j]]=[subjects[j],subjects[i]];
    await renumber();render();
  }
  else if(a==="del"){
    if(!await confirmDlg("Xóa “"+s.title+"”","Môn và toàn bộ nội dung sẽ bị xóa khỏi hub. Nên bấm Sao lưu hoặc Tải xuống trước.","Xóa"))return;
    await dbDel(id);subjects=subjects.filter(x=>x.id!==id);await renumber();render();toast("Đã xóa");
  }
});
document.addEventListener("click",e=>{if(!e.target.closest("details.more"))document.querySelectorAll("details.more[open]").forEach(d=>d.open=false)});

$("#pickReplace").addEventListener("change",async e=>{
  const f=e.target.files[0],s=get(replaceId);if(!f||!s)return;
  s.prevHtml=s.html;s.html=await f.text();await persist(s);render();refreshViewer(s.id);
  toast("Đã thay file. Khôi phục bản cũ trong Sửa mã nguồn nếu cần.");
});
$("#pickRestore").addEventListener("change",e=>{if(e.target.files[0])restore(e.target.files[0])});
$("#bAdd").onclick=()=>showForm();
$("#bBackup").onclick=backup;
$("#bRestore").onclick=()=>{$("#pickRestore").value="";$("#pickRestore").click()};
$("#q").addEventListener("input",render);
$("#vBack").onclick=()=>{if(location.hash)history.back();else closeViewer()};
$("#vCode").onclick=()=>showCode(viewing);
$("#vTab").onclick=()=>{const s=get(viewing);if(s)openTab(s)};
$("#vDl").onclick=()=>{const s=get(viewing);if(s)download(s)};
window.addEventListener("hashchange",syncHash);
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("viewing")&&!document.querySelector("dialog[open]"))$("#vBack").click()});

let dragN=0;
window.addEventListener("dragenter",e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){dragN++;document.body.classList.add("dragging")}});
window.addEventListener("dragleave",()=>{dragN=Math.max(0,dragN-1);if(!dragN)document.body.classList.remove("dragging")});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>{e.preventDefault();dragN=0;document.body.classList.remove("dragging");if(e.dataTransfer.files.length)addFromFiles(e.dataTransfer.files)});

(async function init(){
  db=await openDB();
  if(!db)toast("Trình duyệt không cho lưu lâu dài. Dữ liệu sẽ mất khi đóng trang — hãy Sao lưu.");
  await load();
  if(!subjects.length&&!flag()){
    try{
      const seed=JSON.parse($("#seed").textContent||"[]");
      for(let i=0;i<seed.length;i++){const s=Object.assign({prevHtml:"",order:i,updated:Date.now()},seed[i]);await dbPut(s)}
      await load();
    }catch(e){}
  }
  flag(0,1);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
  syncHash();
})();
</script>
</body>
</html>
