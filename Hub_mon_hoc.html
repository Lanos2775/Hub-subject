1$.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-sol2\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 1: Đổi chiều rộng giếng thế $a = 75\\text{ Å}$ sang đơn vị chuẩn SI là mét ($\\text{m}$):\u003c/span>\n          $$a = 75\\text{ Å} = 75 \\times 10^{-10}\\text{ m} = 7.5 \\times 10^{-9}\\text{ m}$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 2: Viết công thức tính mức năng lượng lượng tử hóa thứ $n$ của electron ($m_0 = 9.11 \\times 10^{-31}\\text{ kg}$, $\\hbar = 1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$) trong giếng thế vô hạn 1 chiều:\u003c/span>\n          $$E_n = \\frac{n^2 \\pi^2 \\hbar^2}{2 m_0 a^2}$$\n          \u003cspan class=\"cmt\">// Bước 3: Thay số vào để tính mức năng lượng cơ bản $E_1$ (với $n = 1$) theo đơn vị Joule ($\\text{J}$):\u003c/span>\n          $$E_1 = \\frac{1^2 \\times \\pi^2 \\times \\left(1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\right)^2}{2 \\times \\left(9.11 \\times 10^{-31}\\text{ kg}\\right) \\times \\left(7.5 \\times 10^{-9}\\text{ m}\\right)^2} = \\frac{1.0966 \\times 10^{-67}}{1.0249 \\times 10^{-46}} \\approx 1.070 \\times 10^{-21}\\text{ J}$$\n          \u003cspan class=\"cmt\">// Bước 4: Đổi mức năng lượng $E_1$ sang đơn vị Electron-Volt ($\\text{eV}$) bằng cách chia cho $1.6 \\times 10^{-19}$:\u003c/span>\n          $$E_1 = \\frac{1.070 \\times 10^{-21}\\text{ J}}{1.6 \\times 10^{-19}\\text{ J/eV}} \\approx \\mathbf{6.69 \\times 10^{-3}\\text{ eV}} = \\mathbf{6.69\\text{ meV}}$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 5: Vì $E_n = n^2 E_1$, ta nhân $E_1$ lần lượt với $2^2 = 4$ và $3^2 = 9$ để tìm nhanh mức năng lượng thứ hai ($n=2$) và thứ ba ($n=3$):\u003c/span>\n          $$\\text{• Với } n = 1: \\quad E_1 = \\mathbf{6.69 \\times 10^{-3}\\text{ eV}} \\quad (\\approx 6.69\\text{ meV})$$\n          $$\\text{• Với } n = 2: \\quad E_2 = 2^2 \\times E_1 = 4 \\times \\left(6.69 \\times 10^{-3}\\text{ eV}\\right) = \\mathbf{2.68 \\times 10^{-2}\\text{ eV}} \\quad (\\approx 26.8\\text{ meV})$$\n          $$\\text{• Với } n = 3: \\quad E_3 = 3^2 \\times E_1 = 9 \\times \\left(6.69 \\times 10^{-3}\\text{ eV}\\right) = \\mathbf{6.02 \\times 10^{-2}\\text{ eV}} \\quad (\\approx 60.2\\text{ meV})$$\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 3 BUỔI 3 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b3-cau3\">Câu 3: Xác Suất Tìm Thấy Electron Đâm Xuyên Vào Bậc Thế Năng\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Một electron có động năng (kinetic energy): $E = 2.8\\text{ eV}$ đập vào một rào thế dạng bậc (step potential) có chiều cao: $V_0 = 3.5\\text{ eV}$. Tính xác suất tương đối tìm thấy electron tại các khoảng cách:\u003cbr>\n      a) $5\\text{ Å}$\u003cbr>\n      b) $15\\text{ Å}$\u003cbr>\n      c) $40\\text{ Å}$\u003cbr>\n      bên trong vùng biên (barrier), so với mật độ xác suất tương đối (probability density) của electron tại mép biên.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b3-hint3')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b3-sol3')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-hint3\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Vì động năng $E = 2.8\\text{ eV}$ nhỏ hơn chiều cao bậc thế $V_0 = 3.5\\text{ eV}$, hàm sóng bên trong vùng biên ($x \\ge 0$) có dạng hàm mũ suy giảm: $\\psi_2(x) = A_2 e^{-k_2 x}$.\u003c/li>\n          \u003cli>Tính hệ số suy giảm $k_2 = \\frac{\\sqrt{2m_0(V_0 - E)}}{\\hbar}$. Lưu ý: Phải đổi hiệu năng lượng $V_0 - E = 3.5 - 2.8 = 0.7\\text{ eV}$ ra đơn vị Joule ($\\times 1.6 \\times 10^{-19}$) trước khi khai căn!\u003c/li>\n          \u003cli>Tỷ số mật độ xác suất tại vị trí $x$ so với tại mép biên ($x = 0$) là:\n            $$P_{\\text{rel}}(x) = \\frac{|\\psi_2(x)|^2}{|\\psi_2(0)|^2} = \\frac{|A_2|^2 e^{-2k_2 x}}{|A_2|^2 e^0} = e^{-2k_2 x}$$\n          \u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-sol3\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước mở đầu: Tính hệ số suy giảm $k_2$ bên trong vùng rào thế bậc ($x \\ge 0$):\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính phần chênh lệch thế năng $V_0 - E$ và đổi từ đơn vị $\\text{eV}$ sang đơn vị chuẩn Joule ($\\text{J}$):\u003c/span>\n          $$V_0 - E = 3.5\\text{ eV} - 2.8\\text{ eV} = 0.7\\text{ eV} = 0.7 \\times \\left(1.6 \\times 10^{-19}\\text{ J}\\right) = 1.12 \\times 10^{-19}\\text{ J}$$\n          \u003cspan class=\"cmt\">// Bước 2: Thay $V_0 - E$, khối lượng electron $m_0 = 9.11 \\times 10^{-31}\\text{ kg}$ và $\\hbar = 1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}$ vào công thức tính $k_2$:\u003c/span>\n          $$k_2 = \\frac{\\sqrt{2 m_0 (V_0 - E)}}{\\hbar} = \\frac{\\sqrt{2 \\times \\left(9.11 \\times 10^{-31}\\text{ kg}\\right) \\times \\left(1.12 \\times 10^{-19}\\text{ J}\\right)}}{1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}}$$\n          $$k_2 = \\frac{\\sqrt{2.04064 \\times 10^{-49}}}{1.054 \\times 10^{-34}} = \\frac{4.5173 \\times 10^{-25}}{1.054 \\times 10^{-34}} \\approx \\mathbf{4.286 \\times 10^9\\text{ m}^{-1}}$$\n          \u003cspan class=\"cmt\">// Bước 3: Lập biểu thức tỷ số mật độ xác suất tương đối tại tọa độ $x$ so với tại mép biên $x = 0$. Vì $\\psi_2(x) = A_2 e^{-k_2 x}$ nên mật độ xác suất là $|\\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}$:\u003c/span>\n          $$\\frac{|\\psi_2(x)|^2}{|\\psi_2(0)|^2} = \\frac{|A_2|^2 e^{-2k_2 x}}{|A_2|^2} = e^{-2k_2 x}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>a) Tại khoảng cách $x = 5\\text{ Å} = 5 \\times 10^{-10}\\text{ m}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Thay $x = 5 \\times 10^{-10}\\text{ m}$ và $k_2 = 4.286 \\times 10^9\\text{ m}^{-1}$ vào hàm mũ $e^{-2k_2 x}$:\u003c/span>\n          $$\\frac{|\\psi_2(5\\text{ Å})|^2}{|\\psi_2(0)|^2} = \\exp\\Big[-2 \\times \\left(4.286 \\times 10^9\\text{ m}^{-1}\\right) \\times \\left(5 \\times 10^{-10}\\text{ m}\\right)\\Big] = e^{-4.286} \\approx \\mathbf{0.0138} \\quad (\\text{hay } \\mathbf{1.38\\%})$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Tại khoảng cách $x = 15\\text{ Å} = 15 \\times 10^{-10}\\text{ m}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Thay $x = 15 \\times 10^{-10}\\text{ m}$ vào biểu thức $e^{-2k_2 x}$:\u003c/span>\n          $$\\frac{|\\psi_2(15\\text{ Å})|^2}{|\\psi_2(0)|^2} = \\exp\\Big[-2 \\times \\left(4.286 \\times 10^9\\text{ m}^{-1}\\right) \\times \\left(15 \\times 10^{-10}\\text{ m}\\right)\\Big] = e^{-12.858} \\approx \\mathbf{2.61 \\times 10^{-6}} \\quad (\\text{hay } \\mathbf{0.000261\\%})$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>c) Tại khoảng cách $x = 40\\text{ Å} = 40 \\times 10^{-10}\\text{ m}$:\u003c/b>\n          \u003cspan class=\"cmt\">// Thay $x = 40 \\times 10^{-10}\\text{ m}$ vào biểu thức $e^{-2k_2 x}$:\u003c/span>\n          $$\\frac{|\\psi_2(40\\text{ Å})|^2}{|\\psi_2(0)|^2} = \\exp\\Big[-2 \\times \\left(4.286 \\times 10^9\\text{ m}^{-1}\\right) \\times \\left(40 \\times 10^{-10}\\text{ m}\\right)\\Big] = e^{-34.288} \\approx \\mathbf{1.29 \\times 10^{-15}}$$\n          \u003cspan class=\"cmt\">// Nhận xét vật lý: Chỉ cần đi sâu vào trong rào thế $40\\text{ Å}$ ($4\\text{ nm}$), xác suất tìm thấy electron đã giảm xuống gần như bằng $0$ ($1.29 \\times 10^{-15}$).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 4 BUỔI 3 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b3-cau4\">Câu 4: Xác Suất Xuyên Hầm Lượng Tử Trong GaAs và Silicon\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Một hạt có động năng (kinetic energy): $E = 0.20\\text{ eV}$ xuyên qua một rào thế hình chữ nhật (rectangular potential barrier) có chiều cao $V_0 = 0.8\\text{ eV}$ và chiều rộng $a = 15\\text{ Å}$.\u003cbr>\n      a) Xác định xác suất xuyên hầm (tunneling probability) nếu khối lượng hiệu dụng (effective mass) tương ứng electron trong $\\text{GaAs}$: $m^* = 0.067 m_0$.\u003cbr>\n      b) Lặp lại với: $m^* = 1.08 m_0$ tương ứng electron trong silicon.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b3-hint4')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b3-sol4')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-hint4\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Sử dụng công thức tính xác suất xuyên hầm qua rào thế chữ nhật:\n            $$T \\approx 16\\left(\\frac{E}{V_0}\\right)\\left(1 - \\frac{E}{V_0}\\right)e^{-2k_2 a}$$\n          \u003c/li>\n          \u003cli>Tính hệ số đứng trước hàm mũ dùng chung cho cả 2 câu: $\\frac{E}{V_0} = \\frac{0.20}{0.80} = 0.25 \\implies 16 \\times 0.25 \\times (1 - 0.25) = 3$.\u003c/li>\n          \u003cli>Tính hệ số suy giảm $k_2 = \\frac{\\sqrt{2 m^* (V_0 - E)}}{\\hbar}$ riêng cho từng loại vật liệu (nhớ thay $m^* = 0.067 m_0$ ở câu a và $m^* = 1.08 m_0$ ở câu b).\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-sol4\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước chuẩn bị chung cho cả hai ý (a) và (b):\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Đổi bề rộng rào thế $a = 15\\text{ Å}$ sang mét và tính hiệu năng lượng $V_0 - E$ sang đơn vị Joule:\u003c/span>\n          $$a = 15\\text{ Å} = 15 \\times 10^{-10}\\text{ m} = 1.5 \\times 10^{-9}\\text{ m}$$\n          $$V_0 - E = 0.8\\text{ eV} - 0.20\\text{ eV} = 0.6\\text{ eV} = 0.6 \\times \\left(1.6 \\times 10^{-19}\\text{ J}\\right) = 9.6 \\times 10^{-20}\\text{ J}$$\n          \u003cspan class=\"cmt\">// Bước 2: Tính thừa số tiền hàm mũ $16\\left(\\frac{E}{V_0}\\right)\\left(1 - \\frac{E}{V_0}\\right)$ trong công thức xác suất xuyên hầm $T$:\u003c/span>\n          $$\\frac{E}{V_0} = \\frac{0.20\\text{ eV}}{0.80\\text{ eV}} = 0.25 \\implies 16\\left(\\frac{E}{V_0}\\right)\\left(1 - \\frac{E}{V_0}\\right) = 16 \\times 0.25 \\times (1 - 0.25) = 16 \\times 0.25 \\times 0.75 = \\mathbf{3}$$\n          \u003cspan class=\"cmt\">// Như vậy, công thức tính xác suất xuyên hầm rút gọn lại rất đẹp là: $T = 3\\,e^{-2k_2 a}$.\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>a) Đối với electron trong $\\text{GaAs}$ có khối lượng hiệu dụng $m^* = 0.067 m_0$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính hệ số suy giảm $k_2$ với $m^* = 0.067 \\times 9.11 \\times 10^{-31}\\text{ kg} \\approx 6.1037 \\times 10^{-32}\\text{ kg}$:\u003c/span>\n          $$k_2 = \\frac{\\sqrt{2 m^* (V_0 - E)}}{\\hbar} = \\frac{\\sqrt{2 \\times \\left(0.067 \\times 9.11 \\times 10^{-31}\\text{ kg}\\right) \\times \\left(9.6 \\times 10^{-20}\\text{ J}\\right)}}{1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}}$$\n          $$k_2 = \\frac{\\sqrt{1.1719 \\times 10^{-50}}}{1.054 \\times 10^{-34}} = \\frac{1.0825 \\times 10^{-25}}{1.054 \\times 10^{-34}} \\approx \\mathbf{1.027 \\times 10^9\\text{ m}^{-1}}$$\n          \u003cspan class=\"cmt\">// Bước 2: Tính tích số $2 k_2 a$ ở trên số mũ:\u003c/span>\n          $$2 k_2 a = 2 \\times \\left(1.027 \\times 10^9\\text{ m}^{-1}\\right) \\times \\left(1.5 \\times 10^{-9}\\text{ m}\\right) \\approx 3.081$$\n          \u003cspan class=\"cmt\">// Bước 3: Thay vào công thức $T = 3\\,e^{-2k_2 a}$ để tìm xác suất xuyên hầm trong $\\text{GaAs}$:\u003c/span>\n          $$T_{\\text{GaAs}} = 3 \\times e^{-3.081} \\approx 3 \\times 0.0459 = \\mathbf{0.138} \\quad (\\text{hay } \\mathbf{13.8\\%})$$\n          \u003cspan class=\"cmt\">// (Ghi chú nâng cao: Nếu tính theo công thức chính xác tuyệt đối không dùng xấp xỉ $E \\ll V_0$, tức $T_{\\text{exact}} = \\left[1 + \\frac{\\sinh^2(k_2 a)}{4(E/V_0)(1-E/V_0)}\\right]^{-1}$, thì $T_{\\text{exact}} \\approx \\mathbf{0.120}$ hay $12.0\\%$).\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Đối với electron trong Silicon có khối lượng hiệu dụng $m^* = 1.08 m_0$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tính hệ số suy giảm $k_2$ với $m^* = 1.08 \\times 9.11 \\times 10^{-31}\\text{ kg} \\approx 9.8388 \\times 10^{-31}\\text{ kg}$:\u003c/span>\n          $$k_2 = \\frac{\\sqrt{2 m^* (V_0 - E)}}{\\hbar} = \\frac{\\sqrt{2 \\times \\left(1.08 \\times 9.11 \\times 10^{-31}\\text{ kg}\\right) \\times \\left(9.6 \\times 10^{-20}\\text{ J}\\right)}}{1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}}$$\n          $$k_2 = \\frac{\\sqrt{1.8890 \\times 10^{-49}}}{1.054 \\times 10^{-34}} = \\frac{4.3463 \\times 10^{-25}}{1.054 \\times 10^{-34}} \\approx \\mathbf{4.124 \\times 10^9\\text{ m}^{-1}}$$\n          \u003cspan class=\"cmt\">// Bước 2: Tính tích số $2 k_2 a$ ở trên số mũ:\u003c/span>\n          $$2 k_2 a = 2 \\times \\left(4.124 \\times 10^9\\text{ m}^{-1}\\right) \\times \\left(1.5 \\times 10^{-9}\\text{ m}\\right) \\approx 12.371$$\n          \u003cspan class=\"cmt\">// Bước 3: Thay vào công thức $T = 3\\,e^{-2k_2 a}$ để tìm xác suất xuyên hầm trong Silicon:\u003c/span>\n          $$T_{\\text{Si}} = 3 \\times e^{-12.371} \\approx 3 \\times \\left(4.24 \\times 10^{-6}\\right) \\approx \\mathbf{1.27 \\times 10^{-5}}$$\n          \u003cspan class=\"cmt\">// Kết luận so sánh: Chỉ vì khối lượng hiệu dụng của electron trong Silicon lớn hơn trong GaAs khoảng 16 lần ($1.08$ so với $0.067$), xác suất xuyên hầm đã giảm mạnh từ $13.8\\%$ xuống chỉ còn $1.27 \\times 10^{-5}$ (giảm hơn $10\\,000$ lần!).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 5 BUỔI 3 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b3-cau5\">Câu 5: Khảo Sát Giếng Thế Bất Đối Xứng (Figure P2.40)\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Xét hàm thế một chiều như Figure P2.40:\u003cbr>\n      • Vùng I: $x \u003c 0$, $V(x) = V_0$\u003cbr>\n      • Vùng II: $0 \u003c x \u003c a$, $V(x) = 0$\u003cbr>\n      • Vùng III: $x > a$, $V(x) = \\infty$\u003cbr>\n      Giả sử năng lượng toàn phần của electron thỏa mãn: $E \u003c V_0$. Yêu cầu:\u003cbr>\n      a) Viết các nghiệm sóng trong từng vùng.\u003cbr>\n      b) Viết hệ phương trình thu được khi áp dụng các điều kiện biên.\u003cbr>\n      c) Giải thích vì sao các mức năng lượng của electron bị lượng tử hóa.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b3-hint5')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b3-sol5')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-hint5\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Ý a (Viết nghiệm 3 vùng):\u003c/b>\n            + Vùng I ($x \u003c 0$, nơi $V = V_0 > E$): Nghiệm tổng quát là $A_1 e^{k_1 x} + B_1 e^{-k_1 x}$. Vì khi $x \\to -\\infty$, hàm $e^{-k_1 x} \\to +\\infty$ (vô lý), nên phải loại bỏ số hạng $B_1 e^{-k_1 x}$ ($B_1 = 0$), chỉ giữ lại $\\psi_1(x) = A_1 e^{k_1 x}$.\u003cbr>\n            + Vùng II ($0 \u003c x \u003c a$, nơi $V = 0$): Nghiệm dao động điều hòa $\\psi_2(x) = A_2\\sin(k_2 x) + B_2\\cos(k_2 x)$.\u003cbr>\n            + Vùng III ($x > a$, nơi $V = \\infty$): Thế năng bằng vô cùng nên hạt không thể xâm nhập: $\\psi_3(x) = 0$.\n          \u003c/li>\n          \u003cli>\u003cb>Ý b (Điều kiện biên):\u003c/b> Tại biên $x = 0$ (thế năng hữu hạn $V_0$), cả $\\psi$ và đạo hàm $\\frac{d\\psi}{dx}$ đều liên tục. Tại biên $x = a$ (thế năng nhảy lên $\\infty$), chỉ có hàm sóng $\\psi$ liên tục ($\\psi_2(a) = \\psi_3(a) = 0$), còn đạo hàm bậc nhất không liên tục!\u003c/li>\n          \u003cli>\u003cb>Ý c (Giải thích lượng tử hóa):\u003c/b> Khử các hằng số $A_1, A_2, B_2$ từ 3 phương trình điều kiện biên sẽ dẫn tới một phương trình siêu việt chỉ phụ thuộc vào $E$ (cụ thể là $k_2\\cot(k_2 a) = -k_1$). Phương trình này chỉ có nghiệm tại các giá trị $E$ rời rạc!\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b3-sol5\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>a) Viết các nghiệm hàm sóng trong từng vùng (với $E \u003c V_0$):\u003c/b>\n          \u003cspan class=\"cmt\">// • Xét Vùng I ($x \u003c 0$, có $V(x) = V_0 > E$): Phương trình Schrödinger có dạng $\\frac{d^2\\psi_1}{dx^2} - k_1^2\\psi_1 = 0$, với $k_1 = \\frac{\\sqrt{2m(V_0 - E)}}{\\hbar}$. Nghiệm tổng quát là $\\psi_1(x) = A_1 e^{k_1 x} + B_1 e^{-k_1 x}$. Tuy nhiên, khi $x \\to -\\infty$ thì $e^{-k_1 x} \\to +\\infty$. Để hàm sóng hữu hạn khi $x \\to -\\infty$, ta bắt buộc có $B_1 = 0$:\u003c/span>\n          $$\\text{Vùng I } (x \u003c 0): \\quad \\mathbf{\\psi_1(x) = A_1 e^{k_1 x}} \\qquad \\text{với } k_1 = \\frac{\\sqrt{2m(V_0 - E)}}{\\hbar}$$\n          \u003cspan class=\"cmt\">// • Xét Vùng II ($0 \u003c x \u003c a$, có $V(x) = 0 \u003c E$): Phương trình Schrödinger có dạng $\\frac{d^2\\psi_2}{dx^2} + k_2^2\\psi_2 = 0$, với $k_2 = \\frac{\\sqrt{2mE}}{\\hbar}$. Nghiệm tổng quát trong giếng là hàm lượng giác:\u003c/span>\n          $$\\text{Vùng II } (0 \u003c x \u003c a): \\quad \\mathbf{\\psi_2(x) = A_2\\sin(k_2 x) + B_2\\cos(k_2 x)} \\qquad \\text{với } k_2 = \\frac{\\sqrt{2mE}}{\\hbar}$$\n          \u003cspan class=\"cmt\">// • Xét Vùng III ($x > a$, có $V(x) = \\infty$): Vì thế năng bằng vô cùng, hạt không thể tồn tại ở vùng $x > a$, nên hàm sóng bằng không tại mọi điểm:\u003c/span>\n          $$\\text{Vùng III } (x > a): \\quad \\mathbf{\\psi_3(x) = 0}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>b) Hệ phương trình thu được khi áp dụng các điều kiện biên tại $x = 0$ và $x = a$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Tại biên $x = 0$ (ngăn cách giữa thế năng hữu hạn $V_0$ và $0$), cả hàm sóng $\\psi(x)$ lẫn đạo hàm bậc nhất $\\frac{d\\psi(x)}{dx}$ đều phải liên tục:\u003c/span>\n          $$\\text{1. Tính liên tục của hàm sóng tại } x = 0: \\quad \\psi_1(0) = \\psi_2(0) \\implies \\mathbf{A_1 = B_2} \\quad (1)$$\n          $$\\text{2. Tính liên tục của đạo hàm tại } x = 0: \\quad \\left.\\frac{d\\psi_1}{dx}\\right|_{x=0} = \\left.\\frac{d\\psi_2}{dx}\\right|_{x=0} \\implies \\mathbf{k_1 A_1 = k_2 A_2} \\quad (2)$$\n          \u003cspan class=\"cmt\">// Bước 2: Tại biên $x = a$ (nơi thế năng nhảy vọt lên $V = \\infty$), hàm sóng $\\psi(x)$ phải liên tục và bằng $0$ (lưu ý: đạo hàm bậc nhất KHÔNG liên tục tại vách thế vô hạn):\u003c/span>\n          $$\\text{3. Tính liên tục của hàm sóng tại } x = a: \\quad \\psi_2(a) = \\psi_3(a) = 0 \\implies \\mathbf{A_2\\sin(k_2 a) + B_2\\cos(k_2 a) = 0} \\quad (3)$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>c) Giải thích vì sao các mức năng lượng của electron bị lượng tử hóa:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Biến đổi đại số từ hệ 3 phương trình biên (1), (2), (3) để khử các hệ số biên độ $A_1, A_2, B_2$. Từ (1) và (2) ta rút ra $B_2 = A_1$ và $A_2 = \\frac{k_1}{k_2}A_1$, rồi thế vào phương trình (3):\u003c/span>\n          $$A_1\\left[\\frac{k_1}{k_2}\\sin(k_2 a) + \\cos(k_2 a)\\right] = 0$$\n          \u003cspan class=\"cmt\">// Bước 2: Để tồn tại hạt electron trong giếng thì biên độ $A_1 \\ne 0$, do đó biểu thức trong ngoặc vuông bắt buộc phải bằng $0$:\u003c/span>\n          $$\\tan(k_2 a) = -\\frac{k_2}{k_1} = -\\sqrt{\\frac{E}{V_0 - E}}$$\n          \u003cspan class=\"cmt\">// Bước 3: Kết luận bản chất vật lý: Vì hạt electron bị giam giữ (bound state) giữa vách thế vô hạn tại $x = a$ và rào thế cao $V_0 > E$ tại $x = 0$, sóng vật chất của electron bị phản xạ qua lại tạo thành sóng dừng. Các điều kiện biên ở hai đầu tạo ra phương trình ràng buộc $\\tan(k_2 a) = -\\frac{k_2}{k_1}$ chỉ chứa duy nhất biến số năng lượng $E$. Chỉ những giá trị năng lượng $E$ rời rạc, xác định thỏa mãn phương trình siêu việt này mới cho phép hàm sóng tồn tại — nghĩa là năng lượng của electron bị lượng tử hóa!\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sum\">\n    \u003ch2>Tổng Kết Buổi 3: Những Điểm Cốt Lõi Cần Nhớ\u003c/h2>\n    \u003cul>\n      \u003cli>\u003cb>Hạt tự do ($V=0$):\u003c/b> Năng lượng $E = \\frac{\\hbar^2 k^2}{2m}$ liên tục (không bị lượng tử hóa); sóng phẳng chạy theo chiều $+x$ khi $k > 0$ và theo chiều $-x$ khi $k \u003c 0$.\u003c/li>\n      \u003cli>\u003cb>Hạt bị giam trong Giếng thế ($E \u003c V_{\\text{vách}}$):\u003c/b> Phản xạ qua lại tạo sóng dừng khiến \u003cb>năng lượng bị lượng tử hóa thành các mức rời rạc\u003c/b>. Trong giếng vô hạn bề rộng $a$: $E_n = \\frac{n^2\\pi^2\\hbar^2}{2ma^2}$.\u003c/li>\n      \u003cli>\u003cb>Đâm xuyên & Xuyên hầm lượng tử ($E \u003c V_0$):\u003c/b> Hàm sóng không bằng $0$ ngay tại vách thế hữu hạn mà suy giảm theo hàm mũ $\\psi_2(x) \\propto e^{-k_2 x}$ (mật độ xác suất giảm theo $e^{-2k_2 x}$). Nếu rào đủ mỏng, hạt xuyên hầm qua rào với xác suất $T \\approx 16\\frac{E}{V_0}\\left(1-\\frac{E}{V_0}\\right)e^{-2k_2 a}$.\u003c/li>\n      \u003cli>\u003cb>Nguyên tử 1-electron & Nguyên lý Pauli:\u003c/b> Mỗi trạng thái lượng tử được xác định bởi 4 số lượng tử $(n, l, m, s)$. Không có 2 electron nào trong cùng hệ có cùng bộ 4 số lượng tử $(n, l, m, s)$.\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\u003c/template>\n\n\u003c!-- =========================================================\n     TEMPLATE BUỔI 4: LÝ THUYẾT LƯỢNG TỬ CỦA CHẤT RẮN\n     ========================================================= -->\n\u003ctemplate id=\"tpl-buoi-4\">\n  \u003cheader>\n    \u003cspan class=\"k b3\">HỌC PHẦN ENP2209 · BUỔI 4\u003c/span>\n    \u003ch1>Lý Thuyết Lượng Tử Của Chất Rắn\u003c/h1>\n    \u003cp class=\"mut\">Hiểu trọn vẹn sự hình thành Dải năng lượng (Energy Bands), Mô hình Kronig-Penney, Giản đồ E-k, Khối lượng hiệu dụng, Lỗ trống (Hole), Mật độ trạng thái g(E) và Thống kê Fermi-Dirac.\u003c/p>\n  \u003c/header>\n\n  \u003csection>\n    \u003ch2>1. Sự Hình Thành Dải Năng Lượng & Mô Hình Kronig-Penney\u003c/h2>\n    \u003cp>Ở Buổi 3, chúng ta đã biết một nguyên tử cô lập (đứng một mình) có các mức năng lượng hoàn toàn rời rạc ($1s, 2s, 2p, 3s, 3p\\dots$). Nhưng trong một tinh thể Silicon thực tế (Buổi 1), có tới $5 \\times 10^{22}$ nguyên tử đứng sát cạnh nhau trong mỗi $\\text{cm}^3$! Khi các nguyên tử tiến lại gần nhau, điều kỳ diệu gì sẽ xảy ra với các mức năng lượng rời rạc đó?\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Những ngôi nhà riêng lẻ gộp thành Tòa chung cư khổng lồ\u003c/b>\u003cbr>\n      Em hãy tưởng tượng mỗi nguyên tử Silicon cô lập là một \u003cb>ngôi nhà 3 tầng\u003c/b> đứng cách xa nhau. Mỗi ngôi nhà đều có tầng 3 ở độ cao y hệt nhau (ví dụ cao $10\\text{ m}$).\u003cbr>\n      Nhưng khi $N$ ngôi nhà tiến lại sát vách nhau để gộp thành một \u003cb>hệ thống chung cư liên thông\u003c/b>, theo \u003cb>Nguyên lý loại trừ Pauli\u003c/b>, không được phép có 2 căn phòng (trạng thái lượng tử) nào trùng khít độ cao năng lượng của nhau! Hệ quả là hàng tỷ mức năng lượng từng bằng nhau ở độ cao $10\\text{ m}$ buộc phải \u003cb>tách nhẹ ra thành hàng tỷ bậc thang nằm sát rạt nhau\u003c/b> (ví dụ từ $9.5\\text{ m}$ đến $10.5\\text{ m}$). Vì hàng tỷ vạch này nằm quá sát nhau (chỉ cách nhau khoảng $10^{-19}\\text{ eV}$), mắt thường nhìn vào sẽ thấy chúng tạo thành một \u003cb>Dải năng lượng liên tục (Allowed Energy Band)\u003c/b>, ngăn cách với dải khác bởi một khoảng trống không có bậc thang nào gọi là \u003cb>Dải cấm (Forbidden Bandgap - $E_g$)\u003c/b>!\n    \u003c/div>\n\n    \u003ch3>1.1. Sự tách mức năng lượng trong tinh thể Silicon\u003c/h3>\n    \u003cp>Mỗi nguyên tử Silicon ($Z=14$) có cấu hình $1s^2 2s^2 2p^6 \\mathbf{3s^2 3p^2}$. Hai lớp trong cùng ($n=1, 2$) đã đầy kín. Ở lớp ngoài cùng ($n=3$): phân lớp $3s$ có $2$ chỗ ngồi (chứa 2 electron) và phân lớp $3p$ có $6$ chỗ ngồi (chỉ mới có 2 electron). Tổng cộng mỗi nguyên tử có \u003cb>$8$ chỗ ngồi ngoài cùng nhưng chỉ có $4$ electron hóa trị\u003c/b>.\u003c/p>\n    \u003cp>Khi $N$ nguyên tử Silicon tiến lại gần nhau tới khoảng cách mạng cân bằng $r = a_0$:\u003c/p>\n    \u003cul>\n      \u003cli>Tổng cộng $2N$ trạng thái $3s$ và $6N$ trạng thái $3p$ (tổng là $8N$ trạng thái) ban đầu trộn lẫn vào nhau, sau đó \u003cb>tách đôi thành hai dải riêng biệt\u003c/b> ngăn cách bởi độ rộng vùng cấm $E_g$!\u003c/li>\n      \u003cli>\u003cspan class=\"k b1\">Dải Hóa trị (Valence Band - Dưới)\u003c/span> Chứa đúng $4N$ trạng thái lượng tử. Ở nhiệt độ tuyệt đối $T = 0\\text{ K}$, toàn bộ $4N$ electron hóa trị rơi hết xuống lấp đầy kín $100\\%$ dải này.\u003c/li>\n      \u003cli>\u003cspan class=\"k b2\">Dải Dẫn (Conduction Band - Trên)\u003c/span> Cũng chứa $4N$ trạng thái lượng tử nhưng ở $T = 0\\text{ K}$ thì \u003cb>hoàn toàn trống rỗng ($0$ electron)\u003c/b>.\u003c/li>\n      \u003cli>\u003cspan class=\"k b4\">Vùng cấm / Dải cấm (Bandgap $E_g$)\u003c/span> Khoảng năng lượng nằm giữa đỉnh dải hóa trị ($E_v$) và đáy dải dẫn ($E_c$): $E_g = E_c - E_v$. Trong vùng cấm, không tồn tại bất kỳ trạng thái lượng tử nào để electron đứng vào!\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>1.2. Mô hình Kronig-Penney & Nghiệm Đồ Thị (Trọng tâm Câu 1 & Câu 2)\u003c/h3>\n    \u003cp>Để chứng minh bằng toán học tại sao lại xuất hiện các \u003cb>Dải cho phép (Allowed bands)\u003c/b> và \u003cb>Dải cấm (Forbidden gaps)\u003c/b>, hai nhà vật lý Kronig và Penney (1931) đã mô hình hóa thế năng tuần hoàn của mạng tinh thể 1 chiều thành một chuỗi các \u003cb>Giếng thế (bề rộng $a$, $V=0$)\u003c/b> xen kẽ với các \u003cb>Rào thế (bề rộng $b$, chiều cao $V_0$)\u003c/b> lặp lại tuần hoàn với chu kỳ $a + b$.\u003c/p>\n    \u003cp>Theo \u003cb>Định lý Bloch\u003c/b>, nghiệm hàm sóng của electron trong trường thế tuần hoàn có dạng sóng phẳng được điều biến biên độ theo chu kỳ mạng: $\\psi(x) = u(x)e^{jkx}$. Khi áp dụng các điều kiện biên liên tục của $\\psi$ và $\\frac{d\\psi}{dx}$ tại $x=0$ và $x=a$ (kết hợp lấy giới hạn rào thế hẹp $b \\to 0, V_0 \\to \\infty$ sao cho tích $V_0 b$ hữu hạn), Kronig và Penney thu được phương trình siêu việt nổi tiếng:\u003c/p>\n\n    \u003cdiv class=\"f\">\n      $$\\mathbf{f(\\alpha a) = P'\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a) = \\cos(ka)}$$\n      \u003csmall>Trong đó: $\\alpha = \\frac{\\sqrt{2mE}}{\\hbar} \\implies \\mathbf{E = \\frac{\\hbar^2 (\\alpha a)^2}{2ma^2}}$ (đại lượng $\\alpha a$ đại diện trực tiếp cho năng lượng $E$ của electron);\u003cbr>\n      $P' = \\frac{m V_0 b a}{\\hbar^2}$ là thông số liên kết (đo độ chặt của lực giữ hạt nhân); $k$ là số sóng tinh thể (crystal wave number).\u003c/small>\n    \u003c/div>\n\n    \u003cdiv class=\"box tip\">\n      \u003cb>Cách đọc Đồ thị Kronig-Penney cực dễ hiểu (Áp dụng giải trực tiếp Câu 1 & Câu 2):\u003c/b>\u003cbr>\n      • Nhìn vào Vế Phải của phương trình: $\\cos(ka)$. Với mọi số sóng thực $k$, hàm $\\cos(ka)$ \u003cb>chỉ có thể nhận giá trị nằm trong đoạn từ $-1$ đến $+1$\u003c/b> ($-1 \\le \\cos(ka) \\le +1$)!\u003cbr>\n      • Do đó, Vế Trái $f(\\alpha a)$ cũng bắt buộc phải nằm giữa hai đường ranh giới ngang $-1$ và $+1$:\u003cbr>\n      &nbsp;&nbsp;1. Những đoạn biến số $\\alpha a$ nào làm cho đồ thị $\\mathbf{-1 \\le f(\\alpha a) \\le +1}$ (vùng tô màu xanh trên mô hình dưới) $\\implies$ Có nghiệm $k$ thực $\\implies$ Tạo thành \u003cb>Dải năng lượng cho phép (Allowed Energy Band)\u003c/b>! Ranh giới của dải cho phép xảy ra tại $\\cos(ka) = +1$ (ứng với $ka = 0, 2\\pi, 4\\pi\\dots$) và $\\cos(ka) = -1$ (ứng với $ka = \\pi, 3\\pi\\dots$).\u003cbr>\n      &nbsp;&nbsp;2. Những đoạn $\\alpha a$ nào làm cho đồ thị $\\mathbf{|f(\\alpha a)| > 1}$ (vọt lên trên $+1$ hoặc tụt xuống dưới $-1$) $\\implies$ Không có nghiệm $k$ thực $\\implies$ Tạo thành \u003cb>Dải cấm (Forbidden Bandgap)\u003c/b>!\n    \u003c/div>\n\n    \u003ch3>1.3. Mô hình tương tác: Đồ thị hàm Kronig-Penney $f(\\alpha a)$ & Sự tách vùng năng lượng\u003c/h3>\n    \u003cp>Em hãy kéo thanh trượt \u003cb>Thông số liên kết $P'$\u003c/b> dưới đây (mặc định đang đặt $\\mathbf{P' = 12}$ đúng bằng đề bài của \u003cb>Câu 1 & Câu 2\u003c/b>, hoặc kéo về $P'=8$ để xem Ví dụ 3.1 trong bài giảng) để quan sát trực quan các dải cho phép (màu xanh) và dải cấm (màu hồng) từ $0$ đến $4\\pi$:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"kp-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"setKPPreset(12, this)\">1. Đề bài Câu 1 & Câu 2: P' = 12 (Khảo sát từ 0 đến 4π)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"setKPPreset(8, this)\">2. Ví dụ Slide 15: P' = 8\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"setKPPreset(3, this)\">3. Liên kết yếu: P' = 3 (Dải cho phép mở rộng)\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Thông số liên kết $P'$ (\u003cspan id=\"val-kp-p\">12\u003c/span>):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-kp-p\" min=\"1\" max=\"16\" step=\"0.5\" value=\"12\" oninput=\"renderKronigPenney()\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"kp-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"kp-svg\" viewBox=\"0 0 680 300\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>2. Giản Đồ Không Gian $k$ ($E$-$k$), Khối Lượng Hiệu Dụng & Khái Niệm Lỗ Trống\u003c/h2>\n    \u003ch3>2.1. Giản đồ $E$-$k$ Mở rộng và Rút gọn (Reduced-Zone Representation)\u003c/h3>\n    \u003cp>Đối với một electron hoàn toàn tự do trong chân không ($V=0$), mối liên hệ giữa năng lượng $E$ và số sóng $k$ là một \u003cb>đường Parabol liên tục\u003c/b>: $E = \\frac{p^2}{2m_0} = \\frac{\\hbar^2 k^2}{2m_0}$. Nhưng khi electron di chuyển trong mạng tinh thể tuần hoàn (Mô hình Kronig-Penney), đường Parabol liên tục này bị \u003cb>bẻ gãy tại các biên $k = \\pm\\frac{\\pi}{a}, \\pm\\frac{2\\pi}{a}, \\pm\\frac{3\\pi}{a}\\dots$\u003c/b> tạo ra các khe năng lượng cấm (Forbidden gaps)!\u003c/p>\n    \u003cp>Hơn nữa, vì hàm $\\cos(ka) = \\cos(ka \\pm 2n\\pi)$ tuần hoàn theo chu kỳ $\\frac{2\\pi}{a}$, ta có thể dịch chuyển (tịnh tiến) tất cả các nhánh đồ thị ở xa một đoạn bội số của $\\frac{2\\pi}{a}$ để gom toàn bộ về nằm gọn trong khoảng trung tâm $\\mathbf{-\\frac{\\pi}{a} \\le k \\le +\\frac{\\pi}{a}}$. Cách vẽ gom gọn này gọi là \u003cb>Giản đồ vùng rút gọn (Reduced $k$-space diagram hay Vùng Brillouin thứ nhất)\u003c/b>.\u003c/p>\n\n    \u003ch3>2.2. Khối lượng Hiệu dụng ($m^*$) & Vận tốc Hạt dẫn trên Giản đồ $E$-$k$\u003c/h3>\n    \u003cp>Trong mạng tinh thể, một hạt electron không chỉ chịu lực của điện trường ngoài ($F_{\\text{ext}} = -e\\mathcal{E}$) mà còn chịu hàng tỷ lực đẩy/hút nội tại ($F_{\\text{int}}$) từ các ion nguyên tử nút mạng: $F_{\\text{total}} = F_{\\text{ext}} + F_{\\text{int}} = m_0 a$. Làm sao tính được gia tốc $a$ khi không thể cộng hết hàng tỷ lực nội tại $F_{\\text{int}}$?\u003c/p>\n\n    \u003cdiv class=\"box analogy\">\n      \u003cb>Ví dụ ẩn dụ thực tế: Chạy bộ trên đường nhựa vs. Chạy bộ dưới hồ bơi\u003c/b>\u003cbr>\n      Nếu em đẩy một người bạn bằng một lực $F_{\\text{ext}}$ trên đường nhựa, bạn ấy lao đi rất nhanh. Nhưng cũng với lực đẩy $F_{\\text{ext}}$ đó mà đẩy bạn ấy khi đang đứng dưới hồ nước sâu (hoặc trong đầm lầy), bạn ấy nhích đi chậm rì! Thay vì phải ngồi tính lực cản của từng phân tử nước ($F_{\\text{int}}$), các nhà vật lý dùng một mẹo cực kỳ thông minh: \u003cb>Coi như không có nước cản trở, nhưng cân nặng của người bạn đã tăng lên thành một \"Khối lượng hiệu dụng $m^*$ (Effective mass)\"\u003c/b> để vẫn dùng được định luật Newton quen thuộc:\n      $$\\mathbf{F_{\\text{ext}} = m^* \\cdot a}$$\n    \u003c/div>\n\n    \u003cp>Bằng cách lấy đạo hàm bậc nhất và đạo hàm bậc hai của năng lượng $E$ theo số sóng $k$ (tương tự hạt tự do $E = \\frac{\\hbar^2 k^2}{2m}$), ta có hai công thức \"vàng\" để đọc mọi giản đồ $E$-$k$ (áp dụng trực tiếp cho \u003cb>Câu 3 và Câu 4 Bài tập\u003c/b>):\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\text{1. Vận tốc hạt dẫn: } \\mathbf{v = \\frac{1}{\\hbar}\\frac{dE}{dk}} \\qquad \\Big| \\qquad \\text{2. Nghịch đảo Khối lượng hiệu dụng: } \\mathbf{\\frac{1}{m^*} = \\frac{1}{\\hbar^2}\\frac{d^2 E}{dk^2}}$$\n    \u003c/div>\n\n    \u003cdiv class=\"box tip\">\n      \u003cb>Mẹo đọc nhanh Vận tốc $v$ và Khối lượng hiệu dụng $m^*$ bằng mắt thường (Giải Câu 3 & Câu 4):\u003c/b>\n      \u003cul>\n        \u003cli>\u003cb>Dấu của vận tốc $v$ phụ thuộc vào ĐỘ DỐC TIẾP TUYẾN $\\left(\\frac{dE}{dk}\\right)$:\u003c/b>\u003cbr>\n          • Đồ thị đang \u003cb>đi lên\u003c/b> khi nhìn từ trái sang phải ($\\frac{dE}{dk} > 0$) $\\implies$ Vận tốc $v > 0$ (chuyển động theo chiều \u003cb>$+x$\u003c/b>).\u003cbr>\n          • Đồ thị đang \u003cb>đi xuống\u003c/b> khi nhìn từ trái sang phải ($\\frac{dE}{dk} \u003c 0$) $\\implies$ Vận tốc $v \u003c 0$ (chuyển động ngược theo chiều \u003cb>$-x$\u003c/b>).\u003c/li>\n        \u003cli>\u003cb>Dấu và Độ lớn của Khối lượng hiệu dụng $m^*$ phụ thuộc vào ĐỘ CONG $\\left(\\frac{d^2 E}{dk^2}\\right)$:\u003c/b>\u003cbr>\n          • Đồ thị \u003cb>Bề lõm quay lên trên ($\\cup$ — giống cái bát ngửa, gần đáy vùng dẫn)\u003c/b> $\\implies$ Đạo hàm bậc hai $\\frac{d^2E}{dk^2} > 0 \\implies$ \u003cb>Khối lượng hiệu dụng DƯƠNG ($m^* > 0$)\u003c/b>.\u003cbr>\n          • Đồ thị \u003cb>Bề lõm quay xuống dưới ($\\cap$ — giống cái bát úp, gần đỉnh vùng hóa trị)\u003c/b> $\\implies$ Đạo hàm bậc hai $\\frac{d^2E}{dk^2} \u003c 0 \\implies$ \u003cb>Khối lượng hiệu dụng ÂM ($m^* \u003c 0$)\u003c/b>.\u003cbr>\n          • \u003cb>So sánh độ lớn $m^*$:\u003c/b> Vì $m^*$ tỉ lệ nghịch với độ cong $\\frac{d^2E}{dk^2}$, nên Parabol nào \u003cb>hẹp và dốc đứng hơn (cong gắt hơn) thì có $m^*$ NHỎ HƠN\u003c/b>; ngược lại Parabol nào \u003cb>mở rộng và thoải hơn (ít cong hơn) thì có $m^*$ LỚN HƠN\u003c/b>!\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    \u003ch3>2.3. Khái niệm Lỗ trống (Hole) — Hạt mang điện tích dương $+e$\u003c/h3>\n    \u003cp>Khi nhiệt độ $T > 0\\text{ K}$, một số electron ở dải hóa trị hấp thụ năng lượng nhiệt, bứt đứt liên kết cộng hóa trị để nhảy vọt qua vùng cấm $E_g$ lên dải dẫn, để lại một \u003cb>chỗ trống (empty state)\u003c/b> trong dải hóa trị. Khi có điện trường ngoài tác dụng, các electron hóa trị lân cận lần lượt nhảy sang lấp vào chỗ trống đó, làm cho chỗ trống di chuyển ngược chiều với electron!\u003c/p>\n    \u003cp>Đặc biệt, các trạng thái ở gần \u003cb>đỉnh của dải hóa trị ($E_v$)\u003c/b> có dạng Parabol úp ngược ($E - E_v = -C_2 k^2$), nghĩa là electron ở đó có \u003cb>khối lượng hiệu dụng âm ($m^* = -|m^*| \u003c 0$)\u003c/b>. Khi đặt dưới điện trường $\\mathcal{E}$, gia tốc của electron này là:\n      $$a = \\frac{-e\\mathcal{E}}{-|m^*|} = \\frac{+e\\mathcal{E}}{|m^*|} = \\frac{+e\\mathcal{E}}{m_p^*}$$\n      Nghĩa là một trạng thái thiếu electron ở đỉnh dải hóa trị chuyển động \u003cb>cùng chiều điện trường $\\mathcal{E}$ giống hệt như một hạt thực thụ mang điện tích dương $+e$ và có khối lượng hiệu dụng dương $m_p^* = |m^*| > 0$\u003c/b>. Hạt giả (quasiparticle) tuyệt vời đó được gọi là \u003cb>Lỗ trống (Hole)\u003c/b>!\n    \u003c/p>\n\n    \u003ch3>2.4. Mô hình tương tác: Khảo sát Giản đồ $E$-$k$, Độ cong $m^*$ & Chiều vận tốc (Minh họa Câu 3 & Câu 4)\u003c/h3>\n    \u003cp>Em hãy bấm chuyển đổi giữa 2 tab dưới đây để trực tiếp trải nghiệm: (1) So sánh 2 dải dẫn Parabol A và B trong \u003cb>Câu 3 (Figure P3.13)\u003c/b>, và (2) Bấm vào từng điểm \u003cb>A, B, C, D\u003c/b> trên giản đồ $E$-$k$ tuần hoàn của \u003cb>Câu 4 (Figure P3.15)\u003c/b> để xem tiếp tuyến vận tốc và độ cong khối lượng hiệu dụng:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"ek-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"selectEKTab('q4', this)\">1. Minh họa Câu 4 (Figure P3.15): Khảo sát 4 điểm A, B, C, D\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"selectEKTab('q3', this)\">2. Minh họa Câu 3 (Figure P3.13): So sánh độ cong Parabol A và B\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-row\" id=\"ek-ctrl-q4\">\n        \u003cdiv>\n          \u003clabel>Chọn điểm khảo sát trên đường cong E-k của Câu 4:\u003c/label>\n          \u003cselect id=\"sel-ek-pt\" onchange=\"renderEKSim()\">\n            \u003coption value=\"A\">Điểm A (Gần đỉnh trái k → -π/a): Bát úp (m* &lt; 0), Đang dốc xuống (v theo chiều -x)\u003c/option>\n            \u003coption value=\"B\">Điểm B (Sườn trái gần đáy k &lt; 0): Bát ngửa (m* &gt; 0), Đang dốc xuống (v theo chiều -x)\u003c/option>\n            \u003coption value=\"C\">Điểm C (Sườn phải gần đáy k &gt; 0): Bát ngửa (m* &gt; 0), Đang dốc lên (v theo chiều +x)\u003c/option>\n            \u003coption value=\"D\">Điểm D (Gần đỉnh phải k → +π/a): Bát úp (m* &lt; 0), Đang dốc lên (v theo chiều +x)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"ek-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"ek-svg\" viewBox=\"0 0 680 260\">\u003c/svg>\n    \u003c/div>\n\n    \u003ch3>2.5. Phân loại Kim loại, Bán dẫn, Điện môi & Bán dẫn Vùng cấm Thẳng vs. Xiên (Minh họa Câu 5)\u003c/h3>\n    \u003cul>\n      \u003cli>\u003cb>Phân loại theo cấu trúc vùng ở $T = 0\\text{ K}$:\u003c/b>\u003cbr>\n        • \u003cb>Chất cách điện / Điện môi (Insulator):\u003c/b> Dải hóa trị đầy kín, dải dẫn trống rỗng, vùng cấm cực lớn ($E_g \\approx 3.5 - 6.0\\text{ eV}$). Nhiệt độ phòng không thể kích thích electron nhảy qua nổi.\u003cbr>\n        • \u003cb>Chất bán dẫn (Semiconductor):\u003c/b> Cấu trúc giống hệt chất cách điện ở $T=0\\text{ K}$, nhưng có vùng cấm hẹp vừa phải ($E_g \\approx 1.0\\text{ eV}$; cụ thể \u003cb>$\\text{Si}$ có $E_g = 1.12\\text{ eV}$\u003c/b>, \u003cb>$\\text{GaAs}$ có $E_g = 1.42\\text{ eV}$\u003c/b>). Ở nhiệt độ phòng ($300\\text{ K}$) hoặc khi chiếu ánh sáng có năng lượng photon $h\\nu \\ge E_g$ (như \u003cb>Câu 5\u003c/b>), electron dễ dàng nhảy lên dải dẫn tạo dòng điện.\u003cbr>\n        • \u003cb>Kim loại (Metal):\u003c/b> Dải cho phép chỉ mới điền một nửa, hoặc dải dẫn và dải hóa trị chồng lấn lên nhau ($E_g = 0$). Electron tự do dẫn điện ngay cả ở $T = 0\\text{ K}$.\n      \u003c/li>\n      \u003cli>\u003cb>Phân loại Bán dẫn theo hình dạng vùng cấm 3D trong không gian $k$:\u003c/b>\u003cbr>\n        • \u003cspan class=\"k b2\">Bán dẫn vùng cấm thẳng (Direct Bandgap - ví dụ: $\\text{GaAs}$)\u003c/span> Đáy vùng dẫn ($E_c$) và đỉnh vùng hóa trị ($E_v$) nằm tại \u003cb>cùng một giá trị động lượng tinh thể ($k = 0$)\u003c/b>. Electron có thể nhảy thẳng từ $E_v$ lên $E_c$ (hoặc rơi thẳng từ $E_c$ xuống $E_v$ phát ra ánh sáng) chỉ bằng cách hấp thụ/phát xạ 1 photon ($\\Delta E = h\\nu \\ge E_g, \\Delta k = 0$) $\\implies$ Cực kỳ lý tưởng để chế tạo đèn LED và Laser!\u003cbr>\n        • \u003cspan class=\"k b3\">Bán dẫn vùng cấm xiên (Indirect Bandgap - ví dụ: $\\text{Si}, \\text{Ge}$)\u003c/span> Đáy vùng dẫn ($E_c$) bị lệch vị trí $k$ so với đỉnh vùng hóa trị ($E_v$ tại $k=0$). Để chuyển mức, electron vừa phải đổi năng lượng $\\Delta E$ (nhờ Photon), vừa phải đổi động lượng $\\Delta k$ (nhờ va chạm với dao động mạng tinh thể gọi là hạt \u003cb>Phonon\u003c/b>) $\\implies$ Xác suất phát sáng rất kém.\n      \u003c/li>\n    \u003c/ul>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"sim-tabs\" id=\"bg-tabs\">\n        \u003cbutton type=\"button\" class=\"sim-tab active\" onclick=\"renderBandgapSim('gaas', this)\">1. GaAs: Bán dẫn Vùng cấm thẳng (Eg = 1.42 eV — Minh họa Câu 5a-i)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderBandgapSim('si', this)\">2. Silicon: Bán dẫn Vùng cấm xiên (Eg = 1.12 eV — Minh họa Câu 5a-ii)\u003c/button>\n        \u003cbutton type=\"button\" class=\"sim-tab\" onclick=\"renderBandgapSim('class', this)\">3. So sánh Kim loại - Bán dẫn - Chất cách điện\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"bg-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"bg-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>3. Hàm Mật Độ Trạng Thái $g(E)$ & Cơ Học Thống Kê Fermi-Dirac\u003c/h2>\n    \u003cp>Để tính được dòng điện chạy trong linh kiện bán dẫn, người kỹ sư bắt buộc phải đếm được có bao nhiêu hạt electron tự do trong dải dẫn và bao nhiêu lỗ trống trong dải hóa trị trên mỗi $\\text{cm}^3$. Để đếm số hạt đó, ta dùng nguyên lý \u003cb>\"Rạp hát Lượng tử\"\u003c/b> gồm 2 thành phần:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\text{Mật độ hạt tại mức năng lượng } E = \\underbrace{g(E)}_{\\text{Số ghế ngồi có sẵn}} \\times \\underbrace{f_F(E)}_{\\text{Xác suất ghế có người ngồi}}$$\n    \u003c/div>\n\n    \u003ch3>3.1. Xây dựng Hàm Mật độ Trạng thái $g(E)$ (Density of States)\u003c/h3>\n    \u003cp>Bằng cách nhốt electron vào một khối lập phương giếng thế 3 chiều cạnh $a$, các số sóng bị lượng tử hóa theo $k^2 = k_x^2 + k_y^2 + k_z^2 = (n_x^2 + n_y^2 + n_z^2)\\left(\\frac{\\pi}{a}\\right)^2$. Mỗi trạng thái lượng tử chiếm một \"ô thể tích nhỏ\" là $\\left(\\frac{\\pi}{a}\\right)^3$ trong góc phần tám dương ($\\frac{1}{8}$ hình cầu) của không gian $k$, và mỗi trạng thái chứa được $2$ electron có Spin ngược chiều nhau ($\\uparrow\\downarrow$). Từ đó, mật độ trạng thái trên một đơn vị thể tích và một đơn vị năng lượng (số trạng thái trên $\\text{m}^{-3}\\cdot\\text{J}^{-1}$ hoặc $\\text{cm}^{-3}\\cdot\\text{eV}^{-1}$) có dạng hàm căn bậc hai:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\text{Hạt tự do: } g(E) = \\frac{4\\pi(2m)^{3/2}}{h^3}\\sqrt{E} \\quad \\Big| \\quad \\text{Dải dẫn: } \\mathbf{g_c(E) = \\frac{4\\pi(2m_n^*)^{3/2}}{h^3}\\sqrt{E - E_c}} \\quad (E \\ge E_c)$$\n      $$\\text{Dải hóa trị: } \\mathbf{g_v(E) = \\frac{4\\pi(2m_p^*)^{3/2}}{h^3}\\sqrt{E_v - E}} \\quad (E \\le E_v)$$\n    \u003c/div>\n\n    \u003ch3>3.2. Ba Định luật Thống kê & Hàm phân bố Xác suất Fermi-Dirac $f_F(E)$\u003c/h3>\n    \u003cp>Trong tự nhiên có 3 quy luật phân bố hạt vào các mức năng lượng: (1) \u003cb>Maxwell-Boltzmann\u003c/b> (dành cho các phân tử khí cổ điển phân biệt được và không giới hạn số hạt trong 1 trạng thái); (2) \u003cb>Bose-Einstein\u003c/b> (dành cho các hạt Boson như Photon, Phonon không tuân theo nguyên lý Pauli); và (3) \u003cb>Fermi-Dirac\u003c/b> (dành riêng cho các hạt \u003cb>Electron\u003c/b> không phân biệt được và \u003cb>tuân thủ nghiêm ngặt Nguyên lý loại trừ Pauli\u003c/b> — tối đa 1 hạt trên 1 trạng thái lượng tử!).\u003c/p>\n    \u003cp>Xác suất để một trạng thái lượng tử ở mức năng lượng $E$ có electron chiếm giữ được cho bởi \u003cb>Hàm phân bố Fermi-Dirac\u003c/b>:\u003c/p>\n    \u003cdiv class=\"f\">\n      $$\\mathbf{f_F(E) = \\frac{1}{1 + \\exp\\left(\\frac{E - E_F}{kT}\\right)}}$$\n      \u003csmall>Trong đó: $E_F$ gọi là \u003cb>Mức năng lượng Fermi (Fermi energy)\u003c/b>; $k = 1.38 \\times 10^{-23}\\text{ J/K} = 8.62 \\times 10^{-5}\\text{ eV/K}$ là hằng số Boltzmann.\u003cbr>\n      Lưu ý sống còn: Ở nhiệt độ phòng $T = 300\\text{ K}$, tích số năng lượng nhiệt luôn bằng $\\mathbf{kT \\approx 0.0259\\text{ eV} = 25.9\\text{ meV}}$.\u003c/small>\n    \u003c/div>\n\n    \u003cul>\n      \u003cli>\u003cb>Tại nhiệt độ tuyệt đối $T = 0\\text{ K}$:\u003c/b> Hàm $f_F(E)$ là một bậc thang vuông vức: mọi mức dưới $E_F$ ($E \u003c E_F$) đều đầy kín $100\\%$ ($f_F = 1$); mọi mức trên $E_F$ ($E > E_F$) đều trống rỗng hoàn toàn ($f_F = 0$).\u003c/li>\n      \u003cli>\u003cb>Tại nhiệt độ $T > 0\\text{ K}$:\u003c/b> Ngay tại mức Fermi $E = E_F$, xác suất tìm thấy electron luôn bằng đúng một nửa: $f_F(E_F) = \\frac{1}{1 + e^0} = \\frac{1}{2} = 50\\%$.\u003c/li>\n      \u003cli>\u003cb>Tính đối xứng gương quanh mức Fermi $E_F$:\u003c/b> Xác suất để một mức cao hơn $E_F$ một đoạn $\\Delta E$ có electron ngồi $\\big[f_F(E_F + \\Delta E)\\big]$ luôn bằng đúng xác suất để một mức thấp hơn $E_F$ một đoạn $\\Delta E$ bị bỏ trống (tức có lỗ trống ngồi): $\\mathbf{f_F(E_F + \\Delta E) = 1 - f_F(E_F - \\Delta E)}$.\u003c/li>\n      \u003cli>\u003cb>Xấp xỉ hàm mũ Maxwell-Boltzmann:\u003c/b> Khi xét các mức năng lượng nằm cao hơn $E_F$ khá nhiều sao cho $E - E_F \\gg kT$ (thực tế chỉ cần $E - E_F \\ge 3kT \\approx 0.078\\text{ eV}$ là sai số đã dưới $5\\%$), số hạng $\\exp\\left(\\frac{E-E_F}{kT}\\right) \\gg 1$, ta được quyền bỏ số $1$ ở mẫu số:\n        $$\\mathbf{f_F(E) \\approx \\exp\\left[-\\frac{E - E_F}{kT}\\right]} \\qquad (\\text{khi } E - E_F \\gg kT)$$\n      \u003c/li>\n    \u003c/ul>\n\n    \u003ch3>3.3. Mô hình tương tác: Hàm phân bố Fermi-Dirac $f_F(E)$ theo Nhiệt độ & Xấp xỉ Boltzmann\u003c/h3>\n    \u003cp>Em hãy kéo thanh trượt \u003cb>Nhiệt độ $T$ (từ $0\\text{ K}$ lên $600\\text{ K}$)\u003c/b> dưới đây để quan sát bậc thang Fermi-Dirac uốn cong mềm dần khi nhiệt độ tăng, tính đối xứng gương giữa $f_F(E)$ và $1 - f_F(E)$, cũng như đường cong xấp xỉ Boltzmann khi $E - E_F \\ge 3kT$:\u003c/p>\n\n    \u003cdiv class=\"sim-card\">\n      \u003cdiv class=\"ctrl-row\">\n        \u003cdiv>\n          \u003clabel>Nhiệt độ tuyệt đối $T$ (\u003cspan id=\"val-fd-t\">300\u003c/span> K $\\implies kT \\approx$ \u003cspan id=\"val-fd-kt\">25.9\u003c/span> meV):\u003c/label>\n          \u003cinput type=\"range\" id=\"sl-fd-t\" min=\"0\" max=\"600\" step=\"20\" value=\"300\" oninput=\"renderFermiDirac()\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Hiển thị đường Xấp xỉ Boltzmann & Đường trống $1 - f_F(E)$:\u003c/label>\n          \u003cselect id=\"sel-fd-mode\" onchange=\"renderFermiDirac()\">\n            \u003coption value=\"both\">Hiển thị cả f_F(E), 1 - f_F(E) (Lỗ trống) và Xấp xỉ Boltzmann\u003c/option>\n            \u003coption value=\"sym\">Chỉ hiển thị đối xứng gương f_F(E) và 1 - f_F(E)\u003c/option>\n            \u003coption value=\"boltz\">So sánh f_F(E) chuẩn và Xấp xỉ Boltzmann (Hợp lệ khi E - EF ≥ 3kT)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"fd-desc\" class=\"box\">\u003c/div>\n      \u003csvg id=\"fd-svg\" viewBox=\"0 0 680 250\">\u003c/svg>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>4. Cẩm Nang Công Thức Trọng Tâm Buổi 4 (Giải Nghĩa Chi Tiết)\u003c/h2>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 1: Phương trình Kronig-Penney & Liên hệ giữa $\\alpha a$ và Năng lượng $E$\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$f(\\alpha a) = P'\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a) = \\cos(ka) \\qquad \\text{với } \\alpha = \\frac{\\sqrt{2mE}}{\\hbar} \\implies \\mathbf{E = \\frac{(\\alpha a)^2 \\hbar^2}{2 m a^2}}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $P' = \\frac{m V_0 b a}{\\hbar^2}$: Thông số liên kết thế năng của mạng tinh thể (không thứ nguyên).\u003cbr>\n          • $\\alpha a$: Biến số không thứ nguyên (tính bằng radian) đại diện cho mức năng lượng $E$.\u003cbr>\n          • $a$: Độ rộng giếng thế / hằng số mạng tuần hoàn ($\\text{m}$, nhớ đổi $1\\text{ Å} = 10^{-10}\\text{ m}$).\u003cbr>\n          • $k$: Số sóng tinh thể ($\\text{m}^{-1}$). Biên các vùng Brillouin nằm tại $ka = n\\pi$ ($n = 0, 1, 2\\dots$).\u003cbr>\n          • $E$: Năng lượng cho phép của electron ứng với giá trị $\\alpha a$ ($\\text{J}$, chia cho $1.6 \\times 10^{-19}$ để ra $\\text{eV}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Vì $-1 \\le \\cos(ka) \\le +1$, nên chỉ những giá trị $\\alpha a$ nào thỏa mãn $-1 \\le f(\\alpha a) \\le +1$ mới cho nghiệm năng lượng $E$ nằm trong dải cho phép. Khi biết $\\alpha a$ ở đầu dưới ($\\alpha_{\\min}a$) và đầu trên ($\\alpha_{\\max}a$) của một dải, ta thay vào $E = \\frac{(\\alpha a)^2\\hbar^2}{2ma^2}$ để tính \u003cb>độ rộng dải năng lượng cho phép $\\Delta E = E_{\\max} - E_{\\min}$\u003c/b>!\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Giải trực tiếp \u003cb>Câu 1\u003c/b> (tìm $\\alpha a$ tại $ka = \\pi, 2\\pi$) và \u003cb>Câu 2\u003c/b> (tính độ rộng dải cho phép $\\Delta E$).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 2: Vận tốc Hạt dẫn ($v$) & Khối lượng Hiệu dụng ($m^*$) từ Giản đồ $E$-$k$\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$v = \\frac{1}{\\hbar}\\frac{dE}{dk} \\qquad \\text{và} \\qquad \\frac{1}{m^*} = \\frac{1}{\\hbar^2}\\frac{d^2 E}{dk^2} \\implies m^* = \\hbar^2 \\left(\\frac{d^2 E}{dk^2}\\right)^{-1}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $v$: Vận tốc nhóm của hạt dẫn trong tinh thể ($\\text{m/s}$).\u003cbr>\n          • $\\frac{dE}{dk}$: Đạo hàm bậc nhất (độ dốc tiếp tuyến) của đường cong $E$-$k$ tại điểm đang xét.\u003cbr>\n          • $m^*$: Khối lượng hiệu dụng của hạt dẫn ($\\text{kg}$).\u003cbr>\n          • $\\frac{d^2 E}{dk^2}$: Đạo hàm bậc hai (độ cong) của đường cong $E$-$k$.\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Gói gọn toàn bộ lực tương tác nội tại của mạng tinh thể vào độ cong của giản đồ $E$-$k$. Đường cong $E$-$k$ càng cong gắt (Parabol càng hẹp) thì $\\frac{d^2E}{dk^2}$ càng lớn $\\implies$ khối lượng hiệu dụng $m^*$ càng nhỏ.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Giải trực tiếp \u003cb>Câu 3\u003c/b> (so sánh khối lượng hiệu dụng của hai dải dẫn) và \u003cb>Câu 4\u003c/b> (xác định dấu của $m^*$ và chiều của vận tốc $v$).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 3: Tương tác Quang - Bán dẫn (Tần số tối thiểu $\\nu_{\\min}$ & Bước sóng tối đa $\\lambda_{\\max}$)\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$E_{\\text{photon}} = h\\nu = \\frac{hc}{\\lambda} \\ge E_g \\implies \\mathbf{\\nu_{\\min} = \\frac{E_g}{h}} \\qquad \\text{và} \\qquad \\mathbf{\\lambda_{\\max} = \\frac{c}{\\nu_{\\min}} = \\frac{hc}{E_g} \\approx \\frac{1.24\\text{ [\\mu m}\\cdot\\text{eV]}}{E_g\\text{ [eV]}}}$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $E_g = E_c - E_v$: Năng lượng vùng cấm (Bandgap energy) của chất bán dẫn ($\\text{eV}$ hoặc $\\text{J}$, nhớ đổi $1\\text{ eV} = 1.6 \\times 10^{-19}\\text{ J}$).\u003cbr>\n          • $\\nu_{\\min}$: Tần số tối thiểu của photon ánh sáng để kích thích được electron vượt qua vùng cấm ($\\text{Hz}$ hoặc $\\text{s}^{-1}$).\u003cbr>\n          • $\\lambda_{\\max}$: Bước sóng dài nhất của photon còn khả năng kích thích electron ($\\text{m}$, $\\mu\\text{m}$ hoặc $\\text{nm}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Để nhấc 1 electron từ đỉnh dải hóa trị ($E_v$) vượt qua vùng cấm lên đáy dải dẫn ($E_c$), hạt ánh sáng (photon) chiếu vào phải có năng lượng tối thiểu bằng độ rộng vùng cấm $E_g$. Vì $E = h\\nu = \\frac{hc}{\\lambda}$, năng lượng tối thiểu ứng với \u003cb>tần số nhỏ nhất $\\nu_{\\min}$\u003c/b> và \u003cb>bước sóng lớn nhất $\\lambda_{\\max}$\u003c/b>.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Giải trực tiếp \u003cb>Câu 5\u003c/b> cho $\\text{GaAs}$ ($E_g = 1.42\\text{ eV}$) và $\\text{Si}$ ($E_g = 1.12\\text{ eV}$).\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula-card\">\n      \u003ch3>Công thức 4: Hàm Mật độ Trạng thái $g(E)$ & Hàm Phân bố Fermi-Dirac $f_F(E)$\u003c/h3>\n      \u003cdiv class=\"f\">\n        $$g_c(E) = \\frac{4\\pi(2m_n^*)^{3/2}}{h^3}\\sqrt{E - E_c} \\quad \\Big| \\quad f_F(E) = \\frac{1}{1 + \\exp\\left(\\frac{E - E_F}{kT}\\right)} \\approx \\exp\\left(-\\frac{E - E_F}{kT}\\right)$$\n      \u003c/div>\n      \u003cdiv class=\"formula-meta\">\n        \u003cdiv>\u003cb>1. Giải nghĩa ký hiệu & Đơn vị:\u003c/b>\u003cbr>\n          • $g_c(E), g_v(E)$: Mật độ trạng thái lượng tử trong dải dẫn và dải hóa trị ($\\text{m}^{-3}\\text{J}^{-1}$ hoặc $\\text{cm}^{-3}\\text{eV}^{-1}$).\u003cbr>\n          • $f_F(E)$: Xác suất trạng thái năng lượng $E$ bị chiếm bởi electron (từ $0$ đến $1$).\u003cbr>\n          • $E_F$: Mức năng lượng Fermi ($\\text{eV}$).\u003cbr>\n          • $kT$: Năng lượng nhiệt ($0.0259\\text{ eV}$ tại $T = 300\\text{ K}$).\n        \u003c/div>\n        \u003cdiv>\u003cb>2. Tại sao có & Khi nào dùng?\u003c/b>\u003cbr>\n          • \u003cb>Bản chất:\u003c/b> Cho phép tính tổng số trạng thái lượng tử có sẵn trong một khoảng năng lượng $[E_1, E_2]$ bằng tích phân $N = \\int_{E_1}^{E_2} g(E)\\,dE$ và xác suất lấp đầy electron ở nhiệt độ $T$ bất kỳ.\u003cbr>\n          • \u003cb>Khi nào dùng:\u003c/b> Tính số trạng thái lượng tử trong dải dẫn/dải hóa trị và làm nền tảng trực tiếp để tính nồng độ hạt dẫn cân bằng $n_0, p_0$ ở Buổi 6.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection>\n    \u003ch2>5. Bài Tập Trọng Tâm Buổi 4 (Có Gợi Ý & Giải Chi Tiết Từng Bước)\u003c/h2>\n    \u003cp>Dưới đây là toàn bộ 5 bài tập trong phiếu Bài tập Trọng tâm Buổi 4. Em hãy bấm vào \u003cb>Xem Gợi ý\u003c/b> để nắm phương pháp trước, sau đó mở \u003cb>Xem Lời giải chi tiết\u003c/b> với các dòng giải thích màu xám ở từng bước biến đổi.\u003c/p>\n\n    \u003c!-- CÂU 1 BUỔI 4 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b4-cau1\">Câu 1: Khảo sát Đồ thị và Nghiệm Phương trình Kronig-Penney\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b>\u003cbr>\n      (a) Vẽ đồ thị hàm số $f(\\alpha a) = 12 \\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a)$ trong khoảng từ $0$ đến $4\\pi$. Đồng thời, với phương trình $f(\\alpha a) = \\cos(ka)$, hãy chỉ ra các khoảng giá trị cho phép của $\\alpha a$ thỏa mãn hệ thức này.\u003cbr>\n      (b) Xác định cụ thể giá trị của $\\alpha a$ tại các điểm biên: (i) $ka = \\pi$ và (ii) $ka = 2\\pi$.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b4-hint1')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b4-sol1')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-hint1\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Ý (a):\u003c/b> Xem lại \u003cb>Mô hình tương tác 1.3\u003c/b> ở trên (tab $P' = 12$). Vì vế phải là $\\cos(ka)$ luôn nằm trong đoạn $[-1, +1]$, nên các khoảng giá trị cho phép của $\\alpha a$ chính là những đoạn mà đồ thị $f(\\alpha a)$ nằm giữa hai đường thẳng ngang $y = -1$ và $y = +1$ (tức $-1 \\le f(\\alpha a) \\le +1$).\u003c/li>\n          \u003cli>\u003cb>Ý (b-i) Tại $ka = \\pi$:\u003c/b> Ta có $\\cos(\\pi) = -1$. Phương trình trở thành $12\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a) = -1$. Một nghiệm nhìn thấy ngay là $\\alpha a = \\pi$ (vì $\\sin\\pi = 0, \\cos\\pi = -1$). Nghiệm thứ hai nằm trong khoảng $(\\pi, 2\\pi)$ tìm được bằng phương pháp dò nghiệm (trial and error / nút SOLVE trên máy tính Casio) hoặc dùng đẳng thức lượng giác $\\tan\\left(\\frac{\\alpha a}{2}\\right) = \\frac{\\alpha a}{12}$.\u003c/li>\n          \u003cli>\u003cb>Ý (b-ii) Tại $ka = 2\\pi$:\u003c/b> Ta có $\\cos(2\\pi) = +1$. Phương trình trở thành $12\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a) = +1$. Một nghiệm hiển nhiên là $\\alpha a = 2\\pi$ (vì $\\sin 2\\pi = 0, \\cos 2\\pi = +1$). Nghiệm kia nằm trong khoảng $(0, \\pi)$ tìm bằng máy tính.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-sol1\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>(a) Vẽ đồ thị hàm số $f(\\alpha a)$ từ $0$ đến $4\\pi$ và chỉ ra các khoảng giá trị cho phép của $\\alpha a$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Xác định giá trị của hàm $f(\\alpha a) = 12\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a)$ tại các điểm mốc đặc biệt là bội số của $\\pi$ để phác thảo chính xác đồ thị (em có thể đối chiếu trực tiếp với đồ thị Mô hình 1.3 ở trên khi chọn $P'=12$):\u003c/span>\n          $$\\text{• Khi } \\alpha a \\to 0: \\quad \\lim_{\\alpha a \\to 0}\\frac{\\sin(\\alpha a)}{\\alpha a} = 1 \\implies f(0) = 12(1) + \\cos(0) = 12 + 1 = \\mathbf{13}$$\n          $$\\text{• Khi } \\alpha a = \\pi \\approx 3.1416: \\quad \\sin(\\pi) = 0,\\ \\cos(\\pi) = -1 \\implies f(\\pi) = 12(0) - 1 = \\mathbf{-1}$$\n          $$\\text{• Khi } \\alpha a = 2\\pi \\approx 6.2832: \\quad \\sin(2\\pi) = 0,\\ \\cos(2\\pi) = +1 \\implies f(2\\pi) = 12(0) + 1 = \\mathbf{+1}$$\n          $$\\text{• Khi } \\alpha a = 3\\pi \\approx 9.4248: \\quad \\sin(3\\pi) = 0,\\ \\cos(3\\pi) = -1 \\implies f(3\\pi) = 12(0) - 1 = \\mathbf{-1}$$\n          $$\\text{• Khi } \\alpha a = 4\\pi \\approx 12.5664: \\quad \\sin(4\\pi) = 0,\\ \\cos(4\\pi) = +1 \\implies f(4\\pi) = 12(0) + 1 = \\mathbf{+1}$$\n          \u003cspan class=\"cmt\">// Bước 2: Biện luận điều kiện có nghiệm thực của phương trình Kronig-Penney $f(\\alpha a) = \\cos(ka)$. Vì số sóng $k$ của electron chuyển động tuần hoàn trong tinh thể phải là số thực, nên $-1 \\le \\cos(ka) \\le +1$. Do đó, các khoảng giá trị cho phép của $\\alpha a$ là những khoảng mà tại đó $-1 \\le f(\\alpha a) \\le +1$:\u003c/span>\n          $$\\text{• Dải cho phép thứ 1 (ứng với } 0 \\le ka \\le \\pi\\text{): } \\quad \\mathbf{2.628\\text{ rad} \\le \\alpha a \\le \\pi\\text{ rad}} \\quad (\\text{hay } 0.836\\pi \\le \\alpha a \\le \\pi)$$\n          $$\\text{• Dải cho phép thứ 2 (ứng với } \\pi \\le ka \\le 2\\pi\\text{): } \\quad \\mathbf{5.307\\text{ rad} \\le \\alpha a \\le 2\\pi\\text{ rad}} \\quad (\\text{hay } 1.689\\pi \\le \\alpha a \\le 2\\pi)$$\n          $$\\text{• Dải cho phép thứ 3 (ứng với } 2\\pi \\le ka \\le 3\\pi\\text{): } \\quad \\mathbf{8.067\\text{ rad} \\le \\alpha a \\le 3\\pi\\text{ rad}} \\quad (\\text{hay } 2.568\\pi \\le \\alpha a \\le 3\\pi)$$\n          $$\\text{• Dải cho phép thứ 4 (ứng với } 3\\pi \\le ka \\le 4\\pi\\text{): } \\quad \\mathbf{10.909\\text{ rad} \\le \\alpha a \\le 4\\pi\\text{ rad}} \\quad (\\text{hay } 3.472\\pi \\le \\alpha a \\le 4\\pi)$$\n          \u003cspan class=\"cmt\">// (Ghi chú: Các khoảng nằm giữa các dải cho phép trên, ví dụ $0 \\le \\alpha a \u003c 2.628$ hay $\\pi \u003c \\alpha a \u003c 5.307$, đều có $|f(\\alpha a)| > 1$ nên là các Dải năng lượng cấm - Forbidden bands).\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>(b) Xác định cụ thể giá trị của $\\alpha a$ tại các điểm biên (i) $ka = \\pi$ và (ii) $ka = 2\\pi$:\u003c/b>\n          \u003cspan class=\"cmt\">// • Trường hợp (i) Tại biên $ka = \\pi$: Thay $ka = \\pi$ vào vế phải, ta có $\\cos(\\pi) = -1$. Phương trình Kronig-Penney trở thành:\u003c/span>\n          $$12\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a) = -1 \\quad (1)$$\n          \u003cspan class=\"cmt\">// Điểm biên $ka = \\pi$ là nơi xảy ra bước nhảy vọt từ đỉnh của Dải cho phép thứ 1 ($\\alpha_2 a$) lên đáy của Dải cho phép thứ 2 ($\\alpha_3 a$):\u003c/span>\n          \u003cspan class=\"cmt\">// + Giá trị thứ nhất tại $ka = \\pi$ (đỉnh Dải 1): Ta thấy ngay khi $\\alpha a = \\pi$ thì $\\sin(\\pi) = 0$ và $\\cos(\\pi) = -1$, thỏa mãn tuyệt đối phương trình (1):\u003c/span>\n          $$(\\alpha a)_1 = \\mathbf{\\pi \\approx 3.142\\text{ rad}}$$\n          \u003cspan class=\"cmt\">// + Giá trị thứ hai tại $ka = \\pi$ (đáy Dải 2, nằm trong khoảng $\\pi \u003c \\alpha a \u003c 2\\pi$): Biến đổi lượng giác phương trình (1) thành $12\\frac{\\sin(\\alpha a)}{\\alpha a} = -(1 + \\cos\\alpha a) \\iff \\tan\\left(\\frac{\\alpha a}{2}\\right) = \\frac{\\alpha a}{12}$ (hoặc bấm SHIFT-SOLVE trên máy tính cầm tay ở chế độ Radian trong khoảng $(3.2, 6.2)$), ta tìm được:\u003c/span>\n          $$(\\alpha a)_2 \\approx \\mathbf{5.307\\text{ rad}} \\quad (\\text{tức } \\approx 1.689\\pi\\text{ rad})$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// • Trường hợp (ii) Tại biên $ka = 2\\pi$ (và tương đương với $ka = 0$ vì $\\cos(2\\pi) = \\cos(0) = +1$): Phương trình Kronig-Penney trở thành:\u003c/span>\n          $$12\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a) = +1 \\quad (2)$$\n          \u003cspan class=\"cmt\">// + Giá trị tại đầu dưới của Dải 1 (ứng với $ka = 0$, nơi $\\cos(ka) = +1$ trong khoảng $0 \u003c \\alpha a \u003c \\pi$): Giải phương trình (2) bằng máy tính trong khoảng $(0.1, 3.1)$, ta thu được:\u003c/span>\n          $$(\\alpha a)_{ka=0} \\approx \\mathbf{2.628\\text{ rad}} \\quad (\\text{tức } \\approx 0.836\\pi\\text{ rad})$$\n          \u003cspan class=\"cmt\">// + Giá trị thứ nhất tại biên $ka = 2\\pi$ (đỉnh của Dải cho phép thứ 2): Thay $\\alpha a = 2\\pi$ vào (2), ta có $\\sin(2\\pi) = 0$ và $\\cos(2\\pi) = +1$, thỏa mãn tuyệt đối phương trình (2):\u003c/span>\n          $$(\\alpha a)_3 = \\mathbf{2\\pi \\approx 6.283\\text{ rad}}$$\n          \u003cspan class=\"cmt\">// + Giá trị thứ hai tại biên $ka = 2\\pi$ (đáy của Dải cho phép thứ 3, nằm trong khoảng $2\\pi \u003c \\alpha a \u003c 3\\pi$): Giải phương trình (2) bằng máy tính trong khoảng $(6.3, 9.4)$, ta thu được:\u003c/span>\n          $$(\\alpha a)_4 \\approx \\mathbf{8.067\\text{ rad}} \\quad (\\text{tức } \\approx 2.568\\pi\\text{ rad})$$\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 2 BUỔI 4 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b4-cau2\">Câu 2: Tính Độ Rộng Dải Năng Lượng Cho Phép (Allowed Energy Bands)\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Sử dụng các thông số từ bài 1 cho electron tự do ($P' = 12$, $m = m_0 = 9.11 \\times 10^{-31}\\text{ kg}$). Cho giá trị độ rộng giếng thế (tương đương khoảng cách ô mạng tinh thể tuần hoàn) $a = 4.2\\text{ Å}$. Xác định độ rộng dải năng lượng cho phép (allowed energy bands) trong khoảng:\u003cbr>\n      (a) $0 \u003c ka \u003c \\pi$\u003cbr>\n      (b) $\\pi \u003c ka \u003c 2\\pi$\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b4-hint2')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b4-sol2')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-hint2\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Từ định nghĩa $\\alpha^2 = \\frac{2m_0 E}{\\hbar^2} \\implies (\\alpha a)^2 = \\frac{2m_0 a^2 E}{\\hbar^2}$, ta rút ra công thức tính mức năng lượng $E$ từ giá trị $(\\alpha a)$:\n            $$E = \\frac{\\hbar^2}{2 m_0 a^2}(\\alpha a)^2$$\n          \u003c/li>\n          \u003cli>\u003cb>Mẹo tính siêu nhanh:\u003c/b> Hãy tính trước cụm hằng số $K_0 = \\frac{\\hbar^2}{2 m_0 a^2}$ ra đơn vị $\\text{eV}$ (nhớ đổi $a = 4.2\\text{ Å} = 4.2 \\times 10^{-10}\\text{ m}$ và chia cho $1.6 \\times 10^{-19}$). Khi đó với bất kỳ điểm biên $\\alpha a$ nào tìm được ở Câu 1, ta chỉ cần lấy $E = K_0 \\times (\\alpha a)^2$!\u003c/li>\n          \u003cli>\u003cb>Ý (a):\u003c/b> Trong khoảng $0 \u003c ka \u003c \\pi$ (Dải cho phép thứ 1), $\\alpha a$ chạy từ $\\alpha_1 a = 2.628\\text{ rad}$ (tại $ka=0$) đến $\\alpha_2 a = \\pi \\approx 3.1416\\text{ rad}$ (tại $ka=\\pi$). Độ rộng dải cho phép thứ nhất là $\\Delta E_a = E_2 - E_1$.\u003c/li>\n          \u003cli>\u003cb>Ý (b):\u003c/b> Trong khoảng $\\pi \u003c ka \u003c 2\\pi$ (Dải cho phép thứ 2), $\\alpha a$ chạy từ $\\alpha_3 a = 5.307\\text{ rad}$ (tại $ka=\\pi$) đến $\\alpha_4 a = 2\\pi \\approx 6.2832\\text{ rad}$ (tại $ka=2\\pi$). Độ rộng dải cho phép thứ hai là $\\Delta E_b = E_4 - E_3$.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-sol2\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước mở đầu: Thiết lập công thức quy đổi từ $(\\alpha a)$ sang năng lượng $E$ (tính bằng $\\text{eV}$):\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Đổi độ rộng giếng thế $a = 4.2\\text{ Å}$ sang đơn vị chuẩn SI là mét ($\\text{m}$):\u003c/span>\n          $$a = 4.2\\text{ Å} = 4.2 \\times 10^{-10}\\text{ m}$$\n          \u003cspan class=\"cmt\">// Bước 2: Từ hệ thức $\\alpha = \\frac{\\sqrt{2 m_0 E}}{\\hbar}$, ta nhân hai vế với $a$ rồi bình phương để rút ra $E$ theo $(\\alpha a)^2$:\u003c/span>\n          $$\\alpha a = \\sqrt{\\frac{2 m_0 E}{\\hbar^2}}\\cdot a \\implies E = \\left(\\frac{\\hbar^2}{2 m_0 a^2}\\right) (\\alpha a)^2$$\n          \u003cspan class=\"cmt\">// Bước 3: Tính giá trị của hệ số hằng số $K_0 = \\frac{\\hbar^2}{2 m_0 a^2}$ theo đơn vị Joule ($\\text{J}$) và đổi sang Electron-Volt ($\\text{eV}$) để dùng chung cho cả câu (a) và câu (b):\u003c/span>\n          $$K_0 = \\frac{\\hbar^2}{2 m_0 a^2} = \\frac{\\left(1.054 \\times 10^{-34}\\text{ J}\\cdot\\text{s}\\right)^2}{2 \\times \\left(9.11 \\times 10^{-31}\\text{ kg}\\right) \\times \\left(4.2 \\times 10^{-10}\\text{ m}\\right)^2} = \\frac{1.1109 \\times 10^{-68}}{3.2140 \\times 10^{-49}} \\approx 3.4565 \\times 10^{-20}\\text{ J}$$\n          $$K_0\\text{ [eV]} = \\frac{3.4565 \\times 10^{-20}\\text{ J}}{1.6 \\times 10^{-19}\\text{ J/eV}} \\approx \\mathbf{0.2160\\text{ eV}}$$\n          \u003cspan class=\"cmt\">// Như vậy, mọi mức năng lượng $E$ tính theo đơn vị $\\text{eV}$ chỉ đơn giản là: $E = 0.2160 \\times (\\alpha a)^2$.\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>(a) Độ rộng dải năng lượng cho phép thứ nhất trong khoảng $0 \u003c ka \u003c \\pi$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Lấy kết quả từ Câu 1: Khi $ka$ biến thiên từ $0$ đến $\\pi$, hàm $\\cos(ka)$ giảm từ $+1$ xuống $-1$, tương ứng với biến số $\\alpha a$ tăng từ $\\alpha_1 a = 2.628\\text{ rad}$ (tại $ka = 0$) đến $\\alpha_2 a = \\pi \\approx 3.1416\\text{ rad}$ (tại $ka = \\pi$).\u003c/span>\n          \u003cspan class=\"cmt\">// Bước 2: Tính mức năng lượng ở đáy dải thứ nhất ($E_1$ tại $\\alpha_1 a = 2.628$) và đỉnh dải thứ nhất ($E_2$ tại $\\alpha_2 a = \\pi$):\u003c/span>\n          $$E_1 = K_0 \\times (\\alpha_1 a)^2 = 0.2160 \\times (2.628)^2 \\approx \\mathbf{1.492\\text{ eV}}$$\n          $$E_2 = K_0 \\times (\\alpha_2 a)^2 = 0.2160 \\times (\\pi)^2 = 0.2160 \\times 9.8696 \\approx \\mathbf{2.132\\text{ eV}}$$\n          \u003cspan class=\"cmt\">// Bước 3: Lấy mức năng lượng đỉnh dải trừ đi mức năng lượng đáy dải để tìm độ rộng dải cho phép thứ nhất ($\\Delta E_1$):\u003c/span>\n          $$\\Delta E_1 = E_2 - E_1 = 2.132\\text{ eV} - 1.492\\text{ eV} = \\mathbf{0.64\\text{ eV}}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>(b) Độ rộng dải năng lượng cho phép thứ hai trong khoảng $\\pi \u003c ka \u003c 2\\pi$:\u003c/b>\n          \u003cspan class=\"cmt\">// Bước 1: Lấy kết quả từ Câu 1: Khi $ka$ biến thiên từ $\\pi$ đến $2\\pi$, hàm $\\cos(ka)$ tăng từ $-1$ lên $+1$, tương ứng với biến số $\\alpha a$ tăng từ $\\alpha_3 a = 5.307\\text{ rad}$ (tại $ka = \\pi$) đến $\\alpha_4 a = 2\\pi \\approx 6.2832\\text{ rad}$ (tại $ka = 2\\pi$).\u003c/span>\n          \u003cspan class=\"cmt\">// Bước 2: Tính mức năng lượng ở đáy dải thứ hai ($E_3$ tại $\\alpha_3 a = 5.307$) và đỉnh dải thứ hai ($E_4$ tại $\\alpha_4 a = 2\\pi$):\u003c/span>\n          $$E_3 = K_0 \\times (\\alpha_3 a)^2 = 0.2160 \\times (5.307)^2 = 0.2160 \\times 28.164 \\approx \\mathbf{6.084\\text{ eV}}$$\n          $$E_4 = K_0 \\times (\\alpha_4 a)^2 = 0.2160 \\times (2\\pi)^2 = 0.2160 \\times 39.478 \\approx \\mathbf{8.529\\text{ eV}}$$\n          \u003cspan class=\"cmt\">// Bước 3: Lấy $E_4 - E_3$ để tìm độ rộng dải năng lượng cho phép thứ hai ($\\Delta E_2$):\u003c/span>\n          $$\\Delta E_2 = E_4 - E_3 = 8.529\\text{ eV} - 6.084\\text{ eV} = \\mathbf{2.45\\text{ eV}}$$\n          \u003cspan class=\"cmt\">// Nhận xét vật lý rất thú vị: Dải năng lượng cho phép ở mức cao ($\\Delta E_2 = 2.45\\text{ eV}$) rộng hơn gần 4 lần so với dải năng lượng cho phép ở mức thấp ($\\Delta E_1 = 0.64\\text{ eV}$), bởi vì khi electron có năng lượng $E$ càng lớn thì nó càng ít bị giam giữ bởi các rào thế hạt nhân! (Đồng thời ta cũng thấy ngay độ rộng vùng cấm ngăn cách giữa hai dải này tại $ka=\\pi$ là $E_g = E_3 - E_2 = 6.084 - 2.132 = 3.95\\text{ eV}$).\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 3 BUỔI 4 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b4-cau3\">Câu 3: So Sánh Khối Lượng Hiệu Dụng Trên Giản Đồ $E$-$k$ (Figure P3.13)\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Hai dải dẫn khả dĩ được biểu diễn trên giản đồ năng lượng $E$ theo vectơ sóng $k$ trong Hình P3.13 (Đường liền nét $A$ là Parabol hẹp và dốc đứng hơn; đường nét đứt $B$ là Parabol mở rộng và thoải hơn). Hãy cho biết dải nào sẽ tương ứng với electron có khối lượng hiệu dụng lớn hơn và giải thích lý do.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b4-hint3')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b4-sol3')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-hint3\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>Viết công thức liên hệ giữa khối lượng hiệu dụng $m^*$ và độ cong (đạo hàm bậc hai) của giản đồ $E$-$k$:\n            $$\\frac{1}{m^*} = \\frac{1}{\\hbar^2}\\frac{d^2 E}{dk^2} \\implies m^* = \\frac{\\hbar^2}{\\frac{d^2 E}{dk^2}}$$\n          \u003c/li>\n          \u003cli>So sánh độ mở (độ cong $\\frac{d^2 E}{dk^2}$) của hai đường Parabol $A$ và $B$: Đường nào mở rộng và thoải hơn thì đạo hàm bậc hai $\\frac{d^2 E}{dk^2}$ nhỏ hơn $\\implies$ khối lượng hiệu dụng $m^*$ lớn hơn!\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-sol3\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 1: Viết phương trình xấp xỉ Parabol của năng lượng $E$ theo số sóng $k$ ở gần đáy của dải dẫn (xung quanh cực tiểu $k = 0$):\u003c/span>\n          $$E - E_c = \\frac{\\hbar^2 k^2}{2 m^*} = C \\cdot k^2$$\n          \u003cspan class=\"cmt\">// Bước 2: Lấy đạo hàm bậc hai của $E$ theo $k$ để thiết lập mối liên hệ giữa khối lượng hiệu dụng $m^*$ và độ cong hình học của đường biểu diễn $E$-$k$:\u003c/span>\n          $$\\frac{d^2 E}{dk^2} = 2C = \\frac{\\hbar^2}{m^*} \\implies \\mathbf{m^* = \\frac{\\hbar^2}{\\left(\\frac{d^2 E}{dk^2}\\right)}}$$\n          \u003cspan class=\"cmt\">// Công thức trên chứng tỏ: Khối lượng hiệu dụng $m^*$ tỉ lệ nghịch với đạo hàm bậc hai $\\frac{d^2 E}{dk^2}$ (tức tỉ lệ nghịch với độ cong hay độ dốc mở của Parabol).\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 3: Quan sát Hình P3.13 (hoặc xem Mô hình 2.4 tab Câu 3 ở trên): Cùng một độ tăng của số sóng $k$, năng lượng $E$ trên đường cong $A$ tăng vọt lên nhanh hơn nhiều so với đường cong $B$. Nghĩa là Parabol $A$ hẹp và cong gắt hơn, còn Parabol $B$ (nét đứt) mở rộng và phẳng/thoải hơn:\u003c/span>\n          $$\\left(\\frac{d^2 E}{dk^2}\\right)_B \u003c \\left(\\frac{d^2 E}{dk^2}\\right)_A$$\n        \u003c/div>\n        \u003cdiv class=\"step\">\n          \u003cspan class=\"cmt\">// Bước 4: Vì $m^*$ tỉ lệ nghịch với $\\frac{d^2 E}{dk^2}$, suy ra đường có độ cong nhỏ hơn sẽ có khối lượng hiệu dụng lớn hơn:\u003c/span>\n          $$\\mathbf{m_B^* > m_A^*}$$\n          \u003cspan class=\"cmt\">// Kết luận: Dải dẫn B (đường nét đứt mở rộng hơn) tương ứng với electron có khối lượng hiệu dụng LỚN HƠN.\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CÂU 4 BUỔI 4 -->\n    \u003cdiv class=\"formula-card\">\n      \u003ch3 id=\"b4-cau4\">Câu 4: Xác Định Dấu Khối Lượng Hiệu Dụng & Chiều Vận Tốc Tại 4 Điểm A, B, C, D (Figure P3.15)\u003c/h3>\n      \u003cp>\u003cb>Đề bài:\u003c/b> Tại bốn vị trí khảo sát $A, B, C, D$ trên giản đồ năng lượng $E$-$k$ tuần hoàn của Hình P3.15 (trong đó $B, C$ nằm gần đáy thung lũng xung quanh $k=0$ với $k_B \u003c 0, k_C > 0$; còn $A, D$ nằm gần hai đỉnh đồi biên với $k_A \\to -\\frac{\\pi}{a}$ và $k_D \\to +\\frac{\\pi}{a}$), hãy xác định dấu của khối lượng hiệu dụng (âm hay dương) và xác định chiều của vận tốc hạt dẫn. Lập bảng tổng hợp kết quả cho cả bốn điểm.\u003c/p>\n\n      \u003cdiv class=\"btn-group\">\n        \u003cbutton type=\"button\" class=\"btn btn-hint\" onclick=\"togglePanel('b4-hint4')\">Xem Gợi ý\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-sol\" onclick=\"togglePanel('b4-sol4')\">Xem Lời giải chi tiết\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-hint4\" class=\"panel\">\n        \u003cb>Hướng đi & Công thức cần dùng:\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>Xác định chiều vận tốc $v$:\u003c/b> Dùng công thức $v = \\frac{1}{\\hbar}\\frac{dE}{dk}$. Hãy nhìn độ dốc tiếp tuyến $\\frac{dE}{dk}$ tại từng điểm:\u003cbr>\n            + Tại $A$ và $B$ (nằm bên trái trục tung, nơi $k \u003c 0$): Đường cong đang đi dốc xuống từ trái sang phải $\\implies \\frac{dE}{dk} \u003c 0 \\implies v \u003c 0$ (chuyển động theo chiều âm $-x$ / sang trái).\u003cbr>\n            + Tại $C$ và $D$ (nằm bên phải trục tung, nơi $k > 0$): Đường cong đang đi dốc lên từ trái sang phải $\\implies \\frac{dE}{dk} > 0 \\implies v > 0$ (chuyển động theo chiều dương $+x$ / sang phải).\u003c/li>\n          \u003cli>\u003cb>Xác định dấu khối lượng hiệu dụng $m^*$:\u003c/b> Dùng công thức $\\frac{1}{m^*} = \\frac{1}{\\hbar^2}\\frac{d^2 E}{dk^2}$. Nhìn hướng bề lõm của đường cong:\u003cbr>\n            + Tại $B$ và $C$ (nằm ở vùng đáy thung lũng quanh $k=0$): Đường cong có bề lõm hướng lên trên ($\\cup$) $\\implies \\frac{d^2 E}{dk^2} > 0 \\implies m^* > 0$ (Dương).\u003cbr>\n            + Tại $A$ và $D$ (nằm ở vùng gần đỉnh đồi sát biên $\\pm\\frac{\\pi}{a}$, phía ngoài điểm uốn): Đường cong có bề lõm hướng xuống dưới ($\\cap$) $\\implies \\frac{d^2 E}{dk^2} \u003c 0 \\implies m^* \u003c 0$ (Âm).\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv id=\"b4-sol4\" class=\"panel\">\n        \u003cb>Lời giải chi tiết từng bước:\u003c/b>\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 1: Nêu hai công thức đạo hàm cơ sở để xét dấu từ đồ thị $E$-$k$:\u003c/b>\n          \u003cspan class=\"cmt\">// • Vận tốc hạt dẫn tỉ lệ thuận với đạo hàm bậc nhất (hệ số góc tiếp tuyến) của đường cong $E$-$k$:\u003c/span>\n          $$v = \\frac{1}{\\hbar}\\frac{dE}{dk}$$\n          \u003cspan class=\"cmt\">// • Khối lượng hiệu dụng tỉ lệ thuận về dấu với đạo hàm bậc hai (độ cong hình học) của đường cong $E$-$k$:\u003c/span>\n          $$\\frac{1}{m^*} = \\frac{1}{\\hbar^2}\\frac{d^2 E}{dk^2}$$\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 2: Phân tích chi tiết từng điểm A, B, C, D trên Hình P3.15 (xem trực quan trên Mô hình 2.4):\u003c/b>\n          \u003cspan class=\"cmt\">// • Tại điểm A (nằm ở vùng $k \u003c 0$ gần biên trái $-\\frac{\\pi}{a}$, sát đỉnh cực đại của dải):\u003c/span>\n          \u003cp>+ Khi $k$ tăng từ trái sang phải qua điểm $A$, đồ thị $E(k)$ đang đi xuống $\\implies$ độ dốc tiếp tuyến $\\frac{dE}{dk} \u003c 0 \\implies \\mathbf{v \u003c 0}$ (vận tốc hướng theo chiều âm trục $x$, tức chiều $-k$ sang trái).\u003cbr>\n          + Điểm $A$ nằm ở sườn gần đỉnh cực đại nên đồ thị úp xuống (lõm xuống dưới $\\cap$) $\\implies$ đạo hàm bậc hai $\\frac{d^2 E}{dk^2} \u003c 0 \\implies$ \u003cb>Khối lượng hiệu dụng ÂM ($m^* \u003c 0$)\u003c/b>.\u003c/p>\n\n          \u003cspan class=\"cmt\">// • Tại điểm B (nằm ở vùng $k \u003c 0$ gần đáy cực tiểu quanh $k = 0$):\u003c/span>\n          \u003cp>+ Khi $k$ tăng từ trái sang phải qua điểm $B$, đồ thị $E(k)$ vẫn đang đi xuống về phía đáy $k=0 \\implies \\frac{dE}{dk} \u003c 0 \\implies \\mathbf{v \u003c 0}$ (vận tốc hướng theo chiều âm $-x$ sang trái).\u003cbr>\n          + Điểm $B$ nằm gần đáy cực tiểu nên đồ thị ngửa lên (lõm lên trên $\\cup$) $\\implies$ đạo hàm bậc hai $\\frac{d^2 E}{dk^2} > 0 \\implies$ \u003cb>Khối lượng hiệu dụng DƯƠNG ($m^* > 0$)\u003c/b>.\u003c/p>\n\n          \u003cspan class=\"cmt\">// • Tại điểm C (nằm ở vùng $k > 0$ gần đáy cực tiểu quanh $k = 0$):\u003c/span>\n          \u003cp>+ Khi $k$ tăng từ trái sang phải qua điểm $C$, đồ thị $E(k)$ đang đi lên $\\implies$ độ dốc tiếp tuyến $\\frac{dE}{dk} > 0 \\implies \\mathbf{v > 0}$ (vận tốc hướng theo chiều dương $+x$ sang phải).\u003cbr>\n          + Điểm $C$ nằm trong lòng chảo cực tiểu nên đồ thị ngửa lên ($\\cup$) $\\implies \\frac{d^2 E}{dk^2} > 0 \\implies$ \u003cb>Khối lượng hiệu dụng DƯƠNG ($m^* > 0$)\u003c/b>.\u003c/p>\n\n          \u003cspan class=\"cmt\">// • Tại điểm D (nằm ở vùng $k > 0$ gần biên phải $+\\frac{\\pi}{a}$, sát đỉnh cực đại của dải):\u003c/span>\n          \u003cp>+ Khi $k$ tăng từ trái sang phải qua điểm $D$, đồ thị $E(k)$ vẫn đang đi lên tới đỉnh $\\implies \\frac{dE}{dk} > 0 \\implies \\mathbf{v > 0}$ (vận tốc hướng theo chiều dương $+x$ sang phải).\u003cbr>\n          + Điểm $D$ nằm gần đỉnh cực đại nên đồ thị úp xuống ($\\cap$) $\\implies \\frac{d^2 E}{dk^2} \u003c 0 \\implies$ \u003cb>Khối lượng hiệu dụng ÂM ($m^* \u003c 0$)\u003c/b>.\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"step\">\n          \u003cb>Bước 3: Bảng tổng hợp kết quả cho cả bốn điểm A, B, C, D:\u003c/b>\n          \u003cdiv class=\"tw\">\n            \u003ctable>\n              \u003ctr>\n                \u003cth>Vị trí điểm\u003c/th>\n                \u003cth>Độ dốc $\\frac{dE}{dk}$\u003c/th>\n                \u003cth>Chiều vận tốc hạt dẫn ($v$)\u003c/th>\n                \u003cth>Độ cong $\\frac{d^2E}{dk^2}$\u003c/th>\n                \u003cth>Dấu khối lượng hiệu dụng ($m^*$)\u003c/th>\n              \u003c/tr>\n              \u003ctr>\n                \u003ctd>\u003cb>Điểm A\u003c/b>\u003c/td>\n                \u003ctd>$\\frac{dE}{dk} \u003c 0$ (Dốc xuống)\u003c/td>\n                \u003ctd>\u003cb>Chiều âm ($-x$ / sang trái)\u003c/b> ($v \u003c 0$)\u003c/td>\n                \u003ctd>$\\frac{d^2E}{dk^2} \u003c 0$ (Úp $\\cap$)\u003c/td>\n                \u003ctd>\u003cspan class=\"k b4\">Âm ($m^* \u003c 0$)\u003c/span>\u003c/td>\n              \u003c/tr>\n              \u003ctr>\n                \u003ctd>\u003cb>Điểm B\u003c/b>\u003c/td>\n                \u003ctd>$\\frac{dE}{dk} \u003c 0$ (Dốc xuống)\u003c/td>\n                \u003ctd>\u003cb>Chiều âm ($-x$ / sang trái)\u003c/b> ($v \u003c 0$)\u003c/td>\n                \u003ctd>$\\frac{d^2E}{dk^2} > 0$ (Ngửa $\\cup$)\u003c/td>\n                \u003ctd>\u003cspan class=\"k b2\">Dương ($m^* > 0$)\u003c/span>\u003c/td>\n              \u003c/tr>\n              \u003ctr>\n                \u003ctd>\u003cb>Điểm C\u003c/b>\u003c/td>\n                \u003
