<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhucXO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8ff;--card:#fff;--ink:#1d2350;--mut:#58608a;--g:#c9cfe8;--tint:#eaf0ff;--accent:#2f5bea;--danger:#c23a4b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142e;--card:#1a2046;--ink:#e8ebff;--mut:#9aa3d1;--g:#323a6e;--tint:#222a5c;--accent:#7f9bff;--danger:#ff7a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10142e;--card:#1a2046;--ink:#e8ebff;--mut:#9aa3d1;--g:#323a6e;--tint:#222a5c;--accent:#7f9bff;--danger:#ff7a8a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:36px 20px 80px}
header.top{margin-bottom:28px}
header.top h1{margin:0;font-size:clamp(30px,5vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.btn{border:1px solid var(--g);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--tint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tile{position:relative;background:var(--card);border:1px solid var(--g);border-radius:14px;display:flex;flex-direction:column}
.cover{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:132px;padding:16px 18px;background:var(--c);color:#fff;border-radius:13px 13px 0 0;cursor:pointer}
.cover:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.cover .ic{font-size:30px;line-height:1}
.cover .cd{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .body{padding:14px 18px 6px;flex:1}
.tile h3{margin:0;font-size:17px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 18px 0}
.chip{background:var(--tint);color:var(--ink);padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px}
.acts{display:flex;gap:8px;padding:12px 18px 16px;align-items:center}
.acts .btn.pri{flex:1}
details.more{position:relative}
details.more summary{list-style:none;border:1px solid var(--g);background:var(--card);border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;line-height:1.5}
details.more summary::-webkit-details-marker{display:none}
details.more summary:hover{background:var(--tint)}
.menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:20;min-width:210px;background:var(--card);border:1px solid var(--g);border-radius:12px;padding:6px;display:flex;flex-direction:column}
.menu button{all:unset;box-sizing:border-box;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--tint)}
.menu button.dng{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--g);margin:4px 2px;width:auto}
.empty{border:1.5px dashed var(--g);border-radius:14px;padding:44px 20px;text-align:center}
.empty h2{margin:0;color:var(--ink);font-size:20px}

/* ===== Viewer ===== */
#viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body.viewing #viewer{display:flex}
body.viewing .wrap{display:none}
#frame{flex:1;width:100%;border:0;background:#fff}
#hm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:60;width:46px;height:46px;border:0;border-radius:14px;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(16,20,46,.3)}
body.viewing #hm{display:flex}
#hm svg{width:20px;height:20px;fill:currentColor}
#hmenu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);right:14px;z-index:60;display:none;flex-direction:column;gap:6px;width:min(250px,calc(100vw - 28px));max-height:calc(100vh - env(safe-area-inset-top,0px) - 84px);overflow:auto}
#hmenu.on{display:flex}
#hmenu .ttl{background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 14px;font-weight:800;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere;flex-shrink:0}
#hmenu button{background:var(--card);border:1px solid var(--g);border-radius:12px;padding:11px 14px;font-weight:600;text-align:left;box-shadow:0 2px 10px rgba(16,20,46,.18);flex-shrink:0}
#hmenu button:hover,#hmenu button:focus-visible{background:var(--tint)}
#vOthers{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
#vOthers[hidden]{display:none}
#vOthers .hlab{font-weight:800;font-size:12.5px;padding:6px 6px 0;color:var(--ink)}
#vList{display:flex;flex-direction:column;gap:6px}
#vList .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:baseline}

/* ===== Checkpoint ===== */
#cpFab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:60;width:50px;height:50px;border:0;border-radius:16px;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(16,20,46,.3)}
body.viewing #cpFab{display:flex}
#cpFab svg{width:22px;height:22px;fill:currentColor}
#cpBadge{position:absolute;top:-7px;left:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
#cpBadge[hidden]{display:none}
#cpPanel{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:60;width:min(310px,calc(100vw - 28px));max-height:min(72vh,540px);display:none;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--g);border-radius:14px;padding:10px;box-shadow:0 6px 24px rgba(16,20,46,.28)}
#cpPanel.on{display:flex}
#cpPanel .cph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 0;font-weight:800;font-size:14px}
#cpPanel .cpa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#cpPanel .cpa .full{grid-column:1/-1}
#cpNote{border:1px solid var(--g);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:400;resize:vertical;min-height:64px}
#cpPanel .btn{padding:9px 10px;font-size:13.5px}
#cpItems{overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.cpr{display:flex;gap:4px;align-items:stretch}
.cpj{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--g)}
.cpj:hover,.cpj:focus-visible{background:var(--tint)}
.cpt{flex:1;min-width:0;display:flex;flex-direction:column}
.cpn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.cphint{padding:2px 4px 0;font-size:12px;line-height:1.4;color:var(--mut)}
.cpe{all:unset;box-sizing:border-box;width:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--g);cursor:pointer;font-size:14px}
.cpe:hover,.cpe:focus-visible{background:var(--tint)}
.cpx{display:none;font-weight:800}
.cpr.del .cpj{color:var(--danger);border-color:var(--danger)}
.cpr.del .cpx{display:inline}
.cpempty{padding:14px 6px;text-align:center;color:var(--mut);font-size:13.5px}
#cpRail{position:fixed;right:6px;top:50%;transform:translateY(-50%);z-index:55;display:none}
body.viewing #cpRail:not([hidden]){display:block}
#cpRail .rl{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:10px 4px;max-height:70vh;overflow:hidden}
#cpRail .rd{all:unset;box-sizing:border-box;display:block;position:relative;width:34px;height:14px;cursor:pointer;flex-shrink:0}
#cpRail .rd::after{content:"";position:absolute;right:0;top:50%;width:16px;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--ink);opacity:.6;box-shadow:0 0 0 1px color-mix(in srgb,var(--bg) 60%,transparent);transition:width .18s ease,opacity .18s ease,background .18s ease}
#cpRail .rd:hover::after,#cpRail .rd.hi::after,#cpRail .rd:focus-visible::after{width:34px;opacity:1;background:var(--accent)}
#cpRail .rd:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
#cpRail .rp{position:absolute;right:100%;top:50%;transform:translateY(-50%);padding-right:10px;display:none}
#cpRail:hover .rp,#cpRail:focus-within .rp,#cpRail.open .rp{display:block}
#cpRail .card{background:var(--card);border:1px solid var(--g);border-radius:12px;padding:6px;min-width:170px;max-width:min(260px,calc(100vw - 80px));max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 24px rgba(16,20,46,.28)}
#cpRail .ri{all:unset;box-sizing:border-box;display:block;padding:8px 10px;border-radius:8px;cursor:pointer;flex-shrink:0}
#cpRail .ri .n{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;overflow-wrap:anywhere;font-size:12.5px;font-weight:400;line-height:1.35;color:var(--mut);margin-top:2px}
#cpRail .ri:hover,#cpRail .ri:focus-visible,#cpRail .ri.hi{background:var(--tint)}
#cpBar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;right:72px;z-index:65;display:none;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;font-weight:600;font-size:13.5px;line-height:1.35;box-shadow:0 2px 10px rgba(16,20,46,.3)}
#cpBar.on{display:flex}
#cpBar span{flex:1}
#cpBar button{border:0;border-radius:8px;padding:6px 12px;background:var(--bg);color:var(--ink);font-weight:700;flex-shrink:0}

dialog{border:1px solid var(--g);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(560px,92vw);max-height:92vh}
dialog::backdrop{background:rgba(10,14,40,.55)}
dialog.wide{width:min(980px,96vw)}
.dh{padding:18px 20px 0}
.dh h2{margin:0;font-size:19px}
.db{padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.df{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13.5px}
label.f input,label.f select,label.f textarea{border:1px solid var(--g);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:400}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:90px 1fr;gap:12px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--g)}
.sw input:checked+span{border-color:var(--card);box-shadow:0 0 0 2.5px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.hint{color:var(--mut);font-size:12.5px;font-weight:400}
#code{width:100%;height:min(62vh,640px);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;white-space:pre;overflow:auto;tab-size:2;border:1px solid var(--g);border-radius:10px;padding:12px;background:var(--bg);resize:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (max-width:560px){.row,.row3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#toast,#cpRail .rd::after{transition:none}}
</style>

</section>

<dialog id="fmDlg">
  <form method="dialog" id="fm">
    <div class="dh"><h2>Sửa thông tin</h2></div>

      <label class="f">Tên môn<input id="fName" required maxlength="120"></label>

      </div>

        <label class="f">Trạng thái

</dialog>

<dialog id="codeDlg" class="wide">
  <div class="dh"><h2 id="cTitle">Sửa mã nguồn</h2></div>

    <textarea id="code" spellcheck="false" wrap="off" aria-label="Mã HTML"></textarea>

  <div class="df">

    <button class="btn" id="cCancel">Đóng</button>
    <button class="btn pri" id="cSave">Lưu</button>
  </div>
</dialog>

<dialog id="cpDlg">
  <form id="cpForm" autocomplete="off">
    <div class="dh"><h2 id="cpDTitle">Checkpoint</h2></div>

    <div class="df">
      <button class="btn" id="cpDNo" type="button">Hủy</button>
      <button class="btn pri" type="submit">Lưu</button>

</dialog>

<dialog id="cfDlg">
  <div class="dh"><h2 id="cfTitle">Xác nhận</h2></div>
  <div class="db"><p id="cfMsg" style="margin:0"></p></div>
  <div class="df">
    <button class="btn" id="cfNo">Hủy</button>
    <button class="btn dng" id="cfYes">Đồng ý</button>
  </div>
</dialog>

<input type="file" id="pickReplace" accept=".html,.htm,text/html" hidden>

<script>
const DB_NAME="hub-mon-hoc",STORE="subjects",REM="hub-mon-hoc-removed",CP_KEY="phucxo-checkpoints-v1",POS_KEY="phucxo-pos-v1";
const COLORS=["#2f5bea","#0b7f72","#c2336b","#b86a00","#7a4fd6","#4a5578"];
const SANDBOX="allow-scripts allow-same-origin allow-popups allow-downloads allow-modals";

let db=null,mem=new Map(),subjects=[],viewing=null,curUrl=null,editingId=null,codeId=null,replaceId=null;
let pushed=false,openLen=0;
const $=s=>document.querySelector(s);

function openDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>res(null);
      r.onblocked=()=>res(null);
    }catch(e){res(null)}
  });
}
const rp=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const store=m=>db.transaction(STORE,m).objectStore(STORE);
const dbAll=async()=>db?rp(store("readonly").getAll()):[...mem.values()];
const dbPut=async o=>{if(db)await rp(store("readwrite").put(o));else mem.set(o.id,o)};
const dbDel=async id=>{if(db)await rp(store("readwrite").delete(id));else mem.delete(id)};

const getRem=()=>{try{return JSON.parse(localStorage.getItem(REM)||"[]")}catch(e){return[]}};
const addRem=id=>{try{const r=getRem();if(!r.includes(id))r.push(id);localStorage.setItem(REM,JSON.stringify(r))}catch(e){}};

function toast(t,ms){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),ms||2800)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kb=s=>{const n=new Blob([s]).size;return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"};
const slug=s=>(s||"mon-hoc").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"mon-hoc";
const titleOf=h=>{const m=/<title>([^<]*)<\/title>/i.exec(h);return m?m[1].trim():""};
const get=id=>subjects.find(s=>s.id===id);

async function load(){subjects=(await dbAll()).sort((a,b)=>a.order-b.order)}
async function persist(s){s.updated=Date.now();await dbPut(s)}
async function renumber(){for(let i=0;i<subjects.length;i++){if(subjects[i].order!==i){subjects[i].order=i;await dbPut(subjects[i])}}}

/* ===== Viewer ===== */
const urlFor=s=>s.html?URL.createObjectURL(new Blob([s.html],{type:"text/html"})):(s.src||"about:blank");
const freeUrl=u=>{if(u&&u.startsWith("blob:"))URL.revokeObjectURL(u)};
function setMenu(on){$("#hmenu").classList.toggle("on",on);$("#hm").setAttribute("aria-expanded",on?"true":"false")}

/* Mỗi lần mở môn tạo iframe mới (không đổi src của iframe cũ) để iframe không tích lũy
   các mục lịch sử riêng. Đây là nguyên nhân của lỗi "ấn Về hub lần đầu ra trang trắng". */
function mountFrame(url){
  const old=$("#frame");if(old)old.remove();
  const f=document.createElement("iframe");
  f.id="frame";f.title="Nội dung môn học";
  f.setAttribute("sandbox",SANDBOX);
  f.addEventListener("load",()=>{try{attachFrame(f)}catch(e){}cpAbortPick();cpRestore(f)});
  f.src=url;
  $("#viewer").appendChild(f);
}
function renderSwitch(){
  const others=subjects.filter(s=>s.id!==viewing);
  $("#vOthers").hidden=!others.length;
  $("#vList").innerHTML=others.map(s=>`<button type="button" data-id="${s.id}" style="--c:${esc(s.color)}"><i class="dot"></i>${esc(s.icon||"")} ${esc(s.title)}</button>`).join("");
}
function openSubject(id){
  const s=get(id);if(!s)return;
  const was=document.body.classList.contains("viewing");
  if(viewing===id&&was)return;
  if(was)cpSavePosNow();
  cpReset();
  viewing=id;
  freeUrl(curUrl);
  curUrl=urlFor(s);
  mountFrame(curUrl);
  if(s.src&&!s.html)fetch(s.src,{method:"HEAD",cache:"no-store"}).then(r=>{if(r.status===404)toast("Không tìm thấy file “"+s.src+"”. Kiểm tra tên file trong thư mục mon và đường dẫn src (phân biệt chữ hoa/thường).",7000)}).catch(()=>{});
  $("#vTitle").textContent=s.title;
  renderSwitch();
  setMenu(false);
  document.body.classList.add("viewing");
  cpRender();
  if(location.hash.slice(1)!==id){
    if(was)history.replaceState(history.state,"","#"+id);          // chuyển môn: không thêm mục lịch sử
    else{history.pushState({pxo:1},"","#"+id);pushed=true;openLen=history.length}
  }
}
function closeViewer(){
  cpSavePosNow();
  setMenu(false);cpReset();
  document.body.classList.remove("viewing");
  const f=$("#frame");if(f)f.remove();
  freeUrl(curUrl);curUrl=null;
  viewing=null;pushed=false;
  if(location.hash)history.replaceState(history.state,"",location.pathname+location.search);
}
function goHub(){
  setMenu(false);
  // Chỉ dùng history.back() khi chắc chắn mục trên cùng là mục do hub tạo; luôn có bước dự phòng đóng chắc chắn.
  if(pushed&&history.length===openLen){
    history.back();
    setTimeout(()=>{if(document.body.classList.contains("viewing"))closeViewer()},300);
  }else closeViewer();
}
function syncHash(){
  const id=location.hash.slice(1);
  if(id&&get(id))openSubject(id);
  else if(document.body.classList.contains("viewing"))closeViewer();
}
function refreshViewer(id){if(viewing===id){viewing=null;openSubject(id)}}

function download(s){
  const u=urlFor(s);
  const a=document.createElement("a");a.href=u;a.download=s.html?slug(s.title)+".html":(s.src||"mon").split("/").pop();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>freeUrl(u),4000);
}
function openTab(s){
  const u=urlFor(s);
  if(!window.open(u,"_blank"))toast("Trình duyệt chặn tab mới. Hãy cho phép cửa sổ bật lên.");
  setTimeout(()=>freeUrl(u),60000);
}

function confirmDlg(title,msg,yes){
  return new Promise(res=>{
    const d=$("#cfDlg");$("#cfTitle").textContent=title;$("#cfMsg").textContent=msg;$("#cfYes").textContent=yes||"Đồng ý";
    const done=v=>{d.close();$("#cfYes").onclick=$("#cfNo").onclick=null;res(v)};
    $("#cfYes").onclick=()=>done(true);$("#cfNo").onclick=()=>done(false);
    d.oncancel=()=>res(false);
    d.showModal();
  });
}

function buildSwatches(sel){
  $("#fSw").innerHTML=COLORS.map((c,i)=>`<label style="--c:${c}"><input type="radio" name="fc" value="${c}" ${c===sel||(!sel&&i===0)?"checked":""}><span></span></label>`).join("");
}
function showForm(id){
  const s=get(id);if(!s)return;
  editingId=id;
  $("#fName").value=s.title;
  $("#fIcon").value=s.icon||"📘";
  $("#fCode").value=s.code||"";
  $("#fDesc").value=s.desc||"";
  $("#fStatus").value=s.status;
  $("#fFile").value="";
  buildSwatches(s.color);
  $("#fmDlg").showModal();
  $("#fName").focus();
}
$("#fm").addEventListener("submit",async e=>{
  if(!(e.submitter&&e.submitter.value==="ok"))return;
  const s=get(editingId);if(!s)return;
  const f=$("#fFile").files[0];
  const html=f?await f.text():null;
  const title=$("#fName").value.trim()||(html&&titleOf(html))||s.title;
  const color=(document.querySelector('input[name="fc"]:checked')||{}).value||s.color;
  s.edited=true;
  Object.assign(s,{title,icon:$("#fIcon").value.trim()||"📘",code:$("#fCode").value.trim(),desc:$("#fDesc").value.trim(),status:$("#fStatus").value,color});
  if(html!==null){s.prevHtml=s.html;s.html=html}
  await persist(s);
  toast("Đã cập nhật");
  render();
});

/* ===== Sửa mã nguồn (từ menu ⋯ ở hub) ===== */
let codeBase="";
async function showCode(id){
  const s=get(id);if(!s)return;
  let html=s.html;
  if(!html&&s.src){
    try{const r=await fetch(s.src);if(!r.ok)throw 0;html=await r.text()}
    catch(e){toast("Không đọc được file trong repo. Hãy mở hub qua GitHub Pages hoặc server cục bộ để sửa mã.");return}
  }
  codeId=id;codeBase=html;
  $("#cTitle").textContent="Sửa mã nguồn — "+s.title;
  $("#code").value=html;
  $("#cUndo").disabled=!s.prevHtml;
  $("#cRepo").hidden=!(s.src&&s.html);
  updInfo();
  $("#codeDlg").showModal();
}
function updInfo(){$("#cInfo").textContent=kb($("#code").value)+" · Ctrl+S để lưu · Tab chèn thụt lề"}
$("#code").addEventListener("input",updInfo);
$("#code").addEventListener("keydown",e=>{
  if(e.key==="Tab"){e.preventDefault();const t=e.target,a=t.selectionStart;t.setRangeText("  ",a,t.selectionEnd,"end")}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();$("#cSave").click()}
});
$("#cSave").onclick=async()=>{
  const s=get(codeId);if(!s)return;
  const v=$("#code").value;
  if(v!==codeBase){s.prevHtml=codeBase;s.html=v;codeBase=v;await persist(s);refreshViewer(s.id);render();$("#cUndo").disabled=false;$("#cRepo").hidden=!s.src}
  toast("Đã lưu (bản sửa lưu trong trình duyệt này)");
};
$("#cUndo").onclick=async()=>{
  const s=get(codeId);if(!s||!s.prevHtml)return;
  if(!await confirmDlg("Khôi phục bản trước","Nội dung hiện tại sẽ được thay bằng bản lưu trước đó.","Khôi phục"))return;
  const cur=s.html;s.html=s.prevHtml;s.prevHtml=cur;codeBase=s.html;await persist(s);
  $("#code").value=s.html;updInfo();refreshViewer(s.id);render();toast("Đã khôi phục");
};
$("#cCancel").onclick=()=>$("#codeDlg").close();
$("#cRepo").onclick=async()=>{
  const s=get(codeId);if(!s||!s.src)return;
  if(!await confirmDlg("Về bản trong repo","Bản sửa trong trình duyệt sẽ bị bỏ, hub dùng lại file trong repo.","Đồng ý"))return;
  s.html="";s.prevHtml="";await persist(s);$("#codeDlg").close();refreshViewer(s.id);render();toast("Đã dùng lại bản trong repo");
};

/* ===== Checkpoint ===== */
/* Hàm này được chèn vào bên trong trang môn học (iframe cùng origin) để chọn vị trí và cuộn tới vị trí đã lưu.
   Phải tự chứa, không dùng biến bên ngoài. */
function cpHelper(){
  if(window.__pxo)return;
  var doc=document,win=window;
  var cssEsc=(win.CSS&&win.CSS.escape)?win.CSS.escape.bind(win.CSS):function(s){return String(s).replace(/[^\w-]/g,"\\$&")};
  var st=doc.createElement("style");
  st.textContent=".__pxo-hover{outline:2px solid #2f5bea !important;outline-offset:-2px !important}html.__pxo-pick,html.__pxo-pick *{cursor:crosshair !important}";
  (doc.head||doc.documentElement).appendChild(st);

  function txt(el){return String(el.innerText||el.textContent||"").replace(/\s+/g," ").trim()}
  function clip(s,n){return s.length>n?s.slice(0,n-1)+"…":s}
  function isScroller(p){
    try{var o=win.getComputedStyle(p).overflowY;return /(auto|scroll|overlay)/.test(o)&&p.scrollHeight>p.clientHeight+1}catch(e){return false}
  }
  function scrollers(el){
    var out=[];
    for(var q=el.parentElement;q;q=q.parentElement){
      if(q!==doc.documentElement&&q!==doc.scrollingElement&&isScroller(q))out.push(q);
    }
    return out;
  }
  function setTop(node,top){
    try{node.scrollTo({top:top,behavior:"instant"})}catch(e){node.scrollTop=top}
  }
  function cssPath(el){
    var parts=[];
    while(el&&el.nodeType===1&&el!==doc.documentElement){
      if(el===doc.body){parts.unshift("body");break}
      if(el.id){
        var q="#"+cssEsc(el.id);
        try{if(doc.querySelectorAll(q).length===1){parts.unshift(q);break}}catch(e){}
      }
      var i=1,sib=el;
      while((sib=sib.previousElementSibling)){if(sib.tagName===el.tagName)i++}
      parts.unshift(el.tagName.toLowerCase()+":nth-of-type("+i+")");
      el=el.parentElement;
    }
    return parts.join(">");
  }
  function labelOf(el,cy){
    if(/^H[1-6]$/.test(el.tagName))return clip(txt(el),60);
    var hs=doc.querySelectorAll("h1,h2,h3,h4,h5,h6"),best=null;
    for(var i=0;i<hs.length;i++){
      var h=hs[i];
      if(!((h.compareDocumentPosition(el)&4)||el.contains(h)))continue;
      var r=h.getBoundingClientRect();
      if(!r.width&&!r.height)continue;
      if(typeof cy!=="number"||r.top<=cy+1)best=h;
    }
    if(best){var t=clip(txt(best),60);if(t)return t}
    return clip(txt(el),50);
  }
  function yOf(el,cy){
    var se=doc.scrollingElement,y=cy+(se?se.scrollTop:0),ch=scrollers(el);
    for(var i=0;i<ch.length;i++)y+=ch[i].scrollTop;
    return y;
  }
  function byText(a){
    if(!a.txt||a.txt.length<4)return null;
    var list=doc.querySelectorAll(a.tag||"*"),n=Math.min(list.length,4000);
    for(var i=0;i<n;i++){if(txt(list[i]).slice(0,80)===a.txt)return list[i]}
    return null;
  }
  function find(a){
    var el=null;
    if(a.sel){try{el=doc.querySelector(a.sel)}catch(e){}}
    if(el&&a.txt&&txt(el).slice(0,80)!==a.txt){var alt=byText(a);if(alt)el=alt}
    if(!el)el=byText(a);
    return el;
  }
  function jump(a){
    var el=find(a);
    if(!el)return false;
    for(var p=el;p;p=p.parentElement){if(p.tagName==="DETAILS"&&!p.open)p.open=true}
    if(!el.getClientRects().length)return false;
    var rel=typeof a.rel==="number"?a.rel:0;
    function ptY(){var r=el.getBoundingClientRect();return r.top+r.height*rel}
    var ch=scrollers(el);
    for(var i=0;i<ch.length;i++){
      var c=ch[i],cr=c.getBoundingClientRect();
      setTop(c,c.scrollTop+(ptY()-(cr.top+c.clientHeight*0.3)));
    }
    var se=doc.scrollingElement||doc.documentElement;
    setTop(se,se.scrollTop+(ptY()-win.innerHeight*0.3));
    return true;
  }

  function mk(el,cy){
    var r=el.getBoundingClientRect();
    var rel=r.height>0?Math.min(1,Math.max(0,(cy-r.top)/r.height)):0;
    return {a:{sel:cssPath(el),rel:rel,txt:txt(el).slice(0,80),tag:el.tagName.toLowerCase()},label:labelOf(el,cy),y:yOf(el,cy)};
  }
  function where(){
    var cy=Math.round(win.innerHeight*0.3),el=doc.elementFromPoint(win.innerWidth/2,cy);
    if(!el||el===doc.documentElement)el=doc.body||doc.documentElement;
    return mk(el,cy);
  }
  var tm=0;
  win.addEventListener("scroll",function(){
    clearTimeout(tm);
    tm=setTimeout(function(){try{win.parent.pxoSavePos(where(),win)}catch(e){}},350);
  },true);
  win.addEventListener("keydown",function(e){
    if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey)return;
    var t=e.target;
    if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
    var k=e.key;
    if(k==="b"||k==="B"||k==="["||k==="]"){try{win.parent.pxoKey(k)}catch(x){}}
  });

  var picking=false,cb=null,hov=null;
  function clearHover(){if(hov){hov.classList.remove("__pxo-hover");hov=null}}
  function stop(){
    picking=false;clearHover();
    doc.documentElement.classList.remove("__pxo-pick");
    win.removeEventListener("click",onClick,true);
    win.removeEventListener("mouseover",onOver,true);
    win.removeEventListener("keydown",onKey,true);
  }
  function onOver(e){
    var t=e.target;
    if(!t||t.nodeType!==1||t===hov)return;
    clearHover();hov=t;t.classList.add("__pxo-hover");
  }
  function onKey(e){
    if(e.key==="Escape"){e.preventDefault();var f=cb;stop();cb=null;if(f)f(null)}
  }
  function onClick(e){
    e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
    var el=e.target;
    if(el&&el.nodeType!==1)el=el.parentElement;
    if(!el||el===doc.documentElement)el=doc.body||doc.documentElement;
    var info=mk(el,e.clientY),f=cb;
    stop();cb=null;
    if(f)f(info.a,info.label,info.y);
  }
  win.__pxo={
    pick:function(f){
      stop();cb=f;picking=true;
      doc.documentElement.classList.add("__pxo-pick");
      win.addEventListener("click",onClick,true);
      win.addEventListener("mouseover",onOver,true);
      win.addEventListener("keydown",onKey,true);
    },
    cancel:function(){var f=cb;stop();cb=null;if(f)f(null)},
    jump:jump,
    where:where
  };
}

let cpData={},cpDel=false,cpPicking=false,cpOnOk=null,cpCursor=null;
let posData={},restoring=false;
function posLoad(){try{posData=JSON.parse(localStorage.getItem(POS_KEY)||"{}")||{}}catch(e){posData={}}}
function posSave(id,a){posData[id]={a,t:Date.now()};try{localStorage.setItem(POS_KEY,JSON.stringify(posData))}catch(e){}}
const cpNewId=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
/* Lưu vị trí đang đọc: helper gọi sau khi cuộn dừng; hub gọi thêm khi rời môn / đóng trang. */
window.pxoSavePos=(w,src)=>{
  if(restoring||!viewing||!w||!w.a)return;
  const f=$("#frame");if(!f||f.contentWindow!==src)return;
  posSave(viewing,w.a);
};
function cpSavePosNow(){
  if(restoring||!viewing)return;
  try{const f=$("#frame"),h=f&&f.contentWindow.__pxo;if(h){const w=h.where();if(w&&w.a)posSave(viewing,w.a)}}catch(e){}
}
function cpRestore(f){
  const sid=viewing,p=posData[sid];
  if(!p||!p.a)return;
  restoring=true;let tries=0;
  const attempt=()=>{
    if($("#frame")!==f||viewing!==sid){restoring=false;return}
    let ok=false,y=0;
    try{const h=f.contentWindow.__pxo;if(h&&h.jump(p.a)){ok=true;y=h.where().y}}catch(e){}
    if(ok){if(y>300)toast("Đã tiếp tục chỗ bạn đang đọc");setTimeout(()=>{restoring=false},900)}
    else if(++tries<4)setTimeout(attempt,350);
    else restoring=false;
  };
  attempt();
}
window.addEventListener("pagehide",cpSavePosNow);
function cpLoad(){try{cpData=JSON.parse(localStorage.getItem(CP_KEY)||"{}")||{}}catch(e){cpData={}}}
function cpSave(){try{localStorage.setItem(CP_KEY,JSON.stringify(cpData))}catch(e){toast("Không lưu được checkpoint: trình duyệt đang chặn lưu trữ.")}}
const cpOf=id=>cpData[id]||[];
const cpSorted=id=>cpOf(id).slice().sort((a,b)=>((a.y||0)-(b.y||0))||((a.t||0)-(b.t||0)));

function attachFrame(f){
  const w=f.contentWindow,d=f.contentDocument;
  if(!w||!d||!d.documentElement||w.__pxo)return;
  const sc=d.createElement("script");
  sc.textContent="("+cpHelper.toString()+")();";
  d.documentElement.appendChild(sc);
}
function cpApi(){
  const f=$("#frame");if(!f)return null;
  try{if(!f.contentWindow.__pxo)attachFrame(f);return f.contentWindow.__pxo||null}catch(e){return null}
}
const CP_FAIL="Trang này chưa dùng được checkpoint. Hãy mở hub qua GitHub Pages hoặc server cục bộ, đừng mở trực tiếp file từ ổ đĩa.";

function closeCp(){$("#cpPanel").classList.remove("on");$("#cpFab").setAttribute("aria-expanded","false")}
function toggleCp(){
  const p=$("#cpPanel");
  if(p.classList.contains("on")){closeCp();return}
  setMenu(false);cpDel=false;cpRender();
  p.classList.add("on");$("#cpFab").setAttribute("aria-expanded","true");
}
function cpAbortPick(){cpPicking=false;$("#cpBar").classList.remove("on")}
function cpReset(){
  cpDel=false;cpCursor=null;closeCp();
  if(cpPicking){const f=$("#frame");try{f&&f.contentWindow.__pxo&&f.contentWindow.__pxo.cancel()}catch(e){}}
  cpAbortPick();
}
function cpRender(){
  const list=viewing?cpSorted(viewing):[];
  if(!list.length)cpDel=false;
  const b=$("#cpBadge");b.textContent=list.length;b.hidden=!list.length;
  $("#cpDel").textContent=cpDel?"Xong":"Xóa checkpoint";
  $("#cpDel").disabled=!list.length;
  $("#cpClear").disabled=!list.length;
  const rail=$("#cpRail");rail.hidden=!list.length;if(!list.length)rail.classList.remove("open");
  $("#cpDashes").innerHTML=list.map(c=>`<button type="button" class="rd" data-cp="${c.id}" aria-label="${esc(c.name)}"></button>`).join("");
  $("#cpNames").innerHTML=list.map(c=>`<button type="button" class="ri" data-cp="${c.id}" title="${esc(c.name+(c.note?" — "+c.note:""))}"><span class="n">${esc(c.name)}</span>${c.note?`<span class="nt">${esc(c.note)}</span>`:""}</button>`).join("");
  $("#cpItems").innerHTML=list.length?list.map(c=>`<div class="cpr${cpDel?" del":""}"><button type="button" class="cpj" data-k="${cpDel?"del":"go"}" data-cp="${c.id}"><span class="cpt"><span class="cpn">${esc(c.name)}</span>${c.note?`<span class="nt">${esc(c.note)}</span>`:""}</span><span class="cpx" aria-hidden="true">✕</span></button>${cpDel?"":`<button type="button" class="cpe" data-k="ren" data-cp="${c.id}" aria-label="Sửa tên và ghi chú">✎</button>`}</div>`).join(""):'<div class="cpempty">Chưa có checkpoint nào.</div>';
}
function cpAsk(title,val,note,ok){
  cpOnOk=ok;
  $("#cpDTitle").textContent=title;
  $("#cpName").value=val;
  $("#cpNote").value=note||"";
  $("#cpDlg").showModal();
  $("#cpName").focus();$("#cpName").select();
}
$("#cpForm").addEventListener("submit",e=>{
  e.preventDefault();
  const v=$("#cpName").value.trim();if(!v)return;
  $("#cpDlg").close();
  const f=cpOnOk;cpOnOk=null;if(f)f(v,$("#cpNote").value.trim());
});
$("#cpNote").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();$("#cpForm").requestSubmit()}});
$("#cpDNo").onclick=()=>$("#cpDlg").close();

function cpStartAdd(){
  closeCp();
  const h=cpApi();
  if(!h){toast(CP_FAIL);return}
  const sid=viewing;
  cpPicking=true;$("#cpBar").classList.add("on");
  h.pick((a,label,y)=>{
    cpAbortPick();
    if(!a||viewing!==sid)return;
    cpAsk("Thêm checkpoint",label||("Vị trí "+(cpOf(sid).length+1)),"",(name,note)=>{
      const id=cpNewId();
      (cpData[sid]=cpData[sid]||[]).push({id,name,note,a,y:y||0,t:Date.now()});
      cpCursor={sid,id,y:y||0};
      cpSave();cpRender();toast("Đã thêm checkpoint");
    });
  });
}
function cpGo(id,info){
  const c=cpOf(viewing).find(x=>x.id===id);if(!c)return;
  const h=cpApi();
  if(!h){toast(CP_FAIL);return}
  closeCp();
  let ok=false,w=null;try{ok=h.jump(c.a);if(ok)w=h.where()}catch(e){}
  if(!ok){toast("Không tìm thấy vị trí này. Nội dung trang có thể đã thay đổi.");return}
  cpCursor={sid:viewing,id,y:w?w.y:c.y};
  if(info){const l=cpSorted(viewing);toast((l.findIndex(x=>x.id===id)+1)+"/"+l.length+" · "+c.name)}
}
/* Thêm nhanh tại chỗ đang xem (phím B) */
function cpQuickAdd(){
  const h=cpApi();if(!h){toast(CP_FAIL);return}
  let w=null;try{w=h.where()}catch(e){}
  if(!w||!w.a){toast("Không xác định được vị trí hiện tại.");return}
  const sid=viewing;
  if(cpOf(sid).some(c=>Math.abs((c.y||0)-w.y)<10)){toast("Đã có checkpoint ở vị trí này.");return}
  const id=cpNewId(),name=w.label||("Vị trí "+(cpOf(sid).length+1));
  (cpData[sid]=cpData[sid]||[]).push({id,name,note:"",a:w.a,y:w.y,t:Date.now()});
  cpCursor={sid,id,y:w.y};
  cpSave();cpRender();toast("Đã thêm “"+name+"”.");
}
/* Chuyển tới checkpoint trước (-1) / sau (+1) */
function cpStep(dir){
  const list=cpSorted(viewing);
  if(!list.length){toast("Chưa có checkpoint nào.");return}
  const h=cpApi();if(!h){toast(CP_FAIL);return}
  let w=null;try{w=h.where()}catch(e){}
  let target=-1;
  const cur=cpCursor&&cpCursor.sid===viewing?list.findIndex(c=>c.id===cpCursor.id):-1;
  if(cur>=0&&w&&Math.abs(w.y-cpCursor.y)<=20)target=cur+dir;        // đang đứng ở một checkpoint
  else{
    const y=w?w.y:0;
    if(dir>0)target=list.findIndex(c=>(c.y||0)>y+12);
    else for(let i=list.length-1;i>=0;i--){if((list[i].y||0)<y-12){target=i;break}}
  }
  if(target<0||target>=list.length){toast(dir>0?"Đây là checkpoint cuối.":"Đây là checkpoint đầu.");return}
  cpGo(list[target].id,true);
}
window.pxoKey=k=>{
  if(!viewing||cpPicking)return;
  if(k==="b"||k==="B")cpQuickAdd();
  else if(k==="[")cpStep(-1);
  else if(k==="]")cpStep(1);
};
window.addEventListener("keydown",e=>{
  if(!document.body.classList.contains("viewing")||document.querySelector("dialog[open]"))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
  window.pxoKey(e.key);
});
$("#cpItems").addEventListener("click",e=>{
  const b=e.target.closest("[data-cp]");if(!b)return;
  const id=b.dataset.cp,k=b.dataset.k;
  if(k==="go")cpGo(id);
  else if(k==="del"){
    cpData[viewing]=cpOf(viewing).filter(x=>x.id!==id);
    if(!cpData[viewing].length)delete cpData[viewing];
    cpSave();cpRender();toast("Đã xóa checkpoint");
  }else if(k==="ren"){
    const c=cpOf(viewing).find(x=>x.id===id);if(!c)return;
    cpAsk("Sửa checkpoint",c.name,c.note,(name,note)=>{c.name=name;c.note=note;cpSave();cpRender()});
  }
});
/* Thanh bên phải: các gạch ngang, rê chuột vào để hiện tên, bấm để tới vị trí */
let railTouch=false;
const railEl=$("#cpRail");
railEl.addEventListener("pointerdown",e=>{railTouch=e.pointerType==="touch"});
railEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-cp]");if(!b)return;
  if(railTouch&&!railEl.classList.contains("open")){railEl.classList.add("open");return}
  railEl.classList.remove("open");
  b.blur();
  cpGo(b.dataset.cp);
});
function railHi(e,on){
  const b=e.target.closest("[data-cp]");if(!b)return;
  railEl.querySelectorAll('.rd[data-cp="'+b.dataset.cp+'"],.ri[data-cp="'+b.dataset.cp+'"]').forEach(x=>{if(x!==b||b.classList.contains("rd")||true)x.classList.toggle("hi",on)});
}
railEl.addEventListener("mouseover",e=>railHi(e,true));
railEl.addEventListener("mouseout",e=>railHi(e,false));
$("#cpAdd").onclick=cpStartAdd;
$("#cpHere").onclick=()=>{closeCp();cpQuickAdd()};
$("#cpDel").onclick=()=>{cpDel=!cpDel;cpRender()};
$("#cpClear").onclick=async()=>{
  const n=cpOf(viewing).length;if(!n)return;
  if(!await confirmDlg("Xóa tất cả checkpoint","Xóa "+n+" checkpoint của môn này. Không thể hoàn tác.","Xóa tất cả"))return;
  delete cpData[viewing];cpSave();cpDel=false;cpRender();toast("Đã xóa tất cả checkpoint");
};
$("#cpCancel").onclick=()=>{const f=$("#frame");try{f&&f.contentWindow.__pxo&&f.contentWindow.__pxo.cancel()}catch(e){}cpAbortPick()};
$("#cpFab").onclick=e=>{e.stopPropagation();toggleCp()};

/* ===== Sự kiện hub ===== */
$("#list").addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,t=b.closest(".tile"),id=t&&t.dataset.id;
  document.querySelectorAll("details.more[open]").forEach(d=>d.open=false);
  const s=id&&get(id);if(!s)return;
  if(a==="open")openSubject(id);
  else if(a==="edit")showForm(id);
  else if(a==="code")showCode(id);
  else if(a==="dl")download(s);
  else if(a==="tab")openTab(s);
  else if(a==="replace"){replaceId=id;$("#pickReplace").value="";$("#pickReplace").click()}
  else if(a==="left"||a==="right"){
    const i=subjects.indexOf(s),j=a==="left"?i-1:i+1;
    if(j<0||j>=subjects.length)return;
    [subjects[i],subjects[j]]=[subjects[j],subjects[i]];
    await renumber();render();
  }
  else if(a==="del"){
    if(!await confirmDlg("Xóa “"+s.title+"”","Môn và toàn bộ nội dung sẽ bị xóa khỏi hub, không khôi phục được.","Xóa"))return;
    if(s.src)addRem(id);
    await dbDel(id);subjects=subjects.filter(x=>x.id!==id);
    if(cpData[id]){delete cpData[id];cpSave()}
    if(posData[id]){delete posData[id];try{localStorage.setItem(POS_KEY,JSON.stringify(posData))}catch(e){}}
    await renumber();render();toast("Đã xóa");
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest("details.more"))document.querySelectorAll("details.more[open]").forEach(d=>d.open=false);
  if(!e.target.closest("#hmenu,#hm"))setMenu(false);
  if(!e.target.closest("#cpPanel,#cpFab"))closeCp();
  if(!e.target.closest("#cpRail"))railEl.classList.remove("open");
});
// Bấm vào trong iframe không tới được document cha, nên đóng menu khi focus rời sang iframe.
window.addEventListener("blur",()=>{setMenu(false);closeCp();railEl.classList.remove("open")});

$("#pickReplace").addEventListener("change",async e=>{
  const f=e.target.files[0],s=get(replaceId);if(!f||!s)return;
  s.prevHtml=s.html;s.html=await f.text();await persist(s);render();refreshViewer(s.id);
  toast("Đã thay file. Khôi phục bản cũ trong Sửa mã nguồn nếu cần.");
});

$("#vBack").onclick=goHub;
$("#hm").onclick=e=>{e.stopPropagation();closeCp();setMenu(!$("#hmenu").classList.contains("on"))};
$("#vList").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)openSubject(b.dataset.id)});
window.addEventListener("hashchange",syncHash);
window.addEventListener("keydown",e=>{
  if(e.key!=="Escape"||document.querySelector("dialog[open]"))return;
  if(cpPicking)$("#cpCancel").click();
  else if($("#cpPanel").classList.contains("on"))closeCp();
  else if($("#hmenu").classList.contains("on"))setMenu(false);
  else if(document.body.classList.contains("viewing"))goHub();
});

(async function init(){
  cpLoad();posLoad();
  db=await openDB();
  if(!db)toast("Trình duyệt không cho lưu lâu dài: chỉnh sửa trong hub sẽ mất khi đóng trang.");
  await load();
  let seed=[];
  try{seed=JSON.parse($("#seed").textContent||"[]")}catch(e){toast("Danh sách môn trong index.html bị lỗi cú pháp (thiếu dấu { } hoặc dấu phẩy): "+e.message)}
  const rem=getRem();
  for(const sd of seed){
    const ex=get(sd.id);
    if(ex){
      let ch=false;
      if(sd.src&&ex.src!==sd.src){ex.src=sd.src;ch=true}
      if(!ex.edited)for(const k of ["title","icon","code","desc","status","color"]){if(sd[k]!==undefined&&ex[k]!==sd[k]){ex[k]=sd[k];ch=true}}
      if(ch)await dbPut(ex);
      continue;
    }
    if(rem.includes(sd.id))continue;
    const o=Object.assign({html:"",prevHtml:"",order:subjects.length,updated:Date.now()},sd);
    await dbPut(o);subjects.push(o);
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
  syncHash();
})();
</script>
</body>
</html>
