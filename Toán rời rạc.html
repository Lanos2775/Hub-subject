  <!-- MỤC 9: BÀI TẬP TRỌNG TÂM BÀI 6 (CÓ GỢI Ý & LỜI GIẢI CHI TIẾT) -->
  <section>
    <h2>9. Bài Tập Trọng Tâm Bài 6 (Luyện Thi Thực Chiến Giải Chi Tiết)</h2>

    <div class="formula-card">
      <h3 id="bt-b6-1">Câu 1: Tìm Nghịch đảo Modulo bằng Định lý Bézout</h3>
      <p><b>Đề bài:</b> Tìm nghịch đảo của $a = 19$ theo mô-đu-lô $m = 141$ (tức tìm $\overline{a} \in \{1, \dots, 140\}$ sao cho $19\overline{a} \equiv 1 \pmod{141}$). Từ đó giải phương trình đồng dư: $19x \equiv 4 \pmod{141}$.</p>
      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('h-b6-1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('s-b6-1')">Xem Lời giải chi tiết</button>
      </div>
      <div id="h-b6-1" class="panel">
        Bước 1: Dùng thuật toán Euclid chia xuôi $141$ cho $19$ đến khi dư $1$.<br>
        Bước 2: Thế ngược từ dưới lên để viết $1 = s \cdot 19 + t \cdot 141$. Khi có $\overline{a}$, nhân cả 2 vế của $19x \equiv 4 \pmod{141}$ với $\overline{a}$ để tìm $x$.
      </div>
      <div id="s-b6-1" class="panel">
        <div class="step">
          <b>Bước 1: Chia xuôi Euclid để tìm $\gcd(141, 19)$:</b>
          <ul>
            <li>(1) $141 = 7 \times 19 + \mathbf{8} \implies \mathbf{8} = 141 - 7 \times 19$</li>
            <li>(2) $19 = 2 \times 8 + \mathbf{3} \implies \mathbf{3} = 19 - 2 \times 8$</li>
            <li>(3) $8 = 2 \times 3 + \mathbf{2} \implies \mathbf{2} = 8 - 2 \times 3$</li>
            <li>(4) $3 = 1 \times 2 + \mathbf{1} \implies \mathbf{1} = 3 - 1 \times 2$</li>
          </ul>
          Vì số dư cuối cùng là $1$, nên $\gcd(19, 141) = 1$, chắc chắn tồn tại nghịch đảo!
        </div>
        <div class="step">
          <b>Bước 2: Thế ngược Bézout từ (4) lên (1):</b>
          $$1 = 3 - 1 \times \mathbf{2} = 3 - 1 \times (8 - 2 \times 3) = \mathbf{3} \times \mathbf{3} - 1 \times 8$$
          <span class="cmt">// Thay tiếp $\mathbf{3} = 19 - 2 \times 8$ từ (2) vào:</span>
          $$1 = 3 \times (19 - 2 \times 8) - 1 \times 8 = 3 \times 19 - \mathbf{7} \times \mathbf{8}$$
          <span class="cmt">// Thay tiếp $\mathbf{8} = 141 - 7 \times 19$ từ (1) vào:</span>
          $$1 = 3 \times 19 - 7 \times (141 - 7 \times 19) = \mathbf{52} \times 19 - 7 \times 141$$
          Lấy mô-đu-lô $141$ hai vế, vì $-7 \times 141 \equiv 0 \pmod{141}$ nên:
          $$52 \times 19 \equiv 1 \pmod{141} \implies \text{Nghịch đảo của } 19 \text{ mod } 141 \text{ là } \mathbf{\overline{a} = 52}$$
        </div>
        <div class="step">
          <b>Bước 3: Giải phương trình $19x \equiv 4 \pmod{141}$:</b>
          <span class="cmt">// Nhân cả hai vế với nghịch đảo $52$:</span>
          $$52 \cdot (19x) \equiv 52 \cdot 4 \pmod{141} \iff 1 \cdot x \equiv 208 \pmod{141}$$
          Vì $208 \bmod 141 = 67$, nghiệm của phương trình là $\mathbf{x \equiv 67 \pmod{141}}$.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3 id="bt-b6-2">Câu 2: Bài tập toàn diện Hệ mật mã RSA (Từ tạo khóa đến Mã hóa & Giải mã)</h3>
      <p><b>Đề bài:</b> Giả sử hệ thống RSA sử dụng hai số nguyên tố $p = 11$ và $q = 13$, với số mũ mã hóa công khai $e = 7$.<br>
      a) Tính mô-đu-lô $n$, $\varphi(n) = (p-1)(q-1)$ và kiểm tra điều kiện hợp lệ của khóa $e = 7$.<br>
      b) Tìm khóa giải mã bí mật $d$.<br>
      c) Mã hóa bản rõ số $M = 9$ để tìm bản mã $C$, sau đó kiểm tra lại bằng cách giải mã $C$ về $M$.</p>
      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('h-b6-2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('s-b6-2')">Xem Lời giải chi tiết</button>
      </div>
      <div id="h-b6-2" class="panel">
        a) $n = 11 \times 13 = 143$; $\varphi(n) = 10 \times 12 = 120$.<br>
        b) Tìm $d$ sao cho $7d \equiv 1 \pmod{120}$ bằng thuật toán Euclid.<br>
        c) Tính $C = 9^7 \bmod 143$ bằng cách tách $7 = 4 + 2 + 1 = (111)_2$.
      </div>
      <div id="s-b6-2" class="panel">
        <div class="step">
          <b>a) Tính thông số khóa công khai:</b><br>
          • Mô-đu-lô: $n = p \cdot q = 11 \times 13 = \mathbf{143}$.<br>
          • Giá trị $\varphi(n) = (p-1)(q-1) = 10 \times 12 = \mathbf{120}$.<br>
          • Kiểm tra: $\gcd(e, \varphi(n)) = \gcd(7, 120) = 1$ (vì $120 = 17 \times 7 + 1$). Vậy khóa công khai $(143, 7)$ hoàn toàn hợp lệ!
        </div>
        <div class="step">
          <b>b) Tìm khóa giải mã bí mật $d$:</b>
          <span class="cmt">// Ta cần tìm $d$ là nghịch đảo của $7$ theo mô-đu-lô $120$: $7d \equiv 1 \pmod{120}$.</span>
          Từ phép chia Euclid: $120 = 17 \times 7 + 1 \implies 1 = 1 \times 120 + \mathbf{(-17)} \times 7$.<br>
          Do đó hệ số Bézout đi với $7$ là $s = -17$. Vì khóa $d$ phải dương ($0 < d < 120$), ta cộng thêm $120$:
          $$d = -17 + 120 = \mathbf{103}$$
          <i>(Kiểm tra: $7 \times 103 = 721 = 6 \times 120 + 1 \equiv 1 \pmod{120}$, chính xác!).</i>
        </div>
        <div class="step">
          <b>c) Mã hóa bản rõ $M = 9$ và Giải mã:</b><br>
          • <b>Mã hóa ($C = 9^7 \bmod 143$):</b> Đổi $7 = 4 + 2 + 1$. Ta tính các lũy thừa bậc 2 của $9 \bmod 143$:<br>
          - $9^1 \bmod 143 = 9$<br>
          - $9^2 \bmod 143 = 81$<br>
          - $9^4 \bmod 143 = 81^2 \bmod 143 = 6561 \bmod 143 = 126$ (vì $6561 = 45 \times 143 + 126$).<br>
          Vậy $C = 9^7 \bmod 143 = (9^4 \cdot 9^2 \cdot 9^1) \bmod 143 = (126 \times 81 \times 9) \bmod 143 = \mathbf{48}$.<br>
          • <b>Giải mã ($M = 48^{103} \bmod 143$):</b> Đổi $103 = 64 + 32 + 4 + 2 + 1 = (1100111)_2$.<br>
          Tính bình phương liên tiếp của $48 \bmod 143$: $48^1 \equiv 48$; $48^2 = 2304 \equiv 16$; $48^4 \equiv 16^2 = 256 \equiv 113$; $48^8 \equiv 113^2 \equiv 16$; $48^{16} \equiv 113$; $48^{32} \equiv 16$; $48^{64} \equiv 113$.<br>
          Nhân các vị trí bit $1$: $M = (48^{64} \cdot 48^{32} \cdot 48^4 \cdot 48^2 \cdot 48^1) \bmod 143 = (113 \times 16 \times 113 \times 16 \times 48) \bmod 143 = \mathbf{9}$ (Khôi phục đúng bản rõ $M = 9$ ban đầu!).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3 id="bt-b6-3">Câu 3: Trao đổi khóa Diffie-Hellman</h3>
      <p><b>Đề bài:</b> Alice và Bob thống nhất sử dụng số nguyên tố công khai $p = 23$ và căn nguyên thủy $a = 5$. Alice chọn số bí mật $k_1 = 6$, Bob chọn số bí mật $k_2 = 15$. Hãy tính giá trị công khai mà mỗi người gửi cho nhau và khóa bí mật chung cuối cùng mà hai người thiết lập được.</p>
      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('h-b6-3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('s-b6-3')">Xem Lời giải chi tiết</button>
      </div>
      <div id="h-b6-3" class="panel">
        Alice gửi $Y_A = 5^6 \bmod 23$. Bob gửi $Y_B = 5^{15} \bmod 23$. Sau đó Alice tính $(Y_B)^6 \bmod 23$ và Bob tính $(Y_A)^{15} \bmod 23$.
      </div>
      <div id="s-b6-3" class="panel">
        <div class="step">
          <b>Bước 1: Giá trị Alice gửi cho Bob ($Y_A = 5^6 \bmod 23$):</b><br>
          Ta có $5^2 \bmod 23 = 25 \bmod 23 = 2$.<br>
          Suy ra $Y_A = 5^6 \bmod 23 = (5^2)^3 \bmod 23 = 2^3 \bmod 23 = \mathbf{8}$. (Alice gửi số $8$ cho Bob).
        </div>
        <div class="step">
          <b>Bước 2: Giá trị Bob gửi cho Alice ($Y_B = 5^{15} \bmod 23$):</b><br>
          Ta tách $5^{15} = (5^2)^7 \cdot 5^1 \equiv 2^7 \cdot 5 = 128 \times 5 = 640 \pmod{23}$.<br>
          Vì $640 = 27 \times 23 + \mathbf{19}$, nên $Y_B = \mathbf{19}$. (Bob gửi số $19$ cho Alice).
        </div>
        <div class="step">
          <b>Bước 3: Cả hai bên tự tính Khóa bí mật chung $K$:</b><br>
          • <b>Phía Bob tính:</b> $K = (Y_A)^{k_2} \bmod 23 = 8^{15} \bmod 23 = (2^3)^{15} \bmod 23 = 2^{45} \bmod 23$.<br>
          Vì $2^{11} = 2048 = 89 \times 23 + 1 \equiv 1 \pmod{23}$, nên $2^{45} = (2^{11})^4 \cdot 2^1 \equiv 1^4 \cdot 2 = \mathbf{2} \pmod{23}$.<br>
          • <b>Phía Alice tính:</b> $K = (Y_B)^{k_1} \bmod 23 = 19^6 \bmod 23 = (-4)^6 \bmod 23 = 2^{12} \bmod 23 = 2^{11} \cdot 2^1 \equiv \mathbf{2} \pmod{23}$.<br>
          Vậy khóa bí mật chung của Alice và Bob là $\mathbf{K = 2}$!
        </div>
      </div>

  <section class="sum">
    <h2>Tổng Kết Bài 6: Bản Đồ Tư Duy Mật Mã Học Cần Nhớ</h2>
    <ul>
      <li><b>Đồng dư & Nghịch đảo:</b> $a \equiv b \pmod m \iff (a-b) \vdots m$. Muốn tìm nghịch đảo $\overline{a}$ của $a \pmod m$ (khi $\gcd(a,m)=1$), dùng thuật toán Euclid chia xuôi rồi thế ngược Bézout để tìm hệ số $s$ trong $sa + tm = 1$.</li>
      <li><b>Lũy thừa mô-đu-lô nhanh ($b^n \bmod m$):</b> Đổi số mũ $n$ sang nhị phân, bình phương biến $\text{power}$ qua từng bước và chỉ nhân vào $x$ tại những vị trí bit nhị phân bằng $1$.</li>
      <li><b>Hệ mật mã RSA:</b> Khóa công khai $(n = pq, e)$ với $\gcd(e, (p-1)(q-1)) = 1$. Khóa giải mã bí mật $d$ thỏa mãn $de \equiv 1 \pmod{(p-1)(q-1)}$. Mã hóa: $C = M^e \bmod n$; Giải mã: $M = C^d \bmod n$.</li>
      <li><b>Giao thức Diffie-Hellman:</b> Alice gửi $a^{k_1} \bmod p$, Bob gửi $a^{k_2} \bmod p$, khóa chung là $K = a^{k_1 k_2} \bmod p$.</li>
    </ul>

/* ==========================================================================
   MÔ HÌNH TƯƠNG TÁC BÀI 6: MẬT MÃ RSA, DIFFIE-HELLMAN & CAESAR
   ========================================================================== */
let currentCryptoMode = 'rsa';

// Hàm lũy thừa mô-đu-lô nhanh chuẩn xác
function modPow(base, exp, mod) {
  let res = 1n;
  let b = BigInt(base) % BigInt(mod);
  let e = BigInt(exp);
  const m = BigInt(mod);
  while (e > 0n) {
    if (e % 2n === 1n) res = (res * b) % m;
    b = (b * b) % m;
    e /= 2n;
  }
  return Number(res);
}

function selectCryptoMode(mode, btn) {
  currentCryptoMode = mode;
  if (btn) {
    document.querySelectorAll('#crypto-tabs .sim-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  renderCryptoSim();
}
window.selectCryptoMode = selectCryptoMode;

function renderCryptoSim() {

  $('val-cr-m').textContent = mVal;
  $('val-cr-k').textContent = kVal;

  const rsaConfigs = [
    { p: 43, q: 59, n: 2537, phi: 2436, e: 13, d: 937 },
    { p: 11, q: 13, n: 143,  phi: 120,  e: 7,  d: 103 },
    { p: 17, q: 23, n: 391,  phi: 352,  e: 3,  d: 235 }
  ];
  const cfg = rsaConfigs[pairIdx] || rsaConfigs[0];

  let svg = '';

  if (currentCryptoMode === 'rsa') {
    const C = modPow(mVal, cfg.e, cfg.n);
    const M_dec = modPow(C, cfg.d, cfg.n);
    const binE = cfg.e.toString(2);

    descEl.innerHTML = `<b>Trạng thái Hệ mật mã RSA:</b> Khóa công khai $(n = ${cfg.p}\\times${cfg.q} = \\mathbf{${cfg.n}},\\ e = \\mathbf{${cfg.e}})$ | $\\varphi(n) = (p-1)(q-1) = \\mathbf{${cfg.phi}}$ | Khóa giải mã bí mật $\\mathbf{d = ${cfg.d}}$ (vì $${cfg.e}\\times${cfg.d} \\equiv 1 \\pmod{${cfg.phi}}$).<br>
    • <b>Bước Mã hóa:</b> Bản rõ $M = \\mathbf{${mVal}} \\xrightarrow{e=${cfg.e}=(${binE})_2} C = ${mVal}^{${cfg.e}} \\bmod ${cfg.n} = \\mathbf{${C}}$.<br>
    • <b>Bước Giải mã:</b> Bản mã $C = \\mathbf{${C}} \\xrightarrow{d=${cfg.d}} M = ${C}^{${cfg.d}} \\bmod ${cfg.n} = \\mathbf{${M_dec}}$ (Khôi phục chính xác 100%!).`;

      <rect x="24" y="55" width="165" height="140" rx="16" fill="var(--card)" stroke="var(--c2)" stroke-width="3"/>
      <text x="106" y="88" text-anchor="middle" style="font-weight:800;fill:var(--c2)">1. BẢN RÕ GỐC (M)</text>
      <text x="106" y="130" text-anchor="middle" style="font-size:26px;font-weight:800;fill:var(--ink)">M = ${mVal}</text>
      <text x="106" y="168" text-anchor="middle" style="font-size:12px;fill:var(--mut)">Chưa mã hóa</text>

      <line x1="189" y1="125" x2="255" y2="125" stroke="var(--c1)" stroke-width="3.5"/>
      <text x="222" y="112" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--c1)">M^${cfg.e} mod ${cfg.n}</text>

      <rect x="255" y="45" width="170" height="160" rx="16" fill="var(--card)" stroke="var(--c4)" stroke-width="3"/>
      <text x="340" y="78" text-anchor="middle" style="font-weight:800;fill:var(--c4)">2. BẢN MÃ (C)</text>
      <text x="340" y="125" text-anchor="middle" style="font-size:26px;font-weight:800;fill:var(--c4)">C = ${C}</text>

      <text x="340" y="180" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:var(--c5)">Khóa công khai (${cfg.n}, ${cfg.e})</text>

      <line x1="425" y1="125" x2="491" y2="125" stroke="var(--c5)" stroke-width="3.5"/>

      <text x="573" y="88" text-anchor="middle" style="font-weight:800;fill:var(--c2)">3. GIẢI MÃ (M)</text>

      <text x="573" y="168" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--c5)">Dùng khóa bí mật d = ${cfg.d}</text>
    `;
  } else if (currentCryptoMode === 'dh') {
    const p = 23, a = 5;
    const k1 = mVal, k2 = kVal;

    descEl.innerHTML = `<b>Giao thức Trao đổi khóa Diffie-Hellman:</b> Tham số công khai $p = \\mathbf{23}$, căn nguyên thủy $a = \\mathbf{5}$.<br>
    • <b>Alice</b> chọn số bí mật $k_1 = \\mathbf{${k1}}$, tính $Y_A = 5^{${k1}} \\bmod 23 = \\mathbf{${YA}}$ gửi cho Bob.<br>
    • <b>Bob</b> chọn số bí mật $k_2 = \\mathbf{${k2}}$, tính $Y_B = 5^{${k2}} \\bmod 23 = \\mathbf{${YB}}$ gửi cho Alice.<br>
    • <b>Khóa bí mật chung thiết lập được:</b> Alice tính $(Y_B)^{k_1} \\bmod 23 = ${YB}^{${k1}} \\bmod 23 = \\mathbf{${KA}}$ | Bob tính $(Y_A)^{k_2} \\bmod 23 = ${YA}^{${k2}} \\bmod 23 = \\mathbf{${KB}}$.`;

    svg += `

      <rect x="457" y="35" width="195" height="180" rx="16" fill="var(--card)" stroke="var(--c5)" stroke-width="3"/>
      <text x="554" y="66" text-anchor="middle" style="font-weight:800;fill:var(--c5)">BOB (Bí mật k₂ = ${k2})</text>
      <text x="554" y="102" text-anchor="middle" style="font-size:13.5px">Tính công khai:</text>
      <text x="554" y="128" text-anchor="middle" style="font-weight:800;fill:var(--ink)">Y_B = 5^${k2} mod 23 = ${YB}</text>
      <text x="554" y="170" text-anchor="middle" style="font-weight:800;fill:var(--c2)">Khóa chung K = ${KB}</text>
    `;
  } else {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const pIdx = mVal % 26;
    const cIdx = (pIdx + kVal) % 26;
    const pChar = alphabet[pIdx];
    const cChar = alphabet[cIdx];

    descEl.innerHTML = `<b>Mật mã dịch chuyển Caesar (Modulo 26):</b> Đang chọn chữ cái gốc <b>'${pChar}'</b> (số thứ tự $p = \\mathbf{${pIdx}}$) và khóa dịch chuyển $k = \\mathbf{${kVal}}$ vị trí.<br>
    • <b>Hàm mã hóa:</b> $f(${pIdx}) = (${pIdx} + ${kVal}) \\bmod 26 = \\mathbf{${cIdx}}$ $\\rightarrow$ Chữ cái mã hóa là <b>'${cChar}'</b>.<br>
    • <b>Hàm giải mã:</b> $f^{-1}(${cIdx}) = (${cIdx} - ${kVal}) \\bmod 26 = \\mathbf{${pIdx}}$ $\\rightarrow$ Trở về chữ cái gốc <b>'${pChar}'</b>.`;

    svg += `
      <rect x="45" y="55" width="180" height="140" rx="18" fill="var(--card)" stroke="var(--c2)" stroke-width="3"/>
      <text x="135" y="88" text-anchor="middle" style="font-weight:800;fill:var(--c2)">CHỮ CÁI RÕ (p)</text>
      <text x="135" y="138" text-anchor="middle" style="font-size:34px;font-weight:800">'${pChar}' (${pIdx < 10 ? '0'+pIdx : pIdx})</text>

      <line x1="225" y1="105" x2="455" y2="105" stroke="var(--c1)" stroke-width="3.5"/>
      <text x="340" y="92" text-anchor="middle" style="font-weight:800;fill:var(--c1)">Mã hóa: (p + ${kVal}) mod 26 →</text>

      <line x1="455" y1="150" x2="225" y2="150" stroke="var(--c5)" stroke-width="3.5" stroke-dasharray="5,5"/>
      <text x="340" y="175" text-anchor="middle" style="font-weight:800;fill:var(--c5)">← Giải mã: (c - ${kVal}) mod 26</text>

      <rect x="455" y="55" width="180" height="140" rx="18" fill="var(--card)" stroke="var(--c4)" stroke-width="3"/>
      <text x="545" y="88" text-anchor="middle" style="font-weight:800;fill:var(--c4)">CHỮ CÁI MÃ (c)</text>
      <text x="545" y="138" text-anchor="middle" style="font-size:34px;font-weight:800;fill:var(--c4)">'${cChar}' (${cIdx < 10 ? '0'+cIdx : cIdx})</text>
    `;
  }

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}
window.renderCryptoSim = renderCryptoSim;

/* ==========================================================================
   HỆ THỐNG LÕI TỰ ĐỘNG: TOC, CUSTOM DROPDOWN & ON-DEMAND LOADER
   ========================================================================== */
function buildTOC() {
  const tocContainer = $('toc-links');
  if (!tocContainer) return;
  let html = '', idx = 0;
  document.querySelectorAll('#app-content h2, #app-content h3').forEach(el => {
    const title = el.textContent.trim();
    const isSub = el.tagName === 'H3';
    const target = isSub ? el : (el.closest('section') || el);
    if (!target.id) target.id = 'sec-' + (idx++);
    html += `<a href="#${target.id}" class="${isSub ? 'sub' : 'grp'}">${title}</a>`;
  });
  tocContainer.innerHTML = html;
}

function upgradeCustomSelects(root = document) {
  root.querySelectorAll('select').forEach(sel => {
    if (sel.dataset.customized === 'true') {
      if (sel._syncCustomUI) sel._syncCustomUI();
      return;
    }
    sel.dataset.customized = 'true';
    sel.classList.add('native-select-hidden');

    const wrap = document.createElement('div');
    wrap.className = 'csel-wrap';

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'csel-trigger';

    const labelSpan = document.createElement('span');
    labelSpan.className = 'csel-label';

    const arrowBox = document.createElement('span');
    arrowBox.className = 'csel-arrow';

    trigger.appendChild(labelSpan);
    trigger.appendChild(arrowBox);

    const menu = document.createElement('div');
    menu.className = 'csel-menu';

    const syncUI = () => {
      const selectedOpt = sel.options[sel.selectedIndex] || sel.options[0];
      labelSpan.textContent = selectedOpt ? selectedOpt.textContent : '';
      menu.querySelectorAll('.csel-opt').forEach((item, idx) => {
        item.classList.toggle('selected', idx === sel.selectedIndex);
      });
    };
    sel._syncCustomUI = syncUI;

    Array.from(sel.options).forEach((opt, idx) => {
      const item = document.createElement('div');
      item.className = 'csel-opt' + (idx === sel.selectedIndex ? ' selected' : '');
      item.textContent = opt.textContent;
      item.onclick = (e) => {
        e.stopPropagation();
        sel.selectedIndex = idx;
        sel.value = opt.value;
        syncUI();
        wrap.classList.remove('open');
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      };
      menu.appendChild(item);
    });

    syncUI();

    trigger.onclick = (e) => {
      e.stopPropagation();
      const isOpen = wrap.classList.contains('open');
      document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));
      if (!isOpen) wrap.classList.add('open');
    };

    wrap.appendChild(trigger);
    wrap.appendChild(menu);
    sel.insertAdjacentElement('afterend', wrap);
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));
});

function loadLesson(lessonId) {
  const mainEl = $('app-content');
  const tpl = $('tpl-buoi-' + lessonId);

  if (tpl) {
    mainEl.innerHTML = tpl.innerHTML;
    if (lessonId === '3') {
      renderBoolSim();
    } else if (lessonId === '4') {
      renderCryptoSim();
    }
  }

  upgradeCustomSelects(document);
  buildTOC();
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([mainEl]);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.loadLesson = loadLesson;

/* Khởi chạy ứng dụng & cài đặt đóng/mở menu góc trái */
(function initApp() {
  const btn = $('mb'), nav = $('mn');
  const setOpen = open => {
    nav.hidden = !open;
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu chọn bài và mục lục');
  };
  btn.onclick = () => setOpen(nav.hidden);
  nav.onclick = e => {
    if (e.target.closest('a')) setOpen(false);
  };
  document.addEventListener('click', e => {
    if (!nav.hidden && !nav.contains(e.target) && !btn.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !nav.hidden) {
      setOpen(false);
      btn.focus();
    }
  });

  // Mặc định mở Bài 6 (Chuyên sâu Lý thuyết số & RSA) để em học ngay phần quan trọng nhất,
  // đồng thời có thể chuyển qua Bài 1-4 và Bài 5 bất cứ lúc nào từ Menu góc trái!
  $('lesson-select').value = '4';
  loadLesson('4');
})();
</script>
