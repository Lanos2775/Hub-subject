    <div class="box why"><b>Học phần này để làm gì?</b> Đây là trường hợp dễ nhất, cho ta dạng sóng $e^{jkx}$ và công thức $E(k)$. Về sau, giản đồ $E$-$k$ của Buổi 4 chính là mở rộng của công thức này.</div>

    <p>Ở Buổi 2, chúng ta đã làm quen với <b>Phương trình sóng Schrödinger không phụ thuộc thời gian</b>:
      $$\frac{d^2\psi(x)}{dx^2} + \frac{2m}{\hbar^2}\big[E - V(x)\big]\psi(x) = 0$$
      Bây giờ, chúng ta sẽ giải phương trình này từ trường hợp dễ nhất đến các trường hợp thú vị nhất trong linh kiện bán dẫn. Trường hợp đầu tiên là <b>Electron chuyển động trong không gian tự do (Free Space)</b> — tức là nơi không có bất kỳ lực hút hay lực đẩy nào tác dụng lên nó, nên thế năng ở mọi nơi bằng không: $V(x) = 0$.
    </p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Chiếc xe chạy trên mặt băng phẳng lặng vô tận</b><br>
      Hãy tưởng tượng một người trượt băng trên mặt hồ đóng băng phẳng lặng, không có ma sát và không có bất kỳ bức tường chắn nào ($V(x)=0$). Người đó có thể trượt đi mãi mãi theo chiều dương ($+x$) hoặc chiều âm ($-x$) với <b>bất kỳ vận tốc và mức năng lượng $E$ nào</b> mà không bị giới hạn. Trong cơ học lượng tử, chuyển động tự do không bị cản trở đó được biểu diễn bằng một <b>Sóng phẳng chạy (Traveling Plane Wave)</b>.
    </div>

    <h3>1.1. Nghiệm Sóng phẳng, Số sóng $k$ và Vận tốc pha $v_p$</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 150" role="img"><defs><marker id="fz" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><path d="M20,75 q30,-45 60,0 t60,0 t60,0 t60,0 t60,0" style="fill:none;fill-opacity:1;stroke:var(--c5);stroke-width:3"/><line x1="20" y1="122" x2="140" y2="122" style="stroke:var(--c5);stroke-width:2" marker-end="url(#fz)"/><text x="80" y="142" text-anchor="middle" style="fill:var(--c5);font-size:13px;font-weight:700">λ = 2π/k</text><line x1="250" y1="26" x2="390" y2="26" style="stroke:var(--c2);stroke-width:3" marker-end="url(#fz)"/><text x="320" y="18" text-anchor="middle" style="fill:var(--c2);font-size:13px;font-weight:700">v_p = ω/k</text><text x="320" y="138" text-anchor="middle" style="fill:var(--mut);font-size:12.5px;font-weight:400">e^(jkx): sóng chạy sang phải</text></svg></figure>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Muốn giải Schrödinger cho các môi trường phức tạp, ta bắt đầu từ trường hợp không có lực nào ($V=0$).</li><li><b>Dùng để làm gì:</b> Biết hạt tự do là <b>sóng phẳng</b> với số sóng $k$ và năng lượng $E=\hbar^2k^2/2m$ (liên tục).</li><li><b>Liên hệ với phần khác:</b> Ở Buổi 4, trục $k$ này trở thành trục ngang của giản đồ $E$-$k$.</li></ul></div>

    <p>Khi thay $V(x) = 0$ vào phương trình Schrödinger, ta được phương trình dao động điều hòa quen thuộc:</p>
    <div class="f">
      $$\frac{d^2\psi(x)}{dx^2} + k^2\psi(x) = 0 \qquad \text{với } \mathbf{k = \frac{\sqrt{2mE}}{\hbar}} \text{ gọi là Số sóng (Wave number)}$$
    </div>
    <div class="box legend"><b>Đọc phương trình và nghiệm</b><ul><li>$\psi(x)$: hàm sóng cần tìm; $\dfrac{d^2\psi}{dx^2}$: độ cong của sóng.</li><li>$k=\dfrac{\sqrt{2mE}}{\hbar}$: <b>số sóng</b>, cho biết sóng dao động nhanh hay chậm theo $x$ (liên hệ $\lambda=2\pi/k$).</li><li>$m$: khối lượng; $E$: năng lượng; $\hbar$: hằng số Planck rút gọn.</li></ul></div>

    <p>Khi ghép thêm phần thời gian $e^{-j\omega t}$, nghiệm tổng quát của hạt tự do là sự chồng chập của hai sóng phẳng chạy ngược chiều nhau:</p>
    <div class="f">
      $$\Psi(x,t) = A\,e^{j(kx - \omega t)} + B\,e^{-j(kx + \omega t)}$$
      <small>Trong đó: Số hạng $A\,e^{j(kx - \omega t)}$ là sóng truyền theo chiều $+x$ (khi $k>0$); số hạng $B\,e^{-j(kx + \omega t)}$ (hoặc khi $k < 0$) là sóng truyền ngược lại theo chiều $-x$.</small>
    </div>
    <div class="box legend"><b>Đọc nghiệm tổng quát</b><ul><li>$A,B$: biên độ của sóng đi về $+x$ và sóng đi về $-x$.</li><li>$kx-\omega t$: <b>pha</b> của sóng; đỉnh sóng dịch chuyển khi pha không đổi.</li><li>Hai số hạng chạy ngược chiều nhau vì dấu của $k$ ngược nhau.</li></ul></div>


    <ul>
      <li><b>Liên hệ giữa Số sóng $k$, Bước sóng $\lambda$ và Động lượng $p$:</b> Từ công thức de Broglie $\lambda = \frac{h}{p}$ và $E = \frac{p^2}{2m} = \frac{\hbar^2 k^2}{2m}$, ta rút ra cặp công thức cực kỳ quan trọng:
        $$\mathbf{p = \hbar k} \qquad \text{và} \qquad \mathbf{\lambda = \frac{2\pi}{|k|}}$$
      </li>
      <li><b>Vận tốc pha (Phase Velocity - $v_p$):</b> Là tốc độ di chuyển của một đỉnh sóng (nơi pha sóng $kx - \omega t = \text{const}$):
        $$\mathbf{v_p = \frac{\omega}{|k|}}$$
      </li>
    </ul>

    <h3>1.2. Mô hình tương tác: Sóng phẳng của Electron tự do (Minh họa trực tiếp Câu 1)</h3>

    <div class="bridge"><b>Nối từ Mục 1:</b> Electron tự do có thể có mọi năng lượng. Bây giờ thêm hai bức tường để nhốt nó.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Đây là lý do nguyên tử có các mức năng lượng <i>rời rạc</i>. Giếng thế cũng là hình mẫu đơn giản nhất của một electron bị giam trong nguyên tử hoặc trong lớp bán dẫn mỏng.</div>

    <p>Chuyện gì xảy ra nếu ta không cho electron chạy tự do nữa, mà nhốt nó vào giữa hai bức tường thế năng cao vô tận ($V = \infty$) đặt tại $x = 0$ và $x = a$, còn ở đáy giếng ($0 < x < a$) thì thế năng bằng không ($V = 0$)?</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Dây đàn Guitar bị kẹp chặt ở hai đầu</b><br>
      Khi một sợi dây đàn guitar dài $a$ được cột chặt ở hai đầu ($x=0$ và $x=a$), hai đầu dây bắt buộc phải đứng yên (biên độ $= 0$). Do đó, dây đàn không thể rung với bước sóng tùy ý, mà chiều dài sợi dây $a$ bắt buộc phải chứa đúng một số nguyên lần <b>nửa bước sóng</b> ($a = n\frac{\lambda}{2}$, tức 1 bụng sóng, 2 bụng sóng, 3 bụng sóng...).<br>
      Hạt electron bị nhốt trong giếng thế vô hạn cũng giống hệt sợi dây đàn đó: sóng vật chất của nó bị phản xạ qua lại tạo thành <b>sóng dừng</b> và chỉ được phép tồn tại ở những <b>mức năng lượng rời rạc $E_n$</b>!
    </div>

    <ul>
      <li><b>Ở Vùng I ($x \le 0$) và Vùng III ($x \ge a$):</b> Vì thế năng $V(x) = \infty$, hạt không thể tồn tại ở ngoài giếng nên $\psi(x) = 0$.</li>
      <li><b>Ở Vùng II trong giếng ($0 \le x \le a$):</b> Thế năng $V(x) = 0$, phương trình Schrödinger có nghiệm dạng lượng giác:
        $$\psi(x) = A_1\cos(kx) + A_2\sin(kx) \qquad \text{với } k = \frac{\sqrt{2mE}}{\hbar}$$
      </li>
      <li><b>Áp dụng điều kiện biên liên tục của hàm sóng:</b>
        <ol>
          <li>Tại vách trái $x = 0$: $\psi(0) = 0 \implies A_1\cos(0) + A_2\sin(0) = 0 \implies \mathbf{A_1 = 0}$ (loại bỏ hàm $\cos$).</li>
          <li>Tại vách phải $x = a$: $\psi(a) = 0 \implies A_2\sin(ka) = 0$. Vì $A_2$ không thể bằng $0$ (nếu $A_2=0$ thì không có hạt nào trong giếng!), nên bắt buộc:
            $$\sin(ka) = 0 \implies ka = n\pi \implies \mathbf{k_n = \frac{n\pi}{a}} \quad (n = 1, 2, 3, \dots)$$
          </li>
        </ol>
      </li>
      <li><b>Hàm sóng chuẩn hóa và Mức năng lượng lượng tử hóa $E_n$:</b> Từ điều kiện chuẩn hóa $\int_0^a |\psi_n(x)|^2dx = 1$, ta tìm được $A_2 = \sqrt{\frac{2}{a}}$, và thay $k_n = \frac{n\pi}{a}$ vào $E = \frac{\hbar^2 k^2}{2m}$:
        <div class="f">
          $$\psi_n(x) = \sqrt{\frac{2}{a}}\sin\left(\frac{n\pi x}{a}\right) \qquad \text{và} \qquad \mathbf{E_n = \frac{n^2\pi^2\hbar^2}{2ma^2} = \frac{n^2 h^2}{8ma^2}} \quad (n = 1, 2, 3, \dots)$$
        </div>
      </li>
    </ul>

    
    <div class="box analogy"><b>Ví dụ số nhanh:</b> Với electron, $E_1\approx\dfrac{37.6\text{ eV·Å}^2}{a^2}$. Giếng rộng $a=10\text{ Å}$ cho $E_1\approx0.38\text{ eV}$. Giếng hẹp lại còn $a=5\text{ Å}$ thì $E_1\approx1.5\text{ eV}$, tức tăng $4$ lần (vì $E\propto1/a^2$).</div>
<h3>2.2. Mô hình tương tác: Giếng thế vô hạn — Mức năng lượng $E_n$, Hàm sóng $\psi_n$ & Xác suất $|\psi_n|^2$</h3>

    <div class="bridge"><b>Nối từ Mục 2:</b> Vách giếng bây giờ chỉ cao $V_0$ hữu hạn. Một hạt có $E\lt V_0$ liệu có bị chặn hoàn toàn?</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Xuyên hầm là hiệu ứng có thật trong linh kiện: dòng rò qua lớp oxit mỏng, diode tunnel, bộ nhớ flash. Nó chỉ xảy ra vì hạt là sóng.</div>

    <p>Bây giờ ta xét trường hợp thực tế hơn: bức tường thế năng không cao vô cùng nữa mà chỉ có độ cao hữu hạn $V_0$. Chuyện gì xảy ra khi một hạt electron có tổng năng lượng $E$ nhỏ hơn chiều cao bức tường ($E < V_0$) bay từ trái sang phải đập vào bức tường?</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Ném quả bóng tennis vào bức tường gạch vs. Ánh sáng xuyên qua lớp sương mù</b><br>
      • <b>Theo cơ học cổ điển:</b> Nếu em đá quả bóng có năng lượng $E = 2.8\text{ eV}$ vào bậc thềm cao $V_0 = 3.5\text{ eV}$ ($E < V_0$), quả bóng chắc chắn bật ngược lại $100\%$ ngay tại mép tường ($x=0$), tuyệt đối không bao giờ lún sâu vào trong bê tông dù chỉ $1\text{ mm}$.<br>
      • <b>Theo cơ học lượng tử:</b> Vì electron là một <b>sóng</b>, khi đập vào bậc thế năng hữu hạn $V_0$, hàm sóng không thể đứt gãy đột ngột về $0$ tại $x=0$. Nó sẽ <b>thấm sâu vào bên trong vùng tường một đoạn ngắn theo quy luật hàm mũ suy giảm $e^{-k_2 x}$</b>! Và nếu bức tường đủ mỏng (chỉ dày vài Angstrom), cái đuôi sóng chưa kịp tắt hẳn đã chạm tới mặt bên kia của bức tường và tiếp tục truyền đi — tạo ra hiện tượng <b>Xuyên hầm lượng tử (Quantum Tunneling)</b>!
    </div>

    <ul>
      <li><b>Vùng I ($x \le 0$, nơi $V = 0$):</b> Gồm sóng tới ($A_1$) truyền theo chiều $+x$ và sóng phản xạ ($B_1$) truyền ngược lại theo chiều $-x$:
        $$\psi_1(x) = A_1 e^{jk_1 x} + B_1 e^{-jk_1 x} \qquad \text{với } k_1 = \frac{\sqrt{2mE}}{\hbar}$$
      </li>
      <li><b>Vùng II ($x \ge 0$, bên trong bậc thế nơi $V = V_0 > E$):</b> Phương trình Schrödinger đổi dấu thành $\frac{d^2\psi_2}{dx^2} - k_2^2\psi_2 = 0$, có nghiệm hàm mũ thực:
        $$\psi_2(x) = A_2 e^{-k_2 x} + B_2 e^{+k_2 x} \qquad \text{với } \mathbf{k_2 = \frac{\sqrt{2m(V_0 - E)}}{\hbar}}$$
        Vì khi $x \to +\infty$, hàm sóng $\psi_2(x)$ phải hữu hạn (không được bùng nổ ra vô cùng), nên bắt buộc hệ số của $e^{+k_2 x}$ phải bằng không ($\mathbf{B_2 = 0}$). Vậy hàm sóng và mật độ xác suất trong vùng biên $x \ge 0$ suy giảm theo hàm mũ:
        <div class="f">
          $$\psi_2(x) = A_2 e^{-k_2 x} \implies \mathbf{|\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}} \implies \mathbf{\frac{|\psi_2(x)|^2}{|\psi_2(0)|^2} = e^{-2k_2 x}}$$
        </div>
      </li>
    </ul>

    <p>Nếu bức tường thế năng $V_0$ chỉ dày một đoạn hữu hạn từ $x = 0$ đến $x = a$ (còn phía bên kia bức tường $x > a$, thế năng lại trở về $V = 0$), thì tại mép phải $x = a$, biên độ hàm sóng vẫn còn khác không! Sóng thoát sang Vùng III ($x > a$) trở lại dạng sóng phẳng truyền đi: $\psi_3(x) = A_3 e^{jk_1 x}$ (không có sóng phản xạ $B_3 e^{-jk_1 x}$ trong Vùng III vì hạt đã vượt qua rào đi ra xa vô tận không có gì chắn để bật ngược lại).</p>
    <p>Khi $E \ll V_0$ (hoặc tích $k_2 a$ đủ lớn), <b>Hệ số truyền qua hay Xác suất xuyên hầm $T$ (Tunneling probability)</b> được tính bằng công thức xấp xỉ chuẩn:</p>
    <div class="f">
      $$\mathbf{T \approx 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)e^{-2k_2 a}} \qquad \text{với } k_2 = \frac{\sqrt{2m^*(V_0 - E)}}{\hbar}$$
    </div>
    <div class="box legend"><b>Đọc công thức xuyên hầm</b><ul><li>$16\dfrac{E}{V_0}\left(1-\dfrac{E}{V_0}\right)$: hệ số cỡ đơn vị, phụ thuộc hạt có năng lượng gần đỉnh rào hay không.</li><li>$e^{-2k_2a}$: <b>nhân tử quyết định</b>. $a$ (độ dày) và $k_2$ (rào cao, hạt nặng) càng lớn thì $T$ giảm càng mạnh.</li><li>$k_2=\dfrac{\sqrt{2m^*(V_0-E)}}{\hbar}$ với $m^*$: khối lượng hiệu dụng của electron trong bán dẫn (Buổi 4).</li></ul></div>


    <h3>3.4. Mô hình tương tác: Xuyên hầm Lượng tử trong GaAs vs. Silicon (Minh họa Câu 4 & Câu 5)</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Cách dùng mô hình:</b> Tab 4a (GaAs, $m^*$ nhỏ) và tab 4b (Si, $m^*$ lớn): cùng một rào nhưng xác suất xuyên hầm của GaAs lớn hơn Si hàng triệu lần. Tab thứ 3 là giếng bất đối xứng của Câu 5.</li></ul></div>

    <p>Trong chất bán dẫn, electron di chuyển như thể nó có một khối lượng mới gọi là <b>Khối lượng hiệu dụng $m^*$ (Effective mass)</b>. Em hãy bấm chuyển đổi giữa 3 tab dưới đây để xem: (1) Vì sao electron trong $\text{GaAs}$ ($m^*=0.067m_0$, rất nhẹ) xuyên hầm mạnh gấp hàng tỷ lần electron trong $\text{Si}$ ($m^*=1.08m_0$, nặng hơn 16 lần) ở <b>Câu 4</b>, và (2) Sơ đồ 3 vùng của giếng thế bất đối xứng ở <b>Câu 5</b>:</p>

    <div class="box key"><b>Mục 3 — Nhớ</b><ul><li>Khi $E\lt V_0$, hàm sóng <b>không bằng $0$</b> trong vách mà <b>giảm theo hàm mũ</b>: $\psi\propto e^{-k_2x}$, với $k_2=\dfrac{\sqrt{2m(V_0-E)}}{\hbar}$. Mật độ xác suất giảm như $e^{-2k_2x}$.</li><li>Xuyên hầm qua rào dày $a$: $T\approx16\dfrac{E}{V_0}\left(1-\dfrac{E}{V_0}\right)e^{-2k_2a}$.</li><li>Rào <b>dày hơn</b> hoặc <b>cao hơn</b> thì $T$ giảm <b>cực nhanh</b> vì nằm trong số mũ.</li></ul></div>

  <section>
    <h2>4. Mở Rộng Cho Nguyên Tử 1-Electron (Hydro), Các Số Lượng Tử & Bảng Tuần Hoàn</h2>
    <div class="bridge"><b>Nối từ Mục 3:</b> Thay vì tường nhân tạo, bây giờ electron bị giữ bởi lực hút của hạt nhân.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Giải thích vì sao Si có đúng 4 electron hóa trị (Buổi 1) và từ đó vì sao các mức rời rạc của từng nguyên tử sẽ tách thành dải ở Buổi 4.</div>

    <p>Trong nguyên tử Hydro, 1 hạt electron (điện tích $-e$) chuyển động trong không gian 3 chiều xung quanh 1 hạt nhân proton đứng yên (điện tích $+e$) dưới tác dụng của thế năng hút tĩnh điện Coulomb:</p>
    <div class="f">
      $$V(r) = -\frac{e^2}{4\pi\epsilon_0 r}$$
      <small>Trong đó: $r$ là khoảng cách từ electron đến hạt nhân; $\epsilon_0 = 8.85 \times 10^{-12}\text{ F/m}$ là hằng số điện môi của chân không.</small>
    </div>
    <div class="box legend"><b>Đọc thế năng Coulomb</b><ul><li>$e$: điện tích electron; $r$: khoảng cách tới hạt nhân.</li><li>$\epsilon_0=8.85\times10^{-12}\text{ F/m}$: hằng số điện môi chân không.</li><li>Dấu trừ nghĩa là lực hút: càng gần hạt nhân thì thế năng càng thấp.</li></ul></div>

<h3>4.1. Bốn số lượng tử đến từ đâu? Từ phương trình Schrödinger 3 chiều</h3>
<div class="bridge"><b>Nối từ Mục 2–3:</b> ở giếng thế 1 chiều, em chỉ cần <b>một</b> số nguyên $n$ để đánh số các trạng thái. Nguyên tử thật có 3 chiều nên cần nhiều số hơn. Mục này trả lời: <i>mỗi số lượng tử sinh ra từ đâu, và vì sao chúng chỉ nhận giá trị nguyên?</i></div>


<p><b>Ý tưởng cốt lõi.</b> Phương trình Schrödinger về mặt toán học có nghiệm với <i>mọi</i> giá trị năng lượng. Nhưng chỉ những nghiệm <b>hợp lệ về vật lý</b> (đơn trị, hữu hạn, chuẩn hóa được) mới được giữ lại. Mỗi điều kiện đó loại bỏ hầu hết các nghiệm và chỉ để lại những giá trị <b>rời rạc</b>. Đúng như giếng thế: sóng phải bằng $0$ ở hai vách nên chỉ còn các sóng dừng ứng với $n=1,2,3,\dots$</p>

ext><text x="226" y="222" text-anchor="start" style="fill:var(--mut);font-size:11px;font-weight:400">Q (hình chiếu của P)</text><text x="256" y="40" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:700">r: 0 → ∞ (xa hạt nhân)</text><text x="256" y="60" text-anchor="start" style="fill:var(--c2);font-size:12px;font-weight:700">θ: 0 → π (lệch trục z)</text><text x="256" y="80" text-anchor="start" style="fill:var(--c3);font-size:12px;font-weight:700">φ: 0 → 2π (quanh trục z)</text></svg><figcaption>Hệ tọa độ cầu: vị trí electron được cho bằng ba số (r, θ, φ) thay vì (x, y, z).</figcaption></figure>
<p><b>Bước 1: chọn hệ tọa độ phù hợp.</b> Thế năng Coulomb chỉ phụ thuộc khoảng cách $r$ (đối xứng cầu), nên ta dùng tọa độ cầu $(r,\theta,\phi)$: $r$ là khoảng cách tới hạt nhân, $\theta$ là góc lệch khỏi trục $z$, $\phi$ là góc quay quanh trục $z$. Ba tọa độ này <i>độc lập</i> nhau, và đó là lý do ta tách được nghiệm thành ba phần.</p>
<p><b>Bước 2: tách biến</b> $\psi(r,\theta,\phi)=R(r)\,\Theta(\theta)\,\Phi(\phi)$. Phương trình Schrödinger 3 chiều tách thành <b>ba phương trình thường</b>, mỗi phương trình chỉ chứa một biến:</p>

<div class="f">
  $$\frac{d^2\Phi}{d\phi^2}=-m^2\,\Phi$$
  $$\frac{1}{\sin\theta}\frac{d}{d\theta}\!\left(\sin\theta\,\frac{d\Theta}{d\theta}\right)+\left[l(l+1)-\frac{m^2}{\sin^2\theta}\right]\Theta=0$$
  $$-\frac{\hbar^2}{2m_0 r^2}\frac{d}{dr}\!\left(r^2\frac{dR}{dr}\right)+\left[\frac{\hbar^2\,l(l+1)}{2m_0 r^2}+V(r)\right]R=E\,R$$
  <small>Từ trên xuống: phương trình của $\Phi(\phi)$, của $\Theta(\theta)$ và của $R(r)$. Các số $m^2$ và $l(l+1)$ là <b>hằng số tách biến</b>.</small>
</div>
<div class="box legend"><b>Đọc ba phương trình</b><ul>
<li><b>Hằng số tách biến $m^2$:</b> xuất hiện ở phương trình $\Phi$ và được “chuyền” sang phương trình $\Theta$. Vì vậy $m$ và $l$ ràng buộc lẫn nhau.</li>
<li><b>Hằng số tách biến $l(l+1)$:</b> xuất hiện ở phương trình $\Theta$ và được chuyền tiếp sang phương trình $R$. Vì vậy $l$ và $n$ ràng buộc lẫn nhau.</li>
<li><b>Số hạng $\dfrac{\hbar^2 l(l+1)}{2m_0r^2}$ trong phương trình $R$:</b> gọi là <b>thế năng li tâm</b>. Electron quay càng mạnh (l lớn) thì càng bị “đẩy ra xa” hạt nhân, nên orbital $l$ lớn thì có ít xác suất ở gần tâm.</li>
<li>$V(r)=-\dfrac{e^2}{4\pi\epsilon_0 r}$ chỉ xuất hiện ở phương trình $R$, vì chỉ có $r$ mới có lực.</li></ul></div>

<p><b>Bước 3: áp điều kiện hợp lệ cho từng phương trình.</b> Đây là bước sinh ra số lượng tử, nên em hãy đọc kỹ bảng dưới đây:</p>
<div class="tw"><table>
<tr><th>Phương trình</th><th>Điều kiện vật lý</th><th>Kết quả</th><th>Số lượng tử</th></tr>
<tr><td>$\Phi(\phi)$<br>nghiệm $e^{jm\phi}$</td><td>Quay đủ một vòng $2\pi$ phải về đúng chỗ cũ, tức là hàm đơn trị: $\Phi(\phi+2\pi)=\Phi(\phi)$.</td><td>$e^{jm2\pi}=1$ nên $m$ là <b>số nguyên</b>: $0,\pm1,\pm2,\dots$</td><td><span class="k b3">$m$</span></td></tr>
<tr><td>$\Theta(\theta)$<br>(hàm Legendre liên hợp)</td><td>Hàm phải hữu hạn ở hai cực $\theta=0$ và $\theta=\pi$ (không thể có xác suất vô hạn).</td><td>$l$ phải là <b>số nguyên không âm</b> và $l\ge|m|$, tức $|m|\le l$.</td><td><span class="k b2">$l$</span></td></tr>
<tr><td>$R(r)$<br>(đa thức Laguerre)</td><td>$R\to0$ khi $r\to\infty$ (electron bị trói, $E<0$) và chuẩn hóa được.</td><td>Chỉ có nghiệm khi $E=E_n=-\dfrac{13.6}{n^2}\text{ eV}$ với $n$ <b>nguyên</b>, $n\ge l+1$.</td><td><span class="k b1">$n$</span></td></tr>
<tr><td>Spin</td><td><b>Không xuất hiện</b> trong phương trình trên (không có biến nào của spin).</td><td>Phải thêm vào từ thực nghiệm (Stern–Gerlach, xem 4.5) và từ lý thuyết tương đối (Dirac).</td><td><span class="k b4">$s$</span></td></tr>
</table></div>

t-weight:700">Θ(θ)</text><text x="240" y="150" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">cần: hữu hạn ở</text><text x="240" y="166" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">θ = 0 và θ = π</text><line x1="240" y1="176" x2="240" y2="192" style="stroke:var(--c2);stroke-width:2" marker-end="url(#fu)"/><text x="240" y="214" text-anchor="middle" style="fill:var(--c2);font-size:14px;font-weight:700">l = 0, 1, …, n−1</text><text x="240" y="236" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">l ≥ |m|</text><line x1="400" y1="72" x2="400" y2="100" style="stroke:var(--mut);stroke-width:2" marker-end="url(#fu)"/><rect x="328" y="100" width="144" height="158" rx="8" style="fill:var(--card);stroke:var(--c3);stroke-width:2.5"/><text x="400" y="126" text-anchor="middle" style="fill:var(--c3);font-size:17px;font-weight:700">Φ(φ)</text><text x="400" y="150" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">cần: tuần hoàn</text><text x="400" y="166" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">Φ(φ + 2π) = Φ(φ)</text><line x1="400" y1="176" x2="400" y2="192" style="stroke:var(--c3);stroke-width:2" marker-end="url(#fu)"/><text x="400" y="214" text-anchor="middle" style="fill:var(--c3);font-size:14px;font-weight:700">m = 0, ±1, ±2, …</text><text x="400" y="236" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">|m| ≤ l</text><line x1="560" y1="72" x2="560" y2="100" style="stroke:var(--mut);stroke-width:2" marker-end="url(#fu)"/><rect x="488" y="100" width="144" height="158" rx="8" style="fill:var(--card);stroke:var(--c4);stroke-width:2.5"/><text x="560" y="126" text-anchor="middle" style="fill:var(--c4);font-size:17px;font-weight:700">Spin</text><text x="560" y="150" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">KHÔNG nằm trong PT</text><text x="560" y="166" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">Schrödinger (thí nghiệm)</text><line x1="560" y1="176" x2="560" y2="192" style="stroke:var(--c4);stroke-width:2" marker-end="url(#fu)"/><text x="560" y="214" text-anchor="middle" style="fill:var(--c4);font-size:14px;font-weight:700">s = +½ hoặc −½</text><text x="560" y="236" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">2 giá trị</text><text x="320" y="278" text-anchor="middle" style="fill:var(--c5);font-size:13px;font-weight:700">Ràng buộc dây chuyền: m bị chặn bởi l, l bị chặn bởi n</text></svg></figure>
<div class="box key"><b>4.1 — Nhớ</b><ul>
<li>Số lượng tử là <b>điều kiện biên</b> của nghiệm: $m$ từ điều kiện tuần hoạn, $l$ từ điều kiện hữu hạn ở hai cực, $n$ từ điều kiện bị trói ở xa vô cùng.</li>
<li>Chuỗi ràng buộc để suy lại nhanh: $\boxed{\,n\ge1,\quad 0\le l\le n-1,\quad -l\le m\le l,\quad s=\pm\tfrac12\,}$</li>
<li>Spin là số lượng tử thứ tư, <b>không</b> sinh ra từ phương trình Schrödinger ở trên.</li></ul></div>

<h3>4.2. Số lượng tử chính $n$: mức năng lượng và “kích thước” của lớp vỏ</h3>
<div class="bridge"><b>Nối từ 4.1:</b> $n$ đến từ phương trình $R(r)$, tức là từ phần <i>khoảng cách tới hạt nhân</i>. Vì vậy $n$ quyết định điều liên quan nhất đến $r$: năng lượng và độ lớn của nguyên tử.</div>
        <figure class="fig fr"><svg viewBox="0 0 420 188" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="40" y1="30" x2="300" y2="30" style="stroke:var(--mut);stroke-width:1.5" stroke-dasharray="4 4"/><text x="262" y="20" text-anchor="start" style="fill:var(--mut);font-size:12px;font-weight:400">E = 0 (tự do)</text><line x1="60" y1="170.0" x2="240" y2="170.0" style="stroke:var(--c1);stroke-width:3"/><text x="52" y="174.0" text-anchor="end" style="fill:var(--ink);font-size:12px;font-weight:400">n=1</text><text x="248" y="174.0" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:400">-13.60 eV</text><line x1="60" y1="65.0" x2="240" y2="65.0" style="stroke:var(--c1);stroke-width:3"/><text x="52" y="69.0" text-anchor="end" style="fill:var(--ink);font-size:12px;font-weight:400">n=2</text><text x="248" y="69.0" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:400">-3.40 eV</text><line x1="60" y1="45.55555555555556" x2="240" y2="45.55555555555556" style="stroke:var(--c1);stroke-width:3"/><text x="52" y="56.55555555555556" text-anchor="end" style="fill:var(--ink);font-size:12px;font-weight:400">n=3</text><text x="248" y="56.55555555555556" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:400">-1.51 eV</text><line x1="60" y1="38.75" x2="240" y2="38.75" style="stroke:var(--c1);stroke-width:3"/><text x="52" y="36.75" text-anchor="end" style="fill:var(--ink);font-size:12px;font-weight:400">n=4</text><text x="248" y="36.75" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:400">-0.85 eV</text><line x1="350" y1="60" x2="350" y2="166" style="stroke:var(--c4);stroke-width:2.5" marker-end="url(#fa)"/><text x="358" y="120" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:400">photon</text></svg><figcaption>Mức năng lượng hydro E = −13.6/n² eV: càng lên cao, các mức càng sát nhau.</figcaption></figure>
<p><b>Tác dụng 1: quyết định năng lượng.</b> Với nguyên tử hydro, năng lượng chỉ phụ thuộc $n$:</p>
<div class="f">$$E_n=-\frac{m_0e^4}{(4\pi\epsilon_0)^2\,2\hbar^2\,n^2}\approx-\frac{13.6}{n^2}\ \text{eV}$$<small>$E<0$ nghĩa là electron đang bị trói. $E=0$ là electron vừa thoát ra xa vô cùng. Các mức: $-13.6;\ -3.40;\ -1.51;\ -0.85\ \text{eV}\dots$ và càng lên cao các mức càng sát nhau.</small></div>
<p><b>Tác dụng 2: quyết định độ lớn.</b> Bán kính của lớp vỏ cỡ $r_n\approx n^2a_0$, với $a_0\approx0.529\ \text{Å}$ là bán kính Bohr. Lớp $n=2$ to gấp khoảng $4$ lần lớp $n=1$, lớp $n=3$ to gấp khoảng $9$ lần. Quan sát hình dưới: các ô $1s\to4s$ to dần.</p>
<p><b>Tác dụng 3: quyết định bước nhảy khi hấp thụ/phát photon.</b> Electron chuyển từ mức $n_1$ lên $n_2$ khi hấp thụ photon có năng lượng đúng bằng hiệu hai mức: $h\nu=13.6\left(\dfrac1{n_1^2}-\dfrac1{n_2^2}\right)\text{ eV}$. Ví dụ $n=1\to2$ cần $13.6\cdot\frac34=10.2\ \text{eV}$ (bước sóng $\lambda\approx1240/10.2\approx122\ \text{nm}$). Đây là cùng ý tưởng “photon phải đủ năng lượng” của Buổi 2, và sau này sẽ thành vùng cấm $E_g$ ở Buổi 4.</p>
<p><b>Tác dụng 4: quyết định số vòng tối trong mây electron.</b> Mây electron có <b>$n-l-1$</b> mặt cầu tại đó xác suất bằng $0$ (gọi là <i>nút xuyên tâm</i>). Với $l=0$: $1s$ không có nút, $2s$ có 1, $3s$ có 2, $4s$ có 3.</p>

<div class="box key"><b>4.2 — Nhớ</b><ul><li>$n=1,2,3,\dots$ quyết định <b>năng lượng</b> $E_n=-13.6/n^2$ eV và <b>kích thước</b> cỡ $n^2a_0$.</li><li>Số nút xuyên tâm (vòng tối hình cầu) $=n-l-1$.</li><li>Ở hydro, các orbital cùng $n$ có <b>cùng năng lượng</b> (suy biến). Ở nguyên tử nhiều electron, mức $s,p,d$ của cùng một $n$ tách ra, ví dụ $3s \lt 3p \lt 3d$.</li></ul></div>

<h3>4.3. Số lượng tử quỹ đạo $l$: hình dạng orbital và moment động lượng</h3>
<div class="bridge"><b>Nối từ 4.2:</b> cùng một $n$ có thể có nhiều “kiểu” mây khác nhau. Sự khác nhau đó do $l$ quyết định. $l$ đến từ phương trình $\Theta(\theta)$ (phần <i>góc lệch</i>), nên nó mô tả mây electron <b>không đối xứng cầu</b> đến mức nào.</div>
<p><b>Tác dụng 1: độ lớn moment động lượng quỹ đạo</b> (electron “quay quanh” hạt nhân mạnh đến đâu):</p>
<div class="f">$$|\vec L|=\sqrt{l(l+1)}\;\hbar$$<small>$\hbar=1.055\times10^{-34}\ \text{J·s}$. Chú ý: độ lớn là $\sqrt{l(l+1)}\hbar$ chứ <b>không</b> phải $l\hbar$. Ví dụ $l=1$ thì $|L|=\sqrt2\hbar\approx1.41\hbar$; $l=2$ thì $|L|=\sqrt6\hbar\approx2.45\hbar$.</small></div>
<p><b>Tác dụng 2: quyết định hình dạng mây.</b> Số $l$ chính là <b>số mặt nút góc</b> (mặt phẳng hoặc mặt nón đi qua hạt nhân mà xác suất bằng $0$). Vì có $l$ mặt nút nên mây bị chia thành các thùy:</p>
<div class="tw"><table>
<tr><th>$l$</th><th>Tên</th><th>Số mặt nút góc</th><th>Hình dạng</th><th>Số giá trị $m$</th></tr>
<tr><td>0</td><td><b>s</b> (sharp)</td><td>0</td><td>Cầu, đối xứng mọi hướng</td><td>1</td></tr>
<tr><td>1</td><td><b>p</b> (principal)</td><td>1</td><td>Quả tạ đôi: 2 thùy</td><td>3</td></tr>
<tr><td>2</td><td><b>d</b> (diffuse)</td><td>2</td><td>Chủ yếu 4 thùy (kèm một vòng hoặc thùy dọc trục)</td><td>5</td></tr>
<tr><td>3</td><td><b>f</b> (fundamental)</td><td>3</td><td>Phức tạp hơn, 6 đến 8 thùy</td><td>7</td></tr>
</table></div>
<figure class="fig wide"><svg viewBox="0 0 640 188" role="img"><defs><marker id="fu" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0L11,5.5L0,11z" style="fill:var(--mut)"/></marker><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><use href="#o400" x="30.0" y="10" width="130" height="130"/><rect x="30.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="95.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">4s  l = 0</text><text x="95.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">góc 0 · xuyên tâm 3</text><use href="#o410" x="180.0" y="10" width="130" height="130"/><rect x="180.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="245.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">4p  l = 1</text><text x="245.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">góc 1 · xuyên tâm 2</text><use href="#o420" x="330.0" y="10" width="130" height="130"/><rect x="330.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="395.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">4d  l = 2</text><text x="395.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">góc 2 · xuyên tâm 1</text><use href="#o430" x="480.0" y="10" width="130" height="130"/><rect x="480.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="545.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">4f  l = 3</text><text x="545.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">góc 3 · xuyên tâm 0</text></svg><figcaption>Cùng n = 4, m = 0, tăng l: số mặt nút góc tăng 0, 1, 2, 3 và hình dạng đổi từ cầu → quả tạ → bốn thùy → sáu thùy.</figcaption></figure>
<p><b>Tác dụng 3: quyết định thứ tự điền electron.</b> Ở nguyên tử nhiều electron, orbital có $l$ nhỏ ở gần hạt nhân hơn nên có năng lượng thấp hơn: $ns \lt np \lt nd$. Vì vậy Si điền $3s^2$ rồi mới đến $3p^2$.</p>
<div class="box why"><b>Liên hệ với bán dẫn.</b> Si dùng $3s$ (hình cầu) và $3p$ (ba quả tạ vuông góc nhau) trộn lại thành <b>4 orbital lai $sp^3$</b> hướng về 4 đỉnh của hình tứ diện. Đó chính là lý do mạng kim cương ở Buổi 1 có mỗi nguyên tử nối với 4 hàng xóm theo hướng tứ diện.</div>
<div class="box key"><b>4.3 — Nhớ</b><ul><li>$l=0,1,\dots,n-1$ ứng với $s,p,d,f,\dots$</li><li>$|L|=\sqrt{l(l+1)}\hbar$; $l$ = số mặt nút góc; số thùy tăng theo $l$.</li><li>Số nút xuyên tâm $n-l-1$ và số nút góc $l$ cộng lại được tổng $n-1$ nút.</li></ul></div>

<h3>4.4. Số lượng tử từ $m$: hướng của orbital trong không gian</h3>
<div class="bridge"><b>Nối từ 4.3:</b> $l$ cho biết mây có hình gì, còn $m$ cho biết <i>hình đó quay về hướng nào</i> so với trục $z$. $m$ đến từ phương trình $\Phi(\phi)$ (góc quay quanh trục $z$).</div>
<p><b>Tác dụng 1: hình chiếu của moment động lượng lên trục $z$.</b></p>
<div class="f">$$L_z=m\,\hbar,\qquad m=-l,\,-l+1,\dots,0,\dots,l-1,\,l$$<small>Có tất cả $2l+1$ giá trị. Ví dụ $l=1$ có $m=-1,0,+1$ (ba orbital $p$); $l=2$ có 5 giá trị (năm orbital $d$).</small></div>

ar(--c3);stroke-width:3" marker-end="url(#fu)"/><text x="232" y="165" text-anchor="start" style="fill:var(--ink);font-size:12px;font-weight:700">m = -1  →  L_z = -1ħ</text><line x1="120" y1="197" x2="170.91168824543144" y2="197" style="stroke:var(--g);stroke-width:1" stroke-dasharray="3 3"/><line x1="120" y1="125" x2="170.91168824543144" y2="197" style="stroke:var(--c3);stroke-width:3" marker-end="url(#fu)"/><text x="232" y="201" text-anchor="start" style="fill:var(--ink);font-size:12px;font-weight:700">m = -2  →  L_z = -2ħ</text><text x="232" y="30" text-anchor="start" style="fill:var(--c2);font-size:13px;font-weight:700">l = 2:  |L| = √6 ħ ≈ 2.45 ħ</text><text x="210" y="246" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">chỉ có 5 hướng cho phép (2l+1); m = +2 ứng với góc ≈ 35° so với z</text></svg><figcaption>Mô hình vectơ cho l = 2: độ dài |L| cố định, nhưng hình chiếu L_z chỉ nhận 5 giá trị nguyên (theo đơn vị ħ).</figcaption></figure>
<p><b>Đọc hình vectơ.</b> Vectơ $\vec L$ có độ dài cố định $\sqrt{l(l+1)}\hbar$ nhưng chỉ được “nghiêng” sao cho hình chiếu lên $z$ là số nguyên lần $\hbar$. Em thấy $L$ <b>không bao giờ</b> nằm hoàn toàn dọc theo $z$: với $l=2$ thì $L_z$ tối đa là $2\hbar$, nhỏ hơn $|L|=2.45\hbar$. Phần còn lại ($L_x,L_y$) không thể bằng $0$ vì nguyên lý bất định (Buổi 2): đã biết chính xác $L_z$ thì không thể biết đồng thời $L_x$, $L_y$.</p>
<p><b>Vì sao gọi là “số lượng tử từ”?</b> Khi không có từ trường, mọi giá trị $m$ có cùng năng lượng và cùng một trục $z$ là tùy chọn. Khi đặt vào từ trường $B$ (chọn trục $z$ theo $B$), electron có moment từ nên năng lượng bị lệch thêm $\Delta E=m\mu_BB$ ($\mu_B\approx9.27\times10^{-24}\ \text{J/T}$ là magneton Bohr). Mức $l$ tách thành $2l+1$ mức: đó là <b>hiệu ứng Zeeman</b>.</p>
<p><b>Tác dụng 2: quyết định hướng và “độ dẹt” của mây.</b> $|m|$ càng lớn thì $L$ càng nằm gần trục $z$, nghĩa là electron quay quanh trục $z$ gần như tròn đều trong mặt phẳng $xy$, nên mây dẹt dần về mặt phẳng xích đạo. Ngược lại $m=0$ thì $L_z=0$ và mây dài dọc theo trục $z$.</p>
<figure class="fig wide"><svg viewBox="0 0 640 188" role="img"><defs><marker id="fu" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0L11,5.5L0,11z" style="fill:var(--mut)"/></marker><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><use href="#o430" x="30.0" y="10" width="130" height="130"/><rect x="30.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="95.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">m = 0</text><text x="95.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">L_z = 0</text><use href="#o431" x="180.0" y="10" width="130" height="130"/><rect x="180.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="245.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">m = ±1</text><text x="245.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">L_z = ±ħ</text><use href="#o432" x="330.0" y="10" width="130" height="130"/><rect x="330.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="395.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">m = ±2</text><text x="395.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">L_z = ±2ħ</text><use href="#o433" x="480.0" y="10" width="130" height="130"/><rect x="480.0" y="10" width="130" height="130" style="fill:none;stroke:var(--g);stroke-width:1"/><text x="545.0" y="158" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">m = ±3</text><text x="545.0" y="176" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">L_z = ±3ħ</text></svg><figcaption>Cùng n = 4, l = 3 (orbital 4f), tăng |m|: mây dẹt dần về mặt phẳng xích đạo (electron quay quanh trục z càng “đúng vòng”).</figcaption></figure>
<div class="box analogy"><b>Vì sao $m$ và $-m$ cho cùng hình dạng?</b> Phần góc quay là $\Phi=e^{jm\phi}$ nên $|\Phi|^2=1$, không phụ thuộc $\phi$. Mật độ xác suất của $+m$ và $-m$ giống hệt nhau và đều <b>tròn xoay quanh trục $z$</b> (hình bánh donut trong không gian 3 chiều). Hai giá trị chỉ khác nhau ở <b>chiều quay</b> (cùng hay ngược chiều kim đồng hồ). Vì vậy các hình vẽ chỉ cần $m\ge0$, và mặt cắt qua trục $z$ của một donut luôn thấy hai thùy.</div>
<div class="box key"><b>4.4 — Nhớ</b><ul><li>$L_z=m\hbar$ với $m=-l,\dots,+l$: có $2l+1$ giá trị = số orbital của mỗi phân lớp.</li><li>$m$ chỉ <b>định hướng</b>, không đổi năng lượng ở hydro (suy biến). Từ trường mới tách các mức $m$ (hiệu ứng Zeeman).</li><li>$|m|\le l$ vì hình chiếu không thể vượt độ dài vectơ.</li></ul></div>

<h3>4.5. Spin: số lượng tử không đến từ Schrödinger</h3>
<div class="bridge"><b>Nối từ 4.4:</b> ba số $(n,l,m)$ chưa đủ để giải thích mọi thí nghiệm. Có một “tính chất nội tại” của electron mà phương trình Schrödinger không hề chứa.</div>
<p><b>Bằng chứng thực nghiệm.</b> Năm 1922 Stern và Gerlach cho chùm nguyên tử bạc bay qua từ trường không đều. Electron ngoài cùng của Ag ở trạng thái $l=0$ nên <b>không có moment quỹ đạo</b> để bị từ trường tác động. Thế mà chùm vẫn tách thành đúng <b>hai</b> chùm (nếu moment từ định hướng ngẫu nhiên thì phải thấy một vệt liên tục). Kết luận: electron có moment động lượng riêng, gọi là <b>spin</b>, và chỉ nhận <b>hai</b> hướng.</p>
<figure class="fig fl"><svg viewBox="0 0 420 204" role="img"><defs><marker id="fu" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0L11,5.5L0,11z" style="fill:var(--mut)"/></marker><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><text x="8" y="14" text-anchor="start" style="fill:var(--mut);font-size:12px;font-weight:700">Thí nghiệm Stern–Gerlach (1922)</text><rect x="8" y="82" width="34" height="36" rx="6" style="fill:var(--tint);stroke:var(--c4);stroke-width:2"/><text x="25" y="104" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">lò</text><text x="25" y="138" text-anchor="middle" style="fill:var(--c4);font-size:11px;font-weight:700">Ag</text><line x1="42" y1="100" x2="205" y2="100" style="stroke:var(--mut);stroke-width:2" /><polygon points="110,26 205,26 205,70 175,84 140,84 110,70" style="fill:var(--c4);fill-opacity:.35;stroke:var(--c4);stroke-width:2"/><polygon points="110,174 205,174 205,130 175,116 140,116 110,130" style="fill:var(--c1);fill-opacity:.35;stroke:var(--c1);stroke-width:2"/><text x="157" y="54" text-anchor="middle" style="fill:var(--c4);font-size:15px;font-weight:700">N</text><text x="157" y="158" text-anchor="middle" style="fill:var(--c1);font-size:15px;font-weight:700">S</text><path d="M205 100 Q 270 100 330 62" style="fill:none;stroke:var(--c1);stroke-width:2.5" marker-end="url(#fu)"/><path d="M205 100 Q 270 100 330 138" style="fill:none;stroke:var(--c4);stroke-width:2.5" marker-end="url(#fu)"/><rect x="334" y="30" width="8" height="140" rx="2" style="fill:var(--tint);stroke:var(--mut);stroke-width:1.5"/><circle cx="338" cy="62" r="6" style="fill:var(--c1)"/><circle cx="338" cy="138" r="6" style="fill:var(--c4)"/><rect x="348" y="40" width="10" height="120" style="fill:var(--c3);fill-opacity:.3;stroke:var(--c3);stroke-dasharray:3 3"/><text x="352" y="178" text-anchor="middle" style="fill:var(--c3);font-size:10.5px;font-weight:700">vệt cổ điển</text><text x="282" y="50" text-anchor="middle" style="fill:var(--c1);font-size:12px;font-weight:700">s = +½</text><text x="282" y="158" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">s = −½</text><text x="210" y="198" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">chỉ ra 2 vết, không phải 1 dải liên tục</text></svg><figcaption>Chùm nguyên tử Ag (electron ngoài cùng có l = 0) bị từ trường không đều tách đúng thành hai chùm.</figcaption></figure>
<p><b>Các giá trị.</b> Spin của electron là $s=\tfrac12$ (nhiều sách ký hiệu số lượng tử từ-spin là $m_s$; trong bài này ta viết gọn $s=\pm\tfrac12$ cho hình chiếu). Độ lớn và hình chiếu:</p>
<div class="f">$$|\vec S|=\sqrt{s(s+1)}\,\hbar=\frac{\sqrt3}{2}\hbar,\qquad S_z=\pm\frac{\hbar}{2}$$<small>Hai trạng thái $S_z=+\hbar/2$ ($\uparrow$) và $S_z=-\hbar/2$ ($\downarrow$). Số hướng $=2s+1=2$.</small></div>
<figure class="fig fr"><svg viewBox="0 0 420 196" role="img"><defs><marker id="fu" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0L11,5.5L0,11z" style="fill:var(--mut)"/></marker><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="110" y1="175" x2="110" y2="18" style="stroke:var(--ink);stroke-width:2" marker-end="url(#fu)"/><text x="118" y="14" text-anchor="start" style="fill:var(--ink);font-size:13px;font-weight:700">z</text><circle cx="110" cy="95" r="52" style="fill:none;stroke:var(--g);stroke-width:1.5;stroke-dasharray:5 4"/><line x1="110" y1="95" x2="152.4" y2="65" style="stroke:var(--c4);stroke-width:3.5" marker-end="url(#fu)"/><line x1="110" y1="95" x2="152.4" y2="125" style="stroke:var(--c1);stroke-width:3.5" marker-end="url(#fu)"/><line x1="110" y1="65" x2="152" y2="65" style="stroke:var(--g);stroke-width:1" stroke-dasharray="3 3"/><line x1="110" y1="125" x2="152" y2="125" style="stroke:var(--g);stroke-width:1" stroke-dasharray="3 3"/><text x="212" y="40" text-anchor="start" style="fill:var(--c5);font-size:13px;font-weight:700">|S| = (√3/2) ħ ≈ 0.87 ħ</text><text x="212" y="70" text-anchor="start" style="fill:var(--c4);font-size:12.5px;font-weight:700">s = +½ (↑):  S_z = +ħ/2</text><text x="212" y="130" text-anchor="start" style="fill:var(--c1);font-size:12.5px;font-weight:700">s = −½ (↓):  S_z = −ħ/2</text><text x="210" y="188" text-anchor="middle" style="fill:var(--mut);font-size:11.5px;font-weight:400">không phải quả cầu quay thật, chỉ có 2 hướng</text></svg><figcaption>Mô hình vectơ của spin: giống l nhưng chỉ có 2 hướng (2s + 1 = 2).</figcaption></figure>
<p><b>Lưu ý.</b> Đừng hình dung electron là quả cầu nhỏ tự quay thật. Nếu tính như vậy thì bề mặt phải quay nhanh hơn ánh sáng. Spin là tính chất lượng tử nội tại, giống điện tích hay khối lượng.</p>
<p><b>Tác dụng:</b> vì spin có hai hướng nên <b>mỗi orbital $(n,l,m)$ chứa tối đa 2 electron</b> (spin ngược nhau). Đây là cơ sở của nguyên lý Pauli ở 4.6, và khi đếm số trạng thái ở các buổi sau em phải nhớ nhân thêm hệ số 2 này.</p>
<div class="box key"><b>4.5 — Nhớ</b><ul><li>$s=\pm\tfrac12$: spin không sinh ra từ phương trình Schrödinger mà từ thực nghiệm.</li><li>Mỗi orbital $(n,l,m)$ chứa <b>tối đa 2 electron</b> với spin ngược nhau.</li></ul></div>

<h3>4.6. Ghép bốn số lượng tử lại: quy tắc, cách đếm và cách đọc hình hydro</h3>
<div class="bridge"><b>Nối từ 4.1–4.5:</b> giờ em đã biết từng số lượng tử. Phần này gom lại thành một quy trình: <i>(1) xác định giá trị cho phép, (2) đếm số trạng thái, (3) đọc được hình orbital</i>.</div>

<div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> bài tập thường hỏi “có bao nhiêu trạng thái ứng với $n=3$?” hoặc “bộ $(n,l,m,s)$ nào hợp lệ?”.</li><li><b>Dùng để làm gì:</b> nhớ quy tắc $l\le n-1$, $|m|\le l$; đếm $n^2$ orbital và $2n^2$ trạng thái mỗi lớp; điền electron theo Pauli.</li><li><b>Cách dùng mô hình:</b> kéo 4 thanh trượt trong bộ chọn bên dưới. Thanh $l$ tự bị chặn theo $n$ và thanh $m$ bị chặn theo $l$, đúng như quy tắc.</li></ul></div>

<div class="box analogy">
  <b>Ví dụ ẩn dụ thực tế: Địa chỉ chỗ ngồi trong Nhà hát Lớn</b><br>
  Mỗi electron có một “vé chỗ ngồi” gồm 4 thông số, không ai được trùng ai (<b>Nguyên lý loại trừ Pauli</b>):<br>
  • <b>$n$</b> = <b>Số tầng lầu</b> (mức năng lượng $E_n$, độ xa sân khấu hạt nhân).<br>
  • <b>$l$</b> = <b>Khu vực ghế</b> trên tầng đó (s, p, d, f: hình dạng đám mây).<br>
  • <b>$m$</b> = <b>Số hiệu ghế/hướng ghế</b> trong khu vực ($2l+1$ hướng).<br>
  • <b>$s$</b> = trên mỗi ghế có <b>2 chỗ</b> (một người quay mặt lên $\uparrow$, một người quay xuống $\downarrow$).
</div>

<tr><td><b>1. Chính</b><br>(Principal)</td><td><span class="k b1">$n$</span></td><td>Phương trình $R(r)$: điều kiện bị trói</td><td>$n=1,2,3,\dots$</td><td><b>Năng lượng</b> $E_n=-13.6/n^2$ eV; kích thước $\sim n^2a_0$; số nút xuyên tâm $n-l-1$.</td></tr>
<tr><td><b>2. Quỹ đạo / góc</b><br>(Azimuthal)</td><td><span class="k b2">$l$</span></td><td>Phương trình $\Theta(\theta)$: hữu hạn ở hai cực</td><td>$l=0,1,\dots,n-1$</td><td><b>Hình dạng</b> mây (s, p, d, f); $|L|=\sqrt{l(l+1)}\hbar$; số nút góc $=l$.</td></tr>

<h3>Đếm trạng thái: lớp $n$ có bao nhiêu orbital và electron?</h3>
<p>Cứ mỗi $l$ có $2l+1$ giá trị $m$, và $l$ chạy từ $0$ đến $n-1$, nên số orbital của lớp $n$ là $\sum_{l=0}^{n-1}(2l+1)=n^2$. Mỗi orbital chứa 2 electron nên lớp $n$ chứa tối đa $2n^2$ electron: $2,\ 8,\ 18,\ 32,\dots$ Em hãy đối chiếu với hình: $n=3$ có $1+3+5=9$ ô, tức $18$ electron.</p>

<p><b>Ví dụ làm tay.</b> Liệt kê mọi trạng thái của $n=2$: $l=0\Rightarrow m=0$ (1 orbital, $2s$); $l=1\Rightarrow m=-1,0,1$ (3 orbital, $2p$). Tổng $4$ orbital $=n^2$ ✓, nên chứa tối đa $8$ electron ✓.</p>
<p>Còn câu hỏi “bộ $(3,3,0,+\tfrac12)$ có hợp lệ không?”: không, vì $l\le n-1=2$. Còn $(3,1,2,-\tfrac12)$? Cũng không, vì $|m|\le l=1$.</p>

<h3>Cách đọc bảng hình hydro (hình trong slide “4.1 The One-Electron Atom”)</h3>
<p>Bảng hình trong slide của thầy vẽ $|\psi_{nlm}|^2$ cho các orbital hydro với $n=2,3,4$. Em đọc theo các bước sau, với ô $(3,1,0)$ làm ví dụ:</p>

style="fill:var(--ink);font-size:12.5px;font-weight:700">① Độ sáng = |ψ|² (thang log): sáng = dễ gặp electron.</text><text x="290" y="118" text-anchor="start" style="fill:var(--c2);font-size:12.5px;font-weight:700">② Vạch ngang tối = nút góc (mặt phẳng z = 0).</text><text x="306" y="135" text-anchor="start" style="fill:var(--ink);font-size:12.5px;font-weight:400">Số nút góc = l = 1.</text><text x="290" y="170" text-anchor="start" style="fill:var(--c1);font-size:12.5px;font-weight:700">③ Vòng tối = nút xuyên tâm (mặt cầu r ≈ 6 a₀).</text><text x="306" y="187" text-anchor="start" style="fill:var(--ink);font-size:12.5px;font-weight:400">Số nút xuyên tâm = n − l − 1 = 1.</text><text x="290" y="222" text-anchor="start" style="fill:var(--c3);font-size:12.5px;font-weight:700">④ Thùy sáng nằm dọc trục z: vì m = 0 (L_z = 0).</text><text x="20" y="268" text-anchor="start" style="fill:var(--mut);font-size:12px;font-weight:400">Ô (n,l,m) = (3,1,0) = orbital 3p, cắt qua mặt phẳng xz</text></svg></figure>
<ol>
<li><b>Đọc nhãn $(n,l,m)$ ở góc ô.</b> Ví dụ $(3,1,0)$ nghĩa là $n=3$, $l=1$ (kiểu p), $m=0$.</li>
<li><b>Đếm vòng tối hình tròn</b> (nút xuyên tâm) $=n-l-1$. Ô $(3,1,0)$ có $3-1-1=1$ vòng.</li>
<li><b>Đếm vạch tối đi qua tâm</b> (nút góc) $=l$. Ô $(3,1,0)$ có 1 vạch ngang.</li>
<li><b>Nhìn hướng của các thùy</b> để đoán $m$: $m=0$ thì thùy nằm dọc trục $z$ (trên–dưới); $|m|$ lớn thì thùy dẹt về hai bên (trái–phải).</li>
<li><b>Kiểm tra tổng nút</b> $=(n-l-1)+l=n-1$.</li>
</ol>

<p>Si có $Z=14$ electron. Điền theo Pauli và thứ tự năng lượng: $1s^2\,2s^2\,2p^6\,3s^2\,3p^2$ (kiểm tra: $2+2+6+2+2=14$). Hai lớp trong $n=1,2$ đã đầy, còn lớp ngoài cùng $n=3$ có $2+2=4$ electron: đó là <b>4 electron hóa trị</b> tham gia 4 liên kết cộng hóa trị (Buổi 1). Ở Buổi 4, khi $N$ nguyên tử Si đặt sát nhau, mỗi mức rời rạc này sẽ tách thành $N$ mức rất sát, tạo ra <b>dải năng lượng</b>.</p>
<div class="box key"><b>4.6 — Nhớ</b><ul><li>Quy tắc: $n\ge1$; $0\le l\le n-1$; $-l\le m\le l$; $s=\pm\tfrac12$.</li><li>Lớp $n$ có $n^2$ orbital và $2n^2$ trạng thái. Phân lớp $s,p,d,f$ chứa $2,6,10,14$ electron.</li><li><b>Pauli:</b> không có hai electron cùng bộ $(n,l,m,s)$.</li><li>Đọc hình: vòng tối $=n-l-1$, vạch tối đi qua tâm $=l$, hướng thùy cho biết $|m|$.</li></ul></div>

        $$\Psi(x,t) = A\,e^{j(kx - \omega t)} \quad \Big| \quad v_p = \frac{\omega}{|k|} \quad \Big| \quad \lambda = \frac{2\pi}{|k|} \quad \Big| \quad p = \hbar k \quad \Big| \quad E = \frac{p^2}{2m} = \frac{\hbar^2 k^2}{2m}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $k$: Số sóng ($\text{m}^{-1}$ hoặc $\text{rad/m}$). Nếu $k > 0$ sóng chạy theo chiều $+x$; nếu $k < 0$ sóng chạy theo chiều $-x$.<br>
          • $\omega$: Tần số góc ($\text{rad/s}$).<br>
          • $v_p$: Vận tốc pha của sóng ($\text{m/s}$).<br>
          • $\lambda$: Bước sóng de Broglie ($\text{m}$ hoặc $\text{Å}$).<br>
          • $p$: Động lượng của hạt ($\text{kg}\cdot\text{m/s}$); $E$: Động năng ($\text{J}$ hoặc $\text{eV}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Khi thế năng $V(x)=0$, nghiệm của phương trình Schrödinger là sóng điều hòa phẳng có số sóng $k$ tỉ lệ thuận với động lượng $p$.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 1</b> khi đề bài cho hàm sóng phẳng $\Psi(x,t) = Ae^{j(kx-\omega t)}$ biết $k$ và $\omega$.
        </div>
      </div>

        $$E_n = \frac{n^2 \pi^2 \hbar^2}{2 m a^2} = \frac{n^2 h^2}{8 m a^2} \qquad \text{và} \qquad \psi_n(x) = \sqrt{\frac{2}{a}}\sin\left(\frac{n\pi x}{a}\right) \quad (n = 1, 2, 3, \dots)$$

      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $E_n$: Mức năng lượng cho phép thứ $n$ ($\text{J}$, chia cho $1.6 \times 10^{-19}$ để đổi ra $\text{eV}$).<br>
          • $n = 1, 2, 3, \dots$: Số lượng tử chính (số nguyên dương).<br>
          • $a$: Chiều rộng của giếng thế (bắt buộc đổi từ $\text{Å}$ sang mét: $1\text{ Å} = 10^{-10}\text{ m}$).<br>
          • $m = 9.11 \times 10^{-31}\text{ kg}$: Khối lượng electron.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>

          • <b>Khi nào dùng:</b> Khi đề bài nói <i>"electron bị giam trong giếng thế vô hạn một chiều có chiều rộng $a$"</i> (như <b>Câu 2</b>).
        </div>
      </div>
    </div>

    </div>

    <div class="formula-card">
      <h3>Công thức 4: Xác suất Xuyên hầm (Tunneling Probability $T$) qua Rào thế hình chữ nhật</h3>
      <div class="f key">
        $$T \approx 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)e^{-2k_2 a} \qquad \text{với } k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $T$: Xác suất xuyên hầm (không có đơn vị, nằm từ $0$ đến $1$).<br>
          • $a$: Chiều rộng (độ dày) của rào thế hình chữ nhật ($\text{m}$).<br>
          • $m^*$: Khối lượng hiệu dụng của hạt dẫn trong chất bán dẫn ($\text{kg}$), ví dụ $m^* = 0.067 m_0$ hoặc $m^* = 1.08 m_0$ với $m_0 = 9.11 \times 10^{-31}\text{ kg}$.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Đo tỷ lệ dòng hạt xuyên qua được bức tường thế năng có độ dày $a$ để sang vùng bên kia. Vì $k_2$ và $a$ nằm trên số mũ âm $e^{-2k_2 a}$, nên chỉ cần khối lượng $m^*$ hoặc bề rộng $a$ tăng lên một chút là xác suất xuyên hầm $T$ giảm đi cực mạnh!<br>
          • <b>Khi nào dùng:</b> Giải các bài toán tìm <i>"xác suất xuyên hầm (tunneling probability)"</i> qua rào thế chữ nhật (như <b>Câu 4</b>).
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>6. Bài Tập Trọng Tâm Buổi 3 (Có Gợi Ý & Giải Chi Tiết Từng Bước)</h2>
    <div class="bridge"><b>Nối từ Mục 5:</b> Mỗi câu luyện một môi trường $V(x)$.</div>

    <div class="tw"><table><tr><th>Câu</th><th>Luyện</th><th>Công thức</th></tr><tr><td>1</td><td>Sóng phẳng electron tự do</td><td>1</td></tr><tr><td>2</td><td>Ba mức năng lượng đầu trong giếng vô hạn</td><td>2</td></tr><tr><td>3</td><td>Xác suất đâm xuyên vào bậc thế</td><td>3</td></tr><tr><td>4</td><td>Xuyên hầm trong GaAs và Si</td><td>4</td></tr><tr><td>5</td><td>Giếng bất đối xứng</td><td>Giải lại phương trình Schrödinger</td></tr></table></div>

    <div class="box key"><b>Cách làm chung Buổi 3</b><ol><li>Xác định $V(x)$ ở từng miền.</li><li>Chọn dạng nghiệm (sóng chạy, sóng dừng, hay hàm mũ).</li><li>Đổi eV ↔ J và Å ↔ m trước khi thế số.</li><li>Kiểm tra: xác suất nằm trong khoảng $0$ đến $1$.</li></ol></div>

    <p>Dưới đây là toàn bộ 5 bài tập trong phiếu Bài tập Trọng tâm Buổi 3. Ở mỗi bước tính toán, thầy đều ghi chú thích màu xám giải thích rõ lý do biến đổi và cách đổi đơn vị để em tự học dễ dàng nhất.</p>

      <p><b>Đề bài:</b> Một electron trong không gian tự do được mô tả bởi hàm sóng dạng sóng phẳng (plane wave):
      $$\Psi(x,t) = A\,e^{j(kx - \omega t)}$$
      a) Với $k = 8 \times 10^8\text{ m}^{-1}$, $\omega = 8 \times 10^{12}\text{ rad/s}$, hãy xác định:<br>
      &nbsp;&nbsp;1. Vận tốc pha (phase velocity) và bước sóng (wavelength).<br>
      &nbsp;&nbsp;2. Động lượng và động năng của electron.<br>
      b) Lặp lại với: $k = -1.5 \times 10^9\text{ m}^{-1}$, $\omega = 1.5 \times 10^{13}\text{ rad/s}$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint1" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý 1 (Vận tốc pha và Bước sóng):</b> Dùng công thức sóng cơ bản $v_p = \frac{\omega}{|k|}$ (hoặc xét dấu vận tốc pha từ phương trình $kx - \omega t = \text{const} \implies v_p = \frac{dx}{dt} = \frac{\omega}{k}$) và công thức bước sóng $\lambda = \frac{2\pi}{|k|}$.</li>
          <li><b>Ý 2 (Động lượng và Động năng):</b> Dùng công thức lượng tử $p = \hbar k$ (với $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$) và công thức động năng $E = \frac{p^2}{2m_0} = \frac{\hbar^2 k^2}{2m_0}$ (nhớ đổi ra cả đơn vị $\text{J}$ và $\text{eV}$).</li>
          <li><b>Lưu ý ở câu b:</b> Khi $k = -1.5 \times 10^9\text{ m}^{-1} < 0$, dấu trừ cho biết sóng phẳng và hạt electron đang chuyển động theo <b>chiều âm của trục $x$ (hướng $-x$)</b>. Độ lớn bước sóng $\lambda$ và động năng $E$ luôn dương!</li>
        </ul>
      </div>

      <div id="b3-sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>a) Trường hợp 1: $k = 8 \times 10^8\text{ m}^{-1}$ và $\omega = 8 \times 10^{12}\text{ rad/s}$:</b>
          <span class="cmt">// Bước 1.1: Tính vận tốc pha (phase velocity $v_p$). Xét một điểm có pha sóng không đổi $kx - \omega t = \text{hằng số}$, lấy đạo hàm theo thời gian $t$ ta có $k\frac{dx}{dt} - \omega = 0 \implies v_p = \frac{dx}{dt} = \frac{\omega}{k}$:</span>
          $$v_p = \frac{\omega}{k} = \frac{8 \times 10^{12}\text{ rad/s}}{8 \times 10^8\text{ m}^{-1}} = \mathbf{10^4\text{ m/s}} \quad (\text{truyền theo chiều } +x)$$
          <span class="cmt">// Bước 1.2: Tính bước sóng $\lambda$ từ số sóng $k$ theo công thức $\lambda = \frac{2\pi}{k}$ (đổi thêm sang đơn vị $\text{nm}$ và $\text{Å}$):</span>
          $$\lambda = \frac{2\pi}{k} = \frac{2\pi}{8 \times 10^8\text{ m}^{-1}} \approx \mathbf{7.854 \times 10^{-9}\text{ m}} = 7.854\text{ nm} = \mathbf{78.54\text{ Å}}$$
          <span class="cmt">// Bước 2.1: Tính động lượng $p$ của electron theo hệ thức de Broglie dạng thu gọn $p = \hbar k$ (với $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$):</span>
          $$p = \hbar k = \left(1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right) \times \left(8 \times 10^8\text{ m}^{-1}\right) = \mathbf{8.432 \times 10^{-26}\text{ kg}\cdot\text{m/s}}$$
          <span class="cmt">// Bước 2.2: Tính động năng $E$ của electron từ động lượng $p$ và khối lượng nghỉ $m_0 = 9.11 \times 10^{-31}\text{ kg}$ theo công thức $E = \frac{p^2}{2m_0}$:</span>
          $$E = \frac{p^2}{2m_0} = \frac{\left(8.432 \times 10^{-26}\text{ kg}\cdot\text{m/s}\right)^2}{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right)} = \frac{7.110 \times 10^{-51}}{1.822 \times 10^{-30}} \approx \mathbf{3.902 \times 10^{-21}\text{ J}}$$
          <span class="cmt">// Bước 2.3: Đổi động năng $E$ từ đơn vị Joule ($\text{J}$) sang đơn vị chuẩn bán dẫn Electron-Volt ($\text{eV}$) bằng cách chia cho $1.6 \times 10^{-19}$:</span>
          $$E = \frac{3.902 \times 10^{-21}\text{ J}}{1.6 \times 10^{-19}\text{ J/eV}} \approx \mathbf{0.0244\text{ eV}} = \mathbf{24.4\text{ meV}}$$
        </div>

        <div class="step">
          <b>b) Trường hợp 2: $k = -1.5 \times 10^9\text{ m}^{-1}$ và $\omega = 1.5 \times 10^{13}\text{ rad/s}$:</b>
          <span class="cmt">// Bước 1.1: Nhận xét dấu của số sóng $k$: Vì $k < 0$, pha sóng có dạng $-(1.5 \times 10^9 x + 1.5 \times 10^{13} t)$, nghĩa là sóng phẳng và hạt electron đang di chuyển ngược theo chiều âm của trục $x$ (hướng $-x$). Ta tính vận tốc pha:</span>
          $$v_p = \frac{\omega}{k} = \frac{1.5 \times 10^{13}\text{ rad/s}}{-1.5 \times 10^9\text{ m}^{-1}} = \mathbf{-10^4\text{ m/s}} \quad \left(\text{độ lớn } |v_p| = 10^4\text{ m/s}, \text{ hướng theo chiều } -x\right)$$
          <span class="cmt">// Bước 1.2: Tính bước sóng $\lambda$ (bước sóng là độ dài hình học nên luôn lấy giá trị tuyệt đối $|k|$):</span>
          $$\lambda = \frac{2\pi}{|k|} = \frac{2\pi}{1.5 \times 10^9\text{ m}^{-1}} \approx \mathbf{4.189 \times 10^{-9}\text{ m}} = 4.189\text{ nm} = \mathbf{41.89\text{ Å}}$$
          <span class="cmt">// Bước 2.1: Tính động lượng $p = \hbar k$ (dấu âm thể hiện vector động lượng hướng theo chiều $-x$):</span>
          $$p = \hbar k = \left(1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right) \times \left(-1.5 \times 10^9\text{ m}^{-1}\right) = \mathbf{-1.581 \times 10^{-25}\text{ kg}\cdot\text{m/s}} \quad \left(|p| = 1.581 \times 10^{-25}\text{ kg}\cdot\text{m/s}\right)$$
          <span class="cmt">// Bước 2.2: Tính động năng $E = \frac{p^2}{2m_0}$ và đổi sang đơn vị $\text{eV}$:</span>
          $$E = \frac{p^2}{2m_0} = \frac{\left(-1.581 \times 10^{-25}\text{ kg}\cdot\text{m/s}\right)^2}{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right)} = \frac{2.500 \times 10^{-50}}{1.822 \times 10^{-30}} \approx \mathbf{1.372 \times 10^{-20}\text{ J}}$$
          $$E = \frac{1.372 \times 10^{-20}\text{ J}}{1.6 \times 10^{-19}\text{ J/eV}} \approx \mathbf{0.0857\text{ eV}} = \mathbf{85.7\text{ meV}}$$
        </div>
      </div>
    </div>

    <!-- CÂU 2 BUỔI 3 -->
    <div class="formula-card">
      <h3 id="b3-cau2">Câu 2: Ba Mức Năng Lượng Đầu Tiên Trong Giếng Thế Vô Hạn</h3>

      <p><b>Đề bài:</b> Một electron bị giam trong giếng thế vô hạn một chiều có chiều rộng: $a = 75\text{ Å}$. Xác định ba mức năng lượng: $n = 1, 2, 3$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint2" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Đổi bề rộng giếng thế từ Angstrom sang mét: $a = 75\text{ Å} = 75 \times 10^{-10}\text{ m} = 7.5 \times 10^{-9}\text{ m}$.</li>
          <li>Áp dụng công thức năng lượng lượng tử hóa trong giếng thế vô hạn 1 chiều:
            $$E_n = \frac{n^2 \pi^2 \hbar^2}{2 m_0 a^2}$$
          </li>
          <li>Tính thật chuẩn mức cơ bản $E_1$ (ứng với $n=1$) theo đơn vị $\text{eV}$, sau đó suy ra nhanh $E_2 = 2^2 E_1 = 4E_1$ và $E_3 = 3^2 E_1 = 9E_1$.</li>
        </ul>
      </div>

      <div id="b3-sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Đổi chiều rộng giếng thế $a = 75\text{ Å}$ sang đơn vị chuẩn SI là mét ($\text{m}$):</span>
          $$a = 75\text{ Å} = 75 \times 10^{-10}\text{ m} = 7.5 \times 10^{-9}\text{ m}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Viết công thức tính mức năng lượng lượng tử hóa thứ $n$ của electron ($m_0 = 9.11 \times 10^{-31}\text{ kg}$, $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$) trong giếng thế vô hạn 1 chiều:</span>
          $$E_n = \frac{n^2 \pi^2 \hbar^2}{2 m_0 a^2}$$
          <span class="cmt">// Bước 3: Thay số vào để tính mức năng lượng cơ bản $E_1$ (với $n = 1$) theo đơn vị Joule ($\text{J}$):</span>
          $$E_1 = \frac{1^2 \times \pi^2 \times \left(1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right)^2}{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right) \times \left(7.5 \times 10^{-9}\text{ m}\right)^2} = \frac{1.0966 \times 10^{-67}}{1.0249 \times 10^{-46}} \approx 1.070 \times 10^{-21}\text{ J}$$
          <span class="cmt">// Bước 4: Đổi mức năng lượng $E_1$ sang đơn vị Electron-Volt ($\text{eV}$) bằng cách chia cho $1.6 \times 10^{-19}$:</span>
          $$E_1 = \frac{1.070 \times 10^{-21}\text{ J}}{1.6 \times 10^{-19}\text{ J/eV}} \approx \mathbf{6.69 \times 10^{-3}\text{ eV}} = \mathbf{6.69\text{ meV}}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 5: Vì $E_n = n^2 E_1$, ta nhân $E_1$ lần lượt với $2^2 = 4$ và $3^2 = 9$ để tìm nhanh mức năng lượng thứ hai ($n=2$) và thứ ba ($n=3$):</span>
          $$\text{• Với } n = 1: \quad E_1 = \mathbf{6.69 \times 10^{-3}\text{ eV}} \quad (\approx 6.69\text{ meV})$$
          $$\text{• Với } n = 2: \quad E_2 = 2^2 \times E_1 = 4 \times \left(6.69 \times 10^{-3}\text{ eV}\right) = \mathbf{2.68 \times 10^{-2}\text{ eV}} \quad (\approx 26.8\text{ meV})$$
          $$\text{• Với } n = 3: \quad E_3 = 3^2 \times E_1 = 9 \times \left(6.69 \times 10^{-3}\text{ eV}\right) = \mathbf{6.02 \times 10^{-2}\text{ eV}} \quad (\approx 60.2\text{ meV})$$
        </div>
      </div>
    </div>

      <h3 id="b3-cau3">Câu 3: Xác Suất Tìm Thấy Electron Đâm Xuyên Vào Bậc Thế Năng</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 200" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="60" y1="30" x2="60" y2="172" style="stroke:var(--mut);stroke-width:1.5"/><line x1="60" y1="172" x2="400" y2="172" style="stroke:var(--mut);stroke-width:1.5" marker-end="url(#fa)"/><line x1="56" y1="34" x2="60" y2="34" style="stroke:var(--mut);stroke-width:1.5"/><text x="52" y="38" text-anchor="end" style="fill:var(--mut);font-size:11px;font-weight:400">1</text><line x1="56" y1="80" x2="60" y2="80" style="stroke:var(--mut);stroke-width:1.5"/><text x="52" y="84" text-anchor="end" style="fill:var(--mut);font-size:11px;font-weight:400">10⁻⁶</text><line x1="60" y1="80" x2="400" y2="80" style="stroke:var(--g);stroke-width:1" stroke-dasharray="3 4"/><line x1="56" y1="125.9" x2="60" y2="125.9" style="stroke:var(--mut);stroke-width:1.5"/><text x="52" y="129.9" text-anchor="end" style="fill:var(--mut);font-size:11px;font-weight:400">10⁻¹²</text><line x1="60" y1="125.9" x2="400" y2="125.9" style="stroke:var(--g);stroke-width:1" stroke-dasharray="3 4"/><line x1="56" y1="171.9" x2="60" y2="171.9" style="stroke:var(--mut);stroke-width:1.5"/><text x="52" y="175.9" text-anchor="end" style="fill:var(--mut);font-size:11px;font-weight:400">10⁻¹⁸</text><line x1="60" y1="171.9" x2="400" y2="171.9" style="stroke:var(--g);stroke-width:1" stroke-dasharray="3 4"/><line x1="60" y1="34" x2="386.4" y2="170.9" style="stroke:var(--c4);stroke-width:3"/><circle cx="94" cy="48.3" r="6" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.9"/><text x="104" y="38.3" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:700">5 Å: 1.4×10⁻²</text><line x1="94" y1="48.3" x2="94" y2="172" style="stroke:var(--c1);stroke-width:1" stroke-dasharray="3 3"/><text x="94" y="188" text-anchor="middle" style="fill:var(--c1);font-size:11.5px;font-weight:400">5</text><circle cx="162" cy="76.8" r="6" style="fill:var(--c2);stroke:var(--c2);stroke-width:2;fill-opacity:0.9"/><text x="172" y="66.8" text-anchor="start" style="fill:var(--c2);font-size:12px;font-weight:700">15 Å: 2.6×10⁻⁶</text><line x1="162" y1="76.8" x2="162" y2="172" style="stroke:var(--c2);stroke-width:1" stroke-dasharray="3 3"/><text x="162" y="188" text-anchor="middle" style="fill:var(--c2);font-size:11.5px;font-weight:400">15</text><circle cx="332" cy="148.1" r="6" style="fill:var(--c5);stroke:var(--c5);stroke-width:2;fill-opacity:0.9"/><text x="322" y="136.1" text-anchor="end" style="fill:var(--c5);font-size:12px;font-weight:700">40 Å: 1.3×10⁻¹⁵</text><line x1="332" y1="148.1" x2="332" y2="172" style="stroke:var(--c5);stroke-width:1" stroke-dasharray="3 3"/><text x="332" y="188" text-anchor="middle" style="fill:var(--c5);font-size:11.5px;font-weight:400">40</text><text x="398" y="188" text-anchor="end" style="fill:var(--mut);font-size:11.5px;font-weight:400">x (Å)</text><text x="210" y="16" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">P(x)/P(0) = e^(−2κx), thang log</text></svg><figcaption>Câu 3: κ ≈ 0.429 Å⁻¹, xác suất giảm theo hàm mũ nên trên thang log là đường thẳng.</figcaption></figure>

      <p><b>Đề bài:</b> Một electron có động năng (kinetic energy): $E = 2.8\text{ eV}$ đập vào một rào thế dạng bậc (step potential) có chiều cao: $V_0 = 3.5\text{ eV}$. Tính xác suất tương đối tìm thấy electron tại các khoảng cách:<br>
      a) $5\text{ Å}$<br>
      b) $15\text{ Å}$<br>
      c) $40\text{ Å}$<br>
      bên trong vùng biên (barrier), so với mật độ xác suất tương đối (probability density) của electron tại mép biên.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint3" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Vì động năng $E = 2.8\text{ eV}$ nhỏ hơn chiều cao bậc thế $V_0 = 3.5\text{ eV}$, hàm sóng bên trong vùng biên ($x \ge 0$) có dạng hàm mũ suy giảm: $\psi_2(x) = A_2 e^{-k_2 x}$.</li>
          <li>Tính hệ số suy giảm $k_2 = \frac{\sqrt{2m_0(V_0 - E)}}{\hbar}$. Lưu ý: Phải đổi hiệu năng lượng $V_0 - E = 3.5 - 2.8 = 0.7\text{ eV}$ ra đơn vị Joule ($\times 1.6 \times 10^{-19}$) trước khi khai căn!</li>
          <li>Tỷ số mật độ xác suất tại vị trí $x$ so với tại mép biên ($x = 0$) là:
            $$P_{\text{rel}}(x) = \frac{|\psi_2(x)|^2}{|\psi_2(0)|^2} = \frac{|A_2|^2 e^{-2k_2 x}}{|A_2|^2 e^0} = e^{-2k_2 x}$$
          </li>
        </ul>
      </div>

      <div id="b3-sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước mở đầu: Tính hệ số suy giảm $k_2$ bên trong vùng rào thế bậc ($x \ge 0$):</b>
          <span class="cmt">// Bước 1: Tính phần chênh lệch thế năng $V_0 - E$ và đổi từ đơn vị $\text{eV}$ sang đơn vị chuẩn Joule ($\text{J}$):</span>
          $$V_0 - E = 3.5\text{ eV} - 2.8\text{ eV} = 0.7\text{ eV} = 0.7 \times \left(1.6 \times 10^{-19}\text{ J}\right) = 1.12 \times 10^{-19}\text{ J}$$
          <span class="cmt">// Bước 2: Thay $V_0 - E$, khối lượng electron $m_0 = 9.11 \times 10^{-31}\text{ kg}$ và $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$ vào công thức tính $k_2$:</span>
          $$k_2 = \frac{\sqrt{2 m_0 (V_0 - E)}}{\hbar} = \frac{\sqrt{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right) \times \left(1.12 \times 10^{-19}\text{ J}\right)}}{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}$$
          $$k_2 = \frac{\sqrt{2.04064 \times 10^{-49}}}{1.054 \times 10^{-34}} = \frac{4.5173 \times 10^{-25}}{1.054 \times 10^{-34}} \approx \mathbf{4.286 \times 10^9\text{ m}^{-1}}$$
          <span class="cmt">// Bước 3: Lập biểu thức tỷ số mật độ xác suất tương đối tại tọa độ $x$ so với tại mép biên $x = 0$. Vì $\psi_2(x) = A_2 e^{-k_2 x}$ nên mật độ xác suất là $|\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(x)|^2}{|\psi_2(0)|^2} = \frac{|A_2|^2 e^{-2k_2 x}}{|A_2|^2} = e^{-2k_2 x}$$
        </div>

        <div class="step">
          <b>a) Tại khoảng cách $x = 5\text{ Å} = 5 \times 10^{-10}\text{ m}$:</b>
          <span class="cmt">// Thay $x = 5 \times 10^{-10}\text{ m}$ và $k_2 = 4.286 \times 10^9\text{ m}^{-1}$ vào hàm mũ $e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(5\text{ Å})|^2}{|\psi_2(0)|^2} = \exp\Big[-2 \times \left(4.286 \times 10^9\text{ m}^{-1}\right) \times \left(5 \times 10^{-10}\text{ m}\right)\Big] = e^{-4.286} \approx \mathbf{0.0138} \quad (\text{hay } \mathbf{1.38\%})$$
        </div>

        <div class="step">
          <b>b) Tại khoảng cách $x = 15\text{ Å} = 15 \times 10^{-10}\text{ m}$:</b>
          <span class="cmt">// Thay $x = 15 \times 10^{-10}\text{ m}$ vào biểu thức $e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(15\text{ Å})|^2}{|\psi_2(0)|^2} = \exp\Big[-2 \times \left(4.286 \times 10^9\text{ m}^{-1}\right) \times \left(15 \times 10^{-10}\text{ m}\right)\Big] = e^{-12.858} \approx \mathbf{2.61 \times 10^{-6}} \quad (\text{hay } \mathbf{0.000261\%})$$

          <span class="cmt">// Thay $x = 40 \times 10^{-10}\text{ m}$ vào biểu thức $e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(40\text{ Å})|^2}{|\psi_2(0)|^2} = \exp\Big[-2 \times \left(4.286 \times 10^9\text{ m}^{-1}\right) \times \left(40 \times 10^{-10}\text{ m}\right)\Big] = e^{-34.288} \approx \mathbf{1.29 \times 10^{-15}}$$

      <p><b>Đề bài:</b> Một hạt có động năng (kinetic energy): $E = 0.20\text{ eV}$ xuyên qua một rào thế hình chữ nhật (rectangular potential barrier) có chiều cao $V_0 = 0.8\text{ eV}$ và chiều rộng $a = 15\text{ Å}$.<br>
      a) Xác định xác suất xuyên hầm (tunneling probability) nếu khối lượng hiệu dụng (effective mass) tương ứng electron trong $\text{GaAs}$: $m^* = 0.067 m_0$.<br>
      b) Lặp lại với: $m^* = 1.08 m_0$ tương ứng electron trong silicon.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint4" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Sử dụng công thức tính xác suất xuyên hầm qua rào thế chữ nhật:
            $$T \approx 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)e^{-2k_2 a}$$
          </li>
          <li>Tính hệ số đứng trước hàm mũ dùng chung cho cả 2 câu: $\frac{E}{V_0} = \frac{0.20}{0.80} = 0.25 \implies 16 \times 0.25 \times (1 - 0.25) = 3$.</li>
          <li>Tính hệ số suy giảm $k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar}$ riêng cho từng loại vật liệu (nhớ thay $m^* = 0.067 m_0$ ở câu a và $m^* = 1.08 m_0$ ở câu b).</li>
        </ul>
      </div>

      <div id="b3-sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước chuẩn bị chung cho cả hai ý (a) và (b):</b>
          <span class="cmt">// Bước 1: Đổi bề rộng rào thế $a = 15\text{ Å}$ sang mét và tính hiệu năng lượng $V_0 - E$ sang đơn vị Joule:</span>
          $$a = 15\text{ Å} = 15 \times 10^{-10}\text{ m} = 1.5 \times 10^{-9}\text{ m}$$
          $$V_0 - E = 0.8\text{ eV} - 0.20\text{ eV} = 0.6\text{ eV} = 0.6 \times \left(1.6 \times 10^{-19}\text{ J}\right) = 9.6 \times 10^{-20}\text{ J}$$
          <span class="cmt">// Bước 2: Tính thừa số tiền hàm mũ $16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)$ trong công thức xác suất xuyên hầm $T$:</span>
          $$\frac{E}{V_0} = \frac{0.20\text{ eV}}{0.80\text{ eV}} = 0.25 \implies 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right) = 16 \times 0.25 \times (1 - 0.25) = 16 \times 0.25 \times 0.75 = \mathbf{3}$$
          <span class="cmt">// Như vậy, công thức tính xác suất xuyên hầm rút gọn lại rất đẹp là: $T = 3\,e^{-2k_2 a}$.</span>
        </div>

        <div class="step">
          <b>a) Đối với electron trong $\text{GaAs}$ có khối lượng hiệu dụng $m^* = 0.067 m_0$:</b>
          <span class="cmt">// Bước 1: Tính hệ số suy giảm $k_2$ với $m^* = 0.067 \times 9.11 \times 10^{-31}\text{ kg} \approx 6.1037 \times 10^{-32}\text{ kg}$:</span>
          $$k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar} = \frac{\sqrt{2 \times \left(0.067 \times 9.11 \times 10^{-31}\text{ kg}\right) \times \left(9.6 \times 10^{-20}\text{ J}\right)}}{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}$$
          $$k_2 = \frac{\sqrt{1.1719 \times 10^{-50}}}{1.054 \times 10^{-34}} = \frac{1.0825 \times 10^{-25}}{1.054 \times 10^{-34}} \approx \mathbf{1.027 \times 10^9\text{ m}^{-1}}$$
          <span class="cmt">// Bước 2: Tính tích số $2 k_2 a$ ở trên số mũ:</span>
          $$2 k_2 a = 2 \times \left(1.027 \times 10^9\text{ m}^{-1}\right) \times \left(1.5 \times 10^{-9}\text{ m}\right) \approx 3.081$$
          <span class="cmt">// Bước 3: Thay vào công thức $T = 3\,e^{-2k_2 a}$ để tìm xác suất xuyên hầm trong $\text{GaAs}$:</span>
          $$T_{\text{GaAs}} = 3 \times e^{-3.081} \approx 3 \times 0.0459 = \mathbf{0.138} \quad (\text{hay } \mathbf{13.8\%})$$
          <span class="cmt">// (Ghi chú nâng cao: Nếu tính theo công thức chính xác tuyệt đối không dùng xấp xỉ $E \ll V_0$, tức $T_{\text{exact}} = \left[1 + \frac{\sinh^2(k_2 a)}{4(E/V_0)(1-E/V_0)}\right]^{-1}$, thì $T_{\text{exact}} \approx \mathbf{0.120}$ hay $12.0\%$).</span>
        </div>

        <div class="step">
          <b>b) Đối với electron trong Silicon có khối lượng hiệu dụng $m^* = 1.08 m_0$:</b>
          <span class="cmt">// Bước 1: Tính hệ số suy giảm $k_2$ với $m^* = 1.08 \times 9.11 \times 10^{-31}\text{ kg} \approx 9.8388 \times 10^{-31}\text{ kg}$:</span>
          $$k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar} = \frac{\sqrt{2 \times \left(1.08 \times 9.11 \times 10^{-31}\text{ kg}\right) \times \left(9.6 \times 10^{-20}\text{ J}\right)}}{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}$$
          $$k_2 = \frac{\sqrt{1.8890 \times 10^{-49}}}{1.054 \times 10^{-34}} = \frac{4.3463 \times 10^{-25}}{1.054 \times 10^{-34}} \approx \mathbf{4.124 \times 10^9\text{ m}^{-1}}$$
          <span class="cmt">// Bước 2: Tính tích số $2 k_2 a$ ở trên số mũ:</span>
          $$2 k_2 a = 2 \times \left(4.124 \times 10^9\text{ m}^{-1}\right) \times \left(1.5 \times 10^{-9}\text{ m}\right) \approx 12.371$$
          <span class="cmt">// Bước 3: Thay vào công thức $T = 3\,e^{-2k_2 a}$ để tìm xác suất xuyên hầm trong Silicon:</span>
          $$T_{\text{Si}} = 3 \times e^{-12.371} \approx 3 \times \left(4.24 \times 10^{-6}\right) \approx \mathbf{1.27 \times 10^{-5}}$$
          <span class="cmt">// Kết luận so sánh: Chỉ vì khối lượng hiệu dụng của electron trong Silicon lớn hơn trong GaAs khoảng 16 lần ($1.08$ so với $0.067$), xác suất xuyên hầm đã giảm mạnh từ $13.8\%$ xuống chỉ còn $1.27 \times 10^{-5}$ (giảm hơn $10\,000$ lần!).</span>
        </div>
      </div>
    </div>
