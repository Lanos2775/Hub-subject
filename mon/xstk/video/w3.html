svg{width:24px;height:24px;fill:currentColor}
#tm{font-size:14px;font-weight:600;margin-left:8px;flex:1;color:#989ba5}
#mn{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);background:#242529f5;border-left:1px solid #4c4f58;padding:18px 8px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}

<script>
// Thiết lập canvas logic 1280x720 và các hàm vẽ, tiện ích toán học dùng chung
const W=1280,H=720,C=document.getElementById('c'),X=C.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=v=>{v=cl(v);return v*v*(3-2*v)};
const sg=(t,a,b)=>sm((t-a)/(b-a));
const mx=(a,b,k)=>a+(b-a)*k;
const mp=(a,b,p,q)=>v=>p+(q-p)*(v-a)/(b-a);
const f=(v,d=1)=>v.toFixed(d).replace('.',',');
const col={fg:'#dcdde2',dim:'#989ba5',b:'#78a9d6',o:'#df9368',g:'#7cc99c',y:'#e5b91a',r:'#d97373',p:'#a996cf',card:'#35373d',card2:'#26272b',bd:'#4c4f58',axis:'#545760'};

let FA=1;
const al=a=>{X.globalAlpha=cl(a===undefined?1:a)*FA};
function T(s,x,y,z,c,a,o){al(o);X.fillStyle=c||col.fg;X.font=`${z>=34?800:600} ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;X.textAlign=a||'left';X.textBaseline='middle';X.fillText(s,x,y)}
function L(a,b,c,d,k,w,o,ds){al(o);X.strokeStyle=k;X.lineWidth=w||2;X.setLineDash(ds||[]);X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke();X.setLineDash([])}
function R(x,y,w,h,c,o){al(o);X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c,o,st){
  al(o);X.beginPath();X.roundRect(x,y,w,h,r);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
function D(x,y,r,c,o,st){
  al(o);X.beginPath();X.arc(x,y,r,0,Math.PI*2);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
function FR(num,den,x,y,z,c,o){
  X.font=`600 ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;
  const w=Math.max(X.measureText(num).width,X.measureText(den).width)+14;
  T(num,x,y-z*.66,z,c,'center',o);
  L(x-w/2,y,x+w/2,y,c||col.fg,1.8,o);
  T(den,x,y+z*.72,z,c,'center',o);
  return w;
}
const hd=s=>T(s,80,58,35,col.y);

// Bộ sinh số giả ngẫu nhiên cố định seed
function mkRng(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

// 1. Dữ liệu mô phỏng TFT (File 1)
const tftPts=(()=>{
  const rnd=mkRng(202503),pts=[];
  const stratCol=[col.o,col.b,col.g]; // Reroll cấp 6, Tempo cấp 7, Fast 8
  for(let i=0;i<90;i++){
    const st=i%3;
    const hp=cl(20+rnd()*75,15,96);
    const gold=cl((st===0?18:st===1?31:48)+(rnd()-.5)*28,5,74);
    const val=25+rnd()*35;
    const pl=Math.max(1,Math.min(8,Math.round(6.8-hp*.045+(rnd()-.5)*3.4)));
    pts.push({hp,gold,val,pl,st,c:stratCol[st],rank:i%4});
  }
  return pts;
})();

const histPl=[3,4,3,4,3,6,6,4,4,7,5,6,3,5,4,2,5,3,6,4,2,3,5,2,4,1,3,4,2,3];
const histRoll=w=>histPl.map((_,i)=>{
  const s=Math.max(0,i-w+1);let sum=0;
  for(let j=s;j<=i;j++)sum+=histPl[j];
  return sum/(i-s+1);
});

const dmgHist=(()=>{
  const rnd=mkRng(3041),raw=new Array(18).fill(0),lg=new Array(18).fill(0);
  for(let i=0;i<960;i++){
    const u=Math.max(1e-6,rnd()),v=rnd();
    const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
    const ln=10.35+z*.62,val=Math.exp(ln);
    const b1=Math.min(17,Math.floor(val/160000*18));
    raw[b1]++;
    const l10=Math.log10(val),b2=Math.max(0,Math.min(17,Math.floor((l10-3.6)/(5.3-3.6)*18)));
    lg[b2]++;
  }
  const m1=Math.max(...raw),m2=Math.max(...lg);
  return {raw:raw.map(x=>x/m1),lg:lg.map(x=>x/m2)};
})();

// 2. Dữ liệu mô phỏng bám sát bộ penguins (File 2): Adelie, Chinstrap, Gentoo
const pengPts=(()=>{
  const rnd=mkRng(3012),pts=[];
  // [lenMean, depMean, slope, count, color, spIdx]
  const specs=[[38.8,18.3,.22,38,col.b,0],[48.8,18.4,.20,24,col.o,1],[47.5,15.0,.18,34,col.g,2]];
  specs.forEach(([lm,dm,sl,n,c,sp])=>{
    for(let i=0;i<n;i++){
      const dl=(rnd()+rnd()-1)*5.5;
      const len=cl(lm+dl,32,59);
      const dep=cl(dm+sl*dl+(rnd()+rnd()-1)*1.4,13,21.5);
      pts.push({len,dep,c,sp});
    }
  });
  return pts;
})();

// Histogram & đường mật độ (KDE) chiều dài mỏ penguins (342 cá thể)
const billHist=(()=>{
  const bins=[.08,.24,.48,.68,.84,.72,.65,.78,.95,1.0,.86,.72,.52,.30,.12,.05];

];

// 4. Dữ liệu msleep (83 loài động vật có vú: bodywt kg, log_bodywt ln(g), sleep_total giờ)
const msleepPts=(()=>{
  const rnd=mkRng(3042),pts=[];
  // Hai điểm nổi bật thật từ bảng dữ liệu
  pts.push({nm:'Little brown bat',kg:.01,lg:2.30,sl:19.9,hi:1});
  pts.push({nm:'African elephant',kg:6654,lg:15.71,sl:3.3,hi:2});
  pts.push({nm:'Asian elephant',kg:2547,lg:14.75,sl:3.9,hi:0});
  pts.push({nm:'Giraffe',kg:900,lg:13.71,sl:1.9,hi:0});
  pts.push({nm:'Cow',kg:600,lg:13.30,sl:4.0,hi:0});
  pts.push({nm:'Horse',kg:521,lg:13.16,sl:2.9,hi:0});
  pts.push({nm:'Bottle-nosed dolphin',kg:173,lg:12.06,sl:5.2,hi:0});
  pts.push({nm:'Pilot whale',kg:800,lg:13.59,sl:2.7,hi:0});
  pts.push({nm:'Donkey',kg:187,lg:12.14,sl:3.1,hi:0});
  pts.push({nm:'Brazilian tapir',kg:207,lg:12.24,sl:4.4,hi:0});
  for(let i=0;i<58;i++){
    const lg=cl(1.8+rnd()*10.1,1.6,11.9);
    const kg=Math.exp(lg)/1000;
    const sl=cl(16.2-.65*lg+(rnd()+rnd()-1)*5.2,2.5,19.4);
    pts.push({nm:'',kg,lg,sl,hi:0});
  }
  return pts;
})();

// Danh sách 22 cảnh tương tác đầy đủ cả 2 file Tuần 03
const sc=[
{
  t:'1. Dữ liệu TFT & Đơn vị quan sát',d:22,
  s:[
    [0,'Chào mừng bạn đến với Tuần 03: Ngữ pháp đồ họa và Điều kiện hóa — tổng hợp đầy đủ cả 2 file (TFT và dữ liệu kinh điển).'],
    [5,'Trước khi vẽ hay tính toán, luôn đọc đơn vị quan sát: bảng tran_tft gồm 120 lobby × 8 người = 960 hàng (1 hàng = 1 người chơi–trận).'],
    [11,'Biến placement từ 1 (tốt nhất) đến 8 (kém nhất); vì mỗi lobby có đúng 4 người vào top 4, tỉ lệ top 4 toàn bảng luôn bằng đúng 50%.'],
    [16.5,'Tương tự ở file 2: penguins có 1 hàng = 1 con chim cánh cụt (344 hàng); arbuthnot có 1 hàng = 1 năm (82 năm); msleep có 1 hàng = 1 loài (83 loài).']
  ],
  f:t=>{
    hd('1. Đọc cấu trúc dữ liệu & Đơn vị quan sát trước khi vẽ');

    const stats=[
      ['tran_tft (960 hàng)','120 lobby × 8 người','1 hàng = 1 người chơi–trận',col.b,1],
      ['penguins (344 hàng)','3 loài chim cánh cụt','342 hàng đủ 2 số đo mỏ',col.y,4],

      RR(x,y,545,120,12,col.card,o);RR(x,y,545,120,12,col.bd,o,1.5);R(x,y+12,3.5,96,c,o);
      T(v,x+28,y+32,23,c,'left',o);
      T(l1,x+28,y+68,18,col.fg,'left',o);
      T(l2,x+28,y+98,16,col.dim,'left',o);

    const oN=sg(t,14,15.5);
    RR(80,455,1115,78,12,col.card2,oN);RR(80,455,1115,78,12,col.bd,oN,1.4);R(80,466,3.5,56,col.y,oN);
    T('Quy tắc vàng: Câu hỏi ở cấp nào thì dữ liệu phải nhóm về đúng cấp đơn vị quan sát đó!',108,482,19,col.y,'left',oN);
    T('VD: Hỏi theo lobby ⇒ 1 hàng/lobby; hỏi phong độ người chơi ⇒ groupby("player_id"); thiếu telemetry ⇒ báo cáo rõ.',108,512,16,col.fg,'left',oN);

{
  t:'2. Bốn thành phần Ngữ pháp đồ họa',d:24,
  s:[
    [0,'Mọi biểu đồ tưởng như rất khác nhau (cột, histogram, boxplot, đường) thực ra đều có chung một cấu trúc: Ngữ pháp đồ họa (Grammar of Graphics).'],
    [5.5,'Phiên bản gọn gồm 4 thành phần: 1. Data (bảng dữ liệu và đơn vị quan sát); 2. Aesthetic mappings (biến nào điều khiển x, y, màu, kích thước).'],
    [11.5,'3. Geometry (dấu hiệu vẽ: cột, điểm, đường, hộp, violin); 4. Grouping / Faceting (tách nhóm màu hoặc chia nhiều ô facet_wrap).'],
    [17,'Không có thành phần nào là "trang trí thuần túy" — mỗi quyết định chọn ánh xạ hay hình học sẽ quyết định điều gì được giữ lại hoặc bị che đi!']
  ],
  f:t=>{
    hd('2. Ngữ pháp đồ họa: Bốn thành phần cấu tạo mọi biểu đồ');

    const parts=[
      ['1. Data (Dữ liệu)','Bảng nào? Đủ biến cần thiết chưa?',col.b,1.2],
      ['2. Mappings (Ánh xạ)','aes(x=..., y=..., color=..., size=...)',col.y,4.5],

      ['4. Grouping / Faceting','Nhóm màu hoặc chia nhiều ô facet_wrap',col.o,11.5]
    ];
    parts.forEach(([tt,ds,c,st],i)=>{

      RR(80,yy,545,82,10,col.card,o);RR(80,yy,545,82,10,col.bd,o,1.4);R(80,yy+10,3.5,62,c,o);

    RR(945,145,255,178,10,col.card2,oM);RR(945,145,255,178,10,col.bd,oM,1.2);
    T('geom_rect: Histogram',1072,168,15,col.p,'center',oM);
    [25,52,78,94,82,64,40,18].forEach((h,i)=>R(968+i*26,298-h*oM,22,h*oM,col.p,.8*oM));
    RR(665,345,255,178,10,col.card2,sg(t,9,10.5));RR(665,345,255,178,10,col.bd,sg(t,9,10.5),1.2);
    T('geom_boxplot: Theo nhóm',792,368,15,col.g,'center',sg(t,9,10.5));
    [[462,col.o],[438,col.b],[405,col.g]].forEach(([yy,c],i)=>{
      const cx=725+i*66,oB=sg(t,9.5,11);
      L(cx,yy-26,cx,yy+28,c,1.6,oB);R(cx-16,yy-12,32,26,c,.75*oB);L(cx-16,yy,cx+16,yy,col.fg,2,oB);
    });
    RR(945,345,255,178,10,col.card2,sg(t,12,13.5));RR(945,345,255,178,10,col.bd,sg(t,12,13.5),1.2);
    T('geom_line: Chuỗi thời gian',1072,368,15,col.b,'center',sg(t,12,13.5));
    al(sg(t,12.5,14));X.strokeStyle=col.b;X.lineWidth=2.2;X.beginPath();
    [455,445,465,480,472,440,425,410,418,395].forEach((yy,i)=>i===0?X.moveTo(968,yy):X.lineTo(968+i*23,yy));
    X.stroke();
  }
},
{
  t:'3. Phân tích cú pháp biểu đồ đa ánh xạ',d:22,
  s:[
    [0,'Thực hành phân tích cú pháp trên tran_tft: ta ánh xạ đồng thời 4 biến vào cùng một biểu đồ phân tán.'],
    [5,'Trục x là máu ở stage 4-1, trục y là placement — đảo ngược trục (scale_y_reverse) để hạng 1 nằm ở trên cùng!'],
    [10.5,'Màu sắc mã hóa chiến thuật (cam: Reroll 6, xanh dương: Tempo 7, xanh lá: Fast 8), kích thước mã hóa giá trị đội hình.'],
    [16.5,'Nhớ 2 lưu ý: điểm to hơn chỉ là giá trị đội hình cao hơn (≠ "quan trọng hơn"); và nhồi quá nhiều ánh xạ sẽ gây rối mắt!']
  ],
  f:t=>{

    T('Giải mã 4 ánh xạ trong aes(...)',755,188,21,col.y,'left',oR);
    T('• x = mau_4_1  (máu ở stage 4-1)',755,236,18,col.fg,'left',oR);

      T('.query(...) lọc hàng (and=giao, or=hợp) | df[[...]] chọn cột',x+22,y+55,16,pal.txt,'left',o);
      T('True = 1, False = 0  ⇒  mean(biến logic) = Tỉ lệ',x+22,y+86,16,pal.mut,'left',o);
    });
    card(650,230,'6. Pipeline pandas & Thứ tự thao tác',13.5,(x,y,o)=>{
      T('df.query().assign().groupby(..., observed=True).agg()',x+22,y+55,17,pal.txt,'left',o);
      T('Cảnh giác: lọc biến mục tiêu trước sẽ làm sai mẫu số!',x+22,y+86,16,pal.mut,'left',o);
    });
    card(650,348,'7. Tỉ lệ gộp vs Có điều kiện & Nghịch lý Simpson',16,(x,y,o)=>{
      T('Gộp nhóm dễ che giấu hoặc đảo chiều (cơ chế trọng số)',x+22,y+55,17,pal.txt,'left',o);
      T('Luôn kiểm tra theo biến bối cảnh (loài penguins, nhịp lobby)',x+22,y+86,15,pal.mut,'left',o);
    });
    card(650,466,'8. Trực quan trung thực & Ranh giới Nhân quả',18.5,(x,y,o)=>{
      T('Biểu đồ cột bắt đầu từ 0%  |  Kiểm tra scales trên facet',x+22,y+55,17,pal.txt,'left',o);
      T('Điều kiện hóa chỉ cho thấy LIÊN HỆ, chưa phải nhân quả!',x+22,y+86,16,pal.mut,'left',o);
    });
  }
}
];

// ===== Điều khiển trình phát tương tác =====
const ST=[];let TOT=0;sc.forEach(s=>{ST.push(TOT);TOT+=s.d});
const idx=()=>Math.max(0,ST.findLastIndex(x=>x<=g));
const $=(q)=>document.querySelector(q);
const pg=$('#pg'),mn=$('#mn'),ui=$('#ui'),sub=$('#sub'),bp=$('#bp'),bt=$('#bt'),bn=$('#bn'),bc=$('#bc'),bs=$('#bs'),bm=$('#bm'),tm=$('#tm');
const ic=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const IP=ic('M8 5v14l11-7z'),IA=ic('M6 19h4V5H6zm8-14v14h4V5z');
bt.innerHTML=ic('M6 6h2v12H6zm3.5 6l8.5 6V6z');
bn.innerHTML=ic('M6 18l8.5-6L6 6zm10-12v12h2V6z');
bm.innerHTML=ic('M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z');

sc.forEach((s,i)=>{
  const e=document.createElement('div');e.className='sg';e.style.flexGrow=s.d;e.innerHTML='<i></i>';pg.appendChild(e);
  const m=document.createElement('div');m.textContent=s.t;m.onclick=()=>{g=ST[i];mn.classList.remove('o');rd()};mn.appendChild(m);
});
const sgs=[...pg.children],mns=[...mn.children];

let g=0,pl=1,cc=1,sp=1,lt=0,ht=0,dr=0;
const sps=[.75,1,1.25,1.5,2];
const ft=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const sh=()=>{ui.classList.remove('h');clearTimeout(ht);if(pl)ht=setTimeout(()=>ui.classList.add('h'),3000)};
const up=()=>{bp.innerHTML=pl?IA:IP;if(!pl)ui.classList.remove('h');else sh()};

function rs(){
  const dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight,r=Math.min(w/W,h/H);
  C.style.width=W*r+'px';C.style.height=H*r+'px';
  C.width=Math.round(W*r*dpr);C.height=Math.round(H*r*dpr);
}
addEventListener('resize',rs);rs();

let lastSub='';
function rd(){
  const k=C.width/W;X.setTransform(k,0,0,k,0,0);X.globalAlpha=1;X.fillStyle='#2c2d31';X.fillRect(0,0,W,H);
  const i=idx(),t=g-ST[i],s=sc[i];
  FA=Math.min(cl(t/.4),cl((s.d-t)/.4));
  s.f(t);
  X.globalAlpha=1;
  sgs.forEach((e,j)=>{e.firstChild.style.width=(j<i?100:j>i?0:cl(t/s.d)*100)+'%'});
  mns.forEach((e,j)=>e.classList.toggle('c',j===i));
  tm.textContent=`${ft(g)} / ${ft(TOT)} · ${s.t}`;
  let tx='';
  if(cc)for(const [a,b] of s.s)if(t>=a)tx=b;
  if(tx!==lastSub){
    lastSub=tx;
    sub.textContent=tx;
    sub.classList.toggle('e',!tx);
  }
}

function lp(n){
  if(lt&&pl){g+=Math.min(.1,(n-lt)/1000)*sp;if(g>=TOT){g=TOT;pl=0;up()}}
  lt=n;rd();requestAnimationFrame(lp);
}
requestAnimationFrame(lp);up();

const tg=()=>{if(g>=TOT)g=0;pl^=1;up()};
bp.onclick=tg;
bt.onclick=()=>{const i=idx();g=ST[g-ST[i]>2?i:Math.max(0,i-1)];sh()};
bn.onclick=()=>{const i=idx();g=i<sc.length-1?ST[i+1]:TOT;sh()};
bc.onclick=()=>{cc^=1;bc.classList.toggle('on',!!cc);lastSub='__';rd()};
bs.onclick=()=>{sp=sps[(sps.indexOf(sp)+1)%sps.length];bs.textContent=sp+'×'};
bm.onclick=()=>mn.classList.toggle('o');
C.onclick=()=>{if(mn.classList.contains('o'))mn.classList.remove('o');else tg()};

const sk=e=>{const r=pg.getBoundingClientRect();g=cl((e.clientX-r.left)/r.width)*TOT;rd()};
pg.onpointerdown=e=>{dr=1;pg.setPointerCapture(e.pointerId);sk(e)};
pg.onpointermove=e=>{if(dr)sk(e)};
pg.onpointerup=()=>{dr=0};
addEventListener('pointermove',sh);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();tg()}
  else if(e.key==='ArrowLeft')bt.click();
  else if(e.key==='ArrowRight')bn.click();
  else if(e.key==='c'||e.key==='C')bc.click();
  else if(e.key==='m'||e.key==='M')bm.click();
});
</script>
