.sg i{display:block;height:100%;background:var(--ac)}
#rw{display:flex;align-items:center;gap:6px;padding:0 18px 8px}

button:hover{background:#ffffff1a}
button.on{color:var(--ac)}
svg{width:24px;height:24px;fill:currentColor}
#tm{font-size:14px;font-weight:600;margin-left:8px;flex:1;color:#989ba5}
#mn{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);background:#242529f5;border-left:1px solid #4c4f58;padding:18px 8px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}

<div id="st"><canvas id="c"></canvas></div>

<div id="ui">
  <div id="rw">

<script>
// Thiết lập canvas logic 1280x720 và các hàm vẽ, tiện ích toán học dùng chung
const W=1280,H=720,C=document.getElementById('c'),X=C.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=v=>{v=cl(v);return v*v*(3-2*v)};
const sg=(t,a,b)=>sm((t-a)/(b-a));
const mx=(a,b,k)=>a+(b-a)*k;
const mp=(a,b,p,q)=>v=>p+(q-p)*(v-a)/(b-a);
const f=(v,d=1)=>v.toFixed(d).replace('.',',');
const col={fg:'#dcdde2',dim:'#989ba5',b:'#78a9d6',o:'#df9368',g:'#7cc99c',y:'#e5b91a',r:'#d97373',p:'#a996cf',card:'#35373d',card2:'#26272b',bd:'#4c4f58',axis:'#545760'};

let FA=1;
const al=a=>{X.globalAlpha=cl(a===undefined?1:a)*FA};
function T(s,x,y,z,c,a,o){al(o);X.fillStyle=c||col.fg;X.font=`${z>=34?800:600} ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;X.textAlign=a||'left';X.textBaseline='middle';X.fillText(s,x,y)}
function L(a,b,c,d,k,w,o,ds){al(o);X.strokeStyle=k;X.lineWidth=w||2;X.setLineDash(ds||[]);X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke();X.setLineDash([])}
function R(x,y,w,h,c,o){al(o);X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c,o,st){
  al(o);X.beginPath();X.roundRect(x,y,w,h,r);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
function D(x,y,r,c,o,st){
  al(o);X.beginPath();X.arc(x,y,r,0,Math.PI*2);
  if(st){X.fillStyle='#2c2d31';X.fill();X.strokeStyle=c;X.lineWidth=st;X.stroke()}
  else{X.fillStyle=c;X.fill()}
}
const hd=s=>T(s,80,58,35,col.y);

// Bộ sinh số giả ngẫu nhiên cố định seed và dữ liệu mô phỏng Tuần 01
function mkRng(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function mkNorm(rnd){
  return ()=>{
    const u=Math.max(1e-7,rnd()),v=rnd();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  };
}

// Dữ liệu mô phỏng W01-R02: Động lực -> giờ học & GPA (giờ học KHÔNG có trong công thức GPA)
const gpaSim=(()=>{
  const rnd=mkRng(42),gn=mkNorm(rnd),pts=[];
  for(let i=0;i<180;i++){
    const dl=gn();
    const gh=cl(12+4*dl+gn()*3,0,26);
    const gpa=cl(3.0+0.35*dl+gn()*0.28,1.6,4.0);
    pts.push([gh,gpa,dl]);
  }
  return pts;
})();

// Dữ liệu mô phỏng W01-CH06: 100 thiết bị x 1000 lần đo vs 100.000 thiết bị độc lập (300 lần lặp)
const repSim=(()=>{
  const rnd=mkRng(1006),gn=mkNorm(rnd);
  const bRep=new Array(24).fill(0),bInd=new Array(24).fill(0);
  // SD lý thuyết: đo lặp = sqrt(2*(5^2/50 + 1^2/50000)) ≈ 1.000; độc lập = sqrt(2*(26/50000)) ≈ 0.032
  for(let i=0;i<300;i++){
    const d1=gn()*1.005;
    const i1=Math.floor((d1+3.2)/6.4*24);
    if(i1>=0&&i1<24)bRep[i1]++;
    const d2=gn()*0.031;
    const i2=Math.floor((d2+3.2)/6.4*24);
    if(i2>=0&&i2<24)bInd[i2]++;
  }
  const mx1=Math.max(...bRep);
  return {rep:bRep.map(v=>v/mx1),ind:bInd};
})();

// Danh sách 17 cảnh tương tác của Tuần 01
const sc=[
{
  t:'1. Dữ liệu ghi gì & Nói đến đâu?',d:24,
  s:[
    [0,'Chào mừng bạn đến với Tuần 01: Câu hỏi và dữ liệu — bước đầu tiên trước khi tính bất kỳ con số nào!'],
    [5,'Trong khảo sát lớp STAT 20 (Berkeley), 70% người trả lời nói họ chưa từng viết code. Cùng con số 70% nhưng có hai câu nói rất khác nhau:'],
    [11,'Câu (1) chỉ nói về người ĐÃ TRẢ LỜI khảo sát — đó là TÓM TẮT. Câu (2) suy rộng ra TOÀN BỘ sinh viên Berkeley — đó là TỔNG QUÁT HÓA!'],
    [17.5,'Một bảng dữ liệu không tự nhiên mà có: nó sinh ra từ QUÁ TRÌNH TẠO DỮ LIỆU (đo ai, đo gì, đo mấy lần, có can thiệp hay chỉ quan sát).']
  ],
  f:t=>{
    hd('1. Hai câu hỏi gốc: Dữ liệu ghi gì & Cho phép nói đến đâu?');
    T('UET.MAT1052 — Tuần 01: Câu hỏi → Quá trình tạo dữ liệu → Dữ liệu → Khẳng định',80,104,20,col.dim);

    // W01-Q01: Cùng con số 70%, hai câu nói khác nhau
    const o1=sg(t,2,3.5),o2=sg(t,7,8.5);
    RR(80,148,540,185,12,col.card,o1);RR(80,148,540,185,12,col.bd,o1,1.5);R(80,160,3.5,161,col.g,o1);
    T('Câu (1): Tóm tắt (Summary)',110,184,21,col.g,'left',o1);
    T('"70% người trả lời khảo sát chưa viết code."',110,232,19,col.fg,'left',o1);
    T('→ Chỉ mô tả đúng những người CÓ TRONG dữ liệu.',110,282,17,col.dim,'left',o1);

    RR(660,148,540,185,12,col.card,o2);RR(660,148,540,185,12,col.bd,o2,1.5);R(660,160,3.5,161,col.o,o2);
    T('Câu (2): Tổng quát hóa (Generalization)',690,184,21,col.o,'left',o2);
    T('"70% sinh viên Berkeley chưa viết code."',690,232,19,col.fg,'left',o2);
    T('→ Suy rộng ra nhóm lớn hơn (tùy vào cách chọn mẫu!).',690,282,17,col.dim,'left',o2);

    // Chuỗi Quá trình tạo dữ liệu bên dưới
    const steps=[
      ['Câu hỏi',col.y,13],
      ['Đơn vị & Biến',col.b,14.5],
      ['Quá trình tạo DL',col.o,16],
      ['Bảng dữ liệu',col.p,17.5],
      ['Khẳng định',col.g,19]
    ];
    steps.forEach(([nm,c,st],i)=>{
      const x=80+i*230,o=sg(t,st,st+1.2);
      RR(x,388,195,84,10,col.card2,o);RR(x,388,195,84,10,c,o,1.8);
      T(nm,x+97,430,19,c,'center',o);
      if(i<4)T('→',x+212,430,24,col.dim,'center',o);
    });
    T('Đọc kết luận của người khác = đi ngược lại: kết luận này đòi hỏi dữ liệu được tạo ra thế nào?',640,522,18,col.y,'center',sg(t,20.5,22));
  }
},
{
  t:'2. Bốn loại khẳng định từ dữ liệu',d:26,
  s:[
    [0,'Mọi kết luận dựa trên dữ liệu trong khóa học này đều xếp vào một trong BỐN LOẠI khẳng định cốt lõi.'],
    [5.5,'1. TÓM TẮT mô tả chính dữ liệu đang có (VD: 36/50 khoản vay trong loan50 có kỳ hạn 36 tháng). 2. TỔNG QUÁT HÓA nói về tổng thể lớn hơn từ một mẫu.'],
    [12.5,'3. NHÂN QUẢ nói rằng chủ động thay đổi X sẽ làm Y thay đổi (VD: bật tiết kiệm pin LÀM máy chạy lâu hơn). 4. DỰ ĐOÁN đoán giá trị chưa biết của MỘT đơn vị mới!'],
    [19.5,'Tuyệt đối KHÔNG phân loại bằng cách dò từ khóa như "sẽ", "thường", "ước tính" — hãy hỏi 3 câu: nói về ai, có can thiệp không, và có đoán cho 1 đơn vị cụ thể không?']
  ],
  f:t=>{
    hd('2. Bốn loại khẳng định: Đừng dò từ khóa, hãy hỏi ý nghĩa!');

    const cards=[
      ['1. Tóm tắt (Summary)','Mô tả CHÍNH dữ liệu đang có','VD: Trong 50 khoản loan50, 36 khoản kỳ hạn 36 tháng.','Độ khó: Cần đo & tính đúng',col.b,1.5],
      ['2. Tổng quát hóa (Generalization)','Nói về một TỔNG THỂ lớn hơn','VD: Từ mẫu 1.000 cử tri, ước tính 52% cả nước ủng hộ.','Độ khó: Cần biết cách lấy mẫu',col.g,6],
      ['3. Nhân quả (Causal claim)','CAN THIỆP đổi X làm Y thay đổi','VD: Bật tiết kiệm pin LÀM điện thoại dùng lâu hơn.','Độ khó: Cần thiết kế tách tác động',col.o,10.5],
      ['4. Dự đoán (Prediction)','Đoán giá trị chưa biết của 1 ĐƠN VỊ','VD: Căn hộ đang rao này sẽ bán được khoảng 3 tỉ.','Độ khó: Kiểm chứng trên ca mới',col.y,15]
    ];
    cards.forEach(([tt,ds,ex,lv,c,st],i)=>{
      const x=80+(i%2)*570,y=130+Math.floor(i/2)*172,o=sg(t,st,st+1.4);
      RR(x,y,545,150,12,col.card,o);RR(x,y,545,150,12,col.bd,o,1.5);R(x,y+12,3.5,126,c,o);
      T(tt,x+26,y+30,20,c,'left',o);
      T(ds,x+26,y+64,18,col.fg,'left',o);
      T(ex,x+26,y+98,15,col.dim,'left',o);
      T(lv,x+26,y+128,15,c,'left',o);
    });

    const oQ=sg(t,19.5,21);
    RR(80,492,1115,52,10,col.card2,oQ);RR(80,492,1115,52,10,col.bd,oQ,1.4);R(80,500,3.5,36,col.y,oQ);
    T('3 câu hỏi phân loại:  (1) Nói về dữ liệu hay tổng thể?   (2) Có can thiệp không?   (3) Có đoán giá trị 1 đơn vị cụ thể?',640,518,17,col.y,'center',oQ);
  }
},
{
  t:'3. Tổng quát hóa vs Dự đoán & Quan hệ 2 biến',d:24,
  s:[
    [0,'Hai chỗ dễ nhầm nhất khi phân loại khẳng định: thứ nhất là phân biệt Tổng quát hóa với Dự đoán (W01-CH01).'],
    [5.5,'Cả hai đều nói về điều chưa quan sát: Nhóm A ước tính TỈ LỆ hộ có Internet toàn thành phố (đặc điểm cả tổng thể → Tổng quát hóa); Nhóm B đoán MỘT hộ mới cụ thể có Internet không (→ Dự đoán)!'],
    [12.5,'Thứ hai là các câu nói về quan hệ hai biến, ví dụ nhiệt độ máy chủ (temperature) và độ trễ (latency):'],
    [18,'Cùng 2 cột nhưng 3 câu khác hẳn nhau: "hay đi cùng nhau" là mô tả MỐI LIÊN HỆ (không phải loại thứ 5!); "biết X đoán Y" là Dự đoán; "tăng X làm tăng Y" là Nhân quả!']
  ],
  f:t=>{
    hd('3. Phân biệt Tổng quát hóa vs Dự đoán & Quan hệ 2 biến');

    // Trên: W01-CH01
    const o1=sg(t,1.5,3);
    RR(80,128,535,165,12,col.card,o1);RR(80,128,535,165,12,col.bd,o1,1.5);R(80,140,3.5,141,col.g,o1);
    T('W01-CH01 — Nhóm A: Tổng quát hóa',108,162,20,col.g,'left',o1);
    T('Mục tiêu: Tỉ lệ hộ có Internet TOÀN THÀNH PHỐ',108,205,17,col.fg,'left',o1);
    T('→ Kết quả là 1 con số mô tả CẢ NHÓM LỚN.',108,252,16,col.dim,'left',o1);

    const o2=sg(t,5.5,7);
    RR(665,128,535,165,12,col.card,o2);RR(665,128,535,165,12,col.bd,o2,1.5);R(665,140,3.5,141,col.y,o2);
    T('W01-CH01 — Nhóm B: Dự đoán',693,162,20,col.y,'left',o2);
    T('Mục tiêu: Hộ mới CỤ THỂ này có Internet không?',693,205,17,col.fg,'left',o2);
    T('→ Đoán giá trị của 1 ĐƠN VỊ (kể cả đang tồn tại!).',693,252,16,col.dim,'left',o2);

    // Dưới: 3 câu về temperature & latency
    const rows=[
      ['Mô tả mối liên hệ','Trong log, lúc nhiệt độ cao thì độ trễ thường cao hơn.','(Tóm tắt / Tổng quát hóa)',col.b,11.5],
      ['Dự đoán','Biết nhiệt độ lúc này, ta đoán độ trễ lần chạy tới.','(Đoán cho 1 ca mới)',col.y,15],
      ['Khẳng định nhân quả','Chủ động tăng nhiệt độ lên thì độ trễ sẽ tăng.','(Có thể SAI nếu do tải nặng!)',col.r,18.5]
    ];
    rows.forEach(([tp,tx,nt,c,st],i)=>{
      const yy=348+i*66,o=sg(t,st,st+1.2);
      RR(80,yy-24,1120,54,10,col.card2,o);RR(80,yy-24,1120,54,10,col.bd,o,1.4);R(80,yy-16,3.5,38,c,o);
      T(tp,108,yy,19,c,'left',o);
      T(tx,365,yy,17,col.fg,'left',o);
      T(nt,1175,yy,16,col.dim,'right',o);
    });
  }
},
{
  t:'4. Dữ liệu thật: Thú cưng Seattle & GSS',d:24,
  s:[
    [0,'Thực hành với hai bộ dữ liệu thật: đầu tiên là danh sách 52.519 giấy phép nuôi thú cưng ở Seattle (seattlepets.csv).'],
    [5.5,'Chó chiếm 35.181 bản ghi (nhiều gấp đôi mèo: 17.294). Trong dữ liệu, tên Lucy phổ biến ở chó (337 ~ 0,96%) hơn mèo (102 ~ 0,59%) → đây là TÓM TẮT.'],
    [12,'Nhưng nếu nói "dữ liệu này phản ánh MỌI thú cưng ở Seattle" là TỔNG QUÁT HÓA rủi ro: mèo nuôi trong nhà ít đăng ký giấy phép hơn chó dắt ra đường!'],
    [18,'Ngược lại ở khảo sát GSS (W01-OI02): nhờ chọn MẪU NGẪU NHIÊN 1.155 người Mỹ (trung bình 1,65 giờ thư giãn/ngày), ta có cơ sở tốt hơn để tổng quát hóa!']
  ],
  f:t=>{
    hd('4. Dữ liệu thật: Giấy phép thú cưng Seattle & Khảo sát GSS');

    // Trái: Biểu đồ seattlepets (52.519 hàng)
    const o1=sg(t,1.5,3),B=445,K=230;
    RR(80,138,545,385,12,col.card2,o1);RR(80,138,545,385,12,col.bd,o1,1.4);
    T('seattlepets.csv (52.519 giấy phép)',352,168,20,col.b,'center',o1);
    L(115,B,590,B,col.axis,2,o1);
    const sp=[['Chó (Dog)',35181,col.b],['Mèo (Cat)',17294,col.o],['Dê / Lợn',44,col.g]];
    sp.forEach(([nm,v,c],i)=>{
      const k=sg(t,2.5+i*1,4+i*1),h=Math.max(4,v/38000*K*k),cx=205+i*150;
      R(cx-42,B-h,84,h,c,.88*k);
      T(v.toLocaleString('vi-VN'),cx,B-h-18,17,c,'center',k);
      T(nm,cx,B+26,17,col.fg,'center',k);
    });
    T('Top 1: Chó = Lucy (337)  |  Mèo = Luna (111)',352,498,16,col.y,'center',sg(t,6,7.5));

    // Phải trên: Ai bị bỏ ra ngoài?
    const o2=sg(t,10,11.5),o3=sg(t,16.5,18);
    RR(660,138,540,180,12,col.card,o2);RR(660,138,540,180,12,col.bd,o2,1.5);R(660,150,3.5,156,col.r,o2);
    T('W01-OI01: Cẩn thận khi Tổng quát hóa!',690,174,20,col.r,'left',o2);

const ST=[];let TOT=0;sc.forEach(s=>{ST.push(TOT);TOT+=s.d});
const idx=()=>Math.max(0,ST.findLastIndex(x=>x<=g));
const $=(q)=>document.querySelector(q);
const pg=$('#pg'),mn=$('#mn'),ui=$('#ui'),sub=$('#sub'),bp=$('#bp'),bt=$('#bt'),bn=$('#bn'),bc=$('#bc'),bs=$('#bs'),bm=$('#bm'),tm=$('#tm');
const ic=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const IP=ic('M8 5v14l11-7z'),IA=ic('M6 19h4V5H6zm8-14v14h4V5z');
bt.innerHTML=ic('M6 6h2v12H6zm3.5 6l8.5 6V6z');
bn.innerHTML=ic('M6 18l8.5-6L6 6zm10-12v12h2V6z');
bm.innerHTML=ic('M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z');

sc.forEach((s,i)=>{
  const e=document.createElement('div');e.className='sg';e.style.flexGrow=s.d;e.innerHTML='<i></i>';pg.appendChild(e);
  const m=document.createElement('div');m.textContent=s.t;m.onclick=()=>{g=ST[i];mn.classList.remove('o');rd()};mn.appendChild(m);
});
const sgs=[...pg.children],mns=[...mn.children];

let g=0,pl=1,cc=1,sp=1,lt=0,ht=0,dr=0;
const sps=[.75,1,1.25,1.5,2];
const ft=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const sh=()=>{ui.classList.remove('h');clearTimeout(ht);if(pl)ht=setTimeout(()=>ui.classList.add('h'),3000)};
const up=()=>{bp.innerHTML=pl?IA:IP;if(!pl)ui.classList.remove('h');else sh()};

function rs(){
  const dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight,r=Math.min(w/W,h/H);
  C.style.width=W*r+'px';C.style.height=H*r+'px';
  C.width=Math.round(W*r*dpr);C.height=Math.round(H*r*dpr);
}
addEventListener('resize',rs);rs();

let lastSub='';
function rd(){
  const k=C.width/W;X.setTransform(k,0,0,k,0,0);X.globalAlpha=1;X.fillStyle='#2c2d31';X.fillRect(0,0,W,H);
  const i=idx(),t=g-ST[i],s=sc[i];
  FA=Math.min(cl(t/.4),cl((s.d-t)/.4));
  s.f(t);
  X.globalAlpha=1;
  sgs.forEach((e,j)=>{e.firstChild.style.width=(j<i?100:j>i?0:cl(t/s.d)*100)+'%'});
  mns.forEach((e,j)=>e.classList.toggle('c',j===i));
  tm.textContent=`${ft(g)} / ${ft(TOT)} · ${s.t}`;
  let tx='';
  if(cc)for(const [a,b] of s.s)if(t>=a)tx=b;
  if(tx!==lastSub){
    lastSub=tx;
    sub.textContent=tx;
    sub.classList.toggle('e',!tx);
  }
}

function lp(n){
  if(lt&&pl){g+=Math.min(.1,(n-lt)/1000)*sp;if(g>=TOT){g=TOT;pl=0;up()}}
  lt=n;rd();requestAnimationFrame(lp);
}
requestAnimationFrame(lp);up();

const tg=()=>{if(g>=TOT)g=0;pl^=1;up()};
bp.onclick=tg;
bt.onclick=()=>{const i=idx();g=ST[g-ST[i]>2?i:Math.max(0,i-1)];sh()};
bn.onclick=()=>{const i=idx();g=i<sc.length-1?ST[i+1]:TOT;sh()};
bc.onclick=()=>{cc^=1;bc.classList.toggle('on',!!cc);lastSub='__';rd()};
bs.onclick=()=>{sp=sps[(sps.indexOf(sp)+1)%sps.length];bs.textContent=sp+'×'};
bm.onclick=()=>mn.classList.toggle('o');
C.onclick=()=>{if(mn.classList.contains('o'))mn.classList.remove('o');else tg()};

const sk=e=>{const r=pg.getBoundingClientRect();g=cl((e.clientX-r.left)/r.width)*TOT;rd()};
pg.onpointerdown=e=>{dr=1;pg.setPointerCapture(e.pointerId);sk(e)};
pg.onpointermove=e=>{if(dr)sk(e)};
pg.onpointerup=()=>{dr=0};
addEventListener('pointermove',sh);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();tg()}
  else if(e.key==='ArrowLeft')bt.click();
  else if(e.key==='ArrowRight')bn.click();
  else if(e.key==='c'||e.key==='C')bc.click();
  else if(e.key==='m'||e.key==='M')bm.click();
});
