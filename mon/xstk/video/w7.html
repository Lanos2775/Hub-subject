<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuần 7: Kỳ vọng, phương sai và xấp xỉ chuẩn</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2c2d31;--fg:#dcdde2;--ac:#e5b91a}

canvas{display:block}

#sub{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);

  padding:10px 20px;
  border-radius:10px;
  background:rgba(36,37,41,.94);
  border:1px solid #4c4f58;
  color:#dcdde2;
  font-size:clamp(14px,1.45vw,19px);
  font-weight:400;
  line-height:1.45;
  text-align:center;
  pointer-events:none;
  transition:opacity .2s;
  z-index:5;
}
#sub.e{opacity:0}
#ui{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:20px 0 0;
  background:linear-gradient(transparent,rgba(32,33,37,.92));
  transition:opacity .3s;
  z-index:10;
}
#ui.h{opacity:0;pointer-events:none}
#pg{display:flex;gap:2px;height:14px;align-items:flex-end;cursor:pointer;touch-action:none}
.sg{flex:1;height:4px;background:#ffffff24;border-radius:0;overflow:hidden;transition:height .15s}
#pg:hover .sg{height:8px}
.sg i{display:block;height:100%;background:var(--ac)}
#rw{display:flex;align-items:center;gap:6px;padding:0 18px 8px}
button{background:none;border:0;color:var(--fg);width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font:600 14px inherit;font-family:inherit}
button:hover{background:#ffffff1a}
button.on{color:var(--ac)}
svg{width:24px;height:24px;fill:currentColor}
#tm{font-size:14px;font-weight:600;margin-left:8px;flex:1;color:#989ba5}
#mn{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);background:#242529f5;border-left:1px solid #4c4f58;padding:18px 8px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}
#mn.o{transform:none}
#mn div{padding:11px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:#dcdde2}
#mn div:hover{background:#ffffff12}
#mn div.c{color:var(--ac);background:#e5b91a18}
</style>
</head>
<body>
<div id="st"><canvas id="c"></canvas></div>
<div id="mn"></div>
<div id="ui">
  <div id="rw">
    <button id="bp" title="Phát/Tạm dừng (Space)"></button>
    <button id="bt" title="Cảnh trước (←)"></button>
    <button id="bn" title="Cảnh sau (→)"></button>
    <span id="tm"></span>
    <button id="bc" class="on" title="Bật/tắt phụ đề (C)">CC</button>
    <button id="bs" title="Tốc độ">1×</button>
    <button id="bm" title="Mục lục (M)"></button>
  </div>
  <div id="pg"></div>
</div>
<div id="sub"></div>

<script>
// Thiết lập canvas logic 1280x720 và các hàm toán học, vẽ đồ thị dùng chung
const W=1280,H=720,C=document.getElementById('c'),X=C.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=v=>{v=cl(v);return v*v*(3-2*v)};
const sg=(t,a,b)=>sm((t-a)/(b-a));
const mx=(a,b,k)=>a+(b-a)*k;
const mp=(a,b,p,q)=>v=>p+(q-p)*(v-a)/(b-a);
const f=(v,d=2)=>v.toFixed(d).replace('.',',');
const col={fg:'#dcdde2',dim:'#989ba5',b:'#78a9d6',o:'#df9368',g:'#7cc99c',y:'#e5b91a',r:'#d97373',p:'#a996cf',card:'#35373d',card2:'#26272b',bd:'#4c4f58',axis:'#545760'};

let FA=1;
const al=a=>{X.globalAlpha=cl(a===undefined?1:a)*FA};
function T(s,x,y,z,c,a,o){al(o);X.fillStyle=c||col.fg;X.font=`${z>=34?800:600} ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;X.textAlign=a||'left';X.textBaseline='middle';X.fillText(s,x,y)}
function L(a,b,c,d,k,w,o,ds){al(o);X.strokeStyle=k;X.lineWidth=w||2;X.setLineDash(ds||[]);X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke();X.setLineDash([])}
function R(x,y,w,h,c,o){al(o);X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c,o,st){
  al(o);X.beginPath();X.roundRect(x,y,w,h,r);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
function D(x,y,r,c,o,st){
  al(o);X.beginPath();X.arc(x,y,r,0,Math.PI*2);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
// Vẽ phân số 2 dòng (tử số trên, gạch ngang, mẫu số dưới), trả về độ rộng khung phân số
function FR(num,den,x,y,z,c,o){
  X.font=`600 ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;
  const w=Math.max(X.measureText(num).width,X.measureText(den).width)+14;
  T(num,x,y-z*.66,z,c,'center',o);
  L(x-w/2,y,x+w/2,y,c||col.fg,1.8,o);
  T(den,x,y+z*.72,z,c,'center',o);
  return w;
}
const hd=s=>T(s,80,58,35,col.y);

// Hàm mật độ chuẩn và xấp xỉ phân phối nhị thức
const npdf=(x,mu=0,sd=1)=>Math.exp(-.5*Math.pow((x-mu)/sd,2))/(sd*Math.sqrt(2*Math.PI));
function comb(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}
function binom(k,n,p){return comb(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k)}

// Bộ sinh số giả ngẫu nhiên cố định seed cho mô phỏng Luật số lớn (xúc xắc)
function mkRng(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const llnPts=(()=>{
  const rnd=mkRng(7007),pts=[];
  let sum=0;
  for(let n=1;n<=1000;n++){
    sum+=Math.floor(rnd()*6)+1;
    if(n<=40||n%10===0)pts.push([n,sum/n]);
  }
  return pts;
})();

// Tạo histogram phân phối trung bình mẫu từ phân phối mũ lệch cho cảnh CLT
const cltHists=(()=>{
  const ns=[1,5,30],out={};
  ns.forEach(n=>{
    const rnd=mkRng(7700+n),bins=new Array(24).fill(0),N=4000;
    for(let i=0;i<N;i++){
      let s=0;for(let j=0;j<n;j++)s+=-Math.log(Math.max(1e-9,1-rnd()));
      const avg=s/n,bi=Math.floor(avg/3*24);
      if(bi>=0&&bi<24)bins[bi]++;
    }
    const mxB=Math.max(...bins);
    out[n]=bins.map(v=>v/mxB);
  });
  return out;
})();

// Vẽ đường cong mật độ và tô diện tích trong [a, b]
function drawCurve(fn,xmin,xmax,mxFn,myFn,c,w,o){
  al(o);X.strokeStyle=c;X.lineWidth=w||2.8;X.beginPath();
  for(let i=0;i<=160;i++){
    const xv=xmin+(xmax-xmin)*i/160,px=mxFn(xv),py=myFn(fn(xv));
    i===0?X.moveTo(px,py):X.lineTo(px,py);
  }
  X.stroke();
}
function fillCurve(fn,a,b,mxFn,myFn,baseY,c,o){
  al(o);X.fillStyle=c;X.beginPath();X.moveTo(mxFn(a),baseY);
  for(let i=0;i<=80;i++){
    const xv=a+(b-a)*i/80;X.lineTo(mxFn(xv),myFn(fn(xv)));
  }
  X.lineTo(mxFn(b),baseY);X.closePath();X.fill();
}

// Danh sách 17 cảnh tương tác của Tuần 07
const sc=[
{
  t:'1. Từ phân phối đến con số tóm tắt',d:22,
  s:[
    [0,'Chào mừng bạn đến với Tuần 07: Kỳ vọng, phương sai, biến ngẫu nhiên liên tục và xấp xỉ chuẩn.'],
    [5,'Biết trọn vẹn bảng phân phối là lý tưởng, nhưng thường ta cần hai con số tóm tắt nhanh: giá trị trung tâm và mức độ phân tán.'],
    [11,'Kỳ vọng E[X] đo vị trí trung tâm (trung bình dài hạn); còn phương sai Var(X) và độ lệch chuẩn SD(X) đo mức độ trải rộng quanh trung tâm.'],
    [17,'Nửa sau buổi học, ta mở rộng sang biến liên tục (Đều, Chuẩn, Mũ) và cầu nối quan trọng nhất thống kê: Định lý giới hạn trung tâm!']
  ],
  f:t=>{
    hd('1. Tóm tắt phân phối & Mở rộng sang biến liên tục');
    T('UET.MAT1052 — Tuần 07: Kỳ vọng, Phương sai, Luật số lớn & Định lý giới hạn trung tâm',80,104,19,col.dim);

    const blocks=[
      ['1. Kỳ vọng E[X]','Vị trí trung tâm / Trọng tâm','Trung bình dài hạn khi lặp lại vô hạn',col.y,1.5],
      ['2. Phương sai & SD','Mức độ phân tán quanh μ','SD(X) = √Var(X) cùng đơn vị với X',col.o,5.5],
      ['3. Biến liên tục (PDF)','Đều · Chuẩn · Mũ','Xác suất = Diện tích dưới đường mật độ',col.b,9.5],
      ['4. LLN & CLT','Hội tụ & Xấp xỉ Chuẩn','Trung bình mẫu → μ và tiến về chuông chuẩn',col.g,13.5]
    ];
    blocks.forEach(([tt,sub1,sub2,c,st],i)=>{
      const x=85+(i%2)*570,y=165+Math.floor(i/2)*190,o=sg(t,st,st+1.4);
      RR(x,y,540,155,12,col.card,o);RR(x,y,540,155,12,col.bd,o,1.5);R(x,y+14,3.5,127,c,o);
      T(tt,x+28,y+44,24,c,'left',o);
      T(sub1,x+28,y+88,21,col.fg,'left',o);
      T(sub2,x+28,y+124,17,col.dim,'left',o);
    });
  }
},
{
  t:'2. Kỳ vọng E[X] là điểm cân bằng',d:24,
  s:[
    [0,'Kỳ vọng của biến ngẫu nhiên rời rạc X là trung bình có trọng số theo xác suất: E[X] = ∑ x · P(X = x).'],
    [5.5,'Về mặt vật lý, E[X] chính là điểm tựa trọng tâm làm cho thanh bập bênh chứa các khối xác suất đứng thăng bằng!'],
    [11,'Xét hộp [1, 2, 2, 3, 4] có PMF (0,2 ; 0,4 ; 0,2 ; 0,2): kỳ vọng E[X] = 1·0,2 + 2·0,4 + 3·0,2 + 4·0,2 = 2,4.'],
    [17,'Lưu ý quan trọng: E[X] = 2,4 không nhất thiết là một giá trị mà X có thể nhận (ví dụ gieo xúc xắc có E[X] = 3,5).'],
    [20.5,'Ta cũng ký hiệu kỳ vọng là μ; đây là hằng số đặc trưng của mô hình, không phải biến ngẫu nhiên.']
  ],
  f:t=>{
    hd('2. Kỳ vọng E[X] = ∑ x · P(X = x) như điểm cân bằng');
    T('Ví dụ hộp 5 lá thăm [1, 2, 2, 3, 4] → E[X] = 1(0,2) + 2(0,4) + 3(0,2) + 4(0,2) = 2,4',80,104,20,col.dim);

    const m=mp(0.5,4.5,160,1120),B=425,K=420;
    const pivot=mx(1.5,2.4,sg(t,4,9));
    const tilt=(2.4-pivot)*.06;

    X.save();
    X.translate(m(pivot),B);
    X.rotate(tilt);
    L(m(0.7)-m(pivot),0,m(4.3)-m(pivot),0,col.fg,4);
    const pmf=[[1,.2,col.b],[2,.4,col.o],[3,.2,col.b],[4,.2,col.b]];
    pmf.forEach(([v,p,c])=>{
      const rx=m(v)-m(pivot),h=p*K;
      R(rx-38,-h,76,h,c,.88);
      T(f(p,1),rx,-h-16,18,c,'center');
      T(String(v),rx,24,20,col.fg,'center');
    });
    X.restore();

    // Điểm tựa tam giác tại pivot
    const px=m(pivot);
    al(1);X.fillStyle=col.y;X.beginPath();X.moveTo(px,B+3);X.lineTo(px-20,B+42);X.lineTo(px+20,B+42);X.closePath();X.fill();
    T(`Điểm tựa = ${f(pivot,2)}`,px,B+68,21,col.y,'center');
    T('Cân bằng hoàn hảo tại μ = E[X] = 2,40',640,545,22,col.g,'center',sg(t,9.5,11));
  }
},
{
  t:'3. Tuyến tính của kỳ vọng',d:24,
  s:[
    [0,'Tính chất quyền năng nhất của kỳ vọng là tính tuyến tính: E[aX + b] = a·E[X] + b.'],
    [5,'Và kỳ vọng của tổng luôn bằng tổng các kỳ vọng: E[X + Y] = E[X] + E[Y] — NGAY CẢ KHI X và Y KHÔNG ĐỘC LẬP!'],
    [11,'Nhờ đó ta tính cực nhanh kỳ vọng của các họ phân phối: với Nhị thức Bin(n, p) là tổng n biến Bernoulli, ta có ngay E[X] = np.'],
    [17,'Với Siêu bội Hypergeom(N, K, n), dù các lần rút phụ thuộc nhau nhưng mỗi lần đều có P(tốt) = K/N, nên E[X] vẫn bằng n·(K/N)!'],
    [21,'Cẩn thận: với hàm phi tuyến như X², nói chung E[X²] ≠ (E[X])² — phần chênh lệch chính là phương sai!']
  ],
  f:t=>{
    hd('3. Tính tuyến tính của kỳ vọng (không cần độc lập!)');

    const o1=sg(t,1,2.5),o2=sg(t,4.5,6);
    RR(85,140,535,145,12,col.card,o1);RR(85,140,535,145,12,col.bd,o1,1.5);R(85,153,3.5,119,col.y,o1);
    T('Biến đổi tuyến tính',115,176,20,col.y,'left',o1);
    T('E[aX + b] = a · E[X] + b',115,222,28,col.fg,'left',o1);
    T('VD: Y = 2X − 3 ⇒ E[Y] = 2·E[X] − 3',115,260,18,col.dim,'left',o1);

    RR(660,140,535,145,12,col.card,o2);RR(660,140,535,145,12,col.bd,o2,1.5);R(660,153,3.5,119,col.g,o2);
    T('Tổng các biến ngẫu nhiên',690,176,20,col.g,'left',o2);
    T('E[X + Y] = E[X] + E[Y]',690,222,28,col.fg,'left',o2);
    T('✓ Đúng MỌI LÚC, không cần độc lập!',690,260,18,col.g,'left',o2);

    const apps=[
      ['Bernoulli(p)','E[X] = p','X ∈ {0, 1}',col.b,9],
      ['Binomial(n, p)','E[X] = n · p','Tổng n biến Bernoulli',col.y,11.5],
      ['Hypergeom(N, K, n)','E[X] = n · (K/N)','Phụ thuộc vẫn cộng được!',col.g,14],
      ['Poisson(λ)','E[X] = λ','Tốc độ trung bình trên khoảng',col.o,16.5]
    ];
    apps.forEach(([nm,fm,nt,c,st],i)=>{
      const yy=335+i*48,o=sg(t,st,st+1.2);
      RR(85,yy-20,1110,42,8,col.card2,o);RR(85,yy-20,1110,42,8,col.bd,o,1.2);R(85,yy-12,3.5,26,c,o);
      T(nm,112,yy,19,c,'left',o);
      T(fm,450,yy,21,col.fg,'left',o);
      T(nt,780,yy,18,col.dim,'left',o);
    });
    T('Cảnh báo: E[X²] ≠ (E[X])²  (hàm phi tuyến không đẩy E vào trong được!)',640,545,19,col.r,'center',sg(t,19.5,21));
  }
},
{
  t:'4. Phương sai Var(X) & Độ lệch chuẩn SD(X)',d:24,
  s:[
    [0,'Hai phân phối có thể có cùng kỳ vọng μ = 0 nhưng mức độ rủi ro hoàn toàn khác nhau: ta cần đo độ phân tán quanh μ.'],
    [5.5,'Phương sai là trung bình bình phương độ lệch quanh kỳ vọng: Var(X) = E[(X − μ)²] = E[X²] − (E[X])².'],
    [11,'Vì phương sai có đơn vị bình phương (ví dụ VNĐ²), ta lấy căn bậc hai để được độ lệch chuẩn SD(X) = σ = √Var(X) cùng đơn vị với X.'],
    [17,'Khi đổi thang đo Y = aX + b: cộng hằng số b chỉ tịnh tiến phân phối nên KHÔNG đổi phương sai; nhân a làm Var nhân a² và SD nhân |a|.'],
    [21,'Ví dụ với Bin(n, p): Var(X) = np(1 − p); với Poisson(λ): Var(X) = λ (bằng đúng kỳ vọng!).']
  ],
  f:t=>{
    hd('4. Phương sai Var(X) và Độ lệch chuẩn SD(X)');

    // Minh họa 2 phân phối cùng μ = 0, khác σ
    const m=mp(-4.5,4.5,110,600),B=455,y=mp(0,.6,B,175);
    L(95,B,615,B,col.axis,2);
    T('Cùng kỳ vọng μ = 0, khác độ lệch chuẩn σ',355,145,20,col.fg,'center');
    fillCurve(x=>npdf(x,0,.7),-4.2,4.2,m,y,B,col.b,.22*sg(t,1,2.5));
    drawCurve(x=>npdf(x,0,.7),-4.2,4.2,m,y,col.b,2.8,sg(t,1,2.5));
    fillCurve(x=>npdf(x,0,1.6),-4.2,4.2,m,y,B,col.o,.22*sg(t,3,4.5));
    drawCurve(x=>npdf(x,0,1.6),-4.2,4.2,m,y,col.o,2.8,sg(t,3,4.5));
    L(m(0),175,m(0),B,col.y,1.8,sg(t,2,3),[5,4]);
    T('σ = 0,7 (tập trung)',m(1.3),y(.44),17,col.b,'left',sg(t,2,3.5));
    T('σ = 1,6 (trải rộng)',m(1.9),y(.16),17,col.o,'left',sg(t,4,5.5));
    T('μ = 0',m(0),B+24,18,col.y,'center');

    // Khung công thức bên phải
    const o1=sg(t,5,6.5),o2=sg(t,11,12.5),o3=sg(t,16.5,18);
    RR(660,155,540,115,12,col.card,o1);RR(660,155,540,115,12,col.bd,o1,1.5);R(660,168,3.5,89,col.y,o1);
    T('Định nghĩa & Công thức tính nhanh',688,186,18,col.y,'left',o1);
    T('Var(X) = E[(X − μ)²] = E[X²] − (E[X])²',688,232,21,col.fg,'left',o1);

    RR(660,290,540,105,12,col.card,o2);RR(660,290,540,105,12,col.bd,o2,1.5);R(660,303,3.5,79,col.o,o2);
    T('Độ lệch chuẩn (cùng đơn vị với X)',688,322,18,col.o,'left',o2);
    T('SD(X) = σ = √Var(X) ≥ 0',688,364,23,col.fg,'left',o2);

      T('Z =',x+24,y+64,20,pal.txt,'left',o);
      FR('X − μ','σ',x+102,y+64,18,pal.txt,o);
      T('~ N(0, 1)   |   Quy tắc 68 – 95 – 99,7%',x+152,y+64,16,pal.mut,'left',o);
    });
    card(650,348,'7. Phân phối Mũ Exponential(λ)',15.5,(x,y,o)=>{
      T('f(x) = λ·e⁻λˣ (x≥0)  ;  E[X] = SD(X) =',x+22,y+64,18,pal.txt,'left',o);
      FR('1','λ',x+408,y+64,18,pal.txt,o);
    });
    card(650,466,'8. Định lý giới hạn trung tâm (CLT)',18,(x,y,o)=>{
      T('Zₙ =',x+24,y+64,20,pal.txt,'left',o);
      FR('(X̄ₙ − μ) · √n','σ',x+160,y+64,17,pal.txt,o);
      T('→ N(0, 1)   (Bin → Norm: ±0,5)',x+245,y+64,16,pal.mut,'left',o);
    });
  }
}
];

// ===== Điều khiển trình phát tương tác =====
const ST=[];let TOT=0;sc.forEach(s=>{ST.push(TOT);TOT+=s.d});
const idx=()=>Math.max(0,ST.findLastIndex(x=>x<=g));
const $=(q)=>document.querySelector(q);
const pg=$('#pg'),mn=$('#mn'),ui=$('#ui'),sub=$('#sub'),bp=$('#bp'),bt=$('#bt'),bn=$('#bn'),bc=$('#bc'),bs=$('#bs'),bm=$('#bm'),tm=$('#tm');
const ic=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const IP=ic('M8 5v14l11-7z'),IA=ic('M6 19h4V5H6zm8-14v14h4V5z');
bt.innerHTML=ic('M6 6h2v12H6zm3.5 6l8.5 6V6z');
bn.innerHTML=ic('M6 18l8.5-6L6 6zm10-12v12h2V6z');
bm.innerHTML=ic('M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z');

sc.forEach((s,i)=>{
  const e=document.createElement('div');e.className='sg';e.style.flexGrow=s.d;e.innerHTML='<i></i>';pg.appendChild(e);
  const m=document.createElement('div');m.textContent=s.t;m.onclick=()=>{g=ST[i];mn.classList.remove('o');rd()};mn.appendChild(m);
});
const sgs=[...pg.children],mns=[...mn.children];

let g=0,pl=1,cc=1,sp=1,lt=0,ht=0,dr=0;
const sps=[.75,1,1.25,1.5,2];
const ft=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const sh=()=>{ui.classList.remove('h');clearTimeout(ht);if(pl)ht=setTimeout(()=>ui.classList.add('h'),3000)};
const up=()=>{bp.innerHTML=pl?IA:IP;if(!pl)ui.classList.remove('h');else sh()};

function rs(){
  const dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight,r=Math.min(w/W,h/H);
  C.style.width=W*r+'px';C.style.height=H*r+'px';
  C.width=Math.round(W*r*dpr);C.height=Math.round(H*r*dpr);
}
addEventListener('resize',rs);rs();

let lastSub='';
function rd(){
  const k=C.width/W;X.setTransform(k,0,0,k,0,0);X.globalAlpha=1;X.fillStyle='#2c2d31';X.fillRect(0,0,W,H);
  const i=idx(),t=g-ST[i],s=sc[i];
  FA=Math.min(cl(t/.4),cl((s.d-t)/.4));
  s.f(t);
  X.globalAlpha=1;
  sgs.forEach((e,j)=>{e.firstChild.style.width=(j<i?100:j>i?0:cl(t/s.d)*100)+'%'});
  mns.forEach((e,j)=>e.classList.toggle('c',j===i));
  tm.textContent=`${ft(g)} / ${ft(TOT)} · ${s.t}`;
  let tx='';
  if(cc)for(const [a,b] of s.s)if(t>=a)tx=b;
  if(tx!==lastSub){
    lastSub=tx;
    sub.textContent=tx;
    sub.classList.toggle('e',!tx);
  }
}

function lp(n){
  if(lt&&pl){g+=Math.min(.1,(n-lt)/1000)*sp;if(g>=TOT){g=TOT;pl=0;up()}}
  lt=n;rd();requestAnimationFrame(lp);
}
requestAnimationFrame(lp);up();

const tg=()=>{if(g>=TOT)g=0;pl^=1;up()};
bp.onclick=tg;
bt.onclick=()=>{const i=idx();g=ST[g-ST[i]>2?i:Math.max(0,i-1)];sh()};
bn.onclick=()=>{const i=idx();g=i<sc.length-1?ST[i+1]:TOT;sh()};
bc.onclick=()=>{cc^=1;bc.classList.toggle('on',!!cc);lastSub='__';rd()};
bs.onclick=()=>{sp=sps[(sps.indexOf(sp)+1)%sps.length];bs.textContent=sp+'×'};
bm.onclick=()=>mn.classList.toggle('o');
C.onclick=()=>{if(mn.classList.contains('o'))mn.classList.remove('o');else tg()};

const sk=e=>{const r=pg.getBoundingClientRect();g=cl((e.clientX-r.left)/r.width)*TOT;rd()};
pg.onpointerdown=e=>{dr=1;pg.setPointerCapture(e.pointerId);sk(e)};
pg.onpointermove=e=>{if(dr)sk(e)};
pg.onpointerup=()=>{dr=0};
addEventListener('pointermove',sh);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();tg()}
  else if(e.key==='ArrowLeft')bt.click();
  else if(e.key==='ArrowRight')bn.click();
  else if(e.key==='c'||e.key==='C')bc.click();
  else if(e.key==='m'||e.key==='M')bm.click();
});
</script>
</body>
