<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuần 6: Phân phối xác suất và biến ngẫu nhiên rời rạc</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2c2d31;--fg:#dcdde2;--ac:#e5b91a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden;user-select:none}
#st{position:fixed;inset:0;display:grid;place-items:center}
canvas{display:block}
/* Cố định phụ đề ở sát mép đáy màn hình, không đổi vị trí khi thanh điều khiển ẩn/hiện */
#sub{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  max-width:min(980px,94vw);
  padding:10px 20px;
  border-radius:10px;
  background:rgba(36,37,41,.94);
  border:1px solid #4c4f58;
  color:#dcdde2;
  font-size:clamp(14px,1.45vw,19px);
  font-weight:400;
  line-height:1.45;
  text-align:center;
  pointer-events:none;
  transition:opacity .2s;
  z-index:5;
}
#sub.e{opacity:0}
#ui{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:20px 0 0;
  background:linear-gradient(transparent,rgba(32,33,37,.92));
  transition:opacity .3s;
  z-index:10;
}
#ui.h{opacity:0;pointer-events:none}
#pg{display:flex;gap:2px;height:14px;align-items:flex-end;cursor:pointer;touch-action:none}
.sg{flex:1;height:4px;background:#ffffff24;border-radius:0;overflow:hidden;transition:height .15s}
#pg:hover .sg{height:8px}
.sg i{display:block;height:100%;background:var(--ac)}
#rw{display:flex;align-items:center;gap:6px;padding:0 18px 8px}
button{background:none;border:0;color:var(--fg);width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font:600 14px inherit;font-family:inherit}
button:hover{background:#ffffff1a}
button.on{color:var(--ac)}
svg{width:24px;height:24px;fill:currentColor}
#tm{font-size:14px;font-weight:600;margin-left:8px;flex:1;color:#989ba5}
#mn{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);background:#242529f5;border-left:1px solid #4c4f58;padding:18px 8px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}
#mn.o{transform:none}
#mn div{padding:11px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:#dcdde2}
#mn div:hover{background:#ffffff12}
#mn div.c{color:var(--ac);background:#e5b91a18}
</style>
</head>
<body>
<div id="st"><canvas id="c"></canvas></div>
<div id="mn"></div>
<div id="ui">
  <div id="rw">
    <button id="bp" title="Phát/Tạm dừng (Space)"></button>
    <button id="bt" title="Cảnh trước (←)"></button>
    <button id="bn" title="Cảnh sau (→)"></button>
    <span id="tm"></span>
    <button id="bc" class="on" title="Bật/tắt phụ đề (C)">CC</button>
    <button id="bs" title="Tốc độ">1×</button>
    <button id="bm" title="Mục lục (M)"></button>
  </div>
  <div id="pg"></div>
</div>
<div id="sub"></div>

<script>
// Thiết lập canvas logic 1280x720 và các hàm vẽ, toán học dùng chung
const W=1280,H=720,C=document.getElementById('c'),X=C.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=v=>{v=cl(v);return v*v*(3-2*v)};
const sg=(t,a,b)=>sm((t-a)/(b-a));
const mx=(a,b,k)=>a+(b-a)*k;
const mp=(a,b,p,q)=>v=>p+(q-p)*(v-a)/(b-a);
const f=(v,d=2)=>v.toFixed(d).replace('.',',');
const col={fg:'#dcdde2',dim:'#989ba5',b:'#78a9d6',o:'#df9368',g:'#7cc99c',y:'#e5b91a',r:'#d97373',p:'#a996cf',card:'#35373d',card2:'#26272b',bd:'#4c4f58',axis:'#545760'};

let FA=1;
const al=a=>{X.globalAlpha=cl(a===undefined?1:a)*FA};
function T(s,x,y,z,c,a,o){al(o);X.fillStyle=c||col.fg;X.font=`${z>=34?800:600} ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;X.textAlign=a||'left';X.textBaseline='middle';X.fillText(s,x,y)}
function L(a,b,c,d,k,w,o,ds){al(o);X.strokeStyle=k;X.lineWidth=w||2;X.setLineDash(ds||[]);X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke();X.setLineDash([])}
function R(x,y,w,h,c,o){al(o);X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c,o,st){
  al(o);X.beginPath();X.roundRect(x,y,w,h,r);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
function D(x,y,r,c,o,st){
  al(o);X.beginPath();X.arc(x,y,r,0,Math.PI*2);
  if(st){X.fillStyle='#2c2d31';X.fill();X.strokeStyle=c;X.lineWidth=st;X.stroke()}
  else{X.fillStyle=c;X.fill()}
}
// Vẽ phân số 2 dòng (tử số trên, gạch ngang, mẫu số dưới), trả về độ rộng khung phân số
function FR(num,den,x,y,z,c,o){
  X.font=`600 ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;
  const w=Math.max(X.measureText(num).width,X.measureText(den).width)+14;
  T(num,x,y-z*.66,z,c,'center',o);
  L(x-w/2,y,x+w/2,y,c||col.fg,1.8,o);
  T(den,x,y+z*.72,z,c,'center',o);
  return w;
}
const hd=s=>T(s,80,58,35,col.y);

// Các hàm tính phân phối xác suất rời rạc
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function comb(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}
function binom(k,n,p){return comb(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k)}
function hyper(k,N,K,n){return comb(K,k)*comb(N-K,n-k)/comb(N,n)}
function pois(k,lam){return Math.exp(-lam)*Math.pow(lam,k)/fact(k)}

// Bộ sinh số giả ngẫu nhiên cố định seed cho mô phỏng hộp 5 lá thăm
function mkRng(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const boxSim=(()=>{
  const vals=[1,2,2,3,4],ms=[20,200,2000],out={};
  ms.forEach(m=>{
    const rnd=mkRng(6000+m),cnt=[0,0,0,0];
    for(let i=0;i<m;i++)cnt[vals[Math.floor(rnd()*5)]-1]++;
    out[m]=cnt.map(c=>c/m);
  });
  return out;
})();

// Danh sách 17 cảnh tương tác của Tuần 06
const sc=[
{
  t:'1. Hộp 5 lá thăm & PMF',d:24,
  s:[
    [0,'Chào mừng bạn đến với Tuần 06: Phân phối xác suất và biến ngẫu nhiên rời rạc.'],
    [4.5,'Từ tuần này, ta chuyển từ biến cố trừu tượng sang gán con số cụ thể cho mỗi kết quả ngẫu nhiên.'],
    [9.5,'Xét chiếc hộp gồm 5 lá thăm [1, 2, 2, 3, 4]. Mỗi lá thăm được rút với khả năng như nhau bằng 1/5 = 0,20.'],
    [15,'Vì có hai lá thăm ghi số 2, giá trị 2 xuất hiện với xác suất 2/5 = 0,40; các giá trị 1, 3, 4 có xác suất 0,20.'],
    [20,'Bảng gán xác suất cho từng giá trị có thể của X được gọi là hàm khối xác suất (PMF), và tổng các cột luôn bằng 1.']
  ],
  f:t=>{
    hd('1. Từ hộp 5 lá thăm đến phân phối xác suất');
    T('UET.MAT1052 — Tuần 06: Biến ngẫu nhiên rời rạc & Hàm khối xác suất (PMF)',80,104,20,col.dim);

    // Hộp 5 lá thăm bên trái
    RR(85,180,380,260,14,col.card2,sg(t,1,2));RR(85,180,380,260,14,col.bd,sg(t,1,2),1.8);
    T('Chiếc hộp 5 lá thăm',275,158,21,col.dim,'center',sg(t,1,2));
    const cards=[[1,125,215,col.b],[2,235,215,col.o],[2,345,215,col.o],[3,180,325,col.b],[4,290,325,col.b]];
    cards.forEach(([v,x,y,c],i)=>{
      const o=sg(t,1.5+i*.4,2.8+i*.4);
      RR(x,y,74,88,10,c,.22*o);RR(x,y,74,88,10,c,o,2.5);
      T(String(v),x+37,y+44,34,c,'center',o);
    });
    T('5 lá đồng khả năng (1/5 mỗi lá)',275,472,18,col.dim,'center',sg(t,4,5.5));

    // Biểu đồ cột PMF bên phải
    const m=mp(0.5,4.5,560,1180),B=480,K=620;
    L(540,B,1200,B,col.axis,2);
    const pmf=[[1,.2,col.b],[2,.4,col.o],[3,.2,col.b],[4,.2,col.b]];
    pmf.forEach(([v,p,c],i)=>{
      const k=sg(t,8+i*1.2,9.5+i*1.2),h=p*K*k,px=m(v);
      R(px-42,B-h,84,h,c,.88*k);
      T(f(p,2),px,B-h-18,22,c,'center',k);
      T(`x = ${v}`,px,B+26,20,col.fg,'center',k);
    });
    T('Tổng PMF:  0,2 + 0,4 + 0,2 + 0,2 = 1,00',870,165,22,col.y,'center',sg(t,16,17.5));
  }
},
{
  t:'2. Lý thuyết vs Tần suất mô phỏng',d:24,
  s:[
    [0,'Xác suất lý thuyết là con số của mô hình; tần suất thực nghiệm là tỉ lệ quan sát được sau m lần rút có hoàn lại.'],
    [5.5,'Khi chỉ rút m = 20 lần, tần suất dao động khá mạnh quanh giá trị lý thuyết 0,20 và 0,40.'],
    [11,'Tăng lên m = 200 lần, hình dáng biểu đồ tần suất đã bắt đầu bám sát phân phối lý thuyết.'],
    [16.5,'Đến m = 2.000 lần rút, các cột tần suất gần như trùng khít đường nét đứt lý thuyết.'],
    [20.5,'Mô phỏng kiểm chứng tính toán trong mô hình, còn độ khớp thực tế luôn phụ thuộc vào giả định ban đầu.']
  ],
  f:t=>{
    hd('2. Xác suất lý thuyết vs Tần suất mô phỏng');
    T('Rút có hoàn lại từ hộp [1, 2, 2, 3, 4] với cỡ mẫu m tăng dần (nét đứt = lý thuyết)',80,104,20,col.dim);
    const ms=[20,200,2000],th=[.2,.4,.2,.2],B=475,K=580;

    ms.forEach((mVal,idx)=>{
      const x0=90+idx*385,x1=x0+330,mm=mp(0.5,4.5,x0,x1);
      const o=sg(t,1.5+idx*4.5,3+idx*4.5);
      L(x0-10,B,x1+10,B,col.axis,2,o);
      T(`m = ${mVal} lần rút`,(x0+x1)/2,155,22,col.y,'center',o);
      const emp=boxSim[mVal];
      emp.forEach((v,j)=>{
        const px=mm(j+1),h=v*K*o,ht=th[j]*K;
        const c=j===1?col.o:col.b;
        R(px-24,B-h,48,h,c,.85*o);
        L(px-28,B-ht,px+28,B-ht,col.y,2.2,o,[5,4]);
        T(f(v,2),px,B-h-14,15,c,'center',o);
        T(String(j+1),px,B+22,18,col.fg,'center',o);
      });
    });
    T('Số lần lặp m càng lớn → tần suất tương đối càng ổn định quanh xác suất lý thuyết',640,530,20,col.g,'center',sg(t,18,19.5));
  }
},
{
  t:'3. Tổng 2 xúc xắc (36 cặp)',d:24,
  s:[
    [0,'Gieo hai xúc xắc cân đối độc lập và gọi S là tổng số chấm của hai mặt.'],
    [5,'Không gian mẫu đồng khả năng gồm 6 × 6 = 36 cặp có thứ tự, chứ không phải 11 giá trị tổng từ 2 đến 12.'],
    [10.5,'Số cặp thuận lợi tăng đều từ 1 cách (tổng 2) lên đỉnh 6 cách (tổng 7), rồi giảm đối xứng về 1 cách (tổng 12).'],
    [16.5,'Do đó phân phối PMF của tổng S có dạng tam giác đối xứng, với đỉnh tại S = 7 có xác suất 6/36 = 1/6.'],
    [20.5,'Sai lầm kinh điển là chia đều 1/11 cho mỗi tổng mà quên kiểm tra cấp đồng khả năng!']
  ],
  f:t=>{
    hd('3. Phân phối xác suất của tổng 2 xúc xắc (S = X₁ + X₂)');
    T('36 cặp có thứ tự đồng khả năng → PMF của tổng S có dạng tam giác đối xứng quanh S = 7',80,104,20,col.dim);

    const m=mp(1.5,12.5,110,1170),B=495,K=1700;
    L(90,B,1190,B,col.axis,2);
    for(let s=2;s<=12;s++){
      const cnt=6-Math.abs(s-7),p=cnt/36;
      const k=sg(t,2+Math.abs(s-2)*.7,3.5+Math.abs(s-2)*.7),h=p*K*k,px=m(s);
      const c=s===7?col.y:col.b;
      R(px-30,B-h,60,h,c,.88*k);
      T(`${cnt}/36`,px,B-h-16,16,c,'center',k);
      T(String(s),px,B+26,20,s===7?col.y:col.fg,'center',k);
    }
    T('Đỉnh phân phối: P(S = 7) = 6/36 = 1/6 ≈ 16,67%',640,160,22,col.y,'center',sg(t,12,13.5));
  }
},
{
  t:'4. Quy tắc nhân, cộng & Sơ đồ cây',d:24,
  s:[
    [0,'Để đếm nhanh số kết quả mà không phải liệt kê thủ công, ta dựa vào quy tắc nhân và quy tắc cộng.'],
    [5,'Quy tắc nhân: nếu phép thử gồm r bước nối tiếp nhau với k₁, k₂, …, kᵣ cách chọn, tổng số cách là tích k₁ · k₂ · … · kᵣ.'],
    [11,'Sơ đồ cây bên trái minh họa 3 áo phối với 2 quần: 3 nhánh cấp 1 nhân 2 nhánh cấp 2 tạo ra đúng 6 bộ đồ.'],
    [16.5,'Quy tắc cộng: nếu chia bài toán thành các nhóm rời nhau (không giao nhau), tổng số cách bằng tổng số phần tử từng nhóm.'],
    [20.5,'Lưu ý: chọn nối tiếp từng bước thì NHÂN, chia trường hợp xung khắc thì CỘNG.']
  ],
  f:t=>{
    hd('4. Quy tắc nhân, quy tắc cộng và sơ đồ cây');

    // Sơ đồ cây 3 áo x 2 quần bên trái
    RR(75,305,110,50,10,col.card,sg(t,.8,1.8));RR(75,305,110,50,10,col.bd,sg(t,.8,1.8),1.4);T('Chọn đồ',130,330,18,col.fg,'center',sg(t,.8,1.8));
    const ys=[205,330,455];
    ys.forEach((y1,i)=>{
      const k1=sg(t,1.8+i*.8,3+i*.8);
      L(185,330,mx(185,320,k1),mx(330,y1,k1),col.b,2.4,k1);
      RR(320,y1-22,120,44,10,col.card,k1);RR(320,y1-22,120,44,10,col.b,k1,1.6);
      T(`Áo ${i+1}`,380,y1,18,col.b,'center',k1);
      [-32,32].forEach((dy,j)=>{
        const y2=y1+dy,k2=sg(t,4.5+i*.7+j*.4,6+i*.7+j*.4);
        L(440,y1,mx(440,590,k2),mx(y1,y2,k2),col.fg,2,.7*k2);
        RR(590,y2-18,125,36,8,col.card,k2);RR(590,y2-18,125,36,8,col.bd,k2,1.2);
        T(`Áo ${i+1} + Quần ${j+1}`,652,y2,15,col.fg,'center',k2);
      });
    });

    // Khung công thức bên phải
    const oR=sg(t,7.5,9);
    RR(770,175,435,145,12,col.card,oR);RR(770,175,435,145,12,col.bd,oR,1.5);R(770,188,3.5,119,col.b,oR);
    T('Quy tắc nhân (r bước nối tiếp)',795,212,21,col.b,'left',oR);
    T('Số cách = k₁ · k₂ · … · kᵣ',795,256,25,col.fg,'left',oR);
    T('VD: 3 áo × 2 quần = 6 bộ',795,295,19,col.dim,'left',oR);

    const oR2=sg(t,12,13.5);
    RR(770,350,435,145,12,col.card,oR2);RR(770,350,435,145,12,col.bd,oR2,1.5);R(770,363,3.5,119,col.g,oR2);
    T('Quy tắc cộng (nhóm rời nhau)',795,387,21,col.g,'left',oR2);
    T('Số cách = n₁ + n₂ + … + nₘ',795,431,25,col.fg,'left',oR2);
    T('VD: Đi xe buýt (4) hoặc tàu (2) → 6 cách',795,470,18,col.dim,'left',oR2);
  }
},
{
  t:'5. Chỉnh hợp & Tổ hợp',d:26,
  s:[
    [0,'Khi chọn k phần tử không hoàn lại từ n phần tử phân biệt, câu hỏi đầu tiên luôn là: THỨ TỰ có quan trọng không?'],
    [5.5,'Nếu CÓ thứ tự (ví dụ trao giải Nhất, Nhì, Ba cho 3 trong 5 người), ta dùng chỉnh hợp P(n, k) = n! / (n − k)!.'],
    [11,'Với n = 5, k = 3, số cách xếp giải là 5 × 4 × 3 = 60 cách.'],
    [15.5,'Nếu KHÔNG xét thứ tự (chọn một nhóm 3 người đi thi), mỗi nhóm bị lặp k! = 6 thứ tự, nên ta chia cho k!.'],
    [21,'Ta được tổ hợp C(n, k) = n! / (k!(n − k)!). Với 5 chọn 3, số nhóm chỉ còn 60 / 6 = 10 nhóm.']
  ],
  f:t=>{
    hd('5. Chỉnh hợp P(n, k) và Tổ hợp C(n, k)');
    T('Ví dụ: Chọn k = 3 người từ n = 5 người phân biệt (không hoàn lại)',80,104,20,col.dim);

    const cols=[
      ['CÓ thứ tự — Chỉnh hợp','P(n, k) = n! / (n − k)!','P(5, 3) = 5·4·3 = 60','VD: Giải Nhất – Nhì – Ba',col.b,2],
      ['Mỗi nhóm lặp k! thứ tự','k! = 3! = 6 hoán vị','P(n, k) = k! · C(n, k)','{A,B,C} có 6 cách xếp hàng',col.y,8.5],
      ['KHÔNG thứ tự — Tổ hợp','C(n, k) = n! / (k!(n−k)!)','C(5, 3) = 60 / 6 = 10','VD: Chọn ban tổ chức 3 người',col.g,14.5]
    ];
    cols.forEach(([tt,fm,rs,ex,c,st],i)=>{
      const x=85+i*385,o=sg(t,st,st+1.5);
      RR(x,165,355,255,12,col.card,o);RR(x,165,355,255,12,col.bd,o,1.5);R(x,178,3.5,229,c,o);
      T(tt,x+177,205,19,c,'center',o);
      T(fm,x+177,262,21,col.fg,'center',o);
      T(rs,x+177,322,23,col.y,'center',o);

// ===== Điều khiển trình phát tương tác =====
const ST=[];let TOT=0;sc.forEach(s=>{ST.push(TOT);TOT+=s.d});
const idx=()=>Math.max(0,ST.findLastIndex(x=>x<=g));
const $=(q)=>document.querySelector(q);
const pg=$('#pg'),mn=$('#mn'),ui=$('#ui'),sub=$('#sub'),bp=$('#bp'),bt=$('#bt'),bn=$('#bn'),bc=$('#bc'),bs=$('#bs'),bm=$('#bm'),tm=$('#tm');
const ic=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const IP=ic('M8 5v14l11-7z'),IA=ic('M6 19h4V5H6zm8-14v14h4V5z');
bt.innerHTML=ic('M6 6h2v12H6zm3.5 6l8.5 6V6z');
bn.innerHTML=ic('M6 18l8.5-6L6 6zm10-12v12h2V6z');
bm.innerHTML=ic('M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z');

sc.forEach((s,i)=>{
  const e=document.createElement('div');e.className='sg';e.style.flexGrow=s.d;e.innerHTML='<i></i>';pg.appendChild(e);
  const m=document.createElement('div');m.textContent=s.t;m.onclick=()=>{g=ST[i];mn.classList.remove('o');rd()};mn.appendChild(m);
});
const sgs=[...pg.children],mns=[...mn.children];

let g=0,pl=1,cc=1,sp=1,lt=0,ht=0,dr=0;
const sps=[.75,1,1.25,1.5,2];
const ft=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const sh=()=>{ui.classList.remove('h');clearTimeout(ht);if(pl)ht=setTimeout(()=>ui.classList.add('h'),3000)};
const up=()=>{bp.innerHTML=pl?IA:IP;if(!pl)ui.classList.remove('h');else sh()};

function rs(){
  const dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight,r=Math.min(w/W,h/H);
  C.style.width=W*r+'px';C.style.height=H*r+'px';
  C.width=Math.round(W*r*dpr);C.height=Math.round(H*r*dpr);
}
addEventListener('resize',rs);rs();

let lastSub='';
function rd(){
  const k=C.width/W;X.setTransform(k,0,0,k,0,0);X.globalAlpha=1;X.fillStyle='#2c2d31';X.fillRect(0,0,W,H);
  const i=idx(),t=g-ST[i],s=sc[i];
  FA=Math.min(cl(t/.4),cl((s.d-t)/.4));
  s.f(t);
  X.globalAlpha=1;
  sgs.forEach((e,j)=>{e.firstChild.style.width=(j<i?100:j>i?0:cl(t/s.d)*100)+'%'});
  mns.forEach((e,j)=>e.classList.toggle('c',j===i));
  tm.textContent=`${ft(g)} / ${ft(TOT)} · ${s.t}`;
  let tx='';
  if(cc)for(const [a,b] of s.s)if(t>=a)tx=b;
  if(tx!==lastSub){
    lastSub=tx;
    sub.textContent=tx;
    sub.classList.toggle('e',!tx);
  }
}

function lp(n){
  if(lt&&pl){g+=Math.min(.1,(n-lt)/1000)*sp;if(g>=TOT){g=TOT;pl=0;up()}}
  lt=n;rd();requestAnimationFrame(lp);
}
requestAnimationFrame(lp);up();

const tg=()=>{if(g>=TOT)g=0;pl^=1;up()};
bp.onclick=tg;
bt.onclick=()=>{const i=idx();g=ST[g-ST[i]>2?i:Math.max(0,i-1)];sh()};
bn.onclick=()=>{const i=idx();g=i<sc.length-1?ST[i+1]:TOT;sh()};
bc.onclick=()=>{cc^=1;bc.classList.toggle('on',!!cc);lastSub='__';rd()};
bs.onclick=()=>{sp=sps[(sps.indexOf(sp)+1)%sps.length];bs.textContent=sp+'×'};
bm.onclick=()=>mn.classList.toggle('o');
C.onclick=()=>{if(mn.classList.contains('o'))mn.classList.remove('o');else tg()};

const sk=e=>{const r=pg.getBoundingClientRect();g=cl((e.clientX-r.left)/r.width)*TOT;rd()};
pg.onpointerdown=e=>{dr=1;pg.setPointerCapture(e.pointerId);sk(e)};
pg.onpointermove=e=>{if(dr)sk(e)};
pg.onpointerup=()=>{dr=0};
addEventListener('pointermove',sh);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();tg()}
  else if(e.key==='ArrowLeft')bt.click();
  else if(e.key==='ArrowRight')bn.click();
  else if(e.key==='c'||e.key==='C')bc.click();
  else if(e.key==='m'||e.key==='M')bm.click();
});
