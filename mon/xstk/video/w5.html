<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuần 5: Nền tảng và tính toán xác suất</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0f13;--fg:#f2f4f8;--ac:#4aa3ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden;user-select:none}
#st{position:fixed;inset:0;display:grid;place-items:center}
canvas{display:block}
/* Cố định phụ đề ở sát mép đáy màn hình, không đổi vị trí khi thanh điều khiển ẩn/hiện */
#sub{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  max-width:min(980px,94vw);
  padding:10px 20px;
  border-radius:10px;
  background:rgba(13,15,19,.88);
  border:1px solid rgba(255,255,255,.12);
  color:#f2f4f8;
  font-size:clamp(14px,1.45vw,19px);
  font-weight:400;
  line-height:1.45;
  text-align:center;
  pointer-events:none;
  transition:opacity .2s;
  z-index:5;
}
#sub.e{opacity:0}
#ui{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:20px 0 0;
  background:linear-gradient(transparent,rgba(0,0,0,.86));
  transition:opacity .3s;
  z-index:10;
}
#ui.h{opacity:0;pointer-events:none}
#pg{display:flex;gap:2px;height:14px;align-items:flex-end;cursor:pointer;touch-action:none}
.sg{flex:1;height:4px;background:#ffffff30;border-radius:0;overflow:hidden;transition:height .15s}
#pg:hover .sg{height:8px}
.sg i{display:block;height:100%;background:var(--ac)}
#rw{display:flex;align-items:center;gap:6px;padding:0 18px 8px}
button{background:none;border:0;color:var(--fg);width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font:600 14px inherit;font-family:inherit}
button:hover{background:#ffffff22}
button.on{color:var(--ac)}
svg{width:24px;height:24px;fill:currentColor}
#tm{font-size:14px;font-weight:600;margin-left:8px;flex:1}
#mn{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);background:#14171df2;padding:18px 8px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}
#mn.o{transform:none}
#mn div{padding:11px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
#mn div:hover{background:#ffffff18}
#mn div.c{color:var(--ac)}
</style>
</head>
<body>
<div id="st"><canvas id="c"></canvas></div>
<div id="mn"></div>
<div id="ui">
  <div id="rw">
    <button id="bp" title="Phát/Tạm dừng (Space)"></button>
    <button id="bt" title="Cảnh trước (←)"></button>
    <button id="bn" title="Cảnh sau (→)"></button>
    <span id="tm"></span>
    <button id="bc" class="on" title="Bật/tắt phụ đề (C)">CC</button>
    <button id="bs" title="Tốc độ">1×</button>
    <button id="bm" title="Mục lục (M)"></button>
  </div>
  <div id="pg"></div>
</div>
<div id="sub"></div>

<script>
// Thiết lập canvas logic 1280x720 và các hàm vẽ, tiện ích toán học dùng chung
const W=1280,H=720,C=document.getElementById('c'),X=C.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=v=>{v=cl(v);return v*v*(3-2*v)};
const sg=(t,a,b)=>sm((t-a)/(b-a));
const mx=(a,b,k)=>a+(b-a)*k;
const mp=(a,b,p,q)=>v=>p+(q-p)*(v-a)/(b-a);
const f=(v,d=2)=>v.toFixed(d).replace('.',',');
const col={fg:'#f2f4f8',dim:'#9aa4b5',b:'#4aa3ff',o:'#ff8a5b',g:'#4fd1a1',y:'#ffd166',r:'#ff6b6b',p:'#b794f4'};

let FA=1;
const al=a=>{X.globalAlpha=cl(a===undefined?1:a)*FA};
function T(s,x,y,z,c,a,o){al(o);X.fillStyle=c||col.fg;X.font=`${z>=34?800:600} ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;X.textAlign=a||'left';X.textBaseline='middle';X.fillText(s,x,y)}
function L(a,b,c,d,k,w,o,ds){al(o);X.strokeStyle=k;X.lineWidth=w||2;X.setLineDash(ds||[]);X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke();X.setLineDash([])}
function R(x,y,w,h,c,o){al(o);X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c,o,st){
  al(o);X.beginPath();X.roundRect(x,y,w,h,r);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
function D(x,y,r,c,o,st){
  al(o);X.beginPath();X.arc(x,y,r,0,Math.PI*2);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
// Vẽ phân số 2 dòng (tử số trên, gạch ngang, mẫu số dưới), trả về độ rộng khung phân số
function FR(num,den,x,y,z,c,o){
  X.font=`600 ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;
  const w=Math.max(X.measureText(num).width,X.measureText(den).width)+14;
  T(num,x,y-z*.66,z,c,'center',o);
  L(x-w/2,y,x+w/2,y,c||col.fg,1.8,o);
  T(den,x,y+z*.72,z,c,'center',o);
  return w;
}
const hd=s=>T(s,80,58,35);

// Bộ sinh số ngẫu nhiên cố định hạt giống để mô phỏng De Méré ổn định
const rg=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rDM=rg(4200);
const DM_STEPS=180,DM_MAX=10000;
const dmX=Array.from({length:DM_STEPS},(_,i)=>Math.max(1,Math.round(Math.pow(DM_MAX,i/(DM_STEPS-1)))));
const dmG1=[],dmG2=[];
{
  let w1=0,w2=0,idx=0;
  for(let n=1;n<=DM_MAX;n++){
    let ok1=false,ok2=false;
    for(let j=0;j<4;j++)if(Math.floor(rDM()*6)===5)ok1=true;
    for(let j=0;j<24;j++)if(Math.floor(rDM()*6)===5&&Math.floor(rDM()*6)===5)ok2=true;
    if(ok1)w1++;if(ok2)w2++;
    while(idx<DM_STEPS&&n===dmX[idx]){dmG1.push(w1/n);dmG2.push(w2/n);idx++}
  }
}

// Dữ liệu 6 lỗi hay gặp ở cảnh cuối (bám sát mục 8 Tuần 05)
const ER=[
  ['Coi P(A | B) và P(B | A) là giống nhau','Xác định rõ mẫu số (biến cố sau dấu |) trước khi tính'],
  ['Coi hai biến cố xung khắc là độc lập','Xung khắc với xác suất dương thì rất phụ thuộc nhau'],
  ['Nhân xác suất P(A)·P(B) khi chưa kiểm tra độc lập','Luôn viết P(A)·P(B | A); chỉ bỏ điều kiện khi có độc lập'],
  ['Cộng thẳng xác suất của các biến cố có thể cùng xảy ra','Dùng quy tắc phần bù hoặc quy tắc cộng P(A)+P(B)−P(A∩B)'],
  ['Dùng |A|/|Ω| khi các kết quả không đồng khả năng','Liệt kê lại ở cấp đồng khả năng (từng vé, từng cặp có thứ tự)'],
  ['Viết P(A | B̄) = 1 − P(A | B) hoặc trung bình cộng đơn giản','Phần bù chỉ áp cho biến cố trước |; dùng xác suất toàn phần']
];

// Danh sách 16 cảnh bao phủ toàn bộ giáo trình Tuần 05
const sc=[
{
  h:'Hai trò chơi của De Méré',d:30,ad:18,
  sub:[
    [0,5,'Chào các bạn. Tuần 05 mở đầu phần lý thuyết xác suất: làm sao gán một con số cho sự không chắc chắn và cập nhật nó khi có thông tin mới?'],
    [5,10,'Hãy bắt đầu bằng câu chuyện lịch sử của De Méré thế kỷ 17 với hai trò chơi xúc xắc cân đối và độc lập.'],
    [10,15,'Trò 1: gieo 1 xúc xắc 4 lần, thắng nếu có ít nhất một mặt 6. Trò 2: gieo 2 xúc xắc 24 lần, thắng nếu có ít nhất một cặp (6, 6).'],
    [15,20,'De Méré lập luận: trò 1 có xác suất 4 × 1/6 = 2/3, trò 2 có 24 × 1/36 = 2/3, nên hai trò như nhau và đều có lợi!'],
    [20,25,'Nhưng khi máy tính mô phỏng 50.000 ván: Trò 1 thắng 51,6% (lớn hơn 1/2), còn Trò 2 chỉ thắng 49,1% (nhỏ hơn 1/2)!'],
    [25,30,'Vì sao lập luận 2/3 lại sai? Bởi các biến cố “ra 6 ở lần thứ i” có thể cùng xảy ra, nên cộng thẳng đã đếm lặp các ván có nhiều mặt 6.']
  ],
  f:t=>{
    hd('1. Nghịch lý De Méré: hai trò chơi xúc xắc');
    T('Trò 1: gieo 1 xúc xắc 4 lần (ít nhất một mặt 6)   ·   Trò 2: gieo 2 xúc xắc 24 lần (ít nhất một cặp 6-6)',80,112,21,col.dim,'left',sg(t,.3,1.5));
    // Khung lập luận sai bên trái
    const oL=sg(t,1.5,3);
    RR(85,165,430,305,14,'#181d26',oL);RR(85,165,430,305,14,col.r,oL,2);
    T('Lập luận sai của De Méré',300,205,23,col.r,'center',oL);
    T('Trò 1:  4 × (1/6) = 2/3 ≈ 66,7%',120,268,22,col.fg,'left',sg(t,3,4.2));
    T('Trò 2:  24 × (1/36) = 2/3 ≈ 66,7%',120,318,22,col.fg,'left',sg(t,4.2,5.4));
    T('✗ Cộng thẳng các biến cố có thể',120,382,20,col.y,'left',sg(t,12.5,14));
    T('  cùng xảy ra → bị đếm lặp!',120,414,20,col.y,'left',sg(t,12.5,14));

    // Biểu đồ mô phỏng 50.000 ván bên phải
    const B=480,y=mp(0,.75,B,170);
    L(575,B,1185,B,'#3a4150',2);
    L(575,y(.5),1185,y(.5),col.y,2,sg(t,6.5,7.5),[8,6]);
    T('0,50 (hòa vốn)',1185,y(.5)-18,18,col.y,'right',sg(t,6.5,7.5));
    const bars=[
      ['Trò 1 (mô phỏng)',.51644,col.b,735,7.5],
      ['Trò 2 (mô phỏng)',.49092,col.o,995,9.5]
    ];
    bars.forEach(([lb,val,c,cx,st])=>{
      const h=(B-y(val))*sg(t,st,st+2);
      R(cx-68,B-h,136,h,c,.88);
      T(f(val*100,2)+'%',cx,B-h-22,23,c,'center',sg(t,st+1.5,st+2.5));
      T(lb,cx,B+28,20,col.fg,'center',sg(t,6.5,7.5));
    });
    // Cột mờ 2/3 để đối chiếu
    L(575,y(2/3),1185,y(2/3),col.r,1.8,sg(t,5.5,6.5),[4,6]);
    T('De Méré đoán: 2/3 = 66,7%',1185,y(2/3)-16,17,col.r,'right',sg(t,5.5,6.5));
    T('Kết quả 50.000 ván mô phỏng: Trò 1 có lợi (> 1/2), Trò 2 bất lợi (< 1/2)',640,582,23,col.y,'center',sg(t,14,15.5));
  }
},
{
  h:'Không gian mẫu & sơ đồ Venn',d:30,ad:18,
  sub:[
    [0,5,'Để tính toán chính xác, ta cần ngôn ngữ tập hợp. Không gian mẫu Ω là tập MỌI kết quả có thể của phép thử; mỗi biến cố là một tập con của Ω.'],
    [5,10,'Ví dụ gieo một xúc xắc: Ω = {1, 2, 3, 4, 5, 6}. Đặt A = {2, 4, 6} (ra số chẵn) và B = {4, 5, 6} (ra số không nhỏ hơn 4).'],
    [10,15,'Trên sơ đồ Venn, hình chữ nhật là Ω, hai vòng tròn là A và B, chia Ω thành bốn miền rời nhau chứa các phần tử 2; 4 và 6; 5; 1 và 3.'],
    [15,20,'A hợp B (A ∪ B) gồm 2, 4, 5, 6 — chữ “hoặc” trong xác suất LUÔN bao gồm cả trường hợp hai biến cố cùng xảy ra.'],
    [20,25,'A giao B (A ∩ B) là phần chồng lên nhau gồm 4 và 6 (cả hai cùng xảy ra). Phần bù Ā gồm 1, 3, 5; còn A trừ B chỉ còn 2.'],
    [25,30,'Lưu ý phân biệt tập và số: A ∪ B là phép toán trên tập hợp, P(A) + P(B) là phép cộng hai con số. Không bao giờ viết A + B hay P(A) ∪ P(B)!']
  ],
  f:t=>{
    hd('2. Không gian mẫu Ω, biến cố và sơ đồ Venn');
    T('Gieo 1 xúc xắc: Ω = {1, 2, 3, 4, 5, 6},  A = {2, 4, 6} (chẵn),  B = {4, 5, 6} (≥ 4)',80,112,22,col.dim,'left',sg(t,.3,1.5));
    // Sơ đồ Venn bên trái
    const oV=sg(t,1.5,3);
    RR(85,165,580,320,14,'#141821',oV);RR(85,165,580,320,14,'#4a5568',oV,2);
    T('Ω',110,192,24,col.dim,'left',oV);
    D(295,325,118,col.b,.28*sg(t,2.5,4));D(295,325,118,col.b,sg(t,2.5,4),2.5);
    D(435,325,118,col.o,.28*sg(t,3.5,5));D(435,325,118,col.o,sg(t,3.5,5),2.5);
    T('A (chẵn)',235,195,21,col.b,'center',sg(t,2.5,4));
    T('B (≥ 4)',495,195,21,col.o,'center',sg(t,3.5,5));
    T('2',240,325,30,col.fg,'center',sg(t,5,6));
    T('4, 6',365,325,30,col.y,'center',sg(t,6,7));
    T('5',490,325,30,col.fg,'center',sg(t,5,6));
    T('1, 3',610,445,26,col.dim,'center',sg(t,6.5,7.5));

    // Các phép toán bên phải
    const ops=[
      ['A ∪ B (A hoặc B)','{2, 4, 5, 6}',col.b,8],
      ['A ∩ B (A và B)','{4, 6}',col.y,9.5],
      ['Ā = Ω \\ A (không A)','{1, 3, 5}',col.g,11],
      ['A \\ B (chỉ A)','{2}',col.o,12.5]
    ];
    ops.forEach(([nm,vl,c,st],i)=>{
      const yy=205+i*72,o=sg(t,st,st+1.2);
      RR(710,yy-26,490,54,10,'#181d26',o);RR(710,yy-26,490,54,10,c,o,1.8);
      T(nm,732,yy,21,c,'left',o);
      T(vl,1178,yy,22,col.fg,'right',o);
    });
    T('A là TẬP kết quả (dùng ∪, ∩)   ·   P(A) là CON SỐ trong [0, 1] (dùng +, −)',640,582,23,col.y,'center',sg(t,14.5,16));
  }
},
{
  h:'Xung khắc, đối nhau & De Morgan',d:32,ad:18,
  sub:[
    [0,5,'Hai biến cố gọi là xung khắc nếu chúng không thể cùng xảy ra: A ∩ B = ∅. Hai hình tròn trên sơ đồ Venn nằm tách biệt nhau hoàn toàn.'],
    [5,10.5,'Hai biến cố gọi là đối nhau nếu chúng vừa xung khắc VỪA phủ kín không gian mẫu (B = Ā). Đối nhau thì chắc chắn xung khắc, nhưng ngược lại chưa chắc!'],
    [10.5,16,'Ví dụ một vé hỗ trợ nhận đúng 1 mức: thấp, trung bình, cao, khẩn cấp. Biến cố “thấp” và “cao” xung khắc nhưng KHÔNG đối nhau vì còn 2 mức nữa.'],
    [16,21.5,'Định luật De Morgan giúp dịch câu phủ định: phủ định của (A hoặc B) là (không A VÀ không B); phủ định của (A và B) là (không A HOẶC không B).'],
    [21.5,27,'Hãy phân biệt thật kỹ hai câu nói dễ nhầm: “không bạn nào đi muộn” là Ā ∩ B̄, còn “không đồng thời cả hai đi muộn” là Ā ∪ B̄.'],
    [27,32,'Câu thứ hai vẫn cho phép ĐÚNG MỘT bạn đi muộn! Mẹo kiểm tra chắc chắn nhất là vẽ sơ đồ Venn và tô vùng ứng với câu nói.']
  ],
  f:t=>{
    hd('3. Xung khắc, đối nhau và định luật De Morgan');
    // Bên trái: Sơ đồ xung khắc vs đối nhau
    const o1=sg(t,1,2.5);
    RR(85,145,515,205,14,'#141821',o1);RR(85,145,515,205,14,'#3a4150',o1,2);
    T('Xung khắc (A ∩ B = ∅) ≠ Đối nhau',342,175,21,col.b,'center',o1);
    D(225,260,58,col.b,.28*o1);D(225,260,58,col.b,o1,2.2);T('Thấp',225,260,20,col.fg,'center',o1);
    D(405,260,58,col.o,.28*o1);D(405,260,58,col.o,o1,2.2);T('Cao',405,260,20,col.fg,'center',o1);
    T('Trung bình, Khẩn cấp',342,330,17,col.dim,'center',sg(t,3.5,4.8));

    // Bên trái dưới: Định luật De Morgan
    const o2=sg(t,7,8.5);
    RR(85,375,515,145,14,'#181d26',o2);RR(85,375,515,145,14,col.y,o2,2);
    T('Định luật De Morgan (phủ định đổi ∪ ↔ ∩)',342,410,20,col.y,'center',o2);
    T('¬(A ∪ B) = Ā ∩ B̄     (không A VÀ không B)',115,455,21,col.fg,'left',sg(t,8,9.2));
    T('¬(A ∩ B) = Ā ∪ B̄     (không A HOẶC không B)',115,492,21,col.fg,'left',sg(t,9.2,10.4));

    // Bên phải: Bảng dịch lời nói -> ký hiệu
    const rows=[
      ['Lời nói (A: An muộn, B: Bình muộn)','Ký hiệu'],
      ['Ít nhất một bạn đi muộn','A ∪ B'],
      ['Cả hai bạn cùng đi muộn','A ∩ B'],
      ['Không bạn nào đi muộn','Ā ∩ B̄ = ¬(A ∪ B)'],
      ['Không đồng thời cả hai muộn','Ā ∪ B̄ = ¬(A ∩ B)'],
      ['Chỉ An đi muộn','A ∩ B̄ = A \\ B'],
      ['Đúng một bạn đi muộn','(A ∩ B̄) ∪ (Ā ∩ B)']
    ];
    rows.forEach((r,idx)=>{
      const yy=155+idx*56,o=sg(t,10+idx*.9,11+idx*.9);
      const c=idx===0?col.y:(idx===3||idx===4?col.g:col.fg);
      T(r[0],645,yy,19,c,'left',o);
      T(r[1],1200,yy,19,idx===0?col.y:col.b,'right',o);
      if(idx===0)L(640,yy+22,1205,yy+22,'#3a4150',1.5,o);
    });
    T('“Không đồng thời cả hai” vẫn cho phép đúng một biến cố xảy ra!',640,582,23,col.y,'center',sg(t,15,16.5));
  }
},
{
  h:'Ba tiên đề và hệ quả',d:28,ad:16,
  sub:[

},
{

{
  h:'Quy tắc cộng tổng quát',d:32,ad:18,
  sub:[
    [0,5,'Khi hai biến cố A và B có thể cùng xảy ra (không xung khắc), nếu cộng P(A) + P(B) thì phần giao A ∩ B bị tính tới hai lần.'],
    [5,10.5,'Trừ đi một lần phần chung, ta có Quy tắc cộng tổng quát (bao hàm–loại trừ): P(A ∪ B) = P(A) + P(B) − P(A ∩ B).'],
    [10.5,16,'Vì P(A ∩ B) ≥ 0, tổng P(A) + P(B) luôn lớn hơn hoặc bằng P(A ∪ B) — nó chỉ là chặn trên. Đây chính là lý do De Méré tính ra 2/3!'],
    [16,21.5,'Áp dụng cho ví dụ khảo sát 137 hộ gia đình: 86 hộ dùng Internet (I), 107 hộ dùng truyền hình (T), 69 hộ dùng cả hai và 13 hộ không dùng gì.'],
    [21.5,27,'Theo quy tắc cộng: P(I ∪ T) = (86 + 107 − 69) / 137 = 124 / 137 ≈ 90,51% số hộ dùng ít nhất một dịch vụ.'],
    [27,32,'Kiểm tra lại bằng quy tắc phần bù: 1 − P(không dùng dịch vụ nào) = 1 − 13/137 = 124/137. Hai cách khớp nhau tuyệt đối!']

    T('I: 86 hộ',190,178,21,col.b,'center',oV);

    T('17',195,305,28,col.fg,'center',sg(t,4,5));
    T('69',315,305,32,col.y,'center',sg(t,5,6));
    T('38',435,305,28,col.fg,'center',sg(t,4,5));
    T('Ngoài: 13 hộ',315,442,20,col.dim,'center',sg(t,6,7));

    T('Không TV',885,202,19,col.dim,'center',oT);T('Có TV',1015,202,19,col.o,'center',oT);T('Tổng',1135,202,19,col.y,'center',oT);
    L(620,224,1175,224,'#3a4150',1.5,oT);
    T('Không Internet',625,256,19,col.dim,'left',oT);T('13',885,256,22,col.fg,'center',oT);T('38',1015,256,22,col.fg,'center',oT);T('51',1135,256,22,col.dim,'center',oT);
    T('Có Internet',625,308,19,col.b,'left',oT);T('17',885,308,22,col.fg,'center',oT);T('69',1015,308,24,col.y,'center',oT);T('86',1135,308,22,col.b,'center',oT);

    T('Quy tắc cộng:  (86 + 107 − 69) / 137 = 124/137 ≈ 90,51%',600,398,21,col.g,'left',sg(t,11,12.5));
    T('Kiểm tra bù:   1 − 13/137 = 124/137 ≈ 90,51%',600,446,21,col.b,'left',sg(t,13.5,15));

  }
},
{
  h:'Xác suất có điều kiện',d:30,ad:18,
  sub:[
    [0,5,'Khi biết thêm một thông tin B đã xảy ra, nhóm tham chiếu thu hẹp lại chỉ còn B. Đó là xác suất có điều kiện: P(A | B) = P(A ∩ B) / P(B).'],
    [5,10,'Hãy nhớ quy tắc sống còn: biến cố đứng SAU dấu gạch thẳng “|” luôn là thông tin đã biết và quyết định MẪU SỐ.'],
    [10,15,'Quay lại bảng 137 hộ: nếu biết hộ có Internet (I), ta chỉ nhìn hàng I gồm 86 hộ, trong đó 69 hộ có TV → P(T | I) = 69/86 ≈ 80,23%.'],
    [15,20,'Ngược lại, nếu biết hộ có TV (T), mẫu số đổi thành cột T gồm 107 hộ, trong đó 69 hộ có Internet → P(I | T) = 69/107 ≈ 64,49%.'],

    T('P(Ā | B) = 1 − P(A | B)     ·     Nhưng nói chung  P(A | B̄) ≠ 1 − P(A | B)',640,578,22,col.g,'center',sg(t,14,15.5));
  }
},
{
  h:'Lọc dữ liệu: hai xúc xắc',d:28,ad:16,
  sub:[
    [0,4.5,'Xác suất có điều kiện thực chất giống hệt thao tác lọc dữ liệu trong pandas: lọc giữ các hàng thỏa điều kiện B, rồi mới đếm tỉ lệ thỏa A.'],
    [4.5,9.5,'Xét bài tập W05-BT04: gieo 2 xúc xắc cân đối độc lập. Biết hai mặt KHÁC NHAU (B), tính xác suất có ít nhất một mặt 6 (A).'],
    [9.5,14.5,'Không gian mẫu Ω gồm 36 cặp có thứ tự từ (1,1) đến (6,6), tất cả đều đồng khả năng.'],
    [14.5,19,'Bước lọc: vì biết hai mặt khác nhau, ta loại bỏ hoàn toàn 6 cặp nằm trên đường chéo chính từ (1,1) đến (6,6), chỉ còn lại 30 cặp.'],
    [19,23.5,'Trong 30 cặp còn lại đó, có đúng 10 cặp chứa mặt 6 (gồm 5 cặp hàng 6 và 5 cặp cột 6). Cặp (6,6) đã bị loại!'],
    [23.5,28,'Vậy P(A | B) = 10 / 30 = 1/3. Nếu quên loại cặp (6,6) mà lấy 11/30 là sai tử số.']
  ],
  f:t=>{
    hd('8. Điều kiện hóa = lọc tập tham chiếu (W05-BT04)');
    T('Gieo 2 xúc xắc cân đối. Biết hai mặt khác nhau (B), tính P(có ít nhất một mặt 6 | B)',80,112,22,col.dim,'left',sg(t,.3,1.5));
    // Lưới 6x6 bên trái
    const x0=125,y0=165,sz=58;
    for(let r=1;r<=6;r++){
      T(String(r),x0-24,y0+(r-.5)*sz,20,col.dim,'center');
      T(String(r),x0+(r-.5)*sz,y0-20,20,col.dim,'center');
      for(let c=1;c<=6;c++){
        const diag=r===c,has6=(r===6||c===6)&&!diag;
        const drop=diag?sg(t,4.5,6):0;
        const hi=has6?sg(t,8,9.5):0;
        const cx=x0+(c-1)*sz,cy=y0+(r-1)*sz;
        const bg=diag?col.r:(hi>.5?col.g:'#1d2432');
        const op=diag?(.22+.25*(1-drop)):(has6?(.35+.55*hi):.85);
        RR(cx+3,cy+3,sz-6,sz-6,6,bg,op);
        T(`${r},${c}`,cx+sz/2,cy+sz/2,16,diag&&drop>.5?col.r:col.fg,'center',diag?(1-.65*drop):1);
        if(diag&&drop>.2)L(cx+8,cy+8,cx+sz-8,cy+sz-8,col.r,2.2,drop);
      }
    }
    // Giải thích các bước bên phải
    const steps=[
      ['Bước 1: Không gian mẫu','|Ω| = 6 × 6 = 36 cặp đồng khả năng',col.b,1.5],
      ['Bước 2: Lọc theo B (khác nhau)','Loại 6 cặp đường chéo → |B| = 30',col.r,5],
      ['Bước 3: Đếm A ∩ B (có 6, ≠ nhau)','Còn 10 cặp màu xanh (loại 6,6!)',col.g,8.5],
      ['Kết quả:','P(A | B) = 10 / 30 = 1/3 ≈ 33,3%',col.y,11.5]
    ];
    steps.forEach(([tt,ds,c,st],i)=>{
      const yy=200+i*85,o=sg(t,st,st+1.3);
      T(tt,555,yy,23,c,'left',o);
      T(ds,555,yy+34,21,col.fg,'left',o);
    });
    T('Không lấy 11/30 vì cặp (6, 6) không thuộc biến cố điều kiện B!',640,582,23,col.y,'center',sg(t,13.5,15));
  }
},
{

    [0,5,'Từ định nghĩa xác suất có điều kiện, nhân hai vế với P(A) ta được Quy tắc nhân: P(A ∩ B) = P(A) · P(B | A).'],

    [27,32,'Bởi ta chia hai trường hợp lần 1 xanh hoặc không xanh: (3/10)(2/9) + (7/10)(3/9) = 27/90 = 3/10. Thứ tự rút chỉ quan trọng khi đã biết thông tin.']
  ],
  f:t=>{

    // Khung không hoàn lại
    const o2=sg(t,6.5,8);
    RR(675,165,515,245,14,'#181d26',o2);RR(675,165,515,245,14,col.o,o2,2.4);

{

const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function rs(){
  const w=Math.min(innerWidth,innerHeight*16/9),dp=devicePixelRatio||1;
  C.style.width=w+'px';C.style.height=w*9/16+'px';
  C.width=Math.round(w*dp);C.height=Math.round(w*9/16*dp);
}
addEventListener('resize',rs);rs();

let lastSub='';
function rd(){
  const k=C.width/W;X.setTransform(k,0,0,k,0,0);X.globalAlpha=1;X.fillStyle='#0d0f13';X.fillRect(0,0,W,H);
  const i=idx(),t=g-ST[i],s=sc[i];
  FA=cl(Math.min(t/.45,i==sc.length-1?1:(s.d-t)/.35));
  const tAnim=t*(s.ad/s.d);
  s.f(tAnim);
  FA=1;
  segs.forEach((e,j)=>e.style.width=cl((g-ST[j])/sc[j].d)*100+'%');
  $('tm').textContent=mm(g)+' / '+mm(tot);
  [...mn.children].forEach((c,j)=>c.classList.toggle('c',j==i));
  let curSub='';
  if(showSub&&s.sub){
    for(const [a,b,txt] of s.sub){if(t>=a&&t<b){curSub=txt;break}}
  }
  if(curSub!==lastSub){
    lastSub=curSub;
    subEl.textContent=curSub;
    subEl.classList.toggle('e',!curSub);
  }
}
function lp(n){
  const d=Math.min(.1,(n-last)/1000);last=n;
  if(pl){g+=d*sp;if(g>=tot){g=tot-.001;pl=false;sy()}if(n-hid>2800)ui.classList.add('h')}

}
