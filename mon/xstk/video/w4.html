<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuần 4: Tương quan và hồi quy tuyến tính</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2c2d31;--fg:#dcdde2;--ac:#e5b91a}

#st{position:fixed;inset:0;display:grid;place-items:center}
canvas{display:block}
/* Cố định phụ đề ở sát mép đáy màn hình, không đổi vị trí khi thanh điều khiển ẩn/hiện */
#sub{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  max-width:min(980px,94vw);
  padding:10px 20px;
  border-radius:10px;
  background:rgba(36,37,41,.94);
  border:1px solid #4c4f58;
  color:#dcdde2;
  font-size:clamp(14px,1.45vw,19px);
  font-weight:400;
  line-height:1.45;
  text-align:center;
  pointer-events:none;
  transition:opacity .2s;
  z-index:5;
}
#sub.e{opacity:0}
#ui{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:20px 0 0;
  background:linear-gradient(transparent,rgba(32,33,37,.92));

#ui.h{opacity:0;pointer-events:none}
#pg{display:flex;gap:2px;height:14px;align-items:flex-end;cursor:pointer;touch-action:none}
.sg{flex:1;height:4px;background:#ffffff24;border-radius:0;overflow:hidden;transition:height .15s}
#pg:hover .sg{height:8px}
.sg i{display:block;height:100%;background:var(--ac)}
#rw{display:flex;align-items:center;gap:6px;padding:0 18px 8px}
button{background:none;border:0;color:var(--fg);width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font:600 14px inherit;font-family:inherit}
button:hover{background:#ffffff1a}
button.on{color:var(--ac)}
svg{width:24px;height:24px;fill:currentColor}
#tm{font-size:14px;font-weight:600;margin-left:8px;flex:1;color:#989ba5}
#mn{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);background:#242529f5;border-left:1px solid #4c4f58;padding:18px 8px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}
#mn.o{transform:none}
#mn div{padding:11px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:#dcdde2}
#mn div:hover{background:#ffffff12}
#mn div.c{color:var(--ac);background:#e5b91a18}
</style>
</head>
<body>
<div id="st"><canvas id="c"></canvas></div>
<div id="mn"></div>
<div id="ui">
  <div id="rw">
    <button id="bp" title="Phát/Tạm dừng (Space)"></button>
    <button id="bt" title="Cảnh trước (←)"></button>
    <button id="bn" title="Cảnh sau (→)"></button>
    <span id="tm"></span>
    <button id="bc" class="on" title="Bật/tắt phụ đề (C)">CC</button>
    <button id="bs" title="Tốc độ">1×</button>
    <button id="bm" title="Mục lục (M)"></button>
  </div>
  <div id="pg"></div>
</div>
<div id="sub"></div>

<script>
// Thiết lập canvas logic 1280x720 và các hàm vẽ, tiện ích toán học dùng chung
const W=1280,H=720,C=document.getElementById('c'),X=C.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=v=>{v=cl(v);return v*v*(3-2*v)};
const sg=(t,a,b)=>sm((t-a)/(b-a));
const mx=(a,b,k)=>a+(b-a)*k;
const mp=(a,b,p,q)=>v=>p+(q-p)*(v-a)/(b-a);
const f=(v,d=2)=>v.toFixed(d).replace('.',',');
const col={fg:'#dcdde2',dim:'#989ba5',b:'#78a9d6',o:'#df9368',g:'#7cc99c',y:'#e5b91a',r:'#d97373',p:'#a996cf',card:'#35373d',card2:'#26272b',bd:'#4c4f58',axis:'#545760'};

let FA=1;
const al=a=>{X.globalAlpha=cl(a===undefined?1:a)*FA};
function T(s,x,y,z,c,a,o){al(o);X.fillStyle=c||col.fg;X.font=`${z>=34?800:600} ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;X.textAlign=a||'left';X.textBaseline='middle';X.fillText(s,x,y)}
function L(a,b,c,d,k,w,o,ds){al(o);X.strokeStyle=k;X.lineWidth=w||2;X.setLineDash(ds||[]);X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke();X.setLineDash([])}
function R(x,y,w,h,c,o){al(o);X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c,o,st){
  al(o);X.beginPath();X.roundRect(x,y,w,h,r);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
function D(x,y,r,c,o,st){
  al(o);X.beginPath();X.arc(x,y,r,0,Math.PI*2);
  if(st){X.strokeStyle=c;X.lineWidth=st;X.stroke()}else{X.fillStyle=c;X.fill()}
}
// Vẽ phân số 2 dòng (tử số trên, gạch ngang, mẫu số dưới), trả về độ rộng khung phân số
function FR(num,den,x,y,z,c,o){
  X.font=`600 ${z}px 'Be Vietnam Pro',system-ui,sans-serif`;
  const w=Math.max(X.measureText(num).width,X.measureText(den).width)+14;
  T(num,x,y-z*.66,z,c,'center',o);
  L(x-w/2,y,x+w/2,y,c||col.fg,1.8,o);
  T(den,x,y+z*.72,z,c,'center',o);
  return w;
}
const hd=s=>T(s,80,58,35,col.y);

// Bộ sinh số giả ngẫu nhiên cố định seed và dữ liệu 51 bang (Graduates, Poverty) từ notebook
function mkRng(seed){let s=seed>>>0;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const povData=[
  [81.1,12.8],[81.0,10.3],[91.1,8.2],[83.1,11.2],[89.1,9.8],[86.9,11.1],[87.4,8.5],[86.0,9.4],[89.6,8.5],[80.4,18.9],
  [81.5,10.7],[83.4,15.4],[90.5,11.1],[80.9,17.3],[83.3,12.6],[86.1,7.6],[82.3,15.3],[87.2,12.8],[88.2,9.0],[88.7,9.4],
  [82.5,15.4],[87.6,8.4],[77.8,15.4],[83.2,10.7],[83.1,11.1],[88.0,7.8],[82.9,15.0],[86.6,11.4],[90.3,9.3],[83.9,17.0],
  [88.3,7.8],[88.9,11.1],[90.5,7.7],[85.0,12.9],[91.7,10.3],[84.9,12.9],[78.5,15.3],[86.6,6.0],[92.0,8.3],[89.0,11.3],
  [86.3,12.0],[91.1,7.8],[83.0,13.6],[83.8,13.5],[91.1,8.2],[90.0,9.6],[82.7,16.6],[88.1,11.2],[83.9,13.7],[92.2,5.5],[85.0,12.0]
];
const povStats=(()=>{
  const n=povData.length;
  let sx=0,sy=0;
  povData.forEach(([x,y])=>{sx+=x;sy+=y});
  const xb=sx/n,yb=sy/n;
  let sxx=0,syy=0,sxy=0;
  povData.forEach(([x,y])=>{sxx+=(x-xb)*(x-xb);syy+=(y-yb)*(y-yb);sxy+=(x-xb)*(y-yb)});
  const sdX=Math.sqrt(sxx/(n-1)),sdY=Math.sqrt(syy/(n-1));
  const r=sxy/Math.sqrt(sxx*syy);
  const b1=sxy/sxx,b0=yb-b1*xb;
  const b1Rev=sxy/syy,b0Rev=xb-b1Rev*yb;
  const rnd=mkRng(42);
  const yShuf=povData.map(p=>p[1]);
  for(let i=yShuf.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[yShuf[i],yShuf[j]]=[yShuf[j],yShuf[i]]}
  const shuf=povData.map((p,i)=>[p[0],yShuf[i]]);
  return {xb,yb,sdX,sdY,r,b1,b0,b1Rev,b0Rev,sxx,syy,shuf};
})();

// Tạo dữ liệu mô phỏng cho biểu đồ phần dư (Scene 11) và nghịch lý Simpson (Scene 14)
const residData=(()=>{
  const rnd=mkRng(404),good=[],curve=[],fan=[];
  for(let i=0;i<36;i++){
    const x=i/35;
    const g=(rnd()+rnd()+rnd()-1.5)*1.4;
    good.push([x,g]);
    curve.push([x,(x-.5)*(x-.5)*6-.6+(rnd()-.5)*.45]);
    fan.push([x,(rnd()+rnd()-1)*(0.2+x*2.4)]);
  }
  return {good,curve,fan};
})();

const simpsonData=(()=>{
  const rnd=mkRng(414),groups=[];
  [[2,7,col.b],[5.5,10,col.o],[9,13,col.g]].forEach(([cx,cy,c])=>{
    const pts=[];
    for(let i=0;i<14;i++){
      const x=cx+(i-6.5)*.22+(rnd()-.5)*.25;
      const y=cy-(x-cx)*1.15+(rnd()-.5)*.9;
      pts.push([x,y]);
    }
    groups.push({pts,c,cx,cy});
  });
  return groups;
})();

// Danh sách 17 cảnh tương tác của Tuần 04
const sc=[
{
  t:'1. Mối liên hệ & Biểu đồ phân tán',d:24,
  s:[
    [0,'Chào mừng bạn đến với Tuần 04: Tương quan và hồi quy tuyến tính — cách đo lường và mô hình hóa mối liên hệ giữa các biến số.'],
    [5,'Xét dữ liệu 51 bang: tỉ lệ tốt nghiệp trung học (Graduates) và tỉ lệ nghèo (Poverty). Bên trái là dữ liệu thật, bên phải đã xáo trộn ngẫu nhiên.'],
    [11,'Ở dữ liệu thật, khi đi từ trái sang phải, tỉ lệ nghèo có xu hướng giảm rõ rệt; còn khi xáo trộn cặp ghép, đám mây điểm mất hẳn xu hướng.'],
    [17,'Trước khi tính bất kỳ con số nào, hãy luôn nhìn biểu đồ phân tán và hỏi 4 câu: Hướng, Dạng, Độ mạnh và Ngoại lai!']
  ],
  f:t=>{
    hd('1. Từ biểu đồ phân tán đến mối liên hệ giữa hai biến số');
    T('UET.MAT1052 — Tuần 04: Dữ liệu 51 bang (Graduates vs Poverty) — Gốc vs Xáo trộn',80,104,20,col.dim);

    // Biểu đồ trái: dữ liệu thật
    const m1=mp(76,94,115,575),y1=mp(4,21,465,165);
    L(105,465,585,465,col.axis,2);L(115,155,115,470,col.axis,1.5);
    T('Dữ liệu gốc (có liên hệ âm)',345,142,20,col.b,'center');
    T('Tốt nghiệp (%)',345,500,17,col.dim,'center');
    T('Nghèo (%)',70,315,17,col.dim,'center');
    const o1=sg(t,1.5,4);
    povData.forEach(([x,y],i)=>{
      const k=sg(t,1.2+i*.04,2.2+i*.04);
      D(m1(x),y1(y),4.8,i===0?col.o:col.b,.88*k);
    });
    T('r = −0,747',555,190,21,col.y,'right',sg(t,5,6.5));

    // Biểu đồ phải: dữ liệu xáo trộn
    const o2=sg(t,6,7.5);
    const m2=mp(76,94,695,1155);
    L(685,465,1165,465,col.axis,2,o2);L(695,155,695,470,col.axis,1.5,o2);
    T('Sau khi xáo trộn Poverty (phá cặp)',925,142,20,col.dim,'center',o2);
    T('Tốt nghiệp (%)',925,500,17,col.dim,'center',o2);
    povStats.shuf.forEach(([x,y],i)=>{
      const k=sg(t,6.5+i*.04,7.5+i*.04);
      D(m2(x),y1(y),4.8,col.dim,.78*k);
    });
    T('r ≈ 0 (mất xu hướng)',1135,190,19,col.dim,'right',sg(t,10,11.5));

    // Thanh 4 câu hỏi
    const o4=sg(t,15,16.5);
    RR(105,525,1070,48,10,col.card,o4);RR(105,525,1070,48,10,col.bd,o4,1.4);R(105,533,3.5,32,col.y,o4);
    T('4 câu hỏi khi đọc scatter plot:   1. Hướng (dương/âm)   ·   2. Dạng (thẳng/cong)   ·   3. Độ mạnh   ·   4. Ngoại lai',640,549,18,col.fg,'center',o4);
  }
},
{
  t:'2. Hệ số tương quan Pearson r',d:26,
  s:[
    [0,'Hệ số tương quan Pearson r đo hướng và độ mạnh của xu hướng TUYẾN TÍNH bằng trung bình tích các giá trị chuẩn hóa zₓ · zᵧ.'],
    [5.5,'Hai đường z = 0 chia mặt phẳng thành 4 góc phần tư quanh tâm (x̄, ȳ): góc trên-phải và dưới-trái góp tích dương (xanh), hai góc còn lại góp tích âm (đỏ).'],
    [11.5,'Với 51 bang, phần lớn điểm nằm ở hai góc trái dấu màu đỏ nên tổng tích âm, cho ra r = −0,747.'],
    [17,'Tính tay với bộ 3 điểm (1,2), (2,4), (3,3): ta có x̄ = 2, ȳ = 3, sₓ = sᵧ = 1, tổng tích zₓ·zᵧ = 1.'],
    [22,'Chia cho n − 1 = 2, ta được r = 1 / 2 = 0,50 (hoặc dùng công thức gọn Sₓᵧ / √(Sₓₓ · Sᵧᵧ) = 1 / √4 = 0,50).']
  ],
  f:t=>{
    hd('2. Hệ số tương quan Pearson r và phép chuẩn hóa z-score');

    // Biểu đồ z_x vs z_y bên trái
    const m=mp(-2.6,2.6,120,600),y=mp(-2.6,2.6,495,165);
    L(110,y(0),610,y(0),col.axis,1.8);L(m(0),155,m(0),505,col.axis,1.8);
    T('zₓ (Tốt nghiệp chuẩn hóa)',360,522,17,col.dim,'center');
    T('zᵧ',m(0)+16,162,17,col.dim,'left');
    T('(+)(+) = +',565,185,16,col.b,'right');
    T('(−)(+) = −',135,185,16,col.r,'left');
    T('(−)(−) = +',135,475,16,col.b,'left');
    T('(+)(−) = −',565,475,16,col.r,'right');

    povData.forEach(([xv,yv],i)=>{
      const zx=(xv-povStats.xb)/povStats.sdX,zy=(yv-povStats.yb)/povStats.sdY;
      const k=sg(t,1.5+i*.05,2.5+i*.05);
      D(m(zx),y(zy),5,zx*zy>0?col.b:col.r,.9*k);
    });

    // Công thức và tính tay bên phải
    const o1=sg(t,3,4.5);
    RR(650,155,550,120,12,col.card,o1);RR(650,155,550,120,12,col.bd,o1,1.5);R(650,168,3.5,94,col.y,o1);
    T('r =',680,215,24,col.y,'left',o1);
    FR('1','n − 1',748,215,18,col.fg,o1);
    T('∑ zₓ,ᵢ · zᵧ,ᵢ  =',792,215,21,col.fg,'left',o1);
    FR('Sₓᵧ','√(Sₓₓ · Sᵧᵧ)',1045,215,19,col.g,o1);

    // Tính tay 3 điểm
    const o2=sg(t,12,13.5);
    RR(650,300,550,215,12,col.card2,o2);RR(650,300,550,215,12,col.bd,o2,1.5);R(650,313,3.5,189,col.b,o2);
    T('Tính tay 3 điểm: (1,2), (2,4), (3,3)',925,332,20,col.b,'center',o2);
    T('x̄ = 2, ȳ = 3,  sₓ = 1, sᵧ = 1',925,368,18,col.dim,'center',o2);
    T('zₓ = (−1, 0, 1)  ·  zᵧ = (−1, 1, 0)',925,408,20,col.fg,'center',sg(t,15,16.5));
    T('∑ zₓ·zᵧ = (−1)(−1) + 0 + 0 = 1',925,444,19,col.fg,'center',sg(t,17.5,19));
    T('⇒  r = 1 / (3 − 1) = 0,50',925,484,24,col.y,'center',sg(t,20,21.5));
  }
},
{
  t:'3. Tính chất của r & Đổi thang đo',d:24,
  s:[
    [0,'Nhờ bất đẳng thức tổng bình phương không âm, hệ số tương quan r luôn bị chặn trong đoạn từ −1 đến +1.'],
    [5.5,'r chỉ bằng +1 hoặc −1 khi mọi điểm nằm khít tuyệt đối trên một đường thẳng dốc lên hoặc dốc xuống.'],
    [11,'Vì phép chuẩn hóa z-score triệt tiêu cả gốc đo lẫn độ lớn đơn vị, r hoàn toàn KHÔNG CÓ ĐƠN VỊ!'],
    [16.5,'Thử đổi thang đo x\' = a + b·x (W04-EX01): cộng hằng số a hay nhân b > 0 không đổi r; còn nhân b < 0 sẽ ĐẢO DẤU r.'],
    [21,'Ví dụ đổi tỉ lệ tốt nghiệp từ phần trăm (0–100) sang tỉ lệ (0–1) thì r vẫn giữ nguyên −0,747!']
  ],
  f:t=>{
    hd('3. Tính chất của r và phép đổi thang đo x\' = a + bx');

    // Thang [-1, +1] ở trên
    const m=mp(-1,1,150,1130),o1=sg(t,1,2.5);
    L(150,185,1130,185,col.axis,5,o1);
    [[-1,'−1 (thẳng âm)',col.r],[-0.75,'−0,75',col.o],[0,'0 (không tuyến tính)',col.dim],[0.75,'+0,75',col.b],[1,'+1 (thẳng dương)',col.g]].forEach(([v,lb,c])=>{
      D(m(v),185,8,c,o1);
      T(lb,m(v),150,16,c,'center',o1);
    });
    T('−1 ≤ r ≤ 1   |   Không có đơn vị   |   Đối xứng: r(x, y) = r(y, x)',640,228,20,col.y,'center',sg(t,3.5,5));

    // Bảng thử nghiệm W04-EX01 ở dưới
    const rows=[
      ['Phép đổi thang đo x\' = a + b·x','Tác động lên zₓ','r(x\', y) mới'],
      ['x\' = 10 + 1·x   (cộng hằng số)','Không đổi zₓ','−0,747 (không đổi)'],
      ['x\' = 0,01·x     (% sang tỉ lệ 0–1)','b > 0 → không đổi','−0,747 (không đổi)'],
      ['x\' = 100 − 1·x  (đảo chiều thang đo)','b < 0 → đổi dấu zₓ','+0,747 (đổi dấu!)'],
      ['x\' = 20000 + 2000·x','b > 0 → không đổi','−0,747 (không đổi)']
    ];
    rows.forEach((r,idx)=>{
      const yy=292+idx*54,o=sg(t,7+idx*2.4,8.2+idx*2.4);
      const c=idx===0?col.y:(idx===3?col.o:col.fg);
      RR(95,yy-21,1090,44,8,idx===0?col.card2:col.card,o);
      T(r[0],125,yy,19,c,'left',o);
      T(r[1],620,yy,19,idx===0?col.y:col.dim,'left',o);
      T(r[2],1155,yy,19,idx===3?col.o:(idx===0?col.y:col.g),'right',o);
    });
  }
},
{
  t:'4. Phản ví dụ r = 0 & Điểm đòn bẩy',d:26,
  s:[
    [0,'Có hai bẫy chết người khi chỉ nhìn vào con số r mà bỏ qua biểu đồ phân tán!'],
    [4.5,'Bẫy 1 (W04-CH01): Quan hệ hoàn hảo y = x² trên 5 điểm đối xứng (−2,4)…(2,4) cho ra đúng r = 0, vì nửa trái và nửa phải triệt tiêu nhau.'],

{

  s:[

  f:t=>{

    // Bên trái: Scatter + đoạn phần dư + đường đang xoay

      D(m1(xv),y1(yv),4,col.b,.9);
    });
    L(m1(77),y1(b0Cur+b1Cur*77),m1(93),y1(b0Cur+b1Cur*93),col.r,3);

    for(let i=0;i<=80;i++){
      const bv=-1.1+1.0*i/80,b0v=povStats.yb-bv*povStats.xb;

  }
},

// ===== Điều khiển trình phát tương tác =====
const ST=[];let TOT=0;sc.forEach(s=>{ST.push(TOT);TOT+=s.d});
const idx=()=>Math.max(0,ST.findLastIndex(x=>x<=g));
const $=(q)=>document.querySelector(q);
const pg=$('#pg'),mn=$('#mn'),ui=$('#ui'),sub=$('#sub'),bp=$('#bp'),bt=$('#bt'),bn=$('#bn'),bc=$('#bc'),bs=$('#bs'),bm=$('#bm'),tm=$('#tm');
const ic=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const IP=ic('M8 5v14l11-7z'),IA=ic('M6 19h4V5H6zm8-14v14h4V5z');
bt.innerHTML=ic('M6 6h2v12H6zm3.5 6l8.5 6V6z');
bn.innerHTML=ic('M6 18l8.5-6L6 6zm10-12v12h2V6z');
bm.innerHTML=ic('M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z');

sc.forEach((s,i)=>{
  const e=document.createElement('div');e.className='sg';e.style.flexGrow=s.d;e.innerHTML='<i></i>';pg.appendChild(e);
  const m=document.createElement('div');m.textContent=s.t;m.onclick=()=>{g=ST[i];mn.classList.remove('o');rd()};mn.appendChild(m);
});
const sgs=[...pg.children],mns=[...mn.children];

let g=0,pl=1,cc=1,sp=1,lt=0,ht=0,dr=0;
const sps=[.75,1,1.25,1.5,2];
const ft=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const sh=()=>{ui.classList.remove('h');clearTimeout(ht);if(pl)ht=setTimeout(()=>ui.classList.add('h'),3000)};
const up=()=>{bp.innerHTML=pl?IA:IP;if(!pl)ui.classList.remove('h');else sh()};

function rs(){
  const dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight,r=Math.min(w/W,h/H);
  C.style.width=W*r+'px';C.style.height=H*r+'px';
  C.width=Math.round(W*r*dpr);C.height=Math.round(H*r*dpr);
}
addEventListener('resize',rs);rs();

let lastSub='';
function rd(){
  const k=C.width/W;X.setTransform(k,0,0,k,0,0);X.globalAlpha=1;X.fillStyle='#2c2d31';X.fillRect(0,0,W,H);
  const i=idx(),t=g-ST[i],s=sc[i];
  FA=Math.min(cl(t/.4),cl((s.d-t)/.4));
  s.f(t);
  X.globalAlpha=1;
  sgs.forEach((e,j)=>{e.firstChild.style.width=(j<i?100:j>i?0:cl(t/s.d)*100)+'%'});
  mns.forEach((e,j)=>e.classList.toggle('c',j===i));
  tm.textContent=`${ft(g)} / ${ft(TOT)} · ${s.t}`;
  let tx='';
  if(cc)for(const [a,b] of s.s)if(t>=a)tx=b;
  if(tx!==lastSub){
    lastSub=tx;
    sub.textContent=tx;
    sub.classList.toggle('e',!tx);
  }
}

function lp(n){
  if(lt&&pl){g+=Math.min(.1,(n-lt)/1000)*sp;if(g>=TOT){g=TOT;pl=0;up()}}
  lt=n;rd();requestAnimationFrame(lp);
}
requestAnimationFrame(lp);up();

const tg=()=>{if(g>=TOT)g=0;pl^=1;up()};
bp.onclick=tg;
bt.onclick=()=>{const i=idx();g=ST[g-ST[i]>2?i:Math.max(0,i-1)];sh()};
bn.onclick=()=>{const i=idx();g=i<sc.length-1?ST[i+1]:TOT;sh()};
bc.onclick=()=>{cc^=1;bc.classList.toggle('on',!!cc);lastSub='__';rd()};
bs.onclick=()=>{sp=sps[(sps.indexOf(sp)+1)%sps.length];bs.textContent=sp+'×'};
bm.onclick=()=>mn.classList.toggle('o');
C.onclick=()=>{if(mn.classList.contains('o'))mn.classList.remove('o');else tg()};

const sk=e=>{const r=pg.getBoundingClientRect();g=cl((e.clientX-r.left)/r.width)*TOT;rd()};
pg.onpointerdown=e=>{dr=1;pg.setPointerCapture(e.pointerId);sk(e)};
pg.onpointermove=e=>{if(dr)sk(e)};
pg.onpointerup=()=>{dr=0};
addEventListener('pointermove',sh);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();tg()}
  else if(e.key==='ArrowLeft')bt.click();
  else if(e.key==='ArrowRight')bn.click();
  else if(e.key==='c'||e.key==='C')bc.click();
  else if(e.key==='m'||e.key==='M')bm.click();
});
