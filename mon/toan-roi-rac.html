    <div class="box analogy"><b>Ẩn dụ "Địa chỉ nhà":</b> Một địa chỉ nhà gồm <b>tên phố</b> và <b>số nhà</b>. Địa chỉ IPv4 cũng gồm hai phần: <b>netid</b> (số hiệu mạng — "tên phố") và <b>hostid</b> (số hiệu máy trong mạng đó — "số nhà"). Muốn đếm số địa chỉ, ta đếm số tên phố rồi nhân với số nhà mỗi phố.</div>
    <ol class="steps">
      <li><b>Địa chỉ IPv4 là gì?</b> Là một dãy <b>32 bit</b>. Nếu chỉ hỏi "có bao nhiêu dãy 32 bit" thì mỗi bit có 2 lựa chọn ⇒ $2^{32}=4.294.967.296$ (quy tắc nhân, giống đếm tập con). Nhưng slide muốn đếm các địa chỉ <b>dùng được cho máy</b> trong lớp A, B, C nên phải tách nhỏ hơn.</li>
      <li><b>Chia 32 bit thành 3 phần (xem hình):</b> vài bit đầu nhận dạng lớp (A: <code>0</code>, B: <code>10</code>, C: <code>110</code>); phần còn lại chia thành netid và hostid. Số bit netid: A = $32-1-24=7$, B = $32-2-16=14$, C = $32-3-8=21$. Hostid dài $24$, $16$, $8$ bit.</li>
      <li><b>Số cách chọn thô:</b> netid có $2^{\text{số bit}}$ cách, hostid có $2^{\text{số bit}}$ cách, và địa chỉ = (netid VÀ hostid) ⇒ <b>nhân</b>. Ví dụ lớp A thô: $2^7\cdot2^{24}=2^{31}$.</li>
      <li><b>Loại những giá trị bị cấm (theo giáo trình Rosen):</b>
        <ul>
          <li>hostid <b>toàn bit 0</b> là địa chỉ của chính mạng, hostid <b>toàn bit 1</b> dùng để gửi cho mọi máy (broadcast) ⇒ mỗi lớp mất $2$ giá trị hostid: $2^{k}-2$ (xem hình ví dụ 3 bit).</li>
          <li>Riêng lớp A: netid <code>1111111</code> (tức $127$) bị loại ⇒ $2^7-1$ netid.</li>
        </ul></li>
      <li><b>Tính từng lớp:</b>
        <div class="f">$$\text{A}=127\cdot(2^{24}-2)=127\cdot16\,777\,216-254=\mathbf{2.130.706.178}$$$$\text{B}=2^{14}\cdot(2^{16}-2)=1\,073\,741\,824-32\,768=\mathbf{1.073.709.056}$$$$\text{C}=2^{21}\cdot(2^8-2)=536\,870\,912-4\,194\,304=\mathbf{532.676.608}$$<small>Mẹo tính: $a\cdot(2^k-2)=a\cdot2^k-2a$, vì nhân với lũy thừa của 2 dễ hơn nhân với $2^k-2$.</small></div></li>
      <li><b>Cộng ba lớp:</b> một địa chỉ không thể vừa lớp A vừa lớp B vì bit nhận dạng khác nhau (các tập rời nhau) ⇒ <b>quy tắc cộng</b>: tổng = $\mathbf{3.737.091.842}$ địa chỉ.</li>
    </ol>

    <h2>3. Nguyên Lý Bù Trừ & Luật Chia</h2>
<figure class="fl"><svg viewBox="0 0 680 228" role="img"><circle cx="130" cy="100" r="68" fill="var(--c1)" fill-opacity=".28" stroke="var(--c1)" stroke-width="2.5"/><circle cx="215" cy="100" r="68" fill="var(--c4)" fill-opacity=".28" stroke="var(--c4)" stroke-width="2.5"/><text x="96" y="106" text-anchor="middle" style="font-weight:800;font-size:17px">96</text><text x="172.5" y="106" text-anchor="middle" style="font-weight:800;font-size:17px">32</text><text x="249" y="106" text-anchor="middle" style="font-weight:800;font-size:17px">32</text><text x="110" y="44" text-anchor="middle" style="font-weight:800;fill:var(--c1)">A</text><text x="235" y="44" text-anchor="middle" style="font-weight:800;fill:var(--c4)">B</text><text x="172.5" y="20" text-anchor="middle" style="font-weight:700">Xâu nhị phân 8 bit</text><text x="172.5" y="194" text-anchor="middle" style="font-size:12.5px">A = 128 · B = 64 · A∩B = 32</text><text x="172.5" y="214" text-anchor="middle" style="font-weight:800;fill:var(--c5);font-size:14px">|A∪B| = 128+64−32 = 160</text><circle cx="470" cy="100" r="68" fill="var(--c1)" fill-opacity=".28" stroke="var(--c1)" stroke-width="2.5"/><circle cx="555" cy="100" r="68" fill="var(--c4)" fill-opacity=".28" stroke="var(--c4)" stroke-width="2.5"/><text x="436" y="106" text-anchor="middle" style="font-weight:800;font-size:17px">111</text><text x="512.5" y="106" text-anchor="middle" style="font-weight:800;font-size:17px">55</text><text x="589" y="106" text-anchor="middle" style="font-weight:800;font-size:17px">56</text><text x="450" y="44" text-anchor="middle" style="font-weight:800;fill:var(--c1)">A</text><text x="575" y="44" text-anchor="middle" style="font-weight:800;fill:var(--c4)">B</text><text x="512.5" y="20" text-anchor="middle" style="font-weight:700">Số từ 1 đến 1000</text><text x="512.5" y="194" text-anchor="middle" style="font-size:12.5px">A=⌊1000/6⌋=166 · B=111 · A∩B=55</text><text x="512.5" y="214" text-anchor="middle" style="font-weight:800;fill:var(--c5);font-size:14px">|A∪B| = 166+111−55 = 222</text></svg><figcaption>Số ở phần giao bị đếm 2 lần khi cộng, nên phải trừ đi một lần.</figcaption></figure>
    <p>Khi hai nhóm <b>giao nhau</b>, quy tắc cộng đếm phần giao đến hai lần. Nguyên lý bù trừ sửa lỗi đó:</p>
    <div class="f key">$$|A\cup B|=|A|+|B|-|A\cap B|$$<small>Ví dụ: xâu nhị phân dài 8 bắt đầu bằng 1 hoặc kết thúc bằng 00: $2^7+2^6-2^5=128+64-32=\mathbf{160}$. Từ $1$ đến $1000$ chia hết cho 6 hoặc 9: $\lfloor1000/6\rfloor+\lfloor1000/9\rfloor-\lfloor1000/18\rfloor=166+111-55=\mathbf{222}$ (phần giao là bội của $\operatorname{lcm}(6,9)=18$).</small></div>
    <div class="box tip"><b>Đại diện Toán/Tin:</b> $18$ sinh viên Toán và $325$ sinh viên Tin. Chọn 1 đại diện (không ai học cả hai ngành) ⇒ $18+325=343$. Chọn 2 đại diện, một Toán và một Tin ⇒ $18\times325=5850$.</div>

    <div class="f key"><b>Định lý 1:</b> $k+1$ (hoặc nhiều hơn) vật vào $k$ hộp ⇒ có hộp chứa $\ge2$ vật.<br><b>Định lý 2:</b> $k$ vật vào $b$ hộp ⇒ có hộp chứa ít nhất $\left\lceil \dfrac{k}{b}\right\rceil$ vật.<small>$\lceil x\rceil$ là làm tròn LÊN. Ví dụ: $367$ người ⇒ $\ge2$ người trùng ngày sinh (tối đa $366$ ngày). $100$ người, $12$ tháng ⇒ có $\ge\lceil100/12\rceil=9$ người cùng tháng sinh.</small></div>
    <p>Ví dụ trên slide: trong $27$ từ tiếng Anh luôn có $\ge2$ từ bắt đầu bằng cùng một chữ cái (chuồng = $26$ chữ cái). Lớp phải có bao nhiêu sinh viên để chắc chắn 2 người cùng điểm trên thang 100? Nếu điểm nguyên từ $1$ đến $100$ thì có $100$ "chuồng" nên cần <b>$101$</b> sinh viên (nếu tính cả điểm $0$ thì cần $102$).</p>

  <section>
    <h2>6. Bài Tập Trọng Tâm Nguyên Lý Dirichlet (Chứng Minh Từng Bước)</h2>
    <div class="box tip"><b>Quy trình 4 bước cho mọi bài Dirichlet:</b><br>① Nhận dạng từ khóa: "luôn tồn tại", "chắc chắn", "ít nhất hai".<br>② Xác định <b>bồ câu</b>: đối tượng được chọn/cho sẵn (số lượng lớn).<br>③ Xác định <b>chuồng</b>: một cách phân loại sao cho hai bồ câu cùng chuồng thì có ngay tính chất cần chứng minh (liên tiếp, cùng phần lẻ, cùng số dư…).<br>④ Đếm: bồ câu &gt; chuồng ⇒ áp dụng nguyên lý, rồi chỉ ra vì sao hai bồ câu chung chuồng cho kết luận.</div>

    <div class="formula-card">
      <h3>Câu 1: Hai số nguyên tố cùng nhau</h3>
      <p><b>Đề bài:</b> Chứng tỏ rằng trong $n+1$ số nguyên dương đôi một khác nhau không vượt quá $2n$ luôn có hai số nguyên tố cùng nhau.</p>
      <div class="box analogy"><b>Đề bài muốn nói gì?</b><br>Có sẵn các số $1,2,\dots,2n$. Em <i>tự do</i> chọn ra $n+1$ số khác nhau trong đó (hơn một nửa). Đề khẳng định: dù em chọn kiểu gì, trong các số vừa chọn <b>luôn có ít nhất một cặp</b> mà ước chung lớn nhất bằng $1$. Mình không phải tìm cặp đó, chỉ cần chứng minh nó <b>chắc chắn tồn tại</b>.</div><div class="box tip"><b>Ví dụ cụ thể minh họa đúng đề:</b><br>Lấy $n=5$: dãy $1,2,\dots,10$, chọn $6$ số, ví dụ $\{2,4,6,7,8,10\}$. Cặp $(6,7)$ có $\gcd=1$ ✓. Thử "né": chọn toàn số chẵn $\{2,4,6,8,10\}$ thì không có cặp nào nguyên tố cùng nhau, nhưng đó mới là $5$ số. Cứ thêm một số thứ $6$ (số lẻ nào cũng được) là lập tức có cặp $\gcd=1$, ví dụ thêm $3$ thì $(3,4)$, thêm $5$ thì $(5,2)$.</div>
      <div class="btn-group"><button type="button" class="btn btn-hint" onclick="togglePanel('h-b7-1')">Xem Gợi ý</button><button type="button" class="btn btn-sol" onclick="togglePanel('s-b7-1')">Xem Lời giải chi tiết</button></div>
      <div id="h-b7-1" class="panel">Hai số <b>liên tiếp</b> luôn nguyên tố cùng nhau. Hãy gom $\{1,\dots,2n\}$ thành các cặp số liền nhau.</div>
      <div id="s-b7-1" class="panel"><div class="box tip"><b>Cách nghĩ ra ý tưởng:</b><br>Đề nói "luôn có hai số…" ⇒ dấu hiệu của Dirichlet. Ta có $n+1$ số được chọn (làm <b>bồ câu</b>), nên cần đúng $n$ "chuồng". Câu hỏi then chốt: <i>hai số thế nào thì chắc chắn $\gcd=1$ mà ta chưa biết giá trị cụ thể?</i> Đáp án: hai số liên tiếp $m, m+1$. Từ $2n$ số xếp thành các cặp liên tiếp ta được đúng $n$ cặp, khớp với số chuồng cần tìm.</div><div class="step"><b>Bước 1 — Lập chuồng:</b><br>$n$ cặp $\{1,2\},\{3,4\},\dots,\{2n-1,2n\}$. <span class="cmt">// Mỗi số từ $1$ đến $2n$ nằm trong đúng một cặp, nên số nào được chọn cũng "chui" vào được đúng một chuồng.</span></div><div class="step"><b>Bước 2 — Áp dụng Dirichlet:</b><br>Có $n+1$ số được chọn nhưng chỉ có $n$ cặp ⇒ có một cặp chứa <b>hai</b> số được chọn. Vì các số được chọn đôi một khác nhau, hai số đó chính là hai phần tử của cặp, tức $m$ và $m+1$.</div><div class="step"><b>Bước 3 — Chứng minh $\gcd(m,m+1)=1$:</b><br>Gọi $d$ là ước chung. Khi đó $d\mid m$ và $d\mid m+1$ nên $d\mid (m+1)-m=1$ ⇒ $d=1$ (đpcm).</div><div class="box warn"><b>Vì sao cần đúng $n+1$ số?</b> Với $n=4$ chọn $\{2,4,6,8\}$ (4 số) thì không có hai số nào nguyên tố cùng nhau. Chọn thêm bất kỳ số nào thứ 5, nó rơi vào cặp đã có đại diện, ví dụ thêm $3$ thì $\{3,4\}$ cùng cặp ⇒ $\gcd(3,4)=1$.</div></div>
    </div>

    <div class="formula-card">
      <h3>Câu 2: Hai số chia hết cho nhau</h3>
      <p><b>Đề bài:</b> Chứng tỏ rằng trong $n+1$ số nguyên dương không vượt quá $2n$ luôn có hai số mà số này chia hết cho số kia.</p>
      <div class="box analogy"><b>Đề bài muốn nói gì?</b><br>Cũng chọn $n+1$ số trong $1,2,\dots,2n$, nhưng lần này đề khẳng định: luôn có <b>hai số mà số bé là ước của số lớn</b> (số này chia hết cho số kia). Vẫn chỉ cần chứng minh sự tồn tại.</div><div class="box tip"><b>Ví dụ cụ thể minh họa đúng đề:</b><br>Lấy $n=5$, chọn $\{4,6,7,8,9,10\}$: có $4\mid8$ ✓. Thử "né": $\{6,7,8,9,10\}$ (5 số) không có cặp nào chia hết nhau. Nhưng thêm số thứ $6$ bất kỳ trong $1..5$ là hỏng: thêm $5$ thì $5\mid10$, thêm $4$ thì $4\mid8$, thêm $3$ hoặc $2$ thì $\mid6$, thêm $1$ thì $1$ chia hết mọi số.</div>
      <div class="btn-group"><button type="button" class="btn btn-hint" onclick="togglePanel('h-b7-2')">Xem Gợi ý</button><button type="button" class="btn btn-sol" onclick="togglePanel('s-b7-2')">Xem Lời giải chi tiết</button></div>
      <div id="h-b7-2" class="panel">Tách hết thừa số $2$ khỏi mỗi số: $a=2^{k}\cdot q$ với $q$ lẻ. Có bao nhiêu giá trị $q$ lẻ có thể xảy ra?</div>
      <div id="s-b7-2" class="panel"><div class="box tip"><b>Cách nghĩ ra ý tưởng:</b><br>Cặp liên tiếp không giúp được chuyện chia hết. Ta cần "cái chung" của hai số mà số nhỏ chia hết số lớn. Hai số chỉ khác nhau ở lũy thừa của $2$, ví dụ $5$ và $40=2^3\cdot5$, thì số nhỏ chia hết số lớn. Vậy <b>chuồng = phần lẻ $q$</b> của số đó.</div><div class="step"><b>Bước 1 — Phân tích mỗi số:</b><br>Mọi số nguyên dương viết được duy nhất dạng $a=2^k\cdot q$ ($k\ge0$, $q$ lẻ) bằng cách chia liên tục cho $2$ đến khi ra số lẻ. Ví dụ $12=2^2\cdot3$, $40=2^3\cdot5$, $7=2^0\cdot7$.</div><div class="step"><b>Bước 2 — Đếm chuồng:</b><br>Vì $a\le2n$ nên $q\le a\le 2n$. Các số lẻ trong $[1,2n]$ là $1,3,\dots,2n-1$ ⇒ có đúng <b>$n$ chuồng</b>.</div><div class="step"><b>Bước 3 — Áp dụng Dirichlet:</b><br>$n+1$ số được chọn, mỗi số có một phần lẻ ⇒ có hai số $a_i\ne a_j$ cùng phần lẻ $q$: $a_i=2^{k_i}q$, $a_j=2^{k_j}q$.</div><div class="step"><b>Bước 4 — Kết luận chia hết:</b><br>Vì $a_i\ne a_j$ nên $k_i\ne k_j$, giả sử $k_i<k_j$. Khi đó $\dfrac{a_j}{a_i}=2^{k_j-k_i}$ là số nguyên ⇒ $a_i\mid a_j$ (đpcm).</div><div class="box analogy"><b>Kiểm tra bằng số:</b> $n=5$, chọn $6$ số của $\{1..10\}$: $\{5,6,7,8,9,10\}$ có phần lẻ $5,3,7,1,9,5$. Hai số $5$ và $10$ cùng $q=5$ ⇒ $5\mid10$.</div></div>
    </div>

    <div class="formula-card">
      <h3>Câu 3: Bội của $n$ chỉ gồm chữ số 0 và 1</h3>
      <p><b>Đề bài:</b> CMR với mọi số nguyên dương $n$ tồn tại một bội của $n$ mà biểu diễn thập phân chỉ toàn chữ số 0 và 1.</p>
      <div class="box analogy"><b>Đề bài muốn nói gì?</b><br>Cho <b>một số $n$ bất kỳ</b> (ví dụ $n=7$). Đề khẳng định: luôn có một số nguyên dương chia hết cho $n$ mà khi viết ra chỉ gồm chữ số $0$ và $1$ (như $101$, $1100$, $11010$,...). Đề <b>không</b> bắt tìm số nhỏ nhất, chỉ cần chứng minh có tồn tại.</div><div class="box tip"><b>Ví dụ cụ thể minh họa đúng đề:</b><br>$n=3$: $111=3\times37$ ✓. $n=7$: $1001=7\times143$ ✓. $n=4$: $100=4\times25$ ✓. Em thấy với mỗi $n$ đều có một số như vậy, bài toán hỏi: <i>tại sao lúc nào cũng có?</i></div>
      <div class="btn-group"><button type="button" class="btn btn-hint" onclick="togglePanel('h-b7-3')">Xem Gợi ý</button><button type="button" class="btn btn-sol" onclick="togglePanel('s-b7-3')">Xem Lời giải chi tiết</button></div>
      <div id="h-b7-3" class="panel">"Bội của $n$" nghĩa là số dư bằng $0$. Hãy xét dãy $1,11,111,\dots$ và <b>số dư</b> khi chia cho $n$.</div>
      <div id="s-b7-3" class="panel"><div class="box tip"><b>Cách nghĩ ra ý tưởng:</b><br>Bài toán nói về chia hết ⇒ nghĩ tới <b>số dư</b>: chuồng là $n$ giá trị dư $0,1,\dots,n-1$. Cần $n+1$ bồ câu <i>có cấu trúc 0,1</i> để lúc lấy hiệu hai số cùng dư vẫn chỉ ra chữ số 0 và 1. Dãy $1,11,111,\dots$ làm được việc này vì hiệu hai số dạng toàn chữ số 1 chỉ chứa 0 và 1.</div><div class="step"><b>Bước 1 — Lập bồ câu:</b><br>$a_1=1,\ a_2=11,\ a_3=111,\ \dots,\ a_{n+1}=\underbrace{11\dots1}_{n+1\text{ chữ số }1}$ ⇒ $n+1$ số.</div><div class="step"><b>Bước 2 — Lập chuồng & áp dụng:</b><br>Số dư khi chia cho $n$ chỉ có $n$ giá trị ⇒ có hai số $a_p>a_q$ cùng số dư ⇒ $n\mid a_p-a_q$.</div><div class="step"><b>Bước 3 — Tính hiệu:</b><br>$a_p-a_q=\underbrace{1\dots1}_{p-q}\underbrace{0\dots0}_{q}$. Ví dụ $11111-111=11000$. Số này chỉ có chữ số 0 và 1 và là bội của $n$ (đpcm).</div><div class="box analogy"><b>Kiểm tra bằng số:</b> $n=3$: $1,11,111,1111$ có dư $1,2,0,1$. $a_1$ và $a_4$ cùng dư $1$ ⇒ $1111-1=1110=3\cdot370$ ✓.</div></div>
    </div>

    <div class="formula-card">
      <h3>Câu 4: Đội bóng chơi đúng 14 trận</h3>
      <p><b>Đề bài:</b> Trong 30 ngày, mỗi ngày đội bóng chơi ít nhất 1 trận, tổng cộng không quá 45 trận. CMR có một khoảng ngày liên tục mà đội chơi đúng 14 trận.</p>
      <div class="box analogy"><b>Đề bài muốn nói gì?</b><br>Trong 30 ngày liên tiếp, mỗi ngày đội đá ít nhất 1 trận và cả tháng đá tối đa 45 trận. Đề khẳng định: dù lịch cụ thể ra sao, luôn tìm được <b>một dãy ngày liền nhau</b> (ví dụ từ ngày 5 đến ngày 9) mà <b>tổng số trận của những ngày đó đúng bằng 14</b>.</div><div class="box tip"><b>Ví dụ cụ thể minh họa đúng đề:</b><br>Một lịch cụ thể (số trận ngày 1 đến ngày 30): <b>2, 1, 1, 3, 1, 2, 1, 1, 2, 1, 1, 3, 1, 1, 2, 1, 1, 1, 2, 1, 1, 3, 1, 1, 2, 1, 1, 1, 1, 2</b> (tổng 43 ≤ 45). Các ngày từ <b>1</b> đến <b>9</b> cộng lại: 2 + 1 + 1 + 3 + 1 + 2 + 1 + 1 + 2 = 14 ✓. Đổi lịch khác thì khoảng ngày thay đổi, nhưng đề khẳng định luôn tìm được một khoảng như vậy.</div>
      <div class="btn-group"><button type="button" class="btn btn-hint" onclick="togglePanel('h-b7-4')">Xem Gợi ý</button><button type="button" class="btn btn-sol" onclick="togglePanel('s-b7-4')">Xem Lời giải chi tiết</button></div>
      <div id="h-b7-4" class="panel">"Khoảng liên tục" = hiệu của hai <b>tổng tích lũy</b>. Hãy so sánh $a_i$ với $a_j+14$.</div>
      <div id="s-b7-4" class="panel"><div class="box tip"><b>Cách nghĩ ra ý tưởng:</b><br>Số trận trong các ngày $j+1..i$ liên tiếp bằng $a_i-a_j$ (với $a_j$ là tổng số trận tới hết ngày $j$). Ta muốn $a_i-a_j=14$, tức $a_i=a_j+14$. Dirichlet chứng minh được "có hai số bằng nhau" khi bồ câu nhiều hơn chuồng, nên ta gom <b>cả hai dãy</b> $a_j$ và $a_j+14$ làm bồ câu.</div><div class="step"><b>Bước 1 — Đặt dãy tích lũy:</b><br>$a_j$ = số trận từ ngày 1 đến hết ngày $j$. Mỗi ngày ≥ 1 trận nên $1\le a_1<a_2<\dots<a_{30}\le45$ (tăng <b>ngặt</b> ⇒ các số đôi một khác nhau).</div><div class="step"><b>Bước 2 — Dãy thứ hai:</b><br>$a_1+14<\dots<a_{30}+14$ cũng đôi một khác nhau, và $15\le a_j+14\le59$.</div><div class="step"><b>Bước 3 — Dirichlet:</b><br>Gộp cả hai dãy ta có $30+30=60$ số, đều nằm trong $[1,59]$ (chỉ $59$ giá trị — chuồng). Vì $60>59$ nên có hai số bằng nhau.</div><div class="step"><b>Bước 4 — Hai số bằng nhau thuộc dãy nào?</b><br>Trong cùng một dãy các số khác nhau, nên một số thuộc dãy 1, số kia thuộc dãy 2: $a_i=a_j+14$. Vì $14>0$ nên $a_i>a_j$ ⇒ $i>j$.</div><div class="step"><b>Bước 5 — Ý nghĩa:</b><br>$a_i-a_j=14$ là tổng số trận của các ngày $j+1,\dots,i$ ⇒ đúng 14 trận (đpcm).</div><div class="box warn"><b>Vì sao đúng con số 45?</b> $45+14=59$ cho $59$ chuồng; còn $60$ bồ câu. Nếu tổng ≤ $46$ trận thì có $60$ chuồng, lập luận không còn chắc chắn.</div></div>
    </div>

    <div class="formula-card">
      <h3>Câu 5: Phòng thí nghiệm 15 máy trạm, 10 máy chủ</h3>
      <p><b>Đề bài:</b> Mỗi máy chủ chỉ có 1 kết nối hoạt động tại 1 thời điểm. Cần tối thiểu bao nhiêu dây để mọi nhóm $\le 10$ máy trạm luôn truy cập được các máy chủ khác nhau?</p>
      <div class="box analogy"><b>Đề bài muốn nói gì?</b><br>Phòng máy có 15 máy trạm $W_1..W_{15}$ và 10 máy chủ $S_1..S_{10}$; mỗi sợi cáp nối một máy trạm với một máy chủ. Nếu nối đủ mọi cặp thì cần $15\times10=150$ dây (quá tốn). Yêu cầu: lúc nào cũng có thể cho <b>bất kỳ nhóm tối đa 10 máy trạm</b> dùng <b>10 máy chủ khác nhau</b> cùng lúc (mỗi máy chủ chỉ phục vụ 1 máy tại một thời điểm). Hỏi số dây <b>ít nhất</b> cần mua là bao nhiêu?</div><div class="box tip"><b>Ví dụ cụ thể minh họa đúng đề:</b><br>Giả sử đã nối theo cách 60 dây. Ngày hôm nay nhóm 10 máy $\{W_1,W_2,W_3,W_4,W_7,W_{11},W_{12},W_{13},W_{14},W_{15}\}$ cần vào mạng. Phân công: $W_1\to S_1$, $W_2\to S_2$, $W_3\to S_3$, $W_4\to S_4$, $W_7\to S_7$ (dây riêng), còn $W_{11}\to S_5$, $W_{12}\to S_6$, $W_{13}\to S_8$, $W_{14}\to S_9$, $W_{15}\to S_{10}$ (nối đủ 10 máy chủ nên chọn được máy chủ còn trống). Cả 10 máy dùng 10 máy chủ khác nhau ✓.</div><figure class="fl"><svg viewBox="0 0 680 228" role="img"><rect x="30" y="25" width="170" height="60" rx="12" fill="var(--card)" stroke="var(--c2)" stroke-width="2.5"/><text x="115" y="61" text-anchor="middle" style="font-weight:800;">W1 … W10</text><rect x="30" y="135" width="170" height="60" rx="12" fill="var(--card)" stroke="var(--c4)" stroke-width="2.5"/><text x="115" y="171" text-anchor="middle" style="font-weight:800;">W11 … W15</text><rect x="480" y="80" width="170" height="60" rx="12" fill="var(--card)" stroke="var(--c1)" stroke-width="2.5"/><text x="565" y="116" text-anchor="middle" style="font-weight:800;">S1 … S10</text><line x1="200" y1="38" x2="480" y2="92" stroke="var(--c2)" stroke-width="2"/><line x1="200" y1="148" x2="480" y2="128" stroke="var(--c4)" stroke-width="2"/><line x1="200" y1="50" x2="480" y2="104" stroke="var(--c2)" stroke-width="2"/><line x1="200" y1="162" x2="480" y2="116" stroke="var(--c4)" stroke-width="2"/><line x1="200" y1="62" x2="480" y2="116" stroke="var(--c2)" stroke-width="2"/><line x1="200" y1="176" x2="480" y2="104" stroke="var(--c4)" stroke-width="2"/><text x="290" y="52" text-anchor="middle" style="fill:var(--c2);font-size:12.5px">mỗi Wk nối đúng Sk: 10 dây</text><text x="290" y="214" text-anchor="middle" style="fill:var(--c4);font-size:12.5px">mỗi máy nối đủ 10 server: 5×10 = 50 dây</text><text x="565" y="168" text-anchor="middle" style="font-weight:800;fill:var(--c5);font-size:15px">Tổng 60 dây</text></svg><figcaption>Cách nối tối thiểu: 10 + 50 = 60 kết nối.</figcaption></figure>
      <div class="btn-group"><button type="button" class="btn btn-hint" onclick="togglePanel('h-b7-5')">Xem Gợi ý</button><button type="button" class="btn btn-sol" onclick="togglePanel('s-b7-5')">Xem Lời giải chi tiết</button></div>
      <div id="h-b7-5" class="panel">Bài "tối thiểu" cần 2 phần: (1) chỉ ra một cách nối đạt được, (2) chứng minh ít hơn thì không được. Với (2) hãy thử một máy chủ chỉ có $\le5$ dây.</div>
      <div id="s-b7-5" class="panel"><div class="box tip"><b>Cách nghĩ ra ý tưởng:</b><br>Chữ "tối thiểu $N$" luôn gồm hai nửa: <b>cận trên</b> (có cách làm với $N$) và <b>cận dưới</b> (không thể làm với ít hơn $N$). Cận dưới thường dùng phản chứng + Dirichlet: một máy chủ ít dây sẽ "bỏ rơi" quá nhiều máy trạm.</div><div class="step"><b>Bước 1 — Cách nối 60 dây:</b><br>$W_k$ nối $S_k$ ($k=1..10$): $10$ dây. Mỗi máy $W_{11},\dots,W_{15}$ nối đủ $10$ máy chủ: $5\cdot10=50$ dây. Tổng $60$.</div><div class="step"><b>Bước 2 — Kiểm tra cách nối hợp lệ:</b><br>Nhóm có $u$ máy trong $W_{1..10}$ và $v$ máy trong $W_{11..15}$, $u+v\le10$. Các máy loại 1 dùng $u$ máy chủ riêng; còn $10-u\ge v$ máy chủ trống cho $v$ máy loại 2 (vì chúng nối được với mọi máy chủ).</div><div class="step"><b>Bước 3 — Cận dưới — phản chứng:</b><br>Giả sử có máy chủ $S$ với $\le5$ dây. Khi đó có $\ge15-5=10$ máy trạm <b>không</b> nối với $S$. Chọn đúng 10 máy đó: họ chỉ dùng được $9$ máy chủ còn lại ⇒ $10$ máy vào $9$ máy chủ, theo Dirichlet có $2$ máy phải dùng chung ⇒ vi phạm yêu cầu.</div><div class="step"><b>Bước 4 — Kết luận:</b><br>Mỗi máy chủ cần $\ge6$ dây ⇒ tổng $\ge10\cdot6=60$. Cận trên $=$ cận dưới nên đáp số là $\mathbf{60}$.</div></div>
    </div>

    <div class="formula-card">
      <h3>Câu 6: Nhóm 6 người: 3 bạn hoặc 3 thù</h3>
      <p><b>Đề bài:</b> Nhóm 6 người, mỗi cặp là bạn hoặc kẻ thù của nhau. CMR có 3 người đôi một là bạn hoặc 3 người đôi một là thù. (Đề trên slide diễn đạt hơi lủng củng, ý chuẩn là như vậy.)</p>
      <div class="box analogy"><b>Đề bài muốn nói gì?</b><br>Một nhóm 6 người, <b>mỗi cặp</b> hoặc là bạn hoặc là kẻ thù (không có quan hệ thứ ba). Đề khẳng định: luôn có <b>3 người đôi một là bạn</b> hoặc <b>3 người đôi một là kẻ thù</b>. Hiểu "đôi một" là: cả 3 cặp trong 3 người đó đều cùng một loại quan hệ.</div><div class="box tip"><b>Ví dụ cụ thể minh họa đúng đề:</b><br>6 người: An, Bình, Chi, Dũng, Em, Phúc. Giả sử chỉ có các cặp giữa nhóm $\{$An, Bình, Chi$\}$ và nhóm $\{$Dũng, Em, Phúc$\}$ là bạn (9 cặp bạn), còn lại là thù. Không có 3 người đôi một là bạn, nhưng An, Bình, Chi đôi một là thù ✓ (3 cặp An–Bình, Bình–Chi, An–Chi đều là thù). Đề nói: kiểu quan hệ nào cũng sẽ có 3 người như vậy.</div><figure class="fl"><svg viewBox="0 0 680 205" role="img"><line x1="150" y1="100" x2="400" y2="45" stroke="var(--c2)" stroke-width="3"/><line x1="150" y1="100" x2="560" y2="100" stroke="var(--c2)" stroke-width="3"/><line x1="150" y1="100" x2="400" y2="155" stroke="var(--c2)" stroke-width="3"/><line x1="400" y1="45" x2="560" y2="100" stroke="var(--c4)" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="560" y1="100" x2="400" y2="155" stroke="var(--c4)" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="400" y1="45" x2="400" y2="155" stroke="var(--c4)" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="150" cy="100" r="20" fill="var(--c5)"/><text x="150" y="105" text-anchor="middle" style="fill:#fff;font-weight:800">A</text><circle cx="400" cy="45" r="20" fill="var(--c5)"/><text x="400" y="50" text-anchor="middle" style="fill:#fff;font-weight:800">B</text><circle cx="560" cy="100" r="20" fill="var(--c5)"/><text x="560" y="105" text-anchor="middle" style="fill:#fff;font-weight:800">C</text><circle cx="400" cy="155" r="20" fill="var(--c5)"/><text x="400" y="160" text-anchor="middle" style="fill:#fff;font-weight:800">D</text><text x="250" y="58" text-anchor="middle" style="fill:var(--c2);font-weight:800">bạn</text><text x="150" y="150" text-anchor="middle" style="font-size:12.5px">A có ít nhất 3 bạn B, C, D</text><text x="500" y="190" text-anchor="middle" style="font-size:11.5px;fill:var(--mut)">nét đứt: nếu có 1 cặp bạn ⇒ tam giác bạn với A; nếu cả 3 cặp đều là thù ⇒ tam giác thù</text></svg><figcaption>Chọn người A: 5 người còn lại chia 2 nhóm (bạn/thù) ⇒ một nhóm có ít nhất ⌈5/2⌉ = 3 người.</figcaption></figure>
      <div class="btn-group"><button type="button" class="btn btn-hint" onclick="togglePanel('h-b7-6')">Xem Gợi ý</button><button type="button" class="btn btn-sol" onclick="togglePanel('s-b7-6')">Xem Lời giải chi tiết</button></div>
      <div id="h-b7-6" class="panel">Chọn một người $A$ làm mốc rồi chia 5 người còn lại thành 2 nhóm theo quan hệ với $A$.</div>
      <div id="s-b7-6" class="panel"><div class="box tip"><b>Cách nghĩ ra ý tưởng:</b><br>Có 2 loại quan hệ (bạn/thù) nên nghĩ ngay tới "2 chuồng". Nhưng quan hệ là giữa <i>cặp</i> người, nên ta cố định một người $A$ để mỗi người còn lại có đúng 1 quan hệ với $A$: được $5$ bồ câu vào $2$ chuồng. Định lý 2: $\lceil5/2\rceil=3$.</div><div class="step"><b>Bước 1 — Chọn mốc và chia chuồng:</b><br>Chọn $A$. Chuồng 1 = bạn của $A$, chuồng 2 = thù của $A$. Có $5$ người, nếu mỗi chuồng $\le2$ người thì tổng $\le4<5$ ⇒ một chuồng có $\ge3$ người.</div><div class="step"><b>Bước 2 — Xét trường hợp 3 bạn của $A$:</b><br>Gọi họ là $B,C,D$. Xét 3 cặp $BC,CD,BD$.</div><div class="step"><b>Bước 3 — Hai khả năng:</b><br>(i) Có một cặp là bạn, ví dụ $B,C$: $A$ bạn $B$, $A$ bạn $C$, $B$ bạn $C$ ⇒ $A,B,C$ đôi một bạn. (ii) Không cặp nào là bạn ⇒ $B,C,D$ đôi một là thù.</div><div class="step"><b>Bước 4 — Trường hợp còn lại:</b><br>Nếu chuồng thù có $\ge3$ người thì lập luận y hệt, chỉ đổi vai "bạn" ↔ "thù" (đpcm).</div><div class="box warn"><b>Vì sao cần 6 người?</b> Với 5 người, ví dụ ngũ giác (mỗi người chỉ là bạn của 2 người kề bên, thù với 2 người còn lại) thì không có nhóm 3 người nào cùng bạn hoặc cùng thù. Nên 6 là số nhỏ nhất.</div></div>
    </div>
  </section>

  <section class="sum">
    <h2>Tổng Kết Bài 7: Những Điều Cốt Lõi Cần Nhớ</h2>
    <ul>
      <li><b>Cộng / Nhân:</b> "hoặc" (các nhóm rời nhau) ⇒ cộng; "và" (các bước nối tiếp) ⇒ nhân. Số hàm $m\to n$ là $n^m$, số tập con là $2^{|S|}$.</li>
      <li><b>Bù trừ:</b> $|A\cup B|=|A|+|B|-|A\cap B|$. <b>Luật chia:</b> mỗi kết quả bị đếm $d$ lần ⇒ chia cho $d$.</li>
      <li><b>Dirichlet:</b> $k+1$ vật vào $k$ hộp ⇒ có hộp $\ge2$ vật; tổng quát là $\lceil k/b\rceil$. Muốn chứng minh, hãy nghĩ trước: <b>chuồng là gì, bồ câu là gì?</b></li>
    </ul>
  </section>
</template>

<script>
const $ = id => document.getElementById(id);

/* 1. Hàm đóng/mở khung Gợi ý & Lời giải chi tiết */
function togglePanel(id) {
  const el = $(id);
  if (el) el.classList.toggle('open');
}
window.togglePanel = togglePanel;

/* ==========================================================================
   MÔ HÌNH TƯƠNG TÁC BÀI 5: MẠCH LOGIC & TIỂU HẠNG (MINTERM)
   ========================================================================== */
let currentBoolMode = 'vote';

function selectBoolMode(mode, btn) {
  currentBoolMode = mode;
  if (btn) {
    document.querySelectorAll('#bool-tabs .sim-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  renderBoolSim();
}
window.selectBoolMode = selectBoolMode;

function renderBoolSim() {
  const svgEl = $('bool-svg'), descEl = $('bool-desc');
  if (!svgEl || !descEl) return;

  const x = +$('sl-bx').value;
  const y = +$('sl-by').value;
  const z = +$('sl-bz').value;

  $('val-bx').textContent = x;
  $('val-by').textContent = y;
  $('val-bz').textContent = z;

  const mintermLatex = `${x ? 'x' : '\\overline{x}'}${y ? 'y' : '\\overline{y}'}${z ? 'z' : '\\overline{z}'}`;
  let outVal = 0, out2Val = 0, exprText = '', circuitTitle = '';

  if (currentBoolMode === 'vote') {
    outVal = (x && y) || (x && z) || (y && z) ? 1 : 0;
    circuitTitle = 'Mạch Biểu Quyết Đa Số (3 người $x, y, z$)';
    exprText = `Đầu ra $F(x,y,z) = xy + xz + yz = ${x}\\cdot${y} + ${x}\\cdot${z} + ${y}\\cdot${z} = \\mathbf{${outVal}}$ (${outVal ? 'Đề xuất ĐƯỢC THÔNG QUA' : 'Đề xuất BỊ TỪ CHỐI'}).`;
  } else if (currentBoolMode === 'adder') {
    outVal = (x ^ y); // Sum
    out2Val = (x & y); // Carry
    circuitTitle = 'Bộ Bán Cộng Nhị Phân (Half Adder — dùng 2 bit $x, y$)';
    exprText = `Bit Tổng $\\text{Sum} = (x+y)\\overline{(xy)} = \\mathbf{${outVal}}$ | Bit Nhớ $\\text{Carry} = xy = \\mathbf{${out2Val}}$ (Kết quả nhị phân: $x+y = ${out2Val}${outVal}_2$).`;
  } else {
    outVal = (x ^ y ^ z);
    circuitTitle = 'Mạch Điều Khiển Đèn Cầu Thang 3 Công Tắc ($x, y, z$)';
    exprText = `Đầu ra $F = xyz + x\\overline{y}\\overline{z} + \\overline{x}y\\overline{z} + \\overline{x}\\overline{y}z = \\mathbf{${outVal}}$ (${outVal ? 'ĐÈN ĐANG SÁNG' : 'ĐÈN ĐANG TẮT'}).`;
  }

  descEl.innerHTML = `<b>${circuitTitle}:</b> Bộ đầu vào hiện tại là $(x=${x}, y=${y}, z=${z})$ ứng với tiểu hạng $\\mathbf{${mintermLatex} = 1}$.<br>${exprText}`;

  const cOn = 'var(--c2)', cOff = 'var(--mut)';
  const colX = x ? cOn : cOff;
  const colY = y ? cOn : cOff;
  const colZ = z ? cOn : cOff;
  const colOut = outVal ? 'var(--c4)' : cOff;

  let svg = '';
  // Vẽ 3 nút đầu vào bên trái
  const drawNode = (cx, cy, label, val, col) => `
    <rect x="${cx-36}" y="${cy-18}" width="72" height="36" rx="10" fill="var(--card)" stroke="${col}" stroke-width="2.5"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" style="font-weight:800;fill:${col}">${label} = ${val}</text>
  `;

  svg += drawNode(65, 50, 'x', x, colX);
  svg += drawNode(65, 115, 'y', y, colY);
  if (currentBoolMode !== 'adder') {
    svg += drawNode(65, 180, 'z', z, colZ);
  }

  // Vẽ khối xử lý trung tâm & đường dây
  if (currentBoolMode === 'adder') {
    const colCarry = out2Val ? 'var(--c1)' : cOff;
    svg += `<line x1="101" y1="50" x2="250" y2="70" stroke="${colX}" stroke-width="3"/>`;
    svg += `<line x1="101" y1="115" x2="250" y2="90" stroke="${colY}" stroke-width="3"/>`;
    svg += `<line x1="101" y1="50" x2="250" y2="155" stroke="${colX}" stroke-width="3"/>`;
    svg += `<line x1="101" y1="115" x2="250" y2="175" stroke="${colY}" stroke-width="3"/>`;

    svg += `<rect x="250" y="50" width="170" height="55" rx="14" fill="var(--card)" stroke="var(--c5)" stroke-width="2.5"/>`;
    svg += `<text x="335" y="83" text-anchor="middle" style="font-weight:700">Cổng XOR: (x+y)(xy)'</text>`;

    svg += `<rect x="250" y="138" width="170" height="55" rx="14" fill="var(--card)" stroke="var(--c1)" stroke-width="2.5"/>`;
    svg += `<text x="335" y="171" text-anchor="middle" style="font-weight:700">Cổng AND: x · y</text>`;

    svg += `<line x1="420" y1="78" x2="520" y2="78" stroke="${colOut}" stroke-width="3.5"/>`;
    svg += `<line x1="420" y1="165" x2="520" y2="165" stroke="${colCarry}" stroke-width="3.5"/>`;

    svg += `<rect x="520" y="53" width="135" height="50" rx="14" fill="var(--card)" stroke="${colOut}" stroke-width="3"/>`;
    svg += `<text x="587" y="83" text-anchor="middle" style="font-weight:800;fill:${colOut}">Sum = ${outVal}</text>`;

    svg += `<rect x="520" y="140" width="135" height="50" rx="14" fill="var(--card)" stroke="${colCarry}" stroke-width="3"/>`;
    svg += `<text x="587" y="170" text-anchor="middle" style="font-weight:800;fill:${colCarry}">Carry = ${out2Val}</text>`;
  } else {
    svg += `<line x1="101" y1="50" x2="230" y2="95" stroke="${colX}" stroke-width="3"/>`;
    svg += `<line x1="101" y1="115" x2="230" y2="115" stroke="${colY}" stroke-width="3"/>`;
    svg += `<line x1="101" y1="180" x2="230" y2="135" stroke="${colZ}" stroke-width="3"/>`;

let currentCryptoMode = 'rsa';

// Hàm lũy thừa mô-đu-lô nhanh chuẩn xác
function modPow(base, exp, mod) {
  let res = 1n;
  let b = BigInt(base) % BigInt(mod);
  let e = BigInt(exp);
  const m = BigInt(mod);
  while (e > 0n) {
    if (e % 2n === 1n) res = (res * b) % m;
    b = (b * b) % m;
    e /= 2n;
  }
  return Number(res);
}

function selectCryptoMode(mode, btn) {
  currentCryptoMode = mode;
  if (btn) {
    document.querySelectorAll('#crypto-tabs .sim-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  renderCryptoSim();
}

let currentIndMode = 'odd';

function selectIndMode(mode, btn) {
  currentIndMode = mode;

    document.querySelectorAll('#ind-tabs .sim-tab').forEach(b => b.classList.remove('active'));

function renderIndSim() {
  const svgEl = $('ind-svg'), descEl = $('ind-desc');
  if (!svgEl || !descEl) return;

  const n = +$('sl-ind-n').value;
  const a = +$('sl-ind-a').value;
  $('val-ind-n').textContent = n;
  $('val-ind-a').textContent = a;

  const colors = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
  let svg = '';

  if (currentIndMode === 'odd') {
    const terms = [];
    for (let i = 1; i <= n; i++) terms.push(2 * i - 1);
    const lastOdd = 2 * n - 1;
    descEl.innerHTML = `<b>Chứng minh hình học Tổng $n = ${n}$ số lẻ đầu tiên:</b> Mỗi bước quy nạp từ $k-1 \\to k$ chính là ghép thêm một đường viền chữ L gồm $\\mathbf{2k-1}$ ô vuông vào hình vuông cũ!<br>
    $$${terms.join(' + ')} = \\mathbf{${n}^2 = ${n * n}}$$
    Lớp ngoài cùng vừa ghép thêm (bậc $n=${n}$) có đúng $2(${n})-1 = \\mathbf{${lastOdd}}$ ô vuông.`;

    const cellSize = Math.min(18, Math.floor(185 / n));
    const startX = 75, startY = 30;

    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const layer = Math.max(r, c);
        const col = colors[layer % colors.length];
        const isOuter = (layer === n - 1);
        svg += `<rect x="${startX + c * cellSize}" y="${startY + r * cellSize}" width="${cellSize - 2}" height="${cellSize - 2}" rx="3" fill="${col}" opacity="${isOuter ? '1' : '0.45'}"/>`;
      }
    }

    svg += `<rect x="315" y="38" width="335" height="172" rx="16" fill="var(--card)" stroke="var(--c5)" stroke-width="2.5"/>`;
    svg += `<text x="482" y="72" text-anchor="middle" style="font-weight:800;fill:var(--c5)">BƯỚC QUY NẠP P(${n - 1}) → P(${n})</text>`;
    svg += `<text x="482" y="108" text-anchor="middle" style="font-size:14px">Hình vuông cũ P(${n - 1}): ${(n - 1)}² = ${(n - 1) * (n - 1)} ô</text>`;
    svg += `<text x="482" y="138" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--c4)">+ Viền chữ L mới (2·${n} - 1): + ${lastOdd} ô</text>`;
    svg += `<text x="482" y="176" text-anchor="middle" style="font-size:18px;font-weight:800;fill:var(--c2)">Tổng P(${n}) = ${n}² = ${n * n} ô vuông</text>`;

  } else if (currentIndMode === 'fib') {
    const fib = [0, 1];
    for (let i = 2; i <= 12; i++) fib[i] = fib[i - 1] + fib[i - 2];
    const alpha = (1 + Math.sqrt(5)) / 2;
    const fn = fib[n];
    const bound = Math.pow(alpha, n - 2);

    descEl.innerHTML = `<b>Dãy Đệ quy Fibonacci & Cận dưới Tỷ lệ vàng (Ví dụ 6 Mục 3.3):</b> Tại $n = \\mathbf{${n}}$, ta có:<br>
    • Công thức đệ quy: $f_{${n}} = ${n >= 2 ? `f_{${n - 1}} + f_{${n - 2}} = ${fib[n - 1]} + ${fib[n - 2]} = ` : ''}\\mathbf{${fn}}$.<br>
    • So sánh với $\\alpha^{n-2}$ (với $\\alpha = \\frac{1+\\sqrt{5}}{2} \\approx 1.618$): $f_{${n}} = \\mathbf{${fn}}$ ${n >= 3 ? `> \\alpha^{${n - 2}} \\approx \\mathbf{${bound.toFixed(2)}}` : '(Bất đẳng thức xét từ $n \\ge 3$)'}.`;

    const ox = 55, oy = 205, gw = 580, gh = 165;
    svg += `<line x1="${ox}" y1="25" x2="${ox}" y2="${oy}" stroke="var(--ink)" stroke-width="2"/>`;
    svg += `<line x1="${ox}" y1="${oy}" x2="${ox + gw}" y2="${oy}" stroke="var(--ink)" stroke-width="2"/>`;

    const maxF = fib[Math.max(n, 6)];
    for (let i = 1; i <= n; i++) {
      const cx = ox + (i / (n + 0.6)) * gw;
      const barH = (fib[i] / maxF) * (gh - 15);
      const bH = i >= 3 ? (Math.pow(alpha, i - 2) / maxF) * (gh - 15) : 0;

      svg += `<rect x="${cx - 16}" y="${oy - barH}" width="32" height="${barH}" rx="6" fill="var(--c1)" opacity="${i === n ? '1' : '0.65'}"/>`;
      svg += `<text x="${cx}" y="${oy - barH - 7}" text-anchor="middle" style="font-size:12px;font-weight:800;fill:var(--c1)">f_${i}=${fib[i]}</text>`;
      svg += `<text x="${cx}" y="${oy + 20}" text-anchor="middle" style="font-size:12px;fill:var(--mut)">n=${i}</text>`;

      if (i >= 3) {
        svg += `<circle cx="${cx}" cy="${oy - bH}" r="5.5" fill="var(--c4)"/>`;
      }
    }
    svg += `<text x="345" y="242" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:var(--c4)">● Chấm hồng: Giá trị cận dưới α^(n-2) luôn nằm thấp hơn cột f_n với mọi n ≥ 3</text>`;

  } else {
    // So sánh số phép nhân giữa Thuật toán 1 và Bài 16, Bài 18*
    const exp2n = Math.pow(2, n);
    let fastMults = 0;
    let tempN = n;
    while (tempN > 0) {
      fastMults += (tempN % 2 === 1) ? 2 : 1;
      tempN = Math.floor(tempN / 2);
    }
    if (n > 0) fastMults -= 1; // Bước cơ sở đến n=1 không tốn phép nhân thừa

    descEl.innerHTML = `<b>So sánh Thuật toán Đệ quy Lũy thừa (Bài 16 - 19* Mục 3.4) với cơ số $a = ${a}, n = ${n}$:</b><br>
    • <b>Bài toán 1 (Tính $a^{2^n} = ${a}^{${exp2n}}$):</b> Thuật toán 1 tốn $\\mathbf{2^{${n}} = ${exp2n}}$ phép nhân, trong khi Thuật toán Đệ quy Bài 16 chỉ tốn đúng $\\mathbf{${n}}$ <b>phép nhân</b>!<br>
    • <b>Bài toán 2 (Tính $a^n = ${a}^{${n}} = ${Math.pow(a, n)}$):</b> Thuật toán 1 tốn $\\mathbf{${n}}$ phép nhân, còn Đệ quy Chia để trị Bài 18* ($n = (${n.toString(2)})_2$) chỉ tốn $\\mathbf{${fastMults}}$ <b>phép nhân</b>!`;

    svg += `
      <rect x="28" y="38" width="295" height="175" rx="16" fill="var(--card)" stroke="var(--c4)" stroke-width="2.5"/>
      <text x="175" y="70" text-anchor="middle" style="font-weight:800;fill:var(--c4)">SO SÁNH TÍNH a^(2^n) = ${a}^${exp2n}</text>
      <text x="175" y="108" text-anchor="middle" style="font-size:14px">Thuật toán 1 (Cổ điển): <tspan style="font-weight:800;fill:var(--c4)">${exp2n} phép nhân</tspan></text>
      <text x="175" y="142" text-anchor="middle" style="font-size:14px">Bài tập 16 (Bình phương): <tspan style="font-weight:800;fill:var(--c2)">${n} phép nhân</tspan></text>
      <text x="175" y="182" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--mut)">Tiết kiệm: ${exp2n - n} phép nhân!</text>

      <rect x="355" y="38" width="295" height="175" rx="16" fill="var(--card)" stroke="var(--c2)" stroke-width="2.5"/>
      <text x="502" y="70" text-anchor="middle" style="font-weight:800;fill:var(--c2)">SO SÁNH TÍNH a^n = ${a}^${n} = ${Math.pow(a, n)}</text>
      <text x="502" y="108" text-anchor="middle" style="font-size:14px">Thuật toán 1 (a · a^(n-1)): <tspan style="font-weight:800;fill:var(--c4)">${n} phép nhân</tspan></text>
      <text x="502" y="142" text-anchor="middle" style="font-size:14px">Bài tập 18* (Chia đôi mũ): <tspan style="font-weight:800;fill:var(--c2)">${fastMults} phép nhân</tspan></text>
      <text x="502" y="182" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--c5)">Nhị phân của n: (${n.toString(2)})₂</text>
    `;
  }

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}

function buildTOC() {
  const tocContainer = $('toc-links');
  if (!tocContainer) return;
  let html = '', idx = 0;
  document.querySelectorAll('#app-content h2, #app-content h3').forEach(el => {
    const title = el.textContent.trim();
    const isSub = el.tagName === 'H3';
    const target = isSub ? el : (el.closest('section') || el);
    if (!target.id) target.id = 'sec-' + (idx++);
    html += `<a href="#${target.id}" class="${isSub ? 'sub' : 'grp'}">${title}</a>`;
  });
  tocContainer.innerHTML = html;
}

function upgradeCustomSelects(root = document) {
  root.querySelectorAll('select').forEach(sel => {
    if (sel.dataset.customized === 'true') {
      if (sel._syncCustomUI) sel._syncCustomUI();
      return;
    }
    sel.dataset.customized = 'true';
    sel.classList.add('native-select-hidden');

    const wrap = document.createElement('div');
    wrap.className = 'csel-wrap';

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'csel-trigger';

    const labelSpan = document.createElement('span');
    labelSpan.className = 'csel-label';

    const arrowBox = document.createElement('span');
    arrowBox.className = 'csel-arrow';

    trigger.appendChild(labelSpan);
    trigger.appendChild(arrowBox);

    const menu = document.createElement('div');
    menu.className = 'csel-menu';

    const syncUI = () => {
      const selectedOpt = sel.options[sel.selectedIndex] || sel.options[0];
      labelSpan.textContent = selectedOpt ? selectedOpt.textContent : '';
      menu.querySelectorAll('.csel-opt').forEach((item, idx) => {
        item.classList.toggle('selected', idx === sel.selectedIndex);
      });
    };
    sel._syncCustomUI = syncUI;

    Array.from(sel.options).forEach((opt, idx) => {
      const item = document.createElement('div');
      item.className = 'csel-opt' + (idx === sel.selectedIndex ? ' selected' : '');
      item.textContent = opt.textContent;
      item.onclick = (e) => {
        e.stopPropagation();
        sel.selectedIndex = idx;
        sel.value = opt.value;
        syncUI();
        wrap.classList.remove('open');
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      };
      menu.appendChild(item);
    });

    syncUI();

    trigger.onclick = (e) => {
      e.stopPropagation();
      const isOpen = wrap.classList.contains('open');
      document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));
      if (!isOpen) wrap.classList.add('open');
    };

    wrap.appendChild(trigger);
    wrap.appendChild(menu);
    sel.insertAdjacentElement('afterend', wrap);
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));
});

function loadLesson(lessonId) {
  const mainEl = $('app-content');
  const tpl = $('tpl-buoi-' + lessonId);

  if (tpl) {
    mainEl.innerHTML = tpl.innerHTML;
    if (lessonId === '3') {
      renderBoolSim();
    } else if (lessonId === '4') {
      renderCryptoSim();
    } else if (lessonId === '5') {
      renderIndSim();
    }
  }

  upgradeCustomSelects(document);
  buildTOC();
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([mainEl]);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.loadLesson = loadLesson;

/* Khởi chạy ứng dụng & cài đặt đóng/mở menu góc trái */
(function initApp() {
  const btn = $('mb'), nav = $('mn');
  const setOpen = open => {
    nav.hidden = !open;
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu chọn bài và mục lục');
  };
  btn.onclick = () => setOpen(nav.hidden);
  nav.onclick = e => {
    if (e.target.closest('a')) setOpen(false);
  };
  document.addEventListener('click', e => {
    if (!nav.hidden && !nav.contains(e.target) && !btn.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !nav.hidden) {
      setOpen(false);
      btn.focus();
    }
  });

  /* Chế độ xem Điện thoại / Máy tính (lưu lại lựa chọn) */
  const store = (k, v) => { try { return v ? localStorage.setItem(k, v) : localStorage.getItem(k); } catch (e) { return null; } };
  const applyView = v => {
    document.documentElement.dataset.view = v;
    $('vm').setAttribute('aria-pressed', v === 'mobile');
    $('vd').setAttribute('aria-pressed', v === 'desktop');
    store('toan-roi-rac-view', v);
  };
  $('vm').onclick = () => applyView('mobile');
  $('vd').onclick = () => applyView('desktop');
  const savedView = store('toan-roi-rac-view');
  applyView(savedView === 'desktop' || savedView === 'mobile' ? savedView : (window.innerWidth >= 1000 ? 'desktop' : 'mobile'));

  /* Tô sáng mục đang xem trong mục lục */
  addEventListener('scroll', () => {
    let cur = null;
    document.querySelectorAll('#toc-links a').forEach(a => {
      const t = document.getElementById(a.getAttribute('href').slice(1));
      if (t && t.getBoundingClientRect().top <= 120) cur = a;
      a.classList.remove('on');
    });
    if (cur) cur.classList.add('on');
  }, { passive: true });

  // Mặc định mở Phần 4 (Bài 6 - Lý thuyết số & Mật mã hóa RSA) để xem ngay Mục 5.1 vừa bổ sung
  $('lesson-select').value = '6';
  loadLesson('6');
})();
</script>
