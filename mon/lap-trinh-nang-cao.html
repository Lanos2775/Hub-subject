<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- [THAY ĐỔI 1]: Đổi tiêu đề dự án của bạn tại đây -->
<title>Lập trình nâng cao – Java (UET.CS2043)</title>

<!-- Font chữ Be Vietnam Pro hiện đại, hỗ trợ tiếng Việt hoàn hảo -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">



<style>
/* ==========================================================================
   1. BẢNG MÀU & BIẾN HỆ THỐNG (Tự động thích ứng Light Mode / Dark Mode)
   ========================================================================== */
:root {
  --bg: #f6f8ff;
  --card: #ffffff;
  --ink: #1d2350;
  --mut: #58608a;
  --c1: #2f6fed; /* Xanh dương chủ đạo */
  --c2: #12b886; /* Xanh ngọc lục bảo */
  --c3: #f59f00; /* Vàng cam nổi bật */
  --c4: #e64980; /* Hồng đậm cảnh báo/nhấn mạnh */
  --c5: #7048e8; /* Tím hiện đại */
  --g: #c9cfe8;  /* Màu viền lưới */
  --tint: #eaf0ff; /* Màu nền phụ */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10142e;
    --card: #1a2046;
    --ink: #eef0ff;
    --mut: #a4abd6;
    --c1: #6ea0ff;
    --c2: #38d9a9;
    --c3: #ffd43b;
    --c4: #ff8fb8;
    --c5: #a78bfa;
    --g: #3b4380;
    --tint: #222b5e;
  }
}

:root[data-theme="dark"] {
  --bg: #10142e;
  --card: #1a2046;
  --ink: #eef0ff;
  --mut: #a4abd6;
  --c1: #6ea0ff;
  --c2: #38d9a9;
  --c3: #ffd43b;
  --c4: #ff8fb8;
  --c5: #a78bfa;
  --g: #3b4380;
  --tint: #222b5e;
}

/* ==========================================================================
   2. CẤU TRÚC BỐ CỤC & TYPOGRAPHY (Đã dãn dòng thoáng mắt)
   ========================================================================== */
html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17.5px/1.92 "Be Vietnam Pro", system-ui, sans-serif;
  letter-spacing: 0.01em;
}
main { max-width: 860px; margin: 0 auto; padding: 28px 20px 90px; }
header { padding: 38px 0 14px; }

h1 {
  font-size: clamp(30px, 6.5vw, 46px);
  line-height: 1.2;
  margin: 10px 0 16px;
  font-weight: 800;
  letter-spacing: -1px;
  background: linear-gradient(90deg, var(--c1), var(--c5), var(--c4));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
h2 { font-size: 24px; line-height: 1.4; margin: 0 0 16px; font-weight: 800; }
h3 { font-size: 19.5px; line-height: 1.45; margin: 30px 0 12px; color: var(--c5); font-weight: 800; }

section {
  background: var(--card);
  border-radius: 22px;
  padding: 30px 28px;
  margin: 28px 0;
  border-left: 8px solid var(--c1);
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
}
section:nth-of-type(5n+2) { border-color: var(--c2); }
section:nth-of-type(5n+3) { border-color: var(--c3); }
section:nth-of-type(5n+4) { border-color: var(--c4); }
section:nth-of-type(5n+5) { border-color: var(--c5); }

p { margin: 16px 0; line-height: 1.95; }
.mut { color: var(--mut); }
ul, ol { margin: 14px 0; padding-left: 24px; }
li { margin: 12px 0; line-height: 1.9; }

/* Hộp thông tin, mẹo, cảnh báo, ví dụ ẩn dụ */
.box { background: var(--tint); border-radius: 14px; padding: 18px 22px; margin: 20px 0; line-height: 1.95; }
.tip { border-left: 5px solid var(--c3); }
.warn { border-left: 5px solid var(--c4); }
.analogy { border-left: 5px solid var(--c2); }

/* Hộp công thức và phân số */
.f {
  background: var(--tint);
  border-radius: 14px;
  padding: 18px 20px;
  margin: 18px 0;
  font-size: 18px;
  overflow-x: auto;
  text-align: center;
  line-height: 2;
}
.f small {
  font: 14.5px/1.75 "Be Vietnam Pro", sans-serif;
  font-style: normal;
  color: var(--mut);
  display: block;
  margin-top: 8px;
}

/* Đồ họa Vector SVG & Nhãn màu (Badges) */
svg {
  width: 100%;
  height: auto;
  display: block;
  margin: 16px 0;
  background: var(--tint);
  border-radius: 14px;
  border: 1px solid var(--g);
}
.ax { stroke: var(--g); stroke-width: 1.5; }
svg text { fill: var(--ink); font: 13px "Be Vietnam Pro", sans-serif; }

.k {
  display: inline-block;
  padding: 3px 11px;
  border-radius: 8px;
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  vertical-align: middle;
  margin: 2px 4px 2px 0;
}
.b1 { background: var(--c1); }
.b2 { background: var(--c2); }
.b3 { background: var(--c3); color: #222; }
.b4 { background: var(--c4); }
.b5 { background: var(--c5); }

/* Bảng dữ liệu */
.tw { overflow-x: auto; margin: 18px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; min-width: 480px; line-height: 1.75; }
td, th { padding: 13px 14px; border-bottom: 1px solid var(--g); text-align: left; }
th { color: var(--c5); font-weight: 800; background: var(--tint); }
.sum li { margin: 12px 0; }

/* ==========================================================================
   3. HỆ THỐNG NÚT BẤM, TAB MÔ HÌNH & DROPDOWN TÙY CHỈNH (Không dùng mặc định)
   ========================================================================== */
.btn-group { display: flex; gap: 14px; flex-wrap: wrap; margin: 20px 0 12px; }
.btn {
  appearance: none; -webkit-appearance: none;
  border: 2px solid transparent;
  border-radius: 999px;
  padding: 12px 26px;
  font: 700 15px/1.4 "Be Vietnam Pro", system-ui, sans-serif;
  cursor: pointer;
  transition: all .24s cubic-bezier(.2,.8,.2,1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  letter-spacing: 0.01em;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
  transition: transform .2s ease;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
.btn:hover::before { transform: scale(1.3); }
.btn:active { transform: translateY(0) scale(0.97); }

.btn-hint {
  background: var(--tint);
  color: var(--ink);
  border-color: var(--c3);
  box-shadow: 0 4px 14px rgba(245,159,0,.18);
}
.btn-hint::before { background: var(--c3); box-shadow: 0 0 8px var(--c3); }
.btn-hint:hover {
  background: linear-gradient(135deg, #fff3bf, #ffe066);
  color: #1d2350;
  box-shadow: 0 8px 22px rgba(245,159,0,.32);
}

.btn-sol {
  background: linear-gradient(135deg, var(--c1), var(--c5));
  color: #fff;
  box-shadow: 0 6px 18px rgba(112,72,232,.32);
}
.btn-sol::before { background: #fff; box-shadow: 0 0 8px #fff; }
.btn-sol:hover { box-shadow: 0 10px 26px rgba(112,72,232,.48); }

/* Khung ẩn/hiện Gợi ý & Lời giải */
.panel {
  display: none;
  margin-top: 16px;
  padding: 20px 22px;
  border-radius: 14px;
  background: var(--tint);
  border: 1px solid var(--g);
  line-height: 1.95;
}
.panel.open { display: block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.step { margin: 18px 0; padding-bottom: 16px; border-bottom: 1px dashed var(--g); line-height: 1.95; }
.step:last-child { border-bottom: none; padding-bottom: 0; }
.cmt {
  display: block;
  color: var(--mut);
  font-size: 15px;
  line-height: 1.85;
  font-style: italic;
  background: rgba(130,140,190,0.12);
  padding: 11px 16px;
  border-radius: 10px;
  margin: 10px 0;
  border-left: 3.5px solid var(--mut);
}

/* Thẻ Công thức & Thẻ Mô phỏng */
.formula-card { border: 1px solid var(--g); border-radius: 16px; padding: 22px; margin: 24px 0; background: var(--card); }
.formula-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-top: 14px; font-size: 15.5px; line-height: 1.9; }
.formula-meta div { background: var(--tint); padding: 16px 18px; border-radius: 12px; }
.sim-card { border: 1px solid var(--g); border-radius: 20px; padding: 24px; margin: 24px 0; background: var(--card); box-shadow: 0 8px 28px rgba(0,0,0,.05); }

/* Nút chọn chế độ mô hình (Segmented Pill Radio Buttons) */
.sim-tabs {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-bottom: 20px; padding: 10px;
  background: var(--tint);
  border-radius: 18px;
  border: 1.5px solid var(--g);
}
.sim-tab {
  appearance: none; -webkit-appearance: none;
  flex: 1 1 180px;
  border: 1.5px solid var(--g);
  border-radius: 14px;
  padding: 12px 16px;
  background: var(--card);
  color: var(--ink);
  font: 600 14.5px/1.45 "Be Vietnam Pro", system-ui, sans-serif;
  cursor: pointer;
  transition: all .22s cubic-bezier(.2,.8,.2,1);
  text-align: left;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 2px 6px rgba(0,0,0,.03);
}
.sim-tab::before {
  content: "";
  flex: 0 0 16px; width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid var(--mut);
  background: transparent;
  transition: all .2s ease;
  box-sizing: border-box;
}
.sim-tab:hover { border-color: var(--c5); color: var(--c5); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(112,72,232,.14); }
.sim-tab:hover::before { border-color: var(--c5); transform: scale(1.1); }
.sim-tab:active { transform: translateY(0) scale(0.98); }
.sim-tab.active {
  background: linear-gradient(135deg, var(--c1), var(--c5));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 8px 20px rgba(112,72,232,.36);
  transform: translateY(-1px);
  font-weight: 700;
}
.sim-tab.active::before {
  border-color: #fff;
  background: #fff;
  box-shadow: inset 0 0 0 3.5px var(--c5);
}

/* Hàng điều khiển thanh trượt & hộp chọn */
.ctrl-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  align-items: center;
  margin: 14px 0;
  background: var(--tint);
  padding: 16px 18px;
  border-radius: 16px;
  border: 1.5px solid var(--g);
}
.ctrl-row label { font-size: 14.5px; font-weight: 700; display: block; margin-bottom: 10px; color: var(--ink); }

/* Bộ chọn danh sách thả xuống tùy chỉnh (Custom Dropdown Select) */
select.native-select-hidden {
  position: absolute !important;
  width: 1px !important; height: 1px !important;
  padding: 0 !important; margin: -1px !important;
  overflow: hidden !important; clip: rect(0,0,0,0) !important;
  border: 0 !important; opacity: 0 !important; pointer-events: none !important;
}
.csel-wrap { position: relative; width: 100%; user-select: none; font: 600 14.5px/1.45 "Be Vietnam Pro", system-ui, sans-serif; z-index: 5; }
.csel-wrap.open { z-index: 45; }
.csel-trigger {
  appearance: none; -webkit-appearance: none;
  width: 100%;
  padding: 13px 46px 13px 18px;
  border-radius: 14px;
  border: 2px solid var(--c5);
  background: var(--card);
  color: var(--ink);
  font: 600 14.5px/1.45 "Be Vietnam Pro", system-ui, sans-serif;
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all .22s ease;
  box-shadow: 0 4px 12px rgba(112,72,232,.1);
  position: relative; text-align: left;
}
.csel-trigger::before {
  content: "";
  flex: 0 0 10px; width: 10px; height: 10px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c1), var(--c5));
  margin-right: 12px;
  box-shadow: 0 0 0 3px var(--tint);
}
.csel-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.csel-trigger:hover { border-color: var(--c1); background: var(--tint); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(112,72,232,.18); }
.csel-wrap.open .csel-trigger { border-color: var(--c1); background: var(--card); box-shadow: 0 0 0 4px rgba(112,72,232,.22); }
.csel-arrow {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--tint);
  display: flex; align-items: center; justify-content: center;
  transition: all .25s ease; pointer-events: none;
}
.csel-arrow::after {
  content: ""; width: 7px; height: 7px;
  border-right: 2.5px solid var(--c5);
  border-bottom: 2.5px solid var(--c5);
  transform: translateY(-2px) rotate(45deg);
  transition: transform .25s ease;
}
.csel-wrap.open .csel-arrow { background: var(--c5); }
.csel-wrap.open .csel-arrow::after { border-color: #fff; transform: translateY(2px) rotate(-135deg); }
.csel-menu {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 60;
  background: var(--card); border: 2px solid var(--c5);
  border-radius: 16px; padding: 8px;
  box-shadow: 0 14px 36px rgba(16,20,46,.28);
  display: none; max-height: 280px; overflow-y: auto;
}
.csel-wrap.open .csel-menu { display: block; animation: fadeIn .18s ease; }
.csel-opt {
  padding: 11px 14px; border-radius: 11px;
  color: var(--ink); cursor: pointer;
  transition: all .16s ease; margin: 3px 0;
  line-height: 1.45; display: flex; align-items: center; gap: 10px;
}
.csel-opt::before {
  content: ""; flex: 0 0 14px; width: 14px; height: 14px;
  border-radius: 50%; border: 2px solid var(--g); transition: all .16s ease;
}
.csel-opt:hover { background: var(--tint); color: var(--c5); padding-left: 18px; }
.csel-opt:hover::before { border-color: var(--c5); }
.csel-opt.selected {
  background: linear-gradient(135deg, var(--c1), var(--c5));
  color: #fff; font-weight: 700;
  box-shadow: 0 4px 12px rgba(112,72,232,.3);
}
.csel-opt.selected::before { border-color: #fff; background: #fff; box-shadow: inset 0 0 0 3px var(--c5); }
.menu-selector-wrap .csel-trigger { border: 2px solid var(--c5); background: var(--tint); font-size: 15px; font-weight: 700; }

/* Thanh trượt Range Slider tùy chỉnh */
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 8px; border-radius: 999px;
  background: var(--g); outline: none; margin: 6px 0; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--c1), var(--c5));
  border: 3px solid var(--card);
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
  cursor: pointer; transition: transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.12); }
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--c1), var(--c5));
  border: 3px solid var(--card);
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
  cursor: pointer; transition: transform .15s;
}

/* ==========================================================================
   4. THANH CUỘN TÙY CHỈNH & MENU GÓC TRÊN BÊN TRÁI
   ========================================================================== */
* { scrollbar-width: thin; scrollbar-color: var(--c5) var(--tint); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--tint); border-radius: 999px; margin: 4px; }
::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--c1), var(--c5)); border-radius: 999px; border: 2px solid var(--tint); transition: background .2s; }
::-webkit-scrollbar-thumb:hover { background: linear-gradient(135deg, var(--c5), var(--c4)); }
::-webkit-scrollbar-corner { background: transparent; }
.f::-webkit-scrollbar, .tw::-webkit-scrollbar, #mn::-webkit-scrollbar { height: 6px; width: 6px; }
.f::-webkit-scrollbar-thumb, .tw::-webkit-scrollbar-thumb, #mn::-webkit-scrollbar-thumb { border-width: 1px; }

/* Nút 3 gạch (Hamburger Button) ở góc trên bên trái */
#mb {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: 14px; z-index: 30;
  width: 46px; height: 46px;
  border: 0; border-radius: 14px;
  background: var(--c5); color: #fff;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
#mb span { display: block; width: 22px; height: 3px; border-radius: 2px; background: #fff; transition: transform .2s, opacity .2s; }
#mb[aria-expanded=true] span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
#mb[aria-expanded=true] span:nth-child(2) { opacity: 0; }
#mb[aria-expanded=true] span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
#mb:focus-visible, #mn a:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

/* Hộp Menu Mục lục & Bộ chọn bài học */
#mn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  left: 14px; z-index: 30;
  width: min(360px, calc(100vw - 28px));
  max-height: calc(100vh - 90px - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  background: var(--card);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 10px 34px rgba(0,0,0,.3);
  border: 1px solid var(--g);
}
#mn[hidden] { display: none; }
.menu-selector-wrap { padding-bottom: 12px; margin-bottom: 10px; border-bottom: 2px solid var(--g); }
.menu-selector-wrap label { display: block; font-size: 13px; font-weight: 800; color: var(--c5); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.toc-title { font-size: 13px; font-weight: 800; color: var(--mut); text-transform: uppercase; margin: 8px 0 4px; padding: 0 8px; }
#toc-links a { display: block; padding: 7px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.4; }
#toc-links a:hover { background: var(--tint); }
#toc-links a.sub { padding-left: 24px; font-size: 13.5px; color: var(--mut); }
#toc-links a.grp { font-weight: 600; margin-top: 4px; }
section, h3[id] { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }

/* ===== Bổ sung: code, tra cứu nhanh ===== */
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--tint); padding: 1px 7px; border-radius: 7px; }
.pw { position: relative; margin: 14px 0; }
pre { background: #0f1430; color: #e8ebff; border-radius: 14px; padding: 18px 20px; margin: 0; overflow-x: auto; font: 14px/1.75 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--g); }
pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
pre i { font-style: normal; }
.t-k { color: #ff8fb8; } .t-s { color: #38d9a9; } .t-c { color: #8d96c8; } .t-n { color: #ffd43b; }
.cp { position: absolute; top: 8px; right: 8px; z-index: 2; border: 1px solid #3b4380; background: #1a2046; color: #eef0ff; border-radius: 9px; padding: 4px 12px; font: 600 12.5px "Be Vietnam Pro", sans-serif; cursor: pointer; }
.cp:hover { background: var(--c5); }
.formula-card h3 { margin-top: 0; }
.srch { width: 100%; padding: 14px 18px; border-radius: 14px; border: 2px solid var(--c5); background: var(--card); color: var(--ink); font: 600 16px "Be Vietnam Pro", sans-serif; outline: none; margin: 8px 0 16px; }
.srch:focus { border-color: var(--c1); box-shadow: 0 0 0 4px rgba(112,72,232,.22); }
.chips, .rel { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.chip { appearance: none; border: 1.5px solid var(--g); background: var(--tint); color: var(--ink); border-radius: 999px; padding: 6px 16px; font: 600 14px "Be Vietnam Pro", sans-serif; cursor: pointer; transition: all .18s; }
.chip:hover { border-color: var(--c5); color: var(--c5); transform: translateY(-1px); }
.chip.big { padding: 10px 18px; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip.on { background: linear-gradient(135deg, var(--c1), var(--c5)); color: #fff; border-color: transparent; }
.chip small { color: var(--mut); font-weight: 500; font-family: ui-monospace, monospace; }
.chip.on small { color: #fff; }

<!-- Khu vực chứa nội dung bài học được nạp động (chỉ giữ 1 bài trong DOM để chống lag) -->
<main id="app-content"></main>

<script>
const $ = id => document.getElementById(id);
const J = String.raw;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = 'class|interface|extends|implements|public|private|protected|static|final|abstract|void|int|long|double|float|boolean|char|byte|new|return|if|else|for|while|try|catch|finally|throw|throws|this|super|import|package|instanceof|synchronized|volatile|null|true|false|default';
const HLRE = new RegExp('(//.*$)|("(?:[^"\\\\\\n]|\\\\.)*")|\\b(' + KW + ')\\b|\\b(\\d+(?:\\.\\d+)?)\\b', 'gm');
const hl = s => esc(s).replace(HLRE, (m,c,st,kw,n) => c ? `<i class="t-c">${c}</i>` : st ? `<i class="t-s">${st}</i>` : kw ? `<i class="t-k">${kw}</i>` : `<i class="t-n">${n}</i>`);
const pre = c => `<div class="pw"><button type="button" class="cp" onclick="cp(this)">Chép</button><pre><code>${hl(c.trim())}</code></pre></div>`;
const chips = r => r && r.length ? `<div class="rel"><b>Tra nhanh:</b> ${r.map(n => `<button type="button" class="chip" onclick="openRef('${n}')">${n}</button>`).join('')}</div>` : '';
const card = (t,c,e,u,r) => `<div class="formula-card"><h3>${t}</h3>${pre(c)}<div class="formula-meta"><div><b>Tác dụng:</b><br>${e}</div><div><b>Cách dùng:</b><br>${u}</div></div>${chips(r)}</div>`;
const sec = (h,b) => `<section><h2>${h}</h2>${b}</section>`;
const ul = a => '<ul>' + a.map(x => `<li>${x}</li>`).join('') + '</ul>';
const box = (c,b) => `<div class="box ${c}">${b}</div>`;
const tb = (h,rows) => `<div class="tw"><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;

const LES = {
'2': {b:'b1', n:'BÀI 2', t:'Thêm về Java', d:'Lớp, đối tượng, tham chiếu, constructor, this, static, package, nhập liệu.',
body: () => sec('Tóm tắt nhanh để ôn', ul([
 '<b>Mỗi lớp một tệp</b> <code>.java</code>; lớp <code>public</code> phải trùng tên tệp. <code>main()</code> do JVM gọi.',
 '<b>Đối tượng</b> nằm ở Heap, thao tác qua <b>tham chiếu</b> (ở Stack), bắt buộc tạo bằng <code>new</code>.',
 '<b>Truy cập:</b> <code>public</code> (mọi nơi) › <code>protected</code> (lớp con + cùng gói) › mặc định (cùng gói) › <code>private</code> (chỉ trong lớp).',
 '<b>Constructor:</b> trùng tên lớp, không kiểu trả về. Không khai báo thì có constructor rỗng; đã khai báo constructor có tham số thì <b>mất</b> constructor mặc định.',
 '<b>Truyền tham số:</b> Java chỉ truyền giá trị; với đối tượng, thứ được sao chép là tham chiếu.',
 '<b>GC</b> tự thu hồi đối tượng khi không còn tham chiếu trỏ tới.'])
 + box('warn','<b>Bẫy:</b> <code>a == b</code> chỉ so sánh tham chiếu; so nội dung dùng <code>equals()</code>. <code>b = a</code> không sao chép đối tượng, chỉ cho hai tham chiếu cùng trỏ một đối tượng.'))
 + sec('Code, tác dụng, cách dùng',
 card('Lớp, constructor, overloading', J`
class MyDate {
    private int day, month, year;
    public MyDate() { day = 1; month = 1; year = 2014; }
    public MyDate(int d, int m, int y) { day = d; month = m; year = y; }
    public void setMonth(int m) { month = m; }
    public void setMonth(String s) { /* đổi tên tháng -> số */ }
}
MyDate d1 = new MyDate();
MyDate d2 = new MyDate(19, 9, 2014);`,
 'Khai báo lớp với thuộc tính <code>private</code>, nhiều constructor và nạp chồng phương thức (cùng tên, khác danh sách tham số).',
 'Gọi <code>new MyDate(...)</code> để chọn constructor theo tham số. Truy cập thuộc tính qua getter/setter, không truy cập <code>d.year</code> trực tiếp.', ['this','static'])
 + card('this và copy constructor', J`
class Date {
    int year, month, day;
    Date(int year, int month, int day) {
        this.year = year; this.month = month; this.day = day;
    }
    Date(Date d) { this(d.year, d.month, d.day); }
}
Date b = new Date(a);`,
 '<code>this.x</code> phân biệt thuộc tính với tham số trùng tên; <code>this(...)</code> gọi constructor khác; copy constructor tạo bản sao độc lập.',
 '<code>this(...)</code> phải là <b>lệnh đầu tiên</b> trong constructor. Dùng copy constructor trong getter/setter để không lộ tham chiếu nội bộ.', ['this'])
 + card('static: thuộc tính và phương thức của lớp', J`
public class Dummy {
    static int counter = 0;
    static int count() { return counter; }
    Dummy() { counter++; }
}
new Dummy(); new Dummy();
System.out.println(Dummy.count()); // 2`,
 'Thành phần <code>static</code> thuộc về lớp, được chia sẻ giữa mọi đối tượng, gọi không cần đối tượng.',
 'Gọi qua tên lớp: <code>Dummy.count()</code>. Phương thức static không dùng được thành phần non-static vì không có <code>this</code>.', ['static'])
 + card('package, import, biên dịch', J`
// dse/hello/Hello.java
package dse.hello;
public class Hello { public void sayHello() { System.out.println("Hello"); } }

// dse/test/Main.java
import dse.hello.Hello;
public class Main { public static void main(String[] a) { new Hello().sayHello(); } }

// javac dse/test/Main.java   |   java dse.test.Main`,
 'Gom lớp vào gói; <code>package</code> ở dòng đầu tệp; <code>import</code> để dùng tên ngắn.',
 'Chỉ lớp <code>public</code> mới <code>new</code> được từ gói khác. Chạy lớp trong gói phải dùng tên đầy đủ <code>dse.test.Main</code>.', ['package / import'])
 + card('Scanner và tham số dòng lệnh', J`
Scanner sc = new Scanner(System.in);
String w = sc.next();
int i = sc.nextInt();
while (sc.hasNextLong()) { long x = sc.nextLong(); }

public static void main(String[] args) {
    for (String s : args) System.out.println(s);
}`,
 'Đọc dữ liệu từ bàn phím theo kiểu; <code>args</code> chứa các tham số khi chạy <code>java Prog hello world</code>.',
 '<code>import java.util.Scanner;</code>. Kiểm tra <code>hasNextType()</code> trước khi <code>nextType()</code> để tránh lỗi hết dữ liệu.', ['Scanner']))
},

'3': {b:'b2', n:'BÀI 3', t:'Thừa kế và Đa hình', d:'extends, super, overriding, final, ép kiểu, liên kết động, instanceof.',
body: () => sec('Tóm tắt nhanh để ôn', ul([
 '<b>has-a</b> (composition): đối tượng chứa đối tượng khác. <b>is-a</b> (inheritance): lớp con là một loại của lớp cha, dùng <code>extends</code>.',
 'Lớp con kế thừa thuộc tính và phương thức <b>non-private</b>; <b>không</b> kế thừa constructor. Constructor cha chạy trước, gọi tường minh bằng <code>super(...)</code> ở dòng đầu.',
 '<b>Overriding:</b> cùng tên, cùng tham số, cùng kiểu trả về, phạm vi truy cập <b>không chặt hơn</b> lớp cha.',
 'Mọi lớp đều kế thừa <code>Object</code>.',
 '<b>Đa hình:</b> tham chiếu kiểu cha trỏ tới đối tượng kiểu con. Phương thức chạy theo <b>kiểu đối tượng thật</b> (liên kết động), trừ <code>private</code>/<code>final</code>/<code>static</code> (liên kết tĩnh).'])
 + box('warn','<b>Bẫy:</b> gọi phương thức bị ghi đè trong constructor của lớp cha sẽ chạy bản của lớp con khi thuộc tính lớp con chưa được gán (thấy giá trị 0/null).'))
 + sec('Code, tác dụng, cách dùng',
 card('extends, super, overriding', J`
class Person {
    protected String name; protected int age;
    Person(String n, int a) { name = n; age = a; }
    public String getDetail() { return name + ", " + age; }
}
class Employee extends Person {
    double salary;
    Employee(String n, int a, double s) { super(n, a); salary = s; }
    @Override
    public String getDetail() { return super.getDetail() + ", " + salary; }
}`,
 'Tái sử dụng và chi tiết hóa lớp cha. <code>super(...)</code> gọi constructor cha, <code>super.method()</code> gọi bản của cha.',
 'Thêm <code>@Override</code> để trình biên dịch kiểm tra. Cha không có constructor mặc định thì con bắt buộc gọi <code>super(...)</code>.', ['extends / implements','super'])
 + card('Đa hình: mảng và tham số', J`
Animal[] animals = { new Dog(), new Cat(), new Lion() };
for (Animal a : animals) a.makeNoise();

class Vet { void giveShot(Animal a) { a.makeNoise(); } }
new Vet().giveShot(new Dog());`,
 'Một đoạn mã dùng cho nhiều kiểu con; thêm lớp con mới không phải sửa mã cũ.',
 'Khai báo biến, mảng, tham số bằng kiểu cha; gán đối tượng con vào.', ['instanceof'])
 + card('Ép kiểu và instanceof', J`
Person p = new Employee("An", 20, 5.0);
if (p instanceof Employee) {
    Employee e = (Employee) p;
    e.setSalary(6.0);
}`,
 'Upcasting (lên) tự động; downcasting (xuống) phải ép kiểu tường minh. <code>instanceof</code> kiểm tra kiểu thật.',
 'Chỉ downcast trên tham chiếu đã upcast; kiểm tra <code>instanceof</code> trước để tránh <code>ClassCastException</code>.', ['instanceof'])
 + card('final', J`
final double PI = 3.14;
final class Util { }
class A { final void f() { } }
void copyTo(final MyDate d) { d.year = 1; }`,
 'Biến: gán một lần. Phương thức: không bị ghi đè. Lớp: không có lớp con. Tham số: không gán lại được tham chiếu.',
 'Tham số <code>final</code> vẫn cho đổi thuộc tính của đối tượng được trỏ tới.', ['final']))
},

'4': {b:'b3', n:'BÀI 4', t:'Lớp trừu tượng, Giao diện, Lập trình tổng quát', d:'abstract, interface, template method, generic class/method, wildcard.',
body: () => sec('Tóm tắt nhanh để ôn', ul([
 '<b>abstract class</b>: không tạo được đối tượng, có thể chứa phương thức thường lẫn trừu tượng. Quan hệ <b>is-a</b>.',
 '<b>interface</b>: "hợp đồng" hành vi; phương thức mặc định <code>public abstract</code>, hằng số <code>public static final</code>. Quan hệ <b>behaves-like</b>; một lớp <code>implements</code> nhiều interface.',
 '<b>Generic</b>: kiểu dữ liệu để chờ xác định khi dùng. Quy ước: E (Element), K, V (Key, Value), N (Number), T (Type).',
 'Ưu điểm: một mã cho nhiều kiểu, kiểm tra kiểu lúc biên dịch, bớt ép kiểu. Nhược điểm: không dùng được kiểu nguyên thủy, không <code>new T()</code>, không <code>new T[n]</code>, không <code>instanceof</code>.'])
 + box('tip','<b>Wildcard:</b> <code>&lt;?&gt;</code> mọi kiểu; <code>&lt;? extends T&gt;</code> T hoặc con của T; <code>&lt;? super T&gt;</code> T hoặc cha của T.'))
 + sec('Code, tác dụng, cách dùng',
 card('abstract class và template method', J`
abstract class Shape {
    protected int x, y;
    abstract void erase();
    abstract void draw();
    void moveTo(int x1, int y1) { erase(); x = x1; y = y1; draw(); }
}
class Circle extends Shape {
    void erase() { System.out.println("erase"); }
    void draw()  { System.out.println("draw"); }
}`,
 'Lớp khuôn mẫu: <code>moveTo</code> cố định thuật toán, lớp con chỉ cài đặt các bước trừu tượng.',
 'Lớp con bắt buộc cài đặt mọi phương thức trừu tượng (hoặc tự là abstract). <code>new Shape()</code> báo lỗi.', ['abstract'])
 + card('interface và implements', J`
interface CanFly { void fly(); }
interface CanSwim { void swim(); }
class Hero extends ActionCharacter implements CanFly, CanSwim {
    public void fly() { }
    public void swim() { }
}
static void v(CanFly x) { x.fly(); }
v(new Hero());`,
 'Quy định hành vi mà không ràng buộc cách cài đặt; dùng interface như một kiểu dữ liệu.',
 'Cài đặt phương thức phải khai báo <code>public</code>. Interface kế thừa interface bằng <code>extends</code>.', ['interface','extends / implements'])
 + card('Lớp và phương thức tổng quát', J`
public class Pair<K, V> {
    private K key; private V value;
    public Pair(K k, V v) { key = k; value = v; }
    public K getKey() { return key; }
    public V getValue() { return value; }
}
Pair<String, Integer> p = new Pair<>("Even", 8);

public static <K, V> boolean compare(Pair<K, V> a, Pair<K, V> b) {
    return a.getKey().equals(b.getKey()) && a.getValue().equals(b.getValue());
}`,
 'Lớp <code>Pair</code> dùng được cho mọi cặp kiểu; <code>compare</code> là phương thức tổng quát (<code>&lt;K, V&gt;</code> đứng trước kiểu trả về).',
 'Chỉ định kiểu khi khai báo: <code>Pair&lt;String, Integer&gt;</code>. Kiểu tổng quát phải là lớp (<code>Integer</code>, không phải <code>int</code>).', ['Generics'])
 + card('Wildcard', J`
static double sum(List<? extends Number> list) {
    double s = 0;
    for (Number n : list) s += n.doubleValue();
    return s;
}
sum(List.of(1, 2, 3));`,
 'Nhận danh sách của <code>Number</code> hoặc bất kỳ lớp con nào (Integer, Double...).',
 '<code>extends</code> để đọc ra, <code>super</code> để ghi vào. Không thể <code>new</code> một kiểu wildcard.', ['Generics']))
},

'5a': {b:'b4', n:'BÀI 5.1', t:'Cấu trúc dữ liệu trong Java', d:'Object, wrapper, String, StringBuffer, Math, mảng, Collection, Map.',
body: () => sec('Tóm tắt nhanh để ôn', ul([
 '<b>Object</b> là cha của mọi lớp: <code>equals()</code>, <code>toString()</code>, <code>getClass()</code> (thường ghi đè <code>equals</code>, <code>toString</code>).',
 '<b>Wrapper</b> bọc kiểu nguyên thủy thành đối tượng: byte→Byte, int→Integer, long→Long, float→Float, double→Double, boolean→Boolean, char→Character.',
 '<b>String</b> bất biến: mọi thay đổi tạo xâu mới. <b>StringBuffer</b> sửa được tại chỗ, hợp với xâu dài hay đổi.',
 '<b>Mảng</b> kích thước cố định; <b>ArrayList</b> co giãn tự động.',
 '<b>Collection</b> gồm List (có thứ tự), Set (không trùng), Queue (FIFO). <b>Map</b> lưu cặp (key, value), key không trùng.'])
 + tb(['Cần','Chọn','Lý do'],[
 ['Truy cập theo chỉ số, danh sách co giãn','<code>ArrayList</code>','get(i) nhanh'],
 ['Vào sau ra trước (LIFO)','<code>Stack</code>','push / pop / peek'],
 ['Vào trước ra trước (FIFO)','<code>Queue</code> (<code>LinkedList</code>)','add / poll'],
 ['Thao tác hai đầu','<code>Deque</code>','addFirst / pollLast'],
 ['Tra cứu theo khóa tức thì','<code>HashMap</code>','get(key) không cần vòng lặp']]))
 + sec('Code, tác dụng, cách dùng',
 card('String, StringBuffer, Math', J`
String s = "đường đi mua đường";
s.indexOf("đường");       // 0
s.lastIndexOf("đường");   // 13
"A".compareTo("B");       // < 0
StringBuffer sb = new StringBuffer("abc");
sb.append("d").insert(0, "x").reverse();
Math.max(5, 10);  Math.ceil(5.4);  Math.round(5.4);`,
 'Tìm kiếm, so sánh xâu; sửa xâu tại chỗ; các hàm toán học thông dụng.',
 'So sánh nội dung dùng <code>equals</code>, không dùng <code>==</code>. <code>ceil</code>/<code>floor</code> trả double, <code>round</code> trả số nguyên.', ['String','StringBuffer','Math'])
 + card('Mảng và lớp Arrays', J`
int[] a = new int[10];
int[][] m = new int[3][4];
int[] arr = {3, 1, 2};
Arrays.sort(arr);                    // [1,2,3]
Arrays.binarySearch(arr, 3);         // 2
System.arraycopy(arr, 0, a, 1, 2);`,
 'Khai báo, sắp xếp, tìm nhị phân, sao chép mảng.',
 '<code>binarySearch</code> chỉ đúng khi mảng đã sắp xếp. Chỉ số từ 0 đến <code>length - 1</code>.', ['Arrays'])
 + card('ArrayList', J`
ArrayList<String> cars = new ArrayList<>();
cars.add("Volvo"); cars.add("BMW");
cars.remove("BMW"); cars.add("Mazda");
System.out.println(cars);           // [Volvo, Mazda]
int i = cars.indexOf("Mazda");      // 1, -1 nếu không có
for (String c : cars) System.out.println(c);`,
 'Danh sách có thứ tự, kích thước tự thay đổi.',
 'Dùng <code>indexOf</code>/<code>contains</code> để tìm thay cho vòng lặp thủ công; duyệt bằng for-each.', ['ArrayList'])
 + card('Stack, Queue, Iterator', J`
Stack<String> st = new Stack<>();
st.push("sáng"); st.push("tối");
st.pop();                          // "tối"
Queue<String> q = new LinkedList<>();
q.add("o1"); q.add("o2");
q.poll();                          // "o1"
Iterator<String> it = q.iterator();
while (it.hasNext()) System.out.println(it.next());`,
 'LIFO với Stack, FIFO với Queue; Iterator duyệt (và xóa) phần tử khi đang duyệt.',
 'Xóa phần tử trong lúc duyệt phải dùng <code>it.remove()</code>, không dùng <code>list.remove()</code>.', ['Stack','Queue / Deque','Iterator'])
 + card('HashMap', J`
HashMap<String, Book> allBooks = new HashMap<>();
allBooks.put("1234567", book);
Book b = allBooks.get("1234567");
for (Map.Entry<String, Book> e : allBooks.entrySet())
    System.out.println(e.getKey());`,
 'Tìm đối tượng theo khóa gần như tức thì, nhanh hơn rất nhiều so với duyệt ArrayList khi dữ liệu lớn.',
 'Key phải là đối tượng (dùng wrapper cho kiểu nguyên thủy). <code>put</code> cùng key sẽ ghi đè.', ['HashMap']))

'5b': {b:'b5', n:'BÀI 5.2', t:'Xử lý ngoại lệ và Luồng vào-ra', d:'try-catch-finally, throw/throws, ngoại lệ tự định nghĩa, file I/O, stream.',
body: () => sec('Tóm tắt nhanh để ôn', ul([
 '<b>Checked exception</b>: bắt buộc xử lý hoặc khai báo <code>throws</code> (ví dụ <code>IOException</code>, <code>FileNotFoundException</code>).',
 '<b>Runtime exception</b> (unchecked): do lỗi lập trình (<code>NullPointerException</code>...). <b>Error</b>: ngoài tầm kiểm soát (<code>OutOfMemoryError</code>).',
 '<b>JRE xử lý:</b> tạo đối tượng exception → tìm trên call stack → chuyển cho nơi có handler khớp kiểu; không có thì chương trình kết thúc.',
 'Quy tắc ghi đè: cha ném ngoại lệ thì con ném cùng kiểu, kiểu con hoặc không ném; cha không ném thì con chỉ được ném unchecked.',
 '<b>Luồng:</b> byte (<code>InputStream</code>/<code>OutputStream</code>) và ký tự (<code>Reader</code>/<code>Writer</code>). Dùng bộ đệm để giảm số lần truy cập thiết bị. Đối tượng ghi/đọc qua stream phải <code>Serializable</code>.'])
 + box('warn','<b>Bẫy:</b> các khối <code>catch</code> phải xếp từ kiểu con đến kiểu cha; <code>catch (Exception e)</code> đặt trước sẽ chặn các catch sau.'))
 + sec('Code, tác dụng, cách dùng',
 card('try-catch-finally', J`
BufferedReader buf = new BufferedReader(new InputStreamReader(System.in));
try {
    int num = Integer.parseInt(buf.readLine());
} catch (IOException e) {
    System.err.println("IO Exception");
} finally {
    buf.close();
}`,
 'Tách mã xử lý lỗi khỏi luồng chính. <code>finally</code> luôn chạy, dùng để dọn dẹp.',
 'Mỗi catch bắt một kiểu; <code>e.getMessage()</code> lấy nội dung, <code>e.printStackTrace()</code> in vết call stack.', ['try-catch-finally'])
 + card('throws, throw, ngoại lệ tự định nghĩa', J`
class MyException extends Exception {
    public MyException() {}
    public MyException(String msg) { super(msg); }
}
static float chia(int a, int b) throws MyException {
    if (b == 0) throw new MyException("mau so = 0");
    return (float) a / b;
}
try { chia(1, 0); } catch (MyException e) { System.err.println(e.getMessage()); }`,
 '<code>throw</code> ném một đối tượng ngoại lệ; <code>throws</code> khai báo kiểu ngoại lệ phương thức có thể ném ra.',
 'Lớp ngoại lệ mới kế thừa <code>Exception</code>. Đổi checked sang unchecked: <code>throw new RuntimeException(e)</code>.', ['throw / throws'])
 + card('Đọc, ghi, sao chép tệp văn bản', J`
BufferedReader in = new BufferedReader(new FileReader(args[0]));
PrintWriter out = new PrintWriter(new FileWriter(args[1]));
String s;
while ((s = in.readLine()) != null) out.println(s);
in.close();
out.close();`,
 'Đọc từng dòng từ tệp và ghi sang tệp khác.',
 'Bọc <code>FileReader</code> bằng <code>BufferedReader</code>, <code>FileWriter</code> bằng <code>PrintWriter</code>. Luôn <code>close()</code> (hoặc dùng try-with-resources).', ['BufferedReader','PrintWriter','File'])
 + card('Data stream và Object stream', J`
DataOutputStream dout = new DataOutputStream(new FileOutputStream("a.dat"));
dout.writeInt(7);
dout.close();

class Record implements Serializable { String name; float score; }
ObjectOutputStream oo = new ObjectOutputStream(new FileOutputStream("r.dat"));
oo.writeObject(new Record());
Record r = (Record) new ObjectInputStream(new FileInputStream("r.dat")).readObject();`,
 'Ghi/đọc kiểu nguyên thủy dạng nhị phân và ghi/đọc nguyên đối tượng (chuỗi hóa).',
 'Đọc đến khi bắt <code>EOFException</code>. Đọc đúng thứ tự và đúng kiểu như khi ghi.', ['ObjectOutputStream']))
},

'6a': {b:'b1', n:'BÀI 6.1', t:'Mẫu thiết kế (phần 1)', d:'Singleton, Factory Method, Abstract Factory, Adapter.',
body: () => sec('Tóm tắt nhanh để ôn', ul([
 'Mẫu thiết kế (MTK) là giải pháp đã được kiểm chứng cho một vấn đề lặp lại; mốc: <b>Gang of Four</b> (1995).',
 'MTK giải quyết yêu cầu phi chức năng: khả năng thay đổi, tương tác, tái sử dụng, độ tin cậy.',
 '<b>3 loại:</b> Khởi tạo (creational), Cấu trúc (structural), Hành vi (behavioral).',
 'Một MTK gồm: tên, ngữ cảnh, vấn đề, giải pháp, kết quả.'])
 + tb(['Mẫu','Loại','Dấu hiệu cần dùng (smell)'],[
 ['Singleton','Khởi tạo','Dữ liệu toàn cục, nhiều thể hiện của tài nguyên (kết nối DB)'],
 ['Factory Method','Khởi tạo','switch / if-else dài để chọn lớp cần <code>new</code>'],
 ['Abstract Factory','Khởi tạo','Nhiều "dòng" đối tượng đi cùng nhau (giao diện Windows / Mac)'],
 ['Adapter','Cấu trúc','Giao diện của lớp có sẵn không khớp với nơi dùng']]))
 + sec('Code: các mẫu khởi tạo và cấu trúc',
 card('Singleton', J`
class Singleton {
    private static Singleton instance = null;
    private Singleton() {}
    public static synchronized Singleton getInstance() {
        if (instance == null) instance = new Singleton();
        return instance;
    }
}`,
 'Đảm bảo lớp chỉ có đúng một đối tượng.',
 'Constructor <code>private</code>, lấy đối tượng qua <code>getInstance()</code>. <code>synchronized</code> để an toàn khi đa luồng.', ['static','synchronized'])
 + card('Factory Method', J`
abstract class Application {
    abstract Document createDocument();
    void newDocument() { Document d = createDocument(); d.open(); }
}
class MyApplication extends Application {
    Document createDocument() { return new MyDocument(); }
}`,
 'Lớp cha định nghĩa quy trình, lớp con quyết định tạo đối tượng cụ thể nào.',
 'Thay <code>switch</code> chọn lớp bằng phương thức tạo (factory method) được ghi đè ở lớp con.', ['abstract'])
 + card('Abstract Factory', J`
interface UIFactory { Window createWindow(); Scrollbar createScrollbar(); }
class BoyUIFactory implements UIFactory {
    public Window createWindow() { return new BoyWindow(); }
    public Scrollbar createScrollbar() { return new BoyScrollbar(); }
}
UIFactory f = new GirlUIFactory();
Window w = f.createWindow();`,
 'Tạo cả họ đối tượng liên quan mà client không phụ thuộc lớp cụ thể.',
 'Client chỉ giữ <code>UIFactory</code>; đổi "dòng" sản phẩm bằng cách đổi factory. Thêm loại sản phẩm mới phải sửa mọi factory.', ['interface'])
 + card('Adapter', J`
interface IMath { int[] sort(int[] arr); }
class MyModule implements IMath {
    private MyMathLib lib = new MyMathLib();
    public int[] sort(int[] arr) { return lib.quicksort(arr); }
}`,
 'Làm cầu nối giữa giao diện cần dùng (<code>IMath</code>) và lớp có sẵn không sửa được (<code>MyMathLib</code>).',
 'Cách khuyên dùng: chứa đối tượng cần bọc (composition) và chuyển lời gọi sang nó.', ['extends / implements']))
},

'6b': {b:'b2', n:'BÀI 6.2', t:'Mẫu thiết kế (tiếp) và Nguyên lý thiết kế', d:'Composite, Decorator, Proxy, DRY, KISS, YAGNI, SOLID.',
body: () => sec('Composite, Decorator, Proxy: bảng so sánh và code', tb(['Mẫu','Dấu hiệu cần dùng','Ý tưởng'],[
 ['Composite','Mã đầy <code>instanceof</code> để phân biệt phần tử đơn và tập hợp (file / folder)','Cùng một interface cho phần tử đơn và container; container duyệt các phần tử con'],
 ['Decorator','Bùng nổ số lớp con cho mọi tổ hợp tính năng (SMS+Facebook+Slack)','Bọc đối tượng trong đối tượng cùng interface, mỗi lớp bọc thêm một chức năng'],
 ['Proxy','Cần kiểm soát truy cập đối tượng thật','Đối tượng đại diện cùng interface, kiểm tra rồi mới chuyển lời gọi']])
 + card('Composite', J`
interface FileItem { void print(); }
class File implements FileItem {
    String name;
    public void print() { System.out.println(name); }
}
class Folder implements FileItem {
    String name; List<FileItem> items = new ArrayList<>();
    public void print() {
        System.out.println(name);
        for (FileItem o : items) o.print();
    }
}`,
 'Duyệt cả cây thư mục bằng một lời gọi <code>print()</code>, không cần phân biệt file hay folder.',
 'Client chỉ làm việc với <code>FileItem</code>; <code>Folder</code> đệ quy qua các phần tử con.', ['interface'])
 + card('Decorator', J`
interface Notifier { void send(String msg); }
class EmailNotifier implements Notifier { public void send(String m) { } }
class NotifierDecorator implements Notifier {
    protected Notifier component;
    NotifierDecorator(Notifier n) { component = n; }
    public void send(String m) { component.send(m); }
}
class FacebookNotifier extends NotifierDecorator {
    FacebookNotifier(Notifier n) { super(n); }
    public void send(String m) { super.send(m); /* gửi Facebook */ }
}
Notifier n = new FacebookNotifier(new EmailNotifier());
n.send("Alert!");`,
 'Thêm chức năng (gửi nhiều kênh) lúc chạy mà không tạo lớp cho từng tổ hợp.',
 'Xếp chồng: <code>new SMSNotifier(new FacebookNotifier(new EmailNotifier()))</code>.', ['super'])
 + card('Proxy', J`
class Proxy implements ServiceInterface {
    private Service realService;
    public void operation() {
        if (checkAccess()) realService.operation();
    }
}`,
 'Kiểm soát (phân quyền, tải chậm, ghi log) trước khi gọi đối tượng thật.',
 'Client dùng <code>ServiceInterface</code>, không biết đang nói chuyện với proxy.', ['interface']))
 + sec('Nguyên lý thiết kế: bảng ôn', ul([
 '<b>DRY</b> – Don’t Repeat Yourself: không lặp mã. <b>KISS</b> – giữ đơn giản. <b>YAGNI</b> – You Aren’t Gonna Need It: chưa cần thì chưa viết.'])
 + tb(['SOLID','Nội dung','Vi phạm điển hình'],[
 ['<b>S</b>RP','Một lớp chỉ có một lý do để thay đổi','<code>Person</code> vừa lưu dữ liệu vừa có <code>format(type)</code> với <code>switch</code> JSON/XML'],
 ['<b>O</b>CP','Mở để mở rộng, đóng để sửa đổi','<code>drawAllShapes()</code> dùng <code>instanceof</code>; sửa: <code>shape.draw()</code> đa hình'],
 ['<b>L</b>SP','Lớp con thay thế được lớp cha','Con ném <code>Exception</code> rộng hơn cha ném <code>IOException</code>'],
 ['<b>I</b>SP','Không ép client phụ thuộc phương thức không dùng','<code>Bike</code> phải cài <code>startEngine()</code>; tách interface nhỏ'],
 ['<b>D</b>IP','Phụ thuộc vào abstraction, không vào chi tiết','<code>MediaPlayer</code> tự <code>new AudioPlayer()</code>; nên giữ interface và tiêm vào']])
 + card('OCP: dùng đa hình thay vì instanceof', J`
abstract class Shape { abstract void draw(); }
class Rectangle extends Shape { void draw() { } }
class Circle extends Shape { void draw() { } }
class Diagram {
    List<Shape> shapes = new ArrayList<>();
    void drawAllShapes() { for (Shape s : shapes) s.draw(); }
}`,
 'Thêm hình mới (Triangle) mà không sửa <code>Diagram</code>.',
 'Khi thấy chuỗi <code>if (x instanceof ...)</code>, hãy chuyển hành vi vào lớp con.', ['instanceof']))
},

'7': {b:'b3', n:'BÀI 7', t:'Đa luồng (Concurrency và Multithreading)', d:'Thread, Runnable, ExecutorService, Callable/Future, synchronized, Lock, Virtual Thread.',
body: () => sec('Tóm tắt nhanh để ôn', ul([
 '<b>Process</b>: chương trình đang chạy, cô lập. <b>Thread</b>: một đường thực thi trong process, có call stack riêng nhưng <b>dùng chung dữ liệu</b>.',
 '<b>Định luật Amdahl:</b> với B là tỉ lệ không thể song song và N là số bộ xử lý, mức tăng tốc tối đa là <code>1 / (B + (1 − B) / N)</code>.',
 '<b>Vòng đời thread:</b> NEW → RUNNABLE → (BLOCKED / WAITING / TIMED_WAITING) → TERMINATED.',
 '<b>Vấn đề:</b> race condition (nhiều thread cùng sửa dữ liệu, kết quả sai) và visibility (thread này không thấy thay đổi của thread kia).',
 '<b>Giải pháp:</b> chỉ một thread truy cập tại một thời điểm (<code>synchronized</code>, Lock) và bảo đảm thay đổi được nhìn thấy (<code>volatile</code>, happens-before).'])
 + box('tip','Chọn <b>Runnable</b> thay vì kế thừa <b>Thread</b>: tách nhiệm vụ khỏi cơ chế chạy, và lớp vẫn còn quyền kế thừa lớp khác.'))
 + sec('Code, tác dụng, cách dùng',
 card('Tạo, chạy, chờ thread', J`
Thread t1 = new Thread(() -> System.out.println("chạy trong " + Thread.currentThread().getName()));
t1.start();
Thread.sleep(1000);
t1.join();`,
 'Tạo thread từ lambda <code>Runnable</code>, khởi chạy, tạm dừng, chờ thread kết thúc.',
 'Gọi <code>start()</code>, không gọi <code>run()</code> trực tiếp (sẽ chạy trên thread hiện tại). <code>sleep</code>, <code>join</code> ném <code>InterruptedException</code>.', ['Thread'])
 + card('ExecutorService và thread pool', J`
ExecutorService ex = Executors.newFixedThreadPool(4);
for (int i = 0; i < 10; i++) {
    int id = i;
    ex.execute(() -> System.out.println("task " + id));
}
ex.shutdown();`,
 'Dùng lại một nhóm thread cố định, tác vụ dư được xếp hàng đợi.',
 'Luôn <code>shutdown()</code> khi xong; nếu không chương trình không kết thúc.', ['ExecutorService'])
 + card('Callable và Future', J`
Callable<String> job = () -> { Thread.sleep(2000); return "xong"; };
Future<String> f = ex.submit(job);
String kq = f.get();
f.cancel(true);
List<Future<String>> all = ex.invokeAll(List.of(job, job));`,
 'Tác vụ có kết quả trả về và được ném checked exception; <code>Future</code> nhận kết quả khi có.',
 '<code>get()</code> chặn đến khi xong. <code>invokeAll</code> chờ tất cả, <code>invokeAny</code> lấy kết quả nhanh nhất.', ['Future','ExecutorService'])
 + card('synchronized và volatile', J`
class Counter {
    private int c = 0;
    public synchronized void inc() { c++; }
    public int get() { return c; }
}
private volatile boolean running = true;`,
 '<code>synchronized</code> chỉ cho một thread vào tại một thời điểm (dùng khóa nội tại của đối tượng); <code>volatile</code> bảo đảm mọi thread thấy giá trị mới nhất.',
 'Đặt <code>synchronized</code> lên phương thức hoặc khối <code>synchronized (obj) { ... }</code>. <code>volatile</code> không làm <code>c++</code> trở thành nguyên tử.', ['synchronized','volatile'])
 + card('ReentrantLock, ReadWriteLock, Atomic', J`
ReentrantLock lock = new ReentrantLock();
lock.lock();
try { c++; } finally { lock.unlock(); }
if (lock.tryLock()) { try { } finally { lock.unlock(); } }
AtomicInteger n = new AtomicInteger();
n.incrementAndGet();`,
 'Khóa linh hoạt hơn <code>synchronized</code> (<code>tryLock</code> không chờ); biến atomic cập nhật an toàn không cần khóa.',
 '<code>unlock()</code> luôn đặt trong <code>finally</code>. <code>ReadWriteLock</code> cho nhiều thread đọc cùng lúc, hợp khi đọc nhiều hơn ghi.', ['ReentrantLock','AtomicInteger'])
 + card('Virtual Thread (Java 21+)', J`
Thread.ofVirtual().start(() -> System.out.println("virtual"));
try (var ex = Executors.newVirtualThreadPerTaskExecutor()) {
    ex.submit(() -> "task");
}`,
 'Thread do JVM quản lý, tạo không cần system call, không tốn context switch của hệ điều hành; tạo được rất nhiều.',
 'API giống thread thường. Không cần gom vào pool; mỗi tác vụ một virtual thread.', ['Thread','ExecutorService']))
}
};

+ `<h3>2. Vì sao dùng try-catch thay vì if kiểm tra lỗi?</h3>
<p>Cách truyền thống (kiểm tra mã lỗi sau mỗi bước) khiến mã thuật toán lẫn lộn với mã xử lý lỗi, rất khó đọc, không chuyển được lỗi cho nơi khác xử lý, và dễ bị quên. <code>try-catch</code> tách hai việc ra: thuật toán nằm trong <code>try</code>, xử lý lỗi nằm trong <code>catch</code>.</p>
<h3>3. Ngoại lệ đi đâu khi được ném?</h3>
<p>Giả sử <code>main</code> gọi <code>a()</code>, <code>a()</code> gọi <code>b()</code> và <code>b()</code> ném ngoại lệ. JRE tạo đối tượng ngoại lệ, rồi tìm trình xử lý (<code>catch</code> khớp kiểu) <b>ngược lên theo call stack</b>: <code>b</code> → <code>a</code> → <code>main</code>. Nơi nào bắt được thì xử lý ở đó; lên tới tận <code>main</code> mà không ai bắt thì chương trình dừng và in ra vết ngăn xếp.</p>`
+ box('analogy','<b>Ví dụ ẩn dụ:</b> nhân viên gặp sự cố mà không đủ thẩm quyền thì báo lên cấp trên (<code>throws</code>), người nào có thẩm quyền xử lý sẽ nhận (<code>catch</code>).')

+ `<h3>3. Tăng tốc được bao nhiêu? Định luật Amdahl</h3>
<p>Phần không thể song song hóa (B) giới hạn mức tăng tốc. Với N bộ xử lý: tăng tốc tối đa = <code>1 / (B + (1 − B) / N)</code>. Ví dụ B = 0,2 (20% bắt buộc tuần tự) và N = 4 cho <code>1 / (0,2 + 0,8/4) = 2,5</code> lần, không phải 4 lần.</p>
<h3>4. Rủi ro: race condition và visibility</h3>
<p><code>count++</code> trông như một lệnh nhưng thực chất gồm 3 bước: <b>đọc</b> → <b>cộng 1</b> → <b>ghi</b>. Hai thread xen kẽ có thể cùng đọc giá trị 5, cùng ghi 6, mất một lần tăng. Kết quả: chạy 1000 lần tăng mà in ra 985, 999, 997 (mỗi lần một khác). Đó là <b>race condition</b>.</p>
<p><b>Visibility:</b> thread A sửa biến nhưng giá trị còn nằm trong bộ nhớ đệm của CPU nên thread B không thấy; cần <code>volatile</code> hoặc đồng bộ để thay đổi được "nhìn thấy" (quan hệ <i>happens-before</i>).</p>

function buildTOC() {
  const tocContainer = $('toc-links');
  if (!tocContainer) return;
  let html = '', idx = 0;
  document.querySelectorAll('#app-content h2, #app-content h3').forEach(el => {
    const title = el.textContent.trim();
    const isSub = el.tagName === 'H3';
    const target = isSub ? el : (el.closest('section') || el);
    if (!target.id) target.id = 'sec-' + (idx++);
    html += `<a href="#${target.id}" class="${isSub ? 'sub' : 'grp'}">${title}</a>`;
  });
  tocContainer.innerHTML = html;
}

function upgradeCustomSelects(root = document) {
  root.querySelectorAll('select').forEach(sel => {
    if (sel.dataset.customized === 'true') {
      if (sel._syncCustomUI) sel._syncCustomUI();
      return;
    }
    sel.dataset.customized = 'true';
    sel.classList.add('native-select-hidden');

    const wrap = document.createElement('div');
    wrap.className = 'csel-wrap';

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'csel-trigger';

    const labelSpan = document.createElement('span');
    labelSpan.className = 'csel-label';

    const arrowBox = document.createElement('span');
    arrowBox.className = 'csel-arrow';

    trigger.appendChild(labelSpan);
    trigger.appendChild(arrowBox);

    const menu = document.createElement('div');
    menu.className = 'csel-menu';

    const syncUI = () => {
      const selectedOpt = sel.options[sel.selectedIndex] || sel.options[0];
      labelSpan.textContent = selectedOpt ? selectedOpt.textContent : '';
      menu.querySelectorAll('.csel-opt').forEach((item, idx) => {
        item.classList.toggle('selected', idx === sel.selectedIndex);
      });
    };
    sel._syncCustomUI = syncUI;

    Array.from(sel.options).forEach((opt, idx) => {
      const item = document.createElement('div');
      item.className = 'csel-opt' + (idx === sel.selectedIndex ? ' selected' : '');
      item.textContent = opt.textContent;
      item.onclick = (e) => {
        e.stopPropagation();
        sel.selectedIndex = idx;
        sel.value = opt.value;
        syncUI();
        wrap.classList.remove('open');
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      };
      menu.appendChild(item);
    });

    syncUI();

    trigger.onclick = (e) => {
      e.stopPropagation();
      const isOpen = wrap.classList.contains('open');
      document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));
      if (!isOpen) wrap.classList.add('open');
    };

    wrap.appendChild(trigger);
    wrap.appendChild(menu);
    sel.insertAdjacentElement('afterend', wrap);
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.csel-wrap.open').forEach(w => w.classList.remove('open'));
});


function loadLesson(id, refName, keep) {
  if (!keep) navStack = [];
  const mainEl = $('app-content');
  if (id === 'ref') {
    refCur = null; refKind = 'all'; refLes = 'all';
    mainEl.innerHTML = refPage();
    renderRef();
    if (refName) showRef(refName);
  } else {
    const L = LES[id] || LES['2'];
    mainEl.innerHTML = `<header><span class="k ${L.b}">UET.CS2043 · ${L.n}</span><h1>${L.t}</h1><p class="mut">${L.d}</p></header>` + (TH[id] ? TH[id]() : '') + L.body();
  }
  upgradeCustomSelects(document);
  buildTOC();
  history.replaceState(null, '', '#' + (id === 'ref' ? 'tra-cuu' : id));
  if (!refName) window.scrollTo({ top: 0, behavior: 'smooth' });
  updateBack();
}
window.loadLesson = loadLesson;

/* Khởi chạy ứng dụng & cài đặt đóng/mở menu góc trái */
(function initApp() {
  const btn = $('mb'), nav = $('mn');
  const setOpen = open => {
    nav.hidden = !open;
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu chọn bài và mục lục');
  };
  btn.onclick = () => setOpen(nav.hidden);
  nav.onclick = e => {
    if (e.target.closest('a')) setOpen(false);
  };
  document.addEventListener('click', e => {
    if (!nav.hidden && !nav.contains(e.target) && !btn.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !nav.hidden) {
      setOpen(false);
      btn.focus();
    }
  });

  // Mặc định mở Bài 1 khi tải trang
  const h = (location.hash || '').slice(1);
  const id = (h === 'tra-cuu' || h === 'ref') ? 'ref' : (LES[h] ? h : '2');
  setSel(id);
  loadLesson(id);
})();
</script>
