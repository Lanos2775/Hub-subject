  <section>
    <h2>6. Cẩm Nang Công Thức Trọng Tâm Buổi 6 (Giải Nghĩa Chi Tiết)</h2>
    <div class="bridge"><b>Nối từ Mục 1–5:</b> Bảng chọn công thức.</div>

    <div class="tw"><table><tr><th>Đề bài hỏi gì?</th><th>Công thức</th></tr><tr><td>$n_0$, $p_0$ từ $E_F-E_{Fi}$, hạt thiểu số</td><td>Công thức 1</td></tr><tr><td>Pha tạp rất đậm, suy biến</td><td>Công thức 2</td></tr><tr><td>Tỷ lệ tạp chất đã ion hóa, nhiệt độ đóng băng</td><td>Công thức 3</td></tr><tr><td>Bán dẫn bù trừ, vị trí $E_F$</td><td>Công thức 4</td></tr></table></div>


    <div class="formula-card">
      <h3>Công thức 1: Nồng độ Hạt dẫn theo $E_{Fi}$ &amp; Định luật Tác dụng Khối lượng ($n_0 p_0 = n_i^2$)</h3>
      <div class="f key">
        $$n_0 = n_i \exp\left[\frac{E_F - E_{Fi}}{kT}\right], \qquad p_0 = n_i \exp\left[-\frac{E_F - E_{Fi}}{kT}\right], \qquad \mathbf{n_0 \cdot p_0 = n_i^2}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu &amp; Đơn vị:</b><br>
          • $n_0, p_0$: Nồng độ electron và lỗ trống ở trạng thái cân bằng nhiệt ($\text{cm}^{-3}$).<br>
          • $n_i$: Nồng độ hạt dẫn nội tại ($\text{cm}^{-3}$). Với $\text{Si}$ ở $300\text{ K}$, $n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$.<br>
          • $E_F - E_{Fi}$: Độ dịch chuyển của mức Fermi so với mức Fermi nội tại ($\text{eV}$).<br>
          • $kT$: Năng lượng nhiệt ($0.0259\text{ eV}$ ở $T = 300\text{ K}$).
        </div>
        <div><b>2. Tại sao có &amp; Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Biểu diễn sự tăng/giảm hàm mũ của hạt dẫn so với trạng thái nội tại khi $E_F$ lệch khỏi $E_{Fi}$. Tích số $n_0 p_0 = n_i^2$ luôn không đổi ở mọi mức pha tạp không suy biến.<br>
          • <b>Khi nào dùng:</b> Tìm hạt dẫn thiểu số khi đã biết hạt dẫn đa số ($p_0 = n_i^2/n_0$ hoặc $n_0 = n_i^2/p_0$) và tính độ lệch mức Fermi so với giữa vùng cấm.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 2: Tích phân Fermi-Dirac $F_{1/2}(\eta_F)$ cho Bán dẫn Suy biến</h3>
      <div class="f key">
        $$n_0 = \frac{2}{\sqrt{\pi}}\,N_c\,F_{1/2}(\eta_F) \qquad \text{với} \qquad \eta_F = \frac{E_F - E_c}{kT}, \qquad F_{1/2}(\eta_F) = \int_0^\infty \frac{\eta^{1/2}\,d\eta}{1 + \exp(\eta - \eta_F)}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu &amp; Đơn vị:</b><br>
          • $\eta_F$: Khoảng cách chuẩn hóa từ đáy dải dẫn $E_c$ đến mức Fermi $E_F$ tính theo đơn vị $kT$ (không thứ nguyên).<br>
          • $F_{1/2}(\eta_F)$: Giá trị tích phân Fermi-Dirac bậc $1/2$ (tra từ đồ thị chuẩn Figure 4.11 tùy theo giá trị $\eta_F$).<br>
          • $N_c$: Mật độ trạng thái hiệu dụng của dải dẫn ($\text{cm}^{-3}$).
        </div>
        <div><b>2. Tại sao có &amp; Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Khi mức Fermi tiến quá gần $E_c$ ($E_c - E_F < 3kT$) hoặc chui vào trong dải dẫn ($E_F > E_c$, tức $\eta_F > 0$), xấp xỉ Boltzmann bị sai lệch nặng, ta bắt buộc phải tính tích phân Fermi-Dirac đầy đủ.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 2</b> khi đề bài cho $\eta_F$ (hoặc cho $E_F$ nằm trong dải dẫn/dải hóa trị) và yêu cầu dùng tích phân Fermi-Dirac.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 3: Thống kê Mức Tạp chất &amp; Tỷ lệ Tạp chất Chưa Ion hóa</h3>
      <div class="f key">
        $$n_d = \frac{N_d}{1 + \frac{1}{2}\exp\left(\frac{E_d - E_F}{kT}\right)}, \quad p_a = \frac{N_a}{1 + \frac{1}{g}\exp\left(\frac{E_F - E_a}{kT}\right)}, \quad \mathbf{\frac{n_d}{n_d + n_0} = \frac{1}{1 + \frac{N_c}{2N_d}\exp\left[-\frac{E_c - E_d}{kT}\right]}}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu &amp; Đơn vị:</b><br>
          • $n_d$: Nồng độ electron còn chiếm giữ trên mức Donor $E_d$ (chưa ion hóa, $\text{cm}^{-3}$).<br>
          • $p_a$: Nồng độ lỗ trống còn nằm trên mức Acceptor $E_a$ (chưa ion hóa, $\text{cm}^{-3}$).<br>
          • $g$: Hệ số suy biến của mức tạp chất (với Donor: $g_d = 2$; với Acceptor trong $\text{Si}, \text{GaAs}$: $g = 4$).<br>
          • $E_c - E_d$ và $E_a - E_v$: Năng lượng ion hóa của Donor và Acceptor ($\text{eV}$).
        </div>
        <div><b>2. Tại sao có &amp; Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Xác định bao nhiêu phần trăm nguyên tử tạp chất đã thực sự nhường/nhận electron ở một nhiệt độ $T$ cho trước.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 3</b> khi đề bài hỏi <i>"tỷ lệ electron còn ở trạng thái Donor ($\frac{n_d}{n_d + n_0}$)"</i> hoặc <i>"tìm nhiệt độ $T$ để $90\%$ nguyên tử Acceptor bị ion hóa ($\frac{p_a}{p_0 + p_a} = 0.10$)"</i>.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 4: Nồng độ Hạt dẫn trong Bán dẫn Bù trừ &amp; Vị trí Mức Fermi $E_F$</h3>
      <div class="f key">
        $$\text{Loại N } (N_d > N_a): \quad \mathbf{n_0 = \frac{N_d - N_a}{2} + \sqrt{\left(\frac{N_d - N_a}{2}\right)^2 + n_i^2}}, \qquad \mathbf{E_c - E_F = kT \ln\left(\frac{N_c}{N_d - N_a}\right)}$$
        $$\text{Loại P } (N_a > N_d): \quad \mathbf{p_0 = \frac{N_a - N_d}{2} + \sqrt{\left(\frac{N_a - N_d}{2}\right)^2 + n_i^2}}, \qquad \mathbf{E_F - E_v = kT \ln\left(\frac{N_v}{N_a - N_d}\right)}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu &amp; Đơn vị:</b><br>
          • $N_d, N_a$: Nồng độ nguyên tử tạp chất Donor và Acceptor ($\text{cm}^{-3}$).<br>
          • $|N_d - N_a|$: Nồng độ tạp chất hiệu dụng sau khi đã bù trừ lẫn nhau ($\text{cm}^{-3}$).
        </div>
        <div><b>2. Tại sao có &amp; Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Giải hệ hai phương trình: Trung hòa điện tích ($n_0 + N_a = p_0 + N_d$) và Tác dụng khối lượng ($n_0 p_0 = n_i^2$).<br>
          • <b>Khi nào dùng:</b> Giải mọi bài toán tìm nồng độ hạt dẫn đa số, thiểu số và vị trí mức Fermi khi biết $N_d, N_a$ (như <b>Câu 4, Câu 5, Câu 6</b>).
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>7. Bài Tập Trọng Tâm Buổi 6 (Có Gợi Ý &amp; Giải Chi Tiết Từng Bước)</h2>
    <div class="bridge"><b>Nối từ Mục 6:</b> Mỗi câu luyện một nhánh của bài.</div>

    <div class="tw"><table><tr><th>Câu</th><th>Luyện</th><th>Công thức</th></tr><tr><td>1</td><td>$n_0$, $p_0$ từ vị trí $E_F$</td><td>1</td></tr><tr><td>2</td><td>Suy biến, dùng $F_{1/2}$</td><td>2</td></tr><tr><td>3</td><td>Kiểm tra ion hóa hoàn toàn; nhiệt độ ion hóa $90\%$</td><td>3</td></tr><tr><td>4</td><td>Hạt đa số và thiểu số, kể cả bù trừ</td><td>1, 4</td></tr><tr><td>5</td><td>Thiết kế bù trừ để đạt $E_F$ cho trước</td><td>4</td></tr><tr><td>6</td><td>Nồng độ pha tạp tối đa để còn dùng được Boltzmann</td><td>2</td></tr></table></div>

    <div class="box key"><b>Cách làm chung Buổi 6</b><ol><li><b>Bước 1:</b> Kiểm tra pha tạp có quá đậm không (có suy biến không).</li><li><b>Bước 2:</b> Kiểm tra nhiệt độ (ion hóa hoàn toàn hay không).</li><li><b>Bước 3:</b> Chọn công thức tương ứng rồi tính $n_0$, sau đó $p_0=n_i^2/n_0$.</li></ol></div>

    <p>Toàn bộ các bài toán trọng tâm trong slide bài giảng Buổi 6 đã được thầy hệ thống hóa thành 6 câu hỏi đầy đủ dưới đây. Em hãy bấm vào <b>Xem Gợi ý</b> để nắm hướng đi trước, sau đó mở <b>Xem Lời giải chi tiết</b> kèm giải thích màu xám ở từng bước biến đổi nhé!</p>

    <!-- CÂU 1 BUỔI 6 -->
    <div class="formula-card">
      <h3 id="b6-cau1">Câu 1 (Bài toán Slide 7-8): Tính Nồng Độ Electron và Lỗ Trống Cân Bằng Từ Vị Trí Mức Fermi</h3>
      <p><b>Đề bài:</b> Xét chất bán dẫn Silicon ở nhiệt độ phòng $T = 300\text{ K}$ có mật độ trạng thái hiệu dụng là $N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$ và $N_v = 1.04 \times 10^{19}\text{ cm}^{-3}$. Giả sử năng lượng vùng cấm của Silicon là $E_g = 1.12\text{ eV}$ và mức năng lượng Fermi $E_F$ nằm thấp hơn đáy dải dẫn $E_c$ một khoảng là $0.25\text{ eV}$. Hãy tính:<br>
      (a) Khoảng cách từ mức năng lượng Fermi $E_F$ đến đỉnh dải hóa trị $E_v$.<br>
      (b) Nồng độ electron cân bằng $n_0$ và nồng độ lỗ trống cân bằng $p_0$. Cho biết mẫu bán dẫn này thuộc loại N hay loại P?</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b6-hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b6-sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b6-hint1" class="panel">
        <b>Hướng đi &amp; Công thức cần dùng:</b>
        <ul>
          <li><b>Ý (a):</b> Tổng khoảng cách từ đỉnh dải hóa trị $E_v$ lên đáy dải dẫn $E_c$ chính là độ rộng vùng cấm $E_g = (E_c - E_F) + (E_F - E_v) = 1.12\text{ eV}$. Biết $E_c - E_F = 0.25\text{ eV}$, em trừ đi là ra ngay $E_F - E_v$.</li>
          <li><b>Ý (b):</b> Vì cả $E_c - E_F = 0.25\text{ eV}$ và $E_F - E_v = 0.87\text{ eV}$ đều lớn hơn rất nhiều so với $3kT \approx 0.078\text{ eV}$, xấp xỉ Boltzmann hoàn toàn hợp lệ. Em áp dụng $n_0 = N_c \exp\left(-\frac{E_c - E_F}{kT}\right)$ và $p_0 = N_v \exp\left(-\frac{E_F - E_v}{kT}\right)$ với $kT = 0.0259\text{ eV}$.</li>
        </ul>
      </div>

      <div id="b6-sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Tính khoảng cách từ mức Fermi $E_F$ đến đỉnh dải hóa trị $E_v$:</b>
          <span class="cmt">// Bước 1: Ta biết độ rộng vùng cấm $E_g = E_c - E_v = 1.12\text{ eV}$ chính bằng tổng khoảng cách từ $E_F$ lên $E_c$ cộng với khoảng cách từ $E_v$ lên $E_F$:</span>
          $$E_F - E_v = E_g - (E_c - E_F) = 1.12\text{ eV} - 0.25\text{ eV} = \mathbf{0.87\text{ eV}}$$
          <span class="cmt">// Như vậy, mức năng lượng Fermi nằm cao hơn đỉnh dải hóa trị $E_v$ một đoạn là $0.87\text{ eV}$.</span>
        </div>

        <div class="step">
          <b>(b) Tính nồng độ hạt dẫn cân bằng $n_0$, $p_0$ và xác định loại bán dẫn:</b>
          <span class="cmt">// Bước 1: Tính nồng độ electron cân bằng $n_0$ trong dải dẫn tại $T = 300\text{ K}$ (với $kT = 0.0259\text{ eV}$ và $E_c - E_F = 0.25\text{ eV}$):</span>
          $$n_0 = N_c \exp\left[-\frac{E_c - E_F}{kT}\right] = \left(2.8 \times 10^{19}\text{ cm}^{-3}\right) \times \exp\left[-\frac{0.25\text{ eV}}{0.0259\text{ eV}}\right]$$
          $$n_0 = \left(2.8 \times 10^{19}\right) \times e^{-9.6525} \approx \mathbf{1.80 \times 10^{15}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Tính nồng độ lỗ trống cân bằng $p_0$ trong dải hóa trị với $E_F - E_v = 0.87\text{ eV}$:</span>
          $$p_0 = N_v \exp\left[-\frac{E_F - E_v}{kT}\right] = \left(1.04 \times 10^{19}\text{ cm}^{-3}\right) \times \exp\left[-\frac{0.87\text{ eV}}{0.0259\text{ eV}}\right]$$
          $$p_0 = \left(1.04 \times 10^{19}\right) \times e^{-33.591} \approx \mathbf{2.70 \times 10^{4}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 3: So sánh $n_0$ và $p_0$: Ta thấy $n_0 = 1.80 \times 10^{15}\text{ cm}^{-3}$ lớn hơn $p_0 = 2.70 \times 10^4\text{ cm}^{-3}$ gần $10^{11}$ lần ($100\text{ tỷ lần}$!). Vậy electron là hạt dẫn chiếm ưu thế tuyệt đối, mẫu bán dẫn này là BÁN DẪN LOẠI N (n-type semiconductor).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 2 BUỔI 6 -->
    <div class="formula-card">
      <h3 id="b6-cau2">Câu 2 (Bài toán Slide 13-14): Tính Nồng Độ Electron Bằng Tích Phân Fermi-Dirac Trong Bán Dẫn Suy Biến</h3>
      <p><b>Đề bài:</b> Xét một mẫu Silicon pha tạp loại N cực mạnh (suy biến) ở nhiệt độ phòng $T = 300\text{ K}$ ($N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$) sao cho thông số năng lượng Fermi chuẩn hóa đạt giá trị $\eta_F = \frac{E_F - E_c}{kT} = 2$ (tức mức năng lượng Fermi nằm cao hơn đáy dải dẫn $E_c$ khoảng $2kT \approx 52\text{ meV}$). Biết từ đồ thị tích phân Fermi-Dirac (Figure 4.11), tại $\eta_F = 2$ thì $F_{1/2}(2) = 2.7$.<br>
      (a) Hãy tính nồng độ electron cân bằng $n_0$ bằng công thức tích phân Fermi-Dirac chính xác.<br>
      (b) Nếu áp dụng nhầm công thức xấp xỉ Boltzmann cũ cho trường hợp này thì kết quả $n_0$ sẽ ra bao nhiêu và sai lệch như thế nào? Tại sao?</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b6-hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b6-sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b6-hint2" class="panel">
        <b>Hướng đi &amp; Công thức cần dùng:</b>
        <ul>
          <li><b>Ý (a):</b> Áp dụng công thức nồng độ electron theo tích phân Fermi-Dirac:
            $$n_0 = \frac{2}{\sqrt{\pi}}\,N_c\,F_{1/2}(\eta_F)$$
            Thay $N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$ và $F_{1/2}(2) = 2.7$ vào để bấm máy.</li>
          <li><b>Ý (b):</b> Thay $-\frac{E_c - E_F}{kT} = +\frac{E_F - E_c}{kT} = \eta_F = +2$ vào công thức xấp xỉ Boltzmann $n_0 = N_c e^{\eta_F} = N_c e^2$, sau đó so sánh với kết quả câu (a).</li>
        </ul>
      </div>

      <div id="b6-sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Tính nồng độ electron $n_0$ bằng tích phân Fermi-Dirac chính xác:</b>
          <span class="cmt">// Bước 1: Vì $\eta_F = \frac{E_F - E_c}{kT} = 2 > 0$, mức Fermi $E_F$ đã nằm sâu bên trong dải dẫn (bán dẫn suy biến mạnh loại $n^+$). Ta bắt buộc dùng công thức tích phân Fermi-Dirac:</span>
          $$n_0 = 4\pi\left(\frac{2 m_n^* kT}{h^2}\right)^{3/2} \int_0^\infty \frac{\eta^{1/2}\,d\eta}{1 + \exp(\eta - \eta_F)} = \frac{2}{\sqrt{\pi}}\,N_c\,F_{1/2}(\eta_F)$$
          <span class="cmt">// Bước 2: Thay $N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$ (của Silicon ở $300\text{ K}$) và giá trị tra đồ thị $F_{1/2}(2) = 2.7$ vào công thức:</span>
          $$n_0 = \frac{2}{\sqrt{\pi}} \times \left(2.8 \times 10^{19}\text{ cm}^{-3}\right) \times 2.7 \approx 1.1284 \times \left(2.8 \times 10^{19}\right) \times 2.7 \approx \mathbf{8.53 \times 10^{19}\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(b) So sánh với kết quả khi dùng nhầm công thức xấp xỉ Boltzmann:</b>
          <span class="cmt">// Bước 1: Nếu dùng công thức xấp xỉ Boltzmann cũ $n_0 = N_c \exp\left[-\frac{E_c - E_F}{kT}\right] = N_c \exp(\eta_F)$ với $\eta_F = 2$:</span>
          $$n_{0(\text{Boltzmann})} = \left(2.8 \times 10^{19}\text{ cm}^{-3}\right) \times e^2 \approx \left(2.8 \times 10^{19}\right) \times 7.389 \approx \mathbf{2.07 \times 10^{20}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Giải thích nguyên nhân sai lệch: Kết quả tính theo Boltzmann ($2.07 \times 10^{20}\text{ cm}^{-3}$) bị vọt lên cao gấp $2.43$ lần (sai số tới $+143\%$!) so với giá trị thực tế ($8.53 \times 10^{19}\text{ cm}^{-3}$). Lý do là khi $E_F > E_c$, các trạng thái ở đáy dải dẫn đã bị lấp đầy gần kín (bị giới hạn bởi Nguyên lý loại trừ Pauli $f_F(E) \le 1$), trong khi hàm mũ Boltzmann $\exp\left(\frac{E_F - E}{kT}\right)$ lại tăng vọt lên lớn hơn $1$ (vi phạm nguyên lý Pauli!).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 3 BUỔI 6 -->
    <div class="formula-card">
      <h3 id="b6-cau3">Câu 3 (Bài toán Slide 23-24 &amp; 27-28): Kiểm Chứng Sự Ion Hóa Hoàn Toàn Và Tìm Nhiệt Độ Ion Hóa 90%</h3>
      <p><b>Đề bài:</b><br>
      (a) Xét mẫu Silicon pha tạp Phosphorus (Donor) với nồng độ $N_d = 10^{16}\text{ cm}^{-3}$ ở nhiệt độ phòng $T = 300\text{ K}$. Biết $N_c(300\text{ K}) = 2.8 \times 10^{19}\text{ cm}^{-3}$ và năng lượng ion hóa của Phosphorus trong Silicon là $E_c - E_d = 0.045\text{ eV}$. Hãy xác định tỷ lệ phần trăm giữa số electron vẫn còn nằm ở trạng thái Donor ($n_d$) so với tổng số electron ($n_d + n_0$).<br>
      (b) Xét mẫu Silicon loại P pha tạp Boron (Acceptor) với nồng độ $N_a = 10^{16}\text{ cm}^{-3}$. Biết năng lượng ion hóa của Boron trong Silicon là $E_a - E_v = 0.045\text{ eV}$, hệ số suy biến của mức Acceptor là $g = 4$, và tại $300\text{ K}$ thì $N_v(300\text{ K}) = 1.04 \times 10^{19}\text{ cm}^{-3}$. Hãy xác định nhiệt độ $T$ mà tại đó có đúng $90\%$ nguyên tử Acceptor bị ion hóa.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b6-hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b6-sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b6-hint3" class="panel">
        <b>Hướng đi &amp; Công thức cần dùng:</b>
        <ul>
          <li><b>Ý (a):</b> Áp dụng trực tiếp công thức tỷ lệ electron chưa ion hóa trên mức Donor:
            $$\frac{n_d}{n_d + n_0} = \frac{1}{1 + \frac{N_c}{2 N_d}\exp\left[-\frac{E_c - E_d}{kT}\right]}$$
          </li>
          <li><b>Ý (b):</b> Khi có $90\%$ nguyên tử Acceptor đã bị ion hóa ($N_a^- = 0.90 N_a$), nghĩa là chỉ còn lại $\mathbf{10\%}$ ($0.10$) lỗ trống vẫn còn kẹt ở trạng thái Acceptor chưa ion hóa! Do đó ta lập phương trình:
            $$\frac{p_a}{p_0 + p_a} = \frac{1}{1 + \frac{N_v(T)}{4 N_a}\exp\left[-\frac{E_a - E_v}{kT}\right]} = 0.10$$
            Nhớ thay $N_v(T) = 1.04 \times 10^{19}\left(\frac{T}{300}\right)^{3/2}$ và $kT = 0.0259\left(\frac{T}{300}\right)$, sau đó giải tìm $T$ bằng máy tính bỏ túi (nút SHIFT-SOLVE).</li>
        </ul>
      </div>

      <div id="b6-sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Tính tỷ lệ electron còn nằm ở mức Donor tại $T = 300\text{ K}$:</b>
          <span class="cmt">// Bước 1: Viết công thức tỷ số giữa nồng độ electron còn chiếm giữ mức Donor ($n_d$) và tổng nồng độ electron ($n_d + n_0$):</span>
          $$\frac{n_d}{n_d + n_0} = \frac{1}{1 + \frac{N_c}{2 N_d}\exp\left[-\frac{E_c - E_d}{kT}\right]}$$
          <span class="cmt">// Bước 2: Thay các thông số tại $T = 300\text{ K}$ ($N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$, $N_d = 10^{16}\text{ cm}^{-3}$, $E_c - E_d = 0.045\text{ eV}$, $kT = 0.0259\text{ eV}$) vào biểu thức:</span>
          $$\frac{n_d}{n_d + n_0} = \frac{1}{1 + \frac{2.8 \times 10^{19}}{2 \times 10^{16}}\exp\left[-\frac{0.045\text{ eV}}{0.0259\text{ eV}}\right]} = \frac{1}{1 + 1400 \times e^{-1.7375}}$$
          $$\frac{n_d}{n_d + n_0} = \frac{1}{1 + 1400 \times 0.17597} = \frac{1}{1 + 246.35} \approx \mathbf{0.00404 \approx 0.41\%}$$
          <span class="cmt">// Kết luận (a): Chỉ còn khoảng $0.41\%$ electron nằm lại ở mức Donor, còn $99.59\%$ đã nhảy lên dải dẫn — do đó giả thiết "Ion hóa hoàn toàn" ở nhiệt độ phòng là hoàn toàn chính xác!</span>
        </div>

        <div class="step">
          <b>(b) Tìm nhiệt độ $T$ để $90\%$ nguyên tử Acceptor Boron bị ion hóa:</b>
          <span class="cmt">// Bước 1: Khi $90\%$ nguyên tử Acceptor bị ion hóa (tạo lỗ trống tự do $p_0$ trong dải hóa trị), thì phần trăm nguyên tử Acceptor chưa bị ion hóa (vẫn giữ lỗ trống $p_a$) là $100\% - 90\% = 10\% = 0.10$:</span>
          $$\frac{p_a}{p_0 + p_a} = \frac{1}{1 + \frac{N_v(T)}{g \cdot N_a}\exp\left[-\frac{E_a - E_v}{kT}\right]} = 0.10$$
          <span class="cmt">// Bước 2: Từ $\frac{1}{1 + X} = 0.10 = \frac{1}{10}$, ta suy ra ngay mẫu số $1 + X = 10 \implies$ cụm biểu thức $X$ ở mẫu số phải bằng $9$:</span>
          $$\frac{N_v(T)}{4 N_a}\exp\left[-\frac{E_a - E_v}{kT}\right] = 9$$
          <span class="cmt">// Bước 3: Thay quy luật phụ thuộc nhiệt độ $N_v(T) = 1.04 \times 10^{19}\left(\frac{T}{300}\right)^{3/2}$ và $kT = 0.0259\left(\frac{T}{300}\right)$ cùng $N_a = 10^{16}\text{ cm}^{-3}$, $E_a - E_v = 0.045\text{ eV}$ vào phương trình:</span>
          $$\frac{1.04 \times 10^{19}\left(\frac{T}{300}\right)^{3/2}}{4 \times 10^{16}}\exp\left[-\frac{0.045}{0.0259\left(\frac{T}{300}\right)}\right] = 9$$
          $$260 \times \left(\frac{T}{300}\right)^{3/2} \exp\left[-\frac{521.236}{T}\right] = 9$$
          <span class="cmt">// Bước 4: Dùng phương pháp thử sai (trial and error) hoặc chức năng SOLVE trên máy tính cầm tay, ta tìm được nghiệm nhiệt độ $T$:</span>
          $$\mathbf{T \approx 193\text{ K}} \quad (\text{tức khoảng } -80^\circ\text{C})$$
          <span class="cmt">// Nhận xét vật lý: Ngay cả khi làm lạnh sâu xuống thấp hơn nhiệt độ phòng tới hơn $100^\circ\text{C}$ ($T = 193\text{ K}$), vẫn có tới $90\%$ nguyên tử Boron đã bị ion hóa!</span>
        </div>
      </div>
    </div>

    <!-- CÂU 4 BUỔI 6 -->
    <div class="formula-card">
      <h3 id="b6-cau4">Câu 4 (Bài toán Slide 33-34, 37, 40): Tính Nồng Độ Hạt Dẫn Đa Số &amp; Thiểu Số Trong Bán Dẫn Pha Tạp và Bù Trừ</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 212" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><text x="20" y="16" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:700">■ n₀</text><text x="70" y="16" text-anchor="start" style="fill:var(--c5);font-size:12px;font-weight:700">■ p₀</text><text x="210" y="16" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">(độ dài thanh theo log₁₀, đơn vị cm⁻³)</text><text x="20" y="47" text-anchor="start" style="fill:var(--ink);font-size:13px;font-weight:700">4a</text><rect x="55" y="30" width="320" height="16" rx="2" style="fill:var(--c1);stroke:var(--c1);stroke-width:1.5;fill-opacity:0.5"/><text x="379" y="42" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">10¹⁶</text><rect x="55" y="48" width="87.0" height="16" rx="2" style="fill:var(--c5);stroke:var(--c5);stroke-width:1.5;fill-opacity:0.5"/><text x="146.0" y="60" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">2.3×10⁴</text><text x="20" y="91" text-anchor="start" style="fill:var(--ink);font-size:13px;font-weight:700">4b</text><rect x="55" y="74" width="309.6" height="16" rx="2" style="fill:var(--c1);stroke:var(--c1);stroke-width:1.5;fill-opacity:0.5"/><text x="368.6" y="86" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">3×10¹⁵</text><rect x="55" y="92" width="97.6" height="16" rx="2" style="fill:var(--c5);stroke:var(--c5);stroke-width:1.5;fill-opacity:0.5"/><text x="156.6" y="104" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">7.5×10⁴</text><text x="20" y="135" text-anchor="start" style="fill:var(--ink);font-size:13px;font-weight:700">4c</text><rect x="55" y="118" width="286.2" height="16" rx="2" style="fill:var(--c1);stroke:var(--c1);stroke-width:1.5;fill-opacity:0.5"/><text x="345.2" y="130" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">2×10¹⁴</text><rect x="55" y="136" width="249.0" height="16" rx="2" style="fill:var(--c5);stroke:var(--c5);stroke-width:1.5;fill-opacity:0.5"/><text x="308.0" y="148" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">2.8×10¹²</text><text x="20" y="179" text-anchor="start" style="fill:var(--ink);font-size:13px;font-weight:700">4d</text><rect x="55" y="162" width="90.19999999999999" height="16" rx="2" style="fill:var(--c1);stroke:var(--c1);stroke-width:1.5;fill-opacity:0.5"/><text x="149.2" y="174" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">3.2×10⁴</text><rect x="55" y="180" width="317.0" height="16" rx="2" style="fill:var(--c5);stroke:var(--c5);stroke-width:1.5;fill-opacity:0.5"/><text x="376.0" y="192" text-anchor="start" style="fill:var(--ink);font-size:10.5px;font-weight:400">7×10¹⁵</text></svg><figcaption>Câu 4: hạt đa số luôn lớn hơn hạt thiểu số hàng chục bậc độ lớn.</figcaption></figure>

      <p><b>Đề bài:</b> Giả sử sự ion hóa tạp chất là hoàn toàn ở nhiệt độ phòng $T = 300\text{ K}$. Hãy xác định nồng độ electron cân bằng $n_0$ và nồng độ lỗ trống cân bằng $p_0$ trong 4 mẫu bán dẫn sau:<br>
      (a) Mẫu Silicon ($n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$) có $N_d = 10^{16}\text{ cm}^{-3}$ và $N_a = 0$.<br>
      (b) Mẫu Silicon ($n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$) có $N_d = 5 \times 10^{15}\text{ cm}^{-3}$ và $N_a = 2 \times 10^{15}\text{ cm}^{-3}$.<br>
      (c) Mẫu Germanium ($n_i = 2.4 \times 10^{13}\text{ cm}^{-3}$) có $N_d = 2 \times 10^{14}\text{ cm}^{-3}$ và $N_a = 0$.<br>
      (d) Mẫu Silicon ($n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$) có $N_a = 10^{16}\text{ cm}^{-3}$ và $N_d = 3 \times 10^{15}\text{ cm}^{-3}$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b6-hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b6-sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b6-hint4" class="panel">
        <b>Hướng đi &amp; Công thức cần dùng:</b>
        <ul>
          <li>So sánh $N_d$ và $N_a$ trước tiên:<br>
            + Ở các ý <b>(a), (b), (c)</b> đều có $N_d > N_a \implies$ Bán dẫn thuộc <b>loại N</b>. Ta tính hạt dẫn đa số electron trước bằng công thức:
            $$n_0 = \frac{N_d - N_a}{2} + \sqrt{\left(\frac{N_d - N_a}{2}\right)^2 + n_i^2} \qquad \text{rồi suy ra} \qquad p_0 = \frac{n_i^2}{n_0}$$
            <i>Lưu ý đặc biệt ở ý (c):</i> Vì Germanium có $n_i = 2.4 \times 10^{13}\text{ cm}^{-3}$ khá gần với $N_d = 2 \times 10^{14}\text{ cm}^{-3}$, em bắt buộc phải bấm máy cả căn bậc hai chứ không được bỏ qua $n_i^2$!<br>
            + Ở ý <b>(d)</b> có $N_a > N_d \implies$ Bán dẫn bù trừ thuộc <b>loại P</b>. Ta tính hạt dẫn đa số lỗ trống trước bằng công thức:
            $$p_0 = \frac{N_a - N_d}{2} + \sqrt{\left(\frac{N_a - N_d}{2}\right)^2 + n_i^2} \qquad \text{rồi suy ra} \qquad n_0 = \frac{n_i^2}{p_0}$$
          </li>
        </ul>
      </div>

      <div id="b6-sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Mẫu Silicon có $N_d = 10^{16}\text{ cm}^{-3}$, $N_a = 0$ ($n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$):</b>
          <span class="cmt">// Bước 1: Vì $N_d > N_a$ và $N_d = 10^{16}\text{ cm}^{-3} \gg n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$, nồng độ hạt dẫn đa số electron $n_0$ tính từ phương trình trung hòa điện là:</span>
          $$n_0 = \frac{10^{16}}{2} + \sqrt{\left(\frac{10^{16}}{2}\right)^2 + \left(1.5 \times 10^{10}\right)^2} \approx \mathbf{10^{16}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Dùng định luật tác dụng khối lượng $n_0 p_0 = n_i^2$ để tính nồng độ hạt dẫn thiểu số lỗ trống $p_0$:</span>
          $$p_0 = \frac{n_i^2}{n_0} = \frac{\left(1.5 \times 10^{10}\text{ cm}^{-3}\right)^2}{10^{16}\text{ cm}^{-3}} = \frac{2.25 \times 10^{20}}{10^{16}} = \mathbf{2.25 \times 10^4\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(b) Mẫu Silicon bù trừ có $N_d = 5 \times 10^{15}\text{ cm}^{-3}$ và $N_a = 2 \times 10^{15}\text{ cm}^{-3}$:</b>
          <span class="cmt">// Bước 1: Vì $N_d > N_a$, đây là bán dẫn bù trừ loại N với nồng độ Donor hiệu dụng là $N_d - N_a = 5 \times 10^{15} - 2 \times 10^{15} = 3 \times 10^{15}\text{ cm}^{-3} \gg n_i$:</span>
          $$n_0 = \frac{5 \times 10^{15} - 2 \times 10^{15}}{2} + \sqrt{\left(\frac{5 \times 10^{15} - 2 \times 10^{15}}{2}\right)^2 + \left(1.5 \times 10^{10}\right)^2} \approx \mathbf{3 \times 10^{15}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Tính nồng độ lỗ trống thiểu số $p_0$:</span>
          $$p_0 = \frac{n_i^2}{n_0} = \frac{\left(1.5 \times 10^{10}\right)^2}{3 \times 10^{15}} = \frac{2.25 \times 10^{20}}{3 \times 10^{15}} = \mathbf{7.5 \times 10^4\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(c) Mẫu Germanium có $N_d = 2 \times 10^{14}\text{ cm}^{-3}$, $N_a = 0$ ($n_i = 2.4 \times 10^{13}\text{ cm}^{-3}$):</b>
          <span class="cmt">// Bước 1: Chú ý rằng ở Germanium, $n_i = 0.24 \times 10^{14}\text{ cm}^{-3}$ bằng hơn $10\%$ của $N_d = 2 \times 10^{14}\text{ cm}^{-3}$ (không phải là quá nhỏ!), nên hạt dẫn nội tại có đóng góp đáng kể vào tổng số electron. Ta phải tính đầy đủ biểu thức căn bậc hai:</span>
          $$n_0 = \frac{2 \times 10^{14}}{2} + \sqrt{\left(\frac{2 \times 10^{14}}{2}\right)^2 + \left(2.4 \times 10^{13}\right)^2} = 10^{14} + \sqrt{10^{28} + 5.76 \times 10^{26}}$$
          $$n_0 = 10^{14} + 1.0284 \times 10^{14} \approx \mathbf{2.028 \times 10^{14}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Tính nồng độ lỗ trống thiểu số $p_0$:</span>
          $$p_0 = \frac{n_i^2}{n_0} = \frac{\left(2.4 \times 10^{13}\text{ cm}^{-3}\right)^2}{2.028 \times 10^{14}\text{ cm}^{-3}} = \frac{5.76 \times 10^{26}}{2.028 \times 10^{14}} \approx \mathbf{2.84 \times 10^{12}\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(d) Mẫu Silicon bù trừ có $N_a = 10^{16}\text{ cm}^{-3}$ và $N_d = 3 \times 10^{15}\text{ cm}^{-3}$:</b>
          <span class="cmt">// Bước 1: Vì $N_a > N_d$, đây là bán dẫn bù trừ loại P với nồng độ Acceptor hiệu dụng là $N_a - N_d = 10^{16} - 3 \times 10^{15} = 7 \times 10^{15}\text{ cm}^{-3} \gg n_i$. Ta tính nồng độ lỗ trống đa số $p_0$ trước:</span>
          $$p_0 = \frac{10^{16} - 3 \times 10^{15}}{2} + \sqrt{\left(\frac{10^{16} - 3 \times 10^{15}}{2}\right)^2 + \left(1.5 \times 10^{10}\right)^2} \approx \mathbf{7 \times 10^{15}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Tính nồng độ hạt dẫn thiểu số electron $n_0$:</span>
          $$n_0 = \frac{n_i^2}{p_0} = \frac{\left(1.5 \times 10^{10}\right)^2}{7 \times 10^{15}} = \frac{2.25 \times 10^{20}}{7 \times 10^{15}} \approx \mathbf{3.21 \times 10^4\text{ cm}^{-3}}$$
        </div>
      </div>
    </div>

    <!-- CÂU 5 BUỔI 6 -->
    <div class="formula-card">
      <h3 id="b6-cau5">Câu 5 (Bài toán Slide 44): Thiết Kế Nồng Độ Pha Tạp Bù Trừ Để Đạt Vị Trí Mức Fermi Cho Trước</h3>
      <p><b>Đề bài:</b> Một mẫu Silicon ở nhiệt độ phòng $T = 300\text{ K}$ ($N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$) đã chứa sẵn các nguyên tử tạp chất Acceptor với nồng độ $N_a = 10^{16}\text{ cm}^{-3}$. Hãy xác định nồng độ nguyên tử tạp chất Donor ($N_d$) cần phải pha thêm vào để biến mẫu Silicon này thành bán dẫn loại N có mức năng lượng Fermi nằm thấp hơn mép đáy dải dẫn $E_c$ đúng một khoảng là $0.20\text{ eV}$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b6-hint5')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b6-sol5')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b6-hint5" class="panel">
        <b>Hướng đi &amp; Công thức cần dùng:</b>
        <ul>
          <li>Để biến một mẫu vốn có sẵn $N_a = 10^{16}\text{ cm}^{-3}$ thành bán dẫn loại N, nồng độ Donor thêm vào phải lớn hơn $N_a$ ($N_d > N_a$) để trước hết trung hòa hết $N_a$, phần dư ra $(N_d - N_a)$ mới tạo ra nồng độ electron $n_0 \approx N_d - N_a$.</li>
          <li>Dùng công thức liên hệ giữa vị trí mức Fermi và nồng độ Donor hiệu dụng:
            $$E_c - E_F = kT \ln\left(\frac{N_c}{N_d - N_a}\right) \iff N_d - N_a = N_c \exp\left[-\frac{E_c - E_F}{kT}\right]$$
            Tính được hiệu số $N_d - N_a$ rồi, em nhớ <b>cộng thêm $N_a = 10^{16}\text{ cm}^{-3}$</b> để ra tổng nồng độ $N_d$ cần pha!</li>
        </ul>
      </div>

      <div id="b6-sol5" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Viết phương trình xác định vị trí mức năng lượng Fermi $E_c - E_F$ đối với bán dẫn bù trừ loại N ($N_d > N_a$):</span>
          $$E_c - E_F = kT \ln\left(\frac{N_c}{N_d - N_a}\right)$$
          <span class="cmt">// Bước 2: Biến đổi tương đương (lấy hàm mũ hai vế) để rút ra nồng độ Donor hiệu dụng $(N_d - N_a)$:</span>
          $$N_d - N_a = N_c \exp\left[-\frac{E_c - E_F}{kT}\right]$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Thay số liệu tại $T = 300\text{ K}$ ($N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$, $E_c - E_F = 0.20\text{ eV}$, $kT = 0.0259\text{ eV}$) vào biểu thức trên:</span>
          $$N_d - N_a = \left(2.8 \times 10^{19}\text{ cm}^{-3}\right) \times \exp\left[-\frac{0.20\text{ eV}}{0.0259\text{ eV}}\right] = \left(2.8 \times 10^{19}\right) \times e^{-7.722} \approx \mathbf{1.24 \times 10^{16}\text{ cm}^{-3}}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 4: Cộng thêm lượng tạp chất Acceptor $N_a = 10^{16}\text{ cm}^{-3}$ có sẵn từ đầu để tìm tổng nồng độ Donor $N_d$ cần phải pha vào:</span>
          $$N_d = 1.24 \times 10^{16}\text{ cm}^{-3} + N_a = 1.24 \times 10^{16} + 1.0 \times 10^{16} = \mathbf{2.24 \times 10^{16}\text{ cm}^{-3}}$$
          <span class="cmt">// Giải thích bản chất: Trong $2.24 \times 10^{16}\text{ cm}^{-3}$ nguyên tử Donor thêm vào, có $1.0 \times 10^{16}\text{ cm}^{-3}$ nguyên tử dùng để bù trừ (trung hòa) vừa khít với $1.0 \times 10^{16}\text{ cm}^{-3}$ nguyên tử Acceptor có sẵn, phần còn dư $1.24 \times 10^{16}\text{ cm}^{-3}$ nguyên tử Donor mới cung cấp electron tự do cho dải dẫn để đẩy mức Fermi lên cách $E_c$ một đoạn $0.20\text{ eV}$.</span>
        </div>
      </div>
    </div>

    <!-- CÂU 6 BUỔI 6 -->
    <div class="formula-card">
      <h3 id="b6-cau6">Câu 6 (Bài toán Slide 49): Tìm Nồng Độ Pha Tạp Tối Đa Để Xấp Xỉ Boltzmann Còn Hợp Lệ (Ranh Giới Suy Biến)</h3>
      <p><b>Đề bài:</b> Xét mẫu Silicon loại P ở $T = 300\text{ K}$ ($E_g = 1.12\text{ eV}, n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$) được pha tạp bằng Boron (có năng lượng ion hóa $E_a - E_v = 0.045\text{ eV}$). Giả sử giới hạn để xấp xỉ Boltzmann còn hợp lệ (bán dẫn chưa bị suy biến) xảy ra khi mức năng lượng Fermi $E_F$ tiến đến cách mức tạp chất Acceptor $E_a$ một khoảng bằng $3kT$ (tức $E_F - E_a = 3kT$). Coi $E_{Fi} \approx E_{\text{midgap}}$. Hãy xác định vị trí mức Fermi và nồng độ pha tạp Acceptor tối đa ($N_{a,\max}$) để xấp xỉ Boltzmann vẫn còn hiệu lực.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b6-hint6')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b6-sol6')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b6-hint6" class="panel">
        <b>Hướng đi &amp; Công thức cần dùng:</b>
        <ul>
          <li>Vẽ nhanh trục năng lượng từ dưới lên trên cho bán dẫn loại P: Dưới cùng là đỉnh dải hóa trị $E_v$, cao hơn $0.045\text{ eV}$ là mức $E_a$, cao hơn $E_a$ một đoạn $3kT$ là mức $E_F$, và ở chính giữa vùng cấm (cách $E_v$ một đoạn $\frac{E_g}{2} = 0.56\text{ eV}$) là mức nội tại $E_{Fi}$.</li>
          <li>Do đó khoảng cách từ $E_F$ lên $E_{Fi}$ là:
            $$E_{Fi} - E_F = \frac{E_g}{2} - (E_a - E_v) - (E_F - E_a)$$
          </li>
          <li>Sau khi tính được $E_{Fi} - E_F$, em thay vào công thức $E_{Fi} - E_F = kT \ln\left(\frac{N_a}{n_i}\right) \implies N_a = n_i \exp\left(\frac{E_{Fi} - E_F}{kT}\right)$.</li>
        </ul>
      </div>

      <div id="b6-sol6" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Tính khoảng cách năng lượng từ mức Fermi $E_F$ đến mức Fermi nội tại $E_{Fi} \approx E_{\text{midgap}}$ tại ranh giới $E_F - E_a = 3kT$. Biết nửa vùng cấm của Silicon là $\frac{E_g}{2} = \frac{1.12}{2} = 0.56\text{ eV}$, mức Boron cách $E_v$ một đoạn $E_a - E_v = 0.045\text{ eV}$ và $3kT = 3 \times 0.0259 = 0.0777\text{ eV}$:</span>
          $$E_{Fi} - E_F = \frac{E_g}{2} - (E_a - E_v) - (E_F - E_a)$$
          $$E_{Fi} - E_F = 0.56\text{ eV} - 0.045\text{ eV} - 3(0.0259\text{ eV}) = 0.56 - 0.045 - 0.0777 = \mathbf{0.4373\text{ eV}} \approx 0.437\text{ eV}$$
          <span class="cmt">// (Khoảng cách từ mức Fermi này đến đỉnh dải hóa trị $E_v$ là $E_F - E_v = 0.045 + 0.0777 = 0.1227\text{ eV}$).</span>
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Áp dụng công thức liên hệ giữa độ lệch mức Fermi $E_{Fi} - E_F$ và nồng độ Acceptor $N_a$ trong bán dẫn loại P:</span>
          $$E_{Fi} - E_F = kT \ln\left(\frac{N_a}{n_i}\right) \implies 0.437\text{ eV} = (0.0259\text{ eV}) \ln\left(\frac{N_a}{n_i}\right)$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Rút ra nồng độ pha tạp tối đa $N_a$ (với $n_i = 1.5 \times 10^{10}\text{ cm}^{-3}$ của Silicon ở $300\text{ K}$):</span>
          $$N_a = n_i \exp\left(\frac{0.437\text{ eV}}{0.0259\text{ eV}}\right) = \left(1.5 \times 10^{10}\text{ cm}^{-3}\right) \times e^{16.8726} \approx \mathbf{3.2 \times 10^{17}\text{ cm}^{-3}}$$
          <span class="cmt">// Kết luận thực tế cực kỳ quan trọng: Trong Silicon ở nhiệt độ phòng, nếu nồng độ pha tạp Acceptor (hoặc Donor) vượt quá ngưỡng $\approx 3.2 \times 10^{17}\text{ cm}^{-3}$, thì xấp xỉ Boltzmann không còn hợp lệ nữa và chất bán dẫn bắt đầu chuyển sang trạng thái Bán dẫn suy biến!</span>
        </div>
      </div>
    </div>
  </section>

  <section class="sum">
    <h2>Tổng Kết Buổi 6: Những Điểm Cốt Lõi Cần Nhớ</h2>
    <ul>
      <li><b>Định luật tác dụng khối lượng &amp; Mức Fermi:</b> $n_0 = n_i\exp\left(\frac{E_F-E_{Fi}}{kT}\right)$, $p_0 = n_i\exp\left(-\frac{E_F-E_{Fi}}{kT}\right)$ và $\mathbf{n_0 p_0 = n_i^2}$ (chỉ hợp lệ khi bán dẫn không suy biến).</li>
      <li><b>Bán dẫn suy biến &amp; Tích phân Fermi-Dirac:</b> Khi pha tạp cực mạnh ($\ge 3.2 \times 10^{17}\text{ cm}^{-3}$ trong $\text{Si}$), $E_F$ tiến sát hoặc chui vào trong dải dẫn/hóa trị. Khi đó bắt buộc dùng $n_0 = \frac{2}{\sqrt{\pi}}N_c F_{1/2}(\eta_F)$ với $\eta_F = \frac{E_F - E_c}{kT}$.</li>
      <li><b>Ion hóa hoàn toàn &amp; Đóng băng:</b> Ở nhiệt độ phòng ($300\text{ K}$), gần như $100\%$ tạp chất bị ion hóa ($N_d^+ \approx N_d, N_a^- \approx N_a$). Ở nhiệt độ cực thấp ($T \to 0\text{ K}$), hạt dẫn bị đóng băng trên mức tạp chất.</li>
      <li><b>Bán dẫn bù trừ &amp; Trung hòa điện tích:</b> Khi có cả $N_d$ và $N_a$, phương trình $n_0 + N_a = p_0 + N_d$ cho nghiệm $n_0 = \frac{N_d-N_a}{2} + \sqrt{\left(\frac{N_d-N_a}{2}\right)^2 + n_i^2}$ (với $N_d > N_a$). Khi hai vật liệu tiếp xúc nhau ở cân bằng nhiệt, mức Fermi $E_F$ ở cả hai bên luôn san bằng ngang nhau.</li>
    </ul>
  
    <div class="next"><b>Tiếp theo trong môn học:</b> Em đã biết số hạt dẫn và vị trí $E_F$ ở cân bằng. Khi học về linh kiện, ta dùng chính những kết quả này để xét điều gì xảy ra khi có điện áp hoặc khi ghép hai vùng n và p.</div>
</section>
</template>

const $ = id => document.getElementById(id);

/* =========================================================

/* =========================================================
   MÔ HÌNH 2: MẠNG 2D, VECTOR TỊNH TIẾN & CÁC Ô ĐƠN VỊ
   ========================================================= */
function renderLattice2D() {
  const svgEl = $('lattice2d-svg');
  if (!svgEl) return;
  const p = +$('sl-p').value;
  const q = +$('sl-q').value;
  $('val-p').textContent = p;
  $('val-q').textContent = q;

  const ax = 85, ay = 0;   // vector a
  const bx = 28, by = -54; // vector b
  const ox = 85, oy = 205; // gốc tọa độ (0,0)

  let svg = '';

  // Vẽ ô đơn vị nguyên thủy C tại gốc và một ô đơn vị lớn A ở góc trên
  const c0 = [ox, oy], c1 = [ox+ax, oy+ay], c2 = [ox+ax+bx, oy+ay+by], c3 = [ox+bx, oy+by];
  svg += `<polygon points="${c0.join(',')} ${c1.join(',')} ${c2.join(',')} ${c3.join(',')}" fill="rgba(18,184,134,0.22)" stroke="var(--c2)" stroke-width="2"/>`;
  svg += `<text x="${ox+36}" y="${oy-18}" style="fill:var(--c2);font-weight:700">Ô đơn vị C</text>`;

  // Ô đơn vị B rộng gấp đôi
  const b0 = [ox+3*ax+bx, oy+by], b1 = [ox+4*ax+bx, oy+by], b2 = [ox+4*ax+3*bx, oy+3*by], b3 = [ox+3*ax+3*bx, oy+3*by];
  svg += `<polygon points="${b0.join(',')} ${b1.join(',')} ${b2.join(',')} ${b3.join(',')}" fill="rgba(112,72,232,0.18)" stroke="var(--c5)" stroke-width="2" stroke-dasharray="5,3"/>`;
  svg += `<text x="${b0[0]+22}" y="${b0[1]-45}" style="fill:var(--c5);font-weight:700">Ô đơn vị B</text>`;

  // Vẽ lưới điểm mạng
  for (let row = 0; row <= 3; row++) {
    for (let col = 0; col <= 5; col++) {
      const x = ox + col*ax + row*bx;
      const y = oy + col*ay + row*by;
      svg += `<circle cx="${x}" cy="${y}" r="6.5" fill="var(--ink)" opacity="0.75"/>`;
    }
  }

  // Vẽ đường đi của vector r = p*a + q*b
  const midX = ox + p*ax, midY = oy + p*ay;
  const endX = midX + q*bx, endY = midY + q*by;

  if (p > 0) {
    svg += `<line x1="${ox}" y1="${oy}" x2="${midX}" y2="${midY}" stroke="var(--c1)" stroke-width="4"/>`;
    svg += `<text x="${(ox+midX)/2 - 15}" y="${oy+24}" style="fill:var(--c1);font-weight:800">${p}a</text>`;
  }
  if (q > 0) {
    svg += `<line x1="${midX}" y1="${midY}" x2="${endX}" y2="${endY}" stroke="var(--c3)" stroke-width="4"/>`;
    svg += `<text x="${(midX+endX)/2 + 12}" y="${(midY+endY)/2 + 5}" style="fill:var(--c3);font-weight:800">${q}b</text>`;
  }
  svg += `<line x1="${ox}" y1="${oy}" x2="${endX}" y2="${endY}" stroke="var(--c4)" stroke-width="3" stroke-dasharray="6,4"/>`;
  svg += `<circle cx="${ox}" cy="${oy}" r="9" fill="var(--c1)" stroke="#fff" stroke-width="2"/>`;
  svg += `<circle cx="${endX}" cy="${endY}" r="10" fill="var(--c4)" stroke="#fff" stroke-width="2.5"/>`;
  svg += `<text x="${endX+14}" y="${endY-8}" style="fill:var(--c4);font-weight:800">Điểm mạng r = ${p}a + ${q}b</text>`;
  svg += `<text x="${ox-28}" y="${oy+22}" style="font-weight:700">Gốc (0,0)</text>`;

  svgEl.innerHTML = svg;
}
window.renderLattice2D = renderLattice2D;

      [[0.25,0.25,0.25],[0,0,0]],[[0.25,0.25,0.25],[0.5,0.5,0]],[[0.25,0.25,0.25],[0.5,0,0.5]],[[0.25,0.25,0.25],[0,0.5,0.5]],
      [[0.75,0.25,0.75],[1,0,1]],[[0.75,0.25,0.75],[0.5,0.5,1]],[[0.75,0.25,0.75],[0.5,0,0.5]],[[0.75,0.25,0.75],[1,0.5,0.5]]
    ]
  }
};

function project3D(x, y, z, rotDeg, tiltDeg, cx = 230, cy = 165, scale = 155) {
  const radY = rotDeg * Math.PI / 180;
  const radX = tiltDeg * Math.PI / 180;
  const xc = x - 0.5, yc = y - 0.5, zc = z - 0.5;
  // Xoay quanh trục đứng Y
  const x1 = xc * Math.cos(radY) + zc * Math.sin(radY);
  const z1 = -xc * Math.sin(radY) + zc * Math.cos(radY);
  // Xoay nghiêng trục X
  const y2 = yc * Math.cos(radX) - z1 * Math.sin(radX);
  const z2 = yc * Math.sin(radX) + z1 * Math.cos(radX);
  return [cx + x1 * scale, cy - y2 * scale, z2];
}

    ];

    });
  }

  edges.forEach(e => {
    const [x1,y1,z1] = project3D(...e[0], rot, tilt);

    svg += `<text x="446" y="186" style="font-size:13.5px">trên đường chéo mặt a√2 = 4r</text>`;

  const px = ox - 0.52 * x * s + 0.92 * y * s;
  const py = oy + 0.36 * x * s - 0.92 * z * s;
  return [px, py];
}

/* =========================================================
   CÁC MÔ HÌNH TƯƠNG TÁC CỦA BUỔI 2 (CƠ HỌC LƯỢNG TỬ PHẦN 1)
   ========================================================= */
function renderPhotoelectric() {
  const svgEl = $('pe-svg'), descEl = $('pe-desc');
  if (!svgEl || !descEl) return;
  const hv = +$('sl-pe-hv').value;
  const inten = +$('sl-pe-int').value;
  $('val-pe-hv').textContent = hv.toFixed(1);
  $('val-pe-int').textContent = inten;

  const phi = 2.3; // Công thoát của Natri (eV)
  const tmax = Math.max(0, hv - phi);
  const emitted = hv >= phi;

  descEl.innerHTML = emitted
    ? `<b>Trạng thái: CÓ QUANG ELECTRON BẬT RA!</b> ($h\\nu = ${hv.toFixed(1)}\\text{ eV} \\ge \\Phi = 2.3\\text{ eV}$)<br>• Động năng cực đại của mỗi electron thoát ra: $\\mathbf{T_{\\max} = h\\nu - \\Phi = ${hv.toFixed(1)} - 2.3 = ${tmax.toFixed(1)}\\text{ eV}}$.<br>• Khi tăng cường độ sáng (${inten} tia photon), số lượng electron bật ra tăng lên (${inten} hạt), nhưng động năng $T_{\\max}$ của mỗi hạt vẫn giữ nguyên!`
    : `<b>Trạng thái: KHÔNG CÓ ELECTRON NÀO THOÁT RA!</b> ($h\\nu = ${hv.toFixed(1)}\\text{ eV} < \\Phi = 2.3\\text{ eV}$)<br>• Năng lượng của từng hạt photon chưa đủ trả "phí công thoát" $\\Phi = 2.3\\text{ eV}$. Dù em tăng cường độ sáng lên ${inten} tia thì vẫn không có hạt electron nào bứt ra được!`;

  let svg = '';
  // Bên trái: Tấm kim loại và các tia photon bắn vào
  svg += `<rect x="45" y="175" width="230" height="45" rx="8" fill="var(--c5)" opacity="0.85"/>`;
  svg += `<text x="160" y="203" text-anchor="middle" style="fill:#fff;font-weight:800">Bề mặt Kim loại Natri (Φ = 2.3 eV)</text>`;

  for (let i = 0; i < inten; i++) {
    const px = 75 + i * 34;
    svg += `<line x1="${px-35}" y1="45" x2="${px}" y2="172" stroke="var(--c3)" stroke-width="3" stroke-dasharray="5,3"/>`;
    svg += `<circle cx="${px}" cy="172" r="4.5" fill="var(--c3)"/>`;
    if (emitted) {
      const ex = px + 28, ey = 155 - tmax * 36;
      svg += `<line x1="${px}" y1="170" x2="${ex}" y2="${ey}" stroke="var(--c2)" stroke-width="2.5"/>`;
      svg += `<circle cx="${ex}" cy="${ey}" r="6.5" fill="var(--c2)" stroke="#fff" stroke-width="1.5"/>`;
    }
  }

  // Bên phải: Đồ thị động năng cực đại T_max theo tần số/năng lượng photon
  const gx = 365, gy = 195, gw = 275, gh = 150;
  svg += `<line x1="${gx}" y1="30" x2="${gx}" y2="235" stroke="var(--ink)" stroke-width="2"/>`;
  svg += `<line x1="${gx}" y1="${gy}" x2="${gx+gw}" y2="${gy}" stroke="var(--ink)" stroke-width="2"/>`;
  svg += `<text x="${gx+gw/2}" y="22" text-anchor="middle" style="font-weight:800;fill:var(--c1)">Đồ thị Millikan: T_max = hν - Φ</text>`;
  svg += `<text x="${gx+gw-5}" y="${gy+20}" text-anchor="end" style="font-size:12px;font-weight:700">hν (eV)</text>`;

  const x0 = gx + (2.3 / 5.2) * gw;
  const xMax = gx + (5.0 / 5.2) * gw;
  const yMax = gy - ((5.0 - 2.3) / 3.0) * gh;
  svg += `<line x1="${gx}" y1="${gy + (2.3/3.0)*gh*0.4}" x2="${x0}" y2="${gy}" stroke="var(--mut)" stroke-width="2" stroke-dasharray="4,4"/>`;
  svg += `<line x1="${x0}" y1="${gy}" x2="${xMax}" y2="${yMax}" stroke="var(--c1)" stroke-width="3.5"/>`;
  svg += `<text x="${x0}" y="${gy+18}" text-anchor="middle" style="font-weight:800;fill:var(--c4)">Φ=2.3eV</text>`;

  const curX = gx + (hv / 5.2) * gw;
  const curY = emitted ? (gy - (tmax / 3.0) * gh) : gy;
  svg += `<circle cx="${curX}" cy="${curY}" r="7.5" fill="${emitted ? 'var(--c2)' : 'var(--c4)'}" stroke="#fff" stroke-width="2"/>`;

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}
window.renderPhotoelectric = renderPhotoelectric;

function renderDuality() {
  const svgEl = $('duality-svg'), descEl = $('duality-desc');

  if (currentDualityTab === 'debroglie') {
    const V = +$('sl-db-v').value;
    $('val-db-v').textContent = V;
    const lamA = 12.27 / Math.sqrt(V); // Bước sóng de Broglie tính theo Angstrom
    descEl.innerHTML = `<b>Gia tốc Electron qua hiệu điện thế $V = ${V}\\text{ V}$:</b><br>• Động năng electron thu được: $E = eV = ${V}\\text{ eV}$.<br>• Bước sóng vật chất de Broglie: $\\mathbf{\\lambda = \\frac{h}{p} = \\frac{h}{\\sqrt{2m_0 eV}} \\approx ${lamA.toFixed(2)}\\text{ Å}}$ (Điện áp $V$ càng lớn, động lượng $p$ càng lớn nên bước sóng $\\lambda$ càng co ngắn lại!).`;

    let path = '';
    const freq = Math.sqrt(V) * 0.45;
    for (let x = 50; x <= 630; x += 3) {
      const y = 125 - 55 * Math.sin((x - 50) * freq * 0.04);
      path += (x === 50 ? 'M' : 'L') + `${x} ${y.toFixed(1)} `;
    }
    svg += `<path d="${path}" fill="none" stroke="var(--c1)" stroke-width="3.5"/>`;
    svg += `<text x="340" y="38" text-anchor="middle" style="font-weight:800;fill:var(--c1)">Sóng vật chất de Broglie của Electron (λ ≈ ${lamA.toFixed(2)} Å)</text>`;
  } else {
    const ang = +$('sl-comp-ang').value;
    $('val-comp-ang').textContent = ang;
    const rad = ang * Math.PI / 180;
    const dLam = 0.02426 * (1 - Math.cos(rad)); // Độ lệch bước sóng Compton (Å)
    descEl.innerHTML = `<b>Hiệu ứng Tán xạ Compton ở góc lệch $\\theta = ${ang}^\\circ$:</b><br>• Photon tia X va chạm đàn hồi với electron đứng yên như hai viên bi-a, truyền bớt năng lượng cho electron.<br>• Bước sóng tia X sau va chạm dài thêm một đoạn: $\\mathbf{\\Delta\\lambda = \\lambda_f - \\lambda_i = \\frac{h}{m_0 c}(1 - \\cos\\theta) \\approx ${dLam.toFixed(4)}\\text{ Å}}$.`;

    const cx = 290, cy = 130;
    svg += `<line x1="70" y1="${cy}" x2="${cx}" y2="${cy}" stroke="var(--c1)" stroke-width="4"/>`;
    svg += `<text x="170" y="${cy-12}" text-anchor="middle" style="font-weight:800;fill:var(--c1)">Tia X tới (λ_i)</text>`;
    const px = cx + 190 * Math.cos(rad), py = cy - 120 * Math.sin(rad);
    svg += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="var(--c4)" stroke-width="4"/>`;
    svg += `<text x="${px+10}" y="${py}" style="font-weight:800;fill:var(--c4)">Tia X tán xạ (λ_f > λ_i)</text>`;
    const ex = cx + 160 * Math.cos(-rad * 0.6), ey = cy - 110 * Math.sin(-rad * 0.6);
    svg += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--c2)" stroke-width="3" stroke-dasharray="5,3"/>`;
    svg += `<circle cx="${ex}" cy="${ey}" r="9" fill="var(--c2)"/>`;
    svg += `<text x="${ex+12}" y="${ey+5}" style="font-weight:800;fill:var(--c2)">Electron bật ra</text>`;
    svg += `<circle cx="${cx}" cy="${cy}" r="11" fill="var(--c3)" stroke="#fff" stroke-width="2"/>`;
  }

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}

function renderUncertainty() {
  const svgEl = $('unc-svg'), descEl = $('unc-desc');
  if (!svgEl || !descEl) return;
  const dx = +$('sl-unc-dx').value;
  $('val-unc-dx').textContent = dx.toFixed(2);
  const dp = 1.054e-34 / (dx * 1e-6);

  descEl.innerHTML = `<b>Nguyên lý Bất định Heisenberg ($\\Delta x \\cdot \\Delta p \\ge \\hbar$):</b><br>• Khi độ bất định vị trí là $\\Delta x = \\mathbf{${dx.toFixed(2)}\\text{ }\\mu\\text{m}} = ${dx.toFixed(2)}\\times 10^{-6}\\text{ m}$:<br>• Độ bất định động lượng tối thiểu là: $\\mathbf{\\Delta p \\ge \\frac{\\hbar}{\\Delta x} \\approx ${dp.toExponential(3)}\\text{ kg}\\cdot\\text{m/s}}$ (Khi $\\Delta x = 1.00\\text{ }\\mu\\text{m}$ trùng khít đáp án <b>Câu 2</b>!).`;

  let svg = '';
  // Bên trái: Bó sóng trong không gian vị trí x (bề rộng tỉ lệ với dx)
  let pathX = '', pathP = '';
  const sigX = dx * 45;
  const sigP = (1 / dx) * 45;
  for (let i = -130; i <= 130; i += 2) {
    const envX = Math.exp(-(i * i) / (2 * sigX * sigX));
    const yX = 125 - envX * Math.cos(i * 0.35) * 75;
    pathX += (i === -130 ? 'M' : 'L') + `${175 + i} ${yX.toFixed(1)} `;

    const envP = Math.exp(-(i * i) / (2 * sigP * sigP));
    const yP = 185 - envP * 125;
    pathP += (i === -130 ? 'M' : 'L') + `${505 + i} ${yP.toFixed(1)} `;
  }
  svg += `<text x="175" y="28" text-anchor="middle" style="font-weight:800;fill:var(--c1)">Bó sóng Không gian Vị trí (Δx)</text>`;
  svg += `<path d="${pathX}" fill="none" stroke="var(--c1)" stroke-width="2.8"/>`;
  svg += `<text x="505" y="28" text-anchor="middle" style="font-weight:800;fill:var(--c4)">Phổ Độ bất định Động lượng (Δp ∝ 1/Δx)</text>`;
  svg += `<path d="${pathP}" fill="rgba(230,73,128,0.18)" stroke="var(--c4)" stroke-width="3"/>`;

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}
window.renderUncertainty = renderUncertainty;

function renderWellBoundary(mode, btn) {
  if (btn) {
    document.querySelectorAll('#well-tabs .sim-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  const svgEl = $('well-svg'), descEl = $('well-desc');
  if (!svgEl || !descEl) return;

  let svg = '';
  const xL = 200, xR = 480, yBot = 205, yTop = 55;
  svg += `<line x1="60" y1="${yBot}" x2="620" y2="${yBot}" stroke="var(--g)" stroke-width="1.5"/>`;
  svg += `<polyline points="80,${yTop} ${xL},${yTop} ${xL},${yBot} ${xR},${yBot} ${xR},${yTop} 600,${yTop}" fill="none" stroke="var(--c1)" stroke-width="3.5"/>`;
  svg += `<text x="${xL}" y="228" text-anchor="middle" style="font-weight:800">x = 0</text>`;
  svg += `<text x="${xR}" y="228" text-anchor="middle" style="font-weight:800">x = a</text>`;

  if (mode === 'finite') {
    descEl.innerHTML = `<b>1. Giếng thế Hữu hạn ($V(x) = V_0$ hữu hạn ở hai vách):</b><br>Vì thế năng hữu hạn ở mọi nơi, cả <b>hàm sóng $\\psi(x)$ lẫn đạo hàm $\\frac{d\\psi}{dx}$ đều liên tục</b> tại $x=0$ và $x=a$. Đuôi hàm sóng thấm nhẹ vào vùng vách hai bên theo hàm mũ suy giảm.`;
    let d = '';
    for (let x = 90; x <= 590; x += 4) {
      let val = 0;
      if (x < xL) val = 0.35 * Math.exp((x - xL) / 32);
      else if (x <= xR) val = 0.35 + 0.65 * Math.sin(Math.PI * (x - xL) / (xR - xL));
      else val = 0.35 * Math.exp(-(x - xR) / 32);

      b: [0.25, 0.50, '23.86%', 'P = e^{-0.5} - e^{-1} \\approx 0.2386'],
      c: [0, 1.00, '86.47%', 'P = 1 - e^{-2} \\approx 0.8647']

    const [u1, u2, pctStr, mathStr] = ranges[rangeKey];

    let curve = '', area = `M ${ox + (u1/2)*gw} ${oy} `;
    for (let i = 0; i <= 200; i++) {
      const u = (i / 200) * 2.0; // x/a0 từ 0 đến 2.0
      const px = ox + (u / 2.0) * gw;
      const py = oy - Math.exp(-2 * u) * gh;
      curve += (i === 0 ? 'M' : 'L') + `${px.toFixed(1)} ${py.toFixed(1)} `;
      if (u >= u1 && u <= u2) area += `L ${px.toFixed(1)} ${py.toFixed(1)} `;
    }
    area += `L ${ox + (u2/2)*gw} ${oy} Z`;
    svg += `<path d="${area}" fill="rgba(18,184,134,0.35)"/>`;
    svg += `<path d="${curve}" fill="none" stroke="var(--c2)" stroke-width="3.5"/>`;

      const px = ox + (u / 2.0) * gw;

    let area = `M ${ox} ${oy} `;

    svg += `<text x="${ox+gw/2}" y="${oy+20}" text-anchor="middle" style="font-weight:700">x = 0</text>`;

function setFreePreset(preset, btn) {

function renderFreeWave() {
  const svgEl = $('free-svg'), descEl = $('free-desc');
  if (!svgEl || !descEl) return;
  let k8 = +$('sl-free-k').value;
  if (Math.abs(k8) < 0.5) k8 = 0.5;
  const wt = +$('sl-free-t').value;
  $('val-free-k').textContent = k8.toFixed(1);

  const k = k8 * 1e8;
  const lamA = (2 * Math.PI / Math.abs(k)) * 1e10;
  const p = 1.054e-34 * k;
  const E_eV = (p * p) / (2 * 9.11e-31 * 1.6e-19);
  const dirText = k > 0 ? 'Chiều dương trục x (+x, sang phải)' : 'Chiều âm trục x (-x, sang trái)';

  descEl.innerHTML = `<b>Thông số sóng phẳng với $k = ${k8.toFixed(1)} \\times 10^8\\text{ m}^{-1}$:</b><br>• Hướng truyền sóng: <b>${dirText}</b> | Bước sóng: $\\mathbf{\\lambda = \\frac{2\\pi}{|k|} \\approx ${lamA.toFixed(2)}\\text{ Å}}$.<br>• Động lượng: $\\mathbf{p = \\hbar k \\approx ${p.toExponential(3)}\\text{ kg}\\cdot\\text{m/s}}$ | Động năng: $\\mathbf{E = \\frac{p^2}{2m_0} \\approx ${(E_eV*1000).toFixed(1)}\\text{ meV}}$.`;

  let svg = '';
  let dRe = '', dIm = '';
  for (let x = 40; x <= 640; x += 3) {
    const phase = (x - 340) * (k8 * 0.012) - wt;
    const yRe = 115 - 65 * Math.cos(phase);
    const yIm = 115 - 65 * Math.sin(phase);
    dRe += (x === 40 ? 'M' : 'L') + `${x} ${yRe.toFixed(1)} `;
    dIm += (x === 40 ? 'M' : 'L') + `${x} ${yIm.toFixed(1)} `;
  }
  svg += `<line x1="30" y1="115" x2="650" y2="115" stroke="var(--g)" stroke-width="1.5"/>`;
  svg += `<path d="${dIm}" fill="none" stroke="var(--c5)" stroke-width="2" stroke-dasharray="4,4"/>`;
  svg += `<path d="${dRe}" fill="none" stroke="var(--c1)" stroke-width="3.5"/>`;
  svg += `<text x="340" y="28" text-anchor="middle" style="font-weight:800;fill:var(--c1)">Phần thực Re[Ψ(x,t)] = A·cos(kx - ωt) (${dirText})</text>`;

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}

function renderInfiniteWell() {
  const svgEl = $('infwell-svg'), descEl = $('infwell-desc');

  const a_m = aA * 1e-10;
  const E1_J = (Math.PI * Math.PI * Math.pow(1.054e-34, 2)) / (2 * 9.11e-31 * a_m * a_m);
  const E1_eV = E1_J / 1.6e-19;
  const En_eV = n * n * E1_eV;

  descEl.innerHTML = `<b>Giếng thế vô hạn bề rộng $a = ${aA}\\text{ Å}$ ở mức lượng tử $n = ${n}$:</b><br>• Mức cơ bản ($n=1$): $E_1 \\approx \\mathbf{${(E1_eV*1000).toFixed(2)}\\text{ meV}}$ ($${E1_eV.toExponential(3)}\\text{ eV}$).<br>• Mức đang chọn ($n=${n}$): $\\mathbf{E_${n} = ${n}^2 E_1 \\approx ${(En_eV*1000).toFixed(2)}\\text{ meV}}$ ($${En_eV.toExponential(3)}\\text{ eV}$) — Có đúng <b>${n} bụng sóng</b> xác suất!`;

  let svg = '';

  svg += `<line x1="${x1}" y1="35" x2="${x1}" y2="${yBot}" stroke="var(--ink)" stroke-width="3"/>`;
  svg += `<line x1="${x2}" y1="35" x2="${x2}" y2="${yBot}" stroke="var(--ink)" stroke-width="3"/>`;
  svg += `<line x1="${x1}" y1="${yBot}" x2="${x2}" y2="${yBot}" stroke="var(--ink)" stroke-width="2"/>`;

    svg += `<text x="${x1-8}" y="${yLv+4}" text-anchor="end" style="font-size:11.5px;font-weight:700">n=${lv}</text>`;
  }

  const yBase = yBot - (n * n / 16) * 165;
  let dPsi = '', dProb = `M ${x3} ${yBot} `;
  for (let i = 0; i <= 120; i++) {
    const u = i / 120;
    const sVal = Math.sin(n * Math.PI * u);
    const px1 = x1 + u * (x2 - x1);
    const py1 = yBase - sVal * 32;
    dPsi += (i === 0 ? 'M' : 'L') + `${px1.toFixed(1)} ${py1.toFixed(1)} `;

    const px2 = x3 + u * (x4 - x3);
    const py2 = yBot - (sVal * sVal) * 160;
    dProb += `L ${px2.toFixed(1)} ${py2.toFixed(1)} `;
  }
  dProb += `L ${x4} ${yBot} Z`;
  svg += `<path d="${dPsi}" fill="none" stroke="var(--c1)" stroke-width="3.2"/>`;

  svg += `<line x1="${x3}" y1="35" x2="${x3}" y2="${yBot}" stroke="var(--ink)" stroke-width="3"/>`;
  svg += `<line x1="${x4}" y1="35" x2="${x4}" y2="${yBot}" stroke="var(--ink)" stroke-width="3"/>`;
  svg += `<path d="${dProb}" fill="rgba(18,184,134,0.32)" stroke="var(--c2)" stroke-width="3"/>`;
  svg += `<text x="${(x3+x4)/2}" y="25" text-anchor="middle" style="font-weight:800;fill:var(--c2)">Mật độ xác suất |ψ_${n}(x)|² (${n} đỉnh)</text>`;

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}

function renderStepPotential() {
  const svgEl = $('step-svg'), descEl = $('step-desc');
  if (!svgEl || !descEl) return;
  const xA = +$('sl-step-x').value;
  const V0 = +$('sl-step-v0').value;
  $('val-step-x').textContent = xA;
  $('val-step-v0').textContent = V0.toFixed(1);

  const E = 2.8;
  const k2 = Math.sqrt(2 * 9.11e-31 * (V0 - E) * 1.6e-19) / 1.054e-34;
  const relProb = Math.exp(-2 * k2 * (xA * 1e-10));

  descEl.innerHTML = `<b>Đâm xuyên hàm mũ vào Bậc thế năng ($E = 2.8\\text{ eV} < V_0 = ${V0.toFixed(1)}\\text{ eV}$):</b><br>• Hệ số suy giảm trong vùng biên: $\\mathbf{k_2 = \\frac{\\sqrt{2m_0(V_0-E)}}{\\hbar} \\approx ${k2.toExponential(3)}\\text{ m}^{-1}}$.<br>• Tại độ sâu $x = \\mathbf{${xA}\\text{ Å}}$, tỷ số mật độ xác suất so với tại mép biên ($x=0$) là: $\\mathbf{\\frac{|\\psi_2(${xA}\\text{ Å})|^2}{|\\psi_2(0)|^2} = e^{-2k_2 x} \\approx ${relProb.toExponential(3)}}$.`;

  let svg = '';
  const xStep = 280, yBot = 210, yTop = 55;
  svg += `<line x1="50" y1="${yBot}" x2="630" y2="${yBot}" stroke="var(--ink)" stroke-width="2"/>`;
  svg += `<polyline points="50,${yBot} ${xStep},${yBot} ${xStep},${yTop} 630,${yTop}" fill="rgba(245,159,0,0.12)" stroke="var(--c3)" stroke-width="3.5"/>`;
  svg += `<text x="${xStep}" y="232" text-anchor="middle" style="font-weight:800">Mép biên x = 0</text>`;

  // Sóng dừng ở vùng I (x < 0) và hàm mũ suy giảm ở vùng II (x >= 0)
  let dWave = '';
  for (let x = 50; x <= xStep; x += 3) {
    const y = 135 - 55 * Math.cos((x - xStep) * 0.14);
    dWave += (x === 50 ? 'M' : 'L') + `${x} ${y.toFixed(1)} `;
  }
  for (let x = xStep; x <= 620; x += 3) {
    const uA = (x - xStep) / 7.0; // mỗi 7px = 1 Angstrom
    const y = 190 - 110 * Math.exp(-uA * 0.12);
    dWave += `L ${x} ${y.toFixed(1)} `;
  }
  svg += `<path d="${dWave}" fill="none" stroke="var(--c1)" stroke-width="3.2"/>`;

  const px = xStep + xA * 7.0;
  const py = 190 - 110 * Math.exp(-xA * 0.12);
  svg += `<line x1="${px}" y1="${yTop}" x2="${px}" y2="${yBot}" stroke="var(--c4)" stroke-width="2" stroke-dasharray="4,3"/>`;
  svg += `<circle cx="${px}" cy="${py}" r="7" fill="var(--c4)" stroke="#fff" stroke-width="2"/>`;
  svg += `<text x="${px}" y="${yTop-10}" text-anchor="middle" style="font-weight:800;fill:var(--c4)">x = ${xA} Å</text>`;

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}

function renderAtomSim(mode, btn) {
  if (btn) {
    document.querySelectorAll('#atom-tabs .sim-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  const svgEl = $('atom-svg'), descEl = $('atom-desc');
  if (!svgEl || !descEl) return;
  let svg = '';
  const ox = 85, oy = 205, gw = 520, gh = 155;

  if (mode === '1s' || mode === '2s') {
    svg += `<line x1="${ox}" y1="30" x2="${ox}" y2="${oy}" stroke="var(--ink)" stroke-width="2"/>`;
    svg += `<line x1="${ox}" y1="${oy}" x2="${ox+gw}" y2="${oy}" stroke="var(--ink)" stroke-width="2"/>`;
    let d = `M ${ox} ${oy} `;
    for (let i = 0; i <= 240; i++) {
      const u = (i / 240) * 10; // r/a0 từ 0 đến 10
      const pVal = mode === '1s'
        ? 4 * u * u * Math.exp(-2 * u) / 0.541
        : 0.5 * u * u * Math.pow(1 - 0.5 * u, 2) * Math.exp(-u) / 0.191;
      const px = ox + (u / 10) * gw;

      : `<b>Trạng thái kích thích $2s$ ($n=2, l=0, m=0$):</b> Có một đỉnh phụ nhỏ ở gần hạt nhân và đỉnh chính nằm xa hơn tại $r \\approx 5.2\\,a_0$, ứng với mức năng lượng $E_2 = -\\frac{13.58}{2^2} = -3.395\\text{ eV}$.`;

function renderKronigPenney() {
  const svgEl = $('kp-svg'), descEl = $('kp-desc');
  if (!svgEl || !descEl) return;
  const P = +$('sl-kp-p').value;
  $('val-kp-p').textContent = P;

  const ox = 55, oy = 175, gw = 585, maxU = 4 * Math.PI;
  const scaleY = 38; // 1 đơn vị = 38px

  let svg = '';
  const yPlus1 = oy - scaleY, yMinus1 = oy + scaleY;
  svg += `<rect x="${ox}" y="${yPlus1}" width="${gw}" height="${2*scaleY}" fill="rgba(18,184,134,0.08)"/>`;
  svg += `<line x1="${ox}" y1="${yPlus1}" x2="${ox+gw}" y2="${yPlus1}" stroke="var(--c2)" stroke-width="1.8" stroke-dasharray="5,4"/>`;
  svg += `<line x1="${ox}" y1="${yMinus1}" x2="${ox+gw}" y2="${yMinus1}" stroke="var(--c2)" stroke-width="1.8" stroke-dasharray="5,4"/>`;
  svg += `<line x1="${ox}" y1="20" x2="${ox}" y2="275" stroke="var(--ink)" stroke-width="2"/>`;
  svg += `<line x1="${ox}" y1="${oy}" x2="${ox+gw}" y2="${oy}" stroke="var(--ink)" stroke-width="2"/>`;
  svg += `<text x="${ox-8}" y="${yPlus1+4}" text-anchor="end" style="font-weight:800;fill:var(--c2)">+1</text>`;
  svg += `<text x="${ox-8}" y="${yMinus1+4}" text-anchor="end" style="font-weight:800;fill:var(--c2)">-1</text>`;

  let path = '';
  for (let i = 1; i <= 360; i++) {
    const u = (i / 360) * maxU;
    const fVal = P * (Math.sin(u) / u) + Math.cos(u);
    const px = ox + (u / maxU) * gw;
    const py = Math.max(18, Math.min(275, oy - fVal * scaleY));
    path += (i === 1 ? 'M' : 'L') + `${px.toFixed(1)} ${py.toFixed(1)} `;
    if (Math.abs(fVal) <= 1.0) {
      svg += `<line x1="${px.toFixed(1)}" y1="${yPlus1}" x2="${px.toFixed(1)}" y2="${yMinus1}" stroke="rgba(47,111,237,0.22)" stroke-width="2.5"/>`;
    }
  }
  svg += `<path d="${path}" fill="none" stroke="var(--c1)" stroke-width="3"/>`;

  [1, 2, 3, 4].forEach(m => {
    const px = ox + (m / 4) * gw;
    svg += `<line x1="${px}" y1="${oy-5}" x2="${px}" y2="${oy+5}" stroke="var(--ink)" stroke-width="2"/>`;
    svg += `<text x="${px}" y="${oy+22}" text-anchor="middle" style="font-weight:800">${m}π</text>`;
  });

  descEl.innerHTML = `<b>Đồ thị hàm Kronig-Penney $f(\\alpha a) = ${P}\\frac{\\sin(\\alpha a)}{\\alpha a} + \\cos(\\alpha a)$:</b><br>• Các dải cột tô màu xanh dương là vùng thỏa mãn $\\mathbf{-1 \\le f(\\alpha a) \\le +1}$ $\\implies$ Tạo thành <b>Dải năng lượng cho phép (Allowed Bands)</b>.<br>• Khi $P' = 12$ (đúng đề bài <b>Câu 1 & Câu 2</b>): Dải 1 từ $2.628 \\to \\pi$; Dải 2 từ $5.307 \\to 2\\pi$; Dải 3 từ $8.067 \\to 3\\pi$; Dải 4 từ $10.909 \\to 4\\pi$.`;

  svgEl.innerHTML = svg;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([descEl]);
}
