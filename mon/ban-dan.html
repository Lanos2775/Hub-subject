--mut);stroke-width:1.5" marker-end="url(#fa)"/><text x="60" y="185" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">a</text><text x="300" y="170" text-anchor="middle" style="fill:var(--c1);font-size:12px;font-weight:400">bán kính quỹ đạo ≫ a</text></svg><figcaption>Electron donor quay quanh ion P⁺ xa hơn nhiều so với khoảng cách giữa các nguyên tử.</figcaption></figure>

    <p>Tại sao electron thứ 5 của Phosphorus chỉ cần năng lượng khoảng $0.0258\text{ eV} - 0.045\text{ eV}$ là bứt ra được, trong khi nguyên tử Hydro cần tới $13.6\text{ eV}$? Bởi vì electron thứ 5 này chuyển động <b>bên trong môi trường tinh thể bán dẫn</b> có hằng số điện môi tương đối lớn ($\epsilon_r = 11.7$ với $\text{Si}$ làm suy yếu lực hút Coulomb đi $11.7$ lần!) và mang <b>khối lượng hiệu dụng dẫn $m^*$ rất nhỏ</b> ($m^*/m_0 \approx 0.26$ trong $\text{Si}$).</p>
    <p>Áp dụng mô hình nguyên tử Bohr (cân bằng lực hướng tâm $\frac{e^2}{4\pi\epsilon r_n^2} = \frac{m^*v^2}{r_n}$ và lượng tử hóa moment động lượng $m^* r_n v = n\hbar$), ta rút ra hai công thức cực kỳ quan trọng (giải trực tiếp <b>Câu 4 Bài tập</b>):</p>

    <div class="f">
      $$\text{1. Bán kính quỹ đạo thứ } n: \quad \mathbf{\frac{r_n}{a_0} = n^2 \epsilon_r \left(\frac{m_0}{m^*}\right)} \implies \mathbf{r_1 = a_0 \cdot \epsilon_r \left(\frac{m_0}{m^*}\right)} \quad (\text{với } a_0 = 0.529\text{ Å})$$
      $$\text{2. Năng lượng liên kết / Ion hóa: } \quad \mathbf{E_i = |E_1| = \frac{m^* e^4}{2(4\pi\epsilon_0 \epsilon_r)^2 \hbar^2} = 13.58\text{ [eV]} \times \left(\frac{m^*}{m_0}\right)\frac{1}{\epsilon_r^2}}$$
    </div>
    <div class="box legend"><b>Đọc công thức Bohr mở rộng</b><ul><li>$a_0=0.529\text{ Å}$: bán kính Bohr của hydro.</li><li>$\epsilon_r$: hằng số điện môi của bán dẫn. $\epsilon_r$ lớn làm yếu lực hút giữa electron và ion tạp chất.</li><li>$m_0/m^*$: $m^*$ nhỏ hơn $m_0$ thì quỹ đạo lớn hơn.</li><li>Kết quả: $r_1$ cỡ vài chục Å (lớn hơn hằng số mạng) và $E_i$ chỉ vài chục meV, nhỏ hơn $E_g$ rất nhiều.</li></ul></div>

    <p>Thay thông số của Silicon ($\epsilon_r = 11.7$ và $\frac{m_0}{m^*} = \frac{1}{0.26} \approx 3.846$ ở $n=1$):
      $$\frac{r_1}{a_0} = 1^2 \times 11.7 \times \frac{1}{0.26} = \mathbf{45} \implies r_1 = 45 \times 0.529\text{ Å} \approx \mathbf{23.8\text{ Å}} \quad (\text{rộng gấp } \approx 4.4 \text{ lần hằng số mạng Silicon!})$$
      $$E_i = 13.58\text{ eV} \times \frac{0.26}{(11.7)^2} \approx \mathbf{0.0258\text{ eV} = 25.8\text{ meV}} \ll E_g\ (1.12\text{ eV})$$
    </p>

    <h3>3.2. Quy tắc Pha tạp trong Bán dẫn Hợp chất Nhóm III-V (như GaAs)</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Trong bán dẫn hợp chất, tạp chất có thể thay vào nút của nguyên tố nào, nên kết quả donor hay acceptor phụ thuộc cả vào nút bị thay.</li><li><b>Dùng để làm gì:</b> Dùng quy tắc: nhiều electron hóa trị hơn nút cũ thì donor, ít hơn thì acceptor.</li></ul></div>

    <figure class="fig fr"><svg viewBox="0 0 420 186" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><text x="100" y="20" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:700">Nút bị thay</text><text x="235" y="20" text-anchor="middle" style="fill:var(--c2);font-size:12px;font-weight:700">Donor</text><text x="350" y="20" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">Acceptor</text><rect x="15" y="32" width="170" height="44" rx="8" style="fill:var(--tint);stroke:var(--g);stroke-width:2;fill-opacity:1"/><text x="100" y="59" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400">thay Ga (3 e)</text><rect x="190" y="32" width="110" height="44" rx="8" style="fill:var(--tint);stroke:var(--c2);stroke-width:2.5;fill-opacity:1"/><text x="245" y="59" text-anchor="middle" style="fill:var(--c2);font-size:13px;font-weight:700">Nhóm IV, VI</text><rect x="305" y="32" width="105" height="44" rx="8" style="fill:var(--tint);stroke:var(--c4);stroke-width:2.5;fill-opacity:1"/><text x="357" y="59" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">Nhóm II</text><rect x="15" y="92" width="170" height="44" rx="8" style="fill:var(--tint);stroke:var(--g);stroke-width:2;fill-opacity:1"/><text x="100" y="119" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400">thay As (5 e)</text><rect x="190" y="92" width="110" height="44" rx="8" style="fill:var(--tint);stroke:var(--c2);stroke-width:2.5;fill-opacity:1"/><text x="245" y="119" text-anchor="middle" style="fill:var(--c2);font-size:13px;font-weight:700">Nhóm VI</text><rect x="305" y="92" width="105" height="44" rx="8" style="fill:var(--tint);stroke:var(--c4);stroke-width:2.5;fill-opacity:1"/><text x="357" y="119" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">Nhóm II, IV</text><text x="210" y="170" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">Nhiều electron hóa trị hơn nút cũ → donor; ít hơn → acceptor</text></svg><figcaption>Quy tắc pha tạp bán dẫn hợp chất III-V.</figcaption></figure>

    <p>Đối với bán dẫn hợp chất tạo bởi Nhóm III ($\text{Ga}$) và Nhóm V ($\text{As}$):</p>
    <ul>
      <li><span class="k b4">Nguyên tố Nhóm II ($\text{Be}, \text{Zn}, \text{Cd}$)</span> Khi đi vào mạng tinh thể sẽ thế chỗ cho nguyên tử Nhóm III ($\text{Ga}$). Vì Nhóm II có ít hơn Nhóm III 1 electron hóa trị, nó đóng vai trò là <b>Tạp chất nhận (Acceptor - tạo bán dẫn loại P)</b>.</li>
      <li><span class="k b1">Nguyên tố Nhóm VI ($\text{Se}, \text{Te}$)</span> Khi đi vào mạng sẽ thế chỗ cho nguyên tử Nhóm V ($\text{As}$). Vì Nhóm VI có nhiều hơn Nhóm V 1 electron hóa trị, nó đóng vai trò là <b>Tạp chất cho (Donor - tạo bán dẫn loại N)</b>.</li>
      <li><span class="k b3">Tạp chất lưỡng tính Nhóm IV ($\text{Si}, \text{Ge}$ trong $\text{GaAs}$)</span> Tùy thuộc vào việc nó thế chỗ cho $\text{Ga}$ hay $\text{As}$! Thực nghiệm trong $\text{GaAs}$ cho thấy: <b>$\text{Si}$ chủ yếu thế chỗ $\text{Ga}$ (Nhóm III) nên đóng vai trò là Donor</b>; còn <b>$\text{Ge}$ chủ yếu thế chỗ $\text{As}$ (Nhóm V) nên đóng vai trò là Acceptor</b>.</li>
    </ul>

    <h2>4. Cẩm Nang Công Thức Trọng Tâm Buổi 5 (Giải Nghĩa Chi Tiết)</h2>
    <div class="bridge"><b>Nối từ Mục 1–3:</b> Bảng chọn công thức.</div>

    <div class="tw"><table><tr><th>Đề bài hỏi gì?</th><th>Công thức</th></tr><tr><td>$n_0$, $p_0$ khi biết vị trí $E_F$</td><td>Công thức 1</td></tr><tr><td>$n_i$ theo nhiệt độ, tích $n_0p_0$</td><td>Công thức 2</td></tr><tr><td>Vị trí $E_{Fi}$ so với giữa vùng cấm</td><td>Công thức 3</td></tr><tr><td>Bán kính Bohr hiệu dụng, năng lượng ion hóa tạp chất, điện trở suất nội tại</td><td>Công thức 4</td></tr></table></div>


    <div class="formula-card">
      <h3>Công thức 1: Nồng độ Electron ($n_0$) và Lỗ trống ($p_0$) ở Trạng thái Cân bằng Nhiệt</h3>
      <div class="f key">
        $$n_0 = N_c \exp\left[-\frac{E_c - E_F}{kT}\right] \qquad \text{và} \qquad p_0 = N_v \exp\left[-\frac{E_F - E_v}{kT}\right]$$
        $$\text{với } N_c = 2\left(\frac{2\pi m_n^* kT}{h^2}\right)^{3/2}, \qquad N_v = 2\left(\frac{2\pi m_p^* kT}{h^2}\right)^{3/2}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $n_0, p_0$: Nồng độ electron trong dải dẫn và lỗ trống trong dải hóa trị ở cân bằng nhiệt ($\text{cm}^{-3}$).<br>
          • $N_c, N_v$: Mật độ trạng thái hiệu dụng của dải dẫn và dải hóa trị ($\text{cm}^{-3}$). Lưu ý: Nếu tính từ công thức chuẩn SI sẽ ra đơn vị $\text{m}^{-3}$, phải <b>nhân với $10^{-6}$ (tức chia cho $10^6$)</b> để đổi sang $\text{cm}^{-3}$!<br>
          • $E_c - E_F$: Khoảng cách năng lượng từ mức Fermi lên đáy dải dẫn ($\text{eV}$).<br>
          • $E_F - E_v$: Khoảng cách năng lượng từ đỉnh dải hóa trị lên mức Fermi ($\text{eV}$).<br>
          • $kT$: Năng lượng nhiệt ($0.0259\text{ eV}$ tại $T = 300\text{ K}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Thu được từ tích phân $\int g(E)f_F(E)dE$ khi áp dụng xấp xỉ Boltzmann ($E_c - E_F \ge 3kT$).<br>
          • <b>Khi nào dùng:</b> Khi đề bài cho biết vị trí mức Fermi $E_F$ cách $E_c$ hoặc $E_v$ bao nhiêu $\text{eV}$ và yêu cầu tính nồng độ hạt dẫn $n_0$ hoặc $p_0$ (như <b>Câu 1</b>), hoặc ngược lại cho $n_0, p_0$ bắt tìm vị trí mức Fermi $E_F$.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 2: Nồng độ Hạt dẫn Nội tại ($n_i$) & Định luật Tác dụng Khối lượng</h3>
      <div class="f key">
        $$n_i^2 = n_0 \cdot p_0 = N_c N_v \exp\left[-\frac{E_g}{kT}\right] \implies \mathbf{n_i = \sqrt{N_c N_v}\,\exp\left[-\frac{E_g}{2kT}\right]}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $n_i$: Nồng độ hạt dẫn nội tại ($\text{cm}^{-3}$). Trong bán dẫn tinh khiết: $n_0 = p_0 = n_i$.<br>
          • $E_g = E_c - E_v$: Độ rộng vùng cấm của chất bán dẫn ($\text{eV}$).<br>
          • Chú ý: Ở công thức của $n_i$ (đã lấy căn bậc hai), dưới mẫu số của hàm mũ có <b>số 2</b>: $\exp\left(-\frac{E_g}{2kT}\right)$!
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Tích số $n_0 \cdot p_0 = n_i^2$ luôn không đổi ở một nhiệt độ $T$ nhất định (không phụ thuộc vào $E_F$).<br>
          • <b>Khi nào dùng:</b> Tính nồng độ hạt dẫn nội tại $n_i$ ở các nhiệt độ khác nhau (như <b>Câu 2</b> và <b>Câu 5</b>). Nhớ quy đổi $N_c N_v$ theo nhiệt độ: $N_c(T)N_v(T) = N_c(300)N_v(300)\left(\frac{T}{300}\right)^3$.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 3: Vị trí Mức năng lượng Fermi Nội tại ($E_{Fi}$)</h3>
      <div class="f key">
        $$E_{Fi} - E_{\text{midgap}} = \frac{1}{2}kT \ln\left(\frac{N_v}{N_c}\right) = \frac{3}{4}kT \ln\left(\frac{m_p^*}{m_n^*}\right) \qquad \left(\text{với } E_{\text{midgap}} = \frac{E_c + E_v}{2}\right)$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $E_{Fi}$: Mức năng lượng Fermi của bán dẫn nội tại ($\text{eV}$).<br>
          • $E_{\text{midgap}}$: Mức năng lượng nằm chính giữa vùng cấm (cách $E_c$ và $E_v$ một đoạn $E_g/2$).<br>
          • $m_p^*/m_n^*$: Tỷ số khối lượng hiệu dụng mật độ trạng thái của lỗ trống và electron.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Thiết lập từ điều kiện cân bằng số hạt nội tại $n_0 = p_0$. Nếu $m_p^* < m_n^*$ thì $E_{Fi}$ nằm thấp hơn giữa vùng cấm; nếu $m_p^* > m_n^*$ (như trong $\text{GaAs}$) thì $E_{Fi}$ nằm cao hơn giữa vùng cấm.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 3</b> khi đề bài yêu cầu xác định vị trí mức Fermi nội tại so với tâm vùng cấm.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 4: Bán kính Bohr ($r_1$), Năng lượng Ion hóa Tạp chất ($E_i$) & Điện trở suất Nội tại ($\rho_i$)</h3>
      <div class="f key">
        $$r_1 = a_0\,\epsilon_r\left(\frac{m_0}{m^*}\right) \quad \Big| \quad E_i = 13.58\text{ [eV]}\left(\frac{m^*}{m_0}\right)\frac{1}{\epsilon_r^2} \quad \Big| \quad \sigma_i = e\,n_i(\mu_n + \mu_p), \quad \rho_i = \frac{1}{\sigma_i}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $a_0 = 0.529\text{ Å}$: Bán kính Bohr của nguyên tử Hydro.<br>
          • $\epsilon_r$: Hằng số điện môi tương đối của bán dẫn ($\text{Si}: 11.7$; $\text{GaAs}: 13.1$).<br>
          • $E_i$: Năng lượng ion hóa của nguyên tử tạp chất Donor/Acceptor ($\text{eV}$ hoặc $\text{meV}$).<br>
          • $\mu_n, \mu_p$: Độ linh động trôi (drift mobility) của electron và lỗ trống ($\text{cm}^2\text{V}^{-1}\text{s}^{-1}$).<br>
          • $\sigma_i$: Độ dẫn điện nội tại ($\Omega^{-1}\text{cm}^{-1}$); $\rho_i$: Điện trở suất nội tại ($\Omega\cdot\text{cm}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Mở rộng mô hình nguyên tử Hydro của Bohr vào môi trường chất rắn có điện môi $\epsilon_r$ và khối lượng hiệu dụng $m^*$, kết hợp công thức dòng điện trôi tổng cộng của cả electron và lỗ trống.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 4</b> (tính bán kính quỹ đạo và năng lượng ion hóa tạp chất) và <b>Câu 5</b> (bài tập cuối slide tính $N_c, N_v, n_i, \sigma_i, \rho_i$).
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>5. Bài Tập Trọng Tâm Buổi 5 (Có Gợi Ý & Giải Chi Tiết Từng Bước)</h2>
    <div class="bridge"><b>Nối từ Mục 4:</b> Mỗi câu luyện một công thức.</div>

    <div class="tw"><table><tr><th>Câu</th><th>Luyện</th><th>Công thức</th></tr><tr><td>1</td><td>Xác suất chiếm, $n_0$ và $p_0$ theo $E_F$</td><td>1</td></tr><tr><td>2</td><td>$n_i$ thay đổi theo nhiệt độ</td><td>2</td></tr><tr><td>3</td><td>Vị trí $E_{Fi}$</td><td>3</td></tr><tr><td>4</td><td>Bán kính Bohr và năng lượng ion hóa donor</td><td>4</td></tr><tr><td>5</td><td>$N_c$, $N_v$, $n_i$ và điện trở suất nội tại của Si</td><td>1, 2, 4</td></tr></table></div>

    <div class="box key"><b>Mẹo chung Buổi 5</b><ul><li>Kiểm tra nhanh: $kT\approx0.0259\text{ eV}$ ở $300\text{ K}$.</li><li>Trong hàm mũ, sai số nhỏ của năng lượng dẫn tới sai số rất lớn của kết quả, nên giữ đủ chữ số.</li></ul></div>

    <p>Dưới đây là 5 bài tập cốt lõi bao quát toàn bộ nội dung tính toán của Buổi 5 (từ các bài toán chuẩn trong bài giảng đến bài tập tổng hợp cuối slide). Em hãy bấm vào <b>Xem Gợi ý</b> để tự nháp trước, sau đó mở <b>Xem Lời giải chi tiết</b> kèm giải thích màu xám ở từng bước nhé!</p>

    <!-- CÂU 1 BUỔI 5 -->
    <div class="formula-card">
      <h3 id="b5-cau1">Câu 1: Tính Xác Suất Chiếm Giữ và Nồng Độ Hạt Dẫn Cân Bằng $n_0, p_0$ Theo Mức Fermi</h3>
      <p><b>Đề bài:</b> Khảo sát chất bán dẫn Silicon ở trạng thái cân bằng nhiệt:<br>
      (a) Giả sử ở nhiệt độ phòng $T = 300\text{ K}$, mức năng lượng Fermi nằm thấp hơn đáy dải dẫn $E_c$ một khoảng là $0.25\text{ eV}$ (tức $E_c - E_F = 0.25\text{ eV}$). Biết $N_c(300\text{ K}) = 2.8 \times 10^{19}\text{ cm}^{-3}$. Hãy tính xác suất để một trạng thái lượng tử tại mức năng lượng $E = E_c + \frac{kT}{2}$ có electron chiếm giữ, và tính nồng độ electron cân bằng $n_0$.<br>
      (b) Giả sử một mẫu Silicon khác ở nhiệt độ $T = 400\text{ K}$ có mức năng lượng Fermi nằm cao hơn đỉnh dải hóa trị $E_v$ một khoảng là $0.27\text{ eV}$ (tức $E_F - E_v = 0.27\text{ eV}$). Biết ở $300\text{ K}$ thì $N_v(300\text{ K}) = 1.04 \times 10^{19}\text{ cm}^{-3}$. Hãy tính nồng độ lỗ trống cân bằng $p_0$ ở $T = 400\text{ K}$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b5-hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b5-sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b5-hint1" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý (a):</b> Tại $T = 300\text{ K}$, năng lượng nhiệt là $kT = 0.0259\text{ eV}$. Khoảng cách từ $E_F$ đến mức cần tính xác suất là $E - E_F = (E_c - E_F) + \frac{kT}{2} = 0.25 + \frac{0.0259}{2}\text{ eV} \gg 3kT$. Do đó em áp dụng công thức xấp xỉ Boltzmann $f_F(E) \approx \exp\left(-\frac{E - E_F}{kT}\right)$ và công thức nồng độ electron $n_0 = N_c \exp\left(-\frac{E_c - E_F}{kT}\right)$.</li>
          <li><b>Ý (b):</b> Vì nhiệt độ đã tăng lên $T = 400\text{ K}$ (khác $300\text{ K}$!), trước tiên em bắt buộc phải cập nhật lại hai đại lượng phụ thuộc nhiệt độ là:
            $$N_v(400\text{ K}) = N_v(300\text{ K}) \times \left(\frac{400}{300}\right)^{3/2} \qquad \text{và} \qquad kT(400\text{ K}) = 0.0259 \times \left(\frac{400}{300}\right)\text{ eV}$$
            Sau đó thay vào công thức $p_0 = N_v(400\text{ K}) \exp\left(-\frac{E_F - E_v}{kT(400\text{ K})}\right)$.</li>
        </ul>
      </div>

      <div id="b5-sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Tính xác suất chiếm giữ tại $E = E_c + \frac{kT}{2}$ và nồng độ electron $n_0$ ở $T = 300\text{ K}$:</b>
          <span class="cmt">// Bước 1: Tính khoảng cách năng lượng $E - E_F$ từ mức Fermi đến mức $E = E_c + \frac{kT}{2}$ (với $E_c - E_F = 0.25\text{ eV}$ và $kT = 0.0259\text{ eV}$ ở $300\text{ K}$):</span>
          $$E - E_F = (E_c - E_F) + \frac{kT}{2} = 0.25\text{ eV} + \frac{0.0259\text{ eV}}{2} = 0.25 + 0.01295 = 0.26295\text{ eV}$$
          <span class="cmt">// Bước 2: Vì $E - E_F = 0.26295\text{ eV} \approx 10.15\,kT \gg 3kT$, ta sử dụng hàm phân bố Fermi-Dirac dưới dạng xấp xỉ Boltzmann để tính xác suất có electron tại mức năng lượng này:</span>
          $$f_F(E) \approx \exp\left[-\frac{E - E_F}{kT}\right] = \exp\left[-\frac{0.26295\text{ eV}}{0.0259\text{ eV}}\right] = e^{-10.1525} \approx \mathbf{3.90 \times 10^{-5}}$$
          <span class="cmt">// Bước 3: Tính nồng độ electron cân bằng $n_0$ trong toàn bộ dải dẫn ở $T = 300\text{ K}$ bằng công thức $n_0 = N_c \exp\left(-\frac{E_c - E_F}{kT}\right)$:</span>
          $$n_0 = \left(2.8 \times 10^{19}\text{ cm}^{-3}\right) \times \exp\left[-\frac{0.25\text{ eV}}{0.0259\text{ eV}}\right] = \left(2.8 \times 10^{19}\right) \times e^{-9.6525} \approx \mathbf{1.80 \times 10^{15}\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(b) Tính nồng độ lỗ trống cân bằng $p_0$ ở nhiệt độ $T = 400\text{ K}$:</b>
          <span class="cmt">// Bước 1: Quy đổi mật độ trạng thái hiệu dụng của dải hóa trị $N_v$ từ $300\text{ K}$ lên $400\text{ K}$ theo quy luật tỷ lệ thuận với $T^{3/2}$:</span>
          $$N_v(400\text{ K}) = N_v(300\text{ K}) \times \left(\frac{400}{300}\right)^{3/2} = \left(1.04 \times 10^{19}\text{ cm}^{-3}\right) \times (1.3333)^{1.5} \approx \mathbf{1.60 \times 10^{19}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Quy đổi năng lượng nhiệt $kT$ từ $300\text{ K}$ lên $400\text{ K}$ theo quy luật tỷ lệ bậc nhất với $T$:</span>
          $$kT(400\text{ K}) = 0.0259\text{ eV} \times \left(\frac{400}{300}\right) \approx \mathbf{0.03453\text{ eV}}$$
          <span class="cmt">// Bước 3: Thay $N_v(400\text{ K})$, $kT(400\text{ K})$ và khoảng cách năng lượng $E_F - E_v = 0.27\text{ eV}$ vào công thức tính nồng độ lỗ trống cân bằng $p_0$:</span>
          $$p_0 = N_v(400\text{ K}) \exp\left[-\frac{E_F - E_v}{kT(400\text{ K})}\right] = \left(1.60 \times 10^{19}\text{ cm}^{-3}\right) \times \exp\left[-\frac{0.27\text{ eV}}{0.03453\text{ eV}}\right]$$
          $$p_0 = \left(1.60 \times 10^{19}\text{ cm}^{-3}\right) \times e^{-7.819} \approx \mathbf{6.43 \times 10^{15}\text{ cm}^{-3}}$$
        </div>
      </div>
    </div>

    <!-- CÂU 2 BUỔI 5 -->
    <div class="formula-card">
      <h3 id="b5-cau2">Câu 2: Sự Biến Thiên Của Nồng Độ Hạt Dẫn Nội Tại $n_i$ Theo Nhiệt Độ</h3>
      <p><b>Đề bài:</b> Cho biết đối với Silicon tại $T = 300\text{ K}$, các mật độ trạng thái hiệu dụng có giá trị là $N_c = 2.8 \times 10^{19}\text{ cm}^{-3}$ và $N_v = 1.04 \times 10^{19}\text{ cm}^{-3}$. Giả sử năng lượng vùng cấm của Silicon giữ không đổi ở $E_g = 1.12\text{ eV}$. Hãy tính nồng độ hạt dẫn nội tại $n_i$ của Silicon tại hai mức nhiệt độ:<br>
      (a) $T = 250\text{ K}$<br>
      (b) $T = 400\text{ K}$<br>
      Từ đó nhận xét về tốc độ tăng của $n_i$ khi nhiệt độ tăng thêm $150\text{ K}$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b5-hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b5-sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b5-hint2" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Sử dụng phương trình nồng độ hạt dẫn nội tại bình phương:
            $$n_i^2(T) = N_c(T) \cdot N_v(T) \cdot \exp\left[-\frac{E_g}{kT}\right]$$
          </li>
          <li>Vì cả $N_c$ và $N_v$ đều tỉ lệ với $T^{3/2}$, nên tích số $N_c(T) \cdot N_v(T)$ sẽ tỉ lệ với $\left(T^{3/2}\right) \times \left(T^{3/2}\right) = \mathbf{T^3}$! Do đó ở nhiệt độ $T$ bất kỳ, ta luôn viết được:
            $$n_i^2(T) = (2.8 \times 10^{19})(1.04 \times 10^{19})\left(\frac{T}{300}\right)^3 \exp\left[-\frac{1.12}{0.0259 \times (T/300)}\right]$$
            Sau khi tính được $n_i^2$, em nhớ lấy căn bậc hai để ra $n_i$!</li>
        </ul>
      </div>

      <div id="b5-sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước chuẩn bị: Thiết lập công thức tính $n_i^2(T)$ từ các thông số chuẩn ở $300\text{ K}$:</b>
          <span class="cmt">// Vì $N_c(T) = N_c(300)\left(\frac{T}{300}\right)^{3/2}$ và $N_v(T) = N_v(300)\left(\frac{T}{300}\right)^{3/2}$, nên tích $N_c(T)N_v(T)$ tỉ lệ với $\left(\frac{T}{300}\right)^3$:</span>
          $$n_i^2(T) = N_c(300)\,N_v(300)\left(\frac{T}{300}\right)^3 \exp\left[-\frac{E_g}{0.0259 \times (T/300)}\right]$$
          <span class="cmt">// Tính trước tích số $N_c(300) \times N_v(300) = (2.8 \times 10^{19}) \times (1.04 \times 10^{19}) = 2.912 \times 10^{38}\text{ cm}^{-6}$.</span>
        </div>

        <div class="step">
          <b>(a) Tại nhiệt độ thấp $T = 250\text{ K}$:</b>
          <span class="cmt">// Bước 1: Tính năng lượng nhiệt $kT(250\text{ K}) = 0.0259 \times \frac{250}{300} \approx 0.021583\text{ eV}$, rồi thay vào biểu thức $n_i^2$:</span>
          $$n_i^2(250\text{ K}) = \left(2.912 \times 10^{38}\right) \times \left(\frac{250}{300}\right)^3 \times \exp\left[-\frac{1.12\text{ eV}}{0.021583\text{ eV}}\right]$$
          $$n_i^2(250\text{ K}) = \left(2.912 \times 10^{38}\right) \times (0.5787) \times e^{-51.892} \approx 4.90 \times 10^{15}\text{ cm}^{-6}$$
          <span class="cmt">// Bước 2: Lấy căn bậc hai của $n_i^2$ để tìm nồng độ hạt dẫn nội tại $n_i$ tại $250\text{ K}$:</span>
          $$n_i(250\text{ K}) = \sqrt{4.90 \times 10^{15}} \approx \mathbf{7.0 \times 10^7\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(b) Tại nhiệt độ cao $T = 400\text{ K}$:</b>
          <span class="cmt">// Bước 1: Tính năng lượng nhiệt $kT(400\text{ K}) = 0.0259 \times \frac{400}{300} \approx 0.034533\text{ eV}$, rồi thay vào biểu thức $n_i^2$:</span>
          $$n_i^2(400\text{ K}) = \left(2.912 \times 10^{38}\right) \times \left(\frac{400}{300}\right)^3 \times \exp\left[-\frac{1.12\text{ eV}}{0.034533\text{ eV}}\right]$$
          $$n_i^2(400\text{ K}) = \left(2.912 \times 10^{38}\right) \times (2.3704) \times e^{-32.432} \approx 5.67 \times 10^{24}\text{ cm}^{-6}$$
          <span class="cmt">// Bước 2: Lấy căn bậc hai của $n_i^2$ để tìm nồng độ hạt dẫn nội tại $n_i$ tại $400\text{ K}$:</span>
          $$n_i(400\text{ K}) = \sqrt{5.67 \times 10^{24}} \approx \mathbf{2.38 \times 10^{12}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 3 (Nhận xét vật lý): Khi nhiệt độ tăng thêm $150\text{ K}$ (từ $250\text{ K}$ lên $400\text{ K}$), nồng độ hạt dẫn nội tại $n_i$ đã tăng vọt từ $7.0 \times 10^7\text{ cm}^{-3}$ lên $2.38 \times 10^{12}\text{ cm}^{-3}$ — tức là tăng hơn $34\,000$ lần (hơn 4 bậc độ lớn)!</span>
        </div>
      </div>
    </div>

    <!-- CÂU 3 BUỔI 5 -->
    <div class="formula-card">
      <h3 id="b5-cau3">Câu 3: Xác Định Vị Trí Mức Năng Lượng Fermi Nội Tại $E_{Fi}$</h3>
      <p><b>Đề bài:</b> Ở nhiệt độ phòng $T = 300\text{ K}$, hãy xác định vị trí của mức năng lượng Fermi nội tại $E_{Fi}$ so với chính giữa vùng cấm ($E_{\text{midgap}}$) cho hai loại vật liệu bán dẫn:<br>
      (a) Silicon ($\text{Si}$) có khối lượng hiệu dụng mật độ trạng thái là $m_n^* = 1.08 m_0$ và $m_p^* = 0.56 m_0$.<br>
      (b) Gallium Arsenide ($\text{GaAs}$) có khối lượng hiệu dụng mật độ trạng thái là $m_n^* = 0.067 m_0$ và $m_p^* = 0.48 m_0$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b5-hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b5-sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b5-hint3" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Áp dụng trực tiếp công thức độ lệch của mức Fermi nội tại so với tâm vùng cấm:
            $$E_{Fi} - E_{\text{midgap}} = \frac{3}{4}kT \ln\left(\frac{m_p^*}{m_n^*}\right)$$
          </li>
          <li>Tại $T = 300\text{ K}$, lấy $kT = 0.0259\text{ eV}$. Nếu kết quả mang dấu âm ($-$) nghĩa là $E_{Fi}$ nằm <b>thấp hơn</b> điểm giữa vùng cấm; nếu kết quả mang dấu dương ($+$) nghĩa là $E_{Fi}$ nằm <b>cao hơn</b> điểm giữa vùng cấm.</li>
        </ul>
      </div>

      <div id="b5-sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Đối với Silicon ($\text{Si}$ có $m_n^* = 1.08 m_0$ và $m_p^* = 0.56 m_0$):</b>
          <span class="cmt">// Bước 1: Thay $kT = 0.0259\text{ eV}$ và tỷ số $\frac{m_p^*}{m_n^*} = \frac{0.56}{1.08}$ vào công thức tính $E_{Fi} - E_{\text{midgap}}$:</span>
          $$E_{Fi} - E_{\text{midgap}} = \frac{3}{4}kT \ln\left(\frac{m_p^*}{m_n^*}\right) = \frac{3}{4}(0.0259\text{ eV}) \ln\left(\frac{0.56}{1.08}\right)$$
          <span class="cmt">// Bước 2: Bấm máy tính với $\ln\left(\frac{0.56}{1.08}\right) \approx -0.65678$:</span>
          $$E_{Fi} - E_{\text{midgap}} = 0.019425 \times (-0.65678) \approx \mathbf{-0.0128\text{ eV}} = \mathbf{-12.8\text{ meV}}$$
          <span class="cmt">// Kết luận (a): Dấu âm cho biết trong Silicon ở $300\text{ K}$, mức Fermi nội tại $E_{Fi}$ nằm THẤP HƠN điểm chính giữa vùng cấm một đoạn là $12.8\text{ meV}$ (vì $N_c > N_v$, dải dẫn có nhiều trạng thái hơn nên mức Fermi phải dịch nhẹ xuống dưới để giữ cho $n_i = p_i$).</span>
        </div>

        <div class="step">
          <b>(b) Đối với Gallium Arsenide ($\text{GaAs}$ có $m_n^* = 0.067 m_0$ và $m_p^* = 0.48 m_0$):</b>
          <span class="cmt">// Bước 1: Thay $kT = 0.0259\text{ eV}$ và tỷ số $\frac{m_p^*}{m_n^*} = \frac{0.48}{0.067}$ vào công thức:</span>
          $$E_{Fi} - E_{\text{midgap}} = \frac{3}{4}(0.0259\text{ eV}) \ln\left(\frac{0.48}{0.067}\right) = 0.019425 \times \ln(7.1642)$$
          <span class="cmt">// Bước 2: Bấm máy tính với $\ln(7.1642) \approx +1.9691$:</span>
          $$E_{Fi} - E_{\text{midgap}} = 0.019425 \times 1.9691 \approx \mathbf{+0.0382\text{ eV}} = \mathbf{+38.2\text{ meV}}$$
          <span class="cmt">// Kết luận (b): Dấu dương cho biết trong $\text{GaAs}$ ở $300\text{ K}$, mức Fermi nội tại $E_{Fi}$ nằm CAO HƠN điểm chính giữa vùng cấm một đoạn là $38.2\text{ meV}$ (vì trong $\text{GaAs}$, $N_v > N_c$ nên mức Fermi phải dịch lên gần dải dẫn hơn để bù lại mật độ trạng thái nhỏ của dải dẫn).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 4 BUỔI 5 -->
    <div class="formula-card">
      <h3 id="b5-cau4">Câu 4: Tính Bán Kính Bohr Hiệu Dụng & Năng Lượng Ion Hóa Của Tạp Chất Donor</h3>
      <p><b>Đề bài:</b> Sử dụng mô hình nguyên tử Bohr mở rộng cho chất bán dẫn để khảo sát electron của nguyên tử tạp chất Donor ở trạng thái cơ bản ($n = 1$):<br>
      (a) Đối với Silicon ($\text{Si}$) có hằng số điện môi tương đối $\epsilon_r = 11.7$ và khối lượng hiệu dụng dẫn của electron thỏa mãn $\frac{m^*}{m_0} = 0.26$. Hãy tính bán kính quỹ đạo $r_1$ (ra đơn vị $\text{Å}$ và so sánh với hằng số mạng $a = 5.43\text{ Å}$) cùng năng lượng ion hóa $E_i$ của electron Donor.<br>
      (b) Lặp lại phép tính bán kính quỹ đạo $r_1$ và năng lượng ion hóa $E_i$ cho tạp chất Donor trong Gallium Arsenide ($\text{GaAs}$), biết $\epsilon_r = 13.1$ và $\frac{m^*}{m_0} = 0.067$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b5-hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b5-sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b5-hint4" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Sử dụng công thức bán kính Bohr hiệu dụng ở trạng thái cơ bản $n = 1$ (với bán kính Bohr chuẩn của Hydro là $a_0 = 0.529\text{ Å} \approx 0.53\text{ Å}$):
            $$r_1 = a_0 \cdot \epsilon_r \cdot \left(\frac{m_0}{m^*}\right)$$
          </li>
          <li>Sử dụng công thức năng lượng ion hóa tạp chất theo năng lượng Rydberg của Hydro ($13.58\text{ eV}$ hoặc $13.6\text{ eV}$):
            $$E_i = |E_1| = 13.58\text{ [eV]} \times \left(\frac{m^*}{m_0}\right) \times \frac{1}{\epsilon_r^2}$$
          </li>
        </ul>
      </div>

      <div id="b5-sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Đối với tạp chất Donor trong Silicon ($\epsilon_r = 11.7$, $\frac{m^*}{m_0} = 0.26$):</b>
          <span class="cmt">// Bước 1: Tính tỷ số giữa bán kính quỹ đạo thứ nhất $r_1$ của electron Donor và bán kính Bohr $a_0 = 0.53\text{ Å}$:</span>
          $$\frac{r_1}{a_0} = n^2 \epsilon_r \left(\frac{m_0}{m^*}\right) = 1^2 \times 11.7 \times \left(\frac{1}{0.26}\right) = \mathbf{45}$$
          <span class="cmt">// Bước 2: Nhân với $a_0 = 0.53\text{ Å}$ để tìm bán kính $r_1$ và chia cho hằng số mạng của Silicon ($a = 5.43\text{ Å}$):</span>
          $$r_1 = 45 \times 0.53\text{ Å} \approx \mathbf{23.85\text{ Å}} \approx 23.9\text{ Å} \implies \frac{r_1}{a} = \frac{23.9\text{ Å}}{5.43\text{ Å}} \approx \mathbf{4.4\text{ hằng số mạng}}$$
          <span class="cmt">// Bước 3: Tính năng lượng ion hóa $E_i$ (năng lượng cần thiết để đưa electron Donor từ mức $E_d$ lên đáy dải dẫn $E_c$):</span>
          $$E_i = \frac{m^* e^4}{2(4\pi\epsilon_0\epsilon_r)^2\hbar^2} = 13.58\text{ eV} \times \left(\frac{m^*}{m_0}\right) \times \frac{1}{\epsilon_r^2}$$
          $$E_i = 13.58\text{ eV} \times \frac{0.26}{(11.7)^2} = \frac{3.5308}{136.89} \approx \mathbf{0.0258\text{ eV}} = \mathbf{25.8\text{ meV}}$$
        </div>

        <div class="step">
          <b>(b) Đối với tạp chất Donor trong Gallium Arsenide ($\epsilon_r = 13.1$, $\frac{m^*}{m_0} = 0.067$):</b>
          <span class="cmt">// Bước 1: Tính bán kính quỹ đạo $r_1$ của electron Donor trong $\text{GaAs}$:</span>
          $$\frac{r_1}{a_0} = 1^2 \times 13.1 \times \left(\frac{1}{0.067}\right) \approx \mathbf{195.5} \implies r_1 = 195.5 \times 0.53\text{ Å} \approx \mathbf{103.6\text{ Å}}$$
          <span class="cmt">// Bước 2: Tính năng lượng ion hóa $E_i$ của tạp chất Donor trong $\text{GaAs}$:</span>
          $$E_i = 13.58\text{ eV} \times \frac{0.067}{(13.1)^2} = \frac{0.90986}{171.61} \approx \mathbf{0.0053\text{ eV}} = \mathbf{5.3\text{ meV}}$$
          <span class="cmt">// Nhận xét thực tế: Kết quả lý thuyết $5.3\text{ meV}$ rất sát với số liệu thực nghiệm trong Bảng 4.4 của bài giảng ($\text{Se}, \text{Te}, \text{Si}$ trong $\text{GaAs}$ có năng lượng ion hóa khoảng $5.8\text{ meV}$). Vì năng lượng ion hóa này quá nhỏ so với năng lượng nhiệt ở phòng ($kT = 25.9\text{ meV}$), nên ở nhiệt độ phòng 100% nguyên tử Donor trong $\text{GaAs}$ đều bị ion hóa hoàn toàn!</span>
        </div>
      </div>
    </div>

    <!-- CÂU 5 BUỔI 5 (BÀI TẬP CUỐI SLIDE BÀI GIẢNG) -->
    <div class="formula-card">
      <h3 id="b5-cau5">Câu 5 (Bài tập trang 29-30 Slide Bài giảng): Tính $N_c, N_v, n_i$ và Điện Trở Suất Nội Tại Của Silicon</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 136" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="10" y="12" width="90" height="40" rx="8" style="fill:var(--tint);stroke:var(--c5);stroke-width:2;fill-opacity:1"/><text x="55" y="36" text-anchor="middle" style="fill:var(--c5);font-size:14px;font-weight:700">n_i</text><text x="110" y="36" text-anchor="middle" style="fill:var(--ink);font-size:18px;font-weight:700">+</text><rect x="125" y="12" width="90" height="40" rx="8" style="fill:var(--tint);stroke:var(--c1);stroke-width:2;fill-opacity:1"/><text x="170" y="36" text-anchor="middle" style="fill:var(--c1);font-size:13px;font-weight:700">μₙ, μₚ</text><line x1="220" y1="32" x2="250" y2="32" style="stroke:var(--mut);stroke-width:2" marker-end="url(#fa)"/><rect x="255" y="12" width="155" height="40" rx="8" style="fill:var(--tint);stroke:var(--c2);stroke-width:2;fill-opacity:1"/><text x="332" y="36" text-anchor="middle" style="fill:var(--c2);font-size:12px;font-weight:700">σ = e·nᵢ(μₙ+μₚ)</text><line x1="332" y1="54" x2="332" y2="80" style="stroke:var(--mut);stroke-width:2" marker-end="url(#fa)"/><rect x="255" y="82" width="155" height="40" rx="8" style="fill:var(--tint);stroke:var(--c4);stroke-width:2;fill-opacity:1"/><text x="332" y="106" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">ρ = 1/σ (Ω·cm)</text></svg><figcaption>Câu 5: từ nồng độ hạt dẫn và độ linh động ra điện trở suất.</figcaption></figure>

      <p><b>Đề bài:</b> Khối lượng hiệu dụng mật độ trạng thái của electron và lỗ trống trong Silicon ($\text{Si}$) lần lượt là $m_n^* = 1.08 m_e$ và $m_p^* = 0.60 m_e$ (với $m_e = 9.1 \times 10^{-31}\text{ kg}$). Độ linh động trôi (drift mobilities) của electron và lỗ trống ở nhiệt độ phòng ($T = 300\text{ K}$) lần lượt là $\mu_e = 1400\text{ cm}^2\text{V}^{-1}\text{s}^{-1}$ và $\mu_h = 450\text{ cm}^2\text{V}^{-1}\text{s}^{-1}$. Cho độ rộng vùng cấm của Silicon là $E_g = 1.1\text{ eV}$. Hãy tính:<br>
      (a) Mật độ trạng thái hiệu dụng $N_c$ và $N_v$ ở $T = 300\text{ K}$.<br>
      (b) Nồng độ hạt dẫn nội tại $n_i$ ở $T = 300\text{ K}$.<br>
      (c) Độ dẫn điện nội tại ($\sigma$) và điện trở suất nội tại ($\rho$) của Silicon.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b5-hint5')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b5-sol5')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b5-hint5" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý (a):</b> Dùng công thức $N_c = 2\left(\frac{2\pi m_n^* kT}{h^2}\right)^{3/2}$ và $N_v = 2\left(\frac{2\pi m_p^* kT}{h^2}\right)^{3/2}$ với các hằng số chuẩn SI: $k = 1.38 \times 10^{-23}\text{ J/K}$, $T = 300\text{ K}$, $h = 6.63 \times 10^{-34}\text{ J}\cdot\text{s}$. <b>Chú ý quan trọng:</b> Kết quả tính ra từ hệ SI có đơn vị là $\text{m}^{-3}$, em phải <b>nhân với $10^{-6}$</b> để đổi sang $\text{cm}^{-3}$!</li>
          <li><b>Ý (b):</b> Thay $N_c, N_v$ vừa tìm được và $E_g = 1.1\text{ eV}$, $k = 8.62 \times 10^{-5}\text{ eV/K}$ vào công thức $n_i = (N_c N_v)^{1/2} \exp\left[-\frac{E_g}{2kT}\right]$.</li>
          <li><b>Ý (c):</b> Trong bán dẫn nội tại ($n = p = n_i$), độ dẫn điện tổng cộng do cả electron và lỗ trống đóng góp là $\sigma = e n \mu_e + e p \mu_h = e n_i (\mu_e + \mu_h)$. Từ đó suy ra điện trở suất $\rho = \frac{1}{\sigma}$.</li>
        </ul>
      </div>

      <div id="b5-sol5" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Tính mật độ trạng thái hiệu dụng $N_c$ và $N_v$ ở $T = 300\text{ K}$:</b>
          <span class="cmt">// Bước 1: Tính $N_c$ theo hệ đơn vị SI (với $m_n^* = 1.08 \times 9.1 \times 10^{-31}\text{ kg}$, $k = 1.38 \times 10^{-23}\text{ J}\cdot\text{K}^{-1}$, $T = 300\text{ K}$, $h = 6.63 \times 10^{-34}\text{ J}\cdot\text{s}$):</span>
          $$N_c = 2\left[\frac{2\pi m_n^* kT}{h^2}\right]^{3/2} = 2\left[\frac{2\pi (1.08 \times 9.1 \times 10^{-31}\text{ kg})(1.38 \times 10^{-23}\text{ J}\cdot\text{K}^{-1})(300\text{ K})}{(6.63 \times 10^{-34}\text{ J}\cdot\text{s})^2}\right]^{3/2}$$
          $$N_c = 2\left[\frac{2.556 \times 10^{-50}}{4.3957 \times 10^{-67}}\right]^{3/2} = 2\left(5.815 \times 10^{16}\right)^{3/2} \approx 2.81 \times 10^{25}\text{ m}^{-3}$$
          <span class="cmt">// Đổi từ $\text{m}^{-3}$ sang $\text{cm}^{-3}$ bằng cách chia cho $10^6$ (vì $1\text{ m}^3 = 10^6\text{ cm}^3$):</span>
          $$N_c = \mathbf{2.81 \times 10^{19}\text{ cm}^{-3}}$$
          <span class="cmt">// Bước 2: Tính $N_v$ tương tự với $m_p^* = 0.60 m_e$ (hoặc tính nhanh từ tỷ số $N_v = N_c \times \left(\frac{0.60}{1.08}\right)^{3/2}$):</span>
          $$N_v = 2\left[\frac{2\pi m_p^* kT}{h^2}\right]^{3/2} = \left(2.81 \times 10^{19}\text{ cm}^{-3}\right) \times \left(\frac{0.60}{1.08}\right)^{3/2} \approx \mathbf{1.16 \times 10^{19}\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(b) Tính nồng độ hạt dẫn nội tại $n_i$ ở $T = 300\text{ K}$:</b>
          <span class="cmt">// Bước 1: Áp dụng công thức $n_i = (N_c N_v)^{1/2} \exp\left[-\frac{E_g}{2kT}\right]$ với $E_g = 1.1\text{ eV}$ và $k = 8.62 \times 10^{-5}\text{ eV}\cdot\text{K}^{-1}$ (tức $2kT = 2 \times 300 \times 8.62 \times 10^{-5} = 0.05172\text{ eV}$):</span>
          $$n_i = \Big[(2.81 \times 10^{19}\text{ cm}^{-3})(1.16 \times 10^{19}\text{ cm}^{-3})\Big]^{1/2} \times \exp\left[-\frac{1.1\text{ eV}}{2(300\text{ K})(8.62 \times 10^{-5}\text{ eV}\cdot\text{K}^{-1})}\right]$$
          $$n_i = \left(1.805 \times 10^{19}\text{ cm}^{-3}\right) \times e^{-21.268} \approx \mathbf{1.0 \times 10^{10}\text{ cm}^{-3}}$$
        </div>

        <div class="step">
          <b>(c) Tính độ dẫn điện nội tại ($\sigma$) và điện trở suất nội tại ($\rho$) của Silicon:</b>
          <span class="cmt">// Bước 1: Trong bán dẫn nội tại, nồng độ electron bằng nồng độ lỗ trống và bằng $n_i$ ($n = p = n_i = 1.0 \times 10^{10}\text{ cm}^{-3}$). Ta tính độ dẫn điện tổng cộng $\sigma$:</span>
          $$\sigma = e n \mu_e + e p \mu_h = e n_i (\mu_e + \mu_h)$$
          $$\sigma = \left(1.6 \times 10^{-19}\text{ C}\right) \times \left(1.0 \times 10^{10}\text{ cm}^{-3}\right) \times \left(1400 + 450\text{ cm}^2\text{V}^{-1}\text{s}^{-1}\right)$$
          $$\sigma = \left(1.6 \times 10^{-9}\right) \times 1850 \approx \mathbf{3.0 \times 10^{-6}\text{ }\Omega^{-1}\text{cm}^{-1}}$$
          <span class="cmt">// Bước 2: Lấy nghịch đảo của độ dẫn điện $\sigma$ để tìm điện trở suất nội tại $\rho$:</span>
          $$\rho = \frac{1}{\sigma} = \frac{1}{3.0 \times 10^{-6}\text{ }\Omega^{-1}\text{cm}^{-1}} \approx \mathbf{3.3 \times 10^5\text{ }\Omega\cdot\text{cm}}$$
          <span class="cmt">// Nhận xét thực tế: Điện trở suất của Silicon tinh khiết lên tới $330\,000\text{ }\Omega\cdot\text{cm}$ (rất lớn), chứng tỏ Silicon tinh khiết dẫn điện rất kém ở nhiệt độ phòng và bắt buộc phải pha tạp (doping) khi chế tạo linh kiện!</span>
        </div>
      </div>
    </div>
  </section>

  <section class="sum">
    <h2>Tổng Kết Buổi 5: Những Điểm Cốt Lõi Cần Nhớ</h2>
    <ul>
      <li><b>Phương trình nồng độ hạt dẫn cân bằng:</b> $n_0 = N_c\exp\left(-\frac{E_c-E_F}{kT}\right)$ và $p_0 = N_v\exp\left(-\frac{E_F-E_v}{kT}\right)$, trong đó mật độ trạng thái hiệu dụng $N_c, N_v$ tỉ lệ thuận với $\mathbf{(m^* T)^{3/2}}$.</li>
      <li><b>Nồng độ hạt dẫn nội tại ($n_i$):</b> Trong bán dẫn tinh khiết $n_0 = p_0 = n_i = \sqrt{N_c N_v}\exp\left(-\frac{E_g}{2kT}\right)$. Giá trị $n_i$ tăng cực nhanh khi nhiệt độ $T$ tăng và giảm mạnh khi vùng cấm $E_g$ lớn.</li>
      <li><b>Vị trí mức Fermi nội tại ($E_{Fi}$):</b> Nằm rất gần tâm vùng cấm, lệch một đoạn nhỏ $E_{Fi} - E_{\text{midgap}} = \frac{3}{4}kT\ln\left(\frac{m_p^*}{m_n^*}\right)$.</li>
      <li><b>Pha tạp Donor (Nhóm V) & Acceptor (Nhóm III):</b> Tạp chất Donor tạo mức $E_d$ nằm sát dưới $E_c$ (cung cấp electron cho dải dẫn — loại N); tạp chất Acceptor tạo mức $E_a$ nằm sát trên $E_v$ (tạo lỗ trống trong dải hóa trị — loại P). Năng lượng ion hóa tạp chất rất nhỏ ($\approx 5 - 50\text{ meV} \ll E_g$).</li>
    </ul>

    <h2>1. Phân Bố Cân Bằng Trong Bán Dẫn Pha Tạp &amp; Tích Số $n_0 p_0 = n_i^2$</h2>
    <div class="box why"><b>Học phần này để làm gì?</b> Viết $n_0$, $p_0$ theo $E_F-E_{Fi}$ cho thấy ngay bán dẫn là loại n hay p. Hệ thức $n_0p_0=n_i^2$ cho phép biết hạt thiểu số chỉ từ hạt đa số.</div>

    <p>Chào em! Ở Buổi 5, chúng ta đã biết chất bán dẫn tinh khiết (nội tại) có nồng độ electron bằng đúng nồng độ lỗ trống ($n_0 = p_0 = n_i$) và mức Fermi nằm ngay gần chính giữa vùng cấm ($E_F = E_{Fi}$). Bước sang <b>Buổi 6</b>, khi ta chủ động pha thêm các nguyên tử tạp chất (Doping) để tạo ra <b>Bán dẫn ngoại lai / Bán dẫn pha tạp (Extrinsic Semiconductor)</b>, cán cân giữa electron và lỗ trống sẽ thay đổi hoàn toàn!</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Chiếc bập bênh Mức Fermi ($E_F$) và Hai chiếc bình thông nhau</b><br>
      Em hãy tưởng tượng vị trí của <b>Mức năng lượng Fermi $E_F$</b> giống như tay cầm điều khiển của một chiếc bập bênh nằm trong vùng cấm:<br><br>
      • Khi chưa pha tạp (Bán dẫn nội tại), tay cầm nằm ở vị trí cân bằng chính giữa: $E_F = E_{Fi} \implies n_0 = p_0 = n_i$.<br>
      • Khi pha tạp chất Cho (Donor - Nhóm V), có thêm rất nhiều electron được bơm vào dải dẫn. Tay cầm <b>$E_F$ lập tức được kéo dịch lên cao về phía đáy dải dẫn $E_c$ ($E_F > E_{Fi}$)</b>. Khi đó nồng độ electron $n_0$ tăng vọt lên hàng triệu lần, đồng thời nồng độ lỗ trống $p_0$ bị ép tụt xuống hàng triệu lần ($\mathbf{n_0 \gg p_0}$ — <b>Bán dẫn loại N</b>).<br>
      • Ngược lại, khi pha tạp chất Nhận (Acceptor - Nhóm III), tay cầm <b>$E_F$ bị kéo tụt xuống thấp về phía đỉnh dải hóa trị $E_v$ ($E_F < E_{Fi}$)</b>. Nồng độ lỗ trống $p_0$ tăng vọt lên còn nồng độ electron $n_0$ giảm sâu ($\mathbf{p_0 \gg n_0}$ — <b>Bán dẫn loại P</b>).
    </div>

    <p>Từ công thức chuẩn ở Buổi 5 là $n_0 = N_c \exp\left[-\frac{E_c - E_F}{kT}\right]$, ta sử dụng một mẹo biến đổi toán học rất khéo léo: <b>Cộng và trừ thêm $E_{Fi}$</b> ở trên tử số của số mũ, tức là viết $-(E_c - E_F) = -(E_c - E_{Fi}) + (E_F - E_{Fi})$:</p>
    <div class="f">
      $$n_0 = \underbrace{N_c \exp\left[-\frac{E_c - E_{Fi}}{kT}\right]}_{\text{Chính là } n_i} \times \exp\left[\frac{E_F - E_{Fi}}{kT}\right] \implies \mathbf{n_0 = n_i \exp\left[\frac{E_F - E_{Fi}}{kT}\right]}$$
    </div>
    <p>Hoàn toàn tương tự cho lỗ trống ở dải hóa trị, ta có cặp công thức đối xứng tuyệt đẹp:</p>
    <div class="f">
      $$\mathbf{n_0 = n_i \exp\left[\frac{E_F - E_{Fi}}{kT}\right]} \qquad \text{và} \qquad \mathbf{p_0 = n_i \exp\left[-\frac{E_F - E_{Fi}}{kT}\right]}$$
    </div>
    <div class="box legend"><b>Đọc cặp công thức</b><ul><li>$n_i$: nồng độ nội tại, là điểm xuất phát (khi $E_F=E_{Fi}$ thì $n_0=p_0=n_i$).</li><li>$E_F-E_{Fi}$: độ lệch của mức Fermi. Dương thì $n_0>n_i$ và $p_0<n_i$ (loại n); âm thì ngược lại (loại p).</li><li>$kT$: năng lượng nhiệt, $0.0259\text{ eV}$ ở $300\text{ K}$.</li></ul></div>

    <ul>
      <li>Nếu $\mathbf{E_F > E_{Fi}}$ (mức Fermi nằm cao hơn mức nội tại): Số mũ dương $\implies n_0 > n_i$ và $p_0 < n_i \implies \mathbf{n_0 > p_0}$ (<b>Bán dẫn loại N</b>, trong đó electron là <i>hạt dẫn đa số - majority carrier</i>, lỗ trống là <i>hạt dẫn thiểu số - minority carrier</i>).</li>
      <li>Nếu $\mathbf{E_F < E_{Fi}}$ (mức Fermi nằm thấp hơn mức nội tại): $\implies p_0 > n_i$ và $n_0 < n_i \implies \mathbf{p_0 > n_i > n_0}$ (<b>Bán dẫn loại P</b>, trong đó lỗ trống là <i>hạt dẫn đa số</i>, electron là <i>hạt dẫn thiểu số</i>).</li>
    </ul>

    
    <div class="box analogy"><b>Ví dụ:</b> Si loại n với $N_d=10^{16}\text{ cm}^{-3}$ (tạm coi mỗi donor cho 1 electron): $n_0\approx10^{16}$. Hạt thiểu số là $p_0=\dfrac{n_i^2}{n_0}=\dfrac{(1.5\times10^{10})^2}{10^{16}}\approx2.3\times10^{4}\text{ cm}^{-3}$. Hạt đa số nhiều hơn hạt thiểu số khoảng $10^{12}$ lần.</div>
<h3>1.2. Tích số $n_0 p_0 = n_i^2$ (Định luật Tác dụng Khối lượng - Mass Action Law)</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Nhân hai công thức vừa viết thì phần lệch $E_F-E_{Fi}$ triệt tiêu, còn lại tích không đổi.</li><li><b>Dùng để làm gì:</b> Biết hạt đa số thì tính được hạt thiểu số: $p_0=n_i^2/n_0$.</li><li><b>Liên hệ với phần khác:</b> Điều kiện: chỉ đúng khi không suy biến (Mục 2).</li></ul></div>

    <figure class="fig fl"><svg viewBox="0 0 420 188" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="20" y1="140" x2="400" y2="140" style="stroke:var(--mut);stroke-width:1.5"/><text x="210" y="18" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">n₀ · p₀ = nᵢ² luôn không đổi</text><rect x="44" y="120" width="32" height="20" rx="2" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><rect x="84" y="30" width="32" height="110" rx="2" style="fill:var(--c5);stroke:var(--c5);stroke-width:2;fill-opacity:0.5"/><text x="60" y="155" text-anchor="middle" style="fill:var(--c1);font-size:11px;font-weight:400">n₀</text><text x="100" y="155" text-anchor="middle" style="fill:var(--c5);font-size:11px;font-weight:400">p₀</text><text x="80" y="176" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">loại p</text><rect x="174" y="75" width="32" height="65" rx="2" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><rect x="214" y="75" width="32" height="65" rx="2" style="fill:var(--c5);stroke:var(--c5);stroke-width:2;fill-opacity:0.5"/><text x="190" y="155" text-anchor="middle" style="fill:var(--c1);font-size:11px;font-weight:400">n₀</text><text x="230" y="155" text-anchor="middle" style="fill:var(--c5);font-size:11px;font-weight:400">p₀</text><text x="210" y="176" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">tinh khiết</text><rect x="304" y="30" width="32" height="110" rx="2" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><rect x="344" y="120" width="32" height="20" rx="2" style="fill:var(--c5);stroke:var(--c5);stroke-width:2;fill-opacity:0.5"/><text x="320" y="155" text-anchor="middle" style="fill:var(--c1);font-size:11px;font-weight:400">n₀</text><text x="360" y="155" text-anchor="middle" style="fill:var(--c5);font-size:11px;font-weight:400">p₀</text><text x="340" y="176" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">loại n</text></svg><figcaption>Hạt đa số tăng thì hạt thiểu số giảm theo, như bập bênh (vẽ theo thang log).</figcaption></figure>

    <p>Khi ta nhân trực tiếp hai biểu thức $n_0$ và $p_0$ ở trên với nhau, hai hàm mũ đối dấu tự triệt tiêu ($\exp(+x)\cdot\exp(-x) = e^0 = 1$):</p>
    <div class="f">
      $$\mathbf{n_0 \cdot p_0 = n_i^2 = N_c N_v \exp\left[-\frac{E_g}{kT}\right]}$$
    </div>
    <div class="box warn">
      <b>Ý nghĩa sống còn và Điều kiện áp dụng của $n_0 p_0 = n_i^2$:</b><br>
      1. <b>Ý nghĩa:</b> Ở trạng thái cân bằng nhiệt tại một nhiệt độ $T$ cố định, dù em có pha tạp loại N hay loại P nhiều hay ít, thì <b>tích số giữa nồng độ electron và nồng độ lỗ trống luôn là một hằng số bằng $n_i^2$</b>! Khi biết hạt dẫn đa số (ví dụ $n_0$), em tìm ngay được hạt dẫn thiểu số bằng phép chia: $p_0 = \frac{n_i^2}{n_0}$.<br>
      2. <b>Điều kiện hợp lệ:</b> Công thức $n_0 p_0 = n_i^2$ được chứng minh dựa trên <b>Xấp xỉ Boltzmann</b>. Nếu pha tạp quá đậm đặc khiến xấp xỉ Boltzmann không còn đúng nữa (bán dẫn suy biến), thì $n_0 p_0 = n_i^2$ <b>cũng không còn đúng nữa</b>!
    </div>
  
    <div class="box key"><b>Mục 1 — Nhớ</b><ul><li>$n_0=n_i\exp\dfrac{E_F-E_{Fi}}{kT}$ và $p_0=n_i\exp\left(-\dfrac{E_F-E_{Fi}}{kT}\right)$.</li><li><b>$n_0p_0=n_i^2$</b> (định luật tác dụng khối lượng, chỉ đúng khi không suy biến).</li><li>$E_F$ <b>trên</b> $E_{Fi}$ → loại n. $E_F$ <b>dưới</b> $E_{Fi}$ → loại p.</li></ul></div>

    <div class="next"><b>Tiếp theo:</b> Hệ thức này dùng xấp xỉ Boltzmann. Mục 2 hỏi: nếu pha tạp quá đậm thì sao?</div>
</section>

  <section>
    <h2>2. Tích Phân Fermi-Dirac $F_{1/2}(\eta_F)$ &amp; Bán Dẫn Suy Biến (Degenerate Semiconductor)</h2>
    <div class="bridge"><b>Nối từ Mục 1:</b> Mục 1 dùng xấp xỉ Boltzmann, đúng khi $E_F$ cách mép dải ít nhất $3kT$.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Cho biết <i>khi nào</i> công thức quen thuộc sai, để không dùng nhầm khi pha tạp đậm.</div>

    <p>Ở các buổi trước, để giải tích phân nồng độ hạt dẫn một cách dễ dàng, chúng ta luôn giả sử mức Fermi $E_F$ nằm cách xa mép dải dẫn $E_c$ ít nhất là $3kT$ ($E_c - E_F \ge 3kT$) để được quyền bỏ số $1$ ở mẫu số của hàm Fermi-Dirac (Xấp xỉ Boltzmann). Nhưng nếu người kỹ sư <b>pha tạp cực kỳ đậm đặc</b> (ví dụ $N_d \ge 10^{19}\text{ cm}^{-3}$) làm mức Fermi $E_F$ tiến sát vào trong khoảng $3kT$ quanh $E_c$, hoặc thậm chí <b>chui hẳn vào bên trong dải dẫn ($E_F > E_c$)</b> thì sao?</p>

    <h3>2.1. Công thức Tích phân Fermi-Dirac bậc $1/2$</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Khi pha tạp quá đậm, $E_F$ lọt gần hoặc vào dải dẫn, xấp xỉ Boltzmann hỏng, phải giữ nguyên mẫu số $1+e^{\dots}$ của Fermi-Dirac.</li><li><b>Dùng để làm gì:</b> Tính $n_0$ bằng tích phân Fermi-Dirac bậc $1/2$.</li><li><b>Liên hệ với phần khác:</b> Quay về công thức của Buổi 4 mà không xấp xỉ.</li></ul></div>

    <p>Khi xấp xỉ Boltzmann không còn hiệu lực, ta bắt buộc phải giữ nguyên mẫu số $1 + \exp\left(\frac{E - E_F}{kT}\right)$ trong tích phân tổng quát:</p>
    <div class="f">
      $$n_0 = \frac{4\pi(2m_n^*)^{3/2}}{h^3} \int_{E_c}^{\infty} \frac{(E - E_c)^{1/2}\,dE}{1 + \exp\left(\frac{E - E_F}{kT}\right)}$$
    </div>
    <p>Để chuẩn hóa tích phân này về dạng không thứ nguyên (không có đơn vị), ta đặt hai biến số phụ đo năng lượng theo đơn vị nhiệt $kT$:</p>
    <div class="f">
      $$\mathbf{\eta = \frac{E - E_c}{kT}} \qquad \text{và} \qquad \mathbf{\eta_F = \frac{E_F - E_c}{kT}}$$
      <small>Lưu ý dấu của $\eta_F$: Nếu $\eta_F > 0$ nghĩa là $E_F > E_c$ (Mức Fermi đã nằm hẳn bên trong dải dẫn!).</small>
    </div>
    <div class="box legend"><b>Đọc các biến chuẩn hóa</b><ul><li>$\eta=(E-E_c)/kT$: khoảng cách năng lượng đo bằng đơn vị $kT$, nên tích phân không còn đơn vị.</li><li>$\eta_F=(E_F-E_c)/kT$: vị trí mức Fermi so với đáy dải dẫn. $\eta_F>0$ nghĩa là $E_F$ đã nằm <b>trong</b> dải dẫn.</li><li>$F_{1/2}(\eta_F)$: giá trị tích phân, tra từ đồ thị; $N_c$ giữ vai trò thang đo.</li></ul></div>

    <p>Thay $\eta$ và $\eta_F$ vào tích phân (nhớ $N_c = 2\left(\frac{2\pi m_n^* kT}{h^2}\right)^{3/2}$), công thức nồng độ electron chính xác tuyệt đối được viết qua <b>Hàm tích phân Fermi-Dirac bậc $1/2$</b> ký hiệu là $F_{1/2}(\eta_F)$:</p>
    <div class="f">
      $$\mathbf{n_0 = \frac{2}{\sqrt{\pi}}\,N_c\,F_{1/2}(\eta_F)} \qquad \text{với} \qquad \mathbf{F_{1/2}(\eta_F) = \int_0^{\infty} \frac{\eta^{1/2}\,d\eta}{1 + \exp(\eta - \eta_F)}}$$
    </div>
    <p>Hoàn toàn tương tự cho lỗ trống khi mức Fermi tiến sát hoặc chui vào trong dải hóa trị:</p>
    <div class="f">
      $$\mathbf{p_0 = \frac{2}{\sqrt{\pi}}\,N_v\,F_{1/2}(\eta'_F)} \qquad \text{với} \qquad \mathbf{\eta' = \frac{E_v - E}{kT}, \quad \eta'_F = \frac{E_v - E_F}{kT}}$$
      <small>Nếu $\eta'_F > 0$ nghĩa là $E_F < E_v$ (Mức Fermi đã chui sâu vào bên trong dải hóa trị!).</small>
    </div>

    <h3>2.3. Mô hình tương tác: Đồ thị Tích phân Fermi-Dirac $F_{1/2}(\eta_F)$ vs. Xấp xỉ Boltzmann &amp; Bán dẫn Suy biến</h3>

  <section>
    <h2>3. Thống Kê Tạp Chất Donor/Acceptor: Ion Hóa Hoàn Toàn &amp; Đóng Băng (Freeze-Out)</h2>
    <div class="bridge"><b>Nối từ Mục 2:</b> Mục 1–2 coi mọi tạp chất đều đã cho hạt dẫn. Thực tế phụ thuộc nhiệt độ.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Giải thích vì sao linh kiện hoạt động ổn định ở nhiệt độ phòng, và vì sao lạnh sâu thì ngừng dẫn.</div>

    <h3>3.1. Xác suất chiếm giữ trên mức năng lượng tạp chất $E_d$ và $E_a$</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Từ trước tới giờ ta coi mỗi tạp chất đều đã cho hạt dẫn. Nhưng tạp chất cũng là một "mức năng lượng" nên có xác suất bị electron chiếm.</li><li><b>Dùng để làm gì:</b> Biết tạp chất còn bao nhiêu phần trăm chưa ion hóa.</li></ul></div>

    <p>Nguyên lý loại trừ Pauli không chỉ áp dụng cho các trạng thái trong dải dẫn/dải hóa trị mà còn áp dụng cho chính các mức năng lượng tạp chất $E_d$ và $E_a$! Tuy nhiên, có một điểm tinh tế về <b>hệ số suy biến spin $g$ (degeneracy factor)</b>:</p>
    <ul>
      <li><b>Đối với mức Donor ($E_d$):</b> Mỗi nguyên tử Donor (như Phosphorus) có 1 chỗ trống liên kết có thể nhận 1 electron với spin hướng lên ($\uparrow$) HOẶC spin hướng xuống ($\downarrow$) — tức là có $2$ cách đặt electron vào. Nhưng một khi đã có 1 electron nhảy vào chiếm chỗ rồi thì nguyên tử trung hòa điện, nó không thể nhận thêm electron thứ 2 nữa! Do đó hàm phân bố cho số electron còn nằm lại trên mức Donor ($n_d$) có hệ số $\frac{1}{2}$ (tức $g_d = 2$) trước hàm mũ:
        <div class="f">
          $$\mathbf{n_d = \frac{N_d}{1 + \frac{1}{2}\exp\left(\frac{E_d - E_F}{kT}\right)} = N_d - N_d^+}$$
          <small>Trong đó: $N_d$ là tổng nồng độ nguyên tử Donor pha vào; $n_d$ là nồng độ nguyên tử Donor chưa bị ion hóa (vẫn giữ electron); còn $N_d^+$ là nồng độ ion Donor đã bị ion hóa (đã nhường electron lên dải dẫn).</small>
        </div>
      </li>
      <li><b>Đối với mức Acceptor ($E_a$):</b> Tương tự, nồng độ lỗ trống còn nằm lại trên mức Acceptor ($p_a$, tức các nguyên tử Acceptor chưa nhận electron) được cho bởi:
        <div class="f">
          $$\mathbf{p_a = \frac{N_a}{1 + \frac{1}{g}\exp\left(\frac{E_F - E_a}{kT}\right)} = N_a - N_a^-}$$
          <small>Trong đó: $N_a^-$ là nồng độ ion Acceptor đã nhận electron từ dải hóa trị; hệ số suy biến $\mathbf{g = 4}$ đối với mức Acceptor trong $\text{Si}$ và $\text{GaAs}$ (do cấu trúc suy biến kép của dải hóa trị lỗ trống nặng và lỗ trống nhẹ cộng với 2 trạng thái spin).</small>
        </div>
      </li>
    </ul>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Ở nhiệt độ phòng hay ở nhiệt độ rất thấp thì tạp chất ion hóa khác nhau.</li><li><b>Dùng để làm gì:</b> Dùng tỉ lệ $n_d/(n_d+n_0)$ để xem ion hóa hoàn toàn hay đóng băng (freeze-out).</li><li><b>Liên hệ với phần khác:</b> Kết quả cho phép Mục 4 giả sử $N_d^+\approx N_d$ ở 300 K.</li></ul></div>

e="fill:var(--mut);font-size:12px;font-weight:400">1</text><text x="36" y="154" text-anchor="end" style="fill:var(--mut);font-size:12px;font-weight:400">0</text><text x="390" y="166" text-anchor="end" style="fill:var(--mut);font-size:12px;font-weight:400">T</text><text x="46" y="24" text-anchor="start" style="fill:var(--mut);font-size:12px;font-weight:400">tỉ lệ ion hóa</text></svg><figcaption>Ở nhiệt độ phòng gần như mọi tạp chất đã ion hóa.</figcaption></figure>

    <p>Khi áp dụng xấp xỉ Boltzmann $(E_d - E_F) \gg kT$, ta có $n_d \approx 2N_d \exp\left(\frac{E_d - E_F}{kT}\right)$. Kết hợp với $n_0 = N_c \exp\left(-\frac{E_c - E_F}{kT}\right)$, ta lập được công thức tính <b>tỷ lệ phần trăm electron vẫn còn kẹt lại ở mức Donor ($n_d$) so với tổng số electron ở cả dải dẫn và mức Donor ($n_d + n_0$)</b> (giải trực tiếp <b>Câu 3a Bài tập</b>):</p>
    <div class="f">
      $$\mathbf{\frac{n_d}{n_d + n_0} = \frac{1}{1 + \frac{N_c}{2 N_d}\exp\left[-\frac{E_c - E_d}{kT}\right]}} \qquad \text{và tương tự cho Acceptor } (g=4): \qquad \mathbf{\frac{p_a}{p_0 + p_a} = \frac{1}{1 + \frac{N_v}{4 N_a}\exp\left[-\frac{E_a - E_v}{kT}\right]}}$$
    </div>
    <div class="box legend"><b>Đọc tỉ lệ chưa ion hóa</b><ul><li>$n_d$: electron còn nằm trên mức donor (chưa ion hóa); $n_d+n_0$: tổng electron do donor cung cấp.</li><li>$E_c-E_d$: năng lượng ion hóa; càng nhỏ thì tạp chất càng dễ ion hóa.</li><li>$N_c/2N_d$: so sánh số chỗ ở dải dẫn với số donor. Giá trị nhỏ nghĩa là hầu như mọi donor đã ion hóa.</li></ul></div>

    <ul>
      <li><span class="k b2">Ion hóa hoàn toàn (Complete Ionization - Ở nhiệt độ phòng $T \approx 300\text{ K}$)</span> Với mức pha tạp điển hình $N_d = 10^{16}\text{ cm}^{-3}$ trong Silicon ($E_c - E_d = 0.045\text{ eV}$), tỷ lệ $\frac{n_d}{n_d + n_0}$ chỉ bằng $0.0041 = \mathbf{0.41\%}$! Nghĩa là tới $99.59\%$ nguyên tử Donor đã nhường hết electron lên dải dẫn. Ta coi như <b>toàn bộ $100\%$ tạp chất đã bị ion hóa hoàn toàn</b>:
        $$\mathbf{n_d \approx 0 \implies N_d^+ \approx N_d} \qquad \text{và} \qquad \mathbf{p_a \approx 0 \implies N_a^- \approx N_a}$$
      </li>
      <li><span class="k b1">Hiện tượng Đóng băng hạt dẫn (Freeze-Out - Ở nhiệt độ cực thấp $T \to 0\text{ K}$)</span> Khi hạ nhiệt độ xuống rất thấp ($T \to 0\text{ K}$), năng lượng nhiệt $kT$ quá nhỏ nên không có electron nào từ mức Donor $E_d$ nhảy lên nổi dải dẫn (và không có electron nào từ dải hóa trị nhảy lên mức Acceptor $E_a$). Toàn bộ các hạt dẫn bị "đóng băng" tại các mức tạp chất: $\mathbf{n_d = N_d\ (N_d^+ = 0)}$ và $\mathbf{p_a = N_a\ (N_a^- = 0)}$. Lúc này tại $T = 0\text{ K}$, mức Fermi $E_F$ nằm giữa $E_d$ và $E_c$ (với loại N) hoặc nằm giữa $E_v$ và $E_a$ (với loại P).</li>
    </ul>
  
    <div class="box key"><b>Mục 3 — Nhớ</b><ul><li>Ở $300\text{ K}$: <b>ion hóa hoàn toàn</b>, $N_d^+\approx N_d$ và $N_a^-\approx N_a$.</li><li>Ở nhiệt độ rất thấp ($T\to0$): hạt dẫn <b>đóng băng</b> (freeze-out) trên mức tạp chất.</li></ul></div>

  <section>
    <h2>4. Trung Hòa Điện Tích (Charge Neutrality), Bán Dẫn Bù Trừ &amp; Nồng Độ Hạt Dẫn</h2>
    <div class="bridge"><b>Nối từ Mục 3:</b> Đến giờ chỉ có một loại tạp chất. Thực tế thường có cả hai.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Phương trình trung hòa điện tích là công cụ chung để tìm $n_0$, $p_0$ trong mọi trường hợp, kể cả bù trừ.</div>

    <h3>4.1. Bán dẫn Bù trừ (Compensated Semiconductor) là gì?</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Thực tế chế tạo, ta thường pha thêm tạp chất loại này lên vùng đã có tạp chất loại kia.</li><li><b>Dùng để làm gì:</b> Hiểu rằng donor và acceptor <b>bù trừ</b> nhau: chỉ phần dư quyết định loại và nồng độ hạt dẫn.</li></ul></div>

    <figure class="fig fr"><svg viewBox="0 0 420 184" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="40" y1="150" x2="400" y2="150" style="stroke:var(--mut);stroke-width:1.5"/><rect x="90" y="40" width="70" height="110" rx="3" style="fill:var(--c4);stroke:var(--c4);stroke-width:2;fill-opacity:0.2"/><rect x="90" y="40" width="70" height="50" rx="3" style="fill:var(--c2);stroke:var(--c2);stroke-width:2;fill-opacity:0.5"/><rect x="220" y="90" width="70" height="60" rx="3" style="fill:var(--c5);stroke:var(--c5);stroke-width:2;fill-opacity:0.3"/><text x="125" y="166" text-anchor="middle" style="fill:var(--c4);font-size:14px;font-weight:700">Nd</text><text x="255" y="166" text-anchor="middle" style="fill:var(--c5);font-size:14px;font-weight:700">Na</text><line x1="165" y1="90" x2="215" y2="90" style="stroke:var(--mut);stroke-width:1.5" stroke-dasharray="5 4"/><path d="M165,110 Q195,130 215,118" style="fill:none;stroke:var(--c4);stroke-width:2.5;fill-opacity:1" marker-end="url(#fa)"/><text x="190" y="84" text-anchor="middle" style="fill:var(--c4);font-size:11px;font-weight:400">e⁻ rơi</text><text x="295" y="62" text-anchor="start" style="fill:var(--c2);font-size:12px;font-weight:400">electron còn lại:</text><text x="295" y="80" text-anchor="start" style="fill:var(--c2);font-size:13px;font-weight:700">n₀ ≈ Nd − Na</text></svg><figcaption>Bù trừ: các acceptor "nuốt" bớt electron của donor, chỉ phần dư tạo hạt dẫn.</figcaption></figure>

    <p>Trong thực tế chế tạo vi mạch, người ta thường khuếch tán tạp chất loại N đè lên một vùng bán dẫn vốn đã có sẵn tạp chất loại P (hoặc ngược lại) để tạo ra các linh kiện. Một chất bán dẫn chứa <b>cả nguyên tử tạp chất Donor ($N_d$) lẫn nguyên tử tạp chất Acceptor ($N_a$) trong cùng một vùng không gian</b> được gọi là <b>Bán dẫn bù trừ (Compensated Semiconductor)</b>:</p>
    <ul>
      <li>Nếu $\mathbf{N_d > N_a}$: Số nguyên tử cho electron nhiều hơn số nguyên tử nhận electron $\implies$ Tạo thành <b>Bán dẫn bù trừ loại N</b> (với nồng độ Donor hiệu dụng là $N_d - N_a$).</li>
      <li>Nếu $\mathbf{N_a > N_d}$: Số nguyên tử nhận electron nhiều hơn $\implies$ Tạo thành <b>Bán dẫn bù trừ loại P</b> (với nồng độ Acceptor hiệu dụng là $N_a - N_d$).</li>
      <li>Nếu $\mathbf{N_d = N_a}$ (Bù trừ hoàn toàn): Bao nhiêu electron do Donor nhường ra đều rơi hết xuống lấp vừa khít bấy nhiêu chỗ trống của Acceptor! Vật liệu quay trở về có tính chất nồng độ giống hệt như <b>Bán dẫn nội tại ($n_0 = p_0 = n_i$)</b>!</li>
    </ul>

    <h3>4.2. Phương trình Trung hòa Điện tích &amp; Nghiệm phương trình bậc hai cho $n_0, p_0$</h3>
    <figure class="fig fl"><svg viewBox="0 0 420 206" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><path d="M60,100 H360" style="fill:none;stroke:var(--ink);stroke-width:4;fill-opacity:1"/><path d="M210,100 L190,140 H230 Z" style="fill:var(--c3);stroke:var(--c3);stroke-width:2;fill-opacity:0.4"/><line x1="60" y1="100" x2="60" y2="128" style="stroke:var(--mut);stroke-width:2"/><line x1="360" y1="100" x2="360" y2="128" style="stroke:var(--mut);stroke-width:2"/><rect x="25" y="128" width="70" height="20" rx="4" style="fill:var(--tint);stroke:var(--c5);stroke-width:2.5;fill-opacity:1"/><rect x="325" y="128" width="70" height="20" rx="4" style="fill:var(--tint);stroke:var(--c4);stroke-width:2.5;fill-opacity:1"/><circle cx="45" cy="120" r="0.1" style="fill:var(--card);stroke:var(--g);stroke-width:2;fill-opacity:1"/><text x="45" y="121" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400"></text><text x="60" y="168" text-anchor="middle" style="fill:var(--c5);font-size:12px;font-weight:700">n₀ + N_a⁻</text><text x="360" y="168" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">p₀ + N_d⁺</text><text x="60" y="80" text-anchor="middle" style="fill:var(--c5);font-size:15px;font-weight:700">− − − −</text><text x="360" y="80" text-anchor="middle" style="fill:var(--c4);font-size:15px;font-weight:700">+ + + +</text><text x="210" y="60" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">tổng âm = tổng dương</text><text x="210" y="185" text-anchor="middle" style="fill:var(--c5);font-size:11px;font-weight:400">điện tích âm</text><text x="210" y="200" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400"></text></svg><figcaption>Phương trình trung hòa điện tích: hai bên cân bằng như bập bênh.</figcaption></figure>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Cần một điều kiện để tìm $n_0$, $p_0$ khi có cả hai loại tạp chất. Bán dẫn luôn trung hòa điện, nên điện tích âm và dương phải cân bằng.</li><li><b>Dùng để làm gì:</b> Giải phương trình bậc hai cho $n_0$ rồi $p_0=n_i^2/n_0$.</li></ul></div>

    <p>Xét trên toàn khối, chất bán dẫn luôn trung hòa về điện (tổng mật độ điện tích âm phải bằng tổng mật độ điện tích dương):</p>
    <div class="f">
      $$\underbrace{n_0}_{\text{Electron tự do } (-)} + \underbrace{N_a^-}_{\text{Ion Acceptor } (-)} = \underbrace{p_0}_{\text{Lỗ trống tự do } (+)} + \underbrace{N_d^+}_{\text{Ion Donor } (+)}$$
    </div>
    <div class="box legend"><b>Đọc phương trình trung hòa</b><ul><li>$n_0$ (electron tự do) và $N_a^-$ (ion acceptor đã nhận electron): hai loại điện tích <b>âm</b>.</li><li>$p_0$ (lỗ trống tự do) và $N_d^+$ (ion donor đã nhường electron): hai loại điện tích <b>dương</b>.</li><li>Tổng âm = tổng dương. Kết hợp với $n_0p_0=n_i^2$ để ra nghiệm.</li></ul></div>

    <p>Ở vùng nhiệt độ làm việc bình thường (giả sử <b>Ion hóa hoàn toàn</b>: $n_d = 0 \implies N_d^+ = N_d$ và $p_a = 0 \implies N_a^- = N_a$), phương trình trung hòa điện tích trở thành:</p>
    <div class="f">
      $$\mathbf{n_0 + N_a = p_0 + N_d}$$
    </div>
    <ul>
      <li><b>Tìm nồng độ hạt dẫn cho Bán dẫn loại N ($N_d > N_a$):</b> Thay $p_0 = \frac{n_i^2}{n_0}$ vào phương trình trên, ta được phương trình bậc hai theo $n_0$:
        $$n_0 + N_a = \frac{n_i^2}{n_0} + N_d \iff \mathbf{n_0^2 - (N_d - N_a)n_0 - n_i^2 = 0}$$
        Giải phương trình bậc hai này (chỉ lấy nghiệm dương vì nồng độ hạt luôn dương), ta thu được <b>Công thức tổng quát tính nồng độ electron đa số $n_0$</b>:
        <div class="f">
          $$\mathbf{n_0 = \frac{N_d - N_a}{2} + \sqrt{\left(\frac{N_d - N_a}{2}\right)^2 + n_i^2}} \qquad \text{và hạt thiểu số:} \qquad \mathbf{p_0 = \frac{n_i^2}{n_0}}$$
          <small><b>Xấp xỉ cực nhanh khi pha tạp mạnh $(N_d - N_a) \gg n_i$:</b> Khi đó số hạng $n_i^2$ dưới dấu căn quá nhỏ có thể bỏ qua, suy ra $\mathbf{n_0 \approx N_d - N_a}$ và $\mathbf{p_0 \approx \frac{n_i^2}{N_d - N_a}}$! (Tuy nhiên nếu $N_d - N_a$ chỉ xấp xỉ vài lần $n_i$ — như trong Germanium ở <b>Câu 4c</b> — em bắt buộc phải bấm máy đầy đủ công thức căn bậc hai!).</small>
        </div>
      </li>

      <li><b>Tìm nồng độ hạt dẫn cho Bán dẫn loại P ($N_a > N_d$):</b> Thay $n_0 = \frac{n_i^2}{p_0}$ vào phương trình trung hòa điện, ta được phương trình bậc hai $p_0^2 - (N_a - N_d)p_0 - n_i^2 = 0$, cho nghiệm <b>nồng độ lỗ trống đa số $p_0$</b>:
        <div class="f">
          $$\mathbf{p_0 = \frac{N_a - N_d}{2} + \sqrt{\left(\frac{N_a - N_d}{2}\right)^2 + n_i^2}} \qquad \text{và hạt thiểu số:} \qquad \mathbf{n_0 = \frac{n_i^2}{p_0}}$$
          <small><b>Khi $(N_a - N_d) \gg n_i$:</b> Ta có ngay $\mathbf{p_0 \approx N_a - N_d}$ và $\mathbf{n_0 \approx \frac{n_i^2}{N_a - N_d}}$.</small>
        </div>
      </li>
    </ul>

    <div class="box tip">
      <b>Tại sao khi thêm Donor ($N_d$), nồng độ electron không bằng $N_d + n_i$ mà nồng độ lỗ trống $p_0$ lại giảm mạnh? (Figure 4.15):</b><br>
      Khi ta thêm các nguyên tử Donor vào bán dẫn, phần lớn electron của Donor nhảy lên dải dẫn, nhưng <b>một số ít electron Donor sẽ rơi xuống dải hóa trị để tái hợp (tiêu diệt / annihilate) bớt các lỗ trống nội tại</b> có sẵn ở đó! Nhờ sự tái hợp này mà tích số $n_0 p_0 = n_i^2$ luôn được duy trì và nồng độ lỗ trống thiểu số $p_0 = \frac{n_i^2}{n_0}$ giảm xuống rất sâu so với $n_i$.
    </div>

  <section>
    <h2>5. Vị Trí Mức Năng Lượng Fermi $E_F$ Theo Nồng Độ Pha Tạp, Nhiệt Độ &amp; Ý Nghĩa Vật Lý</h2>
    <div class="bridge"><b>Nối từ Mục 4:</b> $n_0$ đã biết, đảo công thức ở Mục 1 để suy ra $E_F$.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> $E_F$ là "chỉ số" gọn nhất cho biết trạng thái của bán dẫn. Quy tắc $E_F$ phẳng khi tiếp xúc là nền cho linh kiện nhiều lớp vật liệu.</div>

    <h3>5.1. Công thức xác định vị trí Mức Fermi $E_F$ theo nồng độ pha tạp</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Biết $n_0$ rồi, đảo công thức Boltzmann để biết $E_F$ nằm đâu, và vị trí này mới là thứ cần khi vẽ giản đồ vùng năng lượng của linh kiện.</li><li><b>Dùng để làm gì:</b> Tính khoảng cách $E_c-E_F$ hoặc $E_F-E_v$ (Câu 5).</li></ul></div>

    <figure class="fig fl"><svg viewBox="0 0 420 184" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="40" y="20" width="200" height="35" rx="0" style="fill:var(--c1);stroke:var(--c1);stroke-width:0;fill-opacity:0.18"/><rect x="40" y="125" width="200" height="35" rx="0" style="fill:var(--c5);stroke:var(--c5);stroke-width:0;fill-opacity:0.18"/><line x1="40" y1="55" x2="240" y2="55" style="stroke:var(--c1);stroke-width:2.5"/><line x1="40" y1="125" x2="240" y2="125" style="stroke:var(--c5);stroke-width:2.5"/><line x1="40" y1="90" x2="240" y2="90" style="stroke:var(--mut);stroke-width:1.5" stroke-dasharray="5 4"/><text x="246" y="94" text-anchor="start" style="fill:var(--mut);font-size:12px;font-weight:400">E_Fi</text><line x1="60" y1="78" x2="220" y2="78" style="stroke:var(--c4);stroke-width:2.5"/><line x1="60" y1="68" x2="220" y2="68" style="stroke:var(--c4);stroke-width:2.5"/><line x1="60" y1="58" x2="220" y2="58" style="stroke:var(--c4);stroke-width:2.5"/><line x1="60" y1="102" x2="220" y2="102" style="stroke:var(--c5);stroke-width:2.5"/><line x1="60" y1="112" x2="220" y2="112" style="stroke:var(--c5);stroke-width:2.5"/><line x1="60" y1="122" x2="220" y2="122" style="stroke:var(--c5);stroke-width:2.5"/><line x1="330" y1="95" x2="330" y2="50" style="stroke:var(--c4);stroke-width:2.5" marker-end="url(#fa)"/><text x="335" y="38" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:700">Nd tăng:</text><text x="335" y="54" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:400">E_F lên</text><line x1="330" y1="100" x2="330" y2="140" style="stroke:var(--c5);stroke-width:2.5" marker-end="url(#fa)"/><text x="335" y="156" text-anchor="start" style="fill:var(--c5);font-size:12px;font-weight:700">Na tăng:</text><text x="335" y="172" text-anchor="start" style="fill:var(--c5);font-size:12px;font-weight:400">E_F xuống</text></svg><figcaption>Pha tạp càng đậm thì E_F càng sát dải của hạt đa số.</figcaption></figure>

    <p>Bằng cách lấy logarit tự nhiên ($\ln$) hai vế của các phương trình nồng độ hạt dẫn (trong miền xấp xỉ Boltzmann còn hiệu lực), ta dễ dàng xác định được khoảng cách từ mức Fermi $E_F$ đến các mép dải $E_c, E_v$ hoặc đến mức nội tại $E_{Fi}$:</p>
    <div class="f">
      $$\text{Bán dẫn loại N } (N_d > N_a): \quad \mathbf{E_c - E_F = kT \ln\left(\frac{N_c}{n_0}\right) \approx kT \ln\left(\frac{N_c}{N_d - N_a}\right)}$$
      $$\text{Hoặc tính từ } E_{Fi}: \quad \mathbf{E_F - E_{Fi} = kT \ln\left(\frac{n_0}{n_i}\right) \approx kT \ln\left(\frac{N_d - N_a}{n_i}\right)}$$
    </div>
    <div class="box legend"><b>Đọc công thức vị trí $E_F$</b><ul><li>$N_c/(N_d-N_a)$: tỉ số số chỗ trong dải dẫn so với số hạt dẫn do pha tạp. Tỉ số nhỏ thì $E_F$ càng gần $E_c$.</li><li>Pha tạp càng đậm ($N_d-N_a$ lớn) thì $E_c-E_F$ càng nhỏ, tức $E_F$ càng sát dải dẫn.</li><li>Loại p đối xứng: dùng $N_v$ và $E_F-E_v$.</li></ul></div>

    <div class="f">
      $$\text{Bán dẫn loại P } (N_a > N_d): \quad \mathbf{E_F - E_v = kT \ln\left(\frac{N_v}{p_0}\right) \approx kT \ln\left(\frac{N_v}{N_a - N_d}\right)}$$
      $$\text{Hoặc tính từ } E_{Fi}: \quad \mathbf{E_{Fi} - E_F = kT \ln\left(\frac{p_0}{n_i}\right) \approx kT \ln\left(\frac{N_a - N_d}{n_i}\right)}$$
    </div>

    <h3>5.2. Ba vùng nhiệt độ hoạt động của Bán dẫn Pha tạp (Figure 4.16 &amp; 4.19)</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 204" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="40" y1="30" x2="390" y2="30" style="stroke:var(--c1);stroke-width:2.5"/><line x1="40" y1="48" x2="390" y2="48" style="stroke:var(--c4);stroke-width:2" stroke-dasharray="5 4"/><line x1="40" y1="100" x2="390" y2="100" style="stroke:var(--mut);stroke-width:1.5" stroke-dasharray="5 4"/><line x1="40" y1="170" x2="390" y2="170" style="stroke:var(--c5);stroke-width:2.5"/><text x="34" y="34" text-anchor="end" style="fill:var(--c1);font-size:11px;font-weight:700">Ec</text><text x="34" y="52" text-anchor="end" style="fill:var(--c4);font-size:11px;font-weight:700">Ed</text><text x="34" y="104" text-anchor="end" style="fill:var(--mut);font-size:11px;font-weight:400">Ei</text><text x="34" y="174" text-anchor="end" style="fill:var(--c5);font-size:11px;font-weight:700">Ev</text><line x1="140" y1="22" x2="140" y2="178" style="stroke:var(--g);stroke-width:1.5" stroke-dasharray="5 4"/><line x1="255" y1="22" x2="255" y2="178" style="stroke:var(--g);stroke-width:1.5" stroke-dasharray="5 4"/><path d="M45,39 C100,39 125,58 150,62 L240,68 C300,76 330,98 385,100" style="fill:none;stroke:var(--c2);stroke-width:3.5;fill-opacity:1"/><text x="330" y="126" text-anchor="middle" style="fill:var(--c2);font-size:13px;font-weight:700">E_F</text><text x="92" y="190" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:400">đóng băng</text><text x="197" y="190" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:700">ngoại lai</text><text x="322" y="190" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:400">nội tại</text></svg><figcaption>Đường đi của E_F theo nhiệt độ ở bán dẫn loại n: từ gần E_c xuống dần tới giữa vùng cấm.</figcaption></figure>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Nhiệt độ làm số hạt dẫn và vị trí $E_F$ thay đổi, nên linh kiện chỉ hoạt động đúng trong một khoảng nhiệt độ.</li><li><b>Dùng để làm gì:</b> Nhận ra ba vùng: đóng băng (thấp), ngoại lai ($n_0\approx N_d$, vùng làm việc), nội tại (cao, $n_i$ vượt $N_d$).</li></ul></div>

    <figure class="fig fl"><svg viewBox="0 0 420 192" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="40" y1="150" x2="400" y2="150" style="stroke:var(--mut);stroke-width:1.5"/><line x1="40" y1="150" x2="40" y2="20" style="stroke:var(--mut);stroke-width:1.5"/><path d="M50,145 C85,145 105,80 140,75 L250,75 C300,75 330,60 385,22" style="fill:none;stroke:var(--c5);stroke-width:3.5;fill-opacity:1"/><line x1="140" y1="20" x2="140" y2="150" style="stroke:var(--g);stroke-width:1.5" stroke-dasharray="5 4"/><line x1="255" y1="20" x2="255" y2="150" style="stroke:var(--g);stroke-width:1.5" stroke-dasharray="5 4"/><line x1="40" y1="75" x2="140" y2="75" style="stroke:var(--c4);stroke-width:1.5" stroke-dasharray="4 4"/><text x="90" y="166" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">đóng băng</text><text x="197" y="166" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">ngoại lai</text><text x="327" y="166" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">nội tại</text><text x="197" y="64" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">n₀ ≈ Nd</text><text x="46" y="18" text-anchor="start" style="fill:var(--mut);font-size:12px;font-weight:400">log n₀</text><text x="398" y="182" text-anchor="end" style="fill:var(--mut);font-size:12px;font-weight:400">nhiệt độ T →</text></svg><figcaption>Ba vùng nhiệt độ của bán dẫn pha tạp: dùng được nhất là vùng ngoại lai.</figcaption></figure>

    <p>Khi theo dõi nồng độ electron $n_0(T)$ và vị trí mức Fermi $E_F(T)$ của một chất bán dẫn pha tạp khi nhiệt độ tăng dần từ $0\text{ K}$ lên tới $700\text{ K}$, ta luôn thấy <b>3 vùng chế độ rõ rệt</b>:</p>
    <ol>
      <li><span class="k b1">Vùng 1 — Nhiệt độ thấp ($T < 100\text{ K}$): Vùng Ion hóa một phần / Đóng băng (Partial Ionization / Freeze-Out)</span> Nhiệt độ quá thấp không đủ làm bật hết electron ra khỏi mức Donor $E_d$. Khi $T$ giảm về $0\text{ K}$, $n_0$ tụt dốc xuống $0$ và mức Fermi $E_F$ dâng lên nằm cao hơn cả mức $E_d$ (với loại N) hoặc tụt xuống dưới mức $E_a$ (với loại P).</li>
      <li><span class="k b2">Vùng 2 — Nhiệt độ trung bình ($100\text{ K} \le T \le 500\text{ K}$): Vùng Ngoại lai / Pha tạp (Extrinsic Region)</span> Đây là vùng làm việc chuẩn của mọi linh kiện bán dẫn! Toàn bộ các nguyên tử tạp chất đã ion hóa hoàn toàn và $N_d \gg n_i(T)$, nên nồng độ hạt dẫn đa số giữ <b>phẳng lì không đổi theo nhiệt độ: $n_0 \approx N_d$</b>.</li>
      <li><span class="k b4">Vùng 3 — Nhiệt độ cao ($T > 500\text{ K}$): Vùng Nội tại (Intrinsic Region)</span> Khi nhiệt độ quá nóng, nồng độ hạt dẫn nội tại $n_i(T)$ tăng vọt theo hàm mũ đến mức vượt xa cả lượng tạp chất pha vào ($n_i(T) \gg N_d$). Lúc này lượng tạp chất trở nên muối bỏ bể: nồng độ $n_0$ tăng vọt bám theo đường $n_i(T)$, còn mức Fermi $E_F$ <b>kéo tụt về lại mức chính giữa vùng cấm ($E_F \to E_{Fi}$)</b> — chất bán dẫn mất tính chất loại N/P và biến thành bán dẫn nội tại (làm hỏng chức năng của con chip!).</li>
    </ol>

    <h3>5.3. Mô hình tương tác: Ba Vùng Nhiệt Độ Của $n_0(T)$ &amp; Đường Đi Của Mức Fermi $E_F(T)$</h3>

    <p>Tại sao các kỹ sư bán dẫn lại quan tâm đến vị trí mức Fermi $E_F$ đến vậy? Bởi vì <b>Mức năng lượng Fermi đóng vai trò giống hệt như "Mực nước" (Thế năng hóa học) của các hạt electron!</b></p>
    <ul>
      <li>Giả sử ta có Vật liệu A (có mức Fermi cao $E_{FA}$) và Vật liệu B (có mức Fermi thấp hơn $E_{FB} < E_{FA}$).</li>
      <li>Ngay khoảnh khắc ghép Vật liệu A tiếp xúc với Vật liệu B, giống như mở van nối thông hai bể nước có độ cao khác nhau, các hạt electron ở mức năng lượng cao từ Vật liệu A sẽ <b>chảy tràn sang các trạng thái trống thấp hơn ở Vật liệu B</b>!</li>
      <li>Sự di chuyển hạt dẫn chỉ dừng lại khi hệ đạt <b>Trạng thái cân bằng nhiệt (Thermal Equilibrium)</b>. Khi đó, <b>mức năng lượng Fermi ở mọi nơi trong toàn bộ hệ tiếp xúc bắt buộc phải nằm trên cùng một đường thẳng ngang bằng nhau ($\mathbf{E_{FA} = E_{FB} = E_F = \text{hằng số}}$)</b>!</li>
    </ul>
