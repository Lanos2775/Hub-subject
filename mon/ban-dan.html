      <p><b>Đề bài:</b> Cần tạo ra bức xạ tia X có bước sóng $\lambda = 1\text{ Å}$.<br>
      a) Electron phải được gia tốc trong chân không qua một hiệu điện thế bao nhiêu để khi va chạm với bia, nó có thể tạo ra photon có bước sóng trên? Giả sử toàn bộ năng lượng của electron được truyền cho photon.<br>
      b) Tính bước sóng de Broglie của electron ngay trước khi nó va vào bia.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint1" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý a:</b> Đổi bước sóng tia X $\lambda = 1\text{ Å} = 10^{-10}\text{ m}$. Tính năng lượng của photon tia X bằng công thức $E_{\text{photon}} = \frac{hc}{\lambda}$ (ra đơn vị Joule). Vì toàn bộ động năng của electron khi được gia tốc qua hiệu điện thế $V$ ($E_e = e \cdot V$) truyền hết cho photon, nên ta cho $e \cdot V = E_{\text{photon}} \implies V = \frac{E_{\text{photon}}}{e}$.</li>
          <li><b>Ý b:</b> Ngay trước khi va vào bia, electron có động năng $E = E_{\text{photon}}$ (tính ở câu a). Từ công thức động năng cổ điển $E = \frac{p^2}{2m_0}$, ta rút ra động lượng của electron là $p = \sqrt{2m_0 E}$, sau đó thay vào công thức bước sóng de Broglie $\lambda_{\text{DB}} = \frac{h}{p}$.</li>
        </ul>
      </div>

      <div id="b2-sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>a) Tính hiệu điện thế gia tốc $V$ cần thiết:</b>
          <span class="cmt">// Bước 1: Đổi bước sóng của photon tia X từ đơn vị Angstrom ($\text{Å}$) sang đơn vị chuẩn SI là mét ($\text{m}$):</span>
          $$\lambda = 1\text{ Å} = 1 \times 10^{-10}\text{ m}$$
          <span class="cmt">// Bước 2: Tính năng lượng của photon tia X cần tạo ra theo công thức lượng tử Planck - Einstein (với $h = 6.625 \times 10^{-34}\text{ J}\cdot\text{s}$ và $c = 3 \times 10^8\text{ m/s}$):</span>
          $$E_{\text{photon}} = \frac{hc}{\lambda} = \frac{\left(6.625 \times 10^{-34}\text{ J}\cdot\text{s}\right) \times \left(3 \times 10^8\text{ m/s}\right)}{1 \times 10^{-10}\text{ m}} = 1.9875 \times 10^{-15}\text{ J}$$
          <span class="cmt">// Bước 3: Theo định luật bảo toàn năng lượng, toàn bộ năng lượng mà electron thu được khi chạy qua hiệu điện thế gia tốc $V$ ($E_e = e \cdot V$) được truyền hoàn toàn cho photon tia X ($E_e = E_{\text{photon}}$). Ta chia năng lượng này cho điện tích nguyên tố $e = 1.6 \times 10^{-19}\text{ C}$ để tìm hiệu điện thế $V$:</span>
          $$e \cdot V = E_{\text{photon}} \implies V = \frac{E_{\text{photon}}}{e} = \frac{1.9875 \times 10^{-15}\text{ J}}{1.6 \times 10^{-19}\text{ C}} \approx 12422\text{ V} \approx 12.42\text{ kV}$$
          <span class="cmt">// (Ghi chú: Khi một electron được gia tốc qua hiệu điện thế $12422\text{ V}$, động năng của nó tính theo đơn vị $\text{eV}$ chính bằng $E = 12422\text{ eV} = 12.42\text{ keV}$).</span>
        </div>

        <div class="step">
          <b>b) Tính bước sóng de Broglie của electron ngay trước khi va vào bia:</b>
          <span class="cmt">// Bước 1: Tìm động lượng $p$ của electron ngay trước khi đập vào bia. Biết động năng của electron liên hệ với động lượng $p$ và khối lượng nghỉ $m_0 = 9.11 \times 10^{-31}\text{ kg}$ qua công thức $E = \frac{1}{2}m_0v^2 = \frac{p^2}{2m_0}$, ta rút ra $p$:</span>
          $$p = \sqrt{2 m_0 E} = \sqrt{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right) \times \left(1.9875 \times 10^{-15}\text{ J}\right)}$$
          $$p = \sqrt{3.6212 \times 10^{-45}} \approx 6.018 \times 10^{-23}\text{ kg}\cdot\text{m/s}$$
          <span class="cmt">// Bước 2: Áp dụng công thức de Broglie $\lambda_e = \frac{h}{p}$ để tính bước sóng vật chất của hạt electron tại thời điểm đó:</span>
          $$\lambda_e = \frac{h}{p} = \frac{6.625 \times 10^{-34}\text{ J}\cdot\text{s}}{6.018 \times 10^{-23}\text{ kg}\cdot\text{m/s}} \approx 1.101 \times 10^{-11}\text{ m}$$
          <span class="cmt">// Bước 3: Đổi kết quả từ mét ($\text{m}$) sang Angstrom ($\text{Å}$) bằng cách chia cho $10^{-10}$ để dễ so sánh với bước sóng tia X:</span>
          $$\lambda_e \approx 0.11\text{ Å}$$
          <span class="cmt">// Nhận xét vật lý: Dù có cùng mức năng lượng $12.42\text{ keV}$, nhưng bước sóng de Broglie của electron ($0.11\text{ Å}$) ngắn hơn khoảng 9 lần so với bước sóng của photon tia X ($1\text{ Å}$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 2 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau2">Câu 2: Áp dụng Nguyên lý Bất định Heisenberg cho Photon</h3>
      <p><b>Đề bài:</b> Khi xét nguyên lý bất định, không thể xác định vị trí của một photon chính xác hơn khoảng một bước sóng. Xét photon có: $\lambda = 1\text{ }\mu\text{m}$. Hãy xác định độ bất định của động lượng photon.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint2" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Đề bài cho biết <i>"không thể xác định vị trí chính xác hơn khoảng một bước sóng"</i>, nghĩa là độ bất định về vị trí của photon bằng đúng bước sóng của nó: $\Delta x \approx \lambda = 1\text{ }\mu\text{m} = 10^{-6}\text{ m}$.</li>
          <li>Áp dụng trực tiếp hệ thức bất định Heisenberg giữa vị trí và động lượng: $\Delta p \cdot \Delta x \ge \hbar \implies \Delta p \ge \frac{\hbar}{\Delta x}$.</li>
        </ul>
      </div>

      <div id="b2-sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Xác định độ bất định về vị trí $\Delta x$ từ dữ kiện đề bài và đổi từ đơn vị micromet ($\mu\text{m}$) sang đơn vị chuẩn SI là mét ($\text{m}$):</span>
          $$\Delta x = \lambda = 1\text{ }\mu\text{m} = 1 \times 10^{-6}\text{ m}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Viết hệ thức bất định Heisenberg liên hệ giữa độ bất định vị trí $\Delta x$ và độ bất định động lượng $\Delta p$:</span>
          $$\Delta p \cdot \Delta x \ge \hbar \quad \left(\text{với } \hbar = \frac{h}{2\pi} \approx 1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right)$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Chia cả hai vế cho $\Delta x$ để tìm giá trị độ bất định tối thiểu của động lượng photon:</span>
          $$\Delta p \ge \frac{\hbar}{\Delta x} = \frac{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}{1 \times 10^{-6}\text{ m}} = 1.054 \times 10^{-28}\text{ kg}\cdot\text{m/s}\text{ (hoặc N}\cdot\text{s)}$$
        </div>
      </div>
    </div>

    <!-- CÂU 3 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau3">Câu 3: Nguyên lý Chồng chập Nghiệm của Phương trình Schrödinger</h3>
      <p><b>Đề bài:</b> Giả sử $\Psi_1(x,t)$ và $\Psi_2(x,t)$ đều là nghiệm của phương trình Schrödinger phụ thuộc thời gian một chiều.<br>
      a) Chứng minh rằng: $\Psi_1 + \Psi_2$ cũng là một nghiệm.<br>
      b) Tích: $\Psi_1 \Psi_2$ có phải luôn là nghiệm của Schrödinger equation không? Tại sao?</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint3" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý a:</b> Viết phương trình Schrödinger phụ thuộc thời gian cho $\Psi_1$ và cho $\Psi_2$. Sau đó thế hàm tổng $\Psi = \Psi_1 + \Psi_2$ vào phương trình Schrödinger, sử dụng tính chất tuyến tính của đạo hàm: đạo hàm của một tổng bằng tổng các đạo hàm.</li>
          <li><b>Ý b:</b> Thế hàm tích $\Psi = \Psi_1 \cdot \Psi_2$ vào phương trình Schrödinger và áp dụng quy tắc đạo hàm của một tích: $(u \cdot v)' = u'v + uv'$. Em sẽ thấy xuất hiện các số hạng thừa và $V(x)$ bị thiếu hệ số, khiến hai vế không bằng nhau!</li>
        </ul>
      </div>

      <div id="b2-sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước chuẩn bị: Viết giả thiết cho hai nghiệm $\Psi_1(x,t)$ và $\Psi_2(x,t)$:</b>
          <span class="cmt">// Vì $\Psi_1$ và $\Psi_2$ đều là nghiệm của phương trình Schrödinger phụ thuộc thời gian 1 chiều trong cùng trường thế năng $V(x)$, nên bản thân chúng thỏa mãn hai đẳng thức sau:</span>
          $$-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_1}{\partial x^2} + V(x)\Psi_1 = j\hbar\frac{\partial \Psi_1}{\partial t} \quad (1)$$
          $$-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_2}{\partial x^2} + V(x)\Psi_2 = j\hbar\frac{\partial \Psi_2}{\partial t} \quad (2)$$
        </div>

        <div class="step">
          <b>a) Chứng minh tổng $\Psi = \Psi_1 + \Psi_2$ cũng là một nghiệm:</b>
          <span class="cmt">// Bước 1: Thay $\Psi = \Psi_1 + \Psi_2$ vào Vế Trái (VT) của phương trình Schrödinger và dùng tính chất đạo hàm của một tổng bằng tổng các đạo hàm:</span>
          $$\text{VT} = -\frac{\hbar^2}{2m}\frac{\partial^2 (\Psi_1 + \Psi_2)}{\partial x^2} + V(x)(\Psi_1 + \Psi_2)$$
          $$\text{VT} = \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_1}{\partial x^2} + V(x)\Psi_1\right) + \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_2}{\partial x^2} + V(x)\Psi_2\right)$$
          <span class="cmt">// Bước 2: Áp dụng đẳng thức (1) cho ngoặc thứ nhất và đẳng thức (2) cho ngoặc thứ hai, sau đó đặt nhân tử chung $j\hbar\frac{\partial}{\partial t}$:</span>
          $$\text{VT} = j\hbar\frac{\partial \Psi_1}{\partial t} + j\hbar\frac{\partial \Psi_2}{\partial t} = j\hbar\frac{\partial (\Psi_1 + \Psi_2)}{\partial t} = \text{VP}$$
          <span class="cmt">// Kết luận câu a: Vế Trái bằng đúng Vế Phải, vậy $\Psi_1 + \Psi_2$ luôn là nghiệm của phương trình Schrödinger (Trong vật lý lượng tử, tính chất này gọi là Nguyên lý chồng chập trạng thái - Superposition Principle).</span>
        </div>

        <div class="step">
          <b>b) Xét xem tích $\Psi = \Psi_1 \Psi_2$ có phải luôn là nghiệm hay không:</b>
          <span class="cmt">// Bước 1: Tính đạo hàm bậc nhất theo thời gian (Vế Phải) của hàm tích $\Psi_1 \Psi_2$ theo quy tắc đạo hàm một tích $(uv)' = u'v + uv'$:</span>
          $$\text{VP} = j\hbar\frac{\partial (\Psi_1 \Psi_2)}{\partial t} = \Psi_2 \left(j\hbar\frac{\partial \Psi_1}{\partial t}\right) + \Psi_1 \left(j\hbar\frac{\partial \Psi_2}{\partial t}\right)$$
          <span class="cmt">// Thay $j\hbar\frac{\partial \Psi_1}{\partial t}$ và $j\hbar\frac{\partial \Psi_2}{\partial t}$ từ phương trình (1) và (2) vào biểu thức Vế Phải trên:</span>
          $$\text{VP} = \Psi_2 \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_1}{\partial x^2} + V(x)\Psi_1\right) + \Psi_1 \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_2}{\partial x^2} + V(x)\Psi_2\right)$$
          $$\text{VP} = -\frac{\hbar^2}{2m}\left(\Psi_2\frac{\partial^2 \Psi_1}{\partial x^2} + \Psi_1\frac{\partial^2 \Psi_2}{\partial x^2}\right) + 2V(x)\Psi_1\Psi_2 \quad (*)$$
          <span class="cmt">// Bước 2: Bây giờ ta tính Vế Trái (VT) của phương trình Schrödinger khi thế $\Psi = \Psi_1 \Psi_2$ vào. Lưu ý đạo hàm bậc hai của một tích là $(uv)'' = u''v + 2u'v' + uv''$:</span>
          $$\frac{\partial^2 (\Psi_1 \Psi_2)}{\partial x^2} = \frac{\partial}{\partial x}\left(\Psi_2\frac{\partial \Psi_1}{\partial x} + \Psi_1\frac{\partial \Psi_2}{\partial x}\right) = \Psi_2\frac{\partial^2 \Psi_1}{\partial x^2} + 2\frac{\partial \Psi_1}{\partial x}\frac{\partial \Psi_2}{\partial x} + \Psi_1\frac{\partial^2 \Psi_2}{\partial x^2}$$
          <span class="cmt">// Do đó Vế Trái trở thành:</span>
          $$\text{VT} = -\frac{\hbar^2}{2m}\left(\Psi_2\frac{\partial^2 \Psi_1}{\partial x^2} + 2\frac{\partial \Psi_1}{\partial x}\frac{\partial \Psi_2}{\partial x} + \Psi_1\frac{\partial^2 \Psi_2}{\partial x^2}\right) + V(x)\Psi_1\Psi_2 \quad (**)$$
          <span class="cmt">// Bước 3: So sánh Vế Phải $(*)$ và Vế Trái $(**)$: Ta thấy $\text{VT} \ne \text{VP}$ vì ở Vế Trái dư ra số hạng đạo hàm chéo $-\frac{\hbar^2}{m}\frac{\partial \Psi_1}{\partial x}\frac{\partial \Psi_2}{\partial x}$ và chỉ có $1V(x)\Psi_1\Psi_2$ (trong khi Vế Phải có $2V(x)\Psi_1\Psi_2$).</span>
          <span class="cmt">// Kết luận câu b: Tích $\Psi_1\Psi_2$ KHÔNG PHẢI luôn là nghiệm của phương trình Schrödinger, bởi vì phương trình Schrödinger là phương trình vi phân tuyến tính (chỉ bảo toàn phép cộng và phép nhân với hằng số, không bảo toàn phép nhân hai hàm biến thiên).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 4 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau4">Câu 4: Chuẩn hóa Hàm sóng (Tìm hệ số biên độ $A$)</h3>
      <p><b>Đề bài:</b> Xét wave function: $\Psi(x,t) = A\cos(n\pi x)e^{-j\omega t}$ trong miền $-\frac{1}{2} \le x \le +\frac{1}{2}$ với $n$ là số nguyên. Xác định $A$ sao cho:
      $$\int_{-1/2}^{+1/2} |\Psi(x,t)|^2\,dx = 1$$</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint4" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Trước tiên, rút gọn $|\Psi(x,t)|^2 = \Psi(x,t) \cdot \Psi^*(x,t)$. Nhớ rằng thừa số thời gian $|e^{-j\omega t}|^2 = e^{-j\omega t} \cdot e^{+j\omega t} = e^0 = 1$, nên $|\Psi(x,t)|^2 = |A|^2 \cos^2(n\pi x)$.</li>
          <li>Để tính tích phân của hàm bậc hai $\cos^2(u)$, hãy dùng <b>công thức hạ bậc lượng giác</b> quen thuộc ở phổ thông:
            $$\cos^2(\alpha) = \frac{1 + \cos(2\alpha)}{2}$$
          </li>
        </ul>
      </div>

      <div id="b2-sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Tính hàm mật độ xác suất $|\Psi(x,t)|^2$ bằng cách nhân hàm sóng $\Psi(x,t)$ với liên hợp phức $\Psi^*(x,t)$ của nó (coi $A$ là số thực dương):</span>
          $$|\Psi(x,t)|^2 = \big[A\cos(n\pi x)e^{-j\omega t}\big] \cdot \big[A\cos(n\pi x)e^{+j\omega t}\big] = A^2 \cos^2(n\pi x)$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Thay biểu thức $|\Psi(x,t)|^2$ vào tích phân điều kiện chuẩn hóa của đề bài:</span>
          $$\int_{-1/2}^{+1/2} A^2 \cos^2(n\pi x)\,dx = 1$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Áp dụng công thức lượng giác hạ bậc $\cos^2(n\pi x) = \frac{1 + \cos(2n\pi x)}{2}$ để đưa về tích phân cơ bản:</span>
          $$A^2 \int_{-1/2}^{+1/2} \frac{1 + \cos(2n\pi x)}{2}\,dx = 1$$
          $$\frac{A^2}{2} \left[ x + \frac{\sin(2n\pi x)}{2n\pi} \right]_{-1/2}^{+1/2} = 1$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 4: Thay cận trên $x = +\frac{1}{2}$ và cận dưới $x = -\frac{1}{2}$ vào. Vì $n$ là số nguyên ($n \ne 0$), nên $\sin\left(2n\pi \cdot \frac{1}{2}\right) = \sin(n\pi) = 0$ và $\sin(-n\pi) = 0$:</span>
          $$\frac{A^2}{2} \left[ \left(\frac{1}{2} - \left(-\frac{1}{2}\right)\right) + \frac{\sin(n\pi) - \sin(-n\pi)}{2n\pi} \right] = 1$$
          $$\frac{A^2}{2} \left[ 1 + 0 \right] = 1 \implies \frac{A^2}{2} = 1 \implies A^2 = 2$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 5: Lấy căn bậc hai của $A^2 = 2$ để kết luận giá trị của hệ số chuẩn hóa $A$:</span>
          $$A = \sqrt{2} \quad (\text{hoặc } A = \pm\sqrt{2})$$
          <span class="cmt">// (Lưu ý nhỏ: Trong trường hợp đặc biệt nếu $n = 0$ thì $\cos(0) = 1 \implies \int_{-1/2}^{+1/2} A^2 dx = A^2 = 1 \implies A = 1$. Còn với mọi số nguyên $n = \pm 1, \pm 2, \pm 3, \dots$ thì kết quả chuẩn là $A = \sqrt{2}$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 5 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau5">Câu 5: Tính Xác suất Tìm thấy Hạt từ Hàm sóng</h3>
      <p><b>Đề bài:</b> Nghiệm của Schrödinger equation trong một trường hợp được cho bởi:
      $$\psi(x) = \sqrt{\frac{2}{a_0}}\,e^{-x/a_0}$$
      Hãy xác định xác suất tìm thấy hạt trong các khoảng:<br>
      a) $0 \le x \le \frac{a_0}{4}$<br>
      b) $\frac{a_0}{4} \le x \le \frac{a_0}{2}$<br>
      c) $0 \le x \le a_0$</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint5')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol5')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint5" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Bước 1:</b> Bình phương hàm sóng để tìm hàm mật độ xác suất $|\psi(x)|^2$. Nhớ quy tắc lũy thừa: $\left(e^{-x/a_0}\right)^2 = e^{-2x/a_0}$, nên:
            $$|\psi(x)|^2 = \frac{2}{a_0}\,e^{-2x/a_0}$$
          </li>
          <li><b>Bước 2:</b> Áp dụng công thức nguyên hàm hàm mũ cơ bản: $\int e^{kx}\,dx = \frac{1}{k}e^{kx}$. Do đó, với bất kỳ đoạn $[x_1, x_2]$ nào, xác suất tìm thấy hạt luôn tính gọn thành:
            $$P(x_1 \le x \le x_2) = \int_{x_1}^{x_2} \frac{2}{a_0}e^{-2x/a_0}\,dx = \left[ -e^{-2x/a_0} \right]_{x_1}^{x_2} = e^{-2x_1/a_0} - e^{-2x_2/a_0}$$
          </li>
        </ul>
      </div>

      <div id="b2-sol5" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước mở đầu: Lập công thức tích phân xác suất tổng quát trên đoạn $[x_1, x_2]$:</b>
          <span class="cmt">// Bước 1: Tính hàm mật độ xác suất $|\psi(x)|^2$ bằng cách bình phương hai vế của hàm sóng $\psi(x)$:</span>
          $$|\psi(x)|^2 = \left(\sqrt{\frac{2}{a_0}}\,e^{-x/a_0}\right)^2 = \frac{2}{a_0}\,e^{-2x/a_0}$$
          <span class="cmt">// Bước 2: Tính tích phân của $|\psi(x)|^2$ từ cận dưới $x_1$ đến cận trên $x_2$. Vì đạo hàm của $e^{-2x/a_0}$ theo $x$ là $-\frac{2}{a_0}e^{-2x/a_0}$, nên nguyên hàm của $\frac{2}{a_0}e^{-2x/a_0}$ chính là $-e^{-2x/a_0}$:</span>
          $$P(x_1 \le x \le x_2) = \int_{x_1}^{x_2} \frac{2}{a_0}\,e^{-2x/a_0}\,dx = \Big[ -e^{-2x/a_0} \Big]_{x_1}^{x_2} = e^{-2x_1/a_0} - e^{-2x_2/a_0}$$
        </div>

        <div class="step">
          <b>a) Xác suất tìm thấy hạt trong khoảng $0 \le x \le \frac{a_0}{4}$:</b>
          <span class="cmt">// Thay cận dưới $x_1 = 0$ và cận trên $x_2 = \frac{a_0}{4}$ vào công thức tổng quát vừa tìm được:</span>
          $$P_a = e^{-2(0)/a_0} - e^{-2(a_0/4)/a_0} = e^0 - e^{-1/2} = 1 - e^{-0.5}$$
          <span class="cmt">// Bấm máy tính với $e^{-0.5} \approx 0.6065$:</span>
          $$P_a \approx 1 - 0.6065 = \mathbf{0.3935} \quad (\text{hay } \mathbf{39.35\%})$$
        </div>

        <div class="step">
          <b>b) Xác suất tìm thấy hạt trong khoảng $\frac{a_0}{4} \le x \le \frac{a_0}{2}$:</b>
          <span class="cmt">// Thay cận dưới $x_1 = \frac{a_0}{4}$ và cận trên $x_2 = \frac{a_0}{2}$ vào công thức tổng quát:</span>
          $$P_b = e^{-2(a_0/4)/a_0} - e^{-2(a_0/2)/a_0} = e^{-0.5} - e^{-1}$$
          <span class="cmt">// Bấm máy tính với $e^{-0.5} \approx 0.6065$ và $e^{-1} \approx 0.3679$:</span>
          $$P_b \approx 0.6065 - 0.3679 = \mathbf{0.2386} \quad (\text{hay } \mathbf{23.86\%})$$
        </div>

        <div class="step">
          <b>c) Xác suất tìm thấy hạt trong khoảng $0 \le x \le a_0$:</b>
          <span class="cmt">// Thay cận dưới $x_1 = 0$ và cận trên $x_2 = a_0$ vào công thức tổng quát:</span>
          $$P_c = e^{-2(0)/a_0} - e^{-2(a_0)/a_0} = e^0 - e^{-2} = 1 - e^{-2}$$
          <span class="cmt">// Bấm máy tính với $e^{-2} \approx 0.1353$:</span>
          $$P_c \approx 1 - 0.1353 = \mathbf{0.8647} \quad (\text{hay } \mathbf{86.47\%})$$
        </div>
      </div>
    </div>
  </section>

    <ul>
      <li><b>Lượng tử ánh sáng & Quang điện:</b> Năng lượng truyền theo từng gói rời rạc $E = h\nu = \frac{hc}{\lambda}$. Động năng cực đại của quang electron là $T_{\text{max}} = h\nu - \Phi$.</li>

      <li><b>Hàm sóng Schrödinger & Mật độ xác suất:</b> $|\Psi(x,t)|^2 = |\psi(x)|^2$ là mật độ xác suất tìm thấy hạt. Tổng tích phân xác suất trên toàn miền tồn tại của hạt luôn bằng $1$ (Điều kiện chuẩn hóa).</li>

    <div class="box key"><b>Mục 1 — Nhớ</b><ul><li>Nghiệm là <b>sóng phẳng</b> $\psi=Ae^{jkx}+Be^{-jkx}$. Số sóng $k=\dfrac{\sqrt{2mE}}{\hbar}$, động lượng $p=\hbar k$.</li><li>$E=\dfrac{\hbar^2k^2}{2m}$ nhận <b>mọi giá trị</b> (năng lượng liên tục, không lượng tử hóa).</li><li>$k\gt0$: sóng chạy về phía $+x$. $k\lt0$: chạy về phía $-x$.</li></ul></div>

    <div class="next"><b>Tiếp theo:</b> Electron tự do có năng lượng tùy ý. Nếu ta <i>nhốt</i> nó lại thì chuyện gì thay đổi? Mục 2 trả lời.</div>

    <div class="bridge"><b>Nối từ Mục 1:</b> Electron tự do có thể có mọi năng lượng. Bây giờ thêm hai bức tường để nhốt nó.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Đây là lý do nguyên tử có các mức năng lượng <i>rời rạc</i>. Giếng thế cũng là hình mẫu đơn giản nhất của một electron bị giam trong nguyên tử hoặc trong lớp bán dẫn mỏng.</div>

    <p>Chuyện gì xảy ra nếu ta không cho electron chạy tự do nữa, mà nhốt nó vào giữa hai bức tường thế năng cao vô tận ($V = \infty$) đặt tại $x = 0$ và $x = a$, còn ở đáy giếng ($0 < x < a$) thì thế năng bằng không ($V = 0$)?</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Dây đàn Guitar bị kẹp chặt ở hai đầu</b><br>
      Khi một sợi dây đàn guitar dài $a$ được cột chặt ở hai đầu ($x=0$ và $x=a$), hai đầu dây bắt buộc phải đứng yên (biên độ $= 0$). Do đó, dây đàn không thể rung với bước sóng tùy ý, mà chiều dài sợi dây $a$ bắt buộc phải chứa đúng một số nguyên lần <b>nửa bước sóng</b> ($a = n\frac{\lambda}{2}$, tức 1 bụng sóng, 2 bụng sóng, 3 bụng sóng...).<br>
      Hạt electron bị nhốt trong giếng thế vô hạn cũng giống hệt sợi dây đàn đó: sóng vật chất của nó bị phản xạ qua lại tạo thành <b>sóng dừng</b> và chỉ được phép tồn tại ở những <b>mức năng lượng rời rạc $E_n$</b>!
    </div>

    <h3>2.1. Giải phương trình Schrödinger & Sự lượng tử hóa năng lượng</h3>

    <ul>
      <li><b>Ở Vùng I ($x \le 0$) và Vùng III ($x \ge a$):</b> Vì thế năng $V(x) = \infty$, hạt không thể tồn tại ở ngoài giếng nên $\psi(x) = 0$.</li>
      <li><b>Ở Vùng II trong giếng ($0 \le x \le a$):</b> Thế năng $V(x) = 0$, phương trình Schrödinger có nghiệm dạng lượng giác:
        $$\psi(x) = A_1\cos(kx) + A_2\sin(kx) \qquad \text{với } k = \frac{\sqrt{2mE}}{\hbar}$$
      </li>
      <li><b>Áp dụng điều kiện biên liên tục của hàm sóng:</b>
        <ol>
          <li>Tại vách trái $x = 0$: $\psi(0) = 0 \implies A_1\cos(0) + A_2\sin(0) = 0 \implies \mathbf{A_1 = 0}$ (loại bỏ hàm $\cos$).</li>
          <li>Tại vách phải $x = a$: $\psi(a) = 0 \implies A_2\sin(ka) = 0$. Vì $A_2$ không thể bằng $0$ (nếu $A_2=0$ thì không có hạt nào trong giếng!), nên bắt buộc:
            $$\sin(ka) = 0 \implies ka = n\pi \implies \mathbf{k_n = \frac{n\pi}{a}} \quad (n = 1, 2, 3, \dots)$$
          </li>
        </ol>
      </li>
      <li><b>Hàm sóng chuẩn hóa và Mức năng lượng lượng tử hóa $E_n$:</b> Từ điều kiện chuẩn hóa $\int_0^a |\psi_n(x)|^2dx = 1$, ta tìm được $A_2 = \sqrt{\frac{2}{a}}$, và thay $k_n = \frac{n\pi}{a}$ vào $E = \frac{\hbar^2 k^2}{2m}$:
        <div class="f">
          $$\psi_n(x) = \sqrt{\frac{2}{a}}\sin\left(\frac{n\pi x}{a}\right) \qquad \text{và} \qquad \mathbf{E_n = \frac{n^2\pi^2\hbar^2}{2ma^2} = \frac{n^2 h^2}{8ma^2}} \quad (n = 1, 2, 3, \dots)$$
        </div>
      </li>
    </ul>

    
    <div class="box analogy"><b>Ví dụ số nhanh:</b> Với electron, $E_1\approx\dfrac{37.6\text{ eV·Å}^2}{a^2}$. Giếng rộng $a=10\text{ Å}$ cho $E_1\approx0.38\text{ eV}$. Giếng hẹp lại còn $a=5\text{ Å}$ thì $E_1\approx1.5\text{ eV}$, tức tăng $4$ lần (vì $E\propto1/a^2$).</div>
<h3>2.2. Mô hình tương tác: Giếng thế vô hạn — Mức năng lượng $E_n$, Hàm sóng $\psi_n$ & Xác suất $|\psi_n|^2$</h3>

    <div class="bridge"><b>Nối từ Mục 2:</b> Vách giếng bây giờ chỉ cao $V_0$ hữu hạn. Một hạt có $E\lt V_0$ liệu có bị chặn hoàn toàn?</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Xuyên hầm là hiệu ứng có thật trong linh kiện: dòng rò qua lớp oxit mỏng, diode tunnel, bộ nhớ flash. Nó chỉ xảy ra vì hạt là sóng.</div>

    <p>Bây giờ ta xét trường hợp thực tế hơn: bức tường thế năng không cao vô cùng nữa mà chỉ có độ cao hữu hạn $V_0$. Chuyện gì xảy ra khi một hạt electron có tổng năng lượng $E$ nhỏ hơn chiều cao bức tường ($E < V_0$) bay từ trái sang phải đập vào bức tường?</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Ném quả bóng tennis vào bức tường gạch vs. Ánh sáng xuyên qua lớp sương mù</b><br>
      • <b>Theo cơ học cổ điển:</b> Nếu em đá quả bóng có năng lượng $E = 2.8\text{ eV}$ vào bậc thềm cao $V_0 = 3.5\text{ eV}$ ($E < V_0$), quả bóng chắc chắn bật ngược lại $100\%$ ngay tại mép tường ($x=0$), tuyệt đối không bao giờ lún sâu vào trong bê tông dù chỉ $1\text{ mm}$.<br>
      • <b>Theo cơ học lượng tử:</b> Vì electron là một <b>sóng</b>, khi đập vào bậc thế năng hữu hạn $V_0$, hàm sóng không thể đứt gãy đột ngột về $0$ tại $x=0$. Nó sẽ <b>thấm sâu vào bên trong vùng tường một đoạn ngắn theo quy luật hàm mũ suy giảm $e^{-k_2 x}$</b>! Và nếu bức tường đủ mỏng (chỉ dày vài Angstrom), cái đuôi sóng chưa kịp tắt hẳn đã chạm tới mặt bên kia của bức tường và tiếp tục truyền đi — tạo ra hiện tượng <b>Xuyên hầm lượng tử (Quantum Tunneling)</b>!
    </div>

    <h3>3.1. Bậc thế năng (Step Potential) khi $E < V_0$</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Vách thực tế không cao vô hạn. Khi vách hữu hạn thì sóng không dừng đột ngột ở vách.</li><li><b>Dùng để làm gì:</b> Biết rằng khi $E\lt V_0$, hàm sóng trong vách giảm theo hàm mũ $e^{-k_2x}$ thay vì bằng 0.</li><li><b>Liên hệ với phần khác:</b> Đây là cầu nối tới xuyên hầm ở 3.3: chỉ cần vách đủ mỏng thì phần sóng còn sót lại sang được bên kia.</li></ul></div>

0.0 L390.0,100.0 L393.0,100.0 L396.0,100.0 L399.0,100.0" style="fill:none;stroke:var(--c2);stroke-width:3;fill-opacity:1"/><text x="15" y="96" text-anchor="end" style="fill:var(--mut);font-size:12px;font-weight:400">E</text><text x="110" y="170" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:400">V = 0</text><text x="305" y="50" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">V₀</text><text x="305" y="125" text-anchor="middle" style="fill:var(--c2);font-size:12px;font-weight:400">ψ ∝ e^(−k₂x): suy giảm</text></svg><figcaption>Bậc thế khi E &lt; V₀: sóng không dừng đột ngột mà thấm vào vách rồi tắt dần.</figcaption></figure>

    <ul>
      <li><b>Vùng I ($x \le 0$, nơi $V = 0$):</b> Gồm sóng tới ($A_1$) truyền theo chiều $+x$ và sóng phản xạ ($B_1$) truyền ngược lại theo chiều $-x$:
        $$\psi_1(x) = A_1 e^{jk_1 x} + B_1 e^{-jk_1 x} \qquad \text{với } k_1 = \frac{\sqrt{2mE}}{\hbar}$$
      </li>
      <li><b>Vùng II ($x \ge 0$, bên trong bậc thế nơi $V = V_0 > E$):</b> Phương trình Schrödinger đổi dấu thành $\frac{d^2\psi_2}{dx^2} - k_2^2\psi_2 = 0$, có nghiệm hàm mũ thực:
        $$\psi_2(x) = A_2 e^{-k_2 x} + B_2 e^{+k_2 x} \qquad \text{với } \mathbf{k_2 = \frac{\sqrt{2m(V_0 - E)}}{\hbar}}$$
        Vì khi $x \to +\infty$, hàm sóng $\psi_2(x)$ phải hữu hạn (không được bùng nổ ra vô cùng), nên bắt buộc hệ số của $e^{+k_2 x}$ phải bằng không ($\mathbf{B_2 = 0}$). Vậy hàm sóng và mật độ xác suất trong vùng biên $x \ge 0$ suy giảm theo hàm mũ:
        <div class="f">
          $$\psi_2(x) = A_2 e^{-k_2 x} \implies \mathbf{|\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}} \implies \mathbf{\frac{|\psi_2(x)|^2}{|\psi_2(0)|^2} = e^{-2k_2 x}}$$
        </div>
      </li>
    </ul>

    <p>Nếu bức tường thế năng $V_0$ chỉ dày một đoạn hữu hạn từ $x = 0$ đến $x = a$ (còn phía bên kia bức tường $x > a$, thế năng lại trở về $V = 0$), thì tại mép phải $x = a$, biên độ hàm sóng vẫn còn khác không! Sóng thoát sang Vùng III ($x > a$) trở lại dạng sóng phẳng truyền đi: $\psi_3(x) = A_3 e^{jk_1 x}$ (không có sóng phản xạ $B_3 e^{-jk_1 x}$ trong Vùng III vì hạt đã vượt qua rào đi ra xa vô tận không có gì chắn để bật ngược lại).</p>
    <p>Khi $E \ll V_0$ (hoặc tích $k_2 a$ đủ lớn), <b>Hệ số truyền qua hay Xác suất xuyên hầm $T$ (Tunneling probability)</b> được tính bằng công thức xấp xỉ chuẩn:</p>
    <div class="f">
      $$\mathbf{T \approx 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)e^{-2k_2 a}} \qquad \text{với } k_2 = \frac{\sqrt{2m^*(V_0 - E)}}{\hbar}$$
    </div>
    <div class="box legend"><b>Đọc công thức xuyên hầm</b><ul><li>$16\dfrac{E}{V_0}\left(1-\dfrac{E}{V_0}\right)$: hệ số cỡ đơn vị, phụ thuộc hạt có năng lượng gần đỉnh rào hay không.</li><li>$e^{-2k_2a}$: <b>nhân tử quyết định</b>. $a$ (độ dày) và $k_2$ (rào cao, hạt nặng) càng lớn thì $T$ giảm càng mạnh.</li><li>$k_2=\dfrac{\sqrt{2m^*(V_0-E)}}{\hbar}$ với $m^*$: khối lượng hiệu dụng của electron trong bán dẫn (Buổi 4).</li></ul></div>

  <section>
    <h2>4. Mở Rộng Cho Nguyên Tử 1-Electron (Hydro), Các Số Lượng Tử & Bảng Tuần Hoàn</h2>
    <div class="bridge"><b>Nối từ Mục 3:</b> Thay vì tường nhân tạo, bây giờ electron bị giữ bởi lực hút của hạt nhân.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Giải thích vì sao Si có đúng 4 electron hóa trị (Buổi 1) và từ đó vì sao các mức rời rạc của từng nguyên tử sẽ tách thành dải ở Buổi 4.</div>

    <p>Trong nguyên tử Hydro, 1 hạt electron (điện tích $-e$) chuyển động trong không gian 3 chiều xung quanh 1 hạt nhân proton đứng yên (điện tích $+e$) dưới tác dụng của thế năng hút tĩnh điện Coulomb:</p>
    <div class="f">
      $$V(r) = -\frac{e^2}{4\pi\epsilon_0 r}$$
      <small>Trong đó: $r$ là khoảng cách từ electron đến hạt nhân; $\epsilon_0 = 8.85 \times 10^{-12}\text{ F/m}$ là hằng số điện môi của chân không.</small>
    </div>
    <div class="box legend"><b>Đọc thế năng Coulomb</b><ul><li>$e$: điện tích electron; $r$: khoảng cách tới hạt nhân.</li><li>$\epsilon_0=8.85\times10^{-12}\text{ F/m}$: hằng số điện môi chân không.</li><li>Dấu trừ nghĩa là lực hút: càng gần hạt nhân thì thế năng càng thấp.</li></ul></div>

    <p>Vì thế năng $V(r)$ có tính đối xứng cầu, ta giải phương trình Schrödinger trong <b>hệ tọa độ cầu $(r, \theta, \phi)$</b> bằng phương pháp tách biến $\psi(r,\theta,\phi) = R(r)\cdot\Theta(\theta)\cdot\Phi(\phi)$. Điều kiện biên tuần hoàn và đơn trị của 3 hàm không gian sinh ra <b>3 số lượng tử hình học $(n, l, m)$</b>, cộng thêm tính chất tự quay nội tại của electron sinh ra <b>số lượng tử Spin $(s)$</b>:</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Địa chỉ chỗ ngồi trong Nhà hát Lớn</b><br>
      Mỗi electron trong nguyên tử đều có một "vé chỗ ngồi" gồm 4 thông số không ai được trùng ai (<b>Nguyên lý loại trừ Pauli</b>):<br>
      • <b>Số lượng tử chính $n = 1, 2, 3, \dots$</b> giống như <b>Số Tầng lầu</b> (quyết định mức năng lượng $E_n$ và độ xa tính từ sân khấu hạt nhân).<br>
      • <b>Số lượng tử quỹ đạo/góc $l = 0, 1, 2, \dots, (n-1)$</b> giống như <b>Khu vực ghế (Hạng s, p, d, f)</b> trên tầng đó (quyết định hình dáng đám mây xác suất: $l=0$ là hình cầu $s$, $l=1$ là hình quả tạ đôi $p$).<br>
      • <b>Số lượng tử từ $m = -l, \dots, 0, \dots, +l$</b> giống như <b>Số phòng/hướng ghế</b> trong khu vực đó (có $2l+1$ hướng trong không gian).<br>
      • <b>Số lượng tử Spin $s = +\frac{1}{2}$ hoặc $-\frac{1}{2}$</b> giống như trong mỗi phòng có đúng <b>2 chiếc ghế đơn</b> (một ghế quay mặt lên $\uparrow$, một ghế quay mặt xuống $\downarrow$).
    </div>

    <div class="tw">
      <table>
        <tr><th>Tên số lượng tử</th><th>Ký hiệu</th><th>Giá trị cho phép</th><th>Ý nghĩa vật lý trọng tâm</th></tr>
        <tr><td><b>1. Số lượng tử chính</b><br>(Principal)</td><td><span class="k b1">$n$</span></td><td>$n = 1, 2, 3, \dots$</td><td>Xác định <b>mức năng lượng</b> và bán kính trung bình của lớp vỏ (shell):<br>$$E_n = -\frac{m_0 e^4}{(4\pi\epsilon_0)^2 2\hbar^2 n^2} = -\frac{13.58}{n^2}\text{ eV}$$</td></tr>
        <tr><td><b>2. Số lượng tử quỹ đạo / góc</b><br>(Azimuthal / Angular)</td><td><span class="k b2">$l$</span></td><td>$l = 0, 1, 2, \dots, (n-1)$</td><td>Xác định moment động lượng quỹ đạo và <b>hình dạng đám mây orbital</b>:<br>$l=0 \to s$; $l=1 \to p$; $l=2 \to d$; $l=3 \to f$.</td></tr>
        <tr><td><b>3. Số lượng tử từ</b><br>(Magnetic)</td><td><span class="k b3">$m$</span></td><td>$m = -l, \dots, 0, \dots, +l$<br>($2l+1$ giá trị)</td><td>Xác định <b>sự định hướng không gian</b> của đám mây electron khi đặt trong từ trường ngoài (từ nghiệm $\Phi(\phi)=e^{jm\phi}$ đơn trị).</td></tr>
        <tr><td><b>4. Số lượng tử Spin</b><br>(Electron Spin)</td><td><span class="k b4">$s$</span></td><td>$s = +\frac{1}{2}$ hoặc $-\frac{1}{2}$</td><td>Moment động lượng <b>tự quay nội tại</b> của electron.</td></tr>
      </table>
    </div>

    <p>Ở trạng thái cơ bản thấp nhất ($n=1, l=0, m=0$), hàm sóng đối xứng cầu là $\psi_{100} = \frac{1}{\sqrt{\pi a_0^3}}e^{-r/a_0}$. Khoảng cách có xác suất tìm thấy electron cao nhất chính là <b>Bán kính Bohr $a_0 = \frac{4\pi\epsilon_0\hbar^2}{m_0 e^2} \approx 0.529\text{ Å}$</b>. Hãy bấm vào các tab dưới đây để xem sự phân bố đám mây electron và quy tắc xếp electron vào Bảng tuần hoàn theo Nguyên lý loại trừ Pauli:</p>

    </div>
  
    <div class="box key"><b>Mục 4 — Nhớ</b><ul><li>Mỗi trạng thái electron có <b>4 số lượng tử</b> $(n,l,m,s)$.</li><li><b>Nguyên lý Pauli:</b> không có hai electron nào cùng bộ 4 số lượng tử.</li><li>Mức năng lượng hydro $E_n=-\dfrac{13.6}{n^2}\text{ eV}$: chỉ phụ thuộc $n$, và cũng rời rạc.</li></ul></div>

    <div class="next"><b>Tiếp theo:</b> Gom lại các công thức (Mục 5) rồi luyện bài tập (Mục 6).</div>
</section>

  <section>
    <h2>5. Cẩm Nang Công Thức Trọng Tâm Buổi 3 (Giải Nghĩa Chi Tiết)</h2>
    <div class="bridge"><b>Nối từ Mục 1–4:</b> Mỗi mục tương ứng một công thức.</div>

    <div class="tw"><table><tr><th>Tình huống</th><th>Công thức</th></tr><tr><td>Electron tự do: sóng, $k$, $E$</td><td>Công thức 1</td></tr><tr><td>Giếng vô hạn: mức $E_n$, hàm sóng $\psi_n$</td><td>Công thức 2</td></tr><tr><td>Đâm xuyên vào bậc thế khi $E\lt V_0$</td><td>Công thức 3</td></tr><tr><td>Xuyên hầm qua rào dày $a$</td><td>Công thức 4</td></tr></table></div>


    <div class="formula-card">
      <h3>Công thức 1: Sóng phẳng của Electron tự do ($V(x) = 0$)</h3>
      <div class="f key">
        $$\Psi(x,t) = A\,e^{j(kx - \omega t)} \quad \Big| \quad v_p = \frac{\omega}{|k|} \quad \Big| \quad \lambda = \frac{2\pi}{|k|} \quad \Big| \quad p = \hbar k \quad \Big| \quad E = \frac{p^2}{2m} = \frac{\hbar^2 k^2}{2m}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $k$: Số sóng ($\text{m}^{-1}$ hoặc $\text{rad/m}$). Nếu $k > 0$ sóng chạy theo chiều $+x$; nếu $k < 0$ sóng chạy theo chiều $-x$.<br>
          • $\omega$: Tần số góc ($\text{rad/s}$).<br>
          • $v_p$: Vận tốc pha của sóng ($\text{m/s}$).<br>
          • $\lambda$: Bước sóng de Broglie ($\text{m}$ hoặc $\text{Å}$).<br>
          • $p$: Động lượng của hạt ($\text{kg}\cdot\text{m/s}$); $E$: Động năng ($\text{J}$ hoặc $\text{eV}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Khi thế năng $V(x)=0$, nghiệm của phương trình Schrödinger là sóng điều hòa phẳng có số sóng $k$ tỉ lệ thuận với động lượng $p$.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 1</b> khi đề bài cho hàm sóng phẳng $\Psi(x,t) = Ae^{j(kx-\omega t)}$ biết $k$ và $\omega$.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 2: Mức năng lượng & Hàm sóng trong Giếng thế Vô hạn 1 chiều</h3>
      <div class="f key">
        $$E_n = \frac{n^2 \pi^2 \hbar^2}{2 m a^2} = \frac{n^2 h^2}{8 m a^2} \qquad \text{và} \qquad \psi_n(x) = \sqrt{\frac{2}{a}}\sin\left(\frac{n\pi x}{a}\right) \quad (n = 1, 2, 3, \dots)$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $E_n$: Mức năng lượng cho phép thứ $n$ ($\text{J}$, chia cho $1.6 \times 10^{-19}$ để đổi ra $\text{eV}$).<br>
          • $n = 1, 2, 3, \dots$: Số lượng tử chính (số nguyên dương).<br>
          • $a$: Chiều rộng của giếng thế (bắt buộc đổi từ $\text{Å}$ sang mét: $1\text{ Å} = 10^{-10}\text{ m}$).<br>
          • $m = 9.11 \times 10^{-31}\text{ kg}$: Khối lượng electron.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Do hàm sóng phải triệt tiêu tại hai vách giếng $\psi(0)=\psi(a)=0$, nên chỉ những bước sóng thỏa mãn $k_n a = n\pi$ mới tồn tại được. Lưu ý: Tính được $E_1$ rồi thì chỉ cần nhân $n^2$ ($E_2 = 4E_1$, $E_3 = 9E_1$)!<br>
          • <b>Khi nào dùng:</b> Khi đề bài nói <i>"electron bị giam trong giếng thế vô hạn một chiều có chiều rộng $a$"</i> (như <b>Câu 2</b>).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 3: Độ suy giảm xác suất trong Bậc thế năng ($E < V_0$)</h3>
      <div class="f key">
        $$k_2 = \frac{\sqrt{2m(V_0 - E)}}{\hbar} \qquad \text{và} \qquad \frac{|\psi_2(x)|^2}{|\psi_2(0)|^2} = e^{-2k_2 x}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $V_0$: Chiều cao của rào thế bậc ($\text{J}$, nhớ đổi từ $\text{eV}$ sang $\text{J}$ bằng cách nhân $1.6 \times 10^{-19}$).<br>
          • $E$: Động năng của hạt chiếu tới ($\text{J}$).<br>
          • $k_2$: Hệ số suy giảm biên độ trong vùng biên ($\text{m}^{-1}$).<br>
          • $x$: Khoảng cách tính từ mép biên đi sâu vào trong rào thế ($\text{m}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Vì hàm sóng trong vùng $E < V_0$ có dạng $\psi_2(x) = A_2 e^{-k_2 x}$, nên mật độ xác suất $|\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}$ (lưu ý có <b>số 2</b> ở trên mũ $-2k_2 x$ do bình phương hàm sóng!).<br>
          • <b>Khi nào dùng:</b> Khi đề bài yêu cầu tính <i>"xác suất tương đối tìm thấy electron tại khoảng cách $x$ bên trong vùng biên so với tại mép biên $x=0$"</i> (như <b>Câu 3</b>).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 4: Xác suất Xuyên hầm (Tunneling Probability $T$) qua Rào thế hình chữ nhật</h3>
      <div class="f key">
        $$T \approx 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)e^{-2k_2 a} \qquad \text{với } k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $T$: Xác suất xuyên hầm (không có đơn vị, nằm từ $0$ đến $1$).<br>
          • $a$: Chiều rộng (độ dày) của rào thế hình chữ nhật ($\text{m}$).<br>
          • $m^*$: Khối lượng hiệu dụng của hạt dẫn trong chất bán dẫn ($\text{kg}$), ví dụ $m^* = 0.067 m_0$ hoặc $m^* = 1.08 m_0$ với $m_0 = 9.11 \times 10^{-31}\text{ kg}$.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Đo tỷ lệ dòng hạt xuyên qua được bức tường thế năng có độ dày $a$ để sang vùng bên kia. Vì $k_2$ và $a$ nằm trên số mũ âm $e^{-2k_2 a}$, nên chỉ cần khối lượng $m^*$ hoặc bề rộng $a$ tăng lên một chút là xác suất xuyên hầm $T$ giảm đi cực mạnh!<br>
          • <b>Khi nào dùng:</b> Giải các bài toán tìm <i>"xác suất xuyên hầm (tunneling probability)"</i> qua rào thế chữ nhật (như <b>Câu 4</b>).
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>6. Bài Tập Trọng Tâm Buổi 3 (Có Gợi Ý & Giải Chi Tiết Từng Bước)</h2>
    <div class="bridge"><b>Nối từ Mục 5:</b> Mỗi câu luyện một môi trường $V(x)$.</div>

    <div class="tw"><table><tr><th>Câu</th><th>Luyện</th><th>Công thức</th></tr><tr><td>1</td><td>Sóng phẳng electron tự do</td><td>1</td></tr><tr><td>2</td><td>Ba mức năng lượng đầu trong giếng vô hạn</td><td>2</td></tr><tr><td>3</td><td>Xác suất đâm xuyên vào bậc thế</td><td>3</td></tr><tr><td>4</td><td>Xuyên hầm trong GaAs và Si</td><td>4</td></tr><tr><td>5</td><td>Giếng bất đối xứng</td><td>Giải lại phương trình Schrödinger</td></tr></table></div>

    <div class="box key"><b>Cách làm chung Buổi 3</b><ol><li>Xác định $V(x)$ ở từng miền.</li><li>Chọn dạng nghiệm (sóng chạy, sóng dừng, hay hàm mũ).</li><li>Đổi eV ↔ J và Å ↔ m trước khi thế số.</li><li>Kiểm tra: xác suất nằm trong khoảng $0$ đến $1$.</li></ol></div>

    <p>Dưới đây là toàn bộ 5 bài tập trong phiếu Bài tập Trọng tâm Buổi 3. Ở mỗi bước tính toán, thầy đều ghi chú thích màu xám giải thích rõ lý do biến đổi và cách đổi đơn vị để em tự học dễ dàng nhất.</p>

    <!-- CÂU 1 BUỔI 3 -->
    <div class="formula-card">
      <h3 id="b3-cau1">Câu 1: Sóng phẳng của Electron trong Không gian Tự do</h3>
      <p><b>Đề bài:</b> Một electron trong không gian tự do được mô tả bởi hàm sóng dạng sóng phẳng (plane wave):
      $$\Psi(x,t) = A\,e^{j(kx - \omega t)}$$
      a) Với $k = 8 \times 10^8\text{ m}^{-1}$, $\omega = 8 \times 10^{12}\text{ rad/s}$, hãy xác định:<br>
      &nbsp;&nbsp;1. Vận tốc pha (phase velocity) và bước sóng (wavelength).<br>
      &nbsp;&nbsp;2. Động lượng và động năng của electron.<br>
      b) Lặp lại với: $k = -1.5 \times 10^9\text{ m}^{-1}$, $\omega = 1.5 \times 10^{13}\text{ rad/s}$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint1" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý 1 (Vận tốc pha và Bước sóng):</b> Dùng công thức sóng cơ bản $v_p = \frac{\omega}{|k|}$ (hoặc xét dấu vận tốc pha từ phương trình $kx - \omega t = \text{const} \implies v_p = \frac{dx}{dt} = \frac{\omega}{k}$) và công thức bước sóng $\lambda = \frac{2\pi}{|k|}$.</li>
          <li><b>Ý 2 (Động lượng và Động năng):</b> Dùng công thức lượng tử $p = \hbar k$ (với $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$) và công thức động năng $E = \frac{p^2}{2m_0} = \frac{\hbar^2 k^2}{2m_0}$ (nhớ đổi ra cả đơn vị $\text{J}$ và $\text{eV}$).</li>
          <li><b>Lưu ý ở câu b:</b> Khi $k = -1.5 \times 10^9\text{ m}^{-1} < 0$, dấu trừ cho biết sóng phẳng và hạt electron đang chuyển động theo <b>chiều âm của trục $x$ (hướng $-x$)</b>. Độ lớn bước sóng $\lambda$ và động năng $E$ luôn dương!</li>
        </ul>
      </div>

      <div id="b3-sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>a) Trường hợp 1: $k = 8 \times 10^8\text{ m}^{-1}$ và $\omega = 8 \times 10^{12}\text{ rad/s}$:</b>
          <span class="cmt">// Bước 1.1: Tính vận tốc pha (phase velocity $v_p$). Xét một điểm có pha sóng không đổi $kx - \omega t = \text{hằng số}$, lấy đạo hàm theo thời gian $t$ ta có $k\frac{dx}{dt} - \omega = 0 \implies v_p = \frac{dx}{dt} = \frac{\omega}{k}$:</span>
          $$v_p = \frac{\omega}{k} = \frac{8 \times 10^{12}\text{ rad/s}}{8 \times 10^8\text{ m}^{-1}} = \mathbf{10^4\text{ m/s}} \quad (\text{truyền theo chiều } +x)$$
          <span class="cmt">// Bước 1.2: Tính bước sóng $\lambda$ từ số sóng $k$ theo công thức $\lambda = \frac{2\pi}{k}$ (đổi thêm sang đơn vị $\text{nm}$ và $\text{Å}$):</span>
          $$\lambda = \frac{2\pi}{k} = \frac{2\pi}{8 \times 10^8\text{ m}^{-1}} \approx \mathbf{7.854 \times 10^{-9}\text{ m}} = 7.854\text{ nm} = \mathbf{78.54\text{ Å}}$$
          <span class="cmt">// Bước 2.1: Tính động lượng $p$ của electron theo hệ thức de Broglie dạng thu gọn $p = \hbar k$ (với $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$):</span>
          $$p = \hbar k = \left(1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right) \times \left(8 \times 10^8\text{ m}^{-1}\right) = \mathbf{8.432 \times 10^{-26}\text{ kg}\cdot\text{m/s}}$$
          <span class="cmt">// Bước 2.2: Tính động năng $E$ của electron từ động lượng $p$ và khối lượng nghỉ $m_0 = 9.11 \times 10^{-31}\text{ kg}$ theo công thức $E = \frac{p^2}{2m_0}$:</span>
          $$E = \frac{p^2}{2m_0} = \frac{\left(8.432 \times 10^{-26}\text{ kg}\cdot\text{m/s}\right)^2}{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right)} = \frac{7.110 \times 10^{-51}}{1.822 \times 10^{-30}} \approx \mathbf{3.902 \times 10^{-21}\text{ J}}$$
          <span class="cmt">// Bước 2.3: Đổi động năng $E$ từ đơn vị Joule ($\text{J}$) sang đơn vị chuẩn bán dẫn Electron-Volt ($\text{eV}$) bằng cách chia cho $1.6 \times 10^{-19}$:</span>
          $$E = \frac{3.902 \times 10^{-21}\text{ J}}{1.6 \times 10^{-19}\text{ J/eV}} \approx \mathbf{0.0244\text{ eV}} = \mathbf{24.4\text{ meV}}$$
        </div>

        <div class="step">
          <b>b) Trường hợp 2: $k = -1.5 \times 10^9\text{ m}^{-1}$ và $\omega = 1.5 \times 10^{13}\text{ rad/s}$:</b>
          <span class="cmt">// Bước 1.1: Nhận xét dấu của số sóng $k$: Vì $k < 0$, pha sóng có dạng $-(1.5 \times 10^9 x + 1.5 \times 10^{13} t)$, nghĩa là sóng phẳng và hạt electron đang di chuyển ngược theo chiều âm của trục $x$ (hướng $-x$). Ta tính vận tốc pha:</span>
          $$v_p = \frac{\omega}{k} = \frac{1.5 \times 10^{13}\text{ rad/s}}{-1.5 \times 10^9\text{ m}^{-1}} = \mathbf{-10^4\text{ m/s}} \quad \left(\text{độ lớn } |v_p| = 10^4\text{ m/s}, \text{ hướng theo chiều } -x\right)$$
          <span class="cmt">// Bước 1.2: Tính bước sóng $\lambda$ (bước sóng là độ dài hình học nên luôn lấy giá trị tuyệt đối $|k|$):</span>
          $$\lambda = \frac{2\pi}{|k|} = \frac{2\pi}{1.5 \times 10^9\text{ m}^{-1}} \approx \mathbf{4.189 \times 10^{-9}\text{ m}} = 4.189\text{ nm} = \mathbf{41.89\text{ Å}}$$
          <span class="cmt">// Bước 2.1: Tính động lượng $p = \hbar k$ (dấu âm thể hiện vector động lượng hướng theo chiều $-x$):</span>
          $$p = \hbar k = \left(1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right) \times \left(-1.5 \times 10^9\text{ m}^{-1}\right) = \mathbf{-1.581 \times 10^{-25}\text{ kg}\cdot\text{m/s}} \quad \left(|p| = 1.581 \times 10^{-25}\text{ kg}\cdot\text{m/s}\right)$$
          <span class="cmt">// Bước 2.2: Tính động năng $E = \frac{p^2}{2m_0}$ và đổi sang đơn vị $\text{eV}$:</span>
          $$E = \frac{p^2}{2m_0} = \frac{\left(-1.581 \times 10^{-25}\text{ kg}\cdot\text{m/s}\right)^2}{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right)} = \frac{2.500 \times 10^{-50}}{1.822 \times 10^{-30}} \approx \mathbf{1.372 \times 10^{-20}\text{ J}}$$
          $$E = \frac{1.372 \times 10^{-20}\text{ J}}{1.6 \times 10^{-19}\text{ J/eV}} \approx \mathbf{0.0857\text{ eV}} = \mathbf{85.7\text{ meV}}$$
        </div>
      </div>
    </div>

    <!-- CÂU 2 BUỔI 3 -->
    <div class="formula-card">
      <h3 id="b3-cau2">Câu 2: Ba Mức Năng Lượng Đầu Tiên Trong Giếng Thế Vô Hạn</h3>
      <p><b>Đề bài:</b> Một electron bị giam trong giếng thế vô hạn một chiều có chiều rộng: $a = 75\text{ Å}$. Xác định ba mức năng lượng: $n = 1, 2, 3$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint2" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Đổi bề rộng giếng thế từ Angstrom sang mét: $a = 75\text{ Å} = 75 \times 10^{-10}\text{ m} = 7.5 \times 10^{-9}\text{ m}$.</li>
          <li>Áp dụng công thức năng lượng lượng tử hóa trong giếng thế vô hạn 1 chiều:
            $$E_n = \frac{n^2 \pi^2 \hbar^2}{2 m_0 a^2}$$
          </li>
          <li>Tính thật chuẩn mức cơ bản $E_1$ (ứng với $n=1$) theo đơn vị $\text{eV}$, sau đó suy ra nhanh $E_2 = 2^2 E_1 = 4E_1$ và $E_3 = 3^2 E_1 = 9E_1$.</li>
        </ul>
      </div>

      <div id="b3-sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Đổi chiều rộng giếng thế $a = 75\text{ Å}$ sang đơn vị chuẩn SI là mét ($\text{m}$):</span>
          $$a = 75\text{ Å} = 75 \times 10^{-10}\text{ m} = 7.5 \times 10^{-9}\text{ m}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Viết công thức tính mức năng lượng lượng tử hóa thứ $n$ của electron ($m_0 = 9.11 \times 10^{-31}\text{ kg}$, $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$) trong giếng thế vô hạn 1 chiều:</span>
          $$E_n = \frac{n^2 \pi^2 \hbar^2}{2 m_0 a^2}$$
          <span class="cmt">// Bước 3: Thay số vào để tính mức năng lượng cơ bản $E_1$ (với $n = 1$) theo đơn vị Joule ($\text{J}$):</span>
          $$E_1 = \frac{1^2 \times \pi^2 \times \left(1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right)^2}{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right) \times \left(7.5 \times 10^{-9}\text{ m}\right)^2} = \frac{1.0966 \times 10^{-67}}{1.0249 \times 10^{-46}} \approx 1.070 \times 10^{-21}\text{ J}$$
          <span class="cmt">// Bước 4: Đổi mức năng lượng $E_1$ sang đơn vị Electron-Volt ($\text{eV}$) bằng cách chia cho $1.6 \times 10^{-19}$:</span>
          $$E_1 = \frac{1.070 \times 10^{-21}\text{ J}}{1.6 \times 10^{-19}\text{ J/eV}} \approx \mathbf{6.69 \times 10^{-3}\text{ eV}} = \mathbf{6.69\text{ meV}}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 5: Vì $E_n = n^2 E_1$, ta nhân $E_1$ lần lượt với $2^2 = 4$ và $3^2 = 9$ để tìm nhanh mức năng lượng thứ hai ($n=2$) và thứ ba ($n=3$):</span>
          $$\text{• Với } n = 1: \quad E_1 = \mathbf{6.69 \times 10^{-3}\text{ eV}} \quad (\approx 6.69\text{ meV})$$
          $$\text{• Với } n = 2: \quad E_2 = 2^2 \times E_1 = 4 \times \left(6.69 \times 10^{-3}\text{ eV}\right) = \mathbf{2.68 \times 10^{-2}\text{ eV}} \quad (\approx 26.8\text{ meV})$$
          $$\text{• Với } n = 3: \quad E_3 = 3^2 \times E_1 = 9 \times \left(6.69 \times 10^{-3}\text{ eV}\right) = \mathbf{6.02 \times 10^{-2}\text{ eV}} \quad (\approx 60.2\text{ meV})$$
        </div>
      </div>
    </div>

    <!-- CÂU 3 BUỔI 3 -->
    <div class="formula-card">
      <h3 id="b3-cau3">Câu 3: Xác Suất Tìm Thấy Electron Đâm Xuyên Vào Bậc Thế Năng</h3>
      <p><b>Đề bài:</b> Một electron có động năng (kinetic energy): $E = 2.8\text{ eV}$ đập vào một rào thế dạng bậc (step potential) có chiều cao: $V_0 = 3.5\text{ eV}$. Tính xác suất tương đối tìm thấy electron tại các khoảng cách:<br>
      a) $5\text{ Å}$<br>
      b) $15\text{ Å}$<br>
      c) $40\text{ Å}$<br>
      bên trong vùng biên (barrier), so với mật độ xác suất tương đối (probability density) của electron tại mép biên.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint3" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Vì động năng $E = 2.8\text{ eV}$ nhỏ hơn chiều cao bậc thế $V_0 = 3.5\text{ eV}$, hàm sóng bên trong vùng biên ($x \ge 0$) có dạng hàm mũ suy giảm: $\psi_2(x) = A_2 e^{-k_2 x}$.</li>
          <li>Tính hệ số suy giảm $k_2 = \frac{\sqrt{2m_0(V_0 - E)}}{\hbar}$. Lưu ý: Phải đổi hiệu năng lượng $V_0 - E = 3.5 - 2.8 = 0.7\text{ eV}$ ra đơn vị Joule ($\times 1.6 \times 10^{-19}$) trước khi khai căn!</li>
          <li>Tỷ số mật độ xác suất tại vị trí $x$ so với tại mép biên ($x = 0$) là:
            $$P_{\text{rel}}(x) = \frac{|\psi_2(x)|^2}{|\psi_2(0)|^2} = \frac{|A_2|^2 e^{-2k_2 x}}{|A_2|^2 e^0} = e^{-2k_2 x}$$
          </li>
        </ul>
      </div>

      <div id="b3-sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước mở đầu: Tính hệ số suy giảm $k_2$ bên trong vùng rào thế bậc ($x \ge 0$):</b>
          <span class="cmt">// Bước 1: Tính phần chênh lệch thế năng $V_0 - E$ và đổi từ đơn vị $\text{eV}$ sang đơn vị chuẩn Joule ($\text{J}$):</span>
          $$V_0 - E = 3.5\text{ eV} - 2.8\text{ eV} = 0.7\text{ eV} = 0.7 \times \left(1.6 \times 10^{-19}\text{ J}\right) = 1.12 \times 10^{-19}\text{ J}$$
          <span class="cmt">// Bước 2: Thay $V_0 - E$, khối lượng electron $m_0 = 9.11 \times 10^{-31}\text{ kg}$ và $\hbar = 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$ vào công thức tính $k_2$:</span>
          $$k_2 = \frac{\sqrt{2 m_0 (V_0 - E)}}{\hbar} = \frac{\sqrt{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right) \times \left(1.12 \times 10^{-19}\text{ J}\right)}}{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}$$
          $$k_2 = \frac{\sqrt{2.04064 \times 10^{-49}}}{1.054 \times 10^{-34}} = \frac{4.5173 \times 10^{-25}}{1.054 \times 10^{-34}} \approx \mathbf{4.286 \times 10^9\text{ m}^{-1}}$$
          <span class="cmt">// Bước 3: Lập biểu thức tỷ số mật độ xác suất tương đối tại tọa độ $x$ so với tại mép biên $x = 0$. Vì $\psi_2(x) = A_2 e^{-k_2 x}$ nên mật độ xác suất là $|\psi_2(x)|^2 = |A_2|^2 e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(x)|^2}{|\psi_2(0)|^2} = \frac{|A_2|^2 e^{-2k_2 x}}{|A_2|^2} = e^{-2k_2 x}$$
        </div>

        <div class="step">
          <b>a) Tại khoảng cách $x = 5\text{ Å} = 5 \times 10^{-10}\text{ m}$:</b>
          <span class="cmt">// Thay $x = 5 \times 10^{-10}\text{ m}$ và $k_2 = 4.286 \times 10^9\text{ m}^{-1}$ vào hàm mũ $e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(5\text{ Å})|^2}{|\psi_2(0)|^2} = \exp\Big[-2 \times \left(4.286 \times 10^9\text{ m}^{-1}\right) \times \left(5 \times 10^{-10}\text{ m}\right)\Big] = e^{-4.286} \approx \mathbf{0.0138} \quad (\text{hay } \mathbf{1.38\%})$$
        </div>

        <div class="step">
          <b>b) Tại khoảng cách $x = 15\text{ Å} = 15 \times 10^{-10}\text{ m}$:</b>
          <span class="cmt">// Thay $x = 15 \times 10^{-10}\text{ m}$ vào biểu thức $e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(15\text{ Å})|^2}{|\psi_2(0)|^2} = \exp\Big[-2 \times \left(4.286 \times 10^9\text{ m}^{-1}\right) \times \left(15 \times 10^{-10}\text{ m}\right)\Big] = e^{-12.858} \approx \mathbf{2.61 \times 10^{-6}} \quad (\text{hay } \mathbf{0.000261\%})$$
        </div>

        <div class="step">
          <b>c) Tại khoảng cách $x = 40\text{ Å} = 40 \times 10^{-10}\text{ m}$:</b>
          <span class="cmt">// Thay $x = 40 \times 10^{-10}\text{ m}$ vào biểu thức $e^{-2k_2 x}$:</span>
          $$\frac{|\psi_2(40\text{ Å})|^2}{|\psi_2(0)|^2} = \exp\Big[-2 \times \left(4.286 \times 10^9\text{ m}^{-1}\right) \times \left(40 \times 10^{-10}\text{ m}\right)\Big] = e^{-34.288} \approx \mathbf{1.29 \times 10^{-15}}$$
          <span class="cmt">// Nhận xét vật lý: Chỉ cần đi sâu vào trong rào thế $40\text{ Å}$ ($4\text{ nm}$), xác suất tìm thấy electron đã giảm xuống gần như bằng $0$ ($1.29 \times 10^{-15}$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 4 BUỔI 3 -->
    <div class="formula-card">
      <h3 id="b3-cau4">Câu 4: Xác Suất Xuyên Hầm Lượng Tử Trong GaAs và Silicon</h3>
      <p><b>Đề bài:</b> Một hạt có động năng (kinetic energy): $E = 0.20\text{ eV}$ xuyên qua một rào thế hình chữ nhật (rectangular potential barrier) có chiều cao $V_0 = 0.8\text{ eV}$ và chiều rộng $a = 15\text{ Å}$.<br>
      a) Xác định xác suất xuyên hầm (tunneling probability) nếu khối lượng hiệu dụng (effective mass) tương ứng electron trong $\text{GaAs}$: $m^* = 0.067 m_0$.<br>
      b) Lặp lại với: $m^* = 1.08 m_0$ tương ứng electron trong silicon.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint4" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Sử dụng công thức tính xác suất xuyên hầm qua rào thế chữ nhật:
            $$T \approx 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)e^{-2k_2 a}$$
          </li>
          <li>Tính hệ số đứng trước hàm mũ dùng chung cho cả 2 câu: $\frac{E}{V_0} = \frac{0.20}{0.80} = 0.25 \implies 16 \times 0.25 \times (1 - 0.25) = 3$.</li>
          <li>Tính hệ số suy giảm $k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar}$ riêng cho từng loại vật liệu (nhớ thay $m^* = 0.067 m_0$ ở câu a và $m^* = 1.08 m_0$ ở câu b).</li>
        </ul>
      </div>

      <div id="b3-sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước chuẩn bị chung cho cả hai ý (a) và (b):</b>
          <span class="cmt">// Bước 1: Đổi bề rộng rào thế $a = 15\text{ Å}$ sang mét và tính hiệu năng lượng $V_0 - E$ sang đơn vị Joule:</span>
          $$a = 15\text{ Å} = 15 \times 10^{-10}\text{ m} = 1.5 \times 10^{-9}\text{ m}$$
          $$V_0 - E = 0.8\text{ eV} - 0.20\text{ eV} = 0.6\text{ eV} = 0.6 \times \left(1.6 \times 10^{-19}\text{ J}\right) = 9.6 \times 10^{-20}\text{ J}$$
          <span class="cmt">// Bước 2: Tính thừa số tiền hàm mũ $16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right)$ trong công thức xác suất xuyên hầm $T$:</span>
          $$\frac{E}{V_0} = \frac{0.20\text{ eV}}{0.80\text{ eV}} = 0.25 \implies 16\left(\frac{E}{V_0}\right)\left(1 - \frac{E}{V_0}\right) = 16 \times 0.25 \times (1 - 0.25) = 16 \times 0.25 \times 0.75 = \mathbf{3}$$
          <span class="cmt">// Như vậy, công thức tính xác suất xuyên hầm rút gọn lại rất đẹp là: $T = 3\,e^{-2k_2 a}$.</span>
        </div>

        <div class="step">
          <b>a) Đối với electron trong $\text{GaAs}$ có khối lượng hiệu dụng $m^* = 0.067 m_0$:</b>
          <span class="cmt">// Bước 1: Tính hệ số suy giảm $k_2$ với $m^* = 0.067 \times 9.11 \times 10^{-31}\text{ kg} \approx 6.1037 \times 10^{-32}\text{ kg}$:</span>
          $$k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar} = \frac{\sqrt{2 \times \left(0.067 \times 9.11 \times 10^{-31}\text{ kg}\right) \times \left(9.6 \times 10^{-20}\text{ J}\right)}}{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}$$
          $$k_2 = \frac{\sqrt{1.1719 \times 10^{-50}}}{1.054 \times 10^{-34}} = \frac{1.0825 \times 10^{-25}}{1.054 \times 10^{-34}} \approx \mathbf{1.027 \times 10^9\text{ m}^{-1}}$$
          <span class="cmt">// Bước 2: Tính tích số $2 k_2 a$ ở trên số mũ:</span>
          $$2 k_2 a = 2 \times \left(1.027 \times 10^9\text{ m}^{-1}\right) \times \left(1.5 \times 10^{-9}\text{ m}\right) \approx 3.081$$
          <span class="cmt">// Bước 3: Thay vào công thức $T = 3\,e^{-2k_2 a}$ để tìm xác suất xuyên hầm trong $\text{GaAs}$:</span>
          $$T_{\text{GaAs}} = 3 \times e^{-3.081} \approx 3 \times 0.0459 = \mathbf{0.138} \quad (\text{hay } \mathbf{13.8\%})$$
          <span class="cmt">// (Ghi chú nâng cao: Nếu tính theo công thức chính xác tuyệt đối không dùng xấp xỉ $E \ll V_0$, tức $T_{\text{exact}} = \left[1 + \frac{\sinh^2(k_2 a)}{4(E/V_0)(1-E/V_0)}\right]^{-1}$, thì $T_{\text{exact}} \approx \mathbf{0.120}$ hay $12.0\%$).</span>
        </div>

        <div class="step">
          <b>b) Đối với electron trong Silicon có khối lượng hiệu dụng $m^* = 1.08 m_0$:</b>
          <span class="cmt">// Bước 1: Tính hệ số suy giảm $k_2$ với $m^* = 1.08 \times 9.11 \times 10^{-31}\text{ kg} \approx 9.8388 \times 10^{-31}\text{ kg}$:</span>
          $$k_2 = \frac{\sqrt{2 m^* (V_0 - E)}}{\hbar} = \frac{\sqrt{2 \times \left(1.08 \times 9.11 \times 10^{-31}\text{ kg}\right) \times \left(9.6 \times 10^{-20}\text{ J}\right)}}{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}$$
          $$k_2 = \frac{\sqrt{1.8890 \times 10^{-49}}}{1.054 \times 10^{-34}} = \frac{4.3463 \times 10^{-25}}{1.054 \times 10^{-34}} \approx \mathbf{4.124 \times 10^9\text{ m}^{-1}}$$
          <span class="cmt">// Bước 2: Tính tích số $2 k_2 a$ ở trên số mũ:</span>
          $$2 k_2 a = 2 \times \left(4.124 \times 10^9\text{ m}^{-1}\right) \times \left(1.5 \times 10^{-9}\text{ m}\right) \approx 12.371$$
          <span class="cmt">// Bước 3: Thay vào công thức $T = 3\,e^{-2k_2 a}$ để tìm xác suất xuyên hầm trong Silicon:</span>
          $$T_{\text{Si}} = 3 \times e^{-12.371} \approx 3 \times \left(4.24 \times 10^{-6}\right) \approx \mathbf{1.27 \times 10^{-5}}$$
          <span class="cmt">// Kết luận so sánh: Chỉ vì khối lượng hiệu dụng của electron trong Silicon lớn hơn trong GaAs khoảng 16 lần ($1.08$ so với $0.067$), xác suất xuyên hầm đã giảm mạnh từ $13.8\%$ xuống chỉ còn $1.27 \times 10^{-5}$ (giảm hơn $10\,000$ lần!).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 5 BUỔI 3 -->
    <div class="formula-card">
      <h3 id="b3-cau5">Câu 5: Khảo Sát Giếng Thế Bất Đối Xứng (Figure P2.40)</h3>

      <p><b>Đề bài:</b> Xét hàm thế một chiều như Figure P2.40:<br>
      • Vùng I: $x < 0$, $V(x) = V_0$<br>
      • Vùng II: $0 < x < a$, $V(x) = 0$<br>
      • Vùng III: $x > a$, $V(x) = \infty$<br>
      Giả sử năng lượng toàn phần của electron thỏa mãn: $E < V_0$. Yêu cầu:<br>
      a) Viết các nghiệm sóng trong từng vùng.<br>
      b) Viết hệ phương trình thu được khi áp dụng các điều kiện biên.<br>
      c) Giải thích vì sao các mức năng lượng của electron bị lượng tử hóa.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b3-hint5')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b3-sol5')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b3-hint5" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý a (Viết nghiệm 3 vùng):</b>
            + Vùng I ($x < 0$, nơi $V = V_0 > E$): Nghiệm tổng quát là $A_1 e^{k_1 x} + B_1 e^{-k_1 x}$. Vì khi $x \to -\infty$, hàm $e^{-k_1 x} \to +\infty$ (vô lý), nên phải loại bỏ số hạng $B_1 e^{-k_1 x}$ ($B_1 = 0$), chỉ giữ lại $\psi_1(x) = A_1 e^{k_1 x}$.<br>
            + Vùng II ($0 < x < a$, nơi $V = 0$): Nghiệm dao động điều hòa $\psi_2(x) = A_2\sin(k_2 x) + B_2\cos(k_2 x)$.<br>
            + Vùng III ($x > a$, nơi $V = \infty$): Thế năng bằng vô cùng nên hạt không thể xâm nhập: $\psi_3(x) = 0$.
          </li>
          <li><b>Ý b (Điều kiện biên):</b> Tại biên $x = 0$ (thế năng hữu hạn $V_0$), cả $\psi$ và đạo hàm $\frac{d\psi}{dx}$ đều liên tục. Tại biên $x = a$ (thế năng nhảy lên $\infty$), chỉ có hàm sóng $\psi$ liên tục ($\psi_2(a) = \psi_3(a) = 0$), còn đạo hàm bậc nhất không liên tục!</li>
          <li><b>Ý c (Giải thích lượng tử hóa):</b> Khử các hằng số $A_1, A_2, B_2$ từ 3 phương trình điều kiện biên sẽ dẫn tới một phương trình siêu việt chỉ phụ thuộc vào $E$ (cụ thể là $k_2\cot(k_2 a) = -k_1$). Phương trình này chỉ có nghiệm tại các giá trị $E$ rời rạc!</li>
        </ul>
      </div>

      <div id="b3-sol5" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>a) Viết các nghiệm hàm sóng trong từng vùng (với $E < V_0$):</b>
          <span class="cmt">// • Xét Vùng I ($x < 0$, có $V(x) = V_0 > E$): Phương trình Schrödinger có dạng $\frac{d^2\psi_1}{dx^2} - k_1^2\psi_1 = 0$, với $k_1 = \frac{\sqrt{2m(V_0 - E)}}{\hbar}$. Nghiệm tổng quát là $\psi_1(x) = A_1 e^{k_1 x} + B_1 e^{-k_1 x}$. Tuy nhiên, khi $x \to -\infty$ thì $e^{-k_1 x} \to +\infty$. Để hàm sóng hữu hạn khi $x \to -\infty$, ta bắt buộc có $B_1 = 0$:</span>
          $$\text{Vùng I } (x < 0): \quad \mathbf{\psi_1(x) = A_1 e^{k_1 x}} \qquad \text{với } k_1 = \frac{\sqrt{2m(V_0 - E)}}{\hbar}$$
          <span class="cmt">// • Xét Vùng II ($0 < x < a$, có $V(x) = 0 < E$): Phương trình Schrödinger có dạng $\frac{d^2\psi_2}{dx^2} + k_2^2\psi_2 = 0$, với $k_2 = \frac{\sqrt{2mE}}{\hbar}$. Nghiệm tổng quát trong giếng là hàm lượng giác:</span>
          $$\text{Vùng II } (0 < x < a): \quad \mathbf{\psi_2(x) = A_2\sin(k_2 x) + B_2\cos(k_2 x)} \qquad \text{với } k_2 = \frac{\sqrt{2mE}}{\hbar}$$
          <span class="cmt">// • Xét Vùng III ($x > a$, có $V(x) = \infty$): Vì thế năng bằng vô cùng, hạt không thể tồn tại ở vùng $x > a$, nên hàm sóng bằng không tại mọi điểm:</span>
          $$\text{Vùng III } (x > a): \quad \mathbf{\psi_3(x) = 0}$$
        </div>

        <div class="step">
          <b>b) Hệ phương trình thu được khi áp dụng các điều kiện biên tại $x = 0$ và $x = a$:</b>
          <span class="cmt">// Bước 1: Tại biên $x = 0$ (ngăn cách giữa thế năng hữu hạn $V_0$ và $0$), cả hàm sóng $\psi(x)$ lẫn đạo hàm bậc nhất $\frac{d\psi(x)}{dx}$ đều phải liên tục:</span>
          $$\text{1. Tính liên tục của hàm sóng tại } x = 0: \quad \psi_1(0) = \psi_2(0) \implies \mathbf{A_1 = B_2} \quad (1)$$
          $$\text{2. Tính liên tục của đạo hàm tại } x = 0: \quad \left.\frac{d\psi_1}{dx}\right|_{x=0} = \left.\frac{d\psi_2}{dx}\right|_{x=0} \implies \mathbf{k_1 A_1 = k_2 A_2} \quad (2)$$
          <span class="cmt">// Bước 2: Tại biên $x = a$ (nơi thế năng nhảy vọt lên $V = \infty$), hàm sóng $\psi(x)$ phải liên tục và bằng $0$ (lưu ý: đạo hàm bậc nhất KHÔNG liên tục tại vách thế vô hạn):</span>
          $$\text{3. Tính liên tục của hàm sóng tại } x = a: \quad \psi_2(a) = \psi_3(a) = 0 \implies \mathbf{A_2\sin(k_2 a) + B_2\cos(k_2 a) = 0} \quad (3)$$
        </div>

        <div class="step">
          <b>c) Giải thích vì sao các mức năng lượng của electron bị lượng tử hóa:</b>
          <span class="cmt">// Bước 1: Biến đổi đại số từ hệ 3 phương trình biên (1), (2), (3) để khử các hệ số biên độ $A_1, A_2, B_2$. Từ (1) và (2) ta rút ra $B_2 = A_1$ và $A_2 = \frac{k_1}{k_2}A_1$, rồi thế vào phương trình (3):</span>
          $$A_1\left[\frac{k_1}{k_2}\sin(k_2 a) + \cos(k_2 a)\right] = 0$$
          <span class="cmt">// Bước 2: Để tồn tại hạt electron trong giếng thì biên độ $A_1 \ne 0$, do đó biểu thức trong ngoặc vuông bắt buộc phải bằng $0$:</span>
          $$\tan(k_2 a) = -\frac{k_2}{k_1} = -\sqrt{\frac{E}{V_0 - E}}$$
          <span class="cmt">// Bước 3: Kết luận bản chất vật lý: Vì hạt electron bị giam giữ (bound state) giữa vách thế vô hạn tại $x = a$ và rào thế cao $V_0 > E$ tại $x = 0$, sóng vật chất của electron bị phản xạ qua lại tạo thành sóng dừng. Các điều kiện biên ở hai đầu tạo ra phương trình ràng buộc $\tan(k_2 a) = -\frac{k_2}{k_1}$ chỉ chứa duy nhất biến số năng lượng $E$. Chỉ những giá trị năng lượng $E$ rời rạc, xác định thỏa mãn phương trình siêu việt này mới cho phép hàm sóng tồn tại — nghĩa là năng lượng của electron bị lượng tử hóa!</span>
        </div>
      </div>
    </div>
  </section>

  <section class="sum">
    <h2>Tổng Kết Buổi 3: Những Điểm Cốt Lõi Cần Nhớ</h2>
    <ul>
      <li><b>Hạt tự do ($V=0$):</b> Năng lượng $E = \frac{\hbar^2 k^2}{2m}$ liên tục (không bị lượng tử hóa); sóng phẳng chạy theo chiều $+x$ khi $k > 0$ và theo chiều $-x$ khi $k < 0$.</li>
      <li><b>Hạt bị giam trong Giếng thế ($E < V_{\text{vách}}$):</b> Phản xạ qua lại tạo sóng dừng khiến <b>năng lượng bị lượng tử hóa thành các mức rời rạc</b>. Trong giếng vô hạn bề rộng $a$: $E_n = \frac{n^2\pi^2\hbar^2}{2ma^2}$.</li>
      <li><b>Đâm xuyên & Xuyên hầm lượng tử ($E < V_0$):</b> Hàm sóng không bằng $0$ ngay tại vách thế hữu hạn mà suy giảm theo hàm mũ $\psi_2(x) \propto e^{-k_2 x}$ (mật độ xác suất giảm theo $e^{-2k_2 x}$). Nếu rào đủ mỏng, hạt xuyên hầm qua rào với xác suất $T \approx 16\frac{E}{V_0}\left(1-\frac{E}{V_0}\right)e^{-2k_2 a}$.</li>
      <li><b>Nguyên tử 1-electron & Nguyên lý Pauli:</b> Mỗi trạng thái lượng tử được xác định bởi 4 số lượng tử $(n, l, m, s)$. Không có 2 electron nào trong cùng hệ có cùng bộ 4 số lượng tử $(n, l, m, s)$.</li>
    </ul>
  
    <div class="next"><b>Sang Buổi 4:</b> Mỗi nguyên tử riêng lẻ có mức năng lượng rời rạc. Trong tinh thể có $5\times10^{22}$ nguyên tử đặt sát nhau mỗi cm³, các mức này sẽ biến thành <b>dải năng lượng</b>.</div>
</section>

  <section>
    <h2>1. Sự Hình Thành Dải Năng Lượng & Mô Hình Kronig-Penney</h2>
    <div class="box why"><b>Học phần này để làm gì?</b> Giải thích <i>vì sao</i> có vùng cấm $E_g$. Vùng cấm quyết định vật liệu là kim loại, bán dẫn hay cách điện.</div>

    <p>Ở Buổi 3, chúng ta đã biết một nguyên tử cô lập (đứng một mình) có các mức năng lượng hoàn toàn rời rạc ($1s, 2s, 2p, 3s, 3p\dots$). Nhưng trong một tinh thể Silicon thực tế (Buổi 1), có tới $5 \times 10^{22}$ nguyên tử đứng sát cạnh nhau trong mỗi $\text{cm}^3$! Khi các nguyên tử tiến lại gần nhau, điều kỳ diệu gì sẽ xảy ra với các mức năng lượng rời rạc đó?</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Những ngôi nhà riêng lẻ gộp thành Tòa chung cư khổng lồ</b><br>
      Em hãy tưởng tượng mỗi nguyên tử Silicon cô lập là một <b>ngôi nhà 3 tầng</b> đứng cách xa nhau. Mỗi ngôi nhà đều có tầng 3 ở độ cao y hệt nhau (ví dụ cao $10\text{ m}$).<br>
      Nhưng khi $N$ ngôi nhà tiến lại sát vách nhau để gộp thành một <b>hệ thống chung cư liên thông</b>, theo <b>Nguyên lý loại trừ Pauli</b>, không được phép có 2 căn phòng (trạng thái lượng tử) nào trùng khít độ cao năng lượng của nhau! Hệ quả là hàng tỷ mức năng lượng từng bằng nhau ở độ cao $10\text{ m}$ buộc phải <b>tách nhẹ ra thành hàng tỷ bậc thang nằm sát rạt nhau</b> (ví dụ từ $9.5\text{ m}$ đến $10.5\text{ m}$). Vì hàng tỷ vạch này nằm quá sát nhau (chỉ cách nhau khoảng $10^{-19}\text{ eV}$), mắt thường nhìn vào sẽ thấy chúng tạo thành một <b>Dải năng lượng liên tục (Allowed Energy Band)</b>, ngăn cách với dải khác bởi một khoảng trống không có bậc thang nào gọi là <b>Dải cấm (Forbidden Bandgap - $E_g$)</b>!
    </div>

    <h3>1.1. Sự tách mức năng lượng trong tinh thể Silicon</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 204" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><line x1="40" y1="180" x2="400" y2="180" style="stroke:var(--mut);stroke-width:1.5" marker-end="url(#fa)"/><text x="390" y="196" text-anchor="end" style="fill:var(--mut);font-size:11px;font-weight:400">khoảng cách giữa các nguyên tử r →</text><text x="40" y="196" text-anchor="start" style="fill:var(--mut);font-size:11px;font-weight:400">r nhỏ</text><polygon points="400.0,60.0 300.0,52.0 170.0,100.0 300.0,70.0" style="fill:var(--c1);stroke:var(--c1);stroke-width:0;fill-opacity:0.25"/><polygon points="400.0,140.0 300.0,132.0 170.0,100.0 300.0,148.0" style="fill:var(--c5);stroke:var(--c5);stroke-width:0;fill-opacity:0.25"/><polygon points="170.0,100.0 110.0,50.0 40.0,36.0 40.0,92.0 110.0,100.0" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.4"/><polygon points="170.0,100.0 110.0,108.0 40.0,116.0 40.0,172.0 110.0,150.0" style="fill:var(--c5);stroke:var(--c5);stroke-width:2;fill-opacity:0.4"/><line x1="400" y1="60" x2="400" y2="60" style="stroke:var(--mut);stroke-width:2"/><text x="398" y="50" text-anchor="end" style="fill:var(--c1);font-size:12px;font-weight:700">3p</text><text x="398" y="160" text-anchor="end" style="fill:var(--c5);font-size:12px;font-weight:700">3s</text><text x="75" y="64" text-anchor="middle" style="fill:var(--c1);font-size:12px;font-weight:700">dải dẫn</text><text x="75" y="145" text-anchor="middle" style="fill:var(--c5);font-size:12px;font-weight:700">dải hóa trị</text><line x1="25" y1="92" x2="25" y2="116" style="stroke:var(--c4);stroke-width:2" marker-end="url(#fa)"/><line x1="25" y1="116" x2="25" y2="92" style="stroke:var(--c4);stroke-width:2" marker-end="url(#fa)"/><text x="26" y="106" text-anchor="end" style="fill:var(--c4);font-size:11px;font-weight:700">E_g</text><text x="170" y="92" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">lai hóa</text><text x="305" y="40" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">mức rời rạc</text></svg><figcaption>Minh họa định tính: khi các nguyên tử lại gần, mức rộng thành dải, rồi lai hóa và tách thành dải dẫn và dải hóa trị.</figcaption></figure>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Buổi 3 xét một nguyên tử riêng lẻ. Trong tinh thể, các nguyên tử ở rất gần nên các mức năng lượng ảnh hưởng lẫn nhau.</li><li><b>Dùng để làm gì:</b> Hiểu rằng mỗi mức rời rạc tách thành $N$ mức sát nhau, tạo thành một <b>dải</b>.</li><li><b>Liên hệ với phần khác:</b> 1.2 dùng toán học để chứng minh dải và vùng cấm.</li></ul></div>

    <figure class="fig fr"><svg viewBox="0 0 420 160" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><text x="80" y="20" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:700">1 nguyên tử</text><line x1="50" y1="55" x2="110" y2="55" style="stroke:var(--c1);stroke-width:3"/><line x1="50" y1="125" x2="110" y2="125" style="stroke:var(--c1);stroke-width:3"/><text x="210" y="20" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:700">2 nguyên tử</text><line x1="180" y1="49" x2="240" y2="49" style="stroke:var(--c1);stroke-width:3"/><line x1="180" y1="61" x2="240" y2="61" style="stroke:var(--c1);stroke-width:3"/><line x1="180" y1="119" x2="240" y2="119" style="stroke:var(--c1);stroke-width:3"/><line x1="180" y1="131" x2="240" y2="131" style="stroke:var(--c1);stroke-width:3"/><text x="340" y="20" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:700">N nguyên tử</text><rect x="310" y="39" width="60" height="32" rx="3" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.3"/><rect x="310" y="109" width="60" height="32" rx="3" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.3"/><text x="340" y="92" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">vùng cấm</text><line x1="15" y1="150" x2="15" y2="35" style="stroke:var(--mut);stroke-width:2" marker-end="url(#fa)"/><text x="12" y="28" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:400">E</text></svg><figcaption>Càng nhiều nguyên tử gần nhau, mỗi mức tách thành càng nhiều mức, cuối cùng thành dải.</figcaption></figure>

    <p>Mỗi nguyên tử Silicon ($Z=14$) có cấu hình $1s^2 2s^2 2p^6 \mathbf{3s^2 3p^2}$. Hai lớp trong cùng ($n=1, 2$) đã đầy kín. Ở lớp ngoài cùng ($n=3$): phân lớp $3s$ có $2$ chỗ ngồi (chứa 2 electron) và phân lớp $3p$ có $6$ chỗ ngồi (chỉ mới có 2 electron). Tổng cộng mỗi nguyên tử có <b>$8$ chỗ ngồi ngoài cùng nhưng chỉ có $4$ electron hóa trị</b>.</p>
    <p>Khi $N$ nguyên tử Silicon tiến lại gần nhau tới khoảng cách mạng cân bằng $r = a_0$:</p>
    <ul>
      <li>Tổng cộng $2N$ trạng thái $3s$ và $6N$ trạng thái $3p$ (tổng là $8N$ trạng thái) ban đầu trộn lẫn vào nhau, sau đó <b>tách đôi thành hai dải riêng biệt</b> ngăn cách bởi độ rộng vùng cấm $E_g$!</li>
      <li><span class="k b1">Dải Hóa trị (Valence Band - Dưới)</span> Chứa đúng $4N$ trạng thái lượng tử. Ở nhiệt độ tuyệt đối $T = 0\text{ K}$, toàn bộ $4N$ electron hóa trị rơi hết xuống lấp đầy kín $100\%$ dải này.</li>
      <li><span class="k b2">Dải Dẫn (Conduction Band - Trên)</span> Cũng chứa $4N$ trạng thái lượng tử nhưng ở $T = 0\text{ K}$ thì <b>hoàn toàn trống rỗng ($0$ electron)</b>.</li>
      <li><span class="k b4">Vùng cấm / Dải cấm (Bandgap $E_g$)</span> Khoảng năng lượng nằm giữa đỉnh dải hóa trị ($E_v$) và đáy dải dẫn ($E_c$): $E_g = E_c - E_v$. Trong vùng cấm, không tồn tại bất kỳ trạng thái lượng tử nào để electron đứng vào!</li>
    </ul>

    <figure class="fig fl"><svg viewBox="0 0 420 184" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><path d="M20,130 H60 V70 H80 V130 H120 V70 H140 V130 H180 V70 H200 V130 H240 V70 H260 V130 H300 V70 H320 V130 H360 V70 H380 V130 H400" style="fill:none;stroke:var(--c5);stroke-width:3;fill-opacity:1"/><line x1="20" y1="155" x2="80" y2="155" style="stroke:var(--mut);stroke-width:1.5" marker-end="url(#fa)"/><text x="50" y="172" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:400">a (chu kỳ)</text><line x1="60" y1="52" x2="80" y2="52" style="stroke:var(--c4);stroke-width:1.5" marker-end="url(#fa)"/><text x="70" y="40" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">b</text><text x="10" y="75" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:700">V₀</text><text x="110" y="148" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">V = 0</text></svg><figcaption>Mô hình Kronig-Penney: giếng và rào lặp lại đều đặn như mạng tinh thể.</figcaption></figure>

    <p>Để chứng minh bằng toán học tại sao lại xuất hiện các <b>Dải cho phép (Allowed bands)</b> và <b>Dải cấm (Forbidden gaps)</b>, hai nhà vật lý Kronig và Penney (1931) đã mô hình hóa thế năng tuần hoàn của mạng tinh thể 1 chiều thành một chuỗi các <b>Giếng thế (bề rộng $a$, $V=0$)</b> xen kẽ với các <b>Rào thế (bề rộng $b$, chiều cao $V_0$)</b> lặp lại tuần hoàn với chu kỳ $a + b$.</p>
    <p>Theo <b>Định lý Bloch</b>, nghiệm hàm sóng của electron trong trường thế tuần hoàn có dạng sóng phẳng được điều biến biên độ theo chu kỳ mạng: $\psi(x) = u(x)e^{jkx}$. Khi áp dụng các điều kiện biên liên tục của $\psi$ và $\frac{d\psi}{dx}$ tại $x=0$ và $x=a$ (kết hợp lấy giới hạn rào thế hẹp $b \to 0, V_0 \to \infty$ sao cho tích $V_0 b$ hữu hạn), Kronig và Penney thu được phương trình siêu việt nổi tiếng:</p>

    <div class="f">
      $$\mathbf{f(\alpha a) = P'\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a) = \cos(ka)}$$
      <small>Trong đó: $\alpha = \frac{\sqrt{2mE}}{\hbar} \implies \mathbf{E = \frac{\hbar^2 (\alpha a)^2}{2ma^2}}$ (đại lượng $\alpha a$ đại diện trực tiếp cho năng lượng $E$ của electron);<br>
      $P' = \frac{m V_0 b a}{\hbar^2}$ là thông số liên kết (đo độ chặt của lực giữ hạt nhân); $k$ là số sóng tinh thể (crystal wave number).</small>
    </div>
    <div class="box legend"><b>Đọc phương trình Kronig-Penney</b><ul><li>$P'$: độ mạnh liên kết của thế; rào càng cao hoặc càng dày thì $P'$ càng lớn.</li><li>$\alpha=\sqrt{2mE}/\hbar$: nhãn của năng lượng $E$; $a$: hằng số mạng.</li><li>$k$: số sóng của electron trong tinh thể (Bloch).</li><li><b>Ý chính:</b> vế phải $\cos(ka)$ luôn nằm trong $[-1,1]$, nên chỉ những $E$ mà vế trái nằm trong khoảng này mới là dải cho phép; còn lại là vùng cấm.</li></ul></div>


    <div class="box tip">
      <b>Cách đọc Đồ thị Kronig-Penney cực dễ hiểu (Áp dụng giải trực tiếp Câu 1 & Câu 2):</b><br>
      • Nhìn vào Vế Phải của phương trình: $\cos(ka)$. Với mọi số sóng thực $k$, hàm $\cos(ka)$ <b>chỉ có thể nhận giá trị nằm trong đoạn từ $-1$ đến $+1$</b> ($-1 \le \cos(ka) \le +1$)!<br>
      • Do đó, Vế Trái $f(\alpha a)$ cũng bắt buộc phải nằm giữa hai đường ranh giới ngang $-1$ và $+1$:<br>
      &nbsp;&nbsp;1. Những đoạn biến số $\alpha a$ nào làm cho đồ thị $\mathbf{-1 \le f(\alpha a) \le +1}$ (vùng tô màu xanh trên mô hình dưới) $\implies$ Có nghiệm $k$ thực $\implies$ Tạo thành <b>Dải năng lượng cho phép (Allowed Energy Band)</b>! Ranh giới của dải cho phép xảy ra tại $\cos(ka) = +1$ (ứng với $ka = 0, 2\pi, 4\pi\dots$) và $\cos(ka) = -1$ (ứng với $ka = \pi, 3\pi\dots$).<br>
      &nbsp;&nbsp;2. Những đoạn $\alpha a$ nào làm cho đồ thị $\mathbf{|f(\alpha a)| > 1}$ (vọt lên trên $+1$ hoặc tụt xuống dưới $-1$) $\implies$ Không có nghiệm $k$ thực $\implies$ Tạo thành <b>Dải cấm (Forbidden Bandgap)</b>!
    </div>

    <h3>1.3. Mô hình tương tác: Đồ thị hàm Kronig-Penney $f(\alpha a)$ & Sự tách vùng năng lượng</h3>
