<style>
:root{--bg:#f6f8ff;--card:#fff;--ink:#1d2350;--mut:#58608a;--c1:#2f6fed;--c2:#12b886;--c3:#f59f00;--c4:#e64980;--c5:#7048e8;--g:#c9cfe8;--tint:#eaf0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142e;--card:#1a2046;--ink:#eef0ff;--mut:#a4abd6;--c1:#6ea0ff;--c2:#38d9a9;--c3:#ffd43b;--c4:#ff8fb8;--c5:#a78bfa;--g:#3b4380;--tint:#222b5e}}
:root[data-theme="dark"]{--bg:#10142e;--card:#1a2046;--ink:#eef0ff;--mut:#a4abd6;--c1:#6ea0ff;--c2:#38d9a9;--c3:#ffd43b;--c4:#ff8fb8;--c5:#a78bfa;--g:#3b4380;--tint:#222b5e}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17.5px/1.92 "Be Vietnam Pro",system-ui,sans-serif;letter-spacing:0.01em}
main{max-width:860px;margin:0 auto;padding:28px 20px 90px}
header{padding:38px 0 14px}
h1{font-size:clamp(30px,6.5vw,46px);line-height:1.2;margin:10px 0 16px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,var(--c1),var(--c5),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:24px;line-height:1.4;margin:0 0 16px;font-weight:800}
h3{font-size:19.5px;line-height:1.45;margin:30px 0 12px;color:var(--c5);font-weight:800}
section{background:var(--card);border-radius:22px;padding:30px 28px;margin:28px 0;border-left:8px solid var(--c1);box-shadow:0 4px 20px rgba(0,0,0,.04)}
section:nth-of-type(5n+2){border-color:var(--c2)}section:nth-of-type(5n+3){border-color:var(--c3)}section:nth-of-type(5n+4){border-color:var(--c4)}section:nth-of-type(5n+5){border-color:var(--c5)}
p{margin:16px 0;line-height:1.95}.mut{color:var(--mut)}
ul,ol{margin:14px 0;padding-left:24px}
li{margin:12px 0;line-height:1.9}
.box{background:var(--tint);border-radius:14px;padding:18px 22px;margin:20px 0;line-height:1.95}
.tip{border-left:5px solid var(--c3)}.warn{border-left:5px solid var(--c4)}.analogy{border-left:5px solid var(--c2)}
.f{background:var(--tint);border-radius:14px;padding:18px 20px;margin:18px 0;font-size:18px;overflow-x:auto;text-align:center;line-height:2}
.f small{font:14.5px/1.75 "Be Vietnam Pro",sans-serif;font-style:normal;color:var(--mut);display:block;margin-top:8px}
svg{width:100%;height:auto;display:block;margin:16px 0;background:var(--tint);border-radius:14px;border:1px solid var(--g)}
.ax{stroke:var(--g);stroke-width:1.5}svg text{fill:var(--ink);font:13px "Be Vietnam Pro",sans-serif}
.k{display:inline-block;padding:3px 11px;border-radius:8px;color:#fff;font-weight:600;font-size:14px;vertical-align:middle;margin:2px 4px 2px 0}
.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3);color:#222}.b4{background:var(--c4)}.b5{background:var(--c5)}
input[type=range]{width:100%;accent-color:var(--c5);cursor:pointer}
.tw{overflow-x:auto;margin:18px 0}table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:480px;line-height:1.75}td,th{padding:13px 14px;border-bottom:1px solid var(--g);text-align:left}th{color:var(--c5);font-weight:800;background:var(--tint)}
.sum li{margin:12px 0}

/* Interactive controls & exercise panels - Modern Pill & Segmented UI */
.btn-group{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0 12px}
.btn{appearance:none;-webkit-appearance:none;border:2px solid transparent;border-radius:999px;padding:12px 26px;font:700 15px/1.4 "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer;transition:all .24s cubic-bezier(.2,.8,.2,1);display:inline-flex;align-items:center;justify-content:center;gap:10px;letter-spacing:0.01em;position:relative;overflow:hidden}
.btn::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0.85;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.btn:hover::before{transform:scale(1.3)}
.btn:active{transform:translateY(0) scale(0.97)}
.btn-hint{background:var(--tint);color:var(--ink);border-color:var(--c3);box-shadow:0 4px 14px rgba(245,159,0,.18)}
.btn-hint::before{background:var(--c3);box-shadow:0 0 8px var(--c3)}
.btn-hint:hover{background:var(--c3);color:#1d2350;box-shadow:0 8px 22px rgba(245,159,0,.32)}
.btn-sol{background:var(--c5);color:#fff;box-shadow:0 6px 18px rgba(112,72,232,.32)}
.btn-sol::before{background:#fff;box-shadow:0 0 8px #fff}
.btn-sol:hover{box-shadow:0 10px 26px rgba(112,72,232,.48)}

.panel{display:none;margin-top:16px;padding:20px 22px;border-radius:14px;background:var(--tint);border:1px solid var(--g);line-height:1.95}
.panel.open{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.step{margin:18px 0;padding-bottom:16px;border-bottom:1px dashed var(--g);line-height:1.95}
.step:last-child{border-bottom:none;padding-bottom:0}
.cmt{display:block;color:var(--mut);font-size:15px;line-height:1.85;font-style:italic;background:rgba(130,140,190,0.12);padding:11px 16px;border-radius:10px;margin:10px 0;border-left:3.5px solid var(--mut)}
.formula-card{border:1px solid var(--g);border-radius:16px;padding:22px;margin:24px 0;background:var(--card)}
.formula-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px;font-size:15.5px;line-height:1.9}
.formula-meta div{background:var(--tint);padding:16px 18px;border-radius:12px}
.sim-card{border:1px solid var(--g);border-radius:20px;padding:24px;margin:24px 0;background:var(--card);box-shadow:0 8px 28px rgba(0,0,0,.05)}

/* Nút chọn chế độ mô hình (Segmented Pill Radio Buttons) */
.sim-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:10px;background:var(--tint);border-radius:18px;border:1.5px solid var(--g)}
.sim-tab{appearance:none;-webkit-appearance:none;flex:1 1 180px;border:1.5px solid var(--g);border-radius:14px;padding:12px 16px;background:var(--card);color:var(--ink);font:600 14.5px/1.45 "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);text-align:left;display:flex;align-items:center;gap:11px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.sim-tab::before{content:"";flex:0 0 16px;width:16px;height:16px;border-radius:50%;border:2px solid var(--mut);background:transparent;transition:all .2s ease;box-sizing:border-box}
.sim-tab:hover{border-color:var(--c5);color:var(--c5);transform:translateY(-2px);box-shadow:0 6px 16px rgba(112,72,232,.14)}
.sim-tab:hover::before{border-color:var(--c5);transform:scale(1.1)}
.sim-tab:active{transform:translateY(0) scale(0.98)}
.sim-tab.active{background:var(--c5);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(112,72,232,.36);transform:translateY(-1px);font-weight:700}
.sim-tab.active::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3.5px var(--c5)}

.ctrl-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:center;margin:14px 0;background:var(--tint);padding:16px 18px;border-radius:16px;border:1.5px solid var(--g)}
.ctrl-row label{font-size:14.5px;font-weight:700;display:block;margin-bottom:10px;color:var(--ink)}

/* Bộ chọn danh sách thả xuống tùy chỉnh (Custom Dropdown Select) đồng bộ 100% giao diện */
select.native-select-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;border:0!important;opacity:0!important;pointer-events:none!important}
.csel-wrap{position:relative;width:100%;user-select:none;font:600 14.5px/1.45 "Be Vietnam Pro",system-ui,sans-serif;z-index:5}
.csel-wrap.open{z-index:45}
.csel-trigger{appearance:none;-webkit-appearance:none;width:100%;padding:13px 46px 13px 18px;border-radius:14px;border:2px solid var(--c5);background:var(--card);color:var(--ink);font:600 14.5px/1.45 "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .22s ease;box-shadow:0 4px 12px rgba(112,72,232,.1);position:relative;text-align:left}
.csel-trigger::before{content:"";flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--c5);margin-right:12px;box-shadow:0 0 0 3px var(--tint)}
.csel-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.csel-trigger:hover{border-color:var(--c1);background:var(--tint);transform:translateY(-1px);box-shadow:0 6px 16px rgba(112,72,232,.18)}
.csel-wrap.open .csel-trigger{border-color:var(--c1);background:var(--card);box-shadow:0 0 0 4px rgba(112,72,232,.22)}
.csel-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;transition:all .25s ease;pointer-events:none}
.csel-arrow::after{content:"";width:7px;height:7px;border-right:2.5px solid var(--c5);border-bottom:2.5px solid var(--c5);transform:translateY(-2px) rotate(45deg);transition:transform .25s ease}
.csel-wrap.open .csel-arrow{background:var(--c5)}
.csel-wrap.open .csel-arrow::after{border-color:#fff;transform:translateY(2px) rotate(-135deg)}
.csel-menu{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:60;background:var(--card);border:2px solid var(--c5);border-radius:16px;padding:8px;box-shadow:0 14px 36px rgba(16,20,46,.28);display:none;max-height:280px;overflow-y:auto}
.csel-wrap.open .csel-menu{display:block;animation:fadeIn .18s ease}
.csel-opt{padding:11px 14px;border-radius:11px;color:var(--ink);cursor:pointer;transition:all .16s ease;margin:3px 0;line-height:1.45;display:flex;align-items:center;gap:10px}
.csel-opt::before{content:"";flex:0 0 14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--g);transition:all .16s ease}
.csel-opt:hover{background:var(--tint);color:var(--c5);padding-left:18px}
.csel-opt:hover::before{border-color:var(--c5)}
.csel-opt.selected{background:var(--c5);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(112,72,232,.3)}
.csel-opt.selected::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px var(--c5)}
.menu-selector-wrap .csel-trigger{border:2px solid var(--c5);background:var(--tint);font-size:15px;font-weight:700}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;background:var(--g);outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--c5);border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--c5);border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}

/* Thanh cuộn dọc & ngang tùy chỉnh đồng bộ phong cách giao diện */
*{scrollbar-width:thin;scrollbar-color:var(--c5) var(--tint)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--tint);border-radius:999px;margin:4px}
::-webkit-scrollbar-thumb{background:var(--c5);border-radius:999px;border:2px solid var(--tint);transition:background .2s}
::-webkit-scrollbar-thumb:hover{background:var(--c4)}
::-webkit-scrollbar-corner{background:transparent}
.f::-webkit-scrollbar,.tw::-webkit-scrollbar,#mn::-webkit-scrollbar{height:6px;width:6px}
.f::-webkit-scrollbar-thumb,.tw::-webkit-scrollbar-thumb,#mn::-webkit-scrollbar-thumb{border-width:1px}

/* Top-Left Hamburger Menu & Lesson Selector */
#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:30;width:46px;height:46px;border:0;border-radius:14px;background:var(--c5);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mb span{display:block;width:22px;height:3px;border-radius:2px;background:#fff;transition:transform .2s,opacity .2s}
#mb[aria-expanded=true] span:nth-child(1){transform:translateY(8px) rotate(45deg)}#mb[aria-expanded=true] span:nth-child(2){opacity:0}#mb[aria-expanded=true] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
#mb:focus-visible,#mn a:focus-visible,#lesson-select:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
#mn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:14px;z-index:30;width:min(360px,calc(100vw - 28px));max-height:calc(100vh - 90px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 10px 34px rgba(0,0,0,.3);border:1px solid var(--g)}
#mn[hidden]{display:none}
.menu-selector-wrap{padding-bottom:12px;margin-bottom:10px;border-bottom:2px solid var(--g)}
.menu-selector-wrap label{display:block;font-size:13px;font-weight:800;color:var(--c5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
#lesson-select{width:100%;padding:11px 40px 11px 14px;border-radius:12px;border:2px solid var(--c5);background-color:var(--tint);color:var(--ink);font:600 15px "Be Vietnam Pro",sans-serif;cursor:pointer}
.toc-title{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:8px 0 4px;padding:0 8px}
#toc-links a{display:block;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.4}
#toc-links a:hover{background:var(--tint)}
#toc-links a.sub{padding-left:24px;font-size:13.5px;color:var(--mut)}
#toc-links a.grp{font-weight:600;margin-top:4px}
section,h3[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}

/* ===== Bố cục mới: dẫn dắt, phải nhớ, chế độ xem ===== */
.bridge,.next{border-radius:12px;padding:12px 18px;margin:0 0 18px;background:var(--tint);border-left:5px solid var(--c5);font-size:16px;line-height:1.8}
.next{border-color:var(--c2);margin:26px 0 0}
.why{border-left:5px solid var(--c2)}
.key{border:2px solid var(--c4);background:var(--card);position:relative;padding-top:32px}
.key::before{content:"★ PHẢI NHỚ";position:absolute;top:-2px;left:16px;background:var(--c4);color:#fff;font:800 12px/1 "Be Vietnam Pro",sans-serif;padding:6px 10px;border-radius:0 0 8px 8px}
.key ul,.key ol{margin:8px 0}.key li{margin:8px 0}
.roadmap{background:var(--tint);border-radius:16px;padding:6px 22px;margin:16px 0;border:1px solid var(--g)}
.roadmap ol{padding-left:22px}
.ans{background:var(--card);border:2px solid var(--c2);border-radius:12px;padding:10px 16px;margin:12px 0 2px}
.vs{display:flex;gap:4px;padding:4px;background:var(--tint);border:1.5px solid var(--g);border-radius:12px;margin-bottom:12px}
.vs b{font-size:11px;color:var(--mut);padding:0 6px;align-self:center;text-transform:uppercase}
.vb{flex:1;border:0;border-radius:9px;padding:8px;background:transparent;color:var(--ink);font:700 12.5px "Be Vietnam Pro",sans-serif;cursor:pointer}
.vb[aria-pressed=true]{background:var(--c5);color:#fff}
html[data-view=desktop] body{font-size:18px}
html[data-view=desktop] main{max-width:none;padding:26px clamp(18px,2.6vw,60px) 90px}
html[data-view=desktop] section{display:flow-root;padding:34px clamp(24px,2.8vw,58px)}
html[data-view=desktop] p,html[data-view=desktop] li{max-width:150ch}
html[data-view=desktop] table{min-width:0}
html[data-view=desktop] .formula-meta{grid-template-columns:1fr 1fr}
html[data-view=desktop] .sim-card svg{max-height:640px}

/* ===== Mô hình thu nhỏ, đặt ngang hàng với chữ; bảng chỉnh nằm cạnh hình ===== */
.sim-card{padding:16px 18px}
.sim-card>svg{max-height:min(60vh,400px);margin:12px 0}
section>svg{max-height:420px}
@media(min-width:760px){
 html[data-view=desktop] .sim-card:has(>svg){display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:20px;align-content:start}
 html[data-view=desktop] .sim-card:has(>svg)>svg{grid-column:1;grid-row:1/span 12;align-self:start;margin:0;max-height:640px}
 html[data-view=desktop] .sim-card:has(>svg)>*:not(svg){grid-column:2;min-width:0}
 html[data-view=desktop] .sim-tabs{flex-direction:column;flex-wrap:nowrap;padding:8px}
 html[data-view=desktop] .sim-tab{flex:0 0 auto}
 html[data-view=desktop] .ctrl-row{grid-template-columns:1fr;margin:8px 0}
}
@media(min-width:1200px){
 html[data-view=desktop] .box,html[data-view=desktop] .bridge,html[data-view=desktop] .next,html[data-view=desktop] .roadmap,html[data-view=desktop] .tw,html[data-view=desktop] .formula-card,html[data-view=desktop] ul,html[data-view=desktop] ol{display:flow-root}
}

/* ===== Hình SVG minh họa đặt ngang hàng với chữ ===== */
.sim-card{clear:both}
.fig{margin:16px 0}
.fig svg{margin:0;max-height:none}
.fig figcaption{font-size:14.5px;color:var(--mut);margin-top:8px;line-height:1.7;padding:0 6px}
@media(min-width:1200px){
 html[data-view=desktop] .fig{width:min(40%,470px);margin:6px 0 16px 30px;float:right}
 html[data-view=desktop] .fig.fl{float:left;margin:6px 30px 16px 0}
}

.explain{border-left:5px solid var(--c3)}
.explain ul,.legend ul{margin:8px 0 2px;padding-left:20px}.explain li,.legend li{margin:7px 0}
.legend{border-left:5px solid var(--c1);font-size:16px}
/* ===== Popup ghim công thức ===== */
#mb,#mn{z-index:60}
#fp{position:fixed;right:8px;top:8px;width:max-content;min-width:150px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);z-index:48;display:none;flex-direction:column;background:var(--card);color:var(--ink);border:1.5px solid var(--c1);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.28);font-family:"Be Vietnam Pro",sans-serif;overflow:hidden}
#fp.on{display:flex}
#fp.col .fp-l{display:none}
#fp.col .fp-h{border-bottom:0}
#fp *{box-sizing:border-box}
#fp .fp-h{display:flex;align-items:center;justify-content:flex-end;gap:1px;height:18px;padding:0 2px;background:var(--tint);border-bottom:1px solid var(--g);cursor:move;user-select:none;touch-action:none;flex:none}
#fp .fp-b{border:0;background:transparent;color:var(--ink);cursor:pointer;width:18px;height:16px;padding:0;border-radius:5px;display:flex;align-items:center;justify-content:center;font:700 12px/1 sans-serif}
#fp .fp-b:hover{background:var(--g)}
#fp .fp-b svg{width:11px;height:11px;display:block}
#fp .fp-b.on{background:var(--c1);color:#fff}
#fp .fp-x{color:#c0392b}
#fp .fp-l{flex:1;min-height:0;overflow:auto;padding:2px 6px;touch-action:pan-x pan-y}
#fp .fp-f{padding:2px 0;font-size:15px;line-height:1.5;white-space:nowrap;text-align:center}
#fp .fp-f+.fp-f{border-top:1px solid var(--g)}
#fp mjx-container[display="true"]{margin:2px 0 !important}
body.fp-pick,body.fp-pick *{cursor:crosshair !important}
body.fp-pick #fp .fp-h,body.fp-pick #fp .fp-h *{cursor:pointer !important}
.fp-hl{outline:2px solid var(--c1) !important;outline-offset:2px}
#fp-open{display:block;width:100%;margin:0 0 10px;border:1px solid var(--g);background:var(--tint);padding:9px}
</style>

  <header>
    <span class="k b5">HỌC PHẦN ENP2209 · BUỔI 1</span>
    <h1>Cấu Trúc Tinh Thể Của Chất Rắn</h1>
    <p class="mut">Tài liệu tự học từ con số 0 dành cho sinh viên mất gốc Toán - Lý. Học qua mô hình tương tác trực quan, ví dụ ẩn dụ thực tế và giải bài tập từng bước không nhảy cóc.</p>
  
    <div class="roadmap"><p><b>Bản đồ Buổi 1 — đi từ đâu đến đâu?</b></p><ol>
      <li><b>Mục 1:</b> Bán dẫn là gì, và vì sao chip phải làm từ <i>đơn tinh thể</i>.</li>
      <li><b>Mục 2:</b> Cách "nén" cả tỷ nguyên tử thành một chiếc hộp nhỏ (ô đơn vị) để đếm và tính toán.</li>
      <li><b>Mục 3:</b> Cách gọi tên các mặt cắt của tinh thể (chỉ số Miller).</li>
      <li><b>Mục 4:</b> Liên kết giữa các nguyên tử, tạp chất (pha tạp) và cách chế tạo tinh thể thật.</li>
      <li><b>Mục 5–6:</b> Công thức và bài tập để rèn kỹ năng tính.</li></ol>
      <p><b>Sau buổi này em làm được:</b> tính số nguyên tử, mật độ, khối lượng riêng của một tinh thể và gọi tên một mặt phẳng bất kỳ. Đây là nền để các buổi sau mô tả electron chạy trong tinh thể.</p></div>
  </header>

  <section>
    <h2>1. Bản Chất Vật Liệu Bán Dẫn & Các Loại Chất Rắn</h2>
    <figure class="fig fr"><svg viewBox="0 0 420 178" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><text x="105" y="16" text-anchor="middle" style="fill:var(--c2);font-size:13px;font-weight:700">Tinh thể: xếp đều</text><text x="315" y="16" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">Vô định hình: lộn xộn</text><rect x="20" y="28" width="40" height="42" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="20" y="102" width="40" height="42" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="70" y="28" width="40" height="42" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="70" y="102" width="40" height="42" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="120" y="28" width="40" height="42" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="120" y="102" width="40" height="42" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><line x1="15" y1="86" x2="195" y2="86" style="stroke:var(--c2);stroke-width:3" marker-end="url(#fa)"/><rect x="230" y="30" width="35" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="262" y="38" width="41" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="300" y="26" width="40" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="345" y="34" width="34" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="236" y="104" width="37" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="280" y="98" width="41" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="318" y="110" width="39" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><rect x="362" y="100" width="42" height="38" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><path d="M225,86 L255,86 L268,62 L290,100 L312,72 L338,98 L360,70 L400,88" style="fill:none;stroke:var(--c4);stroke-width:3;fill-opacity:1" marker-end="url(#fa)"/><text x="105" y="166" text-anchor="middle" style="fill:var(--c2);font-size:12px;font-weight:400">electron chạy thẳng, ít cản trở</text><text x="315" y="166" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:400">electron bị va chạm liên tục</text></svg><figcaption>Hình ảnh hóa ví dụ quy hoạch đô thị: đường thẳng thì xe chạy trơn tru.</figcaption></figure>

    <div class="box why"><b>Học phần này để làm gì?</b> Mọi tính chất điện của chip (dẫn điện tốt hay kém, bật tắt được hay không) đều bắt nguồn từ <i>cách các nguyên tử xếp hàng</i>. Mục này chỉ làm một việc: giúp em biết loại vật liệu nào được dùng và vì sao.</div>

    <p>Chào em! Nhiều bạn khi mới học Vật lý Bán dẫn thường thắc mắc: <i>"Tại sao học về con chip điện tử, dòng điện mà buổi đầu tiên lại phải học hình học không gian, đếm từng quả cầu nguyên tử trong chiếc hộp lập phương?"</i></p>
    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Quy hoạch giao thông đô thị</b><br>
      Em hãy tưởng tượng các <b>hạt electron</b> mang dòng điện giống như những <b>chiếc xe máy</b>, còn các <b>nguyên tử</b> đứng yên trong chất rắn là các <b>tòa nhà</b>.<br>
      • Nếu các tòa nhà xây tự phát, lộn xộn không theo quy hoạch, xe máy đi vào sẽ liên tục đâm vào tường, kẹt cứng — dòng điện chạy cực kỳ tệ.<br>
      • Ngược lại, nếu các tòa nhà được quy hoạch thẳng tắp thành từng ô bàn cờ đều đặn từ đầu thành phố đến cuối thành phố, xe máy sẽ phóng êm ru trên các đại lộ rộng thoáng.<br>
      Việc tìm hiểu "quy hoạch đô thị của các nguyên tử" chính là nghiên cứu <b>Cấu trúc tinh thể</b> trong Buổi 1 này.
    </div>

    <h3>1.1. Phân loại vật liệu bán dẫn</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Muốn học electron chạy trong vật liệu nào thì trước hết phải biết vật liệu đó là gì.</li><li><b>Dùng để làm gì:</b> Nhận ra Si, Ge (bán dẫn nguyên tố) và GaAs (hợp chất III-V) mỗi khi đề bài nhắc tới.</li><li><b>Liên hệ với phần khác:</b> Ở Mục 4, ta sẽ pha thêm tạp chất vào đúng những vật liệu này để biến chúng thành loại n hoặc loại p.</li></ul></div>

    <figure class="fig fr"><svg viewBox="0 0 420 175" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="15" y="25" width="120" height="70" rx="8" style="fill:var(--tint);stroke:var(--c4);stroke-width:2;fill-opacity:1"/><text x="75" y="55" text-anchor="middle" style="fill:var(--c4);font-size:15px;font-weight:700">Cách điện</text><text x="75" y="78" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:400">chặn dòng điện</text><rect x="150" y="25" width="120" height="70" rx="8" style="fill:var(--tint);stroke:var(--c5);stroke-width:3;fill-opacity:1"/><text x="210" y="55" text-anchor="middle" style="fill:var(--c5);font-size:15px;font-weight:700">Bán dẫn</text><text x="210" y="78" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:400">điều khiển được</text><rect x="285" y="25" width="120" height="70" rx="8" style="fill:var(--tint);stroke:var(--c2);stroke-width:2;fill-opacity:1"/><text x="345" y="55" text-anchor="middle" style="fill:var(--c2);font-size:15px;font-weight:700">Kim loại</text><text x="345" y="78" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:400">dẫn rất tốt</text><text x="210" y="118" text-anchor="middle" style="fill:var(--c5);font-size:12px;font-weight:400">nhiệt độ · ánh sáng · pha tạp</text><line x1="210" y1="98" x2="210" y2="106" style="stroke:var(--c5);stroke-width:2"/><line x1="20" y1="140" x2="395" y2="140" style="stroke:var(--mut);stroke-width:2" marker-end="url(#fa)"/><text x="210" y="162" text-anchor="middle" style="fill:var(--mut);font-size:12px;font-weight:400">khả năng dẫn điện tăng dần</text></svg><figcaption>Bán dẫn nằm giữa hai thái cực, và ta điều khiển được nó.</figcaption></figure>

    <p>Xét về khả năng dẫn điện, chất bán dẫn nằm ở ranh giới giữa <b>Kim loại</b> (dẫn điện rất tốt) và <b>Chất cách điện</b> (chặn dòng điện). Điểm kỳ diệu của bán dẫn là ta có thể điều khiển nó chuyển từ trạng thái "chặn dòng điện" sang "dẫn điện" rất dễ dàng bằng nhiệt độ, ánh sáng hoặc pha thêm tạp chất. Trong môn học này, em cần nắm vững 2 nhóm bán dẫn chính:</p>
    
    <figure class="fig fr"><svg viewBox="0 0 420 238" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><text x="70" y="24" text-anchor="middle" style="fill:var(--mut);font-size:13px;font-weight:700">Nhóm III</text><rect x="25" y="36" width="90" height="36" rx="8" style="fill:var(--tint);stroke:var(--c4);stroke-width:3;fill-opacity:1"/><text x="70" y="60" text-anchor="middle" style="fill:var(--c4);font-size:15px;font-weight:700">B</text><rect x="25" y="80" width="90" height="36" rx="8" style="fill:var(--card);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><text x="70" y="104" text-anchor="middle" style="fill:var(--mut);font-size:15px;font-weight:700">Al</text><rect x="25" y="124" width="90" height="36" rx="8" style="fill:var(--tint);stroke:var(--c2);stroke-width:3;fill-opacity:1"/><text x="70" y="148" text-anchor="middle" style="fill:var(--c2);font-size:15px;font-weight:700">Ga</text><text x="210" y="24" text-anchor="middle" style="fill:var(--mut);font-size:13px;font-weight:700">Nhóm IV</text><rect x="165" y="36" width="90" height="36" rx="8" style="fill:var(--card);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><text x="210" y="60" text-anchor="middle" style="fill:var(--mut);font-size:15px;font-weight:700">C</text><rect x="165" y="80" width="90" height="36" rx="8" style="fill:var(--tint);stroke:var(--c1);stroke-width:3;fill-opacity:1"/><text x="210" y="104" text-anchor="middle" style="fill:var(--c1);font-size:15px;font-weight:700">Si</text><rect x="165" y="124" width="90" height="36" rx="8" style="fill:var(--tint);stroke:var(--c1);stroke-width:3;fill-opacity:1"/><text x="210" y="148" text-anchor="middle" style="fill:var(--c1);font-size:15px;font-weight:700">Ge</text><text x="350" y="24" text-anchor="middle" style="fill:var(--mut);font-size:13px;font-weight:700">Nhóm V</text><rect x="305" y="36" width="90" height="36" rx="8" style="fill:var(--card);stroke:var(--g);stroke-width:1.5;fill-opacity:1"/><text x="350" y="60" text-anchor="middle" style="fill:var(--mut);font-size:15px;font-weight:700">N</text><rect x="305" y="80" width="90" height="36" rx="8" style="fill:var(--tint);stroke:var(--c4);stroke-width:3;fill-opacity:1"/><text x="350" y="104" text-anchor="middle" style="fill:var(--c4);font-size:15px;font-weight:700">P</text><rect x="305" y="124" width="90" height="36" rx="8" style="fill:var(--tint);stroke:var(--c2);stroke-width:3;fill-opacity:1"/><text x="350" y="148" text-anchor="middle" style="fill:var(--c2);font-size:15px;font-weight:700">As</text><text x="15" y="190" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:400">■ Si, Ge: bán dẫn nguyên tố</text><text x="15" y="208" text-anchor="start" style="fill:var(--c2);font-size:12px;font-weight:400">■ Ga + As = GaAs (hợp chất III-V)</text><text x="15" y="226" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:400">■ B, P: tạp chất pha vào Si (Mục 4)</text></svg><figcaption>Các nguyên tố hay gặp quanh Nhóm IV.</figcaption></figure>
    <ul>
      <li><span class="k b1">Bán dẫn nguyên tố (Elemental)</span> Cấu tạo từ 1 nguyên tố duy nhất thuộc <b>Nhóm IV</b> bảng tuần hoàn (có 4 electron lớp ngoài cùng): phổ biến nhất là <b>Silicon ($\text{Si}$)</b> và <b>Germanium ($\text{Ge}$)</b>.</li>
      <li><span class="k b2">Bán dẫn hợp chất (Compound)</span> Tạo thành khi ghép nguyên tố <b>Nhóm III</b> với nguyên tố <b>Nhóm V</b>:Hợp chất hai nguyên tố (nhị phân - binary) tiêu biểu nhất là <b>Gallium Arsenide ($\text{GaAs}$)</b> dùng làm đèn LED, laser và mạch cao tần. Ngoài ra còn có hợp chất ba nguyên tố (bậc ba - ternary) như $\text{Al}_x\text{Ga}_{1-x}\text{As}$.</li>
    </ul>

    <h3>1.2. Mô hình trực quan: Ba loại chất rắn theo độ trật tự</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Chip chỉ làm được từ vật liệu mà các nguyên tử xếp đều đặn, nên ta phải biết phân biệt mức độ trật tự.</li><li><b>Dùng để làm gì:</b> Phân biệt: <b>vô định hình</b> (không trật tự), <b>đa tinh thể</b> (trật tự từng mảng nhỏ), <b>đơn tinh thể</b> (trật tự toàn khối).</li><li><b>Cách dùng mô hình:</b> Bấm lần lượt 3 nút và so sánh: hàng nguyên tử có thẳng hàng không, có mảng nào bị lệch không? Kết luận: chỉ đơn tinh thể mới lặp đều trên toàn khối.</li><li><b>Liên hệ với phần khác:</b> Mục 2 chỉ áp dụng được cho đơn tinh thể, vì chỉ ở đó mới có một "viên gạch" lặp lại khắp nơi.</li></ul></div>

    <p>Dựa vào kích thước của vùng không gian mà các nguyên tử xếp hàng đều đặn, người ta chia chất rắn thành 3 loại. Em hãy bấm vào từng nút trong mô hình dưới đây để quan sát sự khác biệt:</p>

    <div class="sim-card">
      <div class="sim-tabs" id="solid-tabs">
        <button type="button" class="sim-tab active" onclick="renderSolidModel('amorphous', this)">1. Vô định hình (Amorphous)</button>
        <button type="button" class="sim-tab" onclick="renderSolidModel('poly', this)">2. Đa tinh thể (Polycrystalline)</button>
        <button type="button" class="sim-tab" onclick="renderSolidModel('single', this)">3. Đơn tinh thể (Single Crystal)</button>
      </div>
      <div id="solid-desc" class="box"></div>
      <svg id="solid-svg" viewBox="0 0 680 230"></svg>
    </div>
  
    <div class="box key"><b>Mục 1 — Nhớ 3 ý</b><ul><li><b>Bán dẫn</b> nằm giữa kim loại và chất cách điện, và ta <i>điều khiển</i> được độ dẫn điện bằng nhiệt độ, ánh sáng hoặc pha tạp.</li><li><b>Nguyên tố:</b> Si, Ge (Nhóm IV). <b>Hợp chất:</b> GaAs (Nhóm III + Nhóm V).</li><li><b>Ba loại chất rắn:</b> vô định hình (không trật tự) → đa tinh thể (trật tự từng mảng nhỏ) → <b>đơn tinh thể</b> (trật tự toàn khối). Chip dùng đơn tinh thể.</li></ul></div>

    <div class="box why"><b>Vì sao chip cần đơn tinh thể?</b> Vì chỉ khi các nguyên tử lặp lại <i>đều đặn</i> ta mới tính được electron chuyển động thế nào. Đây là lý do Buổi 4 có thể giải bài toán electron trong tinh thể.</div>

    <div class="next"><b>Tiếp theo:</b> Biết tinh thể là một "bàn cờ" nguyên tử lặp lại, ta cần cách mô tả nó gọn gàng. Mục 2 làm việc đó bằng <b>ô đơn vị</b>.</div>
</section>

  <section>
    <h2>2. Lưới Không Gian, Ô Đơn Vị & Các Cấu Trúc Lập Phương</h2>
    <div class="bridge"><b>Nối từ Mục 1:</b> Tinh thể đơn là sự lặp lại đều đặn. Vậy ta chỉ cần mô tả <i>một mảnh nhỏ</i> rồi "sao chép" ra.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Có ô đơn vị thì mới <i>đếm</i> được số nguyên tử, tính mật độ, khối lượng riêng (Câu 1, 3, 4, 5). Mật độ nguyên tử cũng là mốc để so với mật độ tạp chất ở các buổi sau.</div>

    <p>Một tinh thể Silicon thực tế chứa hàng tỷ tỷ nguyên tử lặp đi lặp lại tuần hoàn trong không gian (gọi là <b>mạng tinh thể - lattice</b>). Thay vì vẽ cả tỷ nguyên tử, ta đại diện vị trí mỗi nguyên tử bằng một dấu chấm gọi là <b>điểm nút mạng (lattice point)</b> và chỉ cắt ra một "chiếc hộp mẫu" nhỏ gọi là <b>Ô đơn vị (Unit cell)</b>.</p>
    <ul>
      <li><b>Ô đơn vị (Unit cell):</b> Thể tích nhỏ của tinh thể mà khi ta dịch chuyển (copy - paste) lặp đi lặp lại theo 3 chiều không gian sẽ xây dựng lại được toàn bộ tinh thể.</li>
      <li><b>Ô nguyên thủy (Primitive cell):</b> Là ô đơn vị có thể tích nhỏ nhất. Tuy nhiên, ô nguyên thủy thường có các cạnh xiên góc rất khó tính toán, nên các kỹ sư thích dùng <b>Ô đơn vị lập phương</b> (có 3 cạnh vuông góc bằng nhau và bằng <b>hằng số mạng $a$</b>).</li>
    </ul>

    
    <figure class="fig fr"><svg viewBox="0 0 420 130" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="10" y="15" width="150" height="40" rx="8" style="fill:var(--tint);stroke:var(--c5);stroke-width:2;fill-opacity:1"/><text x="85" y="40" text-anchor="middle" style="fill:var(--c5);font-size:14px;font-weight:700">a = 5.43 Å</text><line x1="165" y1="35" x2="255" y2="35" style="stroke:var(--mut);stroke-width:2" marker-end="url(#fa)"/><text x="210" y="27" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">× 10⁻⁸</text><rect x="260" y="15" width="150" height="40" rx="8" style="fill:var(--tint);stroke:var(--c2);stroke-width:2;fill-opacity:1"/><text x="335" y="40" text-anchor="middle" style="fill:var(--c2);font-size:14px;font-weight:700">5.43×10⁻⁸ cm</text><text x="15" y="88" text-anchor="start" style="fill:var(--ink);font-size:13px;font-weight:400">Diện tích a²: nhân thêm 10⁻¹⁶  (cm²)</text><text x="15" y="112" text-anchor="start" style="fill:var(--ink);font-size:13px;font-weight:400">Thể tích a³: nhân thêm 10⁻²⁴  (cm³)</text></svg><figcaption>Luôn đổi Å sang cm trước khi tính mật độ.</figcaption></figure>
<div class="box warn">
      <b>Cảnh báo sống còn về đổi đơn vị trước khi làm bài tập:</b><br>
      Kích thước ô mạng $a$ hay bán kính nguyên tử $r$ luôn được cho bằng đơn vị <b>Angstrom ($\text{Å}$)</b>, nhưng mật độ nguyên tử lại luôn tính trên mỗi <b>centimet khối ($\text{cm}^3$)</b> hoặc <b>centimet vuông ($\text{cm}^2$)</b>.<br>
      Công thức bắt buộc phải thuộc lòng:<br>
      $$1\text{ Å} = 10^{-10}\text{ m} = 10^{-8}\text{ cm}$$
      Khi tính diện tích mặt ($a^2$) thì nhân thêm $(10^{-8})^2 = 10^{-16}\text{ cm}^2$. Khi tính thể tích khối ($a^3$) thì nhân thêm $(10^{-8})^3 = 10^{-24}\text{ cm}^3$.
    </div>

    <h3>2.1. Mô hình tương tác: Phép tịnh tiến mạng và Ô đơn vị 2D</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Một tinh thể có hàng tỷ nguyên tử, ta không thể vẽ hay đếm hết. Cách gọn nhất là chọn một "viên gạch" rồi dịch chuyển nó ra khắp nơi.</li><li><b>Dùng để làm gì:</b> Hiểu ô đơn vị và công thức tịnh tiến $\vec r=p\vec a+q\vec b+s\vec c$: $\vec a,\vec b,\vec c$ là các bước nhảy cơ bản, $p,q,s$ là số nguyên cho biết nhảy bao nhiêu bước.</li><li><b>Cách dùng mô hình:</b> Kéo thanh trượt $p$, $q$ và xem điểm hồng đi tới nút nào. Rồi đổi sang ô A, B, C, D: cùng một mạng nhưng có nhiều cách chọn ô đơn vị khác nhau.</li><li><b>Liên hệ với phần khác:</b> Mục 2.2 dùng ô đơn vị này để đếm nguyên tử.</li></ul></div>

    <p>Trong không gian 2 chiều (hoặc 3 chiều), mọi điểm nút mạng đều có thể đi tới từ gốc tọa độ bằng công thức vector tịnh tiến:
      $$\vec{r} = p\vec{a} + q\vec{b} + s\vec{c}$$
      Trong đó $p, q, s$ là các số nguyên chỉ số bước nhảy. Hãy kéo thử hai thanh trượt $p$ và $q$ dưới đây để xem cách tạo ra mạng tinh thể và các cách chọn Ô đơn vị A, B, C, D:</p>

    <h3>2.2. Quy tắc đếm số nguyên tử hiệu dụng trong 1 Ô đơn vị</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Nguyên tử nằm ở biên của ô bị các ô hàng xóm dùng chung, nên không thể đếm là 1 nguyên tử trọn vẹn.</li><li><b>Dùng để làm gì:</b> Tính $n_{\text{cell}}$, tức số nguyên tử thật sự thuộc về một ô. Đây là thông số đầu vào của Công thức 1 và 2.</li><li><b>Liên hệ với phần khác:</b> Kết quả $1,2,4,8$ ở đây sẽ được thế thẳng vào công thức mật độ ở Mục 5.</li></ul></div>

    <figure class="fig fl"><svg viewBox="0 0 420 178" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="35" y="30" width="80" height="80" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:2;fill-opacity:1"/><circle cx="35" cy="30" r="15" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.35"/><text x="75" y="140" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">Đỉnh</text><text x="75" y="162" text-anchor="middle" style="fill:var(--c4);font-size:14px;font-weight:700">⅛ nguyên tử</text><rect x="170" y="30" width="80" height="80" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:2;fill-opacity:1"/><circle cx="250" cy="70.0" r="15" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.35"/><text x="210" y="140" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">Tâm mặt</text><text x="210" y="162" text-anchor="middle" style="fill:var(--c4);font-size:14px;font-weight:700">½ nguyên tử</text><rect x="305" y="30" width="80" height="80" rx="4" style="fill:var(--tint);stroke:var(--g);stroke-width:2;fill-opacity:1"/><circle cx="345.0" cy="70.0" r="15" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.35"/><text x="345" y="140" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">Trong ruột</text><text x="345" y="162" text-anchor="middle" style="fill:var(--c4);font-size:14px;font-weight:700">1 nguyên tử</text></svg><figcaption>Sơ đồ phẳng minh họa: nguyên tử nằm ở đâu thì ô đơn vị sở hữu phần tương ứng.</figcaption></figure>

    <p>Hãy tưởng tượng ô đơn vị lập phương là một căn phòng có 6 bức tường và 8 góc phòng. Các quả cầu nguyên tử nằm ở ranh giới sẽ bị chia sẻ với các phòng hàng xóm:</p>
    <ul>
      <li><span class="k b1">Nguyên tử ở Đỉnh góc (Corner)</span> Giao điểm của 8 căn phòng lập phương (4 phòng tầng dưới, 4 phòng tầng trên). Mỗi ô đơn vị chỉ sở hữu <b>$\frac{1}{8}$ nguyên tử</b>.</li>
      <li><span class="k b2">Nguyên tử ở Tâm mặt (Face-centered)</span> Nằm trên bức tường chung của 2 căn phòng. Mỗi ô đơn vị sở hữu một nửa, tức <b>$\frac{1}{2}$ nguyên tử</b>.</li>
      <li><span class="k b4">Nguyên tử nằm Trong ruột (Body / Interior)</span> Nằm hoàn toàn bên trong căn phòng, không chia sẻ cho ai. Ô đơn vị sở hữu trọn vẹn <b>$1$ nguyên tử</b>.</li>
    </ul>

    
    <div class="box analogy"><b>Ví dụ đếm nhanh cho mạng FCC (tâm mặt):</b><br>
      Có 8 đỉnh, mỗi đỉnh tính $\frac18$: $8\times\frac18=1$ nguyên tử. Có 6 mặt, mỗi tâm mặt tính $\frac12$: $6\times\frac12=3$ nguyên tử. Cộng lại: $1+3=\mathbf{4}$ nguyên tử. <br>
      Mạng <b>kim cương</b> của Si chính là mạng FCC (4 nguyên tử) cộng thêm <b>4 nguyên tử nằm bên trong</b>, nên $4+4=8$.</div>

  <section>
    <h2>3. Mặt Phẳng Tinh Thể, Chỉ Số Miller $(hkl)$ & Phương Hướng $[hkl]$</h2>

></figure>

    <div class="bridge"><b>Nối từ Mục 2:</b> Ta đã có ô đơn vị 3D. Giờ cắt nó bằng một mặt phẳng và cần một cái "tên" cho mặt đó.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Mỗi mặt cắt có số nguyên tử trên 1 cm² khác nhau, nên tính chất bề mặt chip cũng khác nhau (ví dụ mặt $(100)$ thường dùng cho transistor MOS). Chỉ số Miller là cách gọi tên để các kỹ sư hiểu nhau.</div>

    <p>Trong công nghệ sản xuất chip, thỏi tinh thể Silicon được cưa thành từng lát mỏng (wafer). Bề mặt lát cắt quyết định trực tiếp đến số lượng nguyên tử lộ ra và tốc độ di chuyển của electron trên bề mặt chip. Để gọi tên chính xác từng mặt cắt và hướng trong tinh thể, người ta dùng <b>Chỉ số Miller</b>.</p>

--c4);stroke-width:2.5;fill-opacity:1"/><text x="38" y="192" text-anchor="middle" style="fill:var(--c4);font-size:18px;font-weight:700">④</text><text x="60" y="192" text-anchor="start" style="fill:var(--ink);font-size:13.5px;font-weight:400">Viết trong ngoặc tròn</text><text x="392" y="192" text-anchor="end" style="fill:var(--c4);font-size:15px;font-weight:700">(634)</text></svg><figcaption>Ví dụ Câu 2: mặt cắt các trục tại 2a, 4a, 3a.</figcaption></figure>
<div class="box tip">
      <b>Quy trình 4 bước tìm Chỉ số Miller $(hkl)$ cho mặt phẳng:</b>
      <ol>
        <li><b>Bước 1 (Tìm điểm cắt theo $a$):</b> Xác định mặt phẳng cắt 3 trục tọa độ tại vị trí bằng bao nhiêu lần hằng số mạng $a$: ký hiệu bộ 3 điểm cắt là $(p, q, s)$. Nếu mặt phẳng song song với trục nào thì điểm cắt với trục đó ở vô cùng ($\infty$).</li>
        <li><b>Bước 2 (Lấy nghịch đảo):</b> Viết nghịch đảo của 3 điểm cắt: $\left(\frac{1}{p}, \frac{1}{q}, \frac{1}{s}\right)$. Nhờ bước này, mặt phẳng song song với trục ($\infty$) sẽ có nghịch đảo $\frac{1}{\infty} = 0$, giúp loại bỏ hoàn toàn số vô cùng!</li>
        <li><b>Bước 3 (Quy đồng khử mẫu):</b> Nhân cả 3 phân số với Bội chung nhỏ nhất của các mẫu số để thu được 3 số nguyên nhỏ nhất $h, k, l$.</li>
        <li><b>Bước 4 (Viết ký hiệu):</b> Đặt 3 số nguyên trong ngoặc tròn không có dấu phẩy: <b>$(hkl)$</b>. Còn nếu đặt trong ngoặc vuông <b>$[hkl]$</b> thì đó là <b>vector hướng</b> vuông góc với mặt phẳng $(hkl)$!</li>
      </ol>
    </div>

    
    <div class="box analogy"><b>Hai ví dụ làm tay để hiểu quy trình:</b><br>
      • Mặt cắt trục tại $(1,\ \infty,\ \infty)$: nghịch đảo $(1,0,0)$, đã là số nguyên, vậy mặt là $\mathbf{(100)}$.<br>
      • Mặt cắt trục tại $(2,\ 1,\ \infty)$: nghịch đảo $\left(\frac12,1,0\right)$. Nhân cả ba với $2$ được $(1,2,0)$. Vậy mặt là $\mathbf{(120)}$.<br>
      Lý do phải nghịch đảo: để tránh dùng ký hiệu $\infty$ cho mặt song song với trục.</div>
<h3>3.1. Mô hình tương tác: Mặt phẳng Miller $(hkl)$, Hướng $[hkl]$ & Thiết diện cắt 2D</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Cùng một tinh thể nhưng mỗi mặt cắt lộ ra số nguyên tử khác nhau. Số này quyết định tính chất bề mặt của lát wafer.</li><li><b>Dùng để làm gì:</b> Gọi đúng tên mặt cắt và đếm nguyên tử trên mặt đó, để tính mật độ bề mặt $N_s$ ở Câu 3.</li><li><b>Cách dùng mô hình:</b> Chọn mặt $(100)$, $(110)$ hoặc $(111)$, nhìn hình thiết diện 2D và đếm phần nguyên tử nằm trong mặt (đỉnh $\frac18$, tâm mặt $\frac12$).</li><li><b>Liên hệ với phần khác:</b> Dùng quy trình 4 bước ở trên để tìm $(hkl)$, rồi mô hình này cho em thấy mặt đó trông thế nào.</li></ul></div>

    <div class="box key"><b>Mục 3 — Nhớ</b><ul><li><b>Miller $(hkl)$</b>: lấy điểm cắt theo $a$ → <b>nghịch đảo</b> → quy đồng về số nguyên nhỏ nhất.</li><li>Mặt song song với trục thì điểm cắt là $\infty$, nghịch đảo bằng $0$.</li><li>$(hkl)$ là <b>mặt phẳng</b>, $[hkl]$ là <b>hướng</b> (vuông góc với mặt $(hkl)$ trong mạng lập phương).</li><li>$d_{hkl}=\dfrac{a}{\sqrt{h^2+k^2+l^2}}$ là khoảng cách giữa hai mặt song song gần nhất.</li></ul></div>

  <section>
    <h2>4. Liên Kết Nguyên Tử, Khuyết Tật Mạng, Pha Tạp & Nuôi Tinh Thể</h2>
    <div class="bridge"><b>Nối từ Mục 3:</b> Các mục trước coi nguyên tử là những quả cầu đứng yên trên mạng. Mục này hỏi: cái gì giữ chúng lại, và nếu thay một nguyên tử bằng nguyên tử khác thì sao?</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Đây là mục <b>quan trọng nhất của Buổi 1</b> với bán dẫn. <i>Pha tạp</i> là cách biến Si từ gần như cách điện thành vật liệu làm diode, transistor. Toàn bộ các buổi sau đều xoay quanh nó.</div>

    <h3>4.1. Bốn loại liên kết nguyên tử trong chất rắn</h3>

    <ul>
      <li><b>Liên kết Ion (Ionic bond):</b> Giữa nguyên tử Nhóm I (dễ nhường 1 electron thành ion dương, như $\text{Na}^+$) và Nhóm VII (dễ nhận 1 electron thành ion âm, như $\text{Cl}^-$). Hai ion trái dấu hút nhau bằng lực tĩnh điện Coulomb tạo thành muối ăn $\text{NaCl}$.</li>
      <li><b>Liên kết Kim loại (Metallic bond):</b> Các nguyên tử kim loại góp chung electron hóa trị tạo thành một "biển electron tự do" bao quanh các ion dương đứng yên.</li>
      <li><b>Liên kết Van der Waals:</b> Lực hút cực yếu giữa các phân tử có sự lệch tâm điện tích (lưỡng cực điện).</li>
      <li><b>Liên kết Cộng hóa trị (Covalent bond - Quan trọng nhất với Bán dẫn):</b> Mỗi nguyên tử Silicon (Nhóm IV) có <b>4 electron hóa trị</b>. Nó đứng ở tâm tứ diện và đưa 4 electron này ra "góp gạo thổi cơm chung" với 4 nguyên tử $\text{Si}$ hàng xóm gần nhất. Mỗi cặp nguyên tử dùng chung 2 electron, giúp mỗi nguyên tử $\text{Si}$ có đủ 8 electron lớp vỏ ngoài cùng bền vững.</li>
    </ul>

    <h3>4.2. Mô hình tương tác: Liên kết Cộng hóa trị & Pha tạp (Doping) trong Silicon</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Tinh khiết thì Si dẫn điện rất kém. Pha tạp là cách chủ động tạo ra electron hoặc lỗ trống để điều khiển dòng điện.</li><li><b>Dùng để làm gì:</b> Biết: pha <b>P</b> (Nhóm V) → dư 1 electron → loại <b>n</b>; pha <b>B</b> (Nhóm III) → thiếu 1 electron, tạo lỗ trống → loại <b>p</b>.</li><li><b>Cách dùng mô hình:</b> Bấm lần lượt 3 tab: Si tinh khiết (đủ 8 electron liên kết), pha P (dư 1 electron tự do), pha B (thiếu 1 electron nên có lỗ trống).</li><li><b>Liên hệ với phần khác:</b> Từ Buổi 5, ta tính cụ thể có bao nhiêu electron và lỗ trống sinh ra, và Buổi 6 xét cả hai loại tạp chất cùng lúc.</li></ul></div>

    <p>Kỹ thuật thêm một lượng nhỏ nguyên tử ngoại lai vào bán dẫn để thay đổi tính chất điện gọi là <b>Pha tạp (Doping)</b> (thực hiện bằng phương pháp <i>Khuếch tán nhiệt ở $\approx 1000^\circ\text{C}$</i> hoặc <i>Bắn phá Cấy ion năng lượng cao $\approx 50\text{ keV}$ rồi ủ nhiệt</i>). Hãy bấm vào mô hình dưới đây để xem điều gì xảy ra khi thay 1 nguyên tử $\text{Si}$ ở giữa bằng tạp chất:</p>

    <h3>4.4. Mô hình tương tác: Công nghệ kéo đơn tinh thể Czochralski & Epitaxy</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 236" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><path d="M95,150 L120,215 L230,215 L255,150" style="fill:var(--c3);stroke:var(--c3);stroke-width:3;fill-opacity:0.25"/><line x1="100" y1="168" x2="250" y2="168" style="stroke:var(--c3);stroke-width:2" stroke-dasharray="5 4"/><text x="175" y="198" text-anchor="middle" style="fill:var(--c3);font-size:12px;font-weight:700">Si nóng chảy</text><rect x="165" y="20" width="20" height="90" rx="2" style="fill:var(--g);stroke:var(--mut);stroke-width:2;fill-opacity:0.5"/><rect x="155" y="108" width="40" height="58" rx="6" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.4"/><text x="175" y="14" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">thanh kéo + mầm</text><path d="M135,60 A40,14 0 0 1 215,60" style="fill:none;stroke:var(--c4);stroke-width:2.5;fill-opacity:1" marker-end="url(#fa)"/><text x="265" y="50" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:400">quay chậm</text><line x1="290" y1="120" x2="290" y2="60" style="stroke:var(--c2);stroke-width:2.5" marker-end="url(#fa)"/><text x="298" y="95" text-anchor="start" style="fill:var(--c2);font-size:12px;font-weight:400">kéo lên</text><path d="M78,150 L86,165 L78,180 L86,195 L78,210" style="fill:none;stroke:var(--c4);stroke-width:2.5;fill-opacity:1"/><path d="M262,150 L270,165 L262,180 L270,195 L262,210" style="fill:none;stroke:var(--c4);stroke-width:2.5;fill-opacity:1"/><text x="175" y="138" text-anchor="middle" style="fill:var(--c1);font-size:12px;font-weight:700">thỏi đơn tinh thể</text><text x="60" y="222" text-anchor="middle" style="fill:var(--c4);font-size:11px;font-weight:400">lò nung</text></svg><figcaption>Phương pháp Czochralski: nhúng mầm vào Si nóng chảy, vừa kéo lên vừa quay để nuôi đơn tinh thể.</figcaption></figure>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Chip cần đơn tinh thể cực sạch, nên phải có quy trình nuôi đặc biệt.</li><li><b>Dùng để làm gì:</b> Nhớ chuỗi: nung chảy Si → nhúng tinh thể mầm → kéo và quay chậm → thỏi đơn tinh thể → cưa thành wafer.</li><li><b>Cách dùng mô hình:</b> Kéo thanh trượt để nâng mầm tinh thể Czochralski lên theo % hành trình, và quan sát thỏi đơn tinh thể hình thành dần phía dưới mầm.</li><li><b>Liên hệ với phần khác:</b> Đây là nguồn gốc của "đơn tinh thể" ở Mục 1, vật liệu đầu vào của mọi phần sau.</li></ul></div>

    <p>Làm sao người ta biến cát thạch anh thành thỏi Silicon đơn tinh thể tinh khiết tới mức cứ $10^{10}$ nguyên tử Silicon mới có dưới $1$ nguyên tử tạp chất lạ? Phương pháp nổi tiếng nhất là <b>Kéo tinh thể từ chất lỏng nóng chảy Czochralski</b>:</p>
    <ul>
      <li>Người ta nung chảy Silicon trong nồi nung (Crucible), sau đó nhúng một mẩu <b>tinh thể mầm (Seed crystal)</b> đơn tinh thể vào mặt chất lỏng rồi vừa xoay nhẹ vừa kéo từ từ lên.</li>
      <li>Nếu cần làm sạch thêm, người ta dùng kỹ thuật <b>Tinh luyện vùng (Zone refining)</b>: cho cuộn dây nhiệt cao tần chạy dọc thỏi Silicon để vùng nóng chảy cuốn toàn bộ tạp chất dồn về đuôi thỏi rồi cắt bỏ.</li>
      <li>Sau đó thỏi Silicon (boule) được mài vát một mặt phẳng định hướng, cưa thành từng đĩa mỏng, ăn mòn hóa học và đánh bóng thành tấm <b>Wafer (Đế / Substrate)</b>. Trên mặt Wafer, người ta có thể nuôi tiếp các lớp đơn tinh thể siêu mỏng gọi là <b>Lớp Epitaxy</b> (bằng phương pháp bốc hơi hóa học <i>CVD</i>, pha lỏng <i>LPE</i> hoặc chùm tia phân tử <i>MBE</i>).</li>
    </ul>
