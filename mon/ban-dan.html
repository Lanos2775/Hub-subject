  <section>
    <h2>2. Giản Đồ Không Gian $k$ ($E$-$k$), Khối Lượng Hiệu Dụng & Khái Niệm Lỗ Trống</h2>
    <div class="bridge"><b>Nối từ Mục 1:</b> Mỗi dải có một quan hệ năng lượng - số sóng $E(k)$. Đồ thị của nó là giản đồ $E$-$k$.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Khối lượng hiệu dụng $m^*$ gói gọn tác dụng của cả mạng tinh thể, nên ta dùng $F=m^*a$ như với hạt tự do. Lỗ trống cho phép đếm dòng điện của dải gần đầy electron như một hạt dương.</div>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Để mô tả electron trong tinh thể, ta vẽ năng lượng theo số sóng $k$ thay vì theo vị trí.</li><li><b>Dùng để làm gì:</b> Đọc dạng đồ thị $E$-$k$, mở rộng và rút gọn, để biết dải nào nằm ở đâu.</li><li><b>Liên hệ với phần khác:</b> 2.2 lấy độ dốc và độ cong của đồ thị này để tính vận tốc và khối lượng hiệu dụng.</li></ul></div>

    <p>Đối với một electron hoàn toàn tự do trong chân không ($V=0$), mối liên hệ giữa năng lượng $E$ và số sóng $k$ là một <b>đường Parabol liên tục</b>: $E = \frac{p^2}{2m_0} = \frac{\hbar^2 k^2}{2m_0}$. Nhưng khi electron di chuyển trong mạng tinh thể tuần hoàn (Mô hình Kronig-Penney), đường Parabol liên tục này bị <b>bẻ gãy tại các biên $k = \pm\frac{\pi}{a}, \pm\frac{2\pi}{a}, \pm\frac{3\pi}{a}\dots$</b> tạo ra các khe năng lượng cấm (Forbidden gaps)!</p>
    <p>Hơn nữa, vì hàm $\cos(ka) = \cos(ka \pm 2n\pi)$ tuần hoàn theo chu kỳ $\frac{2\pi}{a}$, ta có thể dịch chuyển (tịnh tiến) tất cả các nhánh đồ thị ở xa một đoạn bội số của $\frac{2\pi}{a}$ để gom toàn bộ về nằm gọn trong khoảng trung tâm $\mathbf{-\frac{\pi}{a} \le k \le +\frac{\pi}{a}}$. Cách vẽ gom gọn này gọi là <b>Giản đồ vùng rút gọn (Reduced $k$-space diagram hay Vùng Brillouin thứ nhất)</b>.</p>

    <p>Trong mạng tinh thể, một hạt electron không chỉ chịu lực của điện trường ngoài ($F_{\text{ext}} = -e\mathcal{E}$) mà còn chịu hàng tỷ lực đẩy/hút nội tại ($F_{\text{int}}$) từ các ion nguyên tử nút mạng: $F_{\text{total}} = F_{\text{ext}} + F_{\text{int}} = m_0 a$. Làm sao tính được gia tốc $a$ khi không thể cộng hết hàng tỷ lực nội tại $F_{\text{int}}$?</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Chạy bộ trên đường nhựa vs. Chạy bộ dưới hồ bơi</b><br>
      Nếu em đẩy một người bạn bằng một lực $F_{\text{ext}}$ trên đường nhựa, bạn ấy lao đi rất nhanh. Nhưng cũng với lực đẩy $F_{\text{ext}}$ đó mà đẩy bạn ấy khi đang đứng dưới hồ nước sâu (hoặc trong đầm lầy), bạn ấy nhích đi chậm rì! Thay vì phải ngồi tính lực cản của từng phân tử nước ($F_{\text{int}}$), các nhà vật lý dùng một mẹo cực kỳ thông minh: <b>Coi như không có nước cản trở, nhưng cân nặng của người bạn đã tăng lên thành một "Khối lượng hiệu dụng $m^*$ (Effective mass)"</b> để vẫn dùng được định luật Newton quen thuộc:
      $$\mathbf{F_{\text{ext}} = m^* \cdot a}$$
    </div>

    <p>Bằng cách lấy đạo hàm bậc nhất và đạo hàm bậc hai của năng lượng $E$ theo số sóng $k$ (tương tự hạt tự do $E = \frac{\hbar^2 k^2}{2m}$), ta có hai công thức "vàng" để đọc mọi giản đồ $E$-$k$ (áp dụng trực tiếp cho <b>Câu 3 và Câu 4 Bài tập</b>):</p>
    <div class="f">
      $$\text{1. Vận tốc hạt dẫn: } \mathbf{v = \frac{1}{\hbar}\frac{dE}{dk}} \qquad \Big| \qquad \text{2. Nghịch đảo Khối lượng hiệu dụng: } \mathbf{\frac{1}{m^*} = \frac{1}{\hbar^2}\frac{d^2 E}{dk^2}}$$
    </div>
    <div class="box legend"><b>Đọc hai công thức</b><ul><li>$\dfrac{dE}{dk}$: <b>độ dốc</b> của đồ thị $E$-$k$ tại điểm đang xét, cho biết vận tốc $v$ (dốc lên thì $v>0$).</li><li>$\dfrac{d^2E}{dk^2}$: <b>độ cong</b> của đồ thị, cho biết $m^*$. Cong lên ($\cup$) thì $m^*>0$; cong xuống ($\cap$) thì $m^*<0$; cong càng ít (parabol càng rộng) thì $m^*$ càng lớn.</li><li>$\hbar$: hằng số Planck rút gọn.</li></ul></div>


    <div class="box tip">
      <b>Mẹo đọc nhanh Vận tốc $v$ và Khối lượng hiệu dụng $m^*$ bằng mắt thường (Giải Câu 3 & Câu 4):</b>
      <ul>
        <li><b>Dấu của vận tốc $v$ phụ thuộc vào ĐỘ DỐC TIẾP TUYẾN $\left(\frac{dE}{dk}\right)$:</b><br>
          • Đồ thị đang <b>đi lên</b> khi nhìn từ trái sang phải ($\frac{dE}{dk} > 0$) $\implies$ Vận tốc $v > 0$ (chuyển động theo chiều <b>$+x$</b>).<br>
          • Đồ thị đang <b>đi xuống</b> khi nhìn từ trái sang phải ($\frac{dE}{dk} < 0$) $\implies$ Vận tốc $v < 0$ (chuyển động ngược theo chiều <b>$-x$</b>).</li>
        <li><b>Dấu và Độ lớn của Khối lượng hiệu dụng $m^*$ phụ thuộc vào ĐỘ CONG $\left(\frac{d^2 E}{dk^2}\right)$:</b><br>
          • Đồ thị <b>Bề lõm quay lên trên ($\cup$ — giống cái bát ngửa, gần đáy vùng dẫn)</b> $\implies$ Đạo hàm bậc hai $\frac{d^2E}{dk^2} > 0 \implies$ <b>Khối lượng hiệu dụng DƯƠNG ($m^* > 0$)</b>.<br>
          • Đồ thị <b>Bề lõm quay xuống dưới ($\cap$ — giống cái bát úp, gần đỉnh vùng hóa trị)</b> $\implies$ Đạo hàm bậc hai $\frac{d^2E}{dk^2} < 0 \implies$ <b>Khối lượng hiệu dụng ÂM ($m^* < 0$)</b>.<br>
          • <b>So sánh độ lớn $m^*$:</b> Vì $m^*$ tỉ lệ nghịch với độ cong $\frac{d^2E}{dk^2}$, nên Parabol nào <b>hẹp và dốc đứng hơn (cong gắt hơn) thì có $m^*$ NHỎ HƠN</b>; ngược lại Parabol nào <b>mở rộng và thoải hơn (ít cong hơn) thì có $m^*$ LỚN HƠN</b>!</li>
      </ul>
    </div>

    <h3>2.3. Khái niệm Lỗ trống (Hole) — Hạt mang điện tích dương $+e$</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Dải hóa trị gần đầy electron, nên theo dõi từng electron là rất rối. Dễ hơn là theo dõi vài chỗ trống, gọi là lỗ trống.</li><li><b>Dùng để làm gì:</b> Xem lỗ trống như một hạt dương $+e$ có $m_p^*>0$.</li><li><b>Liên hệ với phần khác:</b> Buổi 5 đếm nồng độ lỗ trống $p_0$ cạnh nồng độ electron $n_0$.</li></ul></div>

    <figure class="fig fl"><svg viewBox="0 0 420 160" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><circle cx="50" cy="85" r="14" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><circle cx="100" cy="85" r="14" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><circle cx="150" cy="85" r="14" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><circle cx="200" cy="85" r="14" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><circle cx="250" cy="85" r="14" style="fill:none;stroke:var(--c4);stroke-width:2.5;fill-opacity:1"/><circle cx="300" cy="85" r="14" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><circle cx="350" cy="85" r="14" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:0.5"/><path d="M200,62 Q225,30 250,62" style="fill:none;stroke:var(--c1);stroke-width:2.5;fill-opacity:1" marker-end="url(#fa)"/><text x="225" y="28" text-anchor="middle" style="fill:var(--c1);font-size:12px;font-weight:400">electron nhảy sang phải</text><line x1="250" y1="125" x2="200" y2="125" style="stroke:var(--c4);stroke-width:2.5" marker-end="url(#fa)"/><text x="225" y="146" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">lỗ trống dịch sang trái</text><text x="250" y="68" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400"></text><text x="250" y="110" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400"></text></svg><figcaption>Electron di chuyển lấp chỗ trống thì "lỗ trống" dời đi theo chiều ngược lại, như hạt mang điện dương.</figcaption></figure>

    <p>Khi nhiệt độ $T > 0\text{ K}$, một số electron ở dải hóa trị hấp thụ năng lượng nhiệt, bứt đứt liên kết cộng hóa trị để nhảy vọt qua vùng cấm $E_g$ lên dải dẫn, để lại một <b>chỗ trống (empty state)</b> trong dải hóa trị. Khi có điện trường ngoài tác dụng, các electron hóa trị lân cận lần lượt nhảy sang lấp vào chỗ trống đó, làm cho chỗ trống di chuyển ngược chiều với electron!</p>
    <p>Đặc biệt, các trạng thái ở gần <b>đỉnh của dải hóa trị ($E_v$)</b> có dạng Parabol úp ngược ($E - E_v = -C_2 k^2$), nghĩa là electron ở đó có <b>khối lượng hiệu dụng âm ($m^* = -|m^*| < 0$)</b>. Khi đặt dưới điện trường $\mathcal{E}$, gia tốc của electron này là:
      $$a = \frac{-e\mathcal{E}}{-|m^*|} = \frac{+e\mathcal{E}}{|m^*|} = \frac{+e\mathcal{E}}{m_p^*}$$
      Nghĩa là một trạng thái thiếu electron ở đỉnh dải hóa trị chuyển động <b>cùng chiều điện trường $\mathcal{E}$ giống hệt như một hạt thực thụ mang điện tích dương $+e$ và có khối lượng hiệu dụng dương $m_p^* = |m^*| > 0$</b>. Hạt giả (quasiparticle) tuyệt vời đó được gọi là <b>Lỗ trống (Hole)</b>!
    </p>

    <h3>2.4. Mô hình tương tác: Khảo sát Giản đồ $E$-$k$, Độ cong $m^*$ & Chiều vận tốc (Minh họa Câu 3 & Câu 4)</h3>

    <ul>
      <li><b>Phân loại theo cấu trúc vùng ở $T = 0\text{ K}$:</b><br>
        • <b>Chất cách điện / Điện môi (Insulator):</b> Dải hóa trị đầy kín, dải dẫn trống rỗng, vùng cấm cực lớn ($E_g \approx 3.5 - 6.0\text{ eV}$). Nhiệt độ phòng không thể kích thích electron nhảy qua nổi.<br>
        • <b>Chất bán dẫn (Semiconductor):</b> Cấu trúc giống hệt chất cách điện ở $T=0\text{ K}$, nhưng có vùng cấm hẹp vừa phải ($E_g \approx 1.0\text{ eV}$; cụ thể <b>$\text{Si}$ có $E_g = 1.12\text{ eV}$</b>, <b>$\text{GaAs}$ có $E_g = 1.42\text{ eV}$</b>). Ở nhiệt độ phòng ($300\text{ K}$) hoặc khi chiếu ánh sáng có năng lượng photon $h\nu \ge E_g$ (như <b>Câu 5</b>), electron dễ dàng nhảy lên dải dẫn tạo dòng điện.<br>
        • <b>Kim loại (Metal):</b> Dải cho phép chỉ mới điền một nửa, hoặc dải dẫn và dải hóa trị chồng lấn lên nhau ($E_g = 0$). Electron tự do dẫn điện ngay cả ở $T = 0\text{ K}$.
      </li>
      <li><b>Phân loại Bán dẫn theo hình dạng vùng cấm 3D trong không gian $k$:</b><br>
        • <span class="k b2">Bán dẫn vùng cấm thẳng (Direct Bandgap - ví dụ: $\text{GaAs}$)</span> Đáy vùng dẫn ($E_c$) và đỉnh vùng hóa trị ($E_v$) nằm tại <b>cùng một giá trị động lượng tinh thể ($k = 0$)</b>. Electron có thể nhảy thẳng từ $E_v$ lên $E_c$ (hoặc rơi thẳng từ $E_c$ xuống $E_v$ phát ra ánh sáng) chỉ bằng cách hấp thụ/phát xạ 1 photon ($\Delta E = h\nu \ge E_g, \Delta k = 0$) $\implies$ Cực kỳ lý tưởng để chế tạo đèn LED và Laser!<br>
        • <span class="k b3">Bán dẫn vùng cấm xiên (Indirect Bandgap - ví dụ: $\text{Si}, \text{Ge}$)</span> Đáy vùng dẫn ($E_c$) bị lệch vị trí $k$ so với đỉnh vùng hóa trị ($E_v$ tại $k=0$). Để chuyển mức, electron vừa phải đổi năng lượng $\Delta E$ (nhờ Photon), vừa phải đổi động lượng $\Delta k$ (nhờ va chạm với dao động mạng tinh thể gọi là hạt <b>Phonon</b>) $\implies$ Xác suất phát sáng rất kém.
      </li>
    </ul>

    <div class="box key"><b>Mục 2 — Nhớ</b><ul><li>Vận tốc: $v=\dfrac1\hbar\dfrac{dE}{dk}$ (theo <b>độ dốc</b>).</li><li>Khối lượng hiệu dụng: $\dfrac1{m^*}=\dfrac1{\hbar^2}\dfrac{d^2E}{dk^2}$ (theo <b>độ cong</b>). Cong lên ($\cup$): $m^*\gt0$. Cong xuống ($\cap$): $m^*\lt0$. Parabol càng rộng thì $m^*$ càng lớn.</li><li><b>Lỗ trống:</b> chỗ trống electron ở đỉnh dải hóa trị, hành xử như hạt mang điện $+e$ và $m_p^*\gt0$.</li><li>GaAs: vùng cấm <b>thẳng</b>, $E_g=1.42\text{ eV}$. Si: vùng cấm <b>xiên</b>, $E_g=1.12\text{ eV}$.</li><li>Photon kích thích electron qua vùng cấm khi $h\nu\ge E_g$, tức $\lambda_{\max}\approx\dfrac{1240}{E_g[\text{eV}]}\text{ nm}$.</li></ul></div>

  <section>
    <h2>3. Hàm Mật Độ Trạng Thái $g(E)$ & Cơ Học Thống Kê Fermi-Dirac</h2>
    <div class="bridge"><b>Nối từ Mục 2:</b> Để có dòng điện, cần biết số hạt dẫn. Mục này cho hai nguyên liệu để đếm.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Số electron trong dải dẫn = (số chỗ ngồi tại mỗi mức) × (xác suất chỗ đó có người). Hai thừa số này chính là $g(E)$ và $f_F(E)$, và Buổi 5 chỉ việc nhân chúng.</div>

    <p>Để tính được dòng điện chạy trong linh kiện bán dẫn, người kỹ sư bắt buộc phải đếm được có bao nhiêu hạt electron tự do trong dải dẫn và bao nhiêu lỗ trống trong dải hóa trị trên mỗi $\text{cm}^3$. Để đếm số hạt đó, ta dùng nguyên lý <b>"Rạp hát Lượng tử"</b> gồm 2 thành phần:</p>
    <div class="f">
      $$\text{Mật độ hạt tại mức năng lượng } E = \underbrace{g(E)}_{\text{Số ghế ngồi có sẵn}} \times \underbrace{f_F(E)}_{\text{Xác suất ghế có người ngồi}}$$
    </div>
    <div class="box legend"><b>Đọc phép nhân</b><ul><li>$g(E)$: số "chỗ ngồi" (trạng thái lượng tử) trên mỗi mức năng lượng.</li><li>$f_F(E)$: xác suất chỗ ngồi đó có electron, từ 0 đến 1.</li><li>Tích của chúng là số electron thực tế ở mức $E$. Buổi 5 cộng tất cả các mức để ra $n_0$.</li></ul></div>

    <p>Bằng cách nhốt electron vào một khối lập phương giếng thế 3 chiều cạnh $a$, các số sóng bị lượng tử hóa theo $k^2 = k_x^2 + k_y^2 + k_z^2 = (n_x^2 + n_y^2 + n_z^2)\left(\frac{\pi}{a}\right)^2$. Mỗi trạng thái lượng tử chiếm một "ô thể tích nhỏ" là $\left(\frac{\pi}{a}\right)^3$ trong góc phần tám dương ($\frac{1}{8}$ hình cầu) của không gian $k$, và mỗi trạng thái chứa được $2$ electron có Spin ngược chiều nhau ($\uparrow\downarrow$). Từ đó, mật độ trạng thái trên một đơn vị thể tích và một đơn vị năng lượng (số trạng thái trên $\text{m}^{-3}\cdot\text{J}^{-1}$ hoặc $\text{cm}^{-3}\cdot\text{eV}^{-1}$) có dạng hàm căn bậc hai:</p>
    <div class="f">
      $$\text{Hạt tự do: } g(E) = \frac{4\pi(2m)^{3/2}}{h^3}\sqrt{E} \quad \Big| \quad \text{Dải dẫn: } \mathbf{g_c(E) = \frac{4\pi(2m_n^*)^{3/2}}{h^3}\sqrt{E - E_c}} \quad (E \ge E_c)$$
      $$\text{Dải hóa trị: } \mathbf{g_v(E) = \frac{4\pi(2m_p^*)^{3/2}}{h^3}\sqrt{E_v - E}} \quad (E \le E_v)$$
    </div>
    <div class="box legend"><b>Đọc công thức $g_c(E)$</b><ul><li>$m_n^*$: khối lượng hiệu dụng của electron; $h$: hằng số Planck.</li><li>$\sqrt{E-E_c}$: chỉ có trạng thái khi $E\ge E_c$; càng cao hơn đáy dải dẫn càng nhiều.</li><li>Dải hóa trị đối xứng: $g_v(E)\propto\sqrt{E_v-E}$ với $m_p^*$.</li></ul></div>

    <p>Trong tự nhiên có 3 quy luật phân bố hạt vào các mức năng lượng: (1) <b>Maxwell-Boltzmann</b> (dành cho các phân tử khí cổ điển phân biệt được và không giới hạn số hạt trong 1 trạng thái); (2) <b>Bose-Einstein</b> (dành cho các hạt Boson như Photon, Phonon không tuân theo nguyên lý Pauli); và (3) <b>Fermi-Dirac</b> (dành riêng cho các hạt <b>Electron</b> không phân biệt được và <b>tuân thủ nghiêm ngặt Nguyên lý loại trừ Pauli</b> — tối đa 1 hạt trên 1 trạng thái lượng tử!).</p>
    <p>Xác suất để một trạng thái lượng tử ở mức năng lượng $E$ có electron chiếm giữ được cho bởi <b>Hàm phân bố Fermi-Dirac</b>:</p>
    <div class="f">
      $$\mathbf{f_F(E) = \frac{1}{1 + \exp\left(\frac{E - E_F}{kT}\right)}}$$
      <small>Trong đó: $E_F$ gọi là <b>Mức năng lượng Fermi (Fermi energy)</b>; $k = 1.38 \times 10^{-23}\text{ J/K} = 8.62 \times 10^{-5}\text{ eV/K}$ là hằng số Boltzmann.<br>
      Lưu ý sống còn: Ở nhiệt độ phòng $T = 300\text{ K}$, tích số năng lượng nhiệt luôn bằng $\mathbf{kT \approx 0.0259\text{ eV} = 25.9\text{ meV}}$.</small>
    </div>
    <div class="box legend"><b>Đọc hàm Fermi-Dirac</b><ul><li>$E_F$: mức Fermi, nơi xác suất bằng $\frac12$.</li><li>$kT$: năng lượng nhiệt, $0.0259\text{ eV}$ ở $300\text{ K}$; $T$ càng cao thì đường chuyển càng mờ.</li><li>Khi $E\ll E_F$ thì $f_F\to1$ (đầy); khi $E\gg E_F$ thì $f_F\to0$ (trống).</li></ul></div>


    <ul>
      <li><b>Tại nhiệt độ tuyệt đối $T = 0\text{ K}$:</b> Hàm $f_F(E)$ là một bậc thang vuông vức: mọi mức dưới $E_F$ ($E < E_F$) đều đầy kín $100\%$ ($f_F = 1$); mọi mức trên $E_F$ ($E > E_F$) đều trống rỗng hoàn toàn ($f_F = 0$).</li>
      <li><b>Tại nhiệt độ $T > 0\text{ K}$:</b> Ngay tại mức Fermi $E = E_F$, xác suất tìm thấy electron luôn bằng đúng một nửa: $f_F(E_F) = \frac{1}{1 + e^0} = \frac{1}{2} = 50\%$.</li>
      <li><b>Tính đối xứng gương quanh mức Fermi $E_F$:</b> Xác suất để một mức cao hơn $E_F$ một đoạn $\Delta E$ có electron ngồi $\big[f_F(E_F + \Delta E)\big]$ luôn bằng đúng xác suất để một mức thấp hơn $E_F$ một đoạn $\Delta E$ bị bỏ trống (tức có lỗ trống ngồi): $\mathbf{f_F(E_F + \Delta E) = 1 - f_F(E_F - \Delta E)}$.</li>
      <li><b>Xấp xỉ hàm mũ Maxwell-Boltzmann:</b> Khi xét các mức năng lượng nằm cao hơn $E_F$ khá nhiều sao cho $E - E_F \gg kT$ (thực tế chỉ cần $E - E_F \ge 3kT \approx 0.078\text{ eV}$ là sai số đã dưới $5\%$), số hạng $\exp\left(\frac{E-E_F}{kT}\right) \gg 1$, ta được quyền bỏ số $1$ ở mẫu số:
        $$\mathbf{f_F(E) \approx \exp\left[-\frac{E - E_F}{kT}\right]} \qquad (\text{khi } E - E_F \gg kT)$$
      </li>
    </ul>

    <h3>3.3. Mô hình tương tác: Hàm phân bố Fermi-Dirac $f_F(E)$ theo Nhiệt độ & Xấp xỉ Boltzmann</h3>

  <section>
    <h2>4. Cẩm Nang Công Thức Trọng Tâm Buổi 4 (Giải Nghĩa Chi Tiết)</h2>
    <div class="bridge"><b>Nối từ Mục 1–3:</b> Bảng chọn công thức.</div>

    <div class="tw"><table><tr><th>Đề bài hỏi gì?</th><th>Công thức</th></tr><tr><td>Dải cho phép, dải cấm theo $\alpha a$</td><td>Công thức 1</td></tr><tr><td>Vận tốc, $m^*$ từ giản đồ $E$-$k$</td><td>Công thức 2</td></tr><tr><td>Tần số tối thiểu, bước sóng tối đa của photon</td><td>Công thức 3</td></tr><tr><td>Số chỗ ngồi $g(E)$, xác suất $f_F(E)$</td><td>Công thức 4</td></tr></table></div>


    <div class="formula-card">
      <h3>Công thức 1: Phương trình Kronig-Penney & Liên hệ giữa $\alpha a$ và Năng lượng $E$</h3>
      <div class="f key">
        $$f(\alpha a) = P'\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a) = \cos(ka) \qquad \text{với } \alpha = \frac{\sqrt{2mE}}{\hbar} \implies \mathbf{E = \frac{(\alpha a)^2 \hbar^2}{2 m a^2}}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $P' = \frac{m V_0 b a}{\hbar^2}$: Thông số liên kết thế năng của mạng tinh thể (không thứ nguyên).<br>
          • $\alpha a$: Biến số không thứ nguyên (tính bằng radian) đại diện cho mức năng lượng $E$.<br>
          • $a$: Độ rộng giếng thế / hằng số mạng tuần hoàn ($\text{m}$, nhớ đổi $1\text{ Å} = 10^{-10}\text{ m}$).<br>
          • $k$: Số sóng tinh thể ($\text{m}^{-1}$). Biên các vùng Brillouin nằm tại $ka = n\pi$ ($n = 0, 1, 2\dots$).<br>
          • $E$: Năng lượng cho phép của electron ứng với giá trị $\alpha a$ ($\text{J}$, chia cho $1.6 \times 10^{-19}$ để ra $\text{eV}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Vì $-1 \le \cos(ka) \le +1$, nên chỉ những giá trị $\alpha a$ nào thỏa mãn $-1 \le f(\alpha a) \le +1$ mới cho nghiệm năng lượng $E$ nằm trong dải cho phép. Khi biết $\alpha a$ ở đầu dưới ($\alpha_{\min}a$) và đầu trên ($\alpha_{\max}a$) của một dải, ta thay vào $E = \frac{(\alpha a)^2\hbar^2}{2ma^2}$ để tính <b>độ rộng dải năng lượng cho phép $\Delta E = E_{\max} - E_{\min}$</b>!<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 1</b> (tìm $\alpha a$ tại $ka = \pi, 2\pi$) và <b>Câu 2</b> (tính độ rộng dải cho phép $\Delta E$).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 2: Vận tốc Hạt dẫn ($v$) & Khối lượng Hiệu dụng ($m^*$) từ Giản đồ $E$-$k$</h3>
      <div class="f key">
        $$v = \frac{1}{\hbar}\frac{dE}{dk} \qquad \text{và} \qquad \frac{1}{m^*} = \frac{1}{\hbar^2}\frac{d^2 E}{dk^2} \implies m^* = \hbar^2 \left(\frac{d^2 E}{dk^2}\right)^{-1}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $v$: Vận tốc nhóm của hạt dẫn trong tinh thể ($\text{m/s}$).<br>
          • $\frac{dE}{dk}$: Đạo hàm bậc nhất (độ dốc tiếp tuyến) của đường cong $E$-$k$ tại điểm đang xét.<br>
          • $m^*$: Khối lượng hiệu dụng của hạt dẫn ($\text{kg}$).<br>
          • $\frac{d^2 E}{dk^2}$: Đạo hàm bậc hai (độ cong) của đường cong $E$-$k$.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Gói gọn toàn bộ lực tương tác nội tại của mạng tinh thể vào độ cong của giản đồ $E$-$k$. Đường cong $E$-$k$ càng cong gắt (Parabol càng hẹp) thì $\frac{d^2E}{dk^2}$ càng lớn $\implies$ khối lượng hiệu dụng $m^*$ càng nhỏ.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 3</b> (so sánh khối lượng hiệu dụng của hai dải dẫn) và <b>Câu 4</b> (xác định dấu của $m^*$ và chiều của vận tốc $v$).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 3: Tương tác Quang - Bán dẫn (Tần số tối thiểu $\nu_{\min}$ & Bước sóng tối đa $\lambda_{\max}$)</h3>
      <div class="f key">
        $$E_{\text{photon}} = h\nu = \frac{hc}{\lambda} \ge E_g \implies \mathbf{\nu_{\min} = \frac{E_g}{h}} \qquad \text{và} \qquad \mathbf{\lambda_{\max} = \frac{c}{\nu_{\min}} = \frac{hc}{E_g} \approx \frac{1.24\text{ [\mu m}\cdot\text{eV]}}{E_g\text{ [eV]}}}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $E_g = E_c - E_v$: Năng lượng vùng cấm (Bandgap energy) của chất bán dẫn ($\text{eV}$ hoặc $\text{J}$, nhớ đổi $1\text{ eV} = 1.6 \times 10^{-19}\text{ J}$).<br>
          • $\nu_{\min}$: Tần số tối thiểu của photon ánh sáng để kích thích được electron vượt qua vùng cấm ($\text{Hz}$ hoặc $\text{s}^{-1}$).<br>
          • $\lambda_{\max}$: Bước sóng dài nhất của photon còn khả năng kích thích electron ($\text{m}$, $\mu\text{m}$ hoặc $\text{nm}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Để nhấc 1 electron từ đỉnh dải hóa trị ($E_v$) vượt qua vùng cấm lên đáy dải dẫn ($E_c$), hạt ánh sáng (photon) chiếu vào phải có năng lượng tối thiểu bằng độ rộng vùng cấm $E_g$. Vì $E = h\nu = \frac{hc}{\lambda}$, năng lượng tối thiểu ứng với <b>tần số nhỏ nhất $\nu_{\min}$</b> và <b>bước sóng lớn nhất $\lambda_{\max}$</b>.<br>
          • <b>Khi nào dùng:</b> Giải trực tiếp <b>Câu 5</b> cho $\text{GaAs}$ ($E_g = 1.42\text{ eV}$) và $\text{Si}$ ($E_g = 1.12\text{ eV}$).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 4: Hàm Mật độ Trạng thái $g(E)$ & Hàm Phân bố Fermi-Dirac $f_F(E)$</h3>
      <div class="f key">
        $$g_c(E) = \frac{4\pi(2m_n^*)^{3/2}}{h^3}\sqrt{E - E_c} \quad \Big| \quad f_F(E) = \frac{1}{1 + \exp\left(\frac{E - E_F}{kT}\right)} \approx \exp\left(-\frac{E - E_F}{kT}\right)$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $g_c(E), g_v(E)$: Mật độ trạng thái lượng tử trong dải dẫn và dải hóa trị ($\text{m}^{-3}\text{J}^{-1}$ hoặc $\text{cm}^{-3}\text{eV}^{-1}$).<br>
          • $f_F(E)$: Xác suất trạng thái năng lượng $E$ bị chiếm bởi electron (từ $0$ đến $1$).<br>
          • $E_F$: Mức năng lượng Fermi ($\text{eV}$).<br>
          • $kT$: Năng lượng nhiệt ($0.0259\text{ eV}$ tại $T = 300\text{ K}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Cho phép tính tổng số trạng thái lượng tử có sẵn trong một khoảng năng lượng $[E_1, E_2]$ bằng tích phân $N = \int_{E_1}^{E_2} g(E)\,dE$ và xác suất lấp đầy electron ở nhiệt độ $T$ bất kỳ.<br>
          • <b>Khi nào dùng:</b> Tính số trạng thái lượng tử trong dải dẫn/dải hóa trị và làm nền tảng trực tiếp để tính nồng độ hạt dẫn cân bằng $n_0, p_0$ ở Buổi 6.
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>5. Bài Tập Trọng Tâm Buổi 4 (Có Gợi Ý & Giải Chi Tiết Từng Bước)</h2>
    <div class="bridge"><b>Nối từ Mục 4:</b> Mỗi câu luyện một công thức.</div>

    <div class="tw"><table><tr><th>Câu</th><th>Luyện</th><th>Công thức</th></tr><tr><td>1–2</td><td>Đồ thị và độ rộng dải năng lượng cho phép (Kronig-Penney)</td><td>1</td></tr><tr><td>3</td><td>So sánh $m^*$ trên giản đồ $E$-$k$</td><td>2</td></tr><tr><td>4</td><td>Dấu của $m^*$ và chiều vận tốc tại 4 điểm</td><td>2</td></tr><tr><td>5</td><td>Tần số tối thiểu, bước sóng tối đa của photon</td><td>3</td></tr></table></div>

    <div class="box key"><b>Mẹo chung Buổi 4</b><ul><li>Đọc <b>độ dốc</b> để biết vận tốc, đọc <b>độ cong</b> để biết $m^*$.</li><li>Đổi eV ↔ J khi dùng $E=h\nu$.</li></ul></div>

    <p>Dưới đây là toàn bộ 5 bài tập trong phiếu Bài tập Trọng tâm Buổi 4. Em hãy bấm vào <b>Xem Gợi ý</b> để nắm phương pháp trước, sau đó mở <b>Xem Lời giải chi tiết</b> với các dòng giải thích màu xám ở từng bước biến đổi.</p>

    <!-- CÂU 1 BUỔI 4 -->
    <div class="formula-card">
      <h3 id="b4-cau1">Câu 1: Khảo sát Đồ thị và Nghiệm Phương trình Kronig-Penney</h3>
      <p><b>Đề bài:</b><br>
      (a) Vẽ đồ thị hàm số $f(\alpha a) = 12 \frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a)$ trong khoảng từ $0$ đến $4\pi$. Đồng thời, với phương trình $f(\alpha a) = \cos(ka)$, hãy chỉ ra các khoảng giá trị cho phép của $\alpha a$ thỏa mãn hệ thức này.<br>
      (b) Xác định cụ thể giá trị của $\alpha a$ tại các điểm biên: (i) $ka = \pi$ và (ii) $ka = 2\pi$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b4-hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b4-sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b4-hint1" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý (a):</b> Xem lại <b>Mô hình tương tác 1.3</b> ở trên (tab $P' = 12$). Vì vế phải là $\cos(ka)$ luôn nằm trong đoạn $[-1, +1]$, nên các khoảng giá trị cho phép của $\alpha a$ chính là những đoạn mà đồ thị $f(\alpha a)$ nằm giữa hai đường thẳng ngang $y = -1$ và $y = +1$ (tức $-1 \le f(\alpha a) \le +1$).</li>
          <li><b>Ý (b-i) Tại $ka = \pi$:</b> Ta có $\cos(\pi) = -1$. Phương trình trở thành $12\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a) = -1$. Một nghiệm nhìn thấy ngay là $\alpha a = \pi$ (vì $\sin\pi = 0, \cos\pi = -1$). Nghiệm thứ hai nằm trong khoảng $(\pi, 2\pi)$ tìm được bằng phương pháp dò nghiệm (trial and error / nút SOLVE trên máy tính Casio) hoặc dùng đẳng thức lượng giác $\tan\left(\frac{\alpha a}{2}\right) = \frac{\alpha a}{12}$.</li>
          <li><b>Ý (b-ii) Tại $ka = 2\pi$:</b> Ta có $\cos(2\pi) = +1$. Phương trình trở thành $12\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a) = +1$. Một nghiệm hiển nhiên là $\alpha a = 2\pi$ (vì $\sin 2\pi = 0, \cos 2\pi = +1$). Nghiệm kia nằm trong khoảng $(0, \pi)$ tìm bằng máy tính.</li>
        </ul>
      </div>

      <div id="b4-sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Vẽ đồ thị hàm số $f(\alpha a)$ từ $0$ đến $4\pi$ và chỉ ra các khoảng giá trị cho phép của $\alpha a$:</b>
          <span class="cmt">// Bước 1: Xác định giá trị của hàm $f(\alpha a) = 12\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a)$ tại các điểm mốc đặc biệt là bội số của $\pi$ để phác thảo chính xác đồ thị (em có thể đối chiếu trực tiếp với đồ thị Mô hình 1.3 ở trên khi chọn $P'=12$):</span>
          $$\text{• Khi } \alpha a \to 0: \quad \lim_{\alpha a \to 0}\frac{\sin(\alpha a)}{\alpha a} = 1 \implies f(0) = 12(1) + \cos(0) = 12 + 1 = \mathbf{13}$$
          $$\text{• Khi } \alpha a = \pi \approx 3.1416: \quad \sin(\pi) = 0,\ \cos(\pi) = -1 \implies f(\pi) = 12(0) - 1 = \mathbf{-1}$$
          $$\text{• Khi } \alpha a = 2\pi \approx 6.2832: \quad \sin(2\pi) = 0,\ \cos(2\pi) = +1 \implies f(2\pi) = 12(0) + 1 = \mathbf{+1}$$
          $$\text{• Khi } \alpha a = 3\pi \approx 9.4248: \quad \sin(3\pi) = 0,\ \cos(3\pi) = -1 \implies f(3\pi) = 12(0) - 1 = \mathbf{-1}$$
          $$\text{• Khi } \alpha a = 4\pi \approx 12.5664: \quad \sin(4\pi) = 0,\ \cos(4\pi) = +1 \implies f(4\pi) = 12(0) + 1 = \mathbf{+1}$$
          <span class="cmt">// Bước 2: Biện luận điều kiện có nghiệm thực của phương trình Kronig-Penney $f(\alpha a) = \cos(ka)$. Vì số sóng $k$ của electron chuyển động tuần hoàn trong tinh thể phải là số thực, nên $-1 \le \cos(ka) \le +1$. Do đó, các khoảng giá trị cho phép của $\alpha a$ là những khoảng mà tại đó $-1 \le f(\alpha a) \le +1$:</span>
          $$\text{• Dải cho phép thứ 1 (ứng với } 0 \le ka \le \pi\text{): } \quad \mathbf{2.628\text{ rad} \le \alpha a \le \pi\text{ rad}} \quad (\text{hay } 0.836\pi \le \alpha a \le \pi)$$
          $$\text{• Dải cho phép thứ 2 (ứng với } \pi \le ka \le 2\pi\text{): } \quad \mathbf{5.307\text{ rad} \le \alpha a \le 2\pi\text{ rad}} \quad (\text{hay } 1.689\pi \le \alpha a \le 2\pi)$$
          $$\text{• Dải cho phép thứ 3 (ứng với } 2\pi \le ka \le 3\pi\text{): } \quad \mathbf{8.067\text{ rad} \le \alpha a \le 3\pi\text{ rad}} \quad (\text{hay } 2.568\pi \le \alpha a \le 3\pi)$$
          $$\text{• Dải cho phép thứ 4 (ứng với } 3\pi \le ka \le 4\pi\text{): } \quad \mathbf{10.909\text{ rad} \le \alpha a \le 4\pi\text{ rad}} \quad (\text{hay } 3.472\pi \le \alpha a \le 4\pi)$$
          <span class="cmt">// (Ghi chú: Các khoảng nằm giữa các dải cho phép trên, ví dụ $0 \le \alpha a < 2.628$ hay $\pi < \alpha a < 5.307$, đều có $|f(\alpha a)| > 1$ nên là các Dải năng lượng cấm - Forbidden bands).</span>
        </div>

        <div class="step">
          <b>(b) Xác định cụ thể giá trị của $\alpha a$ tại các điểm biên (i) $ka = \pi$ và (ii) $ka = 2\pi$:</b>
          <span class="cmt">// • Trường hợp (i) Tại biên $ka = \pi$: Thay $ka = \pi$ vào vế phải, ta có $\cos(\pi) = -1$. Phương trình Kronig-Penney trở thành:</span>
          $$12\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a) = -1 \quad (1)$$
          <span class="cmt">// Điểm biên $ka = \pi$ là nơi xảy ra bước nhảy vọt từ đỉnh của Dải cho phép thứ 1 ($\alpha_2 a$) lên đáy của Dải cho phép thứ 2 ($\alpha_3 a$):</span>
          <span class="cmt">// + Giá trị thứ nhất tại $ka = \pi$ (đỉnh Dải 1): Ta thấy ngay khi $\alpha a = \pi$ thì $\sin(\pi) = 0$ và $\cos(\pi) = -1$, thỏa mãn tuyệt đối phương trình (1):</span>
          $$(\alpha a)_1 = \mathbf{\pi \approx 3.142\text{ rad}}$$
          <span class="cmt">// + Giá trị thứ hai tại $ka = \pi$ (đáy Dải 2, nằm trong khoảng $\pi < \alpha a < 2\pi$): Biến đổi lượng giác phương trình (1) thành $12\frac{\sin(\alpha a)}{\alpha a} = -(1 + \cos\alpha a) \iff \tan\left(\frac{\alpha a}{2}\right) = \frac{\alpha a}{12}$ (hoặc bấm SHIFT-SOLVE trên máy tính cầm tay ở chế độ Radian trong khoảng $(3.2, 6.2)$), ta tìm được:</span>
          $$(\alpha a)_2 \approx \mathbf{5.307\text{ rad}} \quad (\text{tức } \approx 1.689\pi\text{ rad})$$
        </div>

        <div class="step">
          <span class="cmt">// • Trường hợp (ii) Tại biên $ka = 2\pi$ (và tương đương với $ka = 0$ vì $\cos(2\pi) = \cos(0) = +1$): Phương trình Kronig-Penney trở thành:</span>
          $$12\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a) = +1 \quad (2)$$
          <span class="cmt">// + Giá trị tại đầu dưới của Dải 1 (ứng với $ka = 0$, nơi $\cos(ka) = +1$ trong khoảng $0 < \alpha a < \pi$): Giải phương trình (2) bằng máy tính trong khoảng $(0.1, 3.1)$, ta thu được:</span>
          $$(\alpha a)_{ka=0} \approx \mathbf{2.628\text{ rad}} \quad (\text{tức } \approx 0.836\pi\text{ rad})$$
          <span class="cmt">// + Giá trị thứ nhất tại biên $ka = 2\pi$ (đỉnh của Dải cho phép thứ 2): Thay $\alpha a = 2\pi$ vào (2), ta có $\sin(2\pi) = 0$ và $\cos(2\pi) = +1$, thỏa mãn tuyệt đối phương trình (2):</span>
          $$(\alpha a)_3 = \mathbf{2\pi \approx 6.283\text{ rad}}$$
          <span class="cmt">// + Giá trị thứ hai tại biên $ka = 2\pi$ (đáy của Dải cho phép thứ 3, nằm trong khoảng $2\pi < \alpha a < 3\pi$): Giải phương trình (2) bằng máy tính trong khoảng $(6.3, 9.4)$, ta thu được:</span>
          $$(\alpha a)_4 \approx \mathbf{8.067\text{ rad}} \quad (\text{tức } \approx 2.568\pi\text{ rad})$$
        </div>
      </div>
    </div>

    <!-- CÂU 2 BUỔI 4 -->
    <div class="formula-card">
      <h3 id="b4-cau2">Câu 2: Tính Độ Rộng Dải Năng Lượng Cho Phép (Allowed Energy Bands)</h3>
      <p><b>Đề bài:</b> Sử dụng các thông số từ bài 1 cho electron tự do ($P' = 12$, $m = m_0 = 9.11 \times 10^{-31}\text{ kg}$). Cho giá trị độ rộng giếng thế (tương đương khoảng cách ô mạng tinh thể tuần hoàn) $a = 4.2\text{ Å}$. Xác định độ rộng dải năng lượng cho phép (allowed energy bands) trong khoảng:<br>
      (a) $0 < ka < \pi$<br>
      (b) $\pi < ka < 2\pi$</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b4-hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b4-sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b4-hint2" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Từ định nghĩa $\alpha^2 = \frac{2m_0 E}{\hbar^2} \implies (\alpha a)^2 = \frac{2m_0 a^2 E}{\hbar^2}$, ta rút ra công thức tính mức năng lượng $E$ từ giá trị $(\alpha a)$:
            $$E = \frac{\hbar^2}{2 m_0 a^2}(\alpha a)^2$$
          </li>
          <li><b>Mẹo tính siêu nhanh:</b> Hãy tính trước cụm hằng số $K_0 = \frac{\hbar^2}{2 m_0 a^2}$ ra đơn vị $\text{eV}$ (nhớ đổi $a = 4.2\text{ Å} = 4.2 \times 10^{-10}\text{ m}$ và chia cho $1.6 \times 10^{-19}$). Khi đó với bất kỳ điểm biên $\alpha a$ nào tìm được ở Câu 1, ta chỉ cần lấy $E = K_0 \times (\alpha a)^2$!</li>
          <li><b>Ý (a):</b> Trong khoảng $0 < ka < \pi$ (Dải cho phép thứ 1), $\alpha a$ chạy từ $\alpha_1 a = 2.628\text{ rad}$ (tại $ka=0$) đến $\alpha_2 a = \pi \approx 3.1416\text{ rad}$ (tại $ka=\pi$). Độ rộng dải cho phép thứ nhất là $\Delta E_a = E_2 - E_1$.</li>
          <li><b>Ý (b):</b> Trong khoảng $\pi < ka < 2\pi$ (Dải cho phép thứ 2), $\alpha a$ chạy từ $\alpha_3 a = 5.307\text{ rad}$ (tại $ka=\pi$) đến $\alpha_4 a = 2\pi \approx 6.2832\text{ rad}$ (tại $ka=2\pi$). Độ rộng dải cho phép thứ hai là $\Delta E_b = E_4 - E_3$.</li>
        </ul>
      </div>

      <div id="b4-sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước mở đầu: Thiết lập công thức quy đổi từ $(\alpha a)$ sang năng lượng $E$ (tính bằng $\text{eV}$):</b>
          <span class="cmt">// Bước 1: Đổi độ rộng giếng thế $a = 4.2\text{ Å}$ sang đơn vị chuẩn SI là mét ($\text{m}$):</span>
          $$a = 4.2\text{ Å} = 4.2 \times 10^{-10}\text{ m}$$
          <span class="cmt">// Bước 2: Từ hệ thức $\alpha = \frac{\sqrt{2 m_0 E}}{\hbar}$, ta nhân hai vế với $a$ rồi bình phương để rút ra $E$ theo $(\alpha a)^2$:</span>
          $$\alpha a = \sqrt{\frac{2 m_0 E}{\hbar^2}}\cdot a \implies E = \left(\frac{\hbar^2}{2 m_0 a^2}\right) (\alpha a)^2$$
          <span class="cmt">// Bước 3: Tính giá trị của hệ số hằng số $K_0 = \frac{\hbar^2}{2 m_0 a^2}$ theo đơn vị Joule ($\text{J}$) và đổi sang Electron-Volt ($\text{eV}$) để dùng chung cho cả câu (a) và câu (b):</span>
          $$K_0 = \frac{\hbar^2}{2 m_0 a^2} = \frac{\left(1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right)^2}{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right) \times \left(4.2 \times 10^{-10}\text{ m}\right)^2} = \frac{1.1109 \times 10^{-68}}{3.2140 \times 10^{-49}} \approx 3.4565 \times 10^{-20}\text{ J}$$
          $$K_0\text{ [eV]} = \frac{3.4565 \times 10^{-20}\text{ J}}{1.6 \times 10^{-19}\text{ J/eV}} \approx \mathbf{0.2160\text{ eV}}$$
          <span class="cmt">// Như vậy, mọi mức năng lượng $E$ tính theo đơn vị $\text{eV}$ chỉ đơn giản là: $E = 0.2160 \times (\alpha a)^2$.</span>
        </div>

        <div class="step">
          <b>(a) Độ rộng dải năng lượng cho phép thứ nhất trong khoảng $0 < ka < \pi$:</b>
          <span class="cmt">// Bước 1: Lấy kết quả từ Câu 1: Khi $ka$ biến thiên từ $0$ đến $\pi$, hàm $\cos(ka)$ giảm từ $+1$ xuống $-1$, tương ứng với biến số $\alpha a$ tăng từ $\alpha_1 a = 2.628\text{ rad}$ (tại $ka = 0$) đến $\alpha_2 a = \pi \approx 3.1416\text{ rad}$ (tại $ka = \pi$).</span>
          <span class="cmt">// Bước 2: Tính mức năng lượng ở đáy dải thứ nhất ($E_1$ tại $\alpha_1 a = 2.628$) và đỉnh dải thứ nhất ($E_2$ tại $\alpha_2 a = \pi$):</span>
          $$E_1 = K_0 \times (\alpha_1 a)^2 = 0.2160 \times (2.628)^2 \approx \mathbf{1.492\text{ eV}}$$
          $$E_2 = K_0 \times (\alpha_2 a)^2 = 0.2160 \times (\pi)^2 = 0.2160 \times 9.8696 \approx \mathbf{2.132\text{ eV}}$$
          <span class="cmt">// Bước 3: Lấy mức năng lượng đỉnh dải trừ đi mức năng lượng đáy dải để tìm độ rộng dải cho phép thứ nhất ($\Delta E_1$):</span>
          $$\Delta E_1 = E_2 - E_1 = 2.132\text{ eV} - 1.492\text{ eV} = \mathbf{0.64\text{ eV}}$$
        </div>

        <div class="step">
          <b>(b) Độ rộng dải năng lượng cho phép thứ hai trong khoảng $\pi < ka < 2\pi$:</b>
          <span class="cmt">// Bước 1: Lấy kết quả từ Câu 1: Khi $ka$ biến thiên từ $\pi$ đến $2\pi$, hàm $\cos(ka)$ tăng từ $-1$ lên $+1$, tương ứng với biến số $\alpha a$ tăng từ $\alpha_3 a = 5.307\text{ rad}$ (tại $ka = \pi$) đến $\alpha_4 a = 2\pi \approx 6.2832\text{ rad}$ (tại $ka = 2\pi$).</span>
          <span class="cmt">// Bước 2: Tính mức năng lượng ở đáy dải thứ hai ($E_3$ tại $\alpha_3 a = 5.307$) và đỉnh dải thứ hai ($E_4$ tại $\alpha_4 a = 2\pi$):</span>
          $$E_3 = K_0 \times (\alpha_3 a)^2 = 0.2160 \times (5.307)^2 = 0.2160 \times 28.164 \approx \mathbf{6.084\text{ eV}}$$
          $$E_4 = K_0 \times (\alpha_4 a)^2 = 0.2160 \times (2\pi)^2 = 0.2160 \times 39.478 \approx \mathbf{8.529\text{ eV}}$$
          <span class="cmt">// Bước 3: Lấy $E_4 - E_3$ để tìm độ rộng dải năng lượng cho phép thứ hai ($\Delta E_2$):</span>
          $$\Delta E_2 = E_4 - E_3 = 8.529\text{ eV} - 6.084\text{ eV} = \mathbf{2.45\text{ eV}}$$
          <span class="cmt">// Nhận xét vật lý rất thú vị: Dải năng lượng cho phép ở mức cao ($\Delta E_2 = 2.45\text{ eV}$) rộng hơn gần 4 lần so với dải năng lượng cho phép ở mức thấp ($\Delta E_1 = 0.64\text{ eV}$), bởi vì khi electron có năng lượng $E$ càng lớn thì nó càng ít bị giam giữ bởi các rào thế hạt nhân! (Đồng thời ta cũng thấy ngay độ rộng vùng cấm ngăn cách giữa hai dải này tại $ka=\pi$ là $E_g = E_3 - E_2 = 6.084 - 2.132 = 3.95\text{ eV}$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 3 BUỔI 4 -->
    <div class="formula-card">
      <h3 id="b4-cau3">Câu 3: So Sánh Khối Lượng Hiệu Dụng Trên Giản Đồ $E$-$k$ (Figure P3.13)</h3>
      <p><b>Đề bài:</b> Hai dải dẫn khả dĩ được biểu diễn trên giản đồ năng lượng $E$ theo vectơ sóng $k$ trong Hình P3.13 (Đường liền nét $A$ là Parabol hẹp và dốc đứng hơn; đường nét đứt $B$ là Parabol mở rộng và thoải hơn). Hãy cho biết dải nào sẽ tương ứng với electron có khối lượng hiệu dụng lớn hơn và giải thích lý do.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b4-hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b4-sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b4-hint3" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Viết công thức liên hệ giữa khối lượng hiệu dụng $m^*$ và độ cong (đạo hàm bậc hai) của giản đồ $E$-$k$:
            $$\frac{1}{m^*} = \frac{1}{\hbar^2}\frac{d^2 E}{dk^2} \implies m^* = \frac{\hbar^2}{\frac{d^2 E}{dk^2}}$$
          </li>
          <li>So sánh độ mở (độ cong $\frac{d^2 E}{dk^2}$) của hai đường Parabol $A$ và $B$: Đường nào mở rộng và thoải hơn thì đạo hàm bậc hai $\frac{d^2 E}{dk^2}$ nhỏ hơn $\implies$ khối lượng hiệu dụng $m^*$ lớn hơn!</li>
        </ul>
      </div>

      <div id="b4-sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Viết phương trình xấp xỉ Parabol của năng lượng $E$ theo số sóng $k$ ở gần đáy của dải dẫn (xung quanh cực tiểu $k = 0$):</span>
          $$E - E_c = \frac{\hbar^2 k^2}{2 m^*} = C \cdot k^2$$
          <span class="cmt">// Bước 2: Lấy đạo hàm bậc hai của $E$ theo $k$ để thiết lập mối liên hệ giữa khối lượng hiệu dụng $m^*$ và độ cong hình học của đường biểu diễn $E$-$k$:</span>
          $$\frac{d^2 E}{dk^2} = 2C = \frac{\hbar^2}{m^*} \implies \mathbf{m^* = \frac{\hbar^2}{\left(\frac{d^2 E}{dk^2}\right)}}$$
          <span class="cmt">// Công thức trên chứng tỏ: Khối lượng hiệu dụng $m^*$ tỉ lệ nghịch với đạo hàm bậc hai $\frac{d^2 E}{dk^2}$ (tức tỉ lệ nghịch với độ cong hay độ dốc mở của Parabol).</span>
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Quan sát Hình P3.13 (hoặc xem Mô hình 2.4 tab Câu 3 ở trên): Cùng một độ tăng của số sóng $k$, năng lượng $E$ trên đường cong $A$ tăng vọt lên nhanh hơn nhiều so với đường cong $B$. Nghĩa là Parabol $A$ hẹp và cong gắt hơn, còn Parabol $B$ (nét đứt) mở rộng và phẳng/thoải hơn:</span>
          $$\left(\frac{d^2 E}{dk^2}\right)_B < \left(\frac{d^2 E}{dk^2}\right)_A$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 4: Vì $m^*$ tỉ lệ nghịch với $\frac{d^2 E}{dk^2}$, suy ra đường có độ cong nhỏ hơn sẽ có khối lượng hiệu dụng lớn hơn:</span>
          $$\mathbf{m_B^* > m_A^*}$$
          <span class="cmt">// Kết luận: Dải dẫn B (đường nét đứt mở rộng hơn) tương ứng với electron có khối lượng hiệu dụng LỚN HƠN.</span>
        </div>
      </div>
    </div>

    <!-- CÂU 4 BUỔI 4 -->
    <div class="formula-card">
      <h3 id="b4-cau4">Câu 4: Xác Định Dấu Khối Lượng Hiệu Dụng & Chiều Vận Tốc Tại 4 Điểm A, B, C, D (Figure P3.15)</h3>

text x="162.3" y="130.0" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">B</text><text x="162.3" y="166.0" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:400">m*>0, v ←</text><circle cx="257.7" cy="142.0" r="6" style="fill:var(--c4);stroke:var(--c4);stroke-width:2;fill-opacity:1"/><text x="257.7" y="130.0" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">C</text><text x="257.7" y="166.0" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:400">m*>0, v →</text><circle cx="348.5" cy="66.5" r="6" style="fill:var(--c4);stroke:var(--c4);stroke-width:2;fill-opacity:1"/><text x="348.5" y="54.5" text-anchor="middle" style="fill:var(--c4);font-size:13px;font-weight:700">D</text><text x="348.5" y="90.5" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:400">m*<0, v →</text></svg><figcaption>Câu 4: đáy thung lũng (B, C) có m* dương; hai đỉnh (A, D) có m* âm. Chiều v theo độ dốc.</figcaption></figure>

      <p><b>Đề bài:</b> Tại bốn vị trí khảo sát $A, B, C, D$ trên giản đồ năng lượng $E$-$k$ tuần hoàn của Hình P3.15 (trong đó $B, C$ nằm gần đáy thung lũng xung quanh $k=0$ với $k_B < 0, k_C > 0$; còn $A, D$ nằm gần hai đỉnh đồi biên với $k_A \to -\frac{\pi}{a}$ và $k_D \to +\frac{\pi}{a}$), hãy xác định dấu của khối lượng hiệu dụng (âm hay dương) và xác định chiều của vận tốc hạt dẫn. Lập bảng tổng hợp kết quả cho cả bốn điểm.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b4-hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b4-sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b4-hint4" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Xác định chiều vận tốc $v$:</b> Dùng công thức $v = \frac{1}{\hbar}\frac{dE}{dk}$. Hãy nhìn độ dốc tiếp tuyến $\frac{dE}{dk}$ tại từng điểm:<br>
            + Tại $A$ và $B$ (nằm bên trái trục tung, nơi $k < 0$): Đường cong đang đi dốc xuống từ trái sang phải $\implies \frac{dE}{dk} < 0 \implies v < 0$ (chuyển động theo chiều âm $-x$ / sang trái).<br>
            + Tại $C$ và $D$ (nằm bên phải trục tung, nơi $k > 0$): Đường cong đang đi dốc lên từ trái sang phải $\implies \frac{dE}{dk} > 0 \implies v > 0$ (chuyển động theo chiều dương $+x$ / sang phải).</li>
          <li><b>Xác định dấu khối lượng hiệu dụng $m^*$:</b> Dùng công thức $\frac{1}{m^*} = \frac{1}{\hbar^2}\frac{d^2 E}{dk^2}$. Nhìn hướng bề lõm của đường cong:<br>
            + Tại $B$ và $C$ (nằm ở vùng đáy thung lũng quanh $k=0$): Đường cong có bề lõm hướng lên trên ($\cup$) $\implies \frac{d^2 E}{dk^2} > 0 \implies m^* > 0$ (Dương).<br>
            + Tại $A$ và $D$ (nằm ở vùng gần đỉnh đồi sát biên $\pm\frac{\pi}{a}$, phía ngoài điểm uốn): Đường cong có bề lõm hướng xuống dưới ($\cap$) $\implies \frac{d^2 E}{dk^2} < 0 \implies m^* < 0$ (Âm).</li>
        </ul>
      </div>

      <div id="b4-sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước 1: Nêu hai công thức đạo hàm cơ sở để xét dấu từ đồ thị $E$-$k$:</b>
          <span class="cmt">// • Vận tốc hạt dẫn tỉ lệ thuận với đạo hàm bậc nhất (hệ số góc tiếp tuyến) của đường cong $E$-$k$:</span>
          $$v = \frac{1}{\hbar}\frac{dE}{dk}$$
          <span class="cmt">// • Khối lượng hiệu dụng tỉ lệ thuận về dấu với đạo hàm bậc hai (độ cong hình học) của đường cong $E$-$k$:</span>
          $$\frac{1}{m^*} = \frac{1}{\hbar^2}\frac{d^2 E}{dk^2}$$
        </div>

        <div class="step">
          <b>Bước 2: Phân tích chi tiết từng điểm A, B, C, D trên Hình P3.15 (xem trực quan trên Mô hình 2.4):</b>
          <span class="cmt">// • Tại điểm A (nằm ở vùng $k < 0$ gần biên trái $-\frac{\pi}{a}$, sát đỉnh cực đại của dải):</span>
          <p>+ Khi $k$ tăng từ trái sang phải qua điểm $A$, đồ thị $E(k)$ đang đi xuống $\implies$ độ dốc tiếp tuyến $\frac{dE}{dk} < 0 \implies \mathbf{v < 0}$ (vận tốc hướng theo chiều âm trục $x$, tức chiều $-k$ sang trái).<br>
          + Điểm $A$ nằm ở sườn gần đỉnh cực đại nên đồ thị úp xuống (lõm xuống dưới $\cap$) $\implies$ đạo hàm bậc hai $\frac{d^2 E}{dk^2} < 0 \implies$ <b>Khối lượng hiệu dụng ÂM ($m^* < 0$)</b>.</p>

          <span class="cmt">// • Tại điểm B (nằm ở vùng $k < 0$ gần đáy cực tiểu quanh $k = 0$):</span>
          <p>+ Khi $k$ tăng từ trái sang phải qua điểm $B$, đồ thị $E(k)$ vẫn đang đi xuống về phía đáy $k=0 \implies \frac{dE}{dk} < 0 \implies \mathbf{v < 0}$ (vận tốc hướng theo chiều âm $-x$ sang trái).<br>
          + Điểm $B$ nằm gần đáy cực tiểu nên đồ thị ngửa lên (lõm lên trên $\cup$) $\implies$ đạo hàm bậc hai $\frac{d^2 E}{dk^2} > 0 \implies$ <b>Khối lượng hiệu dụng DƯƠNG ($m^* > 0$)</b>.</p>

          <span class="cmt">// • Tại điểm C (nằm ở vùng $k > 0$ gần đáy cực tiểu quanh $k = 0$):</span>
          <p>+ Khi $k$ tăng từ trái sang phải qua điểm $C$, đồ thị $E(k)$ đang đi lên $\implies$ độ dốc tiếp tuyến $\frac{dE}{dk} > 0 \implies \mathbf{v > 0}$ (vận tốc hướng theo chiều dương $+x$ sang phải).<br>
          + Điểm $C$ nằm trong lòng chảo cực tiểu nên đồ thị ngửa lên ($\cup$) $\implies \frac{d^2 E}{dk^2} > 0 \implies$ <b>Khối lượng hiệu dụng DƯƠNG ($m^* > 0$)</b>.</p>

          <span class="cmt">// • Tại điểm D (nằm ở vùng $k > 0$ gần biên phải $+\frac{\pi}{a}$, sát đỉnh cực đại của dải):</span>
          <p>+ Khi $k$ tăng từ trái sang phải qua điểm $D$, đồ thị $E(k)$ vẫn đang đi lên tới đỉnh $\implies \frac{dE}{dk} > 0 \implies \mathbf{v > 0}$ (vận tốc hướng theo chiều dương $+x$ sang phải).<br>
          + Điểm $D$ nằm gần đỉnh cực đại nên đồ thị úp xuống ($\cap$) $\implies \frac{d^2 E}{dk^2} < 0 \implies$ <b>Khối lượng hiệu dụng ÂM ($m^* < 0$)</b>.</p>
        </div>

        <div class="step">
          <b>Bước 3: Bảng tổng hợp kết quả cho cả bốn điểm A, B, C, D:</b>
          <div class="tw">
            <table>
              <tr>
                <th>Vị trí điểm</th>
                <th>Độ dốc $\frac{dE}{dk}$</th>
                <th>Chiều vận tốc hạt dẫn ($v$)</th>
                <th>Độ cong $\frac{d^2E}{dk^2}$</th>
                <th>Dấu khối lượng hiệu dụng ($m^*$)</th>
              </tr>
              <tr>
                <td><b>Điểm A</b></td>
                <td>$\frac{dE}{dk} < 0$ (Dốc xuống)</td>
                <td><b>Chiều âm ($-x$ / sang trái)</b> ($v < 0$)</td>
                <td>$\frac{d^2E}{dk^2} < 0$ (Úp $\cap$)</td>
                <td><span class="k b4">Âm ($m^* < 0$)</span></td>
              </tr>
              <tr>
                <td><b>Điểm B</b></td>
                <td>$\frac{dE}{dk} < 0$ (Dốc xuống)</td>
                <td><b>Chiều âm ($-x$ / sang trái)</b> ($v < 0$)</td>
                <td>$\frac{d^2E}{dk^2} > 0$ (Ngửa $\cup$)</td>
                <td><span class="k b2">Dương ($m^* > 0$)</span></td>
              </tr>
              <tr>
                <td><b>Điểm C</b></td>
                <td>$\frac{dE}{dk} > 0$ (Dốc lên)</td>
                <td><b>Chiều dương ($+x$ / sang phải)</b> ($v > 0$)</td>
                <td>$\frac{d^2E}{dk^2} > 0$ (Ngửa $\cup$)</td>
                <td><span class="k b2">Dương ($m^* > 0$)</span></td>
              </tr>
              <tr>
                <td><b>Điểm D</b></td>
                <td>$\frac{dE}{dk} > 0$ (Dốc lên)</td>
                <td><b>Chiều dương ($+x$ / sang phải)</b> ($v > 0$)</td>
                <td>$\frac{d^2E}{dk^2} < 0$ (Úp $\cap$)</td>
                <td><span class="k b4">Âm ($m^* < 0$)</span></td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- CÂU 5 BUỔI 4 -->
    <div class="formula-card">
      <h3 id="b4-cau5">Câu 5: Tần Số Tối Thiểu & Bước Sóng Tối Đa Của Photon Kích Thích Bán Dẫn</h3>
    <figure class="fig fr"><svg viewBox="0 0 420 172" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="20.0" y="30" width="212.01" height="26" rx="3" style="fill:var(--c2);stroke:var(--c2);stroke-width:1.5;fill-opacity:0.35"/><rect x="232.01" y="30" width="157.99" height="26" rx="3" style="fill:var(--g);stroke:var(--g);stroke-width:1.5;fill-opacity:0.3"/><text x="26.0" y="24" text-anchor="start" style="fill:var(--c2);font-size:12px;font-weight:700">GaAs: E_g = 1.42 eV</text><text x="126.005" y="48" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:400">bị hấp thụ</text><text x="311.005" y="48" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">đi xuyên qua</text><text x="232.01" y="72" text-anchor="middle" style="fill:var(--c4);font-size:11px;font-weight:700">λmax ≈ 873 nm</text><rect x="20.0" y="86" width="298.59" height="26" rx="3" style="fill:var(--c1);stroke:var(--c1);stroke-width:1.5;fill-opacity:0.35"/><rect x="318.59" y="86" width="71.41000000000003" height="26" rx="3" style="fill:var(--g);stroke:var(--g);stroke-width:1.5;fill-opacity:0.3"/><text x="26.0" y="80" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:700">Si: E_g = 1.12 eV</text><text x="169.295" y="104" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:400">bị hấp thụ</text><text x="354.29499999999996" y="104" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">đi xuyên qua</text><text x="318.59" y="128" text-anchor="middle" style="fill:var(--c4);font-size:11px;font-weight:700">λmax ≈ 1107 nm</text><line x1="20" y1="142" x2="400" y2="142" style="stroke:var(--mut);stroke-width:1.5"/><line x1="57.0" y1="138" x2="57.0" y2="146" style="stroke:var(--mut);stroke-width:1.5"/><text x="57.0" y="160" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">400 nm</text><line x1="168.0" y1="138" x2="168.0" y2="146" style="stroke:var(--mut);stroke-width:1.5"/><text x="168.0" y="160" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">700 nm</text><line x1="279.0" y1="138" x2="279.0" y2="146" style="stroke:var(--mut);stroke-width:1.5"/><text x="279.0" y="160" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">1000 nm</text></svg><figcaption>Câu 5: photon chỉ kích thích được electron nếu bước sóng ngắn hơn λmax = 1240/E_g.</figcaption></figure>

      <p><b>Đề bài:</b> Khảo sát sự tương tác giữa hạt photon và chất bán dẫn.<br>
      (a) Xác định tần số tối thiểu của photon cần thiết để kích thích một electron hóa trị vượt qua dải cấm từ dải hóa trị lên dải dẫn đối với: (i) $\text{GaAs}$ có $E_g = 1.42\text{ eV}$, và (ii) $\text{Si}$ có $E_g = 1.12\text{ eV}$.<br>
      (b) Xác định bước sóng tối đa của photon trong từng trường hợp trên.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b4-hint5')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b4-sol5')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b4-hint5" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý (a):</b> Điều kiện để 1 photon kích thích được 1 electron nhảy từ đỉnh dải hóa trị vượt qua vùng cấm lên đáy dải dẫn là năng lượng photon phải lớn hơn hoặc bằng độ rộng vùng cấm: $E_{\text{photon}} = h\nu \ge E_g$. Do đó tần số tối thiểu là:
            $$\nu_{\min} = \frac{E_g\text{ [J]}}{h} = \frac{E_g\text{ [eV]} \times 1.6 \times 10^{-19}}{6.625 \times 10^{-34}}$$
          </li>
          <li><b>Ý (b):</b> Vì bước sóng $\lambda = \frac{c}{\nu}$ tỉ lệ nghịch với tần số $\nu$, nên tần số tối thiểu $\nu_{\min}$ sẽ tương ứng với <b>bước sóng tối đa $\lambda_{\max}$</b>:
            $$\lambda_{\max} = \frac{c}{\nu_{\min}} = \frac{hc}{E_g}$$
          </li>
        </ul>
      </div>

      <div id="b4-sol5" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>(a) Xác định tần số tối thiểu ($\nu_{\min}$) của photon cho GaAs và Si:</b>
          <span class="cmt">// Bước 1: Thiết lập công thức bảo toàn năng lượng. Để nhấc một electron từ đỉnh vùng hóa trị ($E_v$) vượt qua vùng cấm lên đáy vùng dẫn ($E_c$), năng lượng của hạt photon chiếu tới ($E_{\text{photon}} = h\nu$) tối thiểu phải bằng đúng độ rộng vùng cấm $E_g$:</span>
          $$h\nu_{\min} = E_g \implies \nu_{\min} = \frac{E_g}{h}$$
          <span class="cmt">// Bước 2: Tính tần số tối thiểu cho (i) Gallium Arsenide ($\text{GaAs}$) có $E_g = 1.42\text{ eV}$ (nhớ nhân với $1.6 \times 10^{-19}$ để đổi từ $\text{eV}$ sang Joule trước khi chia cho $h = 6.625 \times 10^{-34}\text{ J}\cdot\text{s}$):</span>
          $$\nu_{\min(\text{GaAs})} = \frac{1.42\text{ eV} \times \left(1.6 \times 10^{-19}\text{ J/eV}\right)}{6.625 \times 10^{-34}\text{ J}\cdot\text{s}} = \frac{2.272 \times 10^{-19}\text{ J}}{6.625 \times 10^{-34}\text{ J}\cdot\text{s}} \approx \mathbf{3.43 \times 10^{14}\text{ Hz}} \quad (\text{hay } 343\text{ THz})$$
          <span class="cmt">// Bước 3: Tính tần số tối thiểu cho (ii) Silicon ($\text{Si}$) có $E_g = 1.12\text{ eV}$:</span>
          $$\nu_{\min(\text{Si})} = \frac{1.12\text{ eV} \times \left(1.6 \times 10^{-19}\text{ J/eV}\right)}{6.625 \times 10^{-34}\text{ J}\cdot\text{s}} = \frac{1.792 \times 10^{-19}\text{ J}}{6.625 \times 10^{-34}\text{ J}\cdot\text{s}} \approx \mathbf{2.705 \times 10^{14}\text{ Hz}} \quad (\text{hay } 270.5\text{ THz})$$
        </div>

        <div class="step">
          <b>(b) Xác định bước sóng tối đa ($\lambda_{\max}$) của photon trong từng trường hợp:</b>
          <span class="cmt">// Bước 1: Vì bước sóng liên hệ nghịch đảo với tần số qua vận tốc ánh sáng $c = 3 \times 10^8\text{ m/s}$ ($\lambda = \frac{c}{\nu}$), nên khi tần số đạt giá trị nhỏ nhất $\nu_{\min}$ thì bước sóng đạt giá trị lớn nhất $\lambda_{\max}$:</span>
          $$\lambda_{\max} = \frac{c}{\nu_{\min}} = \frac{hc}{E_g}$$
          <span class="cmt">// Bước 2: Tính bước sóng tối đa cho (i) $\text{GaAs}$ ($E_g = 1.42\text{ eV}$):</span>
          $$\lambda_{\max(\text{GaAs})} = \frac{3 \times 10^8\text{ m/s}}{3.43 \times 10^{14}\text{ s}^{-1}} \approx \mathbf{8.75 \times 10^{-7}\text{ m}} = \mathbf{0.875\text{ }\mu\text{m}} = \mathbf{875\text{ nm}} = 8750\text{ Å}$$
          <span class="cmt">// Bước 3: Tính bước sóng tối đa cho (ii) $\text{Si}$ ($E_g = 1.12\text{ eV}$):</span>
          $$\lambda_{\max(\text{Si})} = \frac{3 \times 10^8\text{ m/s}}{2.705 \times 10^{14}\text{ s}^{-1}} \approx \mathbf{1.11 \times 10^{-6}\text{ m}} = \mathbf{1.11\text{ }\mu\text{m}} = \mathbf{1110\text{ nm}} = 11100\text{ Å}$$
          <span class="cmt">// Nhận xét ứng dụng thực tế: Cả hai bước sóng ngưỡng $\lambda_{\max(\text{GaAs})} = 0.875\text{ }\mu\text{m}$ và $\lambda_{\max(\text{Si})} = 1.11\text{ }\mu\text{m}$ đều nằm trong vùng Hồng ngoại gần (Near-Infrared). Mọi ánh sáng nhìn thấy (từ tím $0.39\text{ }\mu\text{m}$ đến đỏ $0.77\text{ }\mu\text{m}$) đều có bước sóng ngắn hơn $\lambda_{\max}$ nên đều kích thích sinh ra dòng quang điện rất mạnh trong Pin mặt trời và Cảm biến ảnh bằng Silicon!</span>
        </div>
      </div>
    </div>
  </section>

  <section class="sum">
    <h2>Tổng Kết Buổi 4: Những Điểm Cốt Lõi Cần Nhớ</h2>
    <ul>
      <li><b>Mô hình Kronig-Penney:</b> Phương trình $P'\frac{\sin(\alpha a)}{\alpha a} + \cos(\alpha a) = \cos(ka)$ chỉ có nghiệm số sóng $k$ thực khi $-1 \le f(\alpha a) \le +1$ (tạo thành các <b>Dải năng lượng cho phép</b>), và vô nghiệm khi $|f(\alpha a)| > 1$ (tạo thành các <b>Dải cấm $E_g$</b>).</li>
      <li><b>Giản đồ $E$-$k$, Vận tốc & Khối lượng hiệu dụng:</b> Vận tốc $v = \frac{1}{\hbar}\frac{dE}{dk}$ phụ thuộc vào <b>độ dốc</b> (dốc lên $v>0$, dốc xuống $v<0$). Khối lượng hiệu dụng $\frac{1}{m^*} = \frac{1}{\hbar^2}\frac{d^2E}{dk^2}$ phụ thuộc vào <b>độ cong</b> (lõm lên $\cup \implies m^*>0$; úp xuống $\cap \implies m^*<0$; Parabol càng mở rộng thì $m^*$ càng lớn).</li>
      <li><b>Lỗ trống (Hole) & Phân loại vùng cấm:</b> Trạng thái trống electron ở đỉnh dải hóa trị hành xử như một hạt mang điện tích dương $+e$ và khối lượng dương $m_p^*$. $\text{GaAs}$ có vùng cấm thẳng ($E_g = 1.42\text{ eV}$), còn $\text{Si}$ có vùng cấm xiên ($E_g = 1.12\text{ eV}$).</li>
      <li><b>Mật độ trạng thái $g(E)$ & Phân bố Fermi-Dirac $f_F(E)$:</b> $g_c(E) \propto \sqrt{E - E_c}$ là số chỗ ngồi lượng tử; $f_F(E) = \frac{1}{1 + \exp[(E-E_F)/kT]}$ là xác suất có electron ngồi (bằng $1/2$ tại $E = E_F$, và xấp xỉ thành $\exp[-(E-E_F)/kT]$ khi $E - E_F \ge 3kT$).</li>
    </ul>

</section>

ize:13px;font-weight:400"></text></svg><figcaption>Hình ảnh hóa ví dụ khán giả: ít người ở tầng thượng (n₀), vài ghế trống ở tầng trệt (p₀).</figcaption></figure>

    <div class="box why"><b>Học phần này để làm gì?</b> Đây là công thức trung tâm của cả môn: biết mức Fermi $E_F$ nằm đâu thì tính được $n_0$, $p_0$.</div>

    <p>Chào em! Ở Buổi 4, chúng ta đã chuẩn bị sẵn hai mảnh ghép cực kỳ quan trọng: <b>Hàm mật độ trạng thái $g(E)$</b> (cho biết có bao nhiêu "chiếc ghế trống" ở mỗi mức năng lượng) và <b>Hàm xác suất Fermi-Dirac $f_F(E)$</b> (cho biết xác suất chiếc ghế đó có người ngồi). Bây giờ, bước sang <b>Buổi 5</b>, chúng ta sẽ nhân hai mảnh ghép này lại với nhau để trả lời câu hỏi quan trọng nhất của người kỹ sư bán dẫn: <i>"Trong $1\text{ cm}^3$ chất bán dẫn đang để yên ở nhiệt độ $T$ (trạng thái cân bằng nhiệt), có chính xác bao nhiêu hạt electron tự do ($n_0$) và bao nhiêu hạt lỗ trống ($p_0$)?"</i></p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Đếm tổng số khán giả trên Tầng Thượng và số ghế trống dưới Tầng Trệt</b><br>
      Em hãy hình dung chất bán dẫn như một rạp hát hai tầng ngăn cách bởi khoảng không vùng cấm $E_g$:<br><br>
      • <b>Tầng Thượng là Dải Dẫn ($E \ge E_c$):</b> Bình thường ở $0\text{ K}$ tầng này trống trơn. Khi có nhiệt độ $T > 0\text{ K}$, một số khán giả (electron) nhảy từ tầng trệt lên ngồi ở các hàng ghế đầu của tầng thượng. Để đếm tổng số người trên tầng thượng ($n_0$), ta lấy <b>số ghế ở mỗi hàng $g_c(E)$</b> nhân với <b>tỷ lệ có người ngồi $f_F(E)$</b> rồi cộng dồn (lấy tích phân) từ mép sàn $E_c$ lên tới trần!<br><br>
      • <b>Tầng Trệt là Dải Hóa Trị ($E \le E_v$):</b> Bình thường tầng này chật kín người. Khi một số người nhảy lên tầng thượng, họ để lại các <b>ghế trống (chính là Lỗ trống - Hole)</b> ở những hàng ghế sát trần tầng trệt ($E_v$). Để đếm tổng số ghế trống ($p_0$), ta lấy <b>số ghế ở mỗi hàng $g_v(E)$</b> nhân với <b>tỷ lệ ghế bị bỏ trống $\big[1 - f_F(E)\big]$</b> rồi cộng dồn từ $-\infty$ lên tới đỉnh $E_v$!
    </div>

    <h3>1.1. Thiết lập công thức tổng quát của $n_0$ và $p_0$</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Buổi 4 đã chuẩn bị $g(E)$ (chỗ ngồi) và $f_F(E)$ (xác suất có người). Giờ nhân chúng rồi cộng mọi mức để ra số hạt.</li><li><b>Dùng để làm gì:</b> Viết $n_0$, $p_0$ dưới dạng tích phân.</li><li><b>Liên hệ với phần khác:</b> 1.2 tính tích phân này cho ra công thức gọn.</li></ul></div>

    <p>Theo đúng nguyên lý nhân "Số ghế $\times$ Xác suất ngồi", sự phân bố theo năng lượng của electron trong dải dẫn $n(E)$ và của lỗ trống trong dải hóa trị $p(E)$ được viết là:</p>
    <div class="f">
      $$n(E) = g_c(E)\cdot f_F(E) \implies \mathbf{n_0 = \int_{E_c}^{\infty} g_c(E)\,f_F(E)\,dE}$$
      $$p(E) = g_v(E)\cdot \big[1 - f_F(E)\big] \implies \mathbf{p_0 = \int_{-\infty}^{E_v} g_v(E)\,\big[1 - f_F(E)\big]\,dE}$$
    </div>
    <div class="box legend"><b>Đọc tích phân</b><ul><li>$n(E)$: số electron ở mức $E$ (chỗ ngồi $\times$ xác suất có người).</li><li>$\int_{E_c}^{\infty}\dots dE$: cộng tất cả các mức từ đáy dải dẫn trở lên.</li><li>$1-f_F(E)$: xác suất mức đó <b>trống</b>, tức có một lỗ trống, nên dùng cho $p_0$.</li></ul></div>

fill-opacity:1"/><text x="325" y="126" text-anchor="middle" style="fill:var(--c1);font-size:14px;font-weight:700">N_c</text><text x="325" y="142" text-anchor="middle" style="fill:var(--c1);font-size:11px;font-weight:400">chỗ</text><text x="325" y="178" text-anchor="middle" style="fill:var(--mut);font-size:11px;font-weight:400">một mức tương đương tại Ec</text></svg><figcaption>N_c thay cả dải dẫn bằng một mức tương đương nằm ở mép Ec, nhờ vậy không cần tính tích phân.</figcaption></figure>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Tích phân khó, nhưng khi $E_F$ nằm trong vùng cấm và cách mép dải xa hơn $3kT$ thì $f_F$ gần như là hàm mũ, và tích phân cho kết quả gọn.</li><li><b>Dùng để làm gì:</b> Dùng $n_0=N_c e^{-(E_c-E_F)/kT}$ và $p_0=N_v e^{-(E_F-E_v)/kT}$ để tính nhanh.</li><li><b>Liên hệ với phần khác:</b> $N_c$, $N_v$ gói gọn cả dải vào một "mức tương đương" tại mép dải.</li></ul></div>

    <figure class="fig fl"><svg viewBox="0 0 420 196" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="40" y="20" width="340" height="50" rx="0" style="fill:var(--c1);stroke:var(--c1);stroke-width:0;fill-opacity:0.18"/><rect x="40" y="140" width="340" height="40" rx="0" style="fill:var(--c5);stroke:var(--c5);stroke-width:0;fill-opacity:0.18"/><line x1="40" y1="70" x2="380" y2="70" style="stroke:var(--c1);stroke-width:2.5"/><line x1="40" y1="140" x2="380" y2="140" style="stroke:var(--c5);stroke-width:2.5"/><text x="44" y="65" text-anchor="start" style="fill:var(--c1);font-size:11px;font-weight:700">Ec</text><text x="44" y="154" text-anchor="start" style="fill:var(--c5);font-size:11px;font-weight:700">Ev</text><line x1="40" y1="105" x2="380" y2="105" style="stroke:var(--c4);stroke-width:2.5" stroke-dasharray="6 4"/><text x="46" y="100" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:700">E_F</text><line x1="300" y1="73" x2="300" y2="102" style="stroke:var(--c4);stroke-width:2" marker-end="url(#fa)"/><line x1="300" y1="102" x2="300" y2="73" style="stroke:var(--c4);stroke-width:2" marker-end="url(#fa)"/><text x="310" y="92" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:400">Ec − E_F ≥ 3kT</text></svg><figcaption>Điều kiện dùng xấp xỉ Boltzmann: E_F cách mép dải ít nhất 3kT.</figcaption></figure>

    <p>Nếu mức năng lượng Fermi $E_F$ nằm bên trong vùng cấm và cách mép dải dẫn $E_c$ cũng như mép dải hóa trị $E_v$ một khoảng lớn hơn $3kT$ ($E_c - E_F \ge 3kT$ và $E_F - E_v \ge 3kT$), ta được phép dùng <b>Xấp xỉ hàm mũ Maxwell-Boltzmann</b> đã học ở cuối Buổi 4:</p>
    <ul>
      <li><b>Với Electron trong dải dẫn ($E \ge E_c$):</b>
        $$f_F(E) = \frac{1}{1 + \exp\left(\frac{E - E_F}{kT}\right)} \approx \exp\left[-\frac{E - E_F}{kT}\right]$$
        Khi thế $g_c(E) = \frac{4\pi(2m_n^*)^{3/2}}{h^3}\sqrt{E - E_c}$ vào tích phân và đặt biến phụ $\eta = \frac{E - E_c}{kT}$ (sử dụng tích phân chuẩn $\int_0^\infty \eta^{1/2}e^{-\eta}d\eta = \frac{\sqrt{\pi}}{2}$), toàn bộ tích phân phức tạp thu gọn thành một công thức cực kỳ đẹp mắt:
        <div class="f">
          $$\mathbf{n_0 = N_c \exp\left[-\frac{E_c - E_F}{kT}\right]} \qquad \text{với } \mathbf{N_c = 2\left(\frac{2\pi m_n^* kT}{h^2}\right)^{3/2}}$$
          <small>Trong đó: $N_c$ gọi là <b>Mật độ trạng thái hiệu dụng trong dải dẫn (Effective density of states in the conduction band)</b>, đơn vị $\text{cm}^{-3}$.</small>
        </div>
      </li>

      <li><b>Với Lỗ trống trong dải hóa trị ($E \le E_v$):</b>
        $$1 - f_F(E) = \frac{1}{1 + \exp\left(\frac{E_F - E}{kT}\right)} \approx \exp\left[-\frac{E_F - E}{kT}\right]$$
        Thực hiện lấy tích phân hoàn toàn tương tự từ $-\infty$ đến $E_v$, ta thu được công thức đối xứng cho nồng độ lỗ trống cân bằng:
        <div class="f">
          $$\mathbf{p_0 = N_v \exp\left[-\frac{E_F - E_v}{kT}\right]} \qquad \text{với } \mathbf{N_v = 2\left(\frac{2\pi m_p^* kT}{h^2}\right)^{3/2}}$$
          <small>Trong đó: $N_v$ gọi là <b>Mật độ trạng thái hiệu dụng trong dải hóa trị (Effective density of states in the valence band)</b>, đơn vị $\text{cm}^{-3}$.</small>
        </div>
      </li>
    </ul>

    <div class="box tip">
      <b>Bản chất vật lý cực hay của $N_c$ và $N_v$ (Tại sao không cần tính tích phân nữa?):</b><br>
      Thay vì phải xét hàng tỷ mức năng lượng trải dài từ $E_c$ lên tới $\infty$, đại lượng $N_c$ cho phép ta <b>quy đổi toàn bộ các trạng thái trong cả dải dẫn về tập trung tại một vạch duy nhất ngay tại mép đáy $E = E_c$</b>! Khi đó, số electron $n_0$ chỉ đơn giản bằng "tổng số ghế đại diện $N_c$" nhân với "xác suất Boltzmann ngay tại mép $E_c$" là $\exp\left(-\frac{E_c - E_F}{kT}\right)$.<br><br>
      <b>Quy tắc phụ thuộc nhiệt độ bắt buộc phải nhớ:</b> Vì trong công thức của $N_c$ và $N_v$ có $(kT)^{3/2}$, nên khi đổi từ nhiệt độ $T_1$ (thường là $300\text{ K}$) sang nhiệt độ $T_2$ bất kỳ, ta luôn có:
      $$\mathbf{N_c(T) = N_c(300\text{ K}) \times \left(\frac{T}{300}\right)^{3/2}} \qquad \text{và} \qquad \mathbf{N_v(T) = N_v(300\text{ K}) \times \left(\frac{T}{300}\right)^{3/2}}$$
    </div>

    <h3>1.3. Mô hình tương tác: Sự hình thành Nồng độ $n_0, p_0$ khi dịch chuyển Mức Fermi $E_F$ (Figure 4.1)</h3>
    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Cách dùng mô hình:</b> Kéo $E_F$ lên gần $E_c$: $n_0$ tăng rất nhanh, $p_0$ giảm. Kéo xuống gần $E_v$: ngược lại. Kết luận: chỉ cần biết vị trí $E_F$ là biết nồng độ hạt dẫn.</li></ul></div>

    <p>Em hãy kéo thanh trượt <b>Vị trí mức Fermi $E_F$</b> dưới đây lên gần đáy dải dẫn $E_c$ hoặc xuống gần đỉnh dải hóa trị $E_v$. Hãy quan sát cách đường cong xác suất $f_F(E)$ trượt lên xuống làm cho phần diện tích tô màu xanh dương ($n_0$) và phần diện tích tô màu hồng ($p_0$) tăng giảm ngược chiều nhau theo quy luật hàm mũ:</p>

    <div class="sim-card">
      <div class="ctrl-row">

  <section>
    <h2>2. Bán Dẫn Nội Tại (Intrinsic Semiconductor): Nồng Độ $n_i$ & Mức Fermi $E_{Fi}$</h2>
    <div class="bridge"><b>Nối từ Mục 1:</b> Công thức $n_0$, $p_0$ cần biết $E_F$. Với bán dẫn tinh khiết, $E_F$ được xác định bởi điều kiện $n_0=p_0$.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> $n_i$ là số hạt dẫn "tự nhiên" của vật liệu. Mọi mức pha tạp ở Buổi 6 đều được so với $n_i$ để biết ai chiếm ưu thế.</div>

    <h3>2.1. Khái niệm Bán dẫn Nội tại (Tinh khiết) và Nồng độ hạt dẫn nội tại $n_i$</h3>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Bán dẫn tinh khiết là trường hợp mẫu: không có tạp chất, nên mọi hạt dẫn đều do nhiệt kích thích electron qua vùng cấm.</li><li><b>Dùng để làm gì:</b> Biết $n_0=p_0=n_i$, và tích $n_0p_0=n_i^2$.</li><li><b>Liên hệ với phần khác:</b> Mục 3 và Buổi 6 so sánh nồng độ pha tạp với $n_i$.</li></ul></div>

    <figure class="fig fr"><svg viewBox="0 0 420 196" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="40" y="20" width="340" height="50" rx="0" style="fill:var(--c1);stroke:var(--c1);stroke-width:0;fill-opacity:0.18"/><rect x="40" y="140" width="340" height="40" rx="0" style="fill:var(--c5);stroke:var(--c5);stroke-width:0;fill-opacity:0.18"/><line x1="40" y1="70" x2="380" y2="70" style="stroke:var(--c1);stroke-width:2.5"/><line x1="40" y1="140" x2="380" y2="140" style="stroke:var(--c5);stroke-width:2.5"/><text x="44" y="65" text-anchor="start" style="fill:var(--c1);font-size:11px;font-weight:700">Ec</text><text x="44" y="154" text-anchor="start" style="fill:var(--c5);font-size:11px;font-weight:700">Ev</text><circle cx="150" cy="45" r="9" style="fill:var(--c1);stroke:var(--c1);stroke-width:2;fill-opacity:1"/><text x="168" y="49" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:400">electron (n₀)</text><circle cx="150" cy="158" r="9" style="fill:none;stroke:var(--c4);stroke-width:2.5;fill-opacity:1"/><text x="168" y="162" text-anchor="start" style="fill:var(--c4);font-size:12px;font-weight:400">lỗ trống (p₀)</text><line x1="110" y1="138" x2="110" y2="74" style="stroke:var(--c4);stroke-width:2.5" marker-end="url(#fa)"/><text x="100" y="108" text-anchor="end" style="fill:var(--c4);font-size:12px;font-weight:400">Năng lượng</text><text x="100" y="124" text-anchor="end" style="fill:var(--c4);font-size:12px;font-weight:700">≥ E_g</text><line x1="310" y1="73" x2="310" y2="138" style="stroke:var(--mut);stroke-width:1.5" marker-end="url(#fa)"/><line x1="310" y1="138" x2="310" y2="73" style="stroke:var(--mut);stroke-width:1.5" marker-end="url(#fa)"/><text x="322" y="108" text-anchor="start" style="fill:var(--ink);font-size:14px;font-weight:700">E_g</text></svg><figcaption>Tinh khiết: mỗi electron lên dải dẫn để lại một lỗ trống, nên n₀ = p₀ = nᵢ.</figcaption></figure>

    <p>Một chất bán dẫn hoàn toàn tinh khiết, không chứa bất kỳ nguyên tử tạp chất nào và không có khuyết tật mạng được gọi là <b>Bán dẫn nội tại (Intrinsic semiconductor)</b>.</p>
    <p>Ở nhiệt độ $T > 0\text{ K}$, mỗi khi một electron ở dải hóa trị nhận đủ năng lượng nhiệt để bứt khỏi liên kết cộng hóa trị nhảy lên dải dẫn, nó <b>chắc chắn để lại 1 lỗ trống tương ứng</b> trong dải hóa trị (quá trình sinh cặp electron - lỗ trống). Do đó, trong bán dẫn nội tại, nồng độ electron tự do và nồng độ lỗ trống luôn bằng nhau tuyệt đối:</p>
    <div class="f">
      $$\mathbf{n_0 = p_0 = n_i = p_i}$$
      <small>Trong đó: $n_i$ gọi là <b>Nồng độ hạt dẫn nội tại (Intrinsic carrier concentration)</b>, đơn vị $\text{cm}^{-3}$.</small>
    </div>

    <p>Nếu ta nhân hai phương trình $n_0 = N_c\exp\left(-\frac{E_c - E_F}{kT}\right)$ và $p_0 = N_v\exp\left(-\frac{E_F - E_v}{kT}\right)$ với nhau, một điều kỳ diệu xảy ra: mức năng lượng Fermi $E_F$ ở trên số mũ tự động triệt tiêu hoàn toàn ($-E_F + E_F = 0$), và hiệu số $E_c - E_v$ chính là độ rộng vùng cấm $E_g$:</p>
    <div class="f">
      $$\mathbf{n_0 \cdot p_0 = n_i^2 = N_c N_v \exp\left[-\frac{E_c - E_v}{kT}\right] = N_c N_v \exp\left[-\frac{E_g}{kT}\right]}$$
      $$\implies \mathbf{n_i = \sqrt{N_c N_v}\,\exp\left[-\frac{E_g}{2kT}\right]}$$
    </div>
    <div class="box legend"><b>Đọc công thức $n_i$</b><ul><li>$N_c,N_v$: mật độ trạng thái hiệu dụng của dải dẫn và dải hóa trị.</li><li>$E_g$: độ rộng vùng cấm; $E_g$ càng lớn thì $n_i$ càng nhỏ (rất mạnh vì nằm trong hàm mũ).</li><li>Chú ý có <b>số 2</b> ở mẫu: $n_i\propto e^{-E_g/2kT}$ do đã lấy căn bậc hai của tích.</li><li>$T$ tăng thì $kT$ tăng và $n_i$ tăng rất nhanh.</li></ul></div>


    <div class="box warn">
      <b>Hai kết luận cực kỳ quan trọng từ phương trình $n_i^2 = N_c N_v \exp\left(-\frac{E_g}{kT}\right)$:</b><br>
      1. Với một loại vật liệu bán dẫn nhất định ở một nhiệt độ $T$ cố định, <b>nồng độ nội tại $n_i$ là một hằng số không đổi</b> (không phụ thuộc vào vị trí mức Fermi $E_F$).<br>
      2. Nồng độ nội tại $n_i$ <b>tăng cực mạnh theo nhiệt độ $T$</b> (vì vừa có $T^{3/2}$ trong $\sqrt{N_c N_v}$, vừa có $T$ ở mẫu số của hàm mũ $\exp\left(-\frac{E_g}{2kT}\right)$) và <b>giảm cực mạnh khi độ rộng vùng cấm $E_g$ lớn</b>.
    </div>

    <p>Trong bán dẫn nội tại, mức năng lượng Fermi được ký hiệu riêng là $E_{Fi}$ (Intrinsic Fermi level). Để tìm vị trí của $E_{Fi}$ nằm ở đâu trong vùng cấm, ta cho nồng độ electron bằng nồng độ lỗ trống ($n_0 = p_0$):</p>
    <div class="f">
      $$N_c \exp\left[-\frac{E_c - E_{Fi}}{kT}\right] = N_v \exp\left[-\frac{E_{Fi} - E_v}{kT}\right]$$
    </div>
    <p>Lấy logarit tự nhiên ($\ln$) cả hai vế và biến đổi đại số (với $\frac{N_v}{N_c} = \left(\frac{m_p^*}{m_n^*}\right)^{3/2}$ và mức chính giữa vùng cấm là $E_{\text{midgap}} = \frac{E_c + E_v}{2}$), ta thu được công thức xác định độ lệch của $E_{Fi}$ so với tâm vùng cấm:</p>
    <div class="f">
      $$\mathbf{E_{Fi} - E_{\text{midgap}} = \frac{1}{2}kT \ln\left(\frac{N_v}{N_c}\right) = \frac{3}{4}kT \ln\left(\frac{m_p^*}{m_n^*}\right)}$$
    </div>
    <div class="box legend"><b>Đọc công thức $E_{Fi}$</b><ul><li>$E_{\text{midgap}}=(E_c+E_v)/2$: giữa vùng cấm.</li><li>$m_p^*/m_n^*$: tỉ số khối lượng hiệu dụng. Bằng nhau thì $E_{Fi}$ nằm đúng giữa; lệch nhau thì $E_{Fi}$ lệch về phía dải có khối lượng nhỏ hơn.</li><li>Độ lệch chỉ cỡ vài $kT$ nên thường coi $E_{Fi}\approx E_{\text{midgap}}$.</li></ul></div>

    <ul>
      <li>Nếu khối lượng hiệu dụng của electron và lỗ trống bằng nhau ($m_n^* = m_p^* \implies \ln(1) = 0$): Mức Fermi nội tại $E_{Fi}$ nằm <b>chính giữa vùng cấm</b> ($E_{Fi} = E_{\text{midgap}}$).</li>
      <li>Đối với Silicon ($m_p^* = 0.56 m_0 < m_n^* = 1.08 m_0$): Vì $\ln\left(\frac{0.56}{1.08}\right) < 0$, nên ở $300\text{ K}$, mức $E_{Fi}$ nằm <b>thấp hơn tâm vùng cấm một chút là $-12.8\text{ meV}$</b> (rất nhỏ so với nửa vùng cấm $560\text{ meV}$, nên trong thực tế ta thường xấp xỉ $E_{Fi} \approx E_{\text{midgap}}$).</li>
    </ul>

  <section>
    <h2>3. Bán Dẫn Pha Tạp (Extrinsic Semiconductor), Mức Năng Lượng $E_d, E_a$ & Năng Lượng Ion Hóa</h2>
    <figure class="fig fl"><svg viewBox="0 0 420 196" role="img"><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--mut)"/></marker></defs><rect x="150" y="20" width="28" height="150" rx="3" style="fill:var(--c4);stroke:var(--c4);stroke-width:2;fill-opacity:0.4"/><text x="164" y="15" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400"></text><text x="164" y="185" text-anchor="middle" style="fill:var(--c4);font-size:12px;font-weight:700">E_g ≈ 1.12 eV</text><circle cx="70" cy="150" r="9" style="fill:var(--c2);stroke:var(--c2);stroke-width:2;fill-opacity:1"/><line x1="70" y1="159" x2="70" y2="172" style="stroke:var(--c2);stroke-width:3"/><path d="M75,140 Q164,-10 250,140" style="fill:none;stroke:var(--c4);stroke-width:2;fill-opacity:1"/><text x="164" y="48" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:400"></text><text x="120" y="26" text-anchor="end" style="fill:var(--c4);font-size:11px;font-weight:400">không nhảy nổi</text><rect x="300" y="152" width="50" height="18" rx="3" style="fill:var(--c2);stroke:var(--c2);stroke-width:2;fill-opacity:0.4"/><circle cx="300" cy="140" r="9" style="fill:var(--c2);stroke:var(--c2);stroke-width:2;fill-opacity:1"/><line x1="310" y1="138" x2="330" y2="150" style="stroke:var(--c2);stroke-width:2.5" marker-end="url(#fa)"/><text x="325" y="185" text-anchor="middle" style="fill:var(--c2);font-size:12px;font-weight:700">E_d ≈ 0.045 eV</text><text x="355" y="138" text-anchor="start" style="fill:var(--c2);font-size:11px;font-weight:400">bước nhẹ</text></svg><figcaption>Ví dụ nhảy qua tường cao và bước lên ghế đẩu: tạp chất cho electron dễ hơn nhiều so với vùng cấm.</figcaption></figure>

    <div class="bridge"><b>Nối từ Mục 2:</b> Si tinh khiết dẫn điện kém. Pha tạp (Buổi 1) là cách nâng số hạt dẫn lên hàng triệu lần.</div>

    <div class="box why"><b>Học phần này để làm gì?</b> Giải thích bằng giản đồ vùng năng lượng vì sao tạp chất cho electron hoặc lỗ trống rất dễ, từ đó dẫn tới loại n và loại p.</div>

    <p>Ở nhiệt độ phòng $300\text{ K}$, Silicon tinh khiết chỉ có $n_i \approx 1.5 \times 10^{10}$ hạt dẫn trong $1\text{ cm}^3$ (quá ít ỏi so với $5 \times 10^{22}$ nguyên tử $\text{Si}$, dẫn đến điện trở suất rất cao $\rho \approx 3.3 \times 10^5\text{ }\Omega\cdot\text{cm}$). Sức mạnh thực sự của bán dẫn chỉ thức tỉnh khi ta chủ động pha thêm một lượng nhỏ tạp chất (Doping) để tạo ra <b>Bán dẫn ngoại lai / Bán dẫn pha tạp (Extrinsic semiconductor)</b>.</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Nhảy qua bức tường cao $1.12\text{ m}$ vs. Bước lên chiếc ghế đẩu kê sát trần</b><br>
      • Trong Silicon tinh khiết, để có 1 electron dẫn điện, hạt electron phải tự nhảy qua toàn bộ bức tường vùng cấm cao $E_g = 1.12\text{ eV}$ — cực kỳ tốn sức nên rất ít hạt nhảy qua nổi!<br><br>
      • <b>Khi pha tạp chất Nhóm V (như Phosphorus $\text{P}$, Arsenic $\text{As}$ — có 5 electron hóa trị):</b> 4 electron của $\text{P}$ bắt cặp vừa đủ với 4 nguyên tử $\text{Si}$ hàng xóm. Còn thừa ra <b>electron thứ 5</b> không có chỗ liên kết, chỉ bị giữ lỏng lẻo quanh hạt nhân $\text{P}$. Trên giản đồ năng lượng, nguyên tử $\text{P}$ giống như <b>kê một chiếc ghế đẩu (Mức năng lượng Donor $E_d$) nằm ngay sát dưới đáy dải dẫn $E_c$</b> (chỉ cách $E_c$ khoảng $0.045\text{ eV}$)! Ở nhiệt độ phòng, electron thứ 5 này bước nhẹ một bước là nhảy tọt lên dải dẫn để lại ion dương $\text{P}^+$ đứng yên, tạo ra <b>Bán dẫn loại N (nhiều electron tự do)</b> mà không hề sinh thêm lỗ trống nào ở dải hóa trị!<br><br>
      • <b>Khi pha tạp chất Nhóm III (như Boron $\text{B}$, Aluminum $\text{Al}$ — chỉ có 3 electron hóa trị):</b> Thiếu 1 electron để đủ 4 liên kết tứ diện. Nguyên tử Boron tạo ra một <b>bậc thềm trống (Mức năng lượng Acceptor $E_a$) nằm ngay sát trên đỉnh dải hóa trị $E_v$</b> (cách $E_v$ chỉ $0.045\text{ eV}$). Các electron ở dải hóa trị dễ dàng nhảy lên lấp vào chỗ trống của Boron (biến Boron thành ion âm $\text{B}^-$ cố định), qua đó để lại hàng loạt <b>Lỗ trống tự do trong dải hóa trị</b> tạo thành <b>Bán dẫn loại P</b>!
    </div>

    <div class="box explain"><b>Hướng dẫn phần này</b><ul><li><b>Vì sao có phần này:</b> Si tinh khiết có quá ít hạt dẫn. Tạp chất tạo ra electron hoặc lỗ trống dễ hơn nhiều vì nó cần rất ít năng lượng để ion hóa. Ta tính xem vì sao bằng mô hình Bohr mở rộng.</li><li><b>Dùng để làm gì:</b> Tính bán kính quỹ đạo $r_1$ và năng lượng ion hóa $E_i$ của tạp chất.</li><li><b>Liên hệ với phần khác:</b> Mức $E_d$, $E_a$ rất sát mép dải, nên Buổi 6 coi tạp chất ion hóa hoàn toàn ở nhiệt độ phòng.</li></ul></div>
