<template id="tpl-buoi-1">
  <header>
    <span class="k b5">HỌC PHẦN ENP2209 · BUỔI 1</span>
    <h1>Cấu Trúc Tinh Thể Của Chất Rắn</h1>
    <p class="mut">Tài liệu tự học từ con số 0 dành cho sinh viên mất gốc Toán - Lý. Học qua mô hình tương tác trực quan, ví dụ ẩn dụ thực tế và giải bài tập từng bước không nhảy cóc.</p>
  </header>

  <section>
    <h2>1. Bản Chất Vật Liệu Bán Dẫn & Các Loại Chất Rắn</h2>
    <p>Chào em! Nhiều bạn khi mới học Vật lý Bán dẫn thường thắc mắc: <i>"Tại sao học về con chip điện tử, dòng điện mà buổi đầu tiên lại phải học hình học không gian, đếm từng quả cầu nguyên tử trong chiếc hộp lập phương?"</i></p>
    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Quy hoạch giao thông đô thị</b><br>
      Em hãy tưởng tượng các <b>hạt electron</b> mang dòng điện giống như những <b>chiếc xe máy</b>, còn các <b>nguyên tử</b> đứng yên trong chất rắn là các <b>tòa nhà</b>.<br>
      • Nếu các tòa nhà xây tự phát, lộn xộn không theo quy hoạch, xe máy đi vào sẽ liên tục đâm vào tường, kẹt cứng — dòng điện chạy cực kỳ tệ.<br>
      • Ngược lại, nếu các tòa nhà được quy hoạch thẳng tắp thành từng ô bàn cờ đều đặn từ đầu thành phố đến cuối thành phố, xe máy sẽ phóng êm ru trên các đại lộ rộng thoáng.<br>
      Việc tìm hiểu "quy hoạch đô thị của các nguyên tử" chính là nghiên cứu <b>Cấu trúc tinh thể</b> trong Buổi 1 này.
    </div>

    <h3>1.1. Phân loại vật liệu bán dẫn</h3>
    <p>Xét về khả năng dẫn điện, chất bán dẫn nằm ở ranh giới giữa <b>Kim loại</b> (dẫn điện rất tốt) và <b>Chất cách điện</b> (chặn dòng điện). Điểm kỳ diệu của bán dẫn là ta có thể điều khiển nó chuyển từ trạng thái "chặn dòng điện" sang "dẫn điện" rất dễ dàng bằng nhiệt độ, ánh sáng hoặc pha thêm tạp chất. Trong môn học này, em cần nắm vững 2 nhóm bán dẫn chính:</p>
    <ul>
      <li><span class="k b1">Bán dẫn nguyên tố (Elemental)</span> Cấu tạo từ 1 nguyên tố duy nhất thuộc <b>Nhóm IV</b> bảng tuần hoàn (có 4 electron lớp ngoài cùng): phổ biến nhất là <b>Silicon ($\text{Si}$)</b> và <b>Germanium ($\text{Ge}$)</b>.</li>
      <li><span class="k b2">Bán dẫn hợp chất (Compound)</span> Tạo thành khi ghép nguyên tố <b>Nhóm III</b> với nguyên tố <b>Nhóm V</b>:Hợp chất hai nguyên tố (nhị phân - binary) tiêu biểu nhất là <b>Gallium Arsenide ($\text{GaAs}$)</b> dùng làm đèn LED, laser và mạch cao tần. Ngoài ra còn có hợp chất ba nguyên tố (bậc ba - ternary) như $\text{Al}_x\text{Ga}_{1-x}\text{As}$.</li>
    </ul>

  <section>
    <h2>2. Lưới Không Gian, Ô Đơn Vị & Các Cấu Trúc Lập Phương</h2>
    <p>Một tinh thể Silicon thực tế chứa hàng tỷ tỷ nguyên tử lặp đi lặp lại tuần hoàn trong không gian (gọi là <b>mạng tinh thể - lattice</b>). Thay vì vẽ cả tỷ nguyên tử, ta đại diện vị trí mỗi nguyên tử bằng một dấu chấm gọi là <b>điểm nút mạng (lattice point)</b> và chỉ cắt ra một "chiếc hộp mẫu" nhỏ gọi là <b>Ô đơn vị (Unit cell)</b>.</p>
    <ul>
      <li><b>Ô đơn vị (Unit cell):</b> Thể tích nhỏ của tinh thể mà khi ta dịch chuyển (copy - paste) lặp đi lặp lại theo 3 chiều không gian sẽ xây dựng lại được toàn bộ tinh thể.</li>
      <li><b>Ô nguyên thủy (Primitive cell):</b> Là ô đơn vị có thể tích nhỏ nhất. Tuy nhiên, ô nguyên thủy thường có các cạnh xiên góc rất khó tính toán, nên các kỹ sư thích dùng <b>Ô đơn vị lập phương</b> (có 3 cạnh vuông góc bằng nhau và bằng <b>hằng số mạng $a$</b>).</li>
    </ul>

    <div class="box warn">
      <b>Cảnh báo sống còn về đổi đơn vị trước khi làm bài tập:</b><br>
      Kích thước ô mạng $a$ hay bán kính nguyên tử $r$ luôn được cho bằng đơn vị <b>Angstrom ($\text{Å}$)</b>, nhưng mật độ nguyên tử lại luôn tính trên mỗi <b>centimet khối ($\text{cm}^3$)</b> hoặc <b>centimet vuông ($\text{cm}^2$)</b>.<br>
      Công thức bắt buộc phải thuộc lòng:<br>
      $$1\text{ Å} = 10^{-10}\text{ m} = 10^{-8}\text{ cm}$$
      Khi tính diện tích mặt ($a^2$) thì nhân thêm $(10^{-8})^2 = 10^{-16}\text{ cm}^2$. Khi tính thể tích khối ($a^3$) thì nhân thêm $(10^{-8})^3 = 10^{-24}\text{ cm}^3$.
    </div>

    <h3>2.1. Mô hình tương tác: Phép tịnh tiến mạng và Ô đơn vị 2D</h3>
    <p>Trong không gian 2 chiều (hoặc 3 chiều), mọi điểm nút mạng đều có thể đi tới từ gốc tọa độ bằng công thức vector tịnh tiến:
      $$\vec{r} = p\vec{a} + q\vec{b} + s\vec{c}$$
      Trong đó $p, q, s$ là các số nguyên chỉ số bước nhảy. Hãy kéo thử hai thanh trượt $p$ và $q$ dưới đây để xem cách tạo ra mạng tinh thể và các cách chọn Ô đơn vị A, B, C, D:</p>

    <div class="sim-card">

          <input type="range" id="sl-p" min="0" max="4" step="1" value="2" oninput="renderLattice2D()">
        </div>
        <div>
          <label>Số bước nhảy theo vector $\vec{b}$ ($q = $ <span id="val-q">1</span>):</label>
          <input type="range" id="sl-q" min="0" max="3" step="1" value="1" oninput="renderLattice2D()">
        </div>
      </div>
      <svg id="lattice2d-svg" viewBox="0 0 680 250"></svg>
      <p class="mut" style="font-size:14.5px;margin-top:6px">Ghi chú trên hình: Các ô màu xanh nhạt (Ô đơn vị C hình bình hành, hoặc Ô chữ nhật lớn) đều có thể dùng làm "viên gạch mẫu" để lát kín toàn bộ mặt phẳng.</p>
    </div>

    <h3>2.2. Quy tắc đếm số nguyên tử hiệu dụng trong 1 Ô đơn vị</h3>
    <p>Hãy tưởng tượng ô đơn vị lập phương là một căn phòng có 6 bức tường và 8 góc phòng. Các quả cầu nguyên tử nằm ở ranh giới sẽ bị chia sẻ với các phòng hàng xóm:</p>
    <ul>
      <li><span class="k b1">Nguyên tử ở Đỉnh góc (Corner)</span> Giao điểm của 8 căn phòng lập phương (4 phòng tầng dưới, 4 phòng tầng trên). Mỗi ô đơn vị chỉ sở hữu <b>$\frac{1}{8}$ nguyên tử</b>.</li>
      <li><span class="k b2">Nguyên tử ở Tâm mặt (Face-centered)</span> Nằm trên bức tường chung của 2 căn phòng. Mỗi ô đơn vị sở hữu một nửa, tức <b>$\frac{1}{2}$ nguyên tử</b>.</li>
      <li><span class="k b4">Nguyên tử nằm Trong ruột (Body / Interior)</span> Nằm hoàn toàn bên trong căn phòng, không chia sẻ cho ai. Ô đơn vị sở hữu trọn vẹn <b>$1$ nguyên tử</b>.</li>
    </ul>

  <section>
    <h2>3. Mặt Phẳng Tinh Thể, Chỉ Số Miller $(hkl)$ & Phương Hướng $[hkl]$</h2>
    <p>Trong công nghệ sản xuất chip, thỏi tinh thể Silicon được cưa thành từng lát mỏng (wafer). Bề mặt lát cắt quyết định trực tiếp đến số lượng nguyên tử lộ ra và tốc độ di chuyển của electron trên bề mặt chip. Để gọi tên chính xác từng mặt cắt và hướng trong tinh thể, người ta dùng <b>Chỉ số Miller</b>.</p>

    <div class="box tip">
      <b>Quy trình 4 bước tìm Chỉ số Miller $(hkl)$ cho mặt phẳng:</b>
      <ol>
        <li><b>Bước 1 (Tìm điểm cắt theo $a$):</b> Xác định mặt phẳng cắt 3 trục tọa độ tại vị trí bằng bao nhiêu lần hằng số mạng $a$: ký hiệu bộ 3 điểm cắt là $(p, q, s)$. Nếu mặt phẳng song song với trục nào thì điểm cắt với trục đó ở vô cùng ($\infty$).</li>
        <li><b>Bước 2 (Lấy nghịch đảo):</b> Viết nghịch đảo của 3 điểm cắt: $\left(\frac{1}{p}, \frac{1}{q}, \frac{1}{s}\right)$. Nhờ bước này, mặt phẳng song song với trục ($\infty$) sẽ có nghịch đảo $\frac{1}{\infty} = 0$, giúp loại bỏ hoàn toàn số vô cùng!</li>
        <li><b>Bước 3 (Quy đồng khử mẫu):</b> Nhân cả 3 phân số với Bội chung nhỏ nhất của các mẫu số để thu được 3 số nguyên nhỏ nhất $h, k, l$.</li>
        <li><b>Bước 4 (Viết ký hiệu):</b> Đặt 3 số nguyên trong ngoặc tròn không có dấu phẩy: <b>$(hkl)$</b>. Còn nếu đặt trong ngoặc vuông <b>$[hkl]$</b> thì đó là <b>vector hướng</b> vuông góc với mặt phẳng $(hkl)$!</li>
      </ol>
    </div>

  <section>
    <h2>4. Liên Kết Nguyên Tử, Khuyết Tật Mạng, Pha Tạp & Nuôi Tinh Thể</h2>
    <h3>4.1. Bốn loại liên kết nguyên tử trong chất rắn</h3>
    <ul>
      <li><b>Liên kết Ion (Ionic bond):</b> Giữa nguyên tử Nhóm I (dễ nhường 1 electron thành ion dương, như $\text{Na}^+$) và Nhóm VII (dễ nhận 1 electron thành ion âm, như $\text{Cl}^-$). Hai ion trái dấu hút nhau bằng lực tĩnh điện Coulomb tạo thành muối ăn $\text{NaCl}$.</li>
      <li><b>Liên kết Kim loại (Metallic bond):</b> Các nguyên tử kim loại góp chung electron hóa trị tạo thành một "biển electron tự do" bao quanh các ion dương đứng yên.</li>
      <li><b>Liên kết Van der Waals:</b> Lực hút cực yếu giữa các phân tử có sự lệch tâm điện tích (lưỡng cực điện).</li>
      <li><b>Liên kết Cộng hóa trị (Covalent bond - Quan trọng nhất với Bán dẫn):</b> Mỗi nguyên tử Silicon (Nhóm IV) có <b>4 electron hóa trị</b>. Nó đứng ở tâm tứ diện và đưa 4 electron này ra "góp gạo thổi cơm chung" với 4 nguyên tử $\text{Si}$ hàng xóm gần nhất. Mỗi cặp nguyên tử dùng chung 2 electron, giúp mỗi nguyên tử $\text{Si}$ có đủ 8 electron lớp vỏ ngoài cùng bền vững.</li>
    </ul>

    <h3>4.2. Mô hình tương tác: Liên kết Cộng hóa trị & Pha tạp (Doping) trong Silicon</h3>
    <p>Kỹ thuật thêm một lượng nhỏ nguyên tử ngoại lai vào bán dẫn để thay đổi tính chất điện gọi là <b>Pha tạp (Doping)</b> (thực hiện bằng phương pháp <i>Khuếch tán nhiệt ở $\approx 1000^\circ\text{C}$</i> hoặc <i>Bắn phá Cấy ion năng lượng cao $\approx 50\text{ keV}$ rồi ủ nhiệt</i>). Hãy bấm vào mô hình dưới đây để xem điều gì xảy ra khi thay 1 nguyên tử $\text{Si}$ ở giữa bằng tạp chất:</p>

    <h3>4.3. Mô hình trực quan: Các loại Khuyết tật mạng tinh thể (Imperfections)</h3>
    <p>Không có tinh thể thực tế nào hoàn hảo tuyệt đối. Ngoài việc các nguyên tử luôn <b>dao động nhiệt (lattice vibrations)</b> quanh vị trí cân bằng khi nhiệt độ $T > 0\text{ K}$, mạng tinh thể còn có các khuyết tật điểm và khuyết tật đường như hình vẽ dưới đây:</p>
    <svg id="defect-svg" viewBox="0 0 680 230"></svg>

    <h3>4.4. Mô hình tương tác: Công nghệ kéo đơn tinh thể Czochralski & Epitaxy</h3>
    <p>Làm sao người ta biến cát thạch anh thành thỏi Silicon đơn tinh thể tinh khiết tới mức cứ $10^{10}$ nguyên tử Silicon mới có dưới $1$ nguyên tử tạp chất lạ? Phương pháp nổi tiếng nhất là <b>Kéo tinh thể từ chất lỏng nóng chảy Czochralski</b>:</p>
    <ul>
      <li>Người ta nung chảy Silicon trong nồi nung (Crucible), sau đó nhúng một mẩu <b>tinh thể mầm (Seed crystal)</b> đơn tinh thể vào mặt chất lỏng rồi vừa xoay nhẹ vừa kéo từ từ lên.</li>
      <li>Nếu cần làm sạch thêm, người ta dùng kỹ thuật <b>Tinh luyện vùng (Zone refining)</b>: cho cuộn dây nhiệt cao tần chạy dọc thỏi Silicon để vùng nóng chảy cuốn toàn bộ tạp chất dồn về đuôi thỏi rồi cắt bỏ.</li>
      <li>Sau đó thỏi Silicon (boule) được mài vát một mặt phẳng định hướng, cưa thành từng đĩa mỏng, ăn mòn hóa học và đánh bóng thành tấm <b>Wafer (Đế / Substrate)</b>. Trên mặt Wafer, người ta có thể nuôi tiếp các lớp đơn tinh thể siêu mỏng gọi là <b>Lớp Epitaxy</b> (bằng phương pháp bốc hơi hóa học <i>CVD</i>, pha lỏng <i>LPE</i> hoặc chùm tia phân tử <i>MBE</i>).</li>
    </ul>

  <section>
    <h2>5. Cẩm Nang Công Thức Trọng Tâm (Giải Nghĩa Chi Tiết)</h2>
    <p>Dưới đây là toàn bộ các công thức của Buổi 1 được giải thích rõ từng ký hiệu, đơn vị, bản chất vật lý và dấu hiệu nhận biết khi làm bài tập:</p>

    <div class="formula-card">
      <h3>Công thức 1: Mật độ nguyên tử theo thể tích ($N$ hoặc Volume Density)</h3>
      <div class="f">
        $$N = \frac{n_{\text{cell}}}{V_{\text{cell}}} = \frac{n_{\text{cell}}}{a^3}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $N$: Mật độ nguyên tử khối ($\text{atoms/cm}^3$ hoặc $\text{\#/cm}^3$).<br>
          • $n_{\text{cell}}$: Số nguyên tử hiệu dụng nằm trong 1 ô đơn vị:<br>
          &nbsp;&nbsp;+ Lập phương đơn giản (SC): $n_{\text{cell}} = 1$<br>
          &nbsp;&nbsp;+ Lập phương tâm khối (BCC): $n_{\text{cell}} = 2$<br>
          &nbsp;&nbsp;+ Lập phương tâm mặt (FCC): $n_{\text{cell}} = 4$<br>
          &nbsp;&nbsp;+ Kim cương ($\text{Si}, \text{Ge}$) & Zincblende ($\text{GaAs}$): $n_{\text{cell}} = 8$<br>
          • $a$: Hằng số mạng, bắt buộc đổi ra $\text{cm}$ ($1\text{ \AA} = 10^{-8}\text{ cm}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Vì toàn bộ tinh thể là sự lặp lại của ô đơn vị, nên mật độ nguyên tử của toàn khối chính bằng số nguyên tử trong 1 chiếc hộp mẫu chia cho thể tích chiếc hộp đó ($a^3$).<br>
          • <b>Khi nào dùng:</b> Khi đề bài yêu cầu tính <i>"Mật độ nguyên tử theo thể tích (volume density)"</i>, hoặc cần tìm số nguyên tử trong $1\text{ cm}^3$ làm bước đệm để tính khối lượng riêng và mật độ electron hóa trị.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 2: Khối lượng riêng của tinh thể ($\rho$ hoặc Mass Density)</h3>
      <div class="f">
        $$\rho = \frac{N \cdot M_A}{N_A} = \frac{n_{\text{cell}} \cdot M_A}{a^3 \cdot N_A}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $\rho$: Khối lượng riêng ($\text{g/cm}^3$).<br>
          • $N$: Mật độ nguyên tử theo thể tích ($\text{atoms/cm}^3$).<br>
          • $M_A$: Khối lượng mol nguyên tử ($\text{g/mol}$). Với Silicon, $M_A = 28.09\text{ g/mol}$.<br>
          • $N_A = 6.022 \times 10^{23}\text{ atoms/mol}$: Hằng số Avogadro.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> $1\text{ mol}$ chất nặng $M_A$ gam và chứa $N_A$ nguyên tử, suy ra 1 nguyên tử nặng $\frac{M_A}{N_A}$ gam. Nhân khối lượng 1 nguyên tử với số nguyên tử trong $1\text{ cm}^3$ ($N$) ta thu được cân nặng của $1\text{ cm}^3$ vật liệu ($\rho$).<br>
          • <b>Khi nào dùng:</b> Khi đề bài hỏi <i>"Khối lượng riêng ($\text{g/cm}^3$)"</i>.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 3: Quan hệ giữa Bán kính nguyên tử ($r$), Khoảng cách gần nhất ($d_{\text{min}}$) và Hằng số mạng ($a$)</h3>
      <div class="f">
        $$\text{SC: } a = 2r \quad \big| \quad \text{BCC: } a\sqrt{3} = 4r \quad \big| \quad \text{FCC: } a\sqrt{2} = 4r \quad \big| \quad \text{Kim cương (Si): } d_{\text{min}} = \frac{a\sqrt{3}}{4} = 2r$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $r$: Bán kính hiệu dụng của quả cầu nguyên tử ($\text{Å}$ hoặc $\text{cm}$).<br>
          • $d_{\text{min}}$: Khoảng cách từ tâm một nguyên tử đến tâm nguyên tử hàng xóm gần nhất ($\text{Å}$). Khi hai quả cầu cứng tiếp xúc nhau thì $d_{\text{min}} = 2r$.<br>
          • $a\sqrt{2}$: Độ dài đường chéo mặt hình vuông cạnh $a$.<br>
          • $a\sqrt{3}$: Độ dài đường chéo chính xuyên tâm khối lập phương cạnh $a$.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Các quả cầu nguyên tử chạm nhau dọc theo hướng xếp chặt nhất: SC chạm trên cạnh ($a=2r$), FCC chạm trên đường chéo mặt ($a\sqrt{2}=4r$), BCC chạm trên đường chéo khối ($a\sqrt{3}=4r$), còn Kim cương ($\text{Si}$) chạm nhau ở vị trí $\frac{1}{4}$ đường chéo khối ($d_{\text{min}} = \frac{a\sqrt{3}}{4}$).<br>
          • <b>Khi nào dùng:</b> Khi đề bài cho bán kính $r$ bắt tìm $a$ (như Câu 3) hoặc cho $a$ bắt tìm khoảng cách gần nhất giữa 2 nguyên tử (như Câu 1a).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 4: Mật độ nguyên tử trên bề mặt ($N_s$) & Khoảng cách giữa các mặt phẳng ($d_{hkl}$)</h3>
      <div class="f">
        $$N_s = \frac{n_{\text{plane}}}{S_{\text{plane}}} \qquad \text{và} \qquad d_{hkl} = \frac{a}{\sqrt{h^2 + k^2 + l^2}}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $N_s$: Mật độ nguyên tử trên bề mặt ($\text{atoms/cm}^2$ hoặc $\text{\#/cm}^2$).<br>
          • $n_{\text{plane}}$: Số hình tròn nguyên tử hiệu dụng nằm trong phạm vi hình phẳng cắt qua ô đơn vị.<br>
          • $S_{\text{plane}}$: Diện tích của hình phẳng đó ($\text{cm}^2$):<br>
          &nbsp;&nbsp;+ Mặt $(100)$: Hình vuông cạnh $a \implies S_{100} = a^2$.<br>
          &nbsp;&nbsp;+ Mặt $(110)$: Hình chữ nhật cạnh $a$ và $a\sqrt{2} \implies S_{110} = a^2\sqrt{2}$.<br>
          &nbsp;&nbsp;+ Mặt $(111)$: Tam giác đều cạnh $a\sqrt{2} \implies S_{111} = \frac{\sqrt{3}}{2}a^2$.
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Tương tự mật độ thể tích, nhưng tính trong không gian 2 chiều (lấy số nguyên tử trên mặt cắt chia cho diện tích mặt cắt). Công thức $d_{hkl}$ tính khoảng cách hình học từ gốc tọa độ đến mặt phẳng $(hkl)$ gần nhất.<br>
          • <b>Khi nào dùng:</b> Giải các bài toán về mặt phẳng tinh thể $(100), (110), (111)$ (như Câu 3b, 3c, 3d).
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>6. Bài Tập Trọng Tâm Buổi 1 (Có Gợi Ý & Giải Chi Tiết Từng Bước)</h2>
    <p>Em hãy đọc kỹ đề bài, bấm vào <b>Xem Gợi ý</b> để tự nháp trước, sau đó mở <b>Xem Lời giải chi tiết</b>. Ở mỗi bước biến đổi, thầy đều viết ghi chú màu xám giải thích rõ lý do tại sao lại làm như vậy.</p>

    <!-- CÂU 1 -->
    <div class="formula-card">
      <h3 id="bt-cau1">Câu 1: Khoảng cách nguyên tử, Mật độ và Khối lượng riêng của Silicon</h3>
      <p><b>Đề bài:</b> Hằng số mạng của silicon là $a = 5.34\text{ Å}$. Hãy tính:<br>
      a) Khoảng cách từ tâm một nguyên tử $\text{Si}$ đến tâm nguyên tử $\text{Si}$ lân cận gần nhất.<br>
      b) Mật độ nguyên tử của silicon ($\text{\#/cm}^3$).<br>
      c) Khối lượng riêng của silicon ($\text{g/cm}^3$).</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="hint1" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý a:</b> Silicon có cấu trúc tinh thể <b>Kim cương (Diamond)</b>. Trong cấu trúc này, nguyên tử nằm trong ruột khối tứ diện con cách đỉnh góc một đoạn bằng đúng $\frac{1}{4}$ đường chéo chính của khối lập phương lớn. Ta dùng công thức $d_{\text{min}} = \frac{a\sqrt{3}}{4}$.</li>
          <li><b>Ý b:</b> Đếm số nguyên tử hiệu dụng trong 1 ô đơn vị mạng Kim cương ($n_{\text{cell}} = 8$). Đổi hằng số mạng $a$ từ $\text{Å}$ sang $\text{cm}$ ($1\text{ Å} = 10^{-8}\text{ cm}$), rồi dùng công thức $N = \frac{n_{\text{cell}}}{a^3}$.</li>
          <li><b>Ý c:</b> Tra nguyên tử khối của Silicon là $M_A = 28.09\text{ g/mol}$ và hằng số Avogadro $N_A = 6.022 \times 10^{23}\text{ atoms/mol}$. Dùng công thức khối lượng riêng $\rho = \frac{N \cdot M_A}{N_A}$.</li>
        </ul>
      </div>

      <div id="sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>a) Khoảng cách từ tâm một nguyên tử $\text{Si}$ đến tâm nguyên tử $\text{Si}$ lân cận gần nhất:</b>
          <span class="cmt">// Bước 1: Xác định vị trí nguyên tử trong mạng Kim cương của Silicon. Nếu chọn nguyên tử góc ở gốc tọa độ $(0, 0, 0)$, thì nguyên tử lân cận gần nó nhất nằm ở tâm khối lập phương con thứ nhất có tọa độ $\left(\frac{a}{4}, \frac{a}{4}, \frac{a}{4}\right)$.</span>
          <span class="cmt">// Bước 2: Áp dụng định lý Pythagore trong không gian 3 chiều để tính khoảng cách $d$ từ điểm $(0,0,0)$ đến điểm $\left(\frac{a}{4}, \frac{a}{4}, \frac{a}{4}\right)$ (chính là bằng $\frac{1}{4}$ đường chéo khối lập phương $a\sqrt{3}$):</span>
          $$d = \sqrt{\left(\frac{a}{4}\right)^2 + \left(\frac{a}{4}\right)^2 + \left(\frac{a}{4}\right)^2} = \sqrt{\frac{3a^2}{16}} = \frac{a\sqrt{3}}{4}$$
          <span class="cmt">// Bước 3: Thay giá trị hằng số mạng $a = 5.34\text{ Å}$ của đề bài vào công thức:</span>
          $$d = \frac{5.34 \times \sqrt{3}}{4} = \frac{5.34 \times 1.73205}{4} \approx 2.312\text{ Å}$$
          <span class="cmt">// Bước 4: Đổi sang đơn vị centimet ($\text{cm}$) bằng cách nhân với $10^{-8}$ để thống nhất hệ đơn vị chuẩn bán dẫn:</span>
          $$d \approx 2.312\text{ Å} = 2.312 \times 10^{-8}\text{ cm}$$
        </div>

        <div class="step">
          <b>b) Mật độ nguyên tử của silicon ($\text{\#/cm}^3$):</b>
          <span class="cmt">// Bước 1: Tính tổng số nguyên tử hiệu dụng ($n_{\text{cell}}$) thuộc về 1 ô đơn vị mạng Kim cương. Ô đơn vị này gồm 8 nguyên tử ở 8 đỉnh góc (mỗi đỉnh đóng góp $\frac{1}{8}$), 6 nguyên tử ở 6 tâm mặt (mỗi mặt đóng góp $\frac{1}{2}$) và 4 nguyên tử nằm trọn vẹn bên trong ruột (mỗi nguyên tử đóng góp $1$):</span>
          $$n_{\text{cell}} = \left(8 \times \frac{1}{8}\right) + \left(6 \times \frac{1}{2}\right) + (4 \times 1) = 1 + 3 + 4 = 8\text{ nguyên tử}$$
          <span class="cmt">// Bước 2: Đổi hằng số mạng $a = 5.34\text{ Å}$ sang đơn vị centimet ($\text{cm}$) trước khi tính thể tích:</span>
          $$a = 5.34\text{ Å} = 5.34 \times 10^{-8}\text{ cm}$$
          <span class="cmt">// Bước 3: Tính thể tích của 1 ô đơn vị hình lập phương ($V_{\text{cell}} = a^3$):</span>
          $$V_{\text{cell}} = a^3 = \left(5.34 \times 10^{-8}\text{ cm}\right)^3 \approx 1.52273 \times 10^{-22}\text{ cm}^3$$
          <span class="cmt">// Bước 4: Lấy số nguyên tử hiệu dụng trong 1 ô chia cho thể tích của ô đó để thu được mật độ nguyên tử $N$:</span>
          $$N = \frac{n_{\text{cell}}}{V_{\text{cell}}} = \frac{8\text{ atoms}}{1.52273 \times 10^{-22}\text{ cm}^3} \approx 5.254 \times 10^{22}\text{ atoms/cm}^3$$
        </div>

        <div class="step">
          <b>c) Khối lượng riêng của silicon ($\text{g/cm}^3$):</b>
          <span class="cmt">// Bước 1: Sử dụng nguyên tử khối của Silicon là $M_A = 28.09\text{ g/mol}$ và hằng số Avogadro là $N_A = 6.022 \times 10^{23}\text{ atoms/mol}$. Ta tìm khối lượng của 1 nguyên tử Silicon bằng cách lấy khối lượng của $1\text{ mol}$ chia cho tổng số nguyên tử trong $1\text{ mol}$:</span>
          $$m_{\text{atom}} = \frac{M_A}{N_A} = \frac{28.09\text{ g/mol}}{6.022 \times 10^{23}\text{ atoms/mol}} \approx 4.6646 \times 10^{-23}\text{ g/atom}$$
          <span class="cmt">// Bước 2: Nhân khối lượng của 1 nguyên tử với tổng số nguyên tử có trong $1\text{ cm}^3$ (tức mật độ $N$ ở câu b) để ra khối lượng của $1\text{ cm}^3$ Silicon (khối lượng riêng $\rho$):</span>
          $$\rho = N \times m_{\text{atom}} = \left(5.254 \times 10^{22}\text{ atoms/cm}^3\right) \times \left(4.6646 \times 10^{-23}\text{ g/atom}\right) \approx 2.45\text{ g/cm}^3$$
          <span class="cmt">// Ghi chú đối chiếu: Vì đề bài cho $a = 5.34\text{ Å}$ nên kết quả tính ra là $\rho \approx 2.45\text{ g/cm}^3$ (nếu đề bài cho $a = 5.43\text{ Å}$ như trong sách giáo khoa thì $\rho \approx 2.33\text{ g/cm}^3$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 2 -->
    <div class="formula-card">
      <h3 id="bt-cau2">Câu 2: Xác định Chỉ số Miller của Mặt phẳng</h3>
      <p><b>Đề bài:</b> Một mạng lập phương tâm khối (body-centered cubic) có lattice constant $a = 4.83\text{ Å}$. Một mặt phẳng cắt ba trục Cartesian tại: $9.60\text{ Å}$ <i>(trong sách gốc bài 1.17 là $9.66\text{ Å}$)</i>, $19.32\text{ Å}$, $14.49\text{ Å}$. Xác định chỉ số Miller (Miller indices) của mặt phẳng.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="hint2" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Chỉ số Miller không tính trực tiếp trên số đo $\text{Å}$ mà phải tính trên <b>tỷ số giữa tọa độ điểm cắt và hằng số mạng $a$</b>.</li>
          <li>Hãy lấy 3 tọa độ cắt trên 3 trục chia cho $a = 4.83\text{ Å}$ để tìm $(p, q, s)$.</li>
          <li>Sau đó lấy nghịch đảo $\left(\frac{1}{p}, \frac{1}{q}, \frac{1}{s}\right)$ và quy đồng mẫu số để đưa về bộ 3 số nguyên nhỏ nhất $(hkl)$.</li>
        </ul>
      </div>

      <div id="sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Đổi tọa độ các giao điểm trên 3 trục Descartes sang đơn vị hằng số mạng $a$ bằng cách chia từng khoảng cách cho $a = 4.83\text{ Å}$:</span>
          $$p = \frac{9.66\text{ Å}}{4.83\text{ Å}} = 2 \quad \left(\text{nếu bấm theo số in nhòe } 9.60\text{ Å thì } p = \frac{9.60}{4.83} \approx 1.988 \approx 2\right)$$
          $$q = \frac{19.32\text{ Å}}{4.83\text{ Å}} = 4$$
          $$s = \frac{14.49\text{ Å}}{4.83\text{ Å}} = 3$$
          <span class="cmt">// Như vậy, mặt phẳng cắt 3 trục tại vị trí $2a, 4a, 3a$, tức là bộ hệ số chắn $(p, q, s) = (2, 4, 3)$.</span>
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Lấy nghịch đảo của 3 hệ số chắn $(p, q, s)$ theo đúng định nghĩa toán học của chỉ số Miller:</span>
          $$\left(\frac{1}{p}, \frac{1}{q}, \frac{1}{s}\right) = \left(\frac{1}{2}, \frac{1}{4}, \frac{1}{3}\right)$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Quy đồng khử mẫu bằng cách nhân cả 3 phân số với Bội chung nhỏ nhất của $(2, 4, 3)$ là $12$:</span>
          $$h = \frac{1}{2} \times 12 = 6$$
          $$k = \frac{1}{4} \times 12 = 3$$
          $$l = \frac{1}{3} \times 12 = 4$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 4: Đặt 3 số nguyên tối giản vào trong dấu ngoặc tròn không có dấu phẩy để biểu diễn mặt phẳng:</span>
          $$\text{Chỉ số Miller của mặt phẳng là: } \mathbf{(634)}$$
        </div>
      </div>
    </div>

    <!-- CÂU 3 -->
    <div class="formula-card">
      <h3 id="bt-cau3">Câu 3: Mật độ Thể tích, Mật độ Bề mặt và Khoảng cách Mặt trong Mạng FCC</h3>
      <p><b>Đề bài:</b> Xét một mạng lập phương tâm mặt (face-centered cubic FCC). Coi các nguyên tử là các quả cầu và các nguyên tử lân cận gần nhất tiếp xúc nhau. Bán kính nguyên tử: $r = 2.37\text{ Å}$. Hãy:<br>
      a) Tính mật độ nguyên tử theo thể tích (volume density) của tinh thể.<br>
      b) Tính mật độ nguyên tử trên bề mặt (surface density) trên mặt $(110)$.<br>
      c) Tính khoảng cách giữa hai mặt $(110)$ gần nhất.<br>
      d) Lặp lại (b) và (c) đối với mặt $(111)$.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="hint3" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Bước chuẩn bị:</b> Trong mạng FCC, các quả cầu nguyên tử tiếp xúc nhau trên đường chéo mặt hình vuông: $a\sqrt{2} = 4r \implies a = 2\sqrt{2}r$. Hãy tính $a$ và đổi ra $\text{cm}$.</li>
          <li><b>Ý a:</b> Số nguyên tử trong 1 ô FCC là $n_{\text{cell}} = 4$. Dùng $N = \frac{4}{a^3}$.</li>
          <li><b>Ý b:</b> Xem lại Mô hình 3.1 ở trên cho mặt $(110)$ mạng FCC: thiết diện cắt là hình chữ nhật rộng $a$, dài $a\sqrt{2}$, diện tích $S_{110} = a^2\sqrt{2}$. Đếm số nguyên tử trong hình chữ nhật: $4\text{ góc} \times \frac{1}{4} + 2\text{ cạnh dài} \times \frac{1}{2} = 2$ nguyên tử.</li>
          <li><b>Ý c:</b> Áp dụng công thức khoảng cách mặt $d_{110} = \frac{a}{\sqrt{1^2+1^2+0^2}} = \frac{a}{\sqrt{2}}$ (và nêu thêm khoảng cách lớp nguyên tử tâm mặt xen kẽ $\frac{a\sqrt{2}}{4} = r$).</li>
          <li><b>Ý d:</b> Xem Mô hình 3.1 cho mặt $(111)$ mạng FCC: thiết diện cắt là tam giác đều cạnh $a\sqrt{2}$, diện tích $S_{111} = \frac{\sqrt{3}}{2}a^2$. Số nguyên tử trong tam giác đều: $3\text{ góc nhọn } 60^\circ \times \frac{1}{6} + 3\text{ trung điểm cạnh} \times \frac{1}{2} = 2$ nguyên tử.</li>
        </ul>
      </div>

      <div id="sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước mở đầu: Tìm hằng số mạng $a$ từ bán kính nguyên tử $r = 2.37\text{ Å}$:</b>
          <span class="cmt">// Trong mạng lập phương tâm mặt (FCC), các nguyên tử lân cận gần nhất chạm vào nhau dọc theo đường chéo mặt hình vuông. Đường chéo mặt có độ dài là $a\sqrt{2}$, đi qua 1 nguyên tử tâm mặt (đường kính $2r$) và 2 nửa nguyên tử ở góc ($2 \times r$), nên tổng độ dài là $4r$:</span>
          $$a\sqrt{2} = 4r \implies a = \frac{4r}{\sqrt{2}} = 2\sqrt{2}\,r$$
          <span class="cmt">// Thay $r = 2.37\text{ Å}$ vào và đổi sang đơn vị centimet ($\text{cm}$):</span>
          $$a = 2\sqrt{2} \times 2.37\text{ Å} \approx 6.7034\text{ Å} = 6.7034 \times 10^{-8}\text{ cm}$$
        </div>

        <div class="step">
          <b>a) Tính mật độ nguyên tử theo thể tích (volume density):</b>
          <span class="cmt">// Bước 1: Tính số nguyên tử hiệu dụng trong 1 ô đơn vị FCC (8 góc góp $\frac{1}{8}$ và 6 tâm mặt góp $\frac{1}{2}$):</span>
          $$n_{\text{cell}} = \left(8 \times \frac{1}{8}\right) + \left(6 \times \frac{1}{2}\right) = 1 + 3 = 4\text{ nguyên tử}$$
          <span class="cmt">// Bước 2: Chia số nguyên tử hiệu dụng cho thể tích ô đơn vị $a^3$:</span>
          $$N = \frac{n_{\text{cell}}}{a^3} = \frac{4}{\left(6.7034 \times 10^{-8}\text{ cm}\right)^3} = \frac{4}{3.0122 \times 10^{-22}\text{ cm}^3} \approx 1.328 \times 10^{22}\text{ atoms/cm}^3$$
        </div>

        <div class="step">
          <b>b) Tính mật độ nguyên tử trên bề mặt (surface density) trên mặt $(110)$:</b>
          <span class="cmt">// Bước 1: Tính diện tích thiết diện mặt cắt $(110)$. Mặt $(110)$ là hình chữ nhật có chiều cao là $a$ và chiều rộng là đường chéo mặt đáy $a\sqrt{2}$:</span>
          $$S_{(110)} = a \times (a\sqrt{2}) = a^2\sqrt{2}$$
          <span class="cmt">// Bước 2: Đếm số nguyên tử hiệu dụng nằm trên hình chữ nhật $(110)$. Tại 4 góc vuông của hình chữ nhật có 4 nguyên tử đỉnh góc (mỗi góc $90^\circ$ chiếm $\frac{90^\circ}{360^\circ} = \frac{1}{4}$ hình tròn). Tại trung điểm của 2 cạnh dài trên và dưới có 2 nguyên tử tâm mặt đáy bị cắt đôi (mỗi nguyên tử chiếm $\frac{1}{2}$ hình tròn):</span>
          $$n_{(110)} = \left(4 \times \frac{1}{4}\right) + \left(2 \times \frac{1}{2}\right) = 1 + 1 = 2\text{ nguyên tử}$$
          <span class="cmt">// Bước 3: Lấy số nguyên tử trên mặt $(110)$ chia cho diện tích mặt $(110)$:</span>
          $$N_{s(110)} = \frac{n_{(110)}}{S_{(110)}} = \frac{2}{a^2\sqrt{2}} = \frac{\sqrt{2}}{a^2}$$
          $$N_{s(110)} = \frac{\sqrt{2}}{\left(6.7034 \times 10^{-8}\text{ cm}\right)^2} \approx 3.147 \times 10^{14}\text{ atoms/cm}^2$$
        </div>

        <div class="step">
          <b>c) Tính khoảng cách giữa hai mặt $(110)$ gần nhất:</b>
          <span class="cmt">// Bước 1: Tính khoảng cách giữa hai mặt phẳng mạng $(110)$ theo công thức hình học chuẩn từ gốc tọa độ đến mặt cắt qua $(a, a, \infty)$ (tức một nửa đường chéo mặt $a\sqrt{2}$):</span>
          $$d_{110} = \frac{a}{\sqrt{1^2 + 1^2 + 0^2}} = \frac{a}{\sqrt{2}} = \frac{6.7034\text{ Å}}{\sqrt{2}} \approx 4.74\text{ Å}$$
          <span class="cmt">// Bước 2 (Bổ sung bản chất mạng FCC): Trong mạng FCC, các nguyên tử nằm ở tâm các mặt bên tạo thành một lớp mặt phẳng song song với $(110)$ nằm chính giữa khoảng cách trên. Nếu tính khoảng cách giữa hai lớp nguyên tử song song theo phương $[110]$ gần nhất thì:</span>
          $$d'_{110} = \frac{d_{110}}{2} = \frac{a}{2\sqrt{2}} = r = 2.37\text{ Å}$$
        </div>

        <div class="step">
          <b>d) Lặp lại câu (b) và (c) đối với mặt $(111)$:</b>
          <span class="cmt">// Bước 1: Tính diện tích thiết diện mặt cắt $(111)$. Mặt $(111)$ nối 3 đỉnh $(a,0,0), (0,a,0), (0,0,a)$ tạo thành một tam giác đều có độ dài cạnh là đường chéo mặt $L = a\sqrt{2}$. Diện tích tam giác đều cạnh $L$ là $\frac{\sqrt{3}}{4}L^2$:</span>
          $$S_{(111)} = \frac{\sqrt{3}}{4} L^2 = \frac{\sqrt{3}}{4} \left(a\sqrt{2}\right)^2 = \frac{\sqrt{3}}{2}a^2$$
          <span class="cmt">// Bước 2: Đếm số nguyên tử hiệu dụng nằm trong tam giác đều $(111)$. Ở 3 đỉnh nhọn của tam giác đều (mỗi góc bằng $60^\circ$), mỗi nguyên tử góc đóng góp $\frac{60^\circ}{360^\circ} = \frac{1}{6}$ hình tròn. Ở trung điểm của 3 cạnh tam giác (chính là tâm của 3 mặt vuông khối lập phương) có 3 nguyên tử tâm mặt bị cạnh tam giác cắt làm đôi, mỗi nguyên tử đóng góp $\frac{1}{2}$ hình tròn:</span>
          $$n_{(111)} = \left(3 \times \frac{1}{6}\right) + \left(3 \times \frac{1}{2}\right) = \frac{1}{2} + \frac{3}{2} = 2\text{ nguyên tử}$$
          <span class="cmt">// Bước 3: Chia số nguyên tử trên mặt $(111)$ cho diện tích mặt $(111)$ để tìm mật độ bề mặt:</span>
          $$N_{s(111)} = \frac{n_{(111)}}{S_{(111)}} = \frac{2}{\frac{\sqrt{3}}{2}a^2} = \frac{4}{a^2\sqrt{3}}$$
          $$N_{s(111)} = \frac{4}{\left(6.7034 \times 10^{-8}\text{ cm}\right)^2 \times \sqrt{3}} \approx 5.139 \times 10^{14}\text{ atoms/cm}^2$$
          <span class="cmt">// Bước 4: Tính khoảng cách giữa hai mặt $(111)$ gần nhất dọc theo trục pháp tuyến $[111]$:</span>
          $$d_{111} = \frac{a}{\sqrt{1^2 + 1^2 + 1^2}} = \frac{a}{\sqrt{3}} = \frac{6.7034\text{ Å}}{\sqrt{3}} \approx 3.87\text{ Å}$$
        </div>
      </div>
    </div>

    <!-- CÂU 4 -->
    <div class="formula-card">
      <h3 id="bt-cau4">Câu 4: Mật độ Electron Hóa trị trong Silicon</h3>
      <p><b>Đề bài:</b> Tính mật độ electron hóa trị (density of valence electrons) trong silicon.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('hint4');togglePanel('sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="hint4" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Silicon thuộc <b>Nhóm IV</b> trong bảng tuần hoàn, nghĩa là mỗi nguyên tử Silicon có đúng <b>$4$ electron hóa trị</b> ở lớp ngoài cùng.</li>
          <li>Do đó: $\text{Mật độ electron hóa trị} = 4 \times \text{Mật độ nguyên tử Silicon } (N_{\text{Si}})$.</li>
        </ul>
      </div>

      <div id="sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Xác định mật độ nguyên tử của Silicon ($N_{\text{Si}}$). Trong giáo trình chuẩn của Neamen, hằng số mạng của Silicon ở nhiệt độ phòng là $a = 5.43\text{ Å} = 5.43 \times 10^{-8}\text{ cm}$, với $8$ nguyên tử trong một ô đơn vị mạng Kim cương:</span>
          $$N_{\text{Si}} = \frac{8}{a^3} = \frac{8}{\left(5.43 \times 10^{-8}\text{ cm}\right)^3} \approx 5.0 \times 10^{22}\text{ atoms/cm}^3$$
          <span class="cmt">// (Nếu sử dụng kết quả từ Câu 1 với $a = 5.34\text{ Å}$ thì $N_{\text{Si}} \approx 5.254 \times 10^{22}\text{ atoms/cm}^3$).</span>
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Vì Silicon là nguyên tố thuộc Nhóm IV, mỗi nguyên tử Silicon đóng góp $4$ electron hóa trị để tham gia liên kết cộng hóa trị với 4 nguyên tử lân cận.</span>
          <span class="cmt">// Bước 3: Nhân mật độ nguyên tử Silicon với $4$ để thu được mật độ electron hóa trị ($n_{\text{valence}}$):</span>
          $$n_{\text{valence}} = 4 \times N_{\text{Si}} = 4 \times \left(5.0 \times 10^{22}\text{ atoms/cm}^3\right) = 2.0 \times 10^{23}\text{ electrons/cm}^3$$
          <span class="cmt">// (Hoặc nếu tính theo số liệu $a = 5.34\text{ Å}$ của Câu 1: $n_{\text{valence}} = 4 \times 5.254 \times 10^{22} \approx 2.10 \times 10^{23}\text{ electrons/cm}^3$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 5 -->
    <div class="formula-card">
      <h3 id="bt-cau5">Câu 5: Khoảng cách giữa các Nguyên tử Tạp chất Boron</h3>
      <p><b>Đề bài:</b> Có $2 \times 10^{16}\text{ boron atoms/cm}^3$ được thêm vào silicon dưới dạng tạp chất thay thế (substitutional impurity) và phân bố đồng đều trong toàn bộ chất bán dẫn. Hãy xác định khoảng cách giữa các nguyên tử boron biểu diễn theo hằng số mạng (lattice constant) của silicon.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('hint5')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('sol5')">Xem Lời giải chi tiết</button>
      </div>

      <div id="hint5" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Khi các nguyên tử Boron phân bố đồng đều theo một mạng lưới hình lập phương trong $1\text{ cm}^3$, mỗi nguyên tử Boron sẽ chiếm một "ô lập phương riêng" có cạnh là $d$ (với $d$ chính là khoảng cách giữa 2 nguyên tử Boron kế tiếp).</li>
          <li>Thể tích của 1 ô lập phương chứa 1 nguyên tử Boron là $V_B = d^3 = \frac{1}{N_{\text{Boron}}}$.</li>
          <li>Từ đó tính được $d = \frac{1}{\sqrt[3]{N_{\text{Boron}}}}$, rồi lấy $\frac{d}{a}$ để xem $d$ gấp bao nhiêu lần hằng số mạng $a$ của Silicon.</li>
        </ul>
      </div>

      <div id="sol5" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Giả sử các nguyên tử Boron phân bố đều đặn tạo thành một mạng lập phương với khoảng cách giữa hai nguyên tử Boron gần nhất là $d$. Khi đó, mỗi nguyên tử Boron chiếm một khoảng không gian hình lập phương có thể tích là $V_1 = d^3$.</span>
          <span class="cmt">// Bước 2: Biết trong $1\text{ cm}^3$ có tổng cộng $N_B = 2 \times 10^{16}$ nguyên tử Boron, thể tích không gian trung bình dành cho 1 nguyên tử Boron là:</span>
          $$d^3 = \frac{1}{N_B} = \frac{1}{2 \times 10^{16}\text{ cm}^{-3}} = 0.5 \times 10^{-16}\text{ cm}^3 = 50 \times 10^{-18}\text{ cm}^3$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Lấy căn bậc ba của hai vế để tìm khoảng cách thực tế $d$ giữa hai nguyên tử Boron kế tiếp:</span>
          $$d = \sqrt[3]{50 \times 10^{-18}\text{ cm}^3} = \sqrt[3]{50} \times 10^{-6}\text{ cm} \approx 3.684 \times 10^{-6}\text{ cm} = 368.4\text{ Å}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 4: Biểu diễn khoảng cách $d$ theo hằng số mạng $a$ của Silicon bằng cách lập tỷ số $\frac{d}{a}$ (với hằng số mạng chuẩn của Silicon $a = 5.43\text{ Å} = 5.43 \times 10^{-8}\text{ cm}$):</span>
          $$\frac{d}{a} = \frac{3.684 \times 10^{-6}\text{ cm}}{5.43 \times 10^{-8}\text{ cm}} \approx 67.85 \implies d \approx 67.8\,a$$
          <span class="cmt">// (Nếu lấy theo hằng số mạng $a = 5.34\text{ Å}$ ở Câu 1 thì $\frac{d}{a} = \frac{368.4\text{ Å}}{5.34\text{ Å}} \approx 69.0\,a$).</span>
          <span class="cmt">// Kết luận: Hai nguyên tử Boron nằm cách nhau khoảng $68$ đến $69$ lần hằng số mạng của Silicon.</span>
        </div>
      </div>
    </div>
  </section>

  <header>
    <span class="k b1">HỌC PHẦN ENP2209 · BUỔI 2</span>
    <h1>Nhập Môn Cơ Học Lượng Tử (Phần 1)</h1>
    <p class="mut">Hiểu rõ bản chất Lượng tử năng lượng, Lưỡng tính sóng - hạt, Nguyên lý bất định Heisenberg và Phương trình sóng Schrödinger từ con số 0 qua các mô hình tương tác trực quan.</p>
  </header>

  <section>
    <h2>1. Lượng Tử Năng Lượng & Hiệu Ứng Quang Điện</h2>
    <p>Ở Buổi 1, chúng ta đã xây xong "ngôi nhà tinh thể" gồm các nguyên tử đứng ở nút mạng. Bây giờ, để hiểu làm sao dòng điện chạy qua ngôi nhà đó, ta phải theo dõi chuyển động của các hạt <b>electron</b>. Tuy nhiên, vì electron quá nhỏ bé (nặng chỉ khoảng $9.11 \times 10^{-31}\text{ kg}$), các định luật cơ học cổ điển của Newton hoàn toàn bất lực! Chúng ta phải bước vào thế giới của <b>Cơ học Lượng tử (Quantum Mechanics)</b>.</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Vòi nước liên tục vs. Máy bán nước tự động theo lon</b><br>
      • <b>Vật lý cổ điển</b> nghĩ rằng năng lượng ánh sáng giống như nước chảy ra từ vòi: em muốn rót bao nhiêu giọt tùy ý, năng lượng tăng giảm liên tục.<br>
      • <b>Cơ học lượng tử (Max Planck & Albert Einstein)</b> phát hiện ra rằng ở cấp độ vi mô, năng lượng giống như <b>máy bán nước ngọt tự động</b>: máy chỉ nhả ra từng lon nguyên vẹn (1 lon, 2 lon, 3 lon...), tuyệt đối không bán nửa lon! Mỗi "lon năng lượng" rời rạc đó được gọi là một <b>Lượng tử năng lượng (Quantum)</b>, và với ánh sáng thì mỗi viên năng lượng đó gọi là một hạt <b>Photon</b>.
    </div>

    <h3>1.1. Giả thuyết Planck và Hạt ánh sáng (Photon)</h3>
    <p>Năm 1901, khi nghiên cứu bức xạ vật đen (Black-body radiation), Max Planck khẳng định năng lượng chỉ được phát ra hoặc hấp thụ thành từng gói rời rạc tỉ lệ thuận với tần số $\nu$ của sóng ánh sáng:</p>
    <div class="f">
      $$E = h\nu = \frac{hc}{\lambda} \qquad \left(\text{Mẹo tính nhanh: } E\text{ [eV]} \approx \frac{1240}{\lambda\text{ [nm]}} = \frac{12400}{\lambda\text{ [Å]}}\right)$$
      <small>Trong đó: $h = 6.625 \times 10^{-34}\text{ J}\cdot\text{s}$ là hằng số Planck; $c = 3 \times 10^8\text{ m/s}$ là vận tốc ánh sáng; $\lambda$ là bước sóng.</small>
    </div>

    <div class="box warn">
      <b>Cảnh báo đổi đơn vị Năng lượng (Joule $\leftrightarrow$ eV):</b><br>
      Trong thế giới nguyên tử, đơn vị Joule ($\text{J}$) là quá khổng lồ, nên các kỹ sư bán dẫn luôn dùng đơn vị <b>Electron-Volt ($\text{eV}$)</b>. Đó là năng lượng mà 1 electron thu được khi chạy qua hiệu điện thế $1\text{ V}$:<br>
      $$1\text{ eV} = 1.6 \times 10^{-19}\text{ J}$$
      • Từ $\text{eV}$ đổi sang $\text{J}$ (để thế vào công thức chuẩn SI): <b>Nhân với $1.6 \times 10^{-19}$</b>.<br>
      • Từ $\text{J}$ đổi sang $\text{eV}$: <b>Chia cho $1.6 \times 10^{-19}$</b>.
    </div>

    <h3>1.2. Hiệu ứng Quang điện (Photoelectric Effect)</h3>
    <p>Khi chiếu ánh sáng đơn sắc vào một tấm kim loại đặt trong chân không, các hạt electron có thể bị đánh bật ra khỏi bề mặt kim loại (gọi là <b>quang electron - photoelectrons</b>). Để bứt ra khỏi lực giữ của kim loại, mỗi electron phải tốn một mức "phí xuất cảnh" tối thiểu gọi là <b>Công thoát $\Phi$ (Work function)</b>:</p>
    <ul>
      <li>Nếu 1 hạt photon lao vào có năng lượng $h\nu < \Phi$ (tức tần số $\nu < \nu_0 = \frac{\Phi}{h}$): Dù em có bật hàng triệu bóng đèn (tăng cường độ sáng cực mạnh), cũng <b>không có bất kỳ electron nào thoát ra</b>! (Giống như vé qua trạm thu phí là $50\text{ nghìn}$, dù có $1000$ người nhưng mỗi người chỉ cầm tờ $20\text{ nghìn}$ và quy định không được góp tiền chung thì không ai qua được trạm).</li>
      <li>Nếu $h\nu \ge \Phi$: 1 photon truyền toàn bộ năng lượng cho 1 electron. Sau khi trả phí công thoát $\Phi$, phần năng lượng thừa biến thành <b>Động năng cực đại $T_{\text{max}}$</b> giúp electron bay đi:
        $$T_{\text{max}} = \frac{1}{2}mv^2 = h\nu - \Phi = h\nu - h\nu_0$$
      </li>
    </ul>

    <h3>1.3. Mô hình tương tác: Thí nghiệm Hiệu ứng Quang điện & Đồ thị Millikan</h3>
    <p>Em hãy kéo thanh trượt <b>Tần số ánh sáng chiếu vào ($\nu$)</b> và <b>Cường độ chùm sáng</b> dưới đây để xem khi nào electron bật ra và quan sát điểm chạy trên đồ thị động năng $T_{\text{max}}$ bên phải:</p>

  <section>
    <h2>2. Lưỡng Tính Sóng - Hạt (Wave-Particle Duality)</h2>
    <p>Suốt hàng trăm năm, các nhà vật lý tranh cãi xem ánh sáng là Sóng (Huygens) hay là Hạt (Newton). Cơ học lượng tử kết luận: <b>Mọi thực thể vi mô đều vừa là Sóng, vừa là Hạt!</b></p>

    <h3>2.1. Sóng hành xử như Hạt: Hiệu ứng tán xạ Compton (1924)</h3>
    <p>Khi Arthur Compton bắn chùm tia X (bước sóng $\lambda_i$) vào tấm bia Graphite chứa các electron đang đứng yên, ông thấy tia X bị bật lệch đi một góc $\theta$ với bước sóng dài hơn ($\lambda_f > \lambda_i$), đồng thời electron bị hất văng đi giống hệt như <b>hai viên bi-a va chạm đàn hồi</b>!</p>
    <p>Dù photon không có khối lượng nghỉ, nó vẫn mang <b>Động lượng (Momentum) $p$</b> như một viên đạn thực thụ:</p>
    <div class="f">
      $$p = \frac{E}{c} = \frac{h\nu}{c} = \frac{h}{\lambda} \implies \lambda_f - \lambda_i = \frac{h}{m_e c}(1 - \cos\theta)$$
    </div>

    <h3>2.2. Hạt hành xử như Sóng: Giả thuyết Sóng vật chất de Broglie & Thí nghiệm Davisson-Germer</h3>
    <p>Năm 1924, Louis de Broglie đặt câu hỏi ngược lại: <i>"Nếu sóng ánh sáng có thể va chạm như hạt bi-a, vậy các hạt vật chất (như viên đạn, hạt electron) khi bay có mang tính chất sóng không?"</i> Câu trả lời là <b>CÓ!</b> Mọi vật chuyển động với động lượng $p = mv$ đều đi kèm một bước sóng gọi là <b>Bước sóng de Broglie ($\lambda_{\text{DB}}$)</b>:</p>
    <div class="f">
      $$\lambda = \frac{h}{p} = \frac{h}{mv}$$
    </div>
    <p>Năm 1927, <b>Davisson và Germer</b> đã bắn chùm tia electron (được gia tốc ở điện áp $54\text{ V}$) vào bề mặt tinh thể Niken ($\text{Ni}$). Thay vì nảy ra lộn xộn như các viên bi, các hạt electron lại giao thoa với nhau tạo thành một đỉnh cực đại sắc nét ở góc tán xạ $\theta = 50^\circ$ (hoặc $45^\circ$ trên giản đồ cực), tuân theo đúng định luật nhiễu xạ sóng Bragg!</p>

    <h3>2.3. Mô hình tương tác: Tán xạ Compton & Sóng de Broglie của Electron</h3>

  <section>
    <h2>3. Nguyên Lý Bất Định Heisenberg (1927)</h2>
    <p>Trong vật lý cổ điển, khi nhìn một chiếc ô tô chạy trên đường, em biết chính xác tuyệt đối cùng lúc cả <b>vị trí $x$</b> lẫn <b>vận tốc/động lượng $p$</b> của chiếc xe. Nhưng ở thế giới lượng tử, nhà vật lý Werner Heisenberg chứng minh rằng điều đó là bất khả thi!</p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Tìm quả bóng bàn trong phòng tối đen bằng đèn pin</b><br>
      Để nhìn thấy vị trí của một hạt electron nhỏ xíu, em bắt buộc phải chiếu ánh sáng (tức bắn ít nhất 1 hạt photon) chạm vào electron rồi bật lại vào mắt em.<br>
      • Nếu em muốn nhìn vị trí thật nét ($\Delta x$ cực nhỏ), em phải dùng ánh sáng có bước sóng $\lambda$ thật ngắn. Mà $\lambda$ ngắn nghĩa là động lượng photon $p = \frac{h}{\lambda}$ cực mạnh — cú tông của photon sẽ hất văng electron đi khiến vận tốc/động lượng của electron bị xáo trộn dữ dội ($\Delta p$ cực lớn)!<br>
      • Ngược lại, nếu dùng photon bước sóng dài (nhẹ nhàng) để ít làm thay đổi động lượng electron ($\Delta p$ nhỏ), thì hình ảnh thu được lại nhòe nhoẹt không biết electron đang ở đâu ($\Delta x$ lớn)!
    </div>

    <p>Heisenberg gói gọn quy luật tự nhiên này vào 2 bất đẳng thức cặp biến liên hợp:</p>
    <div class="f">
      $$\text{1. Vị trí - Động lượng: } \Delta p \cdot \Delta x \ge \hbar \qquad \Big| \qquad \text{2. Năng lượng - Thời gian: } \Delta E \cdot \Delta t \ge \hbar$$
      <small>Trong đó: $\hbar = \frac{h}{2\pi} \approx 1.054 \times 10^{-34}\text{ J}\cdot\text{s}$ gọi là <b>Hằng số Planck rút gọn (Reduced Planck constant)</b>.</small>
    </div>

    <h3>3.1. Mô hình tương tác: Bó sóng (Wave Packet) & Sự đánh đổi $\Delta x \leftrightarrow \Delta p$</h3>
    <p>Hãy kéo thanh trượt dưới đây để thu hẹp hoặc mở rộng độ bất định vị trí $\Delta x$. Em sẽ thấy khi ta "nhốt" hạt vào vùng không gian càng hẹp ($\Delta x$ nhỏ) thì phổ độ bất định động lượng $\Delta p$ tự động phình to ra để tích số $\Delta x \cdot \Delta p \ge \hbar$ luôn được bảo toàn:</p>

  <section>
    <h2>4. Phương Trình Sóng Schrödinger & Ý Nghĩa Hàm Sóng</h2>
    <p>Năm 1926, Erwin Schrödinger đã xây dựng một phương trình vi phân đóng vai trò giống như định luật $F = ma$ của Newton, nhưng dùng để tìm <b>Hàm sóng $\Psi(x, t)$</b> của hạt vi mô chuyển động trong trường thế năng $V(x)$:</p>

    <div class="f">
      $$-\frac{\hbar^2}{2m}\frac{\partial^2\Psi(x,t)}{\partial x^2} + V(x)\Psi(x,t) = j\hbar\frac{\partial\Psi(x,t)}{\partial t}$$
      <small>Lưu ý ký hiệu: Trong kỹ thuật điện - bán dẫn, người ta dùng chữ $j = \sqrt{-1}$ (thay vì chữ $i$) để biểu diễn đơn vị số ảo nhằm tránh nhầm với cường độ dòng điện $i$.</small>
    </div>

    <h3>4.1. Kỹ thuật Tách biến (Separation of Variables): Tách Không gian và Thời gian</h3>
    <p>Khi thế năng $V(x)$ chỉ phụ thuộc vào vị trí $x$ (không đổi theo thời gian $t$), ta có thể tách hàm sóng toàn phần $\Psi(x,t)$ thành tích của hai hàm độc lập:</p>
    <div class="f">
      $$\Psi(x,t) = \psi(x) \cdot \phi(t) = \psi(x) \cdot e^{-j(E/\hbar)t} = \psi(x) \cdot e^{-j\omega t}$$
    </div>
    <ul>
      <li><b>Phần phụ thuộc thời gian $\phi(t) = e^{-j\omega t} = \cos(\omega t) - j\sin(\omega t)$:</b> Chỉ dao động điều hòa tại chỗ với tần số góc $\omega = \frac{E}{\hbar}$.</li>
      <li><b>Phần phụ thuộc không gian $\psi(x)$:</b> Quyết định biên độ hình dáng sóng và thỏa mãn <b>Phương trình Schrödinger không phụ thuộc thời gian (Time-Independent Schrödinger Equation)</b>:
        $$\frac{d^2\psi(x)}{dx^2} + \frac{2m}{\hbar^2}\big[E - V(x)\big]\psi(x) = 0$$
      </li>
    </ul>

    <h3>4.2. Ý nghĩa Vật lý của Hàm sóng (Định đề Max Born)</h3>
    <p>Vì hàm sóng $\Psi(x,t)$ chứa số ảo $j = \sqrt{-1}$ nên bản thân $\Psi(x,t)$ <b>không phải là đại lượng vật lý đo được trực tiếp</b>. Tuy nhiên, năm 1926, Max Born phát hiện ra rằng khi lấy <b>bình phương mô-đun</b> của hàm sóng (tức nhân hàm sóng với liên hợp phức $\Psi^*$ của nó), số ảo $e^{-j\omega t}$ sẽ triệt tiêu hoàn toàn với $e^{+j\omega t}$:</p>
    <div class="f">
      $$|\Psi(x,t)|^2 = \Psi(x,t)\cdot\Psi^*(x,t) = \big[\psi(x)e^{-j\omega t}\big]\cdot\big[\psi^*(x)e^{+j\omega t}\big] = |\psi(x)|^2$$
    </div>
    <ul>
      <li><span class="k b1">$|\psi(x)|^2$</span> Gọi là <b>Hàm mật độ xác suất (Probability density function)</b> — luôn là một số thực không âm và không đổi theo thời gian.</li>
      <li><span class="k b2">$|\psi(x)|^2\,dx$</span> Là <b>Xác suất tìm thấy hạt</b> nằm trong đoạn không gian nhỏ từ $x$ đến $x + dx$.</li>
      <li><span class="k b5">$P(x_1 \le x \le x_2) = \int_{x_1}^{x_2} |\psi(x)|^2\,dx$</span> Là xác suất tìm thấy hạt trong khoảng từ $x_1$ đến $x_2$ (chính là <b>diện tích nằm dưới đồ thị $|\psi(x)|^2$</b> từ $x_1$ đến $x_2$).</li>
    </ul>

    <h3>4.3. Mô hình tương tác: Hàm sóng $\psi(x)$, Chuẩn hóa và Điều kiện Biên</h3>
    <p>Để một hàm sóng $\psi(x)$ mô tả đúng hạt thực tế trong tự nhiên, nó bắt buộc phải thỏa mãn <b>Điều kiện chuẩn hóa</b> (tổng xác suất tìm thấy hạt trên toàn không gian phải bằng $100\% = 1$, tức $\int_{-\infty}^{+\infty}|\psi(x)|^2dx = 1$) và các <b>Điều kiện biên (Boundary Conditions)</b>. Hãy bấm vào 2 tab dưới đây để so sánh sự khác biệt giữa <b>Giếng thế hữu hạn</b> và <b>Giếng thế vô hạn</b>:</p>

    <p>Nhiều bạn mất gốc Giải tích thường rất sợ khi thấy dấu tích phân $\int |\psi(x)|^2dx$. Thực ra, tích phân xác suất chỉ đơn giản là <b>đo phần diện tích tô màu</b> dưới đường cong $|\psi(x)|^2$! Em hãy chọn tab tương ứng với <b>Câu 4</b> hoặc <b>Câu 5</b> dưới đây để nhìn tận mắt hàm mật độ xác suất và diện tích tích phân:</p>

  <section>
    <h2>5. Cẩm Nang Công Thức Trọng Tâm Buổi 2 (Giải Nghĩa Chi Tiết)</h2>

    <div class="formula-card">
      <h3>Công thức 1: Năng lượng Photon & Phương trình Quang điện Einstein</h3>
      <div class="f">
        $$E_{\text{photon}} = h\nu = \frac{hc}{\lambda} \qquad \text{và} \qquad T_{\text{max}} = \frac{1}{2}mv^2 = h\nu - \Phi$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $E_{\text{photon}}$: Năng lượng của 1 hạt ánh sáng ($\text{J}$ hoặc $\text{eV}$, với $1\text{ eV} = 1.6 \times 10^{-19}\text{ J}$).<br>
          • $h = 6.625 \times 10^{-34}\text{ J}\cdot\text{s}$: Hằng số Planck.<br>
          • $c = 3 \times 10^8\text{ m/s}$: Tốc độ ánh sáng trong chân không.<br>
          • $\nu$: Tần số ánh sáng ($\text{Hz}$ hoặc $\text{s}^{-1}$); $\lambda$: Bước sóng ($\text{m}$).<br>
          • $\Phi = h\nu_0$: Công thoát của vật liệu ($\text{J}$ hoặc $\text{eV}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Định luật bảo toàn năng lượng cho cuộc va chạm 1-đối-1 giữa 1 photon và 1 electron.<br>
          • <b>Khi nào dùng:</b> Khi đề bài cho bước sóng $\lambda$ (như tia X ở Câu 1a) bắt tính năng lượng photon hoặc hiệu điện thế gia tốc $V$ (qua công thức $E = eV$).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 2: Động lượng Photon & Bước sóng Vật chất de Broglie</h3>
      <div class="f">
        $$\lambda = \frac{h}{p} = \frac{h}{mv} = \frac{h}{\sqrt{2mE}}$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $\lambda$: Bước sóng de Broglie của hạt ($\text{m}$, đổi sang Angstrom nhớ $1\text{ Å} = 10^{-10}\text{ m}$).<br>
          • $p = mv$: Động lượng của hạt ($\text{kg}\cdot\text{m/s}$ hoặc $\text{N}\cdot\text{s}$).<br>
          • $m$: Khối lượng hạt (với electron tự do: $m_0 = 9.11 \times 10^{-31}\text{ kg}$).<br>
          • $E = \frac{1}{2}mv^2 = \frac{p^2}{2m}$: Động năng của hạt ($\text{J}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Liên kết tính chất Sóng (bước sóng $\lambda$) và tính chất Hạt (động lượng $p$, khối lượng $m$) của cùng một thực thể.<br>
          • <b>Khi nào dùng:</b> Khi đề bài yêu cầu tính <i>"bước sóng de Broglie của electron"</i> khi biết vận tốc $v$ hoặc biết động năng $E = eV$ (như Câu 1b).
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 3: Hệ thức Bất định Heisenberg</h3>
      <div class="f">
        $$\Delta p \cdot \Delta x \ge \hbar \qquad \text{và} \qquad \Delta E \cdot \Delta t \ge \hbar \qquad \left(\text{với } \hbar = \frac{h}{2\pi} \approx 1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right)$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $\Delta x$: Độ bất định (sai số tối thiểu) về vị trí ($\text{m}$).<br>
          • $\Delta p$: Độ bất định về động lượng ($\text{kg}\cdot\text{m/s}$).<br>
          • $\Delta E$: Độ bất định về năng lượng ($\text{J}$); $\Delta t$: Độ bất định về thời gian ($\text{s}$).<br>
          • $\hbar$: Hằng số Planck rút gọn ($\text{J}\cdot\text{s}$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Giới hạn tự nhiên của sóng vật chất: không thể định xứ đồng thời cả vị trí lẫn bước sóng/động lượng.<br>
          • <b>Khi nào dùng:</b> Khi đề bài có từ khóa <i>"độ bất định (uncertainty)"</i> của vị trí $\Delta x$, động lượng $\Delta p$ hoặc vận tốc $\Delta v = \frac{\Delta p}{m}$ (như Câu 2). Khi tìm giới hạn tối thiểu, ta lấy dấu bằng: $\Delta p = \frac{\hbar}{\Delta x}$.
        </div>
      </div>
    </div>

    <div class="formula-card">
      <h3>Công thức 4: Phương trình Schrödinger, Chuẩn hóa & Tích phân Xác suất</h3>
      <div class="f">
        $$-\frac{\hbar^2}{2m}\frac{\partial^2\Psi}{\partial x^2} + V(x)\Psi = j\hbar\frac{\partial\Psi}{\partial t} \quad \Big| \quad \int_{-\infty}^{+\infty} |\Psi(x,t)|^2\,dx = 1 \quad \Big| \quad P(a \le x \le b) = \int_a^b |\psi(x)|^2\,dx$$
      </div>
      <div class="formula-meta">
        <div><b>1. Giải nghĩa ký hiệu & Đơn vị:</b><br>
          • $\Psi(x,t) = \psi(x)e^{-j\omega t}$: Hàm sóng toàn phần.<br>
          • $|\Psi(x,t)|^2 = |\psi(x)|^2$: Mật độ xác suất tìm thấy hạt trên một đơn vị chiều dài ($\text{m}^{-1}$).<br>
          • $P(a \le x \le b)$: Xác suất tìm thấy hạt trong đoạn $[a, b]$ (không có đơn vị, nằm từ $0$ đến $1$ hay $0\%$ đến $100\%$).
        </div>
        <div><b>2. Tại sao có & Khi nào dùng?</b><br>
          • <b>Bản chất:</b> Vì tổng xác suất tìm thấy 1 hạt trong toàn bộ vùng nó tồn tại phải bằng $1$ ($100\%$), điều kiện chuẩn hóa giúp ta tìm được hằng số biên độ $A$ của hàm sóng.<br>
          • <b>Khi nào dùng:</b> Dùng để chứng minh nghiệm phương trình Schrödinger (Câu 3), tìm hệ số chuẩn hóa $A$ (Câu 4) và tính xác suất tìm thấy hạt trong một khoảng tọa độ (Câu 5).
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>6. Bài Tập Trọng Tâm Buổi 2 (Có Gợi Ý & Giải Chi Tiết Từng Bước)</h2>
    <p>Tất cả 5 câu hỏi trong phiếu Bài tập Trọng tâm Buổi 2 đều được giải chi tiết từng bước dưới đây. Em hãy bấm vào nút <b>Xem Gợi ý</b> để nắm chiến thuật giải trước khi mở <b>Xem Lời giải chi tiết</b> nhé!</p>

    <!-- CÂU 1 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau1">Câu 1: Gia tốc Electron tạo Tia X và Bước sóng de Broglie</h3>
      <p><b>Đề bài:</b> Cần tạo ra bức xạ tia X có bước sóng $\lambda = 1\text{ Å}$.<br>
      a) Electron phải được gia tốc trong chân không qua một hiệu điện thế bao nhiêu để khi va chạm với bia, nó có thể tạo ra photon có bước sóng trên? Giả sử toàn bộ năng lượng của electron được truyền cho photon.<br>
      b) Tính bước sóng de Broglie của electron ngay trước khi nó va vào bia.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint1')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol1')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint1" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý a:</b> Đổi bước sóng tia X $\lambda = 1\text{ Å} = 10^{-10}\text{ m}$. Tính năng lượng của photon tia X bằng công thức $E_{\text{photon}} = \frac{hc}{\lambda}$ (ra đơn vị Joule). Vì toàn bộ động năng của electron khi được gia tốc qua hiệu điện thế $V$ ($E_e = e \cdot V$) truyền hết cho photon, nên ta cho $e \cdot V = E_{\text{photon}} \implies V = \frac{E_{\text{photon}}}{e}$.</li>
          <li><b>Ý b:</b> Ngay trước khi va vào bia, electron có động năng $E = E_{\text{photon}}$ (tính ở câu a). Từ công thức động năng cổ điển $E = \frac{p^2}{2m_0}$, ta rút ra động lượng của electron là $p = \sqrt{2m_0 E}$, sau đó thay vào công thức bước sóng de Broglie $\lambda_{\text{DB}} = \frac{h}{p}$.</li>
        </ul>
      </div>

      <div id="b2-sol1" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>a) Tính hiệu điện thế gia tốc $V$ cần thiết:</b>
          <span class="cmt">// Bước 1: Đổi bước sóng của photon tia X từ đơn vị Angstrom ($\text{Å}$) sang đơn vị chuẩn SI là mét ($\text{m}$):</span>
          $$\lambda = 1\text{ Å} = 1 \times 10^{-10}\text{ m}$$
          <span class="cmt">// Bước 2: Tính năng lượng của photon tia X cần tạo ra theo công thức lượng tử Planck - Einstein (với $h = 6.625 \times 10^{-34}\text{ J}\cdot\text{s}$ và $c = 3 \times 10^8\text{ m/s}$):</span>
          $$E_{\text{photon}} = \frac{hc}{\lambda} = \frac{\left(6.625 \times 10^{-34}\text{ J}\cdot\text{s}\right) \times \left(3 \times 10^8\text{ m/s}\right)}{1 \times 10^{-10}\text{ m}} = 1.9875 \times 10^{-15}\text{ J}$$
          <span class="cmt">// Bước 3: Theo định luật bảo toàn năng lượng, toàn bộ năng lượng mà electron thu được khi chạy qua hiệu điện thế gia tốc $V$ ($E_e = e \cdot V$) được truyền hoàn toàn cho photon tia X ($E_e = E_{\text{photon}}$). Ta chia năng lượng này cho điện tích nguyên tố $e = 1.6 \times 10^{-19}\text{ C}$ để tìm hiệu điện thế $V$:</span>
          $$e \cdot V = E_{\text{photon}} \implies V = \frac{E_{\text{photon}}}{e} = \frac{1.9875 \times 10^{-15}\text{ J}}{1.6 \times 10^{-19}\text{ C}} \approx 12422\text{ V} \approx 12.42\text{ kV}$$
          <span class="cmt">// (Ghi chú: Khi một electron được gia tốc qua hiệu điện thế $12422\text{ V}$, động năng của nó tính theo đơn vị $\text{eV}$ chính bằng $E = 12422\text{ eV} = 12.42\text{ keV}$).</span>
        </div>

        <div class="step">
          <b>b) Tính bước sóng de Broglie của electron ngay trước khi va vào bia:</b>
          <span class="cmt">// Bước 1: Tìm động lượng $p$ của electron ngay trước khi đập vào bia. Biết động năng của electron liên hệ với động lượng $p$ và khối lượng nghỉ $m_0 = 9.11 \times 10^{-31}\text{ kg}$ qua công thức $E = \frac{1}{2}m_0v^2 = \frac{p^2}{2m_0}$, ta rút ra $p$:</span>
          $$p = \sqrt{2 m_0 E} = \sqrt{2 \times \left(9.11 \times 10^{-31}\text{ kg}\right) \times \left(1.9875 \times 10^{-15}\text{ J}\right)}$$
          $$p = \sqrt{3.6212 \times 10^{-45}} \approx 6.018 \times 10^{-23}\text{ kg}\cdot\text{m/s}$$
          <span class="cmt">// Bước 2: Áp dụng công thức de Broglie $\lambda_e = \frac{h}{p}$ để tính bước sóng vật chất của hạt electron tại thời điểm đó:</span>
          $$\lambda_e = \frac{h}{p} = \frac{6.625 \times 10^{-34}\text{ J}\cdot\text{s}}{6.018 \times 10^{-23}\text{ kg}\cdot\text{m/s}} \approx 1.101 \times 10^{-11}\text{ m}$$
          <span class="cmt">// Bước 3: Đổi kết quả từ mét ($\text{m}$) sang Angstrom ($\text{Å}$) bằng cách chia cho $10^{-10}$ để dễ so sánh với bước sóng tia X:</span>
          $$\lambda_e \approx 0.11\text{ Å}$$
          <span class="cmt">// Nhận xét vật lý: Dù có cùng mức năng lượng $12.42\text{ keV}$, nhưng bước sóng de Broglie của electron ($0.11\text{ Å}$) ngắn hơn khoảng 9 lần so với bước sóng của photon tia X ($1\text{ Å}$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 2 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau2">Câu 2: Áp dụng Nguyên lý Bất định Heisenberg cho Photon</h3>
      <p><b>Đề bài:</b> Khi xét nguyên lý bất định, không thể xác định vị trí của một photon chính xác hơn khoảng một bước sóng. Xét photon có: $\lambda = 1\text{ }\mu\text{m}$. Hãy xác định độ bất định của động lượng photon.</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint2')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol2')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint2" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Đề bài cho biết <i>"không thể xác định vị trí chính xác hơn khoảng một bước sóng"</i>, nghĩa là độ bất định về vị trí của photon bằng đúng bước sóng của nó: $\Delta x \approx \lambda = 1\text{ }\mu\text{m} = 10^{-6}\text{ m}$.</li>
          <li>Áp dụng trực tiếp hệ thức bất định Heisenberg giữa vị trí và động lượng: $\Delta p \cdot \Delta x \ge \hbar \implies \Delta p \ge \frac{\hbar}{\Delta x}$.</li>
        </ul>
      </div>

      <div id="b2-sol2" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Xác định độ bất định về vị trí $\Delta x$ từ dữ kiện đề bài và đổi từ đơn vị micromet ($\mu\text{m}$) sang đơn vị chuẩn SI là mét ($\text{m}$):</span>
          $$\Delta x = \lambda = 1\text{ }\mu\text{m} = 1 \times 10^{-6}\text{ m}$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Viết hệ thức bất định Heisenberg liên hệ giữa độ bất định vị trí $\Delta x$ và độ bất định động lượng $\Delta p$:</span>
          $$\Delta p \cdot \Delta x \ge \hbar \quad \left(\text{với } \hbar = \frac{h}{2\pi} \approx 1.054 \times 10^{-34}\text{ J}\cdot\text{s}\right)$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Chia cả hai vế cho $\Delta x$ để tìm giá trị độ bất định tối thiểu của động lượng photon:</span>
          $$\Delta p \ge \frac{\hbar}{\Delta x} = \frac{1.054 \times 10^{-34}\text{ J}\cdot\text{s}}{1 \times 10^{-6}\text{ m}} = 1.054 \times 10^{-28}\text{ kg}\cdot\text{m/s}\text{ (hoặc N}\cdot\text{s)}$$
        </div>
      </div>
    </div>

    <!-- CÂU 3 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau3">Câu 3: Nguyên lý Chồng chập Nghiệm của Phương trình Schrödinger</h3>
      <p><b>Đề bài:</b> Giả sử $\Psi_1(x,t)$ và $\Psi_2(x,t)$ đều là nghiệm của phương trình Schrödinger phụ thuộc thời gian một chiều.<br>
      a) Chứng minh rằng: $\Psi_1 + \Psi_2$ cũng là một nghiệm.<br>
      b) Tích: $\Psi_1 \Psi_2$ có phải luôn là nghiệm của Schrödinger equation không? Tại sao?</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint3')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol3')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint3" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Ý a:</b> Viết phương trình Schrödinger phụ thuộc thời gian cho $\Psi_1$ và cho $\Psi_2$. Sau đó thế hàm tổng $\Psi = \Psi_1 + \Psi_2$ vào phương trình Schrödinger, sử dụng tính chất tuyến tính của đạo hàm: đạo hàm của một tổng bằng tổng các đạo hàm.</li>
          <li><b>Ý b:</b> Thế hàm tích $\Psi = \Psi_1 \cdot \Psi_2$ vào phương trình Schrödinger và áp dụng quy tắc đạo hàm của một tích: $(u \cdot v)' = u'v + uv'$. Em sẽ thấy xuất hiện các số hạng thừa và $V(x)$ bị thiếu hệ số, khiến hai vế không bằng nhau!</li>
        </ul>
      </div>

      <div id="b2-sol3" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước chuẩn bị: Viết giả thiết cho hai nghiệm $\Psi_1(x,t)$ và $\Psi_2(x,t)$:</b>
          <span class="cmt">// Vì $\Psi_1$ và $\Psi_2$ đều là nghiệm của phương trình Schrödinger phụ thuộc thời gian 1 chiều trong cùng trường thế năng $V(x)$, nên bản thân chúng thỏa mãn hai đẳng thức sau:</span>
          $$-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_1}{\partial x^2} + V(x)\Psi_1 = j\hbar\frac{\partial \Psi_1}{\partial t} \quad (1)$$
          $$-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_2}{\partial x^2} + V(x)\Psi_2 = j\hbar\frac{\partial \Psi_2}{\partial t} \quad (2)$$
        </div>

        <div class="step">
          <b>a) Chứng minh tổng $\Psi = \Psi_1 + \Psi_2$ cũng là một nghiệm:</b>
          <span class="cmt">// Bước 1: Thay $\Psi = \Psi_1 + \Psi_2$ vào Vế Trái (VT) của phương trình Schrödinger và dùng tính chất đạo hàm của một tổng bằng tổng các đạo hàm:</span>
          $$\text{VT} = -\frac{\hbar^2}{2m}\frac{\partial^2 (\Psi_1 + \Psi_2)}{\partial x^2} + V(x)(\Psi_1 + \Psi_2)$$
          $$\text{VT} = \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_1}{\partial x^2} + V(x)\Psi_1\right) + \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_2}{\partial x^2} + V(x)\Psi_2\right)$$
          <span class="cmt">// Bước 2: Áp dụng đẳng thức (1) cho ngoặc thứ nhất và đẳng thức (2) cho ngoặc thứ hai, sau đó đặt nhân tử chung $j\hbar\frac{\partial}{\partial t}$:</span>
          $$\text{VT} = j\hbar\frac{\partial \Psi_1}{\partial t} + j\hbar\frac{\partial \Psi_2}{\partial t} = j\hbar\frac{\partial (\Psi_1 + \Psi_2)}{\partial t} = \text{VP}$$
          <span class="cmt">// Kết luận câu a: Vế Trái bằng đúng Vế Phải, vậy $\Psi_1 + \Psi_2$ luôn là nghiệm của phương trình Schrödinger (Trong vật lý lượng tử, tính chất này gọi là Nguyên lý chồng chập trạng thái - Superposition Principle).</span>
        </div>

        <div class="step">
          <b>b) Xét xem tích $\Psi = \Psi_1 \Psi_2$ có phải luôn là nghiệm hay không:</b>
          <span class="cmt">// Bước 1: Tính đạo hàm bậc nhất theo thời gian (Vế Phải) của hàm tích $\Psi_1 \Psi_2$ theo quy tắc đạo hàm một tích $(uv)' = u'v + uv'$:</span>
          $$\text{VP} = j\hbar\frac{\partial (\Psi_1 \Psi_2)}{\partial t} = \Psi_2 \left(j\hbar\frac{\partial \Psi_1}{\partial t}\right) + \Psi_1 \left(j\hbar\frac{\partial \Psi_2}{\partial t}\right)$$
          <span class="cmt">// Thay $j\hbar\frac{\partial \Psi_1}{\partial t}$ và $j\hbar\frac{\partial \Psi_2}{\partial t}$ từ phương trình (1) và (2) vào biểu thức Vế Phải trên:</span>
          $$\text{VP} = \Psi_2 \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_1}{\partial x^2} + V(x)\Psi_1\right) + \Psi_1 \left(-\frac{\hbar^2}{2m}\frac{\partial^2 \Psi_2}{\partial x^2} + V(x)\Psi_2\right)$$
          $$\text{VP} = -\frac{\hbar^2}{2m}\left(\Psi_2\frac{\partial^2 \Psi_1}{\partial x^2} + \Psi_1\frac{\partial^2 \Psi_2}{\partial x^2}\right) + 2V(x)\Psi_1\Psi_2 \quad (*)$$
          <span class="cmt">// Bước 2: Bây giờ ta tính Vế Trái (VT) của phương trình Schrödinger khi thế $\Psi = \Psi_1 \Psi_2$ vào. Lưu ý đạo hàm bậc hai của một tích là $(uv)'' = u''v + 2u'v' + uv''$:</span>
          $$\frac{\partial^2 (\Psi_1 \Psi_2)}{\partial x^2} = \frac{\partial}{\partial x}\left(\Psi_2\frac{\partial \Psi_1}{\partial x} + \Psi_1\frac{\partial \Psi_2}{\partial x}\right) = \Psi_2\frac{\partial^2 \Psi_1}{\partial x^2} + 2\frac{\partial \Psi_1}{\partial x}\frac{\partial \Psi_2}{\partial x} + \Psi_1\frac{\partial^2 \Psi_2}{\partial x^2}$$
          <span class="cmt">// Do đó Vế Trái trở thành:</span>
          $$\text{VT} = -\frac{\hbar^2}{2m}\left(\Psi_2\frac{\partial^2 \Psi_1}{\partial x^2} + 2\frac{\partial \Psi_1}{\partial x}\frac{\partial \Psi_2}{\partial x} + \Psi_1\frac{\partial^2 \Psi_2}{\partial x^2}\right) + V(x)\Psi_1\Psi_2 \quad (**)$$
          <span class="cmt">// Bước 3: So sánh Vế Phải $(*)$ và Vế Trái $(**)$: Ta thấy $\text{VT} \ne \text{VP}$ vì ở Vế Trái dư ra số hạng đạo hàm chéo $-\frac{\hbar^2}{m}\frac{\partial \Psi_1}{\partial x}\frac{\partial \Psi_2}{\partial x}$ và chỉ có $1V(x)\Psi_1\Psi_2$ (trong khi Vế Phải có $2V(x)\Psi_1\Psi_2$).</span>
          <span class="cmt">// Kết luận câu b: Tích $\Psi_1\Psi_2$ KHÔNG PHẢI luôn là nghiệm của phương trình Schrödinger, bởi vì phương trình Schrödinger là phương trình vi phân tuyến tính (chỉ bảo toàn phép cộng và phép nhân với hằng số, không bảo toàn phép nhân hai hàm biến thiên).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 4 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau4">Câu 4: Chuẩn hóa Hàm sóng (Tìm hệ số biên độ $A$)</h3>
      <p><b>Đề bài:</b> Xét wave function: $\Psi(x,t) = A\cos(n\pi x)e^{-j\omega t}$ trong miền $-\frac{1}{2} \le x \le +\frac{1}{2}$ với $n$ là số nguyên. Xác định $A$ sao cho:
      $$\int_{-1/2}^{+1/2} |\Psi(x,t)|^2\,dx = 1$$</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint4')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol4')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint4" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li>Trước tiên, rút gọn $|\Psi(x,t)|^2 = \Psi(x,t) \cdot \Psi^*(x,t)$. Nhớ rằng thừa số thời gian $|e^{-j\omega t}|^2 = e^{-j\omega t} \cdot e^{+j\omega t} = e^0 = 1$, nên $|\Psi(x,t)|^2 = |A|^2 \cos^2(n\pi x)$.</li>
          <li>Để tính tích phân của hàm bậc hai $\cos^2(u)$, hãy dùng <b>công thức hạ bậc lượng giác</b> quen thuộc ở phổ thông:
            $$\cos^2(\alpha) = \frac{1 + \cos(2\alpha)}{2}$$
          </li>
        </ul>
      </div>

      <div id="b2-sol4" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <span class="cmt">// Bước 1: Tính hàm mật độ xác suất $|\Psi(x,t)|^2$ bằng cách nhân hàm sóng $\Psi(x,t)$ với liên hợp phức $\Psi^*(x,t)$ của nó (coi $A$ là số thực dương):</span>
          $$|\Psi(x,t)|^2 = \big[A\cos(n\pi x)e^{-j\omega t}\big] \cdot \big[A\cos(n\pi x)e^{+j\omega t}\big] = A^2 \cos^2(n\pi x)$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 2: Thay biểu thức $|\Psi(x,t)|^2$ vào tích phân điều kiện chuẩn hóa của đề bài:</span>
          $$\int_{-1/2}^{+1/2} A^2 \cos^2(n\pi x)\,dx = 1$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 3: Áp dụng công thức lượng giác hạ bậc $\cos^2(n\pi x) = \frac{1 + \cos(2n\pi x)}{2}$ để đưa về tích phân cơ bản:</span>
          $$A^2 \int_{-1/2}^{+1/2} \frac{1 + \cos(2n\pi x)}{2}\,dx = 1$$
          $$\frac{A^2}{2} \left[ x + \frac{\sin(2n\pi x)}{2n\pi} \right]_{-1/2}^{+1/2} = 1$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 4: Thay cận trên $x = +\frac{1}{2}$ và cận dưới $x = -\frac{1}{2}$ vào. Vì $n$ là số nguyên ($n \ne 0$), nên $\sin\left(2n\pi \cdot \frac{1}{2}\right) = \sin(n\pi) = 0$ và $\sin(-n\pi) = 0$:</span>
          $$\frac{A^2}{2} \left[ \left(\frac{1}{2} - \left(-\frac{1}{2}\right)\right) + \frac{\sin(n\pi) - \sin(-n\pi)}{2n\pi} \right] = 1$$
          $$\frac{A^2}{2} \left[ 1 + 0 \right] = 1 \implies \frac{A^2}{2} = 1 \implies A^2 = 2$$
        </div>
        <div class="step">
          <span class="cmt">// Bước 5: Lấy căn bậc hai của $A^2 = 2$ để kết luận giá trị của hệ số chuẩn hóa $A$:</span>
          $$A = \sqrt{2} \quad (\text{hoặc } A = \pm\sqrt{2})$$
          <span class="cmt">// (Lưu ý nhỏ: Trong trường hợp đặc biệt nếu $n = 0$ thì $\cos(0) = 1 \implies \int_{-1/2}^{+1/2} A^2 dx = A^2 = 1 \implies A = 1$. Còn với mọi số nguyên $n = \pm 1, \pm 2, \pm 3, \dots$ thì kết quả chuẩn là $A = \sqrt{2}$).</span>
        </div>
      </div>
    </div>

    <!-- CÂU 5 BUỔI 2 -->
    <div class="formula-card">
      <h3 id="b2-cau5">Câu 5: Tính Xác suất Tìm thấy Hạt từ Hàm sóng</h3>
      <p><b>Đề bài:</b> Nghiệm của Schrödinger equation trong một trường hợp được cho bởi:
      $$\psi(x) = \sqrt{\frac{2}{a_0}}\,e^{-x/a_0}$$
      Hãy xác định xác suất tìm thấy hạt trong các khoảng:<br>
      a) $0 \le x \le \frac{a_0}{4}$<br>
      b) $\frac{a_0}{4} \le x \le \frac{a_0}{2}$<br>
      c) $0 \le x \le a_0$</p>

      <div class="btn-group">
        <button type="button" class="btn btn-hint" onclick="togglePanel('b2-hint5')">Xem Gợi ý</button>
        <button type="button" class="btn btn-sol" onclick="togglePanel('b2-sol5')">Xem Lời giải chi tiết</button>
      </div>

      <div id="b2-hint5" class="panel">
        <b>Hướng đi & Công thức cần dùng:</b>
        <ul>
          <li><b>Bước 1:</b> Bình phương hàm sóng để tìm hàm mật độ xác suất $|\psi(x)|^2$. Nhớ quy tắc lũy thừa: $\left(e^{-x/a_0}\right)^2 = e^{-2x/a_0}$, nên:
            $$|\psi(x)|^2 = \frac{2}{a_0}\,e^{-2x/a_0}$$
          </li>
          <li><b>Bước 2:</b> Áp dụng công thức nguyên hàm hàm mũ cơ bản: $\int e^{kx}\,dx = \frac{1}{k}e^{kx}$. Do đó, với bất kỳ đoạn $[x_1, x_2]$ nào, xác suất tìm thấy hạt luôn tính gọn thành:
            $$P(x_1 \le x \le x_2) = \int_{x_1}^{x_2} \frac{2}{a_0}e^{-2x/a_0}\,dx = \left[ -e^{-2x/a_0} \right]_{x_1}^{x_2} = e^{-2x_1/a_0} - e^{-2x_2/a_0}$$
          </li>
        </ul>
      </div>

      <div id="b2-sol5" class="panel">
        <b>Lời giải chi tiết từng bước:</b>
        <div class="step">
          <b>Bước mở đầu: Lập công thức tích phân xác suất tổng quát trên đoạn $[x_1, x_2]$:</b>
          <span class="cmt">// Bước 1: Tính hàm mật độ xác suất $|\psi(x)|^2$ bằng cách bình phương hai vế của hàm sóng $\psi(x)$:</span>
          $$|\psi(x)|^2 = \left(\sqrt{\frac{2}{a_0}}\,e^{-x/a_0}\right)^2 = \frac{2}{a_0}\,e^{-2x/a_0}$$
          <span class="cmt">// Bước 2: Tính tích phân của $|\psi(x)|^2$ từ cận dưới $x_1$ đến cận trên $x_2$. Vì đạo hàm của $e^{-2x/a_0}$ theo $x$ là $-\frac{2}{a_0}e^{-2x/a_0}$, nên nguyên hàm của $\frac{2}{a_0}e^{-2x/a_0}$ chính là $-e^{-2x/a_0}$:</span>
          $$P(x_1 \le x \le x_2) = \int_{x_1}^{x_2} \frac{2}{a_0}\,e^{-2x/a_0}\,dx = \Big[ -e^{-2x/a_0} \Big]_{x_1}^{x_2} = e^{-2x_1/a_0} - e^{-2x_2/a_0}$$
        </div>

        <div class="step">
          <b>a) Xác suất tìm thấy hạt trong khoảng $0 \le x \le \frac{a_0}{4}$:</b>
          <span class="cmt">// Thay cận dưới $x_1 = 0$ và cận trên $x_2 = \frac{a_0}{4}$ vào công thức tổng quát vừa tìm được:</span>
          $$P_a = e^{-2(0)/a_0} - e^{-2(a_0/4)/a_0} = e^0 - e^{-1/2} = 1 - e^{-0.5}$$
          <span class="cmt">// Bấm máy tính với $e^{-0.5} \approx 0.6065$:</span>
          $$P_a \approx 1 - 0.6065 = \mathbf{0.3935} \quad (\text{hay } \mathbf{39.35\%})$$
        </div>

        <div class="step">
          <b>b) Xác suất tìm thấy hạt trong khoảng $\frac{a_0}{4} \le x \le \frac{a_0}{2}$:</b>
          <span class="cmt">// Thay cận dưới $x_1 = \frac{a_0}{4}$ và cận trên $x_2 = \frac{a_0}{2}$ vào công thức tổng quát:</span>
          $$P_b = e^{-2(a_0/4)/a_0} - e^{-2(a_0/2)/a_0} = e^{-0.5} - e^{-1}$$
          <span class="cmt">// Bấm máy tính với $e^{-0.5} \approx 0.6065$ và $e^{-1} \approx 0.3679$:</span>
          $$P_b \approx 0.6065 - 0.3679 = \mathbf{0.2386} \quad (\text{hay } \mathbf{23.86\%})$$
        </div>

        <div class="step">
          <b>c) Xác suất tìm thấy hạt trong khoảng $0 \le x \le a_0$:</b>
          <span class="cmt">// Thay cận dưới $x_1 = 0$ và cận trên $x_2 = a_0$ vào công thức tổng quát:</span>
          $$P_c = e^{-2(0)/a_0} - e^{-2(a_0)/a_0} = e^0 - e^{-2} = 1 - e^{-2}$$
          <span class="cmt">// Bấm máy tính với $e^{-2} \approx 0.1353$:</span>
          $$P_c \approx 1 - 0.1353 = \mathbf{0.8647} \quad (\text{hay } \mathbf{86.47\%})$$
        </div>
      </div>
    </div>
  </section>

  <section class="sum">
    <h2>Tổng Kết Buổi 2: Những Điểm Cốt Lõi Cần Nhớ</h2>
    <ul>
      <li><b>Lượng tử ánh sáng & Quang điện:</b> Năng lượng truyền theo từng gói rời rạc $E = h\nu = \frac{hc}{\lambda}$. Động năng cực đại của quang electron là $T_{\text{max}} = h\nu - \Phi$.</li>
      <li><b>Lưỡng tính Sóng - Hạt:</b> Mọi hạt có động lượng $p = mv = \sqrt{2mE}$ đều mang tính sóng với bước sóng de Broglie $\lambda = \frac{h}{p}$.</li>
      <li><b>Nguyên lý Bất định Heisenberg:</b> Không thể đo chính xác đồng thời vị trí và động lượng ($\Delta p \cdot \Delta x \ge \hbar$), cũng như năng lượng và thời gian ($\Delta E \cdot \Delta t \ge \hbar$).</li>
      <li><b>Hàm sóng Schrödinger & Mật độ xác suất:</b> $|\Psi(x,t)|^2 = |\psi(x)|^2$ là mật độ xác suất tìm thấy hạt. Tổng tích phân xác suất trên toàn miền tồn tại của hạt luôn bằng $1$ (Điều kiện chuẩn hóa).</li>
    </ul>

    <p>Ở Buổi 2, chúng ta đã làm quen với <b>Phương trình sóng Schrödinger không phụ thuộc thời gian</b>:
      $$\frac{d^2\psi(x)}{dx^2} + \frac{2m}{\hbar^2}\big[E - V(x)\big]\psi(x) = 0$$

    </p>

    <div class="box analogy">
      <b>Ví dụ ẩn dụ thực tế: Chiếc xe chạy trên mặt băng phẳng lặng vô tận</b><br>

    <h3>1.1. Nghiệm Sóng phẳng, Số sóng $k$ và Vận tốc pha $v_p$</h3>
    <p>Khi thay $V(x) = 0$ vào phương trình Schrödinger, ta được phương trình dao động điều hòa quen thuộc:</p>
    <div class="f">
      $$\frac{d^2\psi(x)}{dx^2} + k^2\psi(x) = 0 \qquad \text{với } \mathbf{k = \frac{\sqrt{2mE}}{\hbar}} \text{ gọi là Số sóng (Wave number)}$$
    </div>
    <p>Khi ghép thêm phần thời gian $e^{-j\omega t}$, nghiệm tổng quát của hạt tự do là sự chồng chập của hai sóng phẳng chạy ngược chiều nhau:</p>
    <div class="f">
      $$\Psi(x,t) = A\,e^{j(kx - \omega t)} + B\,e^{-j(kx + \omega t)}$$
      <small>Trong đó: Số hạng $A\,e^{j(kx - \omega t)}$ là sóng truyền theo chiều $+x$ (khi $k>0$); số hạng $B\,e^{-j(kx + \omega t)}$ (hoặc khi $k < 0$) là sóng truyền ngược lại theo chiều $-x$.</small>
    </div>

    <ul>
      <li><b>Liên hệ giữa Số sóng $k$, Bước sóng $\lambda$ và Động lượng $p$:</b> Từ công thức de Broglie $\lambda = \frac{h}{p}$ và $E = \frac{p^2}{2m} = \frac{\hbar^2 k^2}{2m}$, ta rút ra cặp công thức cực kỳ quan trọng:
        $$\mathbf{p = \hbar k} \qquad \text{và} \qquad \mathbf{\lambda = \frac{2\pi}{|k|}}$$

      <li><b>Vận tốc pha (Phase Velocity - $v_p$):</b> Là tốc độ di chuyển của một đỉnh sóng (nơi pha sóng $kx - \omega t = \text{const}$):
