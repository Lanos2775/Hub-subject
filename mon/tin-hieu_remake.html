# BÀI 1 (BẢN ĐẦY ĐỦ): HỆ THỐNG VÀ 5 TÍNH CHẤT — DẠY TỪ GỐC

[SECTION: bai1-overview]

[H2] Bài 1. Hệ thống là gì? Và 5 tính chất phải kiểm tra

---

## Phần A. Động cơ — Tại sao phải học 5 tính chất này?

[BRIDGE] Trước khi vào định nghĩa, tôi kể cho bạn một câu chuyện. Bạn có một hộp đen, bên trong là một mạch điện. Bạn không được mở hộp ra. Bạn chỉ được phép đưa tín hiệu vào và đo tín hiệu ra. Câu hỏi: **Bạn có thể biết hộp đen đó làm gì không?**

[P] Câu trả lời phụ thuộc vào việc hộp đen có những tính chất nào. Cụ thể:

- Nếu hộp đen **tuyến tính** và **bất biến theo thời gian** (gọi tắt là **LTI**), thì bạn có thể mô tả toàn bộ hộp đen chỉ bằng **một hàm duy nhất** — đáp ứng xung $h(t)$. Từ $h(t)$ đó, bạn tính được đầu ra cho **mọi** đầu vào bằng phép tích chập. Đây là nội dung Chương 2.

- Nếu hộp đen LTI, bạn còn có thể chuyển sang **miền tần số**, dùng Fourier để phân tích, lọc nhiễu, nén ảnh, truyền thông. Đây là Chương 3.

- Nếu hộp đen **nhân quả**, bạn có thể xây dựng nó trong thực tế (vì hệ thống thực không thể phản ứng trước khi có kích thích).

- Nếu hộp đen **ổn định**, bạn có thể yên tâm rằng nó không "nổ" khi gặp tín hiệu lạ.

- Nếu hộp đen **không nhớ**, bạn có thể xây nó bằng một mạch tổ hợp đơn giản, không cần lưu trữ gì.

[FIG: 1.1] Mô hình hộp đen của một hệ thống. Tín hiệu vào $x(t)$ đi qua hệ thống $H$ (đặc trưng bởi đáp ứng xung $h(t)$ hoặc đáp ứng tần số $H(\omega)$) để tạo ra tín hiệu ra $y(t)$.
[BOX: analogy] **Ẩn dụ**: 5 tính chất này giống 5 "giấy chứng nhận" của một hệ thống. Mỗi giấy cho phép bạn dùng một loại "công cụ" khác nhau để phân tích hệ thống. Không có giấy LTI, bạn không được dùng tích chập. Không có giấy nhân quả, bạn không được xây hệ thống thời gian thực. Vì vậy, trước khi phân tích bất cứ hệ thống nào, việc đầu tiên là kiểm tra nó có những giấy nào.

[P] Trong đề thi, người ta cho bạn một biểu thức quan hệ vào–ra (ví dụ $y(t) = |x(t-1)|$) và hỏi: "Hệ thống này có tuyến tính không? Bất biến không? Nhân quả không?" — đó chính là bài kiểm tra 5 tính chất. Bài này sẽ dạy bạn cách kiểm tra từng cái một, từ gốc.

---

## Phần B. Tính chất 1 — Tuyến tính (Linear)

### B.1. Trực giác trước đã

[P] Hãy tưởng tượng bạn có một **bộ khuếch đại âm thanh**. Bạn hát một nốt nhạc nhỏ, loa phát ra tiếng vừa. Bạn hát **to gấp đôi**, loa cũng phát ra **to gấp đôi**. Bạn hát **hai nốt cùng lúc**, loa phát ra **đúng tổng hai nốt đã khuếch đại**. Đó chính là tính tuyến tính: hệ thống không "sáng tạo" ra cái gì mới, chỉ phóng to hoặc thu nhỏ tín hiệu lên theo một tỉ lệ, và hai tín hiệu cộng lại thì đầu ra cũng cộng lại.

[P] Ngược lại, hãy tưởng tượng bạn hát một nốt, đầu ra méo tiếng; hát to gấp đôi, đầu ra không to gấp đôi mà biến thành tiếng rè rè. Đó là hệ thống phi tuyến. Bộ khuếch đại thực tế thường phi tuyến ở biên độ lớn (gọi là méo hài), đó là lý do người ta chế tạo các bộ khuếch đại "linear" đắt tiền.

[BOX: analogy] **Tóm gọn**: Tuyến tính = hệ thống **không bịa** ra tần số mới. Nó chỉ phóng đại hoặc thu nhỏ tín hiệu có sẵn, và cộng dồn các đóng góp. Nếu bạn đưa một tín hiệu gồm tần số 100 Hz, hệ thống tuyến tính chỉ cho ra tín hiệu cũng gồm tần số 100 Hz (có thể khác biên độ, khác pha). Nếu hệ thống phi tuyến, nó sinh ra cả tần số 200 Hz, 300 Hz, v.v. — gọi là hài (harmonic).
[FIG: 1.2] Minh họa tính xếp chồng. Dù cộng tín hiệu trước rồi mới qua hệ thống, hay cho từng tín hiệu qua hệ thống rồi mới cộng, kết quả vẫn như nhau.

### B.2. Định nghĩa chính xác

[P] Hệ thống $T$ là **tuyến tính** nếu với **mọi** tín hiệu vào $x_1, x_2$ và **mọi** hằng số $a, b$:
[FORMULA: key]
$$T\{a\,x_1 + b\,x_2\} = a\,T\{x_1\} + b\,T\{x_2\}$$
[/FORMULA]

[P] Công thức này gộp **hai** tính chất nhỏ lại:
- **Tính đồng nhất** (homogeneity): $T\{a\,x\} = a\,T\{x\}$ — gấp đôi đầu vào thì gấp đôi đầu ra.
- **Tính xếp chồng** (superposition): $T\{x_1 + x_2\} = T\{x_1\} + T\{x_2\}$ — cộng hai đầu vào thì đầu ra bằng tổng hai đầu ra riêng.

[BOX: warn] **Cả hai đều bắt buộc**. Có những hệ thống vi phạm một trong hai. Ví dụ hệ thống $y = x + 1$ vi phạm **cả hai** (vì $2x+1 \neq 2(x+1)$ và $(x_1+x_2)+1 \neq (x_1+1)+(x_2+1)$). Ví dụ hệ thống $y = 2x$ thỏa **cả hai** → tuyến tính.

### B.3. Phương pháp kiểm tra — 3 bước

[STEPS]
1. **Bước 1 — Tính vế trái**: Thay tín hiệu vào $x(t) = a\,x_1(t) + b\,x_2(t)$ vào biểu thức của hệ thống, được $T\{a\,x_1 + b\,x_2\}$.
2. **Bước 2 — Tính vế phải**: Tính $T\{x_1\}$ và $T\{x_2\}$ riêng rẽ, sau đó nhân với $a$, $b$ rồi cộng lại: $a\,T\{x_1\} + b\,T\{x_2\}$.
3. **Bước 3 — So sánh**: Nếu hai vế **bằng nhau với mọi** $x_1, x_2, a, b$ → tuyến tính. Nếu **khác nhau ở ít nhất một trường hợp** → không tuyến tính.
[/STEPS]

[BOX: warn] **Mẹo thi**: Khi cần chứng minh **không tuyến tính**, bạn không cần làm 3 bước đầy đủ. Chỉ cần **chọn một phản ví dụ** — một cặp $x_1, x_2$ và một cặp $a, b$ cụ thể — mà hai vế khác nhau. Phản ví dụ thường dùng: $x_1 = x_2 = 1$, $a = b = 1$; hoặc $x_1 = 1, x_2 = -1$, $a=b=1$. Với những giá trị này, tính nhanh thường đủ phát hiện phi tuyến.

### B.4. Ví dụ chi tiết — Phân loại dần từ dễ đến khó

[P] **Ví dụ 1: $y(t) = 3x(t)$ — tuyến tính**

Đây là phép nhân hằng số. Kiểm tra đầy đủ:
- Vế trái: $T\{a x_1 + b x_2\} = 3(a x_1 + b x_2) = 3a x_1 + 3b x_2$.
- Vế phải: $aT\{x_1\} + bT\{x_2\} = a(3x_1) + b(3x_2) = 3a x_1 + 3b x_2$.
- Bằng nhau → **tuyến tính**.

Trực giác: gấp đôi đầu vào, đầu ra gấp đôi; cộng hai đầu vào, đầu ra cộng hai đóng góp. Không bịa ra gì mới.

[P] **Ví dụ 2: $y(t) = t\cdot x(t)$ — tuyến tính**

- Vế trái: $T\{a x_1 + b x_2\} = t(a x_1 + b x_2) = a t x_1 + b t x_2$.
- Vế phải: $aT\{x_1\} + bT\{x_2\} = a(tx_1) + b(tx_2) = a t x_1 + b t x_2$.
- Bằng nhau → **tuyến tính**.

[BOX: analogy] **Trực giác về $t\cdot x(t)$**: Hệ số $t$ thay đổi theo thời gian, nhưng với **mỗi thời điểm $t$ cố định**, hệ số đó chỉ là một hằng số nhân với $x(t)$. Vì vậy theo biến $x$, hệ thống vẫn tuyến tính. (Lưu ý: nó tuyến tính nhưng **không bất biến** — vì hệ số $t$ thay đổi theo thời gian. Hai tính chất độc lập!)

[P] **Ví dụ 3: $y(t) = 3x(t) + 2$ — KHÔNG tuyến tính**

- Vế trái: $T\{a x_1 + b x_2\} = 3(a x_1 + b x_2) + 2 = 3a x_1 + 3b x_2 + 2$.
- Vế phải: $a(3x_1+2) + b(3x_2+2) = 3a x_1 + 3b x_2 + 2a + 2b$.
- So sánh hằng số: vế trái có $+2$, vế phải có $+2(a+b)$. Với $a=b=1$: $2 \neq 4$ → **không tuyến tính**.

[BOX: warn] **Bài học đau thương**: Chỉ một hằng số cộng thêm ($+2$) là đủ phá vỡ tuyến tính. Trong đề thi, dạng này xuất hiện rất nhiều. Nếu thấy biểu thức có số hạng tự do (không đi kèm $x$), hệ thống **chắc chắn không tuyến tính**. Nhớ: tuyến tính = "đầu ra tỉ lệ với đầu vào, không có offset".

[P] **Ví dụ 4: $y(t) = x^2(t)$ — KHÔNG tuyến tính**

- Vế trái: $T\{a x_1 + b x_2\} = (a x_1 + b x_2)^2 = a^2 x_1^2 + 2ab x_1 x_2 + b^2 x_2^2$.
- Vế phải: $a x_1^2 + b x_2^2$.
- So sánh: vế trái có $a^2$ (không phải $a$), có $2ab x_1 x_2$ — vế phải không có. Với $a=2, b=1$: vế trái có $4x_1^2$, vế phải có $2x_1^2$ → khác → **không tuyến tính**.

Trực giác: bình phương là phép phi tuyến. Nếu $x=1$ cho ra $y=1$, $x=2$ cho ra $y=4$ (không phải $y=2$). Đầu ra **không tỉ lệ** với đầu vào.

[P] **Ví dụ 5: $y(t) = |x(t)|$ — KHÔNG tuyến tính**

Lấy phản ví dụ: $x_1 = 1, x_2 = -1, a = b = 1$.
- Vế trái: $T\{1 + (-1)\} = |0| = 0$.
- Vế phải: $T\{1\} + T\{-1\} = |1| + |-1| = 2$.
- $0 \neq 2$ → **không tuyến tính**.

Trực giác: trị tuyệt đối "bẻ cong" đồ thị tại gốc. Hai tín hiệu trái dấu triệt tiêu nhau trước khi qua hệ thống sẽ cho kết quả khác hai tín hiệu đi qua hệ thống riêng rồi cộng lại — vì phép trị tuyệt đối không phân biệt dấu.

[P] **Ví dụ 6: $y(t) = \sin(x(t))$ — KHÔNG tuyến tính**

Lấy phản ví dụ $x_1 = 0, x_2 = \pi/2, a = b = 1$:
- Vế trái: $\sin(\pi/2) = 1$.
- Vế phải: $\sin 0 + \sin(\pi/2) = 0 + 1 = 1$. Bằng nhau — chưa kết luận được.

Thử cặp khác: $x_1 = \pi/2, x_2 = \pi/2, a = b = 1$:
- Vế trái: $\sin(\pi/2 + \pi/2) = \sin(\pi) = 0$.
- Vế phải: $\sin(\pi/2) + \sin(\pi/2) = 2$.
- $0 \neq 2$ → **không tuyến tính**.

[BOX: analogy] **Về phép thử với sin/log/căn**: Khi hàm phi tuyến có tính "bẻ cong", bạn cần chọn phản ví dụ khéo. Nguyên tắc: chọn $x_1, x_2$ sao cho $f(x_1+x_2)$ khác rõ rệt $f(x_1)+f(x_2)$. Với $\sin$, chọn $x_1, x_2$ cộng lại bằng $\pi$ hoặc $\pi/2$ sẽ dễ thấy. Với log, chọn $x_1 = x_2 = 1$: $\log 2 \neq \log 1 + \log 1 = 0$.

[P] **Ví dụ 7: $y(t) = x(t)\cdot\cos(t)$ — tuyến tính**

- Vế trái: $T\{a x_1 + b x_2\} = (a x_1 + b x_2)\cos(t) = a x_1\cos t + b x_2\cos t$.
- Vế phải: $a x_1\cos t + b x_2\cos t$.
- Bằng nhau → **tuyến tính**.

[BOX: warn] **Phân biệt**: $x(t)\cdot\cos(t)$ (tuyến tính theo $x$) KHÁC với $\cos(x(t))$ (phi tuyến vì $\cos$ ăn vào $x$). Trong biểu thức thứ nhất, $\cos$ chỉ là hệ số phụ thuộc thời gian, không phải hàm của $x$. Trong biểu thức thứ hai, $\cos$ là hàm bọc $x$, nó bẻ cong quan hệ vào–ra. Đây là bẫy thi rất hay gặp.

[P] **Ví dụ 8: $y(t) = x(t)\cdot x(t-1)$ — KHÔNG tuyến tính**

Lấy $x_1 = 1$ (hằng số 1 với mọi $t$), $x_2 = 1$, $a = b = 1$ — không thấy khác biệt. Thử khác: $x_1(t) = 1$ với mọi $t$, $x_2(t) = 1$ với mọi $t$, nhưng cần $a, b$ khác 1. Lấy $a = 2, b = 0$, $x_1 = 1$:
- Vế trái: $T\{2\cdot1\} = 2\cdot2 = 4$.
- Vế phải: $2\cdot T\{1\} = 2\cdot(1\cdot1) = 2$.
- $4 \neq 2$ → **không tuyến tính**.

Trực giác: nhân hai tín hiệu với nhau luôn phi tuyến (vì bình phương ẩn bên trong khi $x_1 = x_2$). Đây là lý do các bộ trộn tần số (mixer) trong viễn thông là **linh kiện phi tuyến** — chúng cố tình nhân hai tín hiệu để tạo ra tần số mới.

### B.5. Bảng tổng hợp nhanh — Dấu hiệu tuyến tính / phi tuyến

[TABLE]
| Loại biểu thức | Tuyến tính? | Ví dụ |
|---|---|---|
| $a\cdot x(t)$ (nhân hằng) | ✓ | $y = 5x$, $y = -2x$ |
| $g(t)\cdot x(t)$ (nhân hệ số phụ thuộc $t$) | ✓ | $y = t^2 x$, $y = e^{-|t|}x$ |
| $x(t) + x(t-1) + \dots$ (tổng có trọng số) | ✓ | $y = x(t) + 2x(t-1)$ |
| $\int x(\tau)h(t-\tau)d\tau$ (tích chập) | ✓ | mọi hệ LTI |
| $x(t) + C$ (có hằng số cộng) | ✗ | $y = 3x + 2$ |
| $x^2(t)$, $x^3(t)$, $|x(t)|$, $\sqrt{x(t)}$ | ✗ | $y = x^2$ |
| $\sin(x)$, $\cos(x)$, $\log(x)$, $e^{x}$ | ✗ | $y = \sin x$ |
| $x_1(t)\cdot x_2(t)$ (nhân hai tín hiệu) | ✗ | $y = x(t)x(t-1)$ |
[/TABLE]

## Phần C. Tính chất 2 — Bất biến theo thời gian (Time-Invariant)

### C.1. Trực giác trước đã

[P] Bạn có một cái máy pha cà phê. Sáng nay bạn bỏ 10g cà phê, máy cho ra 1 tách. Ngày mai cũng bỏ 10g cà phê, máy cho ra 1 tách y hệt. Máy đó **bất biến theo thời gian**. Nhưng nếu máy bị hỏng và bắt đầu pha loãng dần theo thời gian (do van cao su lão hóa), thì cùng 10g cà phê, hôm nay ra 1 tách đậm, tháng sau ra 1 tách loãng — máy đó **không bất biến**.

[P] Trong tín hiệu, "bất biến" có nghĩa là **hành vi của hệ thống không phụ thuộc vào thời điểm bạn áp tín hiệu**. Đưa cùng một tín hiệu vào ở $t=0$ hay ở $t=100$, hệ thống phản ứng y hệt (chỉ khác thời điểm phản ứng).

[BOX: analogy] **Tóm gọn**: Bất biến = hệ thống **không có đồng hồ bên trong**. Nó không biết "bây giờ là mấy giờ", nên hành vi không thay đổi theo thời gian. Bất kỳ hệ số nào phụ thuộc $t$ (như $t$, $t^2$, $e^{-|t|}$, $\cos t$, $u(t)$…) đều khiến hệ thống **không bất biến**, vì hệ số đó thay đổi theo thời điểm.

### C.2. Định nghĩa chính xác

[P] Hệ thống là **bất biến** nếu:
[FORMULA: key]
$$\text{Nếu } x(t) \to y(t) \quad\text{thì}\quad x(t - t_0) \to y(t - t_0) \quad \forall t_0$$
[/FORMULA]

[P] Nghĩa là: bạn **trễ** tín hiệu vào đi $t_0$ giây, thì tín hiệu ra cũng **trễ** đúng $t_0$ giây. Hình dạng đầu ra không đổi, chỉ bị đẩy lùi về sau.

### C.3. Phương pháp kiểm tra — 3 bước

[STEPS]
1. **Bước 1 — Đầu ra khi vào dịch**: Cho đầu vào là $x(t - t_0)$, tính $T\{x(t - t_0)\}$. Cụ thể: lấy biểu thức gốc của $y$, thay $x(t)$ bằng $x(t - t_0)$.
2. **Bước 2 — Đầu ra gốc rồi dịch**: Tính $y(t) = T\{x(t)\}$. Sau đó **thay $t$ bằng $t - t_0$ ở mọi chỗ xuất hiện $t$** trong biểu thức của $y$. Kể cả các hệ số như $t^2$, $e^{-|t|}$, $\cos(t)$ — phải thay hết.
3. **Bước 3 — So sánh**: Nếu $T\{x(t - t_0)\} = y(t - t_0)$ với **mọi** $x, t_0$ → bất biến. Nếu khác → không bất biến.
[/STEPS]

[BOX: warn] **Bẫy lớn nhất của cả bài**: Nhiều bạn chỉ thay $x(t) \to x(t - t_0)$ mà **quên thay hệ số phụ thuộc $t$**. Ví dụ với $y(t) = t^2 x(t)$:
- **Đúng**: $T\{x(t-t_0)\} = t^2 x(t-t_0)$. Còn $y(t-t_0) = (t-t_0)^2 x(t-t_0)$. Khác nhau vì $t^2 \neq (t-t_0)^2$ → không bất biến.
- **Sai (bẫy)**: Nhiều bạn viết $y(t-t_0) = t^2 x(t-t_0)$ (quên thay $t^2$) rồi kết luận bất biến. Đây là lỗi mất điểm phổ biến nhất.

**Quy tắc vàng**: Khi thay $t \to t - t_0$, hãy **quét toàn bộ biểu thức**, gạch chân **mọi chữ $t$** trước khi thay. Sau khi thay xong mới so sánh.

### C.4. Ví dụ chi tiết

[P] **Ví dụ 1: $y(t) = 3x(t-1)$ — bất biến**

- Bước 1: $T\{x(t-t_0)\} = 3x(t-t_0-1)$.
- Bước 2: $y(t) = 3x(t-1)$; thay $t \to t - t_0$: $y(t-t_0) = 3x(t-t_0-1)$.
- Bằng nhau → **bất biến**.

Trực giác: hệ thống chỉ là "trễ 1 giây rồi nhân 3". Trễ thêm $t_0$ ở đầu vào → đầu ra cũng trễ thêm $t_0$. Hình dạng không đổi.

[P] **Ví dụ 2: $y(t) = t^2 x(t)$ — KHÔNG bất biến**

- Bước 1: $T\{x(t-t_0)\} = t^2 x(t-t_0)$.
- Bước 2: $y(t-t_0) = (t-t_0)^2 x(t-t_0)$.
- So sánh: $t^2$ vs $(t-t_0)^2$ → khác khi $t_0 \neq 0$ → **không bất biến**.

Trực giác: hệ số $t^2$ phụ thuộc thời gian. Đầu vào đến ở $t=1$ được nhân $1$; đầu vào đến ở $t=2$ được nhân $4$. Cùng một tín hiệu nhưng đến ở thời điểm khác nhau, đầu ra khác nhau → không bất biến.

[P] **Ví dụ 3: $y(t) = x(2t)$ — KHÔNG bất biến**

Đây là ví dụ tinh tế. Nhiều bạn nhầm vì hệ số $2$ là hằng số.

- Bước 1: $T\{x(t-t_0)\} = x(2(t-t_0)) = x(2t - 2t_0)$.
- Bước 2: $y(t) = x(2t)$; thay $t \to t - t_0$: $y(t-t_0) = x(2(t-t_0)) = x(2t - 2t_0)$.

Ơ, bằng nhau?! Đợi đã, tôi tính lại. Thực ra cả hai đều là $x(2t - 2t_0)$ — vậy là **bất biến**?

[BOX: warn] **Cẩn thận — tôi vừa suýt sai**: Hệ thống $y(t) = x(2t)$ thực ra **KHÔNG** bất biến, nhưng phép tính trên lại cho bằng nhau. Lý do là vì tôi đã làm đúng phép thử nhưng kết quả sai vì... nhầm. Hãy làm lại thật cẩn thận:

[P] **Ví dụ 3 (làm lại): $y(t) = x(2t)$ — KHÔNG bất biến**

Cách kiểm tra **đúng** là: cho đầu vào $x_1(t) = x(t - t_0)$ (tức là dịch $x$ đi $t_0$ **trước khi** vào hệ thống), rồi tính đầu ra. Đầu ra phải là $y_1(t) = x_1(2t) = x(2t - t_0)$.

So sánh với $y(t - t_0)$ — đầu ra gốc bị dịch đi $t_0$: $y(t) = x(2t)$, thay $t \to t - t_0$: $y(t-t_0) = x(2(t-t_0)) = x(2t - 2t_0)$.

So sánh: $x(2t - t_0)$ vs $x(2t - 2t_0)$. Khác nhau ($t_0 \neq 2t_0$ khi $t_0 \neq 0$) → **không bất biến**.

[BOX: analogy] **Tại sao $x(2t)$ không bất biến — trực giác**: Hệ thống này "nén thời gian gấp đôi". Tín hiệu gốc dài 1 giây, qua hệ thống còn 0.5 giây. Nếu bạn trễ tín hiệu vào đi 1 giây, hệ thống vẫn nén gấp đôi — nhưng vì đã nén, độ trễ 1 giây ở đầu vào trở thành độ trễ 0.5 giây ở đầu ra! Cụ thể: đưa xung vào ở $t=1$, qua hệ thống thấy xung ở $t=0.5$. Đưa xung vào ở $t=2$, qua hệ thống thấy ở $t=1$. Vậy độ trễ **không được bảo toàn** — đó là dấu hiệu không bất biến.

[BOX: warn] **Quy tắc vàng cho phép co giãn thời gian**: Nếu biểu thức có **thay đổi tốc độ thời gian** (như $x(2t)$, $x(t/2)$, $x(-t)$, $x(at+b)$ với $a \neq 1$), hệ thống **hầu như chắc chắn không bất biến** — vì phép co giãn thời gian làm thay đổi độ trễ tương đối. Chỉ có $x(t - t_0)$ thuần túy (không co giãn) mới bất biến.

[P] **Ví dụ 4: $y(t) = x(t)\cdot\cos(t)$ — KHÔNG bất biến**

- Bước 1: $T\{x(t-t_0)\} = x(t-t_0)\cos(t)$.
- Bước 2: $y(t-t_0) = x(t-t_0)\cos(t-t_0)$.
- So sánh: $\cos(t)$ vs $\cos(t-t_0)$ → khác → **không bất biến**.

Trực giác: hệ số $\cos(t)$ thay đổi theo thời gian. Cùng một tín hiệu, nhân với $\cos$ ở các thời điểm khác nhau cho kết quả khác nhau.

[P] **Ví dụ 5: $y(t) = x^2(t)$ — bất biến**

- Bước 1: $T\{x(t-t_0)\} = [x(t-t_0)]^2$.
- Bước 2: $y(t-t_0) = [x(t-t_0)]^2$.
- Bằng nhau → **bất biến**.

Dù không tuyến tính, nhưng vẫn bất biến — vì phép bình phương không phụ thuộc thời gian. Hai tính chất độc lập, đừng nhầm!

[P] **Ví dụ 6: $y(t) = x(t)\cdot u(t)$ — KHÔNG bất biến**

- Bước 1: $T\{x(t-t_0)\} = x(t-t_0)\cdot u(t)$.
- Bước 2: $y(t-t_0) = x(t-t_0)\cdot u(t-t_0)$.
- So sánh: $u(t)$ vs $u(t-t_0)$ → khác → **không bất biến**.

Trực giác: $u(t)$ là "công tắc bật ở $t=0$". Hệ thống chỉ hoạt động từ $t=0$ trở đi, trước đó bằng 0. Đó là hành vi **có mốc thời gian** — không bất biến.

### C.5. Bảng tổng hợp nhanh

[TABLE]
| Loại biểu thức | Bất biến? | Ví dụ |
|---|---|---|
| $x(t - t_0)$ (chỉ trễ, không co giãn) | ✓ | $y = x(t-1)$, $y = 3x(t-2)$ |
| $a\cdot x(t)$ (nhân hằng số) | ✓ | $y = 5x$, $y = -2x$ |
| $x^2(t)$, $\sin(x(t))$, $|x(t)|$ (hàm phi tuyến của $x$) | ✓ | $y = x^2$ |
| $g(t)\cdot x(t)$ với $g$ phụ thuộc $t$ | ✗ | $y = t\cdot x$, $y = e^{-|t|}x$ |
| $x(at + b)$ với $a \neq 1$ (co giãn/lật) | ✗ | $y = x(2t)$, $y = x(-t)$, $y = x(1-t)$ |
| $x(t)\cdot u(t)$ (có mốc thời gian) | ✗ | $y = x(t)u(t)$ |
| Tổng với cận phụ thuộc $n$ | ✗ | $y[n] = \sum_{k=-1}^{n}x[k]$ |
[/TABLE]

## Phần D. Tính chất 3 — Nhân quả (Causal)

### D.1. Trực giác trước đã

[P] Hãy tưởng tượng bạn đang xem một trận bóng đá **truyền hình trực tiếp**. Bình luận viên chỉ có thể bình luận những gì **đã xảy ra** — anh ta không thể biết trước cầu thủ sẽ sút hay chuyền. Đó là **nhân quả**: đầu ra chỉ phụ thuộc quá khứ và hiện tại.

[P] Ngược lại, nếu bạn xem lại trận đấu **đã ghi hình**, bạn có thể "tua nhanh" để xem pha bóng sắp tới — đó là **phi nhân quả**. Trong xử lý tín hiệu, hệ thống phi nhân quả rất hữu ích khi xử lý offline (ví dụ lọc ảnh đã chụp), nhưng không thể xây dựng trong thực tế thời gian thực (vì không ai biết tương lai).

[BOX: analogy] **Tóm gọn**: Nhân quả = hệ thống **không nhìn trộm tương lai**. Nó chỉ phản ứng với những gì đã xảy ra. Nếu biểu thức có chứa $x(t+1)$ (tương lai của $t$), $x(-t)$ với $t>0$ (tương lai lật ngược), $x(n+2)$… thì hệ thống phi nhân quả.

### D.2. Định nghĩa chính xác

[P] Hệ thống là **nhân quả** nếu đầu ra tại **mọi** thời điểm $t$ chỉ phụ thuộc vào đầu vào tại các thời điểm $\tau \leq t$:
$$y(t_0) \text{ chỉ phụ thuộc } x(\tau) \text{ với } \tau \leq t_0$$

[P] Nói cách khác: không có "tương lai" trong công thức tính $y(t)$.

### D.3. Phương pháp kiểm tra — 1 bước

[STEPS]
1. Nhìn vào biểu thức của $y(t)$ (hoặc $y[n]$). Xác định **tất cả** các chỉ số thời gian của $x$. Nếu **mọi** chỉ số đều $\leq t$ (hoặc $\leq n$) → nhân quả. Nếu **có ít nhất một** chỉ số $> t$ (hoặc $> n$) → **phi nhân quả**.
[/STEPS]

[BOX: warn] **Cẩn thận với chỉ số âm**: Đừng nhầm "chỉ số âm" với "tương lai". Chỉ số âm có thể là quá khứ hoặc tương lai, tùy vào biến độc lập. Ví dụ:
- $x(t-1)$: chỉ số $t-1 \leq t$ → quá khứ → **nhân quả**.
- $x(-t)$: với $t > 0$, $-t < 0 < t$ → quá khứ → nhân quả **tại thời điểm đó**; nhưng với $t < 0$, $-t > 0 > t$ → tương lai → **phi nhân quả tổng thể**.
- $x(1-t)$: tại $t = 0$, chỉ số $1 > 0$ → tương lai → **phi nhân quả**.
- $x(-|n|)$: với $n \geq 0$, chỉ số $-n \leq 0 \leq n$ → quá khứ; với $n < 0$, chỉ số $n \leq n$ → hiện tại → **nhân quả** (xét tổng thể).

[BOX: analogy] **Mẹo nhớ**: Vẽ trục thời gian, đánh dấu điểm $t$. Nếu chỉ số của $x$ **nằm bên trái** hoặc **trùng** $t$ → OK. Nếu **nằm bên phải** → phi nhân quả. Với biểu thức phức tạp như $-|n|$, hãy xét **từng khoảng** của $n$ (dương/âm) để chắc chắn.

### D.4. Ví dụ chi tiết

[P] **Ví dụ 1: $y(t) = x(t-1) + x(t-2)$ — nhân quả**

Chỉ số $-1, -2$ đều $\leq 0$ → nhân quả. Trực giác: chỉ dùng quá khứ.

[P] **Ví dụ 2: $y(t) = x(t+3)$ — phi nhân quả**

Chỉ số $+3 > 0$ → phi nhân quả. Cần biết tương lai 3 giây để tính $y(t)$ — không thể xây dựng thời gian thực.

[P] **Ví dụ 3: $y[n] = x[-n]$ — phi nhân quả**

Xét hai trường hợp:
- $n > 0$: chỉ số $-n < 0 < n$ → quá khứ → OK.
- $n < 0$: chỉ số $-n > 0 > n$ → tương lai → **phi nhân quả** (tổng thể).

Vì có ít nhất một trường hợp vi phạm → hệ thống phi nhân quả.

[P] **Ví dụ 4: $y(t) = x(1-t)$ — phi nhân quả**

Tại $t = 0$: chỉ số $1 - 0 = 1 > 0$ → tương lai → **phi nhân quả**.

Trực giác: hệ thống này lật thời gian và trễ 1 giây. Nó "trả ngược" tín hiệu → phải biết tương lai.

[P] **Ví dụ 5: $y(t) = x(t)\cdot\cos(t)$ — nhân quả**

Chỉ số của $x$ là $t$ → hiện tại → nhân quả. (Hệ số $\cos(t)$ không ảnh hưởng đến tính nhân quả — nó chỉ phụ thuộc $t$, không phụ thuộc $x$.)

[P] **Ví dụ 6: $y[n] = \sum_{k=-1}^{n}x[k]$ — nhân quả**

Tổng từ $k = -1$ đến $k = n$. Cận trên là $n$ — chỉ dùng $x$ từ quá khứ đến hiện tại → **nhân quả**.

[P] **Ví dụ 7: $y[n] = \sum_{k=-n-4}^{n+4}x[k]$ — phi nhân quả**

Cận trên $n+4 > n$ → dùng tương lai 4 mẫu → **phi nhân quả**.

## Phần E. Tính chất 4 — Không nhớ (Memoryless)

### E.1. Trực giác trước đã

[P] Bạn có một cái **gương**. Bạn đứng trước gương, gương phản chiếu **ngay lập tức** hình ảnh hiện tại của bạn. Không cần nhớ bạn trông thế nào 1 giây trước. Gương là hệ thống **không nhớ**.

[P] Ngược lại, một **máy ảnh phơi sáng lâu** (long-exposure) ghi lại ảnh trong 10 giây, các vệt sáng của vật chuyển động chồng lên nhau. Máy ảnh này phải "nhớ" những gì đã xảy ra trong 10 giây qua → hệ thống **có nhớ**.

[BOX: analogy] **Tóm gọn**: Không nhớ = đầu ra tại $t$ **chỉ phụ thuộc đầu vào tại đúng $t$**. Không dùng bất kỳ thông tin nào từ quá khứ hay tương lai. Đây là hệ thống "sống ở hiện tại".

### E.2. Định nghĩa chính xác

[P] Hệ thống là **không nhớ** nếu:
$$y(t) \text{ chỉ phụ thuộc } x(t) \quad \text{(tại đúng thời điểm } t\text{)}$$

[P] Tức là có thể viết $y(t) = f(x(t))$ với $f$ là hàm bất kỳ (tuyến tính hay phi tuyến đều được).

[BOX: warn] **Phân biệt "không nhớ" và "nhân quả"** — đây là câu hỏi lý thuyết hay thi:
- **Không nhớ ⇒ nhân quả**: Vì không dùng quá khứ lẫn tương lai, đương nhiên không dùng tương lai → nhân quả.
- **Nhân quả ⇏ không nhớ**: Hệ thống có thể dùng quá khứ (như $x(t-1)$) — vẫn nhân quả nhưng có nhớ.
- Ví dụ: $y(t) = x(t-1)$ là **nhân quả nhưng có nhớ** (không nhớ thì không đúng).

[P] **Cách nhớ**: Nhân quả là "không nhìn tương lai". Không nhớ là "không nhìn quá khứ lẫn tương lai" — mạnh hơn. Vậy không nhớ ⊂ nhân quả.

### E.3. Phương pháp kiểm tra — 1 bước

[STEPS]
1. Nhìn vào biểu thức: nếu $x$ chỉ xuất hiện dưới dạng $x(t)$ (hoặc $x[n]$) — **cùng chỉ số với $y$** — thì không nhớ. Nếu $x$ xuất hiện với chỉ số khác ($x(t-1)$, $x(t+2)$, $x(-t)$…) → có nhớ.
[/STEPS]

### E.4. Ví dụ chi tiết

[P] **Ví dụ 1: $y(t) = 3x(t) + 2$ — không nhớ**

Chỉ dùng $x(t)$ → không nhớ. (Dù không tuyến tính vì có $+2$, nhưng vẫn không nhớ.)

[P] **Ví dụ 2: $y(t) = x(t-1)$ — có nhớ**

Dùng $x(t-1)$ — quá khứ → có nhớ.

[P] **Ví dụ 3: $y(t) = x(t) + x(t-1)$ — có nhớ**

Có $x(t-1)$ → có nhớ.

[P] **Ví dụ 4: $y(t) = x(t)\cdot\cos(t)$ — không nhớ**

Chỉ dùng $x(t)$ (hệ số $\cos$ không phải là $x$) → không nhớ.

[P] **Ví dụ 5: $y[n] = 2^{-n}x[n-1]$ — có nhớ**

Dùng $x[n-1]$ → có nhớ. (Dù nhân quả, nhưng vẫn có nhớ.)

[P] **Ví dụ 6: $y[n] = x[-|n|]$ — có nhớ**

Với $n > 0$, chỉ số $-n \neq n$ → có nhớ.

---

## Phần F. Tính chất 5 — Ổn định BIBO (Bounded-Input Bounded-Output)

### F.1. Trực giác trước đã

[P] Bạn có một cái **loa**. Bạn đưa tín hiệu âm thanh nhỏ vào, loa phát ra tiếng nhỏ. Bạn đưa tín hiệu âm thanh lớn hơn (nhưng vẫn trong giới hạn), loa phát ra tiếng lớn hơn (vẫn trong giới hạn). Loa đó **ổn định** — nó không "nổ" khi gặp tín hiệu mạnh.

[P] Ngược lại, nếu bạn đưa tín hiệu nhỏ vào nhưng loa bắt đầu rít lên, rồi tự khuếch đại vô hạn (hiện tượng feedback) → loa **không ổn định**. Đây là lý do các hệ thống âm thanh phải có bộ chống feedback.

[BOX: analogy] **Tóm gọn**: Ổn định = hệ thống **không bao giờ nổ**. Đầu vào có bị chặn (nằm trong khoảng hữu hạn) thì đầu ra cũng bị chặn (nằm trong khoảng hữu hạn). Hệ thống ổn định không khuếch đại tín hiệu đến vô cùng.

### F.2. Định nghĩa chính xác

[P] Hệ thống là **ổn định BIBO** nếu:
[FORMULA: key]
$$|x(t)| \leq M_x < \infty \;\forall t \quad\Rightarrow\quad |y(t)| \leq M_y < \infty \;\forall t$$
[/FORMULA]

[P] Nghĩa là: **mọi** đầu vào bị chặn đều cho đầu ra bị chặn. Chặn ở đây là "có một số hữu hạn $M$ sao cho giá trị tuyệt đối không bao giờ vượt quá $M$".

### F.3. Phương pháp kiểm tra — 3 bước

[STEPS]
1. **Bước 1 — Giả sử**: Giả sử đầu vào bị chặn: $|x(t)| \leq M$ với mọi $t$ (M hữu hạn).
2. **Bước 2 — Chặn đầu ra**: Từ biểu thức $y$, tìm cách chặn $|y(t)|$ theo $M$. Cụ thể: dùng bất đẳng thức tam giác, tính chất trị tuyệt đối, để đưa về dạng $|y(t)| \leq K\cdot M$ với $K$ là hằng số.
3. **Bước 3 — Kiểm tra $K$**: Nếu $K$ **hữu hạn** (không phụ thuộc $t$, không phụ thuộc $n$) → **ổn định**. Nếu $K$ có thể tiến tới $\infty$ khi $t$ hoặc $n$ thay đổi → **không ổn định**.
[/STEPS]

[BOX: warn] **Bẫy phổ biến**: Hệ số nhân với $x$ có thể **phụ thuộc $t$ hoặc $n$**. Nếu hệ số đó **không bị chặn** (như $t \to \infty$, $2^{-n}$ khi $n \to -\infty$, $n \to \infty$), thì dù $x$ bị chặn, $y$ vẫn có thể tiến tới $\infty$ → **không ổn định**. Đây là bẫy hay gặp trong đề thi.

[P] **Công thức chặn hay dùng**:
- $|a + b| \leq |a| + |b|$ (bất đẳng thức tam giác).
- $|ab| = |a|\cdot|b|$.
- $|\sin(\cdot)| \leq 1$, $|\cos(\cdot)| \leq 1$.
- $|u(\cdot)| \leq 1$.
- $|e^{-|t|}| \leq 1$.

### F.4. Ví dụ chi tiết

[P] **Ví dụ 1: $y(t) = 5x(t-2)$ — ổn định**

Giả sử $|x(t)| \leq M$. Khi đó $|y(t)| = 5|x(t-2)| \leq 5M$. Hằng số $K = 5$ hữu hạn → **ổn định**.

[P] **Ví dụ 2: $y(t) = t\cdot x(t)$ — KHÔNG ổn định**

Giả sử $|x(t)| \leq M$. $|y(t)| = |t|\cdot M$. Khi $t \to \infty$, $|t|\cdot M \to \infty$ → không có hằng số $K$ hữu hạn chặn $|y|$ với mọi $t$ → **không ổn định**.

[P] **Ví dụ 3: $y(t) = \log_{10}|x(t)|$ — KHÔNG ổn định**

Giả sử $|x(t)| \leq M$. Khi $x(t) \to 0$ (vẫn thỏa $|x| \leq M$), $\log_{10}|x| \to -\infty$ → $|y| \to \infty$ → **không ổn định**.

[P] **Ví dụ 4: $y(t) = \sin(x(t))\cdot u(-t)$ — ổn định**

$|\sin(\cdot)| \leq 1$, $|u(-t)| \leq 1$ → $|y(t)| \leq 1$ → **ổn định**.

[P] **Ví dụ 5: $y[n] = 2^{-n}x[n-1]$ — KHÔNG ổn định**

Giả sử $|x[n]| \leq M$. $|y[n]| = 2^{-n}|x[n-1]| \leq 2^{-n}\cdot M$. Khi $n \to -\infty$, $2^{-n} \to \infty$ → $|y| \to \infty$ → **không ổn định**.

[BOX: analogy] **Trực giác về $2^{-n}$**: Hệ số $2^{-n}$ rất nhỏ khi $n$ dương (nhỏ dần về 0), nhưng rất lớn khi $n$ âm ($2^{-(-10)} = 2^{10} = 1024$, $2^{-(-100)} = 2^{100} \approx 10^{30}$!). Khi $n \to -\infty$, hệ số này bùng nổ → đầu ra bùng nổ dù $x$ bị chặn. Đây là lý do hệ thống không ổn định.

[P] **Ví dụ 6: $y[n] = \sum_{k=-1}^{n}x[k]$ — KHÔNG ổn định**

Giả sử $|x[k]| \leq M$. $|y[n]| \leq \sum_{k=-1}^{n}|x[k]| \leq (n+2)M$. Khi $n \to \infty$, $(n+2)M \to \infty$ → **không ổn định**.

[BOX: analogy] **Trực giác**: Tổng lũy kế $\sum_{k=-1}^{n}x[k]$ cộng dồn các giá trị. Nếu $x$ là hằng số 1, tổng sẽ tăng tuyến tính theo $n$ → tiến tới $\infty$. Đó là lý do tổng lũy kế của hằng số khác 0 là không ổn định.

## Phần G. Mối quan hệ giữa 5 tính chất

[P] 5 tính chất này **độc lập** với nhau — một hệ thống có thể có bất kỳ tổ hợp nào. Nhưng có một số **kéo theo** (implication):

[TABLE]
| Tính chất | Kéo theo | Lý do |
|---|---|---|
| Không nhớ | ⇒ Nhân quả | Chỉ dùng hiện tại thì đương nhiên không dùng tương lai |
| Tuyến tính + Bất biến | ⇒ Hệ LTI (công cụ mạnh: tích chập, Fourier) | Đây là nền tảng Chương 2, 3 |
[/TABLE]

[P] **Các cặp phản chéo** (hay gây nhầm):
- Tuyến tính ⇏ Bất biến: $y = t\cdot x$ (tuyến tính nhưng không bất biến).
- Bất biến ⇏ Tuyến tính: $y = x^2$ (bất biến nhưng không tuyến tính).
- Nhân quả ⇏ Không nhớ: $y = x(t-1)$ (nhân quả nhưng có nhớ).
- Không nhớ ⇒ Nhân quả: (như trên).
- Tuyến tính ⇏ Ổn định: $y = t\cdot x$ (tuyến tính nhưng không ổn định).
- Ổn định ⇏ Tuyến tính: $y = \sin(x)$ (ổn định nhưng không tuyến tính).

[BOX: analogy] **Tầm quan trọng của LTI**: Nếu bạn chỉ có thể nhớ **một** tổ hợp tính chất, hãy nhớ LTI (= tuyến tính + bất biến). LTI cho phép bạn dùng **tích chập** và **Fourier** — hai công cụ mạnh nhất của cả môn học. Chính vì vậy Chương 2 và Chương 3 chỉ tập trung vào hệ LTI. Các hệ thống khác phải phân tích bằng cách khác (khó hơn nhiều).

[H3] Câu 1. Hệ thống nào tuyến tính, bất biến, nhân quả?

[P] **Đề**: Chọn hệ thống thỏa **cả ba**: tuyến tính, bất biến, nhân quả.
- (A) $y(t) + y'(t) = x(t)$
- (B) $y(n) + y(n-1) = x(n) + x(n+1)$
- (C) $y(n) + y(n-1) = x(n)^2$
- (D) $y(t) + y'(t) = t\cdot x(t)$

[P] **Phân tích từng phương án**:

[P] **(A) $y(t) + y'(t) = x(t)$** — phương trình vi phân tuyến tính hệ số hằng.
- Tuyến tính: ✓ (vế trái tuyến tính theo $y$, vế phải tuyến tính theo $x$; phương trình vi phân tuyến tính hệ số hằng luôn tuyến tính).
- Bất biến: ✓ (hệ số 1, 1 là hằng số, không phụ thuộc $t$).
- Nhân quả: ✓ (chỉ liên quan $y(t), y'(t)$ với $x(t)$ cùng thời điểm — không có tương lai).
- → **Thỏa cả ba**.

[P] **(B) $y(n) + y(n-1) = x(n) + x(n+1)$**.
- Tuyến tính: ✓ (tổng tuyến tính).
- Bất biến: ✓ (hệ số hằng).
- Nhân quả: ✗ — vế phải có $x(n+1)$ — **tương lai** → phi nhân quả.
- → **Không thỏa** (vì phi nhân quả).

[P] **(C) $y(n) + y(n-1) = x(n)^2$**.
- Tuyến tính: ✗ — $x(n)^2$ là phi tuyến.
- → **Không thỏa**.

[P] **(D) $y(t) + y'(t) = t\cdot x(t)$**.
- Tuyến tính: ✓ (vế phải $t\cdot x(t)$ tuyến tính theo $x$).
- Bất biến: ✗ — hệ số $t$ phụ thuộc thời gian.
- → **Không thỏa**.

[ANS] **Đáp án: (A)**.

---

[H3] Câu 2. $y(t) = |x(t-1)|$

[P] **Đề**: Đánh dấu các đặc trưng đúng trong: Nhân quả / Không cần bộ nhớ / Tuyến tính / Ổn định / Bất biến.

**Lời giải từng tính chất**

[P] **a) Nhân quả**: $y(t)$ dùng $x(t-1)$ — chỉ số $-1 \leq 0$ → quá khứ → **nhân quả ✓**.

[P] **b) Không nhớ**: $y$ dùng $x(t-1)$ — khác chỉ số với $y(t)$ → **có nhớ** (không đánh dấu).

[P] **c) Tuyến tính**: Thử phản ví dụ $x_1 = 1$ (hằng số), $x_2 = -1$ (hằng số), $a = b = 1$.
- Vế trái: $T\{1 + (-1)\} = |0 - 1| = |-1| = 1$.
- Vế phải: $T\{1\} + T\{-1\} = |1-1| + |-1-1| = 0 + 2 = 2$.
- $1 \neq 2$ → **không tuyến tính** (không đánh dấu).

[P] **d) Ổn định**: Giả sử $|x| \leq M$. $|y(t)| = |x(t-1)| \leq M$ → **ổn định ✓**.

[P] **e) Bất biến**:
- Bước 1: $T\{x(t-t_0)\} = |x(t-t_0-1)|$.
- Bước 2: $y(t-t_0) = |x(t-t_0-1)|$.
- Bằng nhau → **bất biến ✓**.

[ANS] **Đáp án: Nhân quả ✓, Ổn định ✓, Bất biến ✓**. (Không tuyến tính, không không-nhớ.)

---

[H3] Câu 3. $y[n] = 2^{-n}x[n-1]$

[P] **Đề**: Đánh dấu: Nhân quả / Tuyến tính / Không cần bộ nhớ / Bất biến / Ổn định.

**Lời giải từng tính chất**

[P] **a) Nhân quả**: $x[n-1]$ — chỉ số $-1 \leq 0$ → quá khứ → **nhân quả ✓**.

[P] **b) Tuyến tính**: $T\{ax_1+bx_2\} = 2^{-n}(ax_1[n-1]+bx_2[n-1]) = a\cdot 2^{-n}x_1[n-1] + b\cdot 2^{-n}x_2[n-1]$ → **tuyến tính ✓**.

[P] **c) Không nhớ**: Dùng $x[n-1]$ → **có nhớ** (không đánh dấu).

[P] **d) Bất biến**:
- Bước 1: $T\{x[n-n_0]\} = 2^{-n}x[n-n_0-1]$.
- Bước 2: $y[n-n_0] = 2^{-(n-n_0)}x[n-n_0-1] = 2^{-n+n_0}x[n-n_0-1]$.
- So sánh: $2^{-n}$ vs $2^{-n+n_0}$ → khác khi $n_0 \neq 0$ → **không bất biến** (không đánh dấu).

[P] **e) Ổn định**: Giả sử $|x[n]| \leq M$. $|y[n]| = 2^{-n}|x[n-1]| \leq 2^{-n}M$. Khi $n \to -\infty$, $2^{-n} \to \infty$ → $|y| \to \infty$ → **không ổn định** (không đánh dấu).

[ANS] **Đáp án: Nhân quả ✓, Tuyến tính ✓**.

---

[H3] Câu 4. $y[n] = x[-|n|]$

[P] **Đề**: Đánh dấu: Nhân quả / Tuyến tính / Ổn định / Không cần bộ nhớ / Bất biến.

**Lời giải từng tính chất**

[P] **a) Nhân quả**: Xét chỉ số $-|n|$:
- $n \geq 0$: $-|n| = -n \leq 0 \leq n$ → quá khứ hoặc hiện tại.
- $n < 0$: $-|n| = n \leq n$ → hiện tại.
- Mọi chỉ số $\leq n$ → **nhân quả ✓**.

[P] **b) Tuyến tính**: $y = x[-|n|]$ là phép lấy giá trị $x$ tại chỉ số khác — tuyến tính theo $x$ → **tuyến tính ✓**.

[P] **c) Ổn định**: $|x| \leq M$ → $|y[n]| = |x[-|n|]| \leq M$ → **ổn định ✓**.

[P] **d) Không nhớ**: Với $n > 0$, chỉ số $-n \neq n$ → **có nhớ** (không đánh dấu).

[P] **e) Bất biến**:
- Bước 1: $T\{x[n-n_0]\} = x[-|n|-n_0]$.
- Bước 2: $y[n-n_0] = x[-|n-n_0|]$.
- So sánh: $-|n|-n_0$ vs $-|n-n_0|$. Ví dụ $n=2, n_0=1$: $-2-1 = -3$ vs $-|2-1| = -1$ → khác → **không bất biến**.

[ANS] **Đáp án: Nhân quả ✓, Tuyến tính ✓, Ổn định ✓**.

---

[H3] Câu 5. $y[n] = 2[x[n-1]]$

[P] **Đề**: Đánh dấu: Nhân quả / Bất biến / Ổn định / Không cần bộ nhớ / Tuyến tính. (Đây là $y[n] = 2\cdot x[n-1]$.)

[P] **a) Nhân quả**: $x[n-1]$ — quá khứ → **nhân quả ✓**.

[P] **b) Bất biến**: 
- Bước 1: $T\{x[n-n_0]\} = 2x[n-n_0-1]$.
- Bước 2: $y[n-n_0] = 2x[n-n_0-1]$.
- Bằng nhau → **bất biến ✓**.

[P] **c) Ổn định**: $|x| \leq M$ → $|y| \leq 2M$ → **ổn định ✓**.

[P] **d) Không nhớ**: Dùng $x[n-1]$ → **có nhớ** (không đánh dấu).

[P] **e) Tuyến tính**: $T\{ax_1+bx_2\} = 2(ax_1[n-1]+bx_2[n-1]) = a\cdot 2x_1[n-1]+b\cdot 2x_2[n-1]$ → **tuyến tính ✓**.

[ANS] **Đáp án: Nhân quả ✓, Bất biến ✓, Ổn định ✓, Tuyến tính ✓**.

---

[H3] Câu 6. $y(t) = x(1-t)$

[P] **Đề**: Đánh dấu: Tuyến tính / Ổn định / Không cần bộ nhớ / Nhân quả / Bất biến.

**Lời giải**

[P] **a) Tuyến tính**: $y = x(1-t)$ — chỉ đổi chỉ số → **tuyến tính ✓**.

[P] **b) Ổn định**: $|x| \leq M$ → $|y| = |x(1-t)| \leq M$ → **ổn định ✓**.

[P] **c) Không nhớ**: Chỉ số $1-t$. Với $t \neq 1/2$, $1-t \neq t$ → **có nhớ** (không đánh dấu).

[P] **d) Nhân quả**: Tại $t=0$, chỉ số $1-0 = 1 > 0$ → tương lai → **phi nhân quả** (không đánh dấu).

[P] **e) Bất biến**:
- Bước 1: $T\{x(t-t_0)\} = x(1-t-t_0)$.
- Bước 2: $y(t-t_0) = x(1-(t-t_0)) = x(1-t+t_0)$.
- Khác nhau → **không bất biến** (không đánh dấu).

[ANS] **Đáp án: Tuyến tính ✓, Ổn định ✓**.

---

[H3] Câu 7. $y(t) = \log_{10}|x(t)|$

[P] **Đề**: Đánh dấu: Không cần bộ nhớ / Nhân quả / Bất biến / Tuyến tính / Ổn định.

**Lời giải**

[P] **a) Không nhớ**: Chỉ dùng $x(t)$ → **không nhớ ✓**.

[P] **b) Nhân quả**: Chỉ dùng $x(t)$ hiện tại → **nhân quả ✓**.

[P] **c) Bất biến**: $T\{x(t-t_0)\} = \log|x(t-t_0)|$; $y(t-t_0) = \log|x(t-t_0)|$ → **bất biến ✓**.

[P] **d) Tuyến tính**: Phản ví dụ $x_1 = 1, x_2 = 10, a = b = 1$. Vế trái: $\log|11| \approx 1.04$; vế phải: $\log 1 + \log 10 = 0 + 1 = 1$ → $1.04 \neq 1$ → **không tuyến tính**.

[P] **e) Ổn định**: Khi $x(t) \to 0$ (vẫn thỏa $|x| \leq M$), $\log|x| \to -\infty$ → **không ổn định**.

[ANS] **Đáp án: Không cần bộ nhớ ✓, Nhân quả ✓, Bất biến ✓**.

---

[H3] Câu 8. $y(t) = \sin(x(t))\cdot u(-t)$

[P] **Đề**: Đánh dấu: Không cần bộ nhớ / Nhân quả / Ổn định / Tuyến tính / Bất biến.

**Lời giải**

[P] **a) Không nhớ**: Chỉ dùng $x(t)$ (còn $u(-t)$ chỉ phụ thuộc $t$) → **không nhớ ✓**.

[P] **b) Nhân quả**: Chỉ dùng $x(t)$ hiện tại → **nhân quả ✓**.

[P] **c) Ổn định**: $|\sin| \leq 1$, $|u(-t)| \leq 1$ → $|y| \leq 1$ → **ổn định ✓**.

[P] **d) Tuyến tính**: $\sin(ax) \neq a\sin(x)$ → **không tuyến tính**.

[P] **e) Bất biến**:
- Bước 1: $T\{x(t-t_0)\} = \sin(x(t-t_0))\cdot u(-t)$.
- Bước 2: $y(t-t_0) = \sin(x(t-t_0))\cdot u(-t+t_0)$.
- So sánh: $u(-t)$ vs $u(-t+t_0)$ → khác → **không bất biến**.

[ANS] **Đáp án: Không cần bộ nhớ ✓, Nhân quả ✓, Ổn định ✓**.

---

[H3] Câu 9. $y(t) = t\cdot x(t)$

[P] **Đề**: Đánh dấu: Không cần bộ nhớ / Nhân quả / Tuyến tính / Bất biến / Ổn định.

**Lời giải**

[P] **a) Không nhớ**: Chỉ dùng $x(t)$ → **không nhớ ✓**.

[P] **b) Nhân quả**: Chỉ dùng $x(t)$ → **nhân quả ✓**.

[P] **c) Tuyến tính**: $T\{ax_1+bx_2\} = t(ax_1+bx_2) = atx_1+btx_2$ → **tuyến tính ✓**.

[P] **d) Bất biến**: $T\{x(t-t_0)\} = t x(t-t_0)$; $y(t-t_0) = (t-t_0)x(t-t_0)$ → khác → **không bất biến**.

[P] **e) Ổn định**: $|x| \leq M$ → $|y| = |t|M$. Khi $t \to \infty$, $|y| \to \infty$ → **không ổn định**.

[ANS] **Đáp án: Không cần bộ nhớ ✓, Nhân quả ✓, Tuyến tính ✓**.

---

[H3] Câu 10. $y(t) = e^{-|t|}x(-t)$

[P] **Đề**: Đánh dấu: Tuyến tính / Ổn định / Không cần bộ nhớ / Nhân quả / Bất biến.

**Lời giải**

[P] **a) Tuyến tính**: Hệ số $e^{-|t|}$ độc lập với $x$, phép $x(-t)$ tuyến tính → **tuyến tính ✓**.

[P] **b) Ổn định**: $|e^{-|t|}| \leq 1$, $|x| \leq M$ → $|y| \leq M$ → **ổn định ✓**.

[P] **c) Không nhớ**: Dùng $x(-t)$. Với $t \neq 0$, $-t \neq t$ → **có nhớ**.

[P] **d) Nhân quả**: Tại $t=-1$, chỉ số $-(-1) = 1 > -1$ → tương lai → **phi nhân quả**.

[P] **e) Bất biến**: $T\{x(t-t_0)\} = e^{-|t|}x(-t+t_0)$; $y(t-t_0) = e^{-|t-t_0|}x(-t+t_0)$ → khác → **không bất biến**.

[ANS] **Đáp án: Tuyến tính ✓, Ổn định ✓**.

---

[H3] Câu 11. $y(t) = \sin(x(t))\cdot x(t)$

[P] **Đề**: Đánh dấu: Không cần bộ nhớ / Nhân quả / Bất biến / Tuyến tính / Ổn định.

**Lời giải**

[P] **a) Không nhớ**: Chỉ dùng $x(t)$ → **không nhớ ✓**.

[P] **b) Nhân quả**: Chỉ dùng $x(t)$ → **nhân quả ✓**.

[P] **c) Bất biến**: $T\{x(t-t_0)\} = \sin(x(t-t_0))\cdot x(t-t_0) = y(t-t_0)$ → **bất biến ✓**.

[P] **d) Tuyến tính**: Phản ví dụ $x_1 = \pi/2, x_2 = \pi/2, a = b = 1$. Vế trái: $\sin(\pi)\cdot\pi = 0$. Vế phải: $2\sin(\pi/2)\cdot\pi/2 = 2\cdot1\cdot\pi/2 = \pi$. $0 \neq \pi$ → **không tuyến tính**.

[P] **e) Ổn định**: $|\sin(x)|\leq 1$ → $|y| \leq |x| \leq M$ → **ổn định ✓**.

[ANS] **Đáp án: Không cần bộ nhớ ✓, Nhân quả ✓, Bất biến ✓, Ổn định ✓**.

---

[H3] Câu 12. $y[n] = \sum_{k=-1}^{n}x[k]$

[P] **Đề**: Đánh dấu: Nhân quả / Tuyến tính / Không cần bộ nhớ / Bất biến / Ổn định.

**Lời giải**

[P] **a) Nhân quả**: Tổng đến $k=n$ — quá khứ và hiện tại → **nhân quả ✓**.

[P] **b) Tuyến tính**: Tổng tuyến tính → **tuyến tính ✓**.

[P] **c) Không nhớ**: Tổng dùng nhiều quá khứ → **có nhớ**.

[P] **d) Bất biến**: $T\{x[n-n_0]\} = \sum_{k=-1}^{n}x[k-n_0] = \sum_{m=-1-n_0}^{n-n_0}x[m]$; $y[n-n_0] = \sum_{k=-1}^{n-n_0}x[k]$. Cận dưới khác ($-1-n_0$ vs $-1$) → **không bất biến**.

[P] **e) Ổn định**: $|y[n]| \leq (n+2)M \to \infty$ khi $n \to \infty$ → **không ổn định**.

[ANS] **Đáp án: Nhân quả ✓, Tuyến tính ✓**.

---

[H3] Câu 13. $y[n] = \sum_{k=-n-4}^{n+4}x[k]$

[P] **Đề**: Đánh dấu: Tuyến tính / Bất biến / Ổn định / Không cần bộ nhớ / Nhân quả.

**Lời giải**

[P] **a) Tuyến tính**: Tổng tuyến tính → **tuyến tính ✓**.

[P] **b) Bất biến**: Cận tổng phụ thuộc $n$ → thay $n \to n-n_0$ làm cận thay đổi khác → **không bất biến**.

[P] **c) Ổn định**: $|y[n]| \leq (2n+9)M \to \infty$ → **không ổn định**.

[P] **d) Không nhớ**: Dùng nhiều $x[k]$ → **có nhớ**.

[P] **e) Nhân quả**: Cận trên $n+4 > n$ → tương lai → **phi nhân quả**.

[ANS] **Đáp án: Tuyến tính ✓**.

---

[SECTION: bai1-summary]

[H2] Tổng kết Bài 1

[BOX] **Bảng tổng hợp 13 câu**:

| Câu | Biểu thức | Tuyến tính | Bất biến | Nhân quả | Không nhớ | Ổn định |
|---|---|---|---|---|---|---|
| 1A | $y'+y=x$ | ✓ | ✓ | ✓ | ✗ | ✓ |
| 2 | $\|x(t-1)\|$ | ✗ | ✓ | ✓ | ✗ | ✓ |
| 3 | $2^{-n}x[n-1]$ | ✓ | ✗ | ✓ | ✗ | ✗ |
| 4 | $x[-\|n\|]$ | ✓ | ✗ | ✓ | ✗ | ✓ |
| 5 | $2x[n-1]$ | ✓ | ✓ | ✓ | ✗ | ✓ |
| 6 | $x(1-t)$ | ✓ | ✗ | ✗ | ✗ | ✓ |
| 7 | $\log_{10}\|x(t)\|$ | ✗ | ✓ | ✓ | ✓ | ✗ |
| 8 | $\sin(x)u(-t)$ | ✗ | ✗ | ✓ | ✓ | ✓ |
| 9 | $t\cdot x(t)$ | ✓ | ✗ | ✓ | ✓ | ✗ |
| 10 | $e^{-\|t\|}x(-t)$ | ✓ | ✗ | ✗ | ✗ | ✓ |
| 11 | $\sin(x)\cdot x$ | ✗ | ✓ | ✓ | ✓ | ✓ |
| 12 | $\sum_{k=-1}^{n}x[k]$ | ✓ | ✗ | ✓ | ✗ | ✗ |
| 13 | $\sum_{-n-4}^{n+4}x[k]$ | ✓ | ✗ | ✗ | ✗ | ✗ |

[BOX: warn] **5 bẫy thi rút ra**:

1. **Hằng số cộng** ($+2$, $+1$…) → **mất tuyến tính** (Câu 7, 11).
2. **Hệ số phụ thuộc $t$** ($t$, $t^2$, $e^{-|t|}$, $2^{-n}$) → **mất bất biến** (Câu 3, 6, 8, 9, 10). Và nếu hệ số **không bị chặn** ($t \to \infty$, $2^{-n}$ khi $n \to -\infty$) → **mất ổn định** (Câu 3, 9).
3. **Co giãn thời gian** ($x(2t)$, $x(-t)$, $x(1-t)$) → **mất bất biến** và thường **phi nhân quả** (Câu 6, 10).
4. **Tổng lũy kế** ($\sum_{k=-1}^{n}$) → **không ổn định** vì cận tăng theo $n$ (Câu 12, 13).
5. **Tổng đối xứng** ($\sum_{-n-4}^{n+4}$) → **phi nhân quả** vì cận trên $n+4 > n$ (Câu 13).

[BOX] **Công thức cần nhớ**:
- **Tuyến tính**: $T\{ax_1+bx_2\} = aT\{x_1\} + bT\{x_2\}$.
- **Bất biến**: $T\{x(t-t_0)\} = y(t-t_0)$ — thay $t$ ở **mọi chỗ**.
- **Nhân quả**: chỉ số của $x$ $\leq$ chỉ số của $y$.
- **Không nhớ**: $x$ và $y$ **cùng chỉ số**.
- **Ổn định**: $|x|\leq M \Rightarrow |y| \leq K\cdot M$ với $K$ hữu hạn, **không phụ thuộc $t$**.

[BOX: analogy] **Câu thần chú cuối bài**: *"Tuyến tính là không bịa tần số mới. Bất biến là không có đồng hồ bên trong. Nhân quả là không nhìn trộm tương lai. Không nhớ là sống ở hiện tại. Ổn định là không bao giờ nổ."* — Năm câu này tóm gọn toàn bộ Bài 1. Khi gặp một hệ thống mới, hãy tự hỏi 5 câu này.

# BÀI 2 (BẢN ĐẦY ĐỦ): NĂNG LƯỢNG VÀ CÔNG SUẤT TÍN HIỆU

[SECTION: bai2-overview]

[H2] Bài 2. Năng lượng và công suất tín hiệu

---

## Phần A. Động cơ — Tại sao phải phân biệt năng lượng và công suất?

[BRIDGE] Bạn đã biết một tín hiệu có thể là hàm toán học bất kỳ. Nhưng khi đem tín hiệu đi **truyền**, **lọc**, **khuếch đại**, người ta cần biết **tín hiệu đó "mạnh" hay "yếu"**. Câu hỏi đặt ra: đo "độ mạnh" của tín hiệu bằng gì? Bài này trả lời: dùng **năng lượng** hoặc **công suất** — tùy vào tín hiệu kéo dài hữu hạn hay vô hạn.

[P] Tại sao phải phân biệt hai khái niệm? Vì chúng dùng cho **hai loại tín hiệu khác nhau**:

- **Tín hiệu hữu hạn thời gian** (như một tiếng nói, một xung radar, một nốt nhạc): có **tổng năng lượng** hữu hạn. Đo bằng năng lượng $E$.
- **Tín hiệu vô hạn thời gian** (như sóng sin chạy mãi, tín hiệu đồng hồ, điện lưới 220V): có **năng lượng vô hạn** (vì kéo dài mãi), nhưng **công suất trung bình mỗi giây** hữu hạn. Đo bằng công suất $P$.

[BOX: analogy] **Ẩn dụ**: Hãy tưởng tượng hai thứ:
1. **Một quả pháo hoa**: nổ trong 3 giây, tỏa ra tổng năng lượng $E$ (jun). Sau đó hết. Đo bằng **năng lượng**.
2. **Một bóng đèn đường**: sáng 24/7, tổng năng lượng tiêu thụ là vô hạn (vì chạy mãi), nhưng **mỗi giây** tiêu thụ 100W. Đo bằng **công suất** (W = J/s).

Không thể đo bóng đèn bằng "tổng năng lượng" (vô hạn), và không thể đo quả pháo bằng "công suất" (vì công suất trung bình trên toàn thời gian bằng 0 — pháo chỉ nổ 3 giây trong vô hạn thời gian). Vì vậy phải có **hai thước đo khác nhau** cho **hai loại tín hiệu khác nhau**.
[FIG: 2.1] So sánh hai loại tín hiệu. Trái: tín hiệu năng lượng (tắt dần, tổng năng lượng hữu hạn). Phải: tín hiệu công suất (tuần hoàn, năng lượng vô hạn nhưng công suất trung bình hữu hạn).

[P] **Tại sao phải học trong môn này?** Vì:
- **Định lý Parseval** (Chương 3) phát biểu: năng lượng trong miền thời gian = năng lượng trong miền tần số. Muốn hiểu Parseval, phải hiểu năng lượng trước.
- **Bài tập đề thi** hay hỏi: "Tính năng lượng/công suất của tín hiệu sau". Đây là dạng bài **tính toán cơ bản** nhưng hay mất điểm vì nhầm loại và nhầm công thức.
- **Phân loại hệ thống**: hệ thống ổn định BIBO có liên hệ chặt với năng lượng đáp ứng xung (sẽ học Chương 2).

---

## Phần B. Năng lượng tín hiệu

### B.1. Trực giác trước đã

[P] Năng lượng của một tín hiệu là **tổng "độ lớn bình phương" của tín hiệu trên toàn trục thời gian**. Tại sao bình phương? Vì:
1. **Tín hiệu có thể âm**, nhưng năng lượng luôn không âm. Bình phương biến âm thành dương.
2. **Năng lượng tỉ lệ với bình phương biên độ** — giống vật lý: năng lượng của một làn sóng tỉ lệ với bình phương biên độ (cường độ ánh sáng tỉ lệ với $E^2$, công suất điện tỉ lệ với $V^2/R$).

[BOX: analogy] **Ẩn dụ vật lý**: Nếu tín hiệu là **điện áp** $v(t)$ đặt lên điện trở $R = 1\,\Omega$, thì công suất tức thời là $p(t) = v^2(t)/R = v^2(t)$. Tổng năng lượng tiêu tán trên điện trở trong toàn thời gian chính là $\int v^2(t)dt$. Đây chính là công thức năng lượng tín hiệu. Vì vậy trong môn này, ta **quy ước** $R = 1$ để đơn giản hóa — năng lượng = tích phân bình phương biên độ.

### B.2. Định nghĩa chính xác

[P] Năng lượng của tín hiệu liên tục $x(t)$ và rời rạc $x[n]$:
[FORMULA: key]
$$E_x = \int_{-\infty}^{\infty}|x(t)|^2\,dt \qquad E_x = \sum_{n=-\infty}^{\infty}|x[n]|^2$$
[/FORMULA]

[P] Dùng **trị tuyệt đối bình phương** $|x|^2$ thay vì $x^2$ để xử lý được cả **tín hiệu phức** (như $e^{j\omega t}$). Với tín hiệu thực, $|x|^2 = x^2$.

[P] **Tín hiệu năng lượng** là tín hiệu có $0 < E_x < \infty$ (năng lượng hữu hạn, khác 0).

[BOX: warn] **Tại sao yêu cầu $0 < E < \infty$?**
- $E = 0$: tín hiệu bằng 0 khắp nơi → không phải tín hiệu (vô nghĩa). Loại.
- $E = \infty$: tín hiệu kéo dài vô hạn với biên độ không tắt → không đo được bằng năng lượng. Đây là **tín hiệu công suất**, không phải tín hiệu năng lượng.
- Chỉ khi $0 < E < \infty$ mới gọi là **tín hiệu năng lượng**.

### B.3. Cách tính — 3 bước

[STEPS]
1. **Bước 1 — Xác định khoảng tồn tại**: Xác định khoảng thời gian mà $x(t) \neq 0$ (hoặc $x[n] \neq 0$). Ngoài khoảng đó, tích phân/tổng bằng 0, không cần tính.
2. **Bước 2 — Viết $|x|^2$**: Bình phương biên độ. Với tín hiệu phức, dùng $|x|^2 = x\cdot x^*$ (nhân với liên hợp phức).
3. **Bước 3 — Tính tích phân/tổng**: Tính $\int |x|^2 dt$ hoặc $\sum |x[n]|^2$ trên khoảng tồn tại. Với tín hiệu sin/cos, dùng công thức hạ bậc: $\cos^2 = (1+\cos 2\theta)/2$, $\sin^2 = (1-\cos 2\theta)/2$.
[/STEPS]

[BOX: analogy] **Mẹo tính nhanh**: Nếu $|x|^2$ là hằng số trên khoảng $[a, b]$ dài $L = b-a$, thì $E = \text{hằng số} \times L$. Đây là trường hợp phổ biến với tín hiệu có biên độ không đổi (xung vuông, tín hiệu mũ phức thuần).

### B.4. Ví dụ chi tiết

[P] **Ví dụ 1: $x(t) = 3e^{-10t}u(t)$ — tín hiệu năng lượng**

- Bước 1: $u(t)$ làm $x = 0$ với $t<0$, nên chỉ tính $t \in [0, \infty)$.
- Bước 2: $|x|^2 = |3e^{-10t}|^2 = 9e^{-20t}$ (vì $e^{-10t}$ thực dương với $t \geq 0$).
- Bước 3: $E = \int_0^\infty 9e^{-20t}dt = 9\cdot\left[\frac{e^{-20t}}{-20}\right]_0^\infty = 9\cdot\left(0 - \frac{1}{-20}\right) = \frac{9}{20} = 0.45$.

Kết quả: $E = 9/20 = 0.45$ (hữu hạn, khác 0) → **tín hiệu năng lượng**.

[P] **Ví dụ 2: $x(t) = 2\cos(\pi t/3)$ với $t \in [0, 3]$ — tín hiệu năng lượng**

- Bước 1: Chỉ tính $t \in [0, 3]$.
- Bước 2: $|x|^2 = 4\cos^2(\pi t/3) = 4\cdot\frac{1+\cos(2\pi t/3)}{2} = 2 + 2\cos(2\pi t/3)$.
- Bước 3: $E = \int_0^3 (2 + 2\cos(2\pi t/3))dt = \left[2t + 2\cdot\frac{3}{2\pi}\sin(2\pi t/3)\right]_0^3$.
  $= \left(6 + \frac{3}{\pi}\sin(2\pi)\right) - \left(0 + 0\right) = 6 + 0 = 6$.

Kết quả: $E = 6$.

[BOX: warn] **Tại sao $\int_0^3 \cos(2\pi t/3)dt = 0$?** Vì $\cos(2\pi t/3)$ có chu kỳ $T = 2\pi/(2\pi/3) = 3$, và tích phân trên đúng **một chu kỳ** của cos luôn bằng 0 (phần dương triệt tiêu phần âm). Đây là tính chất cực kỳ hữu ích: **tích phân cos/sin trên một số nguyên chu kỳ luôn bằng 0**.

[BOX: analogy] **Mẹo cho tín hiệu sin/cos trên khoảng dài nguyên chu kỳ**: Nếu tính năng lượng của $A\cos(\omega t + \phi)$ trên một số nguyên chu kỳ $T_0 = 2\pi/\omega$, thì $E = \frac{A^2}{2}\cdot(\text{số chu kỳ})\cdot T_0 = \frac{A^2}{2}\cdot L$ với $L$ là độ dài khoảng. Cụ thể với ví dụ trên: $A = 2$, $L = 3$ → $E = 4/2 \cdot 3 = 6$. Khớp!

[P] **Ví dụ 3: $x[n] = 2n$ với $n \in \{-1, 0, 1, 2, 3\}$ — tín hiệu năng lượng**

- Bước 1: 5 mẫu: $n = -1, 0, 1, 2, 3$.
- Bước 2: $|x[n]|^2 = (2n)^2 = 4n^2$.
- Bước 3: $E = \sum_{n=-1}^{3} 4n^2 = 4(1 + 0 + 1 + 4 + 9) = 4\cdot 15 = 60$.

[P] **Ví dụ 4: $x[n] = 3\cdot 2^{-n}u[n+1]$ — tín hiệu năng lượng**

- Bước 1: $u[n+1] = 1$ với $n \geq -1$. Nên $n \in [-1, \infty)$.
- Bước 2: $|x[n]|^2 = 9\cdot 2^{-2n} = 9\cdot 4^{-n}$.
- Bước 3: $E = \sum_{n=-1}^{\infty} 9\cdot 4^{-n}$.

Đây là **tổng cấp số nhân** với công bội $q = 1/4$. Công thức: $\sum_{n=k}^{\infty} q^n = \frac{q^k}{1-q}$ với $|q|<1$.

Ở đây $k = -1$: $\sum_{n=-1}^{\infty} 4^{-n} = \frac{4^{-(-1)}}{1 - 1/4} = \frac{4}{3/4} = \frac{16}{3}$.

Vậy $E = 9 \cdot \frac{16}{3} = 48$.

[BOX: analogy] **Tổng cấp số nhân — công cụ phải nhớ**: $\sum_{n=k}^{\infty} q^n = \frac{q^k}{1-q}$ với $|q| < 1$. Nếu dùng không quen, hãy đổi chỉ số cho về dạng chuẩn $m = n - k$, khi đó tổng = $q^k \sum_{m=0}^\infty q^m = q^k \cdot \frac{1}{1-q}$. Đây là dạng tổng **xuất hiện rất nhiều** trong chương này và chương 3.

[P] **Ví dụ 5: $x(t) = e^{j\omega t}u(t)$ — KHÔNG phải tín hiệu năng lượng**

- $|x|^2 = |e^{j\omega t}|^2\cdot |u(t)|^2 = 1\cdot 1 = 1$ với $t \geq 0$.
- $E = \int_0^\infty 1\,dt = \infty$ → **không phải tín hiệu năng lượng** (mà là tín hiệu công suất — xem phần C).

[BOX: warn] **Lưu ý về tín hiệu phức**: $|e^{j\omega t}| = 1$ với mọi $t$ (vì đây là điểm trên đường tròn đơn vị). Đây là lý do tín hiệu mũ phức thuần (không có phần thực tắt dần) **luôn có biên độ không đổi** → năng lượng vô hạn → là tín hiệu **công suất**, không phải năng lượng.

## Phần C. Công suất tín hiệu

### C.1. Trực giác trước đã

[P] Khi tín hiệu kéo dài **vô hạn** (như sóng sin, tín hiệu tuần hoàn, nhiễu), năng lượng tổng là vô hạn. Không thể đo bằng "tổng năng lượng". Thay vào đó, ta đo **công suất trung bình** — tức là **năng lượng trung bình trong một đơn vị thời gian** (hoặc một chu kỳ).

[BOX: analogy] **Ẩn dụ**: Bóng đèn 100W chạy 24/7 có tổng năng lượng vô hạn, nhưng **công suất trung bình** là 100W — đây là con số có ý nghĩa. Tương tự, sóng sin $A\cos(\omega t)$ có công suất trung bình $A^2/2$ — không phụ thuộc thời gian, dù tín hiệu chạy mãi.

### C.2. Định nghĩa chính xác

[P] Công suất trung bình của tín hiệu:
[FORMULA: key]
$$P_x = \lim_{T \to \infty}\frac{1}{T}\int_{-T/2}^{T/2}|x(t)|^2dt \qquad P_x = \lim_{N \to \infty}\frac{1}{2N+1}\sum_{n=-N}^{N}|x[n]|^2$$
[/FORMULA]

[P] Với tín hiệu **tuần hoàn** chu kỳ $T_0$ (hoặc $N_0$), công thức đơn giản hơn — chỉ cần lấy trung bình trên **một chu kỳ** (vì các chu kỳ giống nhau):
[FORMULA: key]
$$P_x = \frac{1}{T_0}\int_{\langle T_0\rangle}|x(t)|^2dt \qquad P_x = \frac{1}{N_0}\sum_{n=\langle N_0\rangle}|x[n]|^2$$
[/FORMULA]

[P] **Tín hiệu công suất** là tín hiệu có $0 < P_x < \infty$.

[BOX: analogy] **Mẹo hiểu công thức**: Công suất = "năng lượng chia cho thời gian". Với tín hiệu tuần hoàn, lấy **một chu kỳ** là đủ vì chu kỳ nào cũng giống nhau. Với tín hiệu không tuần hoàn nhưng kéo dài vô hạn, lấy giới hạn $T \to \infty$ — công thức gốc.

### C.3. Cách tính — 3 bước

[STEPS]
1. **Bước 1 — Xác định chu kỳ** (nếu tuần hoàn): Tìm $T_0$ hoặc $N_0$ nhỏ nhất.
2. **Bước 2 — Tính $|x|^2$**: Bình phương biên độ (dùng trị tuyệt đối nếu phức).
3. **Bước 3 — Lấy trung bình trên một chu kỳ**: Tính $\frac{1}{T_0}\int_0^{T_0}|x|^2dt$ (hoặc $\frac{1}{N_0}\sum_0^{N_0-1}|x[n]|^2$).
[/STEPS]

### C.4. Ví dụ chi tiết

[P] **Ví dụ 1: $x(t) = A\cos(\omega_0 t + \phi)$ — tín hiệu công suất**

- Bước 1: Tuần hoàn với $T_0 = 2\pi/\omega_0$.
- Bước 2: $|x|^2 = A^2\cos^2(\omega_0 t + \phi) = \frac{A^2}{2}(1 + \cos(2\omega_0 t + 2\phi))$.
- Bước 3: $P = \frac{1}{T_0}\int_0^{T_0}\frac{A^2}{2}dt + \frac{1}{T_0}\int_0^{T_0}\frac{A^2}{2}\cos(2\omega_0 t + 2\phi)dt$.
  - Tích phân thứ nhất: $\frac{A^2}{2}$.
  - Tích phân thứ hai: $\cos$ trên một số nguyên chu kỳ → $= 0$.
- Vậy $P = \frac{A^2}{2}$.

[BOX: analogy] **Công thức quan trọng nhất của mục này**: $P = A^2/2$ với $x(t) = A\cos(\omega_0 t + \phi)$. Công thức này **hay dùng trong đề thi** — nhớ kỹ. Ví dụ $x = 5\cos(3t)$ có $P = 25/2 = 12.5$.

[P] **Ví dụ 2: $x[n] = A\cos(\Omega_0 n + \phi)$ — tín hiệu công suất**

- Nếu tuần hoàn với $N_0$ nguyên, tương tự: $P = A^2/2$.

[P] **Ví dụ 3: $x(t) = u(t) - u(t-1)$ chuỗi xung tuần hoàn (chu kỳ $2$) — tín hiệu công suất**

Xét $x(t) = \sum_{k=-\infty}^{\infty}[u(t-2k) - u(t-2k-1)]$ — chuỗi xung vuông độ rộng $1$, cách nhau $2$.

- Bước 1: $T_0 = 2$.
- Bước 2: Trên một chu kỳ $t \in [0, 2)$, $|x|^2 = 1$ với $t \in [0, 1)$, và $0$ với $t \in [1, 2)$.
- Bước 3: $P = \frac{1}{2}\int_0^2 |x|^2 dt = \frac{1}{2}\int_0^1 1\,dt = \frac{1}{2}$.

[P] **Ví dụ 4: $x[n] = \delta[n] + \delta[n-1]$ tuần hoàn chu kỳ $3$ — tín hiệu công suất**

Xét $x[n] = \sum_k (\delta[n-3k] + \delta[n-3k-1])$ — mỗi chu kỳ $3$ có hai xung tại $n=0$ và $n=1$.

- Bước 1: $N_0 = 3$.
- Bước 2: Trên $n \in \{0, 1, 2\}$: $|x[0]|^2 = 1$, $|x[1]|^2 = 1$, $|x[2]|^2 = 0$.
- Bước 3: $P = \frac{1}{3}(1 + 1 + 0) = \frac{2}{3}$.

## Phần D. Phân biệt — Tín hiệu nào là năng lượng, tín hiệu nào là công suất?

### D.1. Quy tắc vàng

[BOX: analogy] **Quy tắc nhận diện** (theo thứ tự ưu tiên):
1. **Tín hiệu hữu hạn thời gian** (tồn tại trong khoảng hữu hạn): **luôn là tín hiệu năng lượng** (nếu biên độ hữu hạn). Vì tích phân trên khoảng hữu hạn của hàm bị chặn luôn hữu hạn.
2. **Tín hiệu tuần hoàn** (kéo dài vô hạn): **luôn là tín hiệu công suất**. Vì năng lượng vô hạn, nhưng trung bình trên một chu kỳ hữu hạn.
3. **Tín hiệu không tuần hoàn nhưng kéo dài vô hạn**:
   - Nếu **tắt dần** (như $e^{-at}u(t)$ với $a>0$): **tín hiệu năng lượng** (tích phân hội tụ).
   - Nếu **không tắt** (như $e^{j\omega t}$, $u(t)$, $\sin$): **tín hiệu công suất** (năng lượng phân kỳ).
4. **Tín hiệu tăng trưởng** (như $e^{at}u(t)$ với $a>0$, $t\cdot u(t)$): **không phải năng lượng cũng không phải công suất** (cả hai đều bằng vô cùng).

### D.2. Các khẳng định lý thuyết hay thi

[BOX: warn] **Các câu đúng/sai phổ biến**:

1. **Khẳng định Đúng**: Tín hiệu năng lượng **không thể** là tín hiệu công suất — vì công suất của nó $P = \lim_{T\to\infty} E/(2T) = 0$, không thỏa $P > 0$.
2. **Khẳng định Đúng**: Tín hiệu công suất **không thể** là tín hiệu năng lượng — vì năng lượng của nó vô hạn.
3. **Khẳng định Đúng**: Tín hiệu tuần hoàn là tín hiệu **công suất** (trừ trường hợp tín hiệu bằng 0 hoặc có năng lượng hữu hạn).
4. **Khẳng định Đúng**: Mọi tín hiệu thực tế có **thời hạn hữu hạn** và **biên độ hữu hạn** đều là tín hiệu năng lượng.
5. **Khẳng định Đúng**: Tín hiệu có biên độ không đổi trong khoảng thời gian **vô hạn** là tín hiệu **công suất**.
6. **Khẳng định Đúng**: Tổng của tín hiệu năng lượng và tín hiệu công suất là tín hiệu **công suất** (vì phần công suất chi phối khi $T\to\infty$).
7. **Khẳng định Đúng**: Năng lượng **không bị ảnh hưởng** bởi dịch thời gian và lật thời gian — vì $|x(t-t_0)|^2$ có cùng tích phân với $|x(t)|^2$.
8. **Khẳng định Đúng**: Năng lượng **bị ảnh hưởng** bởi co giãn thời gian: nếu $y(t) = x(at)$ thì $E_y = E_x/|a|$.

[BOX: analogy] **Tại sao co giãn thời gian thay đổi năng lượng?** Vì năng lượng là **tích phân theo thời gian**. Nếu bạn nén tín hiệu ($a>1$), nó tồn tại trong thời gian **ngắn hơn** → năng lượng nhỏ hơn. Nếu bạn giãn ($0<a<1$), nó tồn tại **lâu hơn** → năng lượng lớn hơn. Công thức: $E_{x(at)} = \frac{1}{|a|}E_x$.

### D.3. Bảng tổng hợp nhận diện

[TABLE]
| Loại tín hiệu | Ví dụ | Năng lượng | Công suất | Kết luận |
|---|---|---|---|---|
| Hữu hạn thời gian, biên độ hữu hạn | $u(t)-u(t-3)$, $x[n]$ hữu hạn mẫu | $0 < E < \infty$ | $P = 0$ | **Năng lượng** |
| Tuần hoàn | $A\cos(\omega_0 t)$, chuỗi xung | $E = \infty$ | $0 < P < \infty$ | **Công suất** |
| Không tuần hoàn, tắt dần | $e^{-at}u(t)$, $a>0$ | $0 < E < \infty$ | $P = 0$ | **Năng lượng** |
| Không tuần hoàn, không tắt | $u(t)$, $e^{j\omega t}$, $\sin t$ | $E = \infty$ | $0 < P < \infty$ | **Công suất** |
| Tăng trưởng | $e^{at}u(t)$, $t\cdot u(t)$, $a>0$ | $E = \infty$ | $P = \infty$ | **Không phải cả hai** |
[/TABLE]

## Phần E. Các bẫy thi và mẹo tính nhanh

### E.1. Bẫy 1 — Nhầm tín hiệu phức

[P] Với tín hiệu phức như $e^{j\pi t/3}$, phải dùng $|e^{j\theta}|^2 = 1$, **không** dùng $(e^{j\theta})^2 = e^{j2\theta}$.

[P] **Sai**: $|e^{j\pi t/3}|^2 = e^{j2\pi t/3}$ (SAI — đây là bình phương, không phải trị tuyệt đối bình phương).

[P] **Đúng**: $|e^{j\pi t/3}|^2 = e^{j\pi t/3}\cdot e^{-j\pi t/3} = e^0 = 1$.

[BOX: warn] **Quy tắc**: $|z|^2 = z\cdot z^*$ (nhân với liên hợp phức). Với $z = e^{j\theta}$: $z^* = e^{-j\theta}$, nên $|z|^2 = e^{j\theta}\cdot e^{-j\theta} = e^0 = 1$.

### E.2. Bẫy 2 — Nhầm khoảng tồn tại

[P] Hàm $u[n+1] - u[n-5]$ không phải $n \in [0, 4]$ mà là $n \in [-1, 4]$. Cẩn thận đọc kỹ!

[BOX: analogy] **Quy tắc**: $u[n-a] - u[n-b]$ với $a < b$ bằng $1$ trên $n \in [a, b-1]$ — tức **$b-a$ mẫu**. Ví dụ $u[n+1] - u[n-5]$ → $n \in [-1, 4]$ → 6 mẫu.

Với liên tục: $u(t-a) - u(t-b)$ bằng $1$ trên $t \in [a, b)$ — độ rộng $b-a$.

### E.3. Bẫy 3 — Quên hệ số

[P] Khi bình phương $|2\sin(\cdots)|^2$, phải bình phương **cả biên độ lẫn hàm**: $|2\sin\theta|^2 = 4\sin^2\theta$, không phải $2\sin^2\theta$.

### E.4. Bẫy 4 — Nhầm tín hiệu tắt/tăng

[P] $e^{-2t}u(t)$ tắt dần (vì $-2t \to -\infty$ khi $t\to\infty$) → **năng lượng**. Nhưng $e^{2t}u(t)$ tăng dần → **không phải cả hai**.

### E.5. Bẫy 5 — Tín hiệu có dịch thời gian

[P] $e^{-2t}u(t+2)$: $u(t+2)$ làm tín hiệu **bắt đầu từ $t = -2$**, không phải $t=0$. Vì vậy cận tích phân là $[-2, \infty)$, **không phải** $[0, \infty)$. Đây là bẫy rất hay gặp.

[H3] Câu 1. $x(t) = 2\cos(\pi t/3)[u(t) - u(t-3)]$

[P] **Đề**: Tính năng lượng.

**Lời giải**

[STEPS]
1. **Xác định khoảng tồn tại**: $u(t) - u(t-3) = 1$ với $t \in [0, 3)$, $0$ ngoài. Tín hiệu tồn tại trên $[0, 3]$.
2. **Bình phương**: $|x|^2 = 4\cos^2(\pi t/3) = 4\cdot\frac{1 + \cos(2\pi t/3)}{2} = 2 + 2\cos(2\pi t/3)$.
3. **Tích phân**:
$$E = \int_0^3 (2 + 2\cos(2\pi t/3))dt = \left[2t + \frac{2\cdot 3}{2\pi}\sin(2\pi t/3)\right]_0^3 = \left[2t + \frac{3}{\pi}\sin(2\pi t/3)\right]_0^3$$
$$= \left(6 + \frac{3}{\pi}\sin(2\pi)\right) - \left(0 + 0\right) = 6 + 0 = 6$$
[/STEPS]

[ANS] **Đáp án: $E = 6$**. (Kiểm tra nhanh: tín hiệu là cos biên độ 2 trên đúng một chu kỳ $T_0 = 3$, nên $E = (A^2/2)\cdot T_0 = (4/2)\cdot 3 = 6$ — khớp.)

---

[H3] Câu 2. $x[n] = 2\sin(\pi n/4)[u[n+1] - u[n-5]]$

[P] **Đề**: Tính năng lượng (điền số thập phân 2 chữ số).

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $u[n+1] - u[n-5] = 1$ với $n \in [-1, 4]$ (6 mẫu: $n = -1, 0, 1, 2, 3, 4$).
2. **Bình phương**: $|x[n]|^2 = 4\sin^2(\pi n/4)$.
3. **Tính từng mẫu**:
   - $n=-1$: $\sin^2(-\pi/4) = (\sqrt{2}/2)^2 = 1/2$, term $= 4\cdot 1/2 = 2$.
   - $n=0$: $\sin^2(0) = 0$, term $= 0$.
   - $n=1$: $\sin^2(\pi/4) = 1/2$, term $= 2$.
   - $n=2$: $\sin^2(\pi/2) = 1$, term $= 4$.
   - $n=3$: $\sin^2(3\pi/4) = 1/2$, term $= 2$.
   - $n=4$: $\sin^2(\pi) = 0$, term $= 0$.
4. **Tổng**: $E = 2 + 0 + 2 + 4 + 2 + 0 = 10$.
[/STEPS]

[ANS] **Đáp án: $E = 10$**.

---

[H3] Câu 3. $x[n] = 2n[u[n+1] - u[n-4]]$

[P] **Đề**: Tính năng lượng (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $n \in [-1, 3]$ (5 mẫu: $-1, 0, 1, 2, 3$).
2. **Bình phương**: $|x[n]|^2 = (2n)^2 = 4n^2$.
3. **Tính từng mẫu**:
   - $n=-1$: $4\cdot 1 = 4$.
   - $n=0$: $0$.
   - $n=1$: $4$.
   - $n=2$: $4\cdot 4 = 16$.
   - $n=3$: $4\cdot 9 = 36$.
4. **Tổng**: $E = 4 + 0 + 4 + 16 + 36 = 60$.
[/STEPS]

[ANS] **Đáp án: $E = 60$**.

---

[H3] Câu 4. $x[n] = 3\cdot 2^{-n}u[n+1]$

[P] **Đề**: Tính năng lượng (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $n \geq -1$ (vì $u[n+1]=1$ khi $n+1\geq 0$).
2. **Bình phương**: $|x|^2 = 9\cdot 2^{-2n} = 9\cdot 4^{-n}$.
3. **Tổng cấp số nhân**: $E = \sum_{n=-1}^{\infty} 9\cdot 4^{-n}$.
   Công thức: $\sum_{n=k}^{\infty} q^n = \frac{q^k}{1-q}$ với $|q|<1$, $k = -1$, $q = 1/4$.
   $$\sum_{n=-1}^{\infty}(1/4)^n = \frac{(1/4)^{-1}}{1 - 1/4} = \frac{4}{3/4} = \frac{16}{3}$$
4. **Nhân hệ số**: $E = 9\cdot \frac{16}{3} = 48$.
[/STEPS]

[ANS] **Đáp án: $E = 48$**.

---

[H3] Câu 5. $x[n] = 3\cdot 2^{1-n}u[n-2]$

[P] **Đề**: Tính năng lượng (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $u[n-2]=1$ khi $n \geq 2$.
2. **Bình phương**: $|x|^2 = 9\cdot 2^{2-2n} = 9\cdot 4\cdot 4^{-n} = 36\cdot 4^{-n}$.
3. **Tổng cấp số nhân**: $E = \sum_{n=2}^{\infty} 36\cdot 4^{-n} = 36\cdot \sum_{n=2}^{\infty}(1/4)^n$.
   $k = 2$, $q = 1/4$: $\sum_{n=2}^{\infty}(1/4)^n = \frac{(1/4)^2}{1-1/4} = \frac{1/16}{3/4} = \frac{1}{12}$.
4. **Nhân hệ số**: $E = 36\cdot \frac{1}{12} = 3$.
[/STEPS]

[ANS] **Đáp án: $E = 3$**.

---

[H3] Câu 6. $\alpha(t) = 2e^{j\pi t/3}[u(t) - u(t-1)]$

[P] **Đề**: Tính năng lượng.

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $t \in [0, 1]$.
2. **Bình phương**: $|\alpha|^2 = |2|^2\cdot |e^{j\pi t/3}|^2 = 4\cdot 1 = 4$.
   **(Lưu ý bẫy 1**: $|e^{j\theta}| = 1$, không phải $e^{j2\theta}$.**)**
3. **Tích phân**: $E = \int_0^1 4\,dt = 4$.
[/STEPS]

[ANS] **Đáp án: $E = 4$**.

---

[H3] Câu 7. $\alpha[n] = \cos(\pi n/2)[u[n] - u[n-2]]$

[P] **Đề**: Tính năng lượng.

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $u[n] - u[n-2] = 1$ với $n \in \{0, 1\}$.
2. **Bình phương từng mẫu**:
   - $n=0$: $\cos^2(0) = 1$.
   - $n=1$: $\cos^2(\pi/2) = 0$.
3. **Tổng**: $E = 1 + 0 = 1$.
[/STEPS]

[ANS] **Đáp án: $E = 1$**.

---

[H3] Câu 8. $\alpha[n] = \sum_{k}(\delta[n-2k] + \delta[n-3k+1])$ — công suất

[P] **Đề**: Tính công suất (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Xác định chu kỳ**: Hai phần có chu kỳ $2$ và $3$ → chu kỳ chung $N_0 = \text{lcm}(2,3) = 6$.
2. **Phân tích một chu kỳ $n \in [0, 5]$**:
   - Phần 1: $\delta[n-2k] = 1$ khi $n = 2k$. Trong $[0,5]$: $n = 0, 2, 4$.
   - Phần 2: $\delta[n-3k+1] = 1$ khi $n = 3k-1$. Trong $[0,5]$: $n = 2, 5$.
3. **Giá trị $\alpha[n]$ trên một chu kỳ**:
   - $n=0$: 1 (từ phần 1).
   - $n=1$: 0.
   - $n=2$: $1 + 1 = 2$ (cả hai phần).
   - $n=3$: 0.
   - $n=4$: 1 (phần 1).
   - $n=5$: 1 (phần 2).
4. **Công suất**: $P = \frac{1}{6}(1^2 + 0 + 2^2 + 0 + 1^2 + 1^2) = \frac{1}{6}(1+4+1+1) = \frac{7}{6}$.

$7/6 \approx 1.17$.
[/STEPS]

[ANS] **Đáp án: $P = 7/6 \approx 1.17$**.

---

[H3] Câu 9. $\alpha[n] = e^{j\pi n/2}[u[n] - u[n-2]]$

[P] **Đề**: Tính năng lượng.

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $n \in \{0, 1\}$.
2. **Bình phương từng mẫu** (chú ý đây là tín hiệu phức):
   - $n=0$: $|e^{j\cdot 0}|^2 = |1|^2 = 1$.
   - $n=1$: $|e^{j\pi/2}|^2 = |j|^2 = 1$.
3. **Tổng**: $E = 1 + 1 = 2$.
[/STEPS]

[ANS] **Đáp án: $E = 2$**.

---

[H3] Câu 10. $\alpha[n] = \sum_k(\delta[n-2k-1] - \delta[n-3k+1])$ — công suất

[P] **Đề**: Tính công suất (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Chu kỳ**: $\text{lcm}(2,3) = 6$.
2. **Phân tích một chu kỳ $n \in [0, 5]$**:
   - Phần 1: $\delta[n-2k-1] = 1$ khi $n = 2k+1$ (n lẻ). Trong $[0,5]$: $n = 1, 3, 5$.
   - Phần 2: $-\delta[n-3k+1] = -1$ khi $n = 3k-1$. Trong $[0,5]$: $n = 2, 5$.
3. **Giá trị $\alpha[n]$**:
   - $n=0$: 0.
   - $n=1$: 1.
   - $n=2$: $-1$.
   - $n=3$: 1.
   - $n=4$: 0.
   - $n=5$: $1 - 1 = 0$.
4. **Công suất**: $P = \frac{1}{6}(0 + 1 + 1 + 1 + 0 + 0) = \frac{3}{6} = 0.5$.
[/STEPS]

[ANS] **Đáp án: $P = 0.5$**.

---

[H3] Câu 11. $\alpha(t) = \sum_k[u(t-2k) - u(t-2k-1)]$ — công suất

[P] **Đề**: Tính công suất (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Cấu trúc**: Mỗi số hạng $u(t-2k) - u(t-2k-1)$ là xung vuông độ rộng $1$, bắt đầu tại $t = 2k$, kết thúc tại $t = 2k+1$. Các xung cách nhau $2$ đơn vị thời gian.
2. **Chu kỳ**: $T_0 = 2$.
3. **Giá trị trên một chu kỳ $t \in [0, 2]$**: $|\alpha|^2 = 1$ với $t \in [0, 1)$; $0$ với $t \in [1, 2)$.
4. **Công suất**: $P = \frac{1}{2}\int_0^2|\alpha|^2 dt = \frac{1}{2}\int_0^1 1\,dt = \frac{1}{2}$.
[/STEPS]

[ANS] **Đáp án: $P = 0.5$**.

---

[H3] Câu 12. $\alpha(t) = \sin(2t)[u(t+1) - u(t-2)]$ — năng lượng

[P] **Đề**: Tính năng lượng (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $t \in [-1, 2]$.
2. **Bình phương**: $|\alpha|^2 = \sin^2(2t) = \frac{1 - \cos(4t)}{2}$.
3. **Tích phân**:
$$E = \int_{-1}^{2}\frac{1 - \cos(4t)}{2}dt = \frac{1}{2}\left[t - \frac{\sin(4t)}{4}\right]_{-1}^{2}$$
$$= \frac{1}{2}\left[\left(2 - \frac{\sin(8)}{4}\right) - \left(-1 - \frac{\sin(-4)}{4}\right)\right]$$
$$= \frac{1}{2}\left[2 - \frac{\sin(8)}{4} + 1 + \frac{\sin(-4)}{4}\right] = \frac{1}{2}\left[3 - \frac{\sin(8)}{4} - \frac{\sin(4)}{4}\right]$$
(Sử dụng $\sin(-4) = -\sin(4)$.)

Giá trị số: $\sin(8) \approx 0.989$ (vì $8 - 2\pi \approx 1.717$ rad, $\sin \approx 0.989$), $\sin(4) \approx -0.757$ (vì $4$ rad ở góc phần tư thứ hai, $\sin(4) \approx -0.757$).

$$E \approx \frac{1}{2}\left[3 - \frac{0.989}{4} - \frac{-0.757}{4}\right] = \frac{1}{2}\left[3 - 0.247 + 0.189\right] = \frac{1}{2}(2.942) \approx 1.47$$
[/STEPS]

[ANS] **Đáp án: $E \approx 1.47$**.

---

[H3] Câu 13. $x(t) = e^{2t}[u(t+2) - u(t-1)]$

[P] **Đề**: Tính năng lượng (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $t \in [-2, 1]$.
2. **Bình phương**: $|x|^2 = e^{4t}$ (vì $e^{2t}$ thực dương, bình phương $= e^{4t}$).
3. **Tích phân**:
$$E = \int_{-2}^{1} e^{4t}dt = \left[\frac{e^{4t}}{4}\right]_{-2}^{1} = \frac{e^4 - e^{-8}}{4}$$
Giá trị: $e^4 \approx 54.598$, $e^{-8} \approx 0.000335$.
$$E \approx \frac{54.598 - 0.000335}{4} = \frac{54.598}{4} \approx 13.65$$
[/STEPS]

[ANS] **Đáp án: $E \approx 13.65$**.

---

[H3] Câu 14. $x(t) = e^{-2t}u(t+2)$

[P] **Đề**: Tính năng lượng (2 chữ số thập phân).

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $u(t+2) = 1$ với $t \geq -2$. Nên $t \in [-2, \infty)$.
2. **Bình phương**: $|x|^2 = e^{-4t}$.
3. **Tích phân**:
$$E = \int_{-2}^{\infty} e^{-4t}dt = \left[\frac{e^{-4t}}{-4}\right]_{-2}^{\infty} = 0 - \frac{e^{8}}{-4} = \frac{e^8}{4}$$
Giá trị: $e^8 \approx 2980.96$.
$$E \approx \frac{2980.96}{4} \approx 745.24$$
[/STEPS]

[BOX: warn] **Tại sao kết quả lớn vậy?** Vì tín hiệu $e^{-2t}$ **tăng** khi $t \to -\infty$! Cụ thể: tại $t = -2$, $x = e^4 \approx 54.6$; tại $t = -10$, $x = e^{20} \approx 4.85 \times 10^8$; nhưng $u(t+2) = 0$ với $t < -2$, nên tín hiệu chỉ bắt đầu từ $t = -2$ với giá trị ban đầu $e^4$. Sau đó tắt dần về 0 khi $t \to \infty$. Tích phân hội tụ nhưng giá trị ban đầu lớn → tổng năng lượng lớn.

Đây là ví dụ cho thấy **tín hiệu tắt dần vẫn có thể có năng lượng lớn** nếu giá trị ban đầu lớn.

[ANS] **Đáp án: $E \approx 745.24$**.

| 8 | $\sum(\delta[n-2k]+\delta[n-3k+1])$ | Công suất | $P = 7/6 \approx 1.17$ |
| 9 | $e^{j\pi n/2}$ trên $\{0,1\}$ | Năng lượng | $E = 2$ |

[BOX: warn] **5 bẫy thi rút ra**:

1. **Tín hiệu phức**: $|e^{j\theta}|^2 = 1$, **không** phải $e^{j2\theta}$ (Câu 6, 9).
2. **Khoảng tồn tại của $u[n+a] - u[n+b]$**: là $[a, b-1]$ (không phải $[0, b-1-a]$) — Câu 2, 3.
3. **Tín hiệu tăng $e^{2t}$ trên khoảng hữu hạn vẫn có năng lượng hữu hạn** (Câu 13), nhưng **tăng trên khoảng vô hạn thì không**.
4. **Tín hiệu tắt dần $e^{-2t}$ bắt đầu từ $t = -2$ (do $u(t+2)$) có thể có năng lượng rất lớn** (Câu 14) vì giá trị ban đầu $e^4$ lớn.
5. **Tổng cấp số nhân**: $\sum_{n=k}^{\infty}q^n = q^k/(1-q)$ — nhớ kỹ (Câu 4, 5).

[BOX] **Công thức cần nhớ**:
- **Năng lượng**: $E = \int|x|^2dt$ hoặc $\sum|x[n]|^2$.
- **Công suất tín hiệu tuần hoàn**: $P = \frac{1}{T_0}\int_0^{T_0}|x|^2dt$ hoặc $\frac{1}{N_0}\sum_0^{N_0-1}|x[n]|^2$.
- **Công suất tín hiệu sin/cos**: $P = A^2/2$.
- **Tổng cấp số nhân**: $\sum_{n=k}^{\infty}q^n = q^k/(1-q)$ với $|q| < 1$.
- **Bình phương tín hiệu phức**: $|e^{j\theta}|^2 = 1$.
- **Nhận diện**: Hữu hạn thời gian → năng lượng. Tuần hoàn → công suất. Tắt dần → năng lượng. Tăng dần → không phải cả hai.

[BOX: analogy] **Câu thần chú cuối bài**: *"Hữu hạn thời gian thì đo năng lượng. Tuần hoàn thì đo công suất. Tắt dần thì đo năng lượng. Tăng dần thì không đo được. Nhớ: bình phương phải lấy trị tuyệt đối, cos bình phương ra $A^2/2$, và tổng cấp số nhân là bạn thân."*

# BÀI 3 (BẢN ĐẦY ĐỦ): PHÉP TOÁN TRÊN TÍN HIỆU

[SECTION: bai3-overview]

[H2] Bài 3. Phép toán trên tín hiệu — Dịch, lật, nén/giãn

---

## Phần A. Động cơ — Tại sao phải học các phép toán này?

[BRIDGE] Bạn đã biết một tín hiệu là một hàm. Bây giờ câu hỏi là: **khi bạn "biến đổi" tín hiệu đó, đồ thị của nó thay đổi thế nào?** Bài này dạy 6 phép biến đổi cơ bản (nhân hằng, cộng, nhân, dịch, lật, nén/giãn) và cách đọc ngược từ đồ thị — tức là khi cho hai đồ thị, làm sao tìm ra công thức liên hệ giữa chúng. Đây là **dạng bài thi phổ biến nhất** của Chương 1 vì nó kiểm tra khả năng đọc hiểu đồ thị.

[P] Cụ thể, đề thi thường cho **hai đồ thị** $x(t)$ và $x_1(t)$, rồi hỏi: "$x_1$ được tạo ra từ $x$ bằng phép biến đổi nào?" Để giải, bạn phải:
1. Nhìn **dạng** của hai đồ thị để nhận diện **loại phép biến đổi** (dịch? lật? nén?).
2. Đo **tọa độ các điểm mốc** (điểm đầu, điểm cuối, đỉnh, điểm gãy) để tính **hệ số cụ thể**.
3. Kiểm tra lại bằng **2–3 điểm** để chắc chắn.

[BOX: analogy] **Ẩn dụ**: Hãy tưởng tượng bạn có một tấm ảnh. Bạn có thể:
- **Phóng to/thu nhỏ** tấm ảnh (tương ứng nén/giãn thời gian).
- **Lật ngang** tấm ảnh (lật thời gian).
- **Dịch** tấm ảnh sang trái/phải (dịch thời gian).
- **Tăng/giảm độ sáng** tấm ảnh (nhân biên độ).

Bài này dạy cách xác định bạn đã làm thao tác nào, theo thứ tự nào, dựa trên việc so sánh ảnh gốc và ảnh kết quả. Và quan trọng: **thứ tự thao tác có thể ảnh hưởng đến kết quả** — đó là lý do phải có quy tắc ưu tiên.

---

## Phần B. Sáu phép toán cơ bản

### B.1. Phép toán trên biên độ (3 phép)

[P] **Nhân với hằng số**: $y(t) = c\cdot x(t)$. Đồ thị bị **kéo dãn theo chiều dọc** hệ số $c$. Nếu $c > 0$, đồ thị giữ nguyên hình dạng, chỉ cao/thấp hơn. Nếu $c < 0$, đồ thị còn bị **lật ngang qua trục hoành** (đảo dấu biên độ).

[P] **Cộng hai tín hiệu**: $y(t) = x_1(t) + x_2(t)$. Cộng biên độ tại **cùng thời điểm**. Đồ thị là "tổng chiều cao" của hai đồ thị.

[P] **Nhân hai tín hiệu**: $y(t) = x_1(t)\cdot x_2(t)$. Nhân biên độ tại **cùng thời điểm**. Đồ thị thường có dạng phức tạp hơn.

[BOX: warn] **Trong đề thi**, ba phép này ít xuất hiện độc lập mà thường đi kèm với phép dịch/lật/nén. Ví dụ $y(t) = 2x(3t+9)$ là **tổ hợp** của nhân hằng số ($\times 2$) và biến đổi thời gian (bên trong $x$).

### B.2. Phép dịch thời gian

[P] **Công thức**: $y(t) = x(t - t_0)$ hoặc $y[n] = x[n - n_0]$.

[P] **Quy tắc vàng**:
- $t_0 > 0$: đồ thị dịch sang **phải** (trễ). "Trừ số dương thì chạy sang phải" — giống như bạn chỉnh đồng hồ chậm lại, mọi thứ đến trễ hơn.
- $t_0 < 0$: đồ thị dịch sang **trái** (tiến).

[BOX: analogy] **Mẹo nhớ**: Hãy nghĩ đến một buổi hòa nhạc. Nếu ca sĩ trễ 5 phút ($t_0 = 5 > 0$), bài hát bắt đầu **muộn hơn** — tức là đồ thị dịch sang phải. Nếu ca sĩ hát sớm 5 phút ($t_0 = -5 < 0$), bài hát bắt đầu **sớm hơn** — đồ thị dịch sang trái.

[P] **Ví dụ**: $x(t)$ có đỉnh tại $(1, 2)$.
- $x(t-2)$ có đỉnh tại $(1+2, 2) = (3, 2)$ (dịch phải 2).
- $x(t+3)$ có đỉnh tại $(1-3, 2) = (-2, 2)$ (dịch trái 3).
[FIG: 3.1] Ba phép dịch thời gian. $x(t-2)$: dịch phải 2 đơn vị (trễ). $x(t+1)$: dịch trái 1 đơn vị (tiến). Quy tắc: trừ số dương → dịch phải; cộng số dương → dịch trái.

### B.3. Phép lật thời gian

[P] **Công thức**: $y(t) = x(-t)$ hoặc $y[n] = x[-n]$.

[P] **Tác dụng**: Lật đồ thị qua **trục tung**. Điểm tại $t = a$ chuyển đến $t = -a$.

[P] **Trường hợp đặc biệt**:
- Nếu $x$ là hàm **chẵn** ($x(-t) = x(t)$): lật không đổi đồ thị.
- Nếu $x$ là hàm **lẻ** ($x(-t) = -x(t)$): lật đồng thời đổi dấu biên độ.

[BOX: analogy] **Mẹo nhớ**: "Lật" là soi gương qua trục tung. Điểm ở bên phải ($t > 0$) chuyển sang bên trái ($t < 0$), và ngược lại.
[FIG: 3.2] Phép lật thời gian $x(t) \to x(-t)$: đồ thị lấy trục tung làm gương.

### B.4. Phép nén / giãn thời gian

[P] **Công thức**: $y(t) = x(\alpha t)$ với $\alpha > 0$.

[P] **Quy tắc vàng**:
- $\alpha > 1$: **nén** tín hiệu theo thời gian. Đồ thị "co lại" theo trục $t$. Điểm tại $t = a$ chuyển đến $t = a/\alpha$.
- $0 < \alpha < 1$: **giãn** tín hiệu theo thời gian. Đồ thị "kéo dài" theo trục $t$. Điểm tại $t = a$ chuyển đến $t = a/\alpha$ (lớn hơn $a$).

[BOX: analogy] **Mẹo nhớ dễ**: Nếu hệ số **lớn hơn 1**, tín hiệu **co lại** (vì $\alpha t$ tăng nhanh hơn, nên đạt đến các mốc sớm hơn). Ngược lại, hệ số **nhỏ hơn 1** thì tín hiệu **kéo dài**.

[P] **Ví dụ cụ thể**: $x(t)$ có đỉnh tại $(1, 2)$.
- $x(2t)$ có đỉnh tại $(1/2, 2)$ — đỉnh bị "co" vào gần gốc tọa độ.
- $x(t/2)$ có đỉnh tại $(2, 2)$ — đỉnh bị "giãn" ra xa gốc.
[FIG: 3.3] Phép nén/giãn thời gian. Hệ số $>1$ → nén đồ thị lại; hệ số $<1$ → giãn đồ thị ra.

[BOX: warn] **Bẫy phổ biến**: Nhầm "nén" và "giãn". Nhớ kỹ: $\alpha > 1$ là **nén** (compression), $0 < \alpha < 1$ là **giãn** (expansion). "Nén" = tín hiệu trở nên **ngắn hơn** theo thời gian, không phải "nhỏ hơn" theo biên độ.

### B.5. Phép dịch + lật + nén tổng hợp

[P] Khi biểu thức có **cả ba phép** (như $x(-2t + 6)$), phải tuân theo **thứ tự ưu tiên** để tránh sai.

[BOX: analogy] **Thứ tự chuẩn** (khuyên dùng):
1. **Nén/giãn** trước (biến $t \to \alpha t$).
2. **Lật** tiếp theo (biến $t \to -t$).
3. **Dịch** sau cùng (biến $t \to t - t_0$).

Nếu làm ngược lại (dịch trước), lượng dịch phải **chia cho** hệ số nén — rất dễ nhầm. Vì vậy nguyên tắc chuẩn là làm theo thứ tự trên.
[FIG: 3.4] Thứ tự ưu tiên khi biến đổi $x(t) \to x(-2t+6)$: nén → lật → dịch. Làm sai thứ tự sẽ cho kết quả khác.

[P] **Ví dụ**: Vẽ $y(t) = x(-2t + 6)$ từ $x(t)$. Phân tích: $x(-2t+6) = x(-2(t-3))$.
- Bước 1: Nén $\alpha = 2$: $x(2t)$.
- Bước 2: Lật: $x(-2t)$.
- Bước 3: Dịch phải 3: $x(-2(t-3)) = x(-2t+6)$.

[BOX: warn] **Kiểm tra chéo bằng điểm mốc** — cách an toàn nhất khi nghi ngờ:
- Lấy điểm đặc biệt của $x$ (đỉnh, điểm gãy). Gọi tọa độ là $(t_x, y_x)$.
- Điểm tương ứng trong $y$ có tung độ $B\cdot y_x$ (nếu $y = Bx(\cdots)$) và hoành độ $t_y$ thỏa mãn argument của $x$ bằng $t_x$.
- Ví dụ $y(t) = 2x(-2t+6)$ và $x$ có đỉnh tại $(1, 2)$: cần $-2t+6 = 1$ → $t = 2.5$. Vậy đỉnh của $y$ tại $(2.5, 4)$.

## Phần C. Phương pháp xác định mối liên hệ giữa hai đồ thị

[BRIDGE] Đây là **kỹ năng cốt lõi** để giải các câu quiz có hình vẽ. Phương pháp gồm 5 bước.

[STEPS]
1. **Bước 1 — Xác định dạng tổng quát**: Nhìn hình dạng hai đồ thị. Nếu $x_1$ cùng hình dạng với $x$ (không bị lật) → dạng $x_1(t) = B\cdot x(at + c)$. Nếu $x_1$ bị lật → $x_1(t) = B\cdot x(-at + c)$ với $a > 0$.
2. **Bước 2 — Xác định hệ số biên độ $B$**: So sánh **giá trị đỉnh** (hoặc giá trị đặc trưng). Nếu đỉnh của $x_1$ gấp $k$ lần đỉnh của $x$, thì $B = k$.
3. **Bước 3 — Xác định hệ số thời gian $a$**: So sánh **độ dài miền xác định** của hai đồ thị. Nếu $x_1$ có miền dài gấp $k$ lần miền của $x$, thì $a = 1/k$ (tức là $x_1$ giãn ra $k$ lần). Ngược lại nếu ngắn hơn $k$ lần, $a = k$.
4. **Bước 4 — Xác định hằng số dịch $c$**: Lấy một điểm mốc (thường là đỉnh hoặc điểm đầu) của $x$, tính toán vị trí tương ứng trên $x_1$ bằng cách giải phương trình argument $= t_{\text{mốc}}$. Từ đó tìm $c$.
5. **Bước 5 — Kiểm tra bằng 2–3 điểm mốc khác**: Lấy điểm đầu, điểm cuối, đỉnh — nếu tất cả khớp → công thức đúng.
[/STEPS]

[BOX: analogy] **Ẩn dụ**: Giống như bạn có hai bức ảnh (gốc và biến đổi), và phải tìm ra "bạn đã dùng phần mềm chỉnh ảnh nào". Bạn không thể chỉ nhìn tổng thể — phải **so từng chi tiết** (đỉnh, góc, cạnh) và **đo tỉ lệ**.

[H3] Câu 1. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: xác định trên $[0, 3]$. Điểm đầu $(0, 1)$, đỉnh $(1, 2)$, đi qua $(2, 1)$, kết thúc tại $(3, 0)$.
- $x_1(t)$: xác định trên $[-3, -2]$. Đỉnh có giá trị $4$, và đỉnh nằm giữa $[-3, -2]$ — cụ thể khoảng $1/3$ từ trái, tức $t \approx -8/3$.

[P] **Các đáp án**: (1) $2x(3t+9)$, (2) $2x(-3t-9)$, (3) $2x(3t+3)$, (4) $2x(t/3+3)$, (5) $2x(t/3+1)$.

**Lời giải**

[STEPS]
1. **Dạng tổng quát**: $x_1$ cùng chiều "lên rồi xuống" như $x$, không bị lật → dạng $x_1(t) = 2x(at + c)$ với $a > 0$. Hệ số $B = 2$ vì đỉnh $4 = 2\cdot 2$ (đỉnh $x$ là 2).
2. **Hệ số thời gian $a$**: Miền của $x$ dài $3 - 0 = 3$. Miền của $x_1$ dài $-2 - (-3) = 1$. Tỉ số: $x_1$ ngắn hơn $3$ lần → nén $\alpha = 3$ → $a = 3$.
3. **Hằng số dịch $c$**: Điểm đầu của $x$ tại $t_x = 0$. Tương ứng $t_{x_1} = -3$ (điểm đầu của $x_1$). Giải $a\cdot t_{x_1} + c = t_x$: $3\cdot(-3) + c = 0$ → $c = 9$.
4. **Công thức**: $x_1(t) = 2x(3t + 9)$.
5. **Kiểm tra**: Đỉnh của $x$ tại $t_x = 1$. Tương ứng $3t + 9 = 1$ → $t = -8/3 \approx -2.67$. Đỉnh $x_1$ có tung độ $2\cdot 2 = 4$. ✓ Khớp với hình (đỉnh cách trái 1/3).
[/STEPS]

[ANS] **Đáp án: $x_1(t) = 2x(3t + 9)$** — tùy chọn 1.

[H3] Câu 2. $x_1[n] = u[n+2] - u[n-5]$ và $x_2[n] = x_1[-2n + 2]$

[P] **Đề**: Tìm biểu thức đúng của $x_2[n]$.

**Lời giải**

[STEPS]
1. **Xác định $x_1$**: $x_1[n] = 1$ khi $n \in [-2, 4]$, $0$ ngoài. (Vì $u[n+2] - u[n-5]$ là 1 trên $[-2, 4]$.)
2. **Xác định điều kiện để $x_2[n] = 1$**: $x_2[n] = x_1[-2n+2] = 1$ khi $-2n + 2 \in [-2, 4]$.
3. **Giải bất phương trình**:
   $$-2 \leq -2n + 2 \leq 4 \;\Rightarrow\; -4 \leq -2n \leq 2 \;\Rightarrow\; -1 \leq n \leq 2$$
4. **Kết luận**: $x_2[n] = 1$ trên $[-1, 2]$, $0$ ngoài. Tương đương:
   $$x_2[n] = u[n+1] - u[n-3]$$
   (Vì $u[n+1] - u[n-3] = 1$ trên $[-1, 2]$.)
[/STEPS]

[BOX: warn] **Lưu ý**: Khi chia cho số âm, **phải lật dấu bất đẳng thức**. Đây là chỗ hay nhầm.

[ANS] **Đáp án: $x_2[n] = u[n+1] - u[n-3]$** — tùy chọn 1.

---

[H3] Câu 3. $x_1[n] = u[n+2] - u[n-5]$ và $x_2[n] = x_1[-2n - 2]$

**Lời giải**

[STEPS]
1. $x_1[n] = 1$ trên $[-2, 4]$.
2. $x_2[n] = 1$ khi $-2n - 2 \in [-2, 4]$.
3. Giải:
   $$-2 \leq -2n - 2 \leq 4 \;\Rightarrow\; 0 \leq -2n \leq 6 \;\Rightarrow\; -3 \leq n \leq 0$$
4. Vậy $x_2[n] = 1$ trên $[-3, 0]$ → $x_2[n] = u[n+3] - u[n-1]$.
[/STEPS]

[ANS] **Đáp án: $x_2[n] = u[n+3] - u[n-1]$** — tùy chọn 4.

---

[H3] Câu 4. $x_1[n] = u[n+2] - u[n-5]$ và $x_2[n] = x_1[-2n + 1]$

**Lời giải**

[STEPS]
1. $x_1[n] = 1$ trên $[-2, 4]$.
2. $x_2[n] = 1$ khi $-2n + 1 \in [-2, 4]$.
3. Giải:
   $$-2 \leq -2n + 1 \leq 4 \;\Rightarrow\; -3 \leq -2n \leq 3 \;\Rightarrow\; -1.5 \leq n \leq 1.5$$
   Vì $n$ nguyên: $n \in \{-1, 0, 1\}$.
4. Vậy $x_2[n] = 1$ trên $[-1, 1]$ → $x_2[n] = u[n+1] - u[n-2]$.
[/STEPS]

[ANS] **Đáp án: $x_2[n] = u[n+1] - u[n-2]$** — tùy chọn 1.

---

[H3] Câu 5. $x_1[n] = u[n+2] - u[n-5]$ và $x_2[n] = x_1[-2n - 1]$

**Lời giải**

[STEPS]
1. $x_1[n] = 1$ trên $[-2, 4]$.
2. $x_2[n] = 1$ khi $-2n - 1 \in [-2, 4]$.
3. Giải:
   $$-2 \leq -2n - 1 \leq 4 \;\Rightarrow\; -1 \leq -2n \leq 5 \;\Rightarrow\; -2.5 \leq n \leq 0.5$$
   Vì $n$ nguyên: $n \in \{-2, -1, 0\}$.
4. Vậy $x_2[n] = 1$ trên $[-2, 0]$ → $x_2[n] = u[n+2] - u[n-1]$.
[/STEPS]

[ANS] **Đáp án: $x_2[n] = u[n+2] - u[n-1]$** — tùy chọn 2.

---

[H3] Câu 6. $x_1[n] = u[n] - u[n-3]$ và $x_2[n] = x_1[-n/2 + 1]$

**Lời giải**

[STEPS]
1. **Xác định $x_1$**: $x_1[n] = 1$ trên $\{0, 1, 2\}$, $0$ ngoài.
2. **Tìm $n$ sao cho $x_2[n] \neq 0$**: Cần $-n/2 + 1 \in \{0, 1, 2\}$ (và phải là số nguyên, tức $n$ phải chẵn).
   - $-n/2 + 1 = 0 \Rightarrow n = 2$
   - $-n/2 + 1 = 1 \Rightarrow n = 0$
   - $-n/2 + 1 = 2 \Rightarrow n = -2$
3. Với $n$ lẻ, $-n/2 + 1$ không nguyên → $x_1$ không xác định → $x_2[n] = 0$.
4. **Kết luận**:
   $$x_2[n] = \delta[n+2] + \delta[n] + \delta[n-2]$$
[/STEPS]

[BOX: warn] **Lưu ý**: $x_1$ chỉ xác định tại **số nguyên**. Khi argument không nguyên (do chia cho 2 với $n$ lẻ), $x_2[n] = 0$. Đây là đặc điểm quan trọng của phép giãn rời rạc (đôi khi gọi là "interpolation" chèn mẫu — nhưng với định nghĩa chặt, ta chỉ lấy $x_1$ tại các điểm nguyên).

[ANS] **Đáp án: $x_2[n] = \delta[n+2] + \delta[n] + \delta[n-2]$** — tùy chọn 1.

---

[H3] Câu 7. $x_1[n] = u[n] - u[n-3]$ và $x_2[n] = x_1[-n/2 - 1]$

**Lời giải**

[STEPS]
1. $x_1[n] = 1$ trên $\{0, 1, 2\}$.
2. Cần $-n/2 - 1 \in \{0, 1, 2\}$ (và nguyên).
   - $-n/2 - 1 = 0 \Rightarrow n = -2$
   - $-n/2 - 1 = 1 \Rightarrow n = -4$
   - $-n/2 - 1 = 2 \Rightarrow n = -6$
3. **Kết luận**:
   $$x_2[n] = \delta[n+2] + \delta[n+4] + \delta[n+6] = \delta[n+6] + \delta[n+4] + \delta[n+2]$$
[/STEPS]

[ANS] **Đáp án: $x_2[n] = \delta[n+6] + \delta[n+4] + \delta[n+2]$** — tùy chọn 1.
