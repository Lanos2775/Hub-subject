[H3] Câu 8. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: giống câu 1 — miền $[0, 3]$, đỉnh $(1, 2)$.
- $x_1(t)$: miền $[-7, -1]$, đỉnh có giá trị $1$. Đỉnh nằm khoảng $2/3$ từ trái, tức $t \approx -3$.

[P] **Các đáp án** (dạng $(1/2)x(\ldots)$): $(1/2)x(-2t-1)$, $(1/2)x(-t/2+1)$, $(1/2)x(-t/2+1/2)$, $(1/2)x(-t/2-1/2)$, $(1/2)x(2t-1)$.

**Lời giải**

[STEPS]
1. **Dạng tổng quát**: Đỉnh $x_1$ nằm $2/3$ từ trái, còn đỉnh $x$ nằm $1/3$ từ trái → **bị lật**. Dạng: $x_1(t) = B\cdot x(-at + c)$ với $a > 0$.
2. **Hệ số $B$**: Đỉnh $x_1$ là $1$, đỉnh $x$ là $2$ → $B = 1/2$.
3. **Hệ số $a$**: Miền $x$ dài $3$, miền $x_1$ dài $6$ → $x_1$ **giãn** $2$ lần → $a = 1/2$.
4. **Hằng số $c$**: Điểm cuối $x$ tại $t_x = 3$ (tung độ 0). Tương ứng điểm đầu $x_1$ tại $t = -7$ (tung độ 0). Giải: $-a\cdot(-7) + c = 3$ → $7/2 + c = 3$ → $c = -1/2$.
5. **Kiểm tra**: Đỉnh $x$ tại $t_x = 1$. Cần $-t/2 - 1/2 = 1$ → $-t/2 = 3/2$ → $t = -3$. Đỉnh $x_1$ tại $(-3, 1)$. ✓ Khớp hình (đỉnh $2/3$ từ trái).
6. **Công thức**: $x_1(t) = (1/2)x(-t/2 - 1/2)$.
[/STEPS]

[ANS] **Đáp án: $x_1(t) = \frac{1}{2}x(-t/2 - 1/2)$** — tùy chọn 4.

---

[H3] Câu 9. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[0, 3]$, đỉnh $(1, 2)$.
- $x_1(t)$: miền $[-2, 1]$, đỉnh $(0, 4)$.

[P] **Các đáp án**: $2x(-t+1)$, $2x(-t-1)$, $2x(-3t-1)$, $2x(-t/3+1)$.

**Lời giải**

[STEPS]
1. **Dạng**: Đỉnh $x_1$ tại $t = 0$ (vị trí $2/3$ từ trái của $[-2, 1]$), còn đỉnh $x$ tại $1/3$ từ trái → **lật**. Dạng: $x_1(t) = 2x(-at + c)$.
2. **Hệ số $B$**: Đỉnh $4 = 2\cdot 2$ → $B = 2$.
3. **Hệ số $a$**: Miền $x_1$ dài $3 = $ miền $x$ → không nén/giãn → $a = 1$.
4. **Hằng số $c$**: Đỉnh $x$ tại $t_x = 1$. Cần $-1\cdot 0 + c = 1$ → $c = 1$.
5. **Công thức**: $x_1(t) = 2x(-t + 1)$.
6. **Kiểm tra**:
   - $t = -2$: $2x(2+1) = 2x(3) = 0$. Điểm đầu $x_1$ tại $(-2, 0)$. ✓
   - $t = 1$: $2x(-1+1) = 2x(0) = 2\cdot 1 = 2$. Điểm cuối $x_1$ tại $(1, 2)$. ✓
[/STEPS]

[ANS] **Đáp án: $x_1(t) = 2x(-t + 1)$** — tùy chọn 1.

---

[H3] Câu 10. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[0, 3]$, đỉnh $(1, 2)$.
- $x_1(t)$: miền $[1, 2]$, đỉnh giá trị $4$.

[P] **Các đáp án**: $2x(-3t+6)$, $2x(-t/3+2)$, $2x(-t/3-2)$, $2x(-3t-6)$, và $2x(-1/(1/6)t + 1/6)$ (viết lại là $2x(-6t+1/6)$).

**Lời giải**

[STEPS]
1. **Dạng**: Đỉnh $x_1$ nằm giữa $[1,2]$ — vị trí tương đối giống $x$ flipped ($2/3$ từ trái → $t \approx 1.67$). Hình như bị lật.
2. **Hệ số $B$**: $4 = 2\cdot 2$ → $B = 2$.
3. **Hệ số $a$**: Miền $x$ dài $3$, miền $x_1$ dài $1$ → nén 3 → $a = 3$.
4. **Hằng số $c$** (dạng lật): $x_1(t) = 2x(-3t + c)$. Điểm đầu $x_1$ tại $t = 1$ tương ứng với điểm cuối $x$ ($t_x = 3$, tung độ 0):
   $$-3(1) + c = 3 \;\Rightarrow\; c = 6$$
5. **Kiểm tra**:
   - $t = 1$: $2x(-3+6) = 2x(3) = 0$. ✓
   - $t = 2$: $2x(-6+6) = 2x(0) = 2$. Điểm cuối $x_1$ tại $(2, 2)$. 
   - Đỉnh $x$ tại $t_x = 1$: $-3t + 6 = 1$ → $t = 5/3 \approx 1.67$. $x_1(5/3) = 2x(1) = 4$. ✓
[/STEPS]

[BOX: warn] **Tại sao đáp án là $2x(-3t+6)$ mà không phải $2x(3t-6)$?** Vì hình cho thấy $x_1$ **bị lật** (đỉnh nằm ở $2/3$ từ trái, không phải $1/3$). Nếu không lật, đáp án sẽ là $2x(3t-3)$. Hãy chú ý vị trí đỉnh!

[ANS] **Đáp án: $x_1(t) = 2x(-3t + 6)$** — tùy chọn 1.

---

[H3] Câu 11. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[0, 3]$, đỉnh $(1, 2)$.
- $x_1(t)$: miền $[1/2, 2]$, đỉnh giá trị $4$.

[P] **Các đáp án**: $2x(2t-1)$, $2x(2t+1/2)$, $2x(2t-1/2)$, $2x(t/2-1)$, $2x(t/2-1/2)$.

**Lời giải**

[STEPS]
1. **Dạng**: Đỉnh $x_1$ nằm khoảng $1/3$ từ trái (giống $x$, không lật) → $x_1(t) = 2x(2t + c)$.
2. **Hệ số $B$**: $4 = 2\cdot 2$ → $B = 2$.
3. **Hệ số $a$**: Miền $x$ dài $3$, miền $x_1$ dài $1.5$ → nén 2 → $a = 2$.
4. **Hằng số $c$**: Điểm đầu $x_1$ tại $t = 1/2$ tương ứng $t_x = 0$: $2(1/2) + c = 0$ → $c = -1$.
5. **Kiểm tra**: Đỉnh $x$ tại $t_x = 1$: $2t - 1 = 1$ → $t = 1$. $x_1(1) = 2x(1) = 4$. ✓
[/STEPS]

[ANS] **Đáp án: $x_1(t) = 2x(2t - 1)$** — tùy chọn 1.

---

[H3] Câu 12. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[0, 3]$, đỉnh $(1, 2)$.
- $x_1(t)$: miền $[-3, 3]$, đỉnh giá trị $4$.

[P] **Các đáp án**: $2x(t/2+3/2)$, $2x(t/2+3)$, $2x(2t+3)$, $2x(2t-3)$, $2x(t/2-3/2)$.

**Lời giải**

[STEPS]
1. **Dạng**: Đỉnh $x_1$ nằm khoảng $1/3$ từ trái (giống $x$, không lật).
2. **Hệ số $B$**: $4 = 2\cdot 2$ → $B = 2$.
3. **Hệ số $a$**: Miền $x$ dài $3$, miền $x_1$ dài $6$ → giãn 2 → $a = 1/2$.
4. **Hằng số $c$**: Điểm đầu $x_1$ tại $t = -3$ tương ứng $t_x = 0$: $(1/2)(-3) + c = 0$ → $c = 3/2$.
5. **Kiểm tra**: Đỉnh $x$ tại $t_x = 1$: $t/2 + 3/2 = 1$ → $t/2 = -1/2$ → $t = -1$. $x_1(-1) = 2x(1) = 4$. ✓
6. Điểm cuối $x_1$ tại $t = 3$: $(3)/2 + 3/2 = 3$. $x(3) = 0$. ✓
[/STEPS]

[ANS] **Đáp án: $x_1(t) = 2x(t/2 + 3/2)$** — tùy chọn 1.

---

[H3] Câu 13. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[0, 3]$, đỉnh $(1, 2)$.
- $x_1(t)$: miền $[1/2, 2]$, đỉnh giá trị $2$ (không đổi biên độ!).

[P] **Các đáp án**: $x(-2t+4)$, $x(-2t-4)$, $x(-t/2+1)$, $x(-t/2-1)$, $x(-t/2-2)$.

**Lời giải**

[STEPS]
1. **Dạng**: Hình cho thấy đỉnh $x_1$ nằm ở vị trí $2/3$ từ trái (flipped so với $x$).
2. **Hệ số $B$**: Đỉnh bằng nhau ($2 = 1\cdot 2$) → $B = 1$.
3. **Hệ số $a$**: Miền $x$ dài $3$, miền $x_1$ dài $1.5$ → nén 2 → $a = 2$ (dạng lật thì argument là $-2t + c$).
4. **Hằng số $c$**: Điểm cuối $x$ tại $t_x = 3$ tương ứng điểm đầu $x_1$ tại $t = 1/2$: $-2(1/2) + c = 3$ → $-1 + c = 3$ → $c = 4$.
5. **Kiểm tra**: Đỉnh $x$ tại $t_x = 1$: $-2t + 4 = 1$ → $t = 1.5$. $x_1(1.5) = x(1) = 2$. ✓ (đỉnh ở $2/3$ từ trái của $[0.5, 2]$ = $0.5 + 1$ = $1.5$)
[/STEPS]

[ANS] **Đáp án: $x_1(t) = x(-2t + 4)$** — tùy chọn 1.

---

[H3] Câu 14. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[-3, 4]$. Dạng bậc thang: $y = 1$ trên $[-3, 0]$, $y = 3$ trên $[0, 2]$, sau đó giảm tuyến tính từ $(2, 3)$ xuống $(4, 0)$.
- $x_1(t)$: miền $[-3, 1/2]$. Dạng tương tự nhưng "co" lại: $y = 1$ trên $[-3, -3/2]$, $y = 3$ trên $[-3/2, -1/2]$, giảm tuyến tính xuống $0$ tại $1/2$.

[P] **Các đáp án**: $x(2t-3)$, $x(2t+3)$, $x(t/2-3)$, $x(t/2+3)$.

**Lời giải**

[STEPS]
1. **Dạng**: Cùng chiều, không lật → $x_1(t) = x(2t + c)$.
2. **Hệ số $B$**: Đỉnh $3 = 3$ → $B = 1$.
3. **Hệ số $a$**: Miền $x$ dài $7$, miền $x_1$ dài $3.5$ → nén 2 → $a = 2$.
4. **Hằng số $c$**: Điểm đầu $x$ tại $t_x = -3$ tương ứng điểm đầu $x_1$ tại $t = -3$: $2(-3) + c = -3$ → $c = 3$.
5. **Kiểm tra**:
   - $t = -3/2$: $2(-3/2)+3 = 0$. $x(0) = 3$. Vậy $x_1(-3/2) = 3$. ✓ (điểm bắt đầu bậc thang cao).
   - $t = -1/2$: $2(-1/2)+3 = 2$. $x(2) = 3$. Vậy $x_1(-1/2) = 3$. ✓ (điểm kết thúc bậc thang cao).
   - $t = 1/2$: $2(1/2)+3 = 4$. $x(4) = 0$. ✓
[/STEPS]

[ANS] **Đáp án: $x_1(t) = x(2t + 3)$** — tùy chọn 2.

---

[H3] Câu 15. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[-3, 4]$, giống câu 14.
- $x_1(t)$: miền $[-1/2, 3]$. Bị lật: $y = 3$ trên $[1/2, 3/2]$, $y = 1$ trên $[3/2, 3]$.

[P] **Các đáp án**: $x(-t/2+3)$, $x(-2t+3)$, $x(-t/2-3)$, $x(-2t-3)$, $x(-t/2-3)$.

**Lời giải**

[STEPS]
1. **Dạng**: Đỉnh $x_1$ (y=3) nằm ở khoảng $1/2$ đến $3/2$ (giữa miền), còn đỉnh $x$ (y=3) nằm ở $[0, 2]$. Hình bị lật (vì $x_1$ có bậc thấp ở phải, bậc cao ở giữa/trái — ngược với $x$ có bậc thấp ở trái, bậc cao ở giữa/phải).
2. **Hệ số $B$**: $3 = 3$ → $B = 1$.
3. **Hệ số $a$**: Miền $x$ dài $7$, miền $x_1$ dài $3.5$ → nén 2 → $a = 2$ (dạng lật: $-2t+c$).
4. **Hằng số $c$**: Điểm cuối $x$ tại $t_x = 4$ (y=0) tương ứng điểm đầu $x_1$ tại $t = -1/2$: $-2(-1/2) + c = 4$ → $1 + c = 4$ → $c = 3$.
5. **Kiểm tra**:
   - $t = 1/2$: $-2(1/2)+3 = 2$. $x(2) = 3$. Vậy $x_1(1/2) = 3$. ✓ (bắt đầu bậc cao)
   - $t = 3/2$: $-2(3/2)+3 = 0$. $x(0) = 3$. Vậy $x_1(3/2) = 3$. ✓ (kết thúc bậc cao)
   - $t = 3$: $-6+3 = -3$. $x(-3) = 1$. Vậy $x_1(3) = 1$. ✓
[/STEPS]

[ANS] **Đáp án: $x_1(t) = x(-2t + 3)$** — tùy chọn 2.

---

[H3] Câu 16. Tìm mối liên hệ giữa $x(t)$ và $x_1(t)$

[P] **Mô tả hình**:
- $x(t)$: miền $[-6, 1]$. Dạng bậc thang: $y=1$ trên $[-6, -3]$, $y=3$ trên $[-3, -1]$, giảm tuyến tính từ $(-1, 3)$ xuống $(1, 0)$.
- $x_1(t)$: miền $[-2, 3/2]$. Hình có dạng "lên dốc + bậc + xuống": đường tăng từ $(-2, 0)$ đến $(-1, 3)$, bậc $y=3$ trên $[-1, 0]$, sau đó $y=1$ trên $[0, 3/2]$.

[P] **Các đáp án khả dĩ**: $x(-t/2+3)$, $x(-t/2-3)$, và có thể có $x(-2t-3)$ (tùy đề).

**Lời giải**

[STEPS]
1. **Dạng**: $x_1$ có bậc cao ở giữa, bậc thấp ở phải — tương ứng **lật** so với $x$ (bậc thấp ở trái, bậc cao ở giữa). Vậy: $x_1(t) = x(-at + c)$.
2. **Hệ số $B$**: Đỉnh $3 = 3$ → $B = 1$.
3. **Hệ số $a$**: Miền $x$ dài $7$, miền $x_1$ dài $3.5$ → nén 2 → $a = 2$.
4. **Hằng số $c$**: Điểm cuối $x$ tại $t_x = 1$ (y=0) tương ứng điểm đầu $x_1$ tại $t = -2$: $-2(-2) + c = 1$ → $4 + c = 1$ → $c = -3$.
5. **Kiểm tra**:
   - $t = -2$: $-2(-2)-3 = 1$. $x(1) = 0$. Vậy $x_1(-2) = 0$. ✓
   - $t = 3/2$: $-2(3/2)-3 = -6$. $x(-6) = 1$. Vậy $x_1(3/2) = 1$. ✓
   - Bậc cao $y=3$ tại: $-2t - 3 \in [-3, -1]$ → $t \in [-1, 0]$. ✓ Khớp hình (bậc 3 từ $-1$ đến $0$).
6. **Công thức**: $x_1(t) = x(-2t - 3)$.
[/STEPS]

[BOX: warn] **Lưu ý về đáp án**: Trong đề gốc, đáp án có thể được ghi là $x_1(t) = x(-2t - 3)$ hoặc tương đương. Nếu đề chỉ liệt kê $x(-t/2+3)$ và $x(-t/2-3)$ thì có thể đề có lỗi in ấn — hãy kiểm tra với phương pháp 5 bước để chắc chắn. Kết quả phân tích rõ ràng nhất là **$x(-2t - 3)$**.

[ANS] **Đáp án: $x_1(t) = x(-2t - 3)$**.

---

[H3] Câu 17. $x(t) = t^2$. Dịch xuôi 2 đơn vị, sau đó kéo giãn tỉ lệ 2 (quanh $t=0$). Tính giá trị tại $t = 2$.

**Lời giải**

[STEPS]
1. **Bước 1 — Dịch xuôi** (dịch phải 2, tức $t \to t - 2$): $y_1(t) = x(t-2) = (t-2)^2$.
2. **Bước 2 — Kéo giãn** (tỉ lệ 2 quanh $t=0$, tức $t \to t/2$): $y_2(t) = y_1(t/2) = (t/2 - 2)^2$.
3. **Thay $t = 2$**: $y_2(2) = (2/2 - 2)^2 = (1-2)^2 = (-1)^2 = 1$.
[/STEPS]

[ANS] **Đáp án: $1$**.

---

[H3] Câu 18. $x(t) = t^2$. Kéo giãn tỉ lệ 2 (quanh $t=0$), sau đó dịch ngược 2 đơn vị. Tính giá trị tại $t = 2$.

**Lời giải**

[STEPS]
1. **Bước 1 — Kéo giãn** ($t \to t/2$): $y_1(t) = x(t/2) = (t/2)^2 = t^2/4$.
2. **Bước 2 — Dịch ngược** (dịch trái 2, tức $t \to t+2$): $y_2(t) = y_1(t+2) = ((t+2)/2)^2 = (t+2)^2/4$.
3. **Thay $t = 2$**: $y_2(2) = (2+2)^2/4 = 16/4 = 4$.
[/STEPS]

[ANS] **Đáp án: $4$**.

---

[H3] Câu 19. $x(t) = (t-2)^2$. Kéo giãn tỉ lệ 2, lật qua $t=0$, dịch ngược 2. Tính giá trị tại $t = 2$.

**Lời giải**

[STEPS]
1. **Bước 1 — Kéo giãn** ($t \to t/2$): $y_1(t) = x(t/2) = (t/2 - 2)^2$.
2. **Bước 2 — Lật** ($t \to -t$): $y_2(t) = y_1(-t) = (-t/2 - 2)^2 = (t/2 + 2)^2$.
3. **Bước 3 — Dịch ngược** (dịch trái 2, tức $t \to t+2$): 
   $$y_3(t) = y_2(t+2) = \left(\frac{t+2}{2} + 2\right)^2 = \left(\frac{t+2+4}{2}\right)^2 = \left(\frac{t+6}{2}\right)^2$$
4. **Thay $t = 2$**: $y_3(2) = ((2+6)/2)^2 = (4)^2 = 16$.
[/STEPS]

[BOX: warn] **Cẩn thận với thứ tự**: Đề cho thứ tự "kéo giãn → lật → dịch". Nếu làm sai thứ tự (ví dụ dịch trước rồi kéo giãn), kết quả sẽ khác. Hãy làm đúng thứ tự từng bước như trên.

[ANS] **Đáp án: $16$**.

---

[H2] Tổng kết Bài 3

| 9 | Hình | $2x(-t+1)$ |

| 14 | Hình | $x(2t+3)$ |
| 15 | Hình | $x(-2t+3)$ |
| 16 | Hình | $x(-2t-3)$ |
| 17 | Dịch + giãn | $1$ |
| 18 | Giãn + dịch | $4$ |
| 19 | Giãn + lật + dịch | $16$ |

[BOX: warn] **5 bẫy thi rút ra**:

1. **Nhầm nén và giãn**: $\alpha > 1$ → **nén** (đồ thị co lại). $0 < \alpha < 1$ → **giãn** (đồ thị kéo dài).
2. **Quên lật khi đỉnh đổi vị trí tương đối**: Nếu đỉnh $x_1$ ở vị trí $2/3$ từ trái (trong khi $x$ ở $1/3$) → phải có dấu âm trong argument.
3. **Nhầm thứ tự ưu tiên**: Khi kết hợp dịch + nén/lật, làm theo thứ tự **nén → lật → dịch** để tránh sai.
4. **Bất đẳng thức âm**: Khi giải $-2 \leq -2n + c \leq 4$, **phải lật dấu** khi chia cho số âm.
5. **Argument không nguyên trong rời rạc**: $x[n/2]$ chỉ có nghĩa khi $n$ chẵn (nếu $x$ chỉ xác định tại số nguyên). Với $n$ lẻ, kết quả bằng 0.

[BOX] **Công thức cần nhớ**:
- **Dịch**: $x(t - t_0)$ — $t_0 > 0$ dịch phải, $t_0 < 0$ dịch trái.
- **Lật**: $x(-t)$ — lật qua trục tung.
- **Nén/giãn**: $x(\alpha t)$ — $\alpha > 1$ nén, $0 < \alpha < 1$ giãn.
- **Tổng hợp**: $B\cdot x(\pm at + c)$ — tìm $B$ từ tỉ số biên độ đỉnh, $a$ từ tỉ số độ dài miền, $c$ từ điểm mốc.
- **Thứ tự ưu tiên**: Nén/giãn → Lật → Dịch.

[BOX: analogy] **Câu thần chú cuối bài**: *"Nhân hằng đổi chiều cao, cộng trừ đổi vị trí. Nén giãn đo bằng miền, lật là soi gương. Dịch phải thì trừ đi, dịch trái thì cộng vô. Kết hợp nhiều phép, nhớ thứ tự: nén → lật → dịch. Đỉnh ở đâu, argument ở đó — đó là chìa khóa vàng."*

# BÀI 4 (BẢN ĐẦY ĐỦ): TÍN HIỆU TUẦN HOÀN

[SECTION: bai4-overview]

[H2] Bài 4. Tín hiệu tuần hoàn — Chu kỳ cơ sở và tần số cơ sở

---

## Phần A. Động cơ — Tại sao phải xác định chu kỳ cơ sở?

[BRIDGE] Ở Bài 2, bạn đã biết tín hiệu tuần hoàn luôn là tín hiệu công suất. Nhưng câu hỏi đặt ra là: **tính công suất trên "một chu kỳ" — cụ thể là chu kỳ nào?** Nếu tín hiệu tuần hoàn với chu kỳ $T$, thì nó cũng tuần hoàn với $2T$, $3T$, $100T$… Vậy phải xác định **chu kỳ cơ sở** — chu kỳ **nhỏ nhất** — để tính toán chuẩn. Đây cũng là khái niệm nền tảng cho chuỗi Fourier ở Chương 3, nơi tín hiệu tuần hoàn được biểu diễn qua các hài tần số $\omega_0 = 2\pi/T_0$.

[P] Cụ thể, trong chương 3, chuỗi Fourier biểu diễn tín hiệu tuần hoàn $x(t)$ thành tổng các mũ phức $e^{jk\omega_0 t}$, với $\omega_0$ là **tần số góc cơ sở**. Nếu bạn chọn sai $T_0$, bạn sẽ mất các hài tần số quan trọng và không thể khôi phục đúng tín hiệu. Vì vậy, bài này là **bước đệm bắt buộc** cho Chương 3.

[P] Ngoài ra, đề thi hay hỏi trực tiếp: "Tính chu kỳ cơ sở của tín hiệu sau" hoặc "Tín hiệu sau có tuần hoàn không?" — với các dạng:
- Tín hiệu sin/cos đơn giản.
- Tổng nhiều tín hiệu sin/cos (có thể không tuần hoàn!).
- Tích của tín hiệu với chuỗi xung.
- Tín hiệu phức như $j^{3n}$, $e^{j\pi n/2}$.

Bài này dạy phương pháp xử lý từng dạng.

---

## Phần B. Định nghĩa — Liên tục vs Rời rạc

### B.1. Tín hiệu tuần hoàn liên tục

[P] Tín hiệu $x(t)$ là tuần hoàn nếu tồn tại hằng số dương $T$ sao cho:
[FORMULA: key]
$$x(t + T) = x(t) \quad \forall t$$
[/FORMULA]

[P] Giá trị **nhỏ nhất** của $T$ thỏa mãn điều kiện này gọi là **chu kỳ cơ sở** $T_0$. Từ đó:
- **Tần số cơ sở**: $f_0 = \dfrac{1}{T_0}$ (Hz).
- **Tần số góc cơ sở**: $\omega_0 = 2\pi f_0 = \dfrac{2\pi}{T_0}$ (rad/s).
[FIG: 4.1] Tín hiệu sin tuần hoàn với chu kỳ cơ sở $T_0$. Mọi bội số nguyên của $T_0$ cũng là chu kỳ, nhưng chỉ $T_0$ mới là chu kỳ cơ sở (nhỏ nhất).

[BOX: analogy] **Ẩn dụ**: Hãy nghĩ chu kỳ là "nhịp tim" của tín hiệu. Một bài nhạc có nhịp 120 BPM (2 beat/giây) → chu kỳ cơ sở là 0.5 giây. Nhịp 240 BPM cũng là nhịp hợp lệ, nhưng nhịp 120 BPM là **chu kỳ cơ sở** vì nó nhỏ nhất. Khi tính công suất trung bình, ta chỉ cần lấy trung bình trên **một nhịp cơ sở** — các nhịp khác giống hệt.

### B.2. Tín hiệu tuần hoàn rời rạc

[P] Tín hiệu $x[n]$ là tuần hoàn nếu tồn tại **số nguyên dương** $N$ sao cho:
[FORMULA: key]
$$x[n + N] = x[n] \quad \forall n$$
[/FORMULA]

[P] Giá trị **nhỏ nhất** của $N$ gọi là **chu kỳ cơ sở** $N_0$. Tần số góc cơ sở:
$$\Omega_0 = \frac{2\pi}{N_0} \quad\text{(rad/mẫu)}$$

[BOX: warn] **Điểm khác biệt cốt lõi giữa liên tục và rời rạc**:

- **Liên tục**: $x(t) = A\cos(\omega t + \phi)$ **luôn tuần hoàn** với mọi $\omega \neq 0$ (vì $T = 2\pi/\omega$ luôn tồn tại và dương). Không có ngoại lệ.

- **Rời rạc**: $x[n] = A\cos(\Omega n + \phi)$ **chỉ tuần hoàn khi** $\dfrac{\Omega}{2\pi}$ là **số hữu tỉ**. Nếu $\dfrac{\Omega}{2\pi}$ vô tỉ, tín hiệu **không tuần hoàn** dù trông "giống sin".

Đây là điểm gây bất ngờ và hay bị hỏi trong đề thi. Nhớ kỹ!
[FIG: 4.2] Tín hiệu rời rạc $\cos(\Omega n)$ chỉ tuần hoàn khi $\Omega/(2\pi)$ hữu tỉ. Trên: $\Omega = \pi/4$ → tuần hoàn, $N_0 = 8$. Dưới: $\Omega = 1$ → vô tỉ → không tuần hoàn.

### B.3. Điều kiện tuần hoàn cho tín hiệu rời rạc — Công thức then chốt

[P] Cho $x[n] = A\cos(\Omega n + \phi)$ với $\Omega > 0$. Tín hiệu tuần hoàn khi và chỉ khi tồn tại số nguyên dương $N$ sao cho:
$$\Omega N = 2\pi m \quad\text{với } m \text{ nguyên dương}$$

[P] Tương đương:
[FORMULA: key]
$$\frac{\Omega}{2\pi} = \frac{m}{N}$$
[/FORMULA]

[P] Tức là **$\Omega/(2\pi)$ phải là số hữu tỉ** $\dfrac{m}{N}$ (dạng tối giản). Khi đó **chu kỳ cơ sở** là $N_0 = N$ (mẫu số của phân số tối giản).

[P] **Tại sao có điều kiện này?** Vì $n$ là số nguyên, $x[n+N] = \cos(\Omega(n+N)+\phi) = \cos(\Omega n + \Omega N + \phi)$. Để bằng $x[n]$, cần $\Omega N$ là bội nguyên của $2\pi$ — tức $\Omega N = 2\pi m$. Với $\Omega$ cố định, $N$ phải là số nguyên, $m$ cũng phải nguyên — điều này chỉ khả thi khi $\Omega/(2\pi)$ hữu tỉ.

[BOX: analogy] **Mẹo nhớ**: Hãy tưởng tượng bạn quay một vòng tròn. Liên tục: bạn có thể quay với bất kỳ tốc độ nào, luôn có "chu kỳ". Rời rạc: bạn chỉ **đặt chân** ở các điểm nguyên ($n=0,1,2,\dots$) — chỉ khi tốc độ quay là "số hữu tỉ so với $2\pi$" thì các điểm chân mới lặp lại. Với tốc độ vô tỉ, bạn không bao giờ giẫm lại đúng điểm cũ.

---

## Phần C. Phương pháp xác định chu kỳ — Bốn trường hợp

### C.1. Trường hợp 1 — Tín hiệu sin/cos đơn

[P] **Liên tục** $x(t) = A\cos(\omega t + \phi)$: $T_0 = 2\pi/\omega$ luôn.

[P] **Rời rạc** $x[n] = A\cos(\Omega n + \phi)$: kiểm tra $\Omega/(2\pi)$ có hữu tỉ không:
- Nếu hữu tỉ $= m/N$ (tối giản): tuần hoàn, $N_0 = N$, $\Omega_0 = 2\pi/N$.
- Nếu vô tỉ: **không tuần hoàn**.

[P] **Ví dụ**:
- $x[n] = \cos(\pi n/4)$: $\Omega/(2\pi) = (1/8)$ → hữu tỉ → $N_0 = 8$.
- $x[n] = \cos(n)$: $\Omega/(2\pi) = 1/(2\pi)$ → vô tỉ → **không tuần hoàn**.
- $x[n] = \cos(2\pi n/3)$: $\Omega/(2\pi) = 1/3$ → hữu tỉ → $N_0 = 3$.

### C.2. Trường hợp 2 — Tổng các tín hiệu tuần hoàn

[P] Cho $x(t) = x_1(t) + x_2(t)$ với $x_1$ tuần hoàn chu kỳ $T_1$, $x_2$ tuần hoàn chu kỳ $T_2$.

[BOX: warn] **Quy tắc vàng**: Tổng **tuần hoàn khi và chỉ khi** $\dfrac{T_1}{T_2}$ là số **hữu tỉ**. Khi đó chu kỳ cơ sở $T_0 = m_1 T_1 = m_2 T_2$, với $m_1, m_2$ là số nguyên dương nhỏ nhất thỏa $m_1 T_1 = m_2 T_2$.

[P] Nếu $\dfrac{T_1}{T_2}$ **vô tỉ** → tổng **không tuần hoàn**. Đây là lý do $\cos t + \sin(\sqrt{2}t)$ **không tuần hoàn** dù mỗi phần đều tuần hoàn riêng lẻ!

[P] **Cách tính $m_1, m_2$**: Viết $T_1/T_2$ dưới dạng phân số tối giản $p/q$. Khi đó $m_1 = q$, $m_2 = p$, $T_0 = q T_1 = p T_2$.

[P] **Ví dụ**: $x(t) = \cos(\pi t/3) + \sin(\pi t/4)$.
- $T_1 = 2\pi/(\pi/3) = 6$, $T_2 = 2\pi/(\pi/4) = 8$.
- $T_1/T_2 = 6/8 = 3/4$ → hữu tỉ, tối giản $p/q = 3/4$.
- $m_1 = 4$, $m_2 = 3$, $T_0 = 4\cdot 6 = 3\cdot 8 = 24$.
- Chu kỳ cơ sở: $T_0 = 24$.

[P] **Với rời rạc**: Tương tự nhưng cần cả hai tín hiệu đều tuần hoàn. Nếu một trong hai không tuần hoàn → tổng không tuần hoàn. Nếu cả hai tuần hoàn với chu kỳ $N_1, N_2$ → chu kỳ tổng là $\text{lcm}(N_1, N_2)$.

[BOX: analogy] **Mẹo kiểm tra nhanh tính hữu tỉ**: Đưa $T_1/T_2$ về dạng có $\pi$ hoặc $\sqrt{}$ — nếu $\pi$ hoặc căn **không triệt tiêu**, thì vô tỉ → không tuần hoàn. Cụ thể:
- $T_1/T_2 = 2\pi/(5\pi) = 2/5$ → hữu tỉ (có $\pi$ cả trên và dưới).
- $T_1/T_2 = 2\pi/1 = 2\pi$ → vô tỉ (mẫu không có $\pi$).
- $T_1/T_2 = 3/\sqrt{2}$ → vô tỉ.

### C.3. Trường hợp 3 — Tích với chuỗi xung

[P] Đây là dạng xuất hiện trong đề bài (Câu 3, 6, 7). Cụ thể: $x(t) = f(t)\cdot \sum_k \delta(t - kT_s)$, trong đó $f(t)$ là tín hiệu tuần hoàn chu kỳ $T_f$, và chuỗi xung có chu kỳ $T_s$.

[P] **Điều kiện tuần hoàn**:
- $f(t)$ phải tuần hoàn (điều kiện 1).
- $\dfrac{T_f}{T_s}$ phải là số **hữu tỉ** (điều kiện 2).

[P] **Khi cả hai thỏa**: chu kỳ cơ sở là bội chung nhỏ nhất "theo nghĩa hữu tỉ", tức là $T_0$ nhỏ nhất thỏa $T_0 = m\cdot T_f = n\cdot T_s$ với $m, n$ nguyên dương.

[P] **Cách tính nhanh**: Viết $\dfrac{T_f}{T_s} = \dfrac{p}{q}$ (tối giản). Khi đó $T_0 = q\cdot T_f = p\cdot T_s$.

[BOX: warn] **Tại sao có điều kiện hữu tỉ?** Vì tích $f(t)\cdot\sum\delta(t-kT_s)$ tại các thời điểm xung phải "khớp" với chu kỳ của $f$. Nếu chu kỳ của $f$ và chu kỳ xung không hài hòa (tỉ lệ vô tỉ), thì sau một chu kỳ xung, giá trị của $f$ lại rơi vào pha khác → tích không lặp lại được.

[P] **Ví dụ** (tương tự Câu 3): $x(t) = \cos(\pi t/2)\cdot\sum_k\delta(t-3k)$.
- $T_f = 2\pi/(\pi/2) = 4$ (chu kỳ của cos).
- $T_s = 3$ (chu kỳ chuỗi xung).
- $T_f/T_s = 4/3$ → hữu tỉ, tối giản $p/q = 4/3$.
- $T_0 = q T_f = 3\cdot 4 = 12$. (Hoặc $T_0 = p T_s = 4\cdot 3 = 12$ — khớp!)

### C.4. Trường hợp 4 — Tín hiệu phức mũ

[P] Tín hiệu $x[n] = e^{j\Omega n}$ hoặc $x[n] = z^n$ (với $z$ phức, $z = re^{j\Omega}$).

[P] **Điều kiện tuần hoàn**: $\dfrac{\Omega}{2\pi}$ phải hữu tỉ.

[P] **Chu kỳ cơ sở**: Nếu $\dfrac{\Omega}{2\pi} = \dfrac{m}{N}$ tối giản, thì $N_0 = N$.

[P] **Ví dụ** (tương tự Câu 9): $x[n] = j^{3n}$.
- Viết $j = e^{j\pi/2}$, nên $j^{3n} = e^{j3\pi n/2}$.
- $\Omega = 3\pi/2$. $\dfrac{\Omega}{2\pi} = \dfrac{3}{4}$ → tối giản $m/N = 3/4$.
- $N_0 = 4$. Đây là chu kỳ cơ sở.

[BOX: analogy] **Cách nhớ nhanh với $j^{kn}$**: Chu kỳ của $j^n$ là 4 (vì $j^4 = 1$). Với $j^{3n}$, hệ số 3 "quay nhanh gấp 3 lần", nhưng chu kỳ vẫn là 4 (vì $3\cdot 4 = 12 \equiv 0 \pmod 4$). Nói chung, $j^{kn}$ có chu kỳ $4/\gcd(k,4)$. Với $k=3$: $\gcd(3,4)=1$ → chu kỳ 4.

---

## Phần D. Các bẫy thi

[BOX: warn] **5 bẫy phổ biến**:

1. **Nhầm tín hiệu rời rạc sin luôn tuần hoàn**: Chỉ tuần hoàn khi $\Omega/(2\pi)$ hữu tỉ. $\cos(n)$, $\cos(\sqrt{2}n)$, $\cos(en)$ đều **không** tuần hoàn.

2. **Nhầm tổng hai tuần hoàn luôn tuần hoàn**: Chỉ khi tỉ số chu kỳ hữu tỉ. $\cos t + \sin(\sqrt{2}t)$ **không** tuần hoàn.

3. **Quên điều kiện hữu tỉ trong tích với chuỗi xung**: Tích có thể không tuần hoàn dù cả hai nhân tử đều tuần hoàn.

4. **Nhầm "chu kỳ cơ sở" với "chu kỳ"**: Chu kỳ cơ sở là **nhỏ nhất**. $x(t) = \cos(2\pi t)$ có chu kỳ $T = 1$, $T = 2$, $T = 3$… nhưng **chu kỳ cơ sở** là 1.

5. **Nhầm đơn vị tần số góc**: Liên tục dùng $\omega_0$ (rad/s), rời rạc dùng $\Omega_0$ (rad/mẫu). Đề bài thường yêu cầu ghi rõ đơn vị — đừng bỏ qua.

[H3] Câu 1. $x(t) = 2\cos(t) - \sin(5\pi t)$

[P] **Đề**: Xác định chu kỳ cơ sở (điền 0 nếu không tuần hoàn).

**Lời giải**

[STEPS]
1. **Xác định chu kỳ từng thành phần**:
   - $2\cos(t)$: $\omega_1 = 1$ → $T_1 = 2\pi/1 = 2\pi$.
   - $\sin(5\pi t)$: $\omega_2 = 5\pi$ → $T_2 = 2\pi/(5\pi) = 2/5$.
2. **Kiểm tra tỉ số**:
   $$\frac{T_1}{T_2} = \frac{2\pi}{2/5} = 5\pi$$
   $5\pi$ là **số vô tỉ** → **không tuần hoàn**.
3. Kết luận: Đáp án 0.
[/STEPS]

[BOX: analogy] **Trực giác**: $\cos t$ có chu kỳ "dài" $2\pi \approx 6.28$, còn $\sin(5\pi t)$ có chu kỳ "ngắn" $2/5 = 0.4$. Tỉ lệ là $5\pi \approx 15.7$ — không phải số nguyên. Vậy sau 15.7 chu kỳ của $\sin$, $\cos$ mới trở lại pha ban đầu — không bao giờ có chu kỳ chung.

[ANS] **Đáp án: 0** (không tuần hoàn).

---

[H3] Câu 2. $x[n] = \cos(\pi n) - \cos(2n + \pi/3)$

[P] **Đề**: Xác định chu kỳ cơ sở.

**Lời giải**

[STEPS]
1. **Thành phần 1**: $\cos(\pi n)$ có $\Omega_1 = \pi$. $\dfrac{\Omega_1}{2\pi} = \dfrac{1}{2}$ → hữu tỉ → tuần hoàn, $N_1 = 2$.
2. **Thành phần 2**: $\cos(2n + \pi/3)$ có $\Omega_2 = 2$. $\dfrac{\Omega_2}{2\pi} = \dfrac{1}{\pi}$ → **vô tỉ** → **không tuần hoàn**.
3. **Kết luận**: Tổng của một tuần hoàn và một không tuần hoàn → **không tuần hoàn**.
[/STEPS]

[BOX: warn] **Tại sao $\cos(2n)$ không tuần hoàn?** Vì để $x[n+N] = x[n]$, cần $2N = 2\pi m$ → $N = \pi m$. Không có $N$ nguyên thỏa mãn (vì $\pi$ vô tỉ). Bạn có thể kiểm tra bằng tay: $\cos(0) = 1$, $\cos(2) \approx -0.416$, $\cos(4) \approx -0.654$, $\cos(6) \approx 0.960$… không có mẫu nào bằng 1 lại.

[ANS] **Đáp án: 0** (không tuần hoàn).

---

[H3] Câu 3. $x(t) = \cos(\pi t/2)\cdot\sum_{k}\delta(t-3k)$

[P] **Đề**: Xác định chu kỳ cơ sở $T$.

**Lời giải**

[STEPS]
1. **Chu kỳ của $\cos(\pi t/2)$**: $\omega = \pi/2$ → $T_f = 2\pi/(\pi/2) = 4$.
2. **Chu kỳ của chuỗi xung**: $\sum_k\delta(t-3k)$ có các xung cách nhau $3$ → $T_s = 3$.
3. **Kiểm tra tỉ số**: $\dfrac{T_f}{T_s} = \dfrac{4}{3}$ → hữu tỉ, tối giản $p/q = 4/3$.
4. **Tính chu kỳ chung**: $T_0 = q\cdot T_f = 3\cdot 4 = 12$. (Hoặc $T_0 = p\cdot T_s = 4\cdot 3 = 12$ — khớp.)
[/STEPS]

[ANS] **Đáp án: $T = 12$**.

---

[H3] Câu 4. $x[n] = \sin(n) + \cos(n)$ (dạng đọc từ đề)

[P] **Đề**: Tính tần số góc cơ sở $\Omega_0$ (điền 0 nếu không tuần hoàn).

**Lời giải**

[STEPS]
1. **Xác định $\Omega$**: Cả hai thành phần đều có $\Omega = 1$ (hệ số của $n$ là 1).
2. **Kiểm tra điều kiện hữu tỉ**: $\dfrac{\Omega}{2\pi} = \dfrac{1}{2\pi}$ → **vô tỉ** → **không tuần hoàn**.
3. **Kết luận**: Vì không tuần hoàn, $\Omega_0 = 0$ theo quy ước của đề.
[/STEPS]

[BOX: warn] **Lưu ý**: Đề bài có thể bị lỗi in ấn (mất ký hiệu $\pi$ hoặc mẫu số). Nếu đề gốc là $x[n] = \sin(\frac{\pi}{3}n) + \cos(\frac{\pi}{3}n)$ chẳng hạn, thì $\Omega = \pi/3$, $\Omega/(2\pi) = 1/6$ → tuần hoàn, $N_0 = 6$, $\Omega_0 = \pi/3 \approx 1.05$. Nhưng với nội dung ghi "$\sin(1\cdot n) + \cos(1\cdot n)$", đáp án là **0**. Khi đi thi, hãy đọc kỹ đề — nếu thấy hệ số không có $\pi$, khả năng cao là **không tuần hoàn**.

[ANS] **Đáp án: 0** (theo diễn giải văn bản đề cho).

---

[H3] Câu 5. $x[n] = \sin(\pi n) + \cos(\pi n)$

[P] **Đề**: Tính tần số góc cơ sở $\Omega_0$ (rad/mẫu).

**Lời giải**

[STEPS]
1. **Xác định $\Omega$**: Cả hai thành phần đều có $\Omega = \pi$.
2. **Điều kiện hữu tỉ**: $\dfrac{\Omega}{2\pi} = \dfrac{1}{2}$ → hữu tỉ, tối giản $m/N = 1/2$.
3. **Chu kỳ cơ sở**: $N_0 = 2$.
4. **Tần số góc cơ sở**: $\Omega_0 = \dfrac{2\pi}{N_0} = \dfrac{2\pi}{2} = \pi \approx 3.14$ rad/mẫu.
[/STEPS]

[BOX: warn] **Kiểm tra**: $\sin(\pi n)$ có giá trị: $n=0$: 0, $n=1$: 0, $n=2$: 0… luôn bằng 0. $\cos(\pi n)$: $n=0$: 1, $n=1$: -1, $n=2$: 1, $n=3$: -1… chu kỳ 2. Tổng: $n=0$: 1, $n=1$: -1, $n=2$: 1… chu kỳ 2. ✓

[ANS] **Đáp án: $\Omega_0 = \pi \approx 3.14$ rad/mẫu**.

---

[H3] Câu 6. $x(t) = \sum_{k}[\delta(t - \frac{3}{4}k) + \delta(t + 2k)]$

[P] **Đề**: Tính tần số góc cơ sở $\omega_0$ (rad/s).

**Lời giải**

[STEPS]
1. **Chu kỳ thành phần 1**: $\delta(t - \frac{3}{4}k)$ có xung cách nhau $\frac{3}{4}$ → $T_1 = \frac{3}{4}$.
2. **Chu kỳ thành phần 2**: $\delta(t + 2k) = \delta(t - (-2k))$ có xung cách nhau $2$ → $T_2 = 2$.
3. **Kiểm tra tỉ số**: $\dfrac{T_1}{T_2} = \dfrac{3/4}{2} = \dfrac{3}{8}$ → hữu tỉ, tối giản $p/q = 3/8$.
4. **Chu kỳ chung**: $T_0 = q T_1 = 8 \cdot \frac{3}{4} = 6$ (hoặc $T_0 = p T_2 = 3\cdot 2 = 6$ — khớp).
5. **Tần số góc cơ sở**: $\omega_0 = \dfrac{2\pi}{T_0} = \dfrac{2\pi}{6} = \dfrac{\pi}{3} \approx 1.05$ rad/s.
[/STEPS]

[ANS] **Đáp án: $\omega_0 = \pi/3 \approx 1.05$ rad/s**.

---

[H3] Câu 7. $x(t) = \cos(2t)\cdot\sum_{k}\delta(t-k)$

[P] **Đề**: Tính tần số góc cơ sở $\omega_0$ (rad/s).

**Lời giải**

[STEPS]
1. **Chu kỳ $\cos(2t)$**: $\omega = 2$ → $T_f = 2\pi/2 = \pi$.
2. **Chu kỳ chuỗi xung**: xung cách nhau $1$ → $T_s = 1$.
3. **Kiểm tra tỉ số**: $\dfrac{T_f}{T_s} = \dfrac{\pi}{1} = \pi$ → **vô tỉ** → **không tuần hoàn**.
4. **Kết luận**: $\omega_0 = 0$ (không tuần hoàn).
[/STEPS]

[BOX: analogy] **Trực giác**: $\cos(2t)$ có chu kỳ $\pi \approx 3.14$, còn xung có chu kỳ $1$. Sau mỗi chu kỳ xung, giá trị của cos tại vị trí xung thay đổi liên tục (vì $\pi$ không phải bội số nguyên của 1). Tích không bao giờ lặp lại hoàn toàn.

[ANS] **Đáp án: 0** (không tuần hoàn).

---

[H3] Câu 8. $x[n] = \sum_{k}(\delta[n-2k] + \delta[n+(-1)^k])$

[P] **Đề**: Tính $\Omega_0$ (rad/mẫu).

[P] **Phân tích đề**: Có thể có lỗi in ấn ($(-1)^k$ hay $(-1)k$?). Ta xét cả hai khả năng.

**Diễn giải 1**: $(-1)^k$ là lũy thừa.
- $\delta[n+(-1)^k]$: xung tại $n = -(-1)^k$.
  - $k$ chẵn: $n = -1$.
  - $k$ lẻ: $n = 1$.
- Tổng: xung tại $n=2k$ (mọi $k$ nguyên) + xung "trùng" tại $n=\pm 1$ (vô số lần).
- Vấn đề: xung tại $n=\pm 1$ lặp vô số lần → không xác định. Đây là **lỗi đề**.

**Diễn giải 2**: $(-1)k$ là phép nhân (dấu trừ trước $k$).
- $\delta[n+(-1)k] = \delta[n-k]$: xung tại mọi số nguyên $k$ → chuỗi xung toàn trục số, chu kỳ 1.
- Tổng với $\delta[n-2k]$ (xung tại $n$ chẵn, chu kỳ 2): hợp lại thành xung tại **mọi số nguyên**, chu kỳ 1.
- $\Omega_0 = 2\pi/1 = 2\pi \approx 6.28$.

**Diễn giải 3**: Đề gốc có thể là $\delta[n - 2k] + \delta[n + (-1)^k \cdot k]$... (quá suy diễn).

[BOX: warn] **Kết luận thực tế**: Với đề ghi như trên, cả hai diễn giải đều dẫn đến kết quả không rõ ràng hoặc cần thêm giả thiết. **Hướng đi hợp lý nhất khi đi thi**: đọc kỹ đề, nếu thấy dạng $(-1)^k$ thì hiểu là lũy thừa, dẫn đến mâu thuẫn → có thể đề muốn hỏi "tín hiệu có tuần hoàn không" và đáp án là **không** (vì vô số xung tại $n=\pm 1$ không tuần hoàn theo nghĩa thông thường).

[ANS] **Đáp án đề xuất: 0** (không tuần hoàn theo nghĩa chặt). Nếu giả sử đề gốc là $\delta[n-2k] + \delta[n-k]$ thì đáp án là **$2\pi \approx 6.28$**. Bạn cần đọc kỹ đề gốc khi đi thi.

---

[H3] Câu 9. $x[n] = j^{3n}$

[P] **Đề**: Tính chu kỳ cơ sở $N$ (mẫu).

**Lời giải**

[STEPS]
1. **Viết lại dưới dạng mũ phức**: $j = e^{j\pi/2}$, nên $j^{3n} = (e^{j\pi/2})^{3n} = e^{j3\pi n/2}$.
2. **Xác định $\Omega$**: $\Omega = \dfrac{3\pi}{2}$.
3. **Điều kiện hữu tỉ**: $\dfrac{\Omega}{2\pi} = \dfrac{3\pi/2}{2\pi} = \dfrac{3}{4}$ → tối giản $m/N = 3/4$.
4. **Chu kỳ cơ sở**: $N_0 = N = 4$.
5. **Kiểm tra bằng tay**:
   - $n=0$: $j^0 = 1$.
   - $n=1$: $j^3 = -j$.
   - $n=2$: $j^6 = -1$.
   - $n=3$: $j^9 = j$.
   - $n=4$: $j^{12} = (j^4)^3 = 1$ → lặp lại.
   Chu kỳ 4. ✓
[/STEPS]

[ANS] **Đáp án: $N = 4$**.

---

[SECTION: bai4-summary]

[H2] Tổng kết Bài 4

[BOX] **Bảng tổng hợp 9 câu**:

| Câu | Tín hiệu | Kết quả |
|---|---|---|
| 1 | $2\cos(t) - \sin(5\pi t)$ | 0 (không tuần hoàn) |
| 2 | $\cos(\pi n) - \cos(2n+\pi/3)$ | 0 (không tuần hoàn) |
| 3 | $\cos(\pi t/2)\cdot\sum\delta(t-3k)$ | $T = 12$ |
| 4 | $\sin(n) + \cos(n)$ | 0 (không tuần hoàn) |
| 5 | $\sin(\pi n) + \cos(\pi n)$ | $\Omega_0 = \pi \approx 3.14$ |
| 6 | $\sum[\delta(t-3k/4) + \delta(t+2k)]$ | $\omega_0 = \pi/3 \approx 1.05$ |
| 7 | $\cos(2t)\cdot\sum\delta(t-k)$ | 0 (không tuần hoàn) |
| 8 | $\sum(\delta[n-2k] + \delta[n+(-1)^k])$ | 0 (hoặc $2\pi$ nếu đề khác) |
| 9 | $j^{3n}$ | $N = 4$ |

[BOX: warn] **5 bẫy thi rút ra**:

1. **Tín hiệu sin rời rạc không luôn tuần hoàn** — chỉ khi $\Omega/(2\pi)$ hữu tỉ (Câu 2, 4).
2. **Tổng hai tuần hoàn không luôn tuần hoàn** — chỉ khi tỉ số chu kỳ hữu tỉ (Câu 1, 2).
3. **Tích với chuỗi xung cũng cần điều kiện hữu tỉ** — $T_f/T_s$ phải hữu tỉ (Câu 3 vs Câu 7).
4. **Chu kỳ cơ sở là chu kỳ NHỎ NHẤT**, không phải bất kỳ chu kỳ nào (Câu 9: chu kỳ 4, không phải 8 hay 12).
5. **Nhầm $\omega_0$ (liên tục, rad/s) với $\Omega_0$ (rời rạc, rad/mẫu)** — đơn vị khác nhau.

[BOX] **Công thức cần nhớ**:
- **Liên tục**: $x(t) = A\cos(\omega t + \phi)$ tuần hoàn, $T_0 = 2\pi/\omega$.
- **Rời rạc**: $x[n] = A\cos(\Omega n + \phi)$ tuần hoàn **khi và chỉ khi** $\Omega/(2\pi) = m/N$ hữu tỉ, $N_0 = N$.
- **Tổng các tuần hoàn**: $T_0 = q T_1 = p T_2$ với $T_1/T_2 = p/q$ tối giản.
- **Tích với chuỗi xung**: $T_0$ là bội chung nhỏ nhất (hữu tỉ) của $T_f$ và $T_s$.
- **Tín hiệu mũ phức**: $\Omega = k\pi/m$ → $N_0 = 2m$; $\Omega = k\pi/m$ với $\gcd(k,m)=1$ → $N_0 = 2m/\gcd(k,2)$.

[BOX: analogy] **Câu thần chú cuối bài**: *"Liên tục: sin luôn tuần hoàn, chu kỳ $2\pi/\omega$. Rời rạc: chỉ tuần hoàn khi $\Omega/(2\pi)$ hữu tỉ — đây là điểm khác biệt cốt lõi. Tổng: chỉ tuần hoàn khi tỉ số chu kỳ hữu tỉ. Tích: cũng cần tỉ số hữu tỉ. Chu kỳ cơ sở là chu kỳ nhỏ nhất — đừng nhầm với bất kỳ chu kỳ nào."*

# BÀI 5 (BẢN ĐẦY ĐỦ): PHƯƠNG TRÌNH VI PHÂN / SAI PHÂN

[SECTION: bai5-overview]

[H2] Bài 5. Phương trình vi phân / sai phân — Giải và tìm đáp ứng

---

## Phần A. Động cơ — Tại sao phải học giải phương trình vi/sai phân?

[BRIDGE] Ở Bài 1, bạn đã biết một hệ thống có thể được mô tả bằng **đáp ứng xung** $h(t)$ hoặc bằng **phương trình vi phân** (liên tục) / **phương trình sai phân** (rời rạc). Bài này dạy bạn cách **giải** các phương trình đó để tìm đầu ra $y(t)$ khi biết đầu vào $x(t)$ và điều kiện ban đầu.

[P] **Tại sao cần học?** Vì trong thực tế, hầu hết các hệ thống vật lý (mạch điện, cơ khí, nhiệt, sinh học) đều được mô tả bởi phương trình vi phân. Ví dụ:
- Mạch RLC: $LC\frac{d^2v}{dt^2} + RC\frac{dv}{dt} + v = v_s(t)$.
- Hệ lò xo - vật nặng: $M\frac{d^2x}{dt^2} + b\frac{dx}{dt} + kx = F(t)$.
- Hệ thống số (bộ lọc số): $y[n] - 0.5y[n-1] = x[n]$.

[P] **Trong đề thi**, bài tập dạng này chiếm tỉ trọng lớn vì nó kiểm tra:
- Khả năng giải phương trình đặc trưng.
- Hiểu khái niệm **đáp ứng tự nhiên** (natural response) và **đáp ứng cưỡng bách** (forced response).
- Xử lý điều kiện ban đầu.
- Nhận diện **cộng hưởng** (resonance) — trường hợp đặc biệt quan trọng.

[BOX: analogy] **Ẩn dụ**: Hãy tưởng tượng một chiếc xe đạp đang chạy. Khi bạn ngừng đạp (không có input), xe vẫn tiếp tục chạy chậm dần rồi dừng hẳn — đó là **đáp ứng tự nhiên** (do quán tính và ma sát, không do input). Khi bạn đạp (có input), xe chạy theo lực đạp của bạn — đó là **đáp ứng cưỡng bách**. Tổng hai đáp ứng là chuyển động thực của xe. Phương trình vi phân mô tả cả hai thành phần này.

---

## Phần B. Dạng tổng quát và nghiệm

### B.1. Dạng tổng quát

[P] Hệ thống LTI liên tục được mô tả bởi **phương trình vi phân tuyến tính hệ số hằng**:
[FORMULA: key]
$$\sum_{i=0}^{N} a_i \frac{d^i y(t)}{dt^i} = \sum_{j=0}^{M} b_j \frac{d^j x(t)}{dt^j}$$
[/FORMULA]

[P] Hệ thống LTI rời rạc được mô tả bởi **phương trình sai phân tuyến tính hệ số hằng**:
$$\sum_{k=0}^{N} a_k y[n-k] = \sum_{k=0}^{M} b_k x[n-k]$$

[P] Trong đó $x(t)$ (hoặc $x[n]$) là tín hiệu vào, $y(t)$ (hoặc $y[n]$) là tín hiệu ra.

[BOX: warn] **Lưu ý**: "Tuyến tính hệ số hằng" là điều kiện tiên quyết. Nếu phương trình có hệ số phụ thuộc $t$ (như $t\cdot y'$) hoặc có số hạng phi tuyến (như $y^2$, $\sin y$), phương pháp giải trong bài này **không áp dụng được**.

### B.2. Cấu trúc nghiệm — Đáp ứng tự nhiên + Đáp ứng cưỡng bách

[P] Nghiệm tổng quát của phương trình vi/sai phân tuyến tính hệ số hằng có dạng:
[FORMULA: key]
$$y(t) = y_0(t) + y_s(t) \qquad y[n] = y_0[n] + y_s[n]$$
[/FORMULA]

[P] Trong đó:
- $y_0(t)$ (hoặc $y_0[n]$): **Đáp ứng tự nhiên** (natural response), còn gọi là **nghiệm thuần nhất** (homogeneous solution). Đây là nghiệm của phương trình **thuần nhất** (vế phải = 0). Nó mô tả hành vi của hệ thống **khi không có input**, chỉ do điều kiện ban đầu.
- $y_s(t)$ (hoặc $y_s[n]$): **Đáp ứng cưỡng bách** (forced response), còn gọi là **nghiệm riêng** (particular solution). Đây là nghiệm của phương trình **đầy đủ** (có vế phải). Nó mô tả hành vi của hệ thống **do input gây ra**.

[BOX: analogy] **Tại sao cộng hai nghiệm?** Vì phương trình vi/sai phân tuyến tính có tính **xếp chồng**. Nếu $y_0$ thỏa vế trái = 0 và $y_s$ thỏa vế trái = vế phải, thì $y_0 + y_s$ thỏa vế trái = 0 + vế phải = vế phải. Vậy tổng là nghiệm tổng quát. Trong thực tế, $y_0$ mô tả "phản ứng riêng" của hệ thống (như dao động tắt dần), $y_s$ mô tả "phản ứng với input" (như dao động cưỡng bức).
[FIG: 5.1] Đáp ứng tổng $y = y_0 + y_s$. Trên: không cộng hưởng. Dưới: cộng hưởng — input trùng nghiệm đặc trưng nên $y_s$ có thêm nhân tử $t$.

---

## Phần C. Cách tìm đáp ứng tự nhiên $y_0$

### C.1. Phương trình đặc trưng

[P] Để tìm $y_0$, giải phương trình thuần nhất (vế phải = 0). Giả sử nghiệm có dạng $y_0(t) = e^{st}$ (liên tục) hoặc $y_0[n] = z^n$ (rời rạc), thay vào phương trình thuần nhất, được **phương trình đặc trưng**:

[FORMULA: key]
**Liên tục**: $\sum_{i=0}^{N} a_i s^i = 0$ (đa thức bậc $N$ theo $s$)

**Rời rạc**: $\sum_{k=0}^{N} a_k z^{N-k} = 0$ (đa thức bậc $N$ theo $z$)
[/FORMULA]

[P] Gọi các nghiệm của phương trình đặc trưng là $s_1, s_2, \ldots, s_N$ (hoặc $z_1, z_2, \ldots, z_N$).

### C.2. Ba trường hợp nghiệm

**Trường hợp 1: Nghiệm đơn, phân biệt**

[P] Nếu tất cả $s_k$ (hoặc $z_k$) **phân biệt**:
[FORMULA: key]
$$y_0(t) = \sum_{k=1}^{N} c_k e^{s_k t} \qquad y_0[n] = \sum_{k=1}^{N} c_k z_k^n$$
[/FORMULA]
[P] Các hằng số $c_k$ được xác định từ **điều kiện ban đầu**.

**Trường hợp 2: Nghiệm bội**

[P] Nếu $s_k$ là nghiệm **bội $p$** (xuất hiện $p$ lần), thì các số hạng tương ứng là:
$$c_1 e^{s_k t} + c_2 t e^{s_k t} + \ldots + c_p t^{p-1} e^{s_k t}$$

[P] Tức là nhân thêm $t, t^2, \ldots, t^{p-1}$.

**Trường hợp 3: Nghiệm phức**

[P] Nếu $s = \sigma \pm j\omega$ (cặp liên hợp phức), thì có thể viết:
$$y_0(t) = e^{\sigma t}(A\cos\omega t + B\sin\omega t)$$

[BOX: analogy] **Mẹo nhớ**: Phương trình đặc trưng giống như "tìm tần số riêng" của hệ thống. Ví dụ, con lắc đơn có tần số riêng $\omega_0 = \sqrt{g/L}$ — đó là nghiệm phức $s = \pm j\omega_0$ của phương trình đặc trưng. Khi không có ma sát, con lắc dao động mãi với tần số đó — đó là $y_0$.

### C.3. Xác định hằng số từ điều kiện ban đầu

[P] Sau khi có dạng tổng quát của $y_0$, ta cần xác định $c_k$ từ **điều kiện ban đầu** (thường là $y(0), y'(0), \ldots$ hoặc $y[-1], y[-2], \ldots$).

[P] **Lưu ý quan trọng**: Điều kiện ban đầu được cho **trước khi có input** (tức là $t = 0^-$ hoặc $n < 0$). Đây là trạng thái tự nhiên của hệ thống khi chưa có kích thích.

[BOX: warn] **Phân biệt $0^-$ và $0^+$**: Đề bài thường cho $y(0^-)$ — trạng thái **ngay trước** khi input được áp. Nếu đề cho $y(0^+)$ — trạng thái **ngay sau** khi input được áp — cần cẩn thận vì có thể có bước nhảy do input xung. Trong bài này, hầu hết đề cho $0^-$ hoặc trạng thái nghỉ (zero state).

---

## Phần D. Cách tìm đáp ứng cưỡng bách $y_s$

### D.1. Nguyên tắc "thử dạng giống input"

[P] Đáp ứng cưỡng bách $y_s$ có **dạng giống với input** $x$ (vì hệ thống tuyến tính "bám" theo input). Cụ thể:

[TABLE]
| Input $x(t)$ | Dạng thử của $y_s(t)$ |
|---|---|
| Hằng số $C$ | $A$ (hằng số) |
| $t$ | $At + B$ |
| $t^n$ | $A_n t^n + \ldots + A_1 t + A_0$ |
| $e^{-at}$ | $A e^{-at}$ |
| $\cos(\omega t + \phi)$ | $A\cos(\omega t) + B\sin(\omega t)$ |
| $e^{-at}\cos(\omega t)$ | $e^{-at}(A\cos\omega t + B\sin\omega t)$ |
[/TABLE]

[P] Sau khi thử, thay vào phương trình đầy đủ, cân bằng hệ số hai vế, tìm $A, B, \ldots$

[BOX: warn] **Trường hợp đặc biệt — Cộng hưởng (resonance)**: Nếu dạng thử **trùng với một nghiệm của phương trình đặc trưng**, ta phải **nhân thêm $t$** (hoặc $n$). Ví dụ:
- Nếu $e^{-at}$ là nghiệm của phương trình thuần nhất, thì $y_s$ phải có dạng $A t e^{-at}$ (thay vì $A e^{-at}$).
- Nếu trùng bội $p$, nhân thêm $t^p$.

[BOX: analogy] **Tại sao phải nhân thêm $t$?** Hãy tưởng tượng bạn đẩy một đứa trẻ trên xích đu. Nếu bạn đẩy **đúng tần số riêng** của xích đu, biên độ dao động sẽ **tăng dần** (cộng hưởng) — đó là hiện tượng nhân thêm $t$. Nếu bạn đẩy **sai tần số**, xích đu dao động theo tần số của bạn (không tăng) — đó là trường hợp thường. Cộng hưởng nguy hiểm vì biên độ tăng vô hạn (trong lý thuyết).

### D.2. Quy trình 4 bước

[STEPS]
1. **Bước 1 — Giải phương trình đặc trưng** để tìm nghiệm $s_k$ (hoặc $z_k$).
2. **Bước 2 — Thử dạng $y_s$** dựa trên bảng trên, kiểm tra cộng hưởng, nhân thêm $t$ (hoặc $n$) nếu cần.
3. **Bước 3 — Thay $y_s$ vào phương trình đầy đủ**, cân bằng hệ số hai vế, giải ra các hằng số.
4. **Bước 4 — Cộng $y_0 + y_s$**, dùng điều kiện ban đầu để xác định hằng số trong $y_0$.
[/STEPS]

---

## Phần E. Ví dụ chi tiết từng bước

### E.1. Ví dụ liên tục — Không cộng hưởng

[P] **Đề**: Giải $1000\frac{dy}{dt} + 300y = x(t)$ với $x(t) = 5000e^{-2t}u(t)$.

**Bước 1 — Phương trình đặc trưng**:
$$1000s + 300 = 0 \Rightarrow s = -0.3$$
Vậy $y_0(t) = A e^{-0.3t}$.

**Bước 2 — Thử $y_s$**: Input $e^{-2t}$, không trùng nghiệm $e^{-0.3t}$ → thử $y_s = C e^{-2t}$.

**Bước 3 — Thay vào**:
$$1000(-2)Ce^{-2t} + 300Ce^{-2t} = 5000e^{-2t}$$
$$(-2000 + 300)C = 5000 \Rightarrow C = -\frac{5000}{1700} = -2.941$$
Vậy $y_s(t) = -2.941e^{-2t}$.

**Bước 4 — Nghiệm tổng quát**:
$$y(t) = A e^{-0.3t} - 2.941e^{-2t}$$
Nếu có điều kiện ban đầu $y(0) = y_0$, thì $A - 2.941 = y_0$ → $A = y_0 + 2.941$.

[ANS] **Kết quả**: $y(t) = [A e^{-0.3t} - 2.941e^{-2t}]u(t)$ với $A$ xác định từ điều kiện ban đầu.

### E.2. Ví dụ rời rạc — Không cộng hưởng

[P] **Đề**: Giải $y[n] + 0.5y[n-1] = x[n]$ với $x[n] = (-0.8)^n u[n]$, trạng thái nghỉ $y[-1] = 0$.

**Bước 1 — Phương trình đặc trưng**:
$$z + 0.5 = 0 \Rightarrow z = -0.5$$
Vậy $y_0[n] = B(-0.5)^n$.

**Bước 2 — Thử $y_s$**: Input $(-0.8)^n$, không trùng $(-0.5)^n$ → thử $y_s = A(-0.8)^n$.

**Bước 3 — Thay vào**:
$$A(-0.8)^n + 0.5A(-0.8)^{n-1} = (-0.8)^n$$
$$A[1 + 0.5(-0.8)^{-1}] = 1 \Rightarrow A = \frac{1}{1 - 0.625} = \frac{1}{0.375} = \frac{8}{3}$$
Vậy $y_s[n] = \frac{8}{3}(-0.8)^n$.

**Bước 4 — Nghiệm tổng quát**:
$$y[n] = B(-0.5)^n + \frac{8}{3}(-0.8)^n$$
Xác định $B$ từ $y[0]$. Từ phương trình gốc: $y[0] = -0.5y[-1] + x[0] = 0 + 1 = 1$.
Vậy $B + 8/3 = 1 \Rightarrow B = -5/3$.

[ANS] **Kết quả**: $y[n] = [-\frac{5}{3}(-0.5)^n + \frac{8}{3}(-0.8)^n]u[n]$.

### E.3. Ví dụ cộng hưởng — Trường hợp quan trọng

[P] **Đề**: Giải $y[n] - 4y[n-2] = x[n]$ với $x[n] = 2^{-n}u[n]$.

**Bước 1 — Phương trình đặc trưng**:
$$z^2 - 4 = 0 \Rightarrow z = \pm 2$$
Vậy $y_0[n] = c_1 \cdot 2^n + c_2 \cdot (-2)^n$.

**Bước 2 — Thử $y_s$**: Input $2^{-n} = (1/2)^n$. Nghiệm đặc trưng là $2$ và $-2$, **không trùng** $1/2$ → thử $y_s = A(1/2)^n$.

**Bước 3 — Thay vào**:
$$A(1/2)^n - 4A(1/2)^{n-2} = (1/2)^n$$
$$A(1/2)^n - 4A \cdot 4 \cdot (1/2)^n = (1/2)^n$$
$$A(1 - 16) = 1 \Rightarrow A = -\frac{1}{15}$$
Vậy $y_s[n] = -\frac{1}{15}(1/2)^n = -\frac{1}{15}2^{-n}$.

[ANS] **Kết quả**: $y[n] = [c_1 2^n + c_2(-2)^n - \frac{1}{15}2^{-n}]u[n]$.

[BOX: warn] **Cẩn thận với ký hiệu**: $(1/2)^n = 2^{-n}$, nhưng $2^n$ là nghiệm đặc trưng. Đừng nhầm hai cái này! Trong ví dụ này, input là $2^{-n}$ (tắt dần), còn nghiệm đặc trưng là $2^n$ (tăng) — không trùng.

### E.4. Ví dụ cộng hưởng thực sự

[P] **Đề**: Giải $y[n] - 0.5y[n-1] = x[n]$ với $x[n] = (0.5)^n u[n]$.

**Bước 1 — Phương trình đặc trưng**:
$$z - 0.5 = 0 \Rightarrow z = 0.5$$
Vậy $y_0[n] = c_1(0.5)^n$.

**Bước 2 — Thử $y_s$**: Input $(0.5)^n$ **trùng** nghiệm đặc trưng → phải thử $y_s = A n (0.5)^n$.

**Bước 3 — Thay vào**:
$$An(0.5)^n - 0.5A(n-1)(0.5)^{n-1} = (0.5)^n$$
Chia hai vế cho $(0.5)^{n-1}$:
$$An(0.5) - 0.5A(n-1) = 0.5$$
$$0.5An - 0.5An + 0.5A = 0.5 \Rightarrow A = 1$$
Vậy $y_s[n] = n(0.5)^n$.

[ANS] **Kết quả**: $y[n] = [c_1(0.5)^n + n(0.5)^n]u[n]$.

[BOX: analogy] **Trực giác cộng hưởng**: Khi bạn đẩy xích đu đúng nhịp, mỗi lần đẩy **cộng dồn** vào biên độ. Sau $n$ lần đẩy, biên độ tỉ lệ với $n$. Đó là lý do xuất hiện nhân tử $n$ trong $y_s$. Trong mạch điện, cộng hưởng có thể gây ra điện áp tăng vọt — nguy hiểm cho linh kiện.

---

## Phần F. Các bẫy thi

[BOX: warn] **6 bẫy phổ biến**:

1. **Quên kiểm tra cộng hưởng**: Nếu input trùng nghiệm đặc trưng mà vẫn thử dạng thường → phương trình vô nghiệm (0 = 1). Phải nhân thêm $t$ (hoặc $n$).

2. **Nhầm $2^n$ và $2^{-n}$**: $(1/2)^n = 2^{-n}$ là **tắt dần**, khác với $2^n$ là **tăng dần**. Chỉ trùng khi input là $2^n$ (không phải $2^{-n}$).

3. **Nhầm $0^-$ và $0^+$**: Điều kiện ban đầu $y(0^-)$ là trạng thái trước khi có input. Khi áp input xung, có thể có bước nhảy.

4. **Quên nhân hệ số khi thay $y[n-k]$**: Ví dụ $y_s = A(1/2)^n$, khi thay vào $y[n-2]$ phải là $A(1/2)^{n-2} = 4A(1/2)^n$ (không phải $A(1/2)^n$).

5. **Nhầm nghiệm bội**: Nếu phương trình đặc trưng có nghiệm kép $z = 2$ (bội 2), thì $y_0 = (c_1 + c_2 n)2^n$, **không phải** $c_1 2^n + c_2 2^n$ (trùng nhau).

6. **Quên điều kiện $u[n]$ trong kết quả**: Kết quả cuối cùng phải nhân với $u[n]$ (hoặc $u(t)$) để chỉ ra tín hiệu bắt đầu từ $n=0$ (hoặc $t=0$).

### NHÓM 1: Xác định thành phần đáp ứng cưỡng bách

[H3] Câu 1. $4y[n] - y[n-2] = x[n]$, $x[n] = 2^{-n}u[n]$

[P] **Đề**: Phát biểu nào sau đây **KHÔNG ĐÚNG** về đáp ứng cưỡng bách $y_s[n]$?
- (a) $2^{-n}u[n]$ là một thành phần
- (b) $-2^{-n}u[n]$ là một thành phần
- (c) $n2^{-n}u[n]$ là một thành phần
- (d) $2^n u[n]$ là một thành phần

**Lời giải**

[STEPS]
1. **Phương trình đặc trưng**: $4z^2 - 1 = 0 \Rightarrow z = \pm 1/2$. Nghiệm: $z_1 = 1/2$, $z_2 = -1/2$.
2. **Input**: $x[n] = 2^{-n} = (1/2)^n$. Dạng này **trùng** với nghiệm $z_1 = 1/2$ → **cộng hưởng**!
3. **Dạng $y_s$**: Vì trùng nghiệm đơn, phải nhân thêm $n$: $y_s[n] = A n (1/2)^n = A n 2^{-n}$.
4. **Kết luận**: Đáp ứng cưỡng bách có dạng $A n 2^{-n}$. Vậy:
   - (a) $2^{-n}u[n]$: chỉ đúng nếu $A n = 1$ với mọi $n$ — không đúng → **SAI**.
   - (b) $-2^{-n}u[n]$: tương tự → **SAI**.
   - (c) $n2^{-n}u[n]$: đúng dạng → **ĐÚNG**.
   - (d) $2^n u[n]$: đây là nghiệm tự nhiên, không phải cưỡng bách → **SAI**.
[/STEPS]

[BOX: warn] **Đề bài có thể gây nhầm**: Câu hỏi "KHÔNG ĐÚNG" — có 3 phát biểu sai (a, b, d) và 1 đúng (c). Nếu đề chỉ cho chọn một, có thể đề có lỗi in ấn. Trong trường hợp này, đáp án **đúng theo nghĩa "phát biểu đúng"** là (c). Nếu đề hỏi "phát biểu nào SAI", thì có 3 đáp án — không phù hợp trắc nghiệm 1 đáp án. Khi đi thi, hãy đọc kỹ và chọn đáp án **phù hợp nhất với ý đề** (có thể đề muốn hỏi "thành phần nào CÓ trong đáp ứng cưỡng bách").

[ANS] **Đáp án: (c) $n2^{-n}u[n]$ là thành phần đúng của $y_s$**.

---

[H3] Câu 2. $y[n] - 4y[n-2] = x[n]$, $x[n] = 2^{-n}u[n]$

[P] **Đề**: Phát biểu nào **KHÔNG ĐÚNG**?
- (a) $2^{-n}u[n]$ là thành phần của $y_s$
- (b) $(-2)^n u[n]$ là thành phần của $y_s$
- (c) $n2^{-n}u[n]$ là thành phần của $y_s$
- (d) $2^n u[n]$ là thành phần của $y_s$

**Lời giải**

[STEPS]
1. **Phương trình đặc trưng**: $z^2 - 4 = 0 \Rightarrow z = \pm 2$. Nghiệm: $z_1 = 2$, $z_2 = -2$.
2. **Input**: $2^{-n} = (1/2)^n$. Không trùng nghiệm $2$ hay $-2$ → **không cộng hưởng**.
3. **Dạng $y_s$**: $y_s[n] = A(1/2)^n = A 2^{-n}$.
4. **Kết luận**:
   - (a) $2^{-n}u[n]$: đúng dạng (với $A$ nào đó) → **ĐÚNG**.
   - (b) $(-2)^n u[n]$: đây là nghiệm tự nhiên, **không phải** cưỡng bách → **SAI**.
   - (c) $n2^{-n}u[n]$: không phải dạng $y_s$ (vì không cộng hưởng) → **SAI**.
   - (d) $2^n u[n]$: nghiệm tự nhiên → **SAI**.
[/STEPS]

[BOX: warn] **Lại nhầm lẫn**: Tương tự câu 1, có 1 đúng (a) và 3 sai (b, c, d). Đáp án "phát biểu đúng" là (a). Nếu đề hỏi "KHÔNG ĐÚNG", có thể đề có lỗi.

[ANS] **Đáp án: (a) $2^{-n}u[n]$ là thành phần đúng của $y_s$**.

### NHÓM 2: Tìm đáp ứng cưỡng bách

[H3] Câu 5. $y''(t) + 5y'(t) + 6y(t) = 6x(t)$, $x(t) = u(t)$

[P] **Đề**: Tìm $y_s(t)$.

**Lời giải**

[STEPS]
1. **Phương trình đặc trưng**: $s^2 + 5s + 6 = 0 \Rightarrow (s+2)(s+3) = 0 \Rightarrow s = -2, -3$.
2. **Input**: $x = u(t)$ — hằng số 1 với $t \geq 0$. Thử $y_s = A$ (hằng số).
3. **Thay vào**: $y_s' = 0$, $y_s'' = 0$.
   $$0 + 0 + 6A = 6 \Rightarrow A = 1$$
4. **Kết quả**: $y_s(t) = 1$ với $t \geq 0$, tức $y_s(t) = u(t)$.
[/STEPS]

[ANS] **Đáp án: $y_s(t) = u(t)$** (tùy chọn 1, có thể viết $y_s = u(t) + \ldots$ nếu đề cho dạng đầy đủ).

[BOX: warn] **Kiểm tra đáp án**: Đề cho các lựa chọn phức tạp (có $e^{-2t}$, $e^{-3t}$) — đó là nghiệm **đầy đủ** (tự nhiên + cưỡng bách), không chỉ cưỡng bách. Đề hỏi "đáp ứng cưỡng bách" — chỉ phần $y_s$, tức $A = 1$ → $y_s = u(t)$. Nếu đề hỏi "đáp ứng đầy đủ", mới cần thêm nghiệm tự nhiên.

---

[H3] Câu 6. $y[n] + 2y[n-1] = x[n-1]$, $x[n] = 2^{-n}u[n]$

[P] **Đề**: Tìm $y_s[n]$.

**Lời giải**

[STEPS]
1. **Phương trình đặc trưng**: $z + 2 = 0 \Rightarrow z = -2$.
2. **Input**: $2^{-n} = (1/2)^n$. Không trùng nghiệm $-2$ → thử $y_s = A(1/2)^n$.
3. **Thay vào**:
   $$A(1/2)^n + 2A(1/2)^{n-1} = (1/2)^{n-1}$$
   Chia hai vế cho $(1/2)^{n-1}$:
   $$A(1/2) + 2A = 1 \Rightarrow \frac{5A}{2} = 1 \Rightarrow A = \frac{2}{5}$$
4. **Kết quả**: $y_s[n] = \frac{2}{5}(1/2)^n = \frac{2}{5}2^{-n}$.
[/STEPS]

[BOX: analogy] **Kiểm tra nhanh**: Thay $y_s = \frac{2}{5}2^{-n}$ vào vế trái:
$y_s[n] + 2y_s[n-1] = \frac{2}{5}2^{-n} + 2\cdot\frac{2}{5}2^{-(n-1)} = \frac{2}{5}2^{-n} + \frac{4}{5}\cdot 2 \cdot 2^{-n} = \frac{2}{5}2^{-n} + \frac{8}{5}2^{-n} = \frac{10}{5}2^{-n} = 2\cdot 2^{-n} = 2^{-(n-1)}$. Khớp hoàn toàn với vế phải $x[n-1]$!

[ANS] **Đáp án: $y_s[n] = \frac{2}{5}(1/2)^n u[n]$** (tùy chọn 1).

### NHÓM 3: Tìm đáp ứng tự nhiên

[H3] Câu 10. $y''(t) + 5y'(t) + 6y(t) = x'(t) + 6x(t)$, $y(0^-) = 1$, $y'(0^-) = 2$

[P] **Đề**: Tìm $y_0(t)$.

**Lời giải**

[STEPS]
1. **Phương trình đặc trưng**: $s^2 + 5s + 6 = 0 \Rightarrow s = -2, -3$.
2. **Dạng $y_0$**: $y_0(t) = c_1 e^{-2t} + c_2 e^{-3t}$.
3. **Dùng điều kiện ban đầu**:
   - $y_0(0) = c_1 + c_2 = 1$.
   - $y_0'(t) = -2c_1 e^{-2t} - 3c_2 e^{-3t}$, nên $y_0'(0) = -2c_1 - 3c_2 = 2$.
4. **Giải hệ**:
   $$\begin{cases} c_1 + c_2 = 1 \\ -2c_1 - 3c_2 = 2 \end{cases}$$
   Từ phương trình 1: $c_1 = 1 - c_2$. Thay vào phương trình 2: $-2(1-c_2) - 3c_2 = 2 \Rightarrow -2 + 2c_2 - 3c_2 = 2 \Rightarrow -c_2 = 4 \Rightarrow c_2 = -4$.
   Vậy $c_1 = 1 - (-4) = 5$.
5. **Kết quả**: $y_0(t) = (5e^{-2t} - 4e^{-3t})u(t)$.
[/STEPS]

[ANS] **Đáp án: $y_0(t) = 5e^{-2t}u(t) - 4e^{-3t}u(t)$** (tùy chọn 1).

---

[H3] Câu 12. $y''(t) + 4y'(t) + 4y(t) = x'(t)$, $y(0^-) = 1$, $y'(0^-) = 2$

[P] **Đề**: Tìm $y_0(t)$.

**Lời giải**

[STEPS]
1. **Phương trình đặc trưng**: $s^2 + 4s + 4 = 0 \Rightarrow (s+2)^2 = 0 \Rightarrow s = -2$ (nghiệm **kép**).
2. **Dạng $y_0$** (nghiệm kép): $y_0(t) = (c_1 + c_2 t)e^{-2t}$.
3. **Điều kiện ban đầu**:
   - $y_0(0) = c_1 = 1$.
   - $y_0'(t) = c_2 e^{-2t} - 2(c_1 + c_2 t)e^{-2t}$, nên $y_0'(0) = c_2 - 2c_1 = 2$.
4. **Giải**: $c_1 = 1$, $c_2 - 2(1) = 2 \Rightarrow c_2 = 4$.
5. **Kết quả**: $y_0(t) = (1 + 4t)e^{-2t}u(t) = (e^{-2t} + 4te^{-2t})u(t)$.
[/STEPS]

[BOX: warn] **Nhớ nghiệm kép**: Khi phương trình đặc trưng có nghiệm kép $s = -2$, dạng $y_0$ phải là $(c_1 + c_2 t)e^{-2t}$ — **không phải** $c_1 e^{-2t} + c_2 e^{-2t}$ (hai số hạng trùng nhau, chỉ còn 1 bậc tự do → không đủ để thỏa 2 điều kiện ban đầu).

[ANS] **Đáp án: $y_0(t) = (e^{-2t} + 4te^{-2t})u(t)$** (tùy chọn 1).

---

[H3] Câu 13. $y[n] + 2y[n-1] - 3y[n-2] = x[n-1]$, $y[-1] = 2$, $y[-2] = 0$

[P] **Đề**: Tìm $y_0[n]$.

**Lời giải**

[STEPS]
1. **Phương trình đặc trưng**: $z^2 + 2z - 3 = 0 \Rightarrow (z+3)(z-1) = 0 \Rightarrow z = -3, 1$.
2. **Dạng $y_0$**: $y_0[n] = c_1(-3)^n + c_2(1)^n = c_1(-3)^n + c_2$.
3. **Điều kiện ban đầu**:
   - $y_0[-1] = c_1(-3)^{-1} + c_2 = -\frac{c_1}{3} + c_2 = 2$.
   - $y_0[-2] = c_1(-3)^{-2} + c_2 = \frac{c_1}{9} + c_2 = 0$.
4. **Giải hệ**:
   $$\begin{cases} -\frac{c_1}{3} + c_2 = 2 \\ \frac{c_1}{9} + c_2 = 0 \end{cases}$$
   Trừ hai phương trình: $-\frac{c_1}{3} - \frac{c_1}{9} = 2 \Rightarrow -\frac{4c_1}{9} = 2 \Rightarrow c_1 = -\frac{9}{2}$.
   Thay vào phương trình 2: $\frac{-9/2}{9} + c_2 = 0 \Rightarrow -\frac{1}{2} + c_2 = 0 \Rightarrow c_2 = \frac{1}{2}$.
5. **Kết quả**: $y_0[n] = (-\frac{9}{2}(-3)^n + \frac{1}{2})u[n] = (\frac{1}{2} - \frac{1}{2}(-3)^{n+2})u[n]$ (vì $(-3)^n\cdot 9 = (-3)^{n+2}$).

Kiểm tra: $y_0[-1] = -\frac{9}{2}(-3)^{-1} + \frac{1}{2} = \frac{3}{2} + \frac{1}{2} = 2$ ✓.
$y_0[-2] = -\frac{9}{2}(-3)^{-2} + \frac{1}{2} = -\frac{9}{2}\cdot\frac{1}{9} + \frac{1}{2} = -\frac{1}{2} + \frac{1}{2} = 0$ ✓.
[/STEPS]

[ANS] **Đáp án: $y_0[n] = [\frac{1}{2} - \frac{1}{2}(-3)^{n+2}]u[n]$** (tương đương với tùy chọn 1 của đề).

[SECTION: bai5-summary]

[H2] Tổng kết Bài 5

[BOX] **Phương pháp tổng quát**:
1. **Phương trình đặc trưng**: Thay $y = e^{st}$ (hoặc $z^n$), giải tìm $s$ (hoặc $z$).
2. **Đáp ứng tự nhiên $y_0$**: Dạng phụ thuộc vào nghiệm:
   - Nghiệm đơn: $\sum c_k e^{s_k t}$.
   - Nghiệm kép: $(c_1 + c_2 t)e^{st}$.
   - Nghiệm phức: $e^{\sigma t}(A\cos\omega t + B\sin\omega t)$.
3. **Đáp ứng cưỡng bách $y_s$**: Thử dạng giống input. Nếu trùng nghiệm đặc trưng → nhân thêm $t$ (hoặc $n$).
4. **Nghiệm tổng quát**: $y = y_0 + y_s$. Hằng số xác định từ điều kiện ban đầu.
5. **Điều kiện ban đầu**: Dùng $y(0^-)$ hoặc $y[-1]$ — trạng thái **trước** input.

[BOX: warn] **5 bẫy thi**:
1. **Cộng hưởng**: Input trùng nghiệm đặc trưng → phải nhân thêm $t$ (hoặc $n$).
2. **Nhầm $2^n$ và $2^{-n}$**: $(1/2)^n = 2^{-n}$ tắt dần, $2^n$ tăng dần.
3. **Nghiệm kép**: $y_0 = (c_1 + c_2 t)e^{st}$, không phải $c_1 e^{st} + c_2 e^{st}$.
4. **Quên $u(t)$ / $u[n]$**: Kết quả phải nhân với $u(t)$ (hoặc $u[n]$).
5. **Nhầm $0^-$ và $0^+$**: Điều kiện ban đầu thường cho ở $0^-$.

[BOX] **Công thức cần nhớ**:
- **Phương trình đặc trưng**: $\sum a_i s^i = 0$ (liên tục), $\sum a_k z^{N-k} = 0$ (rời rạc).
- **Nghiệm đơn**: $y_0 = \sum c_k e^{s_k t}$.
- **Nghiệm kép**: $y_0 = (c_1 + c_2 t)e^{st}$.
- **Thử $y_s$**: Dạng giống input; nếu trùng nghiệm → nhân $t$.
- **Điều kiện ban đầu**: Giải hệ phương trình từ $y_0(0), y_0'(0)$ (hoặc $y_0[-1], y_0[-2]$).

[BOX: analogy] **Câu thần chú cuối bài**: *"Đặc trưng tìm nghiệm, tự nhiên theo dạng. Cưỡng bách thử giống input, trùng thì nhân thêm $t$. Tổng hai là đáp án, hằng số từ điều kiện ban đầu. Nhớ: cộng hưởng nguy hiểm, nghiệm kép có $t$, và đừng quên $u$."*

# BÀI 6 (BẢN ĐẦY ĐỦ): CHUỖI FOURIER VÀ BIẾN ĐỔI FOURIER

[SECTION: bai6-overview]

[H2] Bài 6. Chuỗi Fourier và Biến đổi Fourier — Từ miền thời gian sang miền tần số

---

## Phần A. Động cơ — Tại sao phải chuyển sang miền tần số?

[BRIDGE] Ở các bài trước, bạn đã biết cách mô tả tín hiệu trong **miền thời gian** — tức là nhìn đồ thị $x(t)$ theo trục $t$. Nhưng có một câu hỏi mà miền thời gian không trả lời được: **"Tín hiệu này chứa những tần số nào, và mỗi tần số đóng góp bao nhiêu?"** Ví dụ, khi bạn nghe một hợp âm đàn guitar, tai bạn phân biệt được các nốt — đó chính là phân tích tần số tự nhiên. Fourier là công cụ toán học để làm điều đó một cách chính xác.

[P] **Ba lý do cốt lõi phải học Fourier**:

1. **Hệ thống LTI "thích" tín hiệu sin**: Khi đưa $e^{j\omega t}$ vào hệ LTI, đầu ra chỉ là $H(\omega)\cdot e^{j\omega t}$ — tức là **cùng tần số**, chỉ khác biên độ và pha. Đây là tính chất **eigenfunction** (hàm riêng) — cực kỳ quan trọng. Nhờ đó, nếu phân tích tín hiệu thành tổng các sin, ta chỉ cần nhân từng thành phần với $H(\omega)$ tương ứng — bài toán tích chập phức tạp trở thành phép nhân đơn giản.

2. **Tích chập → phép nhân**: $y = x*h$ trong miền thời gian tương đương $Y = X\cdot H$ trong miền tần số. Đây là lý do các bộ lọc số/analog được thiết kế trong miền tần số — dễ hơn nhiều.

3. **Nhìn thấy cấu trúc ẩn**: Nhiễu tần số cao, tín hiệu hữu ích tần số thấp — chỉ thấy rõ trong miền tần số. Đó là nền tảng của lọc nhiễu, nén ảnh, truyền thông.

[BOX: analogy] **Ẩn dụ**: Hãy tưởng tượng bạn nghe một bản nhạc. Trong miền thời gian, đó là một làn sóng âm thanh phức tạp (như đồ thị ECG). Nhưng nếu bạn tách thành các nốt nhạc (đô, rê, mi…), bạn thấy bản nhạc chỉ gồm vài tần số cơ bản. Fourier chính là "bộ tách nốt nhạc" đó. Và một hệ thống LTI (như bộ lọc) chỉ cần biết "nốt nào to, nốt nào nhỏ" để quyết định đầu ra — không cần xử lý toàn bộ làn sóng phức tạp.

[P] **Bốn phép biến đổi Fourier** (tùy loại tín hiệu):

[TABLE]
| | Tuần hoàn | Không tuần hoàn |
|---|---|---|
| **Liên tục $x(t)$** | Fourier Series (FS) | Fourier Transform (FT) |
| **Rời rạc $x[n]$** | Discrete-Time Fourier Series (DTFS) | Discrete-Time Fourier Transform (DTFT) |
[/TABLE]

[P] Trong bài này, ta học **cả bốn** — vì quiz 6 có câu hỏi cả bốn loại. Trọng tâm là FS và FT.

---

## Phần B. Fourier Series (FS) — Tín hiệu tuần hoàn liên tục

### B.1. Ý tưởng cốt lõi

[P] Mọi tín hiệu tuần hoàn $x(t)$ chu kỳ $T_0$ (với điều kiện Dirichlet nhẹ) đều có thể biểu diễn thành **tổng vô hạn các mũ phức** có tần số là bội nguyên của tần số cơ sở:
[FORMULA: key]
$$x(t) = \sum_{k=-\infty}^{\infty} c_k e^{jk\omega_0 t}, \qquad \omega_0 = \frac{2\pi}{T_0}$$
[/FORMULA]

[P] Hệ số $c_k$ (gọi là **hệ số Fourier**) cho biết **đóng góp** của tần số thứ $k$ vào tín hiệu:
[FORMULA: key]
$$c_k = \frac{1}{T_0}\int_{T_0} x(t)\,e^{-jk\omega_0 t}\,dt$$
[/FORMULA]

[P] (Tích phân lấy trên **một chu kỳ bất kỳ** — thường chọn $[0, T_0]$ hoặc $[-T_0/2, T_0/2]$.)

[BOX: analogy] **Ẩn dụ**: Tín hiệu $x(t)$ giống như một **hợp âm** piano. Hệ số $c_k$ giống như **âm lượng** của từng nốt (tần số $k\omega_0$). Tổng vô hạn các nốt với âm lượng tương ứng tạo thành hợp âm. Nếu bạn biết tất cả $c_k$, bạn biết chính xác hợp âm — không cần nghe lại tín hiệu gốc. Đó là sức mạnh của FS: biến tín hiệu phức tạp thành bộ số $(c_k)$.

### B.2. Dạng lượng giác — Cách viết khác

[P] Nếu $x(t)$ là **thực**, có thể viết FS dưới dạng sin/cos thực:
[FORMULA]
$$x(t) = \frac{a_0}{2} + \sum_{k=1}^{\infty}\left(a_k\cos(k\omega_0 t) + b_k\sin(k\omega_0 t)\right)$$
[/FORMULA]

[P] Với:
$$a_k = \frac{2}{T_0}\int_{T_0}x(t)\cos(k\omega_0 t)dt, \quad b_k = \frac{2}{T_0}\int_{T_0}x(t)\sin(k\omega_0 t)dt$$

[P] Quan hệ với dạng mũ phức: $c_0 = a_0/2$, $a_k = c_k + c_{-k}$, $b_k = j(c_k - c_{-k})$. Với tín hiệu thực: $c_{-k} = c_k^*$.

[BOX: warn] **Dùng dạng nào?** Trong thực hành, dạng mũ phức gọn hơn (một tổng duy nhất) và xử lý được tín hiệu phức. Dạng lượng giác chỉ hữu ích khi cần tách phần thực/ảo rõ ràng. Hầu hết đề thi cho dạng mũ phức — hãy quen với nó.

### B.3. Phương pháp tìm $c_k$ — 3 trường hợp

**Trường hợp 1: Tín hiệu là tổ hợp sin/cos đã biết**

[P] Đây là trường hợp **dễ nhất** — dùng công thức Euler để viết sin/cos thành mũ phức rồi so sánh.

[P] **Ví dụ**: $x(t) = 3\cos\left(\frac{\pi}{2}t + \frac{\pi}{4}\right)$.

- Tần số góc: $\omega = \pi/2$ → $T_0 = 4$, $\omega_0 = \pi/2$.
- Dùng Euler:
$$3\cos\left(\frac{\pi}{2}t + \frac{\pi}{4}\right) = \frac{3}{2}e^{j(\pi t/2 + \pi/4)} + \frac{3}{2}e^{-j(\pi t/2 + \pi/4)}$$
$$= \underbrace{\frac{3}{2}e^{j\pi/4}}_{c_1} e^{j\pi t/2} + \underbrace{\frac{3}{2}e^{-j\pi/4}}_{c_{-1}} e^{-j\pi t/2}$$
- So sánh với $\sum c_k e^{jk\omega_0 t}$: $c_1 = \frac{3}{2}e^{j\pi/4}$, $c_{-1} = \frac{3}{2}e^{-j\pi/4}$, các $c_k$ khác = 0.

[BOX: analogy] **Mẹo**: Khi thấy $A\cos(\omega t + \phi)$, hệ số $c_1 = \frac{A}{2}e^{j\phi}$, $c_{-1} = \frac{A}{2}e^{-j\phi}$. Với $\sin(\omega t + \phi) = \cos(\omega t + \phi - \pi/2)$, tương tự.

**Trường hợp 2: Tín hiệu cho bởi biểu thức, cần tích phân**

[P] Tính $c_k$ bằng tích phân trực tiếp. Thường gặp với tín hiệu dạng xung, bậc thang.

[P] **Ví dụ**: $x(t)$ tuần hoàn chu kỳ $T_0 = 2$, một chu kỳ: $x(t) = 1$ với $0 \leq t < 1$, $0$ với $1 \leq t < 2$.

- $\omega_0 = \pi$.
- $c_k = \frac{1}{2}\int_0^1 1\cdot e^{-jk\pi t}dt = \frac{1}{2}\left[\frac{e^{-jk\pi t}}{-jk\pi}\right]_0^1 = \frac{1}{2}\cdot\frac{e^{-jk\pi} - 1}{-jk\pi} = \frac{1 - e^{-jk\pi}}{2jk\pi}$.
- Vì $e^{-jk\pi} = (-1)^k$: $c_k = \frac{1 - (-1)^k}{2jk\pi}$.
  - $k$ chẵn: $c_k = 0$.
  - $k$ lẻ: $c_k = \frac{2}{2jk\pi} = \frac{1}{jk\pi}$.
- $c_0 = \frac{1}{2}\int_0^1 1dt = \frac{1}{2}$.

**Trường hợp 3: Tín hiệu tổng của nhiều sin/cos**

[P] Phân tích từng thành phần như trường hợp 1, cộng các hệ số lại. Lưu ý tìm tần số cơ sở chung $\omega_0$.

[P] **Ví dụ**: $x(t) = \sin\left(\frac{\pi}{3}t - \frac{\pi}{2}\right) + 2\cos\left(\frac{\pi}{2}t\right)$.

- Tần số thành phần: $\omega_1 = \pi/3$, $\omega_2 = \pi/2$. Tỉ số $= 2/3$ → hữu tỉ → tuần hoàn.
- Tần số cơ sở chung: $\omega_0 = \pi/6$ (vì $\pi/3 = 2\omega_0$, $\pi/2 = 3\omega_0$).
- Chu kỳ $T_0 = 2\pi/\omega_0 = 12$.
- Phân tích:
  - $\sin(\pi t/3 - \pi/2) = -\cos(\pi t/3) = -\frac{1}{2}(e^{j2\pi t/6} + e^{-j2\pi t/6})$ → $c_2 = -1/2$, $c_{-2} = -1/2$.
  - $2\cos(\pi t/2) = e^{j3\pi t/6} + e^{-j3\pi t/6}$ → $c_3 = 1$, $c_{-3} = 1$.
- Vậy: $c_2 = -1/2$, $c_{-2} = -1/2$, $c_3 = 1$, $c_{-3} = 1$, các $c_k$ khác = 0.

### B.4. Phổ biên độ và phổ pha

[P] Viết $c_k = |c_k|e^{j\varphi_k}$. Khi đó:
- **Phổ biên độ**: đồ thị $|c_k|$ theo $k\omega_0$.
- **Phổ pha**: đồ thị $\varphi_k$ theo $k\omega_0$.

[P] Vì $k$ nguyên (rời rạc), phổ là các **vạch** — gọi là **phổ vạch** (line spectrum).
[FIG: 6.2] Phổ biên độ của tín hiệu tuần hoàn (chuỗi Fourier). Phổ rời rạc — chỉ có vạch tại các tần số $\omega = k\omega_0$. So sánh với phổ liên tục của FT.

[P] **Tính chất cho tín hiệu thực**: $|c_{-k}| = |c_k|$ (phổ biên độ **chẵn**), $\varphi_{-k} = -\varphi_k$ (phổ pha **lẻ**). Đây là hệ quả của $c_{-k} = c_k^*$.

### B.5. Đẳng thức Parseval — Công suất

[FORMULA: key]
$$P = \frac{1}{T_0}\int_{T_0}|x(t)|^2dt = \sum_{k=-\infty}^{\infty}|c_k|^2$$
[/FORMULA]

[P] Nghĩa là: **công suất trung bình trong miền thời gian = tổng công suất của các hài trong miền tần số**. Mỗi hài đóng góp $|c_k|^2$ vào tổng công suất.

[BOX: analogy] **Tại sao Parseval quan trọng?** Vì nó cho phép tính công suất **mà không cần biết tín hiệu gốc** — chỉ cần biết hệ số Fourier. Hơn nữa, nó khẳng định "năng lượng được bảo toàn" khi chuyển miền: không có năng lượng nào bị mất hay thêm vào khi phân tích Fourier.

---

## Phần C. Fourier Transform (FT) — Tín hiệu không tuần hoàn liên tục

### C.1. Từ FS sang FT — Ý tưởng

[P] Tín hiệu không tuần hoàn có thể coi là tín hiệu tuần hoàn có chu kỳ $T_0 \to \infty$. Khi $T_0 \to \infty$:
- Khoảng cách giữa các vạch phổ $\omega_0 = 2\pi/T_0 \to 0$ → phổ rời rạc thành **liên tục**.
- Tổng $\sum$ thành tích phân $\int$.

Kết quả: **cặp biến đổi Fourier**:
[FORMULA: key]
$$X(\omega) = \mathcal{F}\{x(t)\} = \int_{-\infty}^{\infty}x(t)\,e^{-j\omega t}\,dt$$
$$x(t) = \mathcal{F}^{-1}\{X(\omega)\} = \frac{1}{2\pi}\int_{-\infty}^{\infty}X(\omega)\,e^{j\omega t}\,d\omega$$
[/FORMULA]

[P] Ký hiệu: $x(t) \leftrightarrow X(\omega)$. $X(\omega)$ là **phổ Fourier** — phức, có $|X(\omega)|$ (phổ biên độ) và $\angle X(\omega)$ (phổ pha).

[BOX: analogy] **Ẩn dụ**: FS giống như **quang phổ vạch** của đèn neon — chỉ có vài vạch sáng ở tần số cụ thể. FT giống như **quang phổ liên tục** của ánh sáng mặt trời — trải đều trên mọi tần số. Tín hiệu tuần hoàn có phổ vạch; tín hiệu không tuần hoàn có phổ liên tục.

### C.2. Tính chất quan trọng của FT

[TABLE]
| Tính chất | Miền thời gian | Miền tần số |
|---|---|---|
| Tuyến tính | $a_1x_1 + a_2x_2$ | $a_1X_1 + a_2X_2$ |
| Dịch thời gian | $x(t-t_0)$ | $e^{-j\omega t_0}X(\omega)$ |
| Dịch tần số | $e^{j\omega_0 t}x(t)$ | $X(\omega - \omega_0)$ |
| Co giãn thời gian | $x(at)$ | $\frac{1}{\|a\|}X(\omega/a)$ |
| Lật thời gian | $x(-t)$ | $X(-\omega)$ |
| Đạo hàm | $dx/dt$ | $j\omega X(\omega)$ |
| Tích phân | $\int_{-\infty}^t x(\tau)d\tau$ | $\frac{X(\omega)}{j\omega} + \pi X(0)\delta(\omega)$ |
| Tích chập | $x_1 * x_2$ | $X_1(\omega)X_2(\omega)$ |
| Nhân | $x_1\cdot x_2$ | $\frac{1}{2\pi}X_1 * X_2$ |
| Đối xứng (thực) | $x$ thực | $X(-\omega) = X^*(\omega)$ |
[/TABLE]

[BOX: warn] **Hai tính chất quan trọng nhất** (hay dùng trong đề):
1. **Dịch thời gian**: $x(t-t_0) \leftrightarrow e^{-j\omega t_0}X(\omega)$ — dịch đi $t_0$ thì nhân với pha $e^{-j\omega t_0}$. Đây là lý do "dịch chuyển thời gian = thay đổi pha" (như slide bài giảng nói).
2. **Tích chập**: $x_1 * x_2 \leftrightarrow X_1\cdot X_2$ — đây là nền tảng của phân tích hệ LTI trong miền tần số.

### C.3. Cặp biến đổi thông dụng — Phải thuộc lòng

[TABLE]
| $x(t)$ | $X(\omega)$ |
|---|---|
| $\delta(t)$ | $1$ |
| $\delta(t-t_0)$ | $e^{-j\omega t_0}$ |
| $1$ (hằng số) | $2\pi\delta(\omega)$ |
| $e^{j\omega_0 t}$ | $2\pi\delta(\omega - \omega_0)$ |
| $\cos(\omega_0 t)$ | $\pi[\delta(\omega-\omega_0) + \delta(\omega+\omega_0)]$ |
| $\sin(\omega_0 t)$ | $-j\pi[\delta(\omega-\omega_0) - \delta(\omega+\omega_0)]$ |
| $u(t)$ | $\pi\delta(\omega) + \frac{1}{j\omega}$ |
| $e^{-at}u(t)$, $a>0$ | $\frac{1}{j\omega + a}$ |
| $t e^{-at}u(t)$, $a>0$ | $\frac{1}{(j\omega + a)^2}$ |
| $e^{-a\|t\|}$, $a>0$ | $\frac{2a}{a^2 + \omega^2}$ |
| $p_a(t)$ (xung vuông độ rộng $2a$) | $2a\frac{\sin(\omega a)}{\omega a} = 2\frac{\sin(\omega a)}{\omega}$ |
| $\frac{\sin(at)}{\pi t}$ | $p_a(\omega)$ (xung vuông tần số) |
| $\sum_k \delta(t - kT)$ | $\frac{2\pi}{T}\sum_k \delta(\omega - k\frac{2\pi}{T})$ |
[/TABLE]

[BOX: analogy] **Mẹo nhớ cặp "xung vuông ↔ sinc"**: Đây là cặp đối ngẫu quan trọng nhất. Xung vuông trong thời gian → sinc trong tần số, và ngược lại. "Càng hẹp trong thời gian, càng rộng trong tần số" — đó là nguyên lý bất định của Fourier.
[FIG: 6.1] Cặp đối ngẫu xung vuông ↔ sinc. Xung càng hẹp trong thời gian thì phổ càng rộng trong tần số — nền tảng của nguyên lý bất định.

### C.4. Phương pháp tính FT — 3 bước

[STEPS]
1. **Bước 1 — Xác định khoảng tồn tại**: Tín hiệu khác 0 trên khoảng nào? Ngoài khoảng đó, tích phân bằng 0.
2. **Bước 2 — Viết tích phân**: $X(\omega) = \int_{a}^{b}x(t)e^{-j\omega t}dt$, với $[a,b]$ là khoảng tồn tại.
3. **Bước 3 — Tính tích phân**: Thường dùng dạng $\int e^{ct}dt = e^{ct}/c$. Với tín hiệu có dạng $e^{-at}u(t)$, cận từ 0 đến $\infty$; với tín hiệu hữu hạn, cận hữu hạn.
[/STEPS]

### C.5. Ví dụ chi tiết — FT của xung vuông

[P] **Đề**: Tính FT của $p_a(t) = 1$ với $|t| < a$, $0$ ngoài.

**Lời giải**:
$$X(\omega) = \int_{-a}^{a}1\cdot e^{-j\omega t}dt = \left[\frac{e^{-j\omega t}}{-j\omega}\right]_{-a}^{a} = \frac{e^{-j\omega a} - e^{j\omega a}}{-j\omega} = \frac{2\sin(\omega a)}{\omega}$$

Viết lại: $X(\omega) = 2a\cdot\frac{\sin(\omega a)}{\omega a}$ — đây chính là hàm **sinc** (nhân với $2a$).

[BOX: analogy] **Trực giác**: Xung vuông hẹp ($a$ nhỏ) → sinc rộng (main lobe rộng). Xung vuông rộng ($a$ lớn) → sinc hẹp. Đây là **nguyên lý bất định**: $\Delta t \cdot \Delta f \geq \text{hằng số}$. Không thể có tín hiệu vừa hẹp thời gian vừa hẹp tần số.

---

## Phần D. DTFS và DTFT — Phiên bản rời rạc

### D.1. DTFS — Tín hiệu tuần hoàn rời rạc

[P] Tín hiệu $x[n]$ tuần hoàn chu kỳ $N_0$, tần số góc cơ sở $\Omega_0 = 2\pi/N_0$:
[FORMULA: key]
$$x[n] = \sum_{k=0}^{N_0-1}c_k e^{jk\Omega_0 n}, \qquad c_k = \frac{1}{N_0}\sum_{n=0}^{N_0-1}x[n]e^{-jk\Omega_0 n}$$
[/FORMULA]

[P] **Khác FS**: Tổng chỉ có $N_0$ số hạng (không phải vô hạn) vì $e^{jk\Omega_0 n}$ tuần hoàn theo $k$ với chu kỳ $N_0$. Hệ số $c_k$ cũng tuần hoàn: $c_{k+N_0} = c_k$.

[P] **Ví dụ**: $x[n] = \sum_{m}\delta[n - 3m]$ (xung tại $n=0, 3, 6, \ldots$).

- Chu kỳ $N_0 = 3$. Trên một chu kỳ $n \in \{0, 1, 2\}$: $x[0] = 1$, $x[1] = x[2] = 0$.
- $c_k = \frac{1}{3}\sum_{n=0}^{2}x[n]e^{-jk(2\pi/3)n} = \frac{1}{3}\cdot 1\cdot e^0 = \frac{1}{3}$.

### D.2. DTFT — Tín hiệu không tuần hoàn rời rạc

[FORMULA: key]
$$X(\Omega) = \sum_{n=-\infty}^{\infty}x[n]e^{-j\Omega n}, \qquad x[n] = \frac{1}{2\pi}\int_{2\pi}X(\Omega)e^{j\Omega n}d\Omega$$
[/FORMULA]

[P] $X(\Omega)$ **tuần hoàn với chu kỳ $2\pi$** (vì $e^{-j\Omega n}$ tuần hoàn $2\pi$ theo $\Omega$).

[P] **Cặp thông dụng**:
- $\delta[n] \leftrightarrow 1$.
- $\delta[n-n_0] \leftrightarrow e^{-j\Omega n_0}$.
- $a^n u[n]$, $|a|<1$ $\leftrightarrow$ $\frac{1}{1-ae^{-j\Omega}}$.
- $u[n] \leftrightarrow \pi\delta(\Omega) + \frac{1}{1-e^{-j\Omega}}$.

[P] **Ví dụ**: $x[n] = 2^{-n}u[n]$. Với $a = 1/2$:
$$X(\Omega) = \frac{1}{1-\frac{1}{2}e^{-j\Omega}}$$

---

## Phần E. Các bẫy thi

[BOX: warn] **6 bẫy phổ biến**:

1. **Quên $2\pi$ trong định nghĩa FT ngược**: $x(t) = \frac{1}{2\pi}\int X e^{j\omega t}d\omega$ — có $\frac{1}{2\pi}$. Nhiều bạn quên.

2. **Nhầm $\omega$ và $f$**: $\omega = 2\pi f$. Cặp $\cos(\omega_0 t) \leftrightarrow \pi[\delta(\omega-\omega_0) + \delta(\omega+\omega_0)]$ dùng $\omega$. Nếu dùng $f$ thì có hệ số khác.

3. **Nhầm dấu trong dịch thời gian**: $x(t-t_0) \leftrightarrow e^{-j\omega t_0}X(\omega)$ — dấu **trừ** trong mũ. Đừng nhầm với $x(t+t_0) \leftrightarrow e^{+j\omega t_0}X(\omega)$.

4. **Nhầm $2^n$ và $2^{-n}$**: $(1/2)^n = 2^{-n}$ có DTFT $\frac{1}{1-\frac{1}{2}e^{-j\Omega}}$; $2^n$ không có DTFT (phân kỳ). Chỉ $2^{-n}$ (tắt dần) mới có.

5. **Quên điều kiện hội tụ**: FT chỉ tồn tại nếu $\int|x|dt < \infty$ (hoặc dùng phân bố cho tín hiệu như $u(t)$, $\cos$). DTFT cần $\sum|x[n]| < \infty$.

6. **Nhầm $c_k$ tuần hoàn (DTFS) với không tuần hoàn (FS)**: Ở DTFS, $c_k$ tuần hoàn chu kỳ $N_0$. Ở FS, $c_k$ không tuần hoàn (theo $k$).

[H2] Bài tập Quiz 6 — Giải chi tiết 12 câu

[BRIDGE] Dưới đây là 12 câu quiz. Câu 1–5 là FT/DTFT, câu 6–8 là DTFS, câu 9–12 là FS.

---

[H3] Câu 1. FT của $x(t) = e^{-|t-1|}$

[P] **Đề**: Tìm $X(\omega)$.

**Lời giải**

[STEPS]
1. **Dùng cặp cơ bản**: $e^{-a|t|} \leftrightarrow \frac{2a}{a^2+\omega^2}$ với $a = 1$: $e^{-|t|} \leftrightarrow \frac{2}{1+\omega^2}$.
2. **Dùng tính chất dịch thời gian**: $x(t) = e^{-|t-1|} = f(t-1)$ với $f(t) = e^{-|t|}$.
3. **Áp dụng**: $f(t-t_0) \leftrightarrow e^{-j\omega t_0}F(\omega)$ với $t_0 = 1$:
$$X(\omega) = e^{-j\omega}\cdot\frac{2}{1+\omega^2} = \frac{2e^{-j\omega}}{\omega^2+1}$$
[/STEPS]

[ANS] **Đáp án: $X(\omega) = \dfrac{2e^{-j\omega}}{\omega^2+1}$** — tùy chọn 1.

---

[H3] Câu 2. FT của $x(t) = e^{2t}[u(t)-u(t-1)]$

[P] **Đề**: Tìm $X(\omega)$.

**Lời giải**

[STEPS]
1. **Xác định khoảng tồn tại**: $u(t)-u(t-1) = 1$ với $t \in [0,1]$, $0$ ngoài. Trên $[0,1]$, $x(t) = e^{2t}$.
2. **Tính tích phân**:
$$X(\omega) = \int_0^1 e^{2t}\cdot e^{-j\omega t}dt = \int_0^1 e^{(2-j\omega)t}dt = \left[\frac{e^{(2-j\omega)t}}{2-j\omega}\right]_0^1 = \frac{e^{2-j\omega} - 1}{2-j\omega}$$
[/STEPS]

[BOX: warn] **Lưu ý dấu**: Kết quả có $e^{2-j\omega} = e^2\cdot e^{-j\omega}$. Không phải $e^{j2\omega}$. Đây là chỗ hay nhầm.

[ANS] **Đáp án: $X(\omega) = \dfrac{e^{2-j\omega}-1}{2-j\omega}$** — tùy chọn 1.

---

[H3] Câu 3. DTFT của $x[n] = 2^{-n}u[n-1]$

[P] **Đề**: Tìm $X(\Omega)$.

**Lời giải**

[STEPS]
1. **Xác định khoảng tồn tại**: $u[n-1] = 1$ với $n \geq 1$. Vậy $x[n] = 2^{-n}$ với $n \geq 1$, $0$ ngoài.
2. **Dùng tính chất dịch**: $2^{-n}u[n] \leftrightarrow \frac{1}{1-\frac{1}{2}e^{-j\Omega}}$. Vì $u[n-1] = u[n]$ dịch phải 1, nên:
$$2^{-n}u[n-1] = 2^{-1}\cdot 2^{-(n-1)}u[n-1]$$
3. **Đặt $m = n-1$**: $x[n] = \frac{1}{2}\cdot 2^{-m}u[m]$ với $m = n-1$.
4. **DTFT**: $\mathcal{F}\{2^{-m}u[m]\} = \frac{1}{1-\frac{1}{2}e^{-j\Omega}}$, dịch phải 1 → nhân $e^{-j\Omega}$:
$$X(\Omega) = e^{-j\Omega}\cdot\frac{1}{1-\frac{1}{2}e^{-j\Omega}} = \frac{e^{-j\Omega}}{1-\frac{1}{2}e^{-j\Omega}}$$
[/STEPS]

[ANS] **Đáp án: $X(\Omega) = \dfrac{e^{-j\Omega}}{1-\frac{1}{2}e^{-j\Omega}}$** — tùy chọn 3.

---

[H3] Câu 4. DTFT của $x[n] = 2^n[u[n]-u[n-2]]$

[P] **Đề**: Tìm $X(\Omega)$.

**Lời giải**

[STEPS]
1. **Xác định khoảng tồn tại**: $u[n]-u[n-2] = 1$ với $n \in \{0, 1\}$, $0$ ngoài.
2. **Tính giá trị**:
   - $x[0] = 2^0 = 1$.
   - $x[1] = 2^1 = 2$.
3. **DTFT**:
$$X(\Omega) = \sum_{n=-\infty}^{\infty}x[n]e^{-j\Omega n} = 1\cdot e^0 + 2\cdot e^{-j\Omega} = 1 + 2e^{-j\Omega}$$
[/STEPS]

[ANS] **Đáp án: $X(\Omega) = 1 + 2e^{-j\Omega}$** — tùy chọn 1.

---

[H3] Câu 5. DTFT của $x[n] = \sin\left(\frac{\pi}{2}n\right)[u[n+1]-u[n-2]]$

[P] **Đề**: Tìm $X(\Omega)$.

**Lời giải**

[STEPS]
1. **Khoảng tồn tại**: $u[n+1]-u[n-2] = 1$ với $n \in \{-1, 0, 1\}$.
2. **Giá trị**:
   - $x[-1] = \sin(-\pi/2) = -1$.
   - $x[0] = \sin(0) = 0$.
   - $x[1] = \sin(\pi/2) = 1$.
3. **DTFT**:
$$X(\Omega) = (-1)e^{j\Omega\cdot 1} + 0\cdot e^0 + 1\cdot e^{-j\Omega} = -e^{j\Omega} + e^{-j\Omega}$$
4. **Dùng Euler**: $e^{-j\Omega} - e^{j\Omega} = -2j\sin(\Omega)$.
$$X(\Omega) = -2j\sin(\Omega)$$
[/STEPS]

[ANS] **Đáp án: $X(\Omega) = -j2\sin(\Omega)$** — tùy chọn 1.

---

[H3] Câu 6. DTFS của $x[n] = \sum_m \delta[n-3m-1]$

[P] **Đề**: Tìm hệ số DTFS $X[k]$.

**Lời giải**

[STEPS]
1. **Chu kỳ**: Các xung cách nhau 3 → $N_0 = 3$.
2. **Một chu kỳ**: Xung tại $n$ thỏa $n = 3m + 1$. Trong $\{0, 1, 2\}$: $n = 1$ (với $m = 0$).
3. **Tính $X[k]$**:
$$X[k] = \frac{1}{3}\sum_{n=0}^{2}x[n]e^{-jk(2\pi/3)n} = \frac{1}{3}\cdot 1\cdot e^{-jk(2\pi/3)\cdot 1} = \frac{1}{3}e^{-j(2\pi/3)k}$$
[/STEPS]

[ANS] **Đáp án: $X[k] = \dfrac{1}{3}e^{-j\frac{2\pi}{3}k}$** — tùy chọn 1.

---

[H3] Câu 7. DTFS của $x[n] = \sum_m \delta[n-3m]$

[P] **Đề**: Tìm $X[k]$.

**Lời giải**

[STEPS]
1. **Chu kỳ**: $N_0 = 3$.
2. **Một chu kỳ**: Xung tại $n = 0$ (trong $\{0,1,2\}$).
3. **Tính**:
$$X[k] = \frac{1}{3}\cdot 1\cdot e^{0} = \frac{1}{3}$$
[/STEPS]

[ANS] **Đáp án: $X[k] = \dfrac{1}{3}$** — tùy chọn 1.

---

[H3] Câu 8. DTFS của $x[n] = \sum_m \delta[n-3m+1]$

[P] **Đề**: Tìm $X[k]$.

**Lời giải**

[STEPS]
1. **Chu kỳ**: $N_0 = 3$.
2. **Xác định xung**: $\delta[n - 3m + 1] = \delta[n+1-3m]$ — xung tại $n = 3m - 1$. Trong $\{0, 1, 2\}$: $n = 2$ (với $m = 1$).
3. **Tính**:
$$X[k] = \frac{1}{3}\cdot 1\cdot e^{-jk(2\pi/3)\cdot 2} = \frac{1}{3}e^{-j(4\pi/3)k}$$
4. **Rút gọn**: $e^{-j4\pi k/3} = e^{-j2\pi k}\cdot e^{j2\pi k/3} = 1\cdot e^{j2\pi k/3}$ (vì $e^{-j2\pi k} = 1$ với $k$ nguyên).
$$X[k] = \frac{1}{3}e^{j\frac{2\pi}{3}k}$$
[/STEPS]

[ANS] **Đáp án: $X[k] = \dfrac{1}{3}e^{j\frac{2\pi}{3}k}$** — tùy chọn 1.

---

[H3] Câu 9. FS của $x(t) = \sin\left(\frac{\pi}{3}t - \frac{\pi}{2}\right) + 2\cos\left(\frac{\pi}{2}t\right)$

[P] **Đề**: Tìm $X[k]$ (hệ số FS).

**Lời giải**

[STEPS]
1. **Xác định tần số cơ sở**: $\omega_1 = \pi/3$, $\omega_2 = \pi/2$. Tỉ số $\omega_1/\omega_2 = 2/3$ → hữu tỉ. $\omega_0 = \pi/6$ (bội chung nhỏ nhất), $T_0 = 12$.
2. **Phân tích thành phần 1**: $\sin(\pi t/3 - \pi/2) = -\cos(\pi t/3)$ (dùng $\sin(x-\pi/2) = -\cos x$).
$$-\cos(\pi t/3) = -\frac{1}{2}\left(e^{j2\pi t/6} + e^{-j2\pi t/6}\right)$$
Hệ số: $c_2 = -1/2$, $c_{-2} = -1/2$.
3. **Phân tích thành phần 2**: $2\cos(\pi t/2) = e^{j3\pi t/6} + e^{-j3\pi t/6}$.
Hệ số: $c_3 = 1$, $c_{-3} = 1$.
4. **Kết hợp**: $c_2 = -1/2$, $c_{-2} = -1/2$, $c_3 = 1$, $c_{-3} = 1$, các $c_k$ khác = 0.
5. **Viết dạng delta**: $X[k] = -\frac{1}{2}\delta[k-2] - \frac{1}{2}\delta[k+2] + \delta[k-3] + \delta[k+3]$.
[/STEPS]

[ANS] **Đáp án: $X[k] = -\frac{1}{2}\delta[k-2] - \frac{1}{2}\delta[k+2] + \delta[k-3] + \delta[k+3]$** — tùy chọn 1.

---

[H3] Câu 10. FS của $x(t) = 3\cos\left(\frac{\pi}{2}t + \frac{\pi}{4}\right)$

[P] **Đề**: Tìm $X[k]$.

**Lời giải**

[STEPS]
1. **Chu kỳ**: $\omega = \pi/2$ → $T_0 = 4$, $\omega_0 = \pi/2$.
2. **Khai triển Euler**:
$$3\cos(\pi t/2 + \pi/4) = \frac{3}{2}\left(e^{j(\pi t/2 + \pi/4)} + e^{-j(\pi t/2 + \pi/4)}\right) = \frac{3}{2}e^{j\pi/4}e^{j\pi t/2} + \frac{3}{2}e^{-j\pi/4}e^{-j\pi t/2}$$
3. **Hệ số**: $c_1 = \frac{3}{2}e^{j\pi/4}$, $c_{-1} = \frac{3}{2}e^{-j\pi/4}$, các $c_k$ khác = 0.
[/STEPS]

[ANS] **Đáp án**:
$$X[k] = \begin{cases}\frac{3}{2}e^{j\pi/4} & k=1 \\ \frac{3}{2}e^{-j\pi/4} & k=-1 \\ 0 & \text{khác}\end{cases}$$
— tùy chọn 1.

---

[H3] Câu 11. FS của $x(t) = \sin(2t) - \cos(3t+1) + 1$

[P] **Đề**: Tìm $X[k]$.

**Lời giải**

[STEPS]
1. **Tần số cơ sở**: $\omega_1 = 2$, $\omega_2 = 3$. Tỉ số $2/3$ hữu tỉ. $\omega_0 = 1$ (bội chung nhỏ nhất), $T_0 = 2\pi$.
2. **Phân tích $\sin(2t)$**:
$$\sin(2t) = \frac{1}{2j}(e^{j2t} - e^{-j2t}) = -\frac{j}{2}e^{j2t} + \frac{j}{2}e^{-j2t}$$
Hệ số: $c_2 = -j/2$, $c_{-2} = j/2$.
3. **Phân tích $-\cos(3t+1)$**:
$$-\cos(3t+1) = -\frac{1}{2}\left(e^{j(3t+1)} + e^{-j(3t+1)}\right) = -\frac{e^j}{2}e^{j3t} - \frac{e^{-j}}{2}e^{-j3t}$$
Hệ số: $c_3 = -e^j/2$, $c_{-3} = -e^{-j}/2$.
4. **Phân tích $1$**: $c_0 = 1$.
5. **Kết hợp**: $X[k] = \delta[k] - \frac{j}{2}\delta[k-2] + \frac{j}{2}\delta[k+2] - \frac{e^j}{2}\delta[k-3] - \frac{e^{-j}}{2}\delta[k+3]$.
[/STEPS]

[ANS] **Đáp án**:
$$X[k] = \delta[k] - \frac{j}{2}\delta[k-2] + \frac{j}{2}\delta[k+2] - \frac{e^j}{2}\delta[k-3] - \frac{e^{-j}}{2}\delta[k+3]$$
— tùy chọn 1.

[BOX: warn] **Lưu ý**: $\sin(2t)$ cho hệ số **thuần ảo** ($\pm j/2$), còn $\cos$ cho hệ số **có pha** (từ $e^{\pm j}$). Đây là đặc trưng: sin ↔ hệ số ảo, cos ↔ hệ số thực (khi không có pha ban đầu).

---

[H3] Câu 12. FS của $x(t)$ tuần hoàn chu kỳ $T=2$, $x(t) = 1$ với $0\leq t<1$, $0$ với $1\leq t<2$

[P] **Đề**: Tìm $X[k]$.

**Lời giải**

[STEPS]
1. **Tần số cơ sở**: $\omega_0 = 2\pi/2 = \pi$.
2. **Tính $X[k]$** (với $k \neq 0$):
$$X[k] = \frac{1}{2}\int_0^1 1\cdot e^{-jk\pi t}dt = \frac{1}{2}\left[\frac{e^{-jk\pi t}}{-jk\pi}\right]_0^1 = \frac{1}{2}\cdot\frac{e^{-jk\pi} - 1}{-jk\pi} = \frac{1 - e^{-jk\pi}}{2jk\pi}$$
3. **Với $k = 0$**: $X[0] = \frac{1}{2}\int_0^1 1dt = \frac{1}{2}$.
[/STEPS]

[BOX: warn] **Kiểm tra trường hợp $k=0$**: Công thức trên có mẫu $jk\pi$ → không dùng được cho $k=0$. Phải tính riêng. Nhiều bạn quên bước này và bị chia cho 0.

[ANS] **Đáp án: $X[k] = \dfrac{1-e^{-jk\pi}}{j2k\pi}$ (với $k \neq 0$), $X[0] = 1/2$** — tùy chọn 1.

---
