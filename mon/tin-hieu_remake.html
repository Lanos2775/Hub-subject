[H2] Tổng kết Bài 6

[BOX] **Bảng tổng hợp 12 câu**:

| Câu | Tín hiệu | Loại | Đáp án |
|---|---|---|---|
| 1 | $e^{-\|t-1\|}$ | FT | $\frac{2e^{-j\omega}}{\omega^2+1}$ |
| 2 | $e^{2t}$ trên $[0,1]$ | FT | $\frac{e^{2-j\omega}-1}{2-j\omega}$ |
| 3 | $2^{-n}u[n-1]$ | DTFT | $\frac{e^{-j\Omega}}{1-\frac{1}{2}e^{-j\Omega}}$ |
| 4 | $2^n$ trên $\{0,1\}$ | DTFT | $1+2e^{-j\Omega}$ |
| 5 | $\sin(\pi n/2)$ trên $\{-1,0,1\}$ | DTFT | $-j2\sin\Omega$ |
| 6 | $\sum\delta[n-3m-1]$ | DTFS | $\frac{1}{3}e^{-j(2\pi/3)k}$ |
| 7 | $\sum\delta[n-3m]$ | DTFS | $1/3$ |
| 8 | $\sum\delta[n-3m+1]$ | DTFS | $\frac{1}{3}e^{j(2\pi/3)k}$ |
| 9 | $\sin(\pi t/3-\pi/2)+2\cos(\pi t/2)$ | FS | $-\frac{1}{2}\delta[k\mp2]+\delta[k\mp3]$ |
| 10 | $3\cos(\pi t/2+\pi/4)$ | FS | $\frac{3}{2}e^{\pm j\pi/4}$ tại $k=\pm1$ |
| 11 | $\sin(2t)-\cos(3t+1)+1$ | FS | $\delta[k] - \frac{j}{2}\delta[k\mp2] - \frac{e^{\pm j}}{2}\delta[k\mp3]$ |
| 12 | Xung vuông chu kỳ 2 | FS | $\frac{1-e^{-jk\pi}}{j2k\pi}$ |

[BOX: warn] **6 bẫy thi**:
1. **Quên $\frac{1}{2\pi}$ trong FT ngược**.
2. **Nhầm $\omega$ và $f$** — $\omega = 2\pi f$.
3. **Nhầm dấu dịch thời gian**: $x(t-t_0) \leftrightarrow e^{-j\omega t_0}X$.
4. **Chỉ $2^{-n}$ (tắt dần) mới có DTFT**, không phải $2^n$.
5. **Nhầm $c_k$ tuần hoàn (DTFS) với không tuần hoàn (FS)**.
6. **Quên trường hợp $k=0$** trong tích phân FS (mẫu số $jk\pi$).

[BOX] **Công thức cần nhớ**:
- **FS**: $x(t) = \sum c_k e^{jk\omega_0 t}$, $c_k = \frac{1}{T_0}\int x e^{-jk\omega_0 t}dt$.
- **FT**: $X(\omega) = \int x e^{-j\omega t}dt$, $x = \frac{1}{2\pi}\int X e^{j\omega t}d\omega$.
- **DTFS**: $x[n] = \sum_{k=0}^{N_0-1}c_k e^{jk\Omega_0 n}$, $c_k = \frac{1}{N_0}\sum x[n]e^{-jk\Omega_0 n}$.
- **DTFT**: $X(\Omega) = \sum x[n]e^{-j\Omega n}$.
- **Cặp vàng**: $e^{-a|t|} \leftrightarrow \frac{2a}{a^2+\omega^2}$; xung vuông ↔ sinc; $a^n u[n] \leftrightarrow \frac{1}{1-ae^{-j\Omega}}$.
- **Tính chất**: dịch → nhân pha; tích chập → nhân; Parseval: $P = \sum|c_k|^2$.

[BOX: analogy] **Câu thần chú cuối bài**: *"Tuần hoàn thì FS rời rạc, không tuần hoàn thì FT liên tục. Euler biến sin/cos thành mũ phức, hệ số $c_k$ là âm lượng từng nốt. Nhớ cặp vàng: xung vuông ↔ sinc, mũ tắt ↔ phân thức. Dịch thời gian thì nhân pha, tích chập thì nhân tần. Và đừng quên: FT ngược có $\frac{1}{2\pi}$."*

# BÀI 7 (BẢN ĐẦY ĐỦ): BIẾN ĐỔI FOURIER NGƯỢC

[SECTION: bai7-overview]

[H2] Bài 7. Biến đổi Fourier ngược — Từ phổ về tín hiệu

---

## Phần A. Động cơ — Tại sao phải học biến đổi ngược?

[BRIDGE] Ở Bài 6, bạn đã học cách **đi từ tín hiệu sang phổ** — cho $x(t)$, tính $X(\omega)$ hoặc $c_k$. Bài này dạy chiều ngược lại: **cho phổ hoặc hệ số, tìm lại tín hiệu gốc**. Đây là kỹ năng thiết yếu vì trong kỹ thuật, người ta thường biết "phổ mong muốn" (ví dụ: bộ lọc cần giữ tần số 100 Hz, chặn tần số 500 Hz) rồi phải thiết kế tín hiệu (đáp ứng xung) tương ứng.

[P] **Ba lý do cốt lõi**:

1. **Kiểm tra tính đúng đắn**: Sau khi tính được $c_k$ hoặc $X(\omega)$, dùng biến đổi ngược để **tái tạo tín hiệu gốc** — nếu tái tạo đúng, chứng tỏ tính toán đúng.

2. **Thiết kế hệ thống**: Cho phổ $H(\omega)$ mong muốn (bộ lọc thông thấp, thông cao…), tìm đáp ứng xung $h(t)$ tương ứng — chính là biến đổi ngược.

3. **Hiểu tính chất miền tần số**: Khi ai đó nói "nhân $X[k]$ với $\cos(\pi k/5)$", bạn cần biết điều đó tương đương với phép gì trong miền thời gian. Đó là dùng **tính chất** của biến đổi Fourier theo chiều ngược.

[BOX: analogy] **Ẩn dụ**: Nếu Bài 6 là "dịch từ tiếng Việt sang tiếng Anh", thì Bài 7 là "dịch từ tiếng Anh về tiếng Việt". Bạn cần biết cả hai chiều để thực sự hiểu ngôn ngữ. Và cũng giống như dịch ngược không phải lúc nào cũng dễ (có câu dịch đi dịch lại bị sai), biến đổi ngược cũng có những bẫy riêng — đó là nội dung bài này.

---

## Phần B. Công thức biến đổi ngược — Bốn loại

### B.1. FS ngược (từ $c_k$ về $x(t)$)

[P] Cho hệ số Fourier $c_k$ của tín hiệu tuần hoàn $x(t)$ chu kỳ $T_0$, tần số cơ sở $\omega_0 = 2\pi/T_0$:
[FORMULA: key]
$$x(t) = \sum_{k=-\infty}^{\infty} c_k e^{jk\omega_0 t}$$
[/FORMULA]

### B.2. FT ngược (từ $X(\omega)$ về $x(t)$)

[FORMULA: key]
$$x(t) = \frac{1}{2\pi}\int_{-\infty}^{\infty}X(\omega)e^{j\omega t}d\omega$$
[/FORMULA]

[BOX: warn] **Đừng quên $\frac{1}{2\pi}$!** Đây là hệ số phân biệt FT với FS. FS không có hệ số này vì $c_k$ đã chứa sẵn $\frac{1}{T_0}$. FT có vì tích phân liên tục không có "trọng số tự nhiên".

### B.3. DTFS ngược (từ $X[k]$ về $x[n]$)

[P] Cho hệ số DTFS $X[k]$ (hoặc $c_k$) của tín hiệu tuần hoàn rời rạc $x[n]$ chu kỳ $N_0$, tần số góc cơ sở $\Omega_0 = 2\pi/N_0$:
[FORMULA: key]
$$x[n] = \sum_{k=0}^{N_0-1}X[k]e^{jk\Omega_0 n}$$
[/FORMULA]

[P] (Tổng chỉ có $N_0$ số hạng — khác FS vì $X[k]$ tuần hoàn chu kỳ $N_0$.)

### B.4. DTFT ngược (từ $X(\Omega)$ về $x[n]$)

[FORMULA: key]
$$x[n] = \frac{1}{2\pi}\int_{2\pi}X(\Omega)e^{j\Omega n}d\Omega$$
[/FORMULA]

[P] (Tích phân trên một chu kỳ $2\pi$ bất kỳ — thường từ $-\pi$ đến $\pi$.)

---

## Phần C. Phương pháp giải — Từ hệ số về tín hiệu

### C.1. Ý tưởng cốt lõi — "Nhận diện mũ phức"

[P] Trong hầu hết bài tập, hệ số $X[k]$ (hoặc $c_k$) có dạng **tổng các delta** $\delta[k - k_0]$ — tức là chỉ có vài tần số đóng góp. Khi đó, biến đổi ngược trở nên rất đơn giản:
[FORMULA: key]
$$\text{Nếu } X[k] = \delta[k - k_0] \text{ thì } x[n] = e^{jk_0\Omega_0 n}$$
$$\text{Nếu } X[k] = A\,\delta[k - k_0] \text{ thì } x[n] = A\,e^{jk_0\Omega_0 n}$$
[/FORMULA]

[P] Nói cách khác: **mỗi delta trong miền tần số tương ứng với một mũ phức trong miền thời gian**. Đây là "bảng cửu chương" của biến đổi ngược.

[BOX: analogy] **Ẩn dụ**: Hãy tưởng tượng hệ số Fourier là "công thức nấu ăn" — mỗi $\delta[k-k_0]$ là "một thìa đường tại vị trí $k_0$". Khi bạn làm ngược (nấu ăn từ công thức), mỗi thìa đường biến thành một "làn sóng" $e^{jk_0\Omega_0 n}$ trong nồi. Tổng các làn sóng = món ăn hoàn chỉnh. Càng nhiều delta, món càng phức tạp.

### C.2. Quy trình 4 bước

[STEPS]
1. **Bước 1 — Viết $X[k]$ dưới dạng tổng delta**: Nếu $X[k]$ đã ở dạng delta (như $\delta[k-2]$), bỏ qua. Nếu ở dạng $\cos$, $\sin$, dùng công thức Euler để chuyển thành tổng mũ phức $e^{\pm j\cdots k}$.
2. **Bước 2 — Xác định $\Omega_0$ (hoặc $\omega_0$)**: Từ $N_0$ (hoặc $T_0$) cho trong đề.
3. **Bước 3 — Áp dụng bảng nhận diện**: Mỗi số hạng $A\,e^{jm\Omega_0 k}$ tương ứng $A\,\delta[n + m]$ trong một chu kỳ (cần chú ý dấu). Mỗi $\delta[k-m]$ tương ứng $e^{jm\Omega_0 n}$.
4. **Bước 4 — Rút gọn về dạng sin/cos** (nếu cần): Nhóm các cặp $e^{j\theta} + e^{-j\theta} = 2\cos\theta$, $e^{j\theta} - e^{-j\theta} = 2j\sin\theta$.
[/STEPS]

[BOX: warn] **Chú ý dấu — điểm dễ nhầm nhất**:
- $X[k] = \delta[k-m]$ → $x[n] = e^{jm\Omega_0 n}$ (mũ phức với **dấu dương** $+m$).
- $X[k] = e^{jm\Omega_0 k}$ (tức $\delta$ dịch trong miền tần số) → $x[n] = \delta[n+m]$ (delta dịch **ngược dấu** trong miền thời gian).

Đây là cặp "đối ngẫu" — nhớ kỹ để không bị lẫn.

### C.3. Các tính chất ngược cần nhớ

[P] Đây là các tính chất **của biến đổi Fourier** (nhưng dùng theo chiều ngược). Bạn đã học ở Bài 6 — giờ áp dụng chiều ngược:

[TABLE]
| Nếu phổ có... | Thì tín hiệu có... |
|---|---|
| Nhân với $e^{-j\omega t_0}$ (hoặc $e^{-j\Omega n_0}$) | Dịch phải $t_0$ (hoặc $n_0$) trong thời gian |
| Nhân với $e^{j\omega t_0}$ | Dịch trái $t_0$ |
| Nhân với $\cos(\omega_0 k)$ hoặc $\cos(\Omega_0 k)$ | Trung bình cộng hai bản dịch $\pm$ |
| Nhân với $\sin(\cdots)$ | Hiệu hai bản dịch (có hệ số) |
| Nhân với hằng số $A$ | Nhân tín hiệu với $A$ |
| Cộng hai phổ | Cộng hai tín hiệu |
| $X[k]$ tuần hoàn chu kỳ $N$ | $x[n]$ rời rạc (đương nhiên) |
[/TABLE]

[BOX: analogy] **Mẹo hiểu tính chất "nhân cos"**: $\cos(\theta) = \frac{1}{2}(e^{j\theta} + e^{-j\theta})$ — trung bình của hai mũ phức. Trong miền thời gian, mỗi mũ phức tương ứng một phép dịch. Vậy nhân với cos = **trung bình cộng của hai phép dịch ngược chiều**. Ví dụ nhân với $\cos(\pi k/5)$ → dịch trái 2 và dịch phải 2, rồi lấy trung bình.

---

## Phần D. Ví dụ chi tiết từng loại

### D.1. FS ngược — Từ $c_k$ về $x(t)$

[P] **Ví dụ**: Cho $c_k = -j\delta[k-2] + j\delta[k+2] + 2\delta[k-3] + 2\delta[k+3]$ với $\omega_0 = \pi$. Tìm $x(t)$.

**Lời giải**:

[STEPS]
1. **Áp dụng công thức**: $x(t) = \sum_k c_k e^{jk\omega_0 t} = \sum_k c_k e^{jk\pi t}$.
2. **Thay từng số hạng**:
   - $-j\delta[k-2] \to -j e^{j2\pi t}$.
   - $j\delta[k+2] \to j e^{-j2\pi t}$.
   - $2\delta[k-3] \to 2 e^{j3\pi t}$.
   - $2\delta[k+3] \to 2 e^{-j3\pi t}$.
3. **Cộng và rút gọn**:
$$x(t) = -j e^{j2\pi t} + j e^{-j2\pi t} + 2e^{j3\pi t} + 2e^{-j3\pi t}$$
   Nhóm cặp 1: $-j(e^{j2\pi t} - e^{-j2\pi t}) = -j\cdot 2j\sin(2\pi t) = 2\sin(2\pi t)$.
   Nhóm cặp 2: $2(e^{j3\pi t} + e^{-j3\pi t}) = 4\cos(3\pi t)$.
[/STEPS]

[ANS] **Kết quả: $x(t) = 2\sin(2\pi t) + 4\cos(3\pi t)$**.

[BOX: warn] **Lưu ý dấu**: $-j\delta[k-2] + j\delta[k+2]$ → hệ số của $e^{j2\pi t}$ là $-j$, của $e^{-j2\pi t}$ là $+j$. Nhóm lại: $-j e^{j\theta} + j e^{-j\theta} = -j(e^{j\theta} - e^{-j\theta}) = -j\cdot 2j\sin\theta = +2\sin\theta$. **Không phải** $-2\sin\theta$ — đừng nhầm dấu!

### D.2. DTFS ngược — Từ $X[k]$ về $x[n]$

[P] **Ví dụ**: $X[k] = \cos(4\pi k/11) + 2j\sin(6\pi k/11)$, $N=11$. Tìm một chu kỳ của $x[n]$.

**Lời giải**:

[STEPS]
1. **Dùng Euler**:
   - $\cos(4\pi k/11) = \frac{1}{2}e^{j4\pi k/11} + \frac{1}{2}e^{-j4\pi k/11}$.
   - $2j\sin(6\pi k/11) = 2j\cdot\frac{1}{2j}(e^{j6\pi k/11} - e^{-j6\pi k/11}) = e^{j6\pi k/11} - e^{-j6\pi k/11}$.
2. **Xác định $\Omega_0 = 2\pi/N = 2\pi/11$**.
3. **Nhận diện**: Mỗi $e^{jm\Omega_0 k}$ tương ứng $\delta[n+m]$ trong một chu kỳ.
   - $\frac{1}{2}e^{j2\Omega_0 k}$ ($m=2$) → $\frac{1}{2}\delta[n+2]$.
   - $\frac{1}{2}e^{-j2\Omega_0 k}$ ($m=-2$) → $\frac{1}{2}\delta[n-2]$.
   - $e^{j3\Omega_0 k}$ ($m=3$) → $\delta[n+3]$.
   - $-e^{-j3\Omega_0 k}$ ($m=-3$) → $-\delta[n-3]$.
4. **Cộng**:
$$x[n] = \frac{1}{2}\delta[n-2] + \frac{1}{2}\delta[n+2] + \delta[n+3] - \delta[n-3]$$
   (với $-5 \leq n \leq 5$).
[/STEPS]

[ANS] **Kết quả: $x[n] = \frac{1}{2}\delta[n-2] + \frac{1}{2}\delta[n+2] + \delta[n+3] - \delta[n-3]$** (trong khoảng $-5 \leq n \leq 5$).

### D.3. DTFT ngược — Từ $X(\Omega)$ về $x[n]$

[P] **Ví dụ**: $X(\Omega) = \sin(2\Omega + \pi/2)$. Tìm $x[n]$.

**Lời giải**:

[STEPS]
1. **Rút gọn**: $\sin(\theta + \pi/2) = \cos\theta$. Vậy $X(\Omega) = \cos(2\Omega)$.
2. **Dùng Euler**: $\cos(2\Omega) = \frac{1}{2}e^{j2\Omega} + \frac{1}{2}e^{-j2\Omega}$.
3. **Nhận diện**: $e^{jm\Omega}$ tương ứng $\delta[n+m]$ (tính chất DTFT).
   - $\frac{1}{2}e^{j2\Omega}$ → $\frac{1}{2}\delta[n+2]$.
   - $\frac{1}{2}e^{-j2\Omega}$ → $\frac{1}{2}\delta[n-2]$.
[/STEPS]

[ANS] **Kết quả: $x[n] = \frac{1}{2}\delta[n+2] + \frac{1}{2}\delta[n-2]$**.

[BOX: analogy] **Tại sao $\delta[n\pm 2]$ mà không phải $\delta[n\mp 2]$?** Vì DTFT của $\delta[n-n_0]$ là $e^{-j\Omega n_0}$. Nếu ta có $e^{+j2\Omega}$, thì $-n_0 = 2 \Rightarrow n_0 = -2$, vậy $x[n] = \delta[n - (-2)] = \delta[n+2]$. Dấu **đảo ngược** — đây là điểm hay nhầm.

### D.4. Nhân với cos trong miền tần số — Dịch trong miền thời gian

[P] **Ví dụ** (tương tự Câu 2): $Y[k] = \cos(\pi k/5)\cdot X[k]$, $N=20$. Tìm $y[n]$ theo $x[n]$.

**Lời giải**:

[STEPS]
1. **Xác định $\Omega_0 = 2\pi/20 = \pi/10$**.
2. **Phân tích $\cos$**: $\cos(\pi k/5) = \frac{1}{2}(e^{j\pi k/5} + e^{-j\pi k/5})$.
3. **Đưa về dạng $e^{jm\Omega_0 k}$**:
   - $e^{j\pi k/5} = e^{j(\pi/10)\cdot 2 k} = e^{j2\Omega_0 k}$ → dịch $n$ đi $-2$ (tức $x[n+2]$).
   - $e^{-j\pi k/5} = e^{-j2\Omega_0 k}$ → dịch $n$ đi $+2$ (tức $x[n-2]$).
4. **Kết quả**:
$$y[n] = \frac{1}{2}(x[n+2] + x[n-2])$$
[/STEPS]

[ANS] **Kết quả: $y[n] = \frac{1}{2}(x[n+2] + x[n-2])$**.

[BOX: warn] **Kiểm tra dấu dịch**: Nếu $Y[k] = e^{j\Omega_0 k} X[k]$ thì $y[n] = x[n+1]$ (dịch trái). Vì $e^{j\Omega_0 k}$ là "nhân với pha dương" trong miền tần số, tương ứng "dịch trái" trong miền thời gian. Đây là **ngược dấu** so với trực giác. Hãy nhớ: **dấu của pha ngược với dấu của dịch**.

---

## Phần E. Các bẫy thi

[BOX: warn] **6 bẫy phổ biến**:

1. **Nhầm dấu dịch**: $e^{+jm\Omega_0 k}$ → dịch **trái** ($x[n+m]$), không phải dịch phải. Cặp đối ngẫu: "nhân pha dương ↔ dịch trái".

2. **Quên hệ số $\frac{1}{2\pi}$ trong FT ngược**: FT ngược có $\frac{1}{2\pi}$ (khác với FS). DTFT cũng có $\frac{1}{2\pi}$.

3. **Nhầm $\frac{1}{N}$ và $\frac{1}{2\pi}$**: DTFS ngược **không có** $\frac{1}{N}$ (vì đã chứa trong $X[k]$). DTFT ngược có $\frac{1}{2\pi}$.

4. **Không rút gọn $\sin(\theta + \pi/2) = \cos\theta$**: Nếu đề cho $\sin(\cdots + \pi/2)$, phải rút gọn trước khi khai triển.

5. **Nhầm dấu khi nhóm cặp liên hợp phức**:
   - $-j(e^{j\theta} - e^{-j\theta}) = -j\cdot 2j\sin\theta = +2\sin\theta$ (dấu $+$).
   - $j(e^{j\theta} - e^{-j\theta}) = j\cdot 2j\sin\theta = -2\sin\theta$ (dấu $-$).
   Đừng nhầm dấu của $\sin$.

6. **Quên một chu kỳ cho tín hiệu tuần hoàn**: Khi đề hỏi "một chu kỳ", phải xác định rõ khoảng (ví dụ $-5 \leq n \leq 5$ với $N=11$). Ngoài khoảng đó, tín hiệu lặp lại.

[H3] Câu 1. $X[k] = \frac{1}{10}(1 - e^{-j2\pi k/5})$ với $N=10$. Tìm $x[n]$.

[P] **Đề**: Tìm một chu kỳ của $x[n]$ (biết $x[0]=1$, $x[8]=-1$, còn lại 0 — đề cho dạng khác nhưng tương đương).

**Lời giải**

[STEPS]
1. **Khai triển $X[k]$**:
$$X[k] = \frac{1}{10} - \frac{1}{10}e^{-j2\pi k/5}$$
2. **Áp dụng DTFS ngược**: $x[n] = \sum_{k=0}^{9}X[k]e^{jk\pi n/5}$ (vì $\Omega_0 = 2\pi/10 = \pi/5$).
3. **Số hạng 1**: $\frac{1}{10}\sum_k e^{jk\pi n/5} = \delta[n \bmod 10]$ — tức bằng $1$ khi $n \equiv 0 \pmod{10}$, còn lại $0$. Trong một chu kỳ $[0, 9]$: $\delta[n]$.
4. **Số hạng 2**: $\frac{1}{10}\sum_k e^{jk\pi n/5}e^{-j2\pi k/5} = \frac{1}{10}\sum_k e^{jk\pi(n-2)/5}$. Bằng $1$ khi $n-2 \equiv 0 \pmod{10}$, tức $n \equiv 2 \pmod{10}$. Trong $[0,9]$: $\delta[n-2]$.
5. **Kết quả**: $x[n] = \delta[n] - \delta[n-2]$ với $n \in [0, 9]$.
[/STEPS]

[BOX: warn] **Kiểm tra**: Nếu $x[n] = \delta[n] - \delta[n-2]$, thì $X[k] = \frac{1}{10}(e^0 - e^{-jk 2\pi \cdot 2/10}) = \frac{1}{10}(1 - e^{-j2\pi k/5})$ ✓. Đúng.

[ANS] **Đáp án: $X[k] = \frac{1}{10}(1 - e^{-j2\pi k/5})$** — tùy chọn 2.

---

[H3] Câu 2. $Y[k] = \cos(\pi k/5)\cdot X[k]$, $N=20$. Tìm $y[n]$ theo $x[n]$.

[P] **Đề**: Tìm quan hệ giữa $y[n]$ và $x[n]$.

**Lời giải**

[STEPS]
1. **$\Omega_0 = 2\pi/20 = \pi/10$**.
2. **Khai triển $\cos$**:
$$\cos(\pi k/5) = \frac{1}{2}\left(e^{j\pi k/5} + e^{-j\pi k/5}\right)$$
3. **Đưa về dạng $e^{jm\Omega_0 k}$**:
   - $e^{j\pi k/5} = e^{j(\pi/10)\cdot 2 k} = e^{j2\Omega_0 k}$ → dịch **trái** 2 (vì nhân pha dương = dịch trái).
   - $e^{-j\pi k/5} = e^{-j2\Omega_0 k}$ → dịch **phải** 2 (vì nhân pha âm = dịch phải).
4. **Kết quả**: 
$$y[n] = \frac{1}{2}(x[n+2] + x[n-2])$$
[/STEPS]

[ANS] **Đáp án: $y[n] = \frac{1}{2}(x[n+2] + x[n-2])$** — tùy chọn 1.

[H3] Câu 3. $X[k] = \cos(4\pi k/11) + 2j\sin(6\pi k/11)$, $N=11$. Tìm $x[n]$.

**Lời giải**

[STEPS]
1. **$\Omega_0 = 2\pi/11$**.
2. **Khai triển $\cos$**:
$$\cos(4\pi k/11) = \frac{1}{2}e^{j4\pi k/11} + \frac{1}{2}e^{-j4\pi k/11} = \frac{1}{2}e^{j2\Omega_0 k} + \frac{1}{2}e^{-j2\Omega_0 k}$$
3. **Khai triển $2j\sin$**:
$$2j\sin(6\pi k/11) = e^{j6\pi k/11} - e^{-j6\pi k/11} = e^{j3\Omega_0 k} - e^{-j3\Omega_0 k}$$
4. **Nhận diện** (nhân pha $+m\Omega_0$ = dịch trái $m$ trong một chu kỳ):
   - $\frac{1}{2}e^{j2\Omega_0 k}$ → $\frac{1}{2}\delta[n+2]$.
   - $\frac{1}{2}e^{-j2\Omega_0 k}$ → $\frac{1}{2}\delta[n-2]$.
   - $e^{j3\Omega_0 k}$ → $\delta[n+3]$.
   - $-e^{-j3\Omega_0 k}$ → $-\delta[n-3]$.
5. **Kết quả**: $x[n] = \frac{1}{2}\delta[n-2] + \frac{1}{2}\delta[n+2] + \delta[n+3] - \delta[n-3]$ (với $-5 \leq n \leq 5$).
[/STEPS]

[ANS] **Đáp án: $x[n] = \frac{1}{2}\delta[n-2] + \frac{1}{2}\delta[n+2] + \delta[n+3] - \delta[n-3]$** — tùy chọn 1.

---

[H3] Câu 4. $X(\Omega) = \sin(2\Omega + \pi/2)$. Tìm $x[n]$.

**Lời giải**

[STEPS]
1. **Rút gọn**: $\sin(\theta + \pi/2) = \cos\theta$, nên $X(\Omega) = \cos(2\Omega)$.
2. **Euler**: $\cos(2\Omega) = \frac{1}{2}(e^{j2\Omega} + e^{-j2\Omega})$.
3. **DTFT ngược**: $e^{jm\Omega} \leftrightarrow \delta[n+m]$.
   - $\frac{1}{2}e^{j2\Omega} \to \frac{1}{2}\delta[n+2]$.
   - $\frac{1}{2}e^{-j2\Omega} \to \frac{1}{2}\delta[n-2]$.
[/STEPS]

[ANS] **Đáp án: $x[n] = \frac{1}{2}(\delta[n+2] + \delta[n-2])$** — tùy chọn 1.

---

[H3] Câu 5. $X[k] = \delta[k-2] - 2\delta[k-3] + \delta[k-4]$, $N=6$. Tìm $x[n]$.

**Lời giải**

[STEPS]
1. **$\Omega_0 = 2\pi/6 = \pi/3$**.
2. **DTFS ngược**: $x[n] = \sum_k X[k]e^{jk\Omega_0 n}$. Với $\delta[k-m]$, tương ứng $e^{jm\Omega_0 n}$.
   - $\delta[k-2] \to e^{j2\pi n/3}$.
   - $-2\delta[k-3] \to -2e^{j3\pi n/3} = -2e^{j\pi n}$.
   - $\delta[k-4] \to e^{j4\pi n/3}$.
3. **Rút gọn**:
   - $e^{j2\pi n/3} + e^{j4\pi n/3} = e^{j2\pi n/3} + e^{-j2\pi n/3} = 2\cos(2\pi n/3)$ (vì $e^{j4\pi n/3} = e^{-j2\pi n/3}$).
   - $e^{j\pi n} = \cos(\pi n) = (-1)^n$.
[/STEPS]

[ANS] **Đáp án: $x[n] = 2\cos(2\pi n/3) - 2\cos(\pi n)$** — tùy chọn 1.

---

[H3] Câu 6. $X[k] = -j\delta[k-2] + j\delta[k+2] + 2\delta[k-3] + 2\delta[k+3]$, $\Omega_0 = \pi$. Tìm $x(t)$.

**Lời giải**

[STEPS]
1. **FS ngược**: $x(t) = \sum_k X[k]e^{jk\pi t}$.
2. **Thay số hạng**:
   - $-j\delta[k-2] \to -j e^{j2\pi t}$.
   - $j\delta[k+2] \to j e^{-j2\pi t}$.
   - $2\delta[k-3] \to 2e^{j3\pi t}$.
   - $2\delta[k+3] \to 2e^{-j3\pi t}$.
3. **Rút gọn**:
   - Cặp 1: $-j e^{j2\pi t} + j e^{-j2\pi t} = -j(e^{j2\pi t} - e^{-j2\pi t}) = -j\cdot 2j\sin(2\pi t) = 2\sin(2\pi t)$.
   - Cặp 2: $2(e^{j3\pi t} + e^{-j3\pi t}) = 4\cos(3\pi t)$.
[/STEPS]

[ANS] **Đáp án: $x(t) = 2\sin(2\pi t) + 4\cos(3\pi t)$** — tùy chọn 1.

---

[H3] Câu 7. $X[k] = \delta[k+2] + \delta[k-2] + 2j\delta[k+3] - 2j\delta[k-3]$, $T=6$. Tìm $x(t)$.

**Lời giải**

[STEPS]
1. **$\Omega_0 = 2\pi/6 = \pi/3$**.
2. **FS ngược**: $x(t) = \sum_k X[k]e^{jk\pi t/3}$.
3. **Thay số hạng**:
   - $\delta[k+2] \to e^{-j2\pi t/3}$.
   - $\delta[k-2] \to e^{j2\pi t/3}$.
   - $2j\delta[k+3] \to 2j e^{-j\pi t}$.
   - $-2j\delta[k-3] \to -2j e^{j\pi t}$.
4. **Rút gọn**:
   - Cặp 1: $e^{j2\pi t/3} + e^{-j2\pi t/3} = 2\cos(2\pi t/3)$.
   - Cặp 2: $2j(e^{-j\pi t} - e^{j\pi t}) = 2j\cdot(-2j\sin(\pi t)) = 4\sin(\pi t)$.
5. **Kết quả**: $x(t) = 2\cos(2\pi t/3) + 4\sin(\pi t)$.
[/STEPS]

[ANS] **Đáp án: $x(t) = 2\cos(2\pi t/3) + 4\sin(\pi t)$** — tùy chọn 1.

---

[SECTION: bai7-summary]

[H2] Tổng kết Bài 7

[BOX] **Bảng tổng hợp 7 câu**:

| Câu | Cho | Tìm | Đáp án |
|---|---|---|---|
| 1 | $X[k] = \frac{1}{10}(1-e^{-j2\pi k/5})$, $N=10$ | $x[n]$ | $\delta[n] - \delta[n-2]$ |
| 2 | $Y[k] = \cos(\pi k/5)X[k]$, $N=20$ | $y[n]$ | $\frac{1}{2}(x[n+2]+x[n-2])$ |
| 3 | $X[k] = \cos(4\pi k/11)+2j\sin(6\pi k/11)$, $N=11$ | $x[n]$ | $\frac{1}{2}\delta[n\mp2] + \delta[n+3] - \delta[n-3]$ |
| 4 | $X(\Omega) = \sin(2\Omega+\pi/2)$ | $x[n]$ | $\frac{1}{2}(\delta[n+2]+\delta[n-2])$ |
| 5 | $X[k] = \delta[k-2]-2\delta[k-3]+\delta[k-4]$, $N=6$ | $x[n]$ | $2\cos(2\pi n/3)-2\cos(\pi n)$ |
| 6 | $X[k] = -j\delta[k-2]+j\delta[k+2]+2\delta[k-3]+2\delta[k+3]$, $\Omega_0=\pi$ | $x(t)$ | $2\sin(2\pi t)+4\cos(3\pi t)$ |
| 7 | $X[k] = \delta[k+2]+\delta[k-2]+2j\delta[k+3]-2j\delta[k-3]$, $T=6$ | $x(t)$ | $2\cos(2\pi t/3)+4\sin(\pi t)$ |

[BOX: warn] **6 bẫy thi**:
1. **Nhầm dấu dịch**: $e^{+jm\Omega_0 k}$ → dịch **trái** $m$, không phải dịch phải.
2. **Quên $\frac{1}{2\pi}$ trong FT/DTFT ngược** — FT và DTFT có hệ số này; FS/DTFS không có.
3. **Không rút gọn $\sin(\theta+\pi/2)=\cos\theta$** trước khi khai triển.
4. **Nhầm dấu $\sin$ khi nhóm cặp**: $-j(e^{j\theta}-e^{-j\theta}) = +2\sin\theta$ (không phải $-2\sin\theta$).
5. **Quên $N_0$ của tín hiệu tuần hoàn**: Phải xác định rõ một chu kỳ, đừng quên khoảng.
6. **Nhầm $\frac{1}{N}$ và $\frac{1}{2\pi}$**: DTFS ngược **không có** $\frac{1}{N}$; DTFT ngược **có** $\frac{1}{2\pi}$.

[BOX] **Công thức cần nhớ**:
- **FS ngược**: $x(t) = \sum_k c_k e^{jk\omega_0 t}$.
- **FT ngược**: $x(t) = \frac{1}{2\pi}\int X(\omega)e^{j\omega t}d\omega$.
- **DTFS ngược**: $x[n] = \sum_{k=0}^{N_0-1}X[k]e^{jk\Omega_0 n}$.
- **DTFT ngược**: $x[n] = \frac{1}{2\pi}\int X(\Omega)e^{j\Omega n}d\Omega$.
- **Cặp đối ngẫu**: $\delta[k-m] \leftrightarrow e^{jm\Omega_0 n}$ và $e^{jm\Omega_0 k} \leftrightarrow \delta[n+m]$.
- **Nhân với $\cos$**: $\cos(m\Omega_0 k)X[k] \leftrightarrow \frac{1}{2}(x[n+m] + x[n-m])$.
- **Công thức Euler ngược**: $\cos\theta = \frac{1}{2}(e^{j\theta} + e^{-j\theta})$; $\sin\theta = \frac{1}{2j}(e^{j\theta} - e^{-j\theta})$.

[BOX: analogy] **Câu thần chú cuối bài**: *"Từ phổ về tín hiệu: mỗi delta là một mũ phức, mỗi mũ phức là một delta. Dấu ngược nhau — nhân pha dương thì dịch trái. Nhân cos thì trung bình hai dịch. Nhớ Euler: cos là tổng, sin là hiệu. Và đừng quên: FT ngược có $\frac{1}{2\pi}$, FS ngược thì không."*

# BÀI 8 (BẢN ĐẦY ĐỦ): ĐÁP ỨNG TẦN SỐ CỦA HỆ THỐNG LTI

[SECTION: bai8-overview]

[H2] Bài 8. Đáp ứng tần số — Cách hệ thống phản ứng với từng tần số

---

## Phần A. Động cơ — Tại sao phải học đáp ứng tần số?

[BRIDGE] Ở Bài 6 và 7, bạn đã biết cách phân tích tín hiệu thành tổng các sin/cos. Giờ câu hỏi là: **khi đưa một tín hiệu sin/cos vào hệ thống LTI, đầu ra là gì?** Đáp ứng tần số $H(\omega)$ (hoặc $H(\Omega)$) trả lời chính xác câu hỏi đó — nó cho biết **hệ thống khuếch đại hay làm yếu từng tần số, và dịch pha bao nhiêu**.

[P] **Tại sao đây là bài quan trọng bậc nhất của môn?**

Hãy tưởng tượng bạn thiết kế bộ lọc âm thanh. Bạn muốn giữ tần số giọng nói (300 Hz – 3 kHz) và chặn tần số nhiễu (50 Hz của điện lưới, hoặc 10 kHz của tiếng rít). Câu hỏi: **làm sao biết bộ lọc của bạn có làm đúng việc đó không?** Trả lời: nhìn vào $|H(\omega)|$ — nếu $|H| \approx 1$ trong dải 300–3000 Hz và $|H| \approx 0$ ngoài dải đó, bộ lọc hoạt động đúng.

[P] **Ba lý do cốt lõi**:

1. **Tính eigenfunction**: $e^{j\omega t}$ là "hàm riêng" của hệ LTI — đưa vào hệ thống, đầu ra vẫn là $e^{j\omega t}$ nhân với một số phức $H(\omega)$. Đây là lý do hệ LTI dễ phân tích: chỉ cần nhân từng tần số với $H$, không cần tích chập phức tạp.

2. **Đáp ứng với sin/cos**: Nhờ eigenfunction, đáp ứng với $A\cos(\omega_0 t + \phi)$ là $A|H(\omega_0)|\cos(\omega_0 t + \phi + \angle H(\omega_0))$ — cùng tần số, chỉ khác biên độ và pha. Đây là công thức "thần thánh" của bài này.

3. **Liên hệ với phương trình vi/sai phân**: Từ phương trình mô tả hệ thống, có thể tìm $H(\omega)$ bằng cách thay $d/dt \to j\omega$ (hoặc $y[n-k] \to e^{-jk\Omega}$). Đây là cầu nối giữa Bài 5 (phương trình) và Bài 8 (tần số).

[BOX: analogy] **Ẩn dụ**: Hãy nghĩ $H(\omega)$ như "bộ điều chỉnh âm thanh" (equalizer) của dàn âm thanh. Với mỗi tần số, nó có một **hệ số khuếch đại** (biên độ) và một **độ trễ** (pha). Tín hiệu vào đi qua bộ điều chỉnh → tín hiệu ra bị thay đổi biên độ và pha theo từng tần số. Nếu bạn biết $H(\omega)$, bạn biết chính xác "bộ điều chỉnh" đã làm gì.
[FIG: 8.2] Đáp ứng biên độ $|H(\omega)|$ của bộ lọc thông thấp. Tần số thấp: $|H| \approx 1$ (qua). Tần số cao: $|H| \approx 0$ (chặn). $\omega_c$ là tần số cắt.

---

## Phần B. Định nghĩa và ý nghĩa

### B.1. Định nghĩa

[P] **Đáp ứng tần số** của hệ thống LTI là biến đổi Fourier của đáp ứng xung:
[FORMULA: key]
$$\text{Liên tục: } H(\omega) = \mathcal{F}\{h(t)\} = \int_{-\infty}^{\infty}h(t)e^{-j\omega t}dt$$
$$\text{Rời rạc: } H(\Omega) = \mathcal{F}\{h[n]\} = \sum_{n=-\infty}^{\infty}h[n]e^{-j\Omega n}$$
[/FORMULA]

[P] $H(\omega)$ (hoặc $H(\Omega)$) là số **phức**. Viết dưới dạng cực:
$$H(\omega) = |H(\omega)|\,e^{j\angle H(\omega)}$$

- $|H(\omega)|$: **đáp ứng biên độ** — cho biết hệ thống khuếch đại (nếu $>1$) hay làm yếu (nếu $<1$) tần số $\omega$.
- $\angle H(\omega)$: **đáp ứng pha** — cho biết hệ thống dịch pha bao nhiêu tại tần số $\omega$.
[FIG: 8.1] Đáp ứng tần số của hệ LTI. Tín hiệu cos vào hệ thống, đầu ra vẫn là cos **cùng tần số** — chỉ khác biên độ (nhân $|H(\omega_0)|$) và pha (cộng $\angle H(\omega_0)$).

### B.2. Tính chất eigenfunction — Trái tim của bài này

[P] Khi đưa $x(t) = e^{j\omega_0 t}$ vào hệ thống LTI có đáp ứng xung $h(t)$:
$$y(t) = \int h(\tau)x(t-\tau)d\tau = \int h(\tau)e^{j\omega_0(t-\tau)}d\tau = e^{j\omega_0 t}\underbrace{\int h(\tau)e^{-j\omega_0\tau}d\tau}_{H(\omega_0)}$$
[FORMULA: key]
$$\boxed{y(t) = H(\omega_0)\,e^{j\omega_0 t}}$$
[/FORMULA]

[P] Nghĩa là: **đầu ra vẫn là $e^{j\omega_0 t}$** (cùng tần số!), chỉ bị nhân với số phức $H(\omega_0)$. Tần số **không đổi** — chỉ biên độ và pha thay đổi. Đây là tính chất **eigenfunction** (hàm riêng).

[BOX: analogy] **Tại sao đây là tính chất "thần kỳ"?** Hãy tưởng tượng bạn đưa một tín hiệu phức tạp (như giọng nói) qua hệ thống. Tín hiệu đó có thể chứa hàng trăm tần số. Nhờ eigenfunction, bạn **không cần tính tích chập** — chỉ cần:
1. Phân tích tín hiệu thành tổng các $e^{j\omega_k t}$.
2. Nhân mỗi thành phần với $H(\omega_k)$.
3. Cộng lại.

Đây chính là lý do Fourier "hợp" với hệ LTI: cả hai đều làm việc với tần số.

### B.3. Hệ quả — Đáp ứng với sin/cos

[P] Từ eigenfunction, suy ra công thức cực kỳ quan trọng:
[FORMULA: key]
$$\text{Nếu } x(t) = A\cos(\omega_0 t + \phi) \text{ thì } y(t) = A|H(\omega_0)|\cos(\omega_0 t + \phi + \angle H(\omega_0))$$
[/FORMULA]

[P] Tương tự cho sin. Đây là công thức **hay dùng nhất** trong bài này.

[BOX: warn] **Chú ý**: Công thức này chỉ áp dụng khi đầu vào là **một sin/cos duy nhất** ở tần số $\omega_0$. Nếu đầu vào có nhiều tần số, phải xử lý từng tần số riêng rồi cộng lại (tính tuyến tính).

### B.4. Hệ quả — Đáp ứng với hằng số (DC)

[P] Hằng số $A$ có thể coi là $\cos(0\cdot t)$ với tần số $\omega_0 = 0$. Áp dụng công thức:
$$y = A\cdot H(0)$$
[P] $H(0)$ gọi là **độ lợi DC** (DC gain) — cho biết hệ thống khuếch đại hằng số bao nhiêu lần.

[P] **Với tín hiệu rời rạc**: hằng số $A$ có tần số $\Omega = 0$. Đáp ứng: $y = A\cdot H(0)$.

[BOX: analogy] **Mẹo tính nhanh**: $H(0)$ là giá trị của $H$ khi tần số bằng 0 — tức là "tổng các hệ số" của $h$:
- Liên tục: $H(0) = \int h(t)dt$.
- Rời rạc: $H(0) = \sum h[n]$.

Nếu đề cho $H(\omega)$ dạng phân thức, chỉ cần thay $\omega = 0$ vào là có ngay $H(0)$ — không cần tính tích phân.

---

## Phần C. Phương pháp giải — 3 dạng bài chính

### C.1. Dạng 1 — Cho $H(\omega)$ và $x(t)$ dạng sin/cos + hằng số

[P] **Quy trình 4 bước**:

[STEPS]
1. **Tách tín hiệu vào thành các thành phần tần số riêng biệt**:
   - Hằng số $A$: tần số $\omega = 0$.
   - $\cos(\omega_0 t + \phi)$ hoặc $\sin$: tần số $\omega_0$.
   - Nếu có nhiều tần số khác nhau, tách từng cái.
2. **Tính $H(\omega_k)$ cho từng tần số**:
   - Thay $\omega_k$ vào biểu thức $H(\omega)$.
   - Rút gọn về dạng $a + bj$.
   - Chuyển sang dạng cực: $|H| = \sqrt{a^2 + b^2}$, $\angle H = \arctan(b/a)$.
3. **Áp dụng công thức cho từng thành phần**:
   - Hằng số $A$ → $A\cdot H(0)$.
   - $A\cos(\omega_0 t + \phi)$ → $A|H(\omega_0)|\cos(\omega_0 t + \phi + \angle H(\omega_0))$.
   - $A\sin(\omega_0 t + \phi)$ → tương tự với sin.
4. **Cộng các thành phần** lại (tính xếp chồng).
[/STEPS]

[BOX: analogy] **Mẹo nhớ công thức $\cos$**: "**Biên độ nhân |H|, pha cộng ∠H, tần số giữ nguyên**". Ba việc — chỉ vậy thôi. Đừng thay đổi tần số!

### C.2. Dạng 2 — Cho $h(t)$ hoặc $h[n]$, tìm đáp ứng với sin/cos + hằng số

[P] **Quy trình 3 bước**:

[STEPS]
1. **Tính $H(\omega) = \mathcal{F}\{h\}$**: Áp dụng công thức FT hoặc DTFT. Thường dùng bảng cặp thông dụng (Bài 6).
   - $e^{-at}u(t) \to 1/(a + j\omega)$.
   - $a^n u[n] \to 1/(1 - ae^{-j\Omega})$.
2. **Tính $H(\omega_k)$ cho từng tần số** trong tín hiệu vào (như Dạng 1).
3. **Áp dụng công thức cos/sin và cộng** (như Dạng 1).
[/STEPS]

### C.3. Dạng 3 — Cho phương trình vi/sai phân, tìm đáp ứng

[P] **Quy trình 4 bước**:

[STEPS]
1. **Tìm $H(\omega)$ từ phương trình** (xem Phần D dưới).
2. **Xác định tần số của tín hiệu vào**.
3. **Tính $H(\omega_k)$** cho từng tần số.
4. **Áp dụng công thức cos/sin**.
[/STEPS]

---

## Phần D. Cách tìm $H(\omega)$ từ phương trình vi/sai phân

### D.1. Phương pháp "thay thế"

[P] **Quy tắc vàng**:
- **Liên tục**: $\dfrac{d^k y}{dt^k} \to (j\omega)^k Y(\omega)$.
- **Rời rạc**: $y[n-k] \to e^{-jk\Omega}Y(\Omega)$.

[P] Lấy FT hai vế phương trình, rút $H(\omega) = Y(\omega)/X(\omega)$.

[BOX: analogy] **Tại sao thay thế được?** Vì FT biến đạo hàm thành phép nhân với $j\omega$ (tính chất đạo hàm ở Bài 6). Tương tự, $y[n-k]$ trong miền thời gian là "trễ $k$ mẫu" — trong miền tần số là nhân với $e^{-jk\Omega}$ (tính chất dịch). Đây là lý do phương trình vi/sai phân trong miền thời gian trở thành phương trình **đại số** trong miền tần số — dễ giải hơn nhiều!

### D.2. Công thức tổng quát

[P] **Liên tục**: Phương trình $\sum_{k=0}^{N}a_k\frac{d^k y}{dt^k} = \sum_{k=0}^{M}b_k\frac{d^k x}{dt^k}$.
[FORMULA: key]
$$H(\omega) = \frac{\sum_{k=0}^{M}b_k(j\omega)^k}{\sum_{k=0}^{N}a_k(j\omega)^k}$$
[/FORMULA]

[P] **Rời rạc**: Phương trình $\sum_{k=0}^{N}a_k y[n-k] = \sum_{k=0}^{M}b_k x[n-k]$.
[FORMULA: key]
$$H(\Omega) = \frac{\sum_{k=0}^{M}b_k e^{-jk\Omega}}{\sum_{k=0}^{N}a_k e^{-jk\Omega}}$$
[/FORMULA]

[BOX: analogy] **Mẹo nhớ**: Tử là **đầu vào** (bên phải phương trình), mẫu là **đầu ra** (bên trái). Thay $\frac{d}{dt} \to j\omega$ (liên tục) hoặc trễ $k$ → $e^{-jk\Omega}$ (rời rạc).

### D.3. Ví dụ

[P] **Ví dụ liên tục**: $y'(t) + 2y(t) = x(t) + x'(t)$.
- Lấy FT: $j\omega Y + 2Y = X + j\omega X$.
- Rút: $Y(j\omega + 2) = X(1 + j\omega)$.
- Vậy $H(\omega) = \dfrac{1 + j\omega}{2 + j\omega}$.

[P] **Ví dụ rời rạc**: $y[n] + \frac{1}{2}y[n-1] = x[n]$.
- Lấy DTFT: $Y + \frac{1}{2}e^{-j\Omega}Y = X$.
- Rút: $Y(1 + \frac{1}{2}e^{-j\Omega}) = X$.
- Vậy $H(\Omega) = \dfrac{1}{1 + \frac{1}{2}e^{-j\Omega}}$.

---

## Phần E. Các bẫy thi

[BOX: warn] **6 bẫy phổ biến**:

1. **Thay đổi tần số của tín hiệu**: Đây là lỗi nghiêm trọng nhất. Hệ thống LTI **không** đổi tần số — chỉ đổi biên độ và pha. Nếu bạn thấy mình viết $\cos(2t) \to \cos(3t)$ hay gì đó, dừng lại ngay!

2. **Quên xử lý thành phần DC**: Nếu tín hiệu vào có "+1" hoặc hằng số, phải xử lý riêng với $\omega = 0$. Nhiều bạn bỏ qua hoặc cộng nhầm.

3. **Nhầm $|H|$ và $H$**: Biên độ là $|H|$, không phải $H$. Khi áp dụng công thức $\cos$, phải dùng $|H(\omega_0)|$ — không được dùng $H$ phức.

4. **Nhầm dấu $\angle H$**: $\angle H = \arctan(\text{Im}/\text{Re})$, nhưng phải chú ý **góc phần tư** của số phức. Với $H = 1 - 2j$: $\angle H = \arctan(-2/1) = -\arctan 2$ (góc phần tư thứ 4, âm). Đừng viết $+\arctan 2$.

5. **Nhầm $e^{-j\Omega}$ với $e^{+j\Omega}$**: Khi tính $H(\Omega)$ từ phương trình sai phân, $y[n-k] \to e^{-jk\Omega}$ (dấu trừ). Nhưng khi áp dụng công thức $\cos$, $H(\Omega_0)$ là giá trị cụ thể — dấu phụ thuộc vào biểu thức ban đầu.

6. **Quên kiểm tra kết quả bằng trực giác**: $H(0)$ phải là số thực (vì hệ số thực) — nếu bạn tính ra phức, có lỗi. Với $\omega$ lớn, $H \to 0$ hoặc hằng số tùy bậc tử/mẫu.

[BOX: analogy] **Mẹo kiểm tra nhanh**: Sau khi tính $y(t)$, hãy kiểm tra:
- Nếu $x = 1$ (hằng số), thì $y$ phải là hằng số $H(0)$.
- Nếu $x = \cos(\omega_0 t)$, thì $y$ phải cùng tần số $\omega_0$, biên độ $|H(\omega_0)|$ (có thể khác 1).
- Nếu $H$ có dạng $1/(\text{bậc } n)$ (như bộ lọc thông thấp), thì tần số cao bị làm yếu → biên độ $y$ ở tần số cao nhỏ hơn.

[H2] Bài tập Quiz 8 — Giải chi tiết 9 câu

[BRIDGE] Dưới đây là 9 câu quiz, giải từng bước. Tất cả đều thuộc 3 dạng bài đã học: cho $H$ + tín hiệu vào, cho $h$ + tín hiệu vào, hoặc suy ra từ phương trình.

---

[H3] Câu 1. $H(\Omega) = \frac{1}{1 - \frac{1}{2}e^{-j\Omega}}$, $y[n] = (1/2)^n(u[n]-u[n-1])$. Tìm $x[n]$.

[P] **Đề**: Tìm tín hiệu vào $x[n]$.

**Lời giải**

[STEPS]
1. **Rút gọn $y[n]$**: $u[n] - u[n-1] = \delta[n]$ (chỉ bằng 1 tại $n=0$). Vậy $y[n] = (1/2)^n \delta[n] = (1/2)^0 \delta[n] = \delta[n]$.
2. **DTFT của $y$**: $Y(\Omega) = 1$ (vì $\delta[n] \leftrightarrow 1$).
3. **Quan hệ**: $Y(\Omega) = H(\Omega)X(\Omega)$, nên $X(\Omega) = Y(\Omega)/H(\Omega) = 1 \cdot (1 - \frac{1}{2}e^{-j\Omega}) = 1 - \frac{1}{2}e^{-j\Omega}$.
4. **DTFT ngược**: $1 \leftrightarrow \delta[n]$; $-\frac{1}{2}e^{-j\Omega} \leftrightarrow -\frac{1}{2}\delta[n-1]$. Vậy:
$$x[n] = \delta[n] - \frac{1}{2}\delta[n-1]$$
[/STEPS]

[ANS] **Đáp án: $x[n] = \delta[n] - \frac{1}{2}\delta[n-1]$** — tùy chọn 1.

---

[H3] Câu 2. $H(\omega) = \frac{1}{1-j\omega}$, $x(t) = \sin(\pi t/2)$. Tìm $y(t)$.

[P] **Đề**: Tìm đáp ứng của hệ thống.

**Lời giải**

[STEPS]
1. **Tần số đầu vào**: $\omega_0 = \pi/2$.
2. **Tính $H(\pi/2)$**:
$$H(\pi/2) = \frac{1}{1 - j\pi/2} = \frac{1 + j\pi/2}{1 + \pi^2/4}$$
3. **Biên độ và pha**:
$$|H(\pi/2)| = \frac{1}{\sqrt{1 + \pi^2/4}}, \quad \angle H(\pi/2) = \arctan(\pi/2)$$
4. **Áp dụng công thức sin**: $y(t) = |H|\sin(\omega_0 t + \angle H)$:
$$y(t) = \frac{1}{\sqrt{1 + \pi^2/4}}\sin\left(\frac{\pi}{2}t + \arctan\frac{\pi}{2}\right)$$
5. **Khai triển sin cộng**:
$$\sin(\theta + \varphi) = \sin\theta\cos\varphi + \cos\theta\sin\varphi$$
Với $\varphi = \arctan(\pi/2)$: $\cos\varphi = \frac{1}{\sqrt{1+\pi^2/4}}$, $\sin\varphi = \frac{\pi/2}{\sqrt{1+\pi^2/4}}$.
6. **Thay vào**:
$$y(t) = \frac{1}{\sqrt{1+\pi^2/4}}\left[\sin\left(\frac{\pi t}{2}\right)\cdot\frac{1}{\sqrt{1+\pi^2/4}} + \cos\left(\frac{\pi t}{2}\right)\cdot\frac{\pi/2}{\sqrt{1+\pi^2/4}}\right]$$
$$= \frac{1}{1+\pi^2/4}\left[\sin\left(\frac{\pi t}{2}\right) + \frac{\pi}{2}\cos\left(\frac{\pi t}{2}\right)\right]$$
[/STEPS]

[ANS] **Đáp án: $y(t) = \dfrac{1}{1+\pi^2/4}\left[\sin(\pi t/2) + \frac{\pi}{2}\cos(\pi t/2)\right]$** — tùy chọn 1.

---

[H3] Câu 3. $H(\omega) = \frac{1}{1-j\omega}$, $x(t) = \cos(2t) + 1$. Tìm $y(t)$.

[P] **Đề**: Tìm đáp ứng.

**Lời giải**

[STEPS]
1. **Tách thành phần**:
   - Thành phần DC: $x_1 = 1$, tần số $\omega = 0$.
   - Thành phần cos: $x_2 = \cos(2t)$, tần số $\omega_0 = 2$.
2. **Xử lý DC**: $H(0) = 1/(1-0) = 1$. Vậy $y_1 = 1\cdot 1 = 1$.
3. **Xử lý cos tại $\omega_0 = 2$**:
$$H(2) = \frac{1}{1-2j} = \frac{1+2j}{1+4} = \frac{1+2j}{5}$$
$$|H(2)| = \frac{\sqrt{1+4}}{5} = \frac{\sqrt{5}}{5} = \frac{1}{\sqrt{5}}, \quad \angle H(2) = \arctan(2)$$
4. **Đáp ứng**:
$$y_2(t) = |H(2)|\cos(2t + \angle H(2)) = \frac{1}{\sqrt{5}}\left[\cos(2t)\cos(\arctan 2) - \sin(2t)\sin(\arctan 2)\right]$$
Với $\cos(\arctan 2) = 1/\sqrt{5}$, $\sin(\arctan 2) = 2/\sqrt{5}$:
$$y_2(t) = \frac{1}{\sqrt{5}}\left[\frac{\cos(2t)}{\sqrt{5}} - \frac{2\sin(2t)}{\sqrt{5}}\right] = \frac{1}{5}\left[\cos(2t) - 2\sin(2t)\right]$$
5. **Tổng hợp**: $y(t) = y_1 + y_2 = \frac{1}{5}[\cos(2t) - 2\sin(2t)] + 1$.
[/STEPS]

[ANS] **Đáp án: $y(t) = \dfrac{1}{5}[\cos(2t) - 2\sin(2t)] + 1$** — tùy chọn 1.

---

[H3] Câu 4. $H(\Omega) = \frac{1}{1 + \frac{1}{2}e^{-j\Omega}}$, $x[n] = \sin(\pi n/2) + 1$. Tìm $y[n]$.

[P] **Đề**: Tìm đáp ứng.

**Lời giải**

[STEPS]
1. **Tách thành phần**:
   - DC: $x_1 = 1$, tần số $\Omega = 0$.
   - Sin: $x_2 = \sin(\pi n/2)$, tần số $\Omega_0 = \pi/2$.
2. **DC**: $H(0) = 1/(1 + 1/2) = 1/(3/2) = 2/3$. $y_1 = 2/3$.
3. **Tại $\Omega_0 = \pi/2$**:
$$H(\pi/2) = \frac{1}{1 + \frac{1}{2}e^{-j\pi/2}} = \frac{1}{1 - j/2} = \frac{1 + j/2}{1 + 1/4} = \frac{1 + j/2}{5/4} = \frac{4}{5}(1 + j/2) = \frac{4}{5} + j\frac{2}{5}$$
$$|H| = \sqrt{\frac{16}{25} + \frac{4}{25}} = \sqrt{\frac{20}{25}} = \frac{2}{\sqrt{5}}, \quad \angle H = \arctan(1/2)$$
4. **Đáp ứng sin**:
$$y_2[n] = \frac{2}{\sqrt{5}}\sin\left(\frac{\pi n}{2} + \arctan\frac{1}{2}\right)$$
Khai triển: $\cos(\arctan 1/2) = 2/\sqrt{5}$, $\sin(\arctan 1/2) = 1/\sqrt{5}$.
$$y_2[n] = \frac{2}{\sqrt{5}}\left[\sin\left(\frac{\pi n}{2}\right)\cdot\frac{2}{\sqrt{5}} + \cos\left(\frac{\pi n}{2}\right)\cdot\frac{1}{\sqrt{5}}\right] = \frac{4}{5}\sin\left(\frac{\pi n}{2}\right) + \frac{2}{5}\cos\left(\frac{\pi n}{2}\right)$$
5. **Tổng**: $y[n] = \frac{4}{5}\sin(\pi n/2) + \frac{2}{5}\cos(\pi n/2) + \frac{2}{3}$.
[/STEPS]

[ANS] **Đáp án: $y[n] = \dfrac{4}{5}\sin(\pi n/2) + \dfrac{2}{5}\cos(\pi n/2) + \dfrac{2}{3}$** — tùy chọn 1.

---

[H3] Câu 5. $H(\Omega) = \frac{1}{1 + \frac{1}{2}e^{-j2\Omega}}$, $x[n] = \cos(\pi n/4) + 1$. Tìm $y[n]$.

[P] **Đề**: Tìm đáp ứng.

**Lời giải**

[STEPS]
1. **Tách thành phần**:
   - DC: $x_1 = 1$, $\Omega = 0$.
   - Cos: $x_2 = \cos(\pi n/4)$, $\Omega_0 = \pi/4$.
2. **DC**: $H(0) = 1/(1 + 1/2) = 2/3$. $y_1 = 2/3$.
3. **Tại $\Omega_0 = \pi/4$**:
$$H(\pi/4) = \frac{1}{1 + \frac{1}{2}e^{-j2\pi/4}} = \frac{1}{1 + \frac{1}{2}e^{-j\pi/2}} = \frac{1}{1 - j/2}$$
(Giống hệt câu 4!) Vậy $H = 4/5 + j2/5$, $|H| = 2/\sqrt{5}$, $\angle H = \arctan(1/2)$.
4. **Đáp ứng cos**:
$$y_2[n] = \frac{2}{\sqrt{5}}\cos\left(\frac{\pi n}{4} + \arctan\frac{1}{2}\right)$$
Khai triển: $\cos(\theta + \varphi) = \cos\theta\cos\varphi - \sin\theta\sin\varphi$.
$$y_2[n] = \frac{2}{\sqrt{5}}\left[\cos\left(\frac{\pi n}{4}\right)\cdot\frac{2}{\sqrt{5}} - \sin\left(\frac{\pi n}{4}\right)\cdot\frac{1}{\sqrt{5}}\right] = \frac{4}{5}\cos\left(\frac{\pi n}{4}\right) - \frac{2}{5}\sin\left(\frac{\pi n}{4}\right)$$
5. **Tổng**: $y[n] = \frac{4}{5}\cos(\pi n/4) - \frac{2}{5}\sin(\pi n/4) + \frac{2}{3}$.
[/STEPS]

[ANS] **Đáp án: $y[n] = \dfrac{4}{5}\cos(\pi n/4) - \dfrac{2}{5}\sin(\pi n/4) + \dfrac{2}{3}$** — tùy chọn 1.

---

[H3] Câu 6. $H(\Omega) = \frac{1}{1 - \frac{1}{2}e^{-j\Omega}}$, $x[n] = \delta[n] - 2\delta[n-1]$. Tìm $y[n]$.

[P] **Đề**: Tìm đáp ứng.

**Lời giải bằng cách giải phương trình sai phân (trực tiếp)**

[STEPS]
1. **Từ $H(\Omega)$ suy ra phương trình**: $H = Y/X = 1/(1 - \frac{1}{2}e^{-j\Omega})$, tức là $Y(1 - \frac{1}{2}e^{-j\Omega}) = X$, hay $y[n] - \frac{1}{2}y[n-1] = x[n]$.
2. **Giải đệ quy** với $x[n] = \delta[n] - 2\delta[n-1]$ và trạng thái nghỉ $y[-1] = 0$:
   - $n=0$: $y[0] = x[0] + \frac{1}{2}y[-1] = 1 + 0 = 1$.
   - $n=1$: $y[1] = x[1] + \frac{1}{2}y[0] = -2 + \frac{1}{2} = -\frac{3}{2}$.
   - $n=2$: $y[2] = x[2] + \frac{1}{2}y[1] = 0 + \frac{1}{2}(-\frac{3}{2}) = -\frac{3}{4}$.
   - $n=3$: $y[3] = 0 + \frac{1}{2}(-\frac{3}{4}) = -\frac{3}{8}$.
   - Với $n \geq 1$: $y[n] = -\frac{3}{2}\cdot(1/2)^{n-1} = -3(1/2)^n = -3\cdot 2^{-n}$.
3. **Kết quả**: $y[n] = \delta[n] - 3\cdot 2^{-n}u[n-1]$.
[/STEPS]

[ANS] **Đáp án: $y[n] = \delta[n] - 3(2^{-n})u[n-1]$** — tùy chọn 1.

---

[H3] Câu 7. $h[n] = 2^{-n}u[n]$, $x[n] = 3 + \cos(\pi n + \pi/3)$. Tìm $y[n]$.

[P] **Đề**: Tìm đáp ứng.

**Lời giải**

[STEPS]
1. **Tính $H(\Omega)$ từ $h$**:
$$H(\Omega) = \sum_{n=0}^{\infty}2^{-n}e^{-j\Omega n} = \frac{1}{1 - \frac{1}{2}e^{-j\Omega}}$$
2. **Tách thành phần**:
   - DC: $x_1 = 3$, $\Omega = 0$.
   - Cos: $x_2 = \cos(\pi n + \pi/3)$, $\Omega_0 = \pi$.
3. **DC**: $H(0) = 1/(1 - 1/2) = 2$. $y_1 = 3\cdot 2 = 6$.
4. **Tại $\Omega_0 = \pi$**:
$$H(\pi) = \frac{1}{1 - \frac{1}{2}e^{-j\pi}} = \frac{1}{1 + 1/2} = \frac{2}{3}$$
$|H(\pi)| = 2/3$, $\angle H(\pi) = 0$ (thực dương).
5. **Đáp ứng**: $y_2[n] = \frac{2}{3}\cos(\pi n + \pi/3 + 0) = \frac{2}{3}\cos(\pi n + \pi/3)$.
6. **Tổng**: $y[n] = 6 + \frac{2}{3}\cos(\pi n + \pi/3)$.
[/STEPS]

[ANS] **Đáp án: $y[n] = 6 + \dfrac{2}{3}\cos(\pi n + \pi/3)$** — tùy chọn 1.

---

[H3] Câu 8. $h(t) = e^{-t}u(t)$, $x(t) = \cos(2t)$. Tìm $y(t)$.

[P] **Đề**: Tìm đáp ứng.

**Lời giải**

[STEPS]
1. **Tính $H(\omega)$**:
$$H(\omega) = \frac{1}{1 + j\omega}$$
2. **Tại $\omega_0 = 2$**:
$$H(2) = \frac{1}{1 + 2j} = \frac{1 - 2j}{1 + 4} = \frac{1 - 2j}{5}$$
$$|H(2)| = \frac{\sqrt{1+4}}{5} = \frac{1}{\sqrt{5}}, \quad \angle H(2) = \arctan(-2) = -\arctan 2$$
3. **Đáp ứng**:
$$y(t) = \frac{1}{\sqrt{5}}\cos(2t - \arctan 2)$$
Khai triển: $\cos(\theta - \varphi) = \cos\theta\cos\varphi + \sin\theta\sin\varphi$, với $\cos(\arctan 2) = 1/\sqrt{5}$, $\sin(\arctan 2) = 2/\sqrt{5}$.
$$y(t) = \frac{1}{\sqrt{5}}\left[\frac{\cos(2t)}{\sqrt{5}} + \frac{2\sin(2t)}{\sqrt{5}}\right] = \frac{1}{5}[\cos(2t) + 2\sin(2t)]$$
[/STEPS]

[ANS] **Đáp án: $y(t) = \dfrac{1}{5}[\cos(2t) + 2\sin(2t)]$** — tùy chọn 1.

---

[H3] Câu 9. $H(\omega) = \frac{1}{2+j\omega}$, $x(t) = \cos(2t) + 1$. Tìm $y(t)$.

[P] **Đề**: Tìm đáp ứng.

**Lời giải**

[STEPS]
1. **Tách thành phần**:
   - DC: $x_1 = 1$, $\omega = 0$.
   - Cos: $x_2 = \cos(2t)$, $\omega_0 = 2$.
2. **DC**: $H(0) = 1/2$. $y_1 = 1/2$.
3. **Tại $\omega_0 = 2$**:
$$H(2) = \frac{1}{2 + 2j} = \frac{2 - 2j}{8} = \frac{1 - j}{4}$$
$$|H(2)| = \frac{\sqrt{2}}{4}, \quad \angle H(2) = \arctan(-1) = -\frac{\pi}{4}$$
4. **Đáp ứng**:
$$y_2(t) = \frac{\sqrt{2}}{4}\cos\left(2t - \frac{\pi}{4}\right)$$
Khai triển: $\cos(\theta - \pi/4) = \frac{\sqrt{2}}{2}(\cos\theta + \sin\theta)$.
$$y_2(t) = \frac{\sqrt{2}}{4}\cdot\frac{\sqrt{2}}{2}[\cos(2t) + \sin(2t)] = \frac{1}{4}[\cos(2t) + \sin(2t)]$$
5. **Tổng**: $y(t) = \frac{1}{4}[\cos(2t) + \sin(2t)] + \frac{1}{2} = \frac{1}{4}[\cos(2t) + \sin(2t) + 2]$.
[/STEPS]

[ANS] **Đáp án: $y(t) = \dfrac{1}{4}[\cos(2t) + \sin(2t) + 2]$** — tùy chọn 1.

[BOX] **Bảng tổng hợp 9 câu**:

| Câu | $H$ | $x$ | $y$ |

| 1 | $\frac{1}{1-\frac12 e^{-j\Omega}}$ | $y$ cho trước | $x = \delta[n] - \frac12\delta[n-1]$ |
| 2 | $\frac{1}{1-j\omega}$ | $\sin(\pi t/2)$ | $\frac{1}{1+\pi^2/4}[\sin(\pi t/2) + \frac{\pi}{2}\cos(\pi t/2)]$ |
| 3 | $\frac{1}{1-j\omega}$ | $\cos(2t)+1$ | $\frac{1}{5}[\cos(2t)-2\sin(2t)]+1$ |
| 4 | $\frac{1}{1+\frac12 e^{-j\Omega}}$ | $\sin(\pi n/2)+1$ | $\frac45\sin(\pi n/2)+\frac25\cos(\pi n/2)+\frac23$ |
| 5 | $\frac{1}{1+\frac12 e^{-j2\Omega}}$ | $\cos(\pi n/4)+1$ | $\frac45\cos(\pi n/4)-\frac25\sin(\pi n/4)+\frac23$ |
| 6 | $\frac{1}{1-\frac12 e^{-j\Omega}}$ | $\delta[n]-2\delta[n-1]$ | $\delta[n]-3(2^{-n})u[n-1]$ |
| 7 | $h=2^{-n}u[n]$ | $3+\cos(\pi n+\pi/3)$ | $6+\frac23\cos(\pi n+\pi/3)$ |
| 8 | $h=e^{-t}u(t)$ | $\cos(2t)$ | $\frac15[\cos(2t)+2\sin(2t)]$ |

[BOX: warn] **6 bẫy thi**:
1. **Không đổi tần số** — tần số giữ nguyên, chỉ đổi biên độ và pha.
2. **Xử lý riêng thành phần DC** với $\omega=0$ (hoặc $\Omega=0$).
3. **Dùng $|H|$** (không phải $H$) trong công thức cos/sin.
4. **Kiểm tra dấu $\angle H$** — chú ý góc phần tư.
5. **Nhớ hệ số $\frac{1}{2\pi}$** khi làm FT ngược (nếu cần).
6. **Kiểm tra $H(0)$ là số thực** — nếu phức, có lỗi.

[BOX] **Công thức cần nhớ**:
- **Eigenfunction**: $e^{j\omega_0 t} \to H(\omega_0)e^{j\omega_0 t}$.
- **Cos/sin**: $A\cos(\omega_0 t+\phi) \to A|H(\omega_0)|\cos(\omega_0 t+\phi+\angle H(\omega_0))$.
- **DC**: $A \to A\cdot H(0)$.
- **Từ phương trình vi phân**: $H(\omega) = \frac{\sum b_k(j\omega)^k}{\sum a_k(j\omega)^k}$.
- **Từ phương trình sai phân**: $H(\Omega) = \frac{\sum b_k e^{-jk\Omega}}{\sum a_k e^{-jk\Omega}}$.
- **Từ $h$**: $H = \mathcal{F}\{h\}$ (dùng bảng Bài 6).

[BOX: analogy] **Câu thần chú cuối bài**: *"Vào sin, ra sin — cùng tần số. Biên độ nhân $|H|$, pha cộng $\angle H$. Hằng số thì dùng $H(0)$. Muốn tìm $H$ từ phương trình: đạo hàm thành $j\omega$, trễ $k$ thành $e^{-jk\Omega}$. Và nhớ: hệ LTI không bao giờ đổi tần số!"*

# BÀI 9 (BẢN ĐẦY ĐỦ): ĐỒ THỊ PHỔ CỦA TÍN HIỆU

[SECTION: bai9-overview]

[H2] Bài 9. Đồ thị phổ của tín hiệu — Đọc và tái tạo tín hiệu từ phổ

---

## Phần A. Động cơ — Tại sao phải đọc đồ thị phổ?

[BRIDGE] Ở Bài 6 và 7, bạn đã biết cách tính $X(\omega)$ từ $x(t)$ và ngược lại bằng công thức tích phân. Nhưng trong thực tế kỹ thuật, người ta thường **không có công thức** — họ có **đồ thị phổ** (từ máy phân tích phổ, từ thiết kế bộ lọc, từ dữ liệu đo). Câu hỏi đặt ra: **từ đồ thị phổ, làm sao biết tín hiệu gốc là gì?** Đây chính là kỹ năng của bài này.

[P] **Ba lý do cốt lõi**:

1. **Đề thi hay cho dạng này**: Cho hình phổ biên độ và phổ pha, hỏi "tín hiệu $x(t)$ là gì?" — đây là dạng bài kiểm tra khả năng đọc đồ thị và hiểu ý nghĩa vật lý của phổ.

2. **Hiểu bản chất của phổ**: Khi bạn đọc được phổ, bạn hiểu được "tín hiệu này chứa tần số nào, mạnh yếu ra sao, lệch pha bao nhiêu". Đó là nền tảng để thiết kế bộ lọc, phân tích nhiễu, nén tín hiệu.

3. **Liên hệ với Bài 8**: Nếu bạn biết đáp ứng tần số $H(\omega)$ của hệ thống (Bài 8), và biết phổ của tín hiệu vào $X(\omega)$ (Bài 9), thì phổ đầu ra là $Y = X\cdot H$ — chỉ cần nhân biên độ và cộng pha. Đây là cách phân tích hệ thống nhanh nhất.

[BOX: analogy] **Ẩn dụ**: Đồ thị phổ giống như **bản nhạc** của một bài hát. Bản nhạc ghi rõ "nốt Đô ở quãng 4, kéo dài 2 phách, mạnh (forte)". Đồ thị phổ ghi rõ "tần số 200π có biên độ 3/4, pha 0; tần số 400π có biên độ 1, pha −π/4". Từ bản nhạc, người nhạc công có thể chơi lại bài hát; từ đồ thị phổ, kỹ sư có thể tái tạo tín hiệu.

## Phần B. Hai loại phổ và tính chất đối xứng

### B.1. Phổ biên độ và phổ pha

[P] Với tín hiệu $x(t)$ có biến đổi Fourier $X(\omega)$, viết dưới dạng cực:
$$X(\omega) = |X(\omega)|\,e^{j\angle X(\omega)}$$

- **Phổ biên độ** $|X(\omega)|$: đồ thị của độ lớn $X$ theo tần số $\omega$. Cho biết **tần số nào mạnh, tần số nào yếu**.
- **Phổ pha** $\angle X(\omega)$: đồ thị của góc pha theo tần số. Cho biết **mỗi tần số bị dịch pha bao nhiêu**.

[BOX: analogy] **Ẩn dụ**: Phổ biên độ giống như "âm lượng" của từng nốt trong hợp âm; phổ pha giống như "thời điểm bắt đầu" của từng nốt. Hai bản nhạc có cùng âm lượng nhưng khác thời điểm bắt đầu sẽ nghe khác nhau — tương tự, hai tín hiệu có cùng phổ biên độ nhưng khác phổ pha sẽ có dạng sóng khác nhau.

### B.2. Tính chất đối xứng — Cực kỳ quan trọng

[P] Với tín hiệu **thực** $x(t)$ (đây là trường hợp phổ biến trong đề thi), phổ Fourier có **đối xứng liên hợp**:
[FORMULA: key]
$$X(-\omega) = X^*(\omega)$$
[/FORMULA]

[P] Hệ quả trực tiếp:
[FORMULA: key]
$$|X(-\omega)| = |X(\omega)| \quad \text{(phổ biên độ chẵn)}$$
$$\angle X(-\omega) = -\angle X(\omega) \quad \text{(phổ pha lẻ)}$$
[/FORMULA]
[FIG: 9.1] Ví dụ phổ biên độ và phổ pha điển hình trong đề thi. Phổ biên độ **chẵn**, phổ pha **lẻ** — tính chất của tín hiệu thực.

[BOX: warn] **Tại sao phải biết tính chất này?** Vì trong đồ thị phổ, người ta thường vẽ cả hai phía $\omega > 0$ và $\omega < 0$. Nếu bạn biết phổ pha ở phía âm, bạn suy ra phổ pha ở phía dương (và ngược lại) nhờ tính lẻ. Đây là chìa khóa để đọc đồ thị phổ pha khi đề chỉ vẽ một số vạch.

[P] **Ví dụ kiểm tra**: Nếu đề cho $\angle X(-400\pi) = \pi/4$, thì $\angle X(400\pi) = -\pi/4$. Nếu đề cho $\angle X(200\pi) = \pi/4$, thì $\angle X(-200\pi) = -\pi/4$.

## Phần C. Công thức tái tạo tín hiệu từ phổ

### C.1. Công thức then chốt

[P] Với tín hiệu thực có phổ vạch (rời rạc) tại các tần số $0, \pm\omega_1, \pm\omega_2, \ldots$:
[FORMULA: key]
$$x(t) = |X(0)|\cos(\angle X(0)) + \sum_{k} 2\,|X(\omega_k)|\cos(\omega_k t + \angle X(\omega_k))$$
[/FORMULA]

[P] Trong đó:
- **Số hạng DC**: $|X(0)|\cos(\angle X(0))$ — đóng góp của tần số 0 (hằng số).
- **Số hạng tần số $\omega_k$**: $2|X(\omega_k)|\cos(\omega_k t + \angle X(\omega_k))$ — đóng góp của cặp $\pm\omega_k$, với $\omega_k > 0$.

[BOX: warn] **Hệ số 2 — điểm dễ nhầm nhất**: Tại sao lại nhân 2? Vì phổ có **hai vạch** ở $+\omega_k$ và $-\omega_k$, mỗi vạch đóng góp $|X(\omega_k)|\cos(\omega_k t + \angle X(\omega_k))$, tổng là $2|X|\cos$. Nếu bạn quên nhân 2, đáp án sẽ sai gấp đôi biên độ.

### C.2. Tại sao lại có công thức này? — Giải thích từ gốc

[P] Xuất phát từ FT ngược:
$$x(t) = \frac{1}{2\pi}\int_{-\infty}^{\infty}X(\omega)e^{j\omega t}d\omega$$

[P] Với phổ vạch $X(\omega) = \sum_k A_k \delta(\omega - \omega_k)$ (bao gồm cả $\omega_k$ âm và dương):
$$x(t) = \frac{1}{2\pi}\sum_k A_k e^{j\omega_k t}$$

[P] Với tín hiệu thực, $A_{-k} = A_k^*$. Nhóm cặp $\pm\omega_k$:
$$A_k e^{j\omega_k t} + A_k^* e^{-j\omega_k t} = 2\,\text{Re}(A_k e^{j\omega_k t}) = 2|A_k|\cos(\omega_k t + \angle A_k)$$

[P] Vậy $x(t) = \frac{1}{2\pi}\left[A_0 + 2\sum_{k>0}|A_k|\cos(\omega_k t + \angle A_k)\right]$.

[P] Nếu **quy ước** $|X(\omega_k)| = \frac{|A_k|}{2\pi}$ (tức là phổ được vẽ với giá trị đã chia cho $2\pi$ — đây là quy ước phổ biến trong đề thi), ta được công thức ở trên. **Nếu đề vẽ phổ với quy ước khác, cần điều chỉnh cho phù hợp** — nhưng trong hầu hết đề thi, công thức trên là đúng.

[BOX: analogy] **Cách nhớ**: Mỗi **cặp vạch đối xứng** $\pm\omega_k$ trong phổ tương ứng với **một làn sóng cos** trong miền thời gian. Biên độ làn sóng = $2\times$ biên độ vạch (vì có hai vạch cộng lại). Pha làn sóng = pha của vạch dương.
[FIG: 9.2] Mỗi cặp vạch đối xứng $\pm\omega_k$ trong phổ tương ứng với một làn sóng cos trong miền thời gian. Biên độ cos = $2|X(\omega_k)|$ (vì có hai vạch cộng lại).

### C.3. Quy trình đọc đồ thị phổ — 4 bước

[STEPS]
1. **Bước 1 — Đọc phổ biên độ**: Liệt kê các tần số có vạch, ghi biên độ $|X|$ tại mỗi tần số. Đừng bỏ sót vạch ở $\omega = 0$ (DC).
2. **Bước 2 — Đọc phổ pha**: Ghi pha $\angle X$ tại mỗi tần số. **Chú ý**: dùng pha ở **tần số dương** ($\omega > 0$). Nếu đề chỉ vẽ pha ở tần số âm, dùng tính lẻ để suy ra pha ở tần số dương: $\angle X(\omega) = -\angle X(-\omega)$.
3. **Bước 3 — Áp dụng công thức**: 
   - DC: $|X(0)|\cos(\angle X(0))$.
   - Mỗi $\omega_k > 0$: $2|X(\omega_k)|\cos(\omega_k t + \angle X(\omega_k))$.
4. **Bước 4 — Cộng và rút gọn**: Thu gọn về dạng $A + B\cos(\omega_1 t + \phi_1) + C\cos(\omega_2 t + \phi_2) + \ldots$
[/STEPS]

## Phần D. Các bẫy thi

[BOX: warn] **6 bẫy phổ biến**:

1. **Quên nhân 2**: Mỗi cặp $\pm\omega_k$ đóng góp $2|X|\cos$, không phải $|X|\cos$. Đây là lỗi phổ biến nhất.

2. **Quên số hạng DC**: Nếu phổ có vạch ở $\omega = 0$ (tần số không), đó là đóng góp hằng số. Đừng bỏ qua.

3. **Nhầm pha ở tần số âm và dương**: Công thức dùng $\angle X(\omega_k)$ với $\omega_k > 0$. Nếu đề chỉ vẽ pha ở phía âm (như $-\pi/4$ tại $-200\pi$), phải suy ra pha ở phía dương là $+\pi/4$ tại $200\pi$ (tính lẻ).

4. **Nhầm dấu pha**: $\angle X$ thường nằm trong $[-\pi, \pi]$. Nếu góc phần tư không rõ, kiểm tra: $\angle X(-\omega) = -\angle X(\omega)$. Nếu đề cho $\angle X(-400\pi) = \pi/4$, thì $\angle X(400\pi) = -\pi/4$ — **dấu đảo ngược**.

5. **Nhầm đơn vị tần số**: Đề có thể cho $\omega$ theo rad/s (như $200\pi$) hoặc theo Hz (như $100$). Công thức dùng $\omega$ (rad/s). Nếu đề cho Hz, nhân với $2\pi$ để chuyển.

6. **Nhầm $|X|$ là biên độ của cos**: $|X|$ là biên độ trong phổ Fourier, còn biên độ của cos trong miền thời gian là $2|X|$. Đừng nhầm hai cái.

[BOX: analogy] **Mẹo kiểm tra nhanh**: Sau khi có $x(t)$, kiểm tra 2 điều:
- Nếu phổ có vạch ở $\omega = 0$ với biên độ $|X(0)|$ và pha $\angle X(0)$, thì $x(t)$ phải có hằng số $|X(0)|\cos(\angle X(0))$. Không có số hạng này nghĩa là tính toán sai.
- Nếu phổ không có vạch ở $\omega = 0$, thì $x(t)$ không có hằng số (trung bình bằng 0).

[H2] Bài tập Quiz 9 — Giải chi tiết 9 câu

[BRIDGE] Quiz 9 có 9 câu, đều thuộc dạng "cho phổ biên độ và phổ pha, tìm $x(t)$". Tất cả đều có **cùng cấu trúc**: phổ biên độ có 3 vạch (tại $\omega = 0$, $\pm200\pi$, $\pm400\pi$), chỉ khác nhau ở **giá trị biên độ** và **pha**. Giải chi tiết từng câu theo 4 bước ở trên.

**Cấu trúc chung của 9 câu**:
- Phổ biên độ: vạch tại $\omega = 0$ (biên độ $a_0$), $\omega = \pm200\pi$ (biên độ $a_1$), $\omega = \pm400\pi$ (biên độ $a_2$). Giá trị $a_0, a_1, a_2$ thay đổi theo từng câu.
- Phổ pha: vạch tại các tần số trên, giá trị pha thay đổi.
- Tín hiệu có dạng: $x(t) = A + B\cos(200\pi t + \phi_1) + C\cos(400\pi t + \phi_2)$.

---

[H3] Câu 1. Biên độ: $|X(0)|=1$, $|X(\pm200\pi)|=3/4$, $|X(\pm400\pi)|=1$. Pha: $\angle X(0)=\pi$, $\angle X(\pm200\pi)=0$, $\angle X(-400\pi)=\pi/4$, $\angle X(400\pi)=-\pi/4$.

**Lời giải**

[STEPS]
1. **Đọc phổ**:
   - DC: $|X(0)| = 1$, $\angle X(0) = \pi$.
   - Tần số $200\pi$: $|X(200\pi)| = 3/4$, $\angle X(200\pi) = 0$.
   - Tần số $400\pi$: $|X(400\pi)| = 1$, $\angle X(400\pi) = -\pi/4$ (dùng pha ở tần số dương).
2. **Áp dụng công thức**:
   - DC: $1\cdot\cos(\pi) = -1$.
   - $200\pi$: $2\cdot(3/4)\cos(200\pi t + 0) = (3/2)\cos(200\pi t)$.
   - $400\pi$: $2\cdot1\cdot\cos(400\pi t - \pi/4) = 2\cos(400\pi t - \pi/4)$.
3. **Cộng**:
$$x(t) = -1 + \frac{3}{2}\cos(200\pi t) + 2\cos(400\pi t - \pi/4)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = -1 + 2\cos(400\pi t - \pi/4) + \frac{3}{2}\cos(200\pi t)$** — tùy chọn 1.

---

[H3] Câu 2. Biên độ: $|X(0)|=1$, $|X(\pm200\pi)|=3/4$, $|X(\pm400\pi)|=1$. Pha: $\angle X(0)=0$, $\angle X(-200\pi)=-\pi/4$, $\angle X(200\pi)=\pi/4$, $\angle X(-400\pi)=\pi/4$, $\angle X(400\pi)=-\pi/4$.

**Lời giải**

[STEPS]
1. **Đọc phổ** (chú ý tính lẻ để xác định pha ở tần số dương):
   - DC: $|X(0)| = 1$, $\angle X(0) = 0$ (không có vạch pha ở $\omega=0$).
   - $200\pi$: $|X| = 3/4$, $\angle X(200\pi) = \pi/4$.
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = -\pi/4$.
2. **Áp dụng**:
   - DC: $1\cdot\cos(0) = 1$.
   - $200\pi$: $2\cdot(3/4)\cos(200\pi t + \pi/4) = (3/2)\cos(200\pi t + \pi/4)$.
   - $400\pi$: $2\cdot1\cdot\cos(400\pi t - \pi/4) = 2\cos(400\pi t - \pi/4)$.
3. **Cộng**:
$$x(t) = 1 + \frac{3}{2}\cos(200\pi t + \pi/4) + 2\cos(400\pi t - \pi/4)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = 1 + 2\cos(400\pi t - \pi/4) + \frac{3}{2}\cos(200\pi t + \pi/4)$** — tùy chọn 1.

---

[H3] Câu 3. Biên độ: $|X(0)|=1$, $|X(\pm200\pi)|=3/4$, $|X(\pm400\pi)|=1$. Pha: $\angle X(0)=0$, $\angle X(-200\pi)=-\pi/4$, $\angle X(200\pi)=\pi/4$, $\angle X(\pm400\pi)=0$.

**Lời giải**

[STEPS]
1. **Đọc phổ**:
   - DC: $|X(0)| = 1$, $\angle X(0) = 0$.
   - $200\pi$: $|X| = 3/4$, $\angle X(200\pi) = \pi/4$.
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = 0$.
2. **Áp dụng**:
   - DC: $1$.
   - $200\pi$: $(3/2)\cos(200\pi t + \pi/4)$.
   - $400\pi$: $2\cos(400\pi t)$.
3. **Cộng**:
$$x(t) = 1 + \frac{3}{2}\cos(200\pi t + \pi/4) + 2\cos(400\pi t)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = 1 + 2\cos(400\pi t) + \frac{3}{2}\cos(200\pi t + \pi/4)$** — tùy chọn 1.

[H3] Câu 4. Biên độ: $|X(0)|=1$, $|X(\pm200\pi)|=3/4$, $|X(\pm400\pi)|=1$. Pha: $\angle X(0)=\pi$, $\angle X(-200\pi)=-\pi/4$, $\angle X(200\pi)=\pi/4$, $\angle X(\pm400\pi)=0$.

**Lời giải**

[STEPS]

   - DC: $|X| = 1$, $\angle X = \pi$.
   - $200\pi$: $|X| = 3/4$, $\angle X(200\pi) = \pi/4$.
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = 0$.
2. **Áp dụng**:
   - DC: $\cos(\pi) = -1$.
   - $200\pi$: $(3/2)\cos(200\pi t + \pi/4)$.
   - $400\pi$: $2\cos(400\pi t)$.
3. **Cộng**:
$$x(t) = -1 + \frac{3}{2}\cos(200\pi t + \pi/4) + 2\cos(400\pi t)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = -1 + 2\cos(400\pi t) + \frac{3}{2}\cos(200\pi t + \pi/4)$** — tùy chọn 1.

[H3] Câu 5. Biên độ: $|X(0)|=3/4$, $|X(\pm200\pi)|=1/2$, $|X(\pm400\pi)|=1$. Pha: $\angle X(0)=0$, $\angle X(-200\pi)=\pi/4$, $\angle X(200\pi)=-\pi/4$, $\angle X(\pm400\pi)=0$.

**Lời giải**

[STEPS]
1. **Đọc phổ** (chú ý biên độ khác câu 1-4):
   - DC: $|X| = 3/4$, $\angle X = 0$.
   - $200\pi$: $|X| = 1/2$, $\angle X(200\pi) = -\pi/4$.
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = 0$.
2. **Áp dụng**:
   - DC: $(3/4)\cos(0) = 3/4$.
   - $200\pi$: $2\cdot(1/2)\cos(200\pi t - \pi/4) = \cos(200\pi t - \pi/4)$.
   - $400\pi$: $2\cdot1\cdot\cos(400\pi t) = 2\cos(400\pi t)$.
3. **Cộng**:
$$x(t) = \frac{3}{4} + \cos(200\pi t - \pi/4) + 2\cos(400\pi t)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = \frac{3}{4} + 2\cos(400\pi t) + \cos(200\pi t - \pi/4)$** — tùy chọn 1.

---

[H3] Câu 6. Biên độ: $|X(0)|=3/4$, $|X(\pm200\pi)|=1/2$, $|X(\pm400\pi)|=1$. Pha: $\angle X(0)=0$, $\angle X(-200\pi)=\pi/4$, $\angle X(200\pi)=-\pi/4$, $\angle X(-400\pi)=-\pi/4$, $\angle X(400\pi)=\pi/4$.

**Lời giải**

[STEPS]
1. **Đọc phổ** (pha ở 400π khác câu 5):
   - DC: $|X| = 3/4$, $\angle X = 0$.
   - $200\pi$: $|X| = 1/2$, $\angle X(200\pi) = -\pi/4$.
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = \pi/4$ (vì $\angle X(-400\pi) = -\pi/4$).
2. **Áp dụng**:
   - DC: $3/4$.
   - $200\pi$: $\cos(200\pi t - \pi/4)$.
   - $400\pi$: $2\cos(400\pi t + \pi/4)$.
3. **Cộng**:
$$x(t) = \frac{3}{4} + \cos(200\pi t - \pi/4) + 2\cos(400\pi t + \pi/4)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = 2\cos(400\pi t + \pi/4) + \cos(200\pi t - \pi/4) + \frac{3}{4}$** — tùy chọn 1.

[H3] Câu 7. Biên độ: $|X(0)|=3/4$, $|X(\pm200\pi)|=1/2$, $|X(\pm400\pi)|=1$. Pha: $\angle X(0)=0$, $\angle X(\pm200\pi)=0$, $\angle X(-400\pi)=-\pi/4$, $\angle X(400\pi)=\pi/4$.

**Lời giải**

[STEPS]
1. **Đọc phổ**:
   - DC: $|X| = 3/4$, $\angle X = 0$.
   - $200\pi$: $|X| = 1/2$, $\angle X(200\pi) = 0$ (không có vạch pha).
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = \pi/4$.
2. **Áp dụng**:
   - DC: $3/4$.
   - $200\pi$: $2\cdot(1/2)\cos(200\pi t) = \cos(200\pi t)$.
   - $400\pi$: $2\cdot1\cdot\cos(400\pi t + \pi/4) = 2\cos(400\pi t + \pi/4)$.
3. **Cộng**:
$$x(t) = \frac{3}{4} + \cos(200\pi t) + 2\cos(400\pi t + \pi/4)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = 2\cos(400\pi t + \pi/4) + \cos(200\pi t) + \frac{3}{4}$** — tùy chọn 1.

[H3] Câu 8. Biên độ: $|X(0)|=0$, $|X(\pm200\pi)|=1/2$, $|X(\pm400\pi)|=1$. Pha: $\angle X(-400\pi)=-\pi/4$, $\angle X(400\pi)=\pi/4$, các tần số khác pha 0.

**Lời giải**

[STEPS]
1. **Đọc phổ** (chú ý **không có DC**):
   - DC: $|X(0)| = 0$ → không có số hạng hằng số.
   - $200\pi$: $|X| = 1/2$, $\angle X(200\pi) = 0$.
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = \pi/4$.
2. **Áp dụng**:
   - $200\pi$: $2\cdot(1/2)\cos(200\pi t) = \cos(200\pi t)$.
   - $400\pi$: $2\cdot1\cdot\cos(400\pi t + \pi/4) = 2\cos(400\pi t + \pi/4)$.
3. **Cộng**:
$$x(t) = \cos(200\pi t) + 2\cos(400\pi t + \pi/4)$$
[/STEPS]

[BOX: warn] **Lưu ý**: Vì $|X(0)| = 0$, tín hiệu có **trung bình bằng 0** — không có thành phần DC. Đây là điểm khác biệt so với các câu trước.

[ANS] **Đáp án: $x(t) = 2\cos(400\pi t + \pi/4) + \cos(200\pi t)$** — tùy chọn 1.

---

[H3] Câu 9. Biên độ: $|X(0)|=0$, $|X(\pm200\pi)|=1/2$, $|X(\pm400\pi)|=1$. Pha: $\angle X(-200\pi)=-\pi/4$, $\angle X(200\pi)=\pi/4$, $\angle X(-400\pi)=-\pi/4$, $\angle X(400\pi)=\pi/4$.

**Lời giải**

[STEPS]
1. **Đọc phổ**:
   - DC: $|X(0)| = 0$ → không có hằng số.
   - $200\pi$: $|X| = 1/2$, $\angle X(200\pi) = \pi/4$ (vì $\angle X(-200\pi) = -\pi/4$).
   - $400\pi$: $|X| = 1$, $\angle X(400\pi) = \pi/4$ (vì $\angle X(-400\pi) = -\pi/4$).
2. **Áp dụng**:
   - $200\pi$: $2\cdot(1/2)\cos(200\pi t + \pi/4) = \cos(200\pi t + \pi/4)$.
   - $400\pi$: $2\cdot1\cdot\cos(400\pi t + \pi/4) = 2\cos(400\pi t + \pi/4)$.
3. **Cộng**:
$$x(t) = \cos(200\pi t + \pi/4) + 2\cos(400\pi t + \pi/4)$$
[/STEPS]

[ANS] **Đáp án: $x(t) = 2\cos(400\pi t + \pi/4) + \cos(200\pi t + \pi/4)$** — tùy chọn 1 (nếu đề có dạng này). Nếu đề cho option $2\cos(400\pi t + \pi/4) + \cos(200\pi t - \pi/4)$, hãy kiểm tra lại pha ở $200\pi$: nếu $\angle X(-200\pi) = -\pi/4$ thì $\angle X(200\pi) = +\pi/4$, đáp án là $\cos(200\pi t + \pi/4)$. Nếu $\angle X(200\pi) = -\pi/4$ (không lẻ với $-\pi/4$), thì đáp án là $\cos(200\pi t - \pi/4)$ — nhưng trường hợp này **vi phạm tính lẻ** của tín hiệu thực, nên khó xảy ra.

[BOX: warn] **6 bẫy thi**:
1. **Quên nhân 2** — mỗi cặp $\pm\omega_k$ đóng góp $2|X|\cos$, không phải $|X|\cos$.
2. **Quên số hạng DC** — nếu $|X(0)|\neq 0$, phải thêm $|X(0)|\cos(\angle X(0))$.
3. **Nhầm pha ở tần số âm và dương** — dùng pha ở tần số **dương** trong công thức.
4. **Nhầm dấu pha** — nhớ $\angle X(-\omega) = -\angle X(\omega)$.
5. **Nhầm đơn vị tần số** — $\omega$ là rad/s, $f$ là Hz, $\omega = 2\pi f$.
6. **Nhầm $|X|$ với biên độ cos** — biên độ cos = $2|X|$.

[BOX] **Công thức cần nhớ**:
- **Tái tạo từ phổ vạch**: $x(t) = |X(0)|\cos(\angle X(0)) + \sum_{k} 2|X(\omega_k)|\cos(\omega_k t + \angle X(\omega_k))$.
- **Tính lẻ pha**: $\angle X(-\omega) = -\angle X(\omega)$.
- **Tính chẵn biên độ**: $|X(-\omega)| = |X(\omega)|$.
- **Hệ quả**: $\angle X(400\pi) = -\angle X(-400\pi)$. Nếu đề cho pha ở phía âm, đổi dấu để có pha ở phía dương.

[BOX: analogy] **Câu thần chú cuối bài**: *"Đọc phổ: biên độ nhân 2, pha giữ nguyên, DC thì không nhân 2. Pha ở tần số dương — nếu đề cho phía âm thì đổi dấu. Cộng tất cả các cos lại — đó là tín hiệu gốc. Và nhớ: phổ có vạch ở 0 thì tín hiệu có hằng số."*

        // Parse Raw Verbatim Content into Structured Lessons
        function parseCourseContent() {

            state.lessons = lessonChunks.map((chunk, idx) => {
                const meta = LESSON_META[idx] || {
                    id: idx + 1,

                };

                // Extract sections: [SECTION: baiX-overview], [SECTION: baiX-exercises], [SECTION: baiX-summary]
                const sectionRegex = /\[SECTION:\s*bai\d+-(overview|exercises|summary)\]/g;
                const sections = { overview: '', exercises: '', summary: '' };
                let match;
                const matches = [];

                while ((match = sectionRegex.exec(chunk)) !== null) {
                    matches.push({ type: match[1], startIndex: match.index, contentStart: sectionRegex.lastIndex });
                }

                for (let i = 0; i < matches.length; i++) {
                    const current = matches[i];
                    const end = (i + 1 < matches.length) ? matches[i + 1].startIndex : chunk.length;
                    sections[current.type] = chunk.slice(current.contentStart, end).trim();
                }

        // Convert custom DSL & Markdown into spacious semantic HTML while protecting LaTeX Math
        function compileSectionHTML(rawSectionText, sectionType, tocCollector) {
            if (!rawSectionText) return '';

            // 1. Protect LaTeX math expressions so markdown formatting never corrupts math symbols
            const mathStore = [];
            let text = rawSectionText;

            // Display math $$...$$
            text = text.replace(/\$\$([\s\S]*?)\$\$/g, (_, math) => {
                const id = mathStore.length;
                mathStore.push({ display: true, math: math.replace(/\\\|/g, '|') });
                return `@@MATH_${id}@@`;
            });

            // Inline math $...$
            text = text.replace(/\$([^$\n]+?)\$/g, (_, math) => {
                const id = mathStore.length;
                mathStore.push({ display: false, math: math.replace(/\\\|/g, '|') });
                return `@@MATH_${id}@@`;
            });

            // Remove explicit [TABLE] and [/TABLE] wrappers (markdown table parser handles the pipe rows)
            text = text.replace(/\[\/?TABLE\]/g, '');

            // 2. Process multi-line [FORMULA...] ... [/FORMULA]
            text = text.replace(/\[FORMULA(:\s*key)?\]([\s\S]*?)\[\/FORMULA\]/g, (_, k, inner) => {
                return `\n${k ? '@@BLOCK_KEY_START@@' : '@@BLOCK_FORMULA_START@@'}\n${inner.trim()}\n@@BLOCK_FORMULA_END@@\n`;
            });

            // 3. Process multi-line [STEPS] ... [/STEPS]
            text = text.replace(/\[STEPS\]([\s\S]*?)\[\/STEPS\]/g, (_, inner) => {
                return `\n@@BLOCK_STEPS_START@@\n${inner.trim()}\n@@BLOCK_STEPS_END@@\n`;

            const lines = text.split('\n');
            let html = '';
            let i = 0;
            let openCard = null; // 'part' | 'quiz'

            const closeQuizCardIfNeeded = () => {

            const formatInline = (str) => {
                let s = str.trim();

                // Italic *...*
                s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                // Inline code `...`

                    t.startsWith('[H3]') ||
                    t.startsWith('## ') ||
                    t.startsWith('### ') ||

                    t.startsWith('[BOX') ||
                    t.startsWith('[FIG') ||
                    t.startsWith('[BRIDGE]') ||

                    }

                            tableLines.push(chunkLines[j].trim());

                        html += `<figure style="--r:${ratio}">${svgStr}<figcaption>${formatInline(fm[2])}</figcaption></figure>`;

        function buildTableHTML(tableLines, formatInline) {
            if (tableLines.length === 0) return '';

                const cells = parseRow(tableLines[r]);
                out += `<tr>`;
                cells.forEach(c => {
                    out += `<td>${formatInline(c)}</td>`;
                });
                out += `</tr>`;
            }
            out += `</tbody></table></div>`;

                    s += tx(632, 62, 'A·|H(' + w0 + ')|', { s: 15, c: C2, w: 800 }) + tx(632, 86, 'cos(' + w0 + 't + φ + ∠H(' + w0 + '))', { s: 13.5, c: C2, w: 800 });
                    s += bd(172, 150, 165, 'Biên độ × |H|', C1) + bd(352, 150, 150, 'Pha + ∠H', C5);
                    s += tx(337, 214, 'tần số ' + w0 + ' giữ nguyên', { s: 15, c: C3, w: 800 });
                    return sv(760, 232, s);
                },

                // BÀI 8 — đáp ứng biên độ thông thấp
                '8.2': () => {
                    const X = w => 80 + 220 * w, Y = v => 235 - 160 * v;
                    const H = w => 1 / Math.sqrt(1 + Math.pow(w, 4));
                    let s = rc(80, 55, 220, 180, { f: C2, c: 'none' }).replace('style="', 'style="fill-opacity:.13;') + rc(300, 55, 420, 180, { f: C4, c: 'none' }).replace('style="', 'style="fill-opacity:.1;');
                    s += ax(70, 740, 235) + ay(80, 245, 45);
                    s += ln(X(1), 235, X(1), 52, { c: C5, d: '6 5', w: 2 }) + ln(80, Y(1 / Math.SQRT2), X(1), Y(1 / Math.SQRT2), { c: C3, d: '6 5', w: 2 });
                    s += pa(pts(sample(H, 0, 2.9, 200, X, Y)), { c: C1, w: 4 });
                    s += tx(70, Y(1) + 5, '1', { a: 'end', s: 15, c: MUT }) + tx(90, Y(1 / Math.SQRT2) - 8, '1/√2 ≈ −3 dB', { a: 'start', s: 14, c: C3, w: 800 });
                    s += tx(X(1), 258, sb('ω', 'c'), { s: 17, c: C5, w: 800 }) + tx(732, 256, 'ω', { a: 'end', i: 1, s: 15, c: MUT }) + tx(60, 54, '|H(ω)|', { a: 'end', s: 14, c: MUT });
                    s += tx(190, 44, 'dải thông', { s: 16, c: C2, w: 800 }) + tx(510, 44, 'dải chặn', { s: 16, c: C4, w: 800 });
                    return sv(760, 285, s);
                },

                // BÀI 9 — phổ biên độ và phổ pha
                '9.1': () => {
                    const X = k => 380 + 130 * k, lab = ['−400π', '−200π', '0', '200π', '400π'];
                    let s = tx(30, 30, '|X(ω)| — phổ biên độ (đối xứng chẵn)', { a: 'start', s: 17, c: C1, w: 800 });
                    s += ax(40, 745, 195) + ln(X(0), 55, X(0), 195, { c: C5, d: '5 5', op: .5 });
                    [[-2, 1, '1'], [-1, .75, '3/4'], [0, 1, '1'], [1, .75, '3/4'], [2, 1, '1']].forEach(a => {
                        const y = 195 - 120 * a[1];
                        s += ln(X(a[0]), 195, X(a[0]), y, { c: C1, w: 3.5 }) + ci(X(a[0]), y, 5.5, { f: C1, c: C1 }) + tx(X(a[0]) + 16, y - 6, a[2], { s: 16, c: C1, w: 800 });
                    });
                    for (let k = -2; k <= 2; k++) s += tx(X(k), 217, lab[k + 2], { s: 14, c: MUT });
                    s += tx(30, 262, '∠X(ω) — phổ pha (đối xứng lẻ)', { a: 'start', s: 17, c: C4, w: 800 });
                    s += ax(40, 745, 370) + ln(X(0), 285, X(0), 395, { c: C5, d: '5 5', op: .5 });
                    const P = 70 / Math.PI;
                    [[-2, Math.PI / 4, 'π/4'], [-1, 0, '0'], [0, Math.PI, 'π'], [1, 0, '0'], [2, -Math.PI / 4, '−π/4']].forEach(a => {
                        const y = 370 - P * a[1];
                        s += ln(X(a[0]), 370, X(a[0]), y, { c: C4, w: 3.5 }) + ci(X(a[0]), y, 5.5, { f: C4, c: C4 });
                        s += tx(X(a[0]) + 16, a[1] < 0 ? y + 5 : y - 8, a[2], { s: 16, c: C4, w: 800 });
                    });
                    for (let k = -2; k <= 2; k++) s += tx(X(k), 418 + (k === 2 ? 0 : 0), lab[k + 2], { s: 14, c: MUT });
                    s += tx(742, 190, 'ω', { a: 'end', i: 1, s: 15, c: MUT }) + tx(742, 365, 'ω', { a: 'end', i: 1, s: 15, c: MUT });
                    return sv(760, 435, s);
                },

                // BÀI 9 — một cặp vạch ↔ một làn sóng cos
                '9.2': () => {
                    const w1 = sb('ω', '1'), base = 150;
                    let s = tx(30, 26, 'Phổ: một cặp vạch đối xứng', { a: 'start', s: 17, c: C1, w: 800 });
                    s += ax(40, 745, base);
                    [-1, 1].forEach(k => {
                        const x = 380 + 150 * k, y = base - 90;
                        s += ln(x, base, x, y, { c: C1, w: 4 }) + ci(x, y, 6, { f: C1, c: C1 }) + tx(x + 20, y - 4, '3/4', { s: 16, c: C1, w: 800 });
                    });
                    s += ln(380, 108, 238, 108, { m: 'ar', c: C4 }) + ln(380, 108, 522, 108, { m: 'ar', c: C4 }) + tx(380, 98, 'cặp vạch đối xứng', { s: 15, c: C4, w: 800 });
                    s += tx(230, 174, '−' + w1, { s: 15, c: MUT }) + tx(380, 174, '0', { s: 15, c: MUT }) + tx(530, 174, w1, { s: 15, c: MUT });
                    s += ln(380, 192, 380, 232, { c: C5, w: 3.5, m: 'ar5' }) + tx(398, 218, 'tương ứng', { a: 'start', s: 15, c: C5, w: 800 });
                    s += tx(30, 262, 'Tín hiệu: một làn sóng cos', { a: 'start', s: 17, c: C2, w: 800 });
                    const X = u => 60 + u, Y = v => 365 - 53.3 * v;
                    s += ax(40, 745, 365) + ln(60, Y(1.5), 700, Y(1.5), { c: C3, d: '6 5' }) + ln(60, Y(-1.5), 700, Y(-1.5), { c: C3, d: '6 5' });
                    s += pa(pts(sample(u => 1.5 * Math.cos(2 * Math.PI * u / 130 + .6), 0, 640, 300, X, Y)), { c: C2, w: 3.5 });
                    s += tx(735, Y(1.5) - 6, 'biên độ = 2 · 3/4 = 3/2', { a: 'end', s: 14, c: C3, w: 800 });
                    s += tx(380, 480, '2|X(' + w1 + ')| cos(' + w1 + 't + ∠X(' + w1 + '))', { s: 17, c: C2, w: 800 });
                    return sv(760, 498, s);
                }
            };
        })();


        // ---------- UI ----------
        const $ = id => document.getElementById(id);
        const mb = $('mb'), mn = $('mn'), toc = $('toc');

        function openMenu(o) {
            mn.hidden = !o;
            mb.setAttribute('aria-expanded', o);
            if (o) {
                markActive();
                const a = toc.querySelector('a.on');
                if (a) mn.scrollTop = Math.max(0, a.offsetTop - mn.clientHeight / 3);
            }
        }

        function renderCurrentLesson() {
            const lesson = state.lessons[state.currentLessonIndex];
            if (!lesson) return;

            $('lesson-chip').textContent = `Bài ${lesson.number}/${state.lessons.length}`;
            $('lesson-title').textContent = lesson.shortTitle;
            document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.filter === state.sectionFilter));

            state.tocItems = [];
            state.cardN = 0;
            const keys = state.sectionFilter === 'all' ? ['overview', 'exercises', 'summary'] : [state.sectionFilter];
            let html = '';
            keys.forEach(k => {
                if (lesson.sections[k]) {
                    html += `<div class="lesson-sec" data-section="${k}">${compileSectionHTML(lesson.sections[k], k, state.tocItems)}</div>`;
                }
            });
            const container = $('lesson-container');
            container.innerHTML = html;

            const prev = state.lessons[state.currentLessonIndex - 1];
            const next = state.lessons[state.currentLessonIndex + 1];
            const pb = $('btn-prev'), nb = $('btn-next');
            pb.disabled = !prev;
            pb.textContent = prev ? `← Bài ${prev.number}: ${prev.shortTitle}` : '';
            nb.disabled = !next;
            nb.textContent = next ? `Bài ${next.number}: ${next.shortTitle} →` : '';

            $('ls').innerHTML = state.lessons.map((l, i) =>
                `<button type="button" data-i="${i}" title="${l.shortTitle}" aria-label="Bài ${l.number}: ${l.shortTitle}" class="${i === state.currentLessonIndex ? 'on' : ''}">${l.number}</button>`
            ).join('');
            renderTOCList();

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]).catch(() => {});
            }
        }

        function renderTOCList() {
            toc.innerHTML = state.tocItems.map(it => {
                const cls = it.level === 1 ? 'l1' : it.level === 3 ? 'sub' : '';
                return `<a href="#${it.id}" class="${cls}">${it.title.replace(/\*\*/g, '').replace(/`/g, '')}</a>`;
            }).join('');
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([toc]).catch(() => {});
            }
            markActive();
        }

        let ticking = false;
        function markActive() {
            ticking = false;
            if (mn.hidden) return;
            let cur = null;
            toc.querySelectorAll('a').forEach(a => {
                const t = document.getElementById(a.getAttribute('href').slice(1));
                a.classList.remove('on');
                if (t && t.getBoundingClientRect().top <= 120) cur = a;
            });
            if (cur) cur.classList.add('on');
        }

        function selectLesson(i) {
            state.currentLessonIndex = i;
            state.sectionFilter = 'all';
            renderCurrentLesson();
            window.scrollTo({ top: 0 });
        }

        mb.onclick = () => openMenu(mn.hidden);
        mn.addEventListener('click', e => {
            const b = e.target.closest('#ls button');
            if (b) { selectLesson(+b.dataset.i); return; }
            if (e.target.closest('#toc a')) openMenu(false);
        });
        $('tabs').addEventListener('click', e => {
            const b = e.target.closest('.tab');
            if (!b) return;
            state.sectionFilter = b.dataset.filter;
            renderCurrentLesson();
        });
        $('btn-prev').onclick = () => selectLesson(state.currentLessonIndex - 1);
        $('btn-next').onclick = () => selectLesson(state.currentLessonIndex + 1);

        document.addEventListener('click', e => {
            if (!mn.hidden && !mn.contains(e.target) && !mb.contains(e.target)) openMenu(false);
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') openMenu(false);
            else if ((e.key === 'm' || e.key === 'M') && true) openMenu(mn.hidden);
        });
        addEventListener('scroll', () => {
            if (!ticking && !mn.hidden) { ticking = true; requestAnimationFrame(markActive); }
        }, { passive: true });

        window.addEventListener('DOMContentLoaded', () => {
            parseCourseContent();
            renderCurrentLesson();
        });
    </script>
</body>
</html>
